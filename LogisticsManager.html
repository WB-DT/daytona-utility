    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155; 
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8; 
            --text-accent: #fbbf24; --border: #334155; --danger: #ef4444; 
            --success: #10b981; --base-font: 13px;
        }
        [data-theme='light'] { 
            --bg-deep: #f8fafc; --bg-surface: #ffffff; --bg-card: #f1f5f9; 
            --brand: #0d9488; --text-main: #0f172a; --text-dim: #475569; 
            --text-accent: #b45309; --border: #e2e8f0; --danger: #dc2626; --success: #059669; 
        }
        
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; font-size: var(--base-font); height: 100vh; overflow: hidden; margin: 0; transition: all 0.2s; }
        
        /* Layout Structure */
        #main-layout { display: flex; height: calc(100vh - 120px); width: 100%; overflow: hidden; position: relative; }
        
        /* Gallery (Left Sidebar) */
        aside#main-gallery { 
            width: 320px; min-width: 320px; border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; background: var(--bg-surface);
            transition: width 0.3s ease;
        }
        
        /* Main Workspace */
        main#workspace { flex-grow: 1; overflow-y: auto; background: var(--bg-deep); position: relative; display: flex; flex-direction: column; }

        /* Kanban Column Scroll */
        .kanban-board { display: flex; height: 100%; overflow-x: auto; padding: 1rem; gap: 1rem; }
        .kanban-col { flex: 0 0 280px; background: rgba(0,0,0,0.15); border-radius: 12px; display: flex; flex-direction: column; border: 1px solid var(--border); }
        .kanban-body { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }

        /* Table Engine */
        .table-container { height: 100%; overflow: auto; }
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85em; }
        .data-table th { 
            background: var(--bg-surface); position: sticky; top: 0; z-index: 20; 
            padding: 12px; text-align: left; border-bottom: 2px solid var(--border); 
            cursor: move; white-space: nowrap; font-weight: 800; text-transform: uppercase;
        }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .data-table tr:hover td { background: var(--bg-card); cursor: pointer; }

        /* Scorecards */
        .rep-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
        .prog-bg { height: 6px; background: var(--bg-deep); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .prog-fill { height: 100%; transition: width 1s ease-in-out; }

        /* Detail Form Variations */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .form-compact { font-size: 11px; }
        .form-compact input, .form-compact select { height: 30px !important; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 600px; border-radius: 12px; overflow: hidden; }
        .outlook-editor { min-height: 200px; background: var(--bg-card); padding: 1rem; border-radius: 8px; outline: none; border: 1px solid var(--border); color: var(--text-main); }

        /* UI Components */
        .nav-btn { display: flex; flex-direction: column; align-items: center; padding: 8px 12px; border-radius: 8px; font-size: 9px; font-weight: 900; color: var(--text-dim); transition: 0.2s; border: 1px solid transparent; }
        .nav-btn.active { color: var(--brand); background: rgba(45, 212, 191, 0.1); border-color: var(--brand); }
        .input-dark { background: var(--bg-deep); border: 1px solid var(--border); color: var(--text-main); padding: 0.6rem; border-radius: 6px; outline: none; width: 100%; }
        .input-dark:focus { border-color: var(--brand); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>

    <script id="worker-script" type="javascript/worker">
        const ZIP_MAP = {'010':[42.2,-72.6],'020':[42.1,-71.2],'070':[40.8,-74.2],'100':[40.7,-74.0],'190':[40.0,-75.3],'300':[33.9,-84.4],'330':[25.8,-80.2],'600':[42.1,-87.9],'900':[34.0,-118.2]};

        self.onmessage = function(e) {
            const { type, payload } = e.data;
            
            if(type === 'PROCESS') {
                const raw = payload.data || [];
                const db = raw.map(r => ({
                    id: r.cr714_id || Math.random().toString(36).substr(2,6).toUpperCase(),
                    guid: (r.cr714_logisticslog_2id || '').replace(/[{}]/g,''),
                    so: r.cr714_salesordernumber || 'N/A',
                    customer: r.cr714_companyordeliveryname || 'Unknown',
                    whs: r.cr714_warehouse || 'N/A',
                    status: r.cr714_disposition || 'Pending',
                    owner: r.cr714_logisticsowner || 'Unassigned',
                    issue: r.cr714_issue || 'Standard',
                    notes: r.cr714_logisticsnotes || '',
                    driver: r.cr714_drivernamenumber || '',
                    whsNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    date: r.createdon ? r.createdon.split('T')[0] : new Date().toISOString().split('T')[0],
                    zip3: (r.cr714_shippingaddress?.match(/\b\d{3}/)||['000'])[0]
                }));

                const filters = {
                    whs: [...new Set(db.map(x => x.whs))].sort(),
                    owners: [...new Set(db.map(x => x.owner))].sort(),
                    statuses: [...new Set(db.map(x => x.status))].sort()
                };

                self.postMessage({ type: 'READY', db, filters });
            }

            if(type === 'FILTER') {
                const { db, criteria } = payload;
                const filtered = db.filter(item => {
                    const searchStr = [item.so, item.customer, item.owner, item.whs, item.driver].join(' ').toLowerCase();
                    const matchesSearch = !criteria.search || searchStr.includes(criteria.search.toLowerCase());
                    const matchesWhs = !criteria.whs || item.whs === criteria.whs;
                    const matchesStatus = !criteria.status || item.status === criteria.status;
                    return matchesSearch && matchesWhs && matchesStatus;
                });

                // Warehouse Aggr for Map Bubbles
                const whStats = {};
                filtered.forEach(item => { whStats[item.whs] = (whStats[item.whs] || 0) + 1; });

                const mapPoints = Object.keys(whStats).map(wh => {
                    const sample = filtered.find(x => x.whs === wh);
                    const coords = ZIP_MAP[sample?.zip3] || [40 + Math.random(), -74 + Math.random()];
                    return { wh, count: whStats[wh], lat: coords[0], lng: coords[1] };
                });

                self.postMessage({ type: 'FILTERED_RESULT', filtered, whStats, mapPoints });
            }
        };
    </script>

    <script>
        // CONFIG
        const MSAL_CONFIG = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401" } };
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';
        const SAVE_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY';

        let fullDb = [], filteredDb = [], currentView = 'assign', selectedId = null;
        let mapInstance = null, markerGroup = null, chartInstances = {};
        const msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);

        const worker = new Worker(URL.createObjectURL(new Blob([document.getElementById('worker-script').textContent], { type: "text/javascript" })));

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            flatpickr("#f-date", { mode: "range", theme: "dark", onChange: applyFilters });
        });

        async function initApp() {
            try {
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length === 0) {
                    document.getElementById('login-screen').classList.remove('hidden');
                } else {
                    applyIdentity(accounts[0]);
                    syncData();
                }
            } catch(e) {}
        }

        function login() { msalInstance.loginPopup({ scopes: ["User.Read", "Mail.Send"] }).then(resp => { applyIdentity(resp.account); syncData(); }); }

        function applyIdentity(acc) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('user-display').classList.remove('hidden');
            document.getElementById('user-name').innerText = acc.name;
        }

        async function syncData() {
            try {
                const res = await fetch(HISTORY_URL, { method: 'POST' });
                const data = await res.json();
                worker.postMessage({ type: 'PROCESS', payload: { data: data.value || [] } });
            } catch(e) {
                Toastify({ text: "Sync Failed", style: { background: "#ef4444" } }).showToast();
            }
        }

        worker.onmessage = (e) => {
            const { type, db, filters, filtered, mapPoints, whStats } = e.data;
            if (type === 'READY') {
                fullDb = db;
                populateDropdowns(filters);
                applyFilters();
            }
            if (type === 'FILTERED_RESULT') {
                filteredDb = filtered;
                document.getElementById('active-count').innerText = filtered.length;
                renderGallery();
                renderView();
                updateDashboard(filtered, whStats);
                if (mapInstance) updateMapMarkers(mapPoints);
            }
        };

        function populateDropdowns(f) {
            const wh = document.getElementById('f-wh');
            const st = document.getElementById('f-status');
            const own = document.getElementById('m-owner');
            f.whs.forEach(w => wh.add(new Option(w, w)));
            f.statuses.forEach(s => st.add(new Option(s, s)));
            f.owners.forEach(o => own.add(new Option(o, o)));
        }

        function switchView(v) {
            currentView = v;
            document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${v}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-${v}`).classList.add('active');
            if (v === 'map') setTimeout(initMap, 200);
            renderView();
        }

        function renderGallery() {
            const container = document.getElementById('ticket-list');
            container.innerHTML = filteredDb.map(item => `
                <div class="p-3 bg-[var(--bg-card)] rounded-lg border-l-4 border-transparent hover:border-[var(--brand)] cursor-pointer transition ${selectedId === item.id ? 'border-l-[var(--brand)] bg-black/20' : ''}" onclick="openDetail('${item.id}')">
                    <div class="flex justify-between items-center text-[8px] font-black opacity-40 uppercase mb-1">
                        <span>#${item.id}</span>
                        <span>${item.whs}</span>
                    </div>
                    <div class="text-[10px] font-extrabold uppercase truncate text-white">${item.customer}</div>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-[9px] font-mono text-[var(--brand)] font-bold">#${item.so}</span>
                        <span class="text-[8px] font-black px-1.5 rounded bg-black/20">${item.status}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderView() {
            const container = document.getElementById(`view-${currentView}`);
            if (currentView === 'records' || currentView === 'assign') {
                container.innerHTML = `
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th style="width: 40px"><input type="checkbox"></th>
                                    <th>Sales Order</th>
                                    <th>Customer</th>
                                    <th>Warehouse</th>
                                    <th>Logistics Owner</th>
                                    <th>Status</th>
                                    <th>Issue</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${filteredDb.map(item => `
                                    <tr onclick="openDetail('${item.id}')" class="${selectedId === item.id ? 'bg-[var(--bg-card)]' : ''}">
                                        <td><input type="checkbox" onclick="event.stopPropagation()"></td>
                                        <td class="font-mono text-[var(--brand)] font-bold">#${item.so}</td>
                                        <td class="font-black uppercase text-[10px]">${item.customer}</td>
                                        <td><span class="px-2 py-0.5 border border-[var(--brand)] text-[var(--brand)] rounded text-[8px] font-black">${item.whs}</span></td>
                                        <td class="text-xs opacity-60">${item.owner}</td>
                                        <td class="font-black uppercase text-[9px] ${getStatusStyle(item.status)}">${item.status}</td>
                                        <td class="text-[10px] opacity-50 uppercase font-bold">${item.issue}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (currentView === 'kanban') {
                renderKanban(container);
            } else if (currentView === 'scorecard') {
                renderScorecards();
            }
        }

        function renderKanban(container) {
            const stages = ['Pending', 'Working on', 'Escalated', 'Completed'];
            container.innerHTML = `<div class="kanban-board">
                ${stages.map(stage => `
                    <div class="kanban-col">
                        <div class="p-4 border-b border-[var(--border)] bg-black/20 flex justify-between items-center">
                            <span class="font-black text-[10px] uppercase tracking-widest text-[var(--text-dim)]">${stage}</span>
                            <span class="text-[9px] bg-[var(--bg-card)] px-2 rounded-full">${filteredDb.filter(x => x.status === stage).length}</span>
                        </div>
                        <div class="kanban-body">
                            ${filteredDb.filter(x => x.status === stage).map(item => `
                                <div class="p-4 bg-[var(--bg-card)] rounded-lg border border-transparent hover:border-[var(--brand)] cursor-pointer" onclick="openDetail('${item.id}')">
                                    <div class="text-[9px] font-mono text-[var(--brand)] mb-1">#${item.so}</div>
                                    <div class="text-[10px] font-black uppercase truncate text-white">${item.customer}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        function renderScorecards() {
            const grid = document.getElementById('rep-stats-grid');
            const reps = [...new Set(filteredDb.map(x => x.owner))];
            grid.innerHTML = reps.map(rep => {
                const total = filteredDb.filter(x => x.owner === rep).length;
                const done = filteredDb.filter(x => x.owner === rep && x.status === 'Completed').length;
                const perc = total > 0 ? Math.round((done / total) * 100) : 0;
                return `
                    <div class="rep-card">
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-black text-xs uppercase">${rep}</span>
                            <span class="text-[10px] font-bold opacity-30">${total} Active</span>
                        </div>
                        <div class="flex justify-between text-[9px] font-black uppercase text-[var(--text-dim)]">
                            <span>Efficiency</span>
                            <span>${perc}%</span>
                        </div>
                        <div class="prog-bg"><div class="prog-fill bg-[var(--brand)]" style="width: ${perc}%"></div></div>
                    </div>
                `;
            }).join('');
        }

        function openDetail(id) {
            selectedId = id;
            const item = fullDb.find(x => x.id === id);
            document.getElementById('detail-form').classList.remove('hidden');
            
            document.getElementById('d-company').innerText = item.customer;
            document.getElementById('d-so').innerText = `#${item.so}`;
            document.getElementById('d-id').innerText = `ID: ${item.id}`;
            document.getElementById('d-status-badge').innerText = item.status;
            document.getElementById('d-status-badge').style.borderColor = getStatusColor(item.status);

            document.getElementById('m-owner').value = item.owner;
            document.getElementById('m-status').value = item.status;
            document.getElementById('m-notes').value = item.notes;
            document.getElementById('d-whs-logs').innerText = item.whsNotes || "No internal logs from warehouse.";
            document.getElementById('d-driver-logs').innerText = item.driver || "No driver feedback logged.";

            renderGallery();
        }

        function closeDetail() {
            selectedId = null;
            document.getElementById('detail-form').classList.add('hidden');
            renderGallery();
        }

        async function saveRecord(autoNext = false) {
            const item = fullDb.find(x => x.id === selectedId);
            const payload = {
                guid: item.guid,
                status: document.getElementById('m-status').value,
                owner: document.getElementById('m-owner').value,
                notes: document.getElementById('m-notes').value
            };

            Toastify({ text: "Pushing to Dataverse...", style: { background: "#fbbf24", color: "black" } }).showToast();
            try {
                await fetch(SAVE_URL, { method: 'POST', body: JSON.stringify(payload) });
                item.status = payload.status; item.owner = payload.owner; item.notes = payload.notes;
                if (payload.status === 'Completed') confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                Toastify({ text: "Success", style: { background: "#10b981" } }).showToast();
                if (autoNext) {
                    const idx = filteredDb.findIndex(x => x.id === selectedId);
                    if (filteredDb[idx+1]) openDetail(filteredDb[idx+1].id);
                    else closeDetail();
                } else { renderView(); renderGallery(); }
            } catch(e) {
                Toastify({ text: "Sync Error", style: { background: "#ef4444" } }).showToast();
            }
        }

        // Email Engine
        function openEmailModal() {
            const item = fullDb.find(x => x.id === selectedId);
            document.getElementById('m-to').value = `${item.owner.toLowerCase().replace(' ', '.')}@wbmason.com`;
            document.getElementById('m-subject').value = `Update: ${item.so} / ${item.customer} / ${item.whs}`;
            document.getElementById('m-body').innerHTML = `Hello,<br><br>Regarding Sales Order <b>${item.so}</b>:<br><br>[Status: ${item.status}]<br><br>Audit: ${item.notes}<br><br>Thanks,<br>Logistics Team`;
            document.getElementById('email-modal').style.display = 'flex';
        }

        function closeEmailModal() { document.getElementById('email-modal').style.display = 'none'; }

        async function sendGraphEmail() {
            const item = fullDb.find(x => x.id === selectedId);
            const btn = document.getElementById('send-email-btn');
            btn.innerText = "LINKING TO DYNAMICS..."; btn.disabled = true;

            try {
                const tokenResponse = await msalInstance.acquireTokenSilent({ 
                    scopes: ["Mail.Send", "https://wbmasonco.crm.dynamics.com/user_impersonation"] 
                });
                const emailPayload = { 
                    message: { 
                        subject: document.getElementById('m-subject').value, 
                        body: { contentType: "HTML", content: document.getElementById('m-body').innerHTML }, 
                        toRecipients: [{ emailAddress: { address: document.getElementById('m-to').value } }] 
                    } 
                };

                // Graph Send
                await fetch("https://graph.microsoft.com/v1.0/me/sendMail", { 
                    method: 'POST', 
                    headers: { Authorization: `Bearer ${tokenResponse.accessToken}`, "Content-Type": "application/json" }, 
                    body: JSON.stringify(emailPayload) 
                });

                // Dynamics Activity Track
                const dynTrack = {
                    "subject": document.getElementById('m-subject').value,
                    "description": document.getElementById('m-body').innerHTML,
                    "regardingobjectid_cr714_logisticslog_2@odata.bind": `/cr714_logisticslog_2s(${item.guid})`
                };
                await fetch("https://wbmasonco.crm.dynamics.com/api/data/v9.0/emails", {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${tokenResponse.accessToken}`, "Content-Type": "application/json" },
                    body: JSON.stringify(dynTrack)
                });

                Toastify({ text: "Email & CSW Link Created", style: { background: "#10b981" } }).showToast();
                closeEmailModal();
            } catch(e) {
                Toastify({ text: "Graph Auth Error", style: { background: "#ef4444" } }).showToast();
            } finally { btn.innerText = "Send & Track"; btn.disabled = false; }
        }

        // Filters & Utils
        function applyFilters() {
            activeFilters = {
                search: document.getElementById('global-search').value,
                whs: document.getElementById('f-wh').value,
                status: document.getElementById('f-status').value
            };
            worker.postMessage({ type: 'FILTER', payload: { db: fullDb, criteria: activeFilters } });
        }

        function clearFilters() {
            document.getElementById('global-search').value = '';
            document.getElementById('f-wh').value = '';
            document.getElementById('f-status').value = '';
            applyFilters();
        }

        function debouncedFilter() { clearTimeout(window.fTimer); window.fTimer = setTimeout(applyFilters, 300); }

        function adjustFont(delta) {
            const root = document.documentElement;
            let current = parseInt(getComputedStyle(root).getPropertyValue('--base-font'));
            root.style.setProperty('--base-font', (current + delta) + 'px');
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'light' ? 'midnight' : 'light');
        }

        function setFormLayout(layout) {
            const fields = document.getElementById('form-fields');
            fields.className = 'space-y-8 transition-all duration-300';
            document.querySelectorAll('[id^="btn-lay-"]').forEach(b => b.classList.remove('bg-[var(--brand)]', 'text-black'));
            document.getElementById(`btn-lay-${layout}`).classList.add('bg-[var(--brand)]', 'text-black');
            if (layout === 'grid') fields.classList.add('form-grid');
            if (layout === 'compact') fields.classList.add('form-compact');
        }

        function getStatusStyle(s) {
            if (s === 'Pending') return 'text-[var(--text-accent)]';
            if (s === 'Completed') return 'text-[var(--success)]';
            if (s === 'Escalated') return 'text-[var(--danger)]';
            return 'text-white';
        }

        function getStatusColor(s) {
            const c = { 'Pending': '#fbbf24', 'Working on': '#2dd4bf', 'Escalated': '#ef4444', 'Completed': '#10b981' };
            return c[s] || 'var(--border)';
        }

        // Map & Charts
        function initMap() {
            if (mapInstance) return;
            mapInstance = L.map('map-container').setView([39.8, -98.6], 4);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mapInstance);
            markerGroup = L.layerGroup().addTo(mapInstance);
        }

        function updateMapMarkers(points) {
            if (!markerGroup) return;
            markerGroup.clearLayers();
            points.forEach(p => {
                L.circleMarker([p.lat, p.lng], { 
                    radius: 10 + (p.count * 2), 
                    color: '#2dd4bf', 
                    fillOpacity: 0.6 
                }).bindPopup(`<b>${p.wh}</b><br>${p.count} Active Records`).addTo(markerGroup);
            });
        }

        function updateDashboard(data, whs) {
            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-urgent').innerText = data.filter(x => x.issue.match(/Crit|Urg/i)).length;
            document.getElementById('stat-pending').innerText = data.filter(x => x.status === 'Pending').length;
            const rate = data.length ? Math.round((data.filter(x => x.status === 'Completed').length / data.length) * 100) : 0;
            document.getElementById('stat-rate').innerText = rate + '%';

            const ctxWh = document.getElementById('chart-whs').getContext('2d');
            if (chartInstances.wh) chartInstances.wh.destroy();
            chartInstances.wh = new Chart(ctxWh, {
                type: 'bar',
                data: { labels: Object.keys(whs), datasets: [{ data: Object.values(whs), backgroundColor: '#2dd4bf' }] },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const ctxIss = document.getElementById('chart-issues').getContext('2d');
            const issues = {}; data.forEach(d => issues[d.issue] = (issues[d.issue]||0)+1);
            if (chartInstances.iss) chartInstances.iss.destroy();
            chartInstances.iss = new Chart(ctxIss, {
                type: 'doughnut',
                data: { labels: Object.keys(issues), datasets: [{ data: Object.values(issues), backgroundColor: ['#ef4444', '#fbbf24', '#2dd4bf', '#a855f7'] }] },
                options: { maintainAspectRatio: false }
            });
        }

        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(filteredDb);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Logistics");
            XLSX.writeFile(wb, `LogiLeap_Export_${new Date().getTime()}.xlsx`);
        }
    </script>
</body>
</html>
