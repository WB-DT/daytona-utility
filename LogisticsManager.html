<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLeap v14.0 | Production</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;
            --brand: #2dd4bf; --brand-dark: #14b8a6;
            --text-main: #f1f5f9; --text-dim: #94a3b8; --text-accent: #fbbf24;
            --border: #475569; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
        }
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; overflow: hidden; transition: background-color 0.3s; }

        /* FROG LOADER */
        #loading-screen { position: fixed; inset: 0; background: var(--bg-deep); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .frog-container { position: relative; width: 120px; height: 120px; }
        .frog-icon { font-size: 3rem; color: var(--brand); position: absolute; bottom: 0; left: 0; animation: leap 1.5s infinite ease-in-out; }
        .data-object { position: absolute; bottom: 5px; font-size: 1.5rem; color: var(--text-dim); opacity: 0; animation: slideData 1.5s infinite linear; }
        .data-object:nth-child(2) { animation-delay: 0.5s; } .data-object:nth-child(3) { animation-delay: 1.0s; }
        @keyframes leap { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-40px) scale(1.1); } }
        @keyframes slideData { 0% { transform: translateX(60px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateX(-60px); opacity: 0; } }

        /* RACING BORDER */
        .racing-border { position: relative; z-index: 0; overflow: hidden; border-radius: 0.375rem; padding: 2px; }
        .racing-border::before { content: ''; position: absolute; z-index: -2; left: -50%; top: -50%; width: 200%; height: 200%; background-color: var(--bg-surface); background-repeat: no-repeat; background-position: 0 0; background-image: conic-gradient(transparent, var(--brand), transparent 30%); animation: rotate 4s linear infinite; }
        .racing-border::after { content: ''; position: absolute; z-index: -1; left: 2px; top: 2px; width: calc(100% - 4px); height: calc(100% - 4px); background: var(--bg-deep); border-radius: 0.25rem; }
        @keyframes rotate { 100% { transform: rotate(1turn); } }

        /* LAYOUT & SPLIT VIEW */
        #main-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        #view-container { flex: 1; overflow: hidden; display: flex; flex-direction: column; transition: all 0.4s ease; border-right: 1px solid var(--border); }
        #detail-pane { width: 0; opacity: 0; overflow-y: auto; background: var(--bg-surface); transition: all 0.4s ease; border-left: 1px solid var(--border); position: relative; }
        
        .split-active #view-container { flex: none; width: 30%; } 
        .split-active #detail-pane { flex: 1; width: 70%; opacity: 1; }
        
        /* RESPONSIVE KANBAN (MINIMIZES IN SPLIT) */
        .split-active .kanban-board { flex-direction: column; overflow-y: auto; padding: 0.5rem; gap: 0.5rem; }
        .split-active .kanban-col { min-width: 100%; border: none; background: transparent; padding: 0; }
        .split-active .kanban-header { display: none; }
        .split-active .kanban-body { padding: 0; }

        /* NORMAL KANBAN */
        .kanban-board { display: flex; height: 100%; overflow-x: auto; gap: 1rem; padding: 1rem; }
        .kanban-col { min-width: 280px; flex: 1; background: rgba(0,0,0,0.2); border-radius: 0.5rem; display: flex; flex-direction: column; border: 1px solid var(--border); }
        .kanban-header { padding: 0.75rem; font-weight: bold; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem; color: var(--text-dim); display: flex; justify-content: space-between; }
        .kanban-body { flex: 1; overflow-y: auto; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }

        /* CARDS */
        .ticket-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.75rem; cursor: pointer; transition: all 0.2s; position: relative; }
        .ticket-card:hover { transform: translateY(-2px); border-color: var(--brand); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .ticket-card.active { border-color: var(--brand); background: rgba(45, 212, 191, 0.1); }
        .severity-high { border-left: 3px solid var(--danger); }
        .severity-med { border-left: 3px solid var(--warning); }
        .new-ticket { border-left: 3px solid var(--brand); background: linear-gradient(90deg, rgba(45, 212, 191, 0.1), transparent); }

        /* UI ELEMENTS */
        .input-dark { background: var(--bg-deep); border: 1px solid var(--border); color: var(--text-main); padding: 0.5rem; border-radius: 0.375rem; width: 100%; font-size: 0.875rem; outline: none; }
        .input-dark:focus { border-color: var(--brand); }
        .snippet-btn { font-size: 0.65rem; padding: 2px 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; color: var(--text-dim); cursor: pointer; transition: all 0.2s; font-weight: bold; text-transform: uppercase; }
        .snippet-btn:hover { background: var(--brand); color: #000; border-color: var(--brand); }
        ::-webkit-scrollbar { width: 6px; height: 6px; } 
        ::-webkit-scrollbar-track { background: var(--bg-deep); } 
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        #map-container { width: 100%; height: 100%; background: #0f172a; }
        .custom-check { width: 16px; height: 16px; cursor: pointer; accent-color: var(--brand); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="frog-container">
            <i class="fas fa-frog frog-icon"></i>
            <i class="fas fa-box data-object" style="left: 20px;"></i>
            <i class="fas fa-file-invoice data-object" style="left: 60px;"></i>
            <i class="fas fa-truck data-object" style="left: 100px;"></i>
        </div>
        <div class="mt-8 text-lg font-mono text-[var(--brand)] animate-pulse">Initializing LogiLeap v14.0...</div>
        <div id="loading-status" class="text-xs text-[var(--text-dim)] mt-2">Connecting to Logistics Cloud...</div>
    </div>

    <div id="main-container">
        
        <div id="view-container">
            <header class="bg-[var(--bg-surface)] border-b border-[var(--border)] p-3 z-30 flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded bg-gradient-to-br from-[var(--brand)] to-teal-800 flex items-center justify-center text-black font-bold text-xl shadow-lg"><i class="fas fa-frog"></i></div>
                        <h1 class="font-bold tracking-tight text-base">LogiLeap <span class="text-[var(--brand)]">v14</span></h1>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleTheme()" class="p-2 rounded bg-[var(--bg-card)] hover:bg-[var(--border)] text-[var(--text-accent)]" title="Theme"><i class="fas fa-sun"></i></button>
                        <div class="h-6 w-px bg-[var(--border)] mx-1"></div>
                        <button onclick="createNew()" class="px-2 py-1 bg-[var(--brand)] text-black rounded font-bold text-xs hover:brightness-110 shadow"><i class="fas fa-plus"></i></button>
                        <button onclick="toggleMyTickets()" id="btn-mine" class="px-2 py-1 bg-[var(--bg-deep)] border border-[var(--border)] text-[var(--text-accent)] rounded font-bold text-xs hover:bg-[var(--bg-card)]"><i class="fas fa-user"></i> Mine</button>
                        <div class="h-6 w-px bg-[var(--border)] mx-1"></div>
                        <div class="flex bg-[var(--bg-deep)] rounded p-0.5 border border-[var(--border)]">
                            <button onclick="switchView('scorecard')" id="nav-scorecard" class="px-2 py-1 text-xs rounded hover:text-white text-[var(--text-dim)]"><i class="fas fa-chart-pie"></i></button>
                            <button onclick="switchView('kanban')" id="nav-kanban" class="px-2 py-1 text-xs rounded bg-[var(--brand)] text-black font-bold"><i class="fas fa-columns"></i></button>
                            <button onclick="switchView('list')" id="nav-list" class="px-2 py-1 text-xs rounded hover:text-white text-[var(--text-dim)]"><i class="fas fa-list"></i></button>
                            <button onclick="switchView('map')" id="nav-map" class="px-2 py-1 text-xs rounded hover:text-white text-[var(--text-dim)]"><i class="fas fa-map"></i></button>
                            <button onclick="switchView('manifests')" id="nav-manifests" class="px-2 py-1 text-xs rounded hover:text-white text-[var(--text-dim)]"><i class="fas fa-file-import"></i></button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-6 gap-2">
                    <div class="col-span-2 relative">
                        <i class="fas fa-search absolute left-2 top-2.5 text-[var(--text-dim)] text-xs"></i>
                        <input type="text" id="filter-search" onkeyup="debouncedSearch()" placeholder="Search..." class="input-dark pl-7 h-8 text-xs">
                    </div>
                    <div class="col-span-1"><input type="text" id="filter-date" class="input-dark h-8 text-xs text-center" placeholder="Date"></div>
                    <div class="col-span-1"><select id="filter-wh" onchange="applyFilters()" class="input-dark h-8 text-xs"><option value="">Whs</option></select></div>
                    <div class="col-span-1"><select id="filter-issue" onchange="applyFilters()" class="input-dark h-8 text-xs"><option value="">Issue</option></select></div>
                    <div class="col-span-1 flex items-center justify-end text-[var(--text-dim)] text-[10px] font-mono"><span id="count-display">0</span> items</div>
                </div>
            </header>

            <div id="view-scorecard" class="view-section hidden flex-1 overflow-y-auto p-4">
                <div class="grid grid-cols-4 gap-4 mb-4">
                    <div class="card p-4"><div class="text-[10px] uppercase text-[var(--text-dim)]">Total</div><div id="sc-total" class="text-2xl font-bold">0</div></div>
                    <div class="card p-4"><div class="text-[10px] uppercase text-[var(--text-dim)]">Critical</div><div id="sc-urgent" class="text-2xl font-bold text-[var(--danger)]">0</div></div>
                    <div class="card p-4"><div class="text-[10px] uppercase text-[var(--text-dim)]">Active</div><div id="sc-active" class="text-2xl font-bold text-[var(--warning)]">0</div></div>
                    <div class="card p-4"><div class="text-[10px] uppercase text-[var(--text-dim)]">Done</div><div id="sc-closed" class="text-2xl font-bold text-[var(--success)]">0</div></div>
                </div>
                <div class="grid grid-cols-2 gap-4 h-64">
                    <div class="card p-2"><canvas id="chart-wh"></canvas></div>
                    <div class="card p-2"><canvas id="chart-iss"></canvas></div>
                </div>
            </div>

            <div id="view-kanban" class="view-section flex-1 overflow-hidden">
                <div class="kanban-board" id="kanban-container"></div>
            </div>

            <div id="view-list" class="view-section hidden flex-1 overflow-y-auto p-2">
                <div id="list-grid" class="flex flex-col gap-2"></div>
            </div>

            <div id="view-map" class="view-section hidden flex-1 relative"><div id="map-container"></div></div>

            <div id="view-manifests" class="view-section hidden flex-1 p-4 flex flex-col">
                <div class="flex gap-2 mb-4">
                    <select id="manifest-selector" class="input-dark flex-1"><option value="">Select File...</option></select>
                    <button onclick="loadManifest()" class="px-4 bg-[var(--brand)] text-black font-bold rounded text-xs">LOAD</button>
                </div>
                <div id="manifest-preview" class="flex-1 border border-[var(--border)] rounded overflow-auto p-2 bg-[var(--bg-deep)] text-xs font-mono"></div>
                <button onclick="ingestManifest()" class="mt-2 w-full py-3 bg-[var(--text-accent)] text-black font-bold uppercase rounded shadow-lg hover:brightness-110">Ingest to Log</button>
            </div>
        </div>

        <div id="detail-pane">
            <div class="sticky top-0 bg-[var(--bg-surface)] border-b border-[var(--border)] p-3 flex justify-between items-center z-10 shadow-md">
                <button onclick="closeDetail()" class="text-[var(--text-dim)] hover:text-white flex items-center gap-2 font-bold text-xs uppercase"><i class="fas fa-chevron-left"></i> Back</button>
                <div class="flex gap-2">
                    <button onclick="deleteRecord()" class="px-3 py-1 rounded border border-[var(--danger)] text-[var(--danger)] hover:bg-[var(--danger)] hover:text-white text-xs font-bold transition"><i class="fas fa-trash-alt"></i></button>
                    <button onclick="triggerEmail()" class="px-3 py-1 rounded border border-[var(--border)] hover:bg-[var(--bg-card)] text-xs font-bold text-[var(--brand)]"><i class="fas fa-envelope mr-1"></i> Email</button>
                    <button onclick="saveRecord()" class="px-3 py-1 rounded bg-[var(--bg-card)] text-white text-xs font-bold hover:bg-[var(--border)]">Save</button>
                    <button onclick="saveRecord(true)" class="px-4 py-1 rounded bg-[var(--brand)] text-black text-xs font-bold shadow hover:brightness-110">Save & Next</button>
                </div>
            </div>

            <div class="p-6 space-y-6 pb-20">
                <div>
                    <div class="flex justify-between items-start">
                        <h1 id="d-customer" class="text-xl font-bold text-white leading-tight outline-none" contenteditable="false"></h1>
                        <div id="d-id" class="text-[10px] font-mono text-[var(--text-dim)]"></div>
                    </div>
                    <div class="flex items-center gap-3 mt-1">
                        <span id="d-order" class="font-mono text-lg text-[var(--brand)] font-bold outline-none" contenteditable="false"></span>
                        <span id="d-date" class="text-xs bg-[var(--bg-card)] px-2 py-0.5 rounded text-[var(--text-dim)]"></span>
                    </div>
                    <div id="d-address" class="text-sm text-gray-400 mt-2 select-all border-l-2 border-[var(--border)] pl-2 outline-none" contenteditable="false"></div>
                </div>

                <div class="grid grid-cols-2 gap-4 p-4 bg-[var(--bg-deep)] rounded border border-[var(--border)]">
                    <div>
                        <label class="text-[10px] text-[var(--brand)] uppercase font-bold mb-1 block">Status</label>
                        <div class="racing-border"><select id="m-status" class="input-dark font-bold h-9 bg-transparent border-none w-full outline-none text-white"><option value="Pending">Pending</option><option value="Working on">Working on</option><option value="Escalated">Escalated</option><option value="Completed">Completed</option></select></div>
                    </div>
                    <div>
                        <label class="text-[10px] text-[var(--brand)] uppercase font-bold mb-1 block">Owner</label>
                        <div class="racing-border"><input type="text" id="m-owner" class="input-dark h-9 bg-transparent border-none w-full outline-none text-white"></div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-end mb-1">
                        <label class="text-[10px] text-[var(--text-dim)] uppercase font-bold">Resolution Notes</label>
                        <div id="snippet-bar" class="flex gap-1"></div>
                    </div>
                    <div class="racing-border"><textarea id="m-notes" rows="6" class="input-dark font-mono text-xs leading-relaxed p-2 bg-transparent border-none w-full outline-none text-white"></textarea></div>
                </div>

                <div class="grid grid-cols-2 gap-4 text-xs">
                    <div><label class="block text-[10px] uppercase font-bold text-[var(--text-dim)] mb-1">Driver Info</label><div id="d-driver" class="p-2 bg-[var(--bg-deep)] rounded border border-[var(--border)] h-20 overflow-y-auto"></div></div>
                    <div><label class="block text-[10px] uppercase font-bold text-[var(--text-dim)] mb-1">Warehouse Notes</label><div id="d-whs" class="p-2 bg-[var(--bg-deep)] rounded border border-[var(--border)] h-20 overflow-y-auto italic"></div></div>
                </div>

                <div class="flex items-center gap-2 p-2 bg-[var(--bg-deep)] rounded border border-[var(--border)]">
                    <input type="checkbox" id="modal-coaching" class="custom-check"> 
                    <span class="text-xs text-[var(--text-accent)] font-bold uppercase">Log Coaching Opportunity</span>
                </div>

                <div class="pt-4 border-t border-[var(--border)]">
                    <h3 class="text-xs font-bold text-white mb-2 flex items-center gap-2"><i class="fas fa-history text-[var(--text-dim)]"></i> Related History</h3>
                    <div class="bg-[var(--bg-deep)] rounded border border-[var(--border)] overflow-hidden">
                        <table class="w-full text-left text-[10px]"><thead class="bg-[var(--bg-card)] text-[var(--text-dim)]"><tr><th class="p-2">Date</th><th class="p-2">Status</th><th class="p-2">Owner</th></tr></thead><tbody id="dup-table"></tbody></table>
                        <div id="no-dups" class="p-2 text-center text-[var(--text-dim)] italic">No history found.</div>
                    </div>
                </div>

                <div class="pt-2"><div class="text-[9px] font-mono text-[var(--text-dim)] grid grid-cols-2 gap-2 opacity-50"><div>GUID: <span id="sys-guid" class="select-all"></span></div><div>RID: <span id="sys-rid"></span></div></div></div>
            </div>
        </div>
    </div>

    <div id="email-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[60] backdrop-blur-sm">
        <div class="bg-[var(--bg-surface)] w-full max-w-lg rounded-xl shadow-2xl border border-[var(--border)] p-6">
            <h3 class="text-lg font-bold text-white mb-4"><i class="fas fa-paper-plane text-[var(--brand)] mr-2"></i>Send Update</h3>
            <div class="space-y-3">
                <div><label class="text-xs text-[var(--text-dim)] uppercase font-bold">Subject</label><input type="text" id="email-subject" class="input-dark font-bold"></div>
                <div><label class="text-xs text-[var(--text-dim)] uppercase font-bold">Message</label><textarea id="email-body" rows="6" class="input-dark font-mono text-xs"></textarea></div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="document.getElementById('email-modal').classList.add('hidden')" class="px-4 py-2 rounded text-[var(--text-dim)] hover:text-white text-xs font-bold uppercase">Cancel</button>
                <button onclick="sendEmailViaFlow()" class="px-6 py-2 bg-[var(--brand)] text-black font-bold text-xs rounded uppercase shadow-lg hover:brightness-110">Send</button>
            </div>
        </div>
    </div>

            SEND_EMAIL_FLOW_URL: 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY',
            msalConfig: { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/common" } }
        };

        const worker = new Worker(URL.createObjectURL(new Blob([document.getElementById('worker-script').textContent], { type: "text/javascript" })));
        let fullData = [], filteredData = [], currentView = 'kanban', showMine = false;
        let mapInstance = null, chartInstances = {};
        let userProfile = { name: "Guest" };
        let currentId = null;
        let searchTimeout;
        const userSnippets = ["Left VM", "Wrong Addr", "Completed", "Call Driver", "ETA Sent"];

        document.addEventListener('DOMContentLoaded', () => {
            flatpickr("#filter-date", { mode: "range", dateFormat: "Y-m-d", theme: "dark", onChange: applyFilters });
            identifyUser();
            refreshData();
            pollSharePoint();
            renderSnippets();
        });

        function debouncedSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(applyFilters, 300); }

        async function identifyUser() {
            try {
                const r = await fetch(CONFIG.WHO_AM_I_URL, {method:'POST'});
                const d = await r.json();
                if(d.displayName) userProfile.name = d.displayName;
            } catch(e){}
        }

        async function refreshData() {
            document.getElementById('loading-screen').style.display = 'flex';
            try {
                const r = await fetch(CONFIG.HISTORY_URL, {method:'POST'});
                const j = await r.json();
                worker.postMessage({ type: 'PARSE', payload: { data: j.value || [] } });
                setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 800);
            } catch(e) { document.getElementById('loading-status').innerText = "Offline Mode"; }
        }

        worker.onmessage = function(e) {
            const { type, data, counts, whsList, issueList } = e.data;
            if(type === 'RENDER') {
                if(fullData.length === 0 && counts) { 
                    fullData = data; 
                    populateDropdown('filter-wh', whsList);
                    populateDropdown('filter-issue', issueList);
                    updateScorecard(counts);
                }
                filteredData = data;
                document.getElementById('count-display').innerText = data.length;
                if(currentView === 'kanban') renderKanban(data);
                if(currentView === 'list') renderList(data);
                if(currentView === 'map') initMap();
            }
        };

        function switchView(v) {
            currentView = v;
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${v}`).classList.remove('hidden');
            document.querySelectorAll('header button[id^="nav-"]').forEach(b => {
                b.classList.remove('bg-[var(--brand)]', 'text-black', 'shadow');
                b.classList.add('text-[var(--text-dim)]');
            });
            document.getElementById(`nav-${v}`).classList.add('bg-[var(--brand)]', 'text-black', 'shadow');
            if(v === 'kanban') renderKanban(filteredData);
            if(v === 'list') renderList(filteredData);
            if(v === 'map') setTimeout(initMap, 200);
        }

        function renderKanban(data) {
            const cols = { 'Pending':[], 'Working on':[], 'Escalated':[], 'Completed':[] };
            data.forEach(t => { if(cols[t.status]) cols[t.status].push(t); else cols['Pending'].push(t); });
            const html = Object.keys(cols).map(status => `
                <div class="kanban-col">
                    <div class="kanban-header"><span>${status}</span><span class="bg-[var(--bg-card)] px-2 rounded text-[var(--brand)]">${cols[status].length}</span></div>
                    <div class="kanban-body">${cols[status].map(t => createCardHtml(t)).join('')}</div>
                </div>`).join('');
            document.getElementById('kanban-container').innerHTML = html;
        }

        function renderList(data) { document.getElementById('list-grid').innerHTML = data.map(t => createCardHtml(t)).join(''); }

        function createCardHtml(t) {
            const sev = (t.issue && t.issue.match(/Urg|Crit/)) ? 'severity-high' : 'severity-med';
            const isActive = t.id === currentId ? 'active' : '';
            const newClass = t.isNew ? 'new-ticket' : '';
            const dupIcon = t.isDup ? '<i class="fas fa-copy text-orange-500 ml-1" title="Duplicate"></i>' : '';
            return `<div class="ticket-card ${sev} ${isActive} ${newClass}" onclick="openDetail('${t.id}')">
                <div class="flex justify-between items-start mb-1">
                    <div class="font-bold text-[var(--brand)] text-xs">${t.order} ${dupIcon}</div>
                    <div class="text-[9px] opacity-50">${t.date}</div>
                </div>
                <div class="text-sm font-bold text-white truncate">${t.company}</div>
                <div class="flex justify-between mt-1 text-[10px] text-[var(--text-dim)]"><span>${t.issue||'Gen'}</span><span>${t.owner.split(' ')[0]}</span></div>
            </div>`;
        }

        function createNew() {
            openDetail('NEW');
            ['d-customer','d-order','d-address'].forEach(i => document.getElementById(i).contentEditable = true);
            document.getElementById('d-customer').focus();
            Toastify({text:"New Ticket Mode", style:{background:"#3b82f6"}}).showToast();
        }

        function openDetail(id) {
            document.getElementById('main-container').classList.add('split-active');
            currentId = id;
            if(currentView === 'kanban') renderKanban(filteredData);
            if(currentView === 'list') renderList(filteredData);
            
            if(id === 'NEW') {
                ['d-customer','d-order','d-address','m-owner','m-notes','d-driver','d-whs','sys-guid'].forEach(i => document.getElementById(i).innerText = "");
                document.getElementById('d-customer').innerText = "New Customer";
                document.getElementById('sys-rid').innerText = "NEW";
                document.getElementById('m-status').value = "Pending";
                return;
            }
            const t = fullData.find(x => x.id === id);
            if(!t) return;
            ['d-customer','d-order','d-address'].forEach(i => document.getElementById(i).contentEditable = false);
            
            document.getElementById('d-customer').innerText = t.company;
            document.getElementById('d-id').innerText = t.id;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-date').innerText = t.date;
            document.getElementById('d-address').innerText = t.address;
            document.getElementById('m-status').value = t.status;
            document.getElementById('m-owner').value = t.owner;
            document.getElementById('m-notes').value = t.notes || "";
            
            let drvHtml = `<div class="font-bold text-white mb-1">${t.driver.split(/[\d]/)[0]}</div>`;
            const phone = t.driver.match(/[\d\-\(\)\.]{10,}/);
            if(phone) drvHtml += `<div class="mb-2"><a href="tel:${phone[0].replace(/\D/g,'')}" class="text-[var(--brand)] underline font-bold"><i class="fas fa-phone mr-1"></i> ${phone[0]}</a></div>`;
            drvHtml += `<div class="opacity-75">${t.drvNotes || "No notes."}</div>`;
            document.getElementById('d-driver').innerHTML = drvHtml;

            document.getElementById('d-whs').innerText = t.whsNotes || "None";
            document.getElementById('sys-guid').innerText = t.guid;
            document.getElementById('sys-rid').innerText = t.id;

            // Global Duplicates
            const dups = fullData.filter(x => x.order === t.order && x.id !== t.id);
            const tb = document.getElementById('dup-table');
            if(dups.length > 0) {
                document.getElementById('no-dups').classList.add('hidden');
                tb.innerHTML = dups.map(d => `<tr class="border-b border-[var(--border)] opacity-60 hover:opacity-100 cursor-pointer" onclick="openDetail('${d.id}')"><td class="p-2">${d.date}</td><td class="p-2">${d.status}</td><td class="p-2">${d.owner}</td></tr>`).join('');
            } else {
                document.getElementById('no-dups').classList.remove('hidden');
                tb.innerHTML = "";
            }
        }

        function closeDetail() { document.getElementById('main-container').classList.remove('split-active'); currentId = null; renderKanban(filteredData); }

        async function saveRecord(autoNext = false) {
            const guid = document.getElementById('sys-guid').innerText;
            const payload = { 
                recordId: guid, disposition: document.getElementById('m-status').value, 
                owner: document.getElementById('m-owner').value, notes: document.getElementById('m-notes').value,
                customer: document.getElementById('d-customer').innerText, order: document.getElementById('d-order').innerText
            };
            if(document.getElementById('modal-coaching').checked) {
                await fetch(CONFIG.SAVE_COACHING_URL, {method:'POST', body:JSON.stringify({recordId:guid, note:payload.notes}), headers:{'Content-Type':'application/json'}});
            }
            fetch(CONFIG.SAVE_FLOW_URL, {method:'POST', body:JSON.stringify(payload), headers:{'Content-Type':'application/json'}})
            .then(() => { 
                Toastify({text:"Saved", style:{background:"#10b981"}}).showToast(); 
                if(autoNext) {
                    const idx = filteredData.findIndex(x => x.id === currentId);
                    if(idx !== -1 && filteredData[idx+1]) openDetail(filteredData[idx+1].id);
                }
            });
        }

        async function deleteRecord() {
            if(!confirm("Delete?")) return;
            const guid = document.getElementById('sys-guid').innerText;
            fetch(CONFIG.SAVE_FLOW_URL, {method:'POST', body:JSON.stringify({recordId: guid, isDelete: true}), headers:{'Content-Type':'application/json'}})
            .then(() => { Toastify({text:"Deleted", style:{background:"#ef4444"}}).showToast(); closeDetail(); refreshData(); });
        }

        function initMap() {
            if(!mapInstance) { mapInstance=L.map('map-container').setView([39.8,-98.6],4); L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mapInstance); }
            mapInstance.invalidateSize(); mapInstance.eachLayer(l=>{if(l instanceof L.CircleMarker) mapInstance.removeLayer(l)});
            const clusters = {}; filteredData.forEach(d => { const k=d.zip3; if(!ZIP_MAP[k]) return; if(!clusters[k]) clusters[k]={lat:ZIP_MAP[k][0], lon:ZIP_MAP[k][1], count:0}; clusters[k].count++; });
            Object.values(clusters).forEach(c => { L.circleMarker([c.lat,c.lon], {radius:Math.min(20, 5+c.count), color:'#2dd4bf', fillColor:'#2dd4bf', fillOpacity:0.6}).addTo(mapInstance); });
        }
        async function pollSharePoint() { try { const r = await fetch(CONFIG.SP_POLL_URL, {method:'POST', body:JSON.stringify({action:"poll"}), headers:{'Content-Type':'application/json'}}); const f = await r.json(); f.forEach(x => document.getElementById('manifest-selector').add(new Option(x.name,x.id))); } catch(e){} }
        async function loadManifest() {
            const id = document.getElementById('manifest-selector').value;
            const r = await fetch(CONFIG.SP_POLL_URL, {method:'POST', body:JSON.stringify({action:"get_content", id}), headers:{'Content-Type':'application/json'}});
            const b = await r.arrayBuffer(); const wb = XLSX.read(b, {type:'array'});
            window.currentManifest = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]).map(r=>({...r, isNew:true})); 
            document.getElementById('manifest-preview').innerHTML = XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]]);
        }
        function ingestManifest() { worker.postMessage({ type: 'PARSE', payload: { data: window.currentManifest } }); switchView('kanban'); Toastify({text:"Ingested"}).showToast(); }

        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.style.getPropertyValue('--bg-deep') !== '#f8fafc';
            if (isDark) {
                root.style.setProperty('--bg-deep', '#f8fafc'); root.style.setProperty('--bg-surface', '#ffffff'); root.style.setProperty('--bg-card', '#e2e8f0');
                root.style.setProperty('--text-main', '#0f172a'); root.style.setProperty('--text-dim', '#64748b'); root.style.setProperty('--border', '#cbd5e1');
            } else {
                root.style.setProperty('--bg-deep', '#0f172a'); root.style.setProperty('--bg-surface', '#1e293b'); root.style.setProperty('--bg-card', '#334155');
                root.style.setProperty('--text-main', '#f1f5f9'); root.style.setProperty('--text-dim', '#94a3b8'); root.style.setProperty('--border', '#475569');
            }
        }
        function toggleMyTickets() {
            showMine = !showMine;
            document.getElementById('btn-mine').classList.toggle('bg-[var(--text-accent)]');
            document.getElementById('btn-mine').classList.toggle('text-black');
            applyFilters();
        }
        function applyFilters() { 
            worker.postMessage({ type: 'FILTER', payload: { 
                search: document.getElementById('filter-search').value.toLowerCase(), 
                wh: document.getElementById('filter-wh').value, 
                issue: document.getElementById('filter-issue').value, 
                fullData, mine: showMine, user: userProfile.name
            } }); 
        }
        function populateDropdown(id, list) { const s=document.getElementById(id); list.forEach(i=>s.add(new Option(i,i))); }
        function renderSnippets() { document.getElementById('snippet-bar').innerHTML = userSnippets.map(s => `<button onclick="insertSnippet('${s}')" class="snippet-btn">${s}</button>`).join(''); }
        function insertSnippet(s) {
            const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            document.getElementById('m-notes').value += `\n[${time} - ${userProfile.name.split(' ')[0]}] ${s}`;
        }

        function updateScorecard(c) {
            document.getElementById('sc-total').innerText = c.total; document.getElementById('sc-urgent').innerText = c.urgent; document.getElementById('sc-active').innerText = c.active; document.getElementById('sc-closed').innerText = c.closed;
            if(chartInstances['wh']) chartInstances['wh'].destroy(); chartInstances['wh'] = new Chart(document.getElementById('chart-wh'), {type:'bar', data:{labels:['A','B'], datasets:[{data:[10,20], backgroundColor:'#2dd4bf'}]}, options:{plugins:{legend:{display:false}}}});
            if(chartInstances['iss']) chartInstances['iss'].destroy(); chartInstances['iss'] = new Chart(document.getElementById('chart-iss'), {type:'doughnut', data:{labels:['X','Y'], datasets:[{data:[30,10], backgroundColor:['#ef4444','#f59e0b']}]}, options:{plugins:{legend:{display:false}}}});
        }
    </script>
</body>
</html>
