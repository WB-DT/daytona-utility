    <style>
        :root, [data-theme='midnight'] { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;      
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='light'] { 
            --bg-deep: #f8fafc; --bg-surface: #ffffff; --bg-card: #f1f5f9;      
            --brand: #0d9488; --text-main: #0f172a; --text-dim: #475569;      
            --text-accent: #b45309; --border: #e2e8f0; --input-bg: #ffffff; --danger: #dc2626;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s ease; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside#main-gallery { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; position: relative; }
        #account-rail { width: 420px; min-width: 420px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 15px 0; display: none; }
        #account-rail.is-visible { display: flex !important; flex-direction: column; }

        .record-card { margin: 6px 12px; border-radius: 8px; padding: 10px 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid var(--border); position: relative; }
        .record-card:hover { transform: translateX(4px); background: rgba(0,0,0,0.03); }
        .record-card.active-card { background: var(--brand) !important; border-left-color: var(--text-main) !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .record-card.active-card * { color: #000000 !important; border-color: rgba(0, 0, 0, 0.2) !important; opacity: 1 !important; font-weight: 800; }

        .time-label-gallery { font-size: 9px; font-weight: 400; color: var(--text-main); opacity: 0.7; letter-spacing: 0.02em; }
        .wh-label { font-size: 10px; font-weight: 900; color: var(--brand); text-transform: uppercase; border: 1px solid var(--brand); padding: 1px 5px; border-radius: 3px; }
        .route-label { font-size: 10px; font-weight: 900; color: var(--text-accent); text-transform: uppercase; border: 1px solid var(--text-accent); padding: 1px 5px; border-radius: 3px; }
        .disp-pill { font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; border: 1px solid currentColor; }
        .issue-card-tag { font-size: 10px; font-weight: 700; color: var(--text-accent); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* View Containers (Map/Kanban) */
        #view-container { height: 100%; width: 100%; display: none; }
        #view-container.active { display: block; }
        #detail-content.active { display: flex; } /* Flex for sticky footer */
        
        #map-container { width: 100%; height: 100%; z-index: 1; }
        .kanban-board { display: flex; height: 100%; overflow-x: auto; padding: 20px; gap: 20px; }
        .kanban-col { min-width: 300px; background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .kanban-header { padding: 15px; font-weight: 800; border-bottom: 1px solid var(--border); color: var(--brand); text-transform: uppercase; font-size: 12px; }
        .kanban-body { padding: 10px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }

        /* Manifest Table */
        .reader-table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
        .reader-table th { background: var(--bg-card); position: sticky; top: 0; padding: 8px; border-bottom: 2px solid var(--border); border-right: 1px solid var(--border); text-align: left; color: var(--brand); }
        .reader-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); color: var(--text-main); }
        .reader-table tr:hover td { background-color: var(--bg-card); }

        /* Modals & Toasts */
        #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; pointer-events: none; }
        .toast { pointer-events: auto; min-width: 280px; padding: 16px 20px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); animation: toast-slide 0.3s ease-out; border-left: 4px solid var(--brand); }
        @keyframes toast-slide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 550px; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2); }
        #email-modal-overlay, #coaching-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; }

        /* Utility */
        .user-badge { font-size: 10px; font-weight: 900; padding: 4px 12px; border-radius: 20px; background: rgba(0,0,0,0.05); border: 1px solid var(--border); color: var(--text-dim); }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #475569; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--text-accent); }
        input:checked + .slider:before { transform: translateX(14px); }
        
        .active-filter { border-color: var(--brand) !important; box-shadow: 0 0 0 1px var(--brand); }
    </style>
</head>

    <script id="worker-script" type="javascript/worker">
        // WORKER: Handles Data Parsing & Filtering
        const ZIP_MAP = {'000':[39.8,-98.6]}; // (Full map in prod)
        let db = []; let orderCounts = {};

        const val = (obj, k) => { 
            if(!obj) return ""; 
            const keys = Object.keys(obj); 
            const cleanKeys = keys.reduce((acc, key) => { acc[key.toLowerCase().replace(/[^a-z0-9]/g, '')] = key; return acc; }, {});
            for(let i of k) { let cleanSearch = i.toLowerCase().replace(/[^a-z0-9]/g, ''); if (cleanKeys[cleanSearch]) return obj[cleanKeys[cleanSearch]]; } 
            return ""; 
        };
        const safeDate = (v) => { if(!v) return ""; if(typeof v === 'number') { const d = new Date(Math.round((v - 25569)*86400000)); return d.toISOString().split('T')[0]; } return String(v).substring(0, 10); };
        const toProperCase = (str) => { if(!str || typeof str !== 'string') return str; return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase()); };

        self.onmessage = function(e) {
            const { type, payload } = e.data;
            if (type === 'PARSE') {
                db = payload.data.map(r => {
                    const dateStr = safeDate(val(r, ['createdon', 'cr714_starttime', 'date']));
                    const rawOwner = val(r, ['cr714_logisticsowner', 'owner']);
                    const order = String(val(r, ['cr714_salesordernumber', 'cr714_salesorder', 'sales_order'])).trim();
                    
                    return {
                        id: val(r, ['cr714_ticket', 'id', 'ticket']),
                        guid: (val(r, ['cr714_logisticslog_2id']) || '').replace(/[{}]/g, ''),
                        order: order || 'N/A',
                        company: val(r, ['cr714_companyordeliveryname', 'cr714_customer', 'company']),
                        account: val(r, ['cr714_accountnumber', 'account']),
                        address: val(r, ['cr714_shippingaddress', 'address']),
                        rep: val(r, ['cr714_rep', 'rep']),
                        repEmail: val(r, ['cr714_repemail']),
                        owner: toProperCase(rawOwner) || 'Unassigned',
                        driver: val(r, ['cr714_drivernamenumber', 'driver']),
                        status: val(r, ['cr714_disposition', 'disposition']) || 'Pending',
                        issue: val(r, ['cr714_issue', 'issue']),
                        desc: val(r, ['cr714_description', 'description']),
                        whs: val(r, ['cr714_warehouse', 'warehouse']),
                        route: val(r, ['cr714_route', 'route']),
                        whsNotes: val(r, ['cr714_receivedemailfromwarehousenotes']),
                        drvNotes: val(r, ['cr714_receivedtextfromdrivernotes']),
                        date: dateStr,
                        timestamp: new Date(dateStr).getTime(),
                        isCoaching: val(r, ['cr714_coachingopportunity']) === true,
                        isUrgent: (val(r,['desc','cr714_description'])+val(r,['issue'])).toLowerCase().match(/urgent|asap|refused/)?true:false
                    };
                });
                // Count Duplicates
                orderCounts = db.reduce((acc, t) => { if(t.order !== 'N/A') acc[t.order] = (acc[t.order] || 0) + 1; return acc; }, {});
                
                // Get unique owners for filter
                const owners = [...new Set(db.map(x=>x.owner).filter(x=>x))].sort();
                self.postMessage({ type: 'INIT', owners });
            }
            else if (type === 'FILTER') {
                const { search, mode, owner, dateStart, dateEnd } = payload;
                const filtered = db.filter(t => {
                    const matchSearch = (t.order + t.company + t.account + t.issue + t.route).toLowerCase().includes(search);
                    const isFinished = t.status === 'Completed' || t.status === 'Sent Back';
                    
                    let modeMatch = true;
                    if (mode === 'active') modeMatch = !isFinished;
                    else if (mode === 'today') modeMatch = t.date === new Date().toISOString().split('T')[0];
                    else if (mode === 'urgent') modeMatch = t.isUrgent && !isFinished;
                    else if (mode === 'assign') modeMatch = t.owner === 'Unassigned' && !isFinished;

                    const ownerMatch = owner === 'ALL' || t.owner === owner;
                    return matchSearch && modeMatch && ownerMatch;
                }).sort((a,b) => b.timestamp - a.timestamp);

                // Add dup flag
                const final = filtered.map(f => ({...f, isDup: orderCounts[f.order] > 1}));
                self.postMessage({ type: 'RENDER', data: final });
            }
            else if (type === 'GET_DETAILS') {
                const t = db.find(x => x.id === payload.id);
                // Find potential duplicates for rail
                const dups = db.filter(x => x.order === t.order && x.id !== t.id);
                self.postMessage({ type: 'DETAILS', ticket: t, dups: dups });
            }
        };
    </script>

    <script>
        // MAIN LOGIC
        const worker = new Worker(URL.createObjectURL(new Blob([document.getElementById('worker-script').textContent], { type: "text/javascript" })));
        let currentTicketId = null; let currentMode = 'today'; let currentOwner = 'ALL';
        let currentUserEmail = "manager@wbmason.com";
        let spFilesCache = [];

        // FLOW URLS
        const FETCH_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/305ddbb25dca43049427e3435723b6f1/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=emJDSrupKmGVFgiVuIQXYQSktIhuRuUSDecu69Wc59U";
        const PATCH_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/cbe25d26ca35455bbe4d6949aac50750/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=MILsQloxKXWSJi5il84kf0GhMZJ6Q_X2nc21S1qIhtI";
        const SP_POLL_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/36fb43cdfdc7468caa8ab8a030ae37c4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hIs9EOaXqy3U3R9_HO4K7fe0_XrSgYBhoUF1bZRPoCg";

        // INIT
        window.onload = () => { 
            loadData(); 
            pollSharePointFiles();
            setMode('today'); 
        };

        async function loadData() {
            try {
                const res = await fetch(FETCH_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ action: "Refresh", userEmail: currentUserEmail }) });
                if(res.ok) {
                    const json = await res.json();
                    worker.postMessage({ type: 'PARSE', payload: { data: json.value || json.data } });
                }
            } catch(e) { console.error("Load Failed", e); }
        }

        worker.onmessage = (e) => {
            const { type, owners, data, ticket, dups } = e.data;
            if(type === 'INIT') {
                const sel = document.getElementById('rep-view-filter');
                owners.forEach(o => sel.add(new Option(o,o)));
                triggerFilter();
            } else if (type === 'RENDER') {
                renderList(data);
            } else if (type === 'DETAILS') {
                fillDetails(ticket, dups);
            }
        };

        function renderList(data) {
            const list = document.getElementById('ticket-list');
            list.innerHTML = data.map(t => `
                <div class="record-card ${currentTicketId === t.id ? 'active-card' : ''}" onclick="loadTicket('${t.id}')">
                    <div class="flex justify-between items-center mb-1"><span class="id-badge-ghost">#${t.id}</span><div class="flex gap-2 items-center"><span class="time-label-gallery">${t.date}</span><span class="wh-label">${t.whs}</span></div></div>
                    <div class="truncate font-extrabold uppercase text-[13px] mb-0.5">${t.company}</div>
                    <div class="flex justify-between items-center mt-1"><span class="font-mono font-bold ${t.isDup ? 'order-duplicate-alert' : ''}">#${t.order}</span><span class="disp-pill" style="color: ${t.status === 'Pending' ? 'var(--text-accent)' : 'var(--brand)'}">${t.status}</span></div>
                    <div class="mt-2 flex flex-col gap-1 border-t border-[var(--border)] pt-2"><span class="issue-card-tag truncate pr-2">${t.issue}</span><div class="flex justify-between items-center text-[10px] font-normal uppercase opacity-70"><span>Rep: ${t.rep}</span><span class="text-[var(--brand)] font-black whitespace-nowrap">${t.owner}</span></div></div>
                </div>
            `).join('');
            document.getElementById('list-stats').innerText = `${data.length} Records`;
        }

        function loadTicket(id) {
            currentTicketId = id;
            worker.postMessage({ type: 'GET_DETAILS', payload: { id } });
            triggerFilter(); // Re-render list to show active state
        }

        function fillDetails(t, dups) {
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('detail-content').classList.add('flex');
            
            // Text Fields
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-account').innerText = `#${t.account}`;
            document.getElementById('d-so').innerText = `SO# ${t.order}`;
            document.getElementById('d-wh-badge').innerText = t.whs;
            document.getElementById('d-route-badge').innerText = `RT: ${t.route}`;
            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.desc;
            document.getElementById('d-warehouse-input').value = t.whsNotes;
            document.getElementById('d-driver-input').value = t.drvNotes;
            document.getElementById('d-disposition').value = t.status;
            document.getElementById('d-coaching-toggle').checked = t.isCoaching;
            document.getElementById('d-system-guid').innerText = `ID: ${t.guid}`;

            // Rails
            const rail = document.getElementById('account-rail');
            const railContent = document.getElementById('rail-content');
            if(dups.length > 0) {
                rail.classList.add('is-visible');
                railContent.innerHTML = dups.map(d => `<div class="record-card opacity-70" onclick="loadTicket('${d.id}')"><div class="text-[10px] font-bold">#${d.id} - ${d.date}</div><div class="text-[9px]">${d.issue}</div></div>`).join('');
            } else { rail.classList.remove('is-visible'); }

            // Auto Manifest Logic
            if(t.route && spFilesCache.length > 0) {
                const match = spFilesCache.find(f => f.name.includes(t.route));
                if(match) {
                    document.getElementById('manifest-selector').value = match.id;
                    setTab('manifest');
                    loadSelectedManifest();
                } else setTab('form');
            }
        }

        // --- MANIFEST LOGIC ---
        async function pollSharePointFiles() {
            try {
                const res = await fetch(SP_POLL_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: "poll" }) });
                if(res.ok) {
                    const files = await res.json();
                    spFilesCache = files;
                    const sel = document.getElementById('manifest-selector');
                    sel.innerHTML = '<option value="">Select a file...</option>';
                    files.forEach(f => sel.add(new Option(f.name, f.id)));
                }
            } catch(e) {}
        }

        async function loadSelectedManifest() {
            const id = document.getElementById('manifest-selector').value;
            const area = document.getElementById('manifest-display-area');
            if(!id) return;
            area.innerHTML = '<div class="flex h-full items-center justify-center"><i class="fa fa-spinner fa-spin text-2xl text-[var(--brand)]"></i></div>';
            try {
                const res = await fetch(SP_POLL_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: "get_content", id }) });
                if(res.ok) {
                    const buf = await res.arrayBuffer();
                    const wb = XLSX.read(buf, {type:'array'});
                    const html = XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]], { id: 'reader-tbl', editable: false });
                    area.innerHTML = html;
                    area.querySelector('table').className = 'reader-table';
                }
            } catch(e) { area.innerHTML = "Error loading file."; }
        }

        // --- ACTIONS ---
        function setTab(t) {
            document.getElementById('tab-form').className = t==='form' ? "pb-3 border-b-2 border-[var(--brand)] text-[var(--brand)]" : "pb-3 border-b-2 border-transparent text-[var(--text-dim)]";
            document.getElementById('tab-manifest').className = t==='manifest' ? "pb-3 border-b-2 border-[var(--brand)] text-[var(--brand)]" : "pb-3 border-b-2 border-transparent text-[var(--text-dim)]";
            document.getElementById('tab-content-form').style.display = t==='form'?'block':'none';
            document.getElementById('tab-content-manifest').style.display = t==='manifest'?'flex':'none';
        }

        function setMode(m) {
            currentMode = m;
            ['btn-today', 'btn-urgent', 'btn-all'].forEach(id => document.getElementById(id).className = "flex-1 py-1.5 rounded font-black text-[10px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)]");
            if(m!=='assign') document.getElementById(`btn-${m}`).className = "flex-1 py-1.5 rounded font-black text-[10px] uppercase bg-[var(--brand)] text-black shadow-sm";
            
            // View Switcher logic
            document.getElementById('view-container').classList.remove('active');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('detail-content').classList.add('flex');
            document.getElementById('empty-state').classList.remove('hidden'); // Show empty state by default
            
            triggerFilter();
        }

        function changeView(v) {
            if(v === 'list') { setMode('today'); return; }
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('flex');
            document.getElementById('detail-content').classList.add('hidden');
            document.getElementById('view-container').classList.add('active');
            
            if(v === 'map') {
                document.getElementById('view-container').innerHTML = '<div id="map-container"></div>';
                worker.postMessage({ type: 'GET_MAP_DATA' }); // Worker needs to handle this (add handler if missing in truncated)
            } else if (v === 'kanban') {
                document.getElementById('view-container').innerHTML = '<div class="kanban-board">...</div>'; // Simplified placeholder
            }
        }

        function triggerFilter() {
            const search = document.getElementById('global-search').value.toLowerCase();
            const owner = document.getElementById('rep-view-filter').value;
            worker.postMessage({ type: 'FILTER', payload: { search, mode: currentMode, owner } });
        }
        
        let debounceTimer;
        function debounceRender() { clearTimeout(debounceTimer); debounceTimer = setTimeout(triggerFilter, 300); }
        function setTheme(t) { document.body.setAttribute('data-theme', t); }
        
        async function saveRecord() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "SAVING...";
            const payload = { 
                recordId: document.getElementById('d-system-guid').innerText.replace('ID: ',''), 
                disposition: document.getElementById('d-disposition').value,
                warehouseNotes: document.getElementById('d-warehouse-input').value,
                driverNotes: document.getElementById('d-driver-input').value,
                isCoaching: document.getElementById('d-coaching-toggle').checked
            };
            try {
                await fetch(PATCH_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                showToast("Saved");
            } catch(e) { showToast("Save Error", "error"); }
            btn.innerText = "SAVE UPDATE";
        }
    </script>
</body>
</html>
