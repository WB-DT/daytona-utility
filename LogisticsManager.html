<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLeap v1.0 | Bulk & Analytics</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        /* THEME & CORE */
        :root, [data-theme='midnight'] { --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155; --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8; --text-accent: #fbbf24; --border: #334155; --danger: #ef4444; }
        [data-theme='light'] { --bg-deep: #f8fafc; --bg-surface: #ffffff; --bg-card: #f1f5f9; --brand: #0d9488; --text-main: #0f172a; --text-dim: #475569; --text-accent: #b45309; --border: #e2e8f0; --danger: #dc2626; }
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s ease; }
        
        /* LAYOUT */
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        aside#main-gallery { width: 380px; min-width: 380px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; position: relative; }
        
        /* VIEWS */
        #view-container { height: 100%; width: 100%; display: none; overflow: hidden; position: relative; }
        #view-container.active { display: block; }
        #detail-content.active { display: flex; }
        #map-container { width: 100%; height: 100%; z-index: 1; background: #e2e8f0; }

        /* CARDS */
        .record-card { margin: 6px 12px; border-radius: 8px; padding: 10px 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid var(--border); position: relative; }
        .record-card:hover { transform: translateX(4px); background: rgba(0,0,0,0.03); }
        .record-card.active-card { background: var(--brand) !important; border-left-color: var(--text-main) !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .record-card.active-card * { color: #000000 !important; border-color: rgba(0, 0, 0, 0.2) !important; opacity: 1 !important; font-weight: 800; }
        .record-card.stale-ticket { background: rgba(239, 68, 68, 0.05); border-left-color: var(--danger); }

        /* BADGES */
        .time-label-gallery { font-size: 9px; font-weight: 400; color: var(--text-main); opacity: 0.7; letter-spacing: 0.02em; }
        .wh-label { font-size: 10px; font-weight: 900; color: var(--brand); text-transform: uppercase; border: 1px solid var(--brand); padding: 1px 5px; border-radius: 3px; }
        .disp-pill { font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; border: 1px solid currentColor; }
        .issue-card-tag { font-size: 10px; font-weight: 700; color: var(--text-accent); text-transform: uppercase; letter-spacing: 0.5px; }

        /* KANBAN */
        .kanban-board { display: flex; height: 100%; overflow-x: auto; padding: 20px; gap: 20px; }
        .kanban-col { min-width: 300px; background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .kanban-header { padding: 15px; font-weight: 800; border-bottom: 1px solid var(--border); color: var(--brand); text-transform: uppercase; font-size: 12px; }
        .kanban-body { padding: 10px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }

        /* BULK TABLE */
        .bulk-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .bulk-table th { background: var(--bg-surface); position: sticky; top: 0; padding: 12px; text-align: left; color: var(--brand); border-bottom: 2px solid var(--border); font-weight: 800; text-transform: uppercase; z-index: 10; }
        .bulk-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text-main); }
        .bulk-table tr:hover td { background: var(--bg-card); cursor: pointer; }
        .bulk-table tr.selected td { background: rgba(45, 212, 191, 0.1); } /* Highlight selected rows */

        /* RAW DATA GRID */
        .raw-data-grid { display: grid; grid-template-columns: 180px 1fr; gap: 0; font-size: 11px; border-top: 1px solid var(--border); }
        .raw-row { display: contents; }
        .raw-row:nth-child(even) .raw-label, .raw-row:nth-child(even) .raw-value { background-color: rgba(255,255,255,0.02); }
        .raw-label { font-weight: 700; color: var(--text-dim); text-align: right; padding: 6px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); user-select: text; }
        .raw-value { color: var(--text-main); word-break: break-all; padding: 6px 12px; border-bottom: 1px solid var(--border); user-select: text; font-family: 'JetBrains Mono', monospace; }

        /* UTILS */
        .active-filter { border-color: var(--brand) !important; box-shadow: 0 0 0 1px var(--brand); }
        .reader-table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
        .reader-table th { background: var(--bg-card); position: sticky; top: 0; padding: 8px; border-bottom: 2px solid var(--border); border-right: 1px solid var(--border); text-align: left; color: var(--brand); }
        .reader-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); color: var(--text-main); }
        ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #475569; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--text-accent); }
        input:checked + .slider:before { transform: translateX(14px); }

        /* MODALS & OVERLAYS */
        #email-modal-overlay, #coaching-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; }
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 600px; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; pointer-events: none; }
        .toast { pointer-events: auto; min-width: 280px; padding: 16px 20px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); animation: toast-slide 0.3s ease-out; border-left: 4px solid var(--brand); }
        @keyframes toast-slide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        #account-rail { width: 420px; min-width: 420px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 15px 0; display: none; }
        #account-rail.is-visible { display: flex !important; flex-direction: column; }
        
        .custom-check { width: 16px; height: 16px; cursor: pointer; accent-color: var(--brand); }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body data-theme="midnight">

    <div id="toast-container"></div>

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-frog text-2xl text-[var(--brand)]"></i>
                <div class="text-xl font-black uppercase tracking-tighter text-[var(--brand)]">LOGILEAP <span class="text-[10px] opacity-40 ml-1">v1.0</span></div>
            </div>
            
            <div class="h-6 w-px bg-[var(--border)] mx-2"></div>
            
            <div class="flex items-center gap-1">
                <input type="text" id="date-start" placeholder="Start Date" class="w-24 bg-black/5 border border-[var(--border)] p-1.5 text-[10px] rounded text-[var(--text-main)] text-center outline-none focus:border-[var(--brand)]">
                <span class="text-[var(--text-dim)]">-</span>
                <input type="text" id="date-end" placeholder="End Date" class="w-24 bg-black/5 border border-[var(--border)] p-1.5 text-[10px] rounded text-[var(--text-main)] text-center outline-none focus:border-[var(--brand)]">
                <button onclick="clearAllFilters()" class="text-[10px] text-[var(--text-dim)] hover:text-[var(--brand)] ml-1" title="Clear Filters"><i class="fa fa-times"></i></button>
            </div>

            <input type="text" id="global-search" onkeyup="debounceRender()" placeholder="Search company, order, or route..." class="w-56 bg-black/5 border border-[var(--border)] p-2 text-xs rounded text-[var(--text-main)] outline-none focus:border-[var(--brand)] transition-all">
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-black/5 px-3 py-1.5 rounded-full border border-[var(--border)]">
                <span class="text-[8px] font-black uppercase opacity-50 tracking-widest">Admin</span>
                <label class="switch" style="transform: scale(0.8);"><input type="checkbox" id="admin-bypass-toggle"><span class="slider"></span></label>
            </div>
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/5 border border-[var(--border)]">
                <i class="fa fa-user-circle text-[var(--text-dim)]"></i>
                <span id="user-name-text" class="text-[10px] font-bold text-[var(--text-main)]">Guest</span>
            </div>
            <div class="flex items-center gap-2 bg-black/5 p-1.5 rounded-full border border-[var(--border)]">
                <div onclick="setTheme('midnight')" class="w-6 h-6 rounded-full cursor-pointer flex items-center justify-center bg-[#0f172a] text-white"><i class="fa fa-moon text-[10px]"></i></div>
                <div onclick="setTheme('light')" class="w-6 h-6 rounded-full cursor-pointer flex items-center justify-center bg-[#f8fafc] text-[#0f172a]"><i class="fa fa-sun text-[10px]"></i></div>
            </div>
            <div id="sync-indicator"><i id="sync-icon" class="fa fa-circle text-[8px] text-[var(--brand)]"></i></div>
        </div>
    </header>

    <div class="app-container">
        <aside id="main-gallery">
            <div class="p-3 border-b border-[var(--border)] bg-[var(--bg-surface)]">
                <div class="text-[9px] font-black uppercase opacity-50 tracking-widest mb-2 pl-1">Views</div>
                <div class="grid grid-cols-4 gap-1 mb-3">
                    <button onclick="changeView('form')" id="btn-view-form" class="py-1.5 rounded text-[10px] font-black uppercase bg-[var(--brand)] text-black"><i class="fas fa-file-alt"></i></button>
                    <button onclick="changeView('assign')" id="btn-view-assign" class="py-1.5 rounded text-[10px] font-black uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)] hover:text-[var(--brand)]"><i class="fas fa-users-cog"></i></button>
                    <button onclick="changeView('kanban')" id="btn-view-kanban" class="py-1.5 rounded text-[10px] font-black uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)] hover:text-[var(--brand)]"><i class="fas fa-columns"></i></button>
                    <button onclick="changeView('map')" id="btn-view-map" class="py-1.5 rounded text-[10px] font-black uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)] hover:text-[var(--brand)]"><i class="fas fa-map"></i></button>
                </div>
                
                <div class="text-[9px] font-black uppercase opacity-50 tracking-widest mb-2 pl-1">Analytics</div>
                <div class="grid grid-cols-3 gap-1">
                    <button onclick="changeView('reps')" id="btn-view-reps" class="py-1.5 rounded text-[10px] font-black uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)] hover:text-[var(--brand)]">Reps</button>
                    <button onclick="changeView('warehouse')" id="btn-view-warehouse" class="py-1.5 rounded text-[10px] font-black uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)] hover:text-[var(--brand)]">Whs</button>
                    <button onclick="changeView('routes')" id="btn-view-routes" class="py-1.5 rounded text-[10px] font-black uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)] hover:text-[var(--brand)]">Routes</button>
                </div>
            </div>

            <div class="px-3 py-2 flex gap-2 border-b border-[var(--border)]">
                <button onclick="setMode('today')" id="btn-today" class="flex-1 py-1.5 rounded font-black text-[10px] uppercase bg-[var(--brand)] text-black shadow-sm flex items-center justify-center gap-1">Today <span id="count-today" class="bg-black/20 px-1 rounded">0</span></button>
                <button onclick="setMode('urgent')" id="btn-urgent" class="flex-1 py-1.5 rounded font-black text-[10px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)] flex items-center justify-center gap-1">Urgent <span id="count-urgent" class="bg-black/20 px-1 rounded">0</span></button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-1.5 rounded font-black text-[10px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)] flex items-center justify-center gap-1">All <span id="count-all" class="bg-black/20 px-1 rounded">0</span></button>
            </div>

            <div id="ticket-list" class="overflow-y-auto flex-grow custom-scroll p-2"></div>
            <div class="p-2 text-[9px] text-center opacity-30 uppercase font-mono border-t border-[var(--border)] flex justify-between items-center">
                <span id="list-stats">0 Records</span>
                <button onclick="exportData()" class="hover:text-[var(--brand)]"><i class="fas fa-download"></i></button>
            </div>
        </aside>

        <main id="main-scroller">
            
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10 text-[var(--text-dim)] h-full">
                <i class="fa-solid fa-frog text-9xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select a Record</p>
            </div>

            <div id="view-container"></div>

            <div id="detail-content" class="hidden flex-grow flex-col h-full overflow-hidden">
                <div class="flex-shrink-0 bg-[var(--bg-surface)] border-b border-[var(--border)] px-8 pt-6 pb-0">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <div class="flex items-baseline gap-3 mb-1">
                                <h2 id="d-company" class="text-[var(--text-main)] uppercase tracking-tight text-2xl font-extrabold leading-none"></h2>
                                <span id="d-account" class="text-xs font-bold opacity-40 uppercase tracking-widest"></span>
                            </div>
                            <div class="flex items-center gap-3 text-[var(--text-dim)] text-xs">
                                <i class="fa fa-location-dot text-[var(--brand)]"></i>
                                <span id="d-shipping-address"></span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <div class="flex gap-2">
                                <button onclick="navTicket(-1)" class="w-8 h-8 rounded-full border border-[var(--border)] hover:bg-[var(--brand)] hover:text-black transition flex items-center justify-center"><i class="fas fa-chevron-left"></i></button>
                                <button onclick="navTicket(1)" class="w-8 h-8 rounded-full border border-[var(--border)] hover:bg-[var(--brand)] hover:text-black transition flex items-center justify-center"><i class="fas fa-chevron-right"></i></button>
                            </div>
                            <div class="text-xs font-mono font-bold text-[var(--text-accent)]" id="d-so"></div>
                        </div>
                    </div>
                    <div class="flex gap-6 text-xs font-black uppercase tracking-widest">
                        <button onclick="setTab('form')" id="tab-form" class="pb-3 border-b-2 border-[var(--brand)] text-[var(--brand)]">Details</button>
                        <button onclick="setTab('manifest')" id="tab-manifest" class="pb-3 border-b-2 border-transparent text-[var(--text-dim)] hover:text-[var(--text-main)]">Manifests</button>
                        <button onclick="setTab('sys')" id="tab-sys" class="pb-3 border-b-2 border-transparent text-[var(--text-dim)] hover:text-[var(--text-main)]">System Data</button>
                    </div>
                </div>

                <div id="tab-content-form" class="flex-grow overflow-y-auto custom-scroll p-8 space-y-8">
                    <div class="grid grid-cols-3 gap-6">
                        <div class="col-span-2 bg-black/5 border-l-4 border-[var(--text-accent)] p-6 rounded-r-lg">
                            <label id="d-issue-label" class="text-[10px] font-black text-[var(--text-accent)] uppercase block mb-2 tracking-wider"></label>
                            <p id="d-description" class="font-medium text-[var(--text-main)] text-sm leading-relaxed"></p>
                        </div>
                        <div class="col-span-1 space-y-4">
                            <div>
                                <label class="text-[10px] font-black uppercase opacity-40 block mb-1">Disposition</label>
                                <select id="d-disposition" onchange="autoSaveDisposition()" class="w-full bg-[var(--bg-card)] border border-[var(--border)] text-xs font-bold text-[var(--brand)] p-2 rounded outline-none focus:border-[var(--brand)]">
                                    <option value="">Select...</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Working on">Working on</option>
                                    <option value="Escalated">Escalated</option>
                                    <option value="Sent Back">Sent Back</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-black uppercase opacity-40 block mb-1">Assigned To</label>
                                <select id="d-logistics-owner" class="w-full bg-[var(--bg-card)] border border-[var(--border)] text-xs font-bold text-[var(--text-main)] p-2 rounded outline-none">
                                    <option value="Unassigned">Unassigned</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-3 bg-black/10 px-3 py-2 rounded border border-[var(--border)]">
                                <span class="text-[9px] font-black uppercase tracking-widest text-[var(--text-accent)] flex-grow">Coaching?</span>
                                <label class="switch" style="transform:scale(0.8)"><input type="checkbox" id="d-coaching-toggle" onchange="handleCoachingToggle()"><span class="slider"></span></label>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-8">
                        <div class="flex flex-col gap-2">
                            <label class="text-[10px] font-black uppercase opacity-50 tracking-widest">Warehouse Notes</label>
                            <textarea id="d-warehouse-input" class="h-40 bg-black/5 border border-[var(--border)] p-3 rounded text-xs outline-none focus:border-[var(--brand)] text-[var(--text-main)]"></textarea>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-[10px] font-black uppercase opacity-50 tracking-widest">Driver Feedback</label>
                            <textarea id="d-driver-input" class="h-40 bg-black/5 border border-[var(--border)] p-3 rounded text-xs outline-none focus:border-[var(--brand)] text-[var(--text-main)]"></textarea>
                        </div>
                    </div>

                    <div class="flex gap-4 pt-4 border-t border-[var(--border)]">
                        <button onclick="openWarehouseEmail()" class="flex-1 py-4 border-2 border-[var(--text-accent)] text-[var(--text-accent)] rounded font-black uppercase text-xs hover:bg-[var(--text-accent)] hover:text-white transition-all">Email Warehouse</button>
                        <button onclick="openDraftModal()" class="flex-1 py-4 border-2 border-[var(--brand)] text-[var(--brand)] rounded font-black uppercase text-xs hover:bg-[var(--brand)] hover:text-white transition-all">Email Rep</button>
                        <button id="save-btn" onclick="saveRecord()" class="flex-[1.5] py-4 bg-[var(--brand)] text-black rounded font-black uppercase text-xs tracking-[0.2em] hover:brightness-110 shadow-lg transition-all">Save Update</button>
                    </div>
                    <div id="d-system-guid" class="hidden"></div>
                </div>

                <div id="tab-content-manifest" class="hidden flex-grow flex-col overflow-hidden bg-black/5">
                    <div class="flex items-center gap-2 p-3 border-b border-[var(--border)] bg-[var(--bg-surface)]">
                        <select id="manifest-selector" class="flex-grow text-xs bg-[var(--bg-card)] border border-[var(--border)] rounded p-2 text-[var(--text-main)] outline-none"><option value="">Select a file...</option></select>
                        <button onclick="loadSelectedManifest()" class="px-4 py-2 bg-[var(--text-accent)] text-black font-bold text-xs rounded hover:brightness-110">LOAD</button>
                    </div>
                    <div id="manifest-display-area" class="flex-grow overflow-auto custom-scroll p-4"></div>
                </div>

                <div id="tab-content-sys" class="hidden flex-grow overflow-auto custom-scroll p-0">
                    <div id="f-raw-grid" class="raw-data-grid"></div>
                </div>
            </div>
        </main>

        <aside id="account-rail">
            <h3 class="text-[10px] font-black uppercase tracking-widest text-[var(--danger)] p-3 border-b border-[var(--border)] text-center">Duplicate Orders</h3>
            <div id="rail-content" class="overflow-y-auto custom-scroll p-2"></div>
        </aside>
    </div>

    <div id="coaching-modal-overlay"><div class="modal-container"><div class="bg-black/5 p-5 border-b border-[var(--border)] flex justify-between"><span class="font-black uppercase text-xs text-[var(--text-accent)]">Coaching</span><button onclick="closeCoachingModal()"><i class="fa fa-times"></i></button></div><div class="p-6"><textarea id="coaching-feedback-input" class="w-full bg-black/5 p-4 rounded text-sm text-[var(--text-main)] border border-[var(--border)] min-h-[150px]"></textarea></div><div class="p-6"><button onclick="saveCoachingFeedback()" class="w-full py-3 bg-[var(--text-accent)] text-black font-bold rounded text-xs">SAVE</button></div></div></div>

    <script id="worker-script" type="javascript/worker">
        const ZIP_MAP = {'000':[39.8,-98.6]};
        let db = []; let filteredDB = []; let orderCounts = {};

        const val = (obj, k) => { if(!obj) return ""; const keys=Object.keys(obj); const clean=keys.reduce((a,b)=>{a[b.toLowerCase().replace(/[^a-z0-9]/g,'')]=b;return a},{}); for(let i of k){let c=i.toLowerCase().replace(/[^a-z0-9]/g,'');if(clean[c])return obj[clean[c]];} return ""; };
        const safeDate = (v) => { if(!v) return "N/A"; if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400000)); return d.toISOString().split('T')[0];} return String(v).substring(0,10); };
        const toProperCase = (str) => { if(!str || typeof str !== 'string') return str; return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase()); };

        self.onmessage = function(e) {
            const { type, payload } = e.data;
            if (type === 'PARSE') {
                db = payload.data.map(r => {
                    const dateStr = safeDate(val(r,['createdon','date']));
                    const rawOwner = val(r,['cr714_logisticsowner','owner']);
                    const rawData = {};
                    for(let k in r) { if(k.startsWith('cr714_') || k==='createdon') rawData[k] = r[k]; }
                    return {
                        id: val(r,['cr714_ticket','id']),
                        guid: (val(r,['cr714_logisticslog_2id'])||'').replace(/[{}]/g,''),
                        order: String(val(r,['cr714_salesordernumber','sales_order'])).trim()||'N/A',
                        company: val(r,['cr714_companyordeliveryname','company']),
                        account: val(r,['cr714_accountnumber','account']),
                        address: val(r,['cr714_shippingaddress','address']),
                        rep: val(r,['cr714_rep','rep']),
                        repEmail: val(r,['cr714_repemail']),
                        owner: toProperCase(rawOwner)||'Unassigned',
                        driver: val(r,['cr714_drivernamenumber','driver']),
                        status: val(r,['cr714_disposition','disposition'])||'Pending',
                        issue: val(r,['cr714_issue','issue']),
                        desc: val(r,['cr714_description','description']),
                        whs: val(r,['cr714_warehouse','warehouse']),
                        route: val(r,['cr714_route','route']),
                        whsNotes: val(r,['cr714_receivedemailfromwarehousenotes']),
                        drvNotes: val(r,['cr714_receivedtextfromdrivernotes']),
                        date: dateStr,
                        zip3: val(r,['cr714_shippingaddress']).match(/\b\d{5}/)?val(r,['cr714_shippingaddress']).match(/\b\d{5}/)[0].substring(0,3):'000',
                        isCoaching: val(r,['cr714_coachingopportunity'])===true,
                        isUrgent: (val(r,['desc','cr714_description'])+val(r,['issue'])).toLowerCase().match(/urgent|asap|refused/)?true:false,
                        raw: rawData
                    };
                });
                orderCounts = db.reduce((acc, t) => { if(t.order!=='N/A') acc[t.order]=(acc[t.order]||0)+1; return acc; }, {});
                filteredDB = db; // Init
                const owners = [...new Set(db.map(x=>x.owner).filter(x=>x))].sort();
                self.postMessage({ type: 'INIT', owners });
            }
            else if (type === 'FILTER') {
                const { search, mode, dateStart, dateEnd } = payload;
                filteredDB = db.filter(t => {
                    const matchSearch = (t.order+t.company+t.account+t.issue+t.route).toLowerCase().includes(search);
                    const isFinished = t.status==='Completed' || t.status==='Sent Back';
                    const modeMatch = mode==='active' ? !isFinished : (mode==='urgent' ? t.isUrgent && !isFinished : (mode==='today' ? t.date===new Date().toISOString().split('T')[0] : true));
                    let dateMatch = true;
                    if(dateStart && dateEnd) { const tDate = new Date(t.date); dateMatch = tDate >= new Date(dateStart) && tDate <= new Date(dateEnd); }
                    return matchSearch && modeMatch && dateMatch;
                }).sort((a,b) => b.timestamp - a.timestamp);
                
                const counts = { today: db.filter(t => t.date===new Date().toISOString().split('T')[0]).length, urgent: db.filter(t => t.isUrgent && t.status!=='Completed').length, all: db.length };
                const final = filteredDB.map(f => {
                    const isStale = (new Date().getTime() - new Date(f.date).getTime()) > (3*86400000) && f.status !== 'Completed';
                    return {...f, isDup: orderCounts[f.order]>1, isStale};
                });
                self.postMessage({ type: 'RENDER', data: final, counts: counts });
            }
            else if (type === 'GET_KANBAN') {
                const cols = {'Pending':[], 'Working on':[], 'Escalated':[], 'Completed':[]};
                filteredDB.forEach(t => { if(cols[t.status]) cols[t.status].push(t); });
                self.postMessage({ type: 'KANBAN', cols });
            }
            else if (type === 'GET_GRID') { self.postMessage({ type: 'GRID', data: filteredDB.slice(0, 100) }); }
            else if (type === 'GET_MAP') { self.postMessage({ type: 'MAP', data: filteredDB.filter(t=>t.status!=='Completed') }); }
            else if (type === 'GET_REPS') { const r={}; filteredDB.forEach(t=>{r[t.owner]=(r[t.owner]||0)+1}); self.postMessage({type:'SCORE', data:Object.entries(r).sort((a,b)=>b[1]-a[1]), kind:'Rep'}); }
            else if (type === 'GET_WHS') { const w={}; filteredDB.forEach(t=>{w[t.whs]=(w[t.whs]||0)+1}); self.postMessage({type:'SCORE', data:Object.entries(w).sort((a,b)=>b[1]-a[1]), kind:'Warehouse'}); }
            else if (type === 'GET_ROUTES') { const rt={}; filteredDB.forEach(t=>{rt[t.route]=(rt[t.route]||0)+1}); self.postMessage({type:'SCORE', data:Object.entries(rt).sort((a,b)=>b[1]-a[1]), kind:'Route'}); }
            else if (type === 'GET_DETAILS') {
                const t = db.find(x => x.id === payload.id);
                const dups = db.filter(x => x.order === t.order && x.id !== t.id);
                self.postMessage({ type: 'DETAILS', ticket: t, dups: dups });
            }
            else if (type === 'NAV') {
                const idx = filteredDB.findIndex(x => x.id === payload.curr);
                if(idx !== -1) {
                    const next = idx + payload.dir;
                    if(next >= 0 && next < filteredDB.length) self.postMessage({ type: 'DETAILS', ticket: filteredDB[next], dups: [] });
                }
            }
            else if (type === 'EXPORT') {
                const cleanData = payload.data.map(t => {
                    const row = { ...t.raw };
                    Object.keys(row).forEach(k => { if (k.includes('date') && typeof row[k] === 'string') row[k] = new Date(row[k]); });
                    return row;
                });
                self.postMessage({ type: 'EXPORT_READY', data: cleanData });
            }
        };
    </script>

    <script>

        let currentTicketId = null; let currentMode = 'today'; let currentView = 'form';
        let spFilesCache = []; let dateStartPicker, dateEndPicker;
        let selectedForBulk = new Set();

        const NAME_MAP = { "Kari": "Kari Westervelt", "Holly": "Holly Evans", "Courtney": "Courtney Youngblood", "Jewel": "Jewel Jenkins", "Noah": "Noah Comans", "Wayne": "Wayne Rendt", "Rachel": "Rachel Kaiser", "Tobbitha": "Tobbitha Bishoff", "Paula": "Paula Bowen", "Jessica": "Jessica Pauley" };

        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';
        const SAVE_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY';
        const SP_POLL_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/36fb43cdfdc7468caa8ab8a030ae37c4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hIs9EOaXqy3U3R9_HO4K7fe0_XrSgYBhoUF1bZRPoCg';
        const WHO_AM_I_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fc61b0b591f24294841ec47fec4f0847/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=AqdBT1sD9_julTEREy3N72UYG-1jy0onI28bYeJbhYo';
        const SEND_EMAIL_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5473f5a058f344eaaf1d5c2544baf437/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=qgC3_5VOBOQ3U_IfsvdIcOGyhUQC98oU2-wGbvmejvQ';
        const AUTO_SAVE_DISPO_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/1cdc16c265da48648590c7f1b6107d22/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=LrOReLW2EG-VYn88_RgVr5TpTZr2IrU1FkTu-jXg9mE';
        const SAVE_COACHING_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/6afccf18907044be84f3e5e730791862/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PocwedtZlC03FH-FJhfj1_Cj_dVaYUmQMddL4XpvdMI';

        window.onload = () => { 
            dateStartPicker = flatpickr("#date-start", { onChange: triggerFilter });
            dateEndPicker = flatpickr("#date-end", { onChange: triggerFilter });
            fetchData(); identifyUser(); pollSharePointFiles(); 
            Object.values(NAME_MAP).forEach(n => document.getElementById('d-logistics-owner').add(new Option(n,n)));
            document.addEventListener('keydown', (e) => {
                if(currentTicketId && !document.querySelector('textarea:focus') && !document.querySelector('input:focus')) {
                    if(e.key === 'ArrowRight') navTicket(1);
                    if(e.key === 'ArrowLeft') navTicket(-1);
                }
            });
        };

        async function fetchData() {
            document.getElementById('sync-icon').className = "fa fa-sync fa-spin text-[var(--brand)]";
            try {
                const response = await fetch(HISTORY_URL, { method: 'POST' });
                const data = await response.json();
                if (data && data.value) {
                    worker.postMessage({ type: 'PARSE', payload: { data: data.value } });
                    setTimeout(() => setMode('today'), 100);
                }
            } catch (e) { console.error("Sync Error:", e); }
            setTimeout(() => document.getElementById('sync-icon').className = "fa fa-circle text-[var(--brand)]", 1500);
        }

        worker.onmessage = (e) => {
            const { type, data, ticket, dups, cols, kind, counts } = e.data;
            if (type === 'RENDER') {
                renderList(data);
                if(counts) {
                    document.getElementById('count-today').innerText = counts.today;
                    document.getElementById('count-urgent').innerText = counts.urgent;
                    document.getElementById('count-all').innerText = counts.all;
                }
                // Refresh active analytics or grid if in that view
                if(currentView === 'grid') worker.postMessage({ type: 'GET_GRID' });
                else if(currentView === 'assign') renderBulkTable(data);
                else if(['reps','warehouse','routes'].includes(currentView)) worker.postMessage({type: 'GET_'+currentView.toUpperCase().substring(0,3)});
            }
            else if (type === 'DETAILS') fillDetails(ticket, dups);
            else if (type === 'KANBAN') renderKanban(cols);
            else if (type === 'GRID') renderGrid(data);
            else if (type === 'MAP') renderMap(data);
            else if (type === 'SCORE') renderScoreboard(data, kind);
            else if (type === 'EXPORT_READY') {
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "LogiLog Export");
                XLSX.writeFile(wb, `LogiLog_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
            }
        };

        function renderList(data) {
            const list = document.getElementById('ticket-list');
            window.currentListData = data;
            list.innerHTML = data.map(t => `
                <div class="record-card ${currentTicketId === t.id ? 'active-card' : ''} ${t.isStale?'stale-ticket':''}" onclick="loadTicket('${t.id}')">
                    <div class="flex justify-between items-center mb-1"><span class="id-badge-ghost">#${t.id}</span><div class="flex gap-2 items-center"><span class="time-label-gallery">${t.date}</span><span class="wh-label">${t.whs}</span></div></div>
                    <div class="truncate font-extrabold uppercase text-[13px] mb-0.5">${t.company}</div>
                    <div class="flex justify-between items-center mt-1"><span class="font-mono font-bold ${t.isDup ? 'text-[var(--danger)]' : ''}">#${t.order}</span><span class="disp-pill" style="color:${t.status==='Pending'?'var(--text-accent)':'var(--brand)'}">${t.status}</span></div>
                    <div class="mt-2 flex flex-col gap-1 border-t border-[var(--border)] pt-2"><span class="issue-card-tag truncate pr-2">${t.issue}</span><div class="flex justify-between items-center text-[10px] font-normal uppercase opacity-70"><span>Rep: ${t.rep}</span><span class="text-[var(--brand)] font-black whitespace-nowrap">${t.owner}</span></div></div>
                </div>
            `).join('');
            document.getElementById('list-stats').innerText = `${data.length} Records`;
        }

        // --- BULK TABLE ---
        function renderBulkTable(data) {
            const options = Object.values(NAME_MAP).map(n => `<option value="${n}">${n}</option>`).join('');
            const header = `
                <div class="sticky top-0 z-20 bg-[var(--bg-surface)] border-b border-[var(--border)] p-4 flex gap-4 items-center shadow-md">
                    <select id="bulk-rep" class="bg-black/5 border border-[var(--border)] p-2 rounded text-xs text-[var(--text-main)] outline-none"><option value="">Select Rep...</option>${options}</select>
                    <button onclick="executeBulkAssign()" class="px-4 py-2 bg-[var(--brand)] text-black font-bold text-xs rounded hover:brightness-110">ASSIGN SELECTED</button>
                    <button onclick="executeDistribute()" class="px-4 py-2 border border-[var(--border)] text-[var(--text-dim)] font-bold text-xs rounded hover:text-[var(--brand)]">DISTRIBUTE EVENLY</button>
                    <div class="ml-auto text-xs font-bold text-[var(--text-accent)]" id="bulk-count">0 Selected</div>
                </div>`;
            
            const rows = data.map(t => {
                const checked = selectedForBulk.has(t.id) ? 'checked' : '';
                return `<tr class="${checked?'selected':''}" onclick="toggleBulk('${t.id}', this)">
                    <td class="text-center"><input type="checkbox" class="custom-check" ${checked}></td>
                    <td>${t.id}</td><td>${t.company}</td><td class="font-mono">${t.order}</td><td>${t.route}</td><td>${t.issue}</td><td>${t.owner}</td>
                </tr>`;
            }).join('');

            document.getElementById('view-container').innerHTML = `
                <div class="flex flex-col h-full">
                    ${header}
                    <div class="flex-grow overflow-auto custom-scroll">
                        <table class="bulk-table"><thead><tr><th class="w-10"><input type="checkbox" class="custom-check" onclick="toggleSelectAll(this)"></th><th>ID</th><th>Customer</th><th>Order</th><th>Route</th><th>Issue</th><th>Owner</th></tr></thead><tbody>${rows}</tbody></table>
                    </div>
                </div>`;
            updateBulkCount();
        }

        function toggleBulk(id, tr) {
            if(selectedForBulk.has(id)) { selectedForBulk.delete(id); } else { selectedForBulk.add(id); }
            if(tr) {
                const cb = tr.querySelector('input');
                cb.checked = !cb.checked;
                tr.classList.toggle('selected');
            }
            updateBulkCount();
        }

        function toggleSelectAll(cb) {
            if(cb.checked) { window.currentListData.forEach(t => selectedForBulk.add(t.id)); }
            else { selectedForBulk.clear(); }
            renderBulkTable(window.currentListData);
        }

        function updateBulkCount() {
            const el = document.getElementById('bulk-count');
            if(el) el.innerText = `${selectedForBulk.size} Selected`;
        }

        async function executeBulkAssign() {
            const rep = document.getElementById('bulk-rep').value;
            if(!rep || selectedForBulk.size === 0) { showToast("Select Rep & Tickets", "error"); return; }
            for (const id of selectedForBulk) { await saveLocalParams(id, { owner: rep }); }
            showToast("Bulk Assign Complete"); selectedForBulk.clear(); triggerFilter();
        }

        async function executeDistribute() {
            if(selectedForBulk.size === 0) { showToast("No tickets", "error"); return; }
            const reps = Object.values(NAME_MAP); const ids = Array.from(selectedForBulk);
            let idx = 0;
            for(const id of ids) { await saveLocalParams(id, { owner: reps[idx % reps.length] }); idx++; }
            showToast("Distributed"); selectedForBulk.clear(); triggerFilter();
        }

        async function saveLocalParams(id, changes) {
            return new Promise(resolve => {
                const tempWorker = new Worker(URL.createObjectURL(new Blob([document.getElementById('worker-script').textContent], { type: "text/javascript" })));
                tempWorker.onmessage = async (e) => {
                    if(e.data.type === 'DETAILS') {
                        const t = e.data.ticket;
                        const finalPayload = { 
                            recordId: t.guid, disposition: changes.status || t.status, warehouseNotes: t.whsNotes, driverNotes: t.drvNotes, isCoaching: t.isCoaching, owner: changes.owner || t.owner
                        };
                        await fetch(SAVE_FLOW_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(finalPayload) });
                        resolve(); tempWorker.terminate();
                    }
                };
                tempWorker.postMessage({ type: 'PARSE', payload: { data: db } });
                tempWorker.postMessage({ type: 'GET_DETAILS', payload: { id } });
            });
        }

        // --- CORE FUNCTIONS ---
        function loadTicket(id) { currentTicketId = id; worker.postMessage({ type: 'GET_DETAILS', payload: { id } }); }
        function navTicket(dir) { worker.postMessage({ type: 'NAV', payload: { curr: currentTicketId, dir } }); }

        function fillDetails(t, dups) {
            document.getElementById('empty-state').classList.add('hidden');

            document.getElementById('d-driver-info').innerText = t.driver;
            document.getElementById('d-submit-rep').innerText = t.rep;

            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.desc;
            document.getElementById('d-warehouse-input').value = t.whsNotes;
            document.getElementById('d-driver-input').value = t.drvNotes;
            document.getElementById('d-disposition').value = t.status;
            document.getElementById('d-coaching-toggle').checked = t.isCoaching;
            document.getElementById('d-system-guid').innerText = t.guid;

            // System Raw Grid
            const rawGrid = document.getElementById('f-raw-grid');
            rawGrid.innerHTML = "";
            if(t.raw) {
                Object.keys(t.raw).sort().forEach(k => {
                    rawGrid.innerHTML += `<div class="raw-row"><div class="raw-label">${k}</div><div class="raw-value">${t.raw[k]}</div></div>`;

            } else { rail.classList.remove('is-visible'); }

            if(t.route && spFilesCache.length > 0) {
                const match = spFilesCache.find(f => f.name.includes(t.route));
                if(match) { document.getElementById('manifest-selector').value = match.id; setTab('manifest'); loadSelectedManifest(); }
                else setTab('form');
            } else setTab('form');
        }

        function changeView(v) {
            currentView = v;
            ['btn-view-form','btn-view-grid','btn-view-kanban','btn-view-map','btn-view-reps','btn-view-warehouse','btn-view-routes','btn-view-assign'].forEach(b => { 
                const el = document.getElementById(b); if(el) el.className = "py-1.5 rounded text-[10px] font-black uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)] hover:text-[var(--brand)]"; 
            });
            document.getElementById(`btn-view-${v}`).className = "py-1.5 rounded text-[10px] font-black uppercase bg-[var(--brand)] text-black";
            
            document.getElementById('view-container').innerHTML = "";
            document.getElementById('detail-content').classList.remove('flex');
            document.getElementById('detail-content').classList.add('hidden');
            document.getElementById('view-container').classList.add('active');

            if(v === 'form') {
                document.getElementById('view-container').classList.remove('active');
                if(currentTicketId) loadTicket(currentTicketId);
                else document.getElementById('empty-state').classList.remove('hidden');
            } else if (v === 'kanban') worker.postMessage({ type: 'GET_KANBAN' });
            else if (v === 'grid') worker.postMessage({ type: 'GET_GRID' });
            else if (v === 'map') worker.postMessage({ type: 'GET_MAP' });
            else if (v === 'assign') renderBulkTable(window.currentListData);
            else if (['reps','warehouse','routes'].includes(v)) {
                let k = 'Rep'; if(v==='warehouse') k='Warehouse'; if(v==='routes') k='Route';
                // Trigger worker for specific type but ensure we map view name to worker type
                const typeMap = { 'reps': 'GET_REPS', 'warehouse': 'GET_WHS', 'routes': 'GET_ROUTES' };
                worker.postMessage({ type: typeMap[v] });
            }
        }

        function renderKanban(cols) {
            const html = Object.keys(cols).map(k => `<div class="kanban-col"><div class="kanban-header">${k} (${cols[k].length})</div><div class="kanban-body">${cols[k].map(t=>`<div class="kanban-card" onclick="loadTicket('${t.id}')"><div class="font-bold text-xs">#${t.id} ${t.company}</div><div class="text-[10px] font-mono opacity-70">${t.order}</div><div class="text-[10px] opacity-70">${t.issue}</div></div>`).join('')}</div></div>`).join('');
            document.getElementById('view-container').innerHTML = `<div class="kanban-board">${html}</div>`;
        }

        function renderGrid(data) {
            const keys = ['id','company','order','status','owner','date'];
            const cols = keys.filter(k => visibleCols[k]);
            const btn = `<button onclick="toggleGridCols()" class="absolute top-2 right-2 bg-[var(--brand)] text-black px-3 py-1 rounded text-xs font-bold z-20"><i class="fa fa-cog"></i> Columns</button>`;
            const html = `<table class="grid-table"><thead><tr>${cols.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${data.map(t=>`<tr onclick="loadTicket('${t.id}')">${cols.map(k=>`<td>${t[k]}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
            document.getElementById('view-container').innerHTML = `<div class="overflow-auto h-full">${btn}${html}</div>`;
        }

        function toggleGridCols() {
            const p = prompt("Enter columns (comma separated): id, company, order, status, owner, date", Object.keys(visibleCols).filter(k=>visibleCols[k]).join(','));
            if(p) { Object.keys(visibleCols).forEach(k => visibleCols[k] = false); p.split(',').forEach(s => visibleCols[s.trim()] = true); changeView('grid'); }
        }

        function renderMap(data) {
            document.getElementById('view-container').innerHTML = '<div id="map-container"></div>';
            setTimeout(() => {
                const map = L.map('map-container').setView([39.8,-98.6],4);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
                data.forEach(t => { if(t.zip3 !== '000') L.circleMarker([ZIP_MAP['000'][0], ZIP_MAP['000'][1]], {color:'#2dd4bf', radius:5}).addTo(map).bindTooltip(`#${t.id}: ${t.company}`); });
                map.invalidateSize();
            }, 100);
        }

        function renderScoreboard(data, kind) {
            const chartId = `chart-${kind}`;
            document.getElementById('view-container').innerHTML = `<div class="p-8 h-full"><h2 class="text-2xl font-black mb-4 uppercase text-[var(--text-accent)]">${kind} Analytics</h2><div class="h-[80%] bg-[var(--bg-surface)] rounded-xl border border-[var(--border)] p-4"><canvas id="${chartId}"></canvas></div></div>`;
            setTimeout(() => {
                new Chart(document.getElementById(chartId), {
                    type: 'bar',
                    data: {
                        labels: data.map(d=>d[0]),
                        datasets: [{ label: 'Count', data: data.map(d=>d[1]), backgroundColor: '#2dd4bf' }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { grid: { display: false } } } }
                });
            }, 50);
        }

        function setMode(m) {
            ['btn-today','btn-urgent','btn-all'].forEach(b=>document.getElementById(b).className="flex-1 py-1.5 rounded font-black text-[10px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)]");
            document.getElementById(`btn-${m}`).className="flex-1 py-1.5 rounded font-black text-[10px] uppercase bg-[var(--brand)] text-black shadow-sm";
            triggerFilter();
        }

        function triggerFilter() {
            const search = document.getElementById('global-search').value.toLowerCase();
            const dS = dateStartPicker.selectedDates[0];
            const dE = dateEndPicker.selectedDates[0];
            worker.postMessage({ type: 'FILTER', payload: { search, mode: currentMode, dateStart: dS, dateEnd: dE } });
        }

        function exportData() { if(window.currentListData) worker.postMessage({ type: 'EXPORT', payload: { data: window.currentListData } }); }
        function debounceRender() { clearTimeout(null); setTimeout(triggerFilter, 300); }
        function setTab(t) { document.getElementById('tab-form').className = t==='form' ? "pb-3 border-b-2 border-[var(--brand)] text-[var(--brand)]" : "pb-3 border-b-2 border-transparent text-[var(--text-dim)]"; document.getElementById('tab-manifest').className = t==='manifest' ? "pb-3 border-b-2 border-[var(--brand)] text-[var(--brand)]" : "pb-3 border-b-2 border-transparent text-[var(--text-dim)]"; document.getElementById('tab-sys').className = t==='sys' ? "pb-3 border-b-2 border-[var(--brand)] text-[var(--brand)]" : "pb-3 border-b-2 border-transparent text-[var(--text-dim)]"; document.getElementById('tab-content-form').style.display = t==='form'?'block':'none'; document.getElementById('tab-content-manifest').style.display = t==='manifest'?'flex':'none'; document.getElementById('tab-content-sys').style.display = t==='sys'?'block':'none'; }
        async function identifyUser() { try { const r = await fetch(WHO_AM_I_URL, {method:'POST'}); const d = await r.json(); if(d.displayName) document.getElementById('user-name-text').innerText=d.displayName; } catch(e){} }
        function showToast(msg, type='success') { const c = document.getElementById('toast-container'); const t = document.createElement('div'); t.className = `toast ${type==='error'?'border-l-red-500':'border-l-teal-400'}`; t.innerHTML = `<span>${msg}</span>`; c.appendChild(t); setTimeout(() => t.remove(), 3000); }
        async function saveRecord() { const btn = document.getElementById('save-btn'); btn.innerText = "SAVING..."; const payload = { recordId: document.getElementById('d-system-guid').innerText, disposition: document.getElementById('d-disposition').value, warehouseNotes: document.getElementById('d-warehouse-input').value, driverNotes: document.getElementById('d-driver-input').value, isCoaching: document.getElementById('d-coaching-toggle').checked, owner: document.getElementById('d-logistics-owner').value }; try { await fetch(SAVE_FLOW_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }); showToast("Saved"); } catch(e) { showToast("Error", "error"); } btn.innerText = "SAVE UPDATE"; }
        async function autoSaveDisposition() { const newDispo = document.getElementById('d-disposition').value; const guid = document.getElementById('d-system-guid').innerText; try { await fetch(AUTO_SAVE_DISPO_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ recordId: guid, disposition: newDispo }) }); showToast(`Status: ${newDispo}`); } catch(e) {} }
        async function saveCoachingFeedback() { const guid = document.getElementById('d-system-guid').innerText; const notes = document.getElementById('coaching-feedback-input').value; try { await fetch(SAVE_COACHING_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ recordId: guid, isCoaching: true, coachingNotes: notes }) }); showToast("Coaching Logged"); document.getElementById('coaching-modal-overlay').style.display = 'none'; } catch(e) { showToast("Error", "error"); } }
        function openDraftModal() { document.getElementById('email-modal-overlay').style.display='flex'; }
        function closeDraftModal() { document.getElementById('email-modal-overlay').style.display='none'; }
        function closeCoachingModal() { document.getElementById('coaching-modal-overlay').style.display='none'; }
        function handleCoachingToggle() { if(document.getElementById('d-coaching-toggle').checked) document.getElementById('coaching-modal-overlay').style.display='flex'; }
        async function pollSharePointFiles() { try { const res = await fetch(SP_POLL_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: "poll" }) }); if(res.ok) { const files = await res.json(); spFilesCache = files; const sel = document.getElementById('manifest-selector'); sel.innerHTML = '<option value="">Select a file...</option>'; files.forEach(f => sel.add(new Option(f.name, f.id))); } } catch(e) {} }
        async function loadSelectedManifest() { const id = document.getElementById('manifest-selector').value; const area = document.getElementById('manifest-display-area'); if(!id) return; area.innerHTML = '<div class="flex h-full items-center justify-center"><i class="fa fa-spinner fa-spin text-2xl text-[var(--brand)]"></i></div>'; try { const res = await fetch(SP_POLL_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: "get_content", id }) }); if(res.ok) { const buf = await res.arrayBuffer(); const wb = XLSX.read(buf, {type:'array'}); const html = XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]], { id: 'reader-tbl', editable: false }); area.innerHTML = html; area.querySelector('table').className = 'reader-table'; } } catch(e) { area.innerHTML = "Error loading file."; } }
        async function sendViaFlow() { const payload = { recordId: document.getElementById('d-system-guid').innerText, to: document.getElementById('m-to-address').value, subject: document.getElementById('m-subject').value, body: document.getElementById('m-body').value.replace(/\n/g, '<br>') }; try { await fetch(SEND_EMAIL_FLOW_URL, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }); showToast("Email Sent"); closeDraftModal(); } catch(e) { showToast("Send Failed", "error"); } }
        function setTheme(t) { document.body.setAttribute('data-theme', t); }
        function clearAllFilters() { document.getElementById('global-search').value = ""; dateStartPicker.clear(); dateEndPicker.clear(); setMode('today'); }
    </script>
</body>
</html>
