<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.C.T. 1.0</title>
    
    <script>
        window.tailwind = {
            config: {
                theme: { 
                    extend: {
                        colors: {
                            gray: { 50: '#f9fafb', 100: '#f3f4f6', 200: '#e5e7eb', 300: '#d1d5db', 800: '#1f2937', 900: '#111827' }
                        }
                    }
                },
                corePlugins: { preflight: true }
            }
        }
        window.updateMiniCounter = function() {
            if(!window.currentFilteredList || window.currentFilteredList.length === 0) {
                document.getElementById('mini-current-index').innerText = "-";
                return;
            }
            if(!currentRecordId) {
                document.getElementById('mini-current-index').innerText = "-";
                return;
            }
            const idx = window.currentFilteredList.findIndex(r => String(r.cr714_id) === String(currentRecordId));
            document.getElementById('mini-current-index').innerText = (idx !== -1) ? (idx + 1) : "-";
        }

        window.navigateMiniGallery = function(offset) {
            if(!window.currentFilteredList || window.currentFilteredList.length === 0) return;
            let currentIdx = -1;
            if(currentRecordId) {
                currentIdx = window.currentFilteredList.findIndex(r => String(r.cr714_id) === String(currentRecordId));
            }
            let newIdx = currentIdx + offset;
            if(newIdx < 0) newIdx = 0;
            if(newIdx >= window.currentFilteredList.length) newIdx = window.currentFilteredList.length - 1;
            if(newIdx !== currentIdx) {
                const target = window.currentFilteredList[newIdx];
                window.selectRecord(target.cr714_id);
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-app: #f1f5f9;
            --bg-card: #ffffff; --bg-input: #f8fafc; --bg-header: #f8fafc;
            --text-main: #0f172a; --text-muted: #64748b;
            --primary: #2563eb; --primary-fg: #ffffff;
            --accent-danger: #ef4444; --accent-success: #22c55e; --accent-warning: #eab308;
            --border-color: #cbd5e1; 
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 0.5rem; 
            --modal-bg: #ffffff;
            --outlook-bg: #ffffff;
            --tab-bg: #e2e8f0;
            --tab-active-bg: #ffffff;
            --z-base: 1;
            --z-walker: 50;
            --z-sidebar: 100; 
            --z-menu-trigger: 9000;
            --z-menu-drawer: 9100; 
            --z-overlay: 4000;
            --z-modal: 5000;
            --z-dropdown: 6000;
            --z-toast: 9999; 
            --z-loader: 8000;
            --z-delivery: 8500;
        }

        [data-theme="midnight"] {
            --bg-app: #0f172a;
            --bg-card: #1e293b; --bg-input: #334155; --bg-header: #1e293b; 
            --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155; 
            --primary: #38bdf8; --primary-fg: #ffffff; --modal-bg: #1e293b;
            --outlook-bg: #1e293b;
        }

        html.text-zoom-1 { font-size: 110%; }
        html.text-zoom-2 { font-size: 125%; }

        body { font-family: 'Inter', sans-serif; background: var(--bg-app); color: var(--text-main); padding: 0.5rem 1rem; height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: background 0.2s ease; }
        .card { background: var(--bg-card) !important; color: var(--text-main) !important; border: 1px solid var(--border-color); border-radius: var(--radius); box-shadow: var(--shadow); transition: all 0.3s ease; }
        .card-header { font-weight: 600; border-bottom: 1px solid var(--border-color); padding: 0.5rem 0.75rem; display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-header) !important; border-radius: var(--radius) var(--radius) 0 0; color: var(--text-main) !important; }
        
        #main-app-container { width: 100%; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: var(--z-base); }
        
        .app-grid { display: grid; grid-template-columns: 320px 1fr var(--history-width, 300px); gap: 1rem; flex-grow: 1; overflow: hidden; width: 100%; transition: grid-template-columns 0.05s ease; }
        .app-grid.sidebar-collapsed { grid-template-columns: 50px 1fr var(--history-width, 300px); }
        
        .col-left { display: flex; flex-direction: column; gap: 0.5rem; height: 100%; overflow: hidden; transition: width 0.3s ease; }
        .col-left.collapsed .gallery-item { display: none; }
        .col-left.collapsed #gallery-normal-content { display: none !important; }
        .col-left.collapsed #gallery-mini-controls { display: flex !important; }
        
        .col-middle { display: flex; flex-direction: column; height: 100%; overflow: hidden; min-width: 0; }
        .col-middle .card.workspace { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

        .col-history { display: flex; flex-direction: column; height: 100%; overflow: visible; min-width: 0; position: relative; }

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .sidebar-modal { position: fixed; top: 0; right: 0; bottom: 0; width: 50%; background-color: var(--bg-app); box-shadow: none; z-index: var(--z-sidebar); transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), width 0.4s ease; display: flex; flex-direction: column; border-left: 1px solid var(--border-color); pointer-events: auto; }
        .sidebar-modal.active { transform: translateX(0); }
        .sidebar-iframe-container { width: 100%; height: 100%; display: none; }
        .sidebar-iframe-container.active { display: block; }
        .sidebar-iframe-container iframe { width: 100%; height: 100%; border: none; }

        input, select, textarea { background-color: var(--bg-input) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; border-radius: 0.375rem; padding: 0.5rem; font-size: 0.875rem; box-sizing: border-box; }
        .btn-primary { background: var(--primary); color: var(--primary-fg); font-weight: 600; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; border: none; }
        .btn-secondary { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); font-weight: 600; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; }

        .stats-pill { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 12px; border-radius: 8px; background: var(--bg-input); border: 1px solid var(--border-color); min-width: 70px; height: 45px; }
        .stats-value { font-size: 1.1rem; font-weight: 800; }
        .stats-label { font-size: 0.6rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }

        .gallery-list { flex: 1 1 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding: 2px; }
        .gallery-item { padding: 0.5rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.5rem; cursor: pointer; }
        .gallery-item.is-selected { border-color: var(--primary); background: var(--primary); color: var(--primary-fg); }

        .note-card { margin-bottom: 0.75rem; border-radius: 0.375rem; border: 1px solid var(--border-color); background-color: var(--bg-card); overflow: hidden; }
        .note-card-header { padding: 0.4rem; background-color: var(--bg-header); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted); font-weight: 600; }
        .note-card-body { padding: 0.6rem; font-size: 0.8rem; white-space: pre-wrap; line-height: 1.4; }

        .quick-action-btn { display: flex; align-items: center; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); cursor: pointer; font-size: 0.75rem; font-weight: 600; gap: 8px; width: 100%; transition: all 0.2s; }
        .quick-action-btn:hover { background: var(--bg-header); transform: translateX(2px); }

        .email-counter-segment { background-color: var(--bg-card); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 6px 6px; padding: 4px; font-size: 9px; display: flex; justify-content: space-between; color: var(--text-muted); margin-top: -4px; }
        .email-counter-segment.limit-reached { background-color: #fef2f2; color: #ef4444; border-color: #ef4444; }

        .outlook-modal { background-color: var(--outlook-bg) !important; color: var(--text-main) !important; border-radius: 0.5rem; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-color); }
        .outlook-editor { padding: 16px; outline: none; overflow-y: auto; flex-grow: 1; font-family: 'Segoe UI', sans-serif; min-height: 200px; }

        .toast-container { position: fixed; bottom: 1rem; right: 1rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: var(--z-toast); }
        .toast { background: white; border-radius: 0.5rem; padding: 0.75rem 1rem; box-shadow: var(--shadow); transform: translateX(120%); transition: transform 0.3s ease; }
        .toast.show { transform: translateX(0); }

        .delivery-notification { position: fixed; bottom: 20px; right: -400px; width: 300px; background-color: #1f2937; color: white; border-radius: 12px; z-index: var(--z-delivery); transition: right 0.5s; display: flex; align-items: center; padding: 12px; }
        .delivery-notification.show { right: 20px; }

        .empty-field-warning { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        
        #history-column-card { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div id="global-loader" style="display:flex;">
        <h2 class="text-xl text-center font-bold mb-4">A.C.T. <br>Account Communication Tracker</h2>
        <p>Loading application...</p>
    </div>

    <div id="login-container" class="modal-overlay hidden">
        <div class="modal-content text-center p-6 card">
            <h2 class="text-2xl font-bold mb-4">Daytona Utility</h2>
            <button onclick="window.login()" class="btn-primary w-full py-3">Sign in with Microsoft</button>
        </div>
    </div>

    <div id="main-app-container" class="hidden">
        
        <div class="card mb-3 p-3 flex flex-wrap items-center justify-between gap-4 shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold" style="color: var(--primary);">A.C.T.</h1>
                <div class="flex items-center gap-2 ml-2 pl-4 border-l" style="border-color: var(--border-color)">
                    <button id="welcome-message" onclick="window.showUserProfileCard()" class="text-sm font-medium cursor-pointer flex items-center gap-2">
                        <i class="fas fa-user-circle text-xl"></i> <span>--</span>
                    </button>
                    <span id="clock-display" class="text-xs font-mono text-muted border-l pl-3 ml-2">--:--</span>
                    <button onclick="window.reportIssue()" class="ml-2 text-muted hover:text-red-500"><i class="fas fa-bug"></i></button>
                </div>
            </div>
            
            <div class="flex gap-2">
                <div class="stats-pill"><span class="stats-label">Total</span><span id="stat-total" class="stats-value">0</span></div>
                <div class="stats-pill"><span class="stats-label">View</span><span id="stat-filtered" class="stats-value">0</span></div>
                <div class="stats-pill"><span class="stats-label text-blue-500">Emails</span><span id="stat-emails" class="stats-value">0</span></div>
                <div class="stats-pill interactive" onclick="window.showActivityLog('contact')"><span class="stats-label text-green-500">Contacts</span><span id="stat-contacts" class="stats-value">0</span></div>
            </div>

            <div class="w-full flex gap-2 border-t pt-2 mt-1 filter-pills overflow-x-auto no-scrollbar">
                <select id="sort-dropdown" onchange="window.filterAndSortGallery()" class="text-xs bg-transparent border-none">
                    <option value="company-asc">Company (A-Z)</option>
                    <option value="followup-asc">Follow Up</option>
                </select>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" id="filter-requests" onchange="window.filterAndSortGallery()"> Actions</label>
                <label class="flex items-center gap-1 text-xs cursor-pointer"><input type="checkbox" id="filter-sent-only" onchange="window.filterAndSortGallery()"> Sent Today</label>
                
                <div class="ml-auto flex gap-1">
                    <button onclick="window.toggleFontSize()" class="btn-secondary text-xs py-1 px-3">AA</button>
                    <button onclick="window.toggleThemeMode()" class="btn-secondary text-xs py-1 px-3">Theme</button>
                </div>
            </div>
        </div>

        <div class="app-grid">
            <div class="col-left" id="gallery-column">
                <div class="card flex flex-col h-full overflow-hidden">
                    <div class="card-header flex-col items-start gap-2 flex-shrink-0">
                         <div id="gallery-normal-content" class="w-full">
                             <div class="flex justify-between items-center mb-2"><span>Accounts</span> <button onclick="window.toggleGallery()"><i class="fas fa-compress-alt"></i></button></div>
                             <input type="text" id="search-bar" oninput="window.filterAndSortGallery()" placeholder="Search... (/)" class="text-xs w-full">
                         </div>
                         <div id="gallery-mini-controls" class="hidden flex-col items-center w-full gap-2">
                             <button onclick="window.toggleGallery()"><i class="fas fa-expand-alt"></i></button>
                             <button onclick="window.navigateMiniGallery(-1)"><i class="fas fa-chevron-up"></i></button>
                             <div id="mini-current-index" class="text-sm font-bold text-primary">--</div>
                             <button onclick="window.navigateMiniGallery(1)"><i class="fas fa-chevron-down"></i></button>
                         </div>
                    </div>
                    <div id="record-gallery-list" class="gallery-list"></div>
                </div>
            </div>

            <div class="col-middle">
                <div class="card p-3 mb-2 flex-shrink-0 relative">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <div id="acct-company" class="font-bold text-sm">Select an account</div>
                            <div id="acct-number-header" class="text-xs text-muted">--</div>
                        </div>
                        <div id="save-controls" class="hidden gap-1">
                            <button onclick="window.handleCustomSave()" class="btn-primary text-[10px] py-1">Save</button>
                            <button onclick="window.confirmClearChanges()" class="btn-danger-outline text-[10px] py-1">Clear</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-4 gap-2 text-center border-t pt-2">
                        <div onclick="window.updateAndOpenScript('Contact', document.getElementById('contact-name-most').value)" class="cursor-pointer hover:bg-blue-50 rounded p-1">
                            <label class="text-[9px] uppercase text-muted block">Contact</label>
                            <input id="contact-name-most" class="text-xs font-bold w-full text-center bg-transparent border-none cursor-pointer" readonly>
                        </div>
                        <div onclick="window.updateAndOpenScript('Last Order', document.getElementById('last-order-date').value)" class="cursor-pointer hover:bg-blue-50 rounded p-1">
                            <label class="text-[9px] uppercase text-muted block">Last Order</label>
                            <input id="last-order-date" class="text-xs w-full text-center bg-transparent border-none cursor-pointer" readonly>
                        </div>
                        <div onclick="window.updateAndOpenScript('Phone', document.getElementById('contact-phone-primary').value)" class="cursor-pointer hover:bg-blue-50 rounded p-1">
                            <label class="text-[9px] uppercase text-muted block">Phone</label>
                            <input id="contact-phone-primary" class="text-xs w-full text-center bg-transparent border-none cursor-pointer" readonly>
                        </div>
                        <div onclick="window.updateAndOpenScript('Email', document.getElementById('contact-email-most').value)" class="cursor-pointer hover:bg-blue-50 rounded p-1">
                            <label class="text-[9px] uppercase text-blue-600 font-bold block">Email</label>
                            <input id="contact-email-most" class="text-xs w-full text-center bg-transparent border-none cursor-pointer" readonly>
                        </div>
                    </div>
                </div>

                <div class="card workspace">
                    <div class="card-header py-2 flex-shrink-0">
                         <span class="text-xs font-bold text-muted uppercase">Workspace</span>
                    </div>
                    <div class="flex flex-row flex-grow min-h-0 overflow-hidden">
                        <div class="w-1/2 flex flex-col border-r p-2 gap-2 overflow-hidden">
                            <div class="flex justify-between items-center"><label class="text-xs font-bold text-muted">Notes</label><button onclick="window.insertTemplate()" class="text-[10px] text-blue-500">Template</button></div>
                            <textarea id="qb-notes-input" class="note-textarea flex-grow" placeholder="Add notes here..."></textarea>
                            <div class="p-2 bg-gray-50 border rounded shrink-0">
                                <label class="text-[10px] font-bold uppercase text-muted">Follow Up</label>
                                <div class="flex gap-1"><input type="date" id="follow-up-date" class="text-xs flex-1 h-7"><input type="time" id="follow-up-time" class="text-xs flex-1 h-7"></div>
                            </div>
                        </div>
                        <div class="w-1/2 p-2 flex flex-col gap-2 overflow-y-auto">
                            <input type="text" id="input-location" placeholder="Location" class="text-xs h-7">
                            <input type="text" id="input-dm" placeholder="Decision Maker" class="text-xs h-7">
                            <input type="text" id="input-competitor" placeholder="Competitor" class="text-xs h-7">
                            <select id="opp-type-select" class="text-xs h-8 font-bold"><option value="">-- Opportunity Type --</option><option value="Call">Call</option><option value="Email">Email</option></select>
                            
                            <div class="grid grid-cols-2 gap-2 mt-2">
                                <button onclick="window.handleContextButton('summary')" class="quick-action-btn h-8 text-[9px]"><i class="fas fa-clipboard-list text-blue-500"></i> Summary</button>
                                <button onclick="window.handleContextButton('sales')" class="quick-action-btn h-8 text-[9px]"><i class="fas fa-file-invoice-dollar text-green-500"></i> Sales</button>
                                <button onclick="window.handleContextButton('csw')" class="quick-action-btn h-8 text-[9px]"><i class="fas fa-headset text-purple-500"></i> CSW</button>
                                <button onclick="window.openSidebarTab('iteminfo', 'Item Info', 'https://www.iteminfo.com')" class="quick-action-btn h-8 text-[9px]"><i class="fas fa-info-circle text-teal-600"></i> ItemInfo</button>
                                <div class="col-span-2">
                                    <button onclick="window.openCallScript()" id="btn-script" class="quick-action-btn h-8 text-[9px] justify-center rounded-b-none border-b-0"><i class="fas fa-comment-dots text-pink-500"></i> Call Script</button>
                                    <div id="email-counter-segment" class="email-counter-segment">
                                        <span><i class="fas fa-stopwatch mr-1"></i>Hourly Limit</span>
                                        <span id="email-hourly-count" class="font-bold">0/100</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex-shrink-0 border-t p-2 bg-gray-50 flex gap-4 items-end">
                        <div class="flex-grow">
                            <label class="text-[10px] font-bold text-muted uppercase">Email Actions</label>
                            <div class="flex gap-1"><select id="email-template-dropdown" class="text-xs flex-grow h-7"></select><button onclick="window.launchEmailLogic()" id="launch-email-button" class="btn-secondary h-7 px-3"><i class="fas fa-paper-plane"></i></button></div>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="window.openMVGOModal()" id="mvgo-button" class="btn-secondary text-[10px] h-7 px-2">MVGO</button>
                            <button onclick="window.openCloseAccountModal()" id="close-button" class="btn-secondary text-[10px] h-7 px-2">Close</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-history" id="history-column">
                <div id="history-resizer" class="absolute top-0 bottom-0 -left-3 w-4 cursor-col-resize z-50 flex items-center justify-center group" title="Drag to resize">
                    <div class="w-1 h-8 bg-gray-300 rounded group-hover:bg-blue-500 transition-colors"></div>
                </div>
                <div class="card h-full flex flex-col overflow-hidden" id="history-column-card">
                    <div class="card-header p-3 border-b flex-shrink-0">
                         <span class="text-xs font-bold text-muted uppercase">History Feed</span>
                    </div>
                    <div id="history-container" class="flex-grow flex flex-col overflow-hidden">
                        <div class="flex justify-between items-center p-2 shrink-0"><label class="text-xs cursor-pointer"><input type="checkbox" id="show-prev-note" checked onchange="window.updateNotesPreview()"> Show History</label></div>
                        <div id="qb-notes-preview" class="flex-grow overflow-y-auto p-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="unified-sidebar" class="sidebar-modal">
        <div class="p-3 border-b flex justify-between items-center h-[50px] shrink-0">
            <div id="sidebar-tab-strip" class="sidebar-tab-header flex-grow overflow-x-auto no-scrollbar"></div>
            <div class="flex gap-2 items-center">
                <button onclick="window.authenticateSidebarTools()" class="text-[10px] bg-blue-100 px-2 py-1 rounded">Auth Tools</button>
                <button onclick="window.closeUnifiedSidebar()" class="text-xl">&times;</button>
            </div>
        </div>
        <div id="sidebar-content-area" class="flex-grow relative overflow-hidden"></div>
    </div>

    <div id="script-modal" class="modal-overlay hidden" style="display:none; z-index: 9500; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
        <div class="modal-content max-w-lg w-full card p-4">
            <h3 class="font-bold border-b pb-2 mb-3">Call Script</h3>
            <div id="script-content" class="text-sm italic p-3 bg-gray-50 rounded"></div>
            <div class="mt-4 flex justify-end"><button onclick="document.getElementById('script-modal').style.display='none'" class="btn-primary">Close</button></div>
        </div>
    </div>

    <script>
        let currentRecordId=null, currentSelectedRecord=null, allRecords=[], failedSaves=[], currentUserRepName=null;
        const QB_NOTES_TEMPLATE = `Locations: \nEmployees: \nVendors: \nSpend: \nOPP: \n`;
        const EMAIL_LIMIT_PER_HOUR = 100;

        window.login = function() {
            msalInstance.loginPopup({ scopes: ["User.Read"] }).then(resp => {
                msalAccount = resp.account; currentUserRepName = msalAccount.name; window.initializeApp();
            });
        }

        window.initializeApp = function() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('main-app-container').classList.remove('hidden');
            document.getElementById('main-app-container').style.display = 'flex';
            
            // RESET DAILY TRACKERS
            const lastRunDate = localStorage.getItem('daytona_last_run_date');
            const todayStr = new Date().toLocaleDateString('en-CA');
            if (lastRunDate !== todayStr) {
                localStorage.setItem('daytona_sent_records', '[]');
                localStorage.setItem('daytona_last_run_date', todayStr);
            }

            window.loadRecords();
            window.loadFontSize();
            window.checkEmailRateLimit();
            window.startClock();
        }

        window.updateStats = function() {
            let log = []; try { log = JSON.parse(localStorage.getItem('daytona_audit_log') || '[]'); } catch(e) {}
            const localToday = new Date().toLocaleDateString('en-CA');
            const todaysActivity = log.filter(entry => {
                if(!entry.timestamp) return false;
                return new Date(entry.timestamp).toLocaleDateString('en-CA') === localToday;
            });
            document.getElementById('stat-emails').innerText = todaysActivity.filter(x => x.type.toLowerCase().includes('email')).length;
            const unique = new Set(todaysActivity.filter(x => x.recordId && x.recordId !== 'N/A').map(x => x.recordId));
            document.getElementById('stat-contacts').innerText = unique.size;
        }

        window.checkEmailRateLimit = function() {
             const now = Date.now();
             let ts = []; try { ts = JSON.parse(localStorage.getItem('daytona_email_timestamps') || '[]'); } catch(e) {}
             ts = ts.filter(t => (now - t) < 3600000);
             localStorage.setItem('daytona_email_timestamps', JSON.stringify(ts));
             
             const count = ts.length;
             document.getElementById('email-hourly-count').innerText = `${count}/${EMAIL_LIMIT_PER_HOUR}`;
             const segment = document.getElementById('email-counter-segment');
             if(count >= EMAIL_LIMIT_PER_HOUR) {
                 segment.classList.add('limit-reached');
                 document.getElementById('launch-email-button').disabled = true;
             } else {
                 segment.classList.remove('limit-reached');
                 if(currentSelectedRecord) document.getElementById('launch-email-button').disabled = false;
             }
             return count < EMAIL_LIMIT_PER_HOUR;
        }

        window.updateAndOpenScript = function(field, value) {
            let scriptText = "";
            const val = value || "(Unknown)";
            if(field === 'Contact') scriptText = `Hi ${val}, my name is ${currentUserRepName || 'your rep'} with W.B. Mason...`;
            else if(field === 'Phone') scriptText = `(Verifying Phone: ${val}) Hi, I'm calling to speak with the person in charge...`;
            else if(field === 'Email') scriptText = `(Verifying Email: ${val}) Hi, I wanted to verify your address for a pricing sheet...`;
            else scriptText = `Checking on order status from ${val}. Hi...`;
            
            document.getElementById('script-content').innerText = scriptText;
            document.getElementById('script-modal').style.display = 'flex';
        }

        window.openCallScript = function() {
            document.getElementById('script-content').innerText = "Hello, I'm calling about an awesome promotion we're running!";
            document.getElementById('script-modal').style.display = 'flex';
        }

        window.toggleFontSize = function() {
            const html = document.documentElement;
            if(html.classList.contains('text-zoom-2')) { html.classList.remove('text-zoom-1', 'text-zoom-2'); localStorage.setItem('daytona_font_size', '0'); }
            else if(html.classList.contains('text-zoom-1')) { html.classList.remove('text-zoom-1'); html.classList.add('text-zoom-2'); localStorage.setItem('daytona_font_size', '2'); }
            else { html.classList.add('text-zoom-1'); localStorage.setItem('daytona_font_size', '1'); }
        }
        window.loadFontSize = function() {
            const size = localStorage.getItem('daytona_font_size');
            if(size === '1') document.documentElement.classList.add('text-zoom-1');
            if(size === '2') document.documentElement.classList.add('text-zoom-2');
        }

        window.activeSidebarTabs = [];
        window.openSidebarTab = function(id, title, url) {
            if (!window.activeSidebarTabs.find(t => t.id === id)) { 
                window.activeSidebarTabs.push({ id, title, url });
                const div = document.createElement('div');
                div.id = `sidebar-frame-${id}`;
                div.className = 'sidebar-iframe-container';
                div.innerHTML = `<iframe src="${url}"></iframe>`;
                document.getElementById('sidebar-content-area').appendChild(div);
            } 
            window.switchSidebarTab(id);
            document.getElementById('unified-sidebar').classList.add('active');
            document.body.classList.add('split-screen');
        }

        window.switchSidebarTab = function(id) {
            window.currentActiveTabId = id;
            document.querySelectorAll('.sidebar-iframe-container').forEach(el => el.classList.remove('active'));
            document.getElementById(`sidebar-frame-${id}`).classList.add('active');
            window.renderSidebarTabs();
        }

        window.renderSidebarTabs = function() {
            const strip = document.getElementById('sidebar-tab-strip'); strip.innerHTML = '';
            window.activeSidebarTabs.forEach(tab => {
                const div = document.createElement('div');
                div.className = `sidebar-tab ${tab.id === window.currentActiveTabId ? 'active' : ''}`;
                div.onclick = () => window.switchSidebarTab(tab.id);
                div.innerHTML = `<span>${tab.title}</span><i class="fas fa-times ml-2" onclick="window.closeSidebarTab('${tab.id}', event)"></i>`;
                strip.appendChild(div);
            });
        }
        
        window.closeSidebarTab = function(id, event) {
            if(event) event.stopPropagation();
            window.activeSidebarTabs = window.activeSidebarTabs.filter(t => t.id !== id);
            document.getElementById(`sidebar-frame-${id}`).remove();
            if(window.activeSidebarTabs.length > 0) window.switchSidebarTab(window.activeSidebarTabs[0].id);
            else window.closeUnifiedSidebar();
        }

        window.closeUnifiedSidebar = function() {
            document.getElementById('unified-sidebar').classList.remove('active');
            document.body.classList.remove('split-screen');
        }

        window.authenticateSidebarTools = function() {
            const urls = ["https://go.masonville.com/", "https://wbmasonco.crm.dynamics.com/", "https://www.iteminfo.com/"];
            urls.forEach(u => window.open(u, '_blank'));
        }

        window.updateNotesPreview = function() {
            const preview = document.getElementById('qb-notes-preview');
            if(!currentSelectedRecord) { preview.innerHTML = "Select an account"; return; }
            const history = window.parseNotes(currentSelectedRecord.cr714_qbnotes || '');
            preview.innerHTML = history.map(item => `
                <div class="note-card">
                    <div class="note-card-header"><span>${item.date}</span><span>${item.author}</span></div>
                    <div class="note-card-body">${item.text}</div>
                </div>
            `).join('');
        }

        // --- RESIZABLE HISTORY COLUMN LOGIC ---
        const resizer = document.getElementById('history-resizer');
        const grid = document.querySelector('.app-grid');
        const historyCol = document.getElementById('history-column');
        if (resizer && grid && historyCol) {
            let isResizing = false; let startX, startWidth;
            const savedWidth = localStorage.getItem('daytona_history_width');
            if (savedWidth) grid.style.setProperty('--history-width', savedWidth);
            const onDown = (clientX) => { isResizing = true; startX = clientX; startWidth = historyCol.offsetWidth; resizer.classList.add('bg-blue-500/20'); };
            const onMove = (clientX) => { if (!isResizing) return; const deltaX = startX - clientX; let newWidth = startWidth + deltaX; if (newWidth < 200) newWidth = 200; if (newWidth > 600) newWidth = 600; grid.style.setProperty('--history-width', `${newWidth}px`); };
            const onUp = () => { if (isResizing) { isResizing = false; resizer.classList.remove('bg-blue-500/20'); localStorage.setItem('daytona_history_width', getComputedStyle(grid).getPropertyValue('--history-width')); } };
            resizer.addEventListener('mousedown', (e) => onDown(e.clientX));
            document.addEventListener('mousemove', (e) => onMove(e.clientX));
            document.addEventListener('mouseup', onUp);
            resizer.addEventListener('touchstart', (e) => onDown(e.touches[0].clientX));
            document.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX));
            document.addEventListener('touchend', onUp);
        }

        // Core Functions (simplified for this delivery)
        window.loadRecords = async function() { /* Implementation of GET_MY_RECORDS flow */ };
        window.selectRecord = function(id) { currentRecordId=id; currentSelectedRecord = allRecords.find(r => r.cr714_id==id); window.populateForm(currentSelectedRecord); window.updateNotesPreview(); };
        window.populateForm = function(r) { document.getElementById('acct-company').innerText = r.cr714_company; document.getElementById('acct-number-header').innerText = r.cr714_id; document.getElementById('contact-name-most').value = r.cr714_namemost; document.getElementById('contact-phone-primary').value = r.cr714_primaryphone; document.getElementById('contact-email-most').value = r.cr714_emailmost; document.getElementById('last-order-date').value = r.cr714_lastorderdate || '--'; };
        window.parseNotes = function(n) { return []; }; // Implementation of note parser
        window.startClock = function() { setInterval(() => { document.getElementById('clock-display').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }, 1000); };
    </script>
