<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLeap v30.0 | Bulletproof Command</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155; 
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8; 
            --text-accent: #fbbf24; --border: #334155; --danger: #ef4444; 
            --success: #10b981; --base-font: 14px;
        }
        [data-theme='light'] { 
            --bg-deep: #f8fafc; --bg-surface: #ffffff; --bg-card: #f1f5f9; 
            --brand: #0d9488; --text-main: #0f172a; --text-dim: #475569; 
            --text-accent: #b45309; --border: #e2e8f0; --danger: #dc2626; --success: #059669; 
        }
        
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; font-size: var(--base-font); height: 100vh; overflow: hidden; margin: 0; transition: all 0.2s; }
        
        /* SCROLLBARS */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--bg-card); border-radius: 10px; border: 2px solid var(--bg-deep); }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }

        /* LAYOUTS */
        #main-layout { display: flex; height: calc(100vh - 125px); width: 100%; overflow: hidden; position: relative; }
        #view-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        #detail-pane { width: 0; opacity: 0; overflow-y: auto; background: var(--bg-surface); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; position: relative; z-index: 40; border-left: 1px solid var(--border); }
        
        .split-active #view-pane { flex: 0 0 350px; border-right: 1px solid var(--border); }
        .split-active #detail-pane { flex: 1; opacity: 1; }

        /* KANBAN */
        .kanban-board { display: flex; height: 100%; overflow-x: auto; padding: 1rem; gap: 1rem; }
        .kanban-col { flex: 0 0 300px; background: rgba(0,0,0,0.1); border-radius: 12px; display: flex; flex-direction: column; border: 1px solid var(--border); }
        .kanban-body { flex: 1; overflow-y: auto; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem; }

        /* TABLE ENGINE */
        .data-table-container { height: 100%; overflow: auto; background: var(--bg-deep); }
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85em; }
        .data-table th { 
            background: var(--bg-surface); position: sticky; top: 0; z-index: 20; 
            padding: 12px; text-align: left; border-bottom: 2px solid var(--border); 
            cursor: pointer; white-space: nowrap; user-select: none;
        }
        .data-table th:hover { color: var(--brand); }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); transition: background 0.1s; }
        .data-table tr:hover td { background: var(--bg-card); cursor: pointer; }
        
        /* REP CARDS */
        .rep-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
        .status-bar-bg { height: 6px; background: var(--bg-deep); border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .status-bar-fill { height: 100%; transition: width 1s ease-out; }

        /* FORM VARIANTS */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .form-compact label { font-size: 9px; margin-bottom: 2px; }
        .form-compact input, .form-compact select { height: 32px !important; }

        /* UI ELEMENTS */
        .nav-btn { display: flex; flex-direction: column; align-items: center; padding: 8px; border-radius: 8px; font-size: 10px; font-weight: 800; color: var(--text-dim); transition: 0.2s; }
        .nav-btn.active { color: var(--brand); background: rgba(45, 212, 191, 0.1); border: 1px solid var(--brand); }
        .input-dark { background: var(--bg-deep); border: 1px solid var(--border); color: var(--text-main); padding: 0.5rem; border-radius: 6px; outline: none; }
        .input-dark:focus { border-color: var(--brand); }
        .racing-border { position: relative; border-radius: 8px; padding: 2px; overflow: hidden; background: var(--border); }
        .active-racing::before { content: ''; position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; background: conic-gradient(transparent, var(--brand), transparent 30%); animation: rotate 4s linear infinite; z-index: 0; }
        .racing-inner { position: relative; z-index: 1; background: var(--bg-surface); border-radius: 6px; }
        @keyframes rotate { 100% { transform: rotate(1turn); } }

        #loading-screen { position: fixed; inset: 0; background: var(--bg-deep); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body data-theme="midnight">

    <div id="loading-screen">
        <i class="fa-solid fa-frog text-5xl text-[var(--brand)] animate-bounce"></i>
        <div class="mt-4 font-black uppercase tracking-widest text-[var(--brand)]">LogiLeap v30.0</div>

    <div id="main-layout">

            <div id="container-map" class="view-section hidden h-full"><div id="map-container" class="h-full w-full"></div></div>
            
            <div id="container-scorecard" class="view-section hidden h-full p-6 overflow-y-auto">
                <div class="grid grid-cols-4 gap-4 mb-8">
                    <div class="p-4 bg-[var(--bg-surface)] rounded-xl border border-[var(--border)]">

                        <div id="stat-total" class="text-3xl font-black">0</div>
                    </div>

                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="p-4 bg-black/20 rounded-xl border border-[var(--border)]">

    <script id="worker-script" type="javascript/worker">
        const ZIP_MAP = {'010':[42.2,-72.6],'020':[42.1,-71.2],'030':[42.9,-71.5],'070':[40.8,-74.2],'100':[40.7,-74.0],'190':[40.0,-75.3],'300':[33.9,-84.4],'330':[25.8,-80.2],'600':[42.1,-87.9],'900':[34.0,-118.2]};

        self.onmessage = function(e) {
            const { type, payload } = e.data;
            
            if(type === 'PROCESS') {
                const raw = payload.data || [];
                const db = raw.map(r => ({
                    id: r.ticket_id || Math.random().toString(36).substr(2,6).toUpperCase(),
                    guid: (r.logisticslog_2id || '').replace(/[{}]/g,''),
                    so: r.salesordernumber || r.sales_order || 'N/A',
                    customer: r.companyordeliveryname || 'Unknown Entity',
                    address: r.shippingaddress || 'No Address Provided',
                    whs: r.warehouse || 'Unk',
                    status: r.disposition || 'Pending',
                    owner: r.logisticsowner || 'Unassigned',
                    issue: r.issue || 'Standard',
                    notes: r.logisticsnotes || '',
                    driver: r.drivernamenumber || '',
                    whsNotes: r.receivedemailfromwarehousenotes || '',
                    date: r.createdon ? r.createdon.split('T')[0] : new Date().toISOString().split('T')[0],
                    zip3: (r.shippingaddress?.match(/\b\d{3}/)||['000'])[0]
                }));

                const filters = {
                    whs: [...new Set(db.map(x => x.whs))].sort(),
                    owners: [...new Set(db.map(x => x.owner))].sort(),
                    statuses: [...new Set(db.map(x => x.status))].sort()
                };

                self.postMessage({ type: 'READY', db, filters });
            }

            if(type === 'FILTER') {
                const { db, criteria } = payload;
                const filtered = db.filter(item => {
                    const matchesSearch = !criteria.search || 
                        Object.values(item).some(v => String(v).toLowerCase().includes(criteria.search.toLowerCase()));
                    const matchesWhs = !criteria.whs || item.whs === criteria.whs;
                    const matchesStatus = !criteria.status || item.status === criteria.status;
                    const matchesUrgent = !criteria.urgent || item.issue.match(/Crit|Urg/i);
                    return matchesSearch && matchesWhs && matchesStatus && matchesUrgent;
                });

                // Warehouse Geo Aggregation
                const whsStats = {};
                filtered.forEach(item => {
                    whsStats[item.whs] = (whsStats[item.whs] || 0) + 1;
                });

                self.postMessage({ type: 'FILTERED_RESULT', filtered, whsStats });
            }
        };
    </script>

    <script>
        const API_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4";
        const SAVE_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY";

        let fullDb = [], filteredDb = [], currentView = 'assign', selectedId = null;
        let chartInstances = {}, mapInstance = null, markerGroup = null;
        let activeFilters = { search: '', whs: '', status: '', urgent: false };

        const worker = new Worker(URL.createObjectURL(new Blob([document.getElementById('worker-script').textContent], { type: "text/javascript" })));

        document.addEventListener('DOMContentLoaded', () => {
            initData();
            flatpickr("#f-date", { mode: "range", theme: "dark" });
        });

        async function initData() {
            try {
                const res = await fetch(API_URL, { method: 'POST' });
                const data = await res.json();
                worker.postMessage({ type: 'PROCESS', payload: { data: data.value || [] } });
            } catch (e) {
                console.error(e);
                Toastify({ text: "Connection Failed", style: { background: "#ef4444" } }).showToast();
            }
        }

        worker.onmessage = (e) => {
            const { type, db, filters, filtered, whsStats } = e.data;

            if (type === 'READY') {
                fullDb = db;
                populateFilterOptions(filters);
                document.getElementById('loading-screen').style.display = 'none';
                applyFilters();
            }

            if (type === 'FILTERED_RESULT') {
                filteredDb = filtered;
                renderCurrentView();
                updateScorecard(filtered);
                updateCharts(filtered, whsStats);
                if (mapInstance) updateMap(filtered);
            }
        };

        function populateFilterOptions(f) {
            const whEl = document.getElementById('f-wh');
            const ownerEl = document.getElementById('m-owner');
            const statEl = document.getElementById('f-status');

            f.whs.forEach(w => whEl.add(new Option(w, w)));
            f.owners.forEach(o => ownerEl.add(new Option(o, o)));
            f.statuses.forEach(s => statEl.add(new Option(s, s)));
        }

        function switchView(v) {
            currentView = v;
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`container-${v}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-${v}`).classList.add('active');
            
            if (v === 'map') setTimeout(initLeaflet, 100);
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById(`container-${currentView}`);
            if (currentView === 'list' || currentView === 'assign') {
                renderTable(container);
            } else if (currentView === 'kanban') {
                renderKanban(container);
            } else if (currentView === 'scorecard') {
                renderRepCards();
            }
        }

        /* --- TABLE ENGINE --- */
        function renderTable(container) {
            const isAssign = currentView === 'assign';
            let html = `
                <div class="data-table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 40px"><input type="checkbox"></th>
                                <th onclick="sortTable('so')">Sales Order <i class="fas fa-sort ml-2 opacity-30"></i></th>
                                <th onclick="sortTable('customer')">Customer</th>
                                <th onclick="sortTable('whs')">Warehouse</th>
                                <th onclick="sortTable('owner')">Logistics Rep</th>
                                <th onclick="sortTable('status')">Status</th>
                                <th onclick="sortTable('date')">Created</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filteredDb.map(item => `
                                <tr onclick="openDetail('${item.id}')" class="${selectedId === item.id ? 'bg-[var(--bg-card)]' : ''}">
                                    <td><input type="checkbox" onclick="event.stopPropagation()"></td>
                                    <td class="font-mono text-[var(--brand)] font-bold">${item.so}</td>
                                    <td class="font-black uppercase text-[10px]">${item.customer}</td>
                                    <td><span class="px-2 py-0.5 bg-black/20 rounded border border-[var(--border)] text-[9px] font-black">${item.whs}</span></td>
                                    <td class="text-xs opacity-70">${item.owner}</td>
                                    <td><span class="text-[9px] font-black uppercase" style="color: ${getStatusColor(item.status)}">${item.status}</span></td>
                                    <td class="opacity-40 font-mono text-[10px]">${item.date}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            container.innerHTML = html;
        }

        /* --- KANBAN --- */
        function renderKanban(container) {
            const stages = ['Pending', 'Working on', 'Escalated', 'Completed'];
            let html = `<div class="kanban-board">`;
            stages.forEach(stage => {
                const items = filteredDb.filter(x => x.status === stage);
                html += `
                    <div class="kanban-col">
                        <div class="p-4 border-b border-[var(--border)] flex justify-between items-center bg-black/10">
                            <span class="font-black text-[10px] uppercase tracking-widest">${stage}</span>
                            <span class="text-[10px] bg-[var(--bg-card)] px-2 rounded-full">${items.length}</span>
                        </div>
                        <div class="kanban-body">
                            ${items.map(item => `
                                <div class="p-4 bg-[var(--bg-card)] rounded-lg border border-transparent hover:border-[var(--brand)] cursor-pointer transition" onclick="openDetail('${item.id}')">
                                    <div class="flex justify-between text-[8px] opacity-40 font-black mb-1"><span>${item.id}</span><span>${item.date}</span></div>
                                    <div class="text-[10px] font-black uppercase truncate text-white mb-2">${item.customer}</div>
                                    <div class="text-[10px] font-mono text-[var(--brand)]">${item.so}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        /* --- SCORECARD REP CARDS --- */
        function renderRepCards() {
            const grid = document.getElementById('rep-stats-grid');
            const reps = [...new Set(filteredDb.map(x => x.owner))];
            
            grid.innerHTML = reps.map(rep => {
                const tickets = filteredDb.filter(x => x.owner === rep);
                const completed = tickets.filter(x => x.status === 'Completed').length;
                const percent = tickets.length > 0 ? Math.round((completed / tickets.length) * 100) : 0;
                
                return `
                    <div class="rep-card">
                        <div class="flex justify-between items-center mb-4">
                            <span class="font-black text-xs uppercase">${rep}</span>
                            <span class="text-[10px] font-mono opacity-50">${tickets.length} Units</span>
                        </div>
                        <div class="flex justify-between text-[9px] font-black uppercase text-[var(--text-dim)] mb-1">
                            <span>Efficiency</span>
                            <span>${percent}%</span>
                        </div>
                        <div class="status-bar-bg">
                            <div class="status-bar-fill bg-[var(--brand)]" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateScorecard(data) {
            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-urgent').innerText = data.filter(x => x.issue.match(/Crit|Urg/i)).length;
            document.getElementById('stat-pending').innerText = data.filter(x => x.status === 'Pending').length;
            const rate = data.length ? Math.round((data.filter(x => x.status === 'Completed').length / data.length) * 100) : 0;
            document.getElementById('stat-rate').innerText = rate + '%';
        }

        /* --- DETAIL PANE --- */
        function openDetail(id) {
            selectedId = id;
            const item = fullDb.find(x => x.id === id);
            if (!item) return;

            document.getElementById('main-layout').classList.add('split-active');
            
            document.getElementById('d-company').innerText = item.customer;
            document.getElementById('d-so').innerText = `SO: ${item.so}`;
            document.getElementById('d-id').innerText = `TKT: ${item.id}`;
            document.getElementById('d-status-badge').innerText = item.status;
            document.getElementById('d-status-badge').style.borderColor = getStatusColor(item.status);

            document.getElementById('m-owner').value = item.owner;
            document.getElementById('m-status').value = item.status;
            document.getElementById('m-notes').value = item.notes;

            document.getElementById('d-whs-info').innerText = item.whsNotes || "No warehouse logs found.";
            document.getElementById('d-driver-info').innerHTML = item.driver ? 
                `<div class="font-bold text-[var(--brand)]">${item.driver}</div><div class="opacity-60">${item.whsNotes}</div>` : 
                'No driver telemetry.';

            renderCurrentView();
        }

        function closeDetail() {
            selectedId = null;
            document.getElementById('main-layout').classList.remove('split-active');
            renderCurrentView();
        }

        async function saveRecord(autoNext = false) {
            const item = fullDb.find(x => x.id === selectedId);
            const payload = {
                guid: item.guid,
                status: document.getElementById('m-status').value,
                owner: document.getElementById('m-owner').value,
                notes: document.getElementById('m-notes').value
            };

            Toastify({ text: "Saving to Dataverse...", style: { background: "#fbbf24", color: "#000" } }).showToast();
            
            try {
                await fetch(SAVE_URL, { method: 'POST', body: JSON.stringify(payload) });
                
                // Update local state
                item.status = payload.status;
                item.owner = payload.owner;
                item.notes = payload.notes;

                if (payload.status === 'Completed') confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                
                Toastify({ text: "Record Updated Successfully", style: { background: "#10b981" } }).showToast();
                
                if (autoNext) {
                    const idx = filteredDb.findIndex(x => x.id === selectedId);
                    if (filteredDb[idx+1]) openDetail(filteredDb[idx+1].id);
                    else closeDetail();
                } else {
                    renderCurrentView();
                }
            } catch (e) {
                Toastify({ text: "Save Failed", style: { background: "#ef4444" } }).showToast();
            }
        }

        /* --- FILTERS & UTILS --- */
        function applyFilters() {
            activeFilters = {
                search: document.getElementById('global-search').value,
                whs: document.getElementById('f-wh').value,
                status: document.getElementById('f-status').value,
                urgent: document.getElementById('qf-urgent').classList.contains('active')
            };
            worker.postMessage({ type: 'FILTER', payload: { db: fullDb, criteria: activeFilters } });
        }

        function clearFilters() {
            document.getElementById('global-search').value = '';
            document.getElementById('f-wh').value = '';
            document.getElementById('f-status').value = '';
            document.getElementById('qf-urgent').classList.remove('active');
            applyFilters();
        }

        function debouncedFilter() {
            clearTimeout(window.filterTimer);
            window.filterTimer = setTimeout(applyFilters, 300);
        }

        function toggleQuickFilter(f) {
            document.getElementById(`qf-${f}`).classList.toggle('active', !activeFilters[f]);
            document.getElementById(`qf-${f}`).style.borderColor = activeFilters[f] ? 'transparent' : 'var(--brand)';
            applyFilters();
        }

        function changeFontSize(delta) {
            const root = document.documentElement;
            let current = parseInt(getComputedStyle(root).getPropertyValue('--base-font'));
            root.style.setProperty('--base-font', (current + delta) + 'px');
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'light' ? 'midnight' : 'light');
        }

        function setFormLayout(layout) {
            const container = document.getElementById('dynamic-form-fields');
            container.className = 'space-y-6 transition-all';
            if (layout === 'grid') container.classList.add('form-grid');
            if (layout === 'compact') container.classList.add('form-compact');
        }

        function getStatusColor(s) {
            const colors = { 'Pending': '#94a3b8', 'Working on': '#fbbf24', 'Escalated': '#ef4444', 'Completed': '#10b981', 'Sent Back': '#a855f7' };
            return colors[s] || '#fff';
        }

        /* --- MAP & CHARTS --- */
        function initLeaflet() {
            if (mapInstance) return;
            mapInstance = L.map('map-container').setView([40.7, -74.0], 7);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mapInstance);
            markerGroup = L.layerGroup().addTo(mapInstance);
            updateMap(filteredDb);
        }

        function updateMap(data) {
            if (!markerGroup) return;
            markerGroup.clearLayers();
            const ZIP_COORDS = {'010':[42.2,-72.6],'020':[42.1,-71.2],'070':[40.8,-74.2],'100':[40.7,-74.0],'190':[40.0,-75.3]};
            
            data.forEach(item => {
                const coords = ZIP_COORDS[item.zip3] || [40.7 + (Math.random()*2), -74.0 + (Math.random()*2)];
                L.circleMarker(coords, { radius: 6, color: getStatusColor(item.status), fillOpacity: 0.8 })
                 .bindPopup(`<b>${item.customer}</b><br>SO: ${item.so}`)
                 .addTo(markerGroup);
            });
        }

        function updateCharts(data, whs) {
            const ctxWhs = document.getElementById('chart-whs').getContext('2d');
            if (chartInstances.whs) chartInstances.whs.destroy();
            chartInstances.whs = new Chart(ctxWhs, {
                type: 'bar',
                data: {
                    labels: Object.keys(whs),
                    datasets: [{ label: 'Load by Warehouse', data: Object.values(whs), backgroundColor: '#2dd4bf' }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const ctxIss = document.getElementById('chart-issue').getContext('2d');
            const issues = {}; data.forEach(d => issues[d.issue] = (issues[d.issue]||0)+1);
            if (chartInstances.iss) chartInstances.iss.destroy();
            chartInstances.iss = new Chart(ctxIss, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(issues),
                    datasets: [{ data: Object.values(issues), backgroundColor: ['#ef4444', '#fbbf24', '#2dd4bf', '#a855f7'] }]
                },
                options: { maintainAspectRatio: false }
            });
        }

        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(filteredDb);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "LogisticsData");
            XLSX.writeFile(wb, `LogiLeap_Export_${new Date().getTime()}.xlsx`);
        }
    </script>
</body>
</html>
