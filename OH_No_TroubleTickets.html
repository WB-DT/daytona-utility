<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UH OH.....! V1.0</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Theme Variables */
            --bg-dark: #1f1f1f;
            --bg-panel: #2d2d2d;
            --bg-input: #3a3a3a;
            --bg-hover: #454545;
            --accent: #0078d4;
            --accent-hover: #106ebe;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border: #484848;
            --danger: #e81123;
            --success: #107c10;
            --radius: 6px; /* Consistent Radius */
        }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar (Ticket List) --- */
        #sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            background: #252525;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-title-row { display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title-row h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text-primary); }

        /* Taller Search Box */
        .search-container { position: relative; width: 100%; }
        .search-input {
            width: 100%;
            height: 48px; /* Taller as requested */
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            padding-left: 36px;
            font-size: 14px;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-icon { position: absolute; left: 12px; top: 16px; color: var(--text-secondary); }

        #ticket-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .ticket-card {
            background-color: var(--bg-input);
            padding: 14px;
            margin-bottom: 8px;
            border-radius: var(--radius);
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }
        .ticket-card:hover { background-color: var(--bg-hover); }
        .ticket-card.active { background-color: #3e3e4e; border-left-color: var(--accent); }
        
        /* Priority Colors */
        .ticket-card.priority-High { border-left-color: var(--danger); }
        .ticket-card.priority-Medium { border-left-color: #ffb900; }
        .ticket-card.priority-Low { border-left-color: var(--success); }

        /* --- Main Content (Split Layout) --- */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            position: relative;
            overflow: hidden;
        }

        /* Top Header */
        .planner-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-panel);
            flex-shrink: 0;
        }

        .user-profile {
            display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary);
        }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #555; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

        /* Workspace: Split 50/50 */
        .workspace-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
        }

        /* Left Panel: Data & Notes */
        .panel-left {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Right Panel: Controls */
        .panel-right {
            width: 50%;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        /* Inputs */
        .form-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        .dark-input, .dark-select {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: var(--radius);
            font-size: 14px;
            width: 100%;
            transition: border-color 0.2s;
        }
        .dark-input:focus, .dark-select:focus { border-color: var(--accent); }
        
        /* Title Input Special Styling */
        .title-input {
            font-size: 20px;
            font-weight: 600;
            background: transparent;
            border: 1px solid transparent;
            padding: 5px;
        }
        .title-input:hover { border-color: var(--border); }
        .title-input:focus { border-color: var(--accent); background: var(--bg-input); }

        /* Notes Area */
        textarea.dark-input {
            resize: vertical;
            min-height: 250px; /* Tall notes area */
            line-height: 1.5;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Buttons */
        .btn {
            background-color: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn:hover { background-color: var(--bg-hover); border-color: var(--text-secondary); }
        
        .btn-primary { background-color: var(--accent); border-color: var(--accent); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        
        .btn-mvgo { 
            background: linear-gradient(135deg, #0078d4, #00bcf2); 
            border: none; 
            color: white; 
            width: 100%;
            padding: 12px;
            font-size: 14px;
        }
        .btn-mvgo:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Grid for Right Panel Controls */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Sections */
        .section-header {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Modals */
        #auth-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

    </style>
</head>
<body>

    <div id="auth-overlay">
        <h2 style="margin-bottom: 20px;">Analytics & Workforce Tracker</h2>
        <button class="btn btn-primary" onclick="signIn()" style="padding: 12px 24px; font-size: 16px;">
            <i class="fab fa-microsoft"></i> Sign In with Microsoft
        </button>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <h2>Bug Tracker</h2>
                <button class="btn" style="padding: 6px 10px;" onclick="refreshTickets()"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Search tickets..." id="search-box" onkeyup="filterTickets()">
            </div>
            <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="createNewTicket()">
                <i class="fas fa-plus"></i> New Ticket
            </button>
        </div>
        <div id="ticket-list">
            </div>
    </div>

    <div id="main-content">
        <div class="planner-header">
            <div style="font-size: 14px; font-weight: 600; color: var(--accent);">
                <i class="fas fa-layer-group"></i> Analytics / Workforce / <span id="header-bucket-display">General</span>
            </div>
            <div class="user-profile">
                <span id="user-name">Not Signed In</span>
                <div class="avatar" id="user-avatar">--</div>
            </div>
        </div>

        <div class="workspace-body">
            
            <div class="panel-left">
                <div>
                    <input type="text" class="dark-input title-input" id="inp-title" placeholder="Enter task title...">
                </div>

                <div style="flex: 1; display: flex; flex-direction: column;">
                    <label class="form-label">Description & Notes</label>
                    <textarea id="inp-notes" class="dark-input" placeholder="Add detailed description, repro steps, or logs..."></textarea>
                </div>

                <div>
                    <div class="section-header">Checklist</div>
                    <div id="checklist-container">
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
                            <i class="far fa-square text-secondary"></i>
                            <input type="text" class="dark-input" style="border: none; padding: 4px;" placeholder="Add an item">
                        </div>
                    </div>
                </div>

                <div>
                    <div class="section-header">Comments</div>
                    <div id="comments-list" style="margin-bottom: 10px; font-size: 13px; color: #ccc;"></div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="inp-comment" class="dark-input" placeholder="Type a comment...">
                        <button class="btn" onclick="addComment()">Send</button>
                    </div>
                </div>
            </div>

            <div class="panel-right">
                
                <button class="btn btn-mvgo" onclick="openMVGO()">
                    <i class="fas fa-external-link-alt"></i> Open MVGO Catalog
                </button>

                <div class="section-header" style="margin-top: 10px;">Ticket Settings</div>

                <div class="control-grid">
                    <div>
                        <label class="form-label">Bucket</label>
                        <select id="inp-bucket" class="dark-select">
                            <option value="Matt">Matt</option>
                            <option value="Triage">Triage</option>
                            <option value="Backlog">Backlog</option>
                            <option value="Development">Development</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Progress</label>
                        <select id="inp-progress" class="dark-select">
                            <option value="Not started">Not started</option>
                            <option value="In progress">In progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Deferred">Deferred</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Priority</label>
                        <select id="inp-priority" class="dark-select">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Repeat</label>
                        <select id="inp-repeat" class="dark-select">
                            <option value="Does not repeat">Does not repeat</option>
                            <option value="Daily">Daily</option>
                            <option value="Weekly">Weekly</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Start Date</label>
                        <input type="date" id="inp-start" class="dark-input">
                    </div>

                    <div>
                        <label class="form-label">Due Date</label>
                        <input type="date" id="inp-due" class="dark-input">
                    </div>
                </div>

                <div class="section-header" style="margin-top: 20px;">Attachments</div>
                <button class="btn" style="width: 100%; justify-content: flex-start;">
                    <i class="fas fa-paperclip"></i> Add Attachment
                </button>
                <div id="attachment-list" style="margin-top: 10px; font-size: 12px; color: var(--text-secondary);">
                    No attachments.
                </div>

                <div style="margin-top: auto; display: flex; gap: 10px; padding-top: 20px; border-top: 1px solid var(--border);">
                    <div style="flex: 1; display: flex; align-items: center; font-size: 12px; color: var(--text-secondary);">
                        <span id="save-status"></span>
                    </div>
                    <button class="btn" onclick="deleteTicket()" style="color: var(--danger); border-color: var(--danger);">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                    <button class="btn btn-primary" onclick="saveTicket()">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>

            </div>

        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Replace with your actual Flow URLs
        const POLL_FLOW_URL = "YOUR_POLLING_FLOW_URL"; 
        const CREATE_FLOW_URL = "YOUR_CREATE_FLOW_URL";
        const UPDATE_FLOW_URL = "YOUR_UPDATE_FLOW_URL";

        const msalConfig = { 
            auth: { 
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", 
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", 
                redirectUri: window.location.href 
            }, 
            cache: { cacheLocation: "localStorage" } 
        };

        const myMSALObj = new msal.PublicClientApplication(msalConfig);
        let username = "";
        let tickets = []; // Local cache
        let currentTicketId = null;

        // --- AUTH ---
        async function signIn() {
            try {
                const response = await myMSALObj.loginPopup({ scopes: ["User.Read"] });
                handleLogin(response.account);
            } catch (error) {
                console.error(error);
                alert("Login failed: " + error.message);
            }
        }

        function handleLogin(account) {
            username = account.username;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-name').innerText = account.name;
            document.getElementById('user-avatar').innerText = account.name.substring(0,2).toUpperCase();
            
            // Start Polling
            refreshTickets();
            setInterval(refreshTickets, 60000); // 60s Poll
        }

        // --- TICKET LOGIC ---
        async function refreshTickets() {
            const btn = document.querySelector('.fa-sync-alt');
            if(btn) btn.classList.add('fa-spin');

            try {
                // SIMULATION: In real use, fetch(POLL_FLOW_URL, ...)
                // const res = await fetch(POLL_FLOW_URL, { method: 'POST', body: JSON.stringify({ user: username }) });
                // const data = await res.json();
                
                // Mock Data for Demo
                if(tickets.length === 0) {
                    tickets = [
                        { id: "101", title: "Fix Login Bug", bucket: "Triage", priority: "High", status: "In progress", description: "Login fails on iOS.", start: "2026-02-01", due: "2026-02-05" },
                        { id: "102", title: "Update Planner UI", bucket: "Matt", priority: "Medium", status: "Not started", description: "Implement side-by-side view.", start: "2026-02-03", due: "2026-02-10" }
                    ];
                }

                renderList();
            } catch (e) {
                console.error("Poll error", e);
            } finally {
                if(btn) btn.classList.remove('fa-spin');
            }
        }

        function renderList() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('search-box').value.toLowerCase();
            list.innerHTML = "";

            const filtered = tickets.filter(t => t.title.toLowerCase().includes(search) || t.id.includes(search));

            filtered.forEach(t => {
                const div = document.createElement('div');
                div.className = `ticket-card priority-${t.priority} ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px;">${t.title}</div>
                    <div style="font-size: 11px; color: var(--text-secondary); display: flex; justify-content: space-between;">
                        <span>${t.bucket}</span>
                        <span>${t.status}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterTickets() { renderList(); }

        function createNewTicket() {
            currentTicketId = null;
            // Clear inputs
            document.getElementById('inp-title').value = "";
            document.getElementById('inp-notes').value = "";
            document.getElementById('inp-bucket').value = "Triage";
            document.getElementById('inp-priority').value = "Medium";
            document.getElementById('inp-progress').value = "Not started";
            document.getElementById('inp-start').value = new Date().toISOString().split('T')[0];
            document.getElementById('inp-due').value = "";
            document.getElementById('comments-list').innerHTML = "";
            
            // Highlight nothing
            document.querySelectorAll('.ticket-card').forEach(el => el.classList.remove('active'));
            document.getElementById('header-bucket-display').innerText = "New Ticket";
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = tickets.find(x => x.id === id);
            if(!t) return;

            document.getElementById('inp-title').value = t.title;
            document.getElementById('inp-notes').value = t.description || "";
            document.getElementById('inp-bucket').value = t.bucket;
            document.getElementById('inp-priority').value = t.priority;
            document.getElementById('inp-progress').value = t.status;
            document.getElementById('inp-start').value = t.start || "";
            document.getElementById('inp-due').value = t.due || "";
            document.getElementById('header-bucket-display').innerText = t.bucket;

            renderList(); // Update active class
        }

        async function saveTicket() {
            const statusEl = document.getElementById('save-status');
            statusEl.innerText = "Saving...";
            
            const payload = {
                id: currentTicketId, // Null if new
                title: document.getElementById('inp-title').value,
                bucket: document.getElementById('inp-bucket').value,
                priority: document.getElementById('inp-priority').value,
                status: document.getElementById('inp-progress').value,
                description: document.getElementById('inp-notes').value,
                start: document.getElementById('inp-start').value,
                due: document.getElementById('inp-due').value,
                requester: username
            };

            // Simulate Network Delay / Flow Call
            await new Promise(r => setTimeout(r, 800));

            if (!currentTicketId) {
                // Create New
                const newId = "ID-" + Math.floor(Math.random() * 10000);
                payload.id = newId;
                tickets.unshift(payload);
                currentTicketId = newId;
            } else {
                // Update
                const idx = tickets.findIndex(x => x.id === currentTicketId);
                if (idx > -1) tickets[idx] = { ...tickets[idx], ...payload };
            }

            statusEl.innerText = "Saved to Planner & Dataverse.";
            setTimeout(() => statusEl.innerText = "", 3000);
            renderList();
        }

        function deleteTicket() {
            if(!currentTicketId) return;
            if(confirm("Delete this ticket?")) {
                tickets = tickets.filter(t => t.id !== currentTicketId);
                createNewTicket();
                renderList();
            }
        }

        function addComment() {
            const inp = document.getElementById('inp-comment');
            if (!inp.value) return;
            const div = document.createElement('div');
            div.style.padding = "4px 0";
            div.innerHTML = `<strong>Me:</strong> ${inp.value}`;
            document.getElementById('comments-list').appendChild(div);
            inp.value = "";
        }

        // --- MVGO FUNCTIONALITY ---
        function openMVGO() {
            // Logic to open your catalog or external tool
            const url = "https://go.masonville.com"; 
            window.open(url, '_blank');
        }

        // --- INIT ---
        window.onload = function() {
            // Check for existing token logic here if needed
        };

    </script>
</body>
</html>
