<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics/Workforce | Bug Tracker</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Theme Variables */
            --bg-dark: #1f1f1f;
            --bg-panel: #2d2d2d;
            --bg-input: #3a3a3a;
            --bg-hover: #454545;
            --accent: #0078d4;
            --accent-hover: #106ebe;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border: #484848;
            --danger: #e81123;
            --success: #107c10;
            --radius: 6px; 
        }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar (Ticket List) --- */
        #sidebar {
            width: 320px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            background: #252525;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-title-row { display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title-row h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--text-primary); }

        /* Taller Search Box */
        .search-container { position: relative; width: 100%; }
        .search-input {
            width: 100%;
            height: 48px; 
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            padding-left: 36px;
            font-size: 14px;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-icon { position: absolute; left: 12px; top: 16px; color: var(--text-secondary); }

        #ticket-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .ticket-card {
            background-color: var(--bg-input);
            padding: 14px;
            margin-bottom: 8px;
            border-radius: var(--radius);
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.2s;
        }
        .ticket-card:hover { background-color: var(--bg-hover); }
        .ticket-card.active { background-color: #3e3e4e; border-left-color: var(--accent); }
        
        /* Priority Colors */
        .ticket-card.priority-High { border-left-color: var(--danger); }
        .ticket-card.priority-Medium { border-left-color: #ffb900; }
        .ticket-card.priority-Low { border-left-color: var(--success); }

        /* --- Main Content (Split Layout) --- */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            position: relative;
            overflow: hidden;
        }

        /* Top Header */
        .planner-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-panel);
            flex-shrink: 0;
        }

        .user-profile {
            display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary);
        }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: #555; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }

        /* Workspace: Split 50/50 */
        .workspace-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
        }

        /* Left Panel: Data & Notes */
        .panel-left {
            width: 50%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Right Panel: Controls */
        .panel-right {
            width: 50%;
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        /* Inputs */
        .form-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        .dark-input, .dark-select {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: var(--radius);
            font-size: 14px;
            width: 100%;
            transition: border-color 0.2s;
        }
        .dark-input:focus, .dark-select:focus { border-color: var(--accent); }
        
        /* Title Input Special Styling */
        .title-input {
            font-size: 20px;
            font-weight: 600;
            background: transparent;
            border: 1px solid transparent;
            padding: 5px;
        }
        .title-input:hover { border-color: var(--border); }
        .title-input:focus { border-color: var(--accent); background: var(--bg-input); }

        /* Notes Area */
        textarea.dark-input {
            resize: vertical;
            min-height: 250px; /* Tall notes area */
            line-height: 1.5;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Buttons */
        .btn {
            background-color: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn:hover { background-color: var(--bg-hover); border-color: var(--text-secondary); }
        
        .btn-primary { background-color: var(--accent); border-color: var(--accent); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }

        /* Grid for Right Panel Controls */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Sections */
        .section-header {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* Modals */
        #auth-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

    </style>
</head>
<body>

    <div id="auth-overlay">
        <h2 style="margin-bottom: 20px;">Analytics & Workforce Tracker</h2>
        <button class="btn btn-primary" onclick="signIn()" style="padding: 12px 24px; font-size: 16px;">
            <i class="fab fa-microsoft"></i> Sign In with Microsoft
        </button>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <h2>Bug Tracker</h2>
                <button class="btn" style="padding: 6px 10px;" onclick="refreshTickets()"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Search tickets..." id="search-box" onkeyup="filterTickets()">
            </div>
            <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="createNewTicket()">
                <i class="fas fa-plus"></i> New Ticket
            </button>
        </div>
        <div id="ticket-list">
            </div>
    </div>

    <div id="main-content">
        <div class="planner-header">
            <div style="font-size: 14px; font-weight: 600; color: var(--accent);">
                <i class="fas fa-layer-group"></i> Analytics / Workforce / <span id="header-bucket-display">General</span>
            </div>
            <div class="user-profile">
                <span id="user-name">Not Signed In</span>
                <div class="avatar" id="user-avatar">--</div>
            </div>
        </div>

        <div class="workspace-body">
            
            <div class="panel-left">
                <div>
                    <input type="text" class="dark-input title-input" id="inp-title" placeholder="Enter task title...">
                </div>

                <div style="flex: 1; display: flex; flex-direction: column;">
                    <label class="form-label">Description & Notes</label>
                    <textarea id="inp-notes" class="dark-input" placeholder="Add detailed description, repro steps, or logs..."></textarea>
                </div>

                <div>
                    <div class="section-header">Checklist</div>
                    <div id="checklist-container">
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
                            <i class="far fa-square text-secondary"></i>
                            <input type="text" class="dark-input" style="border: none; padding: 4px;" placeholder="Add an item">
                        </div>
                    </div>
                </div>

                <div>
                    <div class="section-header">Comments</div>
                    <div id="comments-list" style="margin-bottom: 10px; font-size: 13px; color: #ccc;"></div>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="inp-comment" class="dark-input" placeholder="Type a comment...">
                        <button class="btn" onclick="addComment()">Send</button>
                    </div>
                </div>
            </div>

            <div class="panel-right">
                
                <div class="section-header" style="margin-top: 0;">Ticket Settings</div>

                <div class="control-grid">
                    <div>
                        <label class="form-label">Assigned To</label>
                        <input type="text" id="inp-assigned" class="dark-input" placeholder="Unassigned">
                    </div>

                    <div>
                        <label class="form-label">Bucket</label>
                        <select id="inp-bucket" class="dark-select">
                            <option value="Matt">Matt</option>
                            <option value="Triage">Triage</option>
                            <option value="Backlog">Backlog</option>
                            <option value="Development">Development</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Progress</label>
                        <select id="inp-progress" class="dark-select">
                            <option value="Not started">Not started</option>
                            <option value="In progress">In progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Deferred">Deferred</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Priority</label>
                        <select id="inp-priority" class="dark-select">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Repeat</label>
                        <select id="inp-repeat" class="dark-select">
                            <option value="Does not repeat">Does not repeat</option>
                            <option value="Daily">Daily</option>
                            <option value="Weekly">Weekly</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Start Date</label>
                        <input type="date" id="inp-start" class="dark-input">
                    </div>

                    <div>
                        <label class="form-label">Due Date</label>
                        <input type="date" id="inp-due" class="dark-input">
                    </div>
                </div>

                <div class="section-header" style="margin-top: 20px;">Attachments</div>
                <button class="btn" style="width: 100%; justify-content: flex-start;">
                    <i class="fas fa-paperclip"></i> Add Attachment
                </button>
                <div id="attachment-list" style="margin-top: 10px; font-size: 12px; color: var(--text-secondary);">
                    No attachments.
                </div>

                <div style="margin-top: auto; display: flex; gap: 10px; padding-top: 20px; border-top: 1px solid var(--border);">
                    <div style="flex: 1; display: flex; align-items: center; font-size: 12px; color: var(--text-secondary);">
                        <span id="save-status"></span>
                    </div>
                    <button class="btn" onclick="deleteTicket()" style="color: var(--danger); border-color: var(--danger);">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                    <button class="btn btn-primary" onclick="saveTicket()">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>

            </div>

        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const FLOW_CREATE = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/3aa4d4b11ac346d2b129df08e89ced84/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=A7K99hFNiPZdmnhNcZtdX-ddFle7H_TLHsV7Ck-Xx6M";
        const FLOW_POLL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/8e66353b8e2b45618281c3301da22865/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ma3tglDIraiozHcUL46tMT-qljPHrSyweRkIm2yfU2A";
        const FLOW_UPDATE = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/305ddbb25dca43049427e3435723b6f1/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=emJDSrupKmGVFgiVuIQXYQSktIhuRuUSDecu69Wc59U";

        const msalConfig = { 
            auth: { 
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", 
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", 
                redirectUri: window.location.href 
            }, 
            cache: { cacheLocation: "localStorage" } 
        };

        const myMSALObj = new msal.PublicClientApplication(msalConfig);
        let username = "";
        let tickets = []; // Local cache
        let currentTicketId = null;
        let lastPollTime = new Date(Date.now() - 86400000).toISOString(); // Default lookback 24hrs for first run

        // --- AUTH ---
        async function signIn() {
            try {
                const response = await myMSALObj.loginPopup({ scopes: ["User.Read"] });
                handleLogin(response.account);
            } catch (error) {
                console.error(error);
                alert("Login failed: " + error.message);
            }
        }

        function handleLogin(account) {
            username = account.username;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-name').innerText = account.name;
            document.getElementById('user-avatar').innerText = account.name.substring(0,2).toUpperCase();
            
            // Start Polling
            refreshTickets();
            setInterval(refreshTickets, 60000); // 60s Poll
        }

        // --- TICKET LOGIC ---
        async function refreshTickets() {
            const btn = document.querySelector('.fa-sync-alt');
            if(btn) btn.classList.add('fa-spin');

            try {
                const payload = { lastCheck: lastPollTime, userEmail: username };
                const res = await fetch(FLOW_POLL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                
                if (res.ok) {
                    const data = await res.json();
                    
                    // Logic to merge new tickets
                    if(data.tickets && Array.isArray(data.tickets)) {
                        data.tickets.forEach(newT => {
                            const existingIdx = tickets.findIndex(t => t.id === newT.id);
                            if(existingIdx > -1) tickets[existingIdx] = newT; // Update
                            else tickets.unshift(newT); // Add new
                        });
                        lastPollTime = new Date().toISOString();
                    }
                }
                renderList();
            } catch (e) {
                console.error("Poll error", e);
            } finally {
                if(btn) btn.classList.remove('fa-spin');
            }
        }

        function renderList() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('search-box').value.toLowerCase();
            list.innerHTML = "";

            const filtered = tickets.filter(t => (t.title || "").toLowerCase().includes(search) || (t.id || "").includes(search));

            filtered.forEach(t => {
                const div = document.createElement('div');
                div.className = `ticket-card priority-${t.priority} ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px;">${t.title}</div>
                    <div style="font-size: 11px; color: var(--text-secondary); display: flex; justify-content: space-between;">
                        <span>${t.bucket}</span>
                        <span>${t.status}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterTickets() { renderList(); }

        function createNewTicket() {
            currentTicketId = null;
            // Clear inputs
            document.getElementById('inp-title').value = "";
            document.getElementById('inp-notes').value = "";
            document.getElementById('inp-bucket').value = "Triage";
            document.getElementById('inp-priority').value = "Medium";
            document.getElementById('inp-progress').value = "Not started";
            document.getElementById('inp-assigned').value = ""; // Clear assigned
            document.getElementById('inp-start').value = new Date().toISOString().split('T')[0];
            document.getElementById('inp-due').value = "";
            document.getElementById('comments-list').innerHTML = "";
            
            // Highlight nothing
            document.querySelectorAll('.ticket-card').forEach(el => el.classList.remove('active'));
            document.getElementById('header-bucket-display').innerText = "New Ticket";
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = tickets.find(x => x.id === id);
            if(!t) return;

            document.getElementById('inp-title').value = t.title || "";
            document.getElementById('inp-notes').value = t.description || "";
            document.getElementById('inp-bucket').value = t.bucket || "Triage";
            document.getElementById('inp-priority').value = t.priority || "Medium";
            document.getElementById('inp-progress').value = t.status || "Not started";
            document.getElementById('inp-assigned').value = t.assignedTo || ""; // Load assigned
            document.getElementById('inp-start').value = t.start ? t.start.split('T')[0] : "";
            document.getElementById('inp-due').value = t.due ? t.due.split('T')[0] : "";
            document.getElementById('header-bucket-display').innerText = t.bucket || "Ticket";

            renderList(); // Update active class
        }

        async function saveTicket() {
            const statusEl = document.getElementById('save-status');
            statusEl.innerText = "Saving...";
            
            const payload = {
                id: currentTicketId, 
                title: document.getElementById('inp-title').value,
                bucket: document.getElementById('inp-bucket').value,
                priority: document.getElementById('inp-priority').value,
                status: document.getElementById('inp-progress').value,
                assignedTo: document.getElementById('inp-assigned').value, // Add assigned
                description: document.getElementById('inp-notes').value,
                startDate: document.getElementById('inp-start').value,
                dueDate: document.getElementById('inp-due').value,
                requester: username
            };

            const url = currentTicketId ? FLOW_UPDATE : FLOW_CREATE;

            try {
                const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                if (!res.ok) throw new Error("Flow Failed");
                
                const responseData = await res.json(); // Expect flow to return ID if new

                if (!currentTicketId) {
                    // Created New
                    payload.id = responseData.dataverseId || ("TEMP-" + Date.now()); 
                    tickets.unshift(payload);
                    currentTicketId = payload.id;
                } else {
                    // Updated
                    const idx = tickets.findIndex(x => x.id === currentTicketId);
                    if (idx > -1) tickets[idx] = { ...tickets[idx], ...payload };
                }

                statusEl.innerText = "Saved!";
                setTimeout(() => statusEl.innerText = "", 3000);
                renderList();
            } catch (e) {
                console.error(e);
                statusEl.innerText = "Error Saving.";
            }
        }

        function deleteTicket() {
            if(!currentTicketId) return;
            if(confirm("Delete this ticket from view? (Note: This does not delete from Dataverse yet)")) {
                tickets = tickets.filter(t => t.id !== currentTicketId);
                createNewTicket();
                renderList();
            }
        }

        function addComment() {
            const inp = document.getElementById('inp-comment');
            if (!inp.value) return;
            const div = document.createElement('div');
            div.style.padding = "4px 0";
            div.innerHTML = `<strong>Me:</strong> ${inp.value}`;
            document.getElementById('comments-list').appendChild(div);
            inp.value = "";
        }

        // --- INIT ---
        window.onload = function() {
            // Check for existing token logic here if needed
        };

    </script>
</body>
</html>
