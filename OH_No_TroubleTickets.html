
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics/Workforce | Bug Tracker Pro</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            /* Theme Variables */
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-input: #2c2c2c;
            --bg-hover: #3a3a3a;
            --accent: #0078d4;
            --accent-hover: #106ebe;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --border: #3d3d3d;
            --danger: #e81123;
            --success: #107c10;
            --radius: 8px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; outline: none; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 340px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(to bottom, #252525, #1e1e1e);
        }

        .sidebar-title-row { display: flex; justify-content: space-between; align-items: center; }
        .sidebar-title-row h2 { margin: 0; font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.5px; }
        .count-badge { font-size: 11px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: var(--text-secondary); }

        /* Search & Filter */
        .search-container { position: relative; width: 100%; }
        .search-input {
            width: 100%; height: 42px; background-color: var(--bg-input);
            border: 1px solid var(--border); border-radius: var(--radius);
            color: var(--text-primary); padding-left: 36px; font-size: 14px;
            transition: all 0.2s;
        }
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.2); }
        .search-icon { position: absolute; left: 12px; top: 13px; color: var(--text-secondary); }

        /* Advanced Filters Area */
        .advanced-filters {
            display: flex; flex-direction: column; gap: 8px; 
            padding: 10px; background: rgba(0,0,0,0.2); border-radius: var(--radius); border: 1px solid var(--border);
        }
        .filter-select {
            background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border);
            padding: 6px; border-radius: 4px; font-size: 12px; width: 100%;
        }

        .filter-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 4px; }
        .toggle-switch { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; user-select: none; }
        .toggle-track { width: 32px; height: 18px; background: var(--bg-input); border-radius: 10px; position: relative; transition: 0.3s; border: 1px solid var(--border); }
        .toggle-thumb { width: 14px; height: 14px; background: var(--text-secondary); border-radius: 50%; position: absolute; top: 1px; left: 1px; transition: 0.3s; }
        .toggle-checkbox { display: none; }
        .toggle-checkbox:checked + .toggle-track { background: var(--accent); border-color: var(--accent); }
        .toggle-checkbox:checked + .toggle-track .toggle-thumb { transform: translateX(14px); background: white; }

        #sort-select {
            background: transparent; color: var(--text-secondary); border: none; font-size: 12px; cursor: pointer; text-align: right;
        }
        #sort-select:hover { color: var(--accent); }

        #ticket-list { flex: 1; overflow-y: auto; padding: 12px; }

        /* Ticket Cards */
        .ticket-card {
            background-color: var(--bg-input); padding: 16px; margin-bottom: 10px;
            border-radius: var(--radius); cursor: pointer; border-left: 4px solid transparent;
            transition: transform 0.2s, background 0.2s; position: relative;
        }
        .ticket-card:hover { background-color: var(--bg-hover); transform: translateX(2px); }
        .ticket-card.active { background-color: #2b3a4a; border-left-color: var(--accent); box-shadow: var(--shadow-lg); }
        
        .ticket-card.priority-High, .ticket-card.priority-Critical { border-left-color: var(--danger); }
        .ticket-card.priority-Medium { border-left-color: #ffb900; }
        .ticket-card.priority-Low { border-left-color: var(--success); }

        .card-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .card-title { font-weight: 600; font-size: 14px; line-height: 1.4; }
        .card-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); }
        .status-pill { padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); font-weight: 600; }
        
        /* Source Badge */
        .source-badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; margin-left: 5px; opacity: 0.7; }
        .source-dv { background-color: #744da9; color: white; }
        .source-pl { background-color: #0078d4; color: white; }

        /* --- Main Content --- */
        #main-content {
            flex: 1; display: flex; flex-direction: column; background-color: var(--bg-dark);
            position: relative; overflow: hidden;
        }

        .planner-header {
            padding: 16px 30px; border-bottom: 1px solid var(--border); display: flex;
            align-items: center; justify-content: space-between; background-color: var(--bg-panel);
            flex-shrink: 0; height: 70px;
        }

        .user-profile { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-secondary); }
        .avatar { 
            width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #0078d4, #00bcf2);
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px;
        }

        .workspace-body { display: flex; flex: 1; overflow: hidden; padding: 30px; gap: 30px; }

        .panel-left { width: 55%; display: flex; flex-direction: column; gap: 24px; overflow-y: auto; padding-right: 10px; }
        .panel-right { 
            width: 45%; background-color: var(--bg-panel); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column;
            gap: 20px; overflow-y: auto; box-shadow: var(--shadow-lg);
        }

        .form-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 6px; display: block; letter-spacing: 0.5px; }
        
        .dark-input, .dark-select {
            background-color: var(--bg-input); border: 1px solid var(--border); color: var(--text-primary);
            padding: 12px 14px; border-radius: var(--radius); font-size: 14px; width: 100%;
            transition: all 0.2s;
        }
        .dark-input:focus, .dark-select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.2); }
        
        /* Validation Error State */
        .input-error { border-color: var(--danger) !important; background-color: rgba(232, 17, 35, 0.05) !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .title-input { font-size: 24px; font-weight: 700; background: transparent; border: 1px solid transparent; padding: 8px 0; }
        .title-input:hover { border-bottom-color: var(--border); }
        .title-input:focus { border-color: transparent; border-bottom-color: var(--accent); box-shadow: none; background: transparent; }

        textarea.dark-input { resize: vertical; min-height: 300px; line-height: 1.6; font-family: 'Segoe UI', sans-serif; }

        /* Modern Buttons */
        .btn {
            background-color: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border);
            padding: 10px 20px; border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s;
        }
        .btn:hover { background-color: var(--bg-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        
        .btn-primary { background-color: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 4px 6px rgba(0, 120, 212, 0.3); }
        .btn-primary:hover { background-color: var(--accent-hover); }
        
        .btn-loading { opacity: 0.7; pointer-events: none; }
        .btn-loading i { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .section-header { font-size: 12px; font-weight: 700; color: var(--accent); border-bottom: 2px solid var(--border); padding-bottom: 8px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }

        /* Toast Notifications */
        #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: var(--bg-panel); color: white; padding: 16px 20px; border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px;
            transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-left: 4px solid var(--accent); min-width: 300px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast.info { border-left-color: var(--accent); }

        #auth-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999;
        }

        /* Comments */
        .comment-bubble { background: var(--bg-hover); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
        .comment-user { font-weight: bold; color: var(--accent); font-size: 11px; margin-bottom: 2px; }

        /* File Upload */
        .file-preview-item {
            background: var(--bg-input); padding: 8px; margin-top: 5px; border-radius: 4px; 
            display: flex; justify-content: space-between; align-items: center; font-size: 12px;
            border: 1px dashed var(--border);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="auth-overlay">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-bug" style="font-size: 48px; color: var(--accent); margin-bottom: 10px;"></i>
            <h2 style="font-size: 24px; font-weight: 300;">Analytics & Workforce Tracker</h2>
            <p style="color: var(--text-secondary); margin-top: 5px;">Bridged via Power Automate</p>
        </div>
        <button class="btn btn-primary" onclick="signIn()" style="padding: 14px 32px; font-size: 16px;">

        </button>

    </div>

    <input type="file" id="csv-import" accept=".csv" style="display: none;" onchange="handleCsvImport(event)">

    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title-row">
                <div>
                    <h2>Bug Tracker</h2>
                    <span class="count-badge" id="ticket-count-display">0 items</span>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn" style="padding: 6px 10px; border:none;" onclick="document.getElementById('csv-import').click()" title="Import from CSV"><i class="fas fa-file-import"></i></button>
                    <button class="btn" style="padding: 6px 10px; border:none;" onclick="exportToCSV()" title="Export to Excel"><i class="fas fa-file-csv"></i></button>
                    <button class="btn" style="padding: 6px 10px; border:none;" onclick="forceRefresh()" title="Force Refresh"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>
            
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Search tickets..." id="search-box" onkeyup="filterTickets()">
            </div>

            <div class="advanced-filters">
                <div style="font-size: 10px; color: var(--text-secondary); text-transform: uppercase; font-weight: bold;">Filters</div>
                <select id="filter-bucket" class="filter-select" onchange="filterTickets()">
                    <option value="All">All Buckets</option>
                    <option value="Matt">Matt</option>
                    <option value="GUI Uploads">GUI Uploads</option>
                    <option value="Anslee">Anslee</option>
                    <option value="Lori">Lori</option>
                    <option value="Unassigned">Unassigned</option>
                </select>
                <div style="display: flex; gap: 5px;">
                    <select id="filter-status" class="filter-select" onchange="filterTickets()">
                        <option value="All">All Status</option>
                        <option value="Not started">Not Started</option>
                        <option value="In progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                    <select id="filter-priority" class="filter-select" onchange="filterTickets()">
                        <option value="All">All Priority</option>
                        <option value="Critical">Critical</option>

                        <option value="Low">Low</option>
                    </select>
                </div>
            </div>

            <div class="filter-row">
                <label class="toggle-switch">
                    <input type="checkbox" class="toggle-checkbox" id="my-tickets-toggle" onchange="filterTickets()">
                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                    <span>My Items</span>
                </label>
                <select id="sort-select" onchange="sortTickets()">
                    <option value="newest">Newest First</option>
                    <option value="priority">Priority</option>

            </div>

            <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="createNewTicket()">
                <i class="fas fa-plus"></i> New Ticket
            </button>
        </div>
        <div id="ticket-list">
            </div>
    </div>

    <div id="main-content">
        <div class="planner-header">
            <div style="display:flex; flex-direction:column;">
                <span style="font-size: 10px; color: var(--text-secondary); text-transform:uppercase; letter-spacing:1px;">Current Bucket</span>
                <div style="font-size: 16px; font-weight: 700; color: var(--accent);" id="header-bucket-display">General</div>
            </div>
            <div class="user-profile">
                <span id="user-name">Not Signed In</span>
                <div class="avatar" id="user-avatar">--</div>
            </div>
        </div>

            <div class="panel-left">
                <div>
                    <input type="text" class="dark-input title-input" id="inp-title" placeholder="Enter task title (Required)">
                </div>

                <div style="flex: 1; display: flex; flex-direction: column;">
                    <label class="form-label">Description & Notes</label>
                    <textarea id="inp-notes" class="dark-input" placeholder="Describe the issue, reproduction steps, or paste logs here..."></textarea>
                </div>

                <div>
                    <div class="section-header">Checklist</div>
                    <div id="checklist-container">
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
                            <i class="far fa-square text-secondary"></i>
                            <input type="text" class="dark-input" style="border: none; padding: 4px;" placeholder="Add an item">

                    </div>

                <div>

                        <input type="text" id="inp-comment" class="dark-input" placeholder="Type a comment...">
                        <button class="btn" onclick="addComment()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <div class="panel-right">
                
                <div class="section-header" style="margin-top: 0;">Ticket Settings</div>

                <div class="control-grid">

                        <label class="form-label">Assigned To</label>
                        <input type="text" id="inp-assigned" class="dark-input" placeholder="User Name / Email">
                    </div>

                        </select>

                        <label class="form-label">Priority</label>
                        <select id="inp-priority" class="dark-select">
                            <option value="Low">Low</option>

                            <option value="Critical">Critical</option>

                    <div>

                    </div>

                    <div>
                        <label class="form-label">Start Date</label>

                    <div>
                        <label class="form-label">Due Date</label>

                    </div>

                <div class="section-header" style="margin-top: 30px;">Attachments</div>
                <input type="file" id="file-upload" hidden onchange="handleFileSelect(this)">
                
                <button class="btn" onclick="document.getElementById('file-upload').click()" style="width: 100%; justify-content: flex-start; color: var(--text-secondary);">
                    <i class="fas fa-paperclip"></i> Add Attachment
                </button>
                <div id="attachment-list" style="margin-top: 10px;">
                    </div>

                <div style="margin-top: auto; display: flex; gap: 10px; padding-top: 20px; border-top: 1px solid var(--border);">

    <script>
        // --- CONFIGURATION OBJECT ---
        const CONFIG = {
            planId: "1OcMKeRdYkya_CVm8zy2U2UADc-E",
            buckets: {
                "Matt": "2t_X0ljqvkW0nkxKZ8Yv82UAAdUE",
                "GUI Uploads": "KCRqjuJkqUqWK_XBvrFlxWUAPlAN",
                "Anslee": "gtJqth6KWEy9WgPQ-gEATWUAG9WI",
                "Lori": "M7zGXOQcuUW5-4F90qmbXGUAGVuZ",
                "Unassigned": "cJn6qz4MukyZj3d2DbGUR2UAO8k-"
            },
            flows: {
                create: "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/3aa4d4b11ac346d2b129df08e89ced84/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=A7K99hFNiPZdmnhNcZtdX-ddFle7H_TLHsV7Ck-Xx6M",
                poll:   "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/8e66353b8e2b45618281c3301da22865/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ma3tglDIraiozHcUL46tMT-qljPHrSyweRkIm2yfU2A",
                update: "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/305ddbb25dca43049427e3435723b6f1/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=emJDSrupKmGVFgiVuIQXYQSktIhuRuUSDecu69Wc59U"
            }
        };

        // MSAL Configuration limited strictly to User.Read to avoid admin consent blocks
        const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: window.location.href }, cache: { cacheLocation: "localStorage" } };
        const myMSALObj = new msal.PublicClientApplication(msalConfig);
        
        // --- MAPPINGS ---
        const bucketIdToName = Object.fromEntries(Object.entries(CONFIG.buckets).map(a => a.reverse()));
        const dvPriorityMap = { "Low": 473930000, "Medium": 473930001, "High": 473930002, "Critical": 473930003 };
        const dvStatusMap = { "Not started": 473930000, "In progress": 473930001, "Completed": 473930002, "Deferred": 473930003 };

        let username = "";
        let tickets = []; 
        let currentTicketId = null;
        let pendingAttachment = null; 

        // --- AUTH ---
        async function signIn() {
            try { 
                const response = await myMSALObj.loginPopup({ scopes: ["User.Read"] }); 
                handleLogin(response.account); 
            } 
            catch (error) { 
                console.error(error); 
                showToast("Login failed: " + error.message, "error"); 
            }
        }

        function handleLogin(account) {
            username = account.username;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-name').innerText = account.name;
            document.getElementById('user-avatar').innerText = account.name.substring(0,2).toUpperCase();
            showToast(`Welcome, ${account.name.split(' ')[0]}!`, "success");
            refreshTickets();
            setInterval(refreshTickets, 60000); 
        }

        // --- NORMALIZATION HELPERS ---
        function normalizeDataverse(item) {
            const bucketId = item['cr714_bucket'] || "";
            const bucketName = bucketIdToName[bucketId] || "Triage";
            return {
                id: item['cr714_cr_bugtrackerid'],
                source: 'dataverse',
                linkedPlannerId: item['cr714_plannertaskid'],
                title: item['cr714_topic'] || "No Title",
                description: item['cr714_description'] || "",
                bucket: bucketName, bucketName: bucketName, bucketId: bucketId,
                priority: item['cr714_priority@OData.Community.Display.V1.FormattedValue'] || "Medium",
                status: item['cr714_status@OData.Community.Display.V1.FormattedValue'] || "Not started",
                assignedTo: item['_ownerid_value@OData.Community.Display.V1.FormattedValue'] || item['_owninguser_value@OData.Community.Display.V1.FormattedValue'] || "",
                requester: item['_createdby_value@OData.Community.Display.V1.FormattedValue'] || "",
                startDate: item['createdon'] || "", 
                dueDate: item['cr714_duedate'] || ""
            };
        }

        function normalizePlanner(item) {
            let prio = "Medium";
            const p = item.priority || 5;
            if(p <= 1) prio = "Critical";
            else if(p <= 4) prio = "High";
            else if(p > 8) prio = "Low";

            let stat = "Not started";
            if(item.percentComplete === 100) stat = "Completed";
            else if(item.percentComplete > 0) stat = "In progress";

            const bucketName = bucketIdToName[item.bucketId] || "Triage";

            return {
                id: item.id,
                source: 'planner',
                linkedPlannerId: null,
                title: item.title || "No Title",
                description: item.hasDescription ? "(See Planner for details)" : "",
                bucket: bucketName, bucketName: bucketName, bucketId: item.bucketId,
                priority: prio,
                status: stat,
                assignedTo: "Planner User",
                requester: "Planner",
                startDate: item.startDateTime || item.createdDateTime || "",
                dueDate: item.dueDateTime || ""
            };
        }

        // --- TICKET LOGIC ---
        function forceRefresh() { refreshTickets(); }

        async function refreshTickets() {
            const btn = document.querySelector('.fa-sync-alt');
            if(btn) btn.classList.add('fa-spin');

            try {
                // Poll via Power Automate Webhook
                const payload = { }; 
                const res = await fetch(CONFIG.flows.poll, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                
                if (res.ok) {
                    const data = await res.json();
                    
                    let dvRaw = [];
                    let plRaw = [];

                    if (data.dataverse && Array.isArray(data.dataverse)) dvRaw = data.dataverse;
                    else if (data.value && Array.isArray(data.value)) dvRaw = data.value;

                    if (data.planner && Array.isArray(data.planner)) plRaw = data.planner;

                    const dvNormalized = dvRaw.map(normalizeDataverse);
                    const plNormalized = plRaw.map(normalizePlanner);

                    const linkedIds = new Set(dvNormalized.map(t => t.linkedPlannerId).filter(Boolean));
                    const plFiltered = plNormalized.filter(t => !linkedIds.has(t.id));

                    tickets = [...dvNormalized, ...plFiltered];
                    
                    showToast(`Fetched ${tickets.length} items from Power Automate bridge`, "success");
                }
                renderList();
            } catch (e) { console.error("Poll error", e); showToast("Failed to fetch tasks.", "error"); } 
            finally { if(btn) btn.classList.remove('fa-spin'); }
        }

        function renderList() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('search-box').value.toLowerCase();
            const onlyMyTickets = document.getElementById('my-tickets-toggle').checked;
            const sortMode = document.getElementById('sort-select').value;

            const filterBucket = document.getElementById('filter-bucket').value;
            const filterStatus = document.getElementById('filter-status').value;
            const filterPriority = document.getElementById('filter-priority').value;

            if (!Array.isArray(tickets)) tickets = [];

            list.innerHTML = "";

            let filtered = tickets.filter(t => {
                const matchesSearch = (t.title || "").toLowerCase().includes(search) || (t.id || "").includes(search);
                const matchesUser = !onlyMyTickets || (t.requester || "").toLowerCase().includes(username.toLowerCase()) || (t.assignedTo || "").toLowerCase().includes(username.toLowerCase());
                
                const matchesBucket = filterBucket === "All" || t.bucketName === filterBucket;
                const matchesStatus = filterStatus === "All" || (t.status || "Not started").toLowerCase() === filterStatus.toLowerCase();
                const matchesPriority = filterPriority === "All" || t.priority === filterPriority;

                return matchesSearch && matchesUser && matchesBucket && matchesStatus && matchesPriority;
            });

            document.getElementById('ticket-count-display').innerText = `Showing ${filtered.length} of ${tickets.length}`;

            if (sortMode === 'priority') {
                const pMap = { 'Critical': 0, 'High': 1, 'Medium': 2, 'Low': 3 };
                filtered.sort((a,b) => (pMap[a.priority] || 99) - (pMap[b.priority] || 99));
            } else if (sortMode === 'status') {
                filtered.sort((a,b) => a.status.localeCompare(b.status));
            } else {
                filtered.sort((a,b) => new Date(b.startDate || 0) - new Date(a.startDate || 0));
            }

            filtered.forEach(t => {
                const div = document.createElement('div');
                div.className = `ticket-card priority-${t.priority} ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                
                const sourceBadge = t.source === 'dataverse' 
                    ? '<span class="source-badge source-dv">DB</span>' 
                    : '<span class="source-badge source-pl">PL</span>';

                div.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${t.title}</span>
                    </div>
                    <div class="card-meta">
                        <span>${t.bucket || 'Triage'} ${sourceBadge}</span>
                        <span class="status-pill">${t.status}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterTickets() { renderList(); }
        function sortTickets() { renderList(); }

        // --- ATTACHMENTS HANDLING ---
        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Base64 encoding for Power Automate payload processing
                    const base64Raw = e.target.result.split(',')[1];
                    pendingAttachment = {
                        name: file.name,
                        contentBytes: base64Raw,
                        type: file.type
                    };
                    renderAttachmentPreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderAttachmentPreview() {
            const container = document.getElementById('attachment-list');
            container.innerHTML = "";
            if(pendingAttachment) {
                container.innerHTML = `
                    <div class="file-preview-item">
                        <span><i class="fas fa-file"></i> ${pendingAttachment.name}</span>
                        <i class="fas fa-times" style="cursor:pointer; color:var(--danger)" onclick="clearAttachment()"></i>
                    </div>
                `;
            } else {
                container.innerHTML = `<div style="font-size:12px; color:var(--text-secondary); font-style:italic">No attachments selected. Sent to flow on save.</div>`;
            }
        }

        function clearAttachment() {
            pendingAttachment = null;
            document.getElementById('file-upload').value = ""; // Reset input
            renderAttachmentPreview();
        }

        // --- CSV IMPORT HANDLING ---
        function handleCsvImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Using PapaParse to handle complex strings and line breaks within the CSV fields
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async function(results) {
                    const data = results.data;
                    if(data.length === 0) {
                        showToast("No data found in CSV", "warning");
                        return;
                    }
                    
                    showToast(`Starting import of ${data.length} tasks... Please leave window open.`, "info");
                    let successCount = 0;
                    
                    // Loop sequentially so we don't spam and crash the Power Automate webhook
                    for (const row of data) {
                        try {
                            const title = row['Task / Subject'] || "Imported Task";
                            const desc = row['Latest Details'] || "";
                            let statusRaw = (row['Task Status'] || "").toLowerCase();
                            
                            // Map CSV status to Planner Status
                            let mappedStatus = "Not started";
                            if (statusRaw.includes('complete') || statusRaw.includes('resolve') || statusRaw.includes('finish')) {
                                mappedStatus = "Completed";
                            } else if (statusRaw.includes('pending') || statusRaw.includes('progress')) {
                                mappedStatus = "In progress";
                            }

                            // Clean and parse the dates ("Tuesday, December 2, 2025 at 9:41:19 AM" -> Valid JS Date)
                            let startDateStr = null;
                            if (row['Date Started']) {
                                const cleanDate = row['Date Started'].replace(' at ', ' ');
                                const parsedDate = new Date(cleanDate);
                                if(!isNaN(parsedDate)) startDateStr = parsedDate.toISOString().split('T')[0];
                            }

                            let dueDateStr = null;
                            if (row['Last Updated']) {
                                const cleanDue = row['Last Updated'].replace(' at ', ' ');
                                const parsedDue = new Date(cleanDue);
                                if(!isNaN(parsedDue)) dueDateStr = parsedDue.toISOString().split('T')[0];
                            }
                            
                            const threadCount = row['Thread Count'] ? `[Thread Count: ${row['Thread Count']}]\n\n` : "";

                            const payload = {
                                id: null,
                                plannerTaskId: null,
                                title: title,
                                bucket: CONFIG.buckets["Unassigned"],
                                bucketName: "Unassigned",
                                priority: "Medium",
                                priorityCode: dvPriorityMap["Medium"],
                                status: mappedStatus,
                                statusCode: dvStatusMap[mappedStatus],
                                assignedTo: "",
                                description: `${threadCount}${desc}`,
                                startDate: startDateStr,
                                dueDate: dueDateStr,
                                requester: username || "System Import",
                                planId: CONFIG.planId,
                                attachment: null
                            };

                            // Send directly to the Flow create webhook
                            await fetch(CONFIG.flows.create, { 
                                method: 'POST', 
                                headers: {'Content-Type': 'application/json'}, 
                                body: JSON.stringify(payload) 
                            });
                            
                            successCount++;
                        } catch(e) {
                            console.error("Failed to import row", row, e);
                        }
                    }
                    
                    showToast(`Import finished! Successfully imported ${successCount} tasks.`, "success");
                    document.getElementById('csv-import').value = ''; // Reset input
                    forceRefresh(); // Pull the new list
                },
                error: function(err) {
                    showToast("Error parsing CSV. See console.", "error");
                    console.error(err);
                }
            });
        }

        function createNewTicket() {
            currentTicketId = null;
            pendingAttachment = null;
            document.getElementById('inp-title').value = "";
            document.getElementById('inp-notes').value = "";
            document.getElementById('inp-bucket').value = "Unassigned";
            document.getElementById('inp-priority').value = "Medium";
            document.getElementById('inp-progress').value = "Not started";
            document.getElementById('inp-assigned').value = "";
            document.getElementById('inp-start').value = new Date().toLocaleDateString('en-CA'); 
            document.getElementById('inp-due').value = "";
            document.getElementById('comments-list').innerHTML = "";
            
            document.getElementById('inp-title').classList.remove('input-error');
            document.querySelectorAll('.ticket-card').forEach(el => el.classList.remove('active'));
            document.getElementById('header-bucket-display').innerText = "New Ticket";
            renderAttachmentPreview();
        }

        function loadTicket(id) {
            currentTicketId = id;
            pendingAttachment = null; 
            renderAttachmentPreview();

            const t = tickets.find(x => x.id === id);
            if(!t) return;

            document.getElementById('inp-title').value = t.title || "";
            document.getElementById('inp-notes').value = t.description || "";
            document.getElementById('inp-bucket').value = t.bucketName || t.bucket || "Triage";
            document.getElementById('inp-priority').value = t.priority || "Medium";
            document.getElementById('inp-progress').value = t.status || "Not started";
            document.getElementById('inp-assigned').value = t.assignedTo || "";
            
            // Safe date handling
            const safeDate = (d) => d ? d.split('T')[0] : "";
            document.getElementById('inp-start').value = safeDate(t.startDate);
            document.getElementById('inp-due').value = safeDate(t.dueDate);
            
            document.getElementById('header-bucket-display').innerText = t.bucketName || t.bucket || "Ticket";
            
            const commentsList = document.getElementById('comments-list');
            commentsList.innerHTML = "";
            document.getElementById('inp-title').classList.remove('input-error');

            renderList(); 
        }

        async function saveTicket() {
            const btn = document.getElementById('btn-save');
            const titleInput = document.getElementById('inp-title');
            
            if (!titleInput.value || titleInput.value.trim() === "") {
                titleInput.classList.add('input-error');
                titleInput.focus();
                showToast("Title is required to save.", "error");
                return;
            }
            titleInput.classList.remove('input-error');

            btn.classList.add('btn-loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i> Saving...';
            
            const selectedBucketName = document.getElementById('inp-bucket').value;
            const realBucketId = CONFIG.buckets[selectedBucketName] || CONFIG.buckets["Unassigned"]; 
            const selectedPriority = document.getElementById('inp-priority').value;
            const selectedStatus = document.getElementById('inp-progress').value;
            const rawStart = document.getElementById('inp-start').value;
            const rawDue = document.getElementById('inp-due').value;

            // Determine planner ID to route correctly
            let plannerIdToSend = null;
            if (currentTicketId) {
                const t = tickets.find(x => x.id === currentTicketId);
                if (t) {
                     plannerIdToSend = t.source === 'dataverse' ? t.linkedPlannerId : t.id;
                }
            }

            // Power Automate payload structure
            const payload = {
                id: currentTicketId, 
                plannerTaskId: plannerIdToSend, 
                title: titleInput.value,
                bucket: realBucketId, 
                bucketName: selectedBucketName,
                priority: selectedPriority,
                priorityCode: dvPriorityMap[selectedPriority] || 473930001,
                status: selectedStatus,
                statusCode: dvStatusMap[selectedStatus] || 473930000,
                assignedTo: document.getElementById('inp-assigned').value,
                description: document.getElementById('inp-notes').value,
                startDate: rawStart ? rawStart : null,
                dueDate: rawDue ? rawDue : null,
                requester: username,
                planId: CONFIG.planId,
                attachment: pendingAttachment ? pendingAttachment : null
            };

            const url = currentTicketId ? CONFIG.flows.update : CONFIG.flows.create;

            try {
                // Send directly to your flow webhook
                const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                if (!res.ok) throw new Error("Flow returned " + res.status);
                
                const responseData = await res.json(); 
                if (!Array.isArray(tickets)) tickets = []; 

                if (!currentTicketId) {
                    payload.id = responseData.dataverseId || ("TEMP-" + Date.now()); 
                    payload.bucket = selectedBucketName;
                    payload.source = "dataverse"; 
                    tickets.unshift(payload);
                    currentTicketId = payload.id;
                    triggerConfetti(); 
                } else {
                    const idx = tickets.findIndex(x => x.id === currentTicketId);
                    if (idx > -1) {
                        tickets[idx] = { ...tickets[idx], ...payload };
                        tickets[idx].bucket = selectedBucketName;
                    }
                }
                
                if(pendingAttachment) {
                    clearAttachment();
                    showToast("Ticket Saved (File Upload sent to Flow)", "success");
                } else {
                    showToast("Ticket Saved Successfully", "success");
                }
                renderList();
            } catch (e) {
                console.error(e);
                showToast("Save Failed: Check Flow History", "error");
            } finally {
                btn.classList.remove('btn-loading');
                btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
            }
        }

        function addComment() {
            const inp = document.getElementById('inp-comment');
            const noteField = document.getElementById('inp-notes');
            if (!inp.value.trim()) return;
            const div = document.createElement('div');
            div.className = "comment-bubble";
            div.innerHTML = `<div class="comment-user">Me • ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>${inp.value}`;
            document.getElementById('comments-list').prepend(div); 
            const timestamp = new Date().toLocaleString();
            const newEntry = `\n\n[Comment by ${username} on ${timestamp}]:\n${inp.value}`;
            noteField.value += newEntry; 
            inp.value = "";
            showToast("Comment added. Please Save to persist.", "info");
        }

        function exportToCSV() {
            if(!tickets || tickets.length === 0) { showToast("No tickets to export", "info"); return; }
            let csv = "ID,Source,Title,Bucket,Status,Priority,AssignedTo,Date\n";
            tickets.forEach(t => {
                csv += `"${t.id}","${t.source}","${t.title}","${t.bucket || ''}","${t.status}","${t.priority}","${t.assignedTo || ''}","${t.startDate || ''}"\n`;
            });
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Tickets_Export.csv";
            a.click();
            showToast("Export Downloaded", "success");
        }

        function showToast(msg, type = "info") {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${msg}`;
            document.getElementById('toast-container').appendChild(el);
            setTimeout(() => el.classList.add('show'), 100);
            setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 4000);
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100, spread: 70, origin: { y: 0.6 },
                colors: ['#0078d4', '#107c10', '#ffffff']
            });
        }
        window.onload = function() { };
    </script>
