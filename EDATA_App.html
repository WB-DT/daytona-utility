<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>WB Mason Unified Hub v7.5.0</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        /* --- DESIGN SYSTEM v7.5 --- */
        :root {
            --primary: #0078d4; --primary-dark: #005a9e;
            --gradient-primary: linear-gradient(135deg, #0078d4 0%, #00bcf2 100%);
            --gradient-danger: linear-gradient(135deg, #d13438 0%, #ea484d 100%);
            --gradient-success: linear-gradient(135deg, #107c10 0%, #21a321 100%);
            --bg-body: #f3f4f6; --bg-glass: rgba(255, 255, 255, 0.95);
            --bg-card: #ffffff;
            --text-main: #111827; --text-secondary: #6b7280;
            --border: #e5e7eb; 
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --radius-lg: 12px;
            --header-h: 60px;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a; --bg-glass: rgba(30, 41, 59, 0.95);
            --bg-card: #1e293b;
            --text-main: #f3f4f6; --text-secondary: #94a3b8;
            --border: #334155;
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; outline: none; }
        body, html { margin:0; padding:0; width:100vw; height:100vh; font-family:'Segoe UI', system-ui, sans-serif; background: var(--bg-body); color: var(--text-main); overflow: hidden; }

        /* LAYOUT */
        #app-container { display: grid; grid-template-rows: var(--header-h) auto 1fr 80px; height: 100vh; width: 100vw; }

        .header { background: var(--bg-glass); backdrop-filter: blur(12px); padding: 0 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 50; }
        .brand { font-size: 18px; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .toolbar { background: var(--bg-card); padding: 12px 24px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--border); overflow-x: auto; z-index: 40; }
        .filter-select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--bg-body); color: var(--text-main); }
        .filter-lbl { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-right: 5px; }

        .main-layout { display: flex; overflow: hidden; position: relative; }
        .sidebar { width: 360px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 20; }
        .search-input { flex-grow: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--bg-body); color: var(--text-main); margin: 16px; }
        
        .gallery { overflow-y: auto; flex-grow: 1; }
        .gallery-item { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .gallery-item:hover { background: var(--bg-body); }
        .gallery-item.selected { background: #f0f9ff; border-left-color: var(--primary); }
        [data-theme="dark"] .gallery-item.selected { background: #1e3a8a; }

        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; background: var(--bg-body); scroll-behavior: smooth; }

        .card { background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); margin-bottom: 24px; border: 1px solid var(--border); overflow: hidden; }
        .card-header { padding: 18px 24px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; color: var(--text-secondary); text-transform: uppercase; background: rgba(0,0,0,0.02); }
        .card-header.open { color: var(--primary); background: rgba(0,120,212,0.05); }
        .card-body { padding: 30px; display: none; } .card-body.open { display: block; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 11px; font-weight: 700; margin-bottom: 8px; color: var(--text-secondary); text-transform: uppercase; }
        .field input, .field select, .field textarea { padding: 12px 16px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--bg-body); color: var(--text-main); }
        .field .has-data { background: var(--bg-card); border-color: #cbd5e1; }
        .field .calc-data { background: #f0f9ff; border-color: #bae6fd; color: #0369a1; }

        .btn { padding: 10px 24px; border: none; border-radius: 99px; cursor: pointer; font-size: 13px; font-weight: 700; }
        .btn-primary { background: var(--gradient-primary); color: white; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
        .btn-danger { background: var(--gradient-danger); color: white; }

        .master-footer { background: var(--bg-glass); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 40px; gap: 30px; z-index: 60; }
        
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 5000; display: none; justify-content: flex-end; }
        .drawer { width: 60%; background: var(--bg-card); height: 100%; box-shadow: -10px 0 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }

        .hidden { display: none !important; }
        .overlay-screen { position: fixed; inset: 0; background: var(--bg-card); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform:rotate(360deg); } }

        .fluent-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .fluent-table th { text-align: left; padding: 12px; background: var(--bg-body); border-bottom: 2px solid var(--border); }
        .fluent-table td { padding: 12px; border-bottom: 1px solid var(--border); }
        .status-pill { padding: 4px 10px; border-radius: 12px; font-weight: 700; font-size: 10px; text-transform: uppercase; }
        .s-yes { background: #dff6dd; color: #107c10; } .s-no { background: #fff4ce; color: #797673; } .s-denied { background: #fde7e9; color: #d13438; }

        .hero-card { background: var(--bg-card); border-radius: 12px; padding: 30px; display: flex; align-items: center; gap: 30px; box-shadow: var(--shadow-lg); margin-bottom: 30px; border: 1px solid var(--border); }
        .hero-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--gradient-primary); color: white; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; object-fit: cover; }
    </style>
</head>
<body data-theme="light">

    <div id="initial-loader" class="overlay-screen">
        <div class="spinner"></div>
        <p style="margin-top:20px; font-weight:800;">WB MASON HUB v7.5.0</p>
        <p id="retry-msg" style="font-size:12px; color:var(--text-secondary);">Connecting...</p>
    </div>

    <div id="update-bar" style="position:absolute; top:80px; left:50%; transform:translateX(-50%); background:#333; color:white; padding:12px 24px; border-radius:99px; font-size:13px; font-weight:600; display:none; align-items:center; gap:15px; z-index:100;">
        <span>⚡ Data Update Available</span>
        <button onclick="applyUpdate()" style="background:var(--primary); color:white; border:none; padding:6px 16px; border-radius:99px; cursor:pointer;">REFRESH</button>
        <button style="background:none; border:none; color:#aaa; cursor:pointer;" onclick="document.getElementById('update-bar').style.display='none'">✕</button>
    </div>

    <div id="app-container" class="hidden">
        <div class="header">
            <div class="brand">FLORIDA UNIFIED HUB <span style="font-size:10px; background:#eff6fc; color:var(--primary); padding:2px 6px; border-radius:4px; margin-left:10px;">ARCHITECT v7.5</span></div>
            <div style="display:flex; gap:15px; align-items:center;">
                <button class="btn btn-ghost" onclick="toggleTheme()">THEME</button>
                <span id="user-display" style="font-size:12px; font-weight:700;"></span>
                <button class="btn btn-ghost" style="color:var(--danger-text);" onclick="logout()">LOGOUT</button>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="addNew()">+ New</button>
            <div style="width:1px; height:20px; background:var(--border);"></div>
            <div class="filter-group"><span class="filter-lbl">Status</span><select class="filter-select" id="f-status" onchange="runFilters()"><option value="All">All</option><option value="1">Active</option><option value="0">Inactive</option></select></div>
            <div class="filter-group"><span class="filter-lbl">Dept</span><select class="filter-select" id="f-dept" onchange="runFilters()"><option value="All">All</option></select></div>
            <div class="filter-group"><span class="filter-lbl">Title</span><select class="filter-select" id="f-title" onchange="runFilters()"><option value="All">All</option></select></div>
            <div class="filter-group"><span class="filter-lbl">Sr Mgr</span><select class="filter-select" id="f-srmgr" onchange="runFilters()"><option value="All">All</option></select></div>
            <div class="filter-group"><span class="filter-lbl">Mgr</span><select class="filter-select" id="f-mgr" onchange="runFilters()"><option value="All">All</option></select></div>
            <div style="flex-grow:1;"></div>
            <button class="btn btn-ghost" onclick="clearFilters()">Clear</button>
            <button class="btn btn-ghost" onclick="exportData()">CSV</button>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <input type="text" id="gSearch" class="search-input" placeholder="Search..." onkeyup="runFilters()">
                <div id="count-lbl" style="padding:0 20px; text-align:right; font-size:11px; font-weight:700; color:var(--primary);">Loading...</div>
                <div class="gallery" id="empGallery"></div>
            </div>

            <div class="main-content">
                <div id="hero-section" class="hero-card hidden">
                    <div class="hero-avatar" id="hero-avatar"></div>
                    <div style="flex-grow:1;">
                        <h1 id="hero-name">Name</h1>
                        <p id="hero-title">Title | Dept</p>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <span id="hero-status" class="badge s-yes">ACTIVE</span>
                            <span id="hero-probation" class="badge s-no hidden">PROBATION</span>
                            <span id="hero-review" class="badge s-denied hidden">OVERDUE REVIEW</span>
                        </div>
                    </div>
                </div>

                <form id="masterForm">
                    <input type="hidden" id="id">
                    
                    <div class="card">
                        <div class="card-header open" onclick="toggleCard(this)">1. Identity</div>
                        <div class="card-body open">
                            <div class="form-grid">
                                <div class="field"><label>Name</label><input type="text" id="cr714_employeename" required oninput="handleInput(this)"></div>
                                <div class="field"><label>Email</label><input type="email" id="cr714_emailaddress" class="has-data" oninput="handleInput(this)"></div>
                                <div class="field"><label>System ID</label><input type="text" id="cr714_employee" oninput="handleInput(this)"></div>
                                <div class="field"><label>Title</label><input type="text" id="cr714_titlename" oninput="handleInput(this); runTitleLogic(this.value)"></div>
                                <div class="field"><label>CSR Profile</label><input type="text" id="cr714_csr" oninput="handleInput(this)"></div>
                                <div class="field"><label>Empower ID</label><input type="text" id="cr714_empowerlogin" oninput="handleInput(this)"></div>
                                <div class="field"><label>Shirt Size</label><input type="text" id="cr714_shirtsize" oninput="handleInput(this)"></div>
                                <div class="field"><label>Birthday</label><input type="text" id="cr714_upcomingbirthday" placeholder="MM/DD" oninput="handleInput(this)"></div>
                                <div class="field"><label>Emergency</label><input type="text" id="cr714_parent" oninput="handleInput(this)"></div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header" onclick="toggleCard(this)">2. Management</div>
                        <div class="card-body">
                            <div class="form-grid">
                                <div class="field"><label>Department</label><input type="text" id="cr714_departmentname" oninput="handleInput(this)"></div>
                                <div class="field"><label>Location</label><input type="text" id="cr714_locationname" oninput="handleInput(this)"></div>
                                <div class="field"><label>Director</label><input type="text" id="cr714_directorname" oninput="handleInput(this)"></div>
                                <div class="field"><label>Sr Manager</label><select id="cr714_srmanager" onchange="handleInput(this)"></select></div>
                                <div class="field"><label>Manager</label><select id="cr714_managerassigned" onchange="handleInput(this)"></select></div>
                                <div class="field"><label>Phone Ext</label><input type="text" id="cr714_phoneextension" oninput="handleInput(this)"></div>
                                <div class="field"><label>Loop #</label><input type="text" id="cr714_loopnumber" oninput="handleInput(this)"></div>
                                <div class="field"><label>Personal Phone</label><input type="text" id="cr714_personalphonenumber" oninput="handleInput(this)"></div>
                                <div class="field"><label>Backup</label><input type="text" id="cr714_backupcsr" oninput="handleInput(this)"></div>
                                <div class="field"><label>Gold Star</label><input type="text" id="cr714_goldstarflag" oninput="handleInput(this)"></div>
                                <div class="field"><label>Shift</label><input type="text" id="cr714_shiftselectionname" oninput="handleInput(this)"></div>
                                <div class="field"><label>Break</label><input type="text" id="cr714_breakselectionname" oninput="handleInput(this)"></div>
                                <input type="hidden" id="cr714_srmanagerflag"><input type="hidden" id="cr714_managerflag"><input type="hidden" id="cr714_supervisorflag">
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header" onclick="toggleCard(this)">3. Timeline</div>
                        <div class="card-body">
                            <div class="form-grid">
                                <div class="field"><label>Hire Date</label><input type="date" id="cr714_hiredate" readonly></div>
                                <div class="field"><label>Start Date</label><input type="date" id="cr714_startdate" oninput="handleInput(this); runStartLogic(this.value)"></div>
                                <div class="field"><label>Probation End</label><input type="date" id="cr714_probationaryperiodenddate" readonly class="calc-data"></div>
                                <div class="field"><label>30 Day Review</label><input type="date" id="cr714__30dayreview" readonly class="calc-data"></div>
                                <div class="field"><label>90 Day Review</label><input type="date" id="cr714__90dayreview" readonly class="calc-data"></div>
                                <div class="field"><label>Last Annual</label><input type="date" id="cr714_lastannualreview" oninput="handleInput(this); runAnnualLogic(this.value)"></div>
                                <div class="field"><label>Next Annual</label><input type="date" id="cr714_annualreview" readonly class="calc-data"></div>
                                <div class="field"><label>Promo Date</label><input type="date" id="cr714_promotiondate" oninput="handleInput(this); runPromoLogic(this.value)"></div>
                                <div class="field"><label>30 Day Post</label><input type="date" id="cr714__30afterpromotion" readonly class="calc-data"></div>
                                <div class="field"><label>90 Day Post</label><input type="date" id="cr714__90afterpromotion" readonly class="calc-data"></div>
                                <div class="field"><label>Years Service</label><input type="text" id="cr714_yearsinservice" readonly></div>
                                <div class="field"><label>Status</label><select id="cr714_status" onchange="handleInput(this)"><option value="1">Active</option><option value="0">Inactive</option></select></div>
                                <div class="field"><label>Term Date</label><input type="date" id="cr714_lastdayofemployment" oninput="handleInput(this); runTermLogic(this.value)"></div>
                                <input type="hidden" id="statuscode"><input type="hidden" id="cr714_annualreviewdeliverydate">
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header open">Notes</div>
                        <div class="card-body open">
                            <textarea id="cr714_specialnotes" style="width:100%; min-height:80px; border:1px solid var(--border); border-radius:6px; padding:10px;" oninput="handleInput(this)"></textarea>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="master-footer">
            <div class="footer-identity"><div id="f-avatar-container"></div><div><h1 id="f-name">Hub</h1><p id="f-sub">Ready</p></div></div>
            <div class="footer-actions">
                <button class="btn btn-danger" onclick="terminateEmployee()">TERMINATE</button>
                <button class="btn btn-ghost" onclick="toggleDrawer(true)">History</button>
                <button class="btn btn-primary btn-save" onclick="patchData()">Save</button>
            </div>
        </div>
    </div>

    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer(false)">
        <div class="drawer" id="side-drawer" onclick="event.stopPropagation()">
            <div style="padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">
                <h2 style="margin:0; color:var(--primary);">Time Off History</h2>
                <button class="btn btn-ghost" onclick="toggleDrawer(false)">✕</button>
            </div>
            <div style="flex-grow:1; overflow-y:auto; padding:20px;" id="drawer-body"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5ace5a1dc5d54e5ab154aa5628a2957f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=uZpUWLTv8qwXx_h9H3RLFoCcOaET3bYV3g6wNpGVMsc";
        const CACHE_KEY = 'wb_hub_v7_5_db';
        const DB_NAME = 'WBDataStore';
        const DB_VERSION = 1;
        const STORE_NAME = 'appData';

        const MSAL_CONFIG = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" } };
        const msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
        const state = { user: null, employees: [], timeOff: [], selectedId: null, sortAsc: true, isDirty: false, pendingData: null };

        // --- INDEXED DB WRAPPER (Handles Large Data) ---
        const idb = {
            open: () => new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => e.target.result.createObjectStore(STORE_NAME);
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e);
            }),
            put: async (key, val) => {
                const db = await idb.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    tx.objectStore(STORE_NAME).put(val, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject();
                });
            },
            get: async (key) => {
                const db = await idb.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const req = tx.objectStore(STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject();
                });
            }
        };

        window.onbeforeunload = () => state.isDirty ? "Unsaved changes" : null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await msalInstance.handleRedirectPromise();
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) { state.user = accounts[0].name; initApp(); }
                else { msalInstance.loginPopup({ scopes: ["User.Read"] }).then(r => { state.user = r.account.name; initApp(); }); }
            } catch (e) { console.error(e); }
        });

        async function initApp() {
            document.getElementById('user-display').innerText = state.user;
            let loaded = false;
            
            // 1. Try Load from DB
            try {
                const cached = await idb.get(CACHE_KEY);
                if (cached && cached.date === new Date().toISOString().split('T')[0] && cached.user === state.user) {
                    state.employees = cached.data.employees || [];
                    state.timeOff = cached.data.timeOff || [];
                    loaded = true;
                    renderApp();
                }
            } catch(e) { console.warn("DB Error", e); }

            pollForData(loaded);
        }

        async function pollForData(alreadyLoaded, retries = 0) {
            const retryMsg = document.getElementById('retry-msg');
            if(retries > 0) { retryMsg.style.display = 'block'; retryMsg.innerText = `Connecting... ${retries}/10`; }

            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userEmail: state.user }), cache: 'no-store' });
                if (!res.ok) throw new Error("Status " + res.status);
                
                let rawData = await res.json();
                let cleanData = rawData;
                
                // SMART UNWRAP (Handles "body" wrapper automatically)
                if (rawData.body && (rawData.body.employees || rawData.body.timeOff)) cleanData = rawData.body;
                
                if (!cleanData.employees || !Array.isArray(cleanData.employees)) throw new Error("Invalid Data");

                if (!alreadyLoaded) {
                    state.employees = cleanData.employees;
                    state.timeOff = cleanData.timeOff || [];
                    await idb.put(CACHE_KEY, { date: new Date().toISOString().split('T')[0], user: state.user, data: cleanData });
                    renderApp();
                } else if (JSON.stringify(cleanData).length !== JSON.stringify({employees:state.employees, timeOff:state.timeOff}).length) {
                    state.pendingData = cleanData;
                    if(!state.isDirty && !state.selectedId) applyUpdate();
                    else document.getElementById('update-bar').style.display = 'flex';
                }
            } catch(e) {
                console.error("Poll", e);
                if(retries < 10) setTimeout(() => pollForData(alreadyLoaded, retries+1), Math.min(3000*(retries+1), 15000));
            }
        }

        function applyUpdate() {
            state.employees = state.pendingData.employees;
            state.timeOff = state.pendingData.timeOff;
            idb.put(CACHE_KEY, { date: new Date().toISOString().split('T')[0], user: state.user, data: state.pendingData });
            renderApp();
            document.getElementById('update-bar').style.display = 'none';
        }

        function renderApp() {
            document.getElementById('initial-loader').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            if (typeof populateFilters === 'function') populateFilters();
            if (typeof runFilters === 'function') runFilters();
        }

        // --- DEFINED FUNCTIONS (De-minified for Safety) ---
        function renderGallery(list) {
            if (!list) return;
            document.getElementById('empGallery').innerHTML = list.map(e => `
                <div class="gallery-item ${state.selectedId === e.id ? 'selected' : ''}" onclick="selectEmp('${e.id}')">
                    ${getAvatar(e.cr714_employeename)}
                    <div>
                        <div style="font-weight:700; font-size:13px;">${e.cr714_employeename || 'Unknown'}</div>
                        <div style="font-size:11px; color:var(--text-secondary);">${e.cr714_departmentname || 'Hub'}</div>
                    </div>
                </div>`).join('');
        }

        function selectEmp(id) {
            if(state.isDirty && !confirm("Unsaved changes?")) return;
            state.selectedId = id; state.isDirty = false;
            document.querySelector('.btn-save').classList.remove('dirty');

            const emp = state.employees.find(e => e.id === id);
            
            // Populate Fields
            Object.keys(emp).forEach(k => {
                const el = document.getElementById(k);
                if(el) {
                    let val = emp[k];
                    if(typeof val === 'string' && val.match(/^\d{4}-\d{2}-\d{2}T/)) val = val.split('T')[0];
                    el.value = val || '';
                    updateVisuals(el);
                }
            });

            // Hero & Badges
            document.getElementById('hero-section').classList.remove('hidden');
            document.getElementById('hero-name').innerText = emp.cr714_employeename || 'Unknown';
            document.getElementById('hero-title').innerText = `${emp.cr714_titlename || 'Associate'} | ${emp.cr714_departmentname || 'Hub'}`;
            document.getElementById('hero-avatar').innerHTML = getAvatar(emp.cr714_employeename, '80px').replace('40px','100%');

            const statusEl = document.getElementById('hero-status');
            statusEl.innerText = emp.cr714_status == 1 ? "ACTIVE" : "INACTIVE";
            statusEl.className = emp.cr714_status == 1 ? "badge s-yes" : "badge s-denied";

            const probEl = document.getElementById('hero-probation');
            if(emp.cr714_probationaryperiodenddate && new Date(emp.cr714_probationaryperiodenddate) > new Date()) probEl.classList.remove('hidden'); 
            else probEl.classList.add('hidden');

            const revEl = document.getElementById('hero-review');
            if(emp.cr714_annualreview && new Date(emp.cr714_annualreview) < new Date()) revEl.classList.remove('hidden'); 
            else revEl.classList.add('hidden');
            
            renderGallery(state.employees);
            document.querySelector('.main-content').scrollTop = 0;
        }

        function populateFilters() {
            const depts = [...new Set(state.employees.map(e => e.cr714_departmentname).filter(Boolean))].sort();
            const mgrs = [...new Set(state.employees.filter(e => e.cr714_managerflag === 'Y').map(e => e.cr714_employeename))].sort();
            const titles = [...new Set(state.employees.map(e => e.cr714_titlename).filter(Boolean))].sort();

            document.getElementById('f-dept').innerHTML = '<option value="All">All</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
            document.getElementById('f-srmgr').innerHTML = '<option value="All">All</option>' + mgrs.map(m => `<option value="${m}">${m}</option>`).join('');
            document.getElementById('f-mgr').innerHTML = '<option value="All">All</option>' + mgrs.map(m => `<option value="${m}">${m}</option>`).join('');
            document.getElementById('f-title').innerHTML = '<option value="All">All</option>' + titles.map(t => `<option value="${t}">${t}</option>`).join('');
            
            ['cr714_srmanager', 'cr714_managerassigned'].forEach(id => {
                document.getElementById(id).innerHTML = '<option value="">-- Select --</option>' + mgrs.map(m => `<option value="${m}">${m}</option>`).join('');
            });
        }

        function runFilters() {
            const s = document.getElementById('f-status').value;
            const d = document.getElementById('f-dept').value;
            const t = document.getElementById('f-title').value;
            const sr = document.getElementById('f-srmgr').value;
            const m = document.getElementById('f-mgr').value;
            const q = document.getElementById('gSearch').value.toLowerCase();

            let list = state.employees.filter(e => {
                const matchS = s === 'All' || e.cr714_status == s;
                const matchD = d === 'All' || e.cr714_departmentname === d;
                const matchT = t === 'All' || e.cr714_titlename === t;
                const matchSR = sr === 'All' || e.cr714_srmanager === sr;
                const matchM = m === 'All' || e.cr714_managerassigned === m;
                // Safe Search (converts null to string)
                const matchQ = (String(e.cr714_employeename || '')).toLowerCase().includes(q) 
                            || (String(e.cr714_phoneextension || '')).includes(q)
                            || (String(e.cr714_emailaddress || '')).toLowerCase().includes(q);
                return matchS && matchD && matchT && matchSR && matchM && matchQ;
            });

            list.sort((a,b) => state.sortAsc ? (a.cr714_employeename || '').localeCompare(b.cr714_employeename || '') : (b.cr714_employeename || '').localeCompare(a.cr714_employeename || ''));
            document.getElementById('count-lbl').innerText = `${list.length} Found`;
            renderGallery(list);
        }

        function toggleDrawer(s) {
            const d = document.getElementById('drawer-overlay');
            if(s && state.selectedId) {
                const emp = state.employees.find(e => e.id === state.selectedId);
                const h = state.timeOff.filter(t => (String(t.Name || t.name || '')).toLowerCase() === (String(emp.cr714_employeename || '')).toLowerCase());
                
                // Sort by Start Time (Newest First)
                h.sort((a,b) => (b['Start time'] || 0) - (a['Start time'] || 0));

                document.getElementById('drawer-body').innerHTML = `
                    <h3 style="color:var(--primary); font-size:18px; margin-bottom:20px;">${emp.cr714_employeename}</h3>
                    ${h.length ? `<table class="fluent-table"><thead><tr><th>Request</th><th>Dates</th><th>Status</th></tr></thead><tbody>${h.map(t => {
                        const type = t['Leave Type'] || t.LeaveType || 'PTO';
                        let dates = t['Request Dates'] || t.RequestDates || '-';
                        if(!isNaN(dates) && dates > 40000) dates = new Date((dates - (25567 + 2))*86400*1000).toLocaleDateString();
                        
                        let notes = t['Request Notes'] || "";
                        if(t['Approval Notes']) notes += `\n[Appr: ${t['Approval Notes']}]`;

                        let status = "PENDING", pill = "s-no";
                        if(t['Manager Approval Status'] === 'No') { status = "DENIED"; pill = "s-denied"; }
                        else if(t.Completed === 'Yes' || (t.Completed && t.Completed.startsWith('*'))) { status = "DONE"; pill = "s-yes"; }

                        return `<tr><td><b>${type}</b><br><span style="font-size:10px; color:#666;">${notes.substring(0,80)}</span></td><td>${dates}</td><td><span class="status-pill ${pill}">${status}</span></td></tr>`;
                    }).join('')}</tbody></table>` : '<p style="text-align:center; padding:50px; color:#888;">No history.</p>'}
                `;
                d.style.display = 'flex'; setTimeout(() => document.getElementById('side-drawer').classList.add('open'), 10);
            } else {
                document.getElementById('side-drawer').classList.remove('open'); setTimeout(() => d.style.display='none', 300);
            }
        }

        /* --- LOGIC UTILS --- */
        const addDays = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r.toISOString().split('T')[0]; };
        
        function runStartLogic(val) {
            if(!val) return; const start = new Date(val);
            document.getElementById('cr714__30dayreview').value = addDays(start, 30);
            document.getElementById('cr714__90dayreview').value = addDays(start, 90);
            document.getElementById('cr714_probationaryperiodenddate').value = addDays(start, 120);
            if(!document.getElementById('cr714_lastannualreview').value) document.getElementById('cr714_annualreview').value = addDays(start, 365);
            updateVisuals(document.getElementById('cr714_annualreview'));
        }

        function runTitleLogic(title) {
            const t = (title || "").toLowerCase();
            document.getElementById('cr714_srmanagerflag').value = t.includes("sr manager") ? "Y" : "N";
            document.getElementById('cr714_managerflag').value = t.includes("manager") && !t.includes("sr") ? "Y" : "N";
            document.getElementById('cr714_supervisorflag').value = t.includes("supervisor") ? "Y" : "N";
            if(!t.includes("manager") && !t.includes("supervisor")) document.getElementById('cr714_goldstarflag').value = "N";
        }

        function runTermLogic(val) {
            if(val) {
                document.getElementById('cr714_status').value = 0;
                document.getElementById('statuscode').value = 2;
                updateVisuals(document.getElementById('cr714_status'));
            }
        }

        function getAvatar(n, s='40px') {
            const name = String(n || '?');
            const i = name.split(' ').map(p=>p[0]).join('').substring(0,2).toUpperCase();
            const img = `https://wbmasonco.sharepoint.com/sites/InsideSales/Shared%20Documents/Employee%20photos/${encodeURIComponent(name)}.jpg`;
            return `<img src="${img}" style="width:${s};height:${s};border-radius:50%;object-fit:cover;border:1px solid #e5e7eb;" onerror="this.outerHTML='<div class=\\'hero-avatar\\' style=\\'width:${s};height:${s};font-size:14px;\\'>${i}</div>'">`;
        }

        function handleInput(el) { state.isDirty = true; document.querySelector('.btn-save').classList.add('dirty'); updateVisuals(el); }
        function updateVisuals(el) { if(el.value) el.classList.add('has-data'); else el.classList.remove('has-data'); }
        function toggleCard(h) { h.classList.toggle('open'); h.nextElementSibling.classList.toggle('open'); }
        function addNew() { if(state.isDirty && !confirm("Discard changes?")) return; state.selectedId = null; state.isDirty = false; document.querySelector('.btn-save').classList.remove('dirty'); document.getElementById('hero-section').classList.add('hidden'); document.getElementById('masterForm').reset(); document.querySelectorAll('.has-data').forEach(e=>e.classList.remove('has-data')); runFilters(); }
        function patchData() { state.isDirty = false; idb.put(CACHE_KEY, { date: new Date().toISOString().split('T')[0], user: state.user, data: { employees: state.employees, timeOff: state.timeOff } }); document.getElementById('post-screen').classList.remove('hidden'); }
        function hideElement(id) { document.getElementById(id).classList.add('hidden'); }
        function toggleTheme() { document.body.dataset.theme = document.body.dataset.theme === 'light' ? 'dark' : 'light'; }
        function logout() { msalInstance.logoutPopup().then(() => location.reload()); }
        function clearFilters() { document.getElementById('gSearch').value = ''; document.getElementById('f-status').value = 'All'; document.getElementById('f-dept').value = 'All'; document.getElementById('f-title').value = 'All'; document.getElementById('f-srmgr').value = 'All'; document.getElementById('f-mgr').value = 'All'; runFilters(); }
        function exportData() { alert("Generating CSV..."); }
        function toggleSort() { state.sortAsc = !state.sortAsc; runFilters(); }
    </script>
</body>
</html>
