<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - Secure Portal</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        :root {
            --primary-blue: #0078d4;
            --bg-light: #d6dde0;
            --white: #ffffff;
            --border-grey: #6a7a7f;
            --form-bg: #8c9ca1;
            --accent-green: #e8f4d9;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            height: 100vh;
        }

        .hidden { display: none !important; }
        .flex { display: flex !important; }

        /* Loader */
        #global-loader {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        /* Login Screen */
        #login-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0078d4 0%, #003a66 100%);
            color: white;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            color: #333;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* App Container */
        #app-container {
            height: 100vh;
            flex-direction: column;
        }

        .header {
            background-color: #9e9e9e;
            border: 2px solid var(--border-grey);
            border-radius: 11px;
            padding: 15px;
            text-align: center;
            margin: 10px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* UI Components */
        .screen { display: none; padding: 20px; flex-grow: 1; overflow: hidden; }
        .screen.active { display: flex; flex-direction: column; }
        .data-layout { display: flex; gap: 15px; height: calc(100vh - 200px); }
        .sidebar { width: 320px; background: var(--white); border-radius: 10px; display: flex; flex-direction: column; border: 1px solid #ccc; }
        .employee-list { overflow-y: auto; flex-grow: 1; }
        .employee-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .employee-item.selected { background: var(--primary-blue); color: white; }
        .main-content { flex-grow: 1; background: var(--form-bg); border-radius: 11px; padding: 25px; color: white; overflow-y: auto; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .data-card { display: flex; flex-direction: column; }
        .data-card input, .data-card select, .data-card textarea { padding: 10px; background: var(--accent-green); border: none; border-radius: 4px; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-login { background: var(--primary-blue); color: white; font-size: 18px; margin-top: 20px; }
        .btn-save { background: #4CAF50; color: white; width: 100%; }
        .btn-logout { background: transparent; color: white; border: 1px solid white; font-size: 12px; }
    </style>
</head>
<body>

    <div id="global-loader">
        <div>
            <div style="width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p>Authenticating...</p>
        </div>
    </div>

    <div id="login-container" class="hidden">
        <div class="login-card">
            <img src="https://img.icons8.com/color/96/microsoft.png" alt="Microsoft Logo">
            <h1>Florida Hub Portal</h1>
            <p>Please sign in with your organization account.</p>
            <button class="btn btn-login" onclick="login()">Sign In</button>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <div class="header">
            <h2 id="app-title">WB Mason Florida Hub</h2>
            <div>
                <span id="user-display" style="margin-right: 15px; font-size: 14px;"></span>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="welcome-screen" class="screen active">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                <div style="background: white; padding: 40px; border-radius: 15px; text-align: center; cursor: pointer; color: #333;" onclick="navigateTo('data-screen')">
                    <h3>Managers Console</h3>
                    <p>Employee Data Management</p>
                </div>
            </div>
        </div>

        <div id="data-screen" class="screen">
            <div style="margin-bottom: 10px;">
                <button class="btn" onclick="navigateTo('welcome-screen')">← Back</button>
            </div>
            <div class="data-layout">
                <div class="sidebar">
                    <div style="padding: 15px; background: #d9ffe2;">
                        <input type="text" id="searchInput" placeholder="Filter employees..." onkeyup="filterEmployees()" style="width:100%; padding:5px;">
                    </div>
                    <div class="employee-list" id="employeeGallery"></div>
                </div>
                <div class="main-content">
                    <form id="employeeForm" onsubmit="handlePatch(event)">
                        <input type="hidden" id="field_id">
                        <div class="form-grid">
                            <div class="data-card"><label>Employee Name</label><input type="text" id="field_EmployeeName" required></div>
                            <div class="data-card"><label>Start Date</label><input type="date" id="field_StartDate"></div>
                            <div class="data-card"><label>Department</label>
                                <select id="field_Department">
                                    <option>New Hire In Training</option>
                                    <option>Account Management 1</option>
                                </select>
                            </div>
                            <div class="data-card"><label>Location</label>
                                <select id="field_Location">
                                    <option>Daytona</option>
                                    <option>Jacksonville</option>
                                </select>
                            </div>
                            <div class="data-card" style="grid-column: span 2;"><label>Special Notes</label><textarea id="field_SpecialNotes"></textarea></div>
                        </div>
                        <button type="submit" class="btn btn-save" style="margin-top:20px;">Patch to Dataverse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <script>
        // --- MSAL CONFIGURATION ---
        const MSAL_CONFIG = {
            auth: {
                clientId: "YOUR_CLIENT_ID_HERE", // Replace with your Azure App Registration ID
                authority: "https://login.microsoftonline.com/YOUR_TENANT_ID_HERE",
                redirectUri: window.location.origin
            },
            cache: {
                cacheLocation: "sessionStorage",
                storeAuthStateInCookie: false,
            }
        };

        const msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
        const appState = {
            user: null,
            token: null,
            collection: [
                { id: "1", EmployeeName: "Abigail Landi", StartDate: "2025-10-06", Department: "New Hire In Training", Location: "Daytona", SpecialNotes: "Active Training" },
                { id: "2", EmployeeName: "Paul Muhonen", StartDate: "2023-04-20", Department: "Account Management 2", Location: "Daytona", SpecialNotes: "Senior Rep" }
            ]
        };

        // --- AUTH LOGIC ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Handle redirect promise if using redirect login
                await msalInstance.handleRedirectPromise();
                
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) {
                    appState.user = accounts[0].name;
                    initApp();
                } else {
                    document.getElementById('global-loader').classList.add('hidden');
                    document.getElementById('login-container').classList.remove('hidden');
                }
            } catch (err) {
                console.error("Auth Init Error", err);
            }
        });

        async function login() {
            try {
                const resp = await msalInstance.loginPopup({ scopes: ["User.Read", "https://org.crm.dynamics.com/user_impersonation"] });
                appState.user = resp.account.name;
                appState.token = resp.accessToken;
                initApp();
            } catch(e) { 
                alert("Login failed: " + e.message); 
            }
        }

        function logout() {
            msalInstance.logoutPopup();
        }

        function initApp() {
            document.getElementById('global-loader').classList.add('hidden');
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('flex');
            document.getElementById('user-display').innerText = `Welcome, ${appState.user}`;
            
            fetchEmployeeData(); // Start the "Get" flow
        }

        // --- DATA FLOWS ---

        async function fetchEmployeeData() {
            console.log("FLOW: [GET] Fetching from Dataverse using Token:", appState.token ? "TOKEN_PRESENT" : "NO_TOKEN_LOCAL_ONLY");
            /* PLACEHOLDER FOR DATA FLOW:
               const response = await fetch("https://yourorg.api.crm.dynamics.com/api/data/v9.2/cr714_employeeinformations", {
                   headers: { "Authorization": `Bearer ${appState.token}` }
               });
            */
            renderGallery(appState.collection);
        }

        async function handlePatch(event) {
            event.preventDefault();
            const id = document.getElementById('field_id').value;
            const data = {
                EmployeeName: document.getElementById('field_EmployeeName').value,
                Department: document.getElementById('field_Department').value,
                Location: document.getElementById('field_Location').value
            };

            console.log(`FLOW: [PATCH/POST] Sending to Dataverse. Record ID: ${id || 'NEW'}`);
            console.log("Payload:", data);

            // Simulation of Patch logic
            if(id) {
                const idx = appState.collection.findIndex(e => e.id === id);
                appState.collection[idx] = {...appState.collection[idx], ...data};
                alert("Record Updated Successfully (Patched)");
            } else {
                data.id = Date.now().toString();
                appState.collection.push(data);
                alert("New Record Created (Post)");
            }
            renderGallery(appState.collection);
        }

        // --- UI HELPERS ---
        function renderGallery(data) {
            const container = document.getElementById('employeeGallery');
            container.innerHTML = data.map(emp => `
                <div class="employee-item" onclick="selectEmployee('${emp.id}')">
                    <strong>${emp.EmployeeName}</strong><br>
                    <small>${emp.Department} | ${emp.Location}</small>
                </div>
            `).join('');
        }

        function selectEmployee(id) {
            const emp = appState.collection.find(e => e.id === id);
            document.getElementById('field_id').value = emp.id;
            document.getElementById('field_EmployeeName').value = emp.EmployeeName;
            document.getElementById('field_Department').value = emp.Department;
            document.getElementById('field_Location').value = emp.Location;
            document.getElementById('field_StartDate').value = emp.StartDate || '';
            document.getElementById('field_SpecialNotes').value = emp.SpecialNotes || '';
        }

        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.getElementById('app-title').innerText = screenId === 'welcome-screen' ? 'Florida Hub' : 'Employee Console';
        }

        function filterEmployees() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = appState.collection.filter(e => e.EmployeeName.toLowerCase().includes(val));
            renderGallery(filtered);
        }
    </script>
</body>
</html>
