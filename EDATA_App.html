<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida Hub - Management Console</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        :root {
            --primary: #0078d4;
            --bg: #d6dde0; 
            --white: #ffffff;
            --grey-border: #6a7a7f;
            --form-bg: #8c9ca1; 
            --accent-green: #e8f4d9;
            --danger: #ff5e5e;
            --success: #4CAF50;
            --sidebar-w: 380px;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            height: 100vh; overflow: hidden;
        }

        .hidden { display: none !important; }
        .flex { display: flex !important; }

        /* --- AUTH & LOADERS --- */
        #global-loader {
            position: fixed; inset: 0; background: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #login-container {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, var(--primary) 0%, #003a66 100%);
        }
        .login-card {
            background: white; padding: 50px; border-radius: 25px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        /* --- HEADER --- */
        .header {
            background-color: #9e9e9e; border: 2px solid var(--grey-border); border-radius: 12px;
            margin: 10px; padding: 12px 25px; color: white;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* --- MAIN APP STRUCTURE --- */
        #app-container { height: 100vh; flex-direction: column; }
        .screen { flex-grow: 1; padding: 10px 15px; display: none; overflow: hidden; }
        .screen.active { display: flex; flex-direction: column; }
        .console-layout { display: flex; gap: 15px; height: calc(100vh - 160px); }

        /* --- SIDEBAR GALLERY --- */
        .sidebar {
            width: var(--sidebar-w); background: white; border-radius: 15px;
            display: flex; flex-direction: column; border: 1px solid #ccc;
        }
        .search-area { padding: 15px; background: #d9ffe2; border-radius: 15px 15px 0 0; }
        .search-area input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }

        .gallery { overflow-y: auto; flex-grow: 1; }
        .gallery-item {
            padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center;
            gap: 15px; cursor: pointer; transition: 0.2s; color: #333;
        }
        .gallery-item:hover { background: #f9f9f9; }
        .gallery-item.selected { background: var(--primary) !important; color: white !important; }
        .emp-photo { width: 48px; height: 48px; border-radius: 50%; background: #eee; object-fit: cover; border: 1px solid #ccc; }

        /* --- CLEAN COLLAPSIBLE FORM --- */
        .master-form {
            flex-grow: 1; background: var(--form-bg); border-radius: 15px;
            padding: 15px; display: flex; flex-direction: column; overflow-y: auto;
        }

        .accordion-section {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .accordion-header {
            padding: 12px 20px;
            background: rgba(0,0,0,0.15);
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 13px;
        }

        .accordion-header:hover { background: rgba(0,0,0,0.25); }

        .accordion-content {
            padding: 20px;
            display: block; /* Hidden via JS if closed */
        }

        .form-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
        }

        .field-card { display: flex; flex-direction: column; }
        .field-card label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #f0f0f0; }
        .field-card input, .field-card select, .field-card textarea {
            padding: 8px 12px; border: none; border-radius: 5px; background: var(--accent-green);
            color: #333; font-size: 13px;
        }
        .field-card input:read-only { background: #cbd5d8; cursor: not-allowed; }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 9999; display: none; justify-content: center; align-items: center;
        }
        .modal { background: white; padding: 30px; border-radius: 20px; width: 450px; color: #333; }

        /* --- BUTTONS --- */
        .btn { padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-new { background: #00fbff; color: #333; }
        .btn-term { background: var(--danger); color: white; }
        .btn-save { background: var(--success); color: white; padding: 15px; font-size: 16px; width: 100%; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-outline { background: transparent; border: 1px solid white; color: white; font-size: 12px; }
    </style>
</head>
<body>

    <div id="global-loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: var(--primary); font-weight: bold;">Authenticating WB Mason Domain...</p>
    </div>

    <div id="login-container" class="hidden">
        <div class="login-card">
            <img src="https://img.icons8.com/color/96/microsoft.png" alt="MS Logo">
            <h1>Florida Hub Portal</h1>
            <p style="color: #666; margin-bottom: 30px;">Employee Dataverse Management</p>
            <button class="btn btn-new" style="padding: 15px 40px; font-size: 16px;" onclick="login()">Login with Microsoft</button>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <div class="header">
            <h2 id="page-title" style="margin: 0;">Florida Hub Console</h2>
            <div style="display: flex; align-items: center; gap: 20px;">
                <span id="user-display"></span>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="master-screen" class="screen active">
            <div style="margin-bottom: 12px; display: flex; gap: 10px;">
                <button class="btn btn-new" onclick="addNewEmployee()">+ New Employee</button>
                <button class="btn btn-term" onclick="showTerminationModal()">Terminate Record</button>
                <button class="btn" style="background:#333; color:white;" onclick="setFilter('Active')">Active Only</button>
                <button class="btn" style="background:#eee; color:#333;" onclick="setFilter('Inactive')">Inactive Only</button>
            </div>

            <div class="console-layout">
                <div class="sidebar">
                    <div class="search-area">
                        <input type="text" id="gallerySearch" placeholder="Search name, extension, loop..." onkeyup="filterGallery()">
                    </div>
                    <div class="gallery" id="employeeGallery"></div>
                </div>

                <div class="master-form">
                    <form id="employeeForm" onsubmit="handleFormPatch(event)">
                        <input type="hidden" id="cr714_id">
                        
                        <div class="accordion-section">
                            <div class="accordion-header" onclick="toggleAccordion(this)">
                                <span>1. Employee Identity</span>
                                <span>▼</span>
                            </div>
                            <div class="accordion-content">
                                <div class="form-grid">
                                    <div class="field-card"><label>Full Name</label><input type="text" id="cr714_employeename" required></div>
                                    <div class="field-card"><label>Email Address</label><input type="email" id="cr714_emailaddress"></div>
                                    <div class="field-card"><label>Title (Display)</label><input type="text" id="cr714_titlename"></div>
                                    <div class="field-card"><label>CSR Profile Name</label><input type="text" id="cr714_csr"></div>
                                    <div class="field-card"><label>Employee ID (Sys)</label><input type="text" id="cr714_employee"></div>
                                    <div class="field-card"><label>Upcoming Birthday</label><input type="text" id="cr714_upcomingbirthday" placeholder="MM/DD"></div>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-section">
                            <div class="accordion-header" onclick="toggleAccordion(this)">
                                <span>2. Work Assignment</span>
                                <span>▼</span>
                            </div>
                            <div class="accordion-content">
                                <div class="form-grid">
                                    <div class="field-card"><label>Department</label>
                                        <select id="cr714_departmentname">
                                            <option value="New Hire In Training">New Hire In Training</option>
                                            <option value="Account Management 1">Account Management 1</option>
                                            <option value="Logistics">Logistics</option>
                                        </select>
                                    </div>
                                    <div class="field-card"><label>Location</label>
                                        <select id="cr714_locationname">
                                            <option value="Daytona">Daytona</option>
                                            <option value="Jacksonville">Jacksonville</option>
                                            <option value="Miami">Miami</option>
                                        </select>
                                    </div>
                                    <div class="field-card"><label>Loop Number</label><input type="text" id="cr714_loopnumber"></div>
                                    <div class="field-card"><label>Phone Extension</label><input type="text" id="cr714_phoneextension"></div>
                                    <div class="field-card"><label>Personal Phone</label><input type="text" id="cr714_personalphonenumber"></div>
                                    <div class="field-card"><label>Shift Selection</label><input type="text" id="cr714_shiftselection"></div>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-section">
                            <div class="accordion-header" onclick="toggleAccordion(this)">
                                <span>3. Management & Flags</span>
                                <span>▼</span>
                            </div>
                            <div class="accordion-content">
                                <div class="form-grid">
                                    <div class="field-card"><label>SR Manager</label><select id="cr714_srmanager"></select></div>
                                    <div class="field-card"><label>Manager Assigned</label><select id="cr714_managerassigned"></select></div>
                                    <div class="field-card"><label>Supervisors</label><input type="text" id="cr714_supervisors"></div>
                                    <div class="field-card"><label>SR Manager Flag (Y/N)</label><input type="text" id="cr714_srmanagerflag" maxlength="1"></div>
                                    <div class="field-card"><label>Manager Flag (Y/N)</label><input type="text" id="cr714_managerflag" maxlength="1"></div>
                                    <div class="field-card"><label>Supervisor Flag (Y/N)</label><input type="text" id="cr714_supervisorflag" maxlength="1"></div>
                                    <div class="field-card"><label>Director Flag (Y/N)</label><input type="text" id="cr714_directorflag" maxlength="1"></div>
                                    <div class="field-card"><label>Gold Star Flag (Y/N)</label><input type="text" id="cr714_goldstarflag" maxlength="1"></div>
                                    <div class="field-card"><label>Break Selection</label><input type="text" id="cr714_breakselection"></div>
                                </div>
                            </div>
                        </div>

                        <div class="accordion-section">
                            <div class="accordion-header" onclick="toggleAccordion(this)">
                                <span>4. Timeline & Reviews</span>
                                <span>▼</span>
                            </div>
                            <div class="accordion-content">
                                <div class="form-grid">
                                    <div class="field-card"><label>Start Date</label><input type="date" id="cr714_startdate"></div>
                                    <div class="field-card"><label>30 Day Review</label><input type="date" id="cr714__30dayreview"></div>
                                    <div class="field-card"><label>90 Day Review</label><input type="date" id="cr714__90dayreview"></div>
                                    <div class="field-card"><label>Annual Review</label><input type="date" id="cr714_annualreview"></div>
                                    <div class="field-card"><label>Probation End Date</label><input type="date" id="cr714_probationaryperiodenddate"></div>
                                    <div class="field-card"><label>Promotion Date</label><input type="date" id="cr714_promotiondate"></div>
                                    <div class="field-card"><label>Years in Service</label><input type="number" id="cr714_yearsinservice" readonly></div>
                                    <div class="field-card"><label>Status</label>
                                        <select id="cr714_status">
                                            <option value="1">Active</option>
                                            <option value="0">Inactive</option>
                                        </select>
                                    </div>
                                    <div class="field-card"><label>Last Day of Employment</label><input type="date" id="cr714_lastdayofemployment" readonly></div>
                                </div>
                            </div>
                        </div>

                        <div style="padding: 10px;">
                            <button type="submit" class="btn btn-save">Patch Dataverse Record</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-term" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-top:0;">Terminate Employee</h2>
            <p id="term-name-label" style="font-weight:bold; color:var(--danger);"></p>
            <div class="field-card" style="margin-bottom:20px;">
                <label style="color:#333;">Last Day of Employment</label>
                <input type="date" id="term-date-input" style="border:1px solid #ccc;">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn" style="background:#eee;" onclick="closeModal()">Cancel</button>
                <button class="btn btn-term" onclick="submitTermination()">Confirm Termination</button>
            </div>
        </div>
    </div>

    <script>
        // --- MSAL CONFIG (YOUR CREDENTIALS) ---
        const MSAL_CONFIG = {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", 
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: "https://WB-DT.github.io/daytona-utility/"
            },
            cache: { cacheLocation: "localStorage" }
        };

        const msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
        const appState = {
            user: null,
            employees: [], 
            selectedId: null,
            filterMode: 'Active'
        };

        // --- AUTH & INIT ---
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await msalInstance.handleRedirectPromise();
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) {
                    appState.user = accounts[0].name;
                    initApp();
                } else {
                    hideElement('global-loader');
                    showElement('login-container', 'flex');
                }
            } catch (err) {
                hideElement('global-loader');
                showElement('login-container', 'flex');
            }
        });

        async function login() {
            try {
                const resp = await msalInstance.loginPopup({ scopes: ["User.Read"] });
                appState.user = resp.account.name;
                initApp();
            } catch(e) { alert("Login failed"); }
        }

        function logout() { msalInstance.logoutPopup().then(() => location.reload()); }

        function initApp() {
            hideElement('global-loader'); hideElement('login-container');
            showElement('app-container', 'flex');
            document.getElementById('user-display').innerText = `Domain User: ${appState.user}`;
            
            // SIMULATED DATA INGEST (Replace with your fetch Dataverse Flow)
            appState.employees = [
                { id: "1", cr714_employeename: "Abigail Landi", cr714_status: 1, cr714_departmentname: "New Hire In Training", cr714_srmanagerflag: "Y", cr714_phoneextension: "1107", cr714_startdate: "2025-10-06" },
                { id: "2", cr714_employeename: "Paul Muhonen", cr714_status: 1, cr714_departmentname: "Account Management 2", cr714_managerflag: "Y", cr714_phoneextension: "5232", cr714_startdate: "2023-04-20" },
                { id: "3", cr714_employeename: "Tom O'Hanlon", cr714_status: 1, cr714_departmentname: "Management", cr714_srmanagerflag: "Y", cr714_phoneextension: "1000", cr714_startdate: "2020-01-01" }
            ];

            processManagerCollection();
            renderGallery();
        }

        // --- ACCORDION LOGIC ---
        function toggleAccordion(header) {
            const content = header.nextElementSibling;
            const arrow = header.querySelector('span:last-child');
            if (content.style.display === "none") {
                content.style.display = "block";
                arrow.innerText = "▲";
            } else {
                content.style.display = "none";
                arrow.innerText = "▼";
            }
        }

        // --- DATA MAPPING ---
        function processManagerCollection() {
            const managers = appState.employees
                .filter(e => (e.cr714_srmanagerflag === "Y" || e.cr714_managerflag === "Y") && e.cr714_status === 1)
                .map(e => e.cr714_employeename).sort();

            ['cr714_srmanager', 'cr714_managerassigned'].forEach(id => {
                const el = document.getElementById(id);
                el.innerHTML = '<option value="">-- Select Manager --</option>' + 
                               managers.map(m => `<option value="${m}">${m}</option>`).join('');
            });
        }

        function selectEmployee(id) {
            appState.selectedId = id;
            const emp = appState.employees.find(e => e.id === id);
            
            // Map every single cr714_ field found in form
            Object.keys(emp).forEach(key => {
                const el = document.getElementById(key);
                if(el) el.value = emp[key] || '';
            });
            document.getElementById('cr714_id').value = emp.id;
            
            // Optional: Automatically open first accordion on selection
            renderGallery();
        }

        function handleFormPatch(event) {
            event.preventDefault();
            const id = document.getElementById('cr714_id').value;
            const data = {};
            document.querySelectorAll('#employeeForm input, #employeeForm select, #employeeForm textarea').forEach(input => {
                if(input.id) data[input.id] = input.value;
            });

            if(id) {
                const idx = appState.employees.findIndex(e => e.id === id);
                appState.employees[idx] = {...appState.employees[idx], ...data};
            } else {
                data.id = Date.now().toString();
                appState.employees.push(data);
            }
            renderGallery();
            alert("Record successfully patched.");
        }

        function showTerminationModal() {
            if(!appState.selectedId) return alert("Select an employee record first.");
            const emp = appState.employees.find(e => e.id === appState.selectedId);
            document.getElementById('term-name-label').innerText = emp.cr714_employeename;
            showElement('modal-term', 'flex');
        }

        function submitTermination() {
            const date = document.getElementById('term-date-input').value;
            if(!date) return alert("Date required.");
            const idx = appState.employees.findIndex(e => e.id === appState.selectedId);
            appState.employees[idx].cr714_status = 0;
            appState.employees[idx].cr714_lastdayofemployment = date;
            closeModal();
            renderGallery();
        }

        // --- UI HELPERS ---
        function renderGallery() {
            const list = appState.employees.filter(e => 
                appState.filterMode === 'Active' ? e.cr714_status == 1 : e.cr714_status == 0
            );
            const container = document.getElementById('employeeGallery');
            container.innerHTML = list.map(emp => `
                <div class="gallery-item ${appState.selectedId === emp.id ? 'selected' : ''}" onclick="selectEmployee('${emp.id}')">
                    <img src="https://wbmasonco.sharepoint.com/sites/InsideSales/Shared%20Documents/Employee%20photos/${encodeURIComponent(emp.cr714_employeename)}.jpg" 
                         onerror="this.src='https://i.pravatar.cc/100?u=${emp.id}'" class="emp-photo">
                    <div>
                        <strong style="display:block;">${emp.cr714_employeename}</strong>
                        <small>${emp.cr714_departmentname}</small>
                    </div>
                </div>
            `).join('');
        }

        function filterGallery() {
            const val = document.getElementById('gallerySearch').value.toLowerCase();
            document.querySelectorAll('.gallery-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(val) ? 'flex' : 'none';
            });
        }

        function setFilter(mode) { appState.filterMode = mode; renderGallery(); }

        function addNewEmployee() {
            appState.selectedId = null;
            document.getElementById('employeeForm').reset();
            document.getElementById('cr714_id').value = '';
            renderGallery();
        }

        function showElement(id, style = 'block') { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add(style); }
        function hideElement(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex', 'block'); }
        function closeModal() { hideElement('modal-term'); }
    </script>
</body>
</html>
