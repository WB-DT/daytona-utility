<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WB Mason Unified Hub v3.3.0</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        :root {
            --primary: #0078d4; --primary-hover: #005a9e;
            --bg-page: #f3f2f1; --white: #ffffff;
            --text-main: #323130; --text-secondary: #605e5c;
            --border: #edebe9; --danger: #d13438; --success: #107c10;
            --input-bg-filled: #f0f8ff; --input-border-filled: #0078d4;
            --sidebar-w: 380px; --footer-h: 12vh;
        }
        [data-theme="dark"] {
            --bg-page: #1b1a19; --white: #252423;
            --text-main: #ffffff; --text-secondary: #d2d0ce;
            --border: #3b3a39; --input-bg-filled: #2d2d2d;
        }
        body, html { margin:0; padding:0; width:100vw; height:100vh; font-family:'Segoe UI',system-ui,sans-serif; background-color:var(--bg-page); color:var(--text-main); overflow:hidden; }
        
        /* CSS GRID LAYOUT - FIXES "MIXED TOGETHER" ISSUE */
        #app-container { display: grid; grid-template-rows: 50px auto 1fr var(--footer-h); height: 100vh; width: 100vw; }
        
        .header { background:var(--white); padding:0 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); z-index:20; }
        .toolbar { background:var(--white); padding:10px 20px; display:flex; gap:15px; border-bottom:1px solid var(--border); align-items:center; overflow-x:auto; z-index:15; }
        
        .main-layout { display:flex; overflow:hidden; position:relative; }
        .sidebar { width:var(--sidebar-w); background:var(--white); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
        .gallery { overflow-y:auto; flex-grow:1; }
        
        .main-content { flex-grow:1; overflow-y:auto; padding:30px 40px; background:var(--bg-page); }
        .master-footer { background:var(--white); border-top:1px solid var(--border); display:flex; align-items:center; padding:0 40px; gap:30px; box-shadow:0 -4px 20px rgba(0,0,0,0.05); z-index:30; }

        /* UI ELEMENTS */
        .accordion-section { margin-bottom:15px; border:1px solid var(--border); border-radius:4px; background:var(--white); }
        .accordion-header { padding:14px 24px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:12px; color:var(--text-secondary); background:#faf9f8; text-transform:uppercase; }
        .accordion-content { padding:24px; display:none; } .accordion-content.open { display:block; }
        .form-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:24px; }
        .field { display:flex; flex-direction:column; }
        .field input, .field select { padding:8px 12px; border:1px solid var(--border); border-radius:4px; font-size:13px; background:var(--white); color:var(--text-main); }
        .field input.has-value { background-color:var(--input-bg-filled); border-color:var(--input-border-filled); }
        
        /* OVERLAYS */
        .overlay-screen { position:fixed; inset:0; background:var(--white); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; }
        .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:5000; display:none; justify-content:flex-end; backdrop-filter:blur(2px); }
        .drawer { width:50%; background:var(--white); height:100%; display:flex; flex-direction:column; box-shadow:-8px 0 24px rgba(0,0,0,0.15); animation:slideIn 0.3s ease; }
        @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
        
        .gallery-item { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; cursor:pointer; border-left:4px solid transparent; }
        .gallery-item.selected { border-left-color:var(--primary); background:#eff6fc; }
        .avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; display:flex; align-items:center; justify-content:center; background:var(--primary); color:white; font-weight:700; }
        
        .time-table { width:100%; border-collapse:collapse; font-size:12px; }
        .time-table th { text-align:left; padding:12px; background:#faf9f8; border-bottom:2px solid var(--border); }
        .time-table td { padding:12px; border-bottom:1px solid var(--border); }
        .status-pill { padding:4px 10px; border-radius:12px; font-weight:700; font-size:10px; }
        .p-yes { background:#dff6dd; color:#107c10; } .p-pending { background:#fff4ce; color:#797673; }
        
        .hidden { display:none !important; } .flex { display:flex !important; }
        .btn { padding:8px 20px; border:1px solid transparent; border-radius:3px; cursor:pointer; font-weight:700; font-size:12px; background:var(--primary); color:white; }
        ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#c8c6c4; border-radius:4px; }
    </style>
</head>
<body data-theme="light">

    <div id="initial-loader" class="overlay-screen">
        <div class="spinner" style="width:40px;height:40px;border:4px solid #edebe9;border-top:4px solid #0078d4;border-radius:50%;animation:spin 1s infinite linear;"></div>
        <p style="margin-top:20px;font-weight:700;">FLORIDA HUB v3.3.0</p>
        <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>

    <div id="app-container" class="hidden">
        <div class="header">
            <h2 style="font-size:16px; color:var(--primary); font-weight:800;">FLORIDA UNIFIED HUB</h2>
            <div style="display:flex; gap:15px; align-items:center;">
                <span id="user-display" style="font-size:11px; font-weight:700;"></span>
                <button class="btn" style="background:transparent; color:var(--danger); border:1px solid var(--border);" onclick="msalInstance.logoutPopup()">LOGOUT</button>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn" onclick="addNew()">+ New Record</button>
            <select style="padding:6px; border:1px solid var(--border);" id="f-status" onchange="runFilters()"><option value="1">Active</option><option value="0">Inactive</option><option value="All">All Status</option></select>
            <select style="padding:6px; border:1px solid var(--border);" id="f-dept" onchange="runFilters()"><option value="All">All Departments</option></select>
            <div style="flex-grow:1"></div>
            <button class="btn" style="background:transparent; color:var(--text-main); border:1px solid var(--border);" onclick="exportData()">Export CSV</button>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <div style="padding:15px; border-bottom:1px solid var(--border); background:#faf9f8;"><input type="text" id="gSearch" placeholder="Search..." onkeyup="runFilters()" style="width:100%; padding:8px;"></div>
                <div class="gallery" id="empGallery"></div>
            </div>

            <div class="main-content">
                <form id="masterForm">
                    <input type="hidden" id="id">
                    
                    <div class="accordion-section">
                        <div class="accordion-header open" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('open');">1. PROFILE & IDENTITY</div>
                        <div class="accordion-content open">
                            <div class="form-grid">
                                <div class="field"><label>Full Name</label><input type="text" id="cr714_employeename" oninput="cv(this)"></div>
                                <div class="field"><label>Email</label><input type="text" id="cr714_emailaddress" oninput="cv(this)"></div>
                                <div class="field"><label>System ID</label><input type="text" id="cr714_employee" oninput="cv(this)"></div>
                                <div class="field"><label>Title</label><input type="text" id="cr714_titlename" oninput="cv(this)"></div>
                                <div class="field"><label>Empower User</label><input type="text" id="cr714_empowerlogin" oninput="cv(this)"></div>
                                <div class="field"><label>Shirt Size</label><input type="text" id="cr714_shirtsize" oninput="cv(this)"></div>
                                <div class="field"><label>Birthday</label><input type="text" id="cr714_upcomingbirthday" oninput="cv(this)"></div>
                                <div class="field"><label>Emergency Contact</label><input type="text" id="cr714_parent" oninput="cv(this)"></div>
                            </div>
                        </div>
                    </div>

                    <div class="accordion-section">
                        <div class="accordion-header open" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('open');">2. MANAGEMENT & LOGISTICS</div>
                        <div class="accordion-content open">
                            <div class="form-grid">
                                <div class="field"><label>Department</label><input type="text" id="cr714_departmentname" oninput="cv(this)"></div>
                                <div class="field"><label>Sr Manager</label><select id="cr714_srmanager" onchange="cv(this)"></select></div>
                                <div class="field"><label>Manager</label><select id="cr714_managerassigned" onchange="cv(this)"></select></div>
                                <div class="field"><label>Ext</label><input type="text" id="cr714_phoneextension" oninput="cv(this)"></div>
                                <div class="field"><label>Loop</label><input type="text" id="cr714_loopnumber" oninput="cv(this)"></div>
                                <div class="field"><label>Personal Phone</label><input type="text" id="cr714_personalphonenumber" oninput="cv(this)"></div>
                            </div>
                        </div>
                    </div>

                    <div class="accordion-section">
                        <div class="accordion-header open" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('open');">3. TIMELINE & CAREER</div>
                        <div class="accordion-content open">
                            <div class="form-grid">
                                <div class="field"><label>Start Date</label><input type="date" id="cr714_startdate" oninput="cv(this)"></div>
                                <div class="field"><label>Promo Date</label><input type="date" id="cr714_promotiondate" oninput="cv(this)"></div>
                                <div class="field"><label>30 Day Goal</label><input type="date" id="cr714__30afterpromotion" oninput="cv(this)"></div>
                                <div class="field"><label>90 Day Goal</label><input type="date" id="cr714__90afterpromotion" oninput="cv(this)"></div>
                                <div class="field"><label>Status</label><select id="cr714_status" onchange="cv(this)"><option value="1">Active</option><option value="0">Inactive</option></select></div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="master-footer">
            <div style="display:flex; gap:15px; align-items:center;">
                <div id="footer-img"></div>
                <div><h1 id="f-name" style="margin:0; font-size:18px; color:var(--primary);">Unified Hub</h1><p id="f-sub" style="margin:0; font-size:11px; color:var(--text-secondary);">Select Record</p></div>
            </div>
            <div style="flex-grow:1"></div>
            <button class="btn" style="background:transparent; border:1px solid var(--border); color:var(--text-main);" onclick="toggleDrawer(true)">Time Off Log</button>
            <button class="btn" onclick="alert('Patch Sent!')">Save Changes</button>
        </div>
    </div>

    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer(false)">
        <div class="drawer" onclick="event.stopPropagation()">
            <div style="padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;">
                <h2 style="margin:0; color:var(--primary);">Time Off History</h2>
                <button onclick="toggleDrawer(false)" style="border:none; background:none; cursor:pointer;">✕</button>
            </div>
            <div class="drawer-content" id="drawer-body"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5ace5a1dc5d54e5ab154aa5628a2957f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=uZpUWLTv8qwXx_h9H3RLFoCcOaET3bYV3g6wNpGVMsc";
        const MSAL_CONFIG = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" } };
        const msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
        const state = { user: null, employees: [], timeOff: [], selectedId: null };

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await msalInstance.handleRedirectPromise();
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) { state.user = accounts[0].name; initApp(); }
                else { msalInstance.loginPopup({ scopes: ["User.Read"] }).then(r => { state.user = r.account.name; initApp(); }); }
            } catch (e) { console.error("Auth Error"); }
        });

        async function initApp() {
            try {
                const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userEmail: state.user }) });
                const data = await response.json();
                state.employees = data.employees || [];
                state.timeOff = data.timeOff || [];
            } catch (e) { console.warn("Sim Mode"); }
            
            document.getElementById('initial-loader').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = state.user;
            
            // Populate Filters
            const depts = [...new Set(state.employees.map(e => e.cr714_departmentname).filter(Boolean))].sort();
            document.getElementById('f-dept').innerHTML = '<option value="All">All Departments</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
            
            runFilters();
        }

        function runFilters() {
            const s = document.getElementById('f-status').value;
            const d = document.getElementById('f-dept').value;
            const q = document.getElementById('gSearch').value.toLowerCase();

            const list = state.employees.filter(e => {
                const mS = s === 'All' || e.cr714_status == s;
                const mD = d === 'All' || e.cr714_departmentname === d;
                const mQ = e.cr714_employeename.toLowerCase().includes(q) || (e.cr714_phoneextension && e.cr714_phoneextension.includes(q));
                return mS && mD && mQ;
            });
            renderGallery(list);
        }

        function renderGallery(list) {
            document.getElementById('empGallery').innerHTML = list.map(e => `
                <div class="gallery-item ${state.selectedId === e.id ? 'selected' : ''}" onclick="selectEmp('${e.id}')">
                    ${getAvatar(e.cr714_employeename)}
                    <div>
                        <div style="font-weight:700; font-size:13px;">${e.cr714_employeename}</div>
                        <div style="font-size:11px; color:var(--text-secondary);">${e.cr714_departmentname || 'Hub'}</div>
                    </div>
                </div>`).join('');
        }

        function selectEmp(id) {
            state.selectedId = id;
            const emp = state.employees.find(e => e.id === id);
            Object.keys(emp).forEach(k => { 
                const el = document.getElementById(k); 
                if(el) {
                    let val = emp[k] || '';
                    if (val.match(/^\d{4}-\d{2}-\d{2}T/)) val = val.split('T')[0];
                    el.value = val;
                    cv(el);
                }
            });
            document.getElementById('f-name').innerText = emp.cr714_employeename;
            document.getElementById('f-sub').innerText = emp.cr714_titlename || 'Associate';
            document.getElementById('footer-img').innerHTML = getAvatar(emp.cr714_employeename, '50px');
            renderGallery(state.employees); 
        }

        function toggleDrawer(s) {
            const drawer = document.getElementById('drawer-overlay');
            if (s && state.selectedId) {
                const emp = state.employees.find(e => e.id === state.selectedId);
                // FIXED LOGIC: Handle both space and non-space keys from potential old JSONs
                const history = state.timeOff.filter(t => (t.Name || t.name || '').toLowerCase() === emp.cr714_employeename.toLowerCase());
                
                document.getElementById('drawer-body').innerHTML = `<h3>${emp.cr714_employeename}</h3>` + 
                    (history.length > 0 ? `<table class="time-table"><thead><tr><th>Type</th><th>Dates</th><th>Hrs</th><th>Status</th></tr></thead><tbody>${history.map(t => {
                        // FIXED: Handle various key formats and * as completion
                        const type = t.LeaveType || t['Leave Type'] || 'PTO';
                        const dates = t.RequestDates || t['Request Dates'] || '-';
                        const hrs = t.Hours || t['PTO Hours'] || '0';
                        const isDone = t.Completed === 'Yes' || t.Completed === '*';
                        return `<tr><td>${type}</td><td>${dates}</td><td>${hrs}</td><td><span class="status-pill ${isDone ? 'p-yes' : 'p-pending'}">${isDone ? 'COMPLETED' : 'PENDING'}</span></td></tr>`;
                    }).join('')}</tbody></table>` : '<p style="padding:40px; text-align:center;">No history records found.</p>');
                drawer.style.display = 'flex';
            } else {
                drawer.style.display = 'none';
            }
        }

        function getAvatar(name, size='40px') {
            const parts = name.split(' ');
            const initials = (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
            return `<div class="avatar" style="width:${size}; height:${size};">${initials}</div>`;
        }
        function cv(el) { if(el.value) el.classList.add('has-value'); else el.classList.remove('has-value'); }
        function addNew() { state.selectedId = null; document.getElementById('masterForm').reset(); runFilters(); }
        function exportData() { alert("Exporting..."); }
    </script>
</body>
</html>
