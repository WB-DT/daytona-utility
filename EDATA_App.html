<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida Hub Console v1.6.0</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        :root {
            --primary: #0078d4;
            --primary-hover: #005a9e;
            --bg-page: #f3f2f1;
            --white: #ffffff;
            --text-main: #323130;
            --text-secondary: #605e5c;
            --border: #edebe9;
            --danger: #d13438;
            --sidebar-w: 360px;
            --drawer-w: 50%;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            height: 100vh; overflow: hidden;
        }

        .hidden { display: none !important; }
        .flex { display: flex !important; }

        /* --- AUTH & LOADERS --- */
        #global-loader {
            position: fixed; inset: 0; background: var(--white);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner { width: 40px; height: 40px; border: 3px solid #edebe9; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- HEADER --- */
        .header {
            background: var(--white); padding: 0 24px; height: 52px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .header-title { display: flex; align-items: center; gap: 12px; }
        .version-badge { background: #eff6fc; color: var(--primary); padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; border: 1px solid #c7e0f4; }

        /* --- MAIN LAYOUT --- */
        #app-container { height: 100vh; flex-direction: column; }
        .screen { flex-grow: 1; display: none; overflow: hidden; }
        .screen.active { display: flex; flex-direction: column; }
        .toolbar { background: var(--white); padding: 12px 24px; display: flex; gap: 12px; border-bottom: 1px solid var(--border); }

        /* --- SIDEBAR --- */
        .sidebar { width: var(--sidebar-w); background: var(--white); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .search-area { padding: 16px; border-bottom: 1px solid var(--border); }
        .search-area input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 2px; font-size: 13px; outline: none; }
        .gallery { overflow-y: auto; flex-grow: 1; background: #faf9f8; }
        .gallery-item { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; background: var(--white); }
        .gallery-item:hover { background: #f3f2f1; }
        .gallery-item.selected { border-left: 4px solid var(--primary); background: #eff6fc; }
        .emp-photo { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #edebe9; }

        /* --- FORMS --- */
        .main-content { flex-grow: 1; overflow-y: auto; padding: 24px; }
        .accordion-section { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--white); }
        .accordion-header { padding: 14px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; color: var(--text-secondary); background: #faf9f8; border-bottom: 1px solid transparent; }
        .accordion-header.open { color: var(--primary); border-bottom-color: var(--border); background: var(--white); }
        .accordion-content { padding: 24px; display: none; }
        .accordion-content.open { display: block; }

        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 11px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); text-transform: uppercase; }
        .field input, .field select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 2px; font-size: 13px; }

        /* --- SIDE DRAWER --- */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 5000; display: none; justify-content: flex-end; }
        .drawer { width: var(--drawer-w); background: var(--white); height: 100%; box-shadow: -4px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease-out; }
        .drawer.open { transform: translateX(0); }
        .drawer-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .drawer-content { flex-grow: 1; overflow-y: auto; padding: 24px; }

        /* --- TIMELINE TOOLS --- */
        .pivot-bar { display: flex; gap: 8px; margin-bottom: 24px; }
        .pivot-item { padding: 6px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); }
        .pivot-item.active { background: var(--primary); color: white; border-color: var(--primary); }
        .slider-wrap { margin: 20px 0; }
        input[type="range"] { width: 100%; margin: 15px 0; cursor: pointer; }

        .timeoff-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .timeoff-table th { text-align: left; padding: 12px; background: #faf9f8; color: var(--text-secondary); border-bottom: 2px solid var(--border); }
        .timeoff-table td { padding: 12px; border-bottom: 1px solid var(--border); }
        .status-badge { padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 10px; }
        .yes { background: #dff6dd; color: #107c10; }
        .no { background: #fde7e9; color: #d13438; }

        .btn { padding: 8px 20px; border: 1px solid transparent; border-radius: 2px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-main); }
        .save-bar { position: sticky; bottom: 0; background: var(--white); padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }
    </style>
</head>
<body>

    <div id="global-loader"><div class="spinner"></div><p style="margin-top:15px; font-size:12px;">Florida Hub v1.6.0 | System Initializing...</p></div>

    <div id="app-container" class="hidden">
        <div class="header">
            <div class="header-title">
                <h2>WB MASON | FLORIDA HUB</h2>
                <span class="version-badge">v1.6.0 STABLE</span>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <span id="user-display" style="font-size: 12px; font-weight: 600; color: var(--text-secondary);"></span>
                <button class="btn btn-ghost" style="color: var(--danger); font-size: 11px;" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="main-screen" class="screen active">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="addNew()">+ New Employee</button>
                <button class="btn btn-ghost" onclick="toggleDrawer(true)">Time Off Insights</button>
            </div>

            <div style="display: flex; flex-grow: 1; overflow: hidden;">
                <div class="sidebar">
                    <div class="search-area"><input type="text" id="gSearch" placeholder="Search employees..." onkeyup="filterG()"></div>
                    <div class="gallery" id="employeeGallery"></div>
                </div>

                <div style="flex-grow: 1; display: flex; flex-direction: column;">
                    <div class="main-content">
                        <form id="masterForm">
                            <input type="hidden" id="id">
                            <div class="accordion-section">
                                <div class="accordion-header open" onclick="toggleAcc(this)">1. EMPLOYEE IDENTITY <span>▼</span></div>
                                <div class="accordion-content open">
                                    <div class="form-grid">
                                        <div class="field"><label>Full Name</label><input type="text" id="cr714_employeename"></div>
                                        <div class="field"><label>Title</label><input type="text" id="cr714_titlename"></div>
                                        <div class="field"><label>Department</label><input type="text" id="cr714_departmentname"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="accordion-section">
                                <div class="accordion-header" onclick="toggleAcc(this)">2. ASSIGNMENT DETAILS <span>▼</span></div>
                                <div class="accordion-content">
                                    <div class="form-grid">
                                        <div class="field"><label>Location</label><input type="text" id="cr714_locationname"></div>
                                        <div class="field"><label>Extension</label><input type="text" id="cr714_phoneextension"></div>
                                        <div class="field"><label>Loop #</label><input type="text" id="cr714_loopnumber"></div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="save-bar"><button class="btn btn-primary" onclick="handleSave()">Save to Dataverse</button></div>
                </div>
            </div>
        </div>
    </div>

    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer(false)">
        <div class="drawer" id="side-drawer" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <h3 style="margin:0;">Time Off Intelligence</h3>
                <button class="btn btn-ghost" onclick="toggleDrawer(false)">✕</button>
            </div>
            <div class="drawer-content">
                <p id="target-name" style="font-weight:600; color:var(--primary); margin-bottom:20px;"></p>
                
                <div class="pivot-bar">
                    <div class="pivot-item active" onclick="setBucket('Day', this)">Day</div>
                    <div class="pivot-item" onclick="setBucket('Week', this)">Week</div>
                    <div class="pivot-item" onclick="setBucket('Month', this)">Month</div>
                    <div class="pivot-item" onclick="setBucket('Year', this)">Year</div>
                </div>

                <div class="slider-wrap">
                    <label style="font-size:11px; font-weight:700; color:var(--text-secondary);">TIMELINE VIEW</label>
                    <input type="range" id="timeSlider" min="0" max="100" value="0" oninput="runTimeFilter(this.value)">
                    <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary);">
                        <span>Earliest</span><span id="slider-val" style="color:var(--primary); font-weight:bold;">All Records</span><span>Latest</span>
                    </div>
                </div>

                <table class="timeoff-table">
                    <thead><tr><th>Type</th><th>Dates</th><th>Hours</th><th>Status</th></tr></thead>
                    <tbody id="drawer-rows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const GET_DATA_FLOW = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5ace5a1dc5d54e5ab154aa5628a2957f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=uZpUWLTv8qwXx_h9H3RLFoCcOaET3bYV3g6wNpGVMsc";

        const MSAL_CONFIG = {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: "https://WB-DT.github.io/daytona-utility/"
            }
        };

        const msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
        const state = { user: null, employees: [], timeOff: [], selectedId: null, bucket: 'Day' };

        document.addEventListener('DOMContentLoaded', async () => {
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) { state.user = accounts[0].name; init(); }
            else { msalInstance.loginPopup({ scopes: ["User.Read"] }).then(r => { state.user = r.account.name; init(); }); }
        });

        async function init() {
            document.getElementById('global-loader').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('flex');
            document.getElementById('user-display').innerText = state.user;
            
            try {
                const response = await fetch(GET_DATA_FLOW, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userEmail: state.user })
                });
                const data = await response.json();
                state.employees = data.employees || [];
                state.timeOff = data.timeOff || [];
                renderG();
            } catch (err) { console.error("Flow Error:", err); }
        }

        function toggleDrawer(open) {
            const overlay = document.getElementById('drawer-overlay');
            const drawer = document.getElementById('side-drawer');
            if(open) {
                if(!state.selectedId) return alert("Please select an employee first.");
                const emp = state.employees.find(e => e.id === state.selectedId);
                document.getElementById('target-name').innerText = emp.cr714_employeename;
                overlay.style.display = 'flex';
                setTimeout(() => drawer.classList.add('open'), 10);
                runTimeFilter(0);
            } else {
                drawer.classList.remove('open');
                setTimeout(() => overlay.style.display = 'none', 300);
            }
        }

        function runTimeFilter(val) {
            document.getElementById('slider-val').innerText = val == 0 ? "Viewing All" : `Offset: ${val}%`;
            const emp = state.employees.find(e => e.id === state.selectedId);
            const history = state.timeOff.filter(t => t.Name === emp.cr714_employeename);
            const container = document.getElementById('drawer-rows');
            
            container.innerHTML = history.length > 0 ? history.map(t => `
                <tr>
                    <td>${t.LeaveType || 'PTO'}</td>
                    <td>${t.RequestDate || '-'}</td>
                    <td>${t.Hours || '0'}</td>
                    <td><span class="status-badge ${t.Approval === 'Yes' ? 'yes' : 'no'}">${t.Approval || 'Pending'}</span></td>
                </tr>
            `).join('') : '<tr><td colspan="4" style="text-align:center; padding:40px;">No records found.</td></tr>';
        }

        function setBucket(b, el) {
            state.bucket = b;
            document.querySelectorAll('.pivot-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function renderG() {
            const container = document.getElementById('employeeGallery');
            const val = document.getElementById('gSearch').value.toLowerCase();
            const filtered = state.employees.filter(e => e.cr714_employeename.toLowerCase().includes(val));
            
            container.innerHTML = filtered.map(e => `
                <div class="gallery-item ${state.selectedId === e.id ? 'selected' : ''}" onclick="selectEmp('${e.id}')">
                    <img src="https://i.pravatar.cc/100?u=${e.id}" class="emp-photo">
                    <div style="overflow:hidden;">
                        <div style="font-weight:600; font-size:13px; text-overflow:ellipsis; white-space:nowrap; overflow:hidden;">${e.cr714_employeename}</div>
                        <div style="font-size:11px; color:var(--text-secondary);">${e.cr714_departmentname || 'No Dept'}</div>
                    </div>
                </div>
            `).join('');
        }

        function selectEmp(id) {
            state.selectedId = id;
            const emp = state.employees.find(e => e.id === id);
            Object.keys(emp).forEach(k => { const el = document.getElementById(k); if(el) el.value = emp[k] || ''; });
            renderG();
        }

        function filterG() { renderG(); }
        function toggleAcc(h) { h.classList.toggle('open'); h.nextElementSibling.classList.toggle('open'); h.querySelector('span').innerText = h.classList.contains('open') ? "▲" : "▼"; }
        function handleSave() { alert("Patch Payload captured. Ready for backend integration."); }
        function logout() { msalInstance.logoutPopup().then(() => location.reload()); }
    </script>
</body>
</html>
