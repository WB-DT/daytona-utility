<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- DESIGN SYSTEM v8.0 (High Contrast) --- */
        :root {
            /* Brand Colors */
            --primary: #0f766e; /* Teal-700: Professional & Distinct */
            --primary-light: #ccfbf1;
            --accent: #0284c7; /* Sky-600 */
            --danger: #dc2626;
            
            /* High Contrast Surfaces */
            --bg-app: #e2e8f0; /* Slate-200: Darker background makes content pop */
            --bg-sidebar: #1e293b; /* Slate-800: Distinct navigation area */
            --bg-card: #ffffff; /* Pure White Content */
            --bg-field: #ffffff; /* White Input Background */
            --bg-field-focus: #f0f9ff;
            
            /* Typography */
            --text-main: #0f172a; /* Slate-900: High readability */
            --text-muted: #64748b; /* Slate-500 */
            --text-sidebar: #f8fafc; /* Slate-50 */
            
            /* Borders & Shadows */
            --border: #cbd5e1; /* Slate-300: Visible borders */
            --border-focus: #0f766e;
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 8px;
            
            /* Layout */
            --header-h: 64px; 
            --sidebar-w: 340px;
        }

        [data-theme="dark"] {
            --bg-app: #0f172a; --bg-sidebar: #020617; --bg-card: #1e293b;
            --bg-field: #334155; --bg-field-focus: #1e293b;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-sidebar: #e2e8f0;
            --border: #475569;
        }

        * { box-sizing: border-box; outline: none; }
        body, html { margin:0; padding:0; width:100vw; height:100vh; font-family:'Segoe UI', -apple-system, sans-serif; background: var(--bg-app); color: var(--text-main); overflow: hidden; }

        /* GRID LAYOUT */
        #app-container { 
            display: grid; 
            grid-template-columns: var(--sidebar-w) 1fr; 
            grid-template-rows: var(--header-h) 1fr 70px; 
            height: 100vh; width: 100vw; 
        }

        /* HEADER */
        .header { 
            grid-column: 1 / -1; background: var(--bg-card); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
            box-shadow: var(--shadow-card); z-index: 50;
        }
        .brand { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; display: flex; align-items: center; gap: 12px; }
        .brand-badge { background: var(--primary-light); color: var(--primary); font-size: 11px; padding: 4px 8px; border-radius: 99px; font-weight: 700; text-transform: uppercase; }

        /* SIDEBAR */
        .sidebar { 
            grid-row: 2 / -1; background: var(--bg-sidebar); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; color: var(--text-sidebar);
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .search-box { position: relative; }
        .search-input { 
            width: 100%; padding: 12px 36px 12px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            border-radius: var(--radius); color: white; font-size: 14px; transition: 0.2s;
        }
        .search-input:focus { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
        .search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(255,255,255,0.5); font-size: 16px; display: none; }
        
        .gallery { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .gallery-item { 
            padding: 14px 16px; margin-bottom: 8px; border-radius: var(--radius); cursor: pointer; 
            display: flex; align-items: center; gap: 12px; transition: 0.15s; border-left: 4px solid transparent;
        }
        .gallery-item:hover { background: rgba(255,255,255,0.05); }
        .gallery-item.selected { background: rgba(255,255,255,0.1); border-left-color: var(--accent); }
        .emp-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
        .emp-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .emp-sub { font-size: 11px; opacity: 0.7; margin-top: 2px; }

        /* MAIN CONTENT */
        .main-content { 
            grid-column: 2; grid-row: 2; overflow-y: auto; padding: 32px; background: var(--bg-app); 
            display: flex; flex-direction: column; gap: 24px;
        }

        /* ACTION BAR */
        .action-bar { 
            display: flex; gap: 12px; align-items: center; background: var(--bg-card); padding: 12px 20px; 
            border-radius: var(--radius); box-shadow: var(--shadow-card); border: 1px solid var(--border); flex-wrap: wrap;
        }
        .filter-select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; color: var(--text-main); background: var(--bg-field); cursor: pointer; }
        .filter-select:hover { border-color: var(--primary); }

        /* HERO PROFILE */
        .hero-section { 
            display: flex; align-items: center; gap: 24px; padding: 24px; background: var(--bg-card); 
            border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-card);
        }
        .hero-avatar-large { 
            width: 72px; height: 72px; border-radius: 50%; background: var(--primary); color: white; 
            font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center;
            border: 4px solid #f1f5f9; box-shadow: 0 0 0 1px var(--border);
        }

        /* CARDS */
        .card { background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow-card); border: 1px solid var(--border); overflow: hidden; }
        .card-header { 
            padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid var(--border); 
            font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
            display: flex; justify-content: space-between; cursor: pointer;
        }
        .card-header.open { background: var(--primary-light); color: var(--primary); border-bottom-color: var(--primary-light); }
        .card-body { padding: 24px; display: none; } .card-body.open { display: block; }

        /* FORM FIELDS */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .field { display: flex; flex-direction: column; }
        .field label { 
            font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; 
            display: flex; justify-content: space-between;
        }
        .field input, .field select, .field textarea { 
            padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; 
            color: var(--text-main); background: var(--bg-field); transition: 0.2s; width: 100%;
        }
        .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15); background: var(--bg-field-focus); }
        
        .field .has-data { border-left: 3px solid var(--primary); }
        .field .calc-data { background: #f0f9ff; border-color: #bae6fd; color: #0369a1; pointer-events: none; }
        .field .error-data { border-color: #ef4444; background: #fef2f2; }

        /* BUTTONS */
        .btn { padding: 9px 20px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #0d9488; }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
        .btn-ghost:hover { background: var(--bg-app); color: var(--text-main); border-color: var(--text-muted); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-save { transition: 0.3s; }
        .btn-save.dirty { background: #16a34a; box-shadow: 0 0 12px rgba(22, 163, 74, 0.4); animation: pulse 2s infinite; }

        /* FOOTER */
        .footer { 
            grid-column: 2; grid-row: 3; background: var(--bg-card); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: flex-end; padding: 0 32px; gap: 16px; z-index: 40;
        }

        /* UTILS */
        .hidden { display: none !important; }
        .overlay-screen { position: fixed; inset: 0; background: var(--bg-card); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .b-active { background: #dcfce7; color: #15803d; } .b-inactive { background: #fee2e2; color: #b91c1c; } .b-warn { background: #fef9c3; color: #a16207; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); } 100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); } }
        .copy-icon { cursor:copy; position:absolute; right:10px; top:32px; font-size:14px; color:var(--text-muted); opacity:0; transition:0.2s; }
        .field:hover .copy-icon { opacity:1; }

        /* DRAWER */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 5000; display: none; justify-content: flex-end; }
        .drawer { width: 50%; background: var(--bg-card); height: 100%; box-shadow: -10px 0 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
        .fluent-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .fluent-table th { text-align: left; padding: 12px; background: var(--bg-app); border-bottom: 2px solid var(--border); color: var(--text-muted); font-weight: 700; }
        .fluent-table td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
        .status-pill { padding: 4px 10px; border-radius: 12px; font-weight: 700; font-size: 10px; text-transform: uppercase; }
        .s-yes { background: #dff6dd; color: #107c10; } .s-no { background: #fff4ce; color: #797673; } .s-denied { background: #fde7e9; color: #d13438; }

        /* DASHBOARD */
        .stats-row { display: flex; gap: 20px; margin-bottom: 24px; }
        .stat-card { flex: 1; background: var(--bg-card); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
        .stat-val { font-size: 32px; font-weight: 800; color: var(--primary); }
        .stat-lbl { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    </style>
</head>

        const state = { user: null, employees: [], timeOff: [], selectedId: null, sortAsc: true, isDirty: false };

        // --- IDB WRAPPER ---
        const idb = {
            open: () => new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, DB_VERSION); r.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME); r.onsuccess = e => res(e.target.result); r.onerror = rej; }),
            put: async (key, val) => { const db = await idb.open(); return new Promise((res, rej) => { const tx = db.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).put(val, key); tx.oncomplete = res; tx.onerror = rej; }); },
            get: async (key) => { const db = await idb.open(); return new Promise((res, rej) => { const tx = db.transaction(STORE_NAME, 'readonly'); const r = tx.objectStore(STORE_NAME).get(key); r.onsuccess = () => res(r.result); r.onerror = rej; }); }
        };

        window.onbeforeunload = () => state.isDirty ? "Unsaved changes" : null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await msalInstance.handleRedirectPromise();
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) { state.user = accounts[0].name; initApp(); }
                else { msalInstance.loginPopup({ scopes: ["User.Read"] }).then(r => { state.user = r.account.name; initApp(); }); }
            } catch (e) { console.error(e); }
        });

        async function initApp() {
            document.getElementById('user-display').innerText = state.user;
            let loaded = false;
            try {
                const cached = await idb.get(CACHE_KEY);
                if (cached && cached.date === new Date().toISOString().split('T')[0]) {
                    state.employees = cached.data.employees; state.timeOff = cached.data.timeOff;
                    loaded = true; renderApp();
                }
            } catch(e){}
            pollForData(loaded);
        }

        async function pollForData(loaded, retries=0) {
            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userEmail: state.user }), cache: 'no-store' });
                let raw = await res.json();
                if(raw.body) raw = raw.body; 
                
                if (!loaded) {
                    state.employees = raw.employees || []; state.timeOff = raw.timeOff || [];
                    await idb.put(CACHE_KEY, { date: new Date().toISOString().split('T')[0], data: raw });
                    renderApp();
                } else if (JSON.stringify(raw).length !== JSON.stringify({employees:state.employees, timeOff:state.timeOff}).length) {
                    if(!state.isDirty) { state.employees = raw.employees; state.timeOff = raw.timeOff; renderApp(); }
                }
            } catch(e) { if(retries < 5) setTimeout(() => pollForData(loaded, retries+1), 5000); }
        }

        function renderApp() {
            document.getElementById('initial-loader').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            populateFilters(); runFilters(); buildStats();
        }

        // --- CORE LOGIC ---
        function populateFilters() {
            const depts = [...new Set(state.employees.map(e => e.cr714_departmentname).filter(Boolean))].sort();
            const mgrs = [...new Set(state.employees.filter(e => e.cr714_managerflag === 'Y').map(e => e.cr714_employeename))].sort();
            document.getElementById('f-dept').innerHTML = '<option value="All">All Departments</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
            document.getElementById('f-mgr').innerHTML = '<option value="All">All Managers</option>' + mgrs.map(m => `<option value="${m}">${m}</option>`).join('');
            ['cr714_srmanager', 'cr714_managerassigned'].forEach(id => document.getElementById(id).innerHTML = '<option value="">-- Select --</option>' + mgrs.map(m => `<option value="${m}">${m}</option>`).join(''));
        }

        function runFilters() {
            const q = document.getElementById('gSearch').value.toLowerCase();
            const s = document.getElementById('f-status').value;
            const d = document.getElementById('f-dept').value;
            const m = document.getElementById('f-mgr').value;
            
            document.getElementById('search-clear').style.display = q.length > 0 ? 'block' : 'none';

            let list = state.employees.filter(e => {
                const matchS = s === 'All' || (s == '1' && e.cr714_status == 1) || (s == '0' && e.cr714_status == 0);
                const matchD = d === 'All' || e.cr714_departmentname === d;
                const matchM = m === 'All' || e.cr714_managerassigned === m;
                const matchQ = (e.cr714_employeename || '').toLowerCase().includes(q) || (e.cr714_employee || '').includes(q);
                return matchS && matchD && matchM && matchQ;
            });

            list.sort((a,b) => state.sortAsc ? (a.cr714_employeename || '').localeCompare(b.cr714_employeename || '') : (b.cr714_employeename || '').localeCompare(a.cr714_employeename || ''));
            
            document.getElementById('empGallery').innerHTML = list.map(e => `
                <div class="gallery-item ${state.selectedId === e.id ? 'selected' : ''}" onclick="selectEmp('${e.id}')">
                    ${getAvatar(e.cr714_employeename)}
                    <div>
                        <div class="emp-name">${e.cr714_employeename || 'Unknown'}</div>
                        <div class="emp-sub">${e.cr714_departmentname || 'No Dept'}</div>
                    </div>
                </div>`).join('');
                
            document.getElementById('count-lbl').innerText = `${list.length} Found`;
        }

        function selectEmp(id) {
            if(state.isDirty && !confirm("Discard unsaved changes?")) return;
            state.selectedId = id; state.isDirty = false;
            document.querySelector('.btn-save').classList.remove('dirty');
            
            const emp = state.employees.find(e => e.id === id);
            
            // REVERSE MAPPING: Loop through Form Fields -> Find Data
            document.querySelectorAll('#masterForm input, #masterForm select, #masterForm textarea').forEach(el => {
                const key = el.id; // e.g. cr714_employeename
                if (key && emp.hasOwnProperty(key)) {
                    let val = emp[key];
                    if (val === null || val === undefined) val = "";
                    if (typeof val === 'string' && val.match(/^\d{4}-\d{2}-\d{2}T/)) val = val.split('T')[0]; // Date Fix
                    el.value = val;
                    updateVisuals(el);
                } else if (key) {
                    el.value = ""; // Clear if not in data
                    el.classList.remove('has-data');
                }
            });

            // HERO UPDATE
            document.getElementById('hero-section').classList.remove('hidden');
            document.getElementById('hero-name').innerText = emp.cr714_employeename || "Unknown";
            document.getElementById('hero-title').innerText = emp.cr714_titlename || 'Associate';
            document.getElementById('hero-avatar').innerHTML = getAvatar(emp.cr714_employeename, '72px');
            
            const st = document.getElementById('hero-status');
            st.innerText = emp.cr714_status == 1 ? "ACTIVE" : "INACTIVE";
            st.className = emp.cr714_status == 1 ? "badge b-active" : "badge b-inactive";

            const pr = document.getElementById('hero-probation');
            if(emp.cr714_probationaryperiodenddate && new Date(emp.cr714_probationaryperiodenddate) > new Date()) pr.classList.remove('hidden'); else pr.classList.add('hidden');

            // Force Refresh to update sidebar selection highlight
            runFilters();
        }

        function handleInput(el) { 
            state.isDirty = true; 
            document.querySelector('.btn-save').classList.add('dirty');
            updateVisuals(el);
        }

        function updateVisuals(el) {
            if(el.value) el.classList.add('has-data'); else el.classList.remove('has-data');
        }

        function getAvatar(n, s='32px') {
            const i = (n||'?').split(' ').map(p=>p[0]).join('').substring(0,2).toUpperCase();
            return `<div style="width:${s};height:${s};border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">${i}</div>`;
        }

        function toggleCard(h) { h.classList.toggle('open'); h.nextElementSibling.classList.toggle('open'); }
        function toggleSort() { state.sortAsc = !state.sortAsc; runFilters(); }
        function clearSearch() { document.getElementById('gSearch').value=''; runFilters(); }
        function clearFilters() { document.getElementById('gSearch').value=''; document.getElementById('f-status').value='All'; document.getElementById('f-dept').value='All'; document.getElementById('f-mgr').value='All'; runFilters(); }
        
        // --- LOGIC ---
        const addDays = (d, days) => { const r = new Date(d); r.setDate(r.getDate() + days); return r.toISOString().split('T')[0]; };
        function setCalc(id, val) { const el = document.getElementById(id); if(el) { el.value = val; el.classList.add('just-calculated'); setTimeout(()=>el.classList.remove('just-calculated'), 1500); updateVisuals(el); } }
        
        function runStartLogic(val) { if(!val) return; const s = new Date(val); setCalc('cr714__30dayreview', addDays(s,30)); setCalc('cr714__90dayreview', addDays(s,90)); setCalc('cr714_probationaryperiodenddate', addDays(s,120)); if(!document.getElementById('cr714_lastannualreview').value) setCalc('cr714_annualreview', addDays(s,365)); calcTenure(val); }
        function runPromoLogic(val) { if(!val) return; const p = new Date(val); setCalc('cr714__30afterpromotion', addDays(p,30)); setCalc('cr714__90afterpromotion', addDays(p,90)); }
        function runAnnualLogic(val) { if(!val) return; setCalc('cr714_annualreview', addDays(new Date(val), 365)); }
        function runTermLogic(val) { if(val) { document.getElementById('cr714_status').value = 0; document.getElementById('statuscode').value = 2; handleInput(document.getElementById('cr714_status')); } }
        function calcTenure(d) { if(!d) return; document.getElementById('cr714_yearsinservice').value = ((Date.now()-new Date(d).getTime())/(1000*60*60*24*365.25)).toFixed(1); updateVisuals(document.getElementById('cr714_yearsinservice')); }
        function calcBday(v) { const b = document.getElementById('bday-badge'); if(!v) { b.classList.add('hidden'); return; } b.innerText = "🎂 Soon"; b.classList.remove('hidden'); }
        function runTitleLogic(t) { t=t.toLowerCase(); document.getElementById('cr714_managerflag').value = t.includes('manager') ? 'Y' : 'N'; }

        function toggleDashboard() {
            const form = document.getElementById('form-view');
            const dash = document.getElementById('dashboard-view');
            if(form.style.display === 'none') { form.style.display='block'; dash.style.display='none'; }
            else { form.style.display='none'; dash.style.display='block'; buildStats(); }
        }

        function buildStats() {
            const active = state.employees.filter(e => e.cr714_status == 1);
            const stats = document.getElementById('stats-container');
            stats.innerHTML = `
                <div class="stat-card"><div class="stat-val">${state.employees.length}</div><div class="stat-lbl">Total</div></div>
                <div class="stat-card"><div class="stat-val" style="color:var(--primary)">${active.length}</div><div class="stat-lbl">Active</div></div>
                <div class="stat-card"><div class="stat-val" style="color:#ef4444">${state.employees.length - active.length}</div><div class="stat-lbl">Inactive</div></div>
            `;
        }

        function toggleDrawer(s) {
            const d = document.getElementById('drawer-overlay');
            if(s && state.selectedId) {
                const emp = state.employees.find(e => e.id === state.selectedId);
                const h = state.timeOff.filter(t => (t.Name||'').toLowerCase() === (emp.cr714_employeename||'').toLowerCase());
                h.sort((a,b) => (b['Start time']||0) - (a['Start time']||0));
                document.getElementById('drawer-body').innerHTML = h.length ? 
                    `<table class="fluent-table"><thead><tr><th>Type</th><th>Dates</th><th>Status</th></tr></thead><tbody>${h.map(t => 
                        `<tr><td><b>${t['Leave Type']||'PTO'}</b><br><span style="font-size:10px; opacity:0.7">${(t['Request Notes']||'').substring(0,50)}</span></td>
                        <td>${t['Request Dates']||'-'}</td>
                        <td><span class="status-pill ${t['Manager Approval Status']=='No'?'s-denied':'s-yes'}">${t.Completed=='Yes'?'DONE':'PENDING'}</span></td></tr>`
                    ).join('')}</tbody></table>` : '<p style="text-align:center; opacity:0.5; padding:40px;">No History Found</p>';
                d.style.display = 'flex'; setTimeout(()=>document.getElementById('side-drawer').classList.add('open'),10);
            } else {
                document.getElementById('side-drawer').classList.remove('open'); setTimeout(()=>d.style.display='none',300);
            }
        }

        function addNew() { if(state.isDirty && !confirm("Discard?")) return; state.selectedId=null; state.isDirty=false; document.getElementById('masterForm').reset(); document.getElementById('hero-section').classList.add('hidden'); runFilters(); }
        function terminateEmployee() { if(!state.selectedId) return alert("Select someone."); if(confirm("Terminate?")) { document.getElementById('cr714_status').value = 0; document.getElementById('cr714_lastdayofemployment').value = new Date().toISOString().split('T')[0]; handleInput(document.getElementById('cr714_status')); } }
        function patchData() { state.isDirty=false; idb.put(CACHE_KEY, { date: new Date().toISOString().split('T')[0], user: state.user, data: {employees:state.employees, timeOff:state.timeOff} }); document.getElementById('post-screen').classList.remove('hidden'); }
        function hideElement(id) { document.getElementById(id).classList.add('hidden'); }
        function toggleTheme() { document.body.dataset.theme = document.body.dataset.theme === 'light' ? 'dark' : 'light'; }
        function logout() { msalInstance.logoutPopup().then(() => location.reload()); }
        function exportData() { alert("Exporting..."); }
        function copyToClipboard(el) { if(!el.value) return; navigator.clipboard.writeText(el.value).then(() => { const t = document.getElementById('toast'); t.style.visibility = "visible"; setTimeout(() => { t.style.visibility = "hidden"; }, 2000); }); }
    </script>
</body>
</html>
