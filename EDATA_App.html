<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v3 WB Mason - Florida Hub Console</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        :root {
            --primary: #0078d4;
            --bg: #d6dde0; 
            --card-bg: #ffffff;
            --text: #333333;
            --form-bg: #8c9ca1;
            --accent-green: #e8f4d9;
            --danger: #ff5e5e;
            --success: #4CAF50;
            --sidebar-w: 380px;
        }

        [data-theme="dark"] {
            --bg: #1e1e1e;
            --card-bg: #2d2d2d;
            --text: #ffffff;
            --form-bg: #3c3c3c;
            --accent-green: #4a4a4a;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh; overflow: hidden;
            transition: 0.3s;
        }

        .hidden { display: none !important; }
        .flex { display: flex !important; }

        /* --- AUTH & LOADERS --- */
        #global-loader {
            position: fixed; inset: 0; background: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
        }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #login-container {
            height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, var(--primary) 0%, #003a66 100%);
        }
        .login-card { background: white; padding: 50px; border-radius: 25px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }

        /* --- MAIN LAYOUT --- */
        #app-container { height: 100vh; flex-direction: column; }
        .header { background: #9e9e9e; margin: 10px; padding: 15px 25px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; color: white; }

        .screen { flex-grow: 1; padding: 20px; display: none; height: calc(100vh - 120px); }
        .screen.active { display: flex; flex-direction: column; }

        /* Hub Tiles */
        .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 40px; justify-content: center; }
        .hub-tile { background: var(--card-bg); border-radius: 20px; padding: 35px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; }
        .hub-tile:hover { transform: translateY(-8px); }

        /* Gallery Sidebar */
        .console-layout { display: flex; gap: 15px; flex-grow: 1; overflow: hidden; }
        .sidebar { width: var(--sidebar-w); background: var(--card-bg); border-radius: 15px; display: flex; flex-direction: column; border: 1px solid #ccc; }
        .search-area { padding: 15px; background: #d9ffe2; border-radius: 15px 15px 0 0; }
        .search-area input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        
        .gallery { overflow-y: auto; flex-grow: 1; }
        .gallery-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; cursor: pointer; color: var(--text); }
        .gallery-item.selected { background: var(--primary) !important; color: white !important; }
        .emp-pic { width: 45px; height: 45px; border-radius: 50%; background: #ccc; object-fit: cover; }

        /* Form Controls */
        .main-form { flex-grow: 1; background: var(--form-bg); border-radius: 15px; padding: 25px; overflow-y: auto; color: white; }
        .tab-bar { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px; }
        .tab { padding: 10px 20px; cursor: pointer; border-radius: 8px; background: rgba(0,0,0,0.2); font-weight: bold; }
        .tab.active { background: var(--primary); }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .field { display: flex; flex-direction: column; }
        .field label { font-size: 11px; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; color: #f0f0f0; }
        .field input, .field select, .field textarea { padding: 10px; border: none; border-radius: 5px; background: var(--accent-green); color: #333; }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000; display: none; justify-content: center; align-items: center; }
        .modal { background: var(--card-bg); padding: 30px; border-radius: 20px; width: 450px; color: var(--text); }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-new { background: #00fbff; color: #333; }
        .btn-term { background: var(--danger); color: white; }
        .btn-save { background: var(--success); color: white; width: 100%; margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body data-theme="light">

    <div id="global-loader"><div class="spinner"></div><p>Synchronizing Dataverse Records...</p></div>

    <div id="login-container" class="hidden">
        <div class="login-card">
            <img src="https://img.icons8.com/color/96/microsoft.png" alt="MS Logo">
            <h1>Florida Hub Portal</h1>
            <p style="color: #666; margin-bottom: 30px;">Sign in with your organization account</p>
            <button class="btn btn-new" style="padding: 15px 40px;" onclick="login()">Login to Domain</button>
        </div>
    </div>

    <div id="app-container" class="hidden">
        <div class="header">
            <h2 id="page-title">Florida Hub Console</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn" style="background: #333; color: white; font-size: 12px;" onclick="toggleTheme()">🌓 Theme</button>
                <span id="user-display"></span>
                <button class="btn btn-term" style="font-size: 11px;" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="welcome-screen" class="screen active">
            <div class="hub-grid">
                <div class="hub-tile" onclick="navigateTo('data-screen')">
                    <h2 style="color: var(--primary);">Managers Console</h2>
                    <p>Employee Records & Reviews</p>
                </div>
                <div class="hub-tile" onclick="window.open('https://app.powerbi.com', '_blank')">
                    <h2>URED Dashboard</h2>
                    <p>View Analytics & Metrics</p>
                </div>
                <div class="hub-tile">
                    <h2>Hierarchy App</h2>
                    <p>Team Structure View</p>
                </div>
            </div>
        </div>

        <div id="data-screen" class="screen">
            <div style="margin-bottom: 15px; display: flex; gap: 10px;">
                <button class="btn" style="background:#eee; color:#333;" onclick="navigateTo('welcome-screen')">← Hub</button>
                <button class="btn btn-new" onclick="resetForm()">+ New Employee</button>
                <button class="btn btn-term" onclick="showTermModal()">Terminate</button>
                <button class="btn" style="background:white; border:1px solid #ccc;" onclick="setFilter('Active')">Active</button>
                <button class="btn" style="background:#333; color:white;" onclick="setFilter('Inactive')">Inactive</button>
            </div>

            <div class="console-layout">
                <div class="sidebar">
                    <div class="search-area"><input type="text" id="gallerySearch" placeholder="Search by name, dept, extension..." onkeyup="handleFilter()"></div>
                    <div class="gallery" id="employeeGallery"></div>
                </div>

                <div class="main-form">
                    <div class="tab-bar">
                        <div class="tab active" onclick="showTab('general', this)">General</div>
                        <div class="tab" onclick="showTab('management', this)">Management</div>
                        <div class="tab" onclick="showTab('timeline', this)">Timeline</div>
                        <div class="tab" onclick="showTab('admin', this)">Admin</div>
                    </div>

                    <form id="employeeForm" onsubmit="handlePatch(event)">
                        <input type="hidden" id="cr714_id">
                        
                        <div id="tab-general" class="tab-content">
                            <div class="form-grid">
                                <div class="field"><label>Employee Name</label><input type="text" id="cr714_employeename" required></div>
                                <div class="field"><label>Email Address</label><input type="email" id="cr714_emailaddress"></div>
                                <div class="field"><label>Job Title</label><input type="text" id="cr714_titlename"></div>
                                <div class="field"><label>Department</label>
                                    <select id="cr714_departmentname">
                                        <option value="New Hire In Training">New Hire In Training</option>
                                        <option value="Account Management 1">Account Management 1</option>
                                        <option value="Logistics">Logistics</option>
                                    </select>
                                </div>
                                <div class="field"><label>Phone Extension</label><input type="text" id="cr714_phoneextension"></div>
                                <div class="field"><label>Loop Number</label><input type="text" id="cr714_loopnumber"></div>
                                <div class="field" style="grid-column: span 2;"><label>Special Notes</label><textarea id="cr714_specialnotes" rows="3"></textarea></div>
                            </div>
                        </div>

                        <div id="tab-management" class="tab-content hidden">
                            <div class="form-grid">
                                <div class="field"><label>SR Manager</label><select id="cr714_srmanager"></select></div>
                                <div class="field"><label>Manager Assigned</label><select id="cr714_managerassigned"></select></div>
                                <div class="field"><label>SR Manager Flag (Y/N)</label><input type="text" id="cr714_srmanagerflag" maxlength="1"></div>
                                <div class="field"><label>Manager Flag (Y/N)</label><input type="text" id="cr714_managerflag" maxlength="1"></div>
                            </div>
                        </div>

                        <div id="tab-timeline" class="tab-content hidden">
                            <div class="form-grid">
                                <div class="field"><label>Start Date</label><input type="date" id="cr714_startdate"></div>
                                <div class="field"><label>30 Day Review</label><input type="date" id="cr714__30dayreview"></div>
                                <div class="field"><label>90 Day Review</label><input type="date" id="cr714__90dayreview"></div>
                                <div class="field"><label>Probation End</label><input type="date" id="cr714_probationaryperiodenddate"></div>
                            </div>
                        </div>

                        <div id="tab-admin" class="tab-content hidden">
                            <div class="form-grid">
                                <div class="field"><label>CSR Profile</label><input type="text" id="cr714_csr"></div>
                                <div class="field"><label>Status</label>
                                    <select id="cr714_status">
                                        <option value="1">Active</option>
                                        <option value="0">Inactive</option>
                                    </select>
                                </div>
                                <div class="field"><label>Last Day of Employment</label><input type="date" id="cr714_lastdayofemployment" readonly></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-save">Patch Dataverse Record</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-term" class="modal-overlay">
        <div class="modal">
            <h2 style="margin-top:0;">Terminate Employee</h2>
            <p id="term-name-label" style="font-weight:bold;"></p>
            <div class="field"><label>Last Day Date</label><input type="date" id="term-date-input"></div>
            <div style="margin-top:20px; display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn" style="background:#eee;" onclick="closeModal()">Cancel</button>
                <button class="btn btn-term" onclick="processTermination()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const MSAL_CONFIG = {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: "https://WB-DT.github.io/daytona-utility/"
            },
            cache: { cacheLocation: "localStorage" }
        };

        const msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
        let appState = { employees: [], selectedId: null, filter: 'Active' };

        document.addEventListener('DOMContentLoaded', async () => {
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) {
                document.getElementById('user-display').innerText = accounts[0].name;
                initApp();
            } else {
                msalInstance.loginPopup({ scopes: ["User.Read"] }).then(initApp);
            }
        });

        function initApp() {
            document.getElementById('global-loader').style.display = 'none';
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('flex');
            fetchMockData();
        }

        function fetchMockData() {
            appState.employees = [
                { id: "1", cr714_employeename: "Abigail Landi", cr714_status: 1, cr714_departmentname: "New Hire In Training", cr714_srmanagerflag: "Y" },
                { id: "2", cr714_employeename: "Paul Muhonen", cr714_status: 1, cr714_departmentname: "Account Management 2", cr714_managerflag: "Y" }
            ];
            renderGallery();
            populateManagers();
        }

        function renderGallery() {
            const list = appState.employees.filter(e => appState.filter === 'Active' ? e.cr714_status == 1 : e.cr714_status == 0);
            const container = document.getElementById('employeeGallery');
            container.innerHTML = list.map(emp => `
                <div class="gallery-item ${appState.selectedId === emp.id ? 'selected' : ''}" onclick="selectEmployee('${emp.id}')">
                    <img src="https://i.pravatar.cc/100?u=${emp.id}" class="emp-pic">
                    <div><strong>${emp.cr714_employeename}</strong><br><small>${emp.cr714_departmentname}</small></div>
                </div>
            `).join('');
        }

        function selectEmployee(id) {
            appState.selectedId = id;
            const emp = appState.employees.find(e => e.id === id);
            Object.keys(emp).forEach(key => {
                const el = document.getElementById(key);
                if(el) el.value = emp[key];
            });
            document.getElementById('cr714_id').value = emp.id;
            renderGallery();
        }

        function showTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            el.classList.add('active');
        }

        function toggleTheme() {
            const body = document.body;
            body.dataset.theme = body.dataset.theme === 'light' ? 'dark' : 'light';
        }

        function navigateTo(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showTermModal() {
            const emp = appState.employees.find(e => e.id === appState.selectedId);
            if(!emp) return alert("Select an employee first.");
            document.getElementById('term-name-label').innerText = emp.cr714_employeename;
            document.getElementById('modal-term').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-term').style.display = 'none'; }

        function processTermination() {
            const date = document.getElementById('term-date-input').value;
            const emp = appState.employees.find(e => e.id === appState.selectedId);
            emp.cr714_status = 0;
            emp.cr714_lastdayofemployment = date;
            closeModal();
            renderGallery();
            alert("Termination Patched.");
        }

        function populateManagers() {
            const mgrs = appState.employees.filter(e => e.cr714_srmanagerflag === "Y").map(e => e.cr714_employeename);
            ['cr714_srmanager', 'cr714_managerassigned'].forEach(s => {
                const el = document.getElementById(s);
                el.innerHTML = mgrs.map(m => `<option value="${m}">${m}</option>`).join('');
            });
        }

        function logout() { msalInstance.logoutPopup().then(() => location.reload()); }
    </script>
</body>
</html>
