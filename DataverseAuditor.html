<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataverse Auditor Pro v1.6</title>
    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <style>
        :root {
            --bg: #111111;
            --surface: #1e1e1e;
            --primary: #0078d4;
            --text: #ffffff;
            --text-secondary: #b3b3b3;
            --border: #333333;
            --success: #22bb33;
            --danger: #ff4444;
        }
        
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            background-color: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden; /* Prevent body scroll */
        }

        .main-wrapper {
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
        }

        .header-section {
            background: var(--surface); padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .dashboard {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px; padding: 10px 20px; background: var(--bg);
        }

        .card {
            background: var(--surface); border: 1px solid var(--border);
            padding: 10px; border-radius: 4px; text-align: center;
        }
        .card h3 { margin: 0; font-size: 20px; color: var(--primary); }
        .card p { margin: 2px 0 0; font-size: 9px; font-weight: bold; color: var(--text-secondary); text-transform: uppercase; }

        .controls-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px; background: var(--surface); padding: 15px 20px;
            border-bottom: 1px solid var(--border); align-items: end;
        }

        .control-item { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: bold; color: var(--text-secondary); }
        input, select {
            background: #2d2d2d; border: 1px solid var(--border);
            color: white; padding: 6px 10px; border-radius: 3px; outline: none;
        }
        input:focus { border-color: var(--primary); }

        .button-row { display: flex; gap: 8px; padding: 10px 20px; align-items: center; background: var(--bg); }
        button {
            height: 34px; padding: 0 15px; cursor: pointer; border: none;
            border-radius: 3px; font-weight: 600; font-size: 13px; transition: 0.2s;
        }
        .primary-btn { background: var(--primary); color: white; }
        .success-btn { background: var(--success); color: white; }
        .stop-btn { background: var(--danger); color: white; }
        
        #global-search { flex-grow: 1; min-width: 200px; }

        /* Table Customization */
        .table-container { flex-grow: 1; padding: 0 20px 20px 20px; background: var(--bg); }
        .tabulator { background: var(--surface) !important; border: none !important; }
        
        /* Cell Wrapping and Note Highlighting */
        .change-wrap { white-space: pre-wrap !important; font-family: 'Consolas', monospace; font-size: 11px; line-height: 1.4; }
        .note-cell { color: #f1c40f !important; font-style: italic; }
        .field-tag { color: var(--text-secondary); font-weight: bold; font-size: 10px; display: block; margin-bottom: 2px; border-bottom: 1px solid #333; }
        
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #loadingOverlay.visible { display: flex; }
        .spinner { border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <b id="progress-text" style="font-size: 18px;">0 Records Collected</b>
    <button class="stop-btn" style="margin-top:20px;" onclick="cancelFetch()">Stop & Show Results</button>
</div>

<div class="main-wrapper">
    <div class="header-section">
        <h2 style="margin:0; font-size: 18px;">Dataverse Auditor Pro <span style="opacity:0.5; font-size: 12px;">v1.6 [Dark Mode]</span></h2>
        <div id="status" style="font-size: 12px; color: var(--primary);">System Ready</div>
    </div>

    <div id="loginSection" style="flex-grow:1; display:flex; align-items:center; justify-content:center;">
        <button class="primary-btn" style="height:50px; padding: 0 40px; font-size: 16px;" onclick="signIn()">Authorize Dynamics 365</button>
    </div>

    <div id="appSection" class="hidden">
        <div class="dashboard">
            <div class="card"><h3 id="stat-total">0</h3><p>Total Records</p></div>
            <div class="card"><h3 id="stat-updates">0</h3><p>Updates</p></div>
            <div class="card"><h3 id="stat-removals">0</h3><p>Data Cleared</p></div>
        </div>

        <div class="controls-grid">
            <div class="control-item"><label>Start Date</label><input type="date" id="startDate"></div>
            <div class="control-item"><label>End Date</label><input type="date" id="endDate"></div>
            <div class="control-item"><label>Exact Entity Name</label><input type="text" id="entityFilter" placeholder="e.g. cadence"></div>
            <div class="control-item"><label>Batch Limit</label><input type="number" id="topLimit" value="80000"></div>
        </div>

        <div class="button-row">
            <button class="primary-btn" onclick="startAudit()">Execute Audit</button>
            <button class="success-btn" onclick="exportExcel()">Export XLSX</button>
            <input type="text" id="global-search" placeholder="Search any column or note content...">
        </div>

        <div class="table-container">
            <div id="audit-table"></div>
        </div>
    </div>
</div>

<script>
    const msalConfig = { 
        auth: { 
            clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", 
            authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", 
            redirectUri: window.location.href 
        }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const orgUrl = "https://org23279050.crm.dynamics.com";
    const actionMap = { 1: "Create", 2: "Update", 3: "Delete" };
    
    let allData = [];
    let isFetching = false;
    let table;

    const clean = (val) => typeof val === "string" ? val.replace(/cr714_/g, "") : val;

    window.onload = async () => {
        const resp = await msalInstance.handleRedirectPromise();
        if (resp) msalInstance.setActiveAccount(resp.account);
        if (msalInstance.getActiveAccount()) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            initTable();
        }
    };

    function signIn() { msalInstance.loginRedirect({ scopes: [`${orgUrl}/user_impersonation`] }); }

    function initTable() {
        table = new Tabulator("#audit-table", {
            height: "100%", // Fit container
            layout: "fitColumns",
            columns: [
                {title: "Timestamp", field: "createdon", width: 160, formatter: (c) => new Date(c.getValue()).toLocaleString()},
                {title: "Event - Record", field: "combinedLabel", width: 200, headerFilter: "input"},
                {title: "User", field: "userName", width: 140, headerFilter: "input"},
                {title: "Entity", field: "entityClean", width: 100, headerFilter: "input"},
                // --- General Changes ---
                {title: "General: Field/Old", field: "oldValHtml", vertAlign: "top", widthGrow: 2, formatter: "html", cssClass: "change-wrap", headerFilter: "input"},
                {title: "General: New", field: "newValHtml", vertAlign: "top", widthGrow: 2, formatter: "html", cssClass: "change-wrap", headerFilter: "input"},
                // --- NOTE SPECIFIC COLUMNS ---
                {title: "Prev Note", field: "oldNoteHtml", vertAlign: "top", widthGrow: 2, formatter: "html", cssClass: "change-wrap note-cell", headerFilter: "input"},
                {title: "New Note", field: "newNoteHtml", vertAlign: "top", widthGrow: 2, formatter: "html", cssClass: "change-wrap note-cell", headerFilter: "input"},
                {title: "D365", field: "linkHtml", width: 50, hozAlign: "center", formatter: "html", headerSort: false}
            ]
        });

        document.getElementById("global-search").addEventListener("keyup", (e) => {
            table.setFilter((data, val) => JSON.stringify(data).toLowerCase().includes(val.toLowerCase()), e.target.value);
        });
    }

    async function startAudit() {
        allData = []; isFetching = true;
        document.getElementById('loadingOverlay').classList.add('visible');
        const limit = parseInt(document.getElementById('topLimit').value) || 80000;
        await fetchLoop(buildBaseQuery(), limit);
    }

    async function fetchLoop(url, limit) {
        if (!isFetching || !url || allData.length >= limit) { finishFetch(); return; }
        try {
            const token = await getToken();
            const response = await fetch(url, {
                headers: { "Authorization": `Bearer ${token}`, "Accept": "application/json", "Prefer": 'odata.include-annotations="*"' }
            });
            const result = await response.json();
            const batch = result.value.map(item => {
                const changes = splitChangesWithNotes(item.changedata);
                return {
                    ...item,
                    userName: item["_userid_value@OData.Community.Display.V1.FormattedValue"] || "System",
                    entityClean: clean(item.objecttypecode),
                    combinedLabel: `${actionMap[item.action] || item.action} - ${clean(item["_objectid_value@OData.Community.Display.V1.FormattedValue"] || item._objectid_value)}`,
                    linkHtml: `<a href="${orgUrl}/main.aspx?etn=${item.objecttypecode}&pagetype=entityrecord&id=${item._objectid_value}" target="_blank" style="color:var(--primary); text-decoration:none;">🔗</a>`,
                    ...changes
                };
            });
            allData = [...allData, ...batch];
            document.getElementById('progress-text').innerText = `${allData.length.toLocaleString()} Records...`;
            updateDashboard();
            table.setData(allData);
            if (result["@odata.nextLink"] && allData.length < limit) await fetchLoop(result["@odata.nextLink"], limit);
            else finishFetch();
        } catch (e) { finishFetch(); }
    }

    function buildBaseQuery() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const entity = document.getElementById('entityFilter').value;
        let url = `${orgUrl}/api/data/v9.2/audits?$select=createdon,action,objecttypecode,_objectid_value,_userid_value,changedata&$orderby=createdon desc&$top=5000`;
        let f = [];
        if (start) f.push(`createdon ge ${start}T00:00:00Z`);
        if (end) f.push(`createdon le ${end}T23:59:59Z`);
        if (entity) f.push(`objecttypecode eq '${entity.toLowerCase().trim()}'`);
        return f.length > 0 ? `${url}&$filter=${f.join(' and ')}` : url;
    }

    // --- NOTE EXTRACTION & SPLIT LOGIC ---
    function splitChangesWithNotes(json) {
        let res = { oldHtml: "", newValHtml: "", oldRaw: "", newValRaw: "", oldNoteHtml: "", newNoteHtml: "", oldNoteRaw: "", newNoteRaw: "" };
        if (!json) return res;
        try {
            const d = JSON.parse(json);
            if (!d.changedAttributes) return res;

            let genOld = [], genNew = [], noteOld = [], noteNew = [];

            d.changedAttributes.forEach(a => {
                const name = a.logicalName;
                const isNote = name.startsWith("cr714_") && name.toLowerCase().includes("note");
                const f = clean(name);
                const o = a.oldValue || '∅';
                const n = a.newValue || '∅';
                const htmlOld = `<span class="field-tag">${f}</span><span style="color:var(--danger)">${o}</span>\n`;
                const htmlNew = `<span class="field-tag">${f}</span><span style="color:var(--success)">${n}</span>\n`;

                if (isNote) {
                    noteOld.push({ h: htmlOld, r: `${f}: ${o}` });
                    noteNew.push({ h: htmlNew, r: n });
                } else {
                    genOld.push({ h: htmlOld, r: `${f}: ${o}` });
                    genNew.push({ h: htmlNew, r: n });
                }
            });

            res.oldHtml = genOld.map(x => x.h).join(''); res.newValHtml = genNew.map(x => x.h).join('');
            res.oldRaw = genOld.map(x => x.r).join('\n'); res.newValRaw = genNew.map(x => x.r).join('\n');
            res.oldNoteHtml = noteOld.map(x => x.h).join(''); res.newNoteHtml = noteNew.map(x => x.h).join('');
            res.oldNoteRaw = noteOld.map(x => x.r).join('\n'); res.newNoteRaw = noteNew.map(x => x.r).join('\n');
        } catch (e) { res.oldHtml = clean(json); }
        return res;
    }

    function finishFetch() { isFetching = false; document.getElementById('loadingOverlay').classList.remove('visible'); }
    function cancelFetch() { isFetching = false; }

    function updateDashboard() {
        document.getElementById('stat-total').innerText = allData.length.toLocaleString();
        document.getElementById('stat-updates').innerText = allData.filter(r => r.action === 2).length.toLocaleString();
        document.getElementById('stat-removals').innerText = allData.filter(r => {
            if (r.action !== 2 || !r.changedata) return false;
            const m = JSON.parse(r.changedata);
            return m.changedAttributes && m.changedAttributes.some(a => a.oldValue && !a.newValue);
        }).length.toLocaleString();
    }

    async function getToken() {
        const req = { scopes: [`${orgUrl}/user_impersonation`], account: msalInstance.getActiveAccount() };
        return (await msalInstance.acquireTokenSilent(req).catch(() => msalInstance.acquireTokenPopup(req))).accessToken;
    }

    function exportExcel() {
        const set = allData.map(r => ({
            "Timestamp": new Date(r.createdon).toLocaleString(),
            "Event": r.combinedLabel,
            "User": r.userName,
            "Entity": r.entityClean,
            "General: Prev": r.oldRaw, "General: New": r.newValRaw,
            "Note: Prev": r.oldNoteRaw, "Note: New": r.newNoteRaw
        }));
        const ws = XLSX.utils.json_to_sheet(set);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "AuditData");
        XLSX.writeFile(wb, `Dataverse_Audit_Dark_v1.6.xlsx`);
    }
</script>
</body>
</html>
