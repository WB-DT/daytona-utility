<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataverse Auditor Pro v1.10</title>
    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <style>
        :root { --bg: #0a0a0a; --surf: #161616; --prim: #0078d4; --txt: #fafafa; --mut: #888; --bord: #2d2d2d; --err: #f85149; --ok: #2ea043; --warn: #e3b341; }
        body, html { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--txt); font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        .header { background: var(--surf); padding: 6px 20px; border-bottom: 1px solid var(--bord); display: flex; justify-content: space-between; align-items: center; }
        .version { font-size: 10px; background: var(--prim); color: white; padding: 1px 6px; border-radius: 2px; font-weight: bold; }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; padding: 10px 20px; }
        .card { background: var(--surf); border: 1px solid var(--bord); padding: 10px; border-radius: 4px; text-align: center; border-left: 3px solid var(--prim); }
        .card h3 { margin: 0; font-size: 20px; }
        .card p { margin: 2px 0 0; font-size: 9px; font-weight: bold; color: var(--mut); text-transform: uppercase; }

        .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; background: var(--surf); padding: 12px 20px; border-bottom: 1px solid var(--bord); align-items: end; }
        .c-item { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; font-weight: bold; color: var(--mut); text-transform: uppercase; }
        input, select { background: #222; border: 1px solid var(--bord); color: white; padding: 6px; border-radius: 2px; outline: none; font-size: 12px; }

        .btn-row { display: flex; gap: 8px; padding: 10px 20px; align-items: center; background: var(--bg); }
        button { height: 32px; padding: 0 15px; cursor: pointer; border: none; border-radius: 2px; font-weight: 600; font-size: 11px; }
        .btn-p { background: var(--prim); color: white; }
        .btn-s { background: var(--ok); color: white; }
        .btn-d { background: var(--err); color: white; }
        #g-search { flex-grow: 1; border: 1px solid var(--prim); background: #111; color: white; padding: 0 10px; height: 30px; }

        .table-area { flex-grow: 1; padding: 0 10px 10px; background: var(--bg); overflow: hidden; }
        
        /* Table Cell Layout */
        .sync-box { display: flex; min-height: 22px; align-items: stretch; border-bottom: 1px solid #222; width: 100%; }
        .sync-label { flex: 0 0 120px; font-weight: bold; color: var(--mut); font-size: 10px; padding: 4px; border-right: 1px solid #333; overflow: hidden; text-overflow: ellipsis; }
        .sync-val { flex: 1; padding: 4px; white-space: pre-wrap; word-wrap: break-word; font-family: 'Consolas', monospace; font-size: 11px; }

        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #overlay.show { display: flex; }
        .spin { border: 4px solid #333; border-top: 4px solid var(--prim); border-radius: 50%; width: 40px; height: 40px; animation: s 1s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="overlay">
    <div class="spin"></div>
    <h2 id="p-count" style="color: var(--prim); margin-top:20px;">0 Records</h2>
    <p id="p-log" style="color: var(--mut); font-family: monospace; font-size: 12px;"></p>
    <button class="btn-d" onclick="cancelFetch()">STOP & SHOW CURRENT</button>
</div>

<div class="wrapper">
    <div class="header">
        <h2 style="margin:0; font-size: 16px;">Dataverse Auditor Pro <span class="version">v1.10</span></h2>
        <div id="status" style="font-size: 11px; color: var(--mut);">Ready</div>
    </div>

    <div id="loginSection" style="flex-grow:1; display:flex; align-items:center; justify-content:center;">
        <button class="btn-p" style="height:45px; width:280px;" onclick="signIn()">AUTHENTICATE DATAVERSE</button>
    </div>

    <div id="appSection" class="hidden">
        <div class="dashboard">
            <div class="card"><h3 id="st-total">0</h3><p>Records</p></div>
            <div class="card"><h3 id="st-upd">0</h3><p>Updates</p></div>
            <div class="card"><h3 id="st-rem">0</h3><p>Removals</p></div>
            <div class="card"><h3 id="st-err" style="color:var(--err)">0</h3><p>API Errors</p></div>
        </div>

        <div class="controls">
            <div class="c-item"><label>Date From</label><input type="date" id="dStart"></div>
            <div class="c-item"><label>Date To</label><input type="date" id="dEnd"></div>
            <div class="c-item"><label>Entity Logic Name</label><input type="text" id="eFilter" placeholder="e.g. cadence"></div>
            <div class="c-item"><label>Max Fetch</label><input type="number" id="fLimit" value="80000"></div>
            <div class="c-item">
                <label>Audit Actions</label>
                <div style="font-size: 10px; display:flex; gap:5px;">
                    <label><input type="checkbox" id="chkU" checked> Upd</label>
                    <label><input type="checkbox" id="chkD" checked> Del</label>
                    <label><input type="checkbox" id="chkC"> Cre</label>
                </div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-p" onclick="runSearch()">RUN AUDIT PULL</button>
            <button class="btn-s" onclick="exportExcel()">EXPORT CLEAN XLSX</button>
            <input type="text" id="g-search" placeholder="Excel-Style Global Search (Filter everything)...">
        </div>

        <div class="table-area"><div id="audit-table"></div></div>
    </div>
</div>

<script>
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: window.location.href }, cache: { cacheLocation: "localStorage" } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const orgUrl = "https://org23279050.crm.dynamics.com";
    const actMap = { 1: "Create", 2: "Update", 3: "Delete" };
    
    let allData = [], isFetching = false, table, errorCount = 0;

    // Humanize: cr714_customer_note -> Customer Note
    const clean = (s) => {
        if (typeof s !== "string") return s;
        let t = s.replace(/cr714_/g, "").replace(/_/g, " ");
        return t.replace(/([A-Z])/g, ' $1').replace(/^./, (str) => str.toUpperCase()).trim();
    };

    window.onload = async () => {
        const resp = await msalInstance.handleRedirectPromise();
        if (resp) msalInstance.setActiveAccount(resp.account);
        if (msalInstance.getActiveAccount()) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            initTable();
        }
    };

    function signIn() { msalInstance.loginRedirect({ scopes: [`${orgUrl}/user_impersonation`] }); }

    function initTable() {
        table = new Tabulator("#audit-table", {
            height: "100%", layout: "fitColumns", movableColumns: true, 
            renderVertical:"virtual", // Memory Safety for 80k rows
            columns: [
                {title: "Timestamp", field: "createdon", width: 150, formatter: (c) => new Date(c.getValue()).toLocaleString()},
                {title: "Event - Record", field: "cLab", width: 200, headerFilter: "input"},
                {title: "User", field: "uName", width: 140, headerFilter: "input"},
                {title: "Entity", field: "eClean", width: 100, headerFilter: "input"},
                {title: "Field & Old Value", field: "oldH", widthGrow: 2, formatter: "html", headerFilter: "input"},
                {title: "New Value", field: "newH", widthGrow: 2, formatter: "html", headerFilter: "input"},
                {title: "Prev Note", field: "onH", widthGrow: 2, formatter: "html", cssClass: "warn", headerFilter: "input"},
                {title: "New Note", field: "nnH", widthGrow: 2, formatter: "html", cssClass: "warn", headerFilter: "input"},
                {title: "D365", field: "link", width: 45, hozAlign: "center", formatter: "html", headerSort: false}
            ]
        });
        document.getElementById("g-search").addEventListener("keyup", (e) => {
            table.setFilter((data, val) => JSON.stringify(data).toLowerCase().includes(val.toLowerCase()), e.target.value);
        });
    }

    async function runSearch() {
        allData = []; isFetching = true; errorCount = 0;
        document.getElementById('overlay').classList.add('show');
        const limit = parseInt(document.getElementById('fLimit').value) || 80000;
        await fetchLoop(buildQuery(), limit);
    }

    async function fetchLoop(url, limit) {
        if (!isFetching || !url || allData.length >= limit) { finish(); return; }
        try {
            const token = await getToken();
            const resp = await fetch(url, { headers: { "Authorization": `Bearer ${token}`, "Accept": "application/json", "Prefer": 'odata.include-annotations="*"' } });
            const res = await resp.json();
            const batch = res.value.map(item => {
                const changes = processSplit(item.changedata);
                return {
                    ...item,
                    uName: item["_userid_value@OData.Community.Display.V1.FormattedValue"] || "System",
                    eClean: clean(item.objecttypecode),
                    cLab: `${actMap[item.action] || item.action} - ${clean(item["_objectid_value@OData.Community.Display.V1.FormattedValue"] || item._objectid_value)}`,
                    link: `<a href="${orgUrl}/main.aspx?etn=${item.objecttypecode}&pagetype=entityrecord&id=${item._objectid_value}" target="_blank" style="text-decoration:none;">🔗</a>`,
                    ...changes
                };
            });
            allData = [...allData, ...batch];
            document.getElementById('p-count').innerText = `${allData.length.toLocaleString()} Records`;
            document.getElementById('p-log').innerText = `API BATCH OK | Total: ${allData.length} / ${limit}`;
            updateDash();
            table.setData(allData);
            if (res["@odata.nextLink"] && allData.length < limit) await fetchLoop(res["@odata.nextLink"], limit);
            else finish();
        } catch (e) { errorCount++; document.getElementById('st-err').innerText = errorCount; finish(); }
    }

    function buildQuery() {
        const s = document.getElementById('dStart').value, e = document.getElementById('dEnd').value, ent = document.getElementById('eFilter').value;
        let url = `${orgUrl}/api/data/v9.2/audits?$select=createdon,action,objecttypecode,_objectid_value,_userid_value,changedata&$orderby=createdon desc&$top=5000`;
        let f = [];
        if (s) f.push(`createdon ge ${s}T00:00:00Z`);
        if (e) f.push(`createdon le ${e}T23:59:59Z`);
        if (ent) f.push(`objecttypecode eq '${ent.toLowerCase().trim()}'`);
        let acts = [];
        if (document.getElementById('chkU').checked) acts.push(2);
        if (document.getElementById('chkD').checked) acts.push(3);
        if (document.getElementById('chkC').checked) acts.push(1);
        if (acts.length > 0) f.push(`Microsoft.Dynamics.CRM.In(PropertyName='action',PropertyValues=[${acts.join(',')}])`);
        return f.length > 0 ? `${url}&$filter=${f.join(' and ')}` : url;
    }

    function processSplit(json) {
        let r = { oldH: "", newH: "", oldR: "", newR: "", onH: "", nnH: "", onR: "", nnR: "" };
        if (!json) return r;
        try {
            const d = JSON.parse(json);
            if (!d.changedAttributes) return r;
            let gO = [], gN = [], nO = [], nN = [];
            d.changedAttributes.forEach(a => {
                const name = a.logicalName, isN = name.startsWith("cr714_") && name.toLowerCase().includes("note");
                const f = clean(name), o = a.oldValue || '∅', n = a.newValue || '∅';
                const wO = `<div class="sync-box"><div class="sync-label">${f}</div><div class="sync-val" style="color:var(--err)">${o}</div></div>`;
                const wN = `<div class="sync-box"><div class="sync-val" style="color:var(--ok)">${n}</div></div>`;
                if (isN) { nO.push({ h: wO, r: `${f}: ${o}` }); nN.push({ h: wN, r: n }); }
                else { gO.push({ h: wO, r: `${f}: ${o}` }); gN.push({ h: wN, r: n }); }
            });
            r.oldH = gO.map(x => x.h).join(''); r.newH = gN.map(x => x.h).join('');
            r.oldR = gO.map(x => x.r).join('\n'); r.newR = gN.map(x => x.r).join('\n');
            r.onH = nO.map(x => x.h).join(''); r.nnH = nN.map(x => x.h).join('');
            r.onR = nO.map(x => x.r).join('\n'); r.nnR = nN.map(x => x.r).join('\n');
        } catch (e) { r.oldH = clean(json); }
        return r;
    }

    function finish() { isFetching = false; document.getElementById('overlay').classList.remove('show'); }
    function cancelFetch() { isFetching = false; }

    function updateDash() {
        document.getElementById('st-total').innerText = allData.length.toLocaleString();
        document.getElementById('st-upd').innerText = allData.filter(r => r.action === 2).length.toLocaleString();
        document.getElementById('st-rem').innerText = allData.filter(r => {
            if (r.action !== 2 || !r.changedata) return false;
            const m = JSON.parse(r.changedata);
            return m.changedAttributes && m.changedAttributes.some(a => a.oldValue && !a.newValue);
        }).length.toLocaleString();
    }

    async function getToken() {
        const req = { scopes: [`${orgUrl}/user_impersonation`], account: msalInstance.getActiveAccount() };
        return (await msalInstance.acquireTokenSilent(req).catch(() => msalInstance.acquireTokenPopup(req))).accessToken;
    }

    function exportExcel() {
        const set = allData.map(r => ({ "Timestamp": new Date(r.createdon).toLocaleString(), "Event": r.cLab, "User": r.uName, "Entity": r.eClean, "Field/Old": r.oldR, "New": r.newR, "Note Prev": r.onR, "Note New": r.nnR }));
        const ws = XLSX.utils.json_to_sheet(set);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Audits");
        XLSX.writeFile(wb, `Audit_Export_Final_v1.10.xlsx`);
    }
</script>
</body>
</html>
