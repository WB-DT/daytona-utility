<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataverse Auditor Pro v1.14</title>

    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <style>
        :root {
            --bg: #0a0a0a;
            --surf: #161616;
            --prim: #0078d4;
            --txt: #fafafa;
            --mut: #888;
            --bord: #333;
            --err: #f85149;
            --ok: #2ea043;
            --warn: #d29922;
        }

        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--txt);
            font-family: "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            min-height: 0;
        }

        .header {
            background: var(--surf);
            padding: 8px 20px;
            border-bottom: 1px solid var(--bord);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 0 0 auto;
        }

        #loginSection {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        #appSection {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .hidden {
            display: none !important;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            padding: 10px 20px;
            flex: 0 0 auto;
        }

        .card {
            background: var(--surf);
            border: 1px solid var(--bord);
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            user-select: none;
        }

        .card:hover {
            background: #222;
        }

        .card.active-filter {
            border-bottom-color: var(--prim);
            background: #1a1a1a;
        }

        .card h3 {
            margin: 0;
            font-size: 20px;
        }

        .card p {
            margin: 2px 0 0;
            font-size: 9px;
            font-weight: bold;
            color: var(--mut);
            text-transform: uppercase;
        }

        .controls {
            background: var(--surf);
            padding: 12px 20px;
            border-bottom: 1px solid var(--bord);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            align-items: end;
            flex: 0 0 auto;
            position: relative;
        }

        .c-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 10px;
            font-weight: bold;
            color: var(--mut);
            text-transform: uppercase;
        }

        input {
            background: #111;
            border: 1px solid var(--bord);
            color: white;
            padding: 6px;
            border-radius: 2px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            align-items: center;
            background: var(--bg);
            flex: 0 0 auto;
        }

        button {
            height: 32px;
            padding: 0 15px;
            cursor: pointer;
            border: none;
            border-radius: 2px;
            font-weight: 600;
            font-size: 11px;
            transition: 0.1s;
        }

        button:hover {
            filter: brightness(1.12);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-p {
            background: var(--prim);
            color: white;
        }

        .btn-s {
            background: var(--ok);
            color: white;
        }

        .btn-d {
            background: var(--err);
            color: white;
        }

        .btn-neutral {
            background: #333;
            color: white;
        }

        #g-search {
            flex-grow: 1;
            border: 1px solid var(--prim);
            background: #000;
            color: #fff;
            padding: 0 10px;
            height: 32px;
            outline: none;
        }

        .table-area {
            flex: 1;
            min-height: 0;
            width: 100%;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        #audit-table {
            height: 100%;
            width: 100%;
        }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #111;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border: 3px solid #111;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--prim);
        }

        .tabulator {
            background: #000 !important;
            border: none !important;
        }

        .tabulator-header {
            background: #1a1a1a !important;
            color: #fff !important;
        }

        .sync-box {
            display: flex;
            border-bottom: 1px solid #222;
            width: 100%;
            align-items: stretch;
        }

        .sync-label {
            flex: 0 0 110px;
            font-weight: bold;
            color: var(--mut);
            font-size: 10px;
            padding: 4px;
            border-right: 1px solid #333;
            overflow: hidden;
        }

        .sync-val {
            flex: 1;
            padding: 4px;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
            font-size: 11px;
            word-break: break-word;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        #overlay.show {
            display: flex;
        }

        #p-log {
            max-width: 900px;
            max-height: 180px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid var(--prim);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #columnPanel {
            position: absolute;
            right: 20px;
            top: 72px;
            width: 260px;
            max-height: 360px;
            overflow: auto;
            background: #111;
            border: 1px solid var(--bord);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
            z-index: 50;
            padding: 10px;
            border-radius: 4px;
        }

        #columnPanel h4 {
            margin: 0 0 8px;
            font-size: 12px;
            color: var(--txt);
        }

        .col-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 2px;
            font-size: 12px;
            color: var(--txt);
        }

        .col-option input {
            margin: 0;
        }

        .status-ok {
            color: var(--ok) !important;
        }

        .status-warn {
            color: var(--warn) !important;
        }

        .status-err {
            color: var(--err) !important;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <div class="spinner"></div>
        <h2 id="p-count" style="color: var(--prim); margin-top: 20px;">0 Records</h2>
        <p id="p-log" style="color: var(--mut); font-size: 12px; font-family: monospace;">Fetching batch...</p>
        <button class="btn-d" onclick="cancelFetch()">STOP & RENDER</button>
    </div>

    <div class="wrapper">
        <div class="header">
            <h2 style="margin: 0; font-size: 16px;">
                Dataverse Auditor Pro
                <span style="opacity: 0.5; font-size: 10px;">v1.14</span>
            </h2>
            <div id="status" style="font-size: 11px; color: var(--mut);">Ready</div>
        </div>

        <div id="loginSection">
            <button class="btn-p" style="height: 50px; width: 300px; font-size: 14px;" onclick="signIn()">
                CONNECT TO DATAVERSE
            </button>
        </div>

        <div id="appSection" class="hidden">
            <div class="dashboard">
                <div class="card active-filter" id="card-all" onclick="setQuickFilter('all')">
                    <h3 id="st-total">0</h3>
                    <p>Total Pulled</p>
                </div>

                <div class="card" id="card-upd" onclick="setQuickFilter(2)">
                    <h3 id="st-upd">0</h3>
                    <p>Updates</p>
                </div>

                <div class="card" id="card-del" onclick="setQuickFilter(3)">
                    <h3 id="st-del">0</h3>
                    <p>Deletes</p>
                </div>

                <div class="card" id="card-rem" onclick="setQuickFilter('rem')">
                    <h3 id="st-rem">0</h3>
                    <p>Clearances</p>
                </div>
            </div>

            <div class="controls">
                <div class="c-item">
                    <label>Start Date</label>
                    <input type="date" id="dStart">
                </div>

                <div class="c-item">
                    <label>End Date</label>
                    <input type="date" id="dEnd">
                </div>

                <div class="c-item">
                    <label>Entity Exact Name</label>
                    <input type="text" id="eFilter" placeholder="cadence">
                </div>

                <div class="c-item">
                    <label>Limit</label>
                    <input type="number" id="fLimit" value="80000" min="1">
                </div>

                <div class="c-item">
                    <button class="btn-neutral" onclick="toggleColumnPanel()">Columns</button>
                </div>

                <div id="columnPanel" class="hidden">
                    <h4>Visible Columns</h4>
                    <div id="columnOptions"></div>
                </div>
            </div>

            <div class="toolbar">
                <button class="btn-p" id="runBtn" onclick="runSearch()">EXECUTE PULL</button>
                <button class="btn-s" onclick="exportExcel()">EXPORT CLEAN XLSX</button>
                <input type="text" id="g-search" placeholder="Excel Filter - search content, records, or notes...">
            </div>

            <div class="table-area">
                <div id="audit-table"></div>
            </div>
        </div>
    </div>

    <script>
        const orgUrl = "https://org23279050.crm.dynamics.com";

        const msalConfig = {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: window.location.origin + window.location.pathname
            },
            cache: {
                cacheLocation: "localStorage",
                storeAuthStateInCookie: false
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        const actMap = {
            1: "Create",
            2: "Update",
            3: "Delete"
        };

        let allData = [];
        let isFetching = false;
        let table = null;
        let activeQuickFilter = "all";

        function setStatus(message, type = "normal") {
            const el = document.getElementById("status");
            el.innerText = message;
            el.classList.remove("status-ok", "status-warn", "status-err");

            if (type === "ok") el.classList.add("status-ok");
            if (type === "warn") el.classList.add("status-warn");
            if (type === "err") el.classList.add("status-err");
        }

        function escapeHtml(value) {
            return String(value ?? "∅")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function valueToText(value) {
            if (value === null || value === undefined || value === "") return "∅";
            if (typeof value === "object") {
                try {
                    return JSON.stringify(value);
                } catch {
                    return String(value);
                }
            }
            return String(value);
        }

        function clean(value) {
            if (value === null || value === undefined || value === "") return "";

            return String(value)
                .replace(/cr714_/g, "")
                .replace(/_/g, " ")
                .replace(/([A-Z])/g, " $1")
                .replace(/^./, str => str.toUpperCase())
                .trim();
        }

        function safeDate(value) {
            if (!value) return "";
            const d = new Date(value);
            return Number.isNaN(d.getTime()) ? value : d.toLocaleString();
        }

        window.onload = async () => {
            try {
                const resp = await msalInstance.handleRedirectPromise();

                if (resp && resp.account) {
                    msalInstance.setActiveAccount(resp.account);
                }

                const accounts = msalInstance.getAllAccounts();

                if (!msalInstance.getActiveAccount() && accounts.length > 0) {
                    msalInstance.setActiveAccount(accounts[0]);
                }

                if (msalInstance.getActiveAccount()) {
                    showApp();
                } else {
                    setStatus("Ready");
                }
            } catch (e) {
                console.error("MSAL redirect handling failed:", e);
                setStatus("Login error. Check console.", "err");
            }
        };

        function showApp() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("appSection").classList.remove("hidden");

            if (!table) {
                initTable();
            }

            setStatus("Connected", "ok");
        }

        function signIn() {
            msalInstance.loginRedirect({
                scopes: [`${orgUrl}/user_impersonation`]
            });
        }

        function initTable() {
            table = new Tabulator("#audit-table", {
                height: "100%",
                layout: "fitColumns",
                renderVertical: "virtual",
                renderVerticalBuffer: 100,
                movableColumns: true,
                resizableColumnFit: true,
                placeholder: "No audit records loaded.",
                columns: [
                    {
                        title: "Timestamp",
                        field: "createdon",
                        width: 160,
                        formatter: cell => safeDate(cell.getValue())
                    },
                    {
                        title: "Event - Record",
                        field: "cLab",
                        width: 240,
                        headerFilter: "input"
                    },
                    {
                        title: "User",
                        field: "uName",
                        width: 160,
                        headerFilter: "input"
                    },
                    {
                        title: "Entity",
                        field: "eClean",
                        width: 130,
                        headerFilter: "input"
                    },
                    {
                        title: "Field & Old Value",
                        field: "oldH",
                        widthGrow: 2,
                        formatter: "html",
                        headerFilter: "input",
                        vertAlign: "top"
                    },
                    {
                        title: "New Value",
                        field: "newH",
                        widthGrow: 2,
                        formatter: "html",
                        headerFilter: "input",
                        vertAlign: "top"
                    },
                    {
                        title: "Prev Note",
                        field: "onH",
                        widthGrow: 2,
                        formatter: "html",
                        headerFilter: "input",
                        vertAlign: "top"
                    },
                    {
                        title: "New Note",
                        field: "nnH",
                        widthGrow: 2,
                        formatter: "html",
                        headerFilter: "input",
                        vertAlign: "top"
                    }
                ]
            });

            document.getElementById("g-search").addEventListener("input", applyCombinedFilter);

            setTimeout(() => {
                table.redraw(true);
                buildColumnPanel();
            }, 100);
        }

        function buildColumnPanel() {
            const panel = document.getElementById("columnOptions");
            panel.innerHTML = "";

            table.getColumns().forEach(col => {
                const def = col.getDefinition();

                if (!def.field) return;

                const row = document.createElement("label");
                row.className = "col-option";

                const check = document.createElement("input");
                check.type = "checkbox";
                check.checked = col.isVisible();

                check.addEventListener("change", () => {
                    if (check.checked) {
                        col.show();
                    } else {
                        col.hide();
                    }
                });

                const text = document.createElement("span");
                text.innerText = def.title || def.field;

                row.appendChild(check);
                row.appendChild(text);
                panel.appendChild(row);
            });
        }

        function toggleColumnPanel() {
            document.getElementById("columnPanel").classList.toggle("hidden");
        }

        document.addEventListener("click", e => {
            const panel = document.getElementById("columnPanel");
            const clickedPanel = panel.contains(e.target);
            const clickedColumnButton = e.target.closest("button") && e.target.closest("button").innerText === "Columns";

            if (!clickedPanel && !clickedColumnButton) {
                panel.classList.add("hidden");
            }
        });

        async function runSearch() {
            if (!table) return;

            allData = [];
            isFetching = true;

            table.clearData();
            updateDash();

            document.getElementById("runBtn").disabled = true;
            document.getElementById("overlay").classList.add("show");
            document.getElementById("p-count").innerText = "0 Records";
            document.getElementById("p-log").innerText = "Building query...";

            setStatus("Fetching audits...", "warn");

            const limit = parseInt(document.getElementById("fLimit").value, 10) || 80000;

            await fetchLoop(buildQuery(), limit);
        }

        async function fetchLoop(url, limit) {
            if (!isFetching || !url || allData.length >= limit) {
                finish();
                return;
            }

            try {
                document.getElementById("p-log").innerText = `Fetching batch...\n${url}`;

                const token = await getToken();

                const resp = await fetch(url, {
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Accept": "application/json",
                        "Prefer": 'odata.include-annotations="*"'
                    }
                });

                const rawText = await resp.text();

                if (!resp.ok) {
                    console.error("Dataverse error:", resp.status, rawText);
                    document.getElementById("p-log").innerText = `Dataverse error ${resp.status}:\n${rawText}`;
                    setStatus(`Dataverse error ${resp.status}`, "err");
                    finish();
                    return;
                }

                const res = JSON.parse(rawText);

                if (!Array.isArray(res.value)) {
                    console.error("Unexpected Dataverse response:", res);
                    document.getElementById("p-log").innerText = "Unexpected Dataverse response. Check console.";
                    setStatus("Unexpected response", "err");
                    finish();
                    return;
                }

                const batch = res.value.map(item => {
                    const changes = processSplit(item.changedata);

                    const recordName =
                        item["_objectid_value@OData.Community.Display.V1.FormattedValue"] ||
                        item._objectid_value ||
                        "(record unavailable)";

                    return {
                        ...item,
                        uName: item["_userid_value@OData.Community.Display.V1.FormattedValue"] || "System",
                        eClean: clean(item.objecttypecode),
                        cLab: `${actMap[item.action] || item.action} - ${clean(recordName)}`,
                        ...changes
                    };
                });

                const remaining = limit - allData.length;
                const trimmedBatch = batch.slice(0, remaining);

                allData.push(...trimmedBatch);

                document.getElementById("p-count").innerText = `${allData.length.toLocaleString()} Records`;
                updateDash();

                if (trimmedBatch.length > 0) {
                    table.addData(trimmedBatch);
                    applyCombinedFilter();
                }

                if (isFetching && res["@odata.nextLink"] && allData.length < limit) {
                    await fetchLoop(res["@odata.nextLink"], limit);
                } else {
                    finish();
                }
            } catch (e) {
                console.error("Fetch failed:", e);
                document.getElementById("p-log").innerText = e.message || String(e);
                setStatus("Fetch failed. Check console.", "err");
                finish();
            }
        }

        function buildQuery() {
            const s = document.getElementById("dStart").value;
            const e = document.getElementById("dEnd").value;
            const ent = document.getElementById("eFilter").value.trim();

            const baseUrl = `${orgUrl}/api/data/v9.2/audits`;
            const params = [
                "$select=createdon,action,objecttypecode,_objectid_value,_userid_value,changedata",
                "$orderby=createdon desc",
                "$top=5000"
            ];

            const filters = [];

            if (s) {
                filters.push(`createdon ge ${s}T00:00:00Z`);
            }

            if (e) {
                filters.push(`createdon le ${e}T23:59:59Z`);
            }

            if (ent) {
                const safeEnt = ent.toLowerCase().replace(/'/g, "''");
                filters.push(`objecttypecode eq '${safeEnt}'`);
            }

            if (filters.length > 0) {
                params.push(`$filter=${encodeURIComponent(filters.join(" and "))}`);
            }

            return `${baseUrl}?${params.join("&")}`;
        }

        function processSplit(json) {
            const r = {
                oldH: "",
                newH: "",
                oldR: "",
                newR: "",
                onH: "",
                nnH: "",
                onR: "",
                nnR: "",
                isRem: false
            };

            if (!json) return r;

            try {
                const d = JSON.parse(json);

                if (!d.changedAttributes || !Array.isArray(d.changedAttributes)) {
                    return r;
                }

                const generalOldHtml = [];
                const generalNewHtml = [];
                const noteOldHtml = [];
                const noteNewHtml = [];

                d.changedAttributes.forEach(a => {
                    const logicalName = a.logicalName || "";
                    const isNoteField = logicalName.startsWith("cr714_") && logicalName.toLowerCase().includes("note");

                    const fieldNameRaw = clean(logicalName);
                    const fieldNameHtml = escapeHtml(fieldNameRaw);

                    const oldExists = a.oldValue !== null && a.oldValue !== undefined && a.oldValue !== "";
                    const newExists = a.newValue !== null && a.newValue !== undefined && a.newValue !== "";

                    const oldText = valueToText(a.oldValue);
                    const newText = valueToText(a.newValue);

                    const oldHtmlValue = escapeHtml(oldText);
                    const newHtmlValue = escapeHtml(newText);

                    if (oldExists && !newExists) {
                        r.isRem = true;
                    }

                    const oldLine = `
                        <div class="sync-box">
                            <div class="sync-label">${fieldNameHtml}</div>
                            <div class="sync-val" style="color: var(--err);">${oldHtmlValue}</div>
                        </div>
                    `;

                    const newLine = `
                        <div class="sync-box">
                            <div class="sync-label">${fieldNameHtml}</div>
                            <div class="sync-val" style="color: var(--ok);">${newHtmlValue}</div>
                        </div>
                    `;

                    if (isNoteField) {
                        noteOldHtml.push(oldLine);
                        noteNewHtml.push(newLine);
                        r.onR += `${fieldNameRaw}: ${oldText}\n`;
                        r.nnR += `${fieldNameRaw}: ${newText}\n`;
                    } else {
                        generalOldHtml.push(oldLine);
                        generalNewHtml.push(newLine);
                        r.oldR += `${fieldNameRaw}: ${oldText}\n`;
                        r.newR += `${fieldNameRaw}: ${newText}\n`;
                    }
                });

                r.oldH = generalOldHtml.join("");
                r.newH = generalNewHtml.join("");
                r.onH = noteOldHtml.join("");
                r.nnH = noteNewHtml.join("");
            } catch (e) {
                console.warn("Could not parse changedata:", e, json);
                r.oldH = escapeHtml(clean(json));
                r.oldR = clean(json);
            }

            return r;
        }

        function setQuickFilter(type) {
            activeQuickFilter = type;

            document.querySelectorAll(".card").forEach(c => c.classList.remove("active-filter"));

            if (type === "all") {
                document.getElementById("card-all").classList.add("active-filter");
            } else if (type === "rem") {
                document.getElementById("card-rem").classList.add("active-filter");
            } else if (type === 2) {
                document.getElementById("card-upd").classList.add("active-filter");
            } else if (type === 3) {
                document.getElementById("card-del").classList.add("active-filter");
            }

            applyCombinedFilter();
        }

        function applyCombinedFilter() {
            if (!table) return;

            const search = document.getElementById("g-search").value.trim().toLowerCase();

            if (activeQuickFilter === "all" && !search) {
                table.clearFilter();
                return;
            }

            table.setFilter((data, params) => {
                let quickPass = true;

                if (params.quick === "rem") {
                    quickPass = data.isRem === true;
                } else if (params.quick === 2 || params.quick === 3) {
                    quickPass = data.action === params.quick;
                }

                if (!quickPass) return false;

                if (!params.search) return true;

                return JSON.stringify(data).toLowerCase().includes(params.search);
            }, {
                quick: activeQuickFilter,
                search
            });
        }

        function finish() {
            isFetching = false;
            document.getElementById("overlay").classList.remove("show");
            document.getElementById("runBtn").disabled = false;

            if (table) {
                table.redraw(true);
            }

            if (allData.length > 0) {
                setStatus(`Loaded ${allData.length.toLocaleString()} audit rows`, "ok");
            } else if (!document.getElementById("status").classList.contains("status-err")) {
                setStatus("No records loaded", "warn");
            }
        }

        function cancelFetch() {
            isFetching = false;
            document.getElementById("p-log").innerText = "Stopping after current request finishes...";
            setStatus("Stopping fetch...", "warn");
        }

        function updateDash() {
            document.getElementById("st-total").innerText = allData.length.toLocaleString();
            document.getElementById("st-upd").innerText = allData.filter(r => r.action === 2).length.toLocaleString();
            document.getElementById("st-del").innerText = allData.filter(r => r.action === 3).length.toLocaleString();
            document.getElementById("st-rem").innerText = allData.filter(r => r.isRem).length.toLocaleString();
        }

        async function getToken() {
            const account = msalInstance.getActiveAccount();

            if (!account) {
                throw new Error("No active Microsoft account. Please sign in again.");
            }

            const req = {
                scopes: [`${orgUrl}/user_impersonation`],
                account
            };

            try {
                const result = await msalInstance.acquireTokenSilent(req);
                return result.accessToken;
            } catch (silentError) {
                console.warn("Silent token failed. Trying popup.", silentError);
                const result = await msalInstance.acquireTokenPopup(req);
                return result.accessToken;
            }
        }

        function exportExcel() {
            if (!table) return;

            const cols = table.getColumns().filter(c => c.isVisible());
            const activeData = table.getData("active");

            if (!activeData.length) {
                alert("No rows to export.");
                return;
            }

            const data = activeData.map(r => {
                const row = {};

                cols.forEach(c => {
                    const f = c.getField();
                    const title = c.getDefinition().title;

                    if (!f) return;

                    if (f === "createdon") {
                        row["Timestamp"] = safeDate(r[f]);
                    } else if (f === "oldH") {
                        row["Field/Old"] = r.oldR;
                    } else if (f === "newH") {
                        row["New Value"] = r.newR;
                    } else if (f === "onH") {
                        row["Prev Note"] = r.onR;
                    } else if (f === "nnH") {
                        row["New Note"] = r.nnR;
                    } else {
                        row[title] = r[f];
                    }
                });

                return row;
            });

            const ws = XLSX.utils.json_to_sheet(data);

            ws["!cols"] = Object.keys(data[0] || {}).map(key => ({
                wch: Math.min(Math.max(key.length + 4, 18), 80)
            }));

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Audits");
            XLSX.writeFile(wb, "Dataverse_Audit_v1.14.xlsx");
        }
    </script>
</body>
