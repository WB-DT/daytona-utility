<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataverse Auditor Pro v1.22</title>
    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.full.min.js"></script>
    <link id="tabulator-theme" href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <style>
        :root {
            --bg: #050505; --surf: #121212; --prim: #0078d4; --txt: #ffffff;
            --mut: #a0a0a0; --bord: #333333; --err: #f85149; --ok: #2ea043;
        }
        .light-theme {
            --bg: #f3f2f1; --surf: #ffffff; --prim: #0078d4; --txt: #201f1e;
            --mut: #605e5c; --bord: #edebe9; --err: #a4262c; --ok: #107c41;
        }
        body, html { height: 100%; width: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--txt); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
        .main-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        .header-bar { background: var(--surf); padding: 8px 20px; border-bottom: 1px solid var(--bord); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; padding: 10px 20px; background: var(--bg); }
        .card { background: var(--surf); border: 1px solid var(--bord); padding: 10px; border-radius: 4px; text-align: center; border-bottom: 3px solid transparent; cursor: pointer; transition: 0.2s; }
        .card.active-f { border-bottom-color: var(--prim); background: rgba(0, 120, 212, 0.1); }
        .card h3 { margin: 0; font-size: 18px; pointer-events: none; }
        .card p { margin: 2px 0 0; font-size: 9px; font-weight: bold; color: var(--mut); text-transform: uppercase; pointer-events: none; }
        .controls-panel { background: var(--surf); padding: 12px 20px; border-bottom: 1px solid var(--bord); }
        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; align-items: end; }
        .c-item { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 9px; font-weight: bold; color: var(--mut); text-transform: uppercase; }
        input, select { background: var(--bg); border: 1px solid var(--bord); color: var(--txt); padding: 6px; border-radius: 2px; outline: none; font-size: 12px; }
        .btn-row { display: flex; gap: 8px; padding: 10px 20px; align-items: center; background: var(--bg); }
        button { height: 32px; padding: 0 15px; cursor: pointer; border: none; border-radius: 2px; font-weight: 600; font-size: 11px; }
        .btn-p { background: var(--prim); color: white; }
        .btn-s { background: #107c41; color: white; }
        .btn-d { background: #a4262c; color: white; }
        #search-box { flex-grow: 1; border: 1px solid var(--prim); background: var(--bg); color: var(--txt); padding: 0 10px; height: 30px; outline: none; }
        .table-area { flex-grow: 1; width: 100%; background: #000; overflow: hidden; position: relative; }
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; border: 2px solid #050505; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #overlay.show { display: flex; }
        .spinner { border: 4px solid #222; border-top: 4px solid var(--prim); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .wrap-cell { white-space: pre-wrap !important; font-family: 'Consolas', monospace; font-size: 11px; }
    </style>
</head>
<body>

<div id="overlay">
    <div class="spinner"></div>
    <h2 id="p-count" style="color:var(--prim); margin-top:20px;">0 Records</h2>
    <p id="p-log" style="color:var(--mut); font-size:11px; margin-top:10px; font-family:monospace;"></p>
    <button class="btn-d" style="margin-top:20px;" onclick="isFetching = false">STOP & RENDER</button>
</div>

<div class="main-wrapper">
    <div class="header-bar">
        <h2 style="margin:0; font-size:16px;">Dataverse Auditor Pro <span style="font-size:10px; opacity:0.6;">v1.22 [Production]</span></h2>
        <div id="status" style="font-size: 11px; color: var(--mut);">Ready</div>
    </div>

    <div id="loginSection" style="flex-grow:1; display:flex; align-items:center; justify-content:center;">
        <button class="btn-p" style="height:50px; width:320px; font-size:14px;" onclick="signIn()">AUTHENTICATE & LAUNCH</button>
    </div>

    <div id="appSection" class="hidden">
        <div class="dashboard">
            <div class="card active-f" id="f-all" onclick="setDashFilter('all')"><h3 id="st-total">0</h3><p>Pulled</p></div>
            <div class="card" id="f-server" style="cursor:default;"><h3 id="st-server">?</h3><p>Server Match</p></div>
            <div class="card" id="f-upd" onclick="setDashFilter(2)"><h3 id="st-upd">0</h3><p>Updates</p></div>
            <div class="card" id="f-rem" onclick="setDashFilter('rem')"><h3 id="st-rem">0</h3><p>Clearances</p></div>
        </div>

        <div class="controls-panel">
            <div class="controls-grid">
                <div class="c-item"><label>Theme</label>
                    <select id="theme-selector" onchange="changeTheme(this.value)">
                        <option value="midnight">Midnight</option>
                        <option value="light">Azure</option>
                    </select>
                </div>
                <div class="c-item"><label>Date Start</label><input type="date" id="dStart"></div>
                <div class="c-item"><label>Date End</label><input type="date" id="dEnd"></div>
                <div class="c-item"><label>Entity (Logical)</label><input type="text" id="eFilter" placeholder="cadence" onkeydown="if(event.key==='Enter') runSearch()"></div>
                <div class="c-item"><label>User GUID</label><input type="text" id="uFilter" placeholder="00000000..."></div>
                <div class="c-item"><label>Fetch Limit</label><input type="number" id="fLimit" value="80000"></div>
                <div class="c-item">
                    <label>Actions</label>
                    <div style="display:flex; gap:8px;"><label style="font-size:10px;"><input type="checkbox" id="chkU" checked> Upd</label><label style="font-size:10px;"><input type="checkbox" id="chkD" checked> Del</label></div>
                </div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-p" onclick="runSearch()">EXECUTE PULL</button>
            <button class="btn-s" onclick="exportExcel()">EXPORT STYLED XLSX</button>
            <input type="text" id="search-box" placeholder="Global Filter...">
            <button style="background:#444; color:white;" onclick="signOut()">Sign Out</button>
        </div>

        <div class="table-area"><div id="audit-table"></div></div>
    </div>
</div>

<script>
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: window.location.href } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const orgUrl = "https://org23279050.crm.dynamics.com";
    const actMap = { 1: "Create", 2: "Update", 3: "Delete" };
    
    let allData = [], isFetching = false, table, serverTotal = 0, dynamicColumnsSet = new Set();

    const humanize = (s) => (typeof s === "string") ? s.replace(/cr714_/g, "").replace(/_/g, " ").replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()).trim() : s;

    window.onload = async () => {
        const resp = await msalInstance.handleRedirectPromise();
        if (resp) msalInstance.setActiveAccount(resp.account);
        if (msalInstance.getActiveAccount()) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            initTable();
            changeTheme(localStorage.getItem('audit_theme') || 'midnight');
        }
    };

    function signIn() { msalInstance.loginRedirect({ scopes: [`${orgUrl}/user_impersonation`] }); }
    function signOut() { msalInstance.logoutRedirect(); }

    function changeTheme(theme) {
        localStorage.setItem('audit_theme', theme);
        document.getElementById('theme-selector').value = theme;
        const link = document.getElementById('tabulator-theme');
        if (theme === 'light') { document.body.classList.add('light-theme'); link.href = "https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_bootstrap5.min.css"; }
        else { document.body.classList.remove('light-theme'); link.href = "https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css"; }
    }

    function initTable() {
        table = new Tabulator("#audit-table", {
            height: "100%", layout: "fitDataFill", renderVertical: "virtual",
            columns: [
                {title: "Timestamp", field: "createdon", width: 155, frozen: true, formatter: c => new Date(c.getValue()).toLocaleString()},
                {title: "Event - Record", field: "cLab", width: 220, frozen: true, headerFilter: "input"},
                {title: "User", field: "uName", width: 140, headerFilter: "input"},
                {title: "Entity", field: "eClean", width: 110, headerFilter: "input"}
            ]
        });
        document.getElementById("search-box").addEventListener("keyup", (e) => {
            table.setFilter((data, val) => JSON.stringify(data).toLowerCase().includes(val.toLowerCase()), e.target.value);
        });
    }

    async function runSearch() {
        allData = []; isFetching = true; serverTotal = 0;
        dynamicColumnsSet.clear();
        initTable(); 
        document.getElementById('overlay').classList.add('show');
        await fetchLoop(buildQuery(), parseInt(document.getElementById('fLimit').value) || 80000);
    }

    async function fetchLoop(url, limit) {
        if (!isFetching || !url || allData.length >= limit) { finish(); return; }
        try {
            const token = await getToken();
            const resp = await fetch(url, { headers: { "Authorization": `Bearer ${token}`, "Accept": "application/json", "Prefer": 'odata.include-annotations="*", odata.maxpagesize=5000' } });
            if (resp.status === 429) {
                const wait = (resp.headers.get("Retry-After") || 10) * 1000;
                await new Promise(r => setTimeout(r, wait));
                return fetchLoop(url, limit);
            }
            const res = await resp.json();
            if (res["@odata.count"]) {
                serverTotal = res["@odata.count"];
                document.getElementById('st-server').innerText = serverTotal.toLocaleString();
            }
            const batch = res.value.map(item => {
                const row = { ...item, uName: item["_userid_value@OData.Community.Display.V1.FormattedValue"] || "System", eClean: humanize(item.objecttypecode), cLab: `${actMap[item.action] || item.action} - ${humanize(item["_objectid_value@OData.Community.Display.V1.FormattedValue"] || item._objectid_value)}`, isRem: false };
                if (item.changedata) {
                    try {
                        const d = JSON.parse(item.changedata);
                        if (d.changedAttributes) {
                            d.changedAttributes.forEach(attr => {
                                const name = attr.logicalName;
                                if (name.startsWith("cr714_")) {
                                    dynamicColumnsSet.add(name);
                                    // Use FormattedValue for Old/New if available (Choice labels vs Integers)
                                    row[`${name}_old`] = attr.oldValueFormatted || attr.oldValue || '∅';
                                    row[`${name}_new`] = attr.newValueFormatted || attr.newValue || '∅';
                                    if (attr.oldValue && !attr.newValue) row.isRem = true;
                                }
                            });
                        }
                    } catch (e) {}
                }
                return row;
            });
            updateDynamicColumns();
            allData = [...allData, ...batch];
            document.getElementById('p-count').innerText = `${allData.length.toLocaleString()} Pulled`;
            updateDash();
            table.setData(allData);
            if (res["@odata.nextLink"] && allData.length < limit) await fetchLoop(res["@odata.nextLink"], limit);
            else finish();
        } catch (e) { console.error(e); finish(); }
    }

    function updateDynamicColumns() {
        const currentCols = table.getColumnDefinitions();
        let needsUpdate = false;
        dynamicColumnsSet.forEach(field => {
            const oldKey = `${field}_old`;
            if (!currentCols.find(c => c.field === oldKey)) {
                needsUpdate = true;
                const label = humanize(field);
                currentCols.push({ title: `${label} (Old)`, field: oldKey, width: 180, cssClass: "wrap-cell", headerFilter: "input" });
                currentCols.push({ title: `${label} (New)`, field: `${field}_new`, width: 180, cssClass: "wrap-cell", headerFilter: "input", color: "var(--ok)" });
            }
        });
        if (needsUpdate) table.setColumns(currentCols);
    }

    function buildQuery() {
        const s = document.getElementById('dStart').value, e = document.getElementById('dEnd').value, ent = document.getElementById('eFilter').value, user = document.getElementById('uFilter').value;
        let url = `${orgUrl}/api/data/v9.2/audits?$select=createdon,action,objecttypecode,_objectid_value,_userid_value,changedata&$orderby=createdon desc&$count=true`;
        let f = [];
        if (s) f.push(`createdon ge ${s}T00:00:00Z`);
        if (e) f.push(`createdon le ${e}T23:59:59Z`);
        if (ent) f.push(`objecttypecode eq '${ent.toLowerCase().trim()}'`);
        if (user) f.push(`_userid_value eq ${user.trim()}`);
        let acts = [];
        if (document.getElementById('chkU').checked) acts.push(2);
        if (document.getElementById('chkD').checked) acts.push(3);
        if (acts.length > 0) f.push(`(${acts.map(a => `action eq ${a}`).join(' or ')})`);
        return f.length > 0 ? `${url}&$filter=${f.join(' and ')}` : url;
    }

    function finish() { isFetching = false; document.getElementById('overlay').classList.remove('show'); document.getElementById('status').innerText = "Audit Stream Finished"; }
    function updateDash() {
        document.getElementById('st-total').innerText = allData.length.toLocaleString();
        document.getElementById('st-upd').innerText = allData.filter(r => r.action === 2).length.toLocaleString();
        document.getElementById('st-rem').innerText = allData.filter(r => r.isRem).length.toLocaleString();
    }
    function setDashFilter(type) {
        table.clearFilter();
        if (type === 'all') return;
        if (type === 'rem') table.setFilter("isRem", "=", true);
        else table.setFilter("action", "=", type);
    }
    async function getToken() {
        const req = { scopes: [`${orgUrl}/user_impersonation`], account: msalInstance.getActiveAccount() };
        return (await msalInstance.acquireTokenSilent(req).catch(() => msalInstance.acquireTokenPopup(req))).accessToken;
    }
    function exportExcel() {
        const visibleCols = table.getColumns().filter(c => c.isVisible());
        const data = table.getData("active").map(r => {
            let row = {};
            visibleCols.forEach(c => {
                const f = c.getField(), title = c.getDefinition().title;
                if (f === "createdon") row["Timestamp"] = new Date(r[f]).toLocaleString();
                else row[title] = r[f] || "";
            });
            return row;
        });
        const ws = XLSX.utils.json_to_sheet(data);
        const range = XLSX.utils.decode_range(ws['!ref']);
        ws['!autofilter'] = { ref: ws['!ref'] }; // --- ADD EXCEL AUTO-FILTER ---
        for (let C = range.s.c; C <= range.e.c; ++C) {
            const addr = XLSX.utils.encode_col(C) + "1";
            if (ws[addr]) ws[addr].s = { fill: { fgColor: { rgb: "0078D4" } }, font: { color: { rgb: "FFFFFF" }, bold: true }, alignment: { horizontal: "center" } };
        }
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Audits");
        XLSX.writeFile(wb, `Audit_Pro_Final_v1.22.xlsx`);
    }
</script>
</body>
</html>
