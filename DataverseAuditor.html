<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataverse Auditor Pro v1.13</title>
    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <style>
        :root {
            --bg: #0a0a0a; --surf: #161616; --prim: #0078d4; --txt: #fafafa;
            --mut: #888; --bord: #333; --err: #f85149; --ok: #2ea043;
        }
        
        body, html { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            background: var(--bg); color: var(--txt);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden; 
        }

        .wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

        /* Dashboard & Header */
        .header { background: var(--surf); padding: 8px 20px; border-bottom: 1px solid var(--bord); display: flex; justify-content: space-between; align-items: center; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; padding: 10px 20px; }
        .card { 
            background: var(--surf); border: 1px solid var(--bord); padding: 10px; border-radius: 4px; 
            text-align: center; cursor: pointer; border-bottom: 3px solid transparent;
        }
        .card:hover { background: #222; }
        .card.active-filter { border-bottom-color: var(--prim); background: #1a1a1a; }
        .card h3 { margin: 0; font-size: 20px; }
        .card p { margin: 2px 0 0; font-size: 9px; font-weight: bold; color: var(--mut); text-transform: uppercase; }

        /* Controls */
        .controls { background: var(--surf); padding: 12px 20px; border-bottom: 1px solid var(--bord); display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; align-items: end; }
        .c-item { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; font-weight: bold; color: var(--mut); text-transform: uppercase; }
        input { background: #111; border: 1px solid var(--bord); color: white; padding: 6px; border-radius: 2px; }

        .toolbar { display: flex; gap: 10px; padding: 10px 20px; align-items: center; background: var(--bg); }
        button { height: 32px; padding: 0 15px; cursor: pointer; border: none; border-radius: 2px; font-weight: 600; font-size: 11px; transition: 0.1s; }
        .btn-p { background: var(--prim); color: white; }
        .btn-s { background: var(--ok); color: white; }
        .btn-d { background: var(--err); color: white; }
        #g-search { flex-grow: 1; border: 1px solid var(--prim); background: #000; color: #fff; padding: 0 10px; height: 32px; outline: none; }

        /* Table & Scrollbars */
        .table-area { flex-grow: 1; width: 100%; background: #000; overflow: hidden; position: relative; }
        
        /* Force Scrollbars to be visible and themed */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border: 3px solid #111; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--prim); }

        .tabulator { background: #000 !important; border: none !important; }
        .tabulator-header { background: #1a1a1a !important; color: #fff !important; }
        
        /* Layout Sync for Split Columns */
        .sync-box { display: flex; border-bottom: 1px solid #222; width: 100%; align-items: stretch; }
        .sync-label { flex: 0 0 110px; font-weight: bold; color: var(--mut); font-size: 10px; padding: 4px; border-right: 1px solid #333; overflow: hidden; }
        .sync-val { flex: 1; padding: 4px; white-space: pre-wrap; font-family: 'Consolas', monospace; font-size: 11px; word-break: break-word; }

        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #overlay.show { display: flex; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="overlay">
    <div style="border: 4px solid #333; border-top: 4px solid var(--prim); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite;"></div>
    <h2 id="p-count" style="color:var(--prim); margin-top:20px;">0 Records</h2>
    <p id="p-log" style="color:var(--mut); font-size:12px; font-family:monospace;">Fetching Batch...</p>
    <button class="btn-d" onclick="cancelFetch()">STOP & RENDER</button>
</div>

<div class="wrapper">
    <div class="header">
        <h2 style="margin:0; font-size:16px;">Dataverse Auditor Pro <span style="opacity:0.5; font-size:10px;">v1.13</span></h2>
        <div id="status" style="font-size: 11px; color: var(--mut);">Ready</div>
    </div>

    <div id="loginSection" style="flex-grow:1; display:flex; align-items:center; justify-content:center;">
        <button class="btn-p" style="height:50px; width:300px; font-size:14px;" onclick="signIn()">CONNECT TO DATAVERSE</button>
    </div>

    <div id="appSection" class="hidden">
        <div class="dashboard">
            <div class="card active-filter" id="card-all" onclick="setQuickFilter('all')"><h3 id="st-total">0</h3><p>Total Pulled</p></div>
            <div class="card" id="card-upd" onclick="setQuickFilter(2)"><h3 id="st-upd">0</h3><p>Updates</p></div>
            <div class="card" id="card-del" onclick="setQuickFilter(3)"><h3 id="st-del">0</h3><p>Deletes</p></div>
            <div class="card" id="card-rem" onclick="setQuickFilter('rem')"><h3 id="st-rem">0</h3><p>Clearances</p></div>
        </div>

        <div class="controls">
            <div class="c-item"><label>Start Date</label><input type="date" id="dStart"></div>
            <div class="c-item"><label>End Date</label><input type="date" id="dEnd"></div>
            <div class="c-item"><label>Entity (Exact)</label><input type="text" id="eFilter" placeholder="cadence"></div>
            <div class="c-item"><label>Limit</label><input type="number" id="fLimit" value="80000"></div>
            <div class="c-item"><button class="secondary-btn" style="background:#333; color:#fff;" onclick="table.toggleColumnPicker()">Columns</button></div>
        </div>

        <div class="toolbar">
            <button class="btn-p" onclick="runSearch()">EXECUTE PULL</button>
            <button class="btn-s" onclick="exportExcel()">EXPORT CLEAN XLSX</button>
            <input type="text" id="g-search" placeholder="Excel Filter (Search content, records, or notes)...">
        </div>

        <div class="table-area">
            <div id="audit-table"></div>
        </div>
    </div>
</div>

<script>
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: window.location.href }, cache: { cacheLocation: "localStorage" } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const orgUrl = "https://org23279050.crm.dynamics.com";
    const actMap = { 1: "Create", 2: "Update", 3: "Delete" };
    
    let allData = [], isFetching = false, table;

    const clean = (s) => (typeof s === "string") ? s.replace(/cr714_/g, "").replace(/_/g, " ").replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()).trim() : s;

    window.onload = async () => {
        const resp = await msalInstance.handleRedirectPromise();
        if (resp) msalInstance.setActiveAccount(resp.account);
        if (msalInstance.getActiveAccount()) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            initTable();
        }
    };

    function signIn() { msalInstance.loginRedirect({ scopes: [`${orgUrl}/user_impersonation`] }); }

    function initTable() {
        table = new Tabulator("#audit-table", {
            height: "100%", 
            layout: "fitColumns", 
            renderVertical: "virtual", // VIRTUAL DOM: Renders rows as needed
            renderVerticalBuffer: 100, // Buffer rows for smooth scrolling
            movableColumns: true, 
            resizableColumnFit: true, 
            columns: [
                {title: "Timestamp", field: "createdon", width: 160, formatter: c => new Date(c.getValue()).toLocaleString()},
                {title: "Event - Record", field: "cLab", width: 220, headerFilter: "input"},
                {title: "User", field: "uName", width: 150, headerFilter: "input"},
                {title: "Entity", field: "eClean", width: 120, headerFilter: "input"},
                {title: "Field & Old Value", field: "oldH", widthGrow: 2, formatter: "html", headerFilter: "input", vertAlign: "top"},
                {title: "New Value", field: "newH", widthGrow: 2, formatter: "html", headerFilter: "input", vertAlign: "top"},
                {title: "Prev Note", field: "onH", widthGrow: 2, formatter: "html", headerFilter: "input", vertAlign: "top"},
                {title: "New Note", field: "nnH", widthGrow: 2, formatter: "html", headerFilter: "input", vertAlign: "top"}
            ]
        });

        document.getElementById("g-search").addEventListener("keyup", (e) => {
            table.setFilter((data, val) => JSON.stringify(data).toLowerCase().includes(val.toLowerCase()), e.target.value);
        });
    }

    async function runSearch() {
        allData = []; isFetching = true;
        document.getElementById('overlay').classList.add('show');
        const limit = parseInt(document.getElementById('fLimit').value) || 80000;
        await fetchLoop(buildQuery(), limit);
    }

    async function fetchLoop(url, limit) {
        if (!isFetching || !url || allData.length >= limit) { finish(); return; }
        try {
            const token = await getToken();
            const resp = await fetch(url, { headers: { "Authorization": `Bearer ${token}`, "Accept": "application/json", "Prefer": 'odata.include-annotations="*"' } });
            const res = await resp.json();
            
            const batch = res.value.map(item => {
                const changes = processSplit(item.changedata);
                return {
                    ...item,
                    uName: item["_userid_value@OData.Community.Display.V1.FormattedValue"] || "System",
                    eClean: clean(item.objecttypecode),
                    cLab: `${actMap[item.action] || item.action} - ${clean(item["_objectid_value@OData.Community.Display.V1.FormattedValue"] || item._objectid_value)}`,
                    ...changes
                };
            });

            allData = [...allData, ...batch];
            document.getElementById('p-count').innerText = allData.length.toLocaleString();
            updateDash();
            table.setData(allData);

            if (res["@odata.nextLink"] && allData.length < limit) await fetchLoop(res["@odata.nextLink"], limit);
            else finish();
        } catch (e) { finish(); }
    }

    function buildQuery() {
        const s = document.getElementById('dStart').value, e = document.getElementById('dEnd').value, ent = document.getElementById('eFilter').value;
        let url = `${orgUrl}/api/data/v9.2/audits?$select=createdon,action,objecttypecode,_objectid_value,_userid_value,changedata&$orderby=createdon desc&$top=5000`;
        let f = [];
        if (s) f.push(`createdon ge ${s}T00:00:00Z`);
        if (e) f.push(`createdon le ${e}T23:59:59Z`);
        if (ent) f.push(`objecttypecode eq '${ent.toLowerCase().trim()}'`);
        return (f.length > 0) ? `${url}&$filter=${f.join(' and ')}` : url;
    }

    function processSplit(json) {
        let r = { oldH: "", newH: "", oldR: "", newR: "", onH: "", nnH: "", onR: "", nnR: "", isRem: false };
        if (!json) return r;
        try {
            const d = JSON.parse(json);
            if (!d.changedAttributes) return r;
            let gO = [], gN = [], nO = [], nN = [];
            d.changedAttributes.forEach(a => {
                const name = a.logicalName, isN = name.startsWith("cr714_") && name.toLowerCase().includes("note");
                const f = clean(name), o = a.oldValue || '∅', n = a.newValue || '∅';
                if (a.oldValue && !a.newValue) r.isRem = true;

                const box = `<div class="sync-box"><div class="sync-label">${f}</div><div class="sync-val"`;
                const lineO = `${box} style="color:var(--err)">${o}</div></div>`;
                const lineN = `${box} style="color:var(--ok)">${n}</div></div>`;

                if (isN) { nO.push(lineO); nN.push(lineN); r.onR += `${f}: ${o}\n`; r.nnR += `${n}\n`; }
                else { gO.push(lineO); gN.push(lineN); r.oldR += `${f}: ${o}\n`; r.newR += `${n}\n`; }
            });
            r.oldH = gO.join(''); r.newH = gN.join(''); r.onH = nO.join(''); r.nnH = nN.join('');
        } catch (e) { r.oldH = clean(json); }
        return r;
    }

    function setQuickFilter(type) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active-filter'));
        table.clearFilter();
        if (type === 'all') { document.getElementById('card-all').classList.add('active-filter'); return; }
        if (type === 'rem') { 
            document.getElementById('card-rem').classList.add('active-filter');
            table.setFilter("isRem", "=", true);
        } else {
            const id = type === 2 ? 'card-upd' : 'card-del';
            document.getElementById(id).classList.add('active-filter');
            table.setFilter("action", "=", type);
        }
    }

    function finish() { isFetching = false; document.getElementById('overlay').classList.remove('show'); }
    function cancelFetch() { isFetching = false; }

    function updateDash() {
        document.getElementById('st-total').innerText = allData.length.toLocaleString();
        document.getElementById('st-upd').innerText = allData.filter(r => r.action === 2).length.toLocaleString();
        document.getElementById('st-del').innerText = allData.filter(r => r.action === 3).length.toLocaleString();
        document.getElementById('st-rem').innerText = allData.filter(r => r.isRem).length.toLocaleString();
    }

    async function getToken() {
        const req = { scopes: [`${orgUrl}/user_impersonation`], account: msalInstance.getActiveAccount() };
        return (await msalInstance.acquireTokenSilent(req).catch(() => msalInstance.acquireTokenPopup(req))).accessToken;
    }

    function exportExcel() {
        const cols = table.getColumns().filter(c => c.isVisible());
        const data = table.getData("active").map(r => {
            let row = {};
            cols.forEach(c => {
                const f = c.getField();
                if (f === "createdon") row["Timestamp"] = new Date(r[f]).toLocaleString();
                else if (f === "oldH") row["Field/Old"] = r.oldR;
                else if (f === "newH") row["New Value"] = r.newR;
                else if (f === "onH") row["Prev Note"] = r.onR;
                else if (f === "nnH") row["New Note"] = r.nnR;
                else if (f !== "link") row[c.getDefinition().title] = r[f];
            });
            return row;
        });
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Audits");
        XLSX.writeFile(wb, `Dataverse_Audit_v1.13.xlsx`);
    }

    const style = document.createElement('style');
    style.innerHTML = `@keyframes spin { to { transform: rotate(360deg); } }`;
    document.head.appendChild(style);
</script>
</body>
</html>
