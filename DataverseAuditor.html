<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataverse Auditor Pro v1.12</title>
    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <style>
        :root {
            --bg: #050505; --surf: #121212; --prim: #0078d4; --txt: #ffffff;
            --mut: #a0a0a0; --bord: #333333; --err: #f85149; --ok: #2ea043;
        }
        
        body, html { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            background: var(--bg); color: var(--txt);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden; 
        }

        .main-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

        /* Header & Dashboard */
        .header-bar { background: var(--surf); padding: 8px 20px; border-bottom: 1px solid var(--bord); display: flex; justify-content: space-between; align-items: center; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 10px 20px; }
        
        .card { 
            background: var(--surf); border: 1px solid var(--bord); padding: 10px; border-radius: 4px; 
            text-align: center; cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent;
        }
        .card:hover { background: #252525; border-color: var(--prim); }
        .card.active-filter { border-bottom-color: var(--prim); background: #1a1a1a; }
        .card h3 { margin: 0; font-size: 22px; pointer-events: none; }
        .card p { margin: 2px 0 0; font-size: 9px; font-weight: bold; color: var(--mut); pointer-events: none; }

        /* Controls */
        .controls-panel { background: var(--surf); padding: 12px 20px; border-bottom: 1px solid var(--bord); }
        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; align-items: end; }
        .c-item { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; font-weight: bold; color: var(--mut); text-transform: uppercase; }
        input { background: #1a1a1a; border: 1px solid var(--bord); color: white; padding: 6px; border-radius: 2px; }

        .action-row { display: flex; gap: 10px; padding: 10px 20px; align-items: center; }
        button { height: 34px; padding: 0 15px; cursor: pointer; border: none; border-radius: 2px; font-weight: 600; font-size: 12px; }
        .btn-p { background: var(--prim); color: white; }
        .btn-s { background: var(--ok); color: white; }
        .btn-d { background: var(--err); color: white; }
        
        #search-box { flex-grow: 1; min-width: 200px; border: 1px solid var(--prim); background: #000; color: #fff; padding: 0 10px; height: 32px; }

        /* Table Area - Scrollable */
        .table-area { flex-grow: 1; width: 100%; background: #000; overflow: hidden; position: relative; }
        #audit-table { width: 100%; height: 100%; }

        /* Formatting */
        .sync-box { display: flex; border-bottom: 1px solid #222; width: 100%; align-items: stretch; }
        .sync-label { flex: 0 0 110px; font-weight: bold; color: var(--mut); font-size: 10px; padding: 4px; border-right: 1px solid #333; }
        .sync-val { flex: 1; padding: 4px; white-space: pre-wrap; font-family: 'Consolas', monospace; font-size: 11px; word-break: break-all; }

        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #overlay.show { display: flex; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="overlay">
    <div style="border: 4px solid #333; border-top: 4px solid var(--prim); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
    <h2 id="p-count" style="color:var(--prim); margin-top:20px;">0 Records</h2>
    <p id="p-log" style="color:var(--mut); font-size:12px; font-family:monospace;"></p>
    <button class="btn-d" onclick="cancelFetch()">CANCEL & SHOW</button>
</div>

<div class="main-container">
    <div class="header-bar">
        <h2 style="margin:0; font-size:16px;">Dataverse Auditor Pro <span style="font-size:10px; opacity:0.6;">v1.12</span></h2>
        <div id="status" style="font-size: 11px; color: var(--mut);">Ready</div>
    </div>

    <div id="loginSection" style="flex-grow:1; display:flex; align-items:center; justify-content:center;">
        <button class="btn-p" style="height:50px; width:300px; font-size:14px;" onclick="signIn()">AUTHENTICATE DATAVERSE</button>
    </div>

    <div id="appSection" class="hidden">
        <div class="dashboard">
            <div class="card" onclick="filterByAction('all', this)"><h3 id="st-total">0</h3><p>Total Pulled</p></div>
            <div class="card" onclick="filterByAction(2, this)"><h3 id="st-upd">0</h3><p>Updates</p></div>
            <div class="card" onclick="filterByAction(3, this)"><h3 id="st-del">0</h3><p>Deletes</p></div>
            <div class="card" onclick="filterByAction('removal', this)"><h3 id="st-rem">0</h3><p>Clearances</p></div>
        </div>

        <div class="controls-panel">
            <div class="controls-grid">
                <div class="c-item"><label>Start Date</label><input type="date" id="dStart"></div>
                <div class="c-item"><label>End Date</label><input type="date" id="dEnd"></div>
                <div class="c-item"><label>Entity (Exact)</label><input type="text" id="eFilter" placeholder="cadence"></div>
                <div class="c-item"><label>Target Limit</label><input type="number" id="fLimit" value="80000"></div>
                <div class="c-item"><label>Column Manager</label>
                    <button class="secondary-btn" style="background:#333; color:white;" onclick="table.toggleColumnPicker()">Show/Hide Columns</button>
                </div>
            </div>
        </div>

        <div class="action-row">
            <button class="btn-p" onclick="runSearch()">EXECUTE AUDIT PULL</button>
            <button class="btn-s" onclick="exportExcel()">EXPORT CLEAN XLSX</button>
            <input type="text" id="search-box" placeholder="Global Filter (Type to search across all data)...">
        </div>

        <div class="table-area">
            <div id="audit-table"></div>
        </div>
    </div>
</div>

<script>
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: window.location.href }, cache: { cacheLocation: "localStorage" } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const orgUrl = "https://org23279050.crm.dynamics.com";
    const actMap = { 1: "Create", 2: "Update", 3: "Delete" };
    
    let allData = [], isFetching = false, table;

    const clean = (s) => (typeof s === "string") ? s.replace(/cr714_/g, "").replace(/_/g, " ").replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()).trim() : s;

    window.onload = async () => {
        const resp = await msalInstance.handleRedirectPromise();
        if (resp) msalInstance.setActiveAccount(resp.account);
        if (msalInstance.getActiveAccount()) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            initTable();
        }
    };

    function signIn() { msalInstance.loginRedirect({ scopes: [`${orgUrl}/user_impersonation`] }); }

    function initTable() {
        table = new Tabulator("#audit-table", {
            height: "100%", layout: "fitColumns", // Responsive fit
            movableColumns: true, resizableColumnFit: true, // Allow resizing
            placeholder: "No data available",
            // Column Visibility Menu
            columnHeaderVertAlign:"bottom",
            columns: [
                {title: "Timestamp", field: "createdon", width: 155, sorter: "datetime", formatter: c => new Date(c.getValue()).toLocaleString()},
                {title: "Event - Record", field: "cLab", width: 220, headerFilter: "input"},
                {title: "User", field: "uName", width: 140, headerFilter: "input"},
                {title: "Entity", field: "eClean", width: 110, headerFilter: "input"},
                // Data Columns
                {title: "Field & Old Value", field: "oldH", widthGrow: 2, formatter: "html", headerFilter: "input", vertAlign: "top"},
                {title: "New Value", field: "newH", widthGrow: 2, formatter: "html", headerFilter: "input", vertAlign: "top"},
                {title: "Prev Note", field: "onH", widthGrow: 2, formatter: "html", headerFilter: "input", vertAlign: "top"},
                {title: "New Note", field: "nnH", widthGrow: 2, formatter: "html", headerFilter: "input", vertAlign: "top"},
                {title: "D365", field: "link", width: 50, hozAlign: "center", formatter: "html", headerSort: false, visible: false}
            ]
        });

        // Global Search
        document.getElementById("search-box").addEventListener("keyup", (e) => {
            table.setFilter((data, val) => JSON.stringify(data).toLowerCase().includes(val.toLowerCase()), e.target.value);
        });
    }

    async function runSearch() {
        allData = []; isFetching = true;
        document.getElementById('overlay').classList.add('show');
        const limit = parseInt(document.getElementById('fLimit').value) || 80000;
        await fetchLoop(buildQuery(), limit);
    }

    async function fetchLoop(url, limit) {
        if (!isFetching || !url || allData.length >= limit) { finish(); return; }
        try {
            const token = await getToken();
            const resp = await fetch(url, { headers: { "Authorization": `Bearer ${token}`, "Accept": "application/json", "Prefer": 'odata.include-annotations="*"' } });
            const res = await resp.json();
            
            const batch = res.value.map(item => {
                const changes = processSplit(item.changedata);
                return {
                    ...item,
                    uName: item["_userid_value@OData.Community.Display.V1.FormattedValue"] || "System",
                    eClean: clean(item.objecttypecode),
                    cLab: `${actMap[item.action] || item.action} - ${clean(item["_objectid_value@OData.Community.Display.V1.FormattedValue"] || item._objectid_value)}`,
                    link: `<a href="${orgUrl}/main.aspx?etn=${item.objecttypecode}&pagetype=entityrecord&id=${item._objectid_value}" target="_blank" style="text-decoration:none;">🔗</a>`,
                    ...changes
                };
            });

            allData = [...allData, ...batch];
            document.getElementById('p-count').innerText = allData.length.toLocaleString();
            
            // Critical: Update dashboard counts DURING the fetch
            updateDash();
            table.setData(allData);

            if (res["@odata.nextLink"] && allData.length < limit) await fetchLoop(res["@odata.nextLink"], limit);
            else finish();
        } catch (e) { finish(); }
    }

    function buildQuery() {
        const s = document.getElementById('dStart').value, e = document.getElementById('dEnd').value, ent = document.getElementById('eFilter').value;
        let url = `${orgUrl}/api/data/v9.2/audits?$select=createdon,action,objecttypecode,_objectid_value,_userid_value,changedata&$orderby=createdon desc&$top=5000`;
        let f = [];
        if (s) f.push(`createdon ge ${s}T00:00:00Z`);
        if (e) f.push(`createdon le ${e}T23:59:59Z`);
        if (ent) f.push(`objecttypecode eq '${ent.toLowerCase().trim()}'`);
        return (f.length > 0) ? `${url}&$filter=${f.join(' and ')}` : url;
    }

    function processSplit(json) {
        let r = { oldH: "", newH: "", oldR: "", newR: "", onH: "", nnH: "", onR: "", nnR: "", hasRemoval: false };
        if (!json) return r;
        try {
            const d = JSON.parse(json);
            if (!d.changedAttributes) return r;
            let gO = [], gN = [], nO = [], nN = [];
            d.changedAttributes.forEach(a => {
                const name = a.logicalName, isN = name.startsWith("cr714_") && name.toLowerCase().includes("note");
                const f = clean(name), o = a.oldValue || '∅', n = a.newValue || '∅';
                if (a.oldValue && !a.newValue) r.hasRemoval = true;

                const hL = `<div class="sync-box"><div class="sync-label">${f}</div><div class="sync-val"`;
                const wO = `${hL} style="color:var(--err)">${o}</div></div>`;
                const wN = `${hL} style="color:var(--ok)">${n}</div></div>`;

                if (isN) { nO.push(wO); nN.push(wN); r.onR += `${f}: ${o}\n`; r.nnR += `${n}\n`; }
                else { gO.push(wO); gN.push(wN); r.oldR += `${f}: ${o}\n`; r.newR += `${n}\n`; }
            });
            r.oldH = gO.join(''); r.newH = gN.join(''); r.onH = nO.join(''); r.nnH = nN.join('');
        } catch (e) { r.oldH = clean(json); }
        return r;
    }

    // Interactive Dashboard Filters
    function filterByAction(type, el) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active-filter'));
        el.classList.add('active-filter');
        table.clearFilter();
        if (type === 'all') return;
        if (type === 'removal') table.setFilter("hasRemoval", "=", true);
        else table.setFilter("action", "=", type);
    }

    function finish() { isFetching = false; document.getElementById('overlay').classList.remove('show'); }
    function cancelFetch() { isFetching = false; }

    function updateDash() {
        const removals = allData.filter(r => r.hasRemoval).length;
        document.getElementById('st-total').innerText = allData.length.toLocaleString();
        document.getElementById('st-upd').innerText = allData.filter(r => r.action === 2).length.toLocaleString();
        document.getElementById('st-del').innerText = allData.filter(r => r.action === 3).length.toLocaleString();
        document.getElementById('st-rem').innerText = removals.toLocaleString();
    }

    async function getToken() {
        const req = { scopes: [`${orgUrl}/user_impersonation`], account: msalInstance.getActiveAccount() };
        return (await msalInstance.acquireTokenSilent(req).catch(() => msalInstance.acquireTokenPopup(req))).accessToken;
    }

    function exportExcel() {
        // Only export visible columns
        const visibleCols = table.getColumns().filter(c => c.isVisible());
        const set = table.getData("active").map(r => {
            let row = {};
            visibleCols.forEach(col => {
                const field = col.getField();
                if (field === "createdon") row["Timestamp"] = new Date(r[field]).toLocaleString();
                else if (field === "cLab") row["Event - Record"] = r[field];
                else if (field === "uName") row["User"] = r[field];
                else if (field === "eClean") row["Entity"] = r[field];
                else if (field === "oldH") row["Field & Old Value"] = r.oldR;
                else if (field === "newH") row["New Value"] = r.newR;
                else if (field === "onH") row["Prev Note"] = r.onR;
                else if (field === "nnH") row["New Note"] = r.nnR;
            });
            return row;
        });

        const ws = XLSX.utils.json_to_sheet(set);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Audits");
        
        // Final XLSX download
        XLSX.writeFile(wb, `Audit_Export_Clean_v1.12.xlsx`);
    }

    // CSS Spin Animation
    const style = document.createElement('style');
    style.innerHTML = `@keyframes spin { to { transform: rotate(360deg); } }`;
    document.head.appendChild(style);
</script>
</body>
</html>
