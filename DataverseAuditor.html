<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataverse Auditor Pro v1.5</title>
    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://unpkg.com/tabulator-tables@6.2.1/dist/css/tabulator_modern.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.2.1/dist/js/tabulator.min.js"></script>

    <style>
        :root { --primary: #0078d4; --success: #107c41; --danger: #a4262c; --bg: #f3f2f1; --border: #dee2e6; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; padding: 15px; background-color: var(--bg); color: #201f1e; margin: 0; }
        .container { max-width: 1900px; margin: auto; background: white; padding: 20px; border-radius: 2px; box-shadow: 0 0.3px 0.9px rgba(0,0,0,0.1), 0 1.6px 3.6px rgba(0,0,0,0.1); position: relative; }
        
        /* Dashboard Stats */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .card { background: #fff; border: 1px solid var(--border); padding: 12px; border-radius: 2px; text-align: center; border-top: 3px solid var(--primary); }
        .card h3 { margin: 0; font-size: 22px; color: #323130; }
        .card p { margin: 4px 0 0; font-size: 10px; font-weight: 700; color: #605e5c; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Controls */
        .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; background: #faf9f8; padding: 15px; border: 1px solid var(--border); margin-bottom: 15px; align-items: end; }
        .control-item { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: 700; color: #323130; }
        input { padding: 6px 10px; border: 1px solid #8a8886; border-radius: 2px; height: 32px; font-size: 13px; }

        .button-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
        button { padding: 0 16px; height: 34px; cursor: pointer; border: none; border-radius: 2px; font-weight: 600; font-size: 13px; }
        .primary-btn { background-color: var(--primary); color: white; }
        .success-btn { background-color: var(--success); color: white; }
        .stop-btn { background-color: var(--danger); color: white; }
        .secondary-btn { background-color: #edebe9; color: #323130; }
        
        #global-search { flex-grow: 1; min-width: 250px; padding: 7px; border: 1px solid var(--primary); outline: none; }

        /* Table Styling - Wrapped Columns */
        .tabulator { font-size: 12.5px !important; border: 1px solid var(--border) !important; }
        .tabulator-row { border-bottom: 1px solid #f3f2f1 !important; }
        
        .change-cell-wrap { 
            white-space: pre-wrap !important; 
            word-wrap: break-word !important; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 11px; 
            line-height: 1.5; 
            padding: 4px 0 !important;
        }

        .field-line { display: block; color: #555; font-weight: 600; border-bottom: 1px dashed #eee; padding: 2px 0; margin-bottom: 2px; }
        .old-val { color: var(--danger); background: #fff1f0; padding: 0 2px; }
        .new-val { color: var(--success); font-weight: bold; background: #f6ffed; padding: 0 2px; display: block; border-bottom: 1px dashed #eee; padding: 2px 0; margin-bottom: 2px; }

        /* Loading Overlay */
        #loadingOverlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.92); z-index: 9999; 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
        }
        #loadingOverlay.visible { display: flex; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <b id="loader-text" style="font-size: 16px;">Processing Audit Stream...</b>
    <div id="progress-text" style="margin-top:8px; font-weight: bold; color: var(--primary);">0 Records Collected</div>
    <button class="stop-btn" style="margin-top:15px;" onclick="cancelFetch()">STOP & RENDER</button>
</div>

<div class="container">
    <div class="header-bar">
        <h2 style="margin:0; font-size: 20px;">Dataverse Auditor Pro <span style="font-size: 11px; background: #eee; padding: 2px 6px; border-radius: 4px; color: #666;">v1.5</span></h2>
        <div id="status" style="font-size: 12px; font-weight: 600; color: var(--primary);">System Ready</div>
    </div>

    <div id="loginSection" style="text-align:center; padding:80px;">
        <button class="primary-btn" style="height:48px; font-size:15px;" onclick="signIn()">Authenticate Dynamics Connection</button>
    </div>

    <div id="appSection" class="hidden">
        <div class="dashboard">
            <div class="card"><h3 id="stat-total">0</h3><p>Total Records</p></div>
            <div class="card"><h3 id="stat-updates">0</h3><p>Updates</p></div>
            <div class="card"><h3 id="stat-deletes">0</h3><p>Deletes</p></div>
            <div class="card"><h3 id="stat-removals">0</h3><p>Clearances</p></div>
        </div>

        <div class="controls-grid">
            <div class="control-item"><label>Start Date</label><input type="date" id="startDate"></div>
            <div class="control-item"><label>End Date</label><input type="date" id="endDate"></div>
            <div class="control-item"><label>Entity Logic Name</label><input type="text" id="entityFilter" placeholder="e.g. cadence"></div>
            <div class="control-item"><label>Fetch Limit</label><input type="number" id="topLimit" value="80000"></div>
        </div>

        <div class="button-row">
            <button id="runBtn" class="primary-btn" onclick="startAudit()">Execute Search</button>
            <button class="success-btn" onclick="exportExcel()">Export Split XLSX</button>
            <input type="text" id="global-search" placeholder="Excel-style Search (Type to filter across all columns)...">
        </div>

        <div id="audit-table"></div>
    </div>
</div>

<script>
    const msalConfig = { 
        auth: { 
            clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", 
            authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", 
            redirectUri: window.location.href 
        }, 
        cache: { cacheLocation: "localStorage" } 
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const orgUrl = "https://org23279050.crm.dynamics.com";
    const actionMap = { 1: "Create", 2: "Update", 3: "Delete", 4: "Activate", 5: "Deactivate" };
    
    let allData = [];
    let isFetching = false;
    let nextLink = null;
    let table;

    const clean = (val) => typeof val === "string" ? val.replace(/cr714_/g, "") : val;

    window.onload = async () => {
        try {
            const resp = await msalInstance.handleRedirectPromise();
            if (resp) msalInstance.setActiveAccount(resp.account);
            checkAccount();
            initTable();
        } catch (e) { console.error("Redirect Error", e); }
    };

    function checkAccount() {
        const account = msalInstance.getActiveAccount() || msalInstance.getAllAccounts()[0];
        if (account) {
            msalInstance.setActiveAccount(account);
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
        }
    }

    async function signIn() { await msalInstance.loginRedirect({ scopes: [`${orgUrl}/user_impersonation`] }); }

    function initTable() {
        table = new Tabulator("#audit-table", {
            height: "650px",
            layout: "fitColumns",
            variableHeight: true, // Allow rows to wrap
            placeholder: "Configure filters and run search",
            columns: [
                {title: "Timestamp", field: "createdon", width: 160, formatter: (cell) => new Date(cell.getValue()).toLocaleString()},
                {title: "Event - Record", field: "combinedLabel", width: 220, headerFilter: "input"},
                {title: "User", field: "userName", width: 160, headerFilter: "input"},
                {title: "Entity", field: "entityClean", width: 130, headerFilter: "input"},
                // --- WRAPPED SPLIT COLUMNS ---
                {title: "Field & Old Value", field: "oldValHtml", vertAlign: "top", widthGrow: 2.5, formatter: "html", cssClass: "change-cell-wrap", headerFilter: "input"},
                {title: "New Value", field: "newValHtml", vertAlign: "top", widthGrow: 2, formatter: "html", cssClass: "change-cell-wrap", headerFilter: "input"},
                {title: "D365", field: "linkHtml", width: 60, hozAlign: "center", formatter: "html", headerSort: false}
            ]
        });

        document.getElementById("global-search").addEventListener("keyup", (e) => {
            table.setFilter((data, filterVal) => JSON.stringify(data).toLowerCase().includes(filterVal.toLowerCase()), e.target.value);
        });
    }

    async function startAudit() {
        if (isFetching) return;
        allData = [];
        isFetching = true;
        nextLink = null;
        document.getElementById('loadingOverlay').classList.add('visible');
        const limit = parseInt(document.getElementById('topLimit').value) || 80000;
        await fetchLoop(buildBaseQuery(), limit);
    }

    async function fetchLoop(url, limit) {
        if (!isFetching || !url || allData.length >= limit) { finishFetch(); return; }

        try {
            const token = await getToken();
            const response = await fetch(url, {
                headers: { "Authorization": `Bearer ${token}`, "Accept": "application/json", "Prefer": 'odata.include-annotations="*"' }
            });

            if (!response.ok) throw new Error("API Failure");

            const result = await response.json();
            const batch = result.value.map(item => {
                const actionLabel = actionMap[item.action] || item.action;
                const recordName = clean(item["_objectid_value@OData.Community.Display.V1.FormattedValue"] || item._objectid_value);
                const changes = splitChanges(item.changedata);
                
                return {
                    ...item,
                    userName: item["_userid_value@OData.Community.Display.V1.FormattedValue"] || "System",
                    entityClean: clean(item.objecttypecode),
                    combinedLabel: `${actionLabel} - ${recordName}`,
                    linkHtml: `<a href="${orgUrl}/main.aspx?etn=${item.objecttypecode}&pagetype=entityrecord&id=${item._objectid_value}" target="_blank" style="text-decoration:none;">🔗</a>`,
                    oldValHtml: changes.oldHtml,
                    newValHtml: changes.newHtml,
                    oldValRaw: changes.oldRaw,
                    newValRaw: changes.newRaw
                };
            });

            allData = [...allData, ...batch];
            document.getElementById('progress-text').innerText = `${allData.length.toLocaleString()} Records Collected...`;
            updateDashboard();
            table.setData(allData);

            if (result["@odata.nextLink"] && allData.length < limit) {
                await fetchLoop(result["@odata.nextLink"], limit);
            } else { finishFetch(); }
        } catch (e) { alert("Search Paused: " + e.message); finishFetch(); }
    }

    function buildBaseQuery() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const entity = document.getElementById('entityFilter').value;
        
        let url = `${orgUrl}/api/data/v9.2/audits?$select=createdon,action,objecttypecode,_objectid_value,_userid_value,changedata&$orderby=createdon desc&$top=5000`;
        let filters = [];
        if (start) filters.push(`createdon ge ${start}T00:00:00Z`);
        if (end) filters.push(`createdon le ${end}T23:59:59Z`);
        if (entity) filters.push(`objecttypecode eq '${entity.toLowerCase().trim()}'`);
        
        return filters.length > 0 ? `${url}&$filter=${filters.join(' and ')}` : url;
    }

    function splitChanges(json) {
        if (!json) return { oldHtml: "", newHtml: "", oldRaw: "", newRaw: "" };
        try {
            const d = JSON.parse(json);
            if (!d.changedAttributes) return { oldHtml: "", newHtml: "", oldRaw: "", newRaw: "" };

            let oh = [], nh = [], or = [], nr = [];
            d.changedAttributes.forEach(a => {
                const f = clean(a.logicalName);
                const o = a.oldValue || '∅';
                const n = a.newValue || '∅';
                
                // Horizontal alignment logic using distinct blocks per field change
                oh.push(`<span class="field-line">${f}: <span class="old-val">${o}</span></span>`);
                nh.push(`<span class="new-val">${n}</span>`);
                or.push(`${f}: ${o}`);
                nr.push(n);
            });

            return { 
                oldHtml: oh.join(''), newHtml: nh.join(''), 
                oldRaw: or.join('\n'), newRaw: nr.join('\n') 
            };
        } catch (e) { return { oldHtml: clean(json), newHtml: "N/A", oldRaw: clean(json), newRaw: "" }; }
    }

    function finishFetch() { isFetching = false; document.getElementById('loadingOverlay').classList.remove('visible'); }
    function cancelFetch() { isFetching = false; }

    function updateDashboard() {
        const removals = allData.filter(item => {
            if (item.action !== 2 || !item.changedata) return false;
            try {
                const m = JSON.parse(item.changedata);
                return m.changedAttributes && m.changedAttributes.some(a => a.oldValue && !a.newValue);
            } catch(e) { return false; }
        });
        document.getElementById('stat-total').innerText = allData.length.toLocaleString();
        document.getElementById('stat-updates').innerText = allData.filter(r => r.action === 2).length.toLocaleString();
        document.getElementById('stat-deletes').innerText = allData.filter(r => r.action === 3).length.toLocaleString();
        document.getElementById('stat-removals').innerText = removals.length.toLocaleString();
    }

    async function getToken() {
        const req = { scopes: [`${orgUrl}/user_impersonation`], account: msalInstance.getActiveAccount() };
        return (await msalInstance.acquireTokenSilent(req).catch(() => msalInstance.acquireTokenPopup(req))).accessToken;
    }

    function exportExcel() {
        const set = allData.map(r => ({
            "Timestamp": new Date(r.createdon).toLocaleString(),
            "Event": r.combinedLabel,
            "User": r.userName,
            "Entity": r.entityClean,
            "Field & Old Value": r.oldValRaw,
            "New Value": r.newValRaw
        }));
        const ws = XLSX.utils.json_to_sheet(set);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Audits");
        XLSX.writeFile(wb, `Audit_Export_v1.5.xlsx`);
    }
</script>
</body>
</html>
