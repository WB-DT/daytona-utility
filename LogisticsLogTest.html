function to12Hour(timeStr) {
  if (!timeStr) return "";
  let s = String(timeStr).trim();
  if (/AM|PM/i.test(s)) {
    return s.replace(/\s*(AM|PM)/i, " $1").toUpperCase();
  }
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (!match) return s;
  let h = parseInt(match[1], 10), m = match[2];
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function formatDuration(hStr) {
  if (!hStr) return "";
  let s = String(hStr).trim();
  let totalMinutes = 0;
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (match) {
    totalMinutes = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
  } else if (!isNaN(parseFloat(s))) {
    totalMinutes = Math.round(parseFloat(s) * 60);
  } else {
    return s;
  }
  const hrs = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;
  if (hrs > 0 && mins > 0) return `${hrs}h ${mins}m`;
  if (hrs > 0) return `${hrs} hr${hrs > 1 ? 's' : ''}`;
  return `${mins} mins`;
}

  }).join(', ');
}

function parseMakeUpSegments(value) {

  // spaces around their internal hyphen, e.g. 7:30 AM-8:00 AM.
  const entryRx = /(\d{1,2}\/\d{1,2}\/\d{4})\s*-\s*(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?)\s*-\s*(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?)\s*-\s*(\d+(?::\d{1,2})?|\d*\.\d+)/gi;

  while ((match = entryRx.exec(raw)) !== null) {
    const [mmRaw, ddRaw, yyyy] = match[1].split("/");
    const mm = mmRaw.padStart(2, "0"), dd = ddRaw.padStart(2, "0");
    const duration = match[4];
    let hours = 0;
    if (duration.includes(":")) {

      hours = (hh || 0) + ((min || 0) / 60);
    } else {
      hours = Number(duration) || 0;
    }
    segments.push({
      date: `${yyyy}-${mm}-${dd}`,
      displayDate: `${mm}/${dd}/${yyyy}`,
      start: match[2].trim(),
      end: match[3].trim(),
      duration,
      hours: Math.round(hours * 100) / 100

  async function cancelRecordRequest(rid) {

async function deleteRecordFromDataverse(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  if (target.dvId) {
    setSync("Deleting from Dataverse...");
    try {
      const token = await getDataverseToken();
      if (!token) throw new Error("Authentication missing");

      const res = await fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}(${target.dvId})`, {
        method: "DELETE",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/json",
          "OData-MaxVersion": "4.0",
          "OData-Version": "4.0"
        }
      });

      if (!res.ok && res.status !== 204 && res.status !== 404) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
    } catch (err) {
      console.error("Delete failed:", err);
      toast("Failed to delete from Dataverse: " + err.message);
      setSync("");
      return;
    }
  }

  const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;

    byType[type] = bucket;
  });
  return byType;
}
function calendarDot(type, summary) {
  const tObj = TYPES[type] || { color: "var(--muted)", abbr: type.slice(0,2).toUpperCase() };
  const count = summary?.count || 0;
  const hours = Math.round((summary?.hours || 0) * 100) / 100;
  const ptoTitle = type === "PTO" ? ` · ${hours}h` : "";
  return `<span class="dot" title="${esc(type)}: ${count} request${count===1?"":"s"}${ptoTitle}" style="background:${tObj.color}">${count>1?count:tObj.abbr}</span>`;
}

function renderCalendar(){
  const [f,t]=range();
  const recs=calendarRecords(filteredRecords()), byDate={};

  const totalEmps = filteredEmployees().length || 0; 
  const empIds = new Set(filteredEmployees().map(e => e.id));

    <button class="btn ghost sm" id="calPrev">&#8249;</button>

    let diffToMonday = dayOfWeek === 0 ? 1 : 1 - dayOfWeek;
    baseDate.setDate(baseDate.getDate() + diffToMonday);
    
    let cur = isoDate(baseDate);
    for(let i = 0; i < 5; i++) {
      days.push(cur);

    }

    const dows = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    const boardColsHtml = days.map(ds => {
      const dObj = parseISO(ds);
      const dowName = dows[dObj.getDay()];
      const isToday = ds === today();
      const allDayRecords = (byDate[ds] || []);

      // Separate LOA from standard records
      const standardDayRecs = allDayRecords
        .filter(r => r.type !== "Present" && r.type !== "LOA")
        .sort((a,b) => getRecordTimestamp(b) - getRecordTimestamp(a));
      
      const uniqueDayRecs=calendarRecords(standardDayRecs);

      // Deduplicate LOA so each employee appears at most once per day
      const seenLoaEmps = new Set();
      const loaRecs = allDayRecords
        .filter(r => r.type === "LOA" && !r.cancelled)
        .filter(r => {
          if (seenLoaEmps.has(r.empId)) return false;
          seenLoaEmps.add(r.empId);
          return true;
        })
        .sort((a,b) => (emp(a.empId)?.name || "").localeCompare(emp(b.empId)?.name || ""));

      const dayMus = muByDate[ds] || [];
      const absentEmpIds = new Set(
        allDayRecords
          .filter(r => !r.cancelled && !["Present", "Shift Trade", "Cancellation"].includes(r.type))
          .map(r => r.empId)
      );
      const presentCount = Math.max(0, totalEmps - absentEmpIds.size);

      // Make-Up cards (Top)
      const muCardsHtml = dayMus.map(m => {
        const e = emp(m.empId) || {name: m.empId};
        const timeFrame = m.scheduleSegments && m.scheduleSegments[0] 
          ? `${m.scheduleSegments[0].start} - ${m.scheduleSegments[0].end}` 
          : `${hoursToHHMM(m.hoursOwed)}h`;

        return `<div class="cal-card mu-card" onclick="makeupModal('${esc(m.mid)}')" title="Click to view Make-Up details">

            <span class="cal-card-name" style="color:var(--purple);">${esc(e.name)}</span>
            <span class="badge ${m.status==='Completed'?'ok':m.status==='Approved'?'':'warn'}" style="font-size:9.5px; padding:1px 5px;">${esc(m.status)}</span>

      const recCardsHtml = uniqueDayRecs.map(r => {
        const e = emp(r.empId) || {name: r.empId};
        const shiftDisplay = extractShiftHours(r);
        const topBadges = [
          r.waived ? `<span class="badge ok" style="font-size:9.5px; padding:1px 5px;">waived</span>` : null,
          r.cancelled ? `<span class="badge bad" style="font-size:9.5px; padding:1px 5px;">Cancelled</span>` : null

        const bottomTags = [
          r.fmla ? `<span class="badge" style="background:var(--indigo); color:#fff; font-size:9.5px; padding:1px 5px;">FMLA</span>` : null,

            <span class="cal-card-name">${esc(e.name)}</span>
            ${topBadges ? `<span style="display:flex; gap:3px;">${topBadges}</span>` : ""}
          </div>
          <div class="cal-card-time">${esc(shiftDisplay)}</div>
          <div class="cal-card-badges">
            ${pill(r.type)}
            ${bottomTags}
          </div>
        </div>`;
      }).join("");

      // Deduplicated LOA cards (Bottom)
      const loaCardsHtml = loaRecs.map(r => {
        const e = emp(r.empId) || {name: r.empId};
        const noteText = r.notes || r.wfNotes || "Leave of Absence";

        return `<div class="cal-card loa-card" data-rec="${esc(r.rid)}" title="Click to view LOA details">
          <div class="row" style="justify-content:space-between; align-items:flex-start; gap:6px;">
            <span class="cal-card-name" style="color:var(--indigo);">${esc(e.name)}</span>
            <span class="badge" style="background:var(--indigo); color:#fff; font-size:9.5px; padding:1px 5px;">LOA</span>
          </div>

      }).join("");

      const totalItems = uniqueDayRecs.length + dayMus.length + loaRecs.length;
      const hasEntries = totalItems > 0;

      return `<div class="col-day ${isToday ? 'today' : ''}">
        <div class="col-day-hd">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">

          </div>
          <div class="small muted mt" style="font-size:11px; margin-top:4px;">
            ${presentCount}/${totalEmps} present · ${totalItems} items
          </div>
        </div>
        <div class="col-day-body">
          ${hasEntries ? `${muCardsHtml}${recCardsHtml}${loaCardsHtml}` : `<div class="empty" style="padding:24px 6px; font-size:12px;">No requests</div>`}
        </div>
      </div>`;
    }).join("");

    return head + `<div class="week-board mt">${boardColsHtml}</div>`;
  }

  // Day View
  if(UI.preset==="day"){
    let d = f;
    const allRs = byDate[d]||[];
    const dayMus = muByDate[d]||[];
    const presentCount = allRs.filter(r => r.type === "Present").length;
    const rs=allRs.filter(r => r.type !== "Present").sort((a,b) => getRecordTimestamp(b) - getRecordTimestamp(a));
    
    return head+`<div class="day-block card"><div class="row"><b>${fmtShort(d)}</b><span class="small muted">${presentCount}/${totalEmps} present · ${rs.length} record${rs.length===1?"":"s"} · ${dayMus.length} make-ups</span>
      <button class="btn ghost sm right" data-add-day="${d}">+ Add</button></div>
      ${rs.length || dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:8px;">
        ${dayMus.map(m => muRow(m)).join("")}
        ${rs.map(r=>rowRecord(r,true)).join("")}
      </div>`:`<div class="small muted mt">No records or make-ups.</div>`}
    </div>`;
  }

  // Month & Annual Grid Views
  const months=[]; let d=parseISO(f); d.setDate(1);
  while(isoDate(d)<=t){ months.push(new Date(d)); d.setMonth(d.getMonth()+1); }
  const dows=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  
  return head+months.map(m0=>{
    const y=m0.getFullYear(), mo=m0.getMonth();
    const first=new Date(y,mo,1), last=new Date(y,mo+1,0);
    const lead=first.getDay();
    let cells="";
    for(let i=0;i<lead;i++) cells+=`<div></div>`;
    
    for(let day=1;day<=last.getDate();day++){
      const ds=isoDate(new Date(y,mo,day)), rs=byDate[ds]||[], dMus = muByDate[ds]||[];
      const presentCount = rs.filter(r => r.type === "Present").length;
      const agg={};
      calendarRecords(rs).forEach(r=>{const ty=canonicalRecordType(r);if(ty!=="Present")agg[ty]=(agg[ty]||0)+1;});
      const dim=ds<f||ds>t, isToday=ds===today();
      
      cells+=`<div class="cal-cell ${dim?"dim":""} ${isToday?"today":""}" data-day="${ds}">
        <div class="row"><div class="d">${day}</div><div class="right muted" style="font-size:10.5px; font-weight:600;">${presentCount}/${totalEmps}</div></div>
        <div class="cal-mini">
          ${Object.entries(agg).map(([ty,n])=> {
            const tObj = TYPES[ty] || { color: "var(--muted)", abbr: ty.slice(0,2).toUpperCase() };
            return `<span class="dot" title="${esc(ty)}:${n}" style="background:${tObj.color}">${n>1?n:tObj.abbr}</span>`;
          }).join("")}
          ${dMus.length ? `<span class="dot" title="Make-Up Shifts: ${dMus.length}" style="background:#fff; color:var(--purple); border:1.5px solid var(--purple); font-weight:800;">${dMus.length} MU</span>` : ""}
        </div>
      </div>`;
    }
    return `<div class="mb"><h3 class="mt" style="font-size:15px">${m0.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h3>
      <div class="cal-grid mt">${dows.map(w=>`<div class="cal-dow">${w}</div>`).join("")}${cells}</div></div>`;
  }).join("") + `<div class="card mt"><div class="row small">${TYPE_NAMES.map(t2=>`<span class="row" style="gap:4px"><span class="dot" style="background:${TYPES[t2].color}">${TYPES[t2].abbr}</span>${t2}</span>`).join("")}</div></div>`;
}

function filteredEmployees(){
  if (!S.employees) return [];
  const q = UI.q.trim().toLowerCase();
  return S.employees.filter(e =>
    (!UI.dept||e.dept===UI.dept) && 
    (!UI.repName||e.name===UI.repName) && 
    (!UI.title||e.title===UI.title) &&
    (!UI.supervisor||e.supervisor===UI.supervisor) && 
    (!UI.manager||e.manager===UI.manager) &&
    (!q || e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q))
  );
}

function filteredRecords(from,to){
  if (!S.records) return [];
  const ids = new Set(filteredEmployees().map(e=>e.id));
  const [f,t] = from?[from,to]:range();
  return consolidatedDisplayRecords(S.records.filter(r => ids.has(r.empId) && r.date>=f && r.date<=t && (!UI.type || r.type === UI.type)));
}

function emp(id){ return S.employees?.find(e=>e.id===id); }
function isOcc(r){ return !r.cancelled && !r.waived && occurrenceNumber(r.occurrence) > 0; }

function recordOverlapsRange(r,from,to){const start=r.requestStartDate||r.date,end=r.requestEndDate||start;return !!start&&!!end&&start<=to&&end>=from;}
function occurrenceGroups(empId,from,to){
  const all=consolidatedDisplayRecords((S.records||[]).filter(r=>r.empId===empId&&occurrenceNumber(r.occurrence)>0&&!r.fmla));
  const active=all.filter(r=>!r.cancelled&&!r.waived);
  const days=[...new Set(active.flatMap(r=>{const start=r.requestStartDate||r.date,end=r.requestEndDate||start;if(!start||!end||start>end)return[];const out=[];for(let d=start;d<=end&&out.length<730;d=addDays(d,1))out.push(d);return out;}))].sort();
  const raw=[];let cur=[];days.forEach(d=>{const consecutive=cur.length&&d===addDays(cur[cur.length-1],1);if(!cur.length||(consecutive&&cur.length<3))cur.push(d);else{raw.push(cur);cur=[d];}});if(cur.length)raw.push(cur);
  return raw.filter(dates=>dates.some(d=>d>=from&&d<=to)).map(dates=>{
    const related=all.filter(r=>dates.includes(r.date));
    return {id:`${empId}:${dates[0]}`,dates,grouped:dates.length>1,records:related,hasWaived:related.some(r=>r.waived),hasCancelled:related.some(r=>r.cancelled),label:dates.length>1?`Grouped occurrence · ${dates.length} consecutive days`:"Single occurrence"};
  });
}
function groupedOccurrenceCount(empId,from,to){return occurrenceGroups(empId,from,to).length;}
function occurrenceGroupForDate(empId,date,from,to){return occurrenceGroups(empId,from,to).find(g=>g.dates.includes(date))||null;}
function occurrenceGroupBadge(group){if(!group)return `<span class="small muted">No occurrence</span>`;const index=group.dates.length>1?group.dates.indexOf(group.dates.find(Boolean))+1:1;return `<span class="badge ${group.grouped?"warn":"bad"}">${esc(group.label)}</span><div class="small muted">${group.dates.map(fmt).join(" → ")} · counts as 1 occurrence</div>`;}
function occCount(empId,asOf){const to=asOf||today(),from=addDays(to,-OCC_WINDOW_DAYS+1);return groupedOccurrenceCount(empId,from,to);}

function level(n){ for(const [k,name,cls] of LADDER) if(n>=k) return {name,cls}; return null; }

function ossUsed(empId, asOf){
  if (!S.makeups) return 0;
  const from = addDays(asOf||today(), -365);
  return uniqueMakeups(S.makeups.filter(m=>m.empId===empId && m.oss && m.status!=="Missed" && m.status!=="Cancelled" && m.dateMissed>=from)).length;
}

function metrics(){
  const [f,t]=range(), emps=filteredEmployees(), recs=filteredRecords();
  const c = {}; TYPE_NAMES.forEach(n=>c[n]=0);
  let occ=0;
  recs.forEach(r=>{ c[r.type]=(c[r.type]||0)+1; });
  const empIdsForOcc=new Set(recs.map(r=>r.empId));
  empIdsForOcc.forEach(id=>{occ+=groupedOccurrenceCount(id,f,t);});

  // Calculate default Present count for weekdays only
  let days=[]; for(let d=f; d<=t; d=addDays(d,1)) { if(!isWeekend(d)) days.push(d); }
  let totalPossibleWorkDays = days.length * emps.length;
  let loggedNonPresent = recs.filter(r => r.type !== "Present").length;
  let explicitPresent = recs.filter(r => r.type === "Present").length;
  
  // Default remaining unlogged days/reps as Present
  c["Present"] = explicitPresent + Math.max(0, totalPossibleWorkDays - (explicitPresent + loggedNonPresent));

  const withRec = new Set(recs.map(r=>r.empId));
  const offenders = new Set(recs.filter(isOcc).map(r=>r.empId));
  const perfect = emps.filter(e=>!offenders.has(e.id));
  const empIds = new Set(emps.map(e=>e.id));
  const mus = uniqueMakeups((S.makeups||[]).filter(m=>empIds.has(m.empId) && m.dateMissed>=f && m.dateMissed<=t));
  const muDone = mus.filter(m=>m.status==="Completed").length;
  
  const denom = c["Present"] + Object.keys(c).filter(k => k !== "Present" && k !== "Make up Time").reduce((acc, k) => acc + c[k], 0);
  const rate = denom ? Math.round(100 * c["Present"] / denom) : null;
  
  return {c, occ, perfect, rate, mus, muDone, muPending:mus.filter(m=>m.status==="Pending").length, emps, recs, from:f, to:t};
}

function kpi(v,l,accent,cat){ 
  const clickAttr = cat ? ` onclick="kpiModal('${cat}', '${l}')" style="--accent:${accent||"var(--brand)"}; cursor:pointer;" title="Click to view ${l}"` : `style="--accent:${accent||"var(--brand)"}"`;

function pill(type){ return `<span class="pill" style="background:${TYPES[type]?.color||"var(--muted)"}">${esc(type)}</span>`; }

function kpiModal(cat, title) {
  const m = metrics();
  let html = `<h2>${title}</h2>`;
  let rows = "";

  if (cat === "Perfect") {
    if(m.perfect.length === 0) {
      rows = `<tr class="norow"><td colspan="3" class="empty">No perfect attendance in this period.</td></tr>`;
    } else {
      rows = m.perfect.map(e => `<tr data-emp="${esc(e.id)}" style="cursor:pointer"><td><b>${esc(e.name)}</b></td><td>${esc(e.dept)}</td><td>${esc(e.supervisor)}</td></tr>`).join("");
    }
    html += `<div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Supervisor</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    const status = cat === "Make-Ups Pending" ? "Pending" : "Completed";
    let mus = m.mus.filter(x => x.status === status);
    
    const seenDvIds = new Set();
    mus = mus.filter(mu => {
      const key = mu.dvId || mu.mid;
      if (seenDvIds.has(key)) return false;
      seenDvIds.add(key);
      return true;
    });

    if(mus.length === 0) {
      html += `<div class="empty">No ${status.toLowerCase()} make-ups in this period.</div>`;
    } else {
      html += `<div style="display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding-right: 4px;">${mus.map(mu => muRow(mu)).join("")}</div>`;
    }
  } else {
    let recs = cat === "Occurrences" ? m.emps.flatMap(e=>occurrenceGroups(e.id,m.from,m.to).map(g=>{const r=m.recs.find(x=>x.empId===e.id&&g.dates.includes(x.date)&&occurrenceNumber(x.occurrence)>0)||g.records?.[0];return r?{...r,_occGroup:g,date:g.dates[0]}:null}).filter(Boolean)) : m.recs.filter(r => r.type === cat);
    recs.sort((a,b) => b.date.localeCompare(a.date));
    if(recs.length === 0) {
      html += `<div class="empty">No records in this period.</div>`;
    } else {
      html += `<div class="tbl-wrap" style="max-height: 60vh; overflow-y: auto;"><table><thead><tr><th style="text-align:left">Date</th><th style="text-align:left">Employee</th><th style="text-align:left">Type / Time</th><th style="text-align:left">Notes</th></tr></thead><tbody>${recs.map(r => rowRecord(r, false)).join("")}</tbody></table></div>`;
    }
  }

  html += `<div class="mfoot mt"><button class="btn ghost" onclick="closeModal()">Close</button></div>`;
  openModal(html);
  
  const mh = $("#modalHost");
  if (cat === "Perfect") {
    mh.querySelectorAll("tr[data-emp]").forEach(tr=>tr.onclick=()=>{closeModal(); empModal(tr.dataset.emp);});
  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    mh.querySelectorAll("[data-mu-act]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const act=b.dataset.muAct, id=b.dataset.id;
      if(act==="edit") { closeModal(); makeupModal(id); }
      else { setMuStatus(id, act==="approve"?"Approved":act==="complete"?"Completed":"Missed"); closeModal(); }
    });
  } else {
    bindRecordButtons(mh);
  }
}

function renderDashboard(){
  const m=metrics();
  const ladder = m.emps.map(e=>({e,n:occCount(e.id,m.to)})).filter(x=>x.n>=3).sort((a,b)=>b.n-a.n);

function drawCharts(){
  charts.forEach(c => c.destroy()); 
  charts = [];
  if (typeof Chart === "undefined") return;
  const m = metrics(), days = []; 
  for (let d = m.from; d <= m.to; d = addDays(d, 1)) {
    if (!isWeekend(d)) days.push(d);
  }

  const colors = {
    "PTO": "#0d9488",
    "Shift Trade": "#2563eb",
    "Make up Time": "#7c3aed",
    "Schedule Adjustment": "#4f46e5",
    "Jury Duty / Bereavement": "#6366f1",
    "Call Out": "#dc2626",
    "Cancellation": "#22c55e",
    "Short Shift": "#ea580c",
    "NCNS": "#1d4ed8",
    "Tardy": "#d97706",
    "LOA": "#4338ca"
  };

  const trendLabels = [];
  const activeTypes = TYPE_NAMES.filter(n => n !== "Present");
  
  const datasets = activeTypes.map(type => {
    return {
      label: type,
      data: days.map(d => m.recs.filter(r => r.date === d && r.type === type).length),
      backgroundColor: colors[type] || "var(--muted)",
      borderRadius: 4
    };
  }).filter(ds => ds.data.some(val => val > 0));

  days.forEach(d => {
    trendLabels.push(parseISO(d).toLocaleDateString(undefined, {month:"short", day:"numeric"}));
  });

  const tr = $("#chTrend"); 
  if (tr) {
    charts.push(new Chart(tr, {
      type: "bar",
      data: {
        labels: trendLabels,
        datasets: datasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: "bottom" } },
        scales: { 
          x: { stacked: true, grid: { display: false } },
          y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } 
        },
        onClick: (event, elements) => {
          if (elements.length > 0) {
            const index = elements[0].index;
            const clickedDate = days[index];
            const dayRecs = m.recs.filter(r => r.date === clickedDate && r.type !== "Present");

            let rows = dayRecs.length ? dayRecs.map(r => rowRecord(r, false)).join("") : `<tr class="norow"><td colspan="4" class="empty">No records on ${fmt(clickedDate)}.</td></tr>`;

            openModal(`<h2>All Records — ${fmt(clickedDate)}</h2>
              <div class="tbl-wrap"><table><thead><tr><th style="text-align:left">Date</th><th style="text-align:left">Employee</th><th style="text-align:left">Type / Time</th><th style="text-align:left">Notes</th></tr></thead><tbody>${rows}</tbody></table></div>
              <div class="mfoot mt"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
            bindRecordButtons($("#modalHost"));
          }
        }
      }
    }));
  }

  const mx = $("#chMix"); 
  if (mx) { 
    const names = TYPE_NAMES.filter(n => n !== "Present" && m.c[n] > 0);
    
    charts.push(new Chart(mx, {
      type: "doughnut",
      data: {
        labels: names,
        datasets: [{
          data: names.map(n => m.c[n]),
          backgroundColor: names.map(n => colors[n] || "var(--muted)"),
          borderWidth: 0
        }]
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false, 
        plugins: { legend: { position: "bottom" } },
        onClick: (event, elements) => {
          if (elements.length > 0) {
            const index = elements[0].index;
            const clickedType = names[index];
            kpiModal(clickedType, `Records: ${clickedType}`);
          }
        }
      }
    })); 
  }
}

  
function calShift(dir){
  const d=parseISO(UI.anchor);
  if(UI.preset==="day") UI.anchor=addDays(UI.anchor,dir);
  else if(UI.preset==="week") UI.anchor=addDays(UI.anchor,7*dir);
  else if(UI.preset==="month"){ d.setMonth(d.getMonth()+dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="quarter"){ d.setMonth(d.getMonth()+3*dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="annual"){ d.setFullYear(d.getFullYear()+dir); UI.anchor=isoDate(d); }
  else { const [f,t]=range(); const n=Math.max(1,Math.round((parseISO(t)-parseISO(f))/864e5)+1); UI.from=addDays(f,n*dir); UI.to=addDays(t,n*dir); }
  render();
}


function occurrenceOverviewRows(empId,from,to){
  const groups=occurrenceGroups(empId,from,to);
  const rows=[];
  groups.forEach(g=>{
    const related=consolidatedDisplayRecords((S.records||[]).filter(r=>r.empId===empId&&g.dates.includes(r.date)));
    const primary=related.find(r=>!r.cancelled&&!r.waived&&occurrenceNumber(r.occurrence)>0)||related.find(r=>!r.cancelled&&!r.waived)||g.records?.[0];
    if(primary)rows.push({...primary,date:g.dates[0],_occGroup:g,_displayOccurrence:1});
  });
  const excluded=consolidatedDisplayRecords((S.records||[]).filter(r=>r.empId===empId&&r.date>=from&&r.date<=to&&occurrenceNumber(r.occurrence)>0&&(r.waived||r.cancelled||r.fmla)));
  excluded.forEach(r=>{if(!rows.some(x=>x.rid===r.rid))rows.push({...r,_displayOccurrence:0});});
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}
function occurrenceGroupLineRows(r,g,n,lv){
  const dates=g?.dates?.length?g.dates:[r.date];

function renderTeam(){

    const perfect=rs.length&&!occ;
    return {
      e, 
      rs, 
      name: e.name, 
      dept: e.dept, 
      supervisor: e.supervisor, 
      manager: e.manager, 
      recordsCount: rs.length, 
      occurrences: occ,
      rolling90: n90,
      rollingLevel: lv,
      oss: ossUsed(e.id,m.to), 
      perfect, 
      status: e.status

  });

  return teamHtml + recordsHtml;

  </div>
  <div class="card small mb" style="border-left:4px solid var(--purple)">
    An <b>OSS</b> (Out / Short-Shift) lets an agent make up missed time instead of taking an occurrence or losing pay —
    up to <b>${OSS_LIMIT} per rolling 12 months</b>. Completing the agreed make-up time <b>waives the linked occurrence</b>;
    missing it means the occurrence stands.
  </div>
  <div class="cal-head">
    <button class="btn ghost sm" id="calPrev">&#8249;</button>
    <button class="btn ghost sm" id="calToday">Today</button>
    <button class="btn ghost sm" id="calNext">&#8250;</button>
    <h2>${fmt(f)}${f!==t?" – "+fmt(t):""}</h2>
  </div>`;

  if(UI.preset==="week" || (UI.preset==="adjusted" && addDays(f,10)>t && addDays(f,1)<=t)){
    let days = []; 
    let baseDate = parseISO(f);
    let dayOfWeek = baseDate.getDay();
    
    // Lock onto the Monday of the currently viewed week
    let diffToMonday = dayOfWeek === 0 ? 1 : 1 - dayOfWeek;
    baseDate.setDate(baseDate.getDate() + diffToMonday);
    
    let cur = isoDate(baseDate);
    for(let i = 0; i < 5; i++) {
      days.push(cur);
      cur = addDays(cur, 1);
    }

    if (!UI.selectedMuWeekDay || !days.includes(UI.selectedMuWeekDay)) {
      UI.selectedMuWeekDay = days.includes(today()) ? today() : days[0];
    }

    const dows = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const selDay = UI.selectedMuWeekDay;
    const dayMus = byDate[selDay] || [];

    const weekGridHtml = `<div class="cal-grid" style="grid-template-columns: repeat(5, 1fr); margin-bottom: 20px;">
      ${days.map(ds => {
        const dObj = parseISO(ds);
        const dowName = dows[dObj.getDay()];
        const dMus = byDate[ds]||[];
        const isSelected = ds === selDay;

        return `<div class="cal-cell ${isSelected ? "today" : ""}" data-select-mu-day="${ds}" style="min-height: 80px; cursor: pointer; ${isSelected ? 'border-width: 2px; border-color: var(--brand); background: var(--soft);' : ''}">
          <div class="row"><div class="small muted" style="text-transform: uppercase;">${dowName}</div><div class="d">${dObj.getDate()}</div></div>
          <div class="cal-mini" style="flex-direction:column; gap:2px;">
            ${dMus.slice(0,2).map(m=>{
              const e = emp(m.empId) || {name: m.empId};
              const firstName = esc(e.name.span ? e.name : e.name.split(' ')[0]);
              const timeStr = formatChipTime(m.notes) || hoursToHHMM(m.hoursOwed);
              return `<div class="mu-chip ${esc(m.status)}" title="${esc(e.name)}: ${timeStr}" style="font-size:9px; padding:1px 4px;">${firstName}</div>`;
            }).join("")}
            ${dMus.length > 2 ? `<div class="small muted" style="font-size:9px;">+${dMus.length - 2} more</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`;

    const selectedDateObj = parseISO(selDay);
    const formattedSelectedTitle = selectedDateObj.toLocaleDateString(undefined, {weekday:"long", month:"short", day:"numeric", year:"numeric"});

    const daySectionHtml = `<div class="day-block card">
      <div class="row">
        <b>${formattedSelectedTitle}</b>
        <span class="small muted">${dayMus.length} make-up shift${dayMus.length===1?"":"s"}</span>
        <button class="btn ghost sm right" data-mu-add-day="${selDay}">+ Add</button>
      </div>
      ${dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:10px;">${dayMus.map(muRow).join("")}</div>` : `<div class="small muted mt">No make-up shifts scheduled for this day.</div>`}
    </div>`;

    return head + weekGridHtml + daySectionHtml;
  }

  // Fallback for month/other views
  let days=[]; for(let d=f; d<=t; d=addDays(d,1)) days.push(d);
  return head + `<div class="cal-list">${days.map(d=>{
    const dayMus = byDate[d] || [];
    return `<div class="day-block card">
      <div class="row">
        <b>${fmtShort(d)}</b>
        <span class="small muted">${dayMus.length} make-up shift${dayMus.length===1?"":"s"}</span>
        <button class="btn ghost sm right" data-mu-add-day="${esc(d)}">+ Add</button>
      </div>
      ${dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:10px;">${dayMus.map(muRow).join("")}</div>` : `<div class="small muted mt">No make-up shifts scheduled.</div>`}
    </div>`;
  }).join("")}</div>`;
}
  
function setMuStatus(mid,status){
  const m=S.makeups.find(x=>x.mid===mid); if(!m) return;
  m.status=status;
  if(status==="Completed"){ m.completedDate=today();
    const r=S.records.find(r=>r.rid===m.rid)||S.records.find(r=>r.empId===m.empId&&r.date===m.dateMissed&&TYPES[r.type].occ);
    if(r){ r.waived=true; m.rid=r.rid; }
    toast("Make-up completed — occurrence waived");
  } else if(status==="Missed"){
    const r=S.records.find(r=>r.rid===m.rid); if(r) r.waived=false;
    toast("Marked missed — occurrence stands");
  } else toast("Agreement "+status.toLowerCase());
  save(); render();
}

function getRecordTimestamp(r) {
  if (!r) return 0;
  const raw = r.submittedOn || r.createdon || r.date || 0;
  const t = new Date(raw).getTime();
  return isNaN(t) ? 0 : t;
}

function formatSubmittedTime(isoStr) {
  if (!isoStr) return "";
  const d = new Date(isoStr);
  return isNaN(d.getTime()) ? "" : d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}

function occurrenceGroupForRecord(r){return (!r||!isOcc(r)||!r.empId||!r.date)?null:occurrenceGroupForDate(r.empId,r.date,"2025-01-01",today());}
function occurrenceDisplayForRecord(r){const g=occurrenceGroupForRecord(r);if(!g)return "";const isStart=g.dates[0]===r.date;return `<div class="small mt"><span class="badge ${g.grouped?"warn":"bad"}">${esc(g.label)}</span><div class="muted">${g.dates.map(fmt).join(" → ")} · ${isStart?"counts as 1 occurrence":"same occurrence group · +0"}</div></div>`;}

    <td><b>${esc(e.name)}</b></td>
    <td style="white-space: nowrap;">
      <div>${pill(r.type)} ${topBadges}</div>
      <div style="font-weight: 600; font-size: 13.5px; color: var(--muted); margin-top: 4px;">${esc(shiftDisplay)}</div>
    </td>
    <td class="small">
      ${r.notes ? `<div>${esc(r.notes)}</div>` : ""}
      ${r.mgrNotes ? `<div style="color: var(--teal); margin-top: 4px;"><b>Mgr Notes:</b> ${esc(r.mgrNotes)}</div>` : ""}
      ${r.wfNotes ? `<div style="color: var(--brand); margin-top: 4px;"><b>WF Notes:</b> ${esc(r.wfNotes)}</div>` : ""}
      ${groupNote}${bottomTagsHtml}

function renderRecords(){
  const recs = filteredRecords().sort((a, b) => {
    // Fallback chain: submittedOn -> createdon -> date
    const timeA = new Date(a.submittedOn || a.createdon || a.date || 0).getTime();
    const timeB = new Date(b.submittedOn || b.createdon || b.date || 0).getTime();
    
    // Sort direction: UI.sortDir (1 for oldest on top, -1 for newest on top)
    return UI.sortDir * (timeA - timeB);
  });

  return `<div class="section-title"><h2>Records (${recs.length})</h2>
    <button class="btn sm" id="recNew">+ Add record</button></div>
  <div class="card tbl-wrap"><table><thead><tr>
    <th data-sort="date">Date ${UI.sortKey==="date"?(UI.sortDir<0?"↓":"↑"):""}</th><th data-sort="empId">Employee</th>
    <th data-sort="type">Type / Time</th><th>Notes</th>
  </tr></thead><tbody>${recs.map(r=>rowRecord(r, false)).join("")||`<tr class="norow"><td colspan="4" class="empty">No records in this period.</td></tr>`}</tbody></table></div>`;
}
  
function sortableValue(text){const raw=String(text||"").replace(/[↑↓]/g,"").trim();const num=Number(raw.replace(/[$,%]/g,""));if(raw!==""&&Number.isFinite(num))return {type:"number",value:num};const parsed=Date.parse(raw);if(/\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b|^\d{1,2}\/\d{1,2}\/\d{2,4}$|^\d{4}-\d{2}-\d{2}$/.test(raw)&&!Number.isNaN(parsed))return {type:"number",value:parsed};return {type:"text",value:raw.toLowerCase()};}
function bindSortableTables(root=document){root.querySelectorAll("table").forEach(table=>{const body=table.tBodies?.[0],heads=[...table.querySelectorAll(":scope > thead > tr > th")];if(!body||!heads.length)return;heads.forEach((th,index)=>{if(th.dataset.sort||th.dataset.teamSort||th.dataset.noSort!==undefined||!String(th.textContent||"").trim())return;th.classList.add("sortable-col");th.title="Sort this column";th.onclick=()=>{const dir=th.dataset.localSortDir==="asc"?-1:1;heads.forEach(h=>{h.classList.remove("sort-active");delete h.dataset.sortArrow;});th.dataset.localSortDir=dir===1?"asc":"desc";th.dataset.sortArrow=dir===1?"↑":"↓";th.classList.add("sort-active");const rows=[...body.rows].filter(r=>!r.classList.contains("norow"));rows.sort((a,b)=>{const av=sortableValue(a.cells[index]?.innerText),bv=sortableValue(b.cells[index]?.innerText);const cmp=av.type==="number"&&bv.type==="number"?av.value-bv.value:String(av.value).localeCompare(String(bv.value),undefined,{numeric:true,sensitivity:"base"});return dir*cmp;});rows.forEach(r=>body.appendChild(r));};});});}
function openModal(html){ $("#modalHost").innerHTML=`<div class="overlay" id="ovl"><div class="modal">${html}</div></div>`;
  $("#ovl").addEventListener("click",e=>{ if(e.target.id==="ovl") closeModal(); }); bindSortableTables($("#modalHost")); }
function closeModal(){ $("#modalHost").innerHTML=""; }
function empSelect(id,cur){ return `<select id="${id}">${filteredEmployees().length?filteredEmployees().map(e=>`<option ${e.id===cur?"selected":""} value="${esc(e.id)}">${esc(e.name)} (${esc(e.id)})</option>`).join(""):S.employees.map(e=>`<option ${e.id===cur?"selected":""} value="${esc(e.id)}">${esc(e.name)}</option>`).join("")}</select>`; }

function recordModal(rid,presetDate){
  const r = rid ? S.records.find(x=>x.rid===rid) : {
    date: presetDate || today(),
    empId: S.employees[0]?.id,
    type: "Call Out",
    hours: 8,
    notes: "",
    wfNotes: "",
    fmla: false,
    voicemail: false,
    partialShift: "",
    occurrence: 0
  };
  
  // Default to 0 for new records; preserve existing record weight if editing
  const currentOcc = r.occurrence !== undefined && r.occurrence !== null ? r.occurrence : 0;
  const modalGroup=rid&&isOcc(r)?occurrenceGroupForDate(r.empId,r.date,addDays(r.date,-2),addDays(r.date,2)):null;
  const groupContext=modalGroup?`<div class="card mb occurrence-group-rainbow"><b>Occurrence grouping</b><div class="small mt">${esc(modalGroup.label)}: ${modalGroup.dates.map(fmt).join(" → ")}. This group counts as <b>1 occurrence</b>. A maximum of <b>3 consecutive days</b> can share one occurrence.</div></div>`:"";

  openModal(`<h2>${rid ? "Edit" : "Add"} record</h2>${groupContext}
    <div class="mrow">
      <div><label for="mEmp">Employee</label>${empSelect("mEmp",r.empId)}</div>
      <div><label for="mDate">From</label><input type="date" id="mDate" value="${esc(r.date)}"></div>
      <div><label for="mDateTo">To</label><input type="date" id="mDateTo" value="${esc(r.dateTo || r.date)}"></div>
    </div>
    
    <div class="mrow">
      <div><label for="mType">Type / Leave Type</label><select id="mType">${TYPE_NAMES.map(t=>`<option ${t===r.type?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
      <div><label for="mHours">Hours</label><input type="number" id="mHours" step="0.25" min="0" value="${r.hours}"></div>
      <div><label for="mPartial">Time Frame / Schedule Adjustment</label><input type="text" id="mPartial" placeholder="e.g. 12:30 PM - 5:00 PM" value="${esc(r.partialShift||"")}"></div>
    </div>

    <div class="mrow">
      <div><label>Occurrences</label>
        <div class="row" style="gap:4px">
          <button class="btn ghost sm" id="occMinus" style="padding:4px 10px; font-size:16px;">-</button>
          <input type="number" id="mOcc" value="${currentOcc}" style="width:70px; text-align:center" step="1" min="0">
          <button class="btn ghost sm" id="occPlus" style="padding:4px 10px; font-size:16px;">+</button>
        </div>
      </div>
      <div style="display:flex; align-items:flex-end; gap:16px;">
        <label class="row" style="font-size:13.5px;font-weight:600;cursor:pointer;padding-bottom:10px;">
          <input type="checkbox" id="mFmla" ${r.fmla?"checked":""} style="width:auto;cursor:pointer;"> FMLA
        </label>
        <label class="row" style="font-size:13.5px;font-weight:600;cursor:pointer;padding-bottom:10px;">
          <input type="checkbox" id="mVoicemail" ${r.voicemail?"checked":""} style="width:auto;cursor:pointer;"> Voicemail
        </label>
      </div>
    </div>
    
    <div><label for="mNotes">Notes</label><textarea id="mNotes" rows="2">${esc(r.notes)}</textarea></div>
    ${r.mgrNotes ? `<div class="mt small" style="padding:10px; background:var(--soft); border-radius:8px; border-left:3px solid var(--teal);"><b>Manager Notes:</b><br>${esc(r.mgrNotes).replace(/\n/g, '<br>')}</div>` : ""}
    <div class="mt"><label for="mWfNotes">Workforce Notes</label><textarea id="mWfNotes" rows="2" placeholder="Enter workforce notes here...">${esc(r.wfNotes || "")}</textarea></div>

    <div class="mfoot">
      ${rid?`<button class="btn ghost" id="mDel" style="margin-right:auto">Cancel request</button>`:`<span class="small muted right" style="margin-right:auto">Tip: for an occurrence type you can create a make-up agreement after saving.</span>`}
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="mSave">Save</button></div>`);

  if (rid) {
    const targetRec = S.records.find(x => x.rid === rid);
    const isCancelled = targetRec?.cancelled;
    $("#mDel").textContent = isCancelled ? "Restore request" : "Cancel request";
    $("#mDel").className = "btn ghost";
    $("#mDel").onclick = () => toggleCancelRecord(rid);
  }

  $("#occMinus").onclick = (e) => { 
    e.preventDefault(); 
    const inp = $("#mOcc"); 
    inp.value = Math.max(0, parseInt(inp.value || 0, 10) - 1); 
  };
  $("#occPlus").onclick = (e) => { 
    e.preventDefault(); 
    const inp = $("#mOcc"); 
    inp.value = Math.max(0, parseInt(inp.value || 0, 10) + 1); 
  };

  $("#mSave").onclick = async () => {
    const dFrom = $("#mDate").value;
    const elTo = $("#mDateTo");
    const dTo = elTo ? elTo.value : dFrom; 
    
    if(!dFrom||!$("#mEmp").value) return toast("Date and employee are required");
    if(dFrom > dTo) return toast("From date must be before To date");
    
    const empId = $("#mEmp").value;
    const type = $("#mType").value;
    const hours = parseFloat($("#mHours").value)||0;
    const notes = $("#mNotes").value.trim();
    const wfNotes = $("#mWfNotes").value.trim();
    const partialShift = $("#mPartial").value.trim();
    const fmla = $("#mFmla").checked;
    const voicemail = $("#mVoicemail").checked;
    const occurrence = parseInt($("#mOcc").value, 10) || 0;

    if (rid) {
      const targetRec = S.records.find(x => x.rid === rid);
      if (targetRec) {
        showSyncCover("Updating record in Dataverse...");
        try {
          const toUSDate = (iso) => {
            const [y, m, d] = iso.split("-");
            return `${m}/${d}/${y}`;
          };
          const formattedReqDates = dFrom === dTo 
            ? toUSDate(dFrom) 
            : `${toUSDate(dFrom)} - ${toUSDate(dTo)}`;

          // 1. Send update to Dataverse
          if(targetRec.dvId){
            await patchDataverseRecord(targetRec.dvId,{cr714_requestdates:formattedReqDates,cr714_leavetype:type,cr714_requestnotes:notes,cr714_wfnotes:wfNotes,cr714_occurrence:occurrence,cr714_ptohoursrequested:hours,cr714_hoursofpartialshift:partialShift,cr714_fmla:fmla,cr714_voicemail:voicemail});
          }else if(targetRec.attendanceId){
            await patchCsrAttendanceRecord(targetRec.attendanceId,{startDate:dFrom,endDate:dTo,type,notes:notes||wfNotes,occurrence});
          }else{
            throw new Error("This calendar row has no Dataverse Time Off ID or CSR Attendance ID and cannot be updated safely.");
          }

          // 2. Remove previous split days belonging to this request
          const baseKey = targetRec.dvId || (targetRec.rid.includes('-') ? targetRec.rid.split('-')[0] : targetRec.rid);
          S.records = S.records.filter(r => {
            if (targetRec.dvId && r.dvId === targetRec.dvId) return false;
            if (!targetRec.dvId && (r.rid === baseKey || r.rid.startsWith(baseKey + '-'))) return false;
            return true;
          });

          // 3. Re-create cards locally for every day in the new range
          let cur = parseISO(dFrom);
          const end = parseISO(dTo);
          let idx = 0;
          while (cur <= end) {
            const curDateStr = isoDate(cur);
            S.records.push({
              rid: `${baseKey}-${idx}`,
              dvId: targetRec.dvId || "",
              requestId: targetRec.requestId || "",
              date: curDateStr,
              empId,
              type,
              hours,
              notes,
              wfNotes,
              mgrNotes: targetRec.mgrNotes || "",
              partialShift,
              submittedOn: targetRec.submittedOn || new Date().toISOString(),
              source: targetRec.source || "dataverse",
              attendanceId: targetRec.attendanceId || "",
              attendanceMatched: !!targetRec.attendanceMatched,
              occurrenceSource: targetRec.occurrenceSource || (targetRec.attendanceId?"CSR Attendance":"Time Off"),
              dateSource: targetRec.dateSource || (targetRec.attendanceId?"CSR Attendance cr714_startdate/cr714_enddate":"cr714_requestdates"),
              rawLeaveType: type,
              waived: targetRec.waived || false,
              cancelled: targetRec.cancelled || false,
              fmla,
              voicemail,
              occurrence: idx === 0 ? occurrence : 0
            });
            cur.setDate(cur.getDate() + 1);
            idx++;
          }
          toast("Record updated and date range applied");
        } catch (err) {
          console.error("Update failed:", err);
          toast("Failed to update record: " + err.message);
        } finally {
          hideSyncCover();
        }
      }
    } else {
      let current = parseISO(dFrom);
      const end = parseISO(dTo);
      const selectedEmp = emp(empId);
      
      showSyncCover("Creating record in Dataverse...");
      try {
        const token = await getDataverseToken();
        if (!token) throw new Error("Authentication missing");

        const existingManualIds = (S.records || [])
          .map(r => r.requestId)
          .filter(id => id && String(id).startsWith("M"))
          .map(id => parseInt(String(id).slice(1), 10))
          .filter(n => !isNaN(n));
        let nextSeq = existingManualIds.length > 0 ? Math.max(...existingManualIds) + 1 : 1;

        while(current <= end) {
          const manualId = `M${String(nextSeq).padStart(5, "0")}`;
          nextSeq++;

          const curDateStr = isoDate(current);
          const payload = {
            cr714_id: manualId,
            cr714_name: selectedEmp ? selectedEmp.name : empId,
            cr714_email: selectedEmp ? selectedEmp.email : "",
            cr714_requestdates: curDateStr,
            cr714_leavetype: type,
            cr714_requestnotes: notes,
            cr714_wfnotes: wfNotes,
            cr714_occurrence: String(occurrence),
            cr714_ptohoursrequested: String(hours),
            cr714_hoursofpartialshift: partialShift,
            cr714_fmla: fmla ? "true" : "false",
            cr714_voicemail: voicemail ? "true" : "false"
          };

          const res = await fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json",
              "Accept": "application/json",
              "OData-MaxVersion": "4.0",
              "OData-Version": "4.0"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            throw new Error(`Dataverse POST failed [${res.status}]: ${await res.text()}`);
          }

          const entityIdHeader = res.headers.get("OData-EntityId");
          let newDvId = "";
          if (entityIdHeader) {
            const match = entityIdHeader.match(/\(([^)]+)\)/);
            if (match) newDvId = match[1];
          }

          S.records.push({ 
            rid: uid("r"), 
            dvId: newDvId,
            requestId: manualId,
            date: curDateStr, 
            empId, 
            type, 
            hours, 
            notes, 
            wfNotes,
            partialShift,
            submittedOn: new Date().toISOString(),
            source: "dataverse", 
            waived: false, 
            fmla,
            voicemail,
            occurrence
          });

          current.setDate(current.getDate() + 1);
        }
        toast(dFrom === dTo ? "Record saved to Dataverse" : "Records saved to Dataverse");
      } catch (err) {
        console.error("Failed to create record in Dataverse:", err);
        toast("Failed to save to Dataverse: " + err.message);
      } finally {
        hideSyncCover();
      }
    }
      
    recalculateAfterDedupe();
    save(); closeModal(); render(); 
  };
}

rd+`</tr>`;return rows;},[]).map(r=>r.endsWith("</tr>")?r:r+`<td style="width:50%;padding:7px"></td></tr>`).join("");const quote=includeQuote?`<div style="margin:20px 22px 0;padding:17px 19px;border-radius:15px;background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1px solid #c7d2fe;color:#312e81"><div style="font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px">Positive note for today</div><div style="font-size:15px;font-weight:700;line-height:1.5">“${esc(dailyQuote())}”</div></div>`:"";return `<div class="email-preview-shell"><div class="email-email-frame" style="background:#f8fafc;font-family:Segoe UI,Arial,sans-serif;color:#172033"><div style="padding:28px 28px 24px;background:linear-gradient(125deg,#075985 0%,#0f6cbd 48%,#6d28d9 100%);color:#fff"><div style="font-size:11px;font-weight:850;letter-spacing:.15em;text-transform:uppercase;opacity:.85">Workforce • Daily Operations</div><div style="font-size:28px;line-height:1.12;font-weight:900;margin-top:8px">Attendance Report</div><div style="font-size:13px;margin-top:8px;opacity:.9">${esc(dateLabel)}</div><div style="margin-top:18px;display:inline-block;padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);font-size:12px;font-weight:750">${metric.active} listed • ${metric.sections} active sections</div></div><div style="padding:20px 22px 4px"><div style="font-size:16px;font-weight:750;color:#172033">${esc(model.greeting)}</div><div style="font-size:12px;color:#64748b;margin-top:5px">Here is today’s attendance and schedule overview.</div></div><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:6px 15px 4px;border-collapse:separate"><tbody>${cards}</tbody></table>${quote}<div style="padding:22px;text-align:center;color:#64748b;font-size:10px;line-height:1.5">Prepared by Workforce • Please use the latest report when updates are issued.</div></div></div>`;}
function renderEmail(){const d=loadEmailDraft()||defaultEmail();d.body=cleanAttendanceEmailDurations(d.body);return `<div class="section-title"><h2>Attendance Email</h2><span class="small muted">Same eight-section rules • premium Outlook-ready presentation</span></div><div class="card email-form"><div class="mrow"><div><label>To</label><input id="emailTo" value="${esc(d.to)}"></div><div><label>Subject</label><input id="emailSubject" value="${esc(d.subject)}"></div></div><div class="email-columns"><div class="email-pane"><div class="email-pane-head"><label for="emailBody">Email message</label><span class="email-edit-badge">EDIT CONTENT</span></div><textarea id="emailBody" aria-label="Editable attendance email message">${esc(d.body)}</textarea><div class="email-format-note"><b>Formatting is automatic.</b> Keep the section headings unchanged so the premium cards retain the same attendance rules.</div></div><div class="email-pane"><div class="email-pane-head"><label>Premium send preview</label><span class="email-preview-badge">OUTLOOK READY</span></div><div id="emailPreview" class="email-preview" aria-label="Read-only attendance email preview">${premiumEmailHtml(d.body,d.subject)}</div><div class="email-help">Leadership remains highlighted. The positive quote appears only on the first non-update report of the day.</div></div></div><div class="email-actions"><button class="btn ghost" id="emailRegen">Regenerate</button><button class="btn ghost" id="emailDownload">Download EML</button><button class="btn" id="emailSend">Send with Outlook</button></div></div>`;}
function emailPlainTextWithQuote(d){return firstReportEligible(d.subject)?`${d.body}\n\nPositive note for today: “${dailyQuote()}”`:d.body;}
function downloadEmail(){const d=saveEmailDraft(),boundary=`----Workforce${Date.now()}`,html=`<html><body style="margin:0;background:#eaf0f8;padding:18px">${premiumEmailHtml(d.body,d.subject)}</body></html>`,plain=emailPlainTextWithQuote(d),eml=[`To: ${d.to}`,`Subject: ${d.subject}`,"MIME-Version: 1.0",`Content-Type: multipart/alternative; boundary=\"${boundary}\"`,"",`--${boundary}`,"Content-Type: text/plain; charset=UTF-8","",plain,"",`--${boundary}`,"Content-Type: text/html; charset=UTF-8","",html,"",`--${boundary}--`].join("\r\n"),blob=new Blob([eml],{type:"message/rfc822"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`Attendance_Report_${today()}.eml`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function sendAttendanceEmail(){const d=saveEmailDraft();if(!d.to||!d.subject)return toast("Recipient and subject are required");const includeQuote=firstReportEligible(d.subject),token=await window.getToken("https://graph.microsoft.com/Mail.Send");const res=await fetch("https://graph.microsoft.com/v1.0/me/sendMail",{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify({message:{subject:d.subject,body:{contentType:"HTML",content:`<html><body style="margin:0;background:#eaf0f8;padding:18px">${premiumEmailHtml(d.body,d.subject,{includeQuote})}</body></html>`},toRecipients:[{emailAddress:{address:d.to}}]},saveToSentItems:true})});if(!res.ok)throw new Error(`Outlook send failed [${res.status}]: ${await res.text()}`);if(includeQuote)markFirstReportSent();toast("Attendance email sent");}
function render(){
  const dedupeResult = recalculateAfterDedupe();
  if (dedupeResult.removedRecords || dedupeResult.removedMakeups) save();
  renderNav(); renderFilters(); setSync("");
  const v=$("#view");
  switch(UI.tab){
    case "dashboard": v.innerHTML=renderDashboard(); drawCharts(); break;
    case "occurrenceOverview": v.innerHTML=renderOccurrenceOverview(); break;
    case "calendar":  v.innerHTML=renderCalendar(); break;
    case "team":      v.innerHTML=renderTeam(); break;
    case "makeup":    v.innerHTML=renderMakeup(); break;
    case "email":     v.innerHTML=renderEmail(); break;
  }
  bindView();
}
  
function bindRecordButtons(root){
  root.querySelectorAll("[data-rec]").forEach(el => {
    el.onclick = () => recordModal(el.dataset.rec);
  });
}

function bindView(){
  const v=$("#view");
  v.querySelectorAll("tr[data-emp]").forEach(tr=>tr.onclick=()=>empModal(tr.dataset.emp));
  v.querySelectorAll("tr[data-overview-rep]").forEach(tr=>tr.onclick=()=>{UI.overviewRep=tr.dataset.overviewRep;render();});
  v.querySelectorAll(".cal-cell[data-day]").forEach(c=>c.onclick=()=>dayModal(c.dataset.day));
  
  // Weekly calendar day selection handlers
  v.querySelectorAll(".cal-cell[data-select-day]").forEach(c=>{
    c.onclick = () => {
      UI.selectedWeekDay = c.dataset.selectDay;
      render();
    };
  });

  v.querySelectorAll(".cal-cell[data-select-mu-day]").forEach(c=>{
    c.onclick = () => {
      UI.selectedMuWeekDay = c.dataset.selectMuDay;
      render();
    };
  });

  v.querySelectorAll("[data-add-day]").forEach(b=>b.onclick=e=>{e.stopPropagation();recordModal(null,b.dataset.addDay);});
  
  v.querySelectorAll(".cal-cell[data-mu-day]").forEach(c=>{
    c.onclick = (e) => {
      if(!e.target.closest(".mu-chip")) muDayModal(c.dataset.muDay);
    };
  });
  v.querySelectorAll(".mu-chip[data-mu-id]").forEach(chip=>{
    chip.onclick = (e) => {
      e.stopPropagation();
      makeupModal(chip.dataset.muId);
    };
  });
  v.querySelectorAll("[data-mu-add-day]").forEach(b=>b.onclick=e=>{e.stopPropagation();makeupModal(null,{date:b.dataset.muAddDay});});

  v.querySelectorAll("th[data-team-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.teamSort; 
    UI.teamSortDir = UI.teamSortKey === k ? -UI.teamSortDir : 1; 
    UI.teamSortKey = k; 
    render();
  });

  bindRecordButtons(v);
  bindSortableTables(v);
  v.querySelectorAll("[data-mu-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();
    const act=b.dataset.muAct, id=b.dataset.id;
    if(act==="edit") makeupModal(id);
    else setMuStatus(id, act==="approve" ? "Approved" : act==="complete" ? "Completed" : "Missed");});
  v.querySelectorAll("tr[data-mu]").forEach(tr=>tr.onclick=()=>{ makeupModal(tr.dataset.mu); });
  v.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort; UI.sortDir=UI.sortKey===k?-UI.sortDir:-1; UI.sortKey=k; render();});
  if(UI.tab==="email"){
    const regen=$("#emailRegen");if(regen)regen.onclick=()=>{try{localStorage.removeItem(EMAIL_DRAFT_KEY);}catch(e){}v.innerHTML=renderEmail();bindView();};
    [$("#emailTo"),$("#emailSubject"),$("#emailBody")].filter(Boolean).forEach(el=>el.addEventListener("input",()=>{clearTimeout(window._emailSave);window._emailSave=setTimeout(()=>{saveEmailDraft();const p=$("#emailPreview");if(p)p.innerHTML=premiumEmailHtml($("#emailBody").value,$("#emailSubject").value);},250);}));
    const dl=$("#emailDownload");if(dl)dl.onclick=downloadEmail;
    const send=$("#emailSend");if(send)send.onclick=async()=>{send.disabled=true;try{await sendAttendanceEmail();}catch(e){console.error(e);toast(e.message);}finally{send.disabled=false;}};
  }
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el[ev]=fn; };
  on("#calPrev","onclick",()=>calShift(-1)); on("#calNext","onclick",()=>calShift(1));
  on("#calToday","onclick",()=>{UI.anchor=today(); UI.selectedWeekDay=today(); UI.selectedMuWeekDay=today(); render();});
  on("#calAdd","onclick",()=>recordModal(null, UI.selectedWeekDay || UI.anchor));
  on("#overviewBack","onclick",()=>{UI.overviewRep="";render();});
  on("#recNew","onclick",()=>recordModal());
  on("#muNew","onclick",()=>makeupModal());
  on("#muFilter","onchange",()=>{UI.muFilter=$("#muFilter").value;render();});
}

$("#nav").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ UI.tab=b.dataset.tab; if(UI.tab!=="occurrenceOverview") UI.overviewRep=""; render(); }});
$("#filterBar").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fPreset"){ UI.preset=t.value; if(UI.preset==="adjusted"){const [f,x]=range(); UI.from=UI.from||f; UI.to=UI.to||x;} }
  else if(t.id==="fAnchor") UI.anchor=t.value||today();
  else if(t.id==="fFrom") UI.from=t.value;
  else if(t.id==="fTo") UI.to=t.value;
  else if(t.classList.contains("ffield")) UI[t.dataset.f]=t.value;
  render();
  // Date and period filters operate on the daily IndexedDB cache. Use Sync for a fresh Dataverse pull.
});
$("#filterBar").addEventListener("input",e=>{ if(e.target.id==="fQ"){ UI.q=e.target.value;
  clearTimeout(window._qh); window._qh=setTimeout(render,250); }});
$("#filterBar").addEventListener("click",e=>{ if(e.target.id==="fClear"){
  Object.assign(UI,{preset:"month",anchor:today(),from:null,to:null,dept:"",repName:"",title:"",supervisor:"",manager:"",q:"",type:""}); render(); }});

$("#syncBtn").onclick=async()=>{await clearStateCache("sync clicked");S={employees:[],records:[],makeups:[],settings:{}};await pullFromDataverse(false);};
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

renderNav(); renderFilters(); setSync("Loading local cache...");

</script>
</body>
</html>
