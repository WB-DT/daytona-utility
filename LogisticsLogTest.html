<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workforce — Attendance & Make-Up Tracker v06</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1a2333; --muted:#64748b; --line:#e2e8f0;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --orange:#ea580c;
  --blue:#2563eb; --indigo:#4f46e5; --teal:#0d9488; --rose:#e11d48; --purple:#7c3aed;
  --brand:#0066c0; --brand-ink:#ffffff; --soft:#eef2f7;
  --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --line:#334155; --soft:#1e2a4a;
         --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
a{color:var(--brand)}

header{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.hd h1{font-size:18px;letter-spacing:-.01em}
.hd .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.hd .spacer{flex:1}
.sync-dot{font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;border-bottom:2.5px solid transparent;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:550;white-space:nowrap;border-radius:6px 6px 0 0}
nav button:hover{color:var(--ink);background:var(--soft)}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13.5px;max-width:170px}
.filters label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fgroup{min-width:0}
.chip-clear{border:none;background:var(--soft);color:var(--brand);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:600}

main{max-width:1440px;margin:0 auto;padding:16px}
.cal-card.loa-card{border-left:3.5px solid var(--indigo);background:rgba(99,102,241,0.05)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.kpi.accent{border-left:4px solid var(--accent,var(--brand))}
.two{grid-template-columns:1fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.card h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}

.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--soft);cursor:pointer}
tbody tr.norow:hover{background:none;cursor:default}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:#fff}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--brand)}
.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.badge.ok{background:#dcfce7;color:#166534}
@media (prefers-color-scheme: dark){.badge.warn{background:#453a12;color:#fcd34d}.badge.bad{background:#4a1d1d;color:#fca5a5}.badge.ok{background:#14351f;color:#86efac}}

.btn{border:none;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
.cal-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:86px;padding:6px;cursor:pointer;transition:border-color .1s}
.cal-cell:hover{border-color:var(--brand)}
.cal-cell.dim{opacity:.42}
.cal-cell.today{border-color:var(--brand);border-width:2px}
.cal-cell .d{font-size:12.5px;font-weight:700}
.cal-mini{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.dot{width:auto;min-width:17px;height:17px;border-radius:6px;font-size:10.5px;font-weight:700;color:#fff;display:inline-grid;place-items:center;padding:0 4px}
@media(max-width:640px){.cal-cell{min-height:56px;padding:4px}.cal-mini .dot{min-width:14px;height:14px;font-size:9px}}
.cal-list .day-block{margin-bottom:14px}

.mu-chip{display:block;background:var(--purple);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-chip.Pending{background:#d97706}
.mu-chip.Approved{background:var(--purple)}
.mu-chip.Completed{background:var(--green)}
.mu-chip.Missed{background:var(--red)}

/* Modal sizing update */
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.65);z-index:90;display:grid;place-items:center;padding:24px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal h2{font-size:20px;font-weight:700;margin-bottom:18px}
.mrow{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.mrow>div{flex:1;min-width:180px}
.modal label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px}
.modal textarea{resize:vertical;min-height:160px;line-height:1.5}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}

.muted{color:var(--muted)} .small{font-size:12.5px} .mt{margin-top:12px} .mb{margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
canvas{max-height:280px}
.section-title{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.section-title h2{font-size:16px}
.section-title select{max-width:180px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13.5px}

.cal-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 10px;
  transition: border-color .1s;
}
.cal-row:hover { border-color: var(--brand); }

.modal .cal-row {
  background: var(--bg);
}
.cal-row .row-top {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  width: 100%;
}
.cancelled {
  text-decoration: line-through;
  opacity: 0.6;
}

    .week-board {
  display: grid;
  grid-template-columns: repeat(5, minmax(210px, 1fr));
  gap: 12px;
  align-items: start;
  overflow-x: auto;
  padding-bottom: 12px;
}
@media (max-width: 1100px) {
  .week-board { grid-template-columns: repeat(5, 240px); }
}
  
.col-day {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-height: 520px;
}
.col-day.today {
  border-color: var(--brand);
}
.col-day-hd {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--soft);
  border-top-left-radius: inherit;
  border-top-right-radius: inherit;
}
.col-day.today .col-day-hd {
  background: rgba(0, 102, 192, 0.12);
}
.col-day-body {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;

<script>
"use strict";

let syncCoverDepth = 0;
function showSyncCover(message = "Connecting to Dataverse...", title = "Syncing Workforce data") {
  syncCoverDepth += 1;
  const cover = document.getElementById("syncCover");
  const titleEl = document.getElementById("syncCoverTitle");
  const messageEl = document.getElementById("syncCoverMessage");
  if (titleEl) titleEl.textContent = title;
  if (messageEl) messageEl.textContent = message;
  if (cover) {
    cover.classList.add("show");
    cover.setAttribute("aria-hidden", "false");
  }
  document.body.classList.add("syncing");
}
function updateSyncCover(message) {
  const messageEl = document.getElementById("syncCoverMessage");
  if (messageEl && message) messageEl.textContent = message;
}
function hideSyncCover(force = false) {
  syncCoverDepth = force ? 0 : Math.max(0, syncCoverDepth - 1);
  if (syncCoverDepth > 0) return;
  const cover = document.getElementById("syncCover");
  if (cover) {
    cover.classList.remove("show");
    cover.setAttribute("aria-hidden", "true");
  }
  document.body.classList.remove("syncing");
}


const DATAVERSE_URL = "https://org23279050.crm.dynamics.com";
const TABLE_TIMEOFF = "cr714_timeoff_2s";
const TABLE_ATTENDANCE = "cr714_csrattendancetrackers";

const msalConfig = {
  auth: {
    clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
    authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",

// MSAL tokens use sessionStorage to avoid persistent localStorage growth.
// ACT authentication helper. Uses the exact selected account and tenant authority
// to avoid multiple_matching_tokens cache collisions.
window.getToken = async function(scopeStr, silentFallback = false) {
  let account = msalAccount || null;

  if (!account) {
    const activeAccounts = msalInstance.getAllAccounts();
    if (activeAccounts.length > 0) account = activeAccounts[0];
  }

  const request = {
    scopes: scopeStr.split(" "),
    account,
    authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401"
  };

  try {
    return (await msalInstance.acquireTokenSilent(request)).accessToken;
  } catch (error) {
    if (silentFallback) {
      console.warn(`Silent token fetch failed for ${scopeStr}. Error: ${error.message}`);
      throw error;
    }

    console.log(`Interactive token request needed for ${scopeStr}`);
    const response = await msalInstance.acquireTokenPopup(request);
    if (response.account) msalAccount = response.account;
    return response.accessToken;
  }
};


const AUTO_REFRESH_MS=5*60*1000;
let autoRefreshTimer=null,refreshInFlight=false,lastSuccessfulRefresh=0;
async function refreshWorkforceData(reason="automatic"){
  if(refreshInFlight||!msalAccount||document.hidden||!navigator.onLine)return;
  refreshInFlight=true;
  try{await pullFromDataverse(true);lastSuccessfulRefresh=Date.now();setSync(`Auto-refreshed ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`);}
  catch(err){console.warn(`${reason} refresh failed`,err);}finally{refreshInFlight=false;}
}
function startAutoRefresh(){
  clearInterval(autoRefreshTimer);
  autoRefreshTimer=setInterval(()=>refreshWorkforceData("timer"),AUTO_REFRESH_MS);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-lastSuccessfulRefresh>AUTO_REFRESH_MS)refreshWorkforceData("window resumed");});
window.addEventListener("online",()=>refreshWorkforceData("connection restored"));
window.onload = async () => {
  try {
    await hydrateStateCache();
    const redirectResponse = await msalInstance.handleRedirectPromise();
    const accounts = msalInstance.getAllAccounts();
    msalAccount = redirectResponse?.account || accounts[0] || null;

    if (msalAccount) {
      if (!S.employees || S.employees.length === 0) {
        await pullFromDataverse(false);
      } else {
        await pullFromDataverse(true);
      }
      lastSuccessfulRefresh=Date.now();
      startAutoRefresh();
    }
  } catch (err) {
    console.error("MSAL init error:", err);
  }
};

async function getDataverseToken() {
  const dataverseScope = `${DATAVERSE_URL}//user_impersonation`;

  if (!msalAccount) {
    const accounts = msalInstance.getAllAccounts();
    msalAccount = accounts[0] || null;
  }

  if (!msalAccount) {
    updateSyncCover("Waiting for Microsoft sign-in...");
    const loginResponse = await msalInstance.loginPopup({
      scopes: ["User.Read", dataverseScope]
    });
    msalAccount = loginResponse.account;
  }

  return window.getToken(dataverseScope);
}

function to12Hour(timeStr) {
  if (!timeStr) return "";
  let s = String(timeStr).trim();
  if (/AM|PM/i.test(s)) {
    return s.replace(/\s*(AM|PM)/i, " $1").toUpperCase();
  }
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (!match) return s;
  let h = parseInt(match[1], 10), m = match[2];
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function formatDuration(hStr) {
  if (!hStr) return "";
  let s = String(hStr).trim();
  let totalMinutes = 0;
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (match) {
    totalMinutes = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
  } else if (!isNaN(parseFloat(s))) {
    totalMinutes = Math.round(parseFloat(s) * 60);
  } else {
    return s;
  }
  const hrs = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;
  if (hrs > 0 && mins > 0) return `${hrs}h ${mins}m`;
  if (hrs > 0) return `${hrs} hr${hrs > 1 ? 's' : ''}`;
  return `${mins} mins`;
}

function cleanMakeUpString(str) {
  if (!str) return "";
  return String(str).split(',').map(entry => {
    const parts = entry.split(' - ').map(p => p.trim());
    if (parts.length >= 3) {
      const datePart = parts[0];
      const timeRange = parts[1].split('-').map(t => to12Hour(t.trim())).join(' - ');
      const dur = formatDuration(parts[2]);
      return `${datePart} - ${timeRange} - ${dur}`;
    }
    return entry;
  }).join(', ');
}

function formatReadableNotes(notes) {
  if (!notes) return "";
  let s = String(notes);
  s = s.replace(/(Schedule:|Rep Notes:|Lunch Selection:|Total Hours:|Total Make-up Hours:|Extended Lunch Duration:|Worked)/gi, '\n$1');
  s = s.replace(/\n\s*\n/g, '\n').trim();
  return s;
}

function getRelevantMakeUpNotes(notes, currentDate) {
  if (!notes || !currentDate) return notes;
  const lines = notes.split('\n');
  const [cY, cM, cD] = currentDate.split('-');
  const targetUS = `${cM}/${cD}/${cY}`;

  const filteredLines = lines.filter(line => {
    const dateMatch = line.match(/(\d{2}\/\d{2}\/\d{4})/);
    if (dateMatch) {
      return line.includes(targetUS);
    }
    return true;
  });

  return filteredLines.join('\n');
}

function normalizeTimeRange(str) {
  if (!str) return "";
  return String(str).replace(/(\d{1,2}:\d{2}(?::\d{2})?)/g, match => format12Hour(match));
}

function hoursToHHMM(val) {
  if (val == null || isNaN(val)) return "00:00";
  const totalMinutes = Math.round(parseFloat(val) * 60);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function formatChipTime(notes) {
  if (!notes) return "";
  const matches = [...notes.matchAll(/(\d{1,2}:\d{2}\s*(?:AM|PM))/gi)];
  if (matches.length >= 2) {
    return `${matches[0][1].toUpperCase()} - ${matches[1][1].toUpperCase()}`;
  }
  return "";
}

function extractShiftHours(r) {
  if (r.type === "Shift Trade" && r.shiftTrade) {
    return r.shiftTrade;
  }

  if (r.partialShift) {
    let s = String(r.partialShift).trim();
    const milMatch = s.match(/^(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})$/);
    if (milMatch) {
      const formatMil = (h, m) => {
        let hr = parseInt(h, 10);
        const min = m;
        const ampm = hr >= 12 ? "PM" : "AM";
        hr = hr % 12 || 12;
        return `${hr}:${min} ${ampm}`;
      };
      return `${formatMil(milMatch[1], milMatch[2])} - ${formatMil(milMatch[3], milMatch[4])}`;
    }
    return s;
  }

  if (r.type && (r.type.includes("PTO") || r.type === "Absent" || r.type === "LOA") && r.hours) {
    return `${parseFloat(r.hours)} h`;
  }

  const notes = r.notes || "";
  const timeMatch = notes.match(/(\d{1,2}:\d{2}\s*(?:AM|PM))\s*[–-]\s*(\d{1,2}:\d{2}\s*(?:AM|PM))/i);
  if (timeMatch) {
    return `${timeMatch[1].toUpperCase()} - ${timeMatch[2].toUpperCase()}`;
  }

  if (r.hours) {
    return `${parseFloat(r.hours)} h`;
  }

  return "—";
}

function parseDatesToIso(dateStr) {
  // Form request-date fields are calendar dates, not instants. The YYYY-MM-DD
  // or MM/DD/YYYY portion is preserved exactly even when an API appends a UTC
  // time or offset suffix.
  // Form request-date fields only. createdon/modifiedon are migration or load
  // timestamps and must never become attendance dates.
  if (!dateStr) return [];
  const text = String(dateStr).trim();
  const matches = [...text.matchAll(/(\d{1,2})\/(\d{1,2})\/(\d{4})|(?<!\d)(\d{4})-(\d{2})-(\d{2})(?!\d)/g)];
  const parsed = matches.map(m => m[1]
    ? `${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`
    : `${m[4]}-${m[5]}-${m[6]}`);
  if (!parsed.length) return [];
  const d1 = parsed[0], d2 = parsed[1] || d1;
  if (d1 === d2) return isWeekend(d1) ? [] : [d1];
  const list = [];
  let cur = parseISO(d1), target = parseISO(d2);
  if (cur > target) return [d1, d2];
  while (cur <= target && list.length < 370) {
    const iso = isoDate(cur);
    if (!isWeekend(iso)) list.push(iso);
    cur.setDate(cur.getDate() + 1);
  }
  return list;
}
function mapLeaveType(val) {
  const raw=String(val||"").trim();
  if(!raw)return "Present";
  const s=raw.toLowerCase().replace(/[\/_-]+/g," ").replace(/\s+/g," ").trim();
  if(/\b(present|worked|working)\b/.test(s))return "Present";
  if(/\b(no call no show|ncns)\b/.test(s))return "NCNS";
  if(/\b(tardy|late)\b/.test(s))return "Tardy";
  if(/\b(short shift|left early|leave early|partial shift)\b/.test(s))return "Short Shift";
  if(/\b(leave of absence|loa)\b/.test(s))return "LOA";
  if(/\b(jury|bereavement)\b/.test(s))return "Jury Duty / Bereavement";
  if(/\b(shift trade|shift swap)\b/.test(s))return "Shift Trade";
  if(/\b(make up|makeup)\b/.test(s))return "Make up Time";
  if(/\b(schedule adjustment|adjusted|adjsuted|extended shift|extended lunch|night manager|oss|tom time)\b/.test(s))return "Schedule Adjustment";
  if(/\b(cancel|cancelled|canceled|cancellation)\b/.test(s))return "Cancellation";
  if(/\b(pto|planned|planned time off|vacation|personal time)\b/.test(s))return "PTO";
  if(/\b(call out|callout|absent|unplanned|sick)\b/.test(s))return "Call Out";
  if(/\b(final|verbal|written|term|termination)\b/.test(s))return "Present";
  console.warn("Unmapped leave type, preserving without creating an occurrence:",raw);
  return "Present";
}
function lunchDeductionFromRecord(r){
  const text=String(r.cr714_lunch||r.cr714_requestnotes||"").toLowerCase();
  if(text.includes("half lunch"))return 0.5;
  if(text.includes("not taking lunch")||text.includes("no lunch"))return 0;
  if(text.includes("taking a lunch")||text.includes("lunch selection"))return 1;
  return 0;
}
function partialShiftWorkedHours(r){
  const raw=String(r.cr714_hoursofpartialshift||"");
  const ranges=[...raw.matchAll(/(\d{1,2}):(\d{2})\s*(AM|PM)?\s*[-–]\s*(\d{1,2}):(\d{2})\s*(AM|PM)?/gi)];
  const toHours=(h,m,ampm)=>{h=Number(h);m=Number(m);ampm=String(ampm||"").toUpperCase();if(ampm==="PM"&&h<12)h+=12;if(ampm==="AM"&&h===12)h=0;return h+(m/60);};
  let total=0;
  ranges.forEach(m=>{let a=toHours(m[1],m[2],m[3]),b=toHours(m[4],m[5],m[6]);if(b<=a)b+=24;total+=b-a;});
  if(!ranges.length)return null;
  return Math.max(0,Math.round((total-lunchDeductionFromRecord(r))*100)/100);
}
function parseHours(r,mappedType=mapLeaveType(r.cr714_leavetype)){
  const pto=Number.parseFloat(r.cr714_ptohoursrequested);
  const worked=partialShiftWorkedHours(r);
  // The form submits PTO/call-out/jury hours as a requested total. For short
  // shifts and make-up-time requests, cr714_hoursofpartialshift is the time
  // actually worked and is the authoritative record-hour result.
  if(["Short Shift","Make up Time","Schedule Adjustment"].includes(mappedType)&&worked!==null)return worked;
  if(Number.isFinite(pto))return Math.max(0,pto);
  if(worked!==null)return worked;
  // Do not invent eight hours when the form did not submit an hour result.
  return 0;
}
function parseMakeUpHours(r) {
  const raw = String(r.cr714_makeuptime || r.notes || "");
  const totalMatch = raw.match(/Total Hours:\s*([\d:]+)/i);
  if (totalMatch) {
    const tStr = totalMatch[1];
    if (tStr.includes(':')) {
      const [hh, mm] = tStr.split(':').map(Number);
      return (hh || 0) + ((mm || 0) / 60);
    } else if (!isNaN(parseFloat(tStr))) {
      return parseFloat(tStr);
    }
  }

  if (r.cr714_makeuptime) {
    let total = 0;
    const parts = String(r.cr714_makeuptime).split(',');
    for (const part of parts) {
      const segments = part.split('-');
      if (segments.length >= 3) {
        const hStr = segments[segments.length - 1].trim();
        if (hStr.includes(':')) {
          const [hh, mm] = hStr.split(':').map(Number);
          total += (hh || 0) + ((mm || 0) / 60);
        } else if (!isNaN(parseFloat(hStr))) {
          total += parseFloat(hStr);
        }
      }
    }
    if (total > 0) return Math.round(total * 100) / 100;
  }
  return 0.5;
}

function parseMakeUpSegments(value) {
  const raw = String(value || "").replace(/\r/g, "\n").trim();
  if (!raw) return [];
  const segments = [];
  // Entries are normally comma/newline separated. Times may or may not have
  // spaces around their internal hyphen, e.g. 7:30 AM-8:00 AM.
  const entryRx = /(\d{1,2}\/\d{1,2}\/\d{4})\s*-\s*(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?)\s*-\s*(\d{1,2}:\d{2}(?::\d{2})?\s*(?:AM|PM)?)\s*-\s*(\d+(?::\d{1,2})?|\d*\.\d+)/gi;
  let match;
  while ((match = entryRx.exec(raw)) !== null) {
    const [mmRaw, ddRaw, yyyy] = match[1].split("/");
    const mm = mmRaw.padStart(2, "0"), dd = ddRaw.padStart(2, "0");
    const duration = match[4];
    let hours = 0;
    if (duration.includes(":")) {
      const [hh, min] = duration.split(":").map(Number);
      hours = (hh || 0) + ((min || 0) / 60);
    } else {
      hours = Number(duration) || 0;
    }
    segments.push({
      date: `${yyyy}-${mm}-${dd}`,
      displayDate: `${mm}/${dd}/${yyyy}`,
      start: match[2].trim(),
      end: match[3].trim(),
      duration,
      hours: Math.round(hours * 100) / 100
    });
  }
  return segments;
}

async function fetchAllOData(url, headers) {
  const rows = [];
  let next = url;
  while (next) {
    const res = await fetch(next, { headers });
    if (!res.ok) throw new Error(`Dataverse HTTP ${res.status}: ${res.statusText}`);
    const data = await res.json();
    rows.push(...(data.value || []));
    next = data["@odata.nextLink"] || null;
  }
  return rows;
}
function odataDateTimeStart(iso) { return `${iso}T00:00:00Z`; }
function odataDateTimeEnd(iso) { return `${iso}T23:59:59Z`; }
function normalizeMatchId(value) {
  const v = String(value ?? "").trim().toUpperCase();
  return v || null;
}
function occurrenceNumber(value) {
  if (value === null || value === undefined) return null;
  if (typeof value === "boolean") return value ? 1 : 0;
  if (typeof value === "number") return Number.isFinite(value) ? value : null;
  const text = String(value).trim().toLowerCase().replace(/[.!]+$/g, "").trim();
  if (!text) return null;
  if (["true", "yes", "y", "1"].includes(text)) return 1;
  if (["false", "no", "n", "0"].includes(text)) return 0;
  const n = Number(text);
  if (Number.isFinite(n)) return n;
  const occurrenceMatch = text.match(/(?:occ(?:urrence)?\s*[:=-]?\s*)?(-?\d+(?:\.\d+)?)\s*(?:occ(?:urrence)?s?)?/i);
  if (occurrenceMatch) {
    const parsed = Number(occurrenceMatch[1]);
    return Number.isFinite(parsed) ? parsed : null;
  }
  return null;
}
function uniqueBy(items, keyFn) {
  const seen = new Set();
  return (items || []).filter((item, index) => {
    const key = keyFn(item, index);
    if (!key) return true;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function recordDedupeKey(r) {
  if (!r) return "";
  const date=String(r.date||"").trim();
  const dv=String(r.dvId||"").trim().toLowerCase();
  const request=String(r.requestId||"").trim().toLowerCase();
  const rid=String(r.rid||"").trim().toLowerCase();
  // Dataverse requests can expand to legitimate daily rows, so date remains part of identity.
  if (dv) return "dv:"+dv+"|"+date;
  // Manual/synced rows without dvId still dedupe by stable request and date.
  if (request) return "request:"+request+"|"+date;
  if (rid) return "local:"+rid;
  // Legacy fallback prevents identical ID-less rows from multiplying.
  return ["legacy",r.empId,date,r.type,r.submittedOn||r.createdon||"",Number(r.hours||0).toFixed(4)]
    .map(v=>String(v??"").trim().toLowerCase()).join("|");
}
function makeupDedupeKey(m) {
  if (!m) return "";
  // A Dataverse Time Off submission represents one make-up agreement even when
  // cr714_makeuptime contains several scheduled work sessions.
  if (m.dvId) return `dv:${String(m.dvId).trim().toLowerCase()}`;
  if (m.mid) return `local:${String(m.mid).trim().toLowerCase()}`;
  return [m.empId, m.dateMissed, Number(m.hoursOwed || 0).toFixed(4), m.status, m.oss ? 1 : 0]
    .map(v => String(v ?? "").trim().toLowerCase()).join("|");
}
function uniqueRecords(items) { return uniqueBy(items, recordDedupeKey); }
function displayRecordKey(r){const partial=String(r.partialShift||r.shiftTrade||"").trim().toLowerCase().replace(/\s+/g," ");return [r.empId,r.date,r.type,partial].map(v=>String(v??"").trim().toLowerCase()).join("|");}
function consolidatedDisplayRecords(items){const groups=new Map();uniqueRecords(items||[]).forEach(r=>{const key=displayRecordKey(r),existing=groups.get(key);if(!existing){groups.set(key,{...r,_variants:[r]});return;}existing._variants.push(r);existing.waived=existing.waived||r.waived;existing.cancelled=existing._variants.every(x=>!!x.cancelled);existing.fmla=existing.fmla||r.fmla;existing.voicemail=existing.voicemail||r.voicemail;existing.occurrence=Math.max(occurrenceNumber(existing.occurrence)||0,occurrenceNumber(r.occurrence)||0);existing.occurrenceSources=[...new Set([...(existing.occurrenceSources||[existing.occurrenceSource]).filter(Boolean),r.occurrenceSource].filter(Boolean))];existing.occurrenceSource=existing.occurrenceSources.join(" + ");existing.notes=existing.notes||r.notes;existing.attendanceNotes=existing.attendanceNotes||r.attendanceNotes;if(!existing.dvId&&r.dvId)existing.dvId=r.dvId;});return [...groups.values()];}
function uniqueMakeups(items) { return uniqueBy(items, makeupDedupeKey); }
function recalculateAfterDedupe() {
  const beforeRecords = (S.records || []).length;
  const beforeMakeups = (S.makeups || []).length;
  S.records = uniqueRecords(S.records || []);
  S.makeups = uniqueMakeups(S.makeups || []);
  const removedRecords = beforeRecords - S.records.length;
  const removedMakeups = beforeMakeups - S.makeups.length;
  return { removedRecords, removedMakeups };
}

function currentDataRange() {
  const [from, to] = range();
  return from <= to ? [from, to] : [to, from];
}
  
async function pullFromDataverse(silent = false) {
  const [rangeFrom, rangeTo] = currentDataRange();
  const todayIso = today();
  const historyFrom = "2025-01-01";
  // Production history index: both Time Off and CSR Attendance load Jan 1, 2025 through the current day.
  const syncFrom = historyFrom;
  const syncTo = todayIso;
  showSyncCover(`Loading complete history ${fmt(syncFrom)} to ${fmt(syncTo)}...`);
  setSync(`Syncing full Time Off + CSR Attendance history ${fmt(syncFrom)} to ${fmt(syncTo)}...`);
  try {
    const token = await getDataverseToken();
    if (!token) throw new Error("Authentication missing");
    const headers = {
      "Authorization": `Bearer ${token}`,

  async function cancelRecordRequest(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  if (!confirm("Are you sure you want to cancel this request? It will remain visible but crossed out.")) return;

  target.cancelled = true;
  const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;
  S.records.filter(r => r.rid.startsWith(basePrefix)).forEach(r => r.cancelled = true);
  S.makeups.filter(m => m.mid === basePrefix || m.rid.startsWith(basePrefix) || m.dvId === target.dvId).forEach(m => m.status = "Cancelled");

  save();
  closeModal();
  render();
  toast("Request cancelled");
}

  async function toggleCancelRecord(rid){
  const target=S.records.find(r=>r.rid===rid);if(!target)return;
  const newState=!target.cancelled;
  try{
    if(target.dvId)await patchDataverseRecord(target.dvId,{cr714_cancelledrequest:newState});
    else if(target.attendanceId)throw new Error("CSR Attendance does not expose a cancellation field. Edit the CSR row or update its occurrence instead.");
    else throw new Error("Dataverse record ID is missing.");
    S.records.filter(r=>target.dvId&&r.dvId===target.dvId).forEach(r=>r.cancelled=newState);
    S.makeups.filter(m=>m.dvId===target.dvId).forEach(m=>m.status=newState?"Cancelled":"Pending");
    save();closeModal();render();toast(newState?"Request cancelled in Dataverse":"Request restored in Dataverse");
  }catch(err){console.error(err);toast(err.message);}
}
async function deleteRecordFromDataverse(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  if (!confirm("Are you sure you want to permanently delete this record from Dataverse?")) return;

  if (target.dvId) {
    setSync("Deleting from Dataverse...");
    try {
      const token = await getDataverseToken();
      if (!token) throw new Error("Authentication missing");

      const res = await fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}(${target.dvId})`, {
        method: "DELETE",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/json",
          "OData-MaxVersion": "4.0",
          "OData-Version": "4.0"
        }
      });

      if (!res.ok && res.status !== 204 && res.status !== 404) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
    } catch (err) {
      console.error("Delete failed:", err);
      toast("Failed to delete from Dataverse: " + err.message);
      setSync("");
      return;
    }
  }

  const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;
  S.records = S.records.filter(r => !r.rid.startsWith(basePrefix));
  S.makeups = S.makeups.filter(m => m.mid !== basePrefix && m.dvId !== target.dvId);

  save();
  closeModal();
  render();
  setSync("");
  toast("Record deleted from Dataverse permanently");
}

async function dataversePatch(tableName,recordId,payload,label){
  if(!recordId)throw new Error(`${label||"Dataverse"} record ID is missing`);
  const token=await getDataverseToken();
  if(!token)throw new Error("Authentication missing");
  const cleanId=String(recordId).replace(/[{}]/g,"");
  const res=await fetch(`${DATAVERSE_URL}/api/data/v9.2/${tableName}(${cleanId})`,{method:"PATCH",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json",Accept:"application/json","OData-MaxVersion":"4.0","OData-Version":"4.0","If-Match":"*"},body:JSON.stringify(payload)});
  if(!res.ok&&res.status!==204){const text=await res.text();throw new Error(`${label||"Dataverse"} PATCH failed [${res.status}]: ${text||res.statusText}`);}
  return true;
}

function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoDate(d); }
function fmt(s){ if(!s) return "—"; return parseISO(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function fmtShort(s){ return parseISO(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2800); }

function range(){
  const a = UI.anchor||today(), d = parseISO(a);
  switch(UI.preset){
    case "day":     return [a,a];
    case "week": {  const dow=d.getDay(); const s=addDays(a,-dow); return [s, addDays(s,6)]; }
    case "month": { const s=new Date(d.getFullYear(),d.getMonth(),1), e=new Date(d.getFullYear(),d.getMonth()+1,0); return [isoDate(s),isoDate(e)]; }
    case "quarter":{const q=Math.floor(d.getMonth()/3); const s=new Date(d.getFullYear(),q*3,1), e=new Date(d.getFullYear(),q*3+3,0); return [isoDate(s),isoDate(e)]; }
    case "annual":{ return [d.getFullYear()+"-01-01", d.getFullYear()+"-12-31"]; }
    case "adjusted": return [UI.from||a, UI.to||a];
  }
  return [a,a];
}

function canonicalRecordType(r){
  if(!r)return "Present";
  if(r.calendarTypeSource==="cr714_leavetype"||r.dvId)return mapLeaveType(r.rawLeaveType||r.type);
  if(r.calendarTypeSource==="cr714_typeofleave"||r.source==="csr-attendance"||r.attendanceId)return mapLeaveType(r.rawLeaveType||r.attendanceLeaveType||r.type);
  return mapLeaveType(r.rawLeaveType||r.type);
}
function normalizeRecordType(r){const type=canonicalRecordType(r);return type===r.type?r:{...r,type};}
function calendarRecords(records){
  // Calendar shows one active form-derived badge per employee/day.
  // Cancellation submissions are actions, not leave badges.
  const normalized=consolidatedDisplayRecords((records||[]).map(normalizeRecordType))
    .filter(r=>!r.cancelled&&canonicalRecordType(r)!=="Cancellation"&&canonicalRecordType(r)!=="Present");
  const byEmployeeDay=new Map();
  normalized.forEach(r=>{
    const key=`${r.empId}|${r.date}`;
    const current=byEmployeeDay.get(key);
    if(!current){byEmployeeDay.set(key,r);return;}
    const currentForm=!!(current.dvId||current.calendarTypeSource==="cr714_leavetype");
    const candidateForm=!!(r.dvId||r.calendarTypeSource==="cr714_leavetype");
    if(candidateForm&&!currentForm){byEmployeeDay.set(key,r);return;}
    if(candidateForm===currentForm){
      const currentTs=getRecordTimestamp(current),candidateTs=getRecordTimestamp(r);
      const currentKey=String(current.dvId||current.rid||""),candidateKey=String(r.dvId||r.rid||"");
      if(candidateTs>currentTs||(candidateTs===currentTs&&candidateKey.localeCompare(currentKey)>0))byEmployeeDay.set(key,r);
    }
  });
  return [...byEmployeeDay.values()];
}
function calendarTypeSummary(records) {
  const byType = {};
  calendarRecords(records).forEach(r => {
    if (!r || r.type === "Present" || r.cancelled) return;
    const type = r.type || "Absent";
    const bucket = byType[type] || { count: 0, hours: 0, requests: new Set() };
    const requestKey = r.requestId || r.dvId || r.rid;
    if (!bucket.requests.has(requestKey)) { bucket.requests.add(requestKey); bucket.count += 1; }
    bucket.hours += Number(r.hours || 0);
    byType[type] = bucket;
  });
  return byType;
}
function calendarDot(type, summary) {
  const tObj = TYPES[type] || { color: "var(--muted)", abbr: type.slice(0,2).toUpperCase() };
  const count = summary?.count || 0;
  const hours = Math.round((summary?.hours || 0) * 100) / 100;
  const ptoTitle = type === "PTO" ? ` · ${hours}h` : "";
  return `<span class="dot" title="${esc(type)}: ${count} request${count===1?"":"s"}${ptoTitle}" style="background:${tObj.color}">${count>1?count:tObj.abbr}</span>`;
}

function renderCalendar(){
  const [f,t]=range();
  const recs=calendarRecords(filteredRecords()), byDate={};
  recs.forEach(r=>{(byDate[r.date]=byDate[r.date]||[]).push(r);});
  
  const totalEmps = filteredEmployees().length || 0; 
  const empIds = new Set(filteredEmployees().map(e => e.id));
  
  const mus = uniqueMakeups((S.makeups||[]).filter(m => empIds.has(m.empId) && m.status !== "Cancelled" && m.status !== "Missed"));
  const muByDate = {};
  mus.forEach(m => { (muByDate[m.dateMissed] = muByDate[m.dateMissed] || []).push(m); });

  const head=`<div class="cal-head">
    <button class="btn ghost sm" id="calPrev">&#8249;</button>
    <button class="btn ghost sm" id="calToday">Today</button>
    <button class="btn ghost sm" id="calNext">&#8250;</button>
    <h2>${fmt(f)}${f!==t?" – "+fmt(t):""}</h2>
    <button class="btn sm right" id="calAdd">+ Add record</button>
  </div>`;

  // 5-Column Week View (Monday - Friday)
  if(UI.preset==="week" || (UI.preset==="adjusted" && addDays(f,10)>t && addDays(f,1)<=t)){
    let days = []; 
    let baseDate = parseISO(f);
    let dayOfWeek = baseDate.getDay();
    
    let diffToMonday = dayOfWeek === 0 ? 1 : 1 - dayOfWeek;
    baseDate.setDate(baseDate.getDate() + diffToMonday);
    
    let cur = isoDate(baseDate);
    for(let i = 0; i < 5; i++) {
      days.push(cur);
      cur = addDays(cur, 1);
    }

    const dows = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    const boardColsHtml = days.map(ds => {
      const dObj = parseISO(ds);
      const dowName = dows[dObj.getDay()];
      const isToday = ds === today();
      const allDayRecords = calendarRecords(byDate[ds] || []);

      // Separate LOA from standard records
      const standardDayRecs = allDayRecords
        .filter(r => r.type !== "Present" && r.type !== "LOA")
        .sort((a,b) => getRecordTimestamp(b) - getRecordTimestamp(a));
      
      const uniqueDayRecs=calendarRecords(standardDayRecs);

      // Deduplicate LOA so each employee appears at most once per day
      const seenLoaEmps = new Set();
      const loaRecs = allDayRecords
        .filter(r => canonicalRecordType(r) === "LOA" && !r.cancelled)
        .filter(r => {
          if (seenLoaEmps.has(r.empId)) return false;
          seenLoaEmps.add(r.empId);
          return true;
        })
        .sort((a,b) => (emp(a.empId)?.name || "").localeCompare(emp(b.empId)?.name || ""));

      const dayMus = muByDate[ds] || [];
      const absentEmpIds = new Set(
        allDayRecords
          .filter(r => !r.cancelled && !["Present", "Shift Trade", "Cancellation"].includes(r.type))
          .map(r => r.empId)
      );
      const presentCount = Math.max(0, totalEmps - absentEmpIds.size);

      // Make-Up cards (Top)
      const muCardsHtml = dayMus.map(m => {
        const e = emp(m.empId) || {name: m.empId};
        const timeFrame = m.scheduleSegments && m.scheduleSegments[0] 
          ? `${m.scheduleSegments[0].start} - ${m.scheduleSegments[0].end}` 
          : `${hoursToHHMM(m.hoursOwed)}h`;

        return `<div class="cal-card mu-card" onclick="makeupModal('${esc(m.mid)}')" title="Click to view Make-Up details">
          <div class="row" style="justify-content:space-between; align-items:flex-start; gap:6px;">
            <span class="cal-card-name" style="color:var(--purple);">${esc(e.name)}</span>
            <span class="badge ${m.status==='Completed'?'ok':m.status==='Approved'?'':'warn'}" style="font-size:9.5px; padding:1px 5px;">${esc(m.status)}</span>
          </div>
          <div class="cal-card-time">${esc(timeFrame)}</div>
          <div class="cal-card-badges">
            <span class="badge" style="background:var(--purple); color:#fff; font-size:10.5px;">Make-Up Shift</span>
          </div>
        </div>`;
      }).join("");

      // Standard exception cards (Middle)
      const recCardsHtml = uniqueDayRecs.map(r => {
        const e = emp(r.empId) || {name: r.empId};
        const shiftDisplay = extractShiftHours(r);
        const topBadges = [
          r.waived ? `<span class="badge ok" style="font-size:9.5px; padding:1px 5px;">waived</span>` : null,
          r.cancelled ? `<span class="badge bad" style="font-size:9.5px; padding:1px 5px;">Cancelled</span>` : null
        ].filter(Boolean).join(" ");

        const bottomTags = [
          r.fmla ? `<span class="badge" style="background:var(--indigo); color:#fff; font-size:9.5px; padding:1px 5px;">FMLA</span>` : null,
          r.voicemail ? `<span class="badge" style="background:var(--amber); color:#fff; font-size:9.5px; padding:1px 5px;">VM</span>` : null
        ].filter(Boolean).join(" ");

        return `<div class="cal-card ${r.cancelled ? 'cancelled' : ''}" data-rec="${esc(r.rid)}" title="Click to view or edit details">
          <div class="row" style="justify-content:space-between; align-items:flex-start; gap:6px;">
            <span class="cal-card-name">${esc(e.name)}</span>
            ${topBadges ? `<span style="display:flex; gap:3px;">${topBadges}</span>` : ""}
          </div>
          <div class="cal-card-time">${esc(shiftDisplay)}</div>
          <div class="cal-card-badges">
            ${pill(canonicalRecordType(r))}
            ${bottomTags}
          </div>
        </div>`;
      }).join("");

      // Deduplicated LOA cards (Bottom)
      const loaCardsHtml = loaRecs.map(r => {
        const e = emp(r.empId) || {name: r.empId};
        const noteText = r.notes || r.wfNotes || "Leave of Absence";

        return `<div class="cal-card loa-card" data-rec="${esc(r.rid)}" title="Click to view LOA details">
          <div class="row" style="justify-content:space-between; align-items:flex-start; gap:6px;">
            <span class="cal-card-name" style="color:var(--indigo);">${esc(e.name)}</span>
            <span class="badge" style="background:var(--indigo); color:#fff; font-size:9.5px; padding:1px 5px;">LOA</span>
          </div>
          <div class="cal-card-time" style="font-size:11.5px; color:var(--muted);">${esc(noteText)}</div>
        </div>`;
      }).join("");

      const totalItems = uniqueDayRecs.length + dayMus.length + loaRecs.length;
      const hasEntries = totalItems > 0;

      return `<div class="col-day ${isToday ? 'today' : ''}">
        <div class="col-day-hd">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <div>
              <div style="font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;">${dowName}</div>
              <div style="font-size:17px; font-weight:750;">${dObj.getDate()}</div>
            </div>
            <button class="btn ghost sm" data-add-day="${ds}" title="Add record for this day" style="padding:2px 7px; font-size:11px;">+ Add</button>
          </div>
          <div class="small muted mt" style="font-size:11px; margin-top:4px;">
            ${presentCount}/${totalEmps} present · ${totalItems} items
          </div>
        </div>
        <div class="col-day-body">
          ${hasEntries ? `${muCardsHtml}${recCardsHtml}${loaCardsHtml}` : `<div class="empty" style="padding:24px 6px; font-size:12px;">No requests</div>`}
        </div>
      </div>`;
    }).join("");

    return head + `<div class="week-board mt">${boardColsHtml}</div>`;
  }

  // Day View
  if(UI.preset==="day"){
    let d = f;
    const allRs = byDate[d]||[];
    const dayMus = muByDate[d]||[];
    const presentCount = allRs.filter(r => r.type === "Present").length;
    const rs=allRs.filter(r => r.type !== "Present").sort((a,b) => getRecordTimestamp(b) - getRecordTimestamp(a));
    
    return head+`<div class="day-block card"><div class="row"><b>${fmtShort(d)}</b><span class="small muted">${presentCount}/${totalEmps} present · ${rs.length} record${rs.length===1?"":"s"} · ${dayMus.length} make-ups</span>
      <button class="btn ghost sm right" data-add-day="${d}">+ Add</button></div>
      ${rs.length || dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:8px;">
        ${dayMus.map(m => muRow(m)).join("")}
        ${rs.map(r=>rowRecord(r,true)).join("")}
      </div>`:`<div class="small muted mt">No records or make-ups.</div>`}
    </div>`;
  }

  // Month & Annual Grid Views
  const months=[]; let d=parseISO(f); d.setDate(1);
  while(isoDate(d)<=t){ months.push(new Date(d)); d.setMonth(d.getMonth()+1); }
  const dows=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  
  return head+months.map(m0=>{
    const y=m0.getFullYear(), mo=m0.getMonth();
    const first=new Date(y,mo,1), last=new Date(y,mo+1,0);
    const lead=first.getDay();
    let cells="";
    for(let i=0;i<lead;i++) cells+=`<div></div>`;
    
    for(let day=1;day<=last.getDate();day++){
      const ds=isoDate(new Date(y,mo,day)), rs=byDate[ds]||[], dMus = muByDate[ds]||[];
      const presentCount = rs.filter(r => r.type === "Present").length;
      const agg={};
      calendarRecords(rs).forEach(r=>{const ty=canonicalRecordType(r);if(ty!=="Present")agg[ty]=(agg[ty]||0)+1;});
      const dim=ds<f||ds>t, isToday=ds===today();
      
      cells+=`<div class="cal-cell ${dim?"dim":""} ${isToday?"today":""}" data-day="${ds}">
        <div class="row"><div class="d">${day}</div><div class="right muted" style="font-size:10.5px; font-weight:600;">${presentCount}/${totalEmps}</div></div>
        <div class="cal-mini">
          ${Object.entries(agg).map(([ty,n])=> {
            const tObj = TYPES[ty] || { color: "var(--muted)", abbr: ty.slice(0,2).toUpperCase() };
            return `<span class="dot" title="${esc(ty)}:${n}" style="background:${tObj.color}">${n>1?n:tObj.abbr}</span>`;
          }).join("")}
          ${dMus.length ? `<span class="dot" title="Make-Up Shifts: ${dMus.length}" style="background:#fff; color:var(--purple); border:1.5px solid var(--purple); font-weight:800;">${dMus.length} MU</span>` : ""}
        </div>
      </div>`;
    }
    return `<div class="mb"><h3 class="mt" style="font-size:15px">${m0.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h3>
      <div class="cal-grid mt">${dows.map(w=>`<div class="cal-dow">${w}</div>`).join("")}${cells}</div></div>`;
  }).join("") + `<div class="card mt"><div class="row small">${TYPE_NAMES.map(t2=>`<span class="row" style="gap:4px"><span class="dot" style="background:${TYPES[t2].color}">${TYPES[t2].abbr}</span>${t2}</span>`).join("")}</div></div>`;
}

function filteredEmployees(){
  if (!S.employees) return [];
  const q = UI.q.trim().toLowerCase();
  return S.employees.filter(e =>
    (!UI.dept||e.dept===UI.dept) && 
    (!UI.repName||e.name===UI.repName) && 
    (!UI.title||e.title===UI.title) &&
    (!UI.supervisor||e.supervisor===UI.supervisor) && 
    (!UI.manager||e.manager===UI.manager) &&
    (!q || e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q))
  );
}

function filteredRecords(from,to){
  if (!S.records) return [];
  const ids = new Set(filteredEmployees().map(e=>e.id));
  const [f,t] = from?[from,to]:range();
  return consolidatedDisplayRecords(S.records.filter(r => ids.has(r.empId) && r.date>=f && r.date<=t && (!UI.type || canonicalRecordType(r) === UI.type)));
}

function emp(id){ return S.employees?.find(e=>e.id===id); }
function isOcc(r){ return !r.cancelled && !r.waived && occurrenceNumber(r.occurrence) > 0; }

function recordOverlapsRange(r,from,to){const start=r.requestStartDate||r.date,end=r.requestEndDate||start;return !!start&&!!end&&start<=to&&end>=from;}
const OCCURRENCE_ELIGIBLE_TYPES=new Set(["Call Out","Short Shift","Tardy","NCNS"]);
function isOccurrenceEligible(r){
  if(!r)return false;
  const type=canonicalRecordType(r);
  return occurrenceNumber(r.occurrence)>0&&!r.cancelled&&!r.waived&&!r.fmla&&OCCURRENCE_ELIGIBLE_TYPES.has(type);
}
function occurrenceSourceRecords(empId,from,to){
  const allowedEmployees=new Set(filteredEmployees().map(e=>e.id));
  if(!allowedEmployees.has(empId))return [];
  return consolidatedDisplayRecords((S.records||[])
    .filter(r=>r.empId===empId&&recordOverlapsRange(r,from,to))
    .map(normalizeRecordType));
}
function expandOccurrenceDates(r,from,to){
  const start=r.requestStartDate||r.date,end=r.requestEndDate||start;
  if(!start||!end||start>end)return [];
  const out=[];
  for(let d=start;d<=end&&out.length<730;d=addDays(d,1))if(d>=from&&d<=to)out.push(d);
  return out;
}
function groupConsecutiveOccurrenceDates(days,maxDays=3){
  const groups=[];let current=[];
  [...new Set(days)].sort().forEach(date=>{
    const consecutive=current.length&&date===addDays(current[current.length-1],1);
    if(!current.length||(consecutive&&current.length<maxDays))current.push(date);
    else{groups.push(current);current=[date];}
  });
  if(current.length)groups.push(current);
  return groups;
}
function occurrenceGroups(empId,from,to){
  // Build the policy-defined occurrence first. Display filters must not rewrite history.
  const source=occurrenceSourceRecords(empId,from,to);
  const eligible=source.filter(isOccurrenceEligible);
  const dateGroups=groupConsecutiveOccurrenceDates(eligible.flatMap(r=>expandOccurrenceDates(r,from,to)),3);
  let groups=dateGroups.map(dates=>{
    const records=source.filter(r=>dates.some(d=>recordOverlapsRange(r,d,d)));
    const activeRecords=records.filter(isOccurrenceEligible);
    const grouped=dates.length>1;
    return {id:`${empId}:${dates[0]}`,dates,grouped,records,activeRecords,hasWaived:records.some(r=>r.waived),hasCancelled:records.some(r=>r.cancelled),visualClass:grouped?"occurrence-group-rainbow":"occurrence-single-green",label:grouped?`Grouped period · ${dates.length} consecutive days`:"Single occurrence"};
  });
  // Type is a visibility filter applied after the actual group has been constructed.
  if(UI.type)groups=groups.filter(g=>g.activeRecords.some(r=>canonicalRecordType(r)===UI.type));
  return groups;
}
function groupedOccurrenceCount(empId,from,to){return occurrenceGroups(empId,from,to).length;}
function occurrenceGroupForDate(empId,date,from,to){return occurrenceGroups(empId,from,to).find(g=>g.dates.includes(date))||null;}
function occurrenceGroupBadge(group){if(!group)return `<span class="small muted">No occurrence</span>`;return group.grouped?`<span class="occurrence-group-mark">Grouped period · ${group.dates.length} consecutive days · 1 occurrence</span>`:`<span class="occurrence-single-mark">Single occurrence</span>`;}
function occCount(empId,asOf){const to=asOf||today(),from=addDays(to,-OCC_WINDOW_DAYS+1);return groupedOccurrenceCount(empId,from,to);}

function level(n){ for(const [k,name,cls] of LADDER) if(n>=k) return {name,cls}; return null; }

function ossUsed(empId, asOf){
  if (!S.makeups) return 0;
  const from = addDays(asOf||today(), -365);
  return uniqueMakeups(S.makeups.filter(m=>m.empId===empId && m.oss && m.status!=="Missed" && m.status!=="Cancelled" && m.dateMissed>=from)).length;
}

function metrics(){
  const [f,t]=range(), emps=filteredEmployees(), recs=filteredRecords();
  const c = {}; TYPE_NAMES.forEach(n=>c[n]=0);
  let occ=0;
  recs.forEach(r=>{ c[r.type]=(c[r.type]||0)+1; });
  const empIdsForOcc=new Set(recs.map(r=>r.empId));
  empIdsForOcc.forEach(id=>{occ+=groupedOccurrenceCount(id,f,t);});

  // Calculate default Present count for weekdays only
  let days=[]; for(let d=f; d<=t; d=addDays(d,1)) { if(!isWeekend(d)) days.push(d); }
  let totalPossibleWorkDays = days.length * emps.length;
  let loggedNonPresent = recs.filter(r => r.type !== "Present").length;
  let explicitPresent = recs.filter(r => r.type === "Present").length;
  
  // Default remaining unlogged days/reps as Present
  c["Present"] = explicitPresent + Math.max(0, totalPossibleWorkDays - (explicitPresent + loggedNonPresent));

  const filteredHours = Math.round(recs.filter(r=>!r.cancelled).reduce((sum,r)=>sum+(Number(r.hours)||0),0)*100)/100;
  const filteredHoursByType = recs.filter(r=>!r.cancelled).reduce((out,r)=>{const type=canonicalRecordType(r);out[type]=Math.round(((out[type]||0)+(Number(r.hours)||0))*100)/100;return out;},{});
  const withRec = new Set(recs.map(r=>r.empId));
  const offenders = new Set(recs.filter(isOcc).map(r=>r.empId));
  const perfect = emps.filter(e=>!offenders.has(e.id));
  const empIds = new Set(emps.map(e=>e.id));
  const mus = uniqueMakeups((S.makeups||[]).filter(m=>empIds.has(m.empId) && m.dateMissed>=f && m.dateMissed<=t));
  const muDone = mus.filter(m=>m.status==="Completed").length;
  
  const denom = c["Present"] + Object.keys(c).filter(k => k !== "Present" && k !== "Make up Time").reduce((acc, k) => acc + c[k], 0);
  const rate = denom ? Math.round(100 * c["Present"] / denom) : null;
  
  return {c, occ, perfect, rate, filteredHours, filteredHoursByType, mus, muDone, muPending:mus.filter(m=>m.status==="Pending").length, emps, recs, from:f, to:t};
}

function renderNav(){
  $("#nav").innerHTML = TABS.map(([k,l])=>`<button class="${UI.tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("");
}
  
function opts(list,cur){ return `<option value="">All</option>`+list.map(v=>`<option ${v===cur?"selected":""} value="${esc(v)}">${esc(v)}</option>`).join(""); }

function renderFilters(){
  const bar=$("#filterBar");
  const depts = [...new Set((S.employees||[]).map(e=>e.dept).filter(Boolean))].sort();
  const reps = [...new Set((S.employees||[]).map(e=>e.name).filter(Boolean))].sort();
  const sups = [...new Set((S.employees||[]).map(e=>e.supervisor).filter(Boolean))].sort();
  const mgrs = [...new Set((S.employees||[]).map(e=>e.manager).filter(Boolean))].sort();
  const [f,t]=range();

  bar.innerHTML=`
    <div class="fgroup"><label>Period</label>
      <select id="fPreset">${["day","week","month","quarter","annual","adjusted"].map(p=>`<option ${UI.preset===p?"selected":""} value="${p}">${p==="adjusted"?"Adjusted (custom)":p[0].toUpperCase()+p.slice(1)}</option>`).join("")}</select></div>
    ${UI.preset==="adjusted"
      ? `<div class="fgroup"><label>From</label><input type="date" id="fFrom" value="${UI.from||f}"></div>

function kpi(v,l,accent,cat){ 
  const clickAttr = cat ? ` onclick="kpiModal('${cat}', '${l}')" style="--accent:${accent||"var(--brand)"}; cursor:pointer;" title="Click to view ${l}"` : `style="--accent:${accent||"var(--brand)"}"`;

}

function kpiModal(cat, title) {
  const m = metrics();
  let html = `<h2>${title}</h2>`;
  let rows = "";

  if (cat === "Perfect") {
    if(m.perfect.length === 0) {
      rows = `<tr class="norow"><td colspan="3" class="empty">No perfect attendance in this period.</td></tr>`;
    } else {
      rows = m.perfect.map(e => `<tr data-emp="${esc(e.id)}" style="cursor:pointer"><td><b>${esc(e.name)}</b></td><td>${esc(e.dept)}</td><td>${esc(e.supervisor)}</td></tr>`).join("");
    }
    html += `<div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Supervisor</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    const status = cat === "Make-Ups Pending" ? "Pending" : "Completed";
    let mus = m.mus.filter(x => x.status === status);
    
    const seenDvIds = new Set();
    mus = mus.filter(mu => {
      const key = mu.dvId || mu.mid;
      if (seenDvIds.has(key)) return false;
      seenDvIds.add(key);
      return true;
    });

    if(mus.length === 0) {
      html += `<div class="empty">No ${status.toLowerCase()} make-ups in this period.</div>`;
    } else {
      html += `<div style="display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding-right: 4px;">${mus.map(mu => muRow(mu)).join("")}</div>`;
    }
  } else {
    let recs = cat === "Occurrences" ? m.emps.flatMap(e=>occurrenceGroups(e.id,m.from,m.to).map(g=>{const r=m.recs.find(x=>x.empId===e.id&&g.dates.includes(x.date)&&occurrenceNumber(x.occurrence)>0)||g.records?.[0];return r?{...r,_occGroup:g,date:g.dates[0]}:null}).filter(Boolean)) : m.recs.filter(r => r.type === cat);
    recs.sort((a,b) => b.date.localeCompare(a.date));
    if(recs.length === 0) {
      html += `<div class="empty">No records in this period.</div>`;
    } else {
      html += `<div class="tbl-wrap" style="max-height: 60vh; overflow-y: auto;"><table><thead><tr><th style="text-align:left">Date</th><th style="text-align:left">Employee</th><th style="text-align:left">Type / Time</th><th style="text-align:left">Notes</th></tr></thead><tbody>${recs.map(r => rowRecord(r, false)).join("")}</tbody></table></div>`;
    }
  }

  html += `<div class="mfoot mt"><button class="btn ghost" onclick="closeModal()">Close</button></div>`;
  openModal(html);
  
  const mh = $("#modalHost");
  if (cat === "Perfect") {
    mh.querySelectorAll("tr[data-emp]").forEach(tr=>tr.onclick=()=>{closeModal(); empModal(tr.dataset.emp);});
  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    mh.querySelectorAll("[data-mu-act]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const act=b.dataset.muAct, id=b.dataset.id;
      if(act==="edit") { closeModal(); makeupModal(id); }
      else { setMuStatus(id, act==="approve"?"Approved":act==="complete"?"Completed":"Missed"); closeModal(); }
    });
  } else {
    bindRecordButtons(mh);
  }
}

function drawCharts(){
  charts.forEach(c => c.destroy()); 
  charts = [];
  if (typeof Chart === "undefined") return;
  const m = metrics(), days = []; 
  for (let d = m.from; d <= m.to; d = addDays(d, 1)) {
    if (!isWeekend(d)) days.push(d);
  }

  const colors = {
    "PTO": "#0d9488",
    "Shift Trade": "#2563eb",
    "Make up Time": "#7c3aed",
    "Schedule Adjustment": "#4f46e5",
    "Jury Duty / Bereavement": "#6366f1",
    "Call Out": "#dc2626",
    "Cancellation": "#22c55e",
    "Short Shift": "#ea580c",
    "NCNS": "#1d4ed8",
    "Tardy": "#d97706",
    "LOA": "#4338ca"
  };

  const trendLabels = [];
  const activeTypes = TYPE_NAMES.filter(n => n !== "Present");
  
  const datasets = activeTypes.map(type => {
    return {
      label: type,
      data: days.map(d => m.recs.filter(r => r.date === d && r.type === type).length),
      backgroundColor: colors[type] || "var(--muted)",
      borderRadius: 4
    };
  }).filter(ds => ds.data.some(val => val > 0));

  days.forEach(d => {
    trendLabels.push(parseISO(d).toLocaleDateString(undefined, {month:"short", day:"numeric"}));
  });

  const tr = $("#chTrend"); 
  if (tr) {
    charts.push(new Chart(tr, {
      type: "bar",
      data: {
        labels: trendLabels,
        datasets: datasets
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: "bottom" } },
        scales: { 
          x: { stacked: true, grid: { display: false } },
          y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } 
        },
        onClick: (event, elements) => {
          if (elements.length > 0) {
            const index = elements[0].index;
            const clickedDate = days[index];
            const dayRecs = m.recs.filter(r => r.date === clickedDate && r.type !== "Present");

            let rows = dayRecs.length ? dayRecs.map(r => rowRecord(r, false)).join("") : `<tr class="norow"><td colspan="4" class="empty">No records on ${fmt(clickedDate)}.</td></tr>`;

            openModal(`<h2>All Records — ${fmt(clickedDate)}</h2>
              <div class="tbl-wrap"><table><thead><tr><th style="text-align:left">Date</th><th style="text-align:left">Employee</th><th style="text-align:left">Type / Time</th><th style="text-align:left">Notes</th></tr></thead><tbody>${rows}</tbody></table></div>
              <div class="mfoot mt"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
            bindRecordButtons($("#modalHost"));
          }
        }
      }
    }));
  }

  const mx = $("#chMix"); 
  if (mx) { 
    const names = TYPE_NAMES.filter(n => n !== "Present" && m.c[n] > 0);
    
    charts.push(new Chart(mx, {
      type: "doughnut",
      data: {
        labels: names,
        datasets: [{
          data: names.map(n => m.c[n]),
          backgroundColor: names.map(n => colors[n] || "var(--muted)"),
          borderWidth: 0
        }]
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false, 
        plugins: { legend: { position: "bottom" } },
        onClick: (event, elements) => {
          if (elements.length > 0) {
            const index = elements[0].index;
            const clickedType = names[index];
            kpiModal(clickedType, `Records: ${clickedType}`);
          }
        }
      }
    })); 
  }
}

  
function calShift(dir){
  const d=parseISO(UI.anchor);
  if(UI.preset==="day") UI.anchor=addDays(UI.anchor,dir);
  else if(UI.preset==="week") UI.anchor=addDays(UI.anchor,7*dir);
  else if(UI.preset==="month"){ d.setMonth(d.getMonth()+dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="quarter"){ d.setMonth(d.getMonth()+3*dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="annual"){ d.setFullYear(d.getFullYear()+dir); UI.anchor=isoDate(d); }
  else { const [f,t]=range(); const n=Math.max(1,Math.round((parseISO(t)-parseISO(f))/864e5)+1); UI.from=addDays(f,n*dir); UI.to=addDays(t,n*dir); }
  render();
}


function activeFilteredRecords(from,to){return filteredRecords(from,to).map(normalizeRecordType);}
function dynamicOccurrenceWindow(){const [,selectedTo]=range(),rollingStart=addDays(selectedTo,-OCC_WINDOW_DAYS+1),[selectedFrom]=range();return {from:selectedFrom>rollingStart?selectedFrom:rollingStart,to:selectedTo,clamped:selectedFrom>rollingStart};}
function occurrenceFilterBadge(from,to,count,label="Filtered rolling window"){const active=[UI.dept&&`Dept: ${UI.dept}`,UI.repName&&`Rep: ${UI.repName}`,UI.supervisor&&`Supervisor: ${UI.supervisor}`,UI.manager&&`Manager: ${UI.manager}`,UI.type&&`Type: ${UI.type}`,UI.q&&`Search: ${UI.q}`].filter(Boolean);return `<span class="filter-scope-badge" title="${esc(active.join(" · ")||"All matching employees and leave types")}">${esc(label)} · ${fmt(from)} to ${fmt(to)} · ${count} row${count===1?"":"s"}</span>`;}
function filteredOccurrenceGroups(empId,from,to){return occurrenceGroups(empId,from,to);}
function filteredGroupedOccurrenceCount(empId,from,to){return filteredOccurrenceGroups(empId,from,to).length;}
function occurrenceOverviewRows(empId,from,to){
  const groups=occurrenceGroups(empId,from,to);
  const rows=[];
  groups.forEach(g=>{
    const related=consolidatedDisplayRecords(occurrenceSourceRecords(empId,from,to).filter(r=>g.dates.some(d=>recordOverlapsRange(r,d,d))));
    const primary=related.find(r=>!r.cancelled&&!r.waived&&occurrenceNumber(r.occurrence)>0)||related.find(r=>!r.cancelled&&!r.waived)||g.records?.[0];
    if(primary)rows.push({...primary,date:g.dates[0],_occGroup:g,_displayOccurrence:1});
  });
  const excluded=consolidatedDisplayRecords((S.records||[]).filter(r=>r.empId===empId&&r.date>=from&&r.date<=to&&occurrenceNumber(r.occurrence)>0&&(r.waived||r.cancelled||r.fmla)));
  excluded.forEach(r=>{if(!rows.some(x=>x.rid===r.rid))rows.push({...r,_displayOccurrence:0});});
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}
function occurrenceGroupLineRows(r,g,n,lv){

function renderMakeup(){
  const [f,t] = range();
  const ids = new Set(filteredEmployees().map(e=>e.id));

  const byDate = {};
  mus.forEach(m => {
    const d = m.dateMissed;

  const counts = MU_STATUS.map(s => uniqueMakeups((S.makeups||[]).filter(m => ids.has(m.empId) && m.status === s)).length);

  const head = `<div class="section-title">

    An <b>OSS</b> (Out / Short-Shift) lets an agent make up missed time instead of taking an occurrence or losing pay —

    missing it means the occurrence stands.

  </div>`;

  if(UI.preset==="week" || (UI.preset==="adjusted" && addDays(f,10)>t && addDays(f,1)<=t)){
    let days = [];

    // Lock onto the Monday of the currently viewed week
    let diffToMonday = dayOfWeek === 0 ? 1 : 1 - dayOfWeek;
    baseDate.setDate(baseDate.getDate() + diffToMonday);
    
    let cur = isoDate(baseDate);
    for(let i = 0; i < 5; i++) {
      days.push(cur);
      cur = addDays(cur, 1);
    }

    if (!UI.selectedMuWeekDay || !days.includes(UI.selectedMuWeekDay)) {
      UI.selectedMuWeekDay = days.includes(today()) ? today() : days[0];
    }

    const dows = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const selDay = UI.selectedMuWeekDay;
    const dayMus = byDate[selDay] || [];

    const weekGridHtml = `<div class="cal-grid" style="grid-template-columns: repeat(5, 1fr); margin-bottom: 20px;">
      ${days.map(ds => {
        const dObj = parseISO(ds);
        const dowName = dows[dObj.getDay()];
        const dMus = byDate[ds]||[];
        const isSelected = ds === selDay;

        return `<div class="cal-cell ${isSelected ? "today" : ""}" data-select-mu-day="${ds}" style="min-height: 80px; cursor: pointer; ${isSelected ? 'border-width: 2px; border-color: var(--brand); background: var(--soft);' : ''}">
          <div class="row"><div class="small muted" style="text-transform: uppercase;">${dowName}</div><div class="d">${dObj.getDate()}</div></div>
          <div class="cal-mini" style="flex-direction:column; gap:2px;">
            ${dMus.slice(0,2).map(m=>{
              const e = emp(m.empId) || {name: m.empId};
              const firstName = esc(e.name.span ? e.name : e.name.split(' ')[0]);
              const timeStr = formatChipTime(m.notes) || hoursToHHMM(m.hoursOwed);
              return `<div class="mu-chip ${esc(m.status)}" title="${esc(e.name)}: ${timeStr}" style="font-size:9px; padding:1px 4px;">${firstName}</div>`;
            }).join("")}
            ${dMus.length > 2 ? `<div class="small muted" style="font-size:9px;">+${dMus.length - 2} more</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`;

    const selectedDateObj = parseISO(selDay);
    const formattedSelectedTitle = selectedDateObj.toLocaleDateString(undefined, {weekday:"long", month:"short", day:"numeric", year:"numeric"});

    const daySectionHtml = `<div class="day-block card">
      <div class="row">
        <b>${formattedSelectedTitle}</b>
        <span class="small muted">${dayMus.length} make-up shift${dayMus.length===1?"":"s"}</span>
        <button class="btn ghost sm right" data-mu-add-day="${selDay}">+ Add</button>
      </div>
      ${dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:10px;">${dayMus.map(muRow).join("")}</div>` : `<div class="small muted mt">No make-up shifts scheduled for this day.</div>`}
    </div>`;

    return head + weekGridHtml + daySectionHtml;
  }

  // Fallback for month/other views
  let days=[]; for(let d=f; d<=t; d=addDays(d,1)) days.push(d);
  return head + `<div class="cal-list">${days.map(d=>{
    const dayMus = byDate[d] || [];
    return `<div class="day-block card">
      <div class="row">
        <b>${fmtShort(d)}</b>
        <span class="small muted">${dayMus.length} make-up shift${dayMus.length===1?"":"s"}</span>
        <button class="btn ghost sm right" data-mu-add-day="${esc(d)}">+ Add</button>
      </div>
      ${dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:10px;">${dayMus.map(muRow).join("")}</div>` : `<div class="small muted mt">No make-up shifts scheduled.</div>`}
    </div>`;
  }).join("")}</div>`;
}
  
function setMuStatus(mid,status){
  const m=S.makeups.find(x=>x.mid===mid); if(!m) return;
  m.status=status;
  if(status==="Completed"){ m.completedDate=today();
    const r=S.records.find(r=>r.rid===m.rid)||S.records.find(r=>r.empId===m.empId&&r.date===m.dateMissed&&TYPES[r.type].occ);
    if(r){ r.waived=true; m.rid=r.rid; }
    toast("Make-up completed — occurrence waived");
  } else if(status==="Missed"){
    const r=S.records.find(r=>r.rid===m.rid); if(r) r.waived=false;
    toast("Marked missed — occurrence stands");
  } else toast("Agreement "+status.toLowerCase());
  save(); render();
}

function getRecordTimestamp(r) {
  if (!r) return 0;
  const raw = r.submittedOn || r.createdon || r.date || 0;
  const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(String(raw));
  const t = dateOnly ? parseISO(String(raw)).setHours(12,0,0,0) : new Date(raw).getTime();
  return isNaN(t) ? 0 : t;
}

function formatSubmittedTime(isoStr) {
  if (!isoStr) return "";
  const d = new Date(isoStr);
  return isNaN(d.getTime()) ? "" : d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}

function occurrenceGroupForRecord(r){return (!r||!isOcc(r)||!r.empId||!r.date)?null:occurrenceGroupForDate(r.empId,r.date,"2025-01-01",today());}
function occurrenceDisplayForRecord(r){const g=occurrenceGroupForRecord(r);if(!g)return "";const isStart=g.dates[0]===r.date;return `<div class="small mt"><span class="badge ${g.grouped?"warn":"bad"}">${esc(g.label)}</span><div class="muted">${g.dates.map(fmt).join(" → ")} · ${isStart?"counts as 1 occurrence":"same occurrence group · +0"}</div></div>`;}

function renderRecords(){
  const recs = filteredRecords().sort((a, b) => {
    // Fallback chain: submittedOn -> createdon -> date
    const timeA = new Date(a.submittedOn || a.createdon || a.date || 0).getTime();
    const timeB = new Date(b.submittedOn || b.createdon || b.date || 0).getTime();
    
    // Sort direction: UI.sortDir (1 for oldest on top, -1 for newest on top)
    return UI.sortDir * (timeA - timeB);
  });

  return `<div class="section-title"><h2>Records (${recs.length})</h2>
    <button class="btn sm" id="recNew">+ Add record</button></div>
  <div class="card tbl-wrap"><table><thead><tr>
    <th data-sort="date">Date ${UI.sortKey==="date"?(UI.sortDir<0?"↓":"↑"):""}</th><th data-sort="empId">Employee</th>
    <th data-sort="type">Type / Time</th><th>Notes</th>
  </tr></thead><tbody>${recs.map(r=>rowRecord(r, false)).join("")||`<tr class="norow"><td colspan="4" class="empty">No records in this period.</td></tr>`}</tbody></table></div>`;
}
  
function sortableValue(text){const raw=String(text||"").replace(/[↑↓]/g,"").trim();const num=Number(raw.replace(/[$,%]/g,""));if(raw!==""&&Number.isFinite(num))return {type:"number",value:num};const parsed=Date.parse(raw);if(/\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b|^\d{1,2}\/\d{1,2}\/\d{2,4}$|^\d{4}-\d{2}-\d{2}$/.test(raw)&&!Number.isNaN(parsed))return {type:"number",value:parsed};return {type:"text",value:raw.toLowerCase()};}
function bindSortableTables(root=document){root.querySelectorAll("table").forEach(table=>{const body=table.tBodies?.[0],heads=[...table.querySelectorAll(":scope > thead > tr > th")];if(!body||!heads.length)return;heads.forEach((th,index)=>{if(th.dataset.sort||th.dataset.teamSort||th.dataset.noSort!==undefined||!String(th.textContent||"").trim())return;th.classList.add("sortable-col");th.title="Sort this column";th.onclick=()=>{const dir=th.dataset.localSortDir==="asc"?-1:1;heads.forEach(h=>{h.classList.remove("sort-active");delete h.dataset.sortArrow;});th.dataset.localSortDir=dir===1?"asc":"desc";th.dataset.sortArrow=dir===1?"↑":"↓";th.classList.add("sort-active");const rows=[...body.rows].filter(r=>!r.classList.contains("norow"));rows.sort((a,b)=>{const av=sortableValue(a.cells[index]?.innerText),bv=sortableValue(b.cells[index]?.innerText);const cmp=av.type==="number"&&bv.type==="number"?av.value-bv.value:String(av.value).localeCompare(String(bv.value),undefined,{numeric:true,sensitivity:"base"});return dir*cmp;});rows.forEach(r=>body.appendChild(r));};});});}
