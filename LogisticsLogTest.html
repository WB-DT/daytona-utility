<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLog v105.61 | Logistics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>

    <style>
        :root, [data-theme='midnight'] { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;      
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='light'] { 
            --bg-deep: #f8fafc; --bg-surface: #ffffff; --bg-card: #f1f5f9;      
            --brand: #0d9488; --text-main: #0f172a; --text-dim: #475569;      
            --text-accent: #b45309; --border: #e2e8f0; --input-bg: #ffffff; --danger: #dc2626;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s ease; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; position: relative; }
        aside#main-gallery { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; position: relative; }
        #account-rail { width: 420px; min-width: 420px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 15px 0; display: none; }
        #account-rail.is-visible { display: flex !important; flex-direction: column; }
        #link-sidebar { position: absolute; right: 0; top: 0; bottom: 0; width: 300px; background: var(--bg-surface); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 50; box-shadow: -10px 0 15px -3px rgba(0,0,0,0.1); }
        #link-sidebar.open { transform: translateX(0); }

        .record-card { margin: 6px 12px; border-radius: 8px; padding: 10px 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid var(--border); position: relative; }
        .record-card:hover { transform: translateX(4px); background: rgba(0,0,0,0.03); }
        .record-card.active-card { background: var(--brand) !important; border-left-color: var(--text-main) !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .record-card.active-card * { color: #000000 !important; border-color: rgba(0, 0, 0, 0.2) !important; opacity: 1 !important; font-weight: 800; }

        .wh-label { font-size: 10px; font-weight: 900; color: var(--brand); text-transform: uppercase; border: 1px solid var(--brand); padding: 1px 5px; border-radius: 3px; }
        .route-label { font-size: 10px; font-weight: 900; color: var(--text-accent); text-transform: uppercase; border: 1px solid var(--text-accent); padding: 1px 5px; border-radius: 3px; }
        .disp-pill { font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; border: 1px solid currentColor; }

        .theme-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; }
        #email-modal-overlay, #coaching-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 550px; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        /* Direct API UI from Version Text [cite: 44-47] */
        .email-modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 1000px; height: 700px; max-width: 95vw; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); display: flex; }

        #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; pointer-events: none; }
        .toast { pointer-events: auto; min-width: 280px; padding: 16px 20px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); animation: toast-slide 0.3s ease-out; border-left: 4px solid var(--brand); }
        @keyframes toast-slide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .system-debug-footer { font-family: 'JetBrains Mono', monospace; font-size: 8px; opacity: 0.2; position: absolute; bottom: 10px; right: 20px; text-transform: uppercase; pointer-events: none; letter-spacing: 1px; }
        .user-badge { font-size: 10px; font-weight: 900; padding: 4px 12px; border-radius: 20px; background: rgba(0,0,0,0.05); border: 1px solid var(--border); color: var(--text-dim); }
        .rep-view-selector { background: var(--bg-surface); border: 1px solid var(--border); color: var(--brand); font-weight: 900; font-size: 9px; outline: none; cursor: pointer; text-transform: uppercase; border-radius: 4px; padding: 2px 4px; margin-left: 5px; }

        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #475569; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--text-accent); }
        input:checked + .slider:before { transform: translateX(14px); }

        #login-container { position: fixed; inset: 0; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; z-index: 99999; }
        .login-card { background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border); text-align: center; max-width: 400px; width: 90%; }
        .progress-container { width: 180px; height: 10px; background: rgba(0,0,0,0.1); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; position: relative; }
        .progress-fill { height: 100%; width: 0%; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .input-dark { background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--text-main); padding: 8px 12px; border-radius: 6px; outline: none; width: 100%; }
    </style>
</head>
<body data-theme="midnight">

    <div id="login-container" style="display: none;">
        <div class="login-card p-10 space-y-6">
            <i class="fa-solid fa-frog text-6xl text-[var(--brand)]"></i>
            <h1 class="text-2xl font-black uppercase tracking-tighter text-[var(--brand)]">LogiLog Secure Access</h1>
            <button onclick="login()" class="w-full py-4 bg-[var(--brand)] text-white rounded font-black uppercase text-sm tracking-[0.2em] shadow-xl">Sign in with Microsoft</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-frog text-2xl text-[var(--brand)]"></i>
                <div class="text-xl font-black uppercase tracking-tighter text-[var(--brand)]">LOGILOG <span class="text-[10px] opacity-40 ml-1">v105.61</span></div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search..." class="w-80 bg-black/5 border border-[var(--border)] p-2 text-xs rounded text-[var(--text-main)] outline-none focus:border-[var(--brand)]">
        </div>
        
        <div class="flex items-center gap-5">
            <div id="admin-toggle-container" class="hidden items-center gap-2 bg-black/5 px-3 py-1.5 rounded-full border border-[var(--border)]">
                <span class="text-[8px] font-black uppercase tracking-widest text-[var(--text-accent)]">Admin Bypass</span>
                <label class="switch" style="transform: scale(0.8);">
                    <input type="checkbox" id="admin-bypass-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex flex-col items-center">
                    <span class="text-[8px] font-normal uppercase opacity-50 tracking-tighter mb-0.5">This Month's Progress</span>
                    <span id="header-progress-text" class="text-[10px] font-black text-[var(--brand)] leading-none">0 / 0 (0%)</span>
                </div>
                <div class="progress-container"><div id="header-progress-fill" class="progress-fill"></div></div>
            </div>

            <div id="user-display" class="user-badge flex items-center gap-2">
                <i class="fa fa-user-circle"></i>
                <span id="user-name-text" class="mr-1">User</span>
                <select id="rep-view-filter" class="rep-view-selector" onchange="render()">
                    <option value="ALL">ALL LOGISTICS</option>
                </select>
            </div>

            <button onclick="toggleLinkSidebar()" class="wh-label cursor-pointer hover:bg-[var(--brand)] hover:text-white transition-all">Quick Links</button>

            <div class="flex items-center gap-2 bg-black/5 p-1.5 rounded-full border border-[var(--border)]">
                <div onclick="setTheme('midnight')" class="theme-dot bg-[#0f172a] text-white" title="Midnight"><i class="fa fa-moon"></i></div>
                <div onclick="setTheme('light')" class="theme-dot bg-[#f8fafc] text-[#0f172a]" title="Light Mode"><i class="fa fa-sun"></i></div>
            </div>
            <div id="sync-indicator" onclick="fetchData()" class="cursor-pointer hover:opacity-70" title="Manual Sync">
                <i id="sync-icon" class="fa fa-circle text-[8px] text-[var(--brand)]"></i>
            </div>
        </div>
    </header>

    <div class="app-container" id="main-app-content">
        <aside id="main-gallery">
            <div class="p-3 flex gap-2 border-b border-[var(--border)]">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto flex-grow h-full"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10 text-[var(--text-dim)] h-full">
                <i class="fa-solid fa-frog text-9xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select a Record</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto">
                <div class="max-w-4xl mx-auto p-8 space-y-8">
                    <div class="flex justify-between items-start border-b border-[var(--border)] pb-8">
                        <div class="flex-grow space-y-4">
                            <h2 id="d-company" class="text-[var(--text-main)] uppercase tracking-tight text-2xl font-extrabold leading-none"></h2>
                            <div class="flex items-start gap-2 text-[13px] text-[var(--text-dim)] opacity-80">
                                <i class="fa fa-location-dot mt-1 text-[var(--brand)]"></i>
                                <span id="d-shipping-address" class="font-medium"></span>
                            </div>
                            <div class="flex items-center gap-3 pt-2">
                                <span id="d-wh-badge" class="wh-label"></span>
                                <span id="d-route-badge" class="route-label"></span>
                                <div class="flex items-center gap-2 text-[14px] text-[var(--text-dim)] border-l border-[var(--border)] pl-3 ml-1">
                                    <i class="fa fa-truck-steering text-[var(--text-accent)] text-xs"></i>
                                    <span id="d-driver-info" class="font-normal uppercase tracking-tight text-[var(--text-main)]"></span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex flex-col items-end w-[300px] gap-3">
                            <div onclick="copyToClipboard()" class="w-fit cursor-pointer group relative text-right">
                                <p id="d-full-time" class="time-label-detail mb-1 text-[var(--text-dim)] text-[11px]"></p>
                                <p id="d-order" class="text-4xl font-black italic text-[var(--text-main)] leading-none hover:text-[var(--brand)] transition-colors"></p>
                                <div id="d-account" class="text-sm font-bold opacity-40 uppercase tracking-widest mt-1"></div>
                                <span id="copy-toast" class="absolute -top-7 right-0 text-[10px] bg-[var(--brand)] text-white px-2 py-1 rounded font-black opacity-0 transition-opacity uppercase">Copied</span>
                            </div>

                            <div class="flex items-center gap-3 bg-black/10 px-4 py-2 rounded-lg border border-[var(--border)] mt-1">
                                <span class="text-[10px] font-black uppercase tracking-widest text-[var(--text-accent)]">Coaching Opportunity</span>
                                <label class="switch">
                                    <input type="checkbox" id="d-coaching-toggle" onchange="handleCoachingToggle()">
                                    <span class="slider"></span>
                                </label>
                            </div>

                            <select id="d-disposition" onchange="autoSaveDisposition()" class="w-48 bg-[var(--bg-surface)] border border-[var(--brand)] text-[10px] font-black uppercase px-3 py-2 rounded text-[var(--brand)] outline-none cursor-pointer hover:bg-[var(--brand)] hover:text-white transition-all">
                                <option value="">Select Status...</option>
                                <option value="Completed">Completed</option>
                                <option value="Follow-up">Follow-up</option>
                                <option value="Escalated - Holly">Escalated - Holly</option>
                                <option value="Escalated - Wayne">Escalated - Wayne</option>
                                <option value="Escalated - Working On">Escalated - Working On</option>
                                <option value="Sent Back">Sent Back</option>
                                <option value="Working on">Working on</option>
                                <option value="Escalated">Escalated</option>
                                <option value="Completed Escalated">Completed Escalated</option>
                                <option value="Escalation Sent">Escalation Sent</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-8">
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50 tracking-widest">Warehouse Updates</label>
                            <textarea id="d-warehouse-input" class="h-56 bg-black/5 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-[var(--text-main)] leading-relaxed"></textarea>
                        </div>
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50 tracking-widest">Driver Feedback</label>
                            <textarea id="d-driver-input" class="h-56 bg-black/5 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-[var(--text-main)] leading-relaxed"></textarea>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="openWarehouseEmail()" class="flex-1 py-5 border-2 border-[var(--text-accent)] text-[var(--text-accent)] rounded font-black uppercase text-sm tracking-[0.2em] hover:bg-[var(--text-accent)] hover:text-white transition-all">Email Warehouse</button>
                        <button id="rep-update-btn" onclick="openDraftModal()" class="flex-1 py-5 border-2 border-[var(--brand)] text-[var(--brand)] rounded font-black uppercase text-sm tracking-[0.2em] hover:bg-[var(--brand)] hover:text-white transition-all">Send Rep Update</button>
                        <button id="save-btn" onclick="saveRecord()" class="flex-[1.5] py-5 bg-[var(--brand)] text-white rounded font-black uppercase text-sm tracking-[0.2em] hover:brightness-110 shadow-xl transition-all">Save Logistics Update</button>
                    </div>
                </div>
                <div id="d-system-guid" class="system-debug-footer"></div>
            </div>
        </main>

        <aside id="account-rail">
            <h3 class="text-[12px] font-black uppercase tracking-widest text-[var(--danger)] mb-4 border-b border-[var(--border)] pb-3 text-center mx-3">Duplicate History</h3>
            <div id="rail-content" class="overflow-y-auto"></div>
        </aside>
    </div>

    <div id="email-modal-overlay">
        <div class="email-modal-container">
            <div class="w-2/5 bg-[var(--bg-deep)] border-r border-[var(--border)] p-6 flex flex-col">
                <h3 class="text-xs font-black text-[var(--brand)] uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fas fa-history"></i> CRM Timeline (D365)
                </h3>
                <div id="em-history-feed" class="flex-1 overflow-y-auto space-y-3 pr-2">
                    <div class="text-center text-[10px] text-[var(--text-dim)] mt-10 italic">Checking CRM Timeline...</div>
                </div>
            </div>
            <div class="w-3/5 p-8 flex flex-col bg-[var(--bg-surface)]">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h3 class="text-xl font-black text-[var(--text-main)] uppercase tracking-tighter">Compose Update</h3>
                        <div id="em-ctx-summary" class="text-[10px] text-[var(--brand)] font-mono mt-1"></div>
                    </div>
                </div>
                <div class="space-y-4 flex-1 flex flex-col">
                    <input type="text" id="m-to-address" class="input-dark text-xs font-bold" placeholder="To: Separate with comma...">
                    <input type="text" id="m-cc-address" class="input-dark text-xs" placeholder="CC: Optional...">
                    <input type="text" id="m-subject" class="input-dark text-xs font-black italic" placeholder="Subject">
                    <div class="flex-1 border border-[var(--border)] rounded overflow-hidden mt-2">
                        <div id="m-body" contenteditable="true" class="h-full w-full bg-[var(--bg-card)] text-[var(--text-main)] p-4 text-sm outline-none overflow-y-auto font-sans"></div>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-[var(--border)]">
                    <button onclick="closeDraftModal()" class="px-6 py-2 rounded border border-[var(--border)] text-[var(--text-dim)] hover:text-[var(--text-main)] text-xs font-bold uppercase">Discard</button>
                    <button id="confirm-send-btn" onclick="confirmEmailLog()" class="px-8 py-2 rounded bg-[var(--brand)] text-black text-xs font-black uppercase shadow-lg hover:brightness-110 flex items-center gap-2">
                        <i class="fas fa-paper-plane"></i> Send & Log to Account
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // v105.61 DIRECT API CONFIGURATION [cite: 129-130]
        const ENV_DATA = "https://org23279050.crm.dynamics.com";
        const ENV_D365 = "https://wbmasonco.crm.dynamics.com";
        const DATA_API = `${ENV_DATA}/api/data/v9.2`;
        const D365_API = `${ENV_D365}/api/data/v9.2`;
        const ENTITY_SET = "cr714_logisticslog_2s";

        const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://wb-dt.github.io/daytona-utility/LogisticsLog.html" }, cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false } };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        let msalAccount = null;

        let db = []; let orderCounts = {}; let currentMode = 'active'; let currentTicketId = null;
        let currentUser = { name: "User", email: "", id: null };
        let currentUserProfileData = null;
        const NAME_MAP = { "Kari": "Kari Westervelt", "Holly": "Holly Evans", "Courtney": "Courtney Youngblood", "Jewel": "Jewel Jenkins", "Noah": "Noah Comans", "Wayne": "Wayne Rendt", "Rachel": "Rachel Kaiser", "Tobbitha": "Tobbitha Bishoff", "Paula": "Paula Bowen", "Jessica": "Jessica Pauley" };
        
        window.onload = () => { 
            setMode('active');
            msalInstance.handleRedirectPromise().then(resp => {
                if (resp && resp.account) { applyIdentity(resp.account); } 
                else {
                    const accounts = msalInstance.getAllAccounts();
                    if(accounts.length > 0) { applyIdentity(accounts[0]); } 
                    else { document.getElementById('login-container').style.display = 'flex'; }
                }
            }).catch(e => { document.getElementById('login-container').style.display = 'flex'; });
        };

        // Token Engine for Direct Dataverse/D365 [cite: 138-141]
        async function getToken(envUrl) {
            const request = { scopes: [`${envUrl}/user_impersonation`] };
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) {
                msalInstance.setActiveAccount(accounts[0]);
                try { return (await msalInstance.acquireTokenSilent(request)).accessToken; } 
                catch (e) { return (await msalInstance.acquireTokenPopup(request)).accessToken; }
            } else {
                const loginResponse = await msalInstance.loginPopup(request);
                msalInstance.setActiveAccount(loginResponse.account);
                return loginResponse.accessToken;
            }
        }

        function login() { msalInstance.loginPopup({ scopes: ["User.Read", "Mail.Send", `${ENV_D365}/user_impersonation`] }).then(resp => { if(resp && resp.account) applyIdentity(resp.account); }); }

        async function applyIdentity(account) {
            if (!account) return;
            document.getElementById('login-container').style.display = 'none';
            msalAccount = account; currentUser.name = account.name; currentUser.email = account.username;
            document.getElementById('user-name-text').innerText = account.name;

            // Admin Logic
            const authorizedAdmins = ["Wayne Rendt", "Holly Evans", "Kari Westervelt", "Anslee Erickson", "Taylor Whitaker"];
            const adminContainer = document.getElementById('admin-toggle-container');
            if (authorizedAdmins.includes(account.name)) { adminContainer.style.display = 'flex'; }

            try {
                const token = await getToken(ENV_D365);
                const r = await fetch(`${D365_API}/WhoAmI`, { headers: { 'Authorization': `Bearer ${token}` } });
                const d = await r.json();
                currentUser.id = d.UserId; // Required for Email Logging [cite: 146]

                const graphToken = await msalInstance.acquireTokenSilent({ scopes: ["User.Read", "Mail.Send"], account: msalAccount }).catch(e => null);
                if (graphToken) {
                    const res = await fetch("https://graph.microsoft.com/v1.0/me", { headers: { "Authorization": `Bearer ${graphToken.accessToken}` } });
                    currentUserProfileData = await res.json();
                }
            } catch(e) {}
            
            fetchData();
            // v105.61 Start Heartbeat AFTER Identity
            setInterval(() => fetchData(), 15000); 
        }

        async function fetchData() { 
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-[var(--brand)]"; 
            try { 
                const token = await getToken(ENV_DATA);
                const r = await fetch(`${DATA_API}/${ENTITY_SET}?$orderby=createdon desc`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json', 'OData-MaxVersion': '4.0', 'OData-Version': '4.0' }
                });
                if (!r.ok) throw new Error();
                const data = await r.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error("Sync Fail", e); } 
            setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[8px] text-[var(--brand)]"; }, 1500);
        }

        function ingest(data) {
            db = data.map(r => {
                const rawDate = r.cr714_starttime || r.createdon;
                const dateObj = rawDate ? new Date(rawDate) : null;
                let rawOwner = r.cr714_logisticsowner || 'Unassigned';
                return {
                    id: r.cr714_id || 'N/A', guid: (r.cr714_logisticslog_2id || '').trim().replace(/[{}]/g, ''), order: (r.cr714_salesordernumber || 'N/A').trim(), 
                    company: r.cr714_companyordeliveryname || 'Unknown', account: r.cr714_accountnumber || 'N/A', shippingAddress: r.cr714_shippingaddress || 'Address Not Provided', 
                    submitRep: r.cr714_rep || 'CSR', logisticsOwner: NAME_MAP[rawOwner] || rawOwner, driverInfo: r.cr714_drivernamenumber || 'No Driver Data', 
                    status: r['cr714_disposition@OData.Community.Display.V1.FormattedValue'] || r.cr714_disposition || 'Pending', issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || r.cr714_issue || 'General', 
                    description: r.cr714_description || '', warehouse: r['cr714_warehouse@OData.Community.Display.V1.FormattedValue'] || r.cr714_warehouse || 'N/A', 
                    route: r['super_route@OData.Community.Display.V1.FormattedValue'] || r.cr714_route || 'N/A', warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '', 
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '', fullStamp: dateObj ? `${dateObj.toLocaleDateString()} | ${dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : 'N/A', 
                    timestamp: dateObj ? dateObj.getTime() : 0, 
                    isCoaching: (r.cr714_coachingopp === true || r.cr714_coachingopp === 1 || r['cr714_coachingopp@OData.Community.Display.V1.FormattedValue'] === 'Yes') || false
                };
            });
            orderCounts = db.reduce((acc, t) => { if(t.order !== 'N/A') acc[t.order] = (acc[t.order] || 0) + 1; return acc; }, {});
            render();
        }

        function setMode(m) { 
            currentMode = m;
            const btnActive = document.getElementById('btn-active');
            const btnAll = document.getElementById('btn-all');
            if(btnActive) btnActive.className = m === 'active' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-white shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)]';
            if(btnAll) btnAll.className = m === 'all' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-white shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)]';
            render(); 
        }

        function render() { 
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase(); 
            const repFilterValue = document.getElementById('rep-view-filter').value; 
            const filtered = db.filter(t => { 
                const matchSearch = (t.order + t.company + t.account + t.issue).toLowerCase().includes(search); 
                const isActive = ['Pending', 'Working on', 'Follow-up', 'Escalated', 'Escalated - Holly', 'Escalated - Wayne', 'Escalated - Working On', 'Escalation Sent'].includes(t.status);
                const modeFilter = currentMode === 'active' ? isActive : !isActive; 
                const ownershipMatch = (repFilterValue === "ALL" || t.logisticsOwner === repFilterValue); 
                return matchSearch && modeFilter && ownershipMatch; 
            }).sort((a,b) => a.timestamp - b.timestamp); // Chronological
            list.innerHTML = filtered.map(t => createCardHTML(t)).join('') || `<div class="p-10 text-center opacity-30 text-[10px] uppercase font-black">No matching records</div>`; 
            updateProgressBar();
        }

        function loadTicket(id) {
            const dispoInput = document.getElementById('d-disposition');
            if (currentTicketId) {
                const currentT = db.find(x => x.id === currentTicketId);
                const isAdmin = document.getElementById('admin-bypass-toggle')?.checked || false; 
                if (!isAdmin && currentT && currentT.logisticsOwner !== 'Unassigned' && !dispoInput.value) { showToast("Disposition required.", "error"); return; }
            }
            currentTicketId = id; const t = db.find(x => x.id === id); if(!t) return; render();
            document.getElementById('empty-state').classList.add('hidden'); document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company; document.getElementById('d-order').innerText = t.order; document.getElementById('d-full-time').innerText = t.fullStamp; document.getElementById('d-account').innerText = "#" + t.account; document.getElementById('d-shipping-address').innerText = t.shippingAddress; document.getElementById('d-wh-badge').innerText = t.warehouse; document.getElementById('d-route-badge').innerText = `RT: ${t.route}`; document.getElementById('d-driver-info').innerText = t.driverInfo; document.getElementById('d-submit-rep').innerText = t.submitRep; document.getElementById('d-logistics-owner').innerText = t.logisticsOwner; document.getElementById('d-issue-label').innerText = t.issue; document.getElementById('d-description').innerText = t.description; document.getElementById('d-warehouse-input').value = t.warehouseNotes; document.getElementById('d-driver-input').value = t.driverNotes; dispoInput.value = t.status; document.getElementById('d-coaching-toggle').checked = t.isCoaching; document.getElementById('d-system-guid').innerText = `Record ID: ${t.guid}`;
        }

        // Dynamics 365 Email Tracking & Logging Engine [cite: 240-271]
        async function confirmEmailLog() { 
            const toField = document.getElementById('m-to-address').value;
            const ccField = document.getElementById('m-cc-address').value;
            const subject = document.getElementById('m-subject').value;
            const body = document.getElementById('m-body').innerHTML;
            const t = db.find(x => x.id === currentTicketId);
            const btn = document.getElementById('confirm-send-btn');
            if (!toField) { showToast("Recipient Required", "error"); return; }
            btn.innerText = "SENDING & LOGGING..."; btn.disabled = true;

            try {
                // 1. Send via MS Graph
                const parseEmails = (str) => str.split(/[,;]/).map(e => e.trim()).filter(e => e).map(e => ({ emailAddress: { address: e } }));
                const tokenResponse = await msalInstance.acquireTokenSilent({ scopes: ["Mail.Send"], account: msalAccount });
                const graphPayload = { message: { subject, body: { contentType: "HTML", content: body }, toRecipients: parseEmails(toField), ccRecipients: parseEmails(ccField) }, saveToSentItems: "true" };
                const graphRes = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", { method: "POST", headers: { "Authorization": `Bearer ${tokenResponse.accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(graphPayload) });

                // 2. Log to Dynamics 365 Timeline [cite: 254-268]
                const d365Token = await getToken(ENV_D365);
                const parties = [];
                if(currentUser.id) parties.push({ "participationtypemask": 1, "partyid_systemuser@odata.bind": `/systemusers(${currentUser.id})` });
                parseEmails(toField).forEach(p => parties.push({ "participationtypemask": 2, "addressused": p.emailAddress.address }));
                parseEmails(ccField).forEach(p => parties.push({ "participationtypemask": 3, "addressused": p.emailAddress.address }));
                const logPayload = { subject, description: body, directioncode: true, email_activity_parties: parties };

                // Binding logic [cite: 258-266]
                const soRes = await fetch(`${D365_API}/salesorders?$filter=ordernumber eq '${t.order}'&$select=salesorderid`, { headers: { 'Authorization': `Bearer ${d365Token}` } });
                const soData = await soRes.json();
                if(soData.value?.length > 0) logPayload[`regardingobjectid_salesorder@odata.bind`] = `/salesorders(${soData.value[0].salesorderid})`;

                await fetch(`${D365_API}/emails`, { method: 'POST', headers: { 'Authorization': `Bearer ${d365Token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(logPayload) });
                
                showToast("Sent & Logged successfully!"); closeDraftModal();
            } catch (err) { showToast("Error during Send/Log", "error"); } finally { btn.innerText = "Send & Log to Account"; btn.disabled = false; }
        }

        async function fetchD365EmailFeed(orderNum, accountNum) {
            const feed = document.getElementById('em-history-feed');
            feed.innerHTML = '<div class="text-center text-[10px] mt-10 animate-pulse">Syncing Timeline...</div>';
            try {
                const token = await getToken(ENV_D365);
                const res = await fetch(`${D365_API}/emails?$filter=contains(subject, '${orderNum}')&$orderby=createdon desc`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                feed.innerHTML = data.value.map(e => `<div class="p-2 bg-black/20 rounded border border-[var(--border)] text-[9px] mb-2"><div class="text-[var(--brand)] font-black">${new Date(e.createdon).toLocaleDateString()}</div><div class="font-bold">${e.subject}</div></div>`).join('');
            } catch(e) { feed.innerHTML = '<div class="mt-10 text-center opacity-20">No feed found</div>'; }
        }

        function openDraftModal() { 
            const t = db.find(x => x.id === currentTicketId); if(!t) return; 
            let repPhone = "(508) 436 - XXXX";
            if (currentUserProfileData?.businessPhones?.length > 0) { const raw = currentUserProfileData.businessPhones[0]; repPhone = raw.length === 4 ? `(508) 436 - ${raw}` : raw; }
            const whNotes = document.getElementById('d-warehouse-input').value.trim();
            const drNotes = document.getElementById('d-driver-input').value.trim();
            let combined = ""; if (whNotes) combined += `<strong>Warehouse Update:</strong><br>${whNotes}<br><br>`; if (drNotes) combined += `<strong>Driver Feedback:</strong><br>${drNotes}<br><br>`;
            document.getElementById('m-to-address').value = `${t.submitRep.toLowerCase().replace(/\s+/g, '.')}@wbmason.com`; 
            document.getElementById('m-subject').value = `${t.order} / ${t.company} / Logistics Update`;
            document.getElementById('m-body').innerHTML = `<div style="color:#000000; font-family:Arial;">Hello,<br><br>Status: ${t.status}<br>Account: #${t.order}<br>Issue: ${t.issue}<br><br>${combined}Sincerely,<br>${currentUser.name}<br>${repPhone}</div>`;
            document.getElementById('email-modal-overlay').style.display = 'flex'; 
            fetchD365EmailFeed(t.order, t.account);
        }

        async function saveRecord() {
            const btn = document.getElementById('save-btn'); const t = db.find(x => x.id === currentTicketId);
            btn.innerText = "SAVING..."; btn.disabled = true;
            try { 
                const token = await getToken(ENV_DATA);
                await fetch(`${DATA_API}/${ENTITY_SET}(${t.guid})`, {
                    method: 'PATCH', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "cr714_disposition": document.getElementById('d-disposition').value, "cr714_receivedemailfromwarehousenotes": document.getElementById('d-warehouse-input').value })
                });
                showToast("Saved to Dataverse"); fetchData();
            } catch (e) { showToast("Save Error", "error"); } finally { btn.innerText = "Save Logistics Update"; btn.disabled = false; }
        }

        function createCardHTML(t) { return `<div class="record-card ${currentTicketId === t.id ? 'active-card' : ''}" onclick="loadTicket('${t.id}')"><div class="flex justify-between text-[8px] opacity-40"><span>#${t.id}</span><span>${t.fullStamp}</span></div><div class="truncate font-black text-[12px] uppercase">${t.company}</div><div class="flex justify-between items-center mt-1"><span class="font-mono text-[11px]">#${t.order}</span><span class="disp-pill">${t.status}</span></div></div>`; }
        function setupRepView() { const s = document.getElementById('rep-view-filter'); if(s.options.length > 1) return; Object.values(NAME_MAP).sort().forEach(n => s.add(new Option(n, n))); }
        function closeDraftModal() { document.getElementById('email-modal-overlay').style.display = 'none'; }
        function toggleLinkSidebar() { document.getElementById('link-sidebar').classList.toggle('open'); }
        function setTheme(t) { document.body.setAttribute('data-theme', t); }
        function showToast(m, t = 'success') { const c = document.getElementById('toast-container'); const e = document.createElement('div'); e.className = `toast ${t==='error'?'border-red-500':'border-teal-400'}`; e.innerText = m; c.appendChild(e); setTimeout(() => e.remove(), 3000); }
        function updateProgressBar() { /* Placeholder for Turn 15 logic */ }
        function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('d-order').innerText); showToast("Order Copied"); }
        function handleCoachingToggle() { /* Logic for Turn 18 */ }
        async function saveCoachingFeedback() { /* Logic for Turn 18 */ }
        async function autoSaveDisposition() { /* Logic for Turn 19 */ }
    </script>
