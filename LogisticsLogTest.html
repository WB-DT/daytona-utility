<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workforce — Attendance & Make-Up Tracker v06</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1a2333; --muted:#64748b; --line:#e2e8f0;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --orange:#ea580c;
  --blue:#2563eb; --indigo:#4f46e5; --teal:#0d9488; --rose:#e11d48; --purple:#7c3aed;
  --brand:#0066c0; --brand-ink:#ffffff; --soft:#eef2f7;
  --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --line:#334155; --soft:#1e2a4a;
         --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
a{color:var(--brand)}

header{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.hd h1{font-size:18px;letter-spacing:-.01em}
.hd .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.hd .spacer{flex:1}
.sync-dot{display:inline-flex;align-items:center;gap:7px;max-width:min(48vw,560px);padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--soft);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.14);flex:0 0 auto}
.sync-dot[data-state="syncing"]{color:#1d4ed8;border-color:rgba(37,99,235,.28);background:rgba(37,99,235,.08)}
.sync-dot[data-state="syncing"]::before{background:#2563eb;animation:syncPulse 1s ease-in-out infinite}
.sync-dot[data-state="success"]{color:#166534;border-color:rgba(22,163,74,.25);background:rgba(22,163,74,.08)}
.sync-dot[data-state="success"]::before{background:#16a34a}
.sync-dot[data-state="error"],.sync-dot[data-state="offline"]{color:#991b1b;border-color:rgba(220,38,38,.25);background:rgba(220,38,38,.08)}
.sync-dot[data-state="error"]::before,.sync-dot[data-state="offline"]::before{background:#dc2626}
@keyframes syncPulse{50%{opacity:.35;transform:scale(.72)}}
@media(max-width:760px){.sync-dot{order:5;max-width:100%;width:100%}}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;border-bottom:2.5px solid transparent;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:550;white-space:nowrap;border-radius:6px 6px 0 0}
nav button:hover{color:var(--ink);background:var(--soft)}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13.5px;max-width:170px}
.filters label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fgroup{min-width:0}
.chip-clear{border:none;background:var(--soft);color:var(--brand);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:600}

main{max-width:1440px;margin:0 auto;padding:16px}
.cal-card.loa-card{border-left:3.5px solid var(--indigo);background:rgba(99,102,241,0.05)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.kpi.accent{border-left:4px solid var(--accent,var(--brand))}
.two{grid-template-columns:1fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.card h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}

.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--soft);cursor:pointer}
tbody tr.norow:hover{background:none;cursor:default}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:#fff}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--brand)}
.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.badge.ok{background:#dcfce7;color:#166534}
@media (prefers-color-scheme: dark){.badge.warn{background:#453a12;color:#fcd34d}.badge.bad{background:#4a1d1d;color:#fca5a5}.badge.ok{background:#14351f;color:#86efac}}

.btn{border:none;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
.cal-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:86px;padding:6px;cursor:pointer;transition:border-color .1s}
.cal-cell:hover{border-color:var(--brand)}
.cal-cell.dim{opacity:.42}
.cal-cell.today{border-color:var(--brand);border-width:2px}
.cal-cell .d{font-size:12.5px;font-weight:700}
.cal-mini{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.dot{width:auto;min-width:17px;height:17px;border-radius:6px;font-size:10.5px;font-weight:700;color:#fff;display:inline-grid;place-items:center;padding:0 4px}
@media(max-width:640px){.cal-cell{min-height:56px;padding:4px}.cal-mini .dot{min-width:14px;height:14px;font-size:9px}}
.cal-list .day-block{margin-bottom:14px}

.mu-chip{display:block;background:var(--purple);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-chip.Pending{background:#d97706}
.mu-chip.Approved{background:var(--purple)}
.mu-chip.Completed{background:var(--green)}

let syncCoverDepth = 0;
function showSyncCover(message = "Connecting to Dataverse...", title = "Syncing Workforce data") {
  syncCoverDepth += 1;
  const cover = document.getElementById("syncCover");
  const titleEl = document.getElementById("syncCoverTitle");
  const messageEl = document.getElementById("syncCoverMessage");
  if (titleEl) titleEl.textContent = title;
  if (messageEl) messageEl.textContent = message;
  if (cover) {
    cover.classList.add("show");
    cover.setAttribute("aria-hidden", "false");
  }
  document.body.classList.add("syncing");
}
function updateSyncCover(message) {
  const messageEl = document.getElementById("syncCoverMessage");
  if (messageEl && message) messageEl.textContent = message;
}
function hideSyncCover(force = false) {
  syncCoverDepth = force ? 0 : Math.max(0, syncCoverDepth - 1);
  if (syncCoverDepth > 0) return;
  const cover = document.getElementById("syncCover");
  if (cover) {
    cover.classList.remove("show");
    cover.setAttribute("aria-hidden", "true");
  }
  document.body.classList.remove("syncing");
}


const DATAVERSE_URL = "https://org23279050.crm.dynamics.com";
const TABLE_TIMEOFF = "cr714_timeoff_2s";
const TABLE_ATTENDANCE = "cr714_csrattendancetrackers";
const TABLE_EMPLOYEES = "cr714_employeeinformation1s";

const msalConfig = {
  auth: {
    clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
    authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
    redirectUri: "https://WB-DT.github.io/daytona-utility/"
  },
  cache: {
    cacheLocation: "sessionStorage",
    storeAuthStateInCookie: false
  }
};
const msalInstance = new msal.PublicClientApplication(msalConfig);
let msalAccount = null;

// MSAL tokens use sessionStorage to avoid persistent localStorage growth.
// ACT authentication helper. Uses the exact selected account and tenant authority
// to avoid multiple_matching_tokens cache collisions.
window.getToken = async function(scopeStr, silentFallback = false) {
  let account = msalAccount || null;

  if (!account) {
    const activeAccounts = msalInstance.getAllAccounts();
    if (activeAccounts.length > 0) account = activeAccounts[0];
  }

  const request = {
    scopes: scopeStr.split(" "),
    account,
    authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401"
  };

  try {
    return (await msalInstance.acquireTokenSilent(request)).accessToken;
  } catch (error) {
    if (silentFallback) {
      console.warn(`Silent token fetch failed for ${scopeStr}. Error: ${error.message}`);
      throw error;
    }

    console.log(`Interactive token request needed for ${scopeStr}`);
    const response = await msalInstance.acquireTokenPopup(request);
    if (response.account) msalAccount = response.account;
    return response.accessToken;
  }
};


const AUTO_REFRESH_MS=5*60*1000;
const FULL_RECONCILE_MS=6*60*60*1000;
const INCREMENTAL_OVERLAP_MS=10*60*1000;
let autoRefreshTimer=null,refreshCountdownTimer=null,refreshInFlight=false,lastSuccessfulRefresh=0,nextAutoRefreshAt=0;
let lastUpdateIndicatorText="",lastUpdateIndicatorTitle="";
function formatRefreshCountdown(ms){
  const seconds=Math.max(0,Math.ceil(ms/1000)),minutes=Math.floor(seconds/60),remaining=seconds%60;
  return `${minutes}:${String(remaining).padStart(2,"0")}`;
}
function updateRefreshCountdown(){
  if(!nextAutoRefreshAt||refreshInFlight||!lastUpdateIndicatorText||!navigator.onLine)return;
  const remaining=nextAutoRefreshAt-Date.now();
  const countdown=formatRefreshCountdown(remaining);
  setSyncStatus("success",`${lastUpdateIndicatorText} · next ${countdown}`,`${lastUpdateIndicatorTitle} Next automatic refresh in ${countdown}.`);
}
function resetRefreshCountdown(){
  nextAutoRefreshAt=Date.now()+AUTO_REFRESH_MS;
  updateRefreshCountdown();
}
async function refreshWorkforceData(reason="automatic"){
  if(refreshInFlight||!msalAccount||document.hidden||!navigator.onLine)return;
  refreshInFlight=true;
  const lastFull=Date.parse(S.settings?.lastFullReconcileAt||"")||0;
  const full=Date.now()-lastFull>=FULL_RECONCILE_MS;
  try{await pullFromDataverse(true,{full});lastSuccessfulRefresh=Date.now();}
  catch(err){console.warn(`${reason} refresh failed`,err);}finally{refreshInFlight=false;resetRefreshCountdown();}
}
function startAutoRefresh(){
  clearInterval(autoRefreshTimer);clearInterval(refreshCountdownTimer);
  resetRefreshCountdown();
  autoRefreshTimer=setInterval(()=>refreshWorkforceData("timer"),AUTO_REFRESH_MS);
  refreshCountdownTimer=setInterval(updateRefreshCountdown,1000);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-lastSuccessfulRefresh>AUTO_REFRESH_MS)refreshWorkforceData("window resumed");});
window.addEventListener("offline",()=>setSyncStatus("offline","Offline · cached data","Countdown paused until the connection returns. The app is displaying cached data."));
window.addEventListener("online",()=>{updateSyncStatusIndicator();refreshWorkforceData("connection restored");});
window.onload = async () => {
  try {
    await hydrateStateCache();
    updateReconciliationBadge();
    updateSyncStatusIndicator();
    const redirectResponse = await msalInstance.handleRedirectPromise();
    const accounts = msalInstance.getAllAccounts();
    msalAccount = redirectResponse?.account || accounts[0] || null;

    if (msalAccount) {
      if (!S.employees || S.employees.length === 0) {
        await pullFromDataverse(false);
      } else {
        await pullFromDataverse(true);
      }
      lastSuccessfulRefresh=Date.now();
      startAutoRefresh();
    }
  } catch (err) {
    console.error("MSAL init error:", err);
  }
};

async function getDataverseToken() {
  const dataverseScope = `${DATAVERSE_URL}//user_impersonation`;

  if (!msalAccount) {
    const accounts = msalInstance.getAllAccounts();
    msalAccount = accounts[0] || null;
  }

  if (!msalAccount) {
    updateSyncCover("Waiting for Microsoft sign-in...");
    const loginResponse = await msalInstance.loginPopup({
      scopes: ["User.Read", dataverseScope]
    });
    msalAccount = loginResponse.account;
  }

  return window.getToken(dataverseScope);
}

function to12Hour(timeStr) {
  if (!timeStr) return "";
  let s = String(timeStr).trim();
  if (/AM|PM/i.test(s)) {
    return s.replace(/\s*(AM|PM)/i, " $1").toUpperCase();
  }
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (!match) return s;
  let h = parseInt(match[1], 10), m = match[2];
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function formatDuration(hStr) {
  if (!hStr) return "";
  let s = String(hStr).trim();
  let totalMinutes = 0;
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (match) {

  async function cancelRecordRequest(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  if (!confirm("Are you sure you want to cancel this request? It will remain visible but crossed out.")) return;

  target.cancelled = true;
  const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;
  S.records.filter(r => r.rid.startsWith(basePrefix)).forEach(r => r.cancelled = true);
  S.makeups.filter(m => m.mid === basePrefix || m.rid.startsWith(basePrefix) || m.dvId === target.dvId).forEach(m => m.status = "Cancelled");

  save();
  closeModal();
  render();
  toast("Request cancelled");
}

  async function toggleCancelRecord(rid){
  const target=S.records.find(r=>r.rid===rid);if(!target)return;
  const newState=!target.cancelled;
  try{
    if(target.dvId)await patchDataverseRecord(target.dvId,{cr714_cancelledrequest:newState});
    else if(target.attendanceId)throw new Error("CSR Attendance does not expose a cancellation field. Edit the CSR row or update its occurrence instead.");
    else throw new Error("Dataverse record ID is missing.");
    S.records.filter(r=>target.dvId&&r.dvId===target.dvId).forEach(r=>r.cancelled=newState);
    S.makeups.filter(m=>m.dvId===target.dvId).forEach(m=>m.status=newState?"Cancelled":"Pending");
    save();closeModal();render();toast(newState?"Request cancelled in Dataverse":"Request restored in Dataverse");
  }catch(err){console.error(err);toast(err.message);}
}
async function deleteRecordFromDataverse(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  if (!confirm("Are you sure you want to permanently delete this record from Dataverse?")) return;

  if (target.dvId) {
    setSync("Deleting from Dataverse...");
    try {
      const token = await getDataverseToken();
      if (!token) throw new Error("Authentication missing");

      const res = await fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}(${target.dvId})`, {
        method: "DELETE",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/json",
          "OData-MaxVersion": "4.0",
          "OData-Version": "4.0"
        }
      });

      if (!res.ok && res.status !== 204 && res.status !== 404) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
    } catch (err) {
      console.error("Delete failed:", err);
      toast("Failed to delete from Dataverse: " + err.message);
      setSync("");
      return;
    }
  }

  const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;
  S.records = S.records.filter(r => !r.rid.startsWith(basePrefix));
  S.makeups = S.makeups.filter(m => m.mid !== basePrefix && m.dvId !== target.dvId);

  save();
  closeModal();
  render();
  setSync("");
  toast("Record deleted from Dataverse permanently");
}

async function dataversePatch(tableName,recordId,payload,label){
  if(!recordId)throw new Error(`${label||"Dataverse"} record ID is missing`);
  const token=await getDataverseToken();
  if(!token)throw new Error("Authentication missing");
  const cleanId=String(recordId).replace(/[{}]/g,"");
  const res=await fetch(`${DATAVERSE_URL}/api/data/v9.2/${tableName}(${cleanId})`,{method:"PATCH",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json",Accept:"application/json","OData-MaxVersion":"4.0","OData-Version":"4.0","If-Match":"*"},body:JSON.stringify(payload)});
  if(!res.ok&&res.status!==204){const text=await res.text();throw new Error(`${label||"Dataverse"} PATCH failed [${res.status}]: ${text||res.statusText}`);}
  return true;
}

function canonicalRecordType(r){
  if(!r)return "Present";
  // Visible attendance badging is exclusively the Time Off table's
  // cr714_leavetype value. CSR cr714_typeofleave is never consulted.
  if(r.calendarTypeSource!=="cr714_leavetype"||!r.dvId)return "Present";
  return mapLeaveType(r.rawLeaveType);
}
function normalizeRecordType(r){const type=canonicalRecordType(r);return type===r.type?r:{...r,type};}
function calendarRecordWinnerCompare(a,b){
  const at=getRecordTimestamp(a),bt=getRecordTimestamp(b);
  if(at!==bt)return at-bt;
  // Stable source-record tie-break. This makes results independent of API
  // paging or response order when migrated timestamps are identical.
  return String(a.dvId||a.rid||"").localeCompare(String(b.dvId||b.rid||""));
}
function calendarRecords(records){
  // Admit only active Time Off form records with a raw cr714_leavetype.
  // CSR rows, cancellation actions, Present rows, and make-up repayment
  // sessions never create attendance badges.
  const eligible=(records||[])
    .filter(r=>r.dvId&&r.calendarTypeSource==="cr714_leavetype"&&String(r.rawLeaveType||"").trim())
    .map(r=>({...r,type:mapLeaveType(r.rawLeaveType)}))
    .filter(r=>!r.cancelled&&r.type!=="Cancellation"&&r.type!=="Present");

  // Phantom duplicate rule: collapse only repeated copies of the exact same
  // Time Off Dataverse request on the same parsed date. Distinct Time Off IDs
  // are true requests and are all returned, even for the same employee/date.
  const latestBySourceDay=new Map();
  eligible.forEach(r=>{
    const key=`${String(r.dvId).trim().toLowerCase()}|${r.date}`;
    const current=latestBySourceDay.get(key);
    if(!current||calendarRecordWinnerCompare(r,current)>0)latestBySourceDay.set(key,r);
  });

  const sourceDayCounts=new Map();
  eligible.forEach(r=>{const key=`${String(r.dvId).trim().toLowerCase()}|${r.date}`;sourceDayCounts.set(key,(sourceDayCounts.get(key)||0)+1);});
  return [...latestBySourceDay.values()]
    .sort((a,b)=>String(a.date).localeCompare(String(b.date))
      || String(a.empId).localeCompare(String(b.empId))
      || getRecordTimestamp(a)-getRecordTimestamp(b)
      || String(a.dvId).localeCompare(String(b.dvId)))
    .map(r=>{const key=`${String(r.dvId).trim().toLowerCase()}|${r.date}`;return {...r,_phantomDuplicatesSuppressed:Math.max(0,(sourceDayCounts.get(key)||1)-1)};});
}
function calendarTypeSummary(records) {
  const byType = {};

    const bucket = byType[type] || { count: 0, hours: 0, requests: new Set() };
    const requestKey = r.requestId || r.dvId || r.rid;
    if (!bucket.requests.has(requestKey)) { bucket.requests.add(requestKey); bucket.count += 1; }

    byType[type] = bucket;
  });

function filteredEmployees(){

  const q = UI.q.trim().toLowerCase();
  return S.employees.filter(e =>
    (!UI.dept||e.dept===UI.dept) && 
    (!UI.repName||e.name===UI.repName) &&

    (!UI.manager||e.manager===UI.manager) &&
    (!q || e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q))

function filteredRecords(from,to){
  if (!S.records) return [];
  const ids = new Set(filteredEmployees().map(e=>e.id));
  const [f,t] = from?[from,to]:range();
  return consolidatedDisplayRecords(S.records.filter(r => ids.has(r.empId) && r.date>=f && r.date<=t && (!UI.type || canonicalRecordType(r) === UI.type)));
}

function emp(id){ return S.employees?.find(e=>e.id===id); }
function isOcc(r){ return !r.cancelled && !r.waived && occurrenceNumber(r.occurrence) > 0; }

function recordOverlapsRange(r,from,to){const start=r.requestStartDate||r.date,end=r.requestEndDate||start;return !!start&&!!end&&start<=to&&end>=from;}
const OCCURRENCE_ELIGIBLE_TYPES=new Set(["Call Out","Short Shift","Tardy","NCNS"]);
function isOccurrenceEligible(r){
  if(!r)return false;
  const type=canonicalRecordType(r);
  return occurrenceNumber(r.occurrence)>0&&!r.cancelled&&!r.waived&&!r.fmla&&OCCURRENCE_ELIGIBLE_TYPES.has(type);

function occurrenceSourceRecords(empId,from,to){

  if(!allowedEmployees.has(empId))return [];
  return consolidatedDisplayRecords((S.records||[])
    .filter(r=>r.empId===empId&&recordOverlapsRange(r,from,to))
    .map(normalizeRecordType));

function expandOccurrenceDates(r,from,to){

  for(let d=start;d<=end&&out.length<730;d=addDays(d,1))if(d>=from&&d<=to)out.push(d);
  return out;
}
function groupConsecutiveOccurrenceDates(days,maxDays=3){
  const groups=[];let current=[];
  [...new Set(days)].sort().forEach(date=>{
    const consecutive=current.length&&date===addDays(current[current.length-1],1);
    if(!current.length||(consecutive&&current.length<maxDays))current.push(date);
    else{groups.push(current);current=[date];}
  });
  if(current.length)groups.push(current);
  return groups;
}
function occurrenceGroups(empId,from,to){
  // Build the policy-defined occurrence first. Display filters must not rewrite history.
  const source=occurrenceSourceRecords(empId,from,to);
  const eligible=source.filter(isOccurrenceEligible);
  const dateGroups=groupConsecutiveOccurrenceDates(eligible.flatMap(r=>expandOccurrenceDates(r,from,to)),3);
  let groups=dateGroups.map(dates=>{
    const records=source.filter(r=>dates.some(d=>recordOverlapsRange(r,d,d)));
    const activeRecords=records.filter(isOccurrenceEligible);
    const grouped=dates.length>1;
    return {id:`${empId}:${dates[0]}`,dates,grouped,records,activeRecords,hasWaived:records.some(r=>r.waived),hasCancelled:records.some(r=>r.cancelled),visualClass:grouped?"occurrence-group-rainbow":"occurrence-single-green",label:grouped?`Grouped period · ${dates.length} consecutive days`:"Single occurrence"};
  });
  // Type is a visibility filter applied after the actual group has been constructed.
  if(UI.type)groups=groups.filter(g=>g.activeRecords.some(r=>canonicalRecordType(r)===UI.type));
  return groups;
}
function groupedOccurrenceCount(empId,from,to){return occurrenceGroups(empId,from,to).length;}
function occurrenceGroupForDate(empId,date,from,to){return occurrenceGroups(empId,from,to).find(g=>g.dates.includes(date))||null;}
function occurrenceGroupBadge(group){if(!group)return `<span class="small muted">No occurrence</span>`;return group.grouped?`<span class="occurrence-group-mark">Grouped period · ${group.dates.length} consecutive days · 1 occurrence</span>`:`<span class="occurrence-single-mark">Single occurrence</span>`;}
function occCount(empId,asOf){const to=asOf||today(),from=addDays(to,-OCC_WINDOW_DAYS+1);return groupedOccurrenceCount(empId,from,to);}

function ossUsed(empId, asOf){
  if (!S.makeups) return 0;
  const from = addDays(asOf||today(), -365);
  return uniqueMakeups(S.makeups.filter(m=>m.empId===empId && m.oss && m.status!=="Missed" && m.status!=="Cancelled" && m.dateMissed>=from)).length;
}

function metrics(){
  const [f,t]=range(), emps=filteredEmployees(), recs=filteredRecords();
  const c = {}; TYPE_NAMES.forEach(n=>c[n]=0);
  let occ=0;
  recs.forEach(r=>{ c[r.type]=(c[r.type]||0)+1; });
  const empIdsForOcc=new Set(recs.map(r=>r.empId));
  empIdsForOcc.forEach(id=>{occ+=groupedOccurrenceCount(id,f,t);});

  // Calculate default Present count for weekdays only
  let days=[]; for(let d=f; d<=t; d=addDays(d,1)) { if(!isWeekend(d)) days.push(d); }
  let totalPossibleWorkDays = days.length * emps.length;
  let loggedNonPresent = recs.filter(r => r.type !== "Present").length;
  let explicitPresent = recs.filter(r => r.type === "Present").length;
  
  // Default remaining unlogged days/reps as Present
  c["Present"] = explicitPresent + Math.max(0, totalPossibleWorkDays - (explicitPresent + loggedNonPresent));

  const filteredHours = Math.round(recs.filter(r=>!r.cancelled).reduce((sum,r)=>sum+(Number(r.hours)||0),0)*100)/100;
  const filteredHoursByType = recs.filter(r=>!r.cancelled).reduce((out,r)=>{const type=canonicalRecordType(r);out[type]=Math.round(((out[type]||0)+(Number(r.hours)||0))*100)/100;return out;},{});
  const withRec = new Set(recs.map(r=>r.empId));
  const offenders = new Set(recs.filter(isOcc).map(r=>r.empId));
  const perfect = emps.filter(e=>!offenders.has(e.id));
  const empIds = new Set(emps.map(e=>e.id));
  const mus = uniqueMakeups((S.makeups||[]).filter(m=>empIds.has(m.empId) && m.dateMissed>=f && m.dateMissed<=t));
  const muDone = mus.filter(m=>m.status==="Completed").length;
  
  const denom = c["Present"] + Object.keys(c).filter(k => k !== "Present" && k !== "Make up Time").reduce((acc, k) => acc + c[k], 0);
  const rate = denom ? Math.round(100 * c["Present"] / denom) : null;
  
  return {c, occ, perfect, rate, filteredHours, filteredHoursByType, mus, muDone, muPending:mus.filter(m=>m.status==="Pending").length, emps, recs, from:f, to:t};
}

function kpiModal(cat, title) {
  const m = metrics();
  let html = `<h2>${title}</h2>`;
  let rows = "";

  if (cat === "Perfect") {
    if(m.perfect.length === 0) {
      rows = `<tr class="norow"><td colspan="3" class="empty">No perfect attendance in this period.</td></tr>`;
    } else {
      rows = m.perfect.map(e => `<tr data-emp="${esc(e.id)}" style="cursor:pointer"><td><b>${esc(e.name)}</b></td><td>${esc(e.dept)}</td><td>${esc(e.supervisor)}</td></tr>`).join("");
    }

  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    const status = cat === "Make-Ups Pending" ? "Pending" : "Completed";
    let mus = m.mus.filter(x => x.status === status);
    
    const seenDvIds = new Set();
    mus = mus.filter(mu => {
      const key = mu.dvId || mu.mid;
      if (seenDvIds.has(key)) return false;
      seenDvIds.add(key);
      return true;
    });

    if(mus.length === 0) {
      html += `<div class="empty">No ${status.toLowerCase()} make-ups in this period.</div>`;
    } else {
      html += `<div style="display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding-right: 4px;">${mus.map(mu => muRow(mu)).join("")}</div>`;
    }
  } else {
    let recs = cat === "Occurrences" ? m.emps.flatMap(e=>occurrenceGroups(e.id,m.from,m.to).map(g=>{const r=m.recs.find(x=>x.empId===e.id&&g.dates.includes(x.date)&&occurrenceNumber(x.occurrence)>0)||g.records?.[0];return r?{...r,_occGroup:g,date:g.dates[0]}:null}).filter(Boolean)) : m.recs.filter(r => r.type === cat);
    recs.sort((a,b) => b.date.localeCompare(a.date));
    if(recs.length === 0) {
      html += `<div class="empty">No records in this period.</div>`;
    } else {
      html += `<div class="tbl-wrap" style="max-height: 60vh; overflow-y: auto;"><table><thead><tr><th style="text-align:left">Date</th><th style="text-align:left">Employee</th><th style="text-align:left">Type / Time</th><th style="text-align:left">Notes</th></tr></thead><tbody>${recs.map(r => rowRecord(r, false)).join("")}</tbody></table></div>`;
    }
  }

  html += `<div class="mfoot mt"><button class="btn ghost" onclick="closeModal()">Close</button></div>`;
  openModal(html);
  
  const mh = $("#modalHost");
  if (cat === "Perfect") {
    mh.querySelectorAll("tr[data-emp]").forEach(tr=>tr.onclick=()=>{closeModal(); empModal(tr.dataset.emp);});
  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    mh.querySelectorAll("[data-mu-act]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const act=b.dataset.muAct, id=b.dataset.id;
      if(act==="edit") { closeModal(); makeupModal(id); }
      else { setMuStatus(id, act==="approve"?"Approved":act==="complete"?"Completed":"Missed"); closeModal(); }
    });
  } else {
    bindRecordButtons(mh);
  }
}

function calShift(dir){

  if(UI.preset==="day") UI.anchor=addDays(UI.anchor,dir);
  else if(UI.preset==="week") UI.anchor=addDays(UI.anchor,7*dir);
  else if(UI.preset==="month"){ d.setMonth(d.getMonth()+dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="quarter"){ d.setMonth(d.getMonth()+3*dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="annual"){ d.setFullYear(d.getFullYear()+dir); UI.anchor=isoDate(d); }
  else { const [f,t]=range(); const n=Math.max(1,Math.round((parseISO(t)-parseISO(f))/864e5)+1); UI.from=addDays(f,n*dir); UI.to=addDays(t,n*dir); }
  render();
}

function renderMakeup(){
  const [f,t] = range();
  const ids = new Set(filteredEmployees().map(e=>e.id));
  const mus = uniqueMakeups((S.makeups||[]).filter(m => ids.has(m.empId) && (!UI.muFilter || m.status === UI.muFilter)));
  
  const byDate = {};
  mus.forEach(m => {
    const d = m.dateMissed;
    if (d) (byDate[d] = byDate[d] || []).push(m);
  });

  const counts = MU_STATUS.map(s => uniqueMakeups((S.makeups||[]).filter(m => ids.has(m.empId) && m.status === s)).length);

  const head = `<div class="section-title">
    <h2>Make-Up Time Calendar</h2>
    <select id="muFilter">${["",...MU_STATUS].map(s=>`<option ${UI.muFilter===s?"selected":""} value="${esc(s)}">${esc(s||"All statuses")}</option>`).join("")}</select>
    <button class="btn sm" id="muNew">+ New agreement</button>
    <span class="small muted right">Pending ${counts[0]} · Approved ${counts[1]} · Completed ${counts[2]} · Missed ${counts[3]}</span>
  </div>
  <div class="card small mb" style="border-left:4px solid var(--purple)">
    An <b>OSS</b> (Out / Short-Shift) lets an agent make up missed time instead of taking an occurrence or losing pay —
    up to <b>${OSS_LIMIT} per rolling 12 months</b>. Completing the agreed make-up time <b>waives the linked occurrence</b>;
    missing it means the occurrence stands.
  </div>
  <div class="cal-head">
    <button class="btn ghost sm" id="calPrev">&#8249;</button>
    <button class="btn ghost sm" id="calToday">Today</button>
    <button class="btn ghost sm" id="calNext">&#8250;</button>
    <h2>${fmt(f)}${f!==t?" – "+fmt(t):""}</h2>
  </div>`;

  if(UI.preset==="week" || (UI.preset==="adjusted" && addDays(f,10)>t && addDays(f,1)<=t)){
    let days = []; 
    let baseDate = parseISO(f);
    let dayOfWeek = baseDate.getDay();
    
    // Lock onto the Monday of the currently viewed week
    let diffToMonday = dayOfWeek === 0 ? 1 : 1 - dayOfWeek;
    baseDate.setDate(baseDate.getDate() + diffToMonday);
    
    let cur = isoDate(baseDate);
    for(let i = 0; i < 5; i++) {
      days.push(cur);
      cur = addDays(cur, 1);
    }

    if (!UI.selectedMuWeekDay || !days.includes(UI.selectedMuWeekDay)) {
      UI.selectedMuWeekDay = days.includes(today()) ? today() : days[0];
    }

    const dows = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const selDay = UI.selectedMuWeekDay;
    const dayMus = byDate[selDay] || [];

    const weekGridHtml = `<div class="cal-grid" style="grid-template-columns: repeat(5, 1fr); margin-bottom: 20px;">
      ${days.map(ds => {
        const dObj = parseISO(ds);
        const dowName = dows[dObj.getDay()];
        const dMus = byDate[ds]||[];
        const isSelected = ds === selDay;

        return `<div class="cal-cell ${isSelected ? "today" : ""}" data-select-mu-day="${ds}" style="min-height: 80px; cursor: pointer; ${isSelected ? 'border-width: 2px; border-color: var(--brand); background: var(--soft);' : ''}">
          <div class="row"><div class="small muted" style="text-transform: uppercase;">${dowName}</div><div class="d">${dObj.getDate()}</div></div>
          <div class="cal-mini" style="flex-direction:column; gap:2px;">
            ${dMus.slice(0,2).map(m=>{
              const e = emp(m.empId) || {name: m.empId};
              const firstName = esc(e.name.span ? e.name : e.name.split(' ')[0]);
              const timeStr = formatChipTime(m.notes) || hoursToHHMM(m.hoursOwed);
              return `<div class="mu-chip ${esc(m.status)}" title="${esc(e.name)}: ${timeStr}" style="font-size:9px; padding:1px 4px;">${firstName}</div>`;
            }).join("")}
            ${dMus.length > 2 ? `<div class="small muted" style="font-size:9px;">+${dMus.length - 2} more</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`;

    const selectedDateObj = parseISO(selDay);
    const formattedSelectedTitle = selectedDateObj.toLocaleDateString(undefined, {weekday:"long", month:"short", day:"numeric", year:"numeric"});

    const daySectionHtml = `<div class="day-block card">
      <div class="row">
        <b>${formattedSelectedTitle}</b>
        <span class="small muted">${dayMus.length} make-up shift${dayMus.length===1?"":"s"}</span>
        <button class="btn ghost sm right" data-mu-add-day="${selDay}">+ Add</button>
      </div>
      ${dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:10px;">${dayMus.map(muRow).join("")}</div>` : `<div class="small muted mt">No make-up shifts scheduled for this day.</div>`}
    </div>`;

    return head + weekGridHtml + daySectionHtml;
  }

  // Fallback for month/other views
  let days=[]; for(let d=f; d<=t; d=addDays(d,1)) days.push(d);
  return head + `<div class="cal-list">${days.map(d=>{
    const dayMus = byDate[d] || [];
    return `<div class="day-block card">
      <div class="row">
        <b>${fmtShort(d)}</b>
        <span class="small muted">${dayMus.length} make-up shift${dayMus.length===1?"":"s"}</span>
        <button class="btn ghost sm right" data-mu-add-day="${esc(d)}">+ Add</button>
      </div>
      ${dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:10px;">${dayMus.map(muRow).join("")}</div>` : `<div class="small muted mt">No make-up shifts scheduled.</div>`}
    </div>`;
  }).join("")}</div>`;
}
  
function setMuStatus(mid,status){
  const m=S.makeups.find(x=>x.mid===mid); if(!m) return;
  m.status=status;
  if(status==="Completed"){ m.completedDate=today();
    const r=S.records.find(r=>r.rid===m.rid)||S.records.find(r=>r.empId===m.empId&&r.date===m.dateMissed&&TYPES[r.type].occ);
    if(r){ r.waived=true; m.rid=r.rid; }
    toast("Make-up completed — occurrence waived");
  } else if(status==="Missed"){
    const r=S.records.find(r=>r.rid===m.rid); if(r) r.waived=false;
    toast("Marked missed — occurrence stands");
  } else toast("Agreement "+status.toLowerCase());
  save(); render();
}

function getRecordTimestamp(r) {
  if (!r) return 0;
  const raw = r.submittedOn || r.createdon || r.date || 0;
  const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(String(raw));
  const t = dateOnly ? parseISO(String(raw)).setHours(12,0,0,0) : new Date(raw).getTime();
  return isNaN(t) ? 0 : t;
}

function formatSubmittedTime(isoStr) {
  if (!isoStr) return "";
  const d = new Date(isoStr);
  return isNaN(d.getTime()) ? "" : d.toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}

function occurrenceViewModel(empId,from="2025-01-01",to=today()){return occurrenceGroups(empId,from,to).map(g=>({...g,count:1,dateLabel:g.dates.map(fmt).join(" → "),badgeHtml:occurrenceGroupBadge(g)}));}
function occurrenceGroupForRecord(r){if(!r||!isOcc(r)||!r.empId||!r.date)return null;return occurrenceViewModel(r.empId).find(g=>g.dates.includes(r.date))||null;}
function occurrenceDisplayForRecord(r){const g=occurrenceGroupForRecord(r);if(!g)return "";const isStart=g.dates[0]===r.date;return `<div class="small mt"><span class="badge ${g.grouped?"warn":"bad"}">${esc(g.label)}</span><div class="muted">${g.dates.map(fmt).join(" → ")} · ${isStart?"counts as 1 occurrence":"same occurrence group · +0"}</div></div>`;}
function rowRecord(r, slim){
  const e=emp(r.empId)||{name:r.empId};

    r.waived?`<span class="badge ok" title="Occurrence waived via completed make-up">waived</span>`:null,

  const groupNote=r._occGroup?`<div class="small muted"><span class="badge warn">${esc(r._occGroup.label)}</span> ${r._occGroup.dates.map(fmt).join(" → ")} · 1 occurrence</div>`:occurrenceDisplayForRecord(r);

  const groupRowClass=visibleGroup?.grouped?" occurrence-group-rainbow":"";

  const bottomTagsHtml = (r.fmla || r.voicemail) 
    ? `<div class="row" style="gap:6px; margin-top:8px;">${fmlaTag}${vmTag}</div>`

  if (slim) {
    const rawNotes = (r.type === "Make up Time") ? getRelevantMakeUpNotes(r.notes, r.date) : r.notes;
    return `<div class="cal-row ${r.cancelled ? 'cancelled' : ''}${groupRowClass}" data-rec="${esc(r.rid)}" style="cursor:pointer" title="Click to edit record">
      <div class="row-top">
        <div style="font-weight: 600; font-size: 15px; min-width: 150px;">${esc(e.name)}</div>

        ${submittedDisplay ? `<div class="small muted" style="margin-left: auto;">Submitted: ${esc(submittedDisplay)}</div>` : ""}

function renderRecords(){
  const recs = filteredRecords().sort((a, b) => {
    // Fallback chain: submittedOn -> createdon -> date
    const timeA = new Date(a.submittedOn || a.createdon || a.date || 0).getTime();
    const timeB = new Date(b.submittedOn || b.createdon || b.date || 0).getTime();
    
    // Sort direction: UI.sortDir (1 for oldest on top, -1 for newest on top)
    return UI.sortDir * (timeA - timeB);
  });

  return `<div class="section-title"><h2>Records (${recs.length})</h2>
    <button class="btn sm" id="recNew">+ Add record</button></div>
  <div class="card tbl-wrap"><table><thead><tr>

}

    ${r.mgrNotes ? `<div class="mt small" style="padding:10px; background:var(--soft); border-radius:8px; border-left:3px solid var(--teal);"><b>Manager Notes:</b><br>${esc(r.mgrNotes).replace(/\n/g, '<br>')}</div>` : ""}
    <div class="mt"><label for="mWfNotes">Workforce Notes</label><textarea id="mWfNotes" rows="2" placeholder="Enter workforce notes here...">${esc(r.wfNotes || "")}</textarea></div>

    <div class="mfoot">
      ${rid?`<button class="btn ghost" id="mDel" style="margin-right:auto">Cancel request</button>`:`<span class="small muted right" style="margin-right:auto">Tip: for an occurrence type you can create a make-up agreement after saving.</span>`}

    const empId = $("#mEmp").value;

    const notes = $("#mNotes").value.trim();
    const wfNotes = $("#mWfNotes").value.trim();

    const voicemail = $("#mVoicemail").checked;

    if (rid) {
      const targetRec = S.records.find(x => x.rid === rid);

          }else if(targetRec.attendanceId){
            await patchCsrAttendanceRecord(targetRec.attendanceId,{startDate:dFrom,endDate:dTo,type,notes:notes||wfNotes,occurrence,requestId:targetRec.requestId,employeeName:emp(empId)?.name||""});
          }else{
            throw new Error("This calendar row has no Dataverse Time Off ID or CSR Attendance ID and cannot be updated safely.");
          }

          // 2. Remove previous split days belonging to this request
          const baseKey = targetRec.dvId || (targetRec.rid.includes('-') ? targetRec.rid.split('-')[0] : targetRec.rid);
          S.records = S.records.filter(r => {
            if (targetRec.dvId && r.dvId === targetRec.dvId) return false;
            if (!targetRec.dvId && (r.rid === baseKey || r.rid.startsWith(baseKey + '-'))) return false;
            return true;
          });

          // 3. Re-create cards locally for every day in the new range
          const workDates=[];for(let cur=parseISO(dFrom),end=parseISO(dTo);cur<=end;cur.setDate(cur.getDate()+1)){const iso=isoDate(cur);if(!isWeekend(iso))workDates.push(iso);}
          const totalCents=Math.round(hours*100),baseCents=workDates.length?Math.floor(totalCents/workDates.length):0;
          workDates.forEach((curDateStr,idx)=>{
            const dayHours=(idx===workDates.length-1?totalCents-baseCents*(workDates.length-1):baseCents)/100;
            S.records.push({
              rid: `${baseKey}-${idx}`,
              dvId: targetRec.dvId || "",
              requestId: targetRec.requestId || "",
              date: curDateStr,
              empId,
              type,
              hours:dayHours,
              requestHoursTotal:hours,workingDayCount:workDates.length,
              notes,
              wfNotes,
              mgrNotes: targetRec.mgrNotes || "",
              partialShift,
              submittedOn: targetRec.submittedOn || new Date().toISOString(),
              source: targetRec.source || "dataverse",
              attendanceId: targetRec.attendanceId || "",
              attendanceMatched: !!targetRec.attendanceMatched,
              occurrenceSource: targetRec.occurrenceSource || (targetRec.attendanceId?"CSR Attendance":"Time Off"),
              dateSource:"manual editor (explicit ISO date)", dateConfidence:"high",
              rawLeaveType: type,
              waived: targetRec.waived || false,
              cancelled: targetRec.cancelled || false,
              fmla,
              voicemail,
              occurrence: idx === 0 ? occurrence : 0,
              csrAttendanceTracker:trackerSnapshot,
              calendarTypeSource:"cr714_leavetype"
            });
          });
          toast("Record updated and date range applied");
        } catch (err) {
          console.error("Update failed:", err);
          toast("Failed to update record: " + err.message);
        } finally {
          hideSyncCover();
        }
      }
    } else {
      let current = parseISO(dFrom);
      const end = parseISO(dTo);
      const selectedEmp = emp(empId);
      
      showSyncCover("Creating record in Dataverse...");
      try {
        const token = await getDataverseToken();
        if (!token) throw new Error("Authentication missing");

        const existingManualIds = (S.records || [])
          .map(r => r.requestId)
          .filter(id => id && String(id).startsWith("M"))
          .map(id => parseInt(String(id).slice(1), 10))
          .filter(n => !isNaN(n));
        let nextSeq = existingManualIds.length > 0 ? Math.max(...existingManualIds) + 1 : 1;

        while(current <= end) {
          const manualId = `M${String(nextSeq).padStart(5, "0")}`;
          nextSeq++;

          const curDateStr = isoDate(current);
          const payload = {
            cr714_id: manualId,
            cr714_name: selectedEmp ? selectedEmp.name : empId,
            cr714_email: selectedEmp ? selectedEmp.email : "",
            cr714_requestdates: curDateStr,
            cr714_startdate: `${curDateStr}T00:00:00Z`,
            cr714_enddate: `${curDateStr}T00:00:00Z`,

          };

          const res = await fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json",
              "Accept": "application/json",
              "OData-MaxVersion": "4.0",
              "OData-Version": "4.0"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            throw new Error(`Dataverse POST failed [${res.status}]: ${await res.text()}`);
          }

          const entityIdHeader = res.headers.get("OData-EntityId");
          let newDvId = "";
          if (entityIdHeader) {
            const match = entityIdHeader.match(/\(([^)]+)\)/);
            if (match) newDvId = match[1];
          }

          S.records.push({ 
            rid: uid("r"), 
            dvId: newDvId,
            requestId: manualId,
            date: curDateStr, 
            empId, 
            type, 
            hours, 
            notes, 
            wfNotes,
            partialShift,
            submittedOn: new Date().toISOString(),
            source: "dataverse", 
            waived: false, 
            fmla,
            voicemail,
            occurrence,
            csrAttendanceTracker:payload.cr714_csrattendancetracker,
            occurrenceSource:"Time Off",
            calendarTypeSource:"cr714_leavetype", dateSource:"manual entry (explicit ISO date)", dateConfidence:"high",
            rawLeaveType:type
          });

          current.setDate(current.getDate() + 1);
        }
        toast(dFrom === dTo ? "Record saved to Dataverse" : "Records saved to Dataverse");
      } catch (err) {
        console.error("Failed to create record in Dataverse:", err);
        toast("Failed to save to Dataverse: " + err.message);
      } finally {
        hideSyncCover();
      }
    }
      
    recalculateAfterDedupe();
    save(); closeModal(); render(); 
  };
}

function normalizedRecordText(r){return [r.empId,r.date,r.type,r.notes||r.wfNotes||r.attendanceNotes||""] .map(v=>String(v||"").trim().toLowerCase().replace(/\s+/g," ")).join("|");}
function consolidatedOccurrenceBlocks(empId,from,to){
  const period=consolidatedDisplayRecords((S.records||[]).filter(r=>r.empId===empId&&r.date>=from&&r.date<=to));
  const groups=occurrenceGroups(empId,from,to);
  const consumed=new Set(),blocks=[];
  groups.forEach(g=>{
    const related=period.filter(r=>g.dates.includes(r.date)&&occurrenceNumber(r.occurrence)>0);
    related.forEach(r=>consumed.add(r.rid));
    const bySemantic=new Map();related.forEach(r=>{const k=normalizedRecordText(r),x=bySemantic.get(k)||{...r,_variants:[]};x._variants.push(r);bySemantic.set(k,x);});
    const rows=[...bySemantic.values()];
    blocks.push({kind:"group",group:g,rows,records:related,waived:related.some(r=>r.waived),cancelled:related.some(r=>r.cancelled)});
  });
  period.filter(r=>!consumed.has(r.rid)).forEach(r=>blocks.push({kind:"record",record:r}));
  return blocks.sort((a,b)=>{const ad=a.kind==="group"?a.group.dates[0]:a.record.date,bd=b.kind==="group"?b.group.dates[0]:b.record.date;return bd.localeCompare(ad);});
}

function displayTimeRange(r){let raw="";if(r.type==="Shift Trade"&&r.shiftTrade)raw=String(r.shiftTrade).trim();else if(r.partialShift)raw=String(r.partialShift).trim();else{const notes=[r.notes,r.wfNotes,r.mgrNotes].filter(Boolean).join(" ");const m=notes.match(/(\d{1,2}:\d{2}\s*(?:AM|PM))\s*[–-]\s*(\d{1,2}:\d{2}\s*(?:AM|PM))/i);if(m)raw=`${m[1]} - ${m[2]}`;}if(!raw)return "";if(/^\s*\d+(?:\.\d+)?\s*h(?:r|rs|our|ours)?\s*$/i.test(raw))return "";return raw.replace(/\s+[–-]\s+/g," to ");}

  const allowedNames=new Set(filteredEmployees().map(e=>String(e.name||"").trim().toLowerCase()));
  const [from,to]=range();
  return (S.csrAttendanceRows||[]).filter(row=>{
    const start=row.cr714_startdate?String(row.cr714_startdate).slice(0,10):"";
    const end=row.cr714_enddate?String(row.cr714_enddate).slice(0,10):start;
    const name=String(row.cr714_employeename||"").trim().toLowerCase();
    const mapped=mapLeaveType(row.cr714_typeofleave);
    return allowedNames.has(name)&&start<=to&&end>=from&&(!UI.type||mapped===UI.type);
  }).sort((a,b)=>String(b.cr714_startdate||"").localeCompare(String(a.cr714_startdate||""))||String(a.cr714_employeename||"").localeCompare(String(b.cr714_employeename||"")));
}
function renderCsrAttendance(){
  const rows=filteredCsrAttendanceRows(),linked=rows.filter(csrLinkedRecord).length;
  return `<div class="section-title"><h2>CSR Attendance Tracker</h2><span class="small muted">Edits update this CSR row and its linked Time Off form line.</span><button class="btn ghost sm right" id="csrReconcileNow">&#8635; Reconcile links</button></div>
  <div class="grid kpis mb">${kpi(rows.length,"CSR rows in filter","var(--blue)","")}${kpi(linked,"Linked to Time Off","var(--green)","")}${kpi(rows.length-linked,"Missing Time Off link",rows.length-linked?"var(--red)":"var(--green)","")}</div>
  <div class="card tbl-wrap"><table><thead><tr><th>Employee</th><th>Start</th><th>End</th><th>Leave type</th><th>Occurrence</th><th>Time Off link</th><th>Notes</th><th></th></tr></thead><tbody>${rows.map(row=>{const link=csrLinkedRecord(row),id=row.cr714_csrattendancetrackerid||"";return `<tr data-csr-row="${esc(id)}"><td><b>${esc(row.cr714_employeename||"")}</b><div class="small muted">${esc(row.cr714_id||"")}</div></td><td>${fmt(String(row.cr714_startdate||"").slice(0,10))}</td><td>${fmt(String(row.cr714_enddate||row.cr714_startdate||"").slice(0,10))}</td><td>${pill(mapLeaveType(row.cr714_typeofleave))}</td><td>${occurrenceNumber(row.cr714_occurrence)||0}</td><td>${link?`<span class="badge ok">Linked</span><div class="small muted">${esc(link.requestId||link.dvId)}</div>`:`<span class="badge bad">Missing</span>`}</td><td class="small"><div class="compact-note" title="${esc(row.cr714_notes||"")}">${esc(row.cr714_notes||"")}</div></td><td><button class="btn ghost sm" data-csr-edit="${esc(id)}">Edit linked row</button></td></tr>`;}).join("")||`<tr class="norow"><td colspan="8" class="empty">No CSR Attendance rows match the current filters.</td></tr>`}</tbody></table></div>`;
}
function csrAttendanceModal(attendanceId){
  const row=(S.csrAttendanceRows||[]).find(x=>String(x.cr714_csrattendancetrackerid||"")===String(attendanceId||""));if(!row)return toast("CSR Attendance row not found");
  const linked=csrLinkedRecord(row),start=String(row.cr714_startdate||"").slice(0,10),end=String(row.cr714_enddate||row.cr714_startdate||"").slice(0,10),mapped=mapLeaveType(row.cr714_typeofleave);
  openModal(`<h2>Edit CSR Attendance Tracker</h2><div class="card mb" style="border-left:4px solid ${linked?'var(--green)':'var(--red)'}"><b>${linked?'Linked Time Off line found':'Time Off link missing'}</b><div class="small muted mt">${linked?`Saving updates CSR Attendance and Time Off request ${esc(linked.requestId||linked.dvId)}.`:'Run reconciliation first. A linked Time Off row is required so changes remain synchronized.'}</div></div><div class="mrow"><div><label>Employee</label><input id="csrEmployee" value="${esc(row.cr714_employeename||"")}" readonly></div><div><label>Request ID</label><input id="csrRequestId" value="${esc(row.cr714_id||"")}" readonly></div></div><div class="mrow"><div><label>Start date</label><input type="date" id="csrStart" value="${esc(start)}"></div><div><label>End date</label><input type="date" id="csrEnd" value="${esc(end)}"></div><div><label>Leave type</label><select id="csrType">${TYPE_NAMES.map(t=>`<option ${t===mapped?'selected':''}>${esc(t)}</option>`).join("")}</select></div></div><div class="mrow"><div><label>Occurrence</label><input type="number" min="0" step="1" id="csrOccurrence" value="${occurrenceNumber(row.cr714_occurrence)||0}"></div></div><div><label>Notes</label><textarea id="csrNotes" rows="7">${esc(row.cr714_notes||"")}</textarea></div><div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="csrSave" ${linked?'':'disabled'}>Save both linked lines</button></div>`,"CSR Attendance Tracker");
  const saveBtn=$("#csrSave");if(!saveBtn)return;saveBtn.onclick=async()=>{const fields={startDate:$("#csrStart").value,endDate:$("#csrEnd").value,type:$("#csrType").value,notes:$("#csrNotes").value.trim(),occurrence:Number($("#csrOccurrence").value)||0,requestId:row.cr714_id||linked?.requestId||"",employeeName:row.cr714_employeename||emp(linked?.empId)?.name||""};if(!fields.startDate||!fields.endDate)return toast("Start and end dates are required");if(fields.startDate>fields.endDate)return toast("Start date cannot be after end date");saveBtn.disabled=true;showSyncCover("Updating CSR Attendance and linked Time Off line...");try{await patchCsrAttendanceRecord(attendanceId,fields);Object.assign(row,{cr714_startdate:`${fields.startDate}T00:00:00Z`,cr714_enddate:`${fields.endDate}T00:00:00Z`,cr714_typeofleave:fields.type,cr714_notes:fields.notes,cr714_occurrence:String(fields.occurrence)});await pullFromDataverse(true);closeModal();UI.tab="csrAttendance";render();toast("CSR Attendance and linked Time Off line updated");}catch(error){console.error(error);toast(error.message);}finally{hideSyncCover();saveBtn.disabled=false;}};
}
function renderEmployeeData(){return `<div class="section-title"><h2>Employee Data</h2><span class="small muted">Employee Data Hub is isolated inside this tab to preserve both apps' existing controls and authentication behavior.</span></div><div class="employee-data-shell"><iframe id="employeeDataFrame" class="employee-data-frame" title="Employee Data Hub" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"></iframe></div>`;}
function hydrateEmployeeDataFrame(){const frame=$("#employeeDataFrame");if(!frame||frame.dataset.loaded)return;frame.dataset.loaded="true";try{frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(EMPLOYEE_DATA_APP_B64),c=>c.charCodeAt(0)));}catch(error){console.error("Employee Data tab failed to load",error);frame.srcdoc="<p style='font-family:Segoe UI;padding:20px'>Employee Data could not be loaded.</p>";}}
function render(){
  recalculateAfterDedupe();
  stableSortState();
  renderNav(); renderFilters(); setSync("");
  const v=$("#view");
  switch(UI.tab){
    case "dashboard": v.innerHTML=renderDashboard(); drawCharts(); break;
    case "occurrenceOverview": v.innerHTML=renderOccurrenceOverview(); break;
    case "calendar":  v.innerHTML=renderCalendar(); break;
    case "team":      v.innerHTML=renderTeam(); break;
    case "csrAttendance": v.innerHTML=renderCsrAttendanceFromTracker(); break;
    case "rejected": v.innerHTML=renderRejectedRecords(); break;
    case "employeeData": v.innerHTML=renderEmployeeData(); hydrateEmployeeDataFrame(); break;
    case "makeup":    v.innerHTML=renderMakeup(); break;
    case "email":     v.innerHTML=renderEmail(); break;
  }
  if(UI.tab!=="employeeData"&&v.innerHTML)v.insertAdjacentHTML("afterbegin",reportingContext(UI.tab));
  bindView();
}
  
function bindRecordButtons(root){
  root.querySelectorAll("[data-rec]").forEach(el => {
    el.onclick = () => recordModal(el.dataset.rec);
  });
}

function bindView(){
  const v=$("#view");
  v.querySelectorAll("tr[data-emp]").forEach(tr=>tr.onclick=()=>empModal(tr.dataset.emp));
  v.querySelectorAll("tr[data-overview-rep]").forEach(tr=>tr.onclick=()=>{UI.overviewRep=tr.dataset.overviewRep;render();});
  v.querySelectorAll(".cal-cell[data-day]").forEach(c=>c.onclick=()=>dayModal(c.dataset.day));
  
  // Weekly calendar day selection handlers
  v.querySelectorAll(".cal-cell[data-select-day]").forEach(c=>{
    c.onclick = () => {
      UI.selectedWeekDay = c.dataset.selectDay;
      render();
    };
  });

  v.querySelectorAll(".cal-cell[data-select-mu-day]").forEach(c=>{
    c.onclick = () => {
      UI.selectedMuWeekDay = c.dataset.selectMuDay;
      render();
    };
  });

  v.querySelectorAll("[data-add-day]").forEach(b=>b.onclick=e=>{e.stopPropagation();recordModal(null,b.dataset.addDay);});
  
  v.querySelectorAll(".cal-cell[data-mu-day]").forEach(c=>{
    c.onclick = (e) => {
      if(!e.target.closest(".mu-chip")) muDayModal(c.dataset.muDay);
    };
  });
  v.querySelectorAll(".mu-chip[data-mu-id]").forEach(chip=>{
    chip.onclick = (e) => {
      e.stopPropagation();
      makeupModal(chip.dataset.muId);
    };
  });
  v.querySelectorAll("[data-mu-add-day]").forEach(b=>b.onclick=e=>{e.stopPropagation();makeupModal(null,{date:b.dataset.muAddDay});});

  v.querySelectorAll("th[data-team-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.teamSort; 
    UI.teamSortDir = UI.teamSortKey === k ? -UI.teamSortDir : 1; 
    UI.teamSortKey = k; 
    render();
  });

  bindRecordButtons(v);
  bindSortableTables(v);
  v.querySelectorAll("[data-mu-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();
    const act=b.dataset.muAct, id=b.dataset.id;
    if(act==="edit") makeupModal(id);
    else setMuStatus(id, act==="approve" ? "Approved" : act==="complete" ? "Completed" : "Missed");});
  v.querySelectorAll("tr[data-mu]").forEach(tr=>tr.onclick=()=>{ makeupModal(tr.dataset.mu); });
  v.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort; UI.sortDir=UI.sortKey===k?-UI.sortDir:-1; UI.sortKey=k; render();});
  if(UI.tab==="rejected"){
    v.querySelectorAll("[data-rejected-fix]").forEach(btn=>btn.onclick=()=>rejectedRecordModal(btn.dataset.rejectedFix));
    v.querySelectorAll("[data-rejected-remove]").forEach(btn=>btn.onclick=()=>suppressRejectedRecord(btn.dataset.rejectedRemove));
    const refresh=$("#rejectedRefresh");if(refresh)refresh.onclick=()=>pullFromDataverse(false,{full:true});
  }
  if(UI.tab==="csrAttendance"){
    v.querySelectorAll("[data-tracker-edit]").forEach(btn=>btn.onclick=()=>recordModal(btn.dataset.trackerEdit));
    const refresh=$("#trackerRefresh");if(refresh)refresh.onclick=()=>pullFromDataverse(false,{full:true});
  }
  if(UI.tab==="email"){
    const templateSelect=$("#emailTemplate");if(templateSelect)templateSelect.onchange=()=>{saveEmailDraft();refreshEmailColorEditor();bindEmailColorControls();refreshEmailTemplatePreview();};
    document.querySelectorAll("[data-email-template-card]").forEach(card=>card.onclick=()=>{if(templateSelect)templateSelect.value=card.dataset.emailTemplateCard;saveEmailDraft();v.innerHTML=renderEmail();bindView();});
    bindEmailColorControls();
    const regen=$("#emailRegen");if(regen)regen.onclick=()=>{const prior=saveEmailDraft(),fresh=defaultEmail();fresh.to=prior.to;fresh.subject=prior.subject;fresh.template=prior.template;fresh.nightCoverage=prior.nightCoverage;fresh.body=cleanAttendanceEmailDurations(`Good Morning Team!\n\n${emailSections(prior.nightCoverage)}`);try{localStorage.setItem(EMAIL_DRAFT_KEY,JSON.stringify(fresh));}catch(e){}v.innerHTML=renderEmail();bindView();};
    const night=$("#emailNightCoverage");if(night)night.onchange=()=>{saveEmailDraft();const prior=loadEmailDraft()||defaultEmail();prior.body=cleanAttendanceEmailDurations(`Good Morning Team!\n\n${emailSections(night.value)}`);try{localStorage.setItem(EMAIL_DRAFT_KEY,JSON.stringify(prior));}catch(e){}v.innerHTML=renderEmail();bindView();};
    [$("#emailTo"),$("#emailSubject"),$("#emailBody"),$("#emailTemplate"),$("#emailNightCoverage")].filter(Boolean).forEach(el=>el.addEventListener("input",()=>{clearTimeout(window._emailSave);window._emailSave=setTimeout(()=>{saveEmailDraft();refreshEmailTemplatePreview();},250);}));
    const dl=$("#emailDownload");if(dl)dl.onclick=downloadEmail;
    const send=$("#emailSend");if(send)send.onclick=async()=>{send.disabled=true;try{await sendAttendanceEmail();}catch(e){console.error(e);toast(e.message);}finally{send.disabled=false;}};
  }
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el[ev]=fn; };
  on("#calPrev","onclick",()=>calShift(-1)); on("#calNext","onclick",()=>calShift(1));
  on("#calToday","onclick",()=>{UI.anchor=today(); UI.selectedWeekDay=today(); UI.selectedMuWeekDay=today(); render();});
  on("#calAdd","onclick",()=>recordModal(null, UI.selectedWeekDay || UI.anchor));
  on("#overviewBack","onclick",()=>{UI.overviewRep="";render();});
  on("#recNew","onclick",()=>recordModal());
  on("#muNew","onclick",()=>makeupModal());
  on("#muFilter","onchange",()=>{UI.muFilter=$("#muFilter").value;render();});
}

$("#nav").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ UI.tab=b.dataset.tab; if(UI.tab!=="occurrenceOverview") UI.overviewRep=""; render(); }});
$("#filterBar").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fPreset"){ UI.preset=t.value; if(UI.preset==="adjusted"){const [f,x]=range(); UI.from=UI.from||f; UI.to=UI.to||x;} }
  else if(t.id==="fAnchor") UI.anchor=t.value||today();
  else if(t.id==="fFrom") UI.from=t.value;
  else if(t.id==="fTo") UI.to=t.value;
  else if(t.classList.contains("ffield")) UI[t.dataset.f]=t.value;
  render();
  // Date and period filters operate on the daily IndexedDB cache. Use Sync for a fresh Dataverse pull.
});
$("#filterBar").addEventListener("input",e=>{ if(e.target.id==="fQ"){ UI.q=e.target.value;
  clearTimeout(window._qh); window._qh=setTimeout(render,250); }});
$("#filterBar").addEventListener("click",e=>{ if(e.target.id==="fClear"){
  Object.assign(UI,{preset:"month",anchor:today(),from:null,to:null,dept:"",repName:"",title:"",supervisor:"",manager:"",q:"",type:""}); render(); }});

$("#syncBtn").onclick=async()=>{if(refreshInFlight)return;refreshInFlight=true;try{await pullFromDataverse(false,{full:true});lastSuccessfulRefresh=Date.now();}finally{refreshInFlight=false;resetRefreshCountdown();}};

document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

renderNav(); renderFilters(); setSync("Loading local cache...");

</script>
</body>
