      <div style="display:flex; align-items:flex-end; gap:16px;">
        <label class="row" style="font-size:13.5px;font-weight:600;cursor:pointer;padding-bottom:10px;">
          <input type="checkbox" id="mFmla" ${r.fmla?"checked":""} style="width:auto;cursor:pointer;"> FMLA
        </label>
        <label class="row" style="font-size:13.5px;font-weight:600;cursor:pointer;padding-bottom:10px;">
          <input type="checkbox" id="mVoicemail" ${r.voicemail?"checked":""} style="width:auto;cursor:pointer;"> Voicemail
        </label>
      </div>
    </div>
    
    <div><label for="mNotes">Notes</label><textarea id="mNotes" rows="2">${esc(r.notes)}</textarea></div>
    ${r.mgrNotes ? `<div class="mt small" style="padding:10px; background:var(--soft); border-radius:8px; border-left:3px solid var(--teal);"><b>Manager Notes:</b><br>${esc(r.mgrNotes).replace(/\n/g, '<br>')}</div>` : ""}
    <div class="mt"><label for="mWfNotes">Workforce Notes</label><textarea id="mWfNotes" rows="2" placeholder="Enter workforce notes here...">${esc(r.wfNotes || "")}</textarea></div>

    <div class="mfoot">
      ${rid?`<button class="btn ghost" id="mDel" style="margin-right:auto">Cancel request</button>`:`<span class="small muted right" style="margin-right:auto">Tip: for an occurrence type you can create a make-up agreement after saving.</span>`}
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="mSave">Save</button></div>`);

  if (rid) {
    const targetRec = S.records.find(x => x.rid === rid);
    const isCancelled = targetRec?.cancelled;
    $("#mDel").textContent = isCancelled ? "Restore request" : "Cancel request";
    $("#mDel").className = "btn ghost";
    $("#mDel").onclick = () => toggleCancelRecord(rid);
  }

  $("#occMinus").onclick = (e) => { 
    e.preventDefault(); 
    const inp = $("#mOcc"); 
    inp.value = Math.max(0, parseInt(inp.value || 0, 10) - 1); 
  };
  $("#occPlus").onclick = (e) => { 
    e.preventDefault(); 
    const inp = $("#mOcc"); 
    inp.value = Math.max(0, parseInt(inp.value || 0, 10) + 1); 
  };

  $("#mSave").onclick = async () => {
    const dFrom = $("#mDate").value;
    const elTo = $("#mDateTo");
    const dTo = elTo ? elTo.value : dFrom; 
    
    if(!dFrom||!$("#mEmp").value) return toast("Date and employee are required");
    if(dFrom > dTo) return toast("From date must be before To date");
    
    const empId = $("#mEmp").value;
    const type = $("#mType").value;
    const hours = parseFloat($("#mHours").value)||0;
    const notes = $("#mNotes").value.trim();
    const wfNotes = $("#mWfNotes").value.trim();
    const partialShift = $("#mPartial").value.trim();
    const fmla = $("#mFmla").checked;
    const voicemail = $("#mVoicemail").checked;
    const occurrence = parseInt($("#mOcc").value, 10) || 0;

    if (rid) {
      const targetRec = S.records.find(x => x.rid === rid);
      if (targetRec) {
        showSyncCover("Updating record in Dataverse...");
        try {
          const toUSDate = (iso) => {
            const [y, m, d] = iso.split("-");
            return `${m}/${d}/${y}`;
          };
          const formattedReqDates = dFrom === dTo 
            ? toUSDate(dFrom) 
            : `${toUSDate(dFrom)} - ${toUSDate(dTo)}`;

          // 1. Send update to Dataverse
          if(targetRec.dvId){
            await patchDataverseRecord(targetRec.dvId,{cr714_requestdates:formattedReqDates,cr714_leavetype:type,cr714_requestnotes:notes,cr714_wfnotes:wfNotes,cr714_occurrence:occurrence,cr714_ptohoursrequested:hours,cr714_hoursofpartialshift:partialShift,cr714_fmla:fmla,cr714_voicemail:voicemail});
          }else if(targetRec.attendanceId){
            await patchCsrAttendanceRecord(targetRec.attendanceId,{startDate:dFrom,endDate:dTo,type,notes:notes||wfNotes,occurrence});
          }else{
            throw new Error("This calendar row has no Dataverse Time Off ID or CSR Attendance ID and cannot be updated safely.");
          }

          // 2. Remove previous split days belonging to this request
          const baseKey = targetRec.dvId || (targetRec.rid.includes('-') ? targetRec.rid.split('-')[0] : targetRec.rid);
          S.records = S.records.filter(r => {
            if (targetRec.dvId && r.dvId === targetRec.dvId) return false;
            if (!targetRec.dvId && (r.rid === baseKey || r.rid.startsWith(baseKey + '-'))) return false;
            return true;
          });

          // 3. Re-create cards locally for every day in the new range
          const workDates=[];for(let cur=parseISO(dFrom),end=parseISO(dTo);cur<=end;cur.setDate(cur.getDate()+1)){const iso=isoDate(cur);if(!isWeekend(iso))workDates.push(iso);}
          const totalCents=Math.round(hours*100),baseCents=workDates.length?Math.floor(totalCents/workDates.length):0;
          workDates.forEach((curDateStr,idx)=>{
            const dayHours=(idx===workDates.length-1?totalCents-baseCents*(workDates.length-1):baseCents)/100;
            S.records.push({
              rid: `${baseKey}-${idx}`,
              dvId: targetRec.dvId || "",
              requestId: targetRec.requestId || "",
              date: curDateStr,
              empId,
              type,
              hours:dayHours,
              requestHoursTotal:hours,workingDayCount:workDates.length,
              notes,
              wfNotes,
              mgrNotes: targetRec.mgrNotes || "",
              partialShift,
              submittedOn: targetRec.submittedOn || new Date().toISOString(),
              source: targetRec.source || "dataverse",
              attendanceId: targetRec.attendanceId || "",
              attendanceMatched: !!targetRec.attendanceMatched,
              occurrenceSource: targetRec.occurrenceSource || (targetRec.attendanceId?"CSR Attendance":"Time Off"),
              dateSource: targetRec.dateSource || (targetRec.attendanceId?"CSR Attendance cr714_startdate/cr714_enddate":"cr714_requestdates"),
              rawLeaveType: type,
              waived: targetRec.waived || false,
              cancelled: targetRec.cancelled || false,
              fmla,
              voicemail,
              occurrence: idx === 0 ? occurrence : 0
            });
          });
          toast("Record updated and date range applied");
        } catch (err) {
          console.error("Update failed:", err);
          toast("Failed to update record: " + err.message);
        } finally {
          hideSyncCover();
        }
      }
    } else {
      let current = parseISO(dFrom);
      const end = parseISO(dTo);
      const selectedEmp = emp(empId);
      
      showSyncCover("Creating record in Dataverse...");
      try {
        const token = await getDataverseToken();
        if (!token) throw new Error("Authentication missing");

        const existingManualIds = (S.records || [])
          .map(r => r.requestId)
          .filter(id => id && String(id).startsWith("M"))
          .map(id => parseInt(String(id).slice(1), 10))
          .filter(n => !isNaN(n));
        let nextSeq = existingManualIds.length > 0 ? Math.max(...existingManualIds) + 1 : 1;

        while(current <= end) {
          const manualId = `M${String(nextSeq).padStart(5, "0")}`;
          nextSeq++;

          const curDateStr = isoDate(current);
          const payload = {
            cr714_id: manualId,
            cr714_name: selectedEmp ? selectedEmp.name : empId,
            cr714_email: selectedEmp ? selectedEmp.email : "",
            cr714_requestdates: curDateStr,
            cr714_leavetype: type,
            cr714_requestnotes: notes,
            cr714_wfnotes: wfNotes,
            cr714_occurrence: String(occurrence),
            cr714_ptohoursrequested: String(hours),
            cr714_hoursofpartialshift: partialShift,
            cr714_fmla: fmla ? "true" : "false",
            cr714_voicemail: voicemail ? "true" : "false"
          };

          const res = await fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json",
              "Accept": "application/json",
              "OData-MaxVersion": "4.0",
              "OData-Version": "4.0"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            throw new Error(`Dataverse POST failed [${res.status}]: ${await res.text()}`);
          }

          const entityIdHeader = res.headers.get("OData-EntityId");
          let newDvId = "";
          if (entityIdHeader) {
            const match = entityIdHeader.match(/\(([^)]+)\)/);
            if (match) newDvId = match[1];
          }

          S.records.push({ 
            rid: uid("r"), 
            dvId: newDvId,
            requestId: manualId,
            date: curDateStr, 
            empId, 
            type, 
            hours, 
            notes, 
            wfNotes,
            partialShift,
            submittedOn: new Date().toISOString(),
            source: "dataverse", 
            waived: false, 
            fmla,
            voicemail,
            occurrence
          });

          current.setDate(current.getDate() + 1);
        }
        toast(dFrom === dTo ? "Record saved to Dataverse" : "Records saved to Dataverse");
      } catch (err) {
        console.error("Failed to create record in Dataverse:", err);
        toast("Failed to save to Dataverse: " + err.message);
      } finally {
        hideSyncCover();
      }
    }
      
    recalculateAfterDedupe();
    save(); closeModal(); render(); 
  };
}

    } else {
      hoursVal = parseFloat(hoursInput) || 0;
    }

    const v={
      mid: mid || uid("m"),
      empId,
      rid: m.rid || "",
      dateMissed: $("#uMissed").value,
      hoursOwed: hoursVal,
      dueDate: $("#uDue").value,
      status: $("#uStatus").value,
      oss,
      completedDate: m.completedDate || "",
      notes: $("#uNotes").value.trim()
    };
    if(mid) Object.assign(S.makeups.find(x=>x.mid===mid),v); else S.makeups.push(v);
    if(v.status==="Completed") setMuStatus(v.mid,"Completed"); else { save(); render(); }
    closeModal(); 
    toast("Agreement saved");
  };

function normalizedRecordText(r){return [r.empId,r.date,r.type,r.notes||r.wfNotes||r.attendanceNotes||""] .map(v=>String(v||"").trim().toLowerCase().replace(/\s+/g," ")).join("|");}
function consolidatedOccurrenceBlocks(empId,from,to){
  const period=consolidatedDisplayRecords((S.records||[]).filter(r=>r.empId===empId&&r.date>=from&&r.date<=to));
  const groups=occurrenceGroups(empId,from,to);
  const consumed=new Set(),blocks=[];
  groups.forEach(g=>{
    const related=period.filter(r=>g.dates.includes(r.date)&&occurrenceNumber(r.occurrence)>0);
    related.forEach(r=>consumed.add(r.rid));
    const bySemantic=new Map();related.forEach(r=>{const k=normalizedRecordText(r),x=bySemantic.get(k)||{...r,_variants:[]};x._variants.push(r);bySemantic.set(k,x);});
    const rows=[...bySemantic.values()];
    blocks.push({kind:"group",group:g,rows,records:related,waived:related.some(r=>r.waived),cancelled:related.some(r=>r.cancelled)});
  });
  period.filter(r=>!consumed.has(r.rid)).forEach(r=>blocks.push({kind:"record",record:r}));
  return blocks.sort((a,b)=>{const ad=a.kind==="group"?a.group.dates[0]:a.record.date,bd=b.kind==="group"?b.group.dates[0]:b.record.date;return bd.localeCompare(ad);});
}
function renderOccurrenceBlock(block){
  if(block.kind==="record"){const r=block.record;return `<tr data-rec="${esc(r.rid)}"><td>${fmt(r.date)}</td><td>${pill(canonicalRecordType(r))} ${r.waived?`<span class="badge ok">Occurrence waived</span>`:""} ${r.cancelled?`<span class="badge bad">Cancelled</span>`:""}</td><td>${occurrenceNumber(r.occurrence)>0?`<span class="small muted">Excluded from active count</span>`:`<span class="small muted">No occurrence</span>`}</td><td>${r.hours||""}${r.hours?"h":""}</td><td class="small"><div class="compact-note" title="${esc(r.wfNotes||r.attendanceNotes||r.notes||"")}">${esc(r.wfNotes||r.attendanceNotes||r.notes||"")}</div></td></tr>`;}
  const g=block.group,primary=block.rows[0]||{},types=[...new Set(block.rows.map(canonicalRecordType))],notes=[...new Set(block.rows.map(r=>r.wfNotes||r.attendanceNotes||r.notes||"").filter(Boolean))],hours=[...new Set(block.rows.map(r=>r.hours).filter(v=>v!==null&&v!==undefined&&v!==""))];
  return `<tr class="${g.grouped?"occurrence-group-rainbow":"occurrence-single-green"}" data-rec="${esc(primary.rid||"")}"><td><b>${g.dates.map(fmt).join(" → ")}</b><div class="small muted">${g.dates.length} day${g.dates.length===1?"":"s"} grouped together</div></td><td>${types.map(pill).join(" ")} ${block.waived?`<span class="badge ok">waived item merged</span>`:""} ${block.cancelled?`<span class="badge bad">cancelled item merged</span>`:""}</td><td>${occurrenceGroupBadge(g)}${block.waived?`<div class="small muted">Waived duplicate/status rows do not add to the count.</div>`:""}</td><td>${hours.map(h=>`${h}h`).join(", ")}</td><td class="small"><div class="compact-note" title="${esc(notes.join(" | "))}">${notes.map(esc).join(" · ")}</div></td></tr>`;
}

function renderEmail(){const d=loadEmailDraft()||defaultEmail(),template=EMAIL_TEMPLATES[d.template]?d.template:"concise";d.body=cleanAttendanceEmailDurations(d.body);return `<div class="section-title"><h2>Attendance Email</h2><span class="small muted">One-page report · same eight attendance rules · two clean layouts</span></div><div class="card email-form"><div class="mrow"><div><label>To</label><input id="emailTo" value="${esc(d.to)}"></div><div><label>Subject</label><input id="emailSubject" value="${esc(d.subject)}"></div></div><div class="email-layout-bar"><div><label>Layout</label><select id="emailTemplate" class="email-template-select">${Object.entries(EMAIL_TEMPLATES).map(([k,v])=>`<option value="${k}" ${template===k?"selected":""}>${esc(v.label)}</option>`).join("")}</select><div class="email-template-note">${esc(EMAIL_TEMPLATES[template].description)}</div></div></div><div class="email-onepage"><div class="email-pane"><details class="email-source-collapse"><summary>Edit email content</summary><textarea id="emailBody" aria-label="Editable attendance email message">${esc(d.body)}</textarea><div class="email-format-note"><b>Section headings remain fixed.</b> Edit names or details, then review the page on the right.</div></details><div class="email-actions"><button class="btn ghost" id="emailRegen">Regenerate</button><button class="btn ghost" id="emailDownload">Download EML</button><button class="btn" id="emailSend">Send with Outlook</button></div></div><div class="email-pane"><div class="email-pane-head"><label>Live report preview</label><span class="email-preview-badge">OUTLOOK READY</span></div><div id="emailPreview" class="email-preview">${emailAppPreview(d.body,d.subject,template)}</div></div></div></div>`;}
function emailPlainTextWithQuote(d){return firstReportEligible(d.subject)?`${d.body}\n\nPositive note for today: “${dailyQuote()}”`:d.body;}
function downloadEmail(){const d=saveEmailDraft(),boundary=`----Workforce${Date.now()}`,html=`<html><body style="margin:0;background:#eaf0f8;padding:18px">${premiumEmailHtml(d.body,d.subject,{template:d.template||"premium"})}</body></html>`,plain=emailPlainTextWithQuote(d),eml=[`To: ${d.to}`,`Subject: ${d.subject}`,"MIME-Version: 1.0",`Content-Type: multipart/alternative; boundary=\"${boundary}\"`,"",`--${boundary}`,"Content-Type: text/plain; charset=UTF-8","",plain,"",`--${boundary}`,"Content-Type: text/html; charset=UTF-8","",html,"",`--${boundary}--`].join("\r\n"),blob=new Blob([eml],{type:"message/rfc822"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`Attendance_Report_${today()}.eml`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function sendAttendanceEmail(){const d=saveEmailDraft();if(!d.to||!d.subject)return toast("Recipient and subject are required");const includeQuote=firstReportEligible(d.subject),token=await window.getToken("https://graph.microsoft.com/Mail.Send");const res=await fetch("https://graph.microsoft.com/v1.0/me/sendMail",{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify({message:{subject:d.subject,body:{contentType:"HTML",content:`<html><body style="margin:0;background:#eaf0f8;padding:18px">${premiumEmailHtml(d.body,d.subject,{includeQuote,template:d.template||"premium"})}</body></html>`},toRecipients:[{emailAddress:{address:d.to}}]},saveToSentItems:true})});if(!res.ok)throw new Error(`Outlook send failed [${res.status}]: ${await res.text()}`);if(includeQuote)markFirstReportSent();toast("Attendance email sent");}
function auditLeaveTypesAcrossViews(){
  const aliases={Present:["Present","Worked"],PTO:["PTO","Vacation","Planned Time Off"],"Shift Trade":["Shift Trade","Shift Swap"],"Make up Time":["Make Up","Makeup"],"Schedule Adjustment":["Adjusted Shift","Extended Shift","Night Manager"],"Jury Duty / Bereavement":["Jury Duty","Bereavement"],"Call Out":["Call Out","Absent","Sick"],Cancellation:["Cancellation","Cancelled"],"Short Shift":["Short Shift","Left Early","Partial Shift"],NCNS:["NCNS","No Call No Show"],Tardy:["Tardy","Late"],LOA:["LOA","Leave of Absence"]};
  const results=[];
  Object.entries(aliases).forEach(([expected,values])=>values.forEach(raw=>{const timeOff={dvId:"test",rawLeaveType:raw,type:"Wrong",calendarTypeSource:"cr714_leavetype"},csr={attendanceId:"test",rawLeaveType:raw,type:"Wrong",calendarTypeSource:"cr714_typeofleave",source:"csr-attendance"},a=canonicalRecordType(timeOff),b=canonicalRecordType(csr);results.push({raw,expected,timeOff:a,csr:b,pass:a===expected&&b===expected,pill:!!TYPES[a],calendarDot:!!TYPES[a],filter:TYPE_NAMES.includes(a)});}));
  return results;
}
function render(){
  const dedupeResult = recalculateAfterDedupe();
  if (dedupeResult.removedRecords || dedupeResult.removedMakeups) save();
  renderNav(); renderFilters(); setSync("");
  const v=$("#view");
  switch(UI.tab){
    case "dashboard": v.innerHTML=renderDashboard(); drawCharts(); break;
    case "occurrenceOverview": v.innerHTML=renderOccurrenceOverview(); break;
    case "calendar":  v.innerHTML=renderCalendar(); break;
    case "team":      v.innerHTML=renderTeam(); break;
    case "makeup":    v.innerHTML=renderMakeup(); break;
    case "email":     v.innerHTML=renderEmail(); break;
  }
  bindView();
}
  
function bindRecordButtons(root){
  root.querySelectorAll("[data-rec]").forEach(el => {
    el.onclick = () => recordModal(el.dataset.rec);
  });
}

function bindView(){
  const v=$("#view");
  v.querySelectorAll("tr[data-emp]").forEach(tr=>tr.onclick=()=>empModal(tr.dataset.emp));
  v.querySelectorAll("tr[data-overview-rep]").forEach(tr=>tr.onclick=()=>{UI.overviewRep=tr.dataset.overviewRep;render();});
  v.querySelectorAll(".cal-cell[data-day]").forEach(c=>c.onclick=()=>dayModal(c.dataset.day));
  
  // Weekly calendar day selection handlers
  v.querySelectorAll(".cal-cell[data-select-day]").forEach(c=>{
    c.onclick = () => {
      UI.selectedWeekDay = c.dataset.selectDay;
      render();
    };
  });

  v.querySelectorAll(".cal-cell[data-select-mu-day]").forEach(c=>{
    c.onclick = () => {
      UI.selectedMuWeekDay = c.dataset.selectMuDay;
      render();
    };
  });

  v.querySelectorAll("[data-add-day]").forEach(b=>b.onclick=e=>{e.stopPropagation();recordModal(null,b.dataset.addDay);});
  
  v.querySelectorAll(".cal-cell[data-mu-day]").forEach(c=>{
    c.onclick = (e) => {
      if(!e.target.closest(".mu-chip")) muDayModal(c.dataset.muDay);
    };
  });
  v.querySelectorAll(".mu-chip[data-mu-id]").forEach(chip=>{
    chip.onclick = (e) => {
      e.stopPropagation();
      makeupModal(chip.dataset.muId);
    };
  });
  v.querySelectorAll("[data-mu-add-day]").forEach(b=>b.onclick=e=>{e.stopPropagation();makeupModal(null,{date:b.dataset.muAddDay});});

  v.querySelectorAll("th[data-team-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.teamSort; 
    UI.teamSortDir = UI.teamSortKey === k ? -UI.teamSortDir : 1; 
    UI.teamSortKey = k; 
    render();
  });

  bindRecordButtons(v);
  bindSortableTables(v);
  v.querySelectorAll("[data-mu-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();
    const act=b.dataset.muAct, id=b.dataset.id;
    if(act==="edit") makeupModal(id);
    else setMuStatus(id, act==="approve" ? "Approved" : act==="complete" ? "Completed" : "Missed");});
  v.querySelectorAll("tr[data-mu]").forEach(tr=>tr.onclick=()=>{ makeupModal(tr.dataset.mu); });
  v.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort; UI.sortDir=UI.sortKey===k?-UI.sortDir:-1; UI.sortKey=k; render();});
  if(UI.tab==="email"){
    const templateSelect=$("#emailTemplate");if(templateSelect)templateSelect.onchange=()=>{saveEmailDraft();refreshEmailTemplatePreview();};
    const regen=$("#emailRegen");if(regen)regen.onclick=()=>{try{localStorage.removeItem(EMAIL_DRAFT_KEY);}catch(e){}v.innerHTML=renderEmail();bindView();};
    [$("#emailTo"),$("#emailSubject"),$("#emailBody"),$("#emailTemplate")].filter(Boolean).forEach(el=>el.addEventListener("input",()=>{clearTimeout(window._emailSave);window._emailSave=setTimeout(()=>{saveEmailDraft();refreshEmailTemplatePreview();},250);}));
    const dl=$("#emailDownload");if(dl)dl.onclick=downloadEmail;
    const send=$("#emailSend");if(send)send.onclick=async()=>{send.disabled=true;try{await sendAttendanceEmail();}catch(e){console.error(e);toast(e.message);}finally{send.disabled=false;}};
  }
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el[ev]=fn; };
  on("#calPrev","onclick",()=>calShift(-1)); on("#calNext","onclick",()=>calShift(1));
  on("#calToday","onclick",()=>{UI.anchor=today(); UI.selectedWeekDay=today(); UI.selectedMuWeekDay=today(); render();});
  on("#calAdd","onclick",()=>recordModal(null, UI.selectedWeekDay || UI.anchor));
  on("#overviewBack","onclick",()=>{UI.overviewRep="";render();});
  on("#recNew","onclick",()=>recordModal());
  on("#muNew","onclick",()=>makeupModal());
  on("#muFilter","onchange",()=>{UI.muFilter=$("#muFilter").value;render();});
}

$("#nav").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ UI.tab=b.dataset.tab; if(UI.tab!=="occurrenceOverview") UI.overviewRep=""; render(); }});
$("#filterBar").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fPreset"){ UI.preset=t.value; if(UI.preset==="adjusted"){const [f,x]=range(); UI.from=UI.from||f; UI.to=UI.to||x;} }
  else if(t.id==="fAnchor") UI.anchor=t.value||today();
  else if(t.id==="fFrom") UI.from=t.value;
  else if(t.id==="fTo") UI.to=t.value;
  else if(t.classList.contains("ffield")) UI[t.dataset.f]=t.value;
  render();
  // Date and period filters operate on the daily IndexedDB cache. Use Sync for a fresh Dataverse pull.
});
$("#filterBar").addEventListener("input",e=>{ if(e.target.id==="fQ"){ UI.q=e.target.value;
  clearTimeout(window._qh); window._qh=setTimeout(render,250); }});
$("#filterBar").addEventListener("click",e=>{ if(e.target.id==="fClear"){
  Object.assign(UI,{preset:"month",anchor:today(),from:null,to:null,dept:"",repName:"",title:"",supervisor:"",manager:"",q:"",type:""}); render(); }});

$("#syncBtn").onclick=async()=>{await clearStateCache("sync clicked");S={employees:[],records:[],makeups:[],settings:{}};await pullFromDataverse(false);};
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

renderNav(); renderFilters(); setSync("Loading local cache...");

</script>
</body>
</html>
