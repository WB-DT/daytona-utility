<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daytona Command Center v2.4 (Enterprise)</title>
    
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #6c757d;
            --primary: #0078D4;
            --accent: #00b4d8;
            --success: #2ecc71;
            --danger: #e74c3c;
            --border: #e9ecef;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Dark Theme Variables */
        [data-theme="dark"] {
            --bg-body: #1a1a1a;
            --bg-card: #2d2d2d;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border: #404040;
            --shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; transition: background 0.3s; }
        
        /* Layout Grid */
        .grid-container { display: grid; grid-template-columns: 250px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        
        /* Sidebar */
        .sidebar { background: var(--bg-card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); height: fit-content; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .nav-btn { display: block; width: 100%; padding: 12px; margin-bottom: 8px; border: none; background: transparent; text-align: left; color: var(--text-main); cursor: pointer; border-radius: 6px; font-weight: 600; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: rgba(0, 120, 212, 0.1); color: var(--primary); }
        .nav-btn i { width: 25px; }

        /* Main Content */
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); }
        
        /* Header & Controls */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .controls { display: flex; gap: 10px; }
        
        /* Buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.2s; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-outline { background: transparent; border: 2px solid var(--text-muted); color: var(--text-main); }
        .btn-outline:hover { background: var(--border); }

        /* Charts Section */
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 300px; }
        .chart-container { position: relative; height: 100%; width: 100%; }

        /* Tables */
        .table-responsive { overflow-x: auto; max-height: 600px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: rgba(0, 120, 212, 0.05); padding: 12px; text-align: left; color: var(--primary); position: sticky; top: 0; backdrop-filter: blur(5px); }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        tr:hover { background: rgba(0,0,0,0.02); }

        /* Utils */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .bg-new { background: rgba(46, 204, 113, 0.15); color: var(--success); }
        .bg-lost { background: rgba(231, 76, 60, 0.15); color: var(--danger); }
        .hidden { display: none !important; }
        
        /* Theme Toggle */
        .theme-switch { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); padding: 10px; border-radius: 50%; box-shadow: var(--shadow); cursor: pointer; z-index: 100; border: 1px solid var(--border); }

        /* Loading Bar */
        #loader { height: 4px; background: var(--bg-body); border-radius: 2px; overflow: hidden; margin-top: 10px; display: none; }
        #loader-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

<button class="theme-switch" onclick="toggleTheme()" title="Toggle Dark Mode">
    <i class="fa-solid fa-moon"></i>
</button>

<div class="grid-container">
    
    <aside class="sidebar">
        <h2><i class="fa-solid fa-bolt"></i> Daytona v2.4</h2>
        <nav>
            <button class="nav-btn active" onclick="showSection('dashboard')"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
            <button class="nav-btn" onclick="showSection('data')"><i class="fa-solid fa-table"></i> Account Data</button>
            <button class="nav-btn" onclick="showSection('history')"><i class="fa-solid fa-clock-rotate-left"></i> Sync History</button>
        </nav>
        
        <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px;">
            <div id="authStatus">
                <button class="btn btn-primary" style="width:100%" onclick="signIn()">Sign In</button>
            </div>
            <div id="userInfo" class="hidden">
                <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:10px;" id="userName">User</p>
                <button class="btn btn-outline" style="width:100%; font-size:0.8rem;" onclick="signOut()">Sign Out</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        
        <div class="card">
            <div class="header">
                <div>
                    <h3 style="margin:0">Action Center</h3>
                    <p style="margin:0; font-size:0.9rem; color:var(--text-muted);">Last Sync: <span id="lastSyncDate">Never</span></p>
                </div>
                <div class="controls">
                    <button class="btn btn-primary" id="syncBtn" onclick="runSync()" disabled>
                        <i class="fa-solid fa-arrows-rotate"></i> Sync Live Data
                    </button>
                    <button class="btn btn-success" onclick="exportToExcel()" id="exportBtn" disabled>
                        <i class="fa-solid fa-file-excel"></i> Export
                    </button>
                    <button class="btn btn-danger" onclick="triggerBatchUpdate()" id="updateBtn" disabled>
                        <i class="fa-solid fa-cloud-arrow-up"></i> Update DB
                    </button>
                </div>
            </div>
            <div id="loader"><div id="loader-bar"></div></div>
            <div id="statusText" style="font-size:0.85rem; margin-top:5px; color:var(--text-muted); font-style:italic;"></div>
        </div>

        <div id="dashboardSection">
            <div class="charts-row">
                <div class="card">
                    <h4>Account Changes</h4>
                    <div class="chart-container">
                        <canvas id="changeChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h4>Accounts by Rep</h4>
                    <div class="chart-container">
                        <canvas id="repChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div id="dataSection" class="hidden">
            <div class="card">
                <div class="header">
                    <h4><i class="fa-solid fa-list"></i> Account Analysis</h4>
                    <input type="text" id="searchInput" placeholder="Search accounts..." style="padding:8px; border-radius:4px; border:1px solid var(--border); width: 250px;" onkeyup="filterTable()">
                </div>
                <div class="table-responsive">
                    <table id="mainTable">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Account #</th>
                                <th>Name</th>
                                <th>Rep</th>
                                <th>Last Order</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="5" style="text-align:center">Run "Sync Live Data" to populate.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="historySection" class="hidden">
            <div class="card">
                <h4><i class="fa-solid fa-book"></i> Local Sync History</h4>
                <p style="font-size:0.9rem; color:var(--text-muted)">This data is stored in your browser.</p>
                <button class="btn btn-outline" onclick="clearLocalHistory()" style="margin-bottom:10px; font-size:0.8rem;">Clear History</button>
                <div class="table-responsive">
                    <table id="historyTable">
                        <thead><tr><th>Date</th><th>Total Accounts</th><th>New</th><th>Lost</th></tr></thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</div>

<script>
    // --- 1. CONFIGURATION ---
    const CONFIG = {
        msal: {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: "https://WB-DT.github.io/daytona-utility/"
            }
        },
        flowUrl: "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/59ad3ef0294b439d909213d20c0a244d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=j4nLnW8GYdd6KP5x4_MuMEQHNaRwlH3evbWjXJQKdZw",
        // Placeholder for the "Write Back" flow
        updateFlowUrl: "YOUR_SECOND_FLOW_URL_HERE"
    };

    // --- 2. STATE MANAGEMENT ---
    let STATE = {
        currentUser: null,
        currentData: [],     
        previousData: [],    
        newAccounts: [],
        lostAccounts: [],
        charts: {}           
    };

    const msalInstance = new msal.PublicClientApplication(CONFIG.msal);

    // --- 3. INITIALIZATION ---
    window.onload = () => {
        loadTheme();
        loadHistory();
        initCharts();
    };

    // --- 4. AUTHENTICATION ---
    async function signIn() {
        try {
            const resp = await msalInstance.loginPopup({ scopes: ["User.Read"] });
            STATE.currentUser = resp.account;
            document.getElementById("authStatus").classList.add("hidden");
            document.getElementById("userInfo").classList.remove("hidden");
            document.getElementById("userName").innerText = STATE.currentUser.username;
            document.getElementById("syncBtn").disabled = false;
        } catch (e) { console.error(e); }
    }
    function signOut() {
        msalInstance.logoutPopup();
        location.reload();
    }

    // --- 5. CORE LOGIC: POLLING SYNC ---
    async function runSync() {
        const ui = {
            btn: document.getElementById("syncBtn"),
            loader: document.getElementById("loader"),
            bar: document.getElementById("loader-bar"),
            text: document.getElementById("statusText")
        };

        ui.btn.disabled = true;
        ui.loader.style.display = "block";
        ui.text.innerText = "Initializing Flow...";
        
        const storageKey = "daytona_last_snapshot";
        const storedJson = localStorage.getItem(storageKey);
        STATE.previousData = storedJson ? JSON.parse(storedJson) : [];

        try {
            // 1. Initial Trigger
            let response = await fetch(CONFIG.flowUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user: STATE.currentUser?.username || "Anon" })
            });

            // 2. Handle Asynchronous Polling (Status 202)
            if (response.status === 202) {
                const locationUrl = response.headers.get("Location");
                if (!locationUrl) throw new Error("Flow returned 202 but no Location header.");
                ui.text.innerText = "Processing large dataset. Polling...";
                response = await pollForData(locationUrl, ui);
            }

            if (!response.ok) throw new Error(`Flow failed with status: ${response.status}`);

            const rawJson = await response.json();
            
            // --- FIX 1: UNWRAP ASYNC RESPONSE ---
            let cleanData = rawJson;
            if (rawJson.status === "Succeeded" && rawJson.outputs && rawJson.outputs.body) {
                console.log("Unwrapping Polling Response...");
                cleanData = rawJson.outputs.body;
            }

            // --- FIX 2: NORMALIZE DATA ARRAY ---
            // 1. Check if it's a string
            if (typeof cleanData === 'string') {
                try { cleanData = JSON.parse(cleanData); } 
                catch(e) { console.error("Could not parse JSON string"); }
            }

            // 2. Locate the Array
            let liveList = [];
            if (Array.isArray(cleanData)) {
                liveList = cleanData;
            } else if (cleanData.customers && Array.isArray(cleanData.customers)) {
                liveList = cleanData.customers;
            } else if (cleanData.dataverseAccounts && Array.isArray(cleanData.dataverseAccounts)) {
                liveList = cleanData.dataverseAccounts;
            } else if (cleanData.value && Array.isArray(cleanData.value)) {
                liveList = cleanData.value;
            } else if (typeof cleanData === 'object') {
                // Last ditch effort: find ANY array property
                const arr = Object.values(cleanData).find(v => Array.isArray(v));
                if(arr) liveList = arr;
            }

            if (!Array.isArray(liveList)) {
                console.error("DATA STRUCTURE ERROR. Received:", cleanData);
                throw new Error("Could not find an array in the response.");
            }

            console.log(`Records received: ${liveList.length}`);
            
            // Performance Warning
            if (liveList.length > 50000) {
                ui.text.innerText = `Large dataset (${liveList.length} rows). Processing comparisons...`;
                // Allow UI render
                await new Promise(r => setTimeout(r, 100)); 
            }

            STATE.currentData = liveList;
            
            processComparison(STATE.previousData, STATE.currentData);

            // Save Snapshot (Try/Catch because 15M records won't fit in LocalStorage)
            try {
                localStorage.setItem(storageKey, JSON.stringify(liveList));
            } catch (e) {
                console.warn("Dataset too large for local history storage. Comparison works for this session only.");
            }
            
            logHistoryEvent(liveList.length, STATE.newAccounts.length, STATE.lostAccounts.length);

            ui.text.innerText = "Sync Complete. Dashboard Updated.";
            ui.bar.style.width = "100%";
            
            document.getElementById("exportBtn").disabled = false;
            document.getElementById("updateBtn").disabled = (STATE.lostAccounts.length === 0 && STATE.newAccounts.length === 0);

        } catch (error) {
            ui.bar.style.background = "var(--danger)";
            ui.text.innerText = "Error: " + error.message;
            console.error(error);
        } finally {
            ui.btn.disabled = false;
            setTimeout(() => { 
                if(ui.bar.style.background !== "var(--danger)") {
                   ui.loader.style.display = "none"; 
                   ui.bar.style.width="0%"; 
                }
            }, 5000);
        }
    }

    // --- POLLING HELPER ---
    async function pollForData(url, ui) {
        let attempts = 0;
        const maxAttempts = 60; // 5 mins max
        
        while (attempts < maxAttempts) {
            attempts++;
            let percent = Math.min(90, attempts * 2); 
            ui.bar.style.width = percent + "%";
            ui.text.innerText = `Processing... (${attempts * 5}s)`;

            await new Promise(resolve => setTimeout(resolve, 5000)); // Wait 5s

            const resp = await fetch(url);
            
            if (resp.status === 200) {
                return resp; 
            } else if (resp.status === 202) {
                continue; 
            } else {
                throw new Error("Polling stopped. Status: " + resp.status);
            }
        }
        throw new Error("Timeout: Flow took too long to respond.");
    }

    function processComparison(prev, curr) {
        // --- FIX 3: SAFETY CHECK FOR ARRAYS ---
        if (!Array.isArray(prev)) prev = [];
        if (!Array.isArray(curr)) {
            console.error("Current data is not an array:", curr);
            return;
        }

        // Optimization: Use Sets for O(1) lookups (Critical for 15M records)
        const getKey = (item) => String(item.AccountNum || item.cr714_accountnum || "UNKNOWN").trim();

        // 1. Build Sets (Heavy Operation)
        const prevSet = new Set(prev.map(getKey));
        const currSet = new Set(curr.map(getKey));

        // 2. Filter using Sets
        STATE.newAccounts = curr.filter(c => !prevSet.has(getKey(c)));
        STATE.lostAccounts = prev.filter(p => !currSet.has(getKey(p)));

        renderTable();
        updateCharts();
        document.getElementById("lastSyncDate").innerText = new Date().toLocaleString();
    }

    // --- 6. UI RENDERING ---
    function renderTable() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        // Limit display to 100 rows to prevent DOM freeze
        const MAX_DISPLAY = 100;
        
        const rows = [
            ...STATE.newAccounts.slice(0, MAX_DISPLAY).map(x => ({...x, _status: 'new'})),
            ...STATE.lostAccounts.slice(0, MAX_DISPLAY).map(x => ({...x, _status: 'lost'})),
            ...STATE.currentData.slice(0, MAX_DISPLAY).map(x => ({...x, _status: 'active'}))
        ];

        if(rows.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px;">No Data Found</td></tr>`;
            return;
        }

        rows.forEach(row => {
            let badge = `<span class="badge" style="background:#eee; color:#666">Active</span>`;
            if (row._status === 'new') badge = `<span class="badge bg-new">NEW</span>`;
            if (row._status === 'lost') badge = `<span class="badge bg-lost">DROPPED</span>`;

            const acctNum = row.AccountNum || row.cr714_accountnum || 'N/A';
            const name = row.Name_CustTable || row.Name || row.cr714_accountname || 'Unknown';
            const rep = row.SalesRepName || row.cr714_rep || 'Unassigned';
            const date = row.LastOrderDate || '-';

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${badge}</td>
                <td>${acctNum}</td>
                <td>${name}</td>
                <td>${rep}</td>
                <td>${date}</td>
            `;
            tbody.appendChild(tr);
        });
        
        // Add "Show more" hint if data was truncated
        if(STATE.newAccounts.length > MAX_DISPLAY || STATE.lostAccounts.length > MAX_DISPLAY) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td colspan="5" style="text-align:center; font-style:italic; color:#666;">
                Showing first ${MAX_DISPLAY} rows. Use "Export" to see full list.
            </td>`;
            tbody.appendChild(tr);
        }
    }

    function initCharts() {
        const ctx1 = document.getElementById('changeChart').getContext('2d');
        const ctx2 = document.getElementById('repChart').getContext('2d');

        STATE.charts.change = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: ['New', 'Lost', 'Stable'],
                datasets: [{ data: [0, 0, 100], backgroundColor: ['#2ecc71', '#e74c3c', '#ecf0f1'] }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        STATE.charts.rep = new Chart(ctx2, {
            type: 'bar',
            data: { labels: [], datasets: [] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });
    }

    function updateCharts() {
        if (!STATE.charts.change || !STATE.charts.rep) return;

        const stable = Math.max(0, STATE.currentData.length - STATE.newAccounts.length);
        STATE.charts.change.data.datasets[0].data = [STATE.newAccounts.length, STATE.lostAccounts.length, stable];
        STATE.charts.change.update();

        // Sample Rep data to avoid looping 15M times for charts
        const sampleLimit = Math.min(STATE.currentData.length, 50000); 
        const repCounts = {};
        
        for(let i=0; i<sampleLimit; i++) {
            const acc = STATE.currentData[i];
            const rep = acc.SalesRepName || acc.cr714_rep || "Unassigned";
            repCounts[rep] = (repCounts[rep] || 0) + 1;
        }

        const sortedReps = Object.entries(repCounts).sort(([,a],[,b]) => b-a).slice(0, 10);

        STATE.charts.rep.data.labels = sortedReps.map(x => x[0]);
        STATE.charts.rep.data.datasets[0].data = sortedReps.map(x => x[1]);
        STATE.charts.rep.update();
    }

    // --- 7. EXPORT & ACTIONS ---
    async function exportToExcel() {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Account Analysis');
        
        ws.columns = [
            { header: 'Status', key: 'status', width: 15 },
            { header: 'Account', key: 'acct', width: 15 },
            { header: 'Name', key: 'name', width: 30 },
            { header: 'Rep', key: 'rep', width: 20 }
        ];

        ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0078D4' } };
        ws.getRow(1).font = { color: { argb: 'FFFFFFFF' }, bold: true };

        STATE.newAccounts.forEach(x => ws.addRow({ status: 'NEW', acct: x.AccountNum || x.cr714_accountnum, name: x.Name_CustTable || x.cr714_accountname, rep: x.SalesRepName || x.cr714_rep }));
        STATE.lostAccounts.forEach(x => ws.addRow({ status: 'LOST', acct: x.AccountNum || x.cr714_accountnum, name: x.Name_CustTable || x.cr714_accountname, rep: x.SalesRepName || x.cr714_rep }));

        const buf = await wb.xlsx.writeBuffer();
        saveAs(new Blob([buf]), `Daytona_Analysis_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    async function triggerBatchUpdate() {
        if(!confirm(`This will ARCHIVE ${STATE.lostAccounts.length} accounts. Proceed?`)) return;
        
        const btn = document.getElementById("updateBtn");
        btn.disabled = true;
        btn.innerText = "Processing...";

        try {
            await fetch(CONFIG.updateFlowUrl, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ 
                    archiveList: STATE.lostAccounts, 
                    addList: STATE.newAccounts,
                    user: STATE.currentUser.username 
                })
            });
            alert("Update Batch Sent Successfully!");
            btn.innerText = "Update Complete";
        } catch(e) {
            alert("Error: " + e.message);
            btn.disabled = false;
        }
    }

    // --- 8. UTILITIES ---
    function showSection(id) {
        ['dashboard', 'data', 'history'].forEach(s => document.getElementById(s+'Section').classList.add('hidden'));
        document.getElementById(id+'Section').classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function loadTheme() {
        const savedTheme = localStorage.getItem('daytona_theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
    }

    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        body.setAttribute('data-theme', newTheme);
        localStorage.setItem('daytona_theme', newTheme);
    }

    function filterTable() {
        const term = document.getElementById("searchInput").value.toLowerCase();
        const rows = document.querySelectorAll("#tableBody tr");
        rows.forEach(r => {
            const text = r.innerText.toLowerCase();
            r.style.display = text.includes(term) ? "" : "none";
        });
    }

    function logHistoryEvent(total, isNew, isLost) {
        // Only log if data size is manageable
        const history = JSON.parse(localStorage.getItem("daytona_history_log") || "[]");
        history.unshift({ date: new Date().toLocaleString(), total, isNew, isLost });
        if(history.length > 20) history.pop(); 
        localStorage.setItem("daytona_history_log", JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem("daytona_history_log") || "[]");
        const tbody = document.getElementById("historyBody");
        tbody.innerHTML = "";
        history.forEach(h => {
            tbody.innerHTML += `<tr><td>${h.date}</td><td>${h.total}</td><td style="color:var(--success)">+${h.isNew}</td><td style="color:var(--danger)">-${h.isLost}</td></tr>`;
        });
    }
    
    function clearLocalHistory() {
        localStorage.removeItem("daytona_history_log");
        localStorage.removeItem("daytona_last_snapshot");
        loadHistory();
    }
</script>

</body>
</html>
