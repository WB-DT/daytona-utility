<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.0 Daytona Command Center vFinal</title>
    
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f8fafc; --bg-sidebar: #ffffff; --bg-card: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b;
            --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --warning: #f59e0b;
            --border: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg-body: #0f172a; --bg-sidebar: #1e293b; --bg-card: #1e293b;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --primary: #3b82f6; --border: #334155; --shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; height: 100vh; display: grid; grid-template-columns: 280px 1fr; transition: background 0.3s; }
        
        .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; z-index: 50; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .main { padding: 32px; overflow-y: auto; position: relative; }
        .card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); padding: 24px; margin-bottom: 24px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px; }
        .stat-card { text-align: center; padding: 20px; }
        .stat-num { font-size: 2.5rem; font-weight: 800; }
        .stat-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }

        .btn { padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; margin-bottom: 10px; font-size: 0.9rem; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }

        .loader-box { margin-top: 20px; display: none; }
        .progress-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .status-text { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; display: flex; justify-content: space-between; }

        .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: rgba(0,0,0,0.03); padding: 14px 20px; text-align: left; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .bg-new { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .bg-lost { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .bg-active { background: rgba(59, 130, 246, 0.15); color: var(--primary); }
        .theme-btn { position: absolute; bottom: 24px; left: 24px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo"><i class="fa-solid fa-cube"></i> DAYTONA vFinal</div>
    
    <div id="authBox"><button class="btn btn-primary" onclick="signIn()">Sign In</button></div>
    <div id="userBox" style="display:none; margin-bottom:20px;">
        <div style="font-size:0.8rem; color:var(--text-muted)">User</div>
        <div style="font-weight:700; margin-bottom:10px;" id="uName">...</div>
        <button class="btn btn-outline" style="padding:8px; font-size:0.8rem;" onclick="signOut()">Sign Out</button>
    </div>

    <div style="border-top:1px solid var(--border); margin:20px 0; padding-top:20px;">
        <label style="font-size:0.7rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-bottom:10px; display:block;">Actions</label>
        <button class="btn btn-primary" id="syncBtn" onclick="runSync()" disabled><i class="fa-solid fa-cloud-arrow-down"></i> Run Comparison</button>
        <button class="btn btn-success" id="dbBtn" onclick="commitDb()" disabled><i class="fa-solid fa-database"></i> Commit to DB</button>
        <button class="btn btn-outline" id="expBtn" onclick="exportData()" disabled><i class="fa-solid fa-file-excel"></i> Export Report</button>
    </div>

    <div class="loader-box" id="loader">
        <div class="progress-track"><div class="progress-fill" id="pBar"></div></div>
        <div class="status-text"><span id="pText">Waiting...</span><span id="pTime">0s</span></div>
    </div>
    <button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
</aside>

<main class="main">
    <div style="display:flex; justify-content:space-between; align-items:end; margin-bottom:30px;">
        <div>
            <h1 style="margin:0">Account Monitor</h1>
            <p style="margin:5px 0 0; color:var(--text-muted)">Live Power BI (Inside Sales) vs. SharePoint Snapshot vs. Dataverse</p>
        </div>
        <div style="text-align:right">
            <div style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">LAST SYNC</div>
            <div style="font-weight:700; font-size:0.9rem;" id="lastSync">Never</div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="card stat-card">
            <div class="stat-num" id="valNew" style="color:var(--success)">0</div>
            <div class="stat-label">New (Add to DB)</div>
        </div>
        <div class="card stat-card">
            <div class="stat-num" id="valLost" style="color:var(--danger)">0</div>
            <div class="stat-label">Dropped (Remove)</div>
        </div>
        <div class="card stat-card">
            <div class="stat-num" id="valTotal" style="color:var(--primary)">0</div>
            <div class="stat-label">Total Live Portfolio</div>
        </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 2fr; gap:24px; margin-bottom:24px;">
        <div class="card">
            <h3 style="margin-top:0">Portfolio Changes</h3>
            <div style="height:200px"><canvas id="cDonut"></canvas></div>
        </div>
        <div class="card">
            <h3 style="margin-top:0">Top Reps (Live Data)</h3>
            <div style="height:200px"><canvas id="cBar"></canvas></div>
        </div>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
        <div style="padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0">Details</h3>
            <input type="text" id="search" placeholder="Filter table..." style="padding:8px 12px; border:1px solid var(--border); border-radius:6px; background:var(--bg-body); color:var(--text-main);" onkeyup="filterTable()">
        </div>
        <div class="table-wrap">
            <table id="dataTable">
                <thead><tr><th>Action</th><th>Account #</th><th>Name</th><th>Rep</th><th>15Mo Sales</th></tr></thead>
                <tbody id="tBody"><tr><td colspan="5" style="text-align:center; padding:40px; color:var(--text-muted)">System Ready</td></tr></tbody>
            </table>
        </div>
    </div>
</main>

<script>
    // --- 1. CONFIGURATION ---
    const CONFIG = {
        msal: { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" } },
        // IMPORTANT: Ensure this Flow returns { "snapshot": ..., "live": ..., "dataverseAccounts": ... }
        flowUrl: "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/59ad3ef0294b439d909213d20c0a244d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=j4nLnW8GYdd6KP5x4_MuMEQHNaRwlH3evbWjXJQKdZw",
        // DB Update Flow
        dbUrl: "YOUR_UPDATE_DB_FLOW_URL"
    };

    const msalObj = new msal.PublicClientApplication(CONFIG.msal);
    let STATE = { user: null, snapshot: [], live: [], db: [], toAdd: [], toRemove: [] };
    let charts = {};

    window.onload = () => { loadTheme(); initCharts(); };

    async function signIn() {
        try {
            const r = await msalObj.loginPopup({ scopes: ["User.Read"] });
            STATE.user = r.account;
            document.getElementById("authBox").style.display="none";
            document.getElementById("userBox").style.display="block";
            document.getElementById("uName").innerText = STATE.user.username;
            document.getElementById("syncBtn").disabled = false;
        } catch(e) { console.error(e); }
    }
    function signOut() { msalObj.logoutPopup(); location.reload(); }

    async function runSync() {
        const ui = { btn: document.getElementById("syncBtn"), box: document.getElementById("loader"), bar: document.getElementById("pBar"), txt: document.getElementById("pText"), time: document.getElementById("pTime") };
        ui.btn.disabled = true; ui.box.style.display="block"; ui.txt.innerText="Connecting..."; ui.bar.style.width="5%";
        let sec=0; const timer=setInterval(()=>{sec++; ui.time.innerText=sec+"s";},1000);

        try {
            let resp = await fetch(CONFIG.flowUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user: STATE.user?.username}) });
            if(resp.status === 202) {
                ui.txt.innerText="Running Queries (Polling)...";
                resp = await poll(resp.headers.get("Location"), ui.bar);
            }
            if(!resp.ok) throw new Error("API Error: "+resp.status);

            const json = await resp.json();
            const data = (json.outputs && json.outputs.body) ? json.outputs.body : json;

            ui.txt.innerText="Parsing 3 Datasets...";
            ui.bar.style.width="85%";
            await new Promise(r => setTimeout(r, 200));

            // CRITICAL FIX: CLEAN BRACKETS [Key] -> Key
            STATE.snapshot = cleanKeys(safeParse(data.snapshot));
            STATE.live = cleanKeys(safeParse(data.live || data.customers));
            STATE.db = cleanKeys(safeParse(data.dataverseAccounts));

            console.log("Live:", STATE.live.length, "Snapshot:", STATE.snapshot.length);
            
            // LOGIC
            const getId = (x) => String(x.AccountNum || x.cr714_accountnum || "UNK").trim();
            const liveSet = new Set(STATE.live.map(getId));
            const dbSet = new Set(STATE.db.map(getId));

            STATE.toAdd = STATE.live.filter(x => !dbSet.has(getId(x)));
            STATE.toRemove = STATE.db.filter(x => !liveSet.has(getId(x)));

            updateDashboard();

            ui.txt.innerText="Complete"; ui.bar.style.width="100%";
            setTimeout(()=>ui.box.style.display="none", 2000);
            
            document.getElementById("expBtn").disabled = false;
            document.getElementById("dbBtn").disabled = (STATE.toAdd.length===0 && STATE.toRemove.length===0);
            document.getElementById("lastSync").innerText = new Date().toLocaleTimeString();

        } catch(e) {
            ui.txt.innerText="Error: "+e.message; ui.bar.style.background="var(--danger)"; console.error(e);
        } finally { clearInterval(timer); ui.btn.disabled=false; }
    }

    function updateDashboard() {
        document.getElementById("valNew").innerText = STATE.toAdd.length;
        document.getElementById("valLost").innerText = STATE.toRemove.length;
        document.getElementById("valTotal").innerText = STATE.live.length;

        const stable = Math.max(0, STATE.live.length - STATE.toAdd.length);
        charts.donut.data.datasets[0].data = [STATE.toAdd.length, STATE.toRemove.length, stable];
        charts.donut.update();

        const reps = {};
        STATE.live.forEach(x => { const r = x.Rep || x.SalesRepName || "Unassigned"; reps[r]=(reps[r]||0)+1; });
        const sorted = Object.entries(reps).sort((a,b)=>b[1]-a[1]).slice(0,8);
        charts.bar.data.labels = sorted.map(x=>x[0]);
        charts.bar.data.datasets[0].data = sorted.map(x=>x[1]);
        charts.bar.update();

        const tbody = document.getElementById("tBody"); tbody.innerHTML="";
        const all = [
            ...STATE.toAdd.map(x=>({...x, act:'ADD'})),
            ...STATE.toRemove.map(x=>({...x, act:'REMOVE'})),
            ...STATE.live.slice(0, 100).map(x=>({...x, act:'ACTIVE'})) 
        ];

        if(all.length===0) { tbody.innerHTML="<tr><td colspan='5' style='text-align:center'>No Changes Required</td></tr>"; return; }

        all.forEach(r => {
            let badge = `<span class="badge bg-active">Active</span>`;
            if(r.act==='ADD') badge = `<span class="badge bg-new">Add to DB</span>`;
            if(r.act==='REMOVE') badge = `<span class="badge bg-lost">Remove</span>`;

            const num = r.AccountNum || r.cr714_accountnum || "";
            const name = r.Name || r.cr714_accountname || r.Name_CustTable || "";
            const rep = r.Rep || r.cr714_rep || r.SalesRepName || "";
            const sales = r.Total_Sales_Last15Months ? `$${Math.round(r.Total_Sales_Last15Months).toLocaleString()}` : "-";

            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${badge}</td><td>${num}</td><td>${name}</td><td>${rep}</td><td>${sales}</td>`;
            tbody.appendChild(tr);
        });
    }

    async function commitDb() {
        if(!confirm(`Archive ${STATE.toRemove.length} and Add ${STATE.toAdd.length} records?`)) return;
        try {
            await fetch(CONFIG.dbUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({add:STATE.toAdd, remove:STATE.toRemove, user:STATE.user.username}) });
            alert("Update Queued.");
        } catch(e) { alert("Error: "+e.message); }
    }

    async function exportData() {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Changes");
        ws.columns = [{header:'Action',key:'a'}, {header:'Account',key:'id'}, {header:'Name',key:'n'}, {header:'Rep',key:'r'}, {header:'Sales',key:'s'}];
        [...STATE.toAdd.map(x=>({...x,a:'ADD'})), ...STATE.toRemove.map(x=>({...x,a:'REMOVE'}))].forEach(r => {
            ws.addRow({ a:r.a, id:r.AccountNum||r.cr714_accountnum, n:r.Name||r.cr714_accountname, r:r.Rep||r.cr714_rep, s:r.Total_Sales_Last15Months });
        });
        const b = await wb.xlsx.writeBuffer();
        saveAs(new Blob([b]), "Daytona_Report.xlsx");
    }

    async function poll(url, bar) {
        for(let i=0; i<60; i++) {
            await new Promise(r => setTimeout(r, 4000));
            bar.style.width = Math.min(95, 10+(i*5))+"%";
            const res = await fetch(url);
            if(res.status===200) return await res.json();
        }
        throw new Error("Timeout");
    }

    function safeParse(input) {
        if(!input) return [];
        if(Array.isArray(input)) return input;
        if(typeof input === 'string') {
            try { const p = JSON.parse(input); return Array.isArray(p)?p:(p.value||[]); } catch(e){ return []; }
        }
        return input.value || [];
    }

    // NEW: Removes [ ] from keys (e.g., "[AccountNum]" -> "AccountNum")
    function cleanKeys(data) {
        return data.map(obj => {
            const newObj = {};
            for (let key in obj) {
                const cleanKey = key.replace(/^\[|\]$/g, '');
                newObj[cleanKey] = obj[key];
            }
            return newObj;
        });
    }

    function initCharts() {
        charts.donut = new Chart(document.getElementById("cDonut"), { type:'doughnut', data:{labels:['New','Lost','Stable'], datasets:[{data:[0,0,1], backgroundColor:['#10b981','#ef4444','#e2e8f0']}]}, options:{maintainAspectRatio:false, plugins:{legend:{position:'right'}}} });
        charts.bar = new Chart(document.getElementById("cBar"), { type:'bar', data:{labels:[], datasets:[{label:'Accounts', data:[], backgroundColor:'#3b82f6'}]}, options:{maintainAspectRatio:false, scales:{y:{beginAtZero:true}}} });
    }

    function toggleTheme() {
        const b=document.body; const t=b.getAttribute("data-theme")==="dark"?"light":"dark";
        b.setAttribute("data-theme", t); localStorage.setItem("theme", t);
    }
    function loadTheme() { document.body.setAttribute("data-theme", localStorage.getItem("theme")||"light"); }
    function filterTable() {
        const t = document.getElementById("search").value.toLowerCase();
        document.querySelectorAll("#tBody tr").forEach(r => r.style.display = r.innerText.toLowerCase().includes(t)?"":"none");
    }
</script>

</body>
</html>
