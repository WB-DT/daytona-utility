<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daytona Command Center v8.0</title>
    
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --bg-body: #f1f5f9; --bg-sidebar: #ffffff; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --border: #e2e8f0; }
        [data-theme="dark"] { --bg-body: #0f172a; --bg-sidebar: #1e293b; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #3b82f6; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; height: 100vh; display: grid; grid-template-columns: 280px 1fr; }
        .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; }
        .main { padding: 32px; overflow-y: auto; }
        .card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); padding: 24px; margin-bottom: 24px; }
        .btn { padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn:disabled { opacity: 0.5; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; }
        .bg-new { background: rgba(34, 197, 94, 0.15); color: var(--success); }
        .bg-lost { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        table { width: 100%; border-collapse: collapse; } th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; }
    </style>
</head>
<body>

<aside class="sidebar">
    <h2 style="color:var(--primary); margin:0 0 30px 0;"><i class="fa-solid fa-cube"></i> DAYTONA v8</h2>
    <div id="authBox"><button class="btn btn-primary" onclick="signIn()">Sign In</button></div>
    <div id="userBox" style="display:none; margin-bottom:20px;">
        <div style="font-weight:700" id="uName">...</div>
        <button class="btn" style="border:1px solid var(--border); background:transparent; color:var(--text-main)" onclick="signOut()">Sign Out</button>
    </div>
    <hr style="border:0; border-top:1px solid var(--border); margin:10px 0 20px 0;">
    <button class="btn btn-primary" id="syncBtn" onclick="runFullSync()" disabled>Run Full Sync</button>
    <button class="btn btn-success" id="dbBtn" onclick="commitDb()" disabled>Commit to DB</button>
    <button class="btn" style="border:1px solid var(--border); background:transparent; color:var(--text-main)" id="expBtn" onclick="exportData()" disabled>Export Excel</button>
    <div id="loader" style="display:none; margin-top:15px; font-size:0.8rem; color:var(--text-muted);">
        <div style="height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:5px;"><div id="pBar" style="height:100%; width:0%; background:var(--primary); transition:width 0.3s;"></div></div>
        <span id="pText">Waiting...</span>
    </div>
</aside>

<main class="main">
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Snapshot Status</h3>
            <span id="snapStatus" style="color:var(--danger); font-weight:700;">Not Loaded</span>
        </div>
        <p style="font-size:0.9rem; color:var(--text-muted); margin:5px 0 0 0;">
            This version downloads the Daily Snapshot directly from SharePoint using Microsoft Graph.
        </p>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="card" style="text-align:center;">
            <div style="font-size:2rem; font-weight:700; color:var(--success)" id="valNew">0</div>
            <div style="font-size:0.8rem; font-weight:700; color:var(--text-muted)">NEW (ADD)</div>
        </div>
        <div class="card" style="text-align:center;">
            <div style="font-size:2rem; font-weight:700; color:var(--danger)" id="valLost">0</div>
            <div style="font-size:0.8rem; font-weight:700; color:var(--text-muted)">DROPPED (REMOVE)</div>
        </div>
        <div class="card" style="text-align:center;">
            <div style="font-size:2rem; font-weight:700; color:var(--primary)" id="valTotal">0</div>
            <div style="font-size:0.8rem; font-weight:700; color:var(--text-muted)">TOTAL LIVE</div>
        </div>
    </div>

    <div class="card" style="padding:0; overflow-x:auto;">
        <table id="dataTable">
            <thead>
                <tr style="background:rgba(0,0,0,0.02)"><th>Action</th><th>Account #</th><th>Name</th><th>Rep</th><th>Sales (15mo)</th></tr>
            </thead>
            <tbody id="tBody"><tr><td colspan="5" style="text-align:center; padding:30px; color:var(--text-muted)">Ready</td></tr></tbody>
        </table>
    </div>
</main>

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        msal: { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" } },
        // Your Flow for LIVE Data (Power BI + Dataverse)
        liveFlowUrl: "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/59ad3ef0294b439d909213d20c0a244d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=j4nLnW8GYdd6KP5x4_MuMEQHNaRwlH3evbWjXJQKdZw",
        // Direct Graph URL constructed from your SharePoint Link
        graphFileUrl: "https://graph.microsoft.com/v1.0/sites/wbmasonco.sharepoint.com:/sites/FarmerHunterlogs:/drive/root:/Matt/Daily Inside Sales Accounts - DO NOT DELETE/DaytonaData/DailySnapshot.json:/content",
        dbUrl: "YOUR_DB_UPDATE_FLOW_URL"
    };

    const msalObj = new msal.PublicClientApplication(CONFIG.msal);
    let STATE = { user: null, snapshot: [], live: [], db: [], toAdd: [], toRemove: [] };

    async function signIn() {
        try {
            // Request Files.Read.All to access SharePoint directly
            const r = await msalObj.loginPopup({ scopes: ["User.Read", "Files.Read.All", "Sites.Read.All"] });
            STATE.user = r.account;
            document.getElementById("authBox").style.display="none";
            document.getElementById("userBox").style.display="block";
            document.getElementById("uName").innerText = STATE.user.username;
            document.getElementById("syncBtn").disabled = false;
        } catch(e) { console.error(e); alert("Login Error: " + e.message); }
    }
    function signOut() { msalObj.logoutPopup(); location.reload(); }

    async function runFullSync() {
        const ui = { btn:document.getElementById("syncBtn"), box:document.getElementById("loader"), bar:document.getElementById("pBar"), txt:document.getElementById("pText") };
        ui.btn.disabled=true; ui.box.style.display="block"; ui.bar.style.width="10%";
        
        try {
            // 1. GET SNAPSHOT (VIA GRAPH API)
            ui.txt.innerText = "Downloading Snapshot from SharePoint...";
            
            // Get Token
            const tokenResp = await msalObj.acquireTokenSilent({ account: STATE.user, scopes: ["Files.Read.All"] }).catch(async () => {
                return await msalObj.acquireTokenPopup({ scopes: ["Files.Read.All"] });
            });
            
            // Fetch File
            const graphResp = await fetch(CONFIG.graphFileUrl, {
                headers: { "Authorization": `Bearer ${tokenResp.accessToken}` }
            });
            
            if(!graphResp.ok) {
                console.warn("Snapshot not found or access denied. Starting fresh.");
                STATE.snapshot = [];
                document.getElementById("snapStatus").innerText = "Not Found (Assuming Fresh)";
            } else {
                const jsonText = await graphResp.text(); // Get as text first to avoid parsing errors
                STATE.snapshot = safeParse(jsonText);
                document.getElementById("snapStatus").innerText = "Loaded via Graph";
                document.getElementById("snapStatus").style.color = "var(--success)";
            }
            STATE.snapshot = cleanKeys(STATE.snapshot); // Clean [Brackets]
            ui.bar.style.width="50%";

            // 2. GET LIVE DATA (VIA FLOW)
            ui.txt.innerText = "Fetching Live Power BI Data...";
            let flowResp = await fetch(CONFIG.liveFlowUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user: STATE.user.username}) });
            
            if(flowResp.status === 202) {
                const loc = flowResp.headers.get("Location");
                flowResp = await poll(loc);
            }
            
            const flowJson = await flowResp.json();
            const data = (flowJson.outputs && flowJson.outputs.body) ? flowJson.outputs.body : flowJson;

            STATE.live = cleanKeys(safeParse(data.live || data.customers));
            STATE.db = cleanKeys(safeParse(data.dataverseAccounts));

            ui.bar.style.width="90%";
            console.log(`Loaded: Snap=${STATE.snapshot.length}, Live=${STATE.live.length}, DB=${STATE.db.length}`);

            // 3. COMPARE
            const getId = (x) => String(x.AccountNum || x.cr714_accountnum || "UNK").trim();
            const liveSet = new Set(STATE.live.map(getId));
            const dbSet = new Set(STATE.db.map(getId));

            STATE.toAdd = STATE.live.filter(x => !dbSet.has(getId(x)));
            STATE.toRemove = STATE.db.filter(x => !liveSet.has(getId(x)));

            updateUI();
            
            ui.txt.innerText = "Complete"; ui.bar.style.width="100%";
            setTimeout(()=>{ui.box.style.display="none"}, 2000);
            document.getElementById("expBtn").disabled = false;
            document.getElementById("dbBtn").disabled = (STATE.toAdd.length===0 && STATE.toRemove.length===0);

        } catch(e) {
            ui.txt.innerText = "Error: " + e.message;
            console.error(e);
            alert("Sync Failed: " + e.message);
        } finally { ui.btn.disabled = false; }
    }

    function updateUI() {
        document.getElementById("valNew").innerText = STATE.toAdd.length;
        document.getElementById("valLost").innerText = STATE.toRemove.length;
        document.getElementById("valTotal").innerText = STATE.live.length;

        const tbody = document.getElementById("tBody"); tbody.innerHTML="";
        const rows = [
            ...STATE.toAdd.map(x=>({...x, a:'ADD'})), 
            ...STATE.toRemove.map(x=>({...x, a:'REMOVE'})),
            ...STATE.live.slice(0,100).map(x=>({...x, a:'ACTIVE'}))
        ];

        if(rows.length===0) { tbody.innerHTML="<tr><td colspan='5' style='text-align:center'>No Data</td></tr>"; return; }

        rows.forEach(r => {
            let badge = r.a==='ADD' ? '<span class="badge bg-new">ADD</span>' : (r.a==='REMOVE' ? '<span class="badge bg-lost">REMOVE</span>' : '<span class="badge bg-active">ACTIVE</span>');
            let tr = document.createElement("tr");
            tr.innerHTML = `<td>${badge}</td><td>${r.AccountNum||r.cr714_accountnum||''}</td><td>${r.Name||r.cr714_accountname||''}</td><td>${r.Rep||r.cr714_rep||''}</td><td>${Math.round(r.Total_Sales_Last15Months||0)}</td>`;
            tbody.appendChild(tr);
        });
    }

    // UTILS
    async function poll(url) {
        for(let i=0; i<60; i++) {
            await new Promise(r=>setTimeout(r,4000));
            let res = await fetch(url);
            if(res.status===200) return await res.json();
        } throw new Error("Timeout");
    }
    
    function safeParse(input) {
        if(typeof input === 'string') { try{ const p=JSON.parse(input); return Array.isArray(p)?p:(p.value||[]); }catch(e){return[]} }
        return Array.isArray(input) ? input : (input?.value || []);
    }

    function cleanKeys(arr) {
        return arr.map(obj => {
            const n = {};
            for(let k in obj) n[k.replace(/^\[|\]$/g, '')] = obj[k];
            return n;
        });
    }

    async function commitDb() {
        if(!confirm(`Archive ${STATE.toRemove.length} / Add ${STATE.toAdd.length}?`)) return;
        try { await fetch(CONFIG.dbUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({add:STATE.toAdd, remove:STATE.toRemove, user:STATE.user.username})}); alert("Queued"); }
        catch(e) { alert(e.message); }
    }
    
    async function exportData() {
        const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet("Data");
        ws.columns = [{header:'Action',key:'a'},{header:'Account',key:'id'},{header:'Name',key:'n'},{header:'Rep',key:'r'},{header:'Sales',key:'s'}];
        [...STATE.toAdd.map(x=>({...x,a:'ADD'})), ...STATE.toRemove.map(x=>({...x,a:'REMOVE'}))].forEach(r=>ws.addRow({a:r.a,id:r.AccountNum||r.cr714_accountnum,n:r.Name||r.cr714_accountname,r:r.Rep||r.cr714_rep,s:r.Total_Sales_Last15Months}));
        saveAs(new Blob([await wb.xlsx.writeBuffer()]), "Daytona_Report.xlsx");
    }
</script>
</body>
</html>
