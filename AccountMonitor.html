<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daytona Command Center v2.5</title>
    
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg-body: #f0f2f5; --bg-card: #ffffff; --text-main: #2c3e50; --text-muted: #6c757d; --primary: #0078D4; --success: #2ecc71; --danger: #e74c3c; --border: #e9ecef; --shadow: 0 4px 6px rgba(0,0,0,0.05); }
        [data-theme="dark"] { --bg-body: #1a1a1a; --bg-card: #2d2d2d; --text-main: #e0e0e0; --text-muted: #a0a0a0; --border: #404040; --shadow: 0 4px 6px rgba(0,0,0,0.3); }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; transition: background 0.3s; }
        .grid-container { display: grid; grid-template-columns: 250px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .sidebar { background: var(--bg-card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); height: fit-content; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .nav-btn { display: block; width: 100%; padding: 12px; margin-bottom: 8px; border: none; background: transparent; text-align: left; color: var(--text-main); cursor: pointer; border-radius: 6px; font-weight: 600; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background: rgba(0, 120, 212, 0.1); color: var(--primary); }
        .main-content { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .controls { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.2s; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-outline { background: transparent; border: 2px solid var(--text-muted); color: var(--text-main); }
        .btn-outline:hover { background: var(--border); }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 300px; }
        .chart-container { position: relative; height: 100%; width: 100%; }
        .table-responsive { overflow-x: auto; max-height: 600px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: rgba(0, 120, 212, 0.05); padding: 12px; text-align: left; color: var(--primary); position: sticky; top: 0; backdrop-filter: blur(5px); }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        tr:hover { background: rgba(0,0,0,0.02); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .bg-new { background: rgba(46, 204, 113, 0.15); color: var(--success); }
        .bg-lost { background: rgba(231, 76, 60, 0.15); color: var(--danger); }
        .hidden { display: none !important; }
        .theme-switch { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); padding: 10px; border-radius: 50%; box-shadow: var(--shadow); cursor: pointer; z-index: 100; border: 1px solid var(--border); }
        #loader { height: 4px; background: var(--bg-body); border-radius: 2px; overflow: hidden; margin-top: 10px; display: none; }
        #loader-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>

<button class="theme-switch" onclick="toggleTheme()" title="Toggle Dark Mode"><i class="fa-solid fa-moon"></i></button>

<div class="grid-container">
    <aside class="sidebar">
        <h2><i class="fa-solid fa-bolt"></i> Daytona v2.5</h2>
        <nav>
            <button class="nav-btn active" onclick="showSection('dashboard')"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
            <button class="nav-btn" onclick="showSection('data')"><i class="fa-solid fa-table"></i> Account Data</button>
        </nav>
        <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px;">
            <div id="authStatus"><button class="btn btn-primary" style="width:100%" onclick="signIn()">Sign In</button></div>
            <div id="userInfo" class="hidden">
                <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:10px;" id="userName">User</p>
                <button class="btn btn-outline" style="width:100%; font-size:0.8rem;" onclick="signOut()">Sign Out</button>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="card">
            <div class="header">
                <div>
                    <h3 style="margin:0">Action Center</h3>
                    <p style="margin:0; font-size:0.9rem; color:var(--text-muted);">Syncs Dataverse (Master) vs. Power BI (Live)</p>
                </div>
                <div class="controls">
                    <button class="btn btn-primary" id="syncBtn" onclick="runSync()" disabled><i class="fa-solid fa-arrows-rotate"></i> Sync Data</button>
                    <button class="btn btn-success" onclick="exportToExcel()" id="exportBtn" disabled><i class="fa-solid fa-file-excel"></i> Export</button>
                    <button class="btn btn-danger" onclick="triggerBatchUpdate()" id="updateBtn" disabled><i class="fa-solid fa-cloud-arrow-up"></i> Update DB</button>
                </div>
            </div>
            <div id="loader"><div id="loader-bar"></div></div>
            <div id="statusText" style="font-size:0.85rem; margin-top:5px; color:var(--text-muted); font-style:italic;"></div>
        </div>

        <div id="dashboardSection">
            <div class="charts-row">
                <div class="card"><h4>Sync Status</h4><div class="chart-container"><canvas id="changeChart"></canvas></div></div>
                <div class="card"><h4>Accounts by Rep</h4><div class="chart-container"><canvas id="repChart"></canvas></div></div>
            </div>
        </div>

        <div id="dataSection" class="hidden">
            <div class="card">
                <div class="header">
                    <h4><i class="fa-solid fa-list"></i> Account Details</h4>
                    <input type="text" id="searchInput" placeholder="Search..." style="padding:8px; border-radius:4px; border:1px solid var(--border); width: 250px;" onkeyup="filterTable()">
                </div>
                <div class="table-responsive">
                    <table id="mainTable">
                        <thead><tr><th>Status</th><th>Account #</th><th>Name</th><th>Rep</th><th>15Mo Sales</th></tr></thead>
                        <tbody id="tableBody"><tr><td colspan="5" style="text-align:center">Run "Sync Data" to load.</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        msal: { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" } },
        flowUrl: "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/59ad3ef0294b439d909213d20c0a244d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=j4nLnW8GYdd6KP5x4_MuMEQHNaRwlH3evbWjXJQKdZw",
        updateFlowUrl: "YOUR_SECOND_FLOW_URL_HERE"
    };

    let STATE = { currentUser: null, masterList: [], liveList: [], newAccounts: [], lostAccounts: [], charts: {} };
    const msalInstance = new msal.PublicClientApplication(CONFIG.msal);

    window.onload = () => { loadTheme(); initCharts(); };

    async function signIn() {
        try { const r = await msalInstance.loginPopup({ scopes: ["User.Read"] }); STATE.currentUser = r.account; 
        document.getElementById("authStatus").classList.add("hidden"); document.getElementById("userInfo").classList.remove("hidden");
        document.getElementById("userName").innerText = STATE.currentUser.username; document.getElementById("syncBtn").disabled = false; } catch (e) { console.error(e); }
    }
    function signOut() { msalInstance.logoutPopup(); location.reload(); }

    async function runSync() {
        const ui = { btn: document.getElementById("syncBtn"), loader: document.getElementById("loader"), bar: document.getElementById("loader-bar"), text: document.getElementById("statusText") };
        ui.btn.disabled = true; ui.loader.style.display = "block"; ui.text.innerText = "Initiating Flow...";

        try {
            // 1. Call Flow
            let response = await fetch(CONFIG.flowUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: STATE.currentUser?.username || "Anon" }) });

            // 2. Poll if 202
            if (response.status === 202) {
                const loc = response.headers.get("Location");
                if(!loc) throw new Error("No polling location returned");
                ui.text.innerText = "Flow running (Polling)...";
                response = await pollForData(loc, ui);
            }
            if (!response.ok) throw new Error(`Status: ${response.status}`);

            const json = await response.json();
            // Unwrap if needed
            let data = (json.status === "Succeeded" && json.outputs?.body) ? json.outputs.body : json;

            // 3. EXTRACT LISTS
            // List 1: Live Data (Power BI)
            STATE.liveList = extractArray(data.customers, "Power BI");
            // List 2: Master Data (Dataverse)
            STATE.masterList = extractArray(data.dataverseAccounts, "Dataverse");

            ui.text.innerText = `Received: ${STATE.liveList.length} Live, ${STATE.masterList.length} Master. Comparing...`;
            await new Promise(r => setTimeout(r, 100)); // Render UI

            processComparison(STATE.masterList, STATE.liveList);

            ui.text.innerText = "Sync Complete."; ui.bar.style.width = "100%";
            document.getElementById("exportBtn").disabled = false;
            document.getElementById("updateBtn").disabled = (STATE.lostAccounts.length === 0 && STATE.newAccounts.length === 0);

        } catch (e) {
            ui.bar.style.background = "var(--danger)"; ui.text.innerText = "Error: " + e.message; console.error(e);
        } finally {
            ui.btn.disabled = false; setTimeout(() => { if(ui.bar.style.background !== "var(--danger)") { ui.loader.style.display="none"; ui.bar.style.width="0%"; } }, 5000);
        }
    }

    // Helper to safely find arrays in messy JSON
    function extractArray(obj, sourceName) {
        if (!obj) { console.warn(`Missing data for ${sourceName}`); return []; }
        if (typeof obj === 'string') try { obj = JSON.parse(obj); } catch(e) { return []; }
        if (Array.isArray(obj)) return obj;
        if (obj.value && Array.isArray(obj.value)) return obj.value;
        const found = Object.values(obj).find(v => Array.isArray(v));
        return found || [];
    }

    async function pollForData(url, ui) {
        for (let i=0; i<60; i++) {
            ui.bar.style.width = Math.min(90, i*2) + "%";
            await new Promise(r => setTimeout(r, 5000));
            const r = await fetch(url);
            if (r.status === 200) return r;
            if (r.status !== 202) throw new Error("Polling failed: " + r.status);
        }
        throw new Error("Timeout");
    }

    function processComparison(master, live) {
        // ID Getter: Handles PowerBI [AccountNum] vs Dataverse cr714_accountnum
        const getId = (item) => String(item.AccountNum || item.cr714_accountnum || "UNKNOWN").trim();

        // Sets for O(1) Lookup
        const masterSet = new Set(master.map(getId));
        const liveSet = new Set(live.map(getId));

        // NEW = In Live, NOT in Master (Needs to be added to DB)
        STATE.newAccounts = live.filter(x => !masterSet.has(getId(x)));
        
        // LOST = In Master, NOT in Live (Needs to be archived)
        STATE.lostAccounts = master.filter(x => !liveSet.has(getId(x)));

        renderTable();
        updateCharts();
    }

    function renderTable() {
        const tbody = document.getElementById("tableBody"); tbody.innerHTML = "";
        const limit = 200; // Render limit
        
        const rows = [
            ...STATE.newAccounts.slice(0,limit).map(x => ({...x, _st:'new'})),
            ...STATE.lostAccounts.slice(0,limit).map(x => ({...x, _st:'lost'})),
            ...STATE.liveList.slice(0,limit).map(x => ({...x, _st:'active'}))
        ];

        if(rows.length === 0) { tbody.innerHTML="<tr><td colspan='5'>No data</td></tr>"; return; }

        rows.forEach(r => {
            let badge = `<span class="badge" style="background:#eee;color:#666">Sync</span>`;
            if(r._st === 'new') badge = `<span class="badge bg-new">NEW</span>`;
            if(r._st === 'lost') badge = `<span class="badge bg-lost">LOST</span>`;
            
            const num = r.AccountNum || r.cr714_accountnum || "?";
            const name = r.Name || r.Name_CustTable || r.cr714_accountname || "?";
            const rep = r.Rep || r.SalesRepName || r.cr714_rep || "?";
            // Check for new sales column, formatted as currency
            const sales = r.Total_Sales_Last15Months ? `$${parseFloat(r.Total_Sales_Last15Months).toLocaleString(undefined, {maximumFractionDigits:0})}` : "-";

            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${badge}</td><td>${num}</td><td>${name}</td><td>${rep}</td><td>${sales}</td>`;
            tbody.appendChild(tr);
        });
    }

    function initCharts() {
        STATE.charts.change = new Chart(document.getElementById('changeChart'), { type: 'doughnut', data: { labels: ['New','Lost','Synced'], datasets:[{data:[0,0,1], backgroundColor:['#2ecc71','#e74c3c','#ecf0f1']}] } });
        STATE.charts.rep = new Chart(document.getElementById('repChart'), { type: 'bar', data: { labels: [], datasets: [] }, options: { scales: {y:{beginAtZero:true}} } });
    }

    function updateCharts() {
        const synced = Math.max(0, STATE.liveList.length - STATE.newAccounts.length);
        STATE.charts.change.data.datasets[0].data = [STATE.newAccounts.length, STATE.lostAccounts.length, synced];
        STATE.charts.change.update();

        // Rep Stats (from Live List)
        const counts = {};
        for(let i=0; i<Math.min(STATE.liveList.length, 50000); i++) {
            const r = STATE.liveList[i].Rep || STATE.liveList[i].SalesRepName || "Unassigned";
            counts[r] = (counts[r]||0)+1;
        }
        const sorted = Object.entries(counts).sort(([,a],[,b])=>b-a).slice(0,10);
        STATE.charts.rep.data.labels = sorted.map(x=>x[0]);
        STATE.charts.rep.data.datasets = [{ label:'Accounts', data:sorted.map(x=>x[1]), backgroundColor:'#0078D4' }];
        STATE.charts.rep.update();
    }

    async function exportToExcel() {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Analysis');
        ws.columns = [ {header:'Status',key:'s'}, {header:'Account',key:'a'}, {header:'Name',key:'n'}, {header:'Rep',key:'r'}, {header:'15Mo Sales',key:'sales'} ];
        ws.getRow(1).font = {bold:true, color:{argb:'FFFFFFFF'}}; ws.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0078D4'}};

        const add = (arr, stat) => arr.forEach(x => ws.addRow({
            s: stat,
            a: x.AccountNum || x.cr714_accountnum,
            n: x.Name || x.cr714_accountname,
            r: x.Rep || x.cr714_rep,
            sales: x.Total_Sales_Last15Months || 0
        }));

        add(STATE.newAccounts, "NEW (Add to DB)");
        add(STATE.lostAccounts, "LOST (Archive)");

        const buf = await wb.xlsx.writeBuffer();
        saveAs(new Blob([buf]), `Sync_Report_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    async function triggerBatchUpdate() {
        if(!confirm(`Archive ${STATE.lostAccounts.length} and Add ${STATE.newAccounts.length} records?`)) return;
        document.getElementById("updateBtn").innerText = "Sending...";
        try {
            await fetch(CONFIG.updateFlowUrl, { method: "POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ archive: STATE.lostAccounts, add: STATE.newAccounts, user: STATE.currentUser.username }) });
            alert("Update Queued!");
        } catch(e) { alert("Error: "+e.message); }
        document.getElementById("updateBtn").innerText = "Update DB";
    }

    function toggleTheme() {
        const b=document.body; const t=b.getAttribute('data-theme')==='dark'?'light':'dark';
        b.setAttribute('data-theme', t); localStorage.setItem('daytona_theme', t);
    }
    function loadTheme() { document.body.setAttribute('data-theme', localStorage.getItem('daytona_theme')||'light'); }
    function filterTable() {
        const t = document.getElementById("searchInput").value.toLowerCase();
        document.querySelectorAll("#tableBody tr").forEach(r => r.style.display = r.innerText.toLowerCase().includes(t)?"":"none");
    }
</script>

</body>
</html>
