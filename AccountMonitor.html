<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daytona Command Center v3.0</title>
    
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #2563eb; /* Royal Blue */
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        [data-theme="dark"] {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --border: #374151;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; transition: background 0.3s; height: 100vh; overflow: hidden; }
        
        /* Layout */
        .app-container { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
        
        /* Sidebar */
        .sidebar { background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px; z-index: 10; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px 16px; margin-bottom: 8px; border-radius: var(--radius); cursor: pointer; color: var(--text-muted); font-weight: 500; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
        .nav-item:hover { background: rgba(37, 99, 235, 0.1); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        
        /* Main Content */
        .main { padding: 30px; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .action-group { display: flex; gap: 12px; }
        
        /* Cards */
        .card { background: var(--bg-card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px; }
        .stat-card { display: flex; align-items: center; justify-content: space-between; }
        .stat-value { font-size: 2rem; font-weight: 700; margin: 5px 0; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; }
        
        /* Buttons */
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        /* Loader */
        .loader-container { margin-top: 15px; display: none; }
        .progress-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
        .status-text { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; display: flex; justify-content: space-between; }

        /* Tables & Data */
        .table-wrapper { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: var(--bg-body); padding: 16px; text-align: left; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); position: sticky; top: 0; }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        tr:hover { background: rgba(0,0,0,0.02); }
        
        /* Badges */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .bg-new { background: #d1fae5; color: #065f46; }
        .bg-lost { background: #fee2e2; color: #991b1b; }
        .bg-active { background: #e0f2fe; color: #075985; }

        /* Grid View */
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .account-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; transition: transform 0.2s; }
        .account-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
        .acc-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .acc-stat { margin-top: 10px; font-size: 0.9rem; color: var(--text-muted); display: flex; justify-content: space-between; }

        .hidden { display: none !important; }
        
        /* Theme Toggle */
        .theme-switch { position: absolute; bottom: 20px; left: 24px; background: transparent; border: 1px solid var(--border); padding: 8px; border-radius: 50%; color: var(--text-main); cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo"><i class="fa-solid fa-cube"></i> DAYTONA</div>
        
        <div class="nav-item active" onclick="nav('dashboard')">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
        </div>
        <div class="nav-item" onclick="nav('data')">
            <i class="fa-solid fa-database"></i> Data Grid
        </div>
        <div class="nav-item" onclick="nav('cards')">
            <i class="fa-solid fa-grip"></i> Card View
        </div>
        
        <div style="flex-grow: 1;"></div>
        
        <div id="authBox">
            <div id="userInfo" class="hidden" style="margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 8px;">
                <div style="font-size: 0.8rem; color: var(--text-muted);">Signed in as</div>
                <div style="font-weight: 600; overflow: hidden; text-overflow: ellipsis;" id="userName">...</div>
            </div>
            <button class="btn btn-primary" style="width: 100%; justify-content: center;" id="authBtn" onclick="handleAuth()">
                Sign In
            </button>
        </div>

        <button class="theme-switch" onclick="toggleTheme()" title="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </aside>

    <div class="main">
        <div class="top-bar">
            <div>
                <h1 style="margin: 0; font-size: 1.8rem;">Command Center</h1>
                <p style="margin: 5px 0 0; color: var(--text-muted);" id="lastSyncTime">Last Sync: Never</p>
            </div>
            <div class="action-group">
                <button class="btn btn-primary" id="syncBtn" onclick="runSync()" disabled>
                    <i class="fa-solid fa-arrows-rotate"></i> Sync Live Data
                </button>
                <button class="btn btn-outline" id="exportBtn" onclick="exportExcel()" disabled>
                    <i class="fa-solid fa-download"></i> Export
                </button>
                <button class="btn btn-outline" style="border-color: var(--danger); color: var(--danger);" id="updateBtn" onclick="triggerUpdate()" disabled>
                    <i class="fa-solid fa-server"></i> Update DB
                </button>
            </div>
        </div>

        <div class="card loader-container" id="loaderBox">
            <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
            <div class="status-text">
                <span id="statusMsg">Initializing...</span>
                <span id="timerMsg">0s</span>
            </div>
        </div>

        <div id="view-dashboard">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px;">
                <div class="card stat-card">
                    <div>
                        <div class="stat-value" style="color: var(--success);" id="statNew">0</div>
                        <div class="stat-label">New Accounts</div>
                    </div>
                    <i class="fa-solid fa-plus-circle" style="font-size: 2rem; color: var(--success); opacity: 0.2;"></i>
                </div>
                <div class="card stat-card">
                    <div>
                        <div class="stat-value" style="color: var(--danger);" id="statLost">0</div>
                        <div class="stat-label">Lost / Dropped</div>
                    </div>
                    <i class="fa-solid fa-circle-minus" style="font-size: 2rem; color: var(--danger); opacity: 0.2;"></i>
                </div>
                <div class="card stat-card">
                    <div>
                        <div class="stat-value" style="color: var(--primary);" id="statTotal">0</div>
                        <div class="stat-label">Total Active</div>
                    </div>
                    <i class="fa-solid fa-users" style="font-size: 2rem; color: var(--primary); opacity: 0.2;"></i>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px;">
                <div class="card">
                    <h3>Portfolio Health</h3>
                    <div style="height: 250px;"><canvas id="chartDonut"></canvas></div>
                </div>
                <div class="card">
                    <h3>Top Representatives</h3>
                    <div style="height: 250px;"><canvas id="chartBar"></canvas></div>
                </div>
            </div>
        </div>

        <div id="view-data" class="hidden">
            <div class="card" style="padding: 15px; margin-bottom: 20px; display: flex; gap: 10px;">
                <i class="fa-solid fa-search" style="color: var(--text-muted); padding-top: 10px;"></i>
                <input type="text" id="tableSearch" placeholder="Filter by Name, Account #, or Rep..." style="border: none; background: transparent; outline: none; font-size: 1rem; width: 100%;" onkeyup="filterData()">
            </div>
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th onclick="sortTable(0)">Status <i class="fa-solid fa-sort"></i></th>
                            <th onclick="sortTable(1)">Account # <i class="fa-solid fa-sort"></i></th>
                            <th onclick="sortTable(2)">Customer Name <i class="fa-solid fa-sort"></i></th>
                            <th onclick="sortTable(3)">Rep <i class="fa-solid fa-sort"></i></th>
                            <th onclick="sortTable(4)">15-Mo Sales <i class="fa-solid fa-sort"></i></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">No data loaded. Please sync.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="view-cards" class="hidden">
            <div class="grid-view" id="cardContainer">
                <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 50px;">
                    No data to display.
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        msal: {
            auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" }
        },
        flowUrl: "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/59ad3ef0294b439d909213d20c0a244d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=j4nLnW8GYdd6KP5x4_MuMEQHNaRwlH3evbWjXJQKdZw",
        updateFlowUrl: "YOUR_SECOND_FLOW_URL_HERE" // Update this when you create the second flow
    };

    let STATE = {
        user: null,
        masterList: [], // Dataverse
        liveList: [],   // Power BI
        newItems: [],
        lostItems: [],
        allItems: []    // Combined for display
    };

    const msalObj = new msal.PublicClientApplication(CONFIG.msal);
    let charts = {};

    // --- INITIALIZATION ---
    window.onload = () => {
        loadTheme();
        initCharts();
    };

    // --- AUTHENTICATION ---
    async function handleAuth() {
        if (STATE.user) {
            msalObj.logoutPopup();
            location.reload();
        } else {
            try {
                const r = await msalObj.loginPopup({ scopes: ["User.Read"] });
                STATE.user = r.account;
                updateAuthUI();
            } catch (e) { console.error(e); }
        }
    }

    function updateAuthUI() {
        document.getElementById("userInfo").classList.remove("hidden");
        document.getElementById("authBtn").innerText = "Sign Out";
        document.getElementById("authBtn").classList.replace("btn-primary", "btn-outline");
        document.getElementById("userName").innerText = STATE.user.username;
        document.getElementById("syncBtn").disabled = false;
    }

    // --- MAIN SYNC LOGIC ---
    async function runSync() {
        const ui = {
            btn: document.getElementById("syncBtn"),
            box: document.getElementById("loaderBox"),
            bar: document.getElementById("progressBar"),
            msg: document.getElementById("statusMsg"),
            time: document.getElementById("timerMsg")
        };

        ui.btn.disabled = true;
        ui.box.style.display = "block";
        ui.msg.innerText = "Connecting to Power Automate...";
        ui.bar.style.width = "5%";

        let seconds = 0;
        const timer = setInterval(() => { seconds++; ui.time.innerText = seconds + "s"; }, 1000);

        try {
            // 1. Trigger Flow
            let resp = await fetch(CONFIG.flowUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user: STATE.user?.username || "Anon" })
            });

            // 2. Handle Long Running (202)
            if (resp.status === 202) {
                const loc = resp.headers.get("Location");
                ui.msg.innerText = "Flow executing (this may take 2 mins)...";
                resp = await pollResult(loc, ui.bar);
            }

            if (!resp.ok) throw new Error("Flow Failed: " + resp.status);

            const json = await resp.json();
            
            // 3. SMART PARSING (Fixes the "Double String" issue)
            let data = json;
            // Unwrap 'outputs.body' if present (Polling format)
            if (data.outputs && data.outputs.body) data = data.outputs.body;
            // Unwrap 'body' if present (Direct format)
            if (data.body) data = data.body;

            console.log("Raw Data:", data);

            // Parse 'customers' (Live/PBI)
            STATE.liveList = smartParse(data.customers, "customers");
            
            // Parse 'dataverseAccounts' (Master/DB)
            STATE.masterList = smartParse(data.dataverseAccounts, "dataverseAccounts");

            ui.msg.innerText = `Analyzing: ${STATE.liveList.length} Live vs ${STATE.masterList.length} Master...`;
            ui.bar.style.width = "90%";
            await new Promise(r => setTimeout(r, 500));

            // 4. COMPARE
            runComparison();

            ui.msg.innerText = "Complete";
            ui.bar.style.width = "100%";
            setTimeout(() => { ui.box.style.display = "none"; }, 2000);

            // Enable Actions
            document.getElementById("exportBtn").disabled = false;
            document.getElementById("updateBtn").disabled = (STATE.newItems.length === 0 && STATE.lostItems.length === 0);
            document.getElementById("lastSyncTime").innerText = "Last Sync: " + new Date().toLocaleTimeString();

        } catch (e) {
            ui.msg.innerText = "Error: " + e.message;
            ui.bar.style.background = "var(--danger)";
            console.error(e);
        } finally {
            clearInterval(timer);
            ui.btn.disabled = false;
        }
    }

    // --- HELPER: Poll for Result ---
    async function pollResult(url, bar) {
        for (let i = 0; i < 40; i++) { // Max 200 seconds
            await new Promise(r => setTimeout(r, 5000));
            bar.style.width = Math.min(85, i * 4) + "%";
            
            const r = await fetch(url);
            if (r.status === 200) return r;
            if (r.status !== 202) throw new Error("Polling Error: " + r.status);
        }
        throw new Error("Timeout waiting for flow");
    }

    // --- HELPER: Smart Parse (The Fix) ---
    function smartParse(input, name) {
        if (!input) {
            console.warn(`${name} is null/undefined`);
            return [];
        }
        // If it's already an array, great
        if (Array.isArray(input)) return input;
        
        // If it's a string, try parsing
        if (typeof input === 'string') {
            try {
                const parsed = JSON.parse(input);
                if (Array.isArray(parsed)) return parsed;
                // Sometimes it wraps in { value: [] }
                if (parsed.value && Array.isArray(parsed.value)) return parsed.value;
            } catch (e) {
                console.error(`Failed to parse ${name}`, e);
            }
        }
        return [];
    }

    // --- COMPARISON LOGIC ---
    function runComparison() {
        const getId = (x) => String(x.AccountNum || x.cr714_accountnum || "UNK").trim();

        const masterSet = new Set(STATE.masterList.map(getId));
        const liveSet = new Set(STATE.liveList.map(getId));

        // New: In Live but not Master
        STATE.newItems = STATE.liveList.filter(x => !masterSet.has(getId(x))).map(x => ({...x, _st: 'new'}));
        
        // Lost: In Master but not Live
        STATE.lostItems = STATE.masterList.filter(x => !liveSet.has(getId(x))).map(x => ({...x, _st: 'lost'}));
        
        // Active: In both
        const active = STATE.liveList.filter(x => masterSet.has(getId(x))).map(x => ({...x, _st: 'active'}));

        // Combine for display (Priority: New > Lost > Active)
        STATE.allItems = [...STATE.newItems, ...STATE.lostItems, ...active];

        updateDashboard();
        renderTable();
        renderCards();
    }

    // --- RENDER UI ---
    function updateDashboard() {
        // Stats
        document.getElementById("statNew").innerText = STATE.newItems.length;
        document.getElementById("statLost").innerText = STATE.lostItems.length;
        document.getElementById("statTotal").innerText = STATE.liveList.length;

        // Charts
        charts.donut.data.datasets[0].data = [STATE.newItems.length, STATE.lostItems.length, STATE.liveList.length - STATE.newItems.length];
        charts.donut.update();

        // Rep Chart
        const reps = {};
        STATE.liveList.forEach(x => {
            const r = x.Rep || x.SalesRepName || "Unassigned";
            reps[r] = (reps[r] || 0) + 1;
        });
        const sortedReps = Object.entries(reps).sort((a,b) => b[1] - a[1]).slice(0, 8);
        
        charts.bar.data.labels = sortedReps.map(x => x[0]);
        charts.bar.data.datasets[0].data = sortedReps.map(x => x[1]);
        charts.bar.update();
    }

    function renderTable() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        
        // Render first 200 to prevent lag
        const displayData = STATE.allItems.slice(0, 200);

        if (displayData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px;">No records found.</td></tr>`;
            return;
        }

        displayData.forEach(row => {
            let badgeClass = "bg-active";
            let statusText = "Active";
            
            if (row._st === 'new') { badgeClass = "bg-new"; statusText = "NEW ADDITION"; }
            if (row._st === 'lost') { badgeClass = "bg-lost"; statusText = "DROPPED"; }

            // Normalize fields
            const acct = row.AccountNum || row.cr714_accountnum || "N/A";
            const name = row.Name || row.Name_CustTable || row.cr714_accountname || "Unknown";
            const rep = row.Rep || row.SalesRepName || row.cr714_rep || "Unassigned";
            let sales = row.Total_Sales_Last15Months || 0;
            
            // Format Sales
            const salesFmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(sales);
            const salesStyle = sales > 10000 ? "font-weight:bold; color:var(--success);" : "";

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><span class="badge ${badgeClass}">${statusText}</span></td>
                <td style="font-family:monospace;">${acct}</td>
                <td style="font-weight:500;">${name}</td>
                <td>${rep}</td>
                <td style="${salesStyle}">${salesFmt}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderCards() {
        const container = document.getElementById("cardContainer");
        container.innerHTML = "";
        
        // Show priority items (New/Lost) first in cards
        const displayData = [...STATE.newItems, ...STATE.lostItems, ...STATE.allItems.filter(x=>x._st==='active').slice(0, 50)];

        displayData.forEach(row => {
            const acct = row.AccountNum || row.cr714_accountnum || "N/A";
            const name = row.Name || row.Name_CustTable || row.cr714_accountname || "Unknown";
            const rep = row.Rep || row.SalesRepName || row.cr714_rep || "Unassigned";
            
            let border = "var(--border)";
            if (row._st === 'new') border = "var(--success)";
            if (row._st === 'lost') border = "var(--danger)";

            const div = document.createElement("div");
            div.className = "account-card";
            div.style.borderLeft = `4px solid ${border}`;
            div.innerHTML = `
                <div class="acc-header">
                    <strong>${acct}</strong>
                    <span style="font-size:0.8rem; color:var(--text-muted)">${rep}</span>
                </div>
                <div style="font-weight:bold; margin-bottom:10px; height:40px; overflow:hidden;">${name}</div>
                <div class="acc-stat">
                    <span>Status</span>
                    <span style="text-transform:uppercase; font-size:0.75rem; font-weight:700;">${row._st}</span>
                </div>
            `;
            container.appendChild(div);
        });
    }

    // --- UTILITIES ---
    function nav(viewId) {
        document.querySelectorAll("[id^='view-']").forEach(el => el.classList.add("hidden"));
        document.getElementById(`view-${viewId}`).classList.remove("hidden");
        
        document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
        event.currentTarget.classList.add("active");
    }

    function filterData() {
        const term = document.getElementById("tableSearch").value.toLowerCase();
        const rows = document.querySelectorAll("#tableBody tr");
        rows.forEach(r => {
            const txt = r.innerText.toLowerCase();
            r.style.display = txt.includes(term) ? "" : "none";
        });
    }

    function sortTable(n) {
        // Basic sort implementation could go here
        alert("Sort feature ready to be implemented!");
    }

    async function exportExcel() {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet('Account Report');
        
        ws.columns = [
            { header: 'Status', key: 'st', width: 15 },
            { header: 'Account #', key: 'id', width: 15 },
            { header: 'Name', key: 'name', width: 35 },
            { header: 'Rep', key: 'rep', width: 25 },
            { header: 'Sales (15mo)', key: 'sales', width: 20 }
        ];

        ws.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
        ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2563EB' } };

        STATE.allItems.forEach(item => {
            ws.addRow({
                st: item._st.toUpperCase(),
                id: item.AccountNum || item.cr714_accountnum,
                name: item.Name || item.cr714_accountname,
                rep: item.Rep || item.cr714_rep,
                sales: item.Total_Sales_Last15Months || 0
            });
        });

        const buf = await wb.xlsx.writeBuffer();
        saveAs(new Blob([buf]), `Daytona_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    async function triggerUpdate() {
        if (!confirm(`Confirm Database Update:\n\nAdd: ${STATE.newItems.length} records\nArchive: ${STATE.lostItems.length} records`)) return;
        
        try {
            await fetch(CONFIG.updateFlowUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ add: STATE.newItems, remove: STATE.lostItems })
            });
            alert("Update Batch Queued Successfully.");
        } catch (e) { alert("Update Failed: " + e.message); }
    }

    function initCharts() {
        charts.donut = new Chart(document.getElementById('chartDonut'), {
            type: 'doughnut',
            data: { labels: ['New', 'Lost', 'Stable'], datasets: [{ data: [0, 0, 1], backgroundColor: ['#10b981', '#ef4444', '#e5e7eb'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
        });

        charts.bar = new Chart(document.getElementById('chartBar'), {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Accounts', data: [], backgroundColor: '#3b82f6', borderRadius: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { display: false } } } }
        });
    }

    function toggleTheme() {
        const b = document.body;
        const current = b.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        b.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
    }
    
    function loadTheme() {
        const t = localStorage.getItem("theme") || "light";
        document.body.setAttribute("data-theme", t);
    }
</script>

</body>
</html>
