<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daytona Command Center v10</title>
    
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --bg-body: #f8fafc; --bg-sidebar: #ffffff; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --warning: #f59e0b; --border: #e2e8f0; }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; height: 100vh; display: grid; grid-template-columns: 280px 1fr; }
        
        /* SIDEBAR */
        .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; overflow-y: auto; }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .section-title { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin: 20px 0 10px 0; letter-spacing: 0.5px; }
        
        /* BUTTONS */
        .btn { padding: 10px 14px; border-radius: 6px; border: 1px solid transparent; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; transition: 0.2s; text-align: left; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: white; border-color: var(--border); color: var(--text-main); }
        .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }

        /* FILE UPLOAD */
        .file-box { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; color: var(--text-muted); transition: 0.2s; position: relative; }
        .file-box:hover { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
        .file-box input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-success { border-color: var(--success); background: #f0fdf4; color: var(--success); }

        /* MAIN AREA */
        .main { padding: 32px; overflow-y: auto; }
        .card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); padding: 24px; margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        
        /* STATS */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px; }
        .stat-item { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-val { font-size: 2rem; font-weight: 800; line-height: 1.2; }
        .stat-lbl { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

        /* TABS */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .tab { padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-muted); background: transparent; border: 1px solid transparent; }
        .tab.active { background: var(--text-main); color: white; }
        .tab:hover:not(.active) { background: var(--border); }

        /* TABLE */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 12px; background: #f8fafc; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; }
        .b-add { background: #dcfce7; color: #166534; }
        .b-del { background: #fee2e2; color: #991b1b; }
        .b-act { background: #e0f2fe; color: #075985; }

        /* UTILS */
        .loader { display: none; height: 4px; background: var(--border); margin-top: 10px; border-radius: 2px; overflow: hidden; }
        .bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="logo"><i class="fa-solid fa-layer-group"></i> DAYTONA v10</div>
    
    <div id="authSection">
        <button class="btn btn-primary" onclick="signIn()">Sign In with Microsoft</button>
    </div>
    <div id="userSection" style="display:none;">
        <div style="font-size:0.85rem; font-weight:700;" id="uName">User</div>
        <button class="btn btn-outline" style="margin-top:5px; padding:6px;" onclick="signOut()">Sign Out</button>
    </div>

    <div class="section-title">1. Yesterday's Snapshot</div>
    <div class="file-box" id="dropZone">
        <i class="fa-solid fa-upload"></i> <span id="fileTxt">Select JSON</span>
        <input type="file" id="fileInput" accept=".json" onchange="loadSnapshot(this)">
    </div>

    <div class="section-title">2. Live Analysis</div>
    <button class="btn btn-primary" id="syncBtn" onclick="runSync()" disabled>
        <i class="fa-solid fa-arrows-rotate"></i> Compare Live vs. Snapshot
    </button>
    <div class="loader" id="loader"><div class="bar" id="pBar"></div></div>
    <div id="statusTxt" style="font-size:0.75rem; color:var(--text-muted); margin-top:5px; text-align:center;"></div>

    <div class="section-title">3. Generate Reports</div>
    <button class="btn btn-outline" id="expNew" onclick="exportExcel('ADD')" disabled>
        <i class="fa-solid fa-file-export"></i> Export New List
    </button>
    <button class="btn btn-outline" id="expLost" onclick="exportExcel('REMOVE')" disabled>
        <i class="fa-solid fa-file-export"></i> Export Dropped List
    </button>
    <button class="btn btn-outline" id="expAll" onclick="exportExcel('ALL')" disabled>
        <i class="fa-solid fa-table"></i> Export Full Dataset
    </button>

    <div class="section-title">4. Update Database</div>
    <button class="btn btn-success" id="dbAdd" onclick="commitToDb('ADD')" disabled>
        <i class="fa-solid fa-plus"></i> Add New Accounts
    </button>
    <button class="btn btn-danger" id="dbRem" onclick="commitToDb('REMOVE')" disabled>
        <i class="fa-solid fa-trash"></i> Archive Dropped
    </button>
</aside>

<main class="main">
    <div style="display:flex; justify-content:space-between; align-items:end; margin-bottom:30px;">
        <div>
            <h1 style="margin:0; font-size:1.8rem;">Command Center</h1>
            <p style="margin:5px 0 0; color:var(--text-muted);">Snapshot Date: <strong id="snapDate">--</strong></p>
        </div>
        <div style="text-align:right">
            <div style="font-size:0.8rem; font-weight:700; color:var(--text-muted);">SYSTEM STATUS</div>
            <div style="color:var(--success); font-weight:700;">Online</div>
        </div>
    </div>

    <div class="stats">
        <div class="stat-item">
            <div class="stat-val" id="valNew" style="color:var(--success)">0</div>
            <div class="stat-lbl">New Accounts</div>
        </div>
        <div class="stat-item">
            <div class="stat-val" id="valLost" style="color:var(--danger)">0</div>
            <div class="stat-lbl">Dropped Accounts</div>
        </div>
        <div class="stat-item">
            <div class="stat-val" id="valTotal" style="color:var(--primary)">0</div>
            <div class="stat-lbl">Total Active Portfolio</div>
        </div>
    </div>

    <div class="card" style="padding:0;">
        <div style="padding:20px;">
            <div class="tabs">
                <button class="tab active" onclick="filterView('ALL', this)">All Changes</button>
                <button class="tab" onclick="filterView('ADD', this)">New Only</button>
                <button class="tab" onclick="filterView('REMOVE', this)">Dropped Only</button>
                <button class="tab" onclick="filterView('ACTIVE', this)">Full Portfolio</button>
            </div>
            <input type="text" id="searchBox" placeholder="Search accounts..." style="width:100%; padding:10px; border:1px solid var(--border); border-radius:6px;" onkeyup="runSearch()">
        </div>
        
        <div style="overflow-x:auto;">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Account #</th>
                        <th>Name</th>
                        <th>Rep</th>
                        <th>15 Mo Sales</th>
                    </tr>
                </thead>
                <tbody id="tBody">
                    <tr><td colspan="5" style="text-align:center; padding:40px; color:var(--text-muted);">Waiting for Snapshot & Sync...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    // --- CONFIG ---
    const CONFIG = {
        msal: { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" } },
        // Your existing Flow URL (Power BI + Dataverse)
        flowUrl: "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/59ad3ef0294b439d909213d20c0a244d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=j4nLnW8GYdd6KP5x4_MuMEQHNaRwlH3evbWjXJQKdZw",
        dbUrl: "YOUR_DB_UPDATE_FLOW_URL"
    };

    const msalObj = new msal.PublicClientApplication(CONFIG.msal);
    let STATE = { user: null, snapshot: [], live: [], db: [], toAdd: [], toRemove: [] };

    // --- AUTH ---
    async function signIn() {
        try {
            const r = await msalObj.loginPopup({ scopes: ["User.Read"] });
            STATE.user = r.account;
            document.getElementById("authSection").style.display="none";
            document.getElementById("userSection").style.display="block";
            document.getElementById("uName").innerText = STATE.user.username;
        } catch(e) { console.error(e); }
    }
    function signOut() { msalObj.logoutPopup(); location.reload(); }

    // --- 1. LOAD SNAPSHOT ---
    function loadSnapshot(input) {
        const file = input.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const raw = JSON.parse(e.target.result);
                // Clean keys immediately
                STATE.snapshot = cleanKeys(safeParse(raw));
                
                // UI Updates
                const zone = document.getElementById("dropZone");
                zone.classList.add("file-success");
                document.getElementById("fileTxt").innerHTML = `<i class="fa-solid fa-check"></i> Loaded (${STATE.snapshot.length})`;
                document.getElementById("snapDate").innerText = file.name;
                document.getElementById("syncBtn").disabled = false;
            } catch(err) { alert("Invalid JSON"); console.error(err); }
        };
        reader.readAsText(file);
    }

    // --- 2. LIVE SYNC (FIXED LOGIC) ---
    async function runSync() {
        if(!STATE.user) return alert("Sign In Required");
        
        const ui = { btn:document.getElementById("syncBtn"), bar:document.getElementById("pBar"), ldr:document.getElementById("loader"), txt:document.getElementById("statusTxt") };
        ui.btn.disabled = true; ui.ldr.style.display="block"; ui.bar.style.width="10%"; ui.txt.innerText="Requesting Live Data...";

        try {
            let resp = await fetch(CONFIG.flowUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({user: STATE.user.username}) });
            
            // Handle Async 202 Polling
            if(resp.status === 202) {
                ui.txt.innerText="Querying Power BI (Polling)...";
                // poll() returns the PARSED JSON object now
                resp = await poll(resp.headers.get("Location"));
            } else {
                // If 200 OK immediately, parse it here
                resp = await resp.json();
            }

            const data = (resp.outputs && resp.outputs.body) ? resp.outputs.body : resp;
            
            ui.bar.style.width="80%"; ui.txt.innerText="Analyzing...";
            await new Promise(r => setTimeout(r, 200));

            // Clean & Store
            STATE.live = cleanKeys(safeParse(data.live || data.customers));
            STATE.db = cleanKeys(safeParse(data.dataverseAccounts));

            // Compare
            const getId = (x) => String(x.AccountNum || x.cr714_accountnum || "UNK").trim();
            const liveSet = new Set(STATE.live.map(getId));
            const dbSet = new Set(STATE.db.map(getId));
            
            // New = In Live, Not in DB
            STATE.toAdd = STATE.live.filter(x => !dbSet.has(getId(x)));
            // Lost = In DB, Not in Live
            STATE.toRemove = STATE.db.filter(x => !liveSet.has(getId(x)));

            renderTable('ALL');
            updateStats();
            
            ui.bar.style.width="100%"; ui.txt.innerText="Done";
            setTimeout(() => ui.ldr.style.display="none", 1500);

            // Enable Reports & Actions
            enableButtons(true);

        } catch(e) {
            alert("Sync Error: " + e.message);
            console.error(e);
            ui.ldr.style.display="none";
        } finally { ui.btn.disabled = false; }
    }

    // --- UI LOGIC ---
    function renderTable(filterType) {
        const tbody = document.getElementById("tBody");
        tbody.innerHTML = "";
        
        let data = [];
        if(filterType === 'ADD') data = STATE.toAdd.map(x=>({...x, _st:'ADD'}));
        else if(filterType === 'REMOVE') data = STATE.toRemove.map(x=>({...x, _st:'REMOVE'}));
        else if(filterType === 'ACTIVE') data = STATE.live.slice(0,200).map(x=>({...x, _st:'ACTIVE'}));
        else {
            // ALL View
            data = [
                ...STATE.toAdd.map(x=>({...x, _st:'ADD'})),
                ...STATE.toRemove.map(x=>({...x, _st:'REMOVE'}))
            ];
            if(data.length === 0) data = STATE.live.slice(0,50).map(x=>({...x, _st:'ACTIVE'}));
        }

        if(data.length === 0) { tbody.innerHTML="<tr><td colspan='5' style='text-align:center; padding:20px;'>No records found for this view.</td></tr>"; return; }

        data.forEach(r => {
            let badge = `<span class="badge b-act">Active</span>`;
            if(r._st === 'ADD') badge = `<span class="badge b-add">New</span>`;
            if(r._st === 'REMOVE') badge = `<span class="badge b-del">Dropped</span>`;

            const sales = r.Total_Sales_Last15Months ? `$${Math.round(r.Total_Sales_Last15Months).toLocaleString()}` : "-";

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${badge}</td>
                <td>${r.AccountNum || r.cr714_accountnum || ''}</td>
                <td>${r.Name || r.cr714_accountname || ''}</td>
                <td>${r.Rep || r.cr714_rep || ''}</td>
                <td>${sales}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function filterView(type, btn) {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTable(type);
    }

    function runSearch() {
        const term = document.getElementById("searchBox").value.toLowerCase();
        document.querySelectorAll("#tBody tr").forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(term) ? "" : "none";
        });
    }

    function updateStats() {
        document.getElementById("valNew").innerText = STATE.toAdd.length;
        document.getElementById("valLost").innerText = STATE.toRemove.length;
        document.getElementById("valTotal").innerText = STATE.live.length;
    }

    function enableButtons(on) {
        ['expNew','expLost','expAll'].forEach(id => document.getElementById(id).disabled = !on);
        document.getElementById("dbAdd").disabled = STATE.toAdd.length === 0;
        document.getElementById("dbRem").disabled = STATE.toRemove.length === 0;
    }

    // --- ACTIONS & REPORTS ---
    async function exportExcel(type) {
        const wb = new ExcelJS.Workbook();
        const ws = wb.addWorksheet("Report");
        
        ws.columns = [
            {header:'Status', key:'st', width:15},
            {header:'Account #', key:'id', width:15},
            {header:'Name', key:'nm', width:30},
            {header:'Rep', key:'rp', width:20},
            {header:'Sales', key:'sl', width:15}
        ];

        let list = [];
        if(type==='ADD') list = STATE.toAdd.map(x=>({...x, _s:'NEW'}));
        if(type==='REMOVE') list = STATE.toRemove.map(x=>({...x, _s:'DROPPED'}));
        if(type==='ALL') list = [...STATE.toAdd.map(x=>({...x,_s:'NEW'})), ...STATE.toRemove.map(x=>({...x,_s:'DROPPED'})), ...STATE.live.map(x=>({...x,_s:'ACTIVE'}))];

        list.forEach(item => {
            ws.addRow({
                st: item._s,
                id: item.AccountNum || item.cr714_accountnum,
                nm: item.Name || item.cr714_accountname,
                rp: item.Rep || item.cr714_rep,
                sl: item.Total_Sales_Last15Months
            });
        });

        const buf = await wb.xlsx.writeBuffer();
        saveAs(new Blob([buf]), `Daytona_Export_${type}.xlsx`);
    }

    async function commitToDb(action) {
        const count = action === 'ADD' ? STATE.toAdd.length : STATE.toRemove.length;
        if(!confirm(`Confirm: ${action} ${count} records in Database?`)) return;
        
        try {
            // Sending specific payload based on action
            const payload = { 
                user: STATE.user.username,
                add: action === 'ADD' ? STATE.toAdd : [],
                remove: action === 'REMOVE' ? STATE.toRemove : []
            };
            
            await fetch(CONFIG.dbUrl, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });
            alert("Update Batch Queued Successfully.");
        } catch(e) { alert("Error: "+e.message); }
    }

    // --- HELPERS ---
    async function poll(url) {
        for(let i=0; i<60; i++) {
            await new Promise(r => setTimeout(r, 4000));
            let res = await fetch(url);
            if(res.status === 200) return await res.json(); // Return the JSON directly
        } throw new Error("Timeout");
    }

    function safeParse(input) {
        if(!input) return [];
        if(typeof input === 'string') { try { return JSON.parse(input); } catch { return []; } }
        return Array.isArray(input) ? input : (input.value || []);
    }

    function cleanKeys(arr) {
        // Removes [brackets] from PBI keys
        return arr.map(obj => {
            const n = {};
            for(let k in obj) n[k.replace(/^\[|\]$/g, '')] = obj[k];
            return n;
        });
    }
</script>

</body>
</html>
