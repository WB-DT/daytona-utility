<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoiced Sales Cube - v11.6 Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <style>
        :root {
            --primary: #2563eb; /* Daytona Blue */
            --bg-app: #f1f5f9;
            --bg-card: #ffffff;
            --border-color: #cbd5e1;
        }
        body { background: var(--bg-app); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .data-table thead th { position: sticky; top: 0; background: #f8fafc; z-index: 10; }
    </style>
</head>
<body class="p-4">

    <div id="login-container" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[10000]">
        <div class="bg-white p-8 rounded-lg shadow-2xl text-center max-w-sm w-full">
            <i class="fas fa-cube text-5xl text-blue-600 mb-4"></i>
            <h2 class="text-2xl font-bold mb-6">Sales Cube Access</h2>
            <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">
                Sign in with Microsoft
            </button>
        </div>
    </div>

    <div id="app-container" class="hidden flex flex-col h-screen">
        <header class="bg-white p-4 rounded-t-lg border border-b-0 border-slate-300 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <i class="fas fa-database text-blue-600 text-2xl"></i>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">Invoiced Sales Analysis</h1>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Model: InvoiceSalesAnalysis</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-sm font-semibold border-r pr-4 border-slate-300"></span>
                <button onclick="fetchCubeData()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded shadow-md transition">
                    <i class="fas fa-sync-alt mr-2"></i>Run DAX Query
                </button>
            </div>
        </header>

        <div class="flex-grow bg-white border border-slate-300 rounded-b-lg overflow-hidden shadow-lg flex flex-col">
            <div class="overflow-auto flex-grow bg-slate-50">
                <table class="w-full text-left text-sm data-table">
                    <thead class="border-b border-slate-300 shadow-sm">
                        <tr id="table-head">
                            </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-200">
                        <tr>
                            <td colspan="100%" class="p-12 text-center text-slate-400 italic">
                                <i class="fas fa-info-circle mr-2"></i>Sign in and click Refresh to pull data from the SSAS Cube.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <footer class="bg-slate-50 border-t border-slate-300 p-3 flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase">
                <div id="row-count">Records: 0</div>
                <div id="status-message">Ready</div>
            </footer>
        </div>
    </div>

    <script>
        // Production MSAL Config [cite: 425]
        const msalConfig = {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: window.location.origin
            },
            cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const FLOW_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/02a9847e7f1947f592f9d307e15db730/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PtI2iBpGPwFCkZhYohHii-WLm1iwW0IN2JnsFqwStlk";
        let msalAccount = null;

        async function login() {
            try {
                const response = await msalInstance.loginPopup({ scopes: ["User.Read"] });
                msalAccount = response.account;
                initApp();
            } catch (err) { alert("Login failed: " + err.message); }
        }

        function initApp() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = msalAccount.name; // [cite: 642, 655]
        }

        async function fetchCubeData() {
            const body = document.getElementById('table-body');
            const status = document.getElementById('status-message');
            
            body.innerHTML = '<tr><td colspan="100%" class="p-12 text-center font-bold text-blue-600"><i class="fas fa-spinner fa-spin mr-3"></i>Executing DAX on SSAS Tabular...</td></tr>';
            status.innerText = "Querying Cube...";

            try {
                const response = await fetch(FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repName: msalAccount.name }) // Passing authenticated name to flow
                });

                if (!response.ok) throw new Error(`Server Error: ${response.status}`);
                
                const data = await response.json();
                renderTable(data);
                status.innerText = "Data Loaded Successfully";
            } catch (err) {
                body.innerHTML = `<tr><td colspan="100%" class="p-12 text-center text-red-600 font-bold">Error: ${err.message}</td></tr>`;
                status.innerText = "Error Occurred";
            }
        }

        function renderTable(rows) {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            const count = document.getElementById('row-count');

            if (!rows || rows.length === 0) {
                body.innerHTML = '<tr><td colspan="100%" class="p-12 text-center italic">No records returned for this representative.</td></tr>';
                count.innerText = "Records: 0";
                return;
            }

            const keys = Object.keys(rows[0]);
            head.innerHTML = keys.map(k => `<th class="px-4 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-tighter">${k}</th>`).join('');
            
            body.innerHTML = rows.map(row => `
                <tr class="hover:bg-blue-50 transition-colors">
                    ${keys.map(k => `<td class="px-4 py-3 text-slate-700 font-medium">${row[k] || ''}</td>`).join('')}
                </tr>
            `).join('');
            
            count.innerText = `Records: ${rows.length}`;
        }

        // Redirect handler for existing sessions [cite: 653]
        msalInstance.handleRedirectPromise().then(() => {
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) {
                msalAccount = accounts[0];
                initApp();
            }
        });
    </script>
</body>
</html>
