<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Cube - Inside Sales Expansion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1e40af; --bg-app: #f8fafc; }
        body { background: var(--bg-app); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.5rem; }
        .table-container { height: 60vh; overflow: auto; position: relative; border: 1px solid #cbd5e1; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        thead th { position: sticky; top: 0; background: #f1f5f9; z-index: 10; border-bottom: 2px solid #cbd5e1; border-right: 1px solid #cbd5e1; padding: 8px; font-size: 10px; text-transform: uppercase; color: #64748b; }
        .filter-input { width: 100%; margin-top: 4px; padding: 2px 4px; font-size: 10px; border: 1px solid #cbd5e1; border-radius: 2px; color: #1e293b; font-weight: normal; }
        tbody td { padding: 6px 12px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #f1f5f9; font-size: 11px; white-space: nowrap; }
        .spinner { animation: spin 1s infinite linear; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 gap-4">

    <div id="login-container" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[10000]">
        <div class="bg-white p-10 rounded-xl shadow-2xl text-center">
            <h2 class="text-2xl font-bold mb-6">Inside Sales Portal</h2>
            <button onclick="login()" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-blue-700">Microsoft Login</button>
        </div>
    </div>

    <div id="app-container" class="hidden flex flex-col h-full gap-4">
        <header class="card p-4 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-blue-900"><i class="fas fa-table mr-2"></i>Sales Expansion</h1>
                <span id="user-display" class="text-sm text-slate-500 italic border-l pl-4"></span>
            </div>
            <div class="flex gap-2">
                <button onclick="exportToExcel()" class="bg-green-700 text-white px-4 py-2 rounded text-xs font-bold hover:bg-green-800"><i class="fas fa-file-excel mr-2"></i>Export .xlsx</button>
                <button onclick="fetchCubeData()" id="refresh-btn" class="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold hover:bg-blue-700">Refresh Data</button>
            </div>
        </header>

        <div class="table-container card">
            <table id="main-table">
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr><td colspan="20" class="p-20 text-center text-slate-400">Data not yet loaded.</td></tr>
                </tbody>
            </table>
        </div>

        <div class="flex gap-4 h-[25vh] shrink-0">
            <div class="card flex-1 p-4 flex flex-col">
                <h3 class="text-xs font-bold uppercase text-slate-500 mb-2 border-b">15-Month Performance</h3>
                <div class="flex-grow"><canvas id="salesChart"></canvas></div>
            </div>
            <div id="selection-details" class="card flex-1 p-4 overflow-auto bg-slate-50 text-xs italic text-slate-400">
                Select an account row to view full dimensional details.
            </div>
        </div>
    </div>

    <script>
        const msalConfig = {
            auth: { 
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", 
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: window.location.origin + window.location.pathname 
            }
        };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const FLOW_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/02a9847e7f1947f592f9d307e15db730/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PtI2iBpGPwFCkZhYohHii-WLm1iwW0IN2JnsFqwStlk";
        
        let rawData = [], filteredData = [], msalAccount = null, salesChart = null;
        let columnFilters = {};

        // Helper to map complex DAX names to readable headers
        const headerMap = {
            "DimCustomer_logicapplied[AccountNum]": "Account",
            "DimCustomer_logicapplied[Name_CustTable]": "Customer Name",
            "DimCustomer_logicapplied[Address]": "Billing Address",
            "DimSalesRep_logicapplied[Name]": "Sales Rep",
            "FactInvoice_logicapplied[InvoiceDate]": "Date",
            "[SumSales]": "Sales Amount",
            "[Month_Advisory]": "Month"
        };

        async function login() {
            const res = await msalInstance.loginPopup({ scopes: ["User.Read"] });
            msalAccount = res.account;
            initApp();
        }

        function initApp() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = msalAccount.name;
        }

        async function fetchCubeData() {
            const btn = document.getElementById('refresh-btn');
            btn.disabled = true;
            try {
                const res = await fetch(FLOW_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ repName: msalAccount.name }) 
                });
                const payload = await res.json();
                rawData = payload.body?.results[0]?.tables[0]?.rows || (Array.isArray(payload) ? payload : []);
                filteredData = [...rawData];
                renderTable();
                renderTrendChart();
            } catch (err) { alert("Error: " + err.message); }
            finally { btn.disabled = false; }
        }

        function renderTable() {
            const head = document.getElementById('table-head'), body = document.getElementById('table-body');
            if (!filteredData.length) return;

            const keys = Object.keys(rawData[0]);
            
            // Render Header with Filters
            head.innerHTML = `<tr>${keys.map(k => {
                const label = headerMap[k] || k.replace(/.*\[(.*)\]/, '$1');
                return `<th>
                    ${label}
                    <input type="text" class="filter-input" placeholder="Filter..." oninput="updateFilter('${k}', this.value)">
                </th>`;
            }).join('')}</tr>`;

            // Render Rows
            body.innerHTML = filteredData.slice(0, 500).map((r, i) => `
                <tr class="hover:bg-blue-50 cursor-pointer" onclick="selectRow(${i})">
                    ${keys.map(k => `<td>${r[k] ?? ''}</td>`).join('')}
                </tr>`).join('');
        }

        function updateFilter(column, value) {
            columnFilters[column] = value.toLowerCase();
            filteredData = rawData.filter(row => {
                return Object.keys(columnFilters).every(key => {
                    return String(row[key] || '').toLowerCase().includes(columnFilters[key]);
                });
            });
            renderTable();
            renderTrendChart();
        }

        function renderTrendChart() {
            const monthlyAgg = {};
            filteredData.forEach(row => {
                const month = row['[Month_Advisory]'] || row['Month_Advisory'];
                const sales = parseFloat(row['[SumSales]'] || row['SumSales']) || 0;
                if (month) monthlyAgg[month] = (monthlyAgg[month] || 0) + sales;
            });

            const labels = Object.keys(monthlyAgg);
            const values = labels.map(l => monthlyAgg[l]);

            if (salesChart) salesChart.destroy();
            salesChart = new Chart(document.getElementById('salesChart'), {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Sales ($)', data: values, backgroundColor: '#1d4ed8' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function selectRow(idx) {
            const row = filteredData[idx];
            let html = `<div class="font-bold text-blue-900 border-b pb-2 mb-2">${row['DimCustomer_logicapplied[Name_CustTable]'] || 'Account Details'}</div>`;
            Object.keys(row).forEach(k => {
                const label = headerMap[k] || k;
                html += `<div class="mb-1"><span class="font-bold text-slate-500 text-[10px] uppercase">${label}:</span> ${row[k]}</div>`;
            });
            document.getElementById('selection-details').innerHTML = html;
        }

        function exportToExcel() {
            const worksheet = XLSX.utils.json_to_sheet(filteredData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "InsideSalesData");
            XLSX.writeFile(workbook, "InsideSales_Expansion.xlsx");
        }

        msalInstance.handleRedirectPromise().then(() => {
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) { msalAccount = accounts[0]; initApp(); }
        });
    </script>
</body>
</html>
