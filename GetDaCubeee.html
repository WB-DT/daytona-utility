<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Cube Expansion v16.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --pbi: #065489; }
        body { background: #f1f5f9; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 0.5rem; }
        .card { background: white; border: 1px solid #cbd5e1; border-radius: 0.5rem; display: flex; flex-direction: column; overflow: hidden; }
        .table-viewport { flex-grow: 1; overflow: auto; border: 1px solid #cbd5e1; height: 50vh; }
        thead th { position: sticky; top: 0; background: #f8fafc; z-index: 20; border-bottom: 2px solid #3b82f6; padding: 8px; font-size: 10px; text-transform: uppercase; color: #475569; }
        .filter-input { width: 100%; margin-top: 4px; padding: 2px 4px; font-size: 10px; border: 1px solid #cbd5e1; border-radius: 2px; outline: none; font-weight: normal; }
        tbody td { padding: 4px 10px; border-bottom: 1px solid #f1f5f9; font-size: 11px; white-space: nowrap; color: #334155; }
        .spinner { animation: spin 1s infinite linear; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="login-container" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[9999]">
        <div class="bg-white p-10 rounded-xl text-center shadow-2xl">
            <h2 class="text-2xl font-bold mb-6">Inside Sales Portal</h2>
            <button onclick="login()" class="bg-blue-600 text-white px-10 py-3 rounded font-bold hover:bg-blue-700">Sign in with Microsoft</button>
        </div>
    </div>

    <div id="app-container" class="hidden flex flex-col h-full gap-2">
        <header class="card p-3 flex justify-between items-center shrink-0 shadow-sm border-blue-200">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-black text-blue-900">EXPANSION ENGINE v16.2</h1>
                <span id="user-display" class="text-xs italic text-slate-500 border-l pl-3"></span>
            </div>
            <div class="flex gap-2">
                <div id="poll-timer" class="text-[10px] font-mono bg-slate-200 px-3 py-2 rounded">STATUS: IDLE</div>
                <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded text-[10px] font-bold">EXPORT XLSX</button>
                <button onclick="fetchCubeData()" id="refresh-btn" class="bg-blue-700 text-white px-4 py-2 rounded text-[10px] font-bold">POLL DATASET</button>
            </div>
        </header>

        <div class="table-viewport card relative">
            <div id="loading-overlay" class="hidden absolute inset-0 bg-white/95 z-[100] flex flex-col items-center justify-center">
                <i class="fas fa-sync spinner text-4xl text-blue-600 mb-4"></i>
                <div class="text-blue-900 font-black text-xs uppercase tracking-widest">Async Pipeline Active</div>
                <div id="overlay-timer" class="text-[10px] text-slate-400 font-mono mt-2">ELAPSED: 0s</div>
            </div>
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr><td colspan="100%" class="p-20 text-center text-slate-400 italic">Initialize poll to load sales data.</td></tr>
                </tbody>
            </table>
        </div>

        <div class="flex h-[32vh] gap-2 overflow-hidden shrink-0">
            <div class="flex-1 card bg-slate-900 text-emerald-400 p-3">
                <h3 class="text-[9px] uppercase font-black text-slate-500 mb-2 border-b border-slate-700">System Activity Log</h3>
                <div id="log-console" class="flex-grow overflow-auto text-[10px] font-mono"></div>
            </div>
            <div class="flex-1 card bg-blue-900 text-white p-3">
                <h3 class="text-[9px] uppercase font-black text-blue-300 mb-2 border-b border-blue-800">Dimensional Detail</h3>
                <div id="selection-details" class="text-[10px] italic text-blue-200">Select a record above.</div>
            </div>
            <div class="w-64 card p-3 flex flex-col gap-2 bg-slate-50">
                <h3 class="text-[9px] uppercase font-black text-slate-400 border-b pb-1">Summary</h3>
                <div class="bg-blue-600 p-3 rounded text-white">
                    <span class="text-[9px] uppercase font-bold opacity-75 block">Total Filtered Sales</span>
                    <span id="total-revenue" class="text-lg font-black">$0.00</span>
                </div>
                <div class="bg-white p-3 rounded border">
                    <span id="row-count" class="text-lg font-black text-slate-700">0</span>
                    <span class="text-[9px] uppercase font-bold text-slate-400 block">Records Loaded</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401" } };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const FLOW_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/02a9847e7f1947f592f9d307e15db730/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PtI2iBpGPwFCkZhYohHii-WLm1iwW0IN2JnsFqwStlk";
        
        let rawData = [], filteredData = [], msalAccount = null, columnFilters = {};

        function log(msg, type='INFO') {
            const c = document.getElementById('log-console');
            if(c) {
                c.innerHTML += `<div class="mb-1 ${type==='ERR'?'text-red-400':(type==='SUCCESS'?'text-blue-400':'')}">[${new Date().toLocaleTimeString()}] ${type}: ${msg}</div>`;
                c.scrollTop = c.scrollHeight;
            }
        }

        async function login() {
            const res = await msalInstance.loginPopup({ scopes: ["User.Read"] });
            msalAccount = res.account;
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = msalAccount.name;
            log("Authentication Successful", "SUCCESS");
        }

        async function fetchCubeData() {
            const overlay = document.getElementById('loading-overlay'), timer = document.getElementById('poll-timer'), start = Date.now();
            overlay.classList.remove('hidden');
            log("Initiating Power BI Pipeline...");

            const clock = setInterval(() => {
                const s = Math.floor((Date.now()-start)/1000);
                timer.innerText = `POLLING: ${s}s`;
                document.getElementById('overlay-timer').innerText = `ELAPSED: ${s}s`;
            }, 1000);

            try {
                let response = await fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: msalAccount.name }) });
                
                if (response.status === 202) {
                    const loc = response.headers.get('location');
                    log(`Async Accepted (202). Monitoring: ${loc}`);
                    let ready = false;
                    while (!ready) {
                        await new Promise(r => setTimeout(r, 4000));
                        let poll = await fetch(loc);
                        if (poll.status === 200) { response = poll; ready = true; }
                        else if (poll.status !== 202) throw new Error("Async Poll Failed");
                    }
                }

                const payload = await response.json();
                rawData = payload.body?.results[0]?.tables[0]?.rows || [];
                filteredData = [...rawData];
                log(`Data Received: ${rawData.length} rows`, "SUCCESS");
                renderUI();
            } catch (e) { log(e.message, "ERR"); }
            finally { clearInterval(clock); overlay.classList.add('hidden'); }
        }

        function renderUI() {
            const head = document.getElementById('table-head'), body = document.getElementById('table-body');
            if (!rawData.length) return;
            const keys = Object.keys(rawData[0]);
            
            head.innerHTML = `<tr>${keys.map(k => {
                const label = k.split('[').pop().replace(']','');
                return `<th>${label}<input type="text" class="filter-input" placeholder="..." oninput="applyFilter('${k}', this.value)"></th>`;
            }).join('')}</tr>`;

            renderBody();
            updateMetrics();
        }

        function renderBody() {
            const body = document.getElementById('table-body'), keys = Object.keys(rawData[0]);
            body.innerHTML = filteredData.slice(0, 1000).map((r, i) => `<tr onclick="selectRow(${i})" class="hover:bg-blue-50 cursor-pointer border-b border-slate-100">${keys.map(k => `<td>${r[k]||''}</td>`).join('')}</tr>`).join('');
        }

        function applyFilter(key, val) {
            columnFilters[key] = val.toLowerCase();
            filteredData = rawData.filter(r => Object.keys(columnFilters).every(k => String(r[k]||'').toLowerCase().includes(columnFilters[k])));
            renderBody();
            updateMetrics();
        }

        function updateMetrics() {
            const total = filteredData.reduce((s, r) => s + (parseFloat(r['[SumSales]']||r['SumSales'])||0), 0);
            document.getElementById('total-revenue').innerText = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(total);
            document.getElementById('row-count').innerText = filteredData.length.toLocaleString();
        }

        function selectRow(i) {
            const r = filteredData[i], d = document.getElementById('selection-details');
            d.innerHTML = `<div class="font-black text-xs mb-3 border-b border-blue-700 pb-2 uppercase">${r['DimCustomer_logicapplied[Name_CustTable]']||'Record'}</div>` + 
                Object.keys(r).map(k => `<div><span class="text-blue-400 uppercase text-[8px] font-black">${k.split('[').pop().replace(']','')}</span>: ${r[k]||'--'}</div>`).join('');
        }

        function exportToExcel() {
            log("Generating Workbook...");
            const ws = XLSX.utils.json_to_sheet(filteredData), wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "SalesExpansion");
            XLSX.writeFile(wb, "InsideSales_Expansion_v16.xlsx");
            log("Export Complete", "SUCCESS");
        }

        msalInstance.handleRedirectPromise().then(() => {
            const accts = msalInstance.getAllAccounts();
            if (accts.length > 0) { msalAccount = accts[0]; initApp(); }
        });
    </script>
</body>
</html>
