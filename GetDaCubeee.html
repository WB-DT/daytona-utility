<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daytona Sales Cube - Stable v11.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --bg-app: #f1f5f9; }
        body { background: var(--bg-app); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 1rem; }
        .card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 0.5rem; overflow: hidden; }
        .sticky-th { position: sticky; top: 0; background: #f8fafc; z-index: 20; border-bottom: 2px solid #e2e8f0; }
        .spinner { animation: spin 1s infinite linear; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="login-container" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[10000]">
        <div class="bg-white p-8 rounded-lg shadow-2xl text-center max-w-sm w-full">
            <i class="fas fa-database text-5xl text-blue-600 mb-4"></i>
            <h2 class="text-2xl font-bold mb-6">Inside Sales Analysis</h2>
            <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">Sign in with Microsoft</button>
            <p id="login-error" class="text-red-500 mt-4 text-xs hidden"></p>
        </div>
    </div>

    <div id="app-container" class="hidden flex flex-col h-full gap-4">
        <header class="card p-4 flex items-center justify-between gap-4 shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-blue-800 flex items-center gap-2"><i class="fas fa-cube"></i> Cube Explorer</h1>
                <span id="user-display" class="text-sm font-medium border-l pl-4 border-slate-300 italic text-slate-600"></span>
            </div>
            <div class="flex items-center gap-3">
                <input type="text" id="local-search" onkeyup="filterData()" placeholder="Search accounts..." class="border rounded px-3 py-1.5 text-sm w-64 outline-none focus:border-blue-500">
                <button onclick="exportToCSV()" id="export-btn" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 px-4 rounded disabled:opacity-50" disabled>Export</button>
                <button onclick="fetchCubeData()" id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded shadow-md disabled:opacity-50">Run Query</button>
            </div>
        </header>

        <div id="poll-indicator" class="hidden bg-blue-600 text-white p-2 rounded text-center text-xs font-bold animate-pulse">
            <i class="fas fa-spinner spinner mr-2"></i> Polling SSAS Model... (~1.2 min)
        </div>

        <div class="flex flex-grow gap-4 overflow-hidden">
            <div class="flex-[2] card flex flex-col">
                <div class="p-3 border-b flex justify-between bg-slate-50 font-bold text-[10px] uppercase text-slate-500">
                    <span>Account History (Top 1000)</span>
                    <span id="row-count">0 Records</span>
                </div>
                <div class="flex-grow overflow-auto">
                    <table class="w-full text-left text-xs whitespace-nowrap">
                        <thead id="table-head"></thead>
                        <tbody id="table-body" class="divide-y divide-slate-200">
                            <tr><td colspan="100%" class="p-20 text-center text-slate-400 italic">No data loaded.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="flex-1 flex flex-col gap-4 overflow-hidden">
                <div class="card p-4 h-1/2 flex flex-col">
                    <h3 class="text-xs font-bold uppercase text-slate-500 mb-2 border-b pb-1">Group Trend</h3>
                    <div class="flex-grow relative"><canvas id="salesChart"></canvas></div>
                </div>
                <div class="card p-4 h-1/2 overflow-auto">
                    <h3 class="text-xs font-bold uppercase text-slate-500 mb-2 border-b pb-1">Details</h3>
                    <div id="selection-details" class="text-xs italic text-slate-400">Select a row.</div>
                </div>
            </div>
        </div>

        <footer class="bg-slate-800 text-white p-2 px-4 rounded flex justify-between text-[10px] font-bold uppercase shrink-0">
            <div>Production v11.6 - Robust Data Handling</div>
            <div id="poll-timer" class="text-blue-300">Elapsed: 0s</div>
        </footer>
    </div>

    <script>
        const msalConfig = {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: window.location.origin + window.location.pathname
            },
            cache: { cacheLocation: "localStorage" }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const FLOW_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/02a9847e7f1947f592f9d307e15db730/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PtI2iBpGPwFCkZhYohHii-WLm1iwW0IN2JnsFqwStlk";
        let msalAccount = null, rawData = [], salesChart = null;

        async function login() {
            try {
                const response = await msalInstance.loginPopup({ scopes: ["User.Read"] });
                msalAccount = response.account;
                initApp();
            } catch (err) { document.getElementById('login-error').innerText = err.message; }
        }

        function initApp() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = msalAccount.name;
        }

        async function fetchCubeData() {
            const btn = document.getElementById('refresh-btn'), body = document.getElementById('table-body');
            const pollBox = document.getElementById('poll-indicator'), timer = document.getElementById('poll-timer');
            let start = Date.now();

            btn.disabled = true; pollBox.classList.remove('hidden');
            body.innerHTML = '<tr><td colspan="100%" class="p-20 text-center text-blue-600 font-bold italic">Triggering Query...</td></tr>';
            
            const clock = setInterval(() => { timer.innerText = `Elapsed: ${Math.floor((Date.now() - start)/1000)}s`; }, 1000);

            try {
                let res = await fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repName: msalAccount.name }) });
                
                if (res.status === 202) {
                    const loc = res.headers.get('location');
                    let finished = false;
                    while (!finished) {
                        await new Promise(r => setTimeout(r, 5000));
                        let pRes = await fetch(loc);

                        if (pRes.status === 200) {
                            const payload = await pRes.json();
                            // DEFENSIVE DATA EXTRACTION (Matches ActionOutputs 8 structure)
                            if (payload.body && payload.body.results && payload.body.results[0].tables) {
                                rawData = payload.body.results[0].tables[0].rows || [];
                            } else {
                                rawData = Array.isArray(payload) ? payload : [];
                            }
                            finished = true;
                        } else if (pRes.status === 502) {
                            console.warn("Gateway 502 detected, retrying poll...");
                        } else if (pRes.status !== 202) {
                            throw new Error(`Polling status: ${pRes.status}`);
                        }
                    }
                } else {
                    const payload = await res.json();
                    rawData = payload.body ? payload.body.results[0].tables[0].rows : payload;
                }
                
                renderTable(rawData);
                renderChart(rawData);
                document.getElementById('export-btn').disabled = false;
            } catch (err) { body.innerHTML = `<tr><td colspan="100%" class="p-20 text-center text-red-600 font-bold">${err.message}</td></tr>`; }
            finally { clearInterval(clock); btn.disabled = false; pollBox.classList.add('hidden'); }
        }

        function renderTable(data) {
            const head = document.getElementById('table-head'), body = document.getElementById('table-body');
            
            // CRITICAL FIX: Ensure data exists before calling Object.keys
            if (!Array.isArray(data) || data.length === 0 || !data[0]) {
                body.innerHTML = '<tr><td colspan="100%" class="p-20 text-center text-slate-400 italic">No valid records found in response.</td></tr>';
                return;
            }

            const keys = Object.keys(data[0]);
            head.innerHTML = `<tr class="bg-slate-100">${keys.map(k => `<th class="sticky-th px-4 py-2 font-bold text-slate-500 uppercase">${k}</th>`).join('')}</tr>`;
            body.innerHTML = data.slice(0, 1000).map((r, i) => `
                <tr class="hover:bg-blue-50 cursor-pointer" onclick="selectRow(${i})">
                    ${keys.map(k => `<td class="px-4 py-1.5 border-b border-slate-100">${r[k] ?? 0}</td>`).join('')}
                </tr>`).join('');
            document.getElementById('row-count').innerText = `${data.length} Records`;
        }

        function renderChart(data) {
            if (!Array.isArray(data) || data.length === 0) return;
            const salesKeys = Object.keys(data[0]).filter(k => k.includes('_Sales')).reverse();
            const totals = salesKeys.map(k => data.reduce((sum, row) => sum + (parseFloat(row[k]) || 0), 0));
            if (salesChart) salesChart.destroy();
            salesChart = new Chart(document.getElementById('salesChart'), {
                type: 'bar',
                data: { labels: salesKeys.map(k => k.replace('_Sales','')), datasets: [{ label: 'Sales ($)', data: totals, backgroundColor: '#2563eb' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function selectRow(idx) {
            if (!rawData[idx]) return;
            const row = rawData[idx];
            let html = `<div class="bg-blue-50 p-2 rounded border border-blue-200 mb-2 font-bold text-blue-800">${row['Name'] || 'Account'}</div><div class="grid grid-cols-2 gap-2">`;
            Object.keys(row).forEach(k => { html += `<div><label class="text-[9px] uppercase font-bold text-slate-400 block">${k}</label><span class="text-xs block">${row[k] || '--'}</span></div>`; });
            document.getElementById('selection-details').innerHTML = html + `</div>`;
        }

        function filterData() {
            if (!Array.isArray(rawData)) return;
            const query = document.getElementById('local-search').value.toLowerCase();
            const filtered = rawData.filter(r => Object.values(r).join(' ').toLowerCase().includes(query));
            renderTable(filtered);
        }

        function exportToCSV() {
            if (!rawData || rawData.length === 0) return;
            const keys = Object.keys(rawData[0]);
            const csv = [keys.join(','), ...rawData.map(row => keys.map(k => `"${String(row[k] ?? 0).replace(/"/g, '""')}"`).join(','))].join('\r\n');
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            link.setAttribute("download", `SalesCube_Export.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        msalInstance.handleRedirectPromise().then(() => {
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) { msalAccount = accounts[0]; initApp(); }
        });
    </script>
</body>
</html>
