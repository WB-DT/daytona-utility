<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Cube Expansion v16.1 - Professional Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --pbi-blue: #065489; --terminal-bg: #0d1117; }
        body { background: #f0f2f5; font-family: 'Inter', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 0.5rem; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid #d1d5db; backdrop-filter: blur(4px); }
        .table-viewport { height: 50vh; overflow: auto; border: 1px solid #cbd5e1; border-radius: 4px; }
        thead th { position: sticky; top: 0; background: #f8fafc; z-index: 30; border-bottom: 2px solid #3b82f6; padding: 8px; font-size: 10px; color: #475569; text-transform: uppercase; }
        .log-line { font-family: 'Fira Code', 'Courier New', monospace; border-left: 2px solid #22c55e; padding-left: 8px; margin-bottom: 2px; }
        .spinner { animation: spin 1s infinite linear; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="login-container" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[9999]">
        <div class="bg-white p-8 rounded-xl shadow-2xl text-center">
            <h2 class="text-2xl font-bold mb-4">Secure Cube Access</h2>
            <button onclick="login()" class="bg-blue-600 text-white px-10 py-3 rounded-lg font-bold hover:bg-blue-700 transition">Microsoft Sign In</button>
        </div>
    </div>

    <div id="app-container" class="hidden flex flex-col h-full gap-2">
        <header class="glass-card p-3 rounded-lg flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <i class="fas fa-server text-blue-800"></i>
                <h1 class="font-black text-slate-800 tracking-tighter">DATA EXPANSION ENGINE v16.1</h1>
                <span id="user-display" class="text-xs text-slate-500 italic border-l pl-3"></span>
            </div>
            <div class="flex gap-2">
                <div id="poll-timer" class="text-[10px] font-mono bg-slate-200 px-3 py-2 rounded flex items-center">STATUS: IDLE</div>
                <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded text-[10px] font-bold hover:bg-emerald-700">EXPORT XLSX</button>
                <button onclick="fetchCubeData()" id="refresh-btn" class="bg-blue-700 text-white px-4 py-2 rounded text-[10px] font-bold hover:bg-blue-800">POLL DATASET</button>
            </div>
        </header>

        <div class="table-viewport glass-card relative">
            <div id="loading-overlay" class="hidden absolute inset-0 bg-white/95 z-[100] flex flex-col items-center justify-center">
                <i class="fas fa-spinner spinner text-4xl text-blue-600 mb-4"></i>
                <div id="overlay-msg" class="text-blue-900 font-black text-xs uppercase tracking-widest">Async Pipeline Active</div>
                <div id="overlay-timer" class="text-[10px] text-slate-400 font-mono mt-2">WAITING: 0s</div>
            </div>
            <table class="w-full text-left">
                <thead id="table-head"></thead>
                <tbody id="table-body">
                    <tr><td colspan="100%" class="p-20 text-center text-slate-400 text-xs italic uppercase">Initialize poll to view semantic model data.</td></tr>
                </tbody>
            </table>
        </div>

        <div class="flex h-[35vh] gap-2 overflow-hidden shrink-0">
            <div class="flex-1 glass-card bg-slate-900 text-emerald-400 p-3 flex flex-col">
                <h3 class="text-[9px] uppercase font-black text-slate-500 mb-2 border-b border-slate-700">System Activity Log</h3>
                <div id="log-console" class="flex-grow overflow-auto text-[10px]"></div>
            </div>
            <div class="flex-1 glass-card bg-blue-900 text-white p-3 overflow-auto">
                <h3 class="text-[9px] uppercase font-black text-blue-300 mb-2 border-b border-blue-700">Selection Dimensional Detail</h3>
                <div id="selection-details" class="text-[10px] italic text-blue-200 opacity-60">Select record in table above.</div>
            </div>
            <div class="w-64 glass-card p-3 flex flex-col gap-2">
                <h3 class="text-[9px] uppercase font-black text-slate-400 border-b pb-1">Aggregation Summary</h3>
                <div class="bg-blue-50 p-3 rounded border border-blue-100">
                    <span class="text-[9px] uppercase font-bold text-blue-500 block">Total Filtered Revenue</span>
                    <span id="total-revenue" class="text-lg font-black text-blue-800">$0.00</span>
                </div>
                <div class="bg-slate-50 p-3 rounded border border-slate-200">
                    <span class="text-[9px] uppercase font-bold text-slate-500 block">Record Density</span>
                    <span id="total-records" class="text-lg font-black text-slate-800">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401" } };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const FLOW_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/02a9847e7f1947f592f9d307e15db730/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PtI2iBpGPwFCkZhYohHii-WLm1iwW0IN2JnsFqwStlk";
        
        let rawData = [], filteredData = [], msalAccount = null;

        function log(msg, type = 'INFO') {
            const console = document.getElementById('log-console');
            if (!console) return;
            const entry = document.createElement('div');
            entry.className = `log-line ${type === 'ERR' ? 'text-red-400 border-red-500' : (type === 'SUCCESS' ? 'text-blue-400 border-blue-500' : '')}`;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${type}: ${msg}`;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }

        async function login() {
            try {
                const res = await msalInstance.loginPopup({ scopes: ["User.Read"] });
                msalAccount = res.account;
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('user-display').innerText = msalAccount.name;
                log(`Session Initialized for ${msalAccount.name}`, 'SUCCESS');
            } catch (e) { log(`Auth Failed: ${e.message}`, 'ERR'); }
        }

        async function fetchCubeData() {
            const overlay = document.getElementById('loading-overlay');
            const timerLabel = document.getElementById('poll-timer');
            const start = Date.now();
            overlay.classList.remove('hidden');
            log("Opening Stream to Power Automate...");

            const clock = setInterval(() => {
                const elapsed = Math.floor((Date.now() - start) / 1000);
                timerLabel.innerText = `POLLING: ${elapsed}s`;
                document.getElementById('overlay-timer').innerText = `WAITING: ${elapsed}s`;
            }, 1000);

            try {
                let response = await fetch(FLOW_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ user: msalAccount.name }), 
                    headers: { 'Content-Type': 'application/json' } 
                });

                // HANDLE HTTP 202 ASYNC PATTERN
                if (response.status === 202) {
                    const statusLocation = response.headers.get('location');
                    log(`HTTP 202: Processing asynchronously. Monitoring ${statusLocation}...`, 'INFO');
                    let ready = false;
                    while (!ready) {
                        await new Promise(r => setTimeout(r, 4000));
                        let poll = await fetch(statusLocation);
                        if (poll.status === 200) {
                            response = poll;
                            ready = true;
                        } else if (poll.status !== 202) throw new Error(`Async Pipeline Error: ${poll.status}`);
                        else log("Pipeline still active. Retrying in 4s...");
                    }
                }

                const payload = await response.json();
                rawData = payload.body?.results[0]?.tables[0]?.rows || [];
                filteredData = [...rawData];
                log(`Expansion Complete: ${rawData.length} records retrieved.`, 'SUCCESS');
                renderUI();
            } catch (err) {
                log(`Pipeline Failed: ${err.message}`, 'ERR');
            } finally {
                overlay.classList.add('hidden');
                clearInterval(clock);
            }
        }

        function renderUI() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            if (!head || !body || !rawData.length) return;

            // 1. Render Headers
            const keys = Object.keys(rawData[0]);
            head.innerHTML = `<tr>${keys.map(k => {
                const label = k.split('[').pop().replace(']','');
                return `<th class="px-4 py-2 border-b border-slate-200 text-slate-600 font-bold uppercase tracking-tighter">
                    ${label}
                    <input type="text" placeholder="..." class="w-full mt-1 p-1 text-[9px] border rounded font-normal" oninput="applyFilter('${k}', this.value)">
                </th>`;
            }).join('')}</tr>`;

            // 2. Render Body
            renderBody();
            updateMetrics();
        }

        function renderBody() {
            const body = document.getElementById('table-body');
            const keys = Object.keys(rawData[0]);
            body.innerHTML = filteredData.slice(0, 1000).map((r, i) => `
                <tr onclick="selectRow(${i})" class="hover:bg-blue-50 cursor-pointer border-b border-slate-100 transition-colors">
                    ${keys.map(k => `<td class="px-4 py-1.5 whitespace-nowrap text-slate-700">${r[k] || ''}</td>`).join('')}
                </tr>`).join('');
        }

        function applyFilter(key, val) {
            const search = val.toLowerCase();
            filteredData = rawData.filter(r => String(r[key] || '').toLowerCase().includes(search));
            renderBody();
            updateMetrics();
        }

        function updateMetrics() {
            const total = filteredData.reduce((sum, r) => sum + (parseFloat(r['[SumSales]'] || r['SumSales']) || 0), 0);
            document.getElementById('total-revenue').innerText = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(total);
            document.getElementById('total-records').innerText = filteredData.length.toLocaleString();
        }

        function selectRow(i) {
            const r = filteredData[i];
            const detail = document.getElementById('selection-details');
            if(!detail) return;
            detail.innerHTML = `<div class="font-black text-xs mb-3 border-b border-blue-700 pb-2 text-blue-100 uppercase tracking-widest">${r['DimCustomer_logicapplied[Name_CustTable]'] || 'Account Record'}</div>` + 
                Object.keys(r).map(k => `
                    <div class="mb-2">
                        <span class="text-blue-400 uppercase text-[8px] font-black block leading-none mb-1">${k.split('[').pop().replace(']','')}</span>
                        <span class="text-white text-[11px] leading-tight">${r[k] || '--'}</span>
                    </div>`).join('');
        }

        function exportToExcel() {
            log("Building Workbook... This may take a moment for large datasets.", "INFO");
            const ws = XLSX.utils.json_to_sheet(filteredData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Cube_Expansion");
            XLSX.writeFile(wb, "InsideSales_Expansion_FullSet.xlsx");
            log("Export Successful.", "SUCCESS");
        }

        msalInstance.handleRedirectPromise().then(() => {
            const accts = msalInstance.getAllAccounts();
            if (accts.length > 0) { msalAccount = accts[0]; initApp(); }
        }).catch(err => log(`MSAL Error: ${err.message}`, 'ERR'));
    </script>
</body>
</html>
