<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daytona Sales Cube - v11.6 Full Feature</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <style>
        :root { --primary: #2563eb; --bg-app: #f1f5f9; }
        body { background: var(--bg-app); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .data-table-container { flex-grow: 1; overflow: auto; background: #fff; border: 1px solid #cbd5e1; }
        .sticky-th { position: sticky; top: 0; background: #f8fafc; z-index: 20; border-bottom: 2px solid #e2e8f0; }
        .spinner { animation: spin 1s infinite linear; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4">

    <div id="login-container" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[10000]">
        <div class="bg-white p-8 rounded-lg shadow-2xl text-center max-w-sm w-full">
            <i class="fas fa-database text-5xl text-blue-600 mb-4"></i>
            <h2 class="text-2xl font-bold mb-6 text-slate-800">Sales Cube Analytics</h2>
            <button onclick="login()" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">Sign in with Microsoft</button>
        </div>
    </div>

    <div id="app-container" class="hidden flex flex-col h-full gap-4">
        <header class="bg-white p-4 rounded-lg shadow-sm border border-slate-300 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-blue-800 flex items-center gap-2"><i class="fas fa-chart-bar"></i> Sales Cube</h1>
                <input type="text" id="local-search" onkeyup="filterData()" placeholder="Search current results..." class="border rounded px-3 py-1 text-sm w-64 focus:border-blue-500 outline-none">
            </div>
            <div class="flex items-center gap-3">
                <span id="user-display" class="text-sm font-medium border-r pr-4 border-slate-300 italic"></span>
                <button onclick="exportToCSV()" id="export-btn" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 px-4 rounded disabled:opacity-50" disabled><i class="fas fa-file-csv mr-2"></i>Export</button>
                <button onclick="fetchCubeData()" id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded disabled:opacity-50"><i class="fas fa-sync-alt mr-2"></i>Run Query</button>
            </div>
        </header>

        <div id="poll-indicator" class="hidden bg-blue-600 text-white p-2 rounded text-center text-xs font-bold animate-pulse">
            <i class="fas fa-spinner spinner mr-2"></i> <span id="poll-text">Processing 15-month analysis... (est. 75s)</span>
        </div>

        <div class="data-table-container rounded-lg shadow-lg relative">
            <table class="w-full text-left text-xs whitespace-nowrap border-collapse">
                <thead id="table-head"></thead>
                <tbody id="table-body" class="divide-y divide-slate-200">
                    <tr><td colspan="100%" class="p-20 text-center text-slate-400 italic font-medium">Ready for input. Click "Run Query" to poll the SSAS Cube.</td></tr>
                </tbody>
            </table>
        </div>

        <footer class="bg-slate-800 text-white p-2 px-4 rounded-lg flex justify-between items-center text-[10px] font-bold uppercase tracking-wider">
            <div id="row-count">Records: 0</div>
            <div id="poll-timer" class="text-blue-300">Elapsed: 0s</div>
        </footer>
    </div>

    <script>
        const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: window.location.origin } };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const FLOW_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/02a9847e7f1947f592f9d307e15db730/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PtI2iBpGPwFCkZhYohHii-WLm1iwW0IN2JnsFqwStlk";
        
        let msalAccount = null, rawData = [];

        async function login() { 
            const resp = await msalInstance.loginPopup({ scopes: ["User.Read"] });
            msalAccount = resp.account;
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = msalAccount.name;
        }

        async function fetchCubeData() {
            const btn = document.getElementById('refresh-btn'), body = document.getElementById('table-body');
            const pollBox = document.getElementById('poll-indicator'), timer = document.getElementById('poll-timer');
            let start = Date.now();

            btn.disabled = true; pollBox.classList.remove('hidden');
            body.innerHTML = '<tr><td colspan="100%" class="p-20 text-center text-blue-600 font-bold italic">Polling for results...</td></tr>';
            
            const clock = setInterval(() => { timer.innerText = `Elapsed: ${Math.floor((Date.now() - start)/1000)}s`; }, 1000);

            try {
                let res = await fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repName: msalAccount.name }) });
                
                if (res.status === 202) {
                    const loc = res.headers.get('location');
                    let finished = false;
                    while (!finished) {
                        await new Promise(r => setTimeout(r, 5000));
                        let pRes = await fetch(loc);
                        if (pRes.status === 200) { rawData = await pRes.json(); finished = true; }
                    }
                } else { rawData = await res.json(); }
                
                renderTable(rawData);
                document.getElementById('export-btn').disabled = false;
            } catch (err) { body.innerHTML = `<tr><td class="p-20 text-center text-red-600 font-bold">${err.message}</td></tr>`; }
            finally { clearInterval(clock); btn.disabled = false; pollBox.classList.add('hidden'); }
        }

        function renderTable(data) {
            if (!data || data.length === 0) return;
            const head = document.getElementById('table-head'), body = document.getElementById('table-body');
            const keys = Object.keys(data[0]);
            
            head.innerHTML = `<tr class="bg-slate-100">${keys.map(k => `<th class="sticky-th px-4 py-2 font-bold text-slate-600 border-b border-slate-300 uppercase">${k}</th>`).join('')}</tr>`;
            
            // Rendering first 1000 rows for DOM performance
            const rows = data.slice(0, 1000).map(r => `<tr class="hover:bg-blue-50">${keys.map(k => `<td class="px-4 py-1.5 border-b border-slate-100">${r[k] ?? 0}</td>`).join('')}</tr>`).join('');
            body.innerHTML = rows + (data.length > 1000 ? `<tr><td colspan="100%" class="p-4 text-center font-bold bg-yellow-50">Filtered to first 1000 rows. Use Export for full dataset.</td></tr>` : "");
            document.getElementById('row-count').innerText = `Records: ${data.length}`;
        }

        function filterData() {
            const query = document.getElementById('local-search').value.toLowerCase();
            const filtered = rawData.filter(r => Object.values(r).join(' ').toLowerCase().includes(query));
            renderTable(filtered);
        }

        function exportToCSV() {
            if (!rawData.length) return;
            const keys = Object.keys(rawData[0]);
            const csvRows = [keys.join(','), ...rawData.map(row => keys.map(k => `"${String(row[k] ?? 0).replace(/"/g, '""')}"`).join(','))];
            const blob = new Blob([csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `SalesCube_Export_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        msalInstance.handleRedirectPromise().then(() => { if (msalInstance.getAllAccounts().length > 0) login(); });
    </script>
</body>
</html>
