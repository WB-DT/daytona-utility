<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Hub | Intelligent Migration v20</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] }, colors: { primary: '#002f6c' } } } }
    </script>

    <style>
        body { background-color: #f8fafc; color: #334155; }
        .glass { background: white; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); }
        th { text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; color: #64748b; background: #f1f5f9; padding: 12px; font-weight: 700; }
        td { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        .console { background: #0f172a; color: #22c55e; font-family: 'Courier New', monospace; font-size: 0.75rem; padding: 1rem; border-radius: 0.5rem; height: 200px; overflow-y: auto; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 z-20 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-primary text-white rounded flex items-center justify-center font-bold">P</div>
            <h1 class="font-bold text-slate-800">Performance<span class="text-primary">Hub</span> <span class="text-xs text-gray-400 font-normal">Native Parse v20</span></h1>
        </div>
        <div class="text-xs font-bold text-slate-500" id="status-bar">Ready</div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <main class="flex-1 overflow-y-auto p-6 space-y-6">

            <div class="glass rounded-xl p-6">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">Migration Workspace</h2>
                        <p class="text-sm text-slate-500">Extracts unstructured Word/PDF reviews into structured CSV/XLSX.</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="window.exportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold py-2 px-4 rounded shadow flex items-center gap-2">
                            <i class="fa-solid fa-download"></i> Download Excel
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div onclick="document.getElementById('file-input').click()" class="border-2 border-dashed border-slate-300 hover:border-primary hover:bg-blue-50 rounded-lg h-32 flex flex-col items-center justify-center cursor-pointer transition-colors group">
                        <i class="fa-solid fa-file-circle-plus text-2xl text-slate-400 group-hover:text-primary mb-2"></i>
                        <span class="font-bold text-sm text-slate-600">Upload Reviews</span>
                        <span class="text-xs text-slate-400">.docx, .pdf</span>
                        <input type="file" id="file-input" multiple class="hidden" onchange="handleUpload(this)">
                    </div>
                    <div class="md:col-span-2 console" id="console">
                        <div class="text-slate-500">> System initialized...</div>
                    </div>
                </div>
                
                <button id="btn-run" onclick="runParser()" disabled class="w-full bg-primary hover:bg-blue-800 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 rounded shadow transition-all">
                    <i class="fa-solid fa-bolt"></i> Run Extraction
                </button>
            </div>

            <div class="glass rounded-xl overflow-hidden flex flex-col h-[500px]">
                <div class="flex border-b border-gray-200">
                    <button onclick="switchView('reviews')" id="tab-reviews" class="px-6 py-3 text-sm font-bold border-b-2 border-primary text-primary bg-blue-50/50">Reviews (<span id="cnt-reviews">0</span>)</button>
                    <button onclick="switchView('kpis')" id="tab-kpis" class="px-6 py-3 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800">KPI Data (<span id="cnt-kpis">0</span>)</button>
                </div>
                
                <div id="view-reviews" class="flex-1 overflow-auto">
                    <table class="w-full">
                        <thead class="sticky top-0 z-10"><tr><th>File</th><th>Employee</th><th>Date</th><th>Type</th><th>Opps (This)</th><th>Opps (Last)</th><th>Action Plan</th></tr></thead>
                        <tbody id="tb-reviews" class="bg-white"></tbody>
                    </table>
                </div>

                <div id="view-kpis" class="flex-1 overflow-auto hidden">
                    <table class="w-full">
                        <thead class="sticky top-0 z-10"><tr><th>Employee</th><th>Date</th><th>Metric Name</th><th>Value</th><th>Target</th><th>Trend</th></tr></thead>
                        <tbody id="tb-kpis" class="bg-white"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script>
        // --- CONFIGURATION ---
        const METRIC_MAP = [
            // Project Specifics
            { key: 'Logistics Acc', pattern: /Logistics.*Assigned/i, type: 'percent' },
            { key: 'Logistics Comp', pattern: /Logistics.*Completed/i, type: 'percent' },
            { key: 'Specialty Acc', pattern: /Specialty.*Assigned/i, type: 'percent' },
            { key: 'Specialty Comp', pattern: /Specialty.*Completed/i, type: 'percent' },
            
            // Core Metrics
            { key: 'Calls', pattern: /(Total|Outbound|Combo).*Calls|Contact-In/i, type: 'number' },
            { key: 'Talk Time', pattern: /Talk Time/i, type: 'time' },
            { key: 'Sales', pattern: /Sales Average|Total Sales/i, type: 'sales_eq' }, // Special logic for Eq
            { key: 'Invoices', pattern: /Invoices|Quotes/i, type: 'number' },
            
            // Quality / Admin
            { key: 'Call Notes %', pattern: /% Call Notes|% Call Linking|Nonbuy Call Notes/i, type: 'percent' },
            { key: 'Call Notes', pattern: /\bCall Notes\b/i, type: 'rating' }, // ME/BE/LOA
            { key: 'AUX Acc', pattern: /AUX Accuracy/i, type: 'rating' },
            
            // Time / Attendance
            { key: 'Availability', pattern: /Availability Per Shift/i, type: 'time' },
            { key: 'Working Days', pattern: /Total Working Days|Days Worked/i, type: 'complex' }, // 9:00:09/19/20
            
            // Breaks
            { key: 'Break', pattern: /Average Break/i, type: 'time' },
            { key: 'Lunch', pattern: /Average Lunch/i, type: 'time' },
            { key: 'Personal', pattern: /Average Personal/i, type: 'time' },
            { key: 'Tardies', pattern: /Tardies/i, type: 'number' }
        ];

        let STATE = { files: [], reviews: [], kpis: [] };

        // --- UPLOAD HANDLER ---
        function handleUpload(input) {
            const files = Array.from(input.files).filter(f => f.name.match(/\.(docx|pdf)$/i));
            if(!files.length) return log("! No valid files selected.", "text-red-400");
            STATE.files = files;
            log(`> Queued ${files.length} files.`);
            document.getElementById('btn-run').disabled = false;
        }

        // --- MAIN ENGINE ---
        async function runParser() {
            STATE.reviews = []; STATE.kpis = [];
            const btn = document.getElementById('btn-run');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            
            log("=== STARTING BATCH ===", "text-white font-bold border-t border-gray-700 pt-2");

            for(const file of STATE.files) {
                try {
                    log(`> Reading: ${file.name}...`);
                    const text = await extractText(file);
                    if(text) processText(text, file.name);
                } catch(e) {
                    log(`! Error ${file.name}: ${e.message}`, "text-red-500");
                }
            }

            render();
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Complete';
            setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Run Extraction', 2000);
            log(`=== COMPLETED: ${STATE.reviews.length} Reviews Extracted ===`, "text-emerald-400 font-bold");
        }

        // --- TEXT EXTRACTION UTILS ---
        async function extractText(file) {
            if(file.name.endsWith('.docx')) {
                const res = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
                return res.value;
            } else {
                const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                let txt = "";
                for(let i=1; i<=pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    txt += content.items.map(s => s.str).join("\n") + "\n";
                }
                return txt;
            }
        }

        // --- INTELLIGENCE LOGIC ---
        function processText(raw, fileName) {
            // 1. Clean & Normalize
            // Remove arrows immediately to simplify values, keep structure
            const lines = raw.replace(/[↑↓→]/g, ' ').split(/\r?\n/).map(l => l.trim()).filter(l => l);
            const fullText = lines.join('\n');

            // 2. Metadata Extraction
            let name = (fullText.match(/(?:Agent Name|Agent)[:\s]+([A-Za-z ]+)/i) || [])[1] || fileName.split(/[_\-]/)[1] || "Unknown";
            let date = (fullText.match(/Date[:\s]+(\d{1,2}\/\d{1,2}\/\d{2,4})/i) || [])[1] || new Date().toLocaleDateString();
            
            // 3. Section Slicing (Text Blocks)
            const getSection = (start, ends) => {
                const startIdx = fullText.toUpperCase().indexOf(start.toUpperCase());
                if(startIdx === -1) return "--";
                let bestEnd = fullText.length;
                ends.forEach(e => {
                    const idx = fullText.toUpperCase().indexOf(e.toUpperCase(), startIdx + 10);
                    if(idx > -1 && idx < bestEnd) bestEnd = idx;
                });
                return fullText.substring(startIdx + start.length, bestEnd).trim().replace(/^[:\-\s]+/, '');
            };

            const oppsThis = getSection("Opportunities This Month", ["Opportunities for This Year", "Best Practices", "Action Plan"]);
            const oppsLast = getSection("Opportunities Last Month", ["Opportunities This Month", "Best Practices"]);
            const plan = getSection("Action Plan", ["Agent’s Voice", "Statement of Understanding"]);

            STATE.reviews.push({
                fileName, name, date, type: 'EOM',
                oppsThis: truncate(oppsThis), oppsLast: truncate(oppsLast), plan: truncate(plan)
            });

            // 4. KPI SCANNER (The "Zip" Logic)
            // We scan the text for headers, then scan *forward* for the next matching value type.
            // This handles cases where Headers are in Col 1 and Values in Col 2 (visually), but text stream has all Headers then all Values.

            // Identify "Last Month" Data Block
            const startData = fullText.toUpperCase().indexOf("LAST MONTH");
            const endData = fullText.toUpperCase().indexOf("THIS MONTH"); // Stop before current month targets
            const dataBlock = (startData > -1) 
                ? fullText.substring(startData, endData > -1 ? endData : fullText.length)
                : fullText;
            
            const dataLines = dataBlock.split('\n');
            let foundHeaders = [];
            
            // A. Map headers to line indices
            dataLines.forEach((line, idx) => {
                const match = METRIC_MAP.find(m => m.pattern.test(line));
                if(match) foundHeaders.push({ ...match, idx });
            });

            // B. Find values for each header
            let usedLines = new Set();
            foundHeaders.forEach(header => {
                for(let i = header.idx + 1; i < dataLines.length; i++) {
                    if(usedLines.has(i)) continue;
                    const line = dataLines[i];
                    
                    // Don't consume another header as a value
                    if(METRIC_MAP.some(m => m.pattern.test(line))) continue;

                    if(isValidValue(line, header.type)) {
                        // Found it!
                        const cleanVal = parseValue(line, header.type);
                        const trend = getTrend(raw, line); // Check raw text for arrows near this value

                        STATE.kpis.push({
                            name, date, metric: header.key,
                            value: cleanVal, target: 'N/A', trend
                        });
                        usedLines.add(i);
                        break; // Stop looking for this header
                    }
                }
            });

            log(`  + Parsed ${foundHeaders.length} metrics for ${name}.`, "text-slate-400");
        }

        // --- VALIDATORS & PARSERS ---
        function isValidValue(str, type) {
            if(str.includes("LOA")) return true; // Always accept LOA
            if(str.match(/Daily Average|FS Sales/i)) return false; // Noise

            const clean = str.replace(/[$,]/g, '');
            if(type === 'number') return /^\d+(\.\d+)?$/.test(clean);
            if(type === 'percent') return /^\d+(\.\d+)?%$/.test(clean);
            if(type === 'time') return /^\d+:\d+(:\d+)?$/.test(clean) || /\d+\s*(min|hr)/.test(clean);
            if(type === 'sales_eq') return /\$\d+/.test(str); // Matches $500...
            if(type === 'rating') return /^(ME|BE|EE|ND|LOA)$/i.test(clean) || /^\d+%$/.test(clean);
            if(type === 'complex') return /\d+\/\d+/.test(clean); // Matches 19/20 or 9:00/19/20
            return false;
        }

        function parseValue(str, type) {
            if(str.includes("LOA")) return "LOA";
            if(type === 'sales_eq' && str.includes('=')) {
                // Handle "$600,000 / 20 = $30,000" -> grab last part
                return str.split('=').pop().trim();
            }
            return str.replace(/[↑↓→]/g, '').trim();
        }

        function getTrend(fullText, valStr) {
            // Very naive check: does the original line containing this value have an arrow?
            // This is hard because we cleaned lines. But we can guess.
            // If value is "100%", check if "100% ↑" existed.
            if(fullText.includes(valStr + " ↑") || fullText.includes("↑ " + valStr)) return "Up";
            if(fullText.includes(valStr + " ↓") || fullText.includes("↓ " + valStr)) return "Down";
            return "Flat";
        }

        // --- UI HELPERS ---
        function log(msg, cls) {
            const el = document.getElementById('console');
            el.innerHTML += `<div class="${cls || 'text-green-500'} border-b border-gray-800/50 py-1">${msg}</div>`;
            el.scrollTop = el.scrollHeight;
        }
        function truncate(s) { return s.length > 50 ? s.substring(0,47)+"..." : s; }
        function switchView(id) {
            ['reviews','kpis'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
                document.getElementById(`tab-${v}`).classList.remove('border-primary', 'text-primary', 'bg-blue-50/50');
                document.getElementById(`tab-${v}`).classList.add('border-transparent', 'text-slate-500');
            });
            document.getElementById(`view-${id}`).classList.remove('hidden');
            document.getElementById(`tab-${id}`).classList.add('border-primary', 'text-primary', 'bg-blue-50/50');
            document.getElementById(`tab-${id}`).classList.remove('border-transparent', 'text-slate-500');
        }
        function render() {
            document.getElementById('cnt-reviews').innerText = STATE.reviews.length;
            document.getElementById('cnt-kpis').innerText = STATE.kpis.length;
            
            document.getElementById('tb-reviews').innerHTML = STATE.reviews.map(r => `
                <tr class="hover:bg-blue-50/30">
                    <td class="font-mono text-xs text-slate-400">${r.fileName.substring(0,15)}...</td>
                    <td class="font-bold text-slate-700">${r.name}</td>
                    <td>${r.date}</td>
                    <td><span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-1 rounded">${r.type}</span></td>
                    <td class="text-xs" title="${r.oppsThis}">${r.oppsThis}</td>
                    <td class="text-xs" title="${r.oppsLast}">${r.oppsLast}</td>
                    <td class="text-xs" title="${r.plan}">${r.plan}</td>
                </tr>
            `).join('');

            document.getElementById('tb-kpis').innerHTML = STATE.kpis.map(k => `
                <tr class="hover:bg-emerald-50/30">
                    <td class="font-bold text-slate-700">${k.name}</td>
                    <td class="text-xs text-slate-500">${k.date}</td>
                    <td class="text-sm font-medium">${k.metric}</td>
                    <td class="font-mono text-primary font-bold">${k.value}</td>
                    <td class="text-xs text-slate-400 font-mono">${k.target}</td>
                    <td>${k.trend === 'Up' ? '<i class="fa-solid fa-arrow-trend-up text-emerald-500"></i>' : k.trend === 'Down' ? '<i class="fa-solid fa-arrow-trend-down text-red-500"></i>' : '<span class="text-slate-300">-</span>'}</td>
                </tr>
            `).join('');
        }

        window.exportData = function() {
            if(!STATE.reviews.length) return alert("No data to export");
            const wb = XLSX.utils.book_new();
            
            const cleanRev = STATE.reviews.map(r => ({
                "Employee Name": r.name, "Review Date": r.date, "Type": r.type,
                "Opportunities (This)": r.oppsThis, "Opportunities (Last)": r.oppsLast,
                "Action Plan": r.plan, "Source File": r.fileName
            }));
            
            const cleanKpi = STATE.kpis.map(k => ({
                "Employee Name": k.name, "Log Date": k.date,
                "KPI Name": k.metric, "KPI Value": k.value, "Trend": k.trend
            }));

            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cleanRev), "Reviews");
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cleanKpi), "KPI Logs");
            XLSX.writeFile(wb, "Performance_Migration_v20.xlsx");
        };
    </script>
</body>
</html>
