<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRT - v1.1.6</title>
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --container-bg: #1a1d2b;
            --text-color: #e0e0e0;
            --border-color: #2d324a;
            --accent-purple: #8132a8;
            --accent-green: #107c10;
            --row-hover: #252a3d;
        }
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: var(--bg-color); color: var(--text-color); margin: 0; }
        .container { max-width: 1600px; margin: 20px auto; background: var(--container-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); }
        #loading-overlay { position: fixed; inset: 0; background: rgba(15, 17, 26, 0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; display: none; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-top: 4px solid var(--accent-purple); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #login-container { position:fixed; inset:0; background:var(--bg-color); display:none; align-items:center; justify-content:center; z-index:9999; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .reassign-bar { background: #252a3d; padding: 20px; border-radius: 8px; display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .form-group { flex: 1; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #9da5b4; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: #0f111a; color: white; box-sizing: border-box; outline: none; }
        .table-container { height: 500px; overflow-y: auto; border: 1px solid var(--border-color); background: #141724; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background: var(--accent-purple); color: white; padding: 12px; font-size: 11px; text-align: left; z-index: 10; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 13px; }
        tr:hover { background-color: var(--row-hover); }
        tr.selected-source { background-color: #2d1a3d !important; border-left: 4px solid var(--accent-purple); }
        tr.selected-target { background-color: #1a4a1a !important; border-left: 4px solid var(--accent-green); }
        .btn-main { background: var(--accent-purple); color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; height: 38px; }
        .btn-main:disabled { background: #333 !important; cursor: not-allowed; }
    </style>
</head>
<body onload="initAuth()">

<div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading...</div>
</div>

<div id="login-container">
    <button onclick="manualLogin()" class="btn-main">Sign In</button>
</div>

<div class="container" id="main-app" style="display:none;">
    <div class="header-flex">
        <h2>Logistics Reassignment <span style="font-size: 12px; color: #666;">v1.1.6</span></h2>
        <div>
             <span id="admin-notice" style="font-size: 10px; color: var(--accent-green); margin-right: 15px; display: none;">Admin Mode Active</span>
             <button onclick="fetchData()" class="btn-main" style="background:transparent; border:1px solid #444;">↻ Refresh</button>
        </div>
    </div>

    <div class="reassign-bar">
        <div class="form-group" style="flex: 0.8;">
            <label>Filter Disposition</label>
            <select id="dispoFilter" onchange="applyFilters()"></select>
        </div>
        <div class="form-group">
            <label>Source Owner (From)</label>
            <input type="text" id="sourceDisplay" readonly placeholder="Select from left">
            <input type="hidden" id="sourceOwner">
        </div>
        <div class="form-group">
            <label>Target Owner (To)</label>
            <input type="text" id="targetDisplay" readonly placeholder="Select from right">
            <input type="hidden" id="targetOwner">
        </div>
        <div class="form-group" style="flex: 0.4;">
            <label>Qty to Move</label>
            <input type="number" id="moveCount" placeholder="0" min="1" oninput="validate()">
        </div>
        <button id="submitBtn" class="btn-main" disabled onclick="handleExecution()">Reassign Records</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
        <div class="table-container">
            <table>
                <thead><tr><th>Current Logistics Owner</th><th>Count</th></tr></thead>
                <tbody id="sourceBody"></tbody>
            </table>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>Available Target Owners</th></tr></thead>
                <tbody id="targetBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    
    const FETCH_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/3f1e99d590f44c8f82ca4bcfcab4f460/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=aKeayuGPu8TiMx-3oCGHDKzHQmIY3hKu12NZZNPh6GQ";
    const EXECUTE_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/62fcb228a4b44051872332a368d3a6b9/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=2O1w3A6vQaM6vAKATVRfd5CYe_nRECOI42TR0-H84yM";

    const admins = ["Wayne Rendt", "Holly Evans", "Kari Westervelt"];
    let allData = []; let uniqueReps = []; let metrics = {}; let currentUser = ""; let currentUserName = "";

    function showLoading(text) { document.getElementById('loading-overlay').style.display = 'flex'; document.getElementById('loading-text').innerText = text; }
    function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

    async function initAuth() {
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) { 
            currentUser = accounts[0].username;
            currentUserName = accounts[0].name || accounts[0].username;
            if(admins.includes(currentUserName)) document.getElementById('admin-notice').style.display = 'inline';
            showApp(); 
        } 
        else { document.getElementById('login-container').style.display = 'flex'; }
    }

    async function manualLogin() { await msalInstance.loginPopup(); initAuth(); }
    function showApp() { document.getElementById('login-container').style.display = 'none'; document.getElementById('main-app').style.display = 'block'; fetchData(); }

    async function fetchData() {
        showLoading("Fetching Logistics Data...");
        try {
            const res = await fetch(FETCH_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({}) });
            const data = await res.json();
            allData = data.accountList || [];
            uniqueReps = [...new Set(allData.map(d => d.cr714_logisticsowner || "Unassigned"))].sort();
            const filter = document.getElementById('dispoFilter');
            const dispos = [...new Set(allData.map(d => d.cr714_disposition || "Blank"))].sort();
            
            const currentSelection = filter.value;
            filter.innerHTML = '<option value="ALL">-- All Dispositions --</option>';
            dispos.forEach(d => filter.add(new Option(d, d)));
            if(currentSelection) filter.value = currentSelection;

            applyFilters();
            hideLoading();
        } catch (e) { console.error(e); hideLoading(); }
    }

    function applyFilters() {
        const selDispo = document.getElementById('dispoFilter').value;
        metrics = {};
        allData.forEach(row => {
            const d = row.cr714_disposition || "Blank";
            if (selDispo === "ALL" || d === selDispo) {
                const name = row.cr714_logisticsowner || "Unassigned";
                metrics[name] = (metrics[name] || 0) + 1;
            }
        });
        render();
    }

    function render() {
        const sBody = document.getElementById('sourceBody');
        const tBody = document.getElementById('targetBody');
        sBody.innerHTML = ''; tBody.innerHTML = '';
        Object.keys(metrics).sort().forEach(name => {
            const tr = document.createElement('tr');
            if(document.getElementById('sourceOwner').value === name) tr.className = 'selected-source';
            tr.innerHTML = `<td>${name}</td><td>${metrics[name]}</td>`;
            tr.onclick = () => { document.getElementById('sourceOwner').value = name; document.getElementById('sourceDisplay').value = name; render(); };
            sBody.appendChild(tr);
        });
        uniqueReps.forEach(name => {
            const tr = document.createElement('tr');
            if(document.getElementById('targetOwner').value === name) tr.className = 'selected-target';
            tr.innerHTML = `<td>${name}</td>`;
            tr.onclick = () => { document.getElementById('targetOwner').value = name; document.getElementById('targetDisplay').value = name; render(); };
            tBody.appendChild(tr);
        });
        validate();
    }

    function validate() {
        const s = document.getElementById('sourceOwner').value;
        const t = document.getElementById('targetOwner').value;
        const c = document.getElementById('moveCount').value;
        document.getElementById('submitBtn').disabled = (!s || !t || s === t || !c || c <= 0);
    }

    async function handleExecution() {
        const selectedDispo = document.getElementById('dispoFilter').value;
        const sourceRep = document.getElementById('sourceOwner').value;
        
        // Alignment: Send empty string for 'Blank' or 'ALL' to trigger FetchXML null logic
        const flowDisposition = (selectedDispo === "Blank" || selectedDispo === "ALL") ? "" : selectedDispo;

        const payload = {
            sourceRep: sourceRep, // This will be "Unassigned" or a Name
            targetRep: document.getElementById('targetOwner').value,
            reassignCount: parseInt(document.getElementById('moveCount').value),
            disposition: flowDisposition,
            requestingUser: currentUser,
            requestingUserName: currentUserName
        };

        if(!confirm(`Proceed with moving ${payload.reassignCount} records?`)) return;

        showLoading(`Processing Reassignment...`);
        try {
            const res = await fetch(EXECUTE_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            
            if(res.ok && result.movedIDs && result.movedIDs.length > 0) {
                alert(`SUCCESS!\nMoved: ${result.movedIDs.length} records.`);
                fetchData();
            } else {
                alert("The process completed, but 0 records were updated. This usually means the FetchXML in the Flow didn't find any matches.");
            }
        } catch (e) {
            alert("Connection error. Check Flow run history.");
        } finally {
            hideLoading();
        }
    }

    initAuth();
</script>
</body>
</html>
