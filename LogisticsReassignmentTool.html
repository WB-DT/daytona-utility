<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Reassignment Tool - v1</title>
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --container-bg: #1a1d2b;
            --text-color: #e0e0e0;
            --border-color: #2d324a;
            --accent-blue: #0078d4;
            --accent-green: #107c10;
            --accent-red: #a80000;
            --row-hover: #252a3d;
        }

        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: var(--bg-color); color: var(--text-color); margin: 0; }
        .container { max-width: 1600px; margin: 20px auto; background: var(--container-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        #login-container { position:fixed; inset:0; background:var(--bg-color); display:none; align-items:center; justify-content:center; z-index:9999; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .reassign-bar { background: #252a3d; padding: 20px; border-radius: 8px; display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px; border: 1px solid var(--border-color); }
        
        .form-group { flex: 1; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #9da5b4; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: #0f111a; color: white; box-sizing: border-box; outline: none; }
        
        .table-container { height: 500px; overflow-y: auto; border: 1px solid var(--border-color); background: #141724; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        th { 
            position: sticky; 
            top: 0; 
            background: var(--accent-blue); 
            color: white; 
            padding: 12px 10px; 
            font-size: 11px; 
            z-index: 10; 
            cursor: pointer; 
            text-transform: uppercase;
            white-space: nowrap;
        }
        .th-content { display: flex; align-items: center; justify-content: center; gap: 4px; }
        .th-content.left { justify-content: flex-start; }
        
        .col-name { width: 50%; }
        .col-num { width: 16.6%; text-align: center; }

        td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 13px; }
        .td-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .td-num { text-align: center; white-space: nowrap; overflow: visible; }

        tr:hover { background-color: var(--row-hover); }
        tr.selected-source { background-color: #1a3a5a !important; border-left: 4px solid var(--accent-blue); }
        tr.selected-target { background-color: #1a4a1a !important; border-left: 4px solid var(--accent-green); }

        .badge { padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; min-width: 30px; display: inline-block; text-align: center; }
        
        .btn-main { background: var(--accent-blue); color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-main:disabled { background: #333 !important; color: #666 !important; cursor: not-allowed; }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: #9da5b4; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body onload="initAuth()">

<div id="login-container">
    <div style="text-align:center;">
        <div id="auth-status" class="loader" style="margin: 0 auto 20px;"></div>
        <h2 id="auth-text">Checking Credentials...</h2>
        <button id="manual-login-btn" onclick="manualLogin()" style="display:none;" class="btn-main">Sign In Manually</button>
    </div>
</div>

<div class="container" id="main-app" style="display:none;">
    <div class="header-flex">
        <div>
            <h2 style="margin:0;">Logitstics Reassignment Tool <span style="font-size: 12px; color: #666;">v10.1.1</span></h2>
            <div style="font-size: 11px; color: var(--accent-green);">Session Active</div>
        </div>
        <div style="text-align: right;">
            <button onclick="fetchData()" class="btn-secondary">↻ Refresh Data</button>
            <div style="color: #9da5b4; font-size: 13px; margin-top:5px;">Total Pool: <span id="feed-count" style="color:white; font-weight:bold;">0</span></div>
        </div>
    </div>

    <div class="reassign-bar">
        <div class="form-group">
            <label>Action Filter</label>
            <select id="actionFilter" onchange="applyListFilter()"></select>
        </div>
        <div class="form-group">
            <label>From (Source)</label>
            <input type="text" id="sourceRepDisplay" readonly placeholder="Pick Source">
            <input type="hidden" id="sourceRep">
        </div>
        <div class="form-group">
            <label>To (Target)</label>
            <input type="text" id="targetRepDisplay" readonly placeholder="Pick Target">
            <input type="hidden" id="targetRep">
        </div>
        <div class="form-group" style="max-width:100px;">
            <label>Quantity</label>
            <input type="number" id="count" min="1" value="1">
        </div>
        <button id="submitBtn" class="btn-main" disabled>Transfer Accounts</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
        <div>
            <label style="margin-bottom: 10px; display:block;">Source: Reps with Unsent Work</label>
            <input type="text" id="searchLeft" placeholder="Search Source..." onkeyup="render()" style="margin-bottom:10px;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-name" onclick="setSort('left', 'name')"><div class="th-content left">Rep Name <span>↕</span></div></th>
                            <th class="col-num" onclick="setSort('left', 'total')"><div class="th-content">Total <span>↕</span></div></th>
                            <th class="col-num" onclick="setSort('left', 'sent')"><div class="th-content">Sent <span>↕</span></div></th>
                            <th class="col-num" onclick="setSort('left', 'rem')"><div class="th-content">Unsent <span>↕</span></div></th>
                        </tr>
                    </thead>
                    <tbody id="sourceBody"></tbody>
                </table>
            </div>
        </div>

        <div>
            <label style="margin-bottom: 10px; display:block;">Target: Potential Recipients</label>
            <input type="text" id="searchRight" placeholder="Search Target..." onkeyup="render()" style="margin-bottom:10px;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-name" onclick="setSort('right', 'name')"><div class="th-content left">Rep Name <span>↕</span></div></th>
                            <th class="col-num" onclick="setSort('right', 'total')"><div class="th-content">Total <span>↕</span></div></th>
                            <th class="col-num" onclick="setSort('right', 'sent')"><div class="th-content">Sent <span>↕</span></div></th>
                            <th class="col-num" onclick="setSort('right', 'rem')"><div class="th-content">Unsent <span>↕</span></div></th>
                        </tr>
                    </thead>
                    <tbody id="targetBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" }, cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    let allData = []; let reps = []; let currentMetrics = {};
    let sortConfig = { left: { col: 'rem', dir: 'desc' }, right: { col: 'name', dir: 'asc' } };

    async function initAuth() {
        const loginContainer = document.getElementById('login-container');
        loginContainer.style.display = 'flex';
        try {
            await msalInstance.handleRedirectPromise();
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) completeLogin();
            else {
                try { await msalInstance.ssoSilent({ scopes: ["User.Read"] }); completeLogin(); }
                catch (e) {
                    document.getElementById('auth-status').style.display = 'none';
                    document.getElementById('auth-text').innerText = "Authentication Required";
                    document.getElementById('manual-login-btn').style.display = 'block';
                }
            }
        } catch (e) { console.error(e); }
    }

    async function manualLogin() { await msalInstance.loginPopup({ scopes: ["User.Read"] }); completeLogin(); }
    function completeLogin() { document.getElementById('login-container').style.display = 'none'; document.getElementById('main-app').style.display = 'block'; fetchData(); }

    async function fetchData() {
        const feedDisplay = document.getElementById('feed-count');
        feedDisplay.innerText = "Refreshing...";
        
        try {
            const response = await fetch("https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/952746524c354ee8a4d335d24ce01d6d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wOEIjRMghIgIGX4GU85rwL1hLdIeFT8O0I44C9C0vSo", {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repName: "User" })
            });
            const d = await response.json();
            allData = d.accountList || d.body.accountList;
            reps = d.repList || d.body.repList;
            feedDisplay.innerText = allData.length.toLocaleString();
            
            const filter = document.getElementById('actionFilter');
            const prevValue = filter.value;
            const actions = [...new Set(allData.map(r => r.cr714_action).filter(Boolean))].sort();
            filter.innerHTML = '<option value="ALL">-- ALL ACTIONS --</option>';
            actions.forEach(a => filter.add(new Option(a, a)));
            if(prevValue) filter.value = prevValue;
            applyListFilter();
        } catch (e) {
            feedDisplay.innerText = "Error";
            console.error(e);
        }
    }

    function applyListFilter() {
        const sel = document.getElementById('actionFilter').value;
        currentMetrics = {};
        allData.forEach(r => {
            if (sel === "ALL" || r.cr714_action === sel) {
                const rep = (r.cr714_rep || "Unassigned").trim();
                const isSent = (r.cr714_actionemailsent && String(r.cr714_actionemailsent).trim() !== "");
                if (!currentMetrics[rep]) currentMetrics[rep] = { total: 0, sent: 0, rem: 0 };
                currentMetrics[rep].total++;
                if (isSent) currentMetrics[rep].sent++;
            }
        });
        Object.keys(currentMetrics).forEach(k => currentMetrics[k].rem = currentMetrics[k].total - currentMetrics[k].sent);
        render();
    }

    function setSort(side, col) {
        if (sortConfig[side].col === col) sortConfig[side].dir = sortConfig[side].dir === 'asc' ? 'desc' : 'asc';
        else { sortConfig[side].col = col; sortConfig[side].dir = 'desc'; }
        render();
    }

    function render() {
        const sBody = document.getElementById('sourceBody'); const tBody = document.getElementById('targetBody');
        const sSearch = document.getElementById('searchLeft').value.toLowerCase();
        const tSearch = document.getElementById('searchRight').value.toLowerCase();
        sBody.innerHTML = ''; tBody.innerHTML = '';

        const sorter = (side) => (a, b) => {
            const config = sortConfig[side];
            let valA = (config.col === 'name') ? a : (currentMetrics[a] ? currentMetrics[a][config.col] : 0);
            let valB = (config.col === 'name') ? b : (currentMetrics[b] ? currentMetrics[b][config.col] : 0);
            if (config.dir === 'asc') return isNaN(valA) ? (valA || "").localeCompare(valB || "") : (valA - valB);
            return isNaN(valA) ? (valB || "").localeCompare(valA || "") : (valB - valA);
        };

        // Source: Filter by Search AND MUST have unsent work
        Object.keys(currentMetrics).filter(k => k.toLowerCase().includes(sSearch) && currentMetrics[k].rem > 0)
            .sort(sorter('left')).forEach(r => {
                const tr = document.createElement('tr');
                if (document.getElementById('sourceRep').value === r) tr.classList.add('selected-source');
                const m = currentMetrics[r];
                tr.innerHTML = `<td class="td-name col-name">${r}</td><td class="td-num col-num">${m.total}</td><td class="td-num col-num"><span class="badge" style="background:var(--accent-green)">${m.sent}</span></td><td class="td-num col-num"><span class="badge" style="background:var(--accent-red)">${m.rem}</span></td>`;
                tr.onclick = () => { document.getElementById('sourceRep').value = r; document.getElementById('sourceRepDisplay').value = r; render(); };
                sBody.appendChild(tr);
            });

        // Target: Show ALL reps from master list, even if 0 accounts for this action
        reps.map(r => r.cr714_name).filter(n => n.toLowerCase().includes(tSearch))
            .sort(sorter('right')).forEach(n => {
                const m = currentMetrics[n] || { total: 0, sent: 0, rem: 0 };
                const tr = document.createElement('tr');
                if (document.getElementById('targetRep').value === n) tr.classList.add('selected-target');
                tr.innerHTML = `<td class="td-name col-name">${n}</td><td class="td-num col-num">${m.total}</td><td class="td-num col-num"><span class="badge" style="background:var(--accent-green)">${m.sent}</span></td><td class="td-num col-num"><span class="badge" style="background:var(--accent-red)">${m.rem}</span></td>`;
                tr.onclick = () => { document.getElementById('targetRep').value = n; document.getElementById('targetRepDisplay').value = n; render(); };
                tBody.appendChild(tr);
            });
        validate();
    }

    function validate() { 
        const s = document.getElementById('sourceRep').value, t = document.getElementById('targetRep').value, action = document.getElementById('actionFilter').value;
        document.getElementById('submitBtn').disabled = !(s && t && s !== t && action !== "ALL"); 
    }

    function clearSelections() {
        document.getElementById('sourceRep').value = "";
        document.getElementById('sourceRepDisplay').value = "";
        document.getElementById('targetRep').value = "";
        document.getElementById('targetRepDisplay').value = "";
        document.getElementById('count').value = 1;
    }

    document.getElementById('submitBtn').addEventListener('click', async function() {
        const btn = this;
        const source = document.getElementById('sourceRep').value;
        const target = document.getElementById('targetRep').value;
        const moveCount = parseInt(document.getElementById('count').value);
        const action = document.getElementById('actionFilter').value;

        const payload = { sourceRep: source, targetRep: target, reassignCount: moveCount, actionFilter: action, requestingUser: "User" };
        
        btn.disabled = true; btn.innerText = "Processing...";
        
        try {
            const response = await fetch("https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/ccd1e78456a4470c9bef267fc8b6ba77/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=delp7lT79GXjEHWIj9AHaxSmAyUrojFqAhNx0nsv0pM", {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
            });

            if(response.ok) {
                if (currentMetrics[source]) {
                    currentMetrics[source].total -= moveCount;
                    currentMetrics[source].rem -= moveCount;
                }
                if (!currentMetrics[target]) currentMetrics[target] = { total: 0, sent: 0, rem: 0 };
                currentMetrics[target].total += moveCount;
                currentMetrics[target].rem += moveCount;

                clearSelections();
                render();
                fetchData(); 
            } else { alert("Transfer failed on server."); }
        } catch (e) { alert("Network Error"); }
        
        btn.innerText = "Transfer Accounts"; 
        validate();
    });
</script>
</body>
</html>
