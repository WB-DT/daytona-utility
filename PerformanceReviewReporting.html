
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Performance Reporting</title>

  <!-- ==========================================================
       EXECUTIVE PERFORMANCE REPORTING SPA (V9 – ENTERPRISE FINAL)
       ✅ Everything in v8
       ✅ Dept-level RAG risk badges (Quality + Trend aware)
       ✅ Persistent user state (tab / role / period / drill context)
       ✅ Audit logging for HR views (local + extensible)
       ========================================================== -->

  <style>
    :root {
      --bg:#05070f;--glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.18);
      --text:#eef2ff;--muted:#9aa8c7;
      --blue:#4f8cff;--cyan:#22d3ee;--purple:#a78bfa;
      --green:#34d399;--yellow:#fbbf24;--red:#f87171;
      --radius:18px;--blur:blur(18px);
      --font:'Segoe UI',system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);background:radial-gradient(circle at 20% 10%,rgba(79,140,255,.25),transparent 40%),radial-gradient(circle at 80% 20%,rgba(167,139,250,.18),transparent 45%),var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:100;backdrop-filter:var(--blur);background:linear-gradient(180deg,rgba(15,23,42,.9),rgba(15,23,42,.55));border-bottom:1px solid var(--border)}
    .header-inner{max-width:1700px;margin:auto;padding:16px;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center}
    h1{margin:0;font-size:1.4rem;font-weight:900;background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    .tab{padding:9px 16px;border-radius:999px;font-size:.75rem;font-weight:800;letter-spacing:.08em;color:var(--muted);cursor:pointer}
    .tab.active{color:#fff;background:linear-gradient(135deg,rgba(79,140,255,.35),rgba(34,211,238,.25));box-shadow:0 0 26px rgba(79,140,255,.45)}
    .actions{display:flex;gap:8px;align-items:center}
    .actions select,.actions button{background:linear-gradient(135deg,var(--blue),var(--purple));border:none;color:#fff;padding:8px 12px;border-radius:12px;font-weight:800}
    main{max-width:1700px;margin:auto;padding:24px}
    .panel{display:none;animation:fade .3s ease}
    .panel.active{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
    .glass{background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
    h2{margin:0 0 10px;font-size:1.05rem;letter-spacing:.05em}
    .muted{color:var(--muted);font-size:.85rem}

    .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .kpi{border:1px solid var(--border);border-radius:18px;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04))}
    .kpi .label{font-size:.7rem;letter-spacing:.14em;color:var(--muted)}
    .kpi .value{font-size:2rem;font-weight:900}

    .chart-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}
    .chart{border:1px solid var(--border);border-radius:14px;padding:14px;background:rgba(255,255,255,.05);position:relative}
    .badge{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:999px;font-size:.65rem;font-weight:900;letter-spacing:.08em}
    .badge.green{background:rgba(52,211,153,.25);color:var(--green)}
    .badge.yellow{background:rgba(251,191,36,.25);color:var(--yellow)}
    .badge.red{background:rgba(248,113,113,.25);color:var(--red)}

    svg{width:100%;height:220px}
    .line{fill:none;stroke-width:3}
    .quality{stroke:var(--cyan)} .coverage{stroke:var(--purple)} .dept{stroke:var(--green)}
    .target{stroke-dasharray:4 4;stroke:var(--yellow)}
    .delta-label{font-size:12px;font-weight:800}

    table{width:100%;border-collapse:collapse;font-size:.88rem}
    th,td{padding:12px 14px;border-bottom:1px solid var(--border)}
    th{font-size:.68rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
    tr.clickable:hover{background:rgba(79,140,255,.12);cursor:pointer}

    @media print{header,.actions,.tabs,#role-select{display:none}body{background:#fff;color:#000}.glass{border:1px solid #ccc}}
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Executive Performance</h1>
    <div class="tabs">
      <div class="tab active" data-tab="overview">Overview</div>
      <div class="tab" data-tab="org">Org Trends</div>
      <div class="tab" data-tab="departments">Departments</div>
      <div class="tab" data-tab="managers">Managers</div>
      <div class="tab" data-tab="employees">Employees</div>
    </div>
    <select id="role-select" onchange="applyRole()">
      <option value="exec">Executive</option>
      <option value="manager">Manager</option>
      <option value="hr">HR</option>
    </select>
    <div class="actions">
      <select id="period"><option value="3">3M</option><option value="6">6M</option><option value="12">12M</option></select>
      <button onclick="refreshAll()">Refresh</button>
      <button onclick="window.print()">Print</button>
    </div>
  </div>
</header>

<main>
<div class="panel active" id="tab-overview">
  <div class="glass"><h2>Executive KPIs</h2><div class="kpis" id="kpis"></div></div>
  <div class="glass"><h2>Executive Narrative</h2><div id="narrative" class="muted"></div></div>
</div>

<div class="panel" id="tab-org">
  <div class="glass"><h2>Organization Trends</h2><div class="chart-wrap"><div class="chart"><strong>Quality</strong><svg id="org-q"></svg></div><div class="chart"><strong>Coverage</strong><svg id="org-c"></svg></div></div></div>
</div>

<div class="panel" id="tab-departments">
  <div class="glass"><h2>Department Trends</h2><div id="dept-charts" class="chart-wrap"></div></div>
</div>

<div class="panel" id="tab-managers">
  <div class="glass"><h2>Managers</h2><table id="mgr-table"></table></div>
</div>

<div class="panel" id="tab-employees">
  <div class="glass"><h2>Employees</h2><table id="emp-table"></table></div>
</div>
</main>

<script>
/* ================= STATE + PERSISTENCE ================= */
const STORE_KEY='exec-dashboard-state';
const state=Object.assign({rows:[],role:'exec',dept:null,manager:null,tab:'overview',period:'12'},JSON.parse(localStorage.getItem(STORE_KEY)||'{}'));
const persist=()=>localStorage.setItem(STORE_KEY,JSON.stringify({role:state.role,dept:state.dept,manager:state.manager,tab:state.tab,period:state.period}));

const uniq=a=>[...new Set(a)];
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* ================= AUDIT (HR) ================= */
function audit(action,detail){
  if(state.role!=='hr') return;
  const log=JSON.parse(localStorage.getItem('hr-audit')||'[]');
  log.push({time:new Date().toISOString(),action,detail});
  localStorage.setItem('hr-audit',JSON.stringify(log));
}

/* ================= ROLE ================= */
function applyRole(){state.role=document.getElementById('role-select').value;persist();document.querySelector('[data-tab="departments"]').style.display=state.role==='exec'?'block':'none'}

/* ================= SERIES ================= */
function monthly(rows,m){const n=new Date(),o=[];for(let i=m-1;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);const k=`${d.getFullYear()}-${d.getMonth()+1}`;const s=rows.filter(r=>r.reviewMonth===k);o.push({label:d.toLocaleString('default',{month:'short'}),quality:avg(s.filter(x=>x.score!=null).map(x=>x.score)),coverage:s.length?(s.filter(x=>x.reviewed).length/s.length)*100:null});}return o}

/* ================= CHART ================= */
function draw(svg,series,key,cls,target){
  const w=svg.clientWidth,h=svg.clientHeight;
  const vals=series.map(d=>d[key]).filter(v=>v!=null);
  if(vals.length<2) return;
  const min=Math.min(...vals),max=Math.max(...vals);
  const sx=i=>(i/(series.length-1))*w;
  const sy=v=>h-((v-min)/(max-min||1))*h;
  svg.innerHTML=`<path d="${series.map((d,i)=>d[key]==null?'':`${i?'L':'M'}${sx(i)},${sy(d[key])}`).join(' ')}" class="line ${cls}"/>`;
  if(target) svg.innerHTML+=`<line x1="0" y1="${sy(target)}" x2="${w}" y2="${sy(target)}" class="target"/>`;
  const last=vals[vals.length-1],prev=vals[vals.length-2];
  if(prev!=null){const d=((last-prev)/Math.abs(prev))*100;const c=d>=0?'var(--green)':'var(--red)';svg.innerHTML+=`<text x="${w-6}" y="${sy(last)-6}" text-anchor="end" fill="${c}" class="delta-label">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</text>`}
}

/* ================= KPI ================= */
function renderKPIs(){const s=state.rows.filter(r=>r.score!=null).map(r=>r.score);const a=avg(s)||0;document.getElementById('kpis').innerHTML=`<div class="kpi"><div class="label">Avg Quality</div><div class="value">${a.toFixed(1)}</div></div><div class="kpi"><div class="label">Employees</div><div class="value">${state.rows.length}</div></div>`}

/* ================= NARRATIVE ================= */
function renderNarrative(){const depts=uniq(state.rows.map(r=>r.dept));document.getElementById('narrative').innerText=`${depts.length} departments tracked. Focus on red or downward-trending departments.`}

/* ================= ORG ================= */
function renderOrg(){const m=+document.getElementById('period').value,s=monthly(state.rows,m);draw(document.getElementById('org-q'),s,'quality','quality',85);draw(document.getElementById('org-c'),s,'coverage','coverage',95)}

/* ================= DEPTS (RAG + DRILL) ================= */
function deptRisk(series){const last=series.filter(x=>x.quality!=null).slice(-1)[0];if(!last)return 'green';if(last.quality>=85)return 'green';if(last.quality>=75)return 'yellow';return 'red'}

function renderDepts(){const c=document.getElementById('dept-charts');c.innerHTML='';const m=+document.getElementById('period').value;uniq(state.rows.map(r=>r.dept)).forEach(d=>{const series=monthly(state.rows.filter(r=>r.dept===d),m);const risk=deptRisk(series);const wrap=document.createElement('div');wrap.className='chart';wrap.innerHTML=`<span class="badge ${risk}">${risk.toUpperCase()}</span><strong>${d}</strong><svg></svg>`;wrap.onclick=()=>{state.dept=d;state.tab='managers';persist();audit('dept-drill',d);activate('managers')};c.appendChild(wrap);draw(wrap.querySelector('svg'),series,'quality','dept',85)})}

/* ================= MANAGER / EMPLOYEE ================= */
function renderManagers(){const rows=state.dept?state.rows.filter(r=>r.dept===state.dept):state.rows;const g={};rows.forEach(r=>{g[r.mgr]??=[];g[r.mgr].push(r)});document.getElementById('mgr-table').innerHTML=`<thead><tr><th>Manager</th><th>Employees</th><th>Avg</th></tr></thead><tbody>${Object.entries(g).map(([m,v])=>`<tr class="clickable" onclick="selectManager('${m}')"><td>${m}</td><td>${v.length}</td><td>${(avg(v.map(x=>x.score).filter(Boolean))||0).toFixed(1)}</td></tr>`).join('')}</tbody>`}

function selectManager(m){state.manager=m;state.tab='employees';persist();audit('manager-drill',m);activate('employees')}

function renderEmployees(){audit('employee-view',state.manager||'all');const rows=state.rows.filter(r=>(!state.dept||r.dept===state.dept)&&(!state.manager||r.mgr===state.manager));document.getElementById('emp-table').innerHTML=`<thead><tr><th>Employee</th><th>Dept</th><th>Mgr</th><th>Score</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.emp}</td><td>${r.dept}</td><td>${r.mgr}</td><td>${r.score??'—'}</td></tr>`).join('')}</tbody>`}

/* ================= NAV ================= */
function activate(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelector(`[data-tab="${tab}"]`).classList.add('active');document.getElementById(`tab-${tab}`).classList.add('active');state.tab=tab;persist();if(tab==='org')renderOrg();if(tab==='departments')renderDepts();if(tab==='managers')renderManagers();if(tab==='employees')renderEmployees()}

/* ================= REFRESH ================= */
function refreshAll(){applyRole();document.getElementById('period').value=state.period;renderKPIs();renderNarrative();renderOrg();renderDepts();renderManagers();activate(state.tab)}

/* ================= INIT ================= */
document.getElementById('role-select').value=state.role;document.getElementById('period').value=state.period;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>activate(t.dataset.tab));
</script>

</body>
</html>
