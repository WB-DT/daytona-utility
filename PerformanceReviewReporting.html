function filtered(){const q=$('#q').value.toLowerCase(),es=$('#empStatus').value,dep=$('#department').value,m=$('#manager').value,sr=$('#srManager').value,st=$('#approvalStatus').value,od=$('#overdue').value,typ=$('#reviewType').value;return rows.filter(r=>(!q||[r._rep,r._employeeId,r._email,r._manager,r._srManager,r._dept,r._reviewer,r._job,r._type].join(' ').toLowerCase().includes(q))&&(!es||r._empStatus===es)&&(!dep||r._dept===dep)&&(!m||r._manager===m)&&(!sr||r._srManager===sr)&&(!st||r._approvalStatus===st)&&(!od||String(r._overdue)===od)&&(!typ||r._type===typ))}function uniq(k){return[...new Set(rows.map(r=>r[k]).filter(Boolean))].sort()}function fillSel(id,vals){const el=$(id),cur=el.value;el.innerHTML='<option value="">All</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');el.value=cur}function sc(s,o){return o?'bad':s==='Complete'?'good':s.includes('Pending')?'warn':'bad'}
function render(){fillSel('#department',uniq('_dept'));fillSel('#manager',uniq('_manager'));fillSel('#srManager',uniq('_srManager'));fillSel('#reviewType',uniq('_type'));const d=filtered(),comp=d.filter(r=>r._approvalStatus==='Complete').length,over=d.filter(r=>r._overdue).length,avgQa=avg(d.map(r=>r._qa)),avgAux=avg(d.map(r=>r._aux)),calls=d.reduce((p,r)=>p+(r._outbound||0),0);$('#kpis').innerHTML=[['Reviews',d.length,'','Performance review rows'],['Complete',comp,'good',pct(comp,d.length)+'% signed/finalized'],['Overdue',over,over?'bad':'good','Approval SLA exceptions'],['Avg QA',avgQa?avgQa.toFixed(2):'—','info','OData formatted when available'],['Outbound',calls?calls.toLocaleString():'—','warn','Total calls in filter']].map(x=>`<article class="kpi"><div class="label">${x[0]}</div><div class="value ${x[2]}">${x[1]}</div><div class="note">${x[3]}</div></article>`).join('');renderCards(d);renderTable(d);renderEmployeeTable(d);renderFunnel(d);renderManagers(d);renderExceptions(d)}
function renderCards(d){$('#tab-reps').innerHTML=d.map(r=>`<article class="card"><div class="card-head"><div><div class="name">${esc(r._rep||'Unknown')}</div><div class="muted">${esc((r._type||'').toUpperCase())} · ${esc(r._reviewDate||'—')} · ${esc(r._dept||'—')}</div></div><span class="pill"><span class="dot ${sc(r._approvalStatus,r._overdue)}"></span>${r._overdue?'Overdue · ':''}${r._approvalStatus}</span></div><div class="mini-metrics"><div class="mini"><b>Overall</b><span>${esc(r._rating||'—')}</span></div><div class="mini"><b>Attendance</b><span>${esc(r._attendance||'—')}</span></div><div class="mini"><b>QA</b><span>${esc(r._qaFmt||r._qa||'—')}</span></div><div class="mini"><b>Aux</b><span>${esc(r._auxFmt||r._aux||'—')}</span></div></div><div class="kv"><b>Employee ID</b><span>${esc(r._employeeId||'—')}</span><b>Job / Tenure</b><span>${esc(r._job||'—')} · ${esc(r._tenure||'—')}</span><b>Manager</b><span>${esc(r._manager||'—')}</span><b>SR Manager</b><span>${esc(r._srManager||'—')}</span><b>Review Period</b><span>${esc(r._periodStart||'—')}</span><b>Outbound Calls</b><span>${esc(r._outboundFmt||r._outbound||'—')}</span><b>Approval Sent</b><span>${fmtDate(r._approvalSent)}</span><b>Employee Completed</b><span>${fmtDate(r._empCompleted)}</span><b>Manager Completed</b><span>${fmtDate(r._mgrCompleted)}</span></div><div class="timeline"><div class="stage"><b>Created</b><span>${esc(r._createdFmt||fmtDate(r._created))}</span></div><div class="stage"><b>Review</b><span>${esc(r._reviewDate||'—')}</span></div><div class="stage"><b>Employee</b><span>${r._empSigned?'Signed':'Pending'} · ${r._employeeAging??'—'}d</span></div><div class="stage"><b>Manager</b><span>${r._mgrSigned?'Finalized':'Pending'} · ${r._managerAging??'—'}d</span></div></div></article>`).join('')||'<div class="panel">No records match.</div>'}
function renderTable(d){const h=['Rep','Employee ID','Job','Manager','Dept','Review Type','Review Date','Overall','Attendance','QA','Aux','Outbound','Approval','Employee Done','Manager Done','Cycle'];$('#reviewTable').innerHTML='<thead><tr>'+h.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>'+d.map(r=>`<tr><td>${esc(r._rep)}</td><td>${esc(r._employeeId)}</td><td>${esc(r._job)}</td><td>${esc(r._manager)}</td><td>${esc(r._dept)}</td><td>${esc(r._type)}</td><td>${esc(r._reviewDate)}</td><td>${esc(r._rating)}</td><td>${esc(r._attendance)}</td><td>${esc(r._qaFmt||r._qa||'—')}</td><td>${esc(r._auxFmt||r._aux||'—')}</td><td>${esc(r._outboundFmt||r._outbound||'—')}</td><td><span class="pill"><span class="dot ${sc(r._approvalStatus,r._overdue)}"></span>${r._approvalStatus}</span></td><td>${fmtDate(r._empCompleted)}</td><td>${fmtDate(r._mgrCompleted)}</td><td>${r._totalCycle??'—'}</td></tr>`).join('')+'</tbody>'}
function renderEmployeeTable(d){const a=employees;$('#employeeTable').innerHTML='<thead><tr><th>Name</th><th>Rep Name</th><th>Email</th><th>Status</th><th>Department</th><th>Title</th><th>Manager</th><th>SR Manager</th><th>Location</th><th>Start Date</th></tr></thead><tbody>'+a.map(e=>`<tr><td>${esc(f(e,CONFIG.employeeFields.name))}</td><td>${esc(f(e,CONFIG.employeeFields.repName))}</td><td>${esc(val(e,CONFIG.employeeFields.email))}</td><td>${esc(f(e,CONFIG.employeeFields.status)||f(e,'statecode'))}</td><td>${esc(f(e,CONFIG.employeeFields.department))}</td><td>${esc(f(e,CONFIG.employeeFields.title))}</td><td>${esc(f(e,CONFIG.employeeFields.manager))}</td><td>${esc(f(e,CONFIG.employeeFields.srManager))}</td><td>${esc(f(e,'cr714_location'))}</td><td>${esc(f(e,CONFIG.employeeFields.startDate))}</td></tr>`).join('')+'</tbody>'}
function renderFunnel(d){const s=[['Total Reviews',d.length],['Approval Sent',d.filter(r=>r._approvalSent||r._sent).length],['Employee Completed',d.filter(r=>r._empCompleted||r._empSigned).length],['Manager Completed',d.filter(r=>r._mgrCompleted||r._mgrSigned).length],['Complete',d.filter(r=>r._approvalStatus==='Complete').length]],max=Math.max(1,s[0][1]);$('#funnel').innerHTML=s.map(([n,c])=>`<div class="funnel-row"><b>${n}</b><div class="bar"><span style="width:${pct(c,max)}%"></span></div><span>${c}</span></div>`).join('')}
function renderManagers(d){const g={};d.forEach(r=>(g[r._manager||'Unassigned']||=[]).push(r));const m=Object.entries(g).map(([name,rs])=>({name,total:rs.length,complete:rs.filter(r=>r._approvalStatus==='Complete').length,overdue:rs.filter(r=>r._overdue).length,avg:avg(rs.map(r=>r._totalCycle)),pendingMgr:rs.filter(r=>r._approvalStatus==='Pending Manager').length,pendingEmp:rs.filter(r=>r._approvalStatus==='Pending Employee').length})).sort((a,b)=>b.overdue-a.overdue||b.total-a.total);$('#managerTable').innerHTML='<thead><tr><th>Manager</th><th>Total</th><th>Complete</th><th>Completion %</th><th>Pending Manager</th><th>Pending Employee</th><th>Overdue</th><th>Avg Cycle</th></tr></thead><tbody>'+m.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.total}</td><td>${r.complete}</td><td>${pct(r.complete,r.total)}%</td><td>${r.pendingMgr}</td><td>${r.pendingEmp}</td><td class="${r.overdue?'bad':'good'}">${r.overdue}</td><td>${r.avg.toFixed(1)}d</td></tr>`).join('')+'</tbody>'}
function renderExceptions(d){const ex=d.filter(r=>r._approvalStatus!=='Complete'||r._overdue||r._rating==='below'||r._attendance==='below'||!r._email||!r._manager||!r._approvalSent);$('#exceptions').innerHTML=ex.map(r=>`<div class="line"><span class="dot ${sc(r._approvalStatus,r._overdue)}"></span><div><b>${esc(r._rep||'Unknown')}</b> — ${r._overdue?'Overdue · ':''}${esc(r._approvalStatus)}<div class="muted">Manager: ${esc(r._manager||'Missing')} · Email: ${esc(r._email||'Missing')} · Approval Sent: ${fmtDate(r._approvalSent)} · Cycle: ${r._totalCycle??'—'}d</div></div></div>`).join('')||'<p class="muted">No approval, SLA, data-quality, or rating exceptions in the current filter.</p>'}
async function refreshData(){try{const req=getRequestBody();setState(`Refreshing ${req.startDateLocal} to ${req.endDateLocal}…`,'warn');const res=await fetch(CONFIG.reportingFlowUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();const p=splitPayload(data);reviews=p.reviews;employees=p.employees;buildRows();setState(`Last refreshed ${new Date().toLocaleTimeString()} · ${reviews.length} review(s)`,'good')}catch(e){console.error(e);setState('Refresh failed','bad');reviews=[];employees=[];rows=[];render()}}
function exportCsv(){const d=filtered(),cols=['_rep','_employeeId','_email','_job','_dept','_manager','_srManager','_type','_reviewDate','_periodStart','_rating','_attendance','_qa','_qaFmt','_aux','_auxFmt','_outbound','_outboundFmt','_approvalStatus','_approvalSent','_empCompleted','_mgrCompleted','_overdue','_employeeAging','_managerAging','_totalCycle'];const csv=[cols.join(','),...d.map(r=>cols.map(c=>'"'+String(r[c]??'').replaceAll('"','""')+'"').join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='approval-report.csv';a.click();URL.revokeObjectURL(a.href)}
$$('input,select').forEach(el=>el.addEventListener('input',()=>{if(rows.length)render()}));$('#startDate').addEventListener('change',refreshData);$('#endDate').addEventListener('change',refreshData);$('#refreshBtn').onclick=refreshData;$('#csvBtn').onclick=exportCsv;$('#printBtn').onclick=()=>print();$('#themeBtn').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'};$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['reps','table','employees','funnel','managers','exceptions'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==b.dataset.tab))});initDateRange();refreshData();
</script>
</body>
