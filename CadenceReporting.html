<style>

html,body{height:100%;margin:0}body{font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg-app);color:var(--text-main);overflow:hidden}.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.card-header{font-weight:800;border-bottom:1px solid var(--border);padding:.55rem .75rem;display:flex;justify-content:space-between;align-items:center;background:var(--bg-header);border-radius:var(--radius) var(--radius) 0 0}input,select,textarea{background:var(--bg-input)!important;border:1px solid var(--border)!important;color:var(--text-main)!important;border-radius:.375rem;padding:.5rem;width:100%;font-size:.875rem;box-sizing:border-box}.btn-primary{background:var(--primary);color:var(--primary-fg);font-weight:800;padding:.5rem 1rem;border-radius:.375rem;border:none;cursor:pointer}.btn-secondary{background:var(--bg-input);border:1px solid var(--border);color:var(--text-main);font-weight:800;padding:.5rem 1rem;border-radius:.375rem;cursor:pointer}.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);font-weight:800;padding:.5rem 1rem;border-radius:.375rem;cursor:pointer}.quick-action-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-main);font-size:.76rem;font-weight:800;cursor:pointer}.quick-action-btn:hover,.quick-action-btn.is-selected{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}.filter-pill{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);font-size:.72rem;font-weight:800;white-space:nowrap;box-shadow:var(--shadow)}.stats-pill{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 14px;border-radius:8px;background:var(--bg-input);border:1px solid var(--border);min-width:86px;height:50px}.stats-label{font-size:.62rem;text-transform:uppercase;color:var(--text-muted);font-weight:900}.stats-value{font-size:1.1rem;font-weight:950}.text-muted{color:var(--text-muted)}.app{height:100vh;display:flex;flex-direction:column;gap:.5rem;padding:.5rem;overflow:hidden}.topbar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:.5rem}.hub-grid{flex:1;min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 360px;gap:.5rem;overflow:hidden}.hub-grid.right-collapsed{grid-template-columns:280px minmax(0,1fr) 44px}@media(max-width:1100px){.hub-grid{grid-template-columns:250px minmax(0,1fr)}#builder-panel{display:none}}@media(max-width:760px){.hub-grid{grid-template-columns:1fr}#nav-panel{display:none}.topbar{flex-wrap:wrap}}.custom-scrollbar::-webkit-scrollbar{width:7px;height:8px}.custom-scrollbar::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}.custom-scrollbar::-webkit-scrollbar-track{background:var(--bg-input)}table{border-collapse:separate;border-spacing:0}th{position:sticky;top:0;background:var(--bg-header);z-index:2}th,td{border-bottom:1px solid var(--border)}.editable-cell{cursor:pointer;border-radius:4px}.editable-cell:hover{outline:1px dashed var(--warning);background:rgba(234,179,8,.1)}.badge-ok{color:var(--success)}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);z-index:9000;display:none;align-items:center;justify-content:center}.modal-content{background:var(--modal-bg);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;width:min(880px,94vw);max-height:90vh;overflow:auto;box-shadow:0 10px 25px rgba(0,0,0,.25)}.toast-container{position:fixed;right:1rem;bottom:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem}.toast{background:#fff;color:#111827;border-radius:.5rem;padding:.85rem 1rem;box-shadow:0 4px 12px rgba(0,0,0,.15);border-left:4px solid var(--border);min-width:260px;max-width:360px;font-size:.88rem;transform:translateX(120%);transition:transform .25s}.toast.show{transform:translateX(0)}.toast.success{border-left-color:#22c55e}.toast.error{border-left-color:#ef4444}.toast.info{border-left-color:#2563eb}#global-loader{position:fixed;inset:0;background:var(--bg-app);z-index:9998;display:none;align-items:center;justify-content:center}.loader-card{width:min(520px,92vw);text-align:center;padding:1.25rem}

<body data-theme="midnight">
<div id="global-loader"><div class="card loader-card"><div class="text-2xl font-black">A.C.T. Reporting Hub</div><div class="text-muted mt-2">Loading...</div></div></div>
<div id="app" class="app"></div>

<script>
/* A.C.T. Reporting Hub - ACT MSAL Version
   This version intentionally DOES NOT create a new msal.PublicClientApplication.
   It delegates auth/token acquisition to ACT's existing working functions:
   window.getToken(), window.refreshSessionTokens(), window.session.crmToken, or window.crmToken.
*/
const PRIMARY_CRM_URL="https://wbmasonco.crm.dynamics.com/api/data/v9.2";
const DEFAULT_START="2020-01-01T00:00:00Z";
const DEFAULT_END="2026-06-09T09:27:12Z";
window.recordsMap=window.recordsMap||new Map();
window.allRecords=window.allRecords||[];
function activeDateFilter(){return[{field:"statecode",operator:"eq",value:0},{field:"createdon",operator:"ge",value:DEFAULT_START},{field:"createdon",operator:"lt",value:DEFAULT_END}]}
const CRM_REPORT_ENTITIES={
account360:{label:"Account 360",group:"Account Intelligence",virtual:true,icon:"fa-circle-nodes",primaryId:"accountnumber",displayField:"name",defaultColumns:["accountnumber","name","actMatch","actAction","contactCount","caseCount","workOrderCount","ownerid","modifiedon"],defaultOrderBy:[{field:"name",direction:"asc"}]},
accounts:{label:"Accounts",group:"Account Intelligence",icon:"fa-building",setName:"accounts",logicalName:"account",primaryId:"accountid",displayField:"name",accountJoinField:"accountnumber",defaultColumns:["accountid","name","accountnumber","address1_line1","address1_city","address1_stateorprovince","address1_country","telephone1","ownerid","statecode","statuscode","createdon","modifiedon"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"name",direction:"asc"}],relationship:{type:"root",key:"accountnumber"}},
contacts:{label:"Contacts",group:"Account Intelligence",icon:"fa-address-card",setName:"contacts",logicalName:"contact",primaryId:"contactid",displayField:"fullname",accountJoinField:"mss_accountnumber",defaultColumns:["contactid","fullname","emailaddress1","mobilephone","telephone1","mss_accountnumber","ownerid","statecode","statuscode","createdon","modifiedon"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"fullname",direction:"asc"}],relationship:{parentEntity:"accounts",parentKey:"accountnumber",childKey:"mss_accountnumber"}},
incidents:{label:"Cases",group:"Account Intelligence",icon:"fa-ticket",setName:"incidents",logicalName:"incident",primaryId:"incidentid",displayField:"title",accountJoinField:"mss_accountnumber",defaultColumns:["incidentid","ticketnumber","title","createdon","modifiedon","ownerid","prioritycode","statecode","statuscode","mss_accountnumber"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}],relationship:{parentEntity:"accounts",parentKey:"accountnumber",childKey:"mss_accountnumber"}},
phonecalls:{label:"Phone Calls",group:"Activity",icon:"fa-phone",setName:"phonecalls",logicalName:"phonecall",primaryId:"activityid",displayField:"subject",defaultColumns:["activityid","subject","createdon","modifiedon","actualstart","actualend","phonenumber","directioncode","ownerid","statecode","statuscode","description"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}]},
emails:{label:"Emails",group:"Activity",icon:"fa-envelope",setName:"emails",logicalName:"email",primaryId:"activityid",displayField:"subject",defaultColumns:["activityid","subject","createdon","modifiedon","actualstart","actualend","directioncode","ownerid","statecode","statuscode"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}]},
qgcti_callhistories:{label:"Call History",group:"Activity",icon:"fa-clock-rotate-left",setName:"qgcti_callhistories",logicalName:"qgcti_callhistory",primaryId:"qgcti_callhistoryid",displayField:"qgcti_subject",accountJoinField:"mss_accountnumber",defaultColumns:["qgcti_callhistoryid","qgcti_subject","createdon","modifiedon","qgcti_endtime","qgcti_durationhms","mss_calldurationminutes","qgcti_calldirection","qgcti_callresult","qgcti_cli","qgcti_accountid","qgcti_contactid","qgcti_leadid","ownerid","statecode","statuscode"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}]},
mss_callcodes:{label:"Call Codes",group:"Activity",icon:"fa-tags",setName:"mss_callcodes",logicalName:"mss_callcode",primaryId:"mss_callcodeid",displayField:"mss_name",defaultColumns:["mss_callcodeid","mss_name","createdon","modifiedon","statecode","statuscode"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"mss_name",direction:"asc"}]},
msdyn_workorders:{label:"Work Orders",group:"Operations",icon:"fa-screwdriver-wrench",setName:"msdyn_workorders",logicalName:"msdyn_workorder",primaryId:"msdyn_workorderid",displayField:"msdyn_name",accountJoinField:"mss_accountnumber",defaultColumns:["msdyn_workorderid","msdyn_name","createdon","modifiedon","msdyn_workordertype","msdyn_primaryincidenttype","msdyn_systemstatus","msdyn_address1","msdyn_city","msdyn_stateorprovince","msdyn_serviceaccount","mss_accountnumber","statecode","statuscode","ownerid"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}],relationship:{parentEntity:"accounts",parentKey:"accountnumber",childKey:"mss_accountnumber"}},
mss_customerordernumbers:{label:"Customer Order Numbers",group:"Operations",icon:"fa-receipt",setName:"mss_customerordernumbers",logicalName:"mss_customerordernumber",primaryId:"mss_customerordernumberid",displayField:"mss_documentnumber",defaultColumns:["mss_customerordernumberid","mss_documentnumber","mss_custpo","statecode","statuscode","createdon","modifiedon"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}]},
mss_purchasingtasks:{label:"Purchasing Tasks",group:"Operations",icon:"fa-list-check",setName:"mss_purchasingtasks",logicalName:"mss_purchasingtask",primaryId:"activityid",displayField:"subject",defaultColumns:["activityid","subject","createdon","modifiedon","description","mss_salesid","mss_itemid","mss_itembuyergroup","mss_sourcesystemid","mss_caseid","mss_ponumber","ownerid","statecode","statuscode"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}]},
mss_salescontracts:{label:"Sales Contracts",group:"Operations",icon:"fa-file-signature",setName:"mss_salescontracts",logicalName:"mss_salescontract",primaryId:"mss_salescontractid",displayField:"mss_contractname",defaultColumns:["mss_salescontractid","mss_contractname","mss_contractstartdate","mss_contractreferencecode","mss_masterppl","statecode","statuscode","createdon","modifiedon"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}]},
mss_beverageserviceincidents:{label:"Beverage Service Incidents",group:"Operations",icon:"fa-mug-hot",setName:"mss_beverageserviceincidents",logicalName:"mss_beverageserviceincident",primaryId:"mss_beverageserviceincidentid",displayField:"mss_beverageserviceincidentid",defaultColumns:["mss_beverageserviceincidentid","createdon","modifiedon","statecode","statuscode"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}]},
mss_branchs:{label:"Branches",group:"Reference",icon:"fa-code-branch",setName:"mss_branchs",logicalName:"mss_branch",primaryId:"mss_branchid",displayField:"mss_name",defaultColumns:["mss_branchid","mss_name","mss_city","mss_state","statecode","statuscode","createdon","modifiedon"],defaultFilter:[{field:"statecode",operator:"eq",value:0}],defaultOrderBy:[{field:"mss_name",direction:"asc"}]},
mss_branchcontacts:{label:"Branch Contacts",group:"Reference",icon:"fa-user-tie",setName:"mss_branchcontacts",logicalName:"mss_branchcontact",primaryId:"mss_branchcontactid",displayField:"mss_fullname",defaultColumns:["mss_branchcontactid","mss_fullname","mss_mobilephone","mss_extension","mss_branchpositionid","statecode","statuscode","createdon","modifiedon"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"mss_fullname",direction:"asc"}]},
systemusers:{label:"System Users",group:"Reference",icon:"fa-users",setName:"systemusers",logicalName:"systemuser",primaryId:"systemuserid",displayField:"fullname",defaultColumns:["systemuserid","fullname","internalemailaddress","azureactivedirectoryobjectid","domainname","isdisabled","ownerid","createdon","modifiedon"],defaultFilter:[{field:"isdisabled",operator:"eq",value:false}],defaultOrderBy:[{field:"fullname",direction:"asc"}]},
teams:{label:"Teams",group:"Reference",icon:"fa-people-group",setName:"teams",logicalName:"team",primaryId:"teamid",displayField:"name",defaultColumns:["teamid","name","businessunitid","administratorid","teamtype","createdon","modifiedon"],defaultFilter:[],defaultOrderBy:[{field:"name",direction:"asc"}]},
mss_callscriptanalyticses:{label:"Call Script Analytics",group:"Analytics",icon:"fa-chart-line",setName:"mss_callscriptanalyticses",logicalName:"mss_callscriptanalytics",primaryId:"mss_callscriptanalyticsid",displayField:"mss_callscriptanalyticsid",defaultColumns:["mss_callscriptanalyticsid","createdon","modifiedon","ownerid","statecode","statuscode"],defaultFilter:activeDateFilter(),defaultOrderBy:[{field:"createdon",direction:"desc"}]}
};
const hub={activeEntityKey:"account360",activeRows:[],entityData:{},metadata:{},selectedColumnsByEntity:{},filtersByEntity:{},sortByEntity:{},savedLayouts:loadSavedLayouts(),isLoading:false,lastQueryUrl:null,nextLink:null,dirtyRows:new Map(),rightCollapsed:false,offlineDemoMode:false};
document.addEventListener("DOMContentLoaded",()=>{hydratePrefs();renderApp();runEntityReport(hub.activeEntityKey,{silent:true})});
async function getReportingHubToken(resourceOrUrl=PRIMARY_CRM_URL){if(typeof window.getToken==="function")return await window.getToken(resourceOrUrl);if(typeof window.refreshSessionTokens==="function"){await window.refreshSessionTokens();if(window.session?.crmToken)return window.session.crmToken;if(window.crmToken)return window.crmToken}if(window.session?.crmToken)return window.session.crmToken;if(window.crmToken)return window.crmToken;throw new Error("ACT CRM token not available. Open this inside ACT after login, or use Demo Data.")}
function hasActAuthContext(){return Boolean(window.session?.crmToken||window.crmToken||window.activeAccount||typeof window.getToken==="function"||typeof window.refreshSessionTokens==="function")}
async function connectUsingAct(){if(typeof window.login==="function"&&window.login!==connectUsingAct){await window.login();showToast("ACT login triggered","success");renderApp();return}if(typeof window.refreshSessionTokens==="function"){await window.refreshSessionTokens();showToast("ACT session refreshed","success");renderApp();return}showToast("This build uses ACT's existing MSAL. Open inside ACT, or use Demo Data.","info")}
function renderApp(){const app=document.getElementById("app"),entity=CRM_REPORT_ENTITIES[hub.activeEntityKey];app.innerHTML=`<div class="topbar card p-2"><div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--primary);color:var(--primary-fg)"><i class="fa-solid fa-chart-column"></i></div><div class="min-w-0"><div class="text-xs text-muted font-black uppercase tracking-wide">A.C.T.</div><div class="text-xl font-black truncate">Reporting Hub</div></div><span class="filter-pill hidden md:flex"><i class="fa-solid fa-key"></i> Uses ACT MSAL</span></div><div class="flex items-center gap-2 flex-wrap justify-end"><button id="btn-connect" class="btn-secondary"><i class="fa-solid fa-plug mr-1"></i>${hasActAuthContext()?"Connected":"Connect"}</button><button id="btn-theme" class="btn-secondary"><i class="fa-solid fa-moon mr-1"></i>Theme</button><button id="btn-demo" class="btn-secondary"><i class="fa-solid fa-vial mr-1"></i>Demo Data</button><button id="btn-clear" class="btn-danger"><i class="fa-solid fa-trash mr-1"></i>Clear</button></div></div><div class="hub-grid ${hub.rightCollapsed?"right-collapsed":""}">${renderNav()}${renderGrid(entity)}${renderBuilder(entity)}</div>`;bindEvents()}
function renderNav(){const groups={};Object.entries(CRM_REPORT_ENTITIES).forEach(([key,e])=>{(groups[e.group||"Other"]??=[]).push({key,...e})});return`<div id="nav-panel" class="card p-2 overflow-y-auto custom-scrollbar"><div class="font-black text-sm mb-2 flex justify-between"><span>Reports</span><span class="text-muted text-xs">${Object.keys(CRM_REPORT_ENTITIES).length}</span></div><input id="entity-search" placeholder="Search reports..." class="mb-2"/>${Object.entries(groups).map(([g,arr])=>`<div class="mb-3"><div class="text-xs text-muted font-black uppercase mb-1">${esc(g)}</div><div class="flex flex-col gap-1">${arr.map(e=>`<button class="quick-action-btn entity-btn ${e.key===hub.activeEntityKey?"is-selected":""}" data-key="${e.key}" data-label="${esc(e.label.toLowerCase())}"><i class="fa-solid ${e.icon||"fa-table"}"></i><span class="truncate">${esc(e.label)}</span></button>`).join("")}</div></div>`).join("")}</div>`}
function renderGrid(entity){const rows=hub.activeRows||[],cols=getCols(hub.activeEntityKey);return`<div class="card flex flex-col overflow-hidden min-w-0"><div class="card-header gap-2"><div class="min-w-0"><div class="text-xs text-muted font-black uppercase">${entity.virtual?"Merged ACT + CRM":entity.setName}</div><div class="truncate">${esc(entity.label)} <span class="text-muted text-xs ml-2">${rows.length.toLocaleString()} rows</span></div></div><div class="flex items-center gap-2 flex-wrap justify-end"><button id="run-btn" class="btn-primary"><i class="fa-solid fa-play mr-1"></i>Run</button><button id="save-layout" class="btn-secondary"><i class="fa-solid fa-floppy-disk mr-1"></i>Save</button><button id="export-btn" class="btn-secondary"><i class="fa-solid fa-file-export mr-1"></i>Export</button><button id="builder-toggle" class="btn-secondary"><i class="fa-solid fa-sliders"></i></button></div></div><div class="p-2 border-b border-[var(--border)] flex gap-2 overflow-x-auto custom-scrollbar">${kpis(rows)}</div><div class="p-2 border-b border-[var(--border)] flex gap-2 overflow-x-auto custom-scrollbar">${filterPills()}</div><div class="overflow-auto custom-scrollbar flex-1"><table class="w-full text-sm"><thead><tr>${cols.map(c=>`<th class="text-left p-2 whitespace-nowrap">${esc(colName(hub.activeEntityKey,c))}</th>`).join("")}<th class="text-left p-2 whitespace-nowrap">ACT</th><th class="text-left p-2 whitespace-nowrap">Actions</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>rowHtml(r,cols,i)).join(""):`<tr><td colspan="${cols.length+2}" class="p-8 text-center text-muted"><i class="fa-solid fa-table text-3xl mb-2"></i><div class="font-black">No rows loaded</div><div>Click Run, open inside ACT, or load Demo Data.</div></td></tr>`}</tbody></table></div><div class="p-2 flex justify-between border-t border-[var(--border)]"><div class="text-xs text-muted truncate">${hub.lastQueryUrl?esc(hub.lastQueryUrl):"No query run yet"}</div><button id="next-btn" class="btn-secondary" ${hub.nextLink?"":"disabled"}>Next Page</button></div></div>`}
function renderBuilder(entity){if(hub.rightCollapsed)return`<div id="builder-panel" class="card p-2 flex items-center justify-center"><button id="builder-toggle2" class="btn-secondary"><i class="fa-solid fa-sliders"></i></button></div>`;const key=hub.activeEntityKey,meta=hub.metadata[key]||syntheticMeta(key),selected=getCols(key);return`<div id="builder-panel" class="card flex flex-col overflow-hidden min-w-0"><div class="card-header"><span>Report Builder</span><button id="builder-toggle2" class="btn-secondary"><i class="fa-solid fa-chevron-right"></i></button></div><div class="p-2 overflow-y-auto custom-scrollbar flex-1"><div class="mb-3"><label class="text-xs text-muted font-black uppercase">Selected Entity</label><div class="font-black">${esc(entity.label)}</div><div class="text-xs text-muted">${esc(entity.virtual?"virtual/account merge":entity.setName)}</div></div><div class="mb-3"><div class="flex justify-between mb-1"><label class="text-xs text-muted font-black uppercase">Columns</label><button id="metadata-btn" class="text-xs btn-secondary py-1 px-2">Metadata</button></div><input id="column-search" placeholder="Search columns..." class="mb-2"/><div class="flex flex-col gap-1 max-h-[330px] overflow-y-auto custom-scrollbar">${meta.map(c=>`<label class="filter-pill justify-between col-opt" data-label="${esc((c.displayName+' '+c.logicalName).toLowerCase())}"><span class="flex items-center gap-2 min-w-0"><input type="checkbox" class="col-toggle" data-col="${esc(c.logicalName)}" ${selected.includes(c.logicalName)?"checked":""}/><span class="truncate">${esc(c.displayName)}</span></span><span class="text-[10px] text-muted">${esc(c.type||"")}</span></label>`).join("")}</div></div><div class="mb-3"><div class="flex justify-between mb-1"><label class="text-xs text-muted font-black uppercase">Filters</label><button id="add-filter" class="text-xs btn-secondary py-1 px-2">+ Filter</button></div><div class="flex flex-col gap-2">${filterRows()}</div></div><div class="mb-3"><label class="text-xs text-muted font-black uppercase">Sort</label>${sortHtml()}</div><div class="mb-3"><label class="text-xs text-muted font-black uppercase">Saved Layouts</label>${savedLayoutsHtml()}</div></div></div>`}
