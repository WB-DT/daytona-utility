<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management OS v50.0 (Unified Data Lake)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        slate: { 850: '#1a202c', 900: '#0f172a', 950: '#020617' },
                        primary: { 500: '#3b82f6', 600: '#2563eb' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                } 
            }
        }
    </script>

    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-main: #f1f5f9; --bg-panel: #ffffff; --text-main: #0f172a; --text-muted: #475569;
            --border: #e2e8f0; --primary: #2563eb; --primary-light: #eff6ff; --card-hover: #f8fafc;
        }
        .dark {
            --bg-main: #020617; --bg-panel: #0f172a; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border: #1e293b; --primary: #3b82f6; --primary-light: #172554; --card-hover: #1e293b;
        }
        
        /* THEMES */
        body.theme-ocean { --bg-main: #e0f2fe; --bg-panel: #ffffff; --primary: #0284c7; --primary-light: #f0f9ff; --text-main: #0c4a6e; }
        body.theme-ocean.dark { --bg-main: #0c4a6e; --bg-panel: #075985; --text-main: #f0f9ff; --primary: #38bdf8; --border: #0369a1; --card-hover: #0c4a6e; }

        /* CORE */
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-main); color: var(--text-main); transition: background 0.3s, color 0.3s; }
        .app-grid { display: grid; grid-template-columns: 260px 1fr; height: 100%; overflow: hidden; }
        .panel-bg { background: var(--bg-panel); border-right: 1px solid var(--border); }
        .border-theme { border-color: var(--border); }
        
        /* SCROLLBARS */
        .custom-scroll { scrollbar-width: thin; scrollbar-color: var(--text-muted) transparent; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* VIRTUAL LIST */
        #virtual-list { position: relative; overflow-y: auto; height: 100%; outline: none; contain: strict; }
        #virtual-height { width: 1px; opacity: 0; }
        #virtual-content { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }

        /* GALLERY GRID */
        .ticket-card { height: 60px; box-sizing: border-box; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; border-left: 4px solid transparent; position: relative; background: var(--bg-panel); display: flex; align-items: center; padding: 0 16px; }
        .ticket-card:hover { background-color: var(--card-hover); }
        .ticket-card.selected { border-left-color: var(--primary); background-color: var(--primary-light); }
        .grid-layout { display: grid; gap: 16px; width: 100%; align-items: center; font-size: 13px; }
        
        /* EXCEL GRID HEADERS */
        .excel-header-container { display: grid; gap: 16px; padding: 8px 16px; padding-right: 22px; background: var(--bg-main); border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; font-size: 11px; font-weight: bold; text-transform: uppercase; color: var(--text-muted); user-select: none; }
        .excel-col { display: flex; flex-direction: column; gap: 4px; position: relative; }
        .excel-input { width: 100%; background: var(--bg-panel); border: 1px solid var(--border); padding: 2px 4px; font-size: 10px; border-radius: 4px; color: var(--text-main); }
        .excel-sort-btn { cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .excel-sort-btn:hover { color: var(--primary); }
        .resizer { position: absolute; right: -10px; top: 0; bottom: 0; width: 15px; cursor: col-resize; user-select: none; z-index: 20; opacity: 0; }
        .resizer:hover, .excel-col:hover .resizer { opacity: 1; background: rgba(59, 130, 246, 0.2); }

        /* KANBAN */
        .kanban-board { display: flex; height: 100%; overflow-x: auto; padding: 16px; gap: 16px; min-height: 0; }
        .kanban-col { min-width: 320px; width: 320px; background: var(--card-hover); border-radius: 12px; display: flex; flex-direction: column; max-height: 100%; border: 1px solid var(--border); overflow: hidden; }
        .kanban-header { padding: 12px; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: var(--bg-panel); }
        .kanban-body { flex-grow: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
        .kanban-card { background: var(--bg-panel); padding: 12px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid transparent; flex-shrink: 0; }
        
        /* GROUPS & STATS */
        .group-container { height: 100%; overflow-y: auto; padding: 16px; min-height: 0; }
        .expand-group { margin-bottom: 16px; background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
        .expand-summary { padding: 12px 16px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: space-between; background: var(--card-hover); position: sticky; top: 0; z-index: 10; user-select: none; }
        .expand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 16px; }
        .stat-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; transition: 0.2s; }
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; transition: width 0.5s; }

        /* MAP */
        #map-container { width: 100%; height: 100%; background: #e2e8f0; z-index: 1; }
        .leaflet-popup-content { font-family: 'Inter', sans-serif; font-size: 12px; color: #0f172a; }
        .marker-urgent { animation: pulse-opacity 1.5s infinite alternate; }
        @keyframes pulse-opacity { from { fill-opacity: 0.6; stroke-width: 1; } to { fill-opacity: 0.9; stroke-width: 4; } }

        /* OVERLAY */
        #focus-overlay { position: fixed; inset: 0; background: var(--bg-main); z-index: 2000; display: grid; grid-template-rows: 60px 1fr 70px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); overflow: hidden; }
        #focus-overlay.active { transform: translateY(0); }
        
        .raw-data-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; font-size: 12px; }
        .raw-row { display: contents; }
        .raw-row:nth-child(even) .raw-label, .raw-row:nth-child(even) .raw-value { background-color: rgba(0,0,0,0.02); }
        .raw-label { font-weight: bold; color: var(--text-muted); text-align: right; padding: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .raw-value { color: var(--text-main); word-break: break-word; padding: 4px; }

        .dash-btn.active { background-color: var(--primary); color: white; opacity: 1; }
        .dash-btn.inactive { opacity: 0.7; }
        .dash-btn.inactive:hover { background-color: var(--card-hover); opacity: 1; color: var(--text-main); }
        .stale-ticket { background-color: rgba(239, 68, 68, 0.05); } 

        #drop-zone { pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 9999; backdrop-filter: blur(4px); }
        #drop-zone.active { opacity: 1; pointer-events: all; }
        
        /* CHART CONTAINER */
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">

    <div class="fixed top-3 right-4 z-50 group">
        <button class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center hover:scale-110 transition shadow-lg border border-slate-300 dark:border-slate-600"><i class="fas fa-palette"></i></button>
        <div class="absolute right-0 mt-2 w-32 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden hidden group-hover:block">
            <button onclick="window.setTheme('dark')" class="w-full text-left px-4 py-2 text-xs hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-800 dark:text-white">Midnight</button>
            <button onclick="window.setTheme('light')" class="w-full text-left px-4 py-2 text-xs hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-800 dark:text-white">Professional</button>
            <button onclick="window.setTheme('ocean')" class="w-full text-left px-4 py-2 text-xs hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-800 dark:text-white">Ocean</button>
        </div>
    </div>

    <div id="auth-screen" class="fixed inset-0 bg-white dark:bg-slate-950 z-50 flex flex-col items-center justify-center p-4 transition-opacity duration-500">
        <div class="max-w-md w-full text-center space-y-8 animate-fade-in-up">
            <div class="inline-flex p-5 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white text-5xl shadow-2xl shadow-blue-500/30">
                <i class="fas fa-layer-group"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-tight text-slate-900 dark:text-white">Management OS</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium">v50.0 Unified Data Lake</p>
            </div>
            
            <div id="login-container" class="space-y-4">
                <button onclick="window.login()" class="w-full py-3.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold hover:scale-[1.02] transition shadow-xl flex items-center justify-center gap-3">
                    <i class="fab fa-microsoft text-xl"></i> Sign In
                </button>
                <button onclick="window.bypassAuth()" class="text-xs font-bold text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 uppercase tracking-widest transition">
                    Offline Mode
                </button>
            </div>

            <div id="progress-container" class="hidden w-full space-y-2">
                <div class="flex justify-between text-xs font-bold text-slate-500 uppercase">
                    <span id="progress-step">Connecting...</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-blue-600 transition-all duration-300 w-0"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-ui" class="app-grid hidden">
        <div class="panel-bg flex flex-col z-20 shadow-2xl relative h-full overflow-hidden">
            <div class="p-6 flex-shrink-0">
                <div class="text-lg font-black tracking-tight flex items-center gap-2">
                    <span class="text-blue-500 text-2xl"><i class="fas fa-cube"></i></span> MNG<span class="opacity-50">OS</span>
                </div>
            </div>

            <div class="flex-grow px-4 space-y-6 overflow-y-auto custom-scroll">
                <div class="space-y-1">
                    <div class="text-[10px] font-bold opacity-50 uppercase tracking-widest mb-2 pl-2">Overview</div>
                    <button onclick="window.setFilterMode('today')" id="nav-today" class="dash-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-bold transition flex items-center justify-between group inactive">
                        <span class="flex items-center gap-3"><i class="fas fa-calendar-day"></i> New Today</span>
                        <span id="count-today" class="bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded text-[10px]">0</span>
                    </button>
                    <button onclick="window.setFilterMode('urgent')" id="nav-urgent" class="dash-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-bold transition flex items-center justify-between group inactive">
                        <span class="flex items-center gap-3"><i class="fas fa-fire"></i> Urgent / >30 Days</span>
                        <span id="count-urgent" class="bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded text-[10px]">0</span>
                    </button>
                    <button onclick="window.setFilterMode('all')" id="nav-all" class="dash-btn w-full text-left px-3 py-2.5 rounded-lg text-xs font-bold transition flex items-center justify-between group active">
                        <span class="flex items-center gap-3"><i class="fas fa-database"></i> Master Log</span>
                        <span id="count-all" class="bg-white/20 text-white px-2 py-0.5 rounded text-[10px]">0</span>
                    </button>
                </div>

                <div class="space-y-1 pt-4 border-t border-theme">
                    <div class="text-[10px] font-bold opacity-50 uppercase tracking-widest mb-2 pl-2">Views</div>
                    <button onclick="window.changeView('list')" id="view-list" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold bg-slate-800 text-white transition flex gap-3"><i class="fas fa-list w-4"></i> Data Grid</button>
                    <button onclick="window.changeView('kanban')" id="view-kanban" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold opacity-70 hover:bg-slate-100 dark:hover:bg-slate-800 hover:opacity-100 transition flex gap-3"><i class="fas fa-columns w-4"></i> Workflow Board</button>
                    <button onclick="window.changeView('reps')" id="view-reps" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold opacity-70 hover:bg-slate-100 dark:hover:bg-slate-800 hover:opacity-100 transition flex gap-3"><i class="fas fa-users w-4"></i> Rep Performance</button>
                    <button onclick="window.changeView('route')" id="view-route" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold opacity-70 hover:bg-slate-100 dark:hover:bg-slate-800 hover:opacity-100 transition flex gap-3"><i class="fas fa-sitemap w-4"></i> By Department</button>
                    <button onclick="window.changeView('map')" id="view-map" class="w-full text-left px-3 py-2 rounded-lg text-xs font-bold opacity-70 hover:bg-slate-100 dark:hover:bg-slate-800 hover:opacity-100 transition flex gap-3"><i class="fas fa-map w-4"></i> Geo Analysis</button>
                </div>

                <div class="space-y-4 pt-4 border-t border-theme">
                    <div class="flex justify-between items-center pl-2">
                        <div class="text-[10px] font-bold opacity-50 uppercase tracking-widest">Filters</div>
                        <button onclick="window.clearAllFilters()" class="text-[10px] text-blue-500 hover:underline">Clear All</button>
                    </div>
                    <div>
                        <label class="text-[10px] opacity-70 mb-1.5 block pl-1">Department</label>
                        <select id="filter-type" onchange="window.triggerRender()" class="w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-xs rounded-lg p-2.5 border border-theme focus:border-blue-500 outline-none transition cursor-pointer">
                            <option value="all">All Departments</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] opacity-70 mb-1.5 block pl-1">Rep / Owner</label>
                        <select id="filter-owner" onchange="window.triggerRender()" class="w-full bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white text-xs rounded-lg p-2.5 border border-theme focus:border-blue-500 outline-none transition cursor-pointer">
                            <option value="all">Show Everyone</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-theme bg-slate-900/5 flex-shrink-0">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xs shadow-lg" id="user-initial">U</div>
                    <div class="overflow-hidden">
                        <div class="text-xs font-bold truncate" id="user-name">User</div>
                        <div class="text-[10px] opacity-70 truncate" id="user-email">Connected</div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.exportData()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold py-2 rounded-lg transition shadow-lg">Export Excel</button>
                </div>
            </div>
        </div>

        <div id="main-panel" class="flex flex-col relative z-10 border-r border-theme overflow-hidden h-full bg-main">
            <div class="px-4 py-3 border-b border-theme flex items-center gap-3 bg-panel sticky top-0 z-20 flex-shrink-0">
                <div class="relative flex-grow group">
                    <i class="fas fa-search absolute left-3 top-2.5 opacity-50 text-xs group-focus-within:text-blue-500 transition"></i>
                    <input type="text" id="search-input" onkeyup="window.debouncedSearch()" placeholder="Search Quotes, Companies, IDs..." class="w-full bg-slate-100 dark:bg-slate-800 pl-9 pr-4 py-2 rounded-lg text-xs font-medium focus:ring-2 focus:ring-blue-500 outline-none transition-all border border-transparent">
                    <button onclick="document.getElementById('search-input').value=''; window.triggerRender();" class="absolute right-2 top-2.5 text-xs opacity-50 hover:text-red-500"><i class="fas fa-times"></i></button>
                </div>
                <button onclick="window.toggleAnalytics()" class="p-2 opacity-50 hover:opacity-100 hover:text-blue-500"><i class="fas fa-chart-pie"></i></button>
            </div>

            <div class="flex border-b border-theme text-xs font-bold opacity-70 overflow-x-auto custom-scroll bg-slate-50/50 dark:bg-slate-900/50 flex-shrink-0">
                <button onclick="window.setStatusFilter('all')" id="tab-all" class="nav-item active px-4 py-3 hover:text-blue-500 whitespace-nowrap transition-colors">All Status</button>
                <button onclick="window.setStatusFilter('Pending')" id="tab-pending" class="nav-item px-4 py-3 hover:text-blue-500 whitespace-nowrap transition-colors">Pending/Open</button>
                <button onclick="window.setStatusFilter('Working on')" id="tab-working" class="nav-item px-4 py-3 hover:text-blue-500 whitespace-nowrap transition-colors">In Progress</button>
                <button onclick="window.setStatusFilter('Completed')" id="tab-completed" class="nav-item px-4 py-3 hover:text-blue-500 whitespace-nowrap transition-colors">Closed/Won</button>
            </div>

            <div id="main-view-area" class="flex-grow relative overflow-hidden bg-main">
                <div id="virtual-list" tabindex="0" class="h-full overflow-y-auto outline-none">
                    <div id="virtual-height"></div>
                    <div id="virtual-content"></div>
                </div>
            </div>

            <div class="px-3 py-2 border-t border-theme text-[10px] flex justify-between items-center opacity-50 bg-panel flex-shrink-0">
                <span id="list-count-display">0 Items</span>
                <span>Power Automate Sync: <span class="text-green-500">Active</span></span>
            </div>
            
             <div id="analytics-overlay" class="absolute inset-0 bg-panel z-30 flex flex-col overflow-y-auto hidden animate-fade-in p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">Analytics Dashboard</h2>
                    <button onclick="window.toggleAnalytics()" class="opacity-50 hover:opacity-100"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div class="grid grid-cols-2 gap-6 mb-6">
                    <div class="panel-bg p-4 rounded-xl border border-theme shadow-sm h-64"><canvas id="chart-issues"></canvas></div>
                    <div class="panel-bg p-4 rounded-xl border border-theme shadow-sm h-64"><canvas id="chart-routes"></canvas></div>
                </div>
                <div class="panel-bg p-4 rounded-xl border border-theme shadow-sm h-64"><canvas id="chart-owners"></canvas></div>
            </div>
        </div>

        <div id="focus-overlay" class="shadow-2xl">
            <div class="h-[60px] border-b border-theme flex items-center justify-between px-6 bg-panel z-10">
                <div class="flex items-center gap-4">
                    <button onclick="window.closeFocus()" class="opacity-50 hover:opacity-100 transition flex items-center gap-2 text-xs font-bold uppercase"><i class="fas fa-arrow-left"></i> Back</button>
                    <div class="h-6 w-px bg-slate-200 dark:bg-slate-700"></div>
                    <h2 class="text-xl font-black tracking-tight" id="f-id">--</h2>
                    <span id="f-badge" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase bg-slate-100 text-slate-600 tracking-wide">--</span>
                    <span id="f-header-owner" class="text-xs font-bold text-blue-600 dark:text-blue-400"></span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="window.navTicket(-1)" class="w-8 h-8 rounded-full border border-theme flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 transition"><i class="fas fa-chevron-left"></i></button>
                    <button onclick="window.navTicket(1)" class="w-8 h-8 rounded-full border border-theme flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 transition"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 h-full overflow-hidden bg-main">
                <div class="p-8 overflow-y-auto border-r border-theme custom-scroll bg-slate-50/50 dark:bg-slate-950/50">
                    <div class="max-w-2xl mx-auto space-y-8">
                        <div>
                            <h1 class="text-3xl font-bold leading-tight mb-2" id="f-customer">--</h1>
                            <div class="flex flex-wrap gap-3 text-xs font-medium opacity-70">
                                <span class="flex items-center gap-1.5"><i class="fas fa-tag"></i> <span id="f-type">--</span></span>
                                <span class="flex items-center gap-1.5"><i class="fas fa-calendar"></i> <span id="f-date">--</span></span>
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold opacity-50 uppercase mb-2 block">Full Record Details</label>
                            <div class="panel-bg border border-theme rounded-xl p-4 shadow-sm">

                        </div>
                    </div>
                </div>

                <div class="p-8 overflow-y-auto custom-scroll panel-bg">
                      <div class="max-w-xl mx-auto flex flex-col h-full">
                          <div class="mb-6">
                              <label class="text-[10px] font-bold opacity-50 uppercase mb-2 block">Assigned To</label>
                              <select id="f-owner" class="w-full bg-slate-50 dark:bg-slate-800 border border-theme rounded-xl p-3 text-sm font-bold text-blue-600 dark:text-blue-400 cursor-pointer outline-none"><option value="">Unassigned</option></select>
                          </div>
                          <div class="flex-grow flex flex-col mb-6">
                            <label class="text-[10px] font-bold opacity-50 uppercase mb-2 block">Management Notes</label>

                         </div>
                         <div class="mb-20">
                             <label class="text-[10px] font-bold opacity-50 uppercase mb-2 block">Update Workflow Status</label>
                             <div class="grid grid-cols-2 gap-3">
                                 <button onclick="window.setFocusStatus('Pending')" class="py-3 rounded-xl border border-theme text-sm font-bold opacity-70 hover:opacity-100 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Pending</button>
                                 <button onclick="window.setFocusStatus('Completed')" class="py-3 rounded-xl bg-green-600 text-white text-sm font-bold hover:bg-green-700 shadow-md transition">Mark Closed</button>
                                 <button onclick="window.setFocusStatus('Escalated')" class="py-3 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700 shadow-md transition">Urgent</button>
                                 <button onclick="window.setFocusStatus('Working on')" class="py-3 rounded-xl border border-blue-200 dark:border-blue-900 text-blue-600 text-sm font-bold hover:bg-blue-50 dark:hover:bg-blue-900/30 transition">In Progress</button>
                             </div>
                         </div>
                     </div>
                </div>
            </div>

    <script id="worker-script" type="javascript/worker">
        // ZIP CODES FOR MAP
        const ZIP_MAP = {'010':[42.1,-72.6],'021':[42.3,-71.0],'100':[40.7,-74.0],'112':[40.6,-73.9],'191':[39.9,-75.1],'320':[30.3,-81.7],'331':[25.7,-80.2],'321':[29.2,-81.0],'327':[28.8,-81.3],'328':[28.5,-81.3]};
        
        let db = []; let filteredDB = []; let owners = []; let types = [];
        
        function excelDateToJS(serial) {
            if (typeof serial === 'number') {
               const utc_days  = Math.floor(serial - 25569);
               const utc_value = utc_days * 86400000;
               return new Date(utc_value).toISOString().split('T')[0];
            }
            if(typeof serial === 'string' && serial.includes('T')) return serial.split('T')[0];
            return serial;
        }

        function calculateDaysOpen(startStr) {
            if(!startStr) return 0;
            const start = new Date(startStr);
            const now = new Date();
            const diffTime = Math.abs(now - start);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        }

        self.onmessage = function(e) {
            const { type, payload } = e.data;
            
            if (type === 'PARSE') {
                try {
                    const raw = payload.data;
                    self.postMessage({ type: 'PROGRESS', step: 'Normalizing Data...', percent: 50 });
                    
                    const normalize = (list, type) => {
                        if(!list || !Array.isArray(list)) return [];
                        return list.map(item => {
                            // Unified Field Mapping
                            let id = item['Q-Number'] || item.ItemInternalId || item.ID || 'N/A';
                            let date = excelDateToJS(item['Start time'] || item['Start Date'] || item['createdon']);
                            let cust = item['Customer'] || item['Company Name'] || item['Company \nName'] || 'Unknown';
                            let status = item['Status'] || item['Disposition'] || 'Pending';
                            let owner = item['Sales Rep'] || item['Assigned To'] || item['Furn Rep'] || item['Name'] || 'Unassigned';
                            let desc = item['Notes'] || item['Support Notes'] || item['Item Description/ Details'] || item['cr714_comments'] || '';
                            let amount = item['WB Item Sell Price TOTAL'] || 0;
                            
                            // Clean Status
                            if(status.toLowerCase().includes('complete') || status.toLowerCase().includes('won') || status.toLowerCase().includes('closed')) status = 'Completed';
                            else if(status.toLowerCase().includes('work') || status.toLowerCase().includes('progress')) status = 'Working on';
                            else if(status.toLowerCase().includes('lost') || status.toLowerCase().includes('killed')) status = 'Completed'; // Treat lost as closed
                            else status = 'Pending';

                            // Urgent Logic
                            let isUrgent = false;
                            const daysOpen = calculateDaysOpen(date);
                            if(type === 'Quote' && daysOpen > 30 && status !== 'Completed') isUrgent = true;
                            if(String(item['ASAP or Standard Request']).toLowerCase().includes('asap')) isUrgent = true;
                            if(status === 'Escalated') isUrgent = true;

                            // Address extraction for Map
                            let zip3 = "000";
                            const addr = item['Billing Address'] || item['Ship To Address'] || "";
                            const zipMatch = addr.match(/\b\d{5}/);
                            if(zipMatch) zip3 = zipMatch[0].substring(0, 3);

                            return {
                                id, type, date, cust, status, owner, desc, amount, isUrgent, zip3, raw: item,
                                searchStr: (id+cust+owner+type).toLowerCase()
                            };
                        });
                    };

                    let combined = [];
                    if(raw.quotes && raw.quotes.body) combined.push(...normalize(raw.quotes.body.value, 'Quote'));
                    if(raw.furniture && raw.furniture.body) combined.push(...normalize(raw.furniture.body.value, 'Furniture'));
                    if(raw.print && raw.print.body) combined.push(...normalize(raw.print.body.value, 'Print'));
                    if(raw.tech && raw.tech.body) combined.push(...normalize(raw.tech.body.value, 'Tech'));
                    if(raw.feedback && raw.feedback.body) combined.push(...normalize(raw.feedback.body.value, 'Feedback'));

                    db = combined;
                    owners = [...new Set(db.map(x=>x.owner).filter(x=>x && x!=='Unassigned'))].sort();
                    types = [...new Set(db.map(x=>x.type))].sort();
                    
                    const todayStr = new Date().toISOString().split('T')[0];
                    const counts = { 
                        today: db.filter(x => x.date === todayStr).length, 
                        urgent: db.filter(x => x.isUrgent).length, 
                        all: db.length 
                    };

                    filteredDB = db;
                    self.postMessage({ type: 'INIT_COMPLETE', owners, types, counts });

                } catch(err) { console.error(err); }
            }
            else if (type === 'FILTER') {
                const { search, type: fType, owner, status, mode } = payload.filters;
                const todayStr = new Date().toISOString().split('T')[0];

                filteredDB = db.filter(t => {
                    if(mode === 'today' && t.date !== todayStr) return false;
                    if(mode === 'urgent' && !t.isUrgent) return false;
                    
                    if(fType !== 'all' && t.type !== fType) return false;
                    if(owner !== 'all' && t.owner !== owner) return false;
                    if(status !== 'all' && t.status !== status) return false;
                    if(search && !t.searchStr.includes(search)) return false;
                    return true;
                });
                
                // Sort by Date Desc default
                filteredDB.sort((a,b) => new Date(b.date) - new Date(a.date));

                self.postMessage({ type: 'FILTER_COMPLETE', count: filteredDB.length });
            }
            else if (type === 'GET_CHUNK') {
                const { start, end } = payload;
                self.postMessage({ type: 'CHUNK_DATA', chunk: filteredDB.slice(start, end) });
            }
            else if (type === 'GET_KANBAN') {
                const cols = { 'Pending': [], 'Working on': [], 'Escalated': [], 'Completed': [] };
                filteredDB.forEach(t => { if(cols[t.status] && cols[t.status].length < 50) cols[t.status].push(t); });
                self.postMessage({ type: 'KANBAN_DATA', cols });
            }
            else if (type === 'GET_MAP') {
                const points = filteredDB.filter(t => t.zip3 !== '000').map(t => {
                    const coords = ZIP_MAP[t.zip3] || [39.8, -98.6]; // Default US center if missing
                    return { lat: coords[0] + (Math.random()-0.5)*0.1, lon: coords[1] + (Math.random()-0.5)*0.1, ticket: t };
                });
                self.postMessage({ type: 'MAP_DATA', points });
            }
            else if (type === 'GET_CHART') {
                const byType = {}; const byStatus = {}; const byOwner = {};
                filteredDB.forEach(t => {
                    byType[t.type] = (byType[t.type]||0)+1;
                    byStatus[t.status] = (byStatus[t.status]||0)+1;
                    if(t.owner && t.owner !== 'Unassigned') byOwner[t.owner] = (byOwner[t.owner]||0)+1;
                });
                self.postMessage({ type: 'CHART_DATA', byType, byStatus, byOwner });
            }
            else if (type === 'GET_GROUPED') {
                 const { field } = payload;
                 const groups = {};
                 filteredDB.forEach(t => {
                     const k = t[field] || 'Unknown';
                     if(!groups[k]) groups[k] = { total: 0, completed: 0, pending: 0 };
                     groups[k].total++;
                     if(t.status === 'Completed') groups[k].completed++; else groups[k].pending++;
                 });
                 self.postMessage({ type: 'GROUPED_DATA', groups, field });
            }
        };
    </script>

    <script>
        // --- BOOTSTRAP ---
        const POWER_AUTOMATE_URL = "https://49b71dde44f8e78e89bc0440816209.07.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/72a7c76f7f874f3ea6e35b9598c2adfe/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wm4Fu7Iq4hv-v4Q7H327f8PaygWAoov0rmAAWUZg_Nk";
        
        const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401" } };
        const msalInstance = new msal.PublicClientApplication(msalConfig);

        const blob = new Blob([document.getElementById('worker-script').textContent], { type: "text/javascript" });
        const worker = new Worker(URL.createObjectURL(blob));
        
        let currentMode = 'all'; let currentStatus = 'all'; let currentView = 'list';
        let totalRecords = 0; let currentTicket = null; let mapInstance = null; let chartInstances = {};
        
        // --- WORKER HANDLER ---
        worker.onmessage = function(e) {
            const { type, percent, owners, types, counts, count, chunk, cols, points, byType, byStatus, byOwner, groups, field } = e.data;
            
            if(type === 'PROGRESS') {
                document.getElementById('progress-bar').style.width = percent + '%';
            }
            else if(type === 'INIT_COMPLETE') {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                
                // Populate Filters
                const typeSel = document.getElementById('filter-type');
                types.forEach(t => typeSel.add(new Option(t, t)));
                const ownerSel = document.getElementById('filter-owner');
                const detailOwnerSel = document.getElementById('f-owner');
                owners.forEach(o => {
                    ownerSel.add(new Option(o, o));
                    detailOwnerSel.add(new Option(o, o));
                });
                
                // Update Counts
                document.getElementById('count-today').innerText = counts.today;
                document.getElementById('count-urgent').innerText = counts.urgent;
                document.getElementById('count-all').innerText = counts.all;
                
                triggerRender();
            }
            else if(type === 'FILTER_COMPLETE') {
                totalRecords = count;
                document.getElementById('list-count-display').innerText = `${count} Records`;
                refreshCurrentView();
                // Always update charts in background
                worker.postMessage({ type: 'GET_CHART' });
            }
            else if(type === 'CHUNK_DATA') {
                renderVirtualList(chunk);
            }
            else if(type === 'KANBAN_DATA') {
                renderKanban(cols);
            }
            else if(type === 'MAP_DATA') {
                renderMap(points);
            }
            else if(type === 'CHART_DATA') {
                renderCharts(byType, byStatus, byOwner);
            }
            else if(type === 'GROUPED_DATA') {
                renderGrouped(groups, field);
            }
        };

        // --- AUTH & DATA ---
        async function login() {
            try {
                const r = await msalInstance.loginPopup({ scopes: ["User.Read"] });
                init(r.account.username);
            } catch(e) { alert("Login failed, try Offline Mode."); }
        }
        
        function bypassAuth() { init("offline@user.com"); }
        
        function init(email) {
            document.getElementById('user-email').innerText = email;
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            
            // Start Polling (5 min init, then 30 min)
            fetchData();
            setTimeout(fetchData, 300000); 
            setInterval(fetchData, 1800000);
        }

        async function fetchData() {
            try {
                const res = await fetch(POWER_AUTOMATE_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ requestType: "SyncLogs", userEmail: document.getElementById('user-email').innerText })
                });
                if(!res.ok) throw new Error("Sync Failed");
                const json = await res.json();
                worker.postMessage({ type: 'PARSE', payload: { data: json } });
            } catch(e) { console.error(e); }
        }

        // --- VIEW CONTROLLER ---
        function triggerRender() {
            const filters = {
                search: document.getElementById('search-input').value.toLowerCase(),
                type: document.getElementById('filter-type').value,
                owner: document.getElementById('filter-owner').value,
                status: currentStatus,
                mode: currentMode
            };
            worker.postMessage({ type: 'FILTER', payload: { filters } });
        }
        
        function refreshCurrentView() {
            const container = document.getElementById('main-view-area');
            if(currentView === 'list') {
                initGridHeader();
                document.getElementById('virtual-list').addEventListener('scroll', handleScroll);
                handleScroll(); // Trigger first chunk
            }
            else if(currentView === 'kanban') worker.postMessage({ type: 'GET_KANBAN' });
            else if(currentView === 'map') worker.postMessage({ type: 'GET_MAP' });
            else if(currentView === 'reps') worker.postMessage({ type: 'GET_GROUPED', payload: { field: 'owner' } });
            else if(currentView === 'route') worker.postMessage({ type: 'GET_GROUPED', payload: { field: 'type' } });
        }

        function changeView(v) {
            currentView = v;
            // Update active state
            document.querySelectorAll('[id^="view-"]').forEach(b => { b.classList.remove('bg-slate-800','text-white'); b.classList.add('opacity-70'); });
            const btn = document.getElementById(`view-${v}`);
            if(btn) { btn.classList.add('bg-slate-800','text-white'); btn.classList.remove('opacity-70'); }
            
            const container = document.getElementById('main-view-area');
            container.innerHTML = `<div id="virtual-list" tabindex="0" class="h-full overflow-y-auto outline-none"><div id="virtual-height"></div><div id="virtual-content"></div></div>`;
            
            refreshCurrentView();
        }

        // --- RENDERERS ---
        let gridTemplate = "90px 100px 1.5fr 100px 120px 100px 1fr";
        function initGridHeader() {
             const h = document.getElementById('main-view-area');
             h.innerHTML = `
                <div class="excel-header-container" style="grid-template-columns: ${gridTemplate};">
                    <div class="excel-col">ID</div>
                    <div class="excel-col">DATE</div>
                    <div class="excel-col">CUSTOMER</div>
                    <div class="excel-col">TYPE</div>
                    <div class="excel-col">STATUS</div>
                    <div class="excel-col">OWNER</div>
                    <div class="excel-col">DESCRIPTION</div>
                </div>
                <div id="virtual-list" class="h-full overflow-y-auto relative"><div id="virtual-height" style="height:${totalRecords * 60}px"></div><div id="virtual-content"></div></div>
             `;
             document.getElementById('virtual-list').addEventListener('scroll', handleScroll);
        }

        function handleScroll() {
            const list = document.getElementById('virtual-list');
            if(!list) return;
            const scrollTop = list.scrollTop;
            const start = Math.floor(scrollTop / 60);
            const end = start + 20; // Buffer
            document.getElementById('virtual-content').style.transform = `translateY(${start * 60}px)`;
            worker.postMessage({ type: 'GET_CHUNK', payload: { start, end } });
        }

        function renderVirtualList(chunk) {
            const c = document.getElementById('virtual-content');
            if(!c) return;
            c.innerHTML = chunk.map(t => `
                <div class="ticket-card ${t.isUrgent ? 'border-l-red-500 bg-red-50/10' : ''}" onclick='openDetails(${JSON.stringify(t)})'>
                    <div class="grid-layout" style="grid-template-columns: ${gridTemplate};">
                        <span class="font-bold text-xs">#${t.id.substring(0,8)}</span>
                        <span class="text-xs opacity-70">${t.date}</span>
                        <span class="font-bold text-sm truncate">${t.cust}</span>
                        <span class="text-[10px] uppercase font-bold tracking-wider">${t.type}</span>
                        <span class="text-[10px] px-2 py-1 rounded ${t.status==='Completed'?'bg-green-100 text-green-800':(t.status==='Pending'?'bg-blue-100 text-blue-800':'bg-yellow-100')} text-center">${t.status}</span>
                        <span class="text-xs truncate">${t.owner}</span>
                        <span class="text-xs opacity-50 truncate">${t.desc || '-'}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderKanban(cols) {
            const container = document.getElementById('main-view-area');
            container.innerHTML = `<div class="kanban-board">${Object.keys(cols).map(k => `
                <div class="kanban-col">
                    <div class="kanban-header"><span>${k}</span><span class="text-xs bg-slate-200 px-2 rounded">${cols[k].length}</span></div>
                    <div class="kanban-body">${cols[k].map(t => `
                        <div class="kanban-card" onclick='openDetails(${JSON.stringify(t)})'>
                            <div class="flex justify-between mb-1"><span class="font-bold text-xs">#${t.id}</span><span class="text-[9px] uppercase">${t.type}</span></div>
                            <div class="text-sm font-bold truncate mb-1">${t.cust}</div>
                            <div class="text-xs opacity-70 truncate">${t.desc}</div>
                        </div>`).join('')}
                    </div>
                </div>`).join('')}</div>`;
        }

        function renderMap(points) {
            const container = document.getElementById('main-view-area');
            container.innerHTML = '<div id="map-container"></div>';
            if(mapInstance) { mapInstance.remove(); mapInstance = null; }
            mapInstance = L.map('map-container').setView([39.8, -98.6], 4);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(mapInstance);
            
            points.forEach(p => {
                L.circleMarker([p.lat, p.lon], { radius: 6, fillColor: p.ticket.isUrgent ? '#ef4444' : '#3b82f6', color: 'white', weight: 1, fillOpacity: 0.8 })
                 .addTo(mapInstance)
                 .bindPopup(`<b>${p.ticket.cust}</b><br>${p.ticket.type}<br>${p.ticket.status}`);
            });
        }
        
        function renderGrouped(groups, field) {
             const html = Object.keys(groups).map(k => {
                 const g = groups[k];
                 const pct = Math.round((g.completed / g.total) * 100) || 0;
                 return `<div class="stat-card" onclick="document.getElementById('search-input').value='${k}'; triggerRender(); changeView('list');">
                    <div class="flex justify-between font-bold text-sm mb-2"><span>${k}</span><span>${pct}%</span></div>
                    <div class="text-xs opacity-60 flex justify-between mb-2"><span>${g.completed}/${g.total} Done</span><span>${g.pending} Left</span></div>
                    <div class="progress-bar"><div class="progress-fill ${pct>80?'bg-green-500':'bg-blue-500'}" style="width:${pct}%"></div></div>
                 </div>`;
             }).join('');
             document.getElementById('main-view-area').innerHTML = `<div class="group-container"><div class="expand-grid">${html}</div></div>`;
        }

        function renderCharts(byType, byStatus, byOwner) {
            const mkChart = (id, type, data, title) => {
                const ctx = document.getElementById(id);
                if(ctx) {
                    if(chartInstances[id]) chartInstances[id].destroy();
                    chartInstances[id] = new Chart(ctx, {
                        type: type,
                        data: { labels: Object.keys(data), datasets: [{ label: title, data: Object.values(data), backgroundColor: ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'] }] },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                }
            };
            mkChart('chart-issues', 'doughnut', byType, 'Log Type');
            mkChart('chart-routes', 'bar', byStatus, 'Status');
            mkChart('chart-owners', 'bar', Object.fromEntries(Object.entries(byOwner).slice(0,10)), 'Top Reps');
        }

        // --- INTERACTIONS ---
        function openDetails(t) {
            currentTicket = t;
            const set = (id, v) => document.getElementById(id).innerText = v || '--';
            set('f-id', '#' + t.id);
            set('f-badge', t.status);
            set('f-customer', t.cust);
            set('f-type', t.type);
            set('f-date', t.date);
            
            document.getElementById('f-header-owner').innerText = t.owner;
            document.getElementById('f-owner').value = t.owner;
            document.getElementById('f-notes').value = t.desc;

            const grid = document.getElementById('f-raw-grid');
            grid.innerHTML = "";
            Object.entries(t.raw).forEach(([k,v]) => {
                if(v && typeof v !== 'object') {
                    grid.innerHTML += `<div class="raw-row"><div class="raw-label">${k}</div><div class="raw-value">${v}</div></div>`;
                }
            });
            
            document.getElementById('focus-overlay').classList.add('active');
        }

        function closeFocus() { document.getElementById('focus-overlay').classList.remove('active'); }
        function toggleAnalytics() { document.getElementById('analytics-overlay').classList.toggle('hidden'); }
        function setFilterMode(m) { 
            currentMode = m; 
            document.querySelectorAll('.dash-btn').forEach(b => { b.classList.remove('active'); b.classList.add('inactive'); });
            document.getElementById(`nav-${m}`).classList.add('active'); document.getElementById(`nav-${m}`).classList.remove('inactive');
            triggerRender(); 
        }
        function setStatusFilter(s) { currentStatus = s; triggerRender(); }
        function debouncedSearch() { clearTimeout(window.st); window.st = setTimeout(triggerRender, 300); }
        function setTheme(t) { document.body.className = `theme-${t} ` + (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : ''); }
        function exportData() { XLSX.writeFile(XLSX.utils.json_to_sheet(filteredDB), "Management_Log_Export.xlsx"); }

    </script>
</body>
