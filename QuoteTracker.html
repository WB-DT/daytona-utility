<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management OS v57.0 (Juggernaut Edition)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://alcdn.msauth.net/browser/2.30.0/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        slate: { 850: '#1a202c', 900: '#0f172a', 950: '#020617' },
                        primary: { 500: '#3b82f6', 600: '#2563eb' },
                        success: { 500: '#10b981' },
                        danger: { 500: '#ef4444' },
                        warning: { 500: '#f59e0b' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                } 
            }
        }
    </script>

    <style>
        :root { --bg-main: #f8fafc; --bg-panel: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; }
        .dark { --bg-main: #0f172a; --bg-panel: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; --border: #334155; }
        
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-main); color: var(--text-main); transition: background 0.2s; }
        
        /* Layout */
        .app-grid { display: grid; grid-template-columns: 280px 1fr; height: 100%; overflow: hidden; }
        .panel-sidebar { background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 20; }
        .main-content { background: var(--bg-main); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* Grid & Scroll */
        .custom-scroll { scrollbar-width: thin; scrollbar-color: var(--text-muted) transparent; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        
        /* Ticket Card */
        .ticket-card {
            display: grid; 
            grid-template-columns: 90px 100px 1.5fr 100px 100px 120px 100px 80px 1fr; 
            gap: 16px; 
            align-items: center;
            padding: 0 24px;
            height: 64px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.1s;
            border-left: 4px solid transparent;
        }
        .ticket-card:hover { background-color: rgba(59, 130, 246, 0.05); }
        .ticket-card.urgent { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.05); }
        .ticket-card.high-value { border-left-color: #10b981; }
        
        /* Headers */
        .grid-header {
            display: grid;
            grid-template-columns: 90px 100px 1.5fr 100px 100px 120px 100px 80px 1fr; 
            gap: 16px;
            padding: 12px 24px;
            padding-right: 30px; /* Scrollbar offset */
            background: var(--bg-main);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Overlay */
        #focus-overlay {
            position: fixed; inset: 0; background: var(--bg-main); z-index: 50; 
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: grid; grid-template-rows: 70px 1fr;
        }
        #focus-overlay.active { transform: translateY(0); }

        /* Kanban */
        .kanban-board { display: flex; height: 100%; overflow-x: auto; padding: 24px; gap: 24px; }
        .kanban-col { min-width: 320px; width: 320px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; height: 100%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .kanban-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .kanban-body { padding: 12px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 12px; }
        .kanban-card { background: var(--bg-main); border: 1px solid var(--border); padding: 12px; border-radius: 8px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: transform 0.1s; }
        .kanban-card:hover { transform: translateY(-2px); border-color: var(--primary); }

        /* Helpers */
        .badge { padding: 2px 8px; border-radius: 9999px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .badge-blue { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .badge-green { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge-red { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .badge-yellow { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }

        .raw-grid { display: grid; grid-template-columns: 140px 1fr; font-size: 13px; border-top: 1px solid var(--border); }
        .raw-row { display: contents; }
        .raw-key { padding: 8px 12px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.02); }
        .raw-val { padding: 8px 12px; color: var(--text-main); border-bottom: 1px solid var(--border); word-break: break-word; }
        
        canvas { max-height: 100%; max-width: 100%; }
    </style>
</head>

    <script id="worker-script" type="javascript/worker">
        let DB = [];
        let FILTERED = [];
        
        // --- HELPER FUNCTIONS ---
        const cleanDate = (v) => {
            if(!v) return "N/A";
            // Check for Excel Serial (Numbers around 45000)
            if((typeof v === 'number' || !isNaN(parseFloat(v))) && parseFloat(v) > 30000 && parseFloat(v) < 60000 && !String(v).includes('-')) {
                const utc_days = Math.floor(parseFloat(v) - 25569);
                const utc_value = utc_days * 86400000;
                return new Date(utc_value).toISOString().split('T')[0];
            }
            // ISO Date
            if(String(v).includes('T')) return String(v).split('T')[0];
            return String(v);
        };

        const cleanMoney = (v) => {
            if(!v) return 0;
            // Strip '$', ',', ' '
            let s = String(v).replace(/[$,\s]/g, '');
            let f = parseFloat(s);
            return isNaN(f) ? 0 : f;
        };

        const isUrgent = (item, type, date, status) => {
            if(status === 'Escalated') return true;
            if(String(item['ASAP or Standard Request'] || '').toLowerCase().includes('asap')) return true;
            // Quote > 30 days
            if(type === 'Quote' && date !== 'N/A' && status !== 'Completed') {
                const d = new Date(date);
                const diff = (new Date() - d) / (1000 * 3600 * 24);
                if(diff > 30) return true;
            }
            return false;
        };

        // --- DEEP SEEK PARSER ---
        // Recursively hunt for arrays in the JSON response
        const findArrays = (obj) => {
            let arrays = [];
            if (!obj || typeof obj !== 'object') return [];
            
            if (Array.isArray(obj)) {
                // If it looks like a record (has ID or Email or Status), keep it
                if(obj.length > 0 && typeof obj[0] === 'object') return [obj];
                return [];
            }

            // Check keys like "value" or "body" which usually hold the data
            if (obj.value && Array.isArray(obj.value)) arrays.push(obj.value);
            else if (obj.body) arrays.push(...findArrays(obj.body)); // Recurse into body
            else {
                // Brute force: check all keys
                Object.keys(obj).forEach(k => {
                    arrays.push(...findArrays(obj[k]));
                });
            }
            return arrays;
        };

        // --- MAIN LOGIC ---
        self.onmessage = function(e) {
            const { action, payload } = e.data;

            if (action === 'PARSE') {
                try {
                    const rawData = payload;
                    let combined = [];
                    
                    // Specific extraction based on known keys from your prompt, but with fallback
                    const sources = ['quotes', 'furniture', 'print', 'tech', 'feedback'];
                    
                    // If the payload is the structured object provided in prompt
                    sources.forEach(key => {
                        let extracted = [];
                        if (rawData[key]) extracted = findArrays(rawData[key]).flat();
                        
                        // Normalize
                        extracted.forEach(item => {
                            // Identify Type based on Key or Content
                            let type = key.charAt(0).toUpperCase() + key.slice(1);
                            if(type === 'Quotes') type = 'Quote'; // Singularize

                            // Mapping
                            let id = item['Q-Number'] || item['ID'] || item['ItemInternalId'] || 'N/A';
                            let date = cleanDate(item['Start time'] || item['Start Date'] || item['createdon'] || item['Date Entered']);
                            let cust = item['Customer'] || item['Company Name'] || item['Company \nName'] || 'Unknown';
                            let status = item['Status'] || item['Disposition'] || 'Pending';
                            let owner = item['Sales Rep'] || item['Assigned To'] || item['Furn Rep'] || item['Name'] || 'Unassigned';
                            let desc = item['Notes'] || item['Support Notes'] || item['Item Description/ Details'] || item['cr714_comments'] || '';
                            let val = cleanMoney(item['WB Item Sell Price TOTAL'] || item['Amount']);
                            let margin = cleanMoney(item['GP %'] || item['Margin %']);

                            // Fix Status Logic
                            let s = status.toLowerCase();
                            if(s.includes('won') || s.includes('complete') || s.includes('closed') || s.includes('lost')) status = 'Completed';
                            else if(s.includes('work') || s.includes('progress')) status = 'Working on';
                            else status = 'Pending';

                            // Feedback Heuristic
                            if(type === 'Feedback' && owner === 'Unassigned') {
                                // Try to extract name from comments
                                const match = desc.match(/Rep:?\s*([A-Za-z ]+)/i);
                                if(match) owner = match[1];
                            }

                            combined.push({
                                id, type, date, cust, status, owner, desc, val, margin,
                                urgent: isUrgent(item, type, date, status),
                                raw: item,
                                search: (id+cust+owner+desc).toLowerCase()
                            });
                        });
                    });

                    DB = combined;
                    
                    // Extract Lists for Filters
                    const owners = [...new Set(DB.map(x=>x.owner).filter(x=>x && x!=='Unassigned'))].sort();
                    const depts = [...new Set(DB.map(x=>x.type))].sort();
                    const counts = {
                        today: DB.filter(x => x.date === new Date().toISOString().split('T')[0]).length,
                        urgent: DB.filter(x => x.urgent).length,
                        total: DB.length
                    };

                    self.postMessage({ type: 'INIT', owners, depts, counts });
                    
                    // Trigger Initial Filter
                    self.postMessage({ type: 'READY' });

                } catch(err) {
                    console.error("Worker Parse Error", err);
                    self.postMessage({ type: 'ERROR', msg: err.message });
                }
            }

            if (action === 'FILTER') {
                const { search, dept, owner, status, dateRange } = payload;
                
                FILTERED = DB.filter(item => {
                    if (dept !== 'all' && item.type !== dept) return false;
                    if (owner !== 'all' && item.owner !== owner) return false;
                    if (status !== 'all' && item.status !== status) return false;
                    if (search && !item.search.includes(search)) return false;
                    if (dateRange && dateRange.length === 2) {
                        const d = new Date(item.date);
                        if(d < new Date(dateRange[0]) || d > new Date(dateRange[1])) return false;
                    }
                    return true;
                });

                // Sort by Date Descending
                FILTERED.sort((a,b) => new Date(b.date) - new Date(a.date));

                self.postMessage({ type: 'FILTERED', count: FILTERED.length });
            }

            if (action === 'GET_CHUNK') {
                const { start, end } = payload;
                self.postMessage({ type: 'CHUNK', chunk: FILTERED.slice(start, end), start });
            }

            if (action === 'GET_KANBAN') {
                const cols = { 'Pending': [], 'Working on': [], 'Escalated': [], 'Completed': [] };
                FILTERED.forEach(i => { if(cols[i.status] && cols[i.status].length < 50) cols[i.status].push(i); });
                self.postMessage({ type: 'KANBAN', cols });
            }

            if (action === 'ANALYZE') {
                // Feedback Sentiment
                const feedback = DB.filter(x => x.type === 'Feedback');
                const sentiment = {};
                feedback.forEach(f => {
                    const name = f.owner || 'Unknown';
                    if(!sentiment[name]) sentiment[name] = { total: 0, score: 0 };
                    sentiment[name].total++;
                    // Rudimentary Sentiment
                    if(f.desc.match(/good|great|fast|helpful/i)) sentiment[name].score++;
                    if(f.desc.match(/bad|slow|wrong|rude/i)) sentiment[name].score--;
                });

                // Volume Trend (Last 7 Days)
                const trend = {};
                FILTERED.forEach(f => {
                    if(!trend[f.date]) trend[f.date] = 0;
                    trend[f.date]++;
                });

                self.postMessage({ type: 'ANALYTICS', sentiment, trend });
            }
            
            if (action === 'EXPORT') {
                // Flatten for Excel
                const data = FILTERED.map(f => {
                    let row = { ID: f.id, Date: f.date, Customer: f.cust, Type: f.type, Status: f.status, Owner: f.owner, Value: f.val, Margin: f.margin, Notes: f.desc };
                    // Merge Raw
                    return { ...row, ...f.raw };
                });
                self.postMessage({ type: 'EXPORT_READY', data });
            }
        };
    </script>

    <script>
        // CONFIG
        const POWER_AUTOMATE_URL = "https://49b71dde44f8e78e89bc0440816209.07.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/72a7c76f7f874f3ea6e35b9598c2adfe/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wm4Fu7Iq4hv-v4Q7H327f8PaygWAoov0rmAAWUZg_Nk";
        const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401" } };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        
        // STATE
        const worker = new Worker(URL.createObjectURL(new Blob([document.getElementById('worker-script').innerText], {type: 'text/javascript'})));
        let state = { view: 'list', status: 'all', search: '', total: 0, datePicker: null };
        let charts = {};

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Check
            if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
            
            // Init Date Picker
            state.datePicker = flatpickr("#filter-date", { mode: "range", dateFormat: "Y-m-d", onChange: () => runFilter() });
            
            // Render Snippets
            const snippets = ["Left VM", "Sent Quote", "Wrong Address", "Completed", "Follow Up"];
            document.getElementById('quick-snippets').innerHTML = snippets.map(s => `<button onclick="addNote('${s}')" class="text-[10px] bg-slate-100 dark:bg-slate-700 px-2 rounded border border-theme hover:bg-blue-500 hover:text-white transition">${s}</button>`).join('');
        });

        // --- WORKER LISTENER ---
        worker.onmessage = (e) => {
            const d = e.data;
            if(d.type === 'INIT') {
                // Hydrate UI
                const fillSel = (id, arr) => {
                    const el = document.getElementById(id);
                    arr.forEach(x => { const o = document.createElement('option'); o.value=x; o.text=x; el.appendChild(o); });
                };
                fillSel('filter-dept', d.depts);
                fillSel('filter-owner', d.owners);
                fillSel('d-owner-select', d.owners);
                
                document.getElementById('kpi-today').innerText = d.counts.today;
                document.getElementById('kpi-urgent').innerText = d.counts.urgent;
                document.getElementById('kpi-total').innerText = d.counts.total;
                
                document.getElementById('auth-screen').classList.add('opacity-0');
                setTimeout(() => {
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-shell').classList.remove('hidden');
                }, 300);
            }
            else if(d.type === 'READY') runFilter();
            else if(d.type === 'FILTERED') {
                state.total = d.count;
                document.getElementById('record-count').innerText = `${d.count} Records`;
                document.getElementById('virtual-height').style.height = `${d.count * 64}px`;
                refreshView();
            }
            else if(d.type === 'CHUNK') renderList(d.chunk, d.start);
            else if(d.type === 'KANBAN') renderKanban(d.cols);
            else if(d.type === 'ANALYTICS') renderAnalytics(d.sentiment, d.trend);
            else if(d.type === 'EXPORT_READY') {
                const ws = XLSX.utils.json_to_sheet(d.data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Log_Export");
                XLSX.writeFile(wb, "Management_OS_Export.xlsx");
                Toastify({text: "Export Downloaded", className: "bg-green-500"}).showToast();
            }
            else if(d.type === 'ERROR') {
                document.getElementById('debug-msg').innerText = d.msg;
                document.getElementById('loading-state').classList.add('hidden'); // Show error
                alert("Data Error: " + d.msg);
            }
        };

        // --- ACTIONS ---
        async function login() {
            try { const r = await msalInstance.loginPopup({scopes: ["User.Read"]}); startApp(r.account.username); } 
            catch(e) { console.error(e); alert("Login Failed"); }
        }
        function bypassAuth() { startApp("offline@user.com"); }
        
        function startApp(email) {
            document.getElementById('user-email').innerText = email;
            document.getElementById('login-actions').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');
            
            // Start Fetch Loop
            fetchData();
            // Polling Schedule: T+0, T+5m, T+35m...
            setTimeout(() => {
                fetchData();
                setInterval(fetchData, 1800000); // 30 mins
            }, 300000); // 5 mins
        }

        async function fetchData() {
            document.getElementById('load-step').innerText = "Fetching Data...";
            document.getElementById('load-bar').style.width = "30%";
            
            try {
                const res = await fetch(POWER_AUTOMATE_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        requestType: "SyncLogs",
                        userEmail: document.getElementById('user-email').innerText,
                        filters: { startDate: new Date().toISOString(), department: "All" }
                    })
                });
                
                if(!res.ok) throw new Error("API returned " + res.status);
                
                document.getElementById('load-step').innerText = "Processing Data...";
                document.getElementById('load-bar').style.width = "70%";
                
                const json = await res.json();
                worker.postMessage({ action: 'PARSE', payload: json });
                
            } catch(e) {
                console.error(e);
                // Fallback for demo if API fails
                document.getElementById('debug-msg').innerText = "Connection Failed. Retrying...";
            }
        }

        function runFilter() {
            const payload = {
                search: document.getElementById('global-search').value.toLowerCase(),
                dept: document.getElementById('filter-dept').value,
                owner: document.getElementById('filter-owner').value,
                dateRange: state.datePicker.selectedDates,
                status: state.status
            };
            worker.postMessage({ action: 'FILTER', payload });
        }

        function refreshView() {
            if(state.view === 'list') {
                handleScroll(); // Trigger chunk fetch
            } else if(state.view === 'kanban') {
                worker.postMessage({ action: 'GET_KANBAN' });
            } else if(state.view === 'analytics') {
                worker.postMessage({ action: 'ANALYZE' });
            }
        }

        // --- RENDERERS ---
        function renderList(chunk, startY) {
            const container = document.getElementById('virtual-content');
            container.style.transform = `translateY(${startY * 64}px)`;
            
            container.innerHTML = chunk.map(t => {
                const marginClass = t.margin > 0 && t.margin < 0.15 ? 'text-red-500 font-bold' : (t.margin > 0.3 ? 'text-green-600 font-bold' : '');
                const valClass = t.val > 10000 ? 'text-emerald-600 font-bold' : '';
                const statusColor = t.status === 'Completed' ? 'badge-green' : (t.status === 'Pending' ? 'badge-blue' : 'badge-yellow');
                
                return `
                <div class="ticket-card ${t.urgent ? 'urgent' : ''} ${t.val > 5000 ? 'high-value' : ''}" onclick='openDetail(${JSON.stringify(t)})'>
                    <span class="font-mono font-bold text-xs opacity-70">#${String(t.id).substring(0,6)}</span>
                    <span class="text-xs">${t.date}</span>
                    <span class="font-bold truncate">${t.cust}</span>
                    <span class="badge bg-slate-100 dark:bg-slate-800 w-fit">${t.type}</span>
                    <span class="badge ${statusColor} w-fit">${t.status}</span>
                    <span class="truncate text-xs">${t.owner}</span>
                    <span class="font-mono text-right ${valClass}">${t.val ? '$'+t.val.toLocaleString() : '-'}</span>
                    <span class="font-mono text-right ${marginClass}">${t.margin ? (t.margin*100).toFixed(0)+'%' : '-'}</span>
                    <span class="truncate text-xs opacity-50">${t.desc}</span>
                </div>`;
            }).join('');
        }

        function renderKanban(cols) {
            const c = document.getElementById('view-kanban');
            c.innerHTML = `<div class="kanban-board">${Object.keys(cols).map(k => `
                <div class="kanban-col">
                    <div class="kanban-header"><span>${k}</span><span class="badge bg-slate-100">${cols[k].length}</span></div>
                    <div class="kanban-body">${cols[k].map(t => `
                        <div class="kanban-card text-xs" onclick='openDetail(${JSON.stringify(t)})'>
                            <div class="flex justify-between mb-2">
                                <span class="font-bold">#${t.id}</span>
                                <span class="badge bg-slate-100">${t.type}</span>
                            </div>
                            <div class="font-bold text-sm mb-1 truncate">${t.cust}</div>
                            <div class="opacity-70 truncate">${t.desc}</div>
                        </div>`).join('')}
                    </div>
                </div>`).join('')}</div>`;
        }

        function renderAnalytics(sentiment, trend) {
            const c = document.getElementById('view-analytics');
            // Prepare Chart Data
            const labels = Object.keys(trend).sort();
            const data = labels.map(l => trend[l]);
            
            // Prepare Sentiment Table
            const sentRows = Object.entries(sentiment).sort((a,b) => b[1].score - a[1].score).map(([name, s]) => `
                <div class="flex justify-between items-center p-3 border-b border-theme text-xs">
                    <span class="font-bold">${name}</span>
                    <div class="flex gap-4">
                        <span>${s.total} Tickets</span>
                        <span class="${s.score > 0 ? 'text-green-500' : 'text-red-500'} font-bold">Score: ${s.score}</span>
                    </div>
                </div>`).join('');

            c.innerHTML = `
                <div class="grid grid-cols-2 gap-6 mb-8">
                    <div class="bg-panel rounded-xl border border-theme p-4 h-64">
                        <h3 class="font-bold mb-4">Volume Over Time</h3>
                        <canvas id="chart-trend"></canvas>
                    </div>
                    <div class="bg-panel rounded-xl border border-theme p-4 h-64 overflow-y-auto">
                        <h3 class="font-bold mb-4">Rep Sentiment Analysis</h3>
                        <div>${sentRows}</div>
                    </div>
                </div>`;
            
            new Chart(document.getElementById('chart-trend'), {
                type: 'line',
                data: { labels, datasets: [{ label: 'Tickets', data, borderColor: '#3b82f6', tension: 0.4 }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // --- UI UTILS ---
        function setView(v) {
            state.view = v;
            document.querySelectorAll('[id^="nav-"]').forEach(b => b.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white'));
            document.getElementById('nav-'+v).classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white');
            document.querySelectorAll('[id^="view-"]').forEach(d => d.classList.add('hidden'));
            document.getElementById('view-'+v).classList.remove('hidden');
            if(v === 'list') document.getElementById('view-'+v).classList.add('flex'); // Restore flex
            refreshView();
        }

        function setStatus(s) {
            state.status = s;
            document.querySelectorAll('[id^="tab-"]').forEach(b => b.classList.add('opacity-60'));
            document.getElementById('tab-'+s.toLowerCase()).classList.remove('opacity-60');
            runFilter();
        }

        function handleScroll() {
            if(state.view !== 'list') return;
            const el = document.getElementById('virtual-scroller');
            const start = Math.floor(el.scrollTop / 64);
            const end = start + 20;
            worker.postMessage({ action: 'GET_CHUNK', payload: { start, end } });
        }

        function openDetail(t) {
            const set = (id, v) => document.getElementById(id).innerText = v || '--';
            set('d-id', t.id); set('d-cust', t.cust); set('d-badge', t.status); set('d-dept', t.type); set('d-date', t.date);
            set('d-val', t.val ? '$'+t.val.toLocaleString() : '-'); set('d-margin', t.margin ? (t.margin*100).toFixed(1)+'%' : '-');
            document.getElementById('d-owner-select').value = t.owner;
            document.getElementById('d-notes').value = t.desc;
            
            // Raw Grid
            document.getElementById('d-raw').innerHTML = Object.entries(t.raw).map(([k,v]) => 
                (typeof v !== 'object') ? `<div class="raw-grid"><div class="raw-key" title="${k}">${k.substring(0,20)}</div><div class="raw-val">${v}</div></div>` : ''
            ).join('');
            
            document.getElementById('focus-overlay').classList.add('active');
        }

        function closeFocus() { document.getElementById('focus-overlay').classList.remove('active'); }
        function addNote(s) { document.getElementById('d-notes').value += ` [${s}]`; }
        function updateStatus(s) { document.getElementById('d-badge').innerText = s; Toastify({text: "Status Updated", duration: 1000}).showToast(); closeFocus(); }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); }
        function exportExcel() { worker.postMessage({ action: 'EXPORT' }); }
        let searchTimeout;
        function debounceSearch() { clearTimeout(searchTimeout); searchTimeout = setTimeout(runFilter, 300); }
    </script>
