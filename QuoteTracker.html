    <style>
        body { background-color: #f3f4f6; color: #1f2937; }
        
        /* Glass Panel */
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        /* Loader */
        #loader { position: fixed; inset: 0; background: #111827; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Smart Grid Styles */
        .smart-table th { position: sticky; top: 0; background-color: #f8fafc; z-index: 20; user-select: none; }
        .smart-table th.dragging { opacity: 0.5; background: #e5e7eb; }
        .smart-table th.drag-over { border-left: 2px solid #cc0000; }
        
        .filter-row th { top: 40px; z-index: 19; background-color: #f1f5f9; padding: 4px; }
        .filter-input { width: 100%; font-size: 0.75rem; padding: 2px 6px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .filter-input:focus { outline: none; border-color: #cc0000; box-shadow: 0 0 0 1px #cc0000; }

        .sort-icon { display: inline-block; margin-left: 4px; font-size: 0.7rem; color: #94a3b8; transition: transform 0.2s; }
        .sort-asc .sort-icon { color: #cc0000; transform: rotate(180deg); }
        .sort-desc .sort-icon { color: #cc0000; transform: rotate(0deg); }

        /* Action Buttons on Hover */
        tr.group:hover .quick-actions { opacity: 1; pointer-events: auto; }
        .quick-actions { opacity: 0; transition: opacity 0.2s; pointer-events: none; }

        /* Modal */
        .modal-overlay { background-color: rgba(17, 24, 39, 0.7); backdrop-filter: blur(4px); }
        .tab-btn { border-bottom: 2px solid transparent; opacity: 0.6; transition: all 0.2s; }
        .tab-btn.active { border-color: #cc0000; color: #cc0000; opacity: 1; font-weight: 600; }
        .click-copy { cursor: pointer; border-bottom: 1px dashed #9ca3af; }
        .click-copy:hover { color: #cc0000; border-color: #cc0000; }
    </style>
</head>

    <script>
        // --- SMART GRID CLASS (The Engine) ---
        class SmartGrid {
            constructor(containerId, data, columns, options = {}) {
                this.container = document.getElementById(containerId);
                this.allData = data;
                this.columns = columns; // [{key, label, type, width, render?}]
                this.options = options; // { onClick, onTotal }
                this.state = {
                    sortKey: null,
                    sortDir: 'asc',
                    filters: {}, // { key: 'value' }
                    colOrder: columns.map(c => c.key)
                };
                
                // Load Saved State
                const saved = localStorage.getItem(`grid_state_${containerId}`);
                if(saved) {
                    try { const s = JSON.parse(saved); this.state.colOrder = s.colOrder || this.state.colOrder; } catch(e){}
                }

                this.filteredData = [...data];
                this.render();
            }

            updateData(newData) {
                this.allData = newData;
                this.processData();
            }

            processData() {
                // 1. Filter
                this.filteredData = this.allData.filter(row => {
                    return Object.entries(this.state.filters).every(([key, term]) => {
                        if(!term) return true;
                        const val = String(row[key] || '').toLowerCase();
                        return val.includes(term.toLowerCase());
                    });
                });

                // 2. Sort
                if(this.state.sortKey) {
                    const k = this.state.sortKey;
                    const d = this.state.sortDir === 'asc' ? 1 : -1;
                    this.filteredData.sort((a,b) => {
                        const valA = a[k], valB = b[k];
                        if(valA < valB) return -1 * d;
                        if(valA > valB) return 1 * d;
                        return 0;
                    });
                }

                // 3. Callback
                if(this.options.onTotal) this.options.onTotal(this.filteredData);
                
                this.renderBody();
            }

            render() {
                this.container.innerHTML = `
                    <table class="w-full text-left border-collapse smart-table">
                        <thead class="text-xs text-gray-500 uppercase font-semibold bg-gray-50 border-b">
                            <tr id="${this.container.id}-header-row"></tr>
                            <tr id="${this.container.id}-filter-row" class="filter-row bg-gray-50 border-b"></tr>
                        </thead>
                        <tbody id="${this.container.id}-body" class="divide-y divide-gray-100 text-xs"></tbody>
                    </table>
                `;
                this.renderHeaders();
                this.processData();
            }

            renderHeaders() {
                const hRow = document.getElementById(`${this.container.id}-header-row`);
                const fRow = document.getElementById(`${this.container.id}-filter-row`);
                hRow.innerHTML = ''; fRow.innerHTML = '';

                this.state.colOrder.forEach(key => {
                    const col = this.columns.find(c => c.key === key);
                    if(!col) return;

                    // Header Cell (Draggable)
                    const th = document.createElement('th');
                    th.className = "px-6 py-3 cursor-pointer hover:bg-gray-100 transition relative group";
                    th.draggable = true;
                    th.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span>${col.label}</span>
                            <span class="sort-icon"><i class="fas fa-sort"></i></span>
                        </div>
                    `;
                    
                    // Sort Event
                    th.onclick = () => {
                        if(this.state.sortKey === key) {
                            this.state.sortDir = this.state.sortDir === 'asc' ? 'desc' : 'asc';
                        } else {
                            this.state.sortKey = key;
                            this.state.sortDir = 'asc';
                        }
                        // Visual update
                        document.querySelectorAll(`#${this.container.id} .sort-icon`).forEach(i => i.innerHTML = '<i class="fas fa-sort"></i>');
                        th.querySelector('.sort-icon').innerHTML = this.state.sortDir === 'asc' ? '<i class="fas fa-sort-up"></i>' : '<i class="fas fa-sort-down"></i>';
                        this.processData();
                    };

                    // Drag Events
                    th.ondragstart = (e) => { e.dataTransfer.setData('text/plain', key); th.classList.add('dragging'); };
                    th.ondragend = () => { th.classList.remove('dragging'); };
                    th.ondragover = (e) => { e.preventDefault(); th.classList.add('drag-over'); };
                    th.ondragleave = () => { th.classList.remove('drag-over'); };
                    th.ondrop = (e) => {
                        e.preventDefault();
                        th.classList.remove('drag-over');
                        const draggedKey = e.dataTransfer.getData('text');
                        if(draggedKey === key) return;
                        
                        // Reorder
                        const oldIdx = this.state.colOrder.indexOf(draggedKey);
                        const newIdx = this.state.colOrder.indexOf(key);
                        this.state.colOrder.splice(oldIdx, 1);
                        this.state.colOrder.splice(newIdx, 0, draggedKey);
                        
                        localStorage.setItem(`grid_state_${this.container.id}`, JSON.stringify(this.state));
                        this.render(); // Full Re-render
                    };

                    hRow.appendChild(th);

                    // Filter Cell
                    const fTh = document.createElement('th');
                    fTh.className = "px-4 py-2 bg-gray-50 border-b";
                    fTh.innerHTML = `<input type="text" class="filter-input" placeholder="Filter..." value="${this.state.filters[key] || ''}">`;
                    fTh.querySelector('input').oninput = (e) => {
                        this.state.filters[key] = e.target.value;
                        this.processData();
                    };
                    fRow.appendChild(fTh);
                });
            }

            renderBody() {
                const tbody = document.getElementById(`${this.container.id}-body`);
                
                // Limit render to 200 for performance
                const subset = this.filteredData.slice(0, 200);
                
                tbody.innerHTML = subset.map(row => {
                    // Row Styling for Urgency
                    const isUrgent = (row.priority || "").toLowerCase().includes('asap');
                    const rowClass = `group hover:bg-gray-50 cursor-pointer border-b last:border-0 transition-colors ${isUrgent ? 'bg-red-50/50' : ''}`;
                    
                    let cells = this.state.colOrder.map(key => {
                        const col = this.columns.find(c => c.key === key);
                        let val = row[key];
                        if(col.render) val = col.render(val, row);
                        return `<td class="px-6 py-3 ${col.cls || ''}">${val || ''}</td>`;
                    }).join('');

                    // Add Quick Action Cell
                    cells += `<td class="px-6 py-3 w-10 text-right"><button class="quick-actions text-gray-400 hover:text-brand" onclick="event.stopPropagation(); emailRep('${row.id}', '${row.rep}')" title="Quick Email"><i class="fas fa-envelope"></i></button></td>`;

                    return `<tr class="${rowClass}" onclick="window.appOpenDetail('${row.id}')">${cells}</tr>`;
                }).join('');
            }
        }

        // --- APP LOGIC ---
        const FLOW_URL = "https://49b71dde44f8e78e89bc0440816209.07.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/72a7c76f7f874f3ea6e35b9598c2adfe/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wm4Fu7Iq4hv-v4Q7H327f8PaygWAoov0rmAAWUZg_Nk";
        let RAW_DATA = [], MAIN_GRID = null, XREF_GRID = null, REP_GRID = null;
        let POLL_START = 0;

        // --- COLUMNS DEF ---
        const MAIN_COLS = [
            { key: 'source', label: 'Log Source', render: (v) => getSourceBadge(v) },
            { key: 'id', label: 'Reference ID', cls: 'font-mono font-bold text-brand' },
            { key: 'date', label: 'Entry Date', render: (v) => fmtDate(v) },
            { key: 'daysOpen', label: 'Age', render: (v) => getAgeBadge(v) },
            { key: 'customer', label: 'Customer', cls: 'font-medium text-gray-900 truncate max-w-[200px]' },
            { key: 'rep', label: 'Sales Rep' },
            { key: 'amount', label: 'Value ($)', cls: 'text-right font-mono', render: (v) => fmtMoney(v) },
            { key: 'gp', label: 'GP %', cls: 'text-center text-blue-600 font-mono' },
            { key: 'status', label: 'Status', cls: 'text-center', render: (v) => getStatusBadge(v) }
        ];

        document.addEventListener('DOMContentLoaded', () => { 
            initFlow(); 
            setInterval(() => backgroundSync(), 1800000);
            window.appOpenDetail = openDetail; // Expose to global for HTML string onclick
        });
        
        document.getElementById('fileInput').addEventListener('change', handleManualFile);

        // --- DATA SYNC ---
        async function initFlow() {
            setLoader(true, "Connecting...");
            try {
                let res = await fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requestType: "InitData", version: "11.2" }) });
                if (res.status === 202) startPolling(res.headers.get('location'));
                else if (res.ok) processData(await res.json());
                else throw new Error(res.status);
            } catch (e) { setLoader(false); alert("Offline Mode / Connection Failed"); }
        }

        async function backgroundSync() {
            document.getElementById('status-dot').className = "w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse";
            try {
                let res = await fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requestType: "Background" }) });
                if(res.status === 202) startPolling(res.headers.get('location'), true);
            } catch(e) {}
        }

        function startPolling(url, isBg = false) {
            POLL_START = Date.now();
            const poll = async () => {
                if(Date.now() - POLL_START > 600000) { if(!isBg) setLoader(false); return; }
                try {
                    const res = await fetch(url);
                    if(res.status === 200) processData(await res.json(), isBg);
                    else if(res.status === 202 || res.status === 502) setTimeout(poll, 3000);
                } catch(e) { setTimeout(poll, 5000); }
            };
            poll();
        }

        // --- PROCESSING ---
        function processData(input, isBg = false) {
            let rows = [];
            try {
                if (typeof input.value === 'string') rows = JSON.parse(input.value);
                else if (Array.isArray(input.value)) rows = input.value;
                else if (Array.isArray(input)) rows = input;
            } catch(e){}

            if (!rows.length) { if(!isBg) setLoader(false); return; }

            const now = new Date();
            RAW_DATA = rows.map(r => {
                const date = parseDate(r["Start Date"] || r["Start time"] || r["Date Entered"] || r["Created"]);
                const amt = parseMoney(r["Sell"] || r["WB Item Sell Price TOTAL"] || r["Amount"] || r["Total"]);
                const status = r["Disposition"] || r["Assigned To"] || r["Status"] || "Pending";
                const priority = r["Inquiry Type"] || r["ASAP or Standard Request"] || "Standard";
                
                // Auto-Detect Source
                let src = "General";
                if(r["ItemInternalId"]) src = "Furniture Log";
                else if(r["Q-Number"] || (priority.includes("PO"))) src = "Quote Request";
                else if(r["Comments"] && !r["Furniture Notes"]) src = "Form Feedback";

                // Days Open Calc
                let days = 0;
                if(date && !isClosed({status})) days = Math.floor((now - date)/(86400000));

                return {
                    id: r["ID"] || r["Q-Number"] || r["Id"] || "UNK",
                    source: src,
                    date: date,
                    daysOpen: days,
                    rep: r["Furn Rep"] || r["Name"] || r["Furniture Rep"] || "Unassigned",
                    customer: (r["Company \nName"] || r["Company Name"] || r["Customer"] || "N/A").replace(/\n/g, " "),
                    accountNum: r["Account _x0023_"] || r["Account Number"] || r["CustNum"] || "",
                    amount: safeNum(amt),
                    gp: formatPct(r["Margin %"] || r["GP %"]),
                    category: r["Category"] || "General",
                    status: status,
                    priority: priority,
                    notes: r["Furniture Notes"] || r["Notes"] || r["Comments"] || "",
                    qNotes: r["Qualifier/Quoter Notes"] || r["Resolution Notes"] || "",
                    install: r["Install/ Assembly"] || r["Installation"] || "No",
                    route: r["Route Code"] || "N/A",
                    contact: r["Name"] || "",
                    phone: r["Phone Number"] || "",
                    email: r["Email Address"] || "",
                    billingAddr: (r["Billing Address"] || "").replace(/\n/g, ", "),
                    delAddr: (r["Delivery Address"] || "").replace(/\n/g, ", "),
                    itemCount: r["_x0023_ of Items Quoted"] || r["Item Count"] || "0",
                    rowId: r["ItemInternalId"] || r["ID"]
                };
            });

            // Initial Grid Render
            if(!MAIN_GRID) {
                MAIN_GRID = new SmartGrid("main-grid-container", RAW_DATA, MAIN_COLS, {
                    onTotal: (data) => {
                        const sum = data.reduce((a,b) => a + b.amount, 0);
                        document.getElementById('grid-total').innerText = fmtMoney(sum);
                        document.getElementById('grid-count').innerText = `${data.length} Records`;
                    }
                });
            } else {
                MAIN_GRID.updateData(RAW_DATA);
            }

            renderStats();
            
            if(!isBg) {
                setLoader(false);
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('view-dashboard').classList.remove('hidden');
                document.getElementById('view-dashboard').classList.add('flex');
            }
            document.getElementById('status-dot').className = "w-1.5 h-1.5 rounded-full bg-green-500";
            document.getElementById('last-updated').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }

        // --- DASHBOARD & STATS ---
        function renderStats() {
            // Rep Grid logic
            const repStats = {};
            RAW_DATA.forEach(r => {
                if(!repStats[r.rep]) repStats[r.rep] = { name: r.rep, count: 0, val: 0, won: 0 };
                const s = repStats[r.rep];
                s.count++;
                s.val += r.amount;
                if(isWon(r)) s.won++;
            });
            
            const repData = Object.values(repStats).map(s => ({
                ...s, 
                winRate: safeDiv(s.won, s.count),
                avgVal: safeDiv(s.val, s.count)
            }));

            if(!REP_GRID) {
                REP_GRID = new SmartGrid("rep-grid-container", repData, [
                    { key: 'name', label: 'Rep Name' },
                    { key: 'count', label: 'Count', cls: 'text-center font-mono' },
                    { key: 'val', label: 'Total ($)', cls: 'text-right font-mono', render: fmtMoney },
                    { key: 'winRate', label: 'Win Rate', cls: 'text-center font-bold text-blue-600', render: (v)=> (v*100).toFixed(0)+'%' },
                    { key: 'avgVal', label: 'Avg Deal', cls: 'text-right text-gray-500', render: fmtMoney }
                ]);
            } else {
                REP_GRID.updateData(repData);
            }

            // KPIs
            const total = RAW_DATA.reduce((a,b) => a + b.amount, 0);
            const won = RAW_DATA.filter(r => isWon(r)).length;
            const rate = safeDiv(won, RAW_DATA.length);
            const stalled = RAW_DATA.filter(r => r.daysOpen > 30).length;
            const openVal = RAW_DATA.filter(r => !isClosed(r)).reduce((a,b) => a + b.amount, 0);

            document.getElementById('kpi-value').innerText = fmtMoneyShort(total);
            document.getElementById('kpi-winrate').innerText = (rate * 100).toFixed(1) + "%";
            document.getElementById('kpi-pending').innerText = stalled;
            document.getElementById('kpi-projected').innerText = fmtMoneyShort(openVal * rate);

            // Charts
            const ageData = { '0-7':0, '8-14':0, '15-30':0, '30+':0 };
            const catData = {};
            RAW_DATA.forEach(r => {
                catData[r.category] = (catData[r.category]||0)+1;
                if(!isClosed(r)) {
                    if(r.daysOpen <= 7) ageData['0-7']++;
                    else if(r.daysOpen <= 14) ageData['8-14']++;
                    else if(r.daysOpen <= 30) ageData['15-30']++;
                    else ageData['30+']++;
                }
            });

            if(CHARTS.age) CHARTS.age.destroy();
            if(CHARTS.assign) CHARTS.assign.destroy();
            
            const opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } };
            CHARTS.age = new Chart(document.getElementById('chart-age'), { type: 'bar', data: { labels: Object.keys(ageData), datasets: [{ label: 'Quotes', data: Object.values(ageData), backgroundColor: '#cc0000', borderRadius: 4 }] }, options: opts });
            CHARTS.assign = new Chart(document.getElementById('chart-assign'), { type: 'doughnut', data: { labels: Object.keys(catData).slice(0,5), datasets: [{ data: Object.values(catData).slice(0,5), backgroundColor: ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'] }] }, options: opts });
            
            // Kanban Update
            const kbCols = { std:[], asap:[], prog:[], done:[] };
            RAW_DATA.forEach(r => {
                if(isWon(r) || isClosed(r)) kbCols.done.push(r);
                else if(r.status.toLowerCase().includes('assign') || r.status.toLowerCase().includes('quote')) kbCols.prog.push(r);
                else if(r.priority.toLowerCase().includes('asap')) kbCols.asap.push(r);
                else kbCols.std.push(r);
            });
            for(const [k, list] of Object.entries(kbCols)) {
                document.getElementById(`kb-count-${k}`).innerText = list.length;
                document.getElementById(`kb-col-${k}`).innerHTML = list.map(r => `
                    <div class="kanban-card bg-white p-3 rounded-lg border shadow-sm cursor-pointer mb-3 border-l-4 border-l-${getKanbanColor(k)}-500" onclick="appOpenDetail('${r.id}')">
                        <div class="flex justify-between items-start mb-2"><span class="font-mono text-[10px] text-gray-500 font-bold">${r.id}</span>${getSourceBadge(r.source, true)}</div>
                        <div class="font-bold text-sm text-gray-900 mb-1 truncate">${r.customer}</div>
                        <div class="flex justify-between items-center text-xs"><span class="text-gray-500">${r.rep.split(' ')[0]}</span><span class="font-mono font-bold text-gray-700">${fmtMoneyShort(r.amount)}</span></div>
                    </div>`).join('');
            }
        }

        // --- UTILS ---
        function parseDate(s) { if(!s) return null; if(String(s).includes('T')) return new Date(s); const n=parseFloat(s); if(isNaN(n)) return null; return new Date(Math.round((n-25569)*86400*1000)); }
        function parseMoney(v) { if(typeof v === 'number') return v; return parseFloat(String(v).replace(/[^0-9.-]+/g,"")) || 0; }
        function safeNum(v) { return (isNaN(v) || v === null || v === Infinity) ? 0 : v; }
        function safeDiv(a, b) { return (b === 0 || !b) ? 0 : a / b; }
        function fmtMoney(v) { return '$' + safeNum(v).toLocaleString(undefined, {minimumFractionDigits: 2}); }
        function fmtMoneyShort(v) { return safeNum(v) > 1000 ? '$' + (v/1000).toFixed(1) + 'k' : '$' + Math.floor(safeNum(v)); }
        function formatPct(v) { let n=parseFloat(v); if(isNaN(n)) return '-'; if(n<1) n=n*100; return n.toFixed(1)+'%'; }
        function fmtDate(d) { return d ? d.toLocaleDateString() : '-'; }
        
        function isClosed(r) { return ['killed','lost','completed','won','ordered'].some(x=>(r.status||"").toLowerCase().includes(x)); }
        function isWon(r) { return ['completed','won','ordered'].some(x=>(r.status||"").toLowerCase().includes(x)); }

        function getSourceBadge(s, tiny=false) {
            let c = "bg-gray-100 text-gray-600";
            if(s.includes("Furniture")) c = "bg-indigo-100 text-indigo-700 border-indigo-200";
            if(s.includes("Quote")) c = "bg-purple-100 text-purple-700 border-purple-200";
            if(s.includes("Feedback")) c = "bg-orange-100 text-orange-700 border-orange-200";
            return `<span class="${tiny ? 'px-1.5 py-px text-[9px]' : 'px-2 py-0.5 text-[10px]'} rounded border font-bold uppercase ${c}">${s}</span>`;
        }
        function getStatusBadge(s) {
            const l = (s||"").toLowerCase();
            let c = "bg-gray-100 text-gray-600";
            if(l.includes('won') || l.includes('order')) c = "bg-green-100 text-green-700";
            else if(l.includes('kill') || l.includes('lost')) c = "bg-red-100 text-red-700";
            else if(l.includes('assign')) c = "bg-blue-100 text-blue-700";
            return `<span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${c}">${s}</span>`;
        }
        function getAgeBadge(days) {
            if(days > 30) return `<span class="text-red-600 font-bold">${days}d</span>`;
            if(days > 14) return `<span class="text-yellow-600 font-bold">${days}d</span>`;
            return `<span class="text-green-600">${days}d</span>`;
        }
        function getKanbanColor(k) { if(k==='asap') return 'red'; if(k==='prog') return 'blue'; if(k==='done') return 'green'; return 'gray'; }

        function openDetail(id) {
            const r = RAW_DATA.find(x => x.id === id); if(!r) return;
            document.getElementById('m-title').innerText = r.customer;
            document.getElementById('m-id-display').innerText = `REF: ${r.id}`;
            document.getElementById('m-acct-display').innerText = r.accountNum ? `ACCT: ${r.accountNum}` : '';
            document.getElementById('m-source-badge').innerHTML = getSourceBadge(r.source, false);
            document.getElementById('m-status-badge').innerHTML = getStatusBadge(r.status);
            document.getElementById('xref-acct-val').innerText = r.accountNum || "N/A";

            // Populate Cross-Ref
            const acctKey = r.accountNum.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
            const related = RAW_DATA.filter(x => x.id !== r.id && x.accountNum.replace(/[^a-zA-Z0-9]/g, "").toUpperCase() === acctKey);
            
            // Use XREF GRID
            if(!XREF_GRID) {
                XREF_GRID = new SmartGrid("xref-container", related, [
                    { key: 'source', label: 'Src', render: (v)=>getSourceBadge(v,true) },
                    { key: 'id', label: 'ID', cls: 'font-mono text-blue-600 font-bold' },
                    { key: 'date', label: 'Date', render: fmtDate },
                    { key: 'status', label: 'Status' },
                    { key: 'notes', label: 'Note Preview', cls: 'truncate max-w-[150px] text-gray-400 italic' }
                ]);
            } else { XREF_GRID.updateData(related); }

            // Content
            let html = `
                <div class="grid grid-cols-4 gap-4 mb-6">
                    <div class="bg-white p-4 rounded-lg border shadow-sm"><div class="text-[10px] text-gray-400 font-bold uppercase">Rep</div><div class="font-bold text-gray-900 truncate">${r.rep}</div></div>
                    <div class="bg-white p-4 rounded-lg border shadow-sm"><div class="text-[10px] text-gray-400 font-bold uppercase">Value</div><div class="font-mono font-bold text-green-600 text-lg">${fmtMoney(r.amount)}</div></div>
                    <div class="bg-white p-4 rounded-lg border shadow-sm"><div class="text-[10px] text-gray-400 font-bold uppercase">GP %</div><div class="font-mono font-bold text-blue-600 text-lg">${r.gp}</div></div>
                    <div class="bg-white p-4 rounded-lg border shadow-sm"><div class="text-[10px] text-gray-400 font-bold uppercase">Date</div><div class="font-bold text-gray-900">${fmtDate(r.date)}</div></div>
                </div>
                <div class="bg-white p-5 rounded-lg border shadow-sm mb-6">
                    <h4 class="text-xs font-bold text-gray-400 uppercase mb-3 border-b pb-2">Logistics & Contact</h4>
                    <div class="grid grid-cols-2 gap-6 text-xs">
                        <div>
                            <span class="block text-gray-400 mb-1">Shipping</span>
                            <div>${r.delAddr || r.delInfo || 'N/A'}</div>
                            <div class="mt-2 text-gray-400">Route: <span class="text-gray-900 font-mono">${r.route}</span></div>
                        </div>
                        <div>
                            <span class="block text-gray-400 mb-1">Contact</span>
                            <div class="font-bold">${r.contact}</div>
                            <div class="cursor-pointer hover:text-brand" onclick="copyText('${r.email}')">${r.email}</div>
                            <div class="cursor-pointer hover:text-brand" onclick="copyText('${r.phone}')">${r.phone}</div>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-6 h-48">
                    <div class="flex flex-col h-full"><h4 class="text-xs font-bold text-gray-500 uppercase mb-2">Notes</h4><div class="bg-white border p-3 rounded text-xs text-gray-600 flex-1 overflow-y-auto whitespace-pre-wrap">${r.notes}</div></div>
                    <div class="flex flex-col h-full"><h4 class="text-xs font-bold text-gray-500 uppercase mb-2">Resolution</h4><div class="bg-yellow-50 border border-yellow-200 p-3 rounded text-xs text-yellow-800 flex-1 overflow-y-auto whitespace-pre-wrap">${r.qNotes}</div></div>
                </div>`;
            document.getElementById('mview-details').innerHTML = html;

            switchModalTab('details');
            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        // --- HELPERS ---
        function switchModalTab(t) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('mtab-'+t).classList.add('active');
            document.getElementById('mview-details').classList.add('hidden');
            document.getElementById('mview-related').classList.add('hidden');
            document.getElementById('mview-'+t).classList.remove('hidden');
        }
        function forceCloseModal() { document.getElementById('detailModal').classList.add('hidden'); document.getElementById('detailModal').classList.remove('flex'); }
        function closeModal(e) { if(e.target.id === 'detailModal') forceCloseModal(); }
        function copyText(t) { if(t) navigator.clipboard.writeText(t); }
        function copyEmailBody() { navigator.clipboard.writeText(window.currentEmailBody).then(()=>alert("Draft Copied")); }
        function emailRep(id, rep) { window.location.href = `mailto:?subject=Ref: ${id}&body=Hi ${rep},%0D%0A%0D%0AAny update?`; }
        function skipToManual() { setLoader(false); document.getElementById('fileInput').click(); }
        function handleManualFile(e) { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=(ev)=>{ try{processData(JSON.parse(ev.target.result))}catch(x){alert("Invalid JSON")} }; r.readAsText(f); }
        function setLoader(s,m) { document.getElementById('loader').style.display = s?'flex':'none'; if(m) document.getElementById('loader-msg').innerText = m; }
        
        function switchTab(id) {
            document.querySelectorAll('.view-panel').forEach(p => { p.classList.add('hidden'); p.classList.remove('flex'); });
            const v = document.getElementById('view-'+id);
            v.classList.remove('hidden');
            if(id !== 'kanban') v.classList.add('flex');
            document.querySelectorAll('nav button').forEach(b => { b.classList.remove('border-brand', 'text-brand'); b.classList.add('border-transparent', 'text-gray-500'); });
            document.getElementById('tab-'+id).classList.remove('border-transparent', 'text-gray-500');
            document.getElementById('tab-'+id).classList.add('border-brand', 'text-brand');
            if(id === 'dashboard' || id === 'trends') renderStats();
        }
        function resetGrid() { localStorage.clear(); window.location.reload(); }
        function exportTable(id) { const wb = XLSX.utils.table_to_book(document.getElementById(id)); XLSX.writeFile(wb, "Report.xlsx"); }
    </script>
</body>
</html>
