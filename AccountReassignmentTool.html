<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daytona Reassignment v25.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.6);
            --primary: #0284c7; /* Sky Blue */
            --text-main: #0f172a;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius: 0.75rem;
        }

        /* BACKGROUND */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at 50% 100%, #fcd34d, #f97316, #0ea5e9, #0f172a);
            background-size: cover;
            background-attachment: fixed;
            color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; 
        }

        /* GLASS LOADER */
        #global-loader { 
            position: fixed; inset: 0; z-index: 9999; 
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .loader-card {
            width: 450px; padding: 2.5rem; text-align: center; background: rgba(255,255,255,0.95);
            border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .loader-spinner { width: 50px; height: 50px; border: 5px solid #e0f2fe; border-top: 5px solid #0284c7; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1.5rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .progress-track { width: 100%; height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-top: 1rem; }
        .progress-fill { height: 100%; background: #0284c7; width: 0%; transition: width 0.5s ease; }

        /* LAYOUT */
        #main-app-container { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0.5rem 1rem; }
        .app-grid { display: grid; grid-template-columns: 400px 1fr; gap: 1rem; flex-grow: 1; overflow: hidden; height: 100%; }
        
        .col-left { display: flex; flex-direction: column; overflow: hidden; min-height: 0; gap: 1rem; }
        .col-right { display: flex; flex-direction: column; overflow: hidden; min-height: 0; gap: 1rem; }

        /* CARDS */
        .card { background: rgba(255,255,255,0.9); border: 1px solid rgba(255,255,255,0.6); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(12px); }
        .card-header { padding: 0.75rem; background: rgba(255,255,255,0.7); font-weight: 600; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }

        /* LISTS */
        .gallery-list { overflow-y: auto; flex-grow: 1; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .gallery-item { padding: 0.75rem; background: rgba(255,255,255,0.95); border: 1px solid #e2e8f0; border-radius: 0.5rem; cursor: pointer; transition: all 0.15s; display: grid; grid-template-columns: 1fr auto; align-items: center; }
        .gallery-item:hover { border-color: var(--primary); transform: translateY(-1px); }
        .gallery-item.is-selected { background: #eff6ff; border-color: var(--primary); border-left: 4px solid var(--primary); }
        
        /* BADGES */
        .stat-badge { padding: 2px 8px; border-radius: 99px; font-weight: bold; font-size: 0.7rem; text-transform: uppercase; background: #e2e8f0; color: #475569; }
        .stat-badge.critical { background: #fee2e2; color: #991b1b; }
        .stat-badge.good { background: #dcfce7; color: #166534; }

        /* BUTTONS & INPUTS */
        .btn { padding: 8px 16px; border-radius: 0.5rem; font-weight: 600; font-size: 0.8rem; transition: all 0.2s; border:none; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #0369a1; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #475569; }
        .btn-outline:hover { background: #f0f9ff; border-color: var(--primary); color: var(--primary); }

        input, select { width: 100%; padding: 8px; border-radius: 0.5rem; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 0.875rem; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

    <div id="global-loader">
        <div class="loader-card">
            <div class="loader-spinner"></div>
            <h1 class="text-2xl font-bold text-gray-800">Daytona Reassignment</h1>
            <p class="text-sm text-gray-500 mb-4" id="loading-status-text">Authenticating...</p>
            <div class="progress-track"><div id="loading-progress-bar" class="progress-fill"></div></div>
            <p class="text-xs text-gray-400 mt-2">Connecting to Dataverse...</p>
        </div>
    </div>

    <div id="login-container" class="fixed inset-0 bg-slate-900 z-[9998] hidden flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center max-w-md w-full border border-slate-700">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Welcome Back</h2>
            <button onclick="window.login()" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-lg w-full hover:bg-blue-700 transition shadow-lg">Sign in with Microsoft</button>
        </div>
    </div>

    <div id="main-app-container" class="hidden">
        
        <div class="card mb-3 p-3 flex-row justify-between items-center" style="background: rgba(255,255,255,0.9);">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-blue-800"><i class="fas fa-random mr-2"></i>Reassignment Tool <span class="text-xs font-normal text-gray-500">v25.0</span></h1>
                <button onclick="window.fetchData()" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="text-right border-r pr-4 border-gray-300">
                    <div id="user-display" class="text-sm font-bold text-gray-800">--</div>
                    <div class="text-xs text-gray-500">Authorized User</div>
                </div>
                <button onclick="msalInstance.logoutPopup()" class="text-xs text-red-500 hover:text-red-700 font-medium px-2">Sign Out</button>
            </div>
        </div>

        <div class="app-grid">
            
            <div class="col-left">
                <div class="card h-full">
                    <div class="card-header">
                        <span>Source Representatives</span>
                        <span id="rep-count-badge" class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full">0</span>
                    </div>
                    
                    <div class="p-2 bg-gray-50 border-b space-y-2">
                        <input type="text" id="search-input" onkeyup="window.renderRepList()" placeholder="Search Reps..." class="text-sm">
                        <select id="action-filter" onchange="window.renderRepList()" class="text-xs">
                            <option value="All">All Actions</option>
                        </select>
                    </div>

                    <div id="rep-list" class="gallery-list">
                        </div>
                </div>
            </div>

            <div class="col-right">
                <div class="card h-full">
                    <div class="card-header">
                        <span><i class="fas fa-cogs mr-2 text-gray-400"></i>Operations Console</span>
                    </div>
                    
                    <div class="p-6 flex flex-col gap-6 h-full relative bg-white/50">
                        
                        <div class="relative pl-4 border-l-4 border-blue-200">
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">1. Source Rep</label>
                            <div class="relative">
                                <input type="text" id="source-rep-display" readonly placeholder="Select from list..." class="bg-gray-100 cursor-not-allowed font-bold text-blue-800">
                                <button onclick="window.clearSelection()" id="clear-btn" class="hidden absolute right-2 top-2 text-gray-400 hover:text-red-500"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="flex gap-4 mt-2 text-xs text-gray-500">
                                <div>Available: <span id="stat-avail" class="font-bold text-gray-800">0</span></div>
                                <div>Total: <span id="stat-total" class="font-bold text-gray-800">0</span></div>
                                <div>Progress: <span id="stat-pct" class="font-bold text-gray-800">0%</span></div>
                            </div>
                        </div>

                        <div class="relative pl-4 border-l-4 border-blue-200">
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">2. Target Rep</label>
                            <select id="target-rep-select" class="font-medium">
                                <option value="">-- Select Target --</option>
                            </select>
                        </div>

                        <div class="relative pl-4 border-l-4 border-blue-200">
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">3. Parameters</label>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <span class="text-[10px] text-gray-400">Action Filter</span>
                                    <select id="transfer-action-filter" class="mt-1">
                                        <option value="All">All Actions</option>
                                    </select>
                                </div>
                                <div>
                                    <span class="text-[10px] text-gray-400">Quantity</span>
                                    <div class="flex gap-2 mt-1">
                                        <input type="number" id="transfer-count" min="1" placeholder="e.g. 50">
                                        <button onclick="window.setMaxCount()" class="btn-outline px-2 text-xs font-bold">Max</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-auto pt-6 border-t border-gray-100">
                            <button id="btn-execute" onclick="window.executeReassignment()" class="btn-primary w-full py-3 shadow-lg flex justify-center items-center gap-2" disabled>
                                <i class="fas fa-exchange-alt"></i> Execute Transfer
                            </button>
                            
                            <div id="execution-progress-container" class="hidden mt-4">
                                <div class="flex justify-between text-xs font-bold text-blue-700 mb-1">
                                    <span>Processing...</span>
                                    <span id="progress-pct">0%</span>
                                </div>
                                <div class="progress-track"><div id="execution-bar" class="progress-fill"></div></div>
                                <p class="text-[10px] text-center text-gray-400 mt-1">Please do not close this window.</p>
                            </div>

                            <div id="status-message" class="hidden mt-4 p-3 rounded bg-green-50 text-green-700 text-center text-sm font-bold border border-green-200"></div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" }, cache: { cacheLocation: "localStorage" } };
        
        // ** VERIFIED LINKS **
        const GET_ROWS_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/952746524c354ee8a4d335d24ce01d6d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wOEIjRMghIgIGX4GU85rwL1hLdIeFT8O0I44C9C0vSo";
        const GET_TOTALS_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/beb6856d76da4608b3d6ae5835efd428/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=s_DKBVFGuVtD62AQw0ajNkvCrgJX-cjgziVJ7ApNH88";
        const REASSIGN_FLOW_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/ccd1e78456a4470c9bef267fc8b6ba77/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=delp7lT79GXjEHWIj9AHaxSmAyUrojFqAhNx0nsv0pM";

        // --- STATE ---
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        let appState = {
            user: null,
            rawData: [],    // All rows
            totalsMap: {},  // Map of Rep -> Total Count
            groupedData: {} // Map of Rep -> Available Count
        };

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            const accounts = msalInstance.getAllAccounts();
            if(accounts.length > 0) {
                appState.user = accounts[0];
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('user-display').innerText = appState.user.name;
                document.getElementById('global-loader').style.display = 'flex';
                fetchData();
            } else {
                document.getElementById('global-loader').style.display = 'none';
                document.getElementById('login-container').classList.remove('hidden');
            }
        });

        async function login() {
            try {
                const resp = await msalInstance.loginPopup({ scopes: ["User.Read"] });
                appState.user = resp.account;
                location.reload(); 
            } catch (e) { alert("Login Failed: " + e.message); }
        }

        // --- ROBUST FETCHING ENGINE ---
        async function fetchData() {
            const progressBar = document.getElementById('loading-progress-bar');
            const statusText = document.getElementById('loading-status-text');
            document.getElementById('global-loader').style.display = 'flex';
            document.getElementById('global-loader').style.opacity = '1';
            
            let progress = 0;
            const timer = setInterval(() => { if(progress < 90) { progress += 2; progressBar.style.width = `${progress}%`; } }, 100);
            
            window.clearSelection();

            try {
                statusText.innerText = "Fetching Row Data...";
                
                // 1. Fetch Rows (Poll Logic + Safe Payload)
                // Sending ONLY repName to match your working example
                const rowsData = await fetchWithPoll(GET_ROWS_URL, { 
                    repName: appState.user.name 
                });

                // 2. Fetch Totals
                statusText.innerText = "Aggregating Totals...";
                let totalsData = null;
                try {
                    totalsData = await fetchWithPoll(GET_TOTALS_URL, {});
                } catch(e) { console.warn("Totals skipped", e); }

                // --- PARSE ---
                appState.rawData = findArrayWithKey(rowsData, 'cr714_accountnumber') || [];
                const rawTotals = findArrayWithKey(totalsData, 'totalCount') || findArrayWithKey(totalsData, 'count') || [];
                
                appState.totalsMap = {};
                rawTotals.forEach(t => {
                    const name = normalizeName(t.cr714_rep || t.repName || t.RepName || "Unknown");
                    appState.totalsMap[name] = t.totalCount || t.count || 0;
                });

                // Filter & Group
                processData();

                clearInterval(timer);
                progressBar.style.width = '100%';
                
                setTimeout(() => {
                    document.getElementById('global-loader').style.opacity = '0';
                    setTimeout(() => { 
                        document.getElementById('global-loader').style.display = 'none'; 
                        document.getElementById('main-app-container').classList.remove('hidden');
                    }, 500);
                }, 500);

            } catch (e) {
                clearInterval(timer);
                progressBar.style.backgroundColor = '#ef4444';
                statusText.innerText = "Error: " + e.message;
                alert("Failed to load data. Please check connection.");
            }
        }

        // --- CORE: POLLING FETCH ---
        async function fetchWithPoll(url, payload) {
            let response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.status === 202) {
                const location = response.headers.get('location');
                if (!location) return {}; 
                
                let retries = 0;
                while (retries < 60) { 
                    await new Promise(r => setTimeout(r, 2000));
                    response = await fetch(location);
                    if (response.status === 200) break;
                    retries++;
                }
            }

            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        }

        // --- RECURSIVE PARSER ---
        function findArrayWithKey(obj, key) {
            if (!obj) return null;
            if (Array.isArray(obj)) {
                if (obj.length > 0 && obj[0] && Object.prototype.hasOwnProperty.call(obj[0], key)) return obj;
                for (let item of obj) {
                    const found = findArrayWithKey(item, key);
                    if (found) return found;
                }
            } else if (typeof obj === 'object') {
                for (let k in obj) {
                    const found = findArrayWithKey(obj[k], key);
                    if (found) return found;
                }
            }
            return null;
        }

        function processData() {
            // *** UNFILTERED LOGIC ***
            // Removed the strict "NONBUY" check. We simply group EVERYTHING returned by the API.
            const activeRows = appState.rawData; 

            // Group by Rep
            appState.groupedData = {};
            activeRows.forEach(r => {
                const name = normalizeName(r.cr714_rep);
                appState.groupedData[name] = (appState.groupedData[name] || 0) + 1;
            });
            
            populateFilters(activeRows);
            renderRepList();
        }

        function populateFilters(rows) {
            const s1 = document.getElementById('action-filter');
            const s2 = document.getElementById('transfer-action-filter');
            s1.innerHTML = '<option value="All">All Actions</option>';
            s2.innerHTML = '<option value="All">All Actions</option>';
            
            const actions = new Set();
            rows.forEach(r => { if(r.cr714_action) actions.add(r.cr714_action); });
            Array.from(actions).sort().forEach(a => {
                s1.innerHTML += `<option value="${a}">${a}</option>`;
                s2.innerHTML += `<option value="${a}">${a}</option>`;
            });

            const targetSel = document.getElementById('target-rep-select');
            targetSel.innerHTML = '<option value="">-- Select Target --</option>';
            const allReps = new Set();
            appState.rawData.forEach(r => { if(r.cr714_rep) allReps.add(r.cr714_rep); });
            Array.from(allReps).sort().forEach(r => {
                targetSel.innerHTML += `<option value="${r}">${r}</option>`;
            });
        }

        // --- RENDER LOGIC ---
        function renderRepList() {
            const listEl = document.getElementById('rep-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const actionFilter = document.getElementById('action-filter').value;

            // Sync Right Filter
            document.getElementById('transfer-action-filter').value = actionFilter;

            listEl.innerHTML = "";
            
            let keys = Object.keys(appState.groupedData);
            if (search) keys = keys.filter(k => k.toLowerCase().includes(search));
            
            keys.sort((a,b) => appState.groupedData[b] - appState.groupedData[a]);

            document.getElementById('rep-count-badge').innerText = keys.length;

            keys.forEach(repName => {
                const count = appState.groupedData[repName];
                const total = appState.totalsMap[repName] || count; 
                const pct = Math.round(((total - count) / total) * 100) || 0;
                
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => selectRep(repName, count, total, pct, item);
                
                item.innerHTML = `
                    <div>
                        <div class="font-bold text-sm text-gray-800">${repName}</div>
                        <div class="text-xs text-gray-500 mt-1">Available: ${count.toLocaleString()}</div>
                    </div>
                    <div class="text-right">
                        <span class="stat-badge ${count <= 10 ? 'critical' : 'good'}">${pct}% Done</span>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function selectRep(name, avail, total, pct, el) {
            document.querySelectorAll('.gallery-item').forEach(d => d.classList.remove('is-selected'));
            el.classList.add('is-selected');

            document.getElementById('source-rep-display').value = name;
            document.getElementById('stat-avail').innerText = avail.toLocaleString();
            document.getElementById('stat-total').innerText = total.toLocaleString();
            document.getElementById('stat-pct').innerText = pct + "%";
            
            document.getElementById('transfer-count').max = avail;
            document.getElementById('transfer-count').placeholder = `Max: ${avail}`;
            
            document.getElementById('clear-btn').classList.remove('hidden');

            const targetSel = document.getElementById('target-rep-select');
            Array.from(targetSel.options).forEach(opt => {
                opt.disabled = normalizeName(opt.value) === normalizeName(name);
            });
            
            validateForm();
        }

        function clearSelection() {
            document.getElementById('source-rep-display').value = "";
            document.getElementById('stat-avail').innerText = "0";
            document.getElementById('stat-total').innerText = "0";
            document.getElementById('stat-pct').innerText = "0%";
            document.getElementById('transfer-count').value = "";
            document.getElementById('clear-btn').classList.add('hidden');
            document.querySelectorAll('.gallery-item').forEach(d => d.classList.remove('is-selected'));
            validateForm();
        }

        function setMaxCount() {
            const max = document.getElementById('transfer-count').max;
            if(max) {
                document.getElementById('transfer-count').value = max;
                validateForm();
            }
        }

        function validateForm() {
            const src = document.getElementById('source-rep-display').value;
            const tgt = document.getElementById('target-rep-select').value;
            const cnt = document.getElementById('transfer-count').value;
            
            const isValid = src && tgt && cnt > 0;
            const btn = document.getElementById('btn-execute');
            btn.disabled = !isValid;
        }

        document.getElementById('target-rep-select').addEventListener('change', validateForm);
        document.getElementById('transfer-count').addEventListener('input', validateForm);

        // --- EXECUTE ---
        async function executeReassignment() {
            const src = document.getElementById('source-rep-display').value;
            const tgt = document.getElementById('target-rep-select').value;
            const cnt = document.getElementById('transfer-count').value;
            const act = document.getElementById('transfer-action-filter').value;

            if(!confirm(`Confirm Transfer?\n\nFrom: ${src}\nTo: ${tgt}\nRecords: ${cnt}`)) return;

            const btn = document.getElementById('btn-execute');
            const progContainer = document.getElementById('execution-progress-container');
            const progBar = document.getElementById('execution-bar');
            
            btn.disabled = true;
            progContainer.classList.remove('hidden');
            
            let p = 0;
            const interval = setInterval(() => { if(p<95) { p++; progBar.style.width = p + '%'; document.getElementById('progress-pct').innerText = p+'%'; } }, 300);

            try {
                await fetchWithPoll(REASSIGN_FLOW_URL, {
                    sourceRep: src,
                    targetRep: tgt,
                    reassignCount: parseInt(cnt),
                    actionFilter: act,
                    requestingUser: appState.user.username
                });

                clearInterval(interval);
                progBar.style.width = '100%';
                document.getElementById('progress-pct').innerText = "100%";
                
                const status = document.getElementById('status-message');
                status.innerText = "Transfer Complete! Refreshing data...";
                status.classList.remove('hidden');
                
                setTimeout(() => {
                    fetchData(); // Reload everything
                    status.classList.add('hidden');
                    progContainer.classList.add('hidden');
                    btn.disabled = false;
                    document.getElementById('source-rep-display').value = ""; // Clear form
                }, 2000);

            } catch(e) {
                clearInterval(interval);
                progBar.style.backgroundColor = 'red';
                alert("Transfer Failed: " + e.message);
                btn.disabled = false;
            }
        }

        function normalizeName(n) { return (n||"").trim().toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }
        window.clearSelection = clearSelection;
        window.renderRepList = renderRepList;
        window.fetchData = fetchData;
        window.setMaxCount = setMaxCount;
        window.executeReassignment = executeReassignment;
        window.login = login;

    </script>
</body>
