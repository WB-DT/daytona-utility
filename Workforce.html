<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1a2333; --muted:#64748b; --line:#e2e8f0;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --orange:#ea580c;
  --blue:#2563eb; --indigo:#4f46e5; --teal:#0d9488; --rose:#e11d48; --purple:#7c3aed;
  --brand:#0066c0; --brand-ink:#ffffff; --soft:#eef2f7;
  --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --line:#334155; --soft:#1e2a4a;
         --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
a{color:var(--brand)}

header{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.hd h1{font-size:18px;letter-spacing:-.01em}
.hd .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.hd .spacer{flex:1}
.sync-dot{display:inline-flex;align-items:center;gap:7px;max-width:min(48vw,560px);padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--soft);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.14);flex:0 0 auto}
.sync-dot[data-state="syncing"]{color:#1d4ed8;border-color:rgba(37,99,235,.28);background:rgba(37,99,235,.08)}
.sync-dot[data-state="syncing"]::before{background:#2563eb;animation:syncPulse 1s ease-in-out infinite}
.sync-dot[data-state="success"]{color:#166534;border-color:rgba(22,163,74,.25);background:rgba(22,163,74,.08)}
.sync-dot[data-state="success"]::before{background:#16a34a}
.sync-dot[data-state="error"],.sync-dot[data-state="offline"]{color:#991b1b;border-color:rgba(220,38,38,.25);background:rgba(220,38,38,.08)}
.sync-dot[data-state="error"]::before,.sync-dot[data-state="offline"]::before{background:#dc2626}
@keyframes syncPulse{50%{opacity:.35;transform:scale(.72)}}
@media(max-width:760px){.sync-dot{order:5;max-width:100%;width:100%}}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;border-bottom:2.5px solid transparent;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:550;white-space:nowrap;border-radius:6px 6px 0 0}
nav button:hover{color:var(--ink);background:var(--soft)}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13.5px;max-width:170px}
.filters label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fgroup{min-width:0}
.chip-clear{border:none;background:var(--soft);color:var(--brand);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:600}

main{max-width:1440px;margin:0 auto;padding:16px}
.cal-card.loa-card{border-left:3.5px solid var(--indigo);background:rgba(99,102,241,0.05)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.kpi.accent{border-left:4px solid var(--accent,var(--brand))}
.two{grid-template-columns:1fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.card h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}

.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--soft);cursor:pointer}
tbody tr.norow:hover{background:none;cursor:default}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:#fff}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--brand)}
.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.badge.ok{background:#dcfce7;color:#166534}
@media (prefers-color-scheme: dark){.badge.warn{background:#453a12;color:#fcd34d}.badge.bad{background:#4a1d1d;color:#fca5a5}.badge.ok{background:#14351f;color:#86efac}}

.btn{border:none;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
.cal-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:86px;padding:6px;cursor:pointer;transition:border-color .1s}
.cal-cell:hover{border-color:var(--brand)}
.cal-cell.dim{opacity:.42}
.cal-cell.today{border-color:var(--brand);border-width:2px}
.cal-cell .d{font-size:12.5px;font-weight:700}
.cal-mini{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.dot{width:auto;min-width:17px;height:17px;border-radius:6px;font-size:10.5px;font-weight:700;color:#fff;display:inline-grid;place-items:center;padding:0 4px}
@media(max-width:640px){.cal-cell{min-height:56px;padding:4px}.cal-mini .dot{min-width:14px;height:14px;font-size:9px}}
.cal-list .day-block{margin-bottom:14px}

.mu-chip{display:block;background:var(--purple);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-chip.Pending, .mu-chip.Scheduled{background:var(--purple)}
.mu-chip.Completed{background:var(--green)}

/* Modal sizing update */
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.65);z-index:90;display:grid;place-items:center;padding:24px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal h2{font-size:20px;font-weight:700;margin-bottom:18px}
.mrow{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.mrow>div{flex:1;min-width:180px}
.modal label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px}
.modal textarea{resize:vertical;min-height:160px;line-height:1.5}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;pointer-events:auto}
#toast.toast-action{display:flex;align-items:center;gap:12px;text-align:left}
#toast .toast-undo{border:1px solid currentColor;background:transparent;color:inherit;border-radius:7px;padding:5px 10px;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}
#toast .toast-undo:hover,#toast .toast-undo:focus-visible{background:var(--bg);color:var(--ink);outline:none}

.muted{color:var(--muted)} .small{font-size:12.5px} .mt{margin-top:12px} .mb{margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
canvas{max-height:280px}
.section-title{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.section-title h2{font-size:16px}
.section-title select{max-width:180px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13.5px}

.cal-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 10px;
  transition: border-color .1s;
}
.cal-row:hover { border-color: var(--brand); }

.modal .cal-row {
  background: var(--bg);
}
.cal-row .row-top {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  width: 100%;
}
.cancelled {
  text-decoration: line-through;
  opacity: 0.6;
}

    .week-board {
  display: grid;
  grid-template-columns: repeat(5, minmax(210px, 1fr));
  gap: 12px;
  align-items: start;
  overflow-x: auto;
  padding-bottom: 12px;
}
@media (max-width: 1100px) {
  .week-board { grid-template-columns: repeat(5, 240px); }
}
  
.col-day {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-height: 520px;
}
.col-day.today {
  border-color: var(--brand);
}
.col-day-hd {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--soft);
  border-top-left-radius: inherit;
  border-top-right-radius: inherit;
}
.col-day.today .col-day-hd {
  background: rgba(0, 102, 192, 0.12);
}
.col-day-body {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.cal-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.1s ease;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.cal-card:hover {
  border-color: var(--brand);
  transform: translateY(-1px);
}
.cal-card.mu-card {
  border-left: 3.5px solid var(--purple);
  background: rgba(124, 58, 237, 0.05);
}
.cal-card.note-card {
  background: var(--bg);
  border: 1px solid #fde047;
  border-left: 4px solid #fde047;
  box-shadow: 0 0 10px rgba(234, 179, 8, 0.25);
}
.cal-card.note-card .cal-card-time {
  color: var(--muted);
  font-weight: 500;
  font-style: italic;
  white-space: pre-wrap;
  font-size: 11px;
  line-height: 1.4;
  margin-top: 2px;
}
.cal-card.night-mgr-card {
  background: var(--bg);
  border: 1px solid #818cf8;
  border-left: 4px solid #818cf8;
  box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
}
.cal-card.night-mgr-card .cal-card-time {
  color: var(--muted);
}
.cal-card-name {
  font-weight: 650;
  font-size: 13.5px;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-card-time {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  line-height: 1.25;
  word-break: break-word;
}
.cal-card-badges {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 1px;
}
  

/* Full-screen loading cover used during Dataverse authentication and synchronization */
#syncCover{position:fixed;inset:0;z-index:1000;display:none;place-items:center;padding:24px;background:rgba(15,23,42,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#syncCover.show{display:grid}
.sync-cover-card{width:min(440px,92vw);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.38);padding:28px;text-align:center}
.sync-cover-logo{width:52px;height:52px;margin:0 auto 16px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 10px 25px rgba(0,102,192,.3)}
.sync-cover-title{font-size:19px;font-weight:750;margin-bottom:6px}
.sync-cover-message{min-height:21px;color:var(--muted);font-size:13.5px}
.sync-cover-track{height:7px;margin-top:20px;border-radius:99px;background:var(--soft);overflow:hidden}
.sync-cover-bar{height:100%;width:38%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--teal),var(--brand));animation:sync-cover-slide 1.15s ease-in-out infinite}
.sync-cover-note{margin-top:12px;color:var(--muted);font-size:11.5px}
body.syncing{overflow:hidden}
@keyframes sync-cover-slide{0%{transform:translateX(-110%)}50%{transform:translateX(80%)}100%{transform:translateX(270%)}}
@media(prefers-reduced-motion:reduce){.sync-cover-bar{animation:none;width:100%}}


/* Attendance email production add-on */
.email-form{color:var(--ink);background:var(--card)}.email-form input,.email-form textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 11px}.email-form textarea{min-height:430px;resize:vertical}.email-preview{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;line-height:1.55;min-height:430px;max-height:650px;overflow:auto}.email-leader{background:#fde047;color:#422006;font-weight:800;padding:1px 4px;border-radius:4px}.email-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}.email-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.email-pane{min-width:0}.email-pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}.email-pane-head label{margin:0}.email-edit-badge{background:#dbeafe;color:#1e40af;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:800}.email-preview-badge{background:var(--soft);color:var(--muted);border-radius:99px;padding:3px 8px;font-size:11px;font-weight:750}.email-help{font-size:12px;color:var(--muted);margin-top:6px}@media(max-width:900px){.email-columns{grid-template-columns:1fr}.email-form textarea,.email-preview{min-height:320px}}

/* Universal table sorting and grouped-occurrence emphasis */
th.sortable-col:hover{color:var(--brand);background:var(--soft)}
th.sort-active::after{content:" " attr(data-sort-arrow);color:var(--brand);font-size:12px}
@keyframes grouped-rainbow-flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.occurrence-group-rainbow{position:relative;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#0a84ff,#bf5af2,#ff3b30) border-box!important;border:3px solid transparent!important;background-size:100% 100%,300% 300%!important;animation:grouped-rainbow-flow 6s ease-in-out infinite}
tr.occurrence-group-rainbow{background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#0a84ff,#bf5af2,#ff3b30);background-size:300% 300%;animation:grouped-rainbow-flow 6s ease-in-out infinite}
tr.occurrence-group-rainbow>td{border-top:3px solid transparent;border-bottom:3px solid transparent;background:var(--card);background-clip:padding-box}
tr.occurrence-group-rainbow>td:first-child{border-left:3px solid transparent;border-radius:10px 0 0 10px}tr.occurrence-group-rainbow>td:last-child{border-right:3px solid transparent;border-radius:0 10px 10px 0}
.cal-row.occurrence-group-rainbow,.card.occurrence-group-rainbow{box-shadow:0 0 12px rgba(124,58,237,.18)}
@media(prefers-reduced-motion:reduce){.occurrence-group-rainbow,tr.occurrence-group-rainbow{animation:none;background-position:50% 50%!important}}

/* Occurrence Overview table containment and whole-group border */
.occurrence-table-wrap{overflow-x:auto;overflow-y:visible;border-radius:14px;padding:3px}
.occurrence-table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0 8px;min-width:980px}
.occurrence-table th,.occurrence-table td{min-width:0;white-space:normal;overflow-wrap:anywhere;word-break:normal;line-height:1.4}
.occurrence-table th:nth-child(1){width:19%}.occurrence-table th:nth-child(2){width:12%}.occurrence-table th:nth-child(3){width:10%}.occurrence-table th:nth-child(4){width:13%}.occurrence-table th:nth-child(5){width:10%}.occurrence-table th:nth-child(6){width:10%}.occurrence-table th:nth-child(7){width:20%}.occurrence-table th:nth-child(8){width:6%}
.occurrence-table td{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 9px}
.occurrence-table td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px}.occurrence-table td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
.occurrence-table .pill,.occurrence-table .badge{max-width:100%;white-space:normal;text-align:center;line-height:1.25}
.occurrence-table .occ-date-list{display:flex;flex-direction:column;gap:4px;min-width:0}.occurrence-table .occ-date-range{font-weight:750;overflow-wrap:anywhere}.occurrence-table .occ-notes{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-width:100%}.occurrence-table .occ-edit{white-space:nowrap}
.occurrence-table tr.occurrence-group-rainbow{position:relative;background:none!important;border:0!important;animation:none!important}
.occurrence-table tr.occurrence-group-rainbow>td{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#0a84ff,#bf5af2,#ff3b30) border-box!important;background-size:100% 100%,300% 300%!important;animation:grouped-rainbow-flow 6s ease-in-out infinite;border-top:3px solid transparent!important;border-bottom:3px solid transparent!important}
.occurrence-table tr.occurrence-group-rainbow>td:first-child{border-left:3px solid transparent!important;border-radius:12px 0 0 12px}.occurrence-table tr.occurrence-group-rainbow>td:last-child{border-right:3px solid transparent!important;border-radius:0 12px 12px 0}
@media(max-width:900px){.occurrence-table{min-width:820px;font-size:12.5px}.occurrence-table th,.occurrence-table td{padding:8px 7px}.occurrence-table th:nth-child(7){width:18%}}

/* Readable multi-line occurrence groups with a restrained RGB trace */
@keyframes occ-trace-flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.occurrence-table .occ-group-host>td{padding:4px!important;border:0!important;background:transparent!important}
.occ-glass-group{position:relative;isolation:isolate;border-radius:16px;padding:2px;background:linear-gradient(110deg,rgba(255,90,90,.72),rgba(255,190,70,.62),rgba(83,220,150,.62),rgba(85,165,255,.68),rgba(185,100,255,.66),rgba(255,90,90,.72));background-size:260% 260%;animation:occ-trace-flow 9s cubic-bezier(.45,0,.55,1) infinite;box-shadow:0 8px 24px rgba(15,23,42,.12),0 0 18px rgba(96,165,250,.12)}

body.calendar-dragging .cal-card{transition:none}
@media(prefers-reduced-motion:reduce){.cal-card.dragging{transform:none}}

let syncCoverDepth = 0;
function showSyncCover(message = "Connecting to Dataverse...", title = "Syncing Workforce data") {
  syncCoverDepth += 1;
  const cover = document.getElementById("syncCover");
  const titleEl = document.getElementById("syncCoverTitle");
  const messageEl = document.getElementById("syncCoverMessage");
  if (titleEl) titleEl.textContent = title;
  if (messageEl) messageEl.textContent = message;
  if (cover) {
    cover.classList.add("show");
    cover.setAttribute("aria-hidden", "false");
  }
  document.body.classList.add("syncing");
}
function updateSyncCover(message) {
  const messageEl = document.getElementById("syncCoverMessage");
  if (messageEl && message) messageEl.textContent = message;
}
function hideSyncCover(force = false) {
  syncCoverDepth = force ? 0 : Math.max(0, syncCoverDepth - 1);
  if (syncCoverDepth > 0) return;
  const cover = document.getElementById("syncCover");
  if (cover) {
    cover.classList.remove("show");
    cover.setAttribute("aria-hidden", "true");
  }
  document.body.classList.remove("syncing");
}

const msalConfig = {
  auth: {
    clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
    authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
    redirectUri: "https://WB-DT.github.io/daytona-utility/"
  },
  cache: {
    cacheLocation: "sessionStorage",
    storeAuthStateInCookie: false
  }
};
const msalInstance = new msal.PublicClientApplication(msalConfig);
let msalAccount = null;

// MSAL tokens use sessionStorage to avoid persistent localStorage growth.
// ACT authentication helper. Uses the exact selected account and tenant authority
// to avoid multiple_matching_tokens cache collisions.
window.getToken = async function(scopeStr, silentFallback = false) {
  let account = msalAccount || null;

  if (!account) {
    const activeAccounts = msalInstance.getAllAccounts();
    if (activeAccounts.length > 0) account = activeAccounts[0];
  }

  const request = {
    scopes: scopeStr.split(" "),
    account,
    authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401"
  };

  try {
    return (await msalInstance.acquireTokenSilent(request)).accessToken;
  } catch (error) {
    if (silentFallback) {
      console.warn(`Silent token fetch failed for ${scopeStr}. Error: ${error.message}`);
      throw error;
    }

    console.log(`Interactive token request needed for ${scopeStr}`);
    const response = await msalInstance.acquireTokenPopup(request);
    if (response.account) msalAccount = response.account;
    return response.accessToken;
  }
};


const AUTO_REFRESH_MS=5*60*1000;
let autoRefreshTimer=null,refreshInFlight=false,lastSuccessfulRefresh=0;
async function refreshWorkforceData(reason="automatic"){
  if(UI.tab==="employeeData"||refreshInFlight||!msalAccount||document.hidden||!navigator.onLine)return;
  refreshInFlight=true;
  try{await pullFromDataverse(true);lastSuccessfulRefresh=Date.now();setSync(`Auto-refreshed ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`);}
  catch(err){console.warn(`${reason} refresh failed`,err);}finally{refreshInFlight=false;}
}
function startAutoRefresh(){
  clearInterval(autoRefreshTimer);
  autoRefreshTimer=setInterval(()=>refreshWorkforceData("timer"),AUTO_REFRESH_MS);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-lastSuccessfulRefresh>AUTO_REFRESH_MS)refreshWorkforceData("window resumed");});
window.addEventListener("offline",()=>setSyncStatus("offline","Offline · cached data","No network connection. The app is displaying cached data."));
window.addEventListener("online",()=>{updateSyncStatusIndicator();refreshWorkforceData("connection restored");});
window.onload = async () => {
  try {
    await hydrateStateCache({deferRender:true});
    updateReconciliationBadge();
    updateSyncStatusIndicator();
    const redirectResponse = await msalInstance.handleRedirectPromise();
    const accounts = msalInstance.getAllAccounts();
    msalAccount = redirectResponse?.account || accounts[0] || null;

    if (msalAccount) {
      // Do not paint cached datasets first. The sync patches blank authoritative dates,
      // verifies them with a second Time Off fetch when needed, then renders once.
      if (!S.employees || S.employees.length === 0) {
        await pullFromDataverse(false);
      } else {
        await pullFromDataverse(true);
      }
      lastSuccessfulRefresh=Date.now();
      startAutoRefresh();
    } else {
      // Signed-out/offline fallback: cached data is still available when a live sync cannot run.
      render();
    }
  } catch (err) {
    console.error("MSAL init error:", err);
  }
};

async function getDataverseToken() {
  const dataverseScope = `${DATAVERSE_URL}//user_impersonation`;

  if (!msalAccount) {
    const accounts = msalInstance.getAllAccounts();
    msalAccount = accounts[0] || null;
  }

  if (!msalAccount) {
    updateSyncCover("Waiting for Microsoft sign-in...");
    const loginResponse = await msalInstance.loginPopup({
      scopes: ["User.Read", dataverseScope]
    });
    msalAccount = loginResponse.account;
  }

  return window.getToken(dataverseScope);
}

function to12Hour(timeStr) {
  if (!timeStr) return "";
  let s = String(timeStr).trim();
  if (/AM|PM/i.test(s)) {
    return s.replace(/\s*(AM|PM)/i, " $1").toUpperCase();
  }
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (!match) return s;
  let h = parseInt(match[1], 10), m = match[2];
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function formatDuration(hStr) {
  if (!hStr) return "";
  let s = String(hStr).trim();
  let totalMinutes = 0;
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (match) {
    totalMinutes = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
  } else if (!isNaN(parseFloat(s))) {
    totalMinutes = Math.round(parseFloat(s) * 60);
  } else {
    return s;
  }
  const hrs = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;
  if (hrs > 0 && mins > 0) return `${hrs}h ${mins}m`;
  if (hrs > 0) return `${hrs} hr${hrs > 1 ? 's' : ''}`;
  return `${mins} mins`;
}

function cleanMakeUpString(str) {
  if (!str) return "";
  return String(str).split(',').map(entry => {
    const parts = entry.split(' - ').map(p => p.trim());
    if (parts.length >= 3) {
      const datePart = parts[0];
      const timeRange = parts[1].split('-').map(t => to12Hour(t.trim())).join(' - ');
      const dur = formatDuration(parts[2]);
      return `${datePart} - ${timeRange} - ${dur}`;
    }
    return entry;
  }).join(', ');
}

function formatReadableNotes(notes) {
  if (!notes) return "";
  let s = String(notes);
  s = s.replace(/(Schedule:|Rep Notes:|Lunch Selection:|Total Hours:|Total Make-up Hours:|Extended Lunch Duration:|Worked)/gi, '\n$1');
  s = s.replace(/\n\s*\n/g, '\n').trim();
  return s;
}

function getRelevantMakeUpNotes(notes, currentDate) {
  if (!notes || !currentDate) return notes;
  const lines = notes.split('\n');
  const [cY, cM, cD] = currentDate.split('-');
  const targetUS = `${cM}/${cD}/${cY}`;

  const filteredLines = lines.filter(line => {
    const dateMatch = line.match(/(\d{2}\/\d{2}\/\d{4})/);
    if (dateMatch) {
      return line.includes(targetUS);
    }
    return true;
  });

  return filteredLines.join('\n');
}

function normalizeTimeRange(str) {
  if (!str) return "";
  return String(str).replace(/(\d{1,2}:\d{2}(?::\d{2})?)/g, match => format12Hour(match));
}

function hoursToHHMM(val) {
  if (val == null || isNaN(val)) return "00:00";
  const totalMinutes = Math.round(parseFloat(val) * 60);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function formatChipTime(notes) {
  if (!notes) return "";

  // 2. Auto-miss past-due scheduled make-up shifts

  async function cancelRecordRequest(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  if (!confirm("Are you sure you want to cancel this request? It will remain visible but crossed out.")) return;

  target.cancelled = true;
  const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;
  S.records.filter(r => r.rid.startsWith(basePrefix)).forEach(r => r.cancelled = true);
  S.makeups.filter(m => m.mid === basePrefix || m.rid.startsWith(basePrefix) || m.dvId === target.dvId).forEach(m => m.status = "Cancelled");

  save();
  closeModal();
  render();
  toast("Request cancelled");
}

  async function toggleCancelRecord(rid){
  const target=S.records.find(r=>r.rid===rid);if(!target)return;
  const newState=!target.cancelled;
  try{
    const familyIds=[...new Set((target.familyDvIds?.length?target.familyDvIds:[target.dvId]).filter(Boolean))];
    if(familyIds.length)await Promise.all(familyIds.map(id=>patchDataverseRecord(id,{cr714_cancelledrequest:newState})));

    S.records.filter(r=>(r.familyDvIds||[r.dvId]).some(id=>familyIds.includes(id))).forEach(r=>r.cancelled=newState);
    S.makeups.filter(m=>familyIds.includes(m.dvId)).forEach(m=>m.status=newState?"Cancelled":"Scheduled");
    save();backModal();render();toast(newState?"Request cancelled in Dataverse":"Request restored in Dataverse");

      S.records = S.records.filter(r => r.dvId !== target.dvId);
      S.makeups = S.makeups.filter(m => m.dvId !== target.dvId);

async function deleteRecordFromDataverse(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  if (!confirm("Are you sure you want to permanently delete this record from Dataverse?")) return;

  if (target.dvId) {
    setSync("Deleting from Dataverse...");
    try {
      const token = await getDataverseToken();
      if (!token) throw new Error("Authentication missing");

      const res = await fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}(${target.dvId})`, {
        method: "DELETE",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/json",
          "OData-MaxVersion": "4.0",
          "OData-Version": "4.0"
        }
      });

      if (!res.ok && res.status !== 204 && res.status !== 404) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
    } catch (err) {
      console.error("Delete failed:", err);
      toast("Failed to delete from Dataverse: " + err.message);
      setSync("");
      return;
    }
  }

  const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;
  S.records = S.records.filter(r => !r.rid.startsWith(basePrefix));
  S.makeups = S.makeups.filter(m => m.mid !== basePrefix && m.dvId !== target.dvId);

  save();
  closeModal();
  render();
  setSync("");
  toast("Record deleted from Dataverse permanently");
}

  const token=await getDataverseToken();
  if(!token)throw new Error("Authentication missing");
  const cleanId=String(recordId).replace(/[{}]/g,"");
  const res=await fetch(`${DATAVERSE_URL}/api/data/v9.2/${tableName}(${cleanId})`,{method:"PATCH",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json",Accept:"application/json","OData-MaxVersion":"4.0","OData-Version":"4.0","If-Match":"*"},body:JSON.stringify(payload)});

  return true;
}

function range(){

  switch(UI.preset){
    case "day":     return [a,a];
    case "week": {  const dow=d.getDay(); const s=addDays(a,-dow); return [s, addDays(s,6)]; }
    case "month": { const s=new Date(d.getFullYear(),d.getMonth(),1), e=new Date(d.getFullYear(),d.getMonth()+1,0); return [isoDate(s),isoDate(e)]; }
    case "quarter":{const q=Math.floor(d.getMonth()/3); const s=new Date(d.getFullYear(),q*3,1), e=new Date(d.getFullYear(),q*3+3,0); return [isoDate(s),isoDate(e)]; }
    case "annual":{ return [d.getFullYear()+"-01-01", d.getFullYear()+"-12-31"]; }
    case "adjusted": return [UI.from||a, UI.to||a];

function requestPrefixLabel(requestId){
  const id=String(requestId||"").trim().toUpperCase();
  if(id.startsWith("M"))return {prefix:"M",id};
  if(id.startsWith("A"))return {prefix:"A",id};
  return null;
}
function canonicalRecordType(r){
  if(!r)return "Present";
  if(r.type && TYPES[r.type]) return r.type;
  if(r.rawLeaveType) return mapLeaveType(r.rawLeaveType);
  return r.type || "Absent";
}
function normalizeRecordType(r){const type=canonicalRecordType(r);return type===r.type?r:{...r,type};}
function calendarRecordWinnerCompare(a,b){
  if (!a || !b) return 0;
  const at=getRecordTimestamp(a),bt=getRecordTimestamp(b);
  if(at!==bt)return at-bt;
  return String(a.dvId||a.rid||"").localeCompare(String(b.dvId||b.rid||""));
}
function calendarRecords(records){
  return (records||[])
    .filter(r=>validCalendarIso(String(r?.date||"")))
    .map(r=>({...r,type:mapLeaveType(r.rawLeaveType||r.type)}))
    .filter(r=>!r.cancelled&&r.type!=="Cancellation"&&r.type!=="Present")
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)) || getRecordTimestamp(a)-getRecordTimestamp(b));
}
function calendarTypeSummary(records) {
  const byType = {};
  calendarRecords(records).forEach(r => {
    if (!r || r.type === "Present" || r.cancelled) return;
    const type = r.type || "Absent";
    const bucket = byType[type] || { count: 0, hours: 0, requests: new Set() };
    const requestKey = r.requestId || r.dvId || r.rid;
    if (!bucket.requests.has(requestKey)) { bucket.requests.add(requestKey); bucket.count += 1; }
    bucket.hours += Number(r.hours || 0);
    byType[type] = bucket;
  });
  return byType;
}
function calendarDot(type, summary) {

          if (validCalendarIso(shift.date) && shift.date >= f && shift.date <= t) {

    card.addEventListener("dragstart",event=>{
      didDrag = true;
      calendarDragState={kind:card.dataset.dragKind,id:card.dataset.dragId,sourceDate:card.dataset.dragDate};
      card.classList.add("dragging");
      document.body.classList.add("calendar-dragging");
      event.dataTransfer.effectAllowed="move";
      event.dataTransfer.setData("text/plain",JSON.stringify(calendarDragState));
    });
    card.addEventListener("dragend",()=>{
      card.classList.remove("dragging");
      root.querySelectorAll(".calendar-drop-target").forEach(x=>x.classList.remove("calendar-drop-target"));
      document.body.classList.remove("calendar-dragging");
      setTimeout(()=> { didDrag = false; calendarDragState = null; }, 80);
    });
    card.addEventListener("click",event=>{
      if(didDrag){
        event.preventDefault();
        event.stopImmediatePropagation();
        didDrag = false;
      }
    }, true);
  });
  root.querySelectorAll("[data-calendar-drop-date]").forEach(zone=>{
    zone.addEventListener("dragover",event=>{if(!calendarDragState)return;event.preventDefault();event.dataTransfer.dropEffect="move";zone.classList.add("calendar-drop-target");});
    zone.addEventListener("dragleave",event=>{if(!zone.contains(event.relatedTarget))zone.classList.remove("calendar-drop-target");});
    zone.addEventListener("drop",event=>{event.preventDefault();event.stopPropagation();zone.classList.remove("calendar-drop-target");let state=calendarDragState;try{state=state||JSON.parse(event.dataTransfer.getData("text/plain"));}catch(e){}if(!state)return;handleCalendarDrop(state.kind,state.id,state.sourceDate,zone.dataset.calendarDropDate);});
  });
}

function filteredEmployees(){

    (!UI.manager||e.manager===UI.manager) &&
    (!q || e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q))
  );
}

function filteredRecords(from,to){
  if (!S.records) return [];
  const ids = new Set(filteredEmployees().map(e=>e.id));
  const [f,t] = from?[from,to]:range();
  return consolidatedDisplayRecords(S.records.filter(r => ids.has(r.empId) && r.date>=f && r.date<=t && (!UI.type || canonicalRecordType(r) === UI.type)));
}

function emp(id){ return S.employees?.find(e=>e.id===id); }
function isOcc(r){ return !r.cancelled && !r.waived && occurrenceNumber(r.occurrence) > 0; }

function recordOverlapsRange(r,from,to){const start=r.requestStartDate||r.date,end=r.requestEndDate||start;return !!start&&!!end&&start<=to&&end>=from;}
const OCCURRENCE_ELIGIBLE_TYPES=new Set(["Call Out","Short Shift","Tardy","NCNS","Unplanned"]);
function isOccurrenceEligible(r){
  if(!r)return false;
  const type=canonicalRecordType(r);
  return occurrenceNumber(r.occurrence)>0&&!r.cancelled&&!r.waived&&!r.fmla&&OCCURRENCE_ELIGIBLE_TYPES.has(type);
}
function occurrenceSourceRecords(empId,from,to){
  const allowedEmployees=new Set(filteredEmployees().map(e=>e.id));
  if(!allowedEmployees.has(empId))return [];
  return consolidatedDisplayRecords((S.records||[])
    .filter(r=>r.empId===empId&&recordOverlapsRange(r,from,to))
    .map(normalizeRecordType));
}
function expandOccurrenceDates(r,from,to){
  const start=r.requestStartDate||r.date,end=r.requestEndDate||start;
  if(!start||!end||start>end)return [];
  const out=[];
  for(let d=start;d<=end&&out.length<730;d=addDays(d,1))if(d>=from&&d<=to)out.push(d);
  return out;
}
function groupConsecutiveOccurrenceDates(days,maxDays=3){
  const groups=[];let current=[];
  [...new Set(days)].sort().forEach(date=>{
    const consecutive=current.length&&date===addDays(current[current.length-1],1);
    if(!current.length||(consecutive&&current.length<maxDays))current.push(date);
    else{groups.push(current);current=[date];}
  });
  if(current.length)groups.push(current);
  return groups;
}
function occurrenceGroups(empId,from,to){
  const allowedEmployees = new Set(filteredEmployees().map(e => e.id));
  if (!allowedEmployees.has(empId)) return [];

  // Pull all active records for this employee so links across the 7-day window resolve cleanly
  const allEmpRecords = consolidatedDisplayRecords((S.records || [])
    .filter(r => r.empId === empId && !r.cancelled && !r.waived && !r.fmla && canonicalRecordType(r) !== "Present")
    .map(normalizeRecordType));

  const linkedTargetDates = new Set(allEmpRecords.map(r => r.groupWithDate).filter(Boolean));
  const participating = allEmpRecords.filter(r =>
    isOccurrenceEligible(r) ||
    !!r.groupWithDate ||
    linkedTargetDates.has(r.date)
  );

  // Connect dates that have been manually linked via the Group Occurrence dropdown
  const parentDate = new Map();
  const findRoot = d => {
    if (!parentDate.has(d)) parentDate.set(d, d);
    let root = parentDate.get(d);
    while (root !== parentDate.get(root)) root = parentDate.get(root);
    let cur = d;
    while (cur !== root) {
      const nxt = parentDate.get(cur);
      parentDate.set(cur, root);
      cur = nxt;
    }
    return root;
  };
  const unionDates = (a, b) => {
    if (!a || !b) return;
    const ra = findRoot(a), rb = findRoot(b);
    if (ra !== rb) {
      if (ra < rb) parentDate.set(rb, ra);
      else parentDate.set(ra, rb);
    }
  };

  participating.forEach(r => {
    findRoot(r.date);
    if (r.groupWithDate) {
      findRoot(r.groupWithDate);
      unionDates(r.date, r.groupWithDate);
    }
  });

  const buckets = new Map();
  participating.forEach(r => {
    const root = findRoot(r.date);
    if (!buckets.has(root)) buckets.set(root, new Set());
    buckets.get(root).add(r.date);
    if (r.groupWithDate) buckets.get(root).add(r.groupWithDate);
  });

  let groups = [];
  buckets.forEach(dateSet => {
    const dates = [...dateSet].sort();
    if (!dates.some(d => d >= from && d <= to)) return;
    const records = allEmpRecords.filter(r => dates.includes(r.date));
    const hasActiveOcc = records.some(r => isOccurrenceEligible(r) || !!r.groupWithDate);
    if (!hasActiveOcc) return;
    const grouped = dates.length > 1;
    groups.push({
      id: `${empId}:${dates[0]}`,
      dates,
      grouped,
      records,
      activeRecords: records,
      hasWaived: false,
      hasCancelled: false,
      visualClass: grouped ? "occurrence-group-rainbow" : "occurrence-single-green",
      label: grouped ? `Grouped occurrence · ${dates.length} days` : "Single occurrence"
    });
  });

  groups.sort((a, b) => a.dates[0].localeCompare(b.dates[0]));
  if (UI.type) groups = groups.filter(g => g.records.some(r => canonicalRecordType(r) === UI.type));
  return groups;
}
function groupedOccurrenceCount(empId,from,to){return occurrenceGroups(empId,from,to).length;}
function occurrenceGroupForDate(empId,date,from,to){return occurrenceGroups(empId,from,to).find(g=>g.dates.includes(date))||null;}
function occurrenceGroupBadge(group){if(!group)return `<span class="small muted">No occurrence</span>`;return group.grouped?`<span class="occurrence-group-mark">Grouped occurrence · ${group.dates.length} days · 1 occurrence</span>`:`<span class="occurrence-single-mark">Single occurrence</span>`;}
function occCount(empId,asOf){const to=asOf||today(),from=addDays(to,-OCC_WINDOW_DAYS+1);return groupedOccurrenceCount(empId,from,to);}

function level(n){ for(const [k,name,cls] of LADDER) if(n>=k) return {name,cls}; return null; }

function ossUsed(empId, asOf){
  if (!S.makeups) return 0;
  const from = addDays(asOf||today(), -365);
  return uniqueMakeups(S.makeups.filter(m=>m.empId===empId && m.oss && m.status!=="Missed" && m.status!=="Cancelled" && m.dateMissed>=from)).length;
}

function metrics(){
  const [f,t]=range(), emps=filteredEmployees(), recs=filteredRecords();
  const c = {}; TYPE_NAMES.forEach(n=>c[n]=0);
  let occ=0;
  recs.forEach(r=>{ c[r.type]=(c[r.type]||0)+1; });
  const empIdsForOcc=new Set(recs.map(r=>r.empId));
  empIdsForOcc.forEach(id=>{occ+=groupedOccurrenceCount(id,f,t);});

  let days=[]; for(let d=f; d<=t; d=addDays(d,1)) { if(!isWeekend(d)) days.push(d); }
  let totalPossibleWorkDays = days.length * emps.length;
  let loggedNonPresent = recs.filter(r => r.type !== "Present").length;
  let explicitPresent = recs.filter(r => r.type === "Present").length;
  
  c["Present"] = explicitPresent + Math.max(0, totalPossibleWorkDays - (explicitPresent + loggedNonPresent));

  const filteredHours = Math.round(recs.filter(r=>!r.cancelled).reduce((sum,r)=>sum+(Number(r.hours)||0),0)*100)/100;
  const filteredHoursByType = recs.filter(r=>!r.cancelled).reduce((out,r)=>{const type=canonicalRecordType(r);out[type]=Math.round(((out[type]||0)+(Number(r.hours)||0))*100)/100;return out;},{});
  const withRec = new Set(recs.map(r=>r.empId));
  const offenders = new Set(recs.filter(isOcc).map(r=>r.empId));
  const perfect = emps.filter(e=>!offenders.has(e.id));
  const empIds = new Set(emps.map(e=>e.id));
  const mus = uniqueMakeups((S.makeups||[]).filter(m=>empIds.has(m.empId) && m.dateMissed>=f && m.dateMissed<=t));
  const muDone = mus.filter(m=>m.status==="Completed").length;
  
  const denom = c["Present"] + Object.keys(c).filter(k => k !== "Present" && k !== "Make up Time").reduce((acc, k) => acc + c[k], 0);
  const rate = denom ? Math.round(100 * c["Present"] / denom) : null;
  
  return {c, occ, perfect, rate, filteredHours, filteredHoursByType, mus, muDone, muPending:mus.filter(m=>m.status!=="Completed").length, emps, recs, from:f, to:t};
}

function kpiModal(cat, title) {
  UI.currentListModal = { fn: kpiModal, args: [cat, title] };
  const m = metrics();
  let html = `<h2>${title}</h2>`;
  let rows = "";

  if (cat === "Perfect") {
    if(m.perfect.length === 0) {
      rows = `<tr class="norow"><td colspan="3" class="empty">No perfect attendance in this period.</td></tr>`;
    } else {
      rows = m.perfect.map(e => `<tr data-emp="${esc(e.id)}" style="cursor:pointer"><td><b>${esc(e.name)}</b></td><td>${esc(e.dept)}</td><td>${esc(e.supervisor)}</td></tr>`).join("");
    }
    html += `<div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Supervisor</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    let mus = m.mus.filter(x => cat === "Make-Ups Pending" ? x.status !== "Completed" : x.status === "Completed");
    
    const seenDvIds = new Set();
    mus = mus.filter(mu => {
      const key = mu.dvId || mu.mid;
      if (seenDvIds.has(key)) return false;
      seenDvIds.add(key);
      return true;
    });

    if(mus.length === 0) {
      html += `<div class="empty">No ${status.toLowerCase()} make-ups in this period.</div>`;
    } else {
      html += `<div style="display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding-right: 4px;">${mus.map(mu => muRow(mu)).join("")}</div>`;
    }
  } else {
    let recs = cat === "Occurrences" ? m.emps.flatMap(e=>occurrenceGroups(e.id,m.from,m.to).map(g=>{const r=m.recs.find(x=>x.empId===e.id&&g.dates.includes(x.date)&&occurrenceNumber(x.occurrence)>0)||g.records?.[0];return r?{...r,_occGroup:g,date:g.dates[0]}:null}).filter(Boolean)) : m.recs.filter(r => r.type === cat);
    recs.sort((a,b) => b.date.localeCompare(a.date));
    if(recs.length === 0) {
      html += `<div class="empty">No records in this period.</div>`;
    } else {
      html += `<div class="tbl-wrap" style="max-height: 60vh; overflow-y: auto;"><table><thead><tr><th style="text-align:left">Date</th><th style="text-align:left">Employee</th><th style="text-align:left">Type / Time</th><th style="text-align:left">Notes</th></tr></thead><tbody>${recs.map(r => rowRecord(r, false)).join("")}</tbody></table></div>`;
    }
  }

  html += `<div class="mfoot mt"><button class="btn ghost" onclick="closeModal()">Close</button></div>`;
  openModal(html);
  
  const mh = $("#modalHost");
  if (cat === "Perfect") {
    mh.querySelectorAll("tr[data-emp]").forEach(tr=>tr.onclick=()=>{closeModal(); empModal(tr.dataset.emp);});
  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    mh.querySelectorAll("[data-mu-act]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const act=b.dataset.muAct, id=b.dataset.id;
      if(act==="edit") { makeupModal(id); }
      else { setMuStatus(id, act==="complete"?"Completed":"Scheduled"); backModal(); }
    });
  } else {
    bindRecordButtons(mh);
  }
}

function calShift(dir){
  const d=parseISO(UI.anchor);
  if(UI.preset==="day") UI.anchor=addDays(UI.anchor,dir);
  else if(UI.preset==="week") UI.anchor=addDays(UI.anchor,7*dir);
  else if(UI.preset==="month"){ d.setMonth(d.getMonth()+dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="quarter"){ d.setMonth(d.getMonth()+3*dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="annual"){ d.setFullYear(d.getFullYear()+dir); UI.anchor=isoDate(d); }
  else { const [f,t]=range(); const n=Math.max(1,Math.round((parseISO(t)-parseISO(f))/864e5)+1); UI.from=addDays(f,n*dir); UI.to=addDays(t,n*dir); }
  render();
}

function setMuStatus(mid,status){
  const m=S.makeups.find(x=>x.mid===mid); if(!m) return;
  m.status=status;
  if (m.activeSegment) m.activeSegment.status = status;
  if (m.scheduleSegments && m.segIndex !== undefined && m.scheduleSegments[m.segIndex]) {
    m.scheduleSegments[m.segIndex].status = status;
  }

  const siblings = (S.makeups || []).filter(sib => (sib.parentMid && sib.parentMid === m.parentMid) || (sib.dvId && sib.dvId === m.dvId));
  const allDone = siblings.length ? siblings.every(s => s.status === "Completed") : (status === "Completed");
  const anyMissed = siblings.some(s => s.status === "Missed");
  const masterStatus = allDone ? "Completed" : (anyMissed ? "Missed" : "Scheduled");

  if (m.scheduleSegments && m.scheduleSegments.length > 0) {
    siblings.forEach(sib => { sib.scheduleSegments = m.scheduleSegments; });
  }

  // Update the linked Make up Time calendar card
  (S.records || []).filter(r =>
    canonicalRecordType(r) === "Make up Time" && (
      (m.dvId && r.dvId === m.dvId) ||
      (r.rid === m.rid) ||
      (m.parentMid && r.rid && r.rid.startsWith(m.parentMid))
    )
  ).forEach(r => { r.completed = allDone; });

  if (m.dvId) {
    const makeUpString = (m.scheduleSegments && m.scheduleSegments.length > 0)
      ? m.scheduleSegments.map(s => `${s.displayDate} - ${s.start} - ${s.end} - ${s.duration} - [${s.status || "Scheduled"}]`).join(", ")
      : undefined;
    const payload = {
      cr714_completed: allDone,
      cr714_makeupdisposition: masterStatus
    };
    if (makeUpString !== undefined) payload.cr714_makeuptime = makeUpString;
    patchDataverseRecord(m.dvId, payload).catch(e => console.warn("Make-up patch failed:", e));
  }

  if (status === "Completed") {
    m.completedDate = today();
    toast(allDone ? "All make-up shifts completed!" : "Make-up shift marked completed");
  } else {
    toast("Shift marked " + status.toLowerCase());
  }

  recalculateAfterDedupe();
  save();
  render();
}

function renderRecordTableRows(recs) {
  const consumedRids = new Set();
  const out = [];

  for (const r of (recs || [])) {
    if (consumedRids.has(r.rid)) continue;
    const g = r._occGroup || occurrenceGroupForRecord(r);
    if (g && g.grouped) {
      // Pull all records belonging to this group so they appear together inside one unified block
      const groupRecs = (recs || []).filter(x => x.empId === r.empId && g.dates.includes(x.date) && !consumedRids.has(x.rid));
      if (groupRecs.length > 0) {
        groupRecs.forEach(x => consumedRids.add(x.rid));
        out.push(renderGroupedRecordBlockRow(g, groupRecs));
        continue;
      }
    }
    consumedRids.add(r.rid);
    out.push(rowRecord(r, false));
  }
  return out.join("");
}

    if (t === "Present" || t === "Cancellation") return;
    if (!validCalendarIso(rec.date)) return;
    const inWindow = (rec.date >= minDate && rec.date <= maxDate && rec.date !== baseDate) || rec.date === selectedGroupDate;
    if (!inWindow) return;
    if (!byDate.has(rec.date)) byDate.set(rec.date, rec);
  });

  const candidates = [...byDate.values()].sort((a, b) => b.date.localeCompare(a.date));
  if (!candidates.length) {
    return `<option value="">— No submissions in last 7 days —</option>`;
  }
  return `<option value="">— None (Single occurrence) —</option>` + candidates.map(rec => {
    const t = canonicalRecordType(rec);
    const hrs = rec.hours ? ` (${rec.hours}h)` : "";
    return `<option value="${esc(rec.date)}" ${rec.date === selectedGroupDate ? "selected" : ""}>${fmt(rec.date)} — ${esc(t)}${esc(hrs)}</option>`;
  }).join("");
}

function buildShiftTradeSelect(currentVal) {
  const cur = String(currentVal || "").trim();
  const shifts = [
    "First (7:30-4:30)",
    "Second (8:00-5:00)",
    "Third (8:30-5:30)",
    "Fourth (9:00-6:00)",
    "Fifth (10:00-7:00)",
    "Sixth (12:00-9:00)"
  ];
  const allShifts = [...new Set([...(cur && !shifts.includes(cur) ? [cur] : []), ...shifts])];
  return `<select id="mShiftTrade">
    <option value="">— Select Shift Trade —</option>
    ${allShifts.map(s => `<option value="${esc(s)}" ${s === cur ? "selected" : ""}>${esc(s)}</option>`).join("")}
  </select>`;
}

        ampm = String(ampm || "").toUpperCase();

        if (ampm === "AM" && hr === 12) hr = 0;
        return hr + (min / 60);

        if (b <= a) b += 24;

  function calculateTotalMakeupHours(shifts) {
    let totalMinutes = 0;

        const [startH, startM] = shift.startTime.split(':').map(Number);
        const [endH, endM] = shift.endTime.split(':').map(Number);
        let startTotal = startH * 60 + startM;
        let endTotal = endH * 60 + endM;
        if (endTotal <= startTotal) endTotal += 24 * 60; // Handle overnight shifts if any
        let diff = endTotal - startTotal;
        // Automatically deduct 30 mins (0.5h) or 1h for lunch if shift > 5 hours, or keep raw duration:
        totalMinutes += diff;
      }
    });

    const occurrence = parseInt($("#mOcc").value, 10) || 0;

    let makeUpString = "";
    if (type === "Make up Time" && makeupShifts.length > 0) {
      let totalMinutes = 0;
      const shiftRows = makeupShifts.map(s => {
        const [y, m, d] = s.date.split("-");
        const usDate = `${m}/${d}/${y}`;
        const [sh, sm] = s.startTime.split(':').map(Number);
        const [eh, em] = s.endTime.split(':').map(Number);
        let sMin = sh * 60 + sm, eMin = eh * 60 + em;
        if (eMin <= sMin) eMin += 24 * 60;
        const diffMin = eMin - sMin;
        totalMinutes += diffMin;

        const durH = Math.floor(diffMin / 60);
        const durM = diffMin % 60;
        const durStr = `${String(durH).padStart(2,'0')}:${String(durM).padStart(2,'0')}`;

          const [h24, m24] = t24.split(':').map(Number);

        return `${usDate} - ${format12(s.startTime)}-${format12(s.endTime)} - ${durStr} - [Scheduled]`;
      });

      makeUpString = shiftRows.join(", ");

      const totalM = totalMinutes % 60;
      const totalStr = `${String(totalH).padStart(2,'0')}:${String(totalM).padStart(2,'0')}`;

      const noteLines = makeupShifts.map(s => {
        const [y, m, d] = s.date.split("-");

        const [sh, sm] = s.startTime.split(':').map(Number);
        const [eh, em] = s.endTime.split(':').map(Number);
        let sMin = sh * 60 + sm, eMin = eh * 60 + em;
        if (eMin <= sMin) eMin += 24 * 60;
        const diffMin = eMin - sMin;
        const durH = Math.floor(diffMin / 60);
        const durM = diffMin % 60;
        const durStr = `${String(durH).padStart(2,'0')}:${String(durM).padStart(2,'0')}`;
        
        const format12 = (t24) => {
          const [h24, m24] = t24.split(':').map(Number);
          const ampm = h24 >= 12 ? "PM" : "AM";
          const h12 = h24 % 12 || 12;
          return `${h12}:${String(m24).padStart(2,'0')} ${ampm}`;
        };
        return `${usDate} - ${format12(s.startTime)}-${format12(s.endTime)} - ${durStr}`;
      });

      notes = `Worked ${totalStr} before leaving (or after arriving late):\n` + noteLines.join("\n") + `\nTotal Hours: ${totalStr}`;
    }

    if (rid) {
      const targetRec = S.records.find(x => x.rid === rid);
      if (targetRec) {
        showSyncCover("Updating record in Dataverse...");
        try {
          const toUSDate = (iso) => {
            const [y, m, d] = iso.split("-");
            return `${m}/${d}/${y}`;
          };

          if (!groupWithDate && reverseLinked && reverseLinked.groupWithDate === targetRec.date) {
            reverseLinked.groupWithDate = "";
            const cleanedSiblingWf = stripGroupWithTag(reverseLinked.rawWorkforceBody || reverseLinked.wfNotes || "");
            reverseLinked.rawWorkforceBody = cleanedSiblingWf;
            reverseLinked.wfNotes = cleanedSiblingWf;
            if (reverseLinked.dvId) {
              await patchDataverseRecord(reverseLinked.dvId, { cr714_wfnotes: cleanedSiblingWf });
            }
          }

          if(targetRec.dvId){
            const usFrom = toUSDate(dFrom);
            const usTo = toUSDate(dTo);

            const localSnapshot=(S.csrAttendanceRows||[]).find(x=>String(x._timeOffId||"")===String(targetRec.dvId||"")||normalizeMatchId(x.cr714_id)===normalizeMatchId(targetRec.requestId));
            if(localSnapshot)Object.assign(localSnapshot,snapshotRow,{_timeOffId:targetRec.dvId,_snapshotSource:true});

            await patchCsrAttendanceRecord(targetRec.attendanceId,{startDate:dFrom,endDate:dTo,type,notes:notes||cleanWfNotes,occurrence,requestId:targetRec.requestId,employeeName:emp(empId)?.name||""});
          }else{
            throw new Error("This calendar row has no Dataverse Time Off ID or CSR Attendance ID and cannot be updated safely.");
          }

          const familyUpdate=replaceCalendarRequestFamily(targetRec,{startDate:dFrom,endDate:dTo,empId,type,hours,notes,wfNotes:cleanWfNotes,rawWorkforceBody:wfNotesForDv,groupWithDate,partialShift,shiftTrade,fmla,voicemail,oss,voucher,completed,occurrence});
          toast(groupWithDate ? `Grouped with ${fmt(groupWithDate)}` : `Request updated across ${familyUpdate.updatedDays} calendar day${familyUpdate.updatedDays===1?"":"s"}`);
        } catch (err) {
          console.error("Update failed:", err);
          if (err.message.includes("404")) {
            S.records = S.records.filter(r => r.dvId !== targetRec.dvId);
            S.makeups = S.makeups.filter(m => m.dvId !== targetRec.dvId);
            save(); backModal(); render(); toast("Record was deleted in Dataverse. Removed locally.");
          } else {
            toast("Failed to update record: " + err.message);
          }
        } finally {
          hideSyncCover();
        }
      }
    } else {
      let current = parseISO(dFrom);
      const end = parseISO(dTo);
      const selectedEmp = emp(empId);
      
      showSyncCover("Creating record in Dataverse...");
      try {
        const token = await getDataverseToken();
        if (!token) throw new Error("Authentication missing");

        while(current <= end) {
          const manualId = `M-${Date.now().toString(36).slice(-4).toUpperCase()}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;

          const curDateStr = isoDate(current);
          const usDateStr = `${curDateStr.split('-')[1]}/${curDateStr.split('-')[2]}/${curDateStr.split('-')[0]}`;
          const payload = {
            cr714_id: manualId,
            cr714_name: selectedEmp ? selectedEmp.name : empId,
            cr714_email: selectedEmp ? selectedEmp.email : "",
            cr714_startdate: usDateStr,
            cr714_enddate: usDateStr,
            cr714_leavetype: type,
            cr714_requestnotes: notes,
            cr714_wfnotes: wfNotesForDv,
            cr714_occurrence: String(occurrence),
            cr714_ptohoursrequested: String(hours),
            cr714_hoursofpartialshift: partialShift,
            cr714_shifttrade: shiftTrade,
            cr714_makeuptime: makeUpString,
            cr714_fmla: fmla ? "true" : "false",
            cr714_voicemail: voicemail ? "true" : "false",
            cr714_oss: oss ? "true" : "false",

function csrRowMatchesFilters(row){

  if(UI.title&&employee?.title!==UI.title)return false;

  if(UI.manager&&employee?.manager!==UI.manager)return false;

async function restoreCancelledRecord(rid){
  const target=(S.records||[]).find(r=>r.rid===rid);
  if(!target)return;
  try{
    const familyIds=[...new Set((target.familyDvIds?.length?target.familyDvIds:[target.dvId]).filter(Boolean))];
    if(familyIds.length)await Promise.all(familyIds.map(id=>patchDataverseRecord(id,{cr714_cancelledrequest:false})));
    (S.records||[]).filter(r=>(r.familyDvIds||[r.dvId]).some(id=>familyIds.includes(id))||r.rid===rid).forEach(r=>r.cancelled=false);
    (S.makeups||[]).filter(m=>familyIds.includes(m.dvId)).forEach(m=>m.status="Scheduled");
    save();render();toast("Request restored and returned to the calendar");
  }catch(err){console.error(err);toast("Restore failed: "+err.message);}
}

function render(){
  const dedupeResult = recalculateAfterDedupe();
  if (dedupeResult.removedRecords || dedupeResult.removedMakeups) save();
  renderNav(); renderFilters(); setSync("");
  document.body.classList.toggle("employee-data-active",UI.tab==="employeeData");
  const v=$("#view");
  try {
    switch(UI.tab){
      case "dashboard": v.innerHTML=renderDashboard(); drawCharts(); break;
      case "occurrenceOverview": v.innerHTML=renderOccurrenceOverview(); break;
      case "calendar":  v.innerHTML=renderCalendar(); break;
      case "team":      v.innerHTML=renderTeam(); break;
      case "cancellations": v.innerHTML=renderCancellations(); break;
      case "csrAttendance": v.innerHTML=renderCsrAttendance(); break;
      case "employeeData":
        v.innerHTML=renderEmployeeData();
        hydrateEmployeeDataFrame();
        break;
      case "makeup":    v.innerHTML=renderMakeup(); break;
      case "email":     v.innerHTML=renderEmail(); break;
    }
  } catch(err) {
    console.error("Tab render failed:", err);
    v.innerHTML = `<div class="card empty"><h2 style="color:var(--red)">Render Error</h2><p>${esc(err.message)}</p><button class="btn sm" onclick="location.reload()">Reload</button></div>`;
  }
  bindView();
}

  // Date and period filters operate on the daily IndexedDB cache. Use Sync for a fresh Dataverse pull.
});
$("#filterBar").addEventListener("input",e=>{ if(e.target.id==="fQ"){ UI.q=e.target.value;
  clearTimeout(window._qh); window._qh=setTimeout(render,250); }});
$("#filterBar").addEventListener("click",e=>{ if(e.target.id==="fClear"){
  Object.assign(UI,{preset:"month",anchor:today(),from:null,to:null,dept:"",repName:"",title:"",supervisor:"",manager:"",q:"",type:""}); render(); }});

$("#syncBtn").onclick=async(e)=>{await pullFromDataverse(false, {full: e.shiftKey});};
const reconcileReportBtn=$("#reconcileReportBtn"); if(reconcileReportBtn) reconcileReportBtn.onclick=reconciliationReportModal;
updateReconciliationBadge();
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

renderNav(); renderFilters(); setSync("Loading local cache...");

</script>
</body>
</html>
