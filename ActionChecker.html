
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ACT Ultimate Pro - Polished</title>
<script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#15161a;
  --panel:#1e2026;
  --card:#272a33;
  --accent:#00b8ff;
  --accent-soft:#3fd0ff;
  --text:#f5f6f7;
  --muted:#a9adb4;
  --line:#30323b;
  --success:#6de0a3;
  --warn:#ffd166;
  --danger:#ff6b6b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",system-ui;
  background:linear-gradient(180deg,#111 0%,#181a1f 100%);
  color:var(--text);
}
.container{
  max-width:1400px;
  margin:auto;
  padding:18px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 18px;
  margin-bottom:16px;
  box-shadow:0 12px 32px rgba(0,0,0,.4);
}
.title{
  font-weight:900;
  font-size:1.2rem;
}
.sub{
  font-size:.8rem;
  color:var(--muted);
}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  background:var(--panel);
  padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  margin-bottom:16px;
}
input,button{
  border:none;
  border-radius:999px;
  padding:10px 14px;
  font-size:.9rem;
}
input{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--line);
}
button{
  cursor:pointer;
  background:var(--accent);
  color:#041019;
  font-weight:800;
  transition:.15s;
}
button.secondary{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--line);
}
button:hover{
  transform:translateY(-1px);
}
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-bottom:16px;
}
.kpi{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
}
.kpi .label{
  font-size:.75rem;
  color:var(--muted);
}
.kpi .val{
  font-size:1.6rem;
  font-weight:900;
}
.tableWrap{
  background:var(--panel);
  border-radius:14px;
  border:1px solid var(--line);
  overflow:auto;
  max-height:65vh;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
}
th{
  position:sticky;
  top:0;
  background:var(--panel);
  font-size:.75rem;
  text-transform:uppercase;
  color:var(--muted);
}
.badge{
  background:#2d313a;
  border-radius:999px;
  padding:4px 8px;
  font-size:.7rem;
  margin-right:5px;
  display:inline-block;
}
.footer{
  margin-top:10px;
  font-size:.75rem;
  color:var(--muted);
}
</style>
</head>
<body>
<div class="container">
<div class="header">
 <div>
  <div class="title">ACT Ultimate Pro</div>
  <div class="sub">Metadata aware • Cached • Excel merge • Rep normalization</div>
 </div>
 <div>
  <button onclick="refreshData()" class="secondary">Refresh Cache</button>
 </div>
</div>

<div class="controls">
  <input type="file" id="file">
  <input id="filter" placeholder="Filter Account #">
  <button onclick="run()">Run Lookup</button>
  <button onclick="exportExcel()" class="secondary">Export Excel</button>
</div>

<div class="kpis">
  <div class="kpi"><div class="label">Accounts</div><div id="kRows" class="val">0</div></div>
  <div class="kpi"><div class="label">No Action</div><div id="kNone" class="val">0</div></div>
</div>

<div class="tableWrap">
<table>
<thead>
<tr><th>Account</th><th>Datasets</th><th>Rep</th><th>Actions</th></tr>
</thead>
<tbody id="tbl"></tbody>
</table>
</div>
</div>

<script>
const DV="https://org23279050.crm.dynamics.com/api/data/v9.2";
let cache={}, uploaded=[], results=[];
const repMap={"L BROWN":"LOUISE BROWN"};
function normAcct(v){return (v||'').toUpperCase()}
function normRep(v){let r=(v||'').toUpperCase().replace(/\s+/g,' ');return repMap[r]||r}

async function fetchEntity(e,a,rn,ac){
 if(cache[e]) return cache[e];
 const res=await fetch(`${DV}/${e}s?$select=${a},${rn},${ac}`);
 const json=await res.json();
 cache[e]=json.value; return json.value;
}
function refreshData(){cache={};alert('Cache cleared');}

file.onchange=e=>{
 const reader=new FileReader();
 reader.onload=x=>{
  const wb=XLSX.read(x.target.result,{type:'array'});
  const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  const col=Object.keys(data[0]).find(k=>k.toLowerCase().includes('account'));
  uploaded=data.map(r=>normAcct(r[col]));
 };
 reader.readAsArrayBuffer(e.target.files[0]);
};

async function run(){
 results={};
 const filter=normAcct(document.getElementById('filter').value);
 const sets=[
  ['cr714_accountmanagementdataset','cr714_accountnum','cr714_rep','cr714_action','AM'],
  ['cr714_cadencedataset','cr714_accountnum','cr714_retentionrep','cr714_action','CAD'],
  ['cr714_prospectingdataset','cr714_accountnum','cr714_repassignedisr','cr714_action','PS']
 ];

 for(const s of sets){
  const rows=await fetchEntity(...s);
  rows.forEach(r=>{
   const acct=normAcct(r[s[1]]);
   if((!uploaded.length||uploaded.includes(acct)) && (!filter||acct.includes(filter))){
    if(!results[acct]) results[acct]={Account:acct,Datasets:new Set(),Reps:new Set(),Actions:new Set()};
    results[acct].Datasets.add(s[4]);
    const rep=normRep(r[s[2]]);
    if(rep) results[acct].Reps.add(rep);
    results[acct].Actions.add(r[s[3]]||'No Action');
   }
  });
 }
 render();
}

function render(){
 const arr=Object.values(results);
 document.getElementById('kRows').innerText=arr.length;
 document.getElementById('kNone').innerText=arr.filter(x=>[...x.Actions].includes('No Action')).length;
 document.getElementById('tbl').innerHTML=arr.map(r=>`<tr>
  <td>${r.Account}</td>
  <td>${[...r.Datasets].map(d=>`<span class='badge'>${d}</span>`).join(' ')}</td>
  <td>${[...r.Reps].join(', ')}</td>
  <td>${[...r.Actions].join(', ')}</td>
 </tr>`).join('');
}

function exportExcel(){
 const arr=Object.values(results).map(r=>({Account:r.Account,Datasets:[...r.Datasets].join(', '),Reps:[...r.Reps].join(', '),Actions:[...r.Actions].join(', ')}));
 const wb=XLSX.utils.book_new();
 const ws=XLSX.utils.json_to_sheet(arr);
 XLSX.utils.book_append_sheet(wb,ws,'Results');
 XLSX.writeFile(wb,'ACT_Ultimate_Pro.xlsx');
}
</script>
</body>
</html>
