
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ACT Ultimate Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:Segoe UI;background:#1e1f23;color:#fff;padding:16px}
input,button{margin:6px;padding:8px;border-radius:8px;border:none}
button{cursor:pointer;background:#00b8ff;color:#000;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border-bottom:1px solid #444;padding:8px}
th{background:#2a2c32}
.kpi{margin:5px;padding:10px;background:#2a2c32;border-radius:8px;display:inline-block}
.badge{padding:3px 6px;border-radius:6px;background:#444}
</style>
</head>
<body>
<h2>ACT Ultimate Pro</h2>
<input type="file" id="file">
<input id="filter" placeholder="Filter account">
<button onclick="run()">Run</button>
<button onclick="refreshData()">Refresh Data</button>
<button onclick="exportExcel()">Export</button>
<div>
<span class="kpi">Rows: <span id="r">0</span></span>
<span class="kpi">No Action: <span id="n">0</span></span>
</div>
<table>
<thead>
<tr><th>Account</th><th>Datasets</th><th>Rep (Normalized)</th><th>Actions</th></tr>
</thead>
<tbody id="t"></tbody>
</table>
<script>
const DV="https://org23279050.crm.dynamics.com/api/data/v9.2";
let cache={}, uploaded=[], results=[];

// Rep alias map
const repMap={
 "L BROWN":"LOUISE BROWN",
 "LOU BROWN":"LOUISE BROWN"
};

function normAcct(v){return (v||'').toUpperCase()}
function normRep(v){let r=(v||'').toUpperCase().replace(/\s+/g,' '); return repMap[r]||r}

async function fetchEntity(entity,acct,rep,action){
 if(cache[entity]) return cache[entity];
 const res=await fetch(`${DV}/${entity}s?$select=${acct},${rep},${action}`);
 const json=await res.json();
 cache[entity]=json.value;
 return json.value;
}

function refreshData(){cache={}; alert('Cache cleared ✔')}

// Upload
file.onchange=e=>{
 const reader=new FileReader();
 reader.onload=x=>{
  const wb=XLSX.read(x.target.result,{type:'array'});
  const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  const col=Object.keys(data[0]).find(k=>k.toLowerCase().includes('account'));
  uploaded=data.map(r=>normAcct(r[col]));
 };
 reader.readAsArrayBuffer(e.target.files[0]);
};

async function run(){
 results={};
 const filter=normAcct(document.getElementById('filter').value);
 const sets=[
  ['cr714_accountmanagementdataset','cr714_accountnum','cr714_rep','cr714_action','AM'],
  ['cr714_cadencedataset','cr714_accountnum','cr714_retentionrep','cr714_action','CAD'],
  ['cr714_prospectingdataset','cr714_accountnum','cr714_repassignedisr','cr714_action','PS']
 ];

 for(const s of sets){
  const rows=await fetchEntity(...s);
  rows.forEach(r=>{
   const acct=normAcct(r[s[1]]);
   if((!uploaded.length||uploaded.includes(acct)) && (!filter||acct.includes(filter))){
     if(!results[acct]) results[acct]={Account:acct,Datasets:new Set(),Reps:new Set(),Actions:new Set()};
     results[acct].Datasets.add(s[4]);
     const rep=normRep(r[s[2]]);
     if(rep) results[acct].Reps.add(rep);
     const act=r[s[3]]||'No Action';
     results[acct].Actions.add(act);
   }
  });
 }

 render();
}

function render(){
 const arr=Object.values(results);
 document.getElementById('r').innerText=arr.length;
 document.getElementById('n').innerText=arr.filter(x=>[...x.Actions].includes('No Action')).length;
 document.getElementById('t').innerHTML=arr.map(r=>`<tr>
  <td>${r.Account}</td>
  <td>${[...r.Datasets].map(d=>`<span class='badge'>${d}</span>`).join(' ')}</td>
  <td>${[...r.Reps].join(', ')}</td>
  <td>${[...r.Actions].join(', ')}</td>
 </tr>`).join('');
}

function exportExcel(){
 const arr=Object.values(results).map(r=>({
  Account:r.Account,
  Datasets:[...r.Datasets].join(', '),
  Reps:[...r.Reps].join(', '),
  Actions:[...r.Actions].join(', ')
 }));
 const wb=XLSX.utils.book_new();
 const ws=XLSX.utils.json_to_sheet(arr);
 XLSX.utils.book_append_sheet(wb,ws,'Results');
 XLSX.writeFile(wb,'ACT_Ultimate_Pro.xlsx');
}
</script>
</body>
</html>
