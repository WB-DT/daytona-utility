function bind(){q('#connect')?.addEventListener('click',()=>msalAccount?initializeAppAfterLogin():window.login());q('#theme')?.addEventListener('click',theme);q('#demo')?.addEventListener('click',demo);q('#clear')?.addEventListener('click',clear);q('#run')?.addEventListener('click',()=>runReport(state.entityKey));q('#export')?.addEventListener('click',exportCsv);q('#saveLayout')?.addEventListener('click',saveLayout);q('#toggle')?.addEventListener('click',toggle);q('#toggle2')?.addEventListener('click',toggle);q('#next')?.addEventListener('click',nextPage);q('#meta')?.addEventListener('click',()=>loadMeta(state.entityKey,true).then(render).catch(e=>toast(e.message,'error')));q('#addFilter')?.addEventListener('click',addFilter);q('#resetFilters')?.addEventListener('click',()=>{delete state.filters[state.entityKey];render()});q('#navSearch')?.addEventListener('input',e=>qa('.navbtn[data-label]').forEach(b=>b.style.display=b.dataset.label.includes(e.target.value.toLowerCase())?'flex':'none'));q('#colSearch')?.addEventListener('input',e=>qa('.colOpt').forEach(o=>o.style.display=o.dataset.label.includes(e.target.value.toLowerCase())?'inline-flex':'none'));qa('.navbtn[data-ent]').forEach(b=>b.onclick=()=>switchEnt(b.dataset.ent));qa('.colToggle').forEach(c=>c.onchange=colToggle);qa('.rmFilter,.delF').forEach(b=>b.onclick=()=>removeFilter(+b.dataset.i));qa('.ff,.fo,.fv').forEach(e=>e.onchange=updateFilters);q('#sortField')&&(q('#sortField').onchange=updateSort);q('#sortDir')&&(q('#sortDir').onchange=updateSort);qa('.open').forEach(b=>b.onclick=()=>openRow(+b.dataset.i));qa('.cell-edit').forEach(td=>td.ondblclick=()=>editCell(td));qa('.layout').forEach(b=>b.onclick=()=>applyLayout(b.dataset.key))}
function switchEnt(k){state.entityKey=k;state.rows=[];state.next=null;render();runReport(k,{silent:true})}function toggle(){state.collapsed=!state.collapsed;render()}function addFilter(){state.filters[state.entityKey]=[...getFilters(state.entityKey),{field:'createdon',op:'ge',value:DEFAULT_START}];render()}function removeFilter(i){const a=[...getFilters(state.entityKey)];a.splice(i,1);state.filters[state.entityKey]=a;render()}function updateFilters(){state.filters[state.entityKey]=qa('.filterRow').map(r=>({field:r.querySelector('.ff').value.trim(),op:r.querySelector('.fo').value,value:parseVal(r.querySelector('.fv').value.trim())})).filter(x=>x.field)}function updateSort(){state.sort[state.entityKey]=[{field:q('#sortField').value.trim(),dir:q('#sortDir').value}]}function colToggle(e){const k=state.entityKey,c=e.target.dataset.col;let cols=[...getCols(k)];if(e.target.checked&&!cols.includes(c))cols.push(c);if(!e.target.checked)cols=cols.filter(x=>x!==c);state.selected[k]=cols;render()}
async function runReport(k,opt={}){const e=ENT[k];if(!opt.silent)loader(true);try{if(e.virtual){await ensureBase();state.rows=account360();state.lastUrl='virtual://account360';state.next=null}else{await loadMeta(k);const token=await hubToken(PRIMARY_CRM_URL),url=`${PRIMARY_CRM_URL}/${e.set}?${query(k)}`;state.lastUrl=url;const res=await fetch(url,{headers:hdr(token)});if(!res.ok)throw new Error(`Report failed ${res.status}: ${await res.text()}`);const data=await res.json();state.rows=data.value||[];state.next=data['@odata.nextLink']||null;state.cache[k]=state.rows;mergeAct(k)}if(!opt.silent)toast(`${e.label} loaded`,'success')}catch(err){console.error(err);if(!opt.silent)toast(err.message||'Report failed','error')}finally{loader(false);render()}}
async function nextPage(){if(!state.next)return;loader(true);try{const token=await hubToken(PRIMARY_CRM_URL),res=await fetch(state.next,{headers:hdr(token)});if(!res.ok)throw new Error(await res.text());const data=await res.json();state.rows=state.rows.concat(data.value||[]);state.next=data['@odata.nextLink']||null;mergeAct(state.entityKey);toast('Next page loaded','success')}catch(e){toast('Next page failed','error')}finally{loader(false);render()}}
async function loadMeta(k,force=false){const e=ENT[k];if(!e||e.virtual)return synthetic(k);if(state.meta[k]&&!force)return state.meta[k];const token=await hubToken(PRIMARY_CRM_URL),url=`${PRIMARY_CRM_URL}/EntityDefinitions(LogicalName='${e.logical}')/Attributes?$select=LogicalName,SchemaName,DisplayName,AttributeType,IsValidForRead,IsValidForUpdate`;const res=await fetch(url,{headers:hdr(token)});if(!res.ok)throw new Error(`Metadata failed for ${e.label}: ${res.status}`);const data=await res.json();state.meta[k]=(data.value||[]).filter(c=>c.IsValidForRead).map(c=>({name:c.LogicalName,display:c.DisplayName?.UserLocalizedLabel?.Label||c.SchemaName||c.LogicalName,type:c.AttributeType,writable:!!c.IsValidForUpdate})).sort((a,b)=>a.display.localeCompare(b.display));return state.meta[k]}
function query(k){const fs=getFilters(k),sort=getSort(k);return[`$select=${getCols(k).join(',')}`,fs.length?`$filter=${fs.map(filterExpr).join(' and ')}`:null,sort.length?`$orderby=${sort.map(s=>`${s.field} ${s.dir}`).join(',')}`:null].filter(Boolean).join('&')}function filterExpr(x){if(x.op==='contains')return`contains(${x.field}, '${od(x.value)}')`;if(typeof x.value==='number'||typeof x.value==='boolean')return`${x.field} ${x.op} ${x.value}`;if(isIso(x.value))return`${x.field} ${x.op} ${x.value}`;return`${x.field} ${x.op} '${od(x.value)}'`}function hdr(t){return{Authorization:`Bearer ${t}`,Accept:'application/json','OData-MaxVersion':'4.0','OData-Version':'4.0',Prefer:'odata.include-annotations="*"'}}
async function ensureBase(){if(state.cache.accounts?.length)return;if(!msalAccount&&!state.demo)return;for(const k of ['accounts','contacts','incidents','msdyn_workorders'])if(!state.cache[k]?.length)await fetchCache(k)}async function fetchCache(k){const e=ENT[k];await loadMeta(k).catch(()=>{});const token=await hubToken(PRIMARY_CRM_URL),res=await fetch(`${PRIMARY_CRM_URL}/${e.set}?${query(k)}`,{headers:hdr(token)});if(!res.ok)throw new Error(`Cache load failed: ${e.label}`);state.cache[k]=(await res.json()).value||[]}
function acct(v){return String(v||'').trim().replace(/^0+/,'').toUpperCase()}function actBy(a){const k=acct(a);if(!k)return null;if(window.recordsMap?.has(k))return window.recordsMap.get(k);return(window.allRecords||[]).find(r=>acct(r.cr714_accountnum||r.cr714_id||r.accountnumber)===k)||null}function mergeAct(k){const join=ENT[k].join;if(!join)return;state.rows=state.rows.map(r=>{const a=acct(r[join]),act=actBy(a);return{...r,__actAccountNumber:a,__actRecord:act,__hasActMatch:!!act}})}function account360(){const A=state.cache.accounts||[],C=state.cache.contacts||[],I=state.cache.incidents||[],W=state.cache.msdyn_workorders||[],nums=new Set();A.forEach(a=>nums.add(acct(a.accountnumber)));(window.allRecords||[]).forEach(r=>nums.add(acct(r.cr714_accountnum||r.cr714_id||r.accountnumber)));return[...nums].filter(Boolean).map(n=>{const a=A.find(x=>acct(x.accountnumber)===n)||{},act=actBy(n);return{accountnumber:n,name:a.name||act?.cr714_company||act?.companyName||'',actMatch:!!act,actAction:act?.cr714_action||act?.action||'',actFollowUp:act?.cr714_followup||act?.followup||'',contactCount:C.filter(x=>acct(x.mss_accountnumber)===n).length,caseCount:I.filter(x=>acct(x.mss_accountnumber)===n).length,workOrderCount:W.filter(x=>acct(x.mss_accountnumber)===n).length,ownerid:a.ownerid||'',modifiedon:a.modifiedon||act?.modifiedon||'',__hasActMatch:!!act,__actRecord:act}})}
function editCell(td){if(td.dataset.write!=='true')return;const tr=td.closest('tr'),i=+tr.dataset.i,c=td.dataset.col,old=state.rows[i][c]??'';td.innerHTML=`<input value="${h(String(old))}"/>`;const inp=td.querySelector('input');inp.focus();inp.select();inp.onkeydown=e=>{if(e.key==='Enter')commit(i,c,inp.value);if(e.key==='Escape')render()};inp.onblur=()=>commit(i,c,inp.value)}function commit(i,c,v){const e=ENT[state.entityKey],r=state.rows[i],rid=r[e.id];r[c]=v;if(!state.dirty.has(rid))state.dirty.set(rid,{});state.dirty.get(rid)[c]=v;render()}async function saveDirty(r){const e=ENT[state.entityKey],rid=r[e.id],changes=state.dirty.get(rid);if(!changes)return;const token=await hubToken(PRIMARY_CRM_URL),res=await fetch(`${PRIMARY_CRM_URL}/${e.set}(${rid})`,{method:'PATCH',headers:{...hdr(token),'Content-Type':'application/json'},body:JSON.stringify(changes)});if(!res.ok)throw new Error(`Save failed: ${res.status} ${await res.text()}`);state.dirty.delete(rid);toast('CRM record updated','success');render()}
function openRow(i){const r=state.rows[i],e=ENT[state.entityKey],rid=r[e.id]||r.accountnumber||i,dirty=state.dirty.has(rid);modal(`<div class="flex justify-between mb-3"><div><div class="muted text-xs font-black uppercase">${h(e.label)}</div><div class="text-xl font-black">${h(r[e.display]||rid)}</div></div><button class="btn-secondary" onclick="hideModal()">Close</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-3">${Object.entries(r).filter(([k])=>!k.startsWith('__')).map(([k,v])=>`<div class="card p-2"><div class="muted text-xs font-black uppercase">${h(k)}</div><div class="break-all">${h(f(v))}</div></div>`).join('')}</div><div class="flex justify-end gap-2"><button class="btn-secondary" onclick="copyQuery()">Copy Query</button>${dirty?`<button class="btn-primary" onclick="saveDirtyById('${h(String(rid))}')">Save Changes</button>`:''}</div>`)}window.saveDirtyById=async rid=>{const e=ENT[state.entityKey],r=state.rows.find(x=>String(x[e.id]||x.accountnumber)===String(rid));if(r)await saveDirty(r);hideModal()};window.copyQuery=()=>{navigator.clipboard?.writeText(state.lastUrl||'');toast('Query copied','success')};

function saveLayout(){const name=prompt('Layout name?',`${ENT[state.entityKey].label} Layout`);if(!name)return;const key=`${state.entityKey}_${Date.now()}`;state.layouts[key]={name,entityKey:state.entityKey,columns:getCols(state.entityKey),filters:getFilters(state.entityKey),sort:getSort(state.entityKey)};localStorage.setItem('actRH.layouts',JSON.stringify(state.layouts));toast('Layout saved','success');render()}function applyLayout(k){const l=state.layouts[k];if(!l)return;state.entityKey=l.entityKey;state.selected[l.entityKey]=l.columns;state.filters[l.entityKey]=l.filters;state.sort[l.entityKey]=l.sort;render();runReport(l.entityKey,{silent:true})}function exportCsv(){const cols=getCols(state.entityKey),csv=[cols.join(','),...state.rows.map(r=>cols.map(c=>csvEsc(r[c])).join(','))].join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ACT_ReportingHub_${state.entityKey}_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url)}
function getCols(k){return state.selected[k]||ENT[k].cols||[]}function getFilters(k){return state.filters[k]||ENT[k].filters||[]}function getSort(k){return state.sort[k]||ENT[k].sort||[]}function synthetic(k){return(ENT[k].cols||[]).map(c=>({name:c,display:c,type:'Default',writable:!ENT[k].virtual}))}function colLabel(k,c){return(state.meta[k]||synthetic(k)).find(x=>x.name===c)?.display||c}function writable(k,c){const m=state.meta[k]||[];return m.find(x=>x.name===c)?.writable??true}function parseVal(v){if(v==='true')return true;if(v==='false')return false;if(v!==''&&!Number.isNaN(Number(v))&&!isIso(v))return Number(v);return v}function isIso(v){return /^\d{4}-\d{2}-\d{2}T/.test(String(v))}function od(v){return String(v).replaceAll("'","''")}function f(v){if(v==null)return'';return typeof v==='object'?JSON.stringify(v):String(v)}function h(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function csvEsc(v){const s=f(v);return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s}function q(s){return document.querySelector(s)}function qa(s){return[...document.querySelectorAll(s)]}function loader(v){q('#loader').style.display=v?'flex':'none'}function toast(msg,type='info'){const el=document.createElement('div');el.className=`toast ${type}`;el.innerHTML=h(msg);q('#toasts').appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),250)},3500)}function modal(x){q('#modalBody').innerHTML=x;q('#modal').style.display='flex'}function hideModal(){q('#modal').style.display='none';q('#modalBody').innerHTML=''}window.hideModal=hideModal;q('#modal')?.addEventListener('click',e=>{if(e.target.id==='modal')hideModal()});function setConnectionStatus(status,msg){const p=q('#connection-pill');if(p)p.innerHTML=`<i class="fa-solid ${status==='connected'?'fa-circle-check':status==='refreshing'?'fa-arrows-rotate fa-spin':status==='warning'?'fa-triangle-exclamation':'fa-circle-xmark'}"></i>${h(msg||status)}`}function theme(){const b=document.body,c=b.dataset.theme||'midnight',n=c==='midnight'?'oled':c==='oled'?'':'midnight';if(n)b.dataset.theme=n;else b.removeAttribute('data-theme');localStorage.setItem('actRH.theme',n)}function hydrate(){const t=localStorage.getItem('actRH.theme');if(t)document.body.dataset.theme=t}function clear(){if(confirm('Clear Reporting Hub layouts/cache?')){localStorage.removeItem('actRH.layouts');state.layouts={};state.meta={};state.cache={};state.rows=[];toast('Cleared','success');render()}}
