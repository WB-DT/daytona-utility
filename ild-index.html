function renderEmployeeFilters(){var defs=CONFIG.employeeInformation.filterFields||[],html='',i,d,opts,sel,count,j,v;for(i=0;i<defs.length;i++){d=defs[i];opts=filterOptions(d.key);sel=S.empFilters[d.key]||{};count=arr(sel).length;html+='<div class="filterBlock"><b class="muted">'+esc(d.label)+' — '+(count?count+' selected':'All')+' / '+opts.length+'</b><select class="multi empFilter" id="ef_'+esc(d.key)+'" data-key="'+esc(d.key)+'" multiple>';for(j=0;j<opts.length;j++){v=opts[j];html+='<option value="'+esc(v)+'" '+(has(sel,v)?'selected':'')+'>'+esc(v)+'</option>'}html+='</select><div class="row"><button class="empAll" data-key="'+esc(d.key)+'">Select All</button><button class="empClr" data-key="'+esc(d.key)+'">Clear</button></div></div>'}$('employeeFilters').innerHTML=html;var sels=document.getElementsByClassName('empFilter');for(i=0;i<sels.length;i++)sels[i].onchange=function(){empChanged(this.getAttribute('data-key'))};var alls=document.getElementsByClassName('empAll');for(i=0;i<alls.length;i++)alls[i].onclick=function(){empSelectAll(this.getAttribute('data-key'))};var clrs=document.getElementsByClassName('empClr');for(i=0;i<clrs.length;i++)clrs[i].onclick=function(){empClear(this.getAttribute('data-key'))}}
function renderFilters(){renderDatasetFilter();renderEmployeeFilters();$('filterSummary').textContent=selectedCount()?selectedCount()+' employee filter value(s) selected':'No employee filters'}
function empChanged(key){var opts=$('ef_'+key).selectedOptions,o={},i;for(i=0;i<opts.length;i++)add(o,opts[i].value);S.empFilters[key]=o;compute();renderAll()}
function empSelectAll(key){var o={},a=filterOptions(key),i;for(i=0;i<a.length;i++)add(o,a[i]);S.empFilters[key]=o;compute();renderAll()}
function empClear(key){S.empFilters[key]={};compute();renderAll()}
function clearAll(){S.empFilters={};S.datasetSearch='';$('datasetSearch').value='';$('dsFilter').value='';$('q').value='';compute();renderAll()}
function filt(rows){var q=norm($('q').value),d=$('dsFilter').value;return rows.filter(function(r){return (!d||r.__datasetKey===d)&&(!q||norm([r['D365 Company Name'],r['Account Number'],r['Assigned Rep'],r.__datasetLabel].join(' ')).indexOf(q)>-1)})}
function render(){compute();$('title').textContent={dash:'Dashboard',new:'D365 Missing From The Three ACT Datasets',notind365:'Dataset Accounts Not Found In D365 M Code',invalid:'Dataset Reps No Longer Inside Sales',all:'All ACT Dataset Records',employees:'Filtered Employee Information',log:'Audit Log'}[view];if(view==='dash')return dash();if(view==='new')return newer();if(view==='notind365')return notind365();if(view==='invalid')return bad();if(view==='all')return all();if(view==='employees')return employees();logs()}
function dash(){$('view').innerHTML='<div class="cards"><div class="card"><div class="metric">'+S.d365.length+'</div><div class="muted">D365 M Code accounts</div></div><div class="card"><div class="metric">'+S.rows.length+'</div><div class="muted">ACT dataset records</div></div><div class="card"><div class="metric">'+S.filteredEmployees.length+'</div><div class="muted">Employees after filters</div></div><div class="card"><div class="metric" style="color:var(--yellow)">'+S.newRows.length+'</div><div class="muted">D365 missing from datasets</div></div><div class="card"><div class="metric" style="color:var(--red)">'+S.notInD365.length+'</div><div class="muted">Dataset not in D365</div></div></div><div class="card" style="margin-top:12px"><b>Corrected sources</b><p class="muted">D365 M Code accounts load from wbmasonco. Employee Information and the three comparison datasets load from org23279050: cr714_accountmanagementdataset, cr714_cadencedataset, cr714_louisebrowndataset.</p>'+CONFIG.datasets.map(function(d){return '<span class="pill">'+esc(d.label)+'</span>'}).join(' ')+'</div>'}
function acct(r){return '<b>'+esc(r['D365 Company Name']||'--')+'</b><div class="muted">'+esc(r['Account ID']||'')+'</div>'}
function tbl(h,rows){return rows.length?'<div class="table"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+(c==null?'':c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>':'<div class="card">No records to show.</div>'}
function rowCommon(r){return [r.__datasetLabel||'',acct(r),esc(r['Account Number']),esc(r['Assigned Rep']),esc(r['Main Email']),esc(r['Main Phone'])]}
function newer(){var rows=filt(S.newRows);$('view').innerHTML=tbl(['Source','Account','Acct #','Assigned Rep','Email','Phone'],rows.map(function(r){return rowCommon(r)}))}
function notind365(){var rows=filt(S.notInD365);$('view').innerHTML=tbl(['Dataset','Account','Acct #','Assigned Rep','Email','Phone'],rows.map(function(r){return rowCommon(r)}))}
function bad(){var rows=filt(S.invalid);$('view').innerHTML=tbl(['Dataset','Account','Acct #','Assigned Rep','Reason'],rows.map(function(r){return [r.__datasetLabel,acct(r),esc(r['Account Number']),'<span class="badge">'+esc(r['Assigned Rep'])+'</span>',esc(r.__auditReason)]}))}
function all(){var rows=filt(S.rows);$('view').innerHTML=tbl(['Dataset','Account','Acct #','Assigned Rep','Email','Phone'],rows.map(function(r){return rowCommon(r)}))}
function employees(){var rows=S.filteredEmployees;$('view').innerHTML=tbl(['SR Manager','Manager Assigned','Supervisor','Rep','Department','Status Name','Domain'],rows.map(function(e){return [esc(e.srmanager),esc(e.managerassigned),esc(e.supervisor),esc(e.rep||e.Name),esc(e.department||e.Team),esc(e.statusname||e.Status),esc(e.Domain)]}))}
function logs(){$('view').innerHTML=tbl(['Time','Type','Message','Detail'],S.logs.map(function(l){return [l.time,l.type,l.msg,'<pre>'+esc(JSON.stringify(l.obj||'',null,2))+'</pre>']}))}
function exportCsv(){var rows=view==='new'?S.newRows:view==='notind365'?S.notInD365:view==='invalid'?S.invalid:view==='employees'?S.filteredEmployees:S.rows;rows=view==='employees'?rows:filt(rows);var cols=view==='employees'?['srmanager','managerassigned','supervisor','rep','department','statusname','Domain']:['__datasetLabel','Account ID','Account Number','D365 Company Name','Assigned Rep','Main Email','Main Phone'];var csv=[cols.join(',')].concat(rows.map(function(r){return cols.map(function(c){return '"'+String(r[c]||'').replace(/"/g,'""')+'"'}).join(',')})).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='act-dataset-d365-audit-'+view+'.csv';a.click()}
init();
</script>
</body>
