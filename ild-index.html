<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLeap Account Search</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(0, 255, 255, 0.15);
            --neon-cyan: #0ff;
            --neon-purple: #b026ff;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 255, 255, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(176, 38, 255, 0.05), transparent 25%);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 2rem;
            width: 100%;
            max-width: 900px;
            margin-bottom: 2rem;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .auth-section, .search-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .search-section {
            display: none; /* Hidden until authenticated */
            flex-direction: row;
            justify-content: center;
        }

        input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--neon-cyan);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
        }

        button {
            padding: 12px 24px;
            background: transparent;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        button.logout-btn {
            border-color: var(--neon-purple);
        }
        
        button.logout-btn:hover {
            background: rgba(176, 38, 255, 0.1);
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
        }

        #statusMessage {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 1rem;
            min-height: 20px;
        }

        .results-container {
            width: 100%;
            max-width: 900px;
            display: none; /* Hidden initially */
        }

        .account-card {
            background: rgba(10, 10, 15, 0.8);
            border-left: 4px solid var(--neon-cyan);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            transition: transform 0.2s ease;
        }

        .account-card:hover {
            transform: translateX(5px);
            border-left-color: var(--neon-purple);
        }

        .account-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-cyan);
            margin-bottom: 0.5rem;
        }

        .account-detail {
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .account-detail strong {
            color: var(--text-muted);
        }

        pre {
            background: #000;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            color: #a8ff60;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>Dynamics 365 Account Explorer</h1>
        
        <div class="auth-section" id="authSection">
            <p>Please sign in to access the W.B. Mason CRM data.</p>
            <button id="loginBtn" onclick="signIn()">Sign In with Microsoft</button>
        </div>

        <div class="search-section" id="searchSection">
            <input type="text" id="searchInput" placeholder="Enter Account Name or Number..." onkeydown="if(event.key === 'Enter') searchAccounts()">
            <button onclick="searchAccounts()">Query Data</button>
            <button class="logout-btn" onclick="signOut()">Sign Out</button>
        </div>

        <div id="statusMessage"></div>
    </div>

    <div class="results-container glass-panel" id="resultsContainer">
        <h2 style="margin-bottom: 1rem; color: #fff; font-size: 1.2rem;">Query Results</h2>
        <div id="resultsList"></div>
    </div>

    <script>
        // --- MSAL CONFIGURATION ---
        const msalConfig = {
            auth: {
                clientId: "YOUR_AZURE_AD_CLIENT_ID", // Replace with your registered SPA Client ID
                authority: "https://login.microsoftonline.com/YOUR_TENANT_ID", // Replace with your Tenant ID
                redirectUri: window.location.origin,
            },
            cache: {
                cacheLocation: "sessionStorage",
                storeAuthStateInCookie: false,
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        // Dynamics 365 Scope and Endpoint 
        const d365ResourceUrl = "https://wbmasonco.crm.dynamics.com";
        const loginRequest = {
            scopes: [d365ResourceUrl + "/user_impersonation"]
        };

        // UI Elements
        const authSection = document.getElementById('authSection');
        const searchSection = document.getElementById('searchSection');
        const statusMessage = document.getElementById('statusMessage');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        const searchInput = document.getElementById('searchInput');

        // --- AUTHENTICATION LOGIC ---
        function checkActiveSession() {
            const currentAccounts = msalInstance.getAllAccounts();
            if (currentAccounts.length > 0) {
                msalInstance.setActiveAccount(currentAccounts[0]);
                showSearchInterface(currentAccounts[0].username);
            }
        }

        async function signIn() {
            try {
                statusMessage.textContent = "Authenticating...";
                const loginResponse = await msalInstance.loginPopup(loginRequest);
                msalInstance.setActiveAccount(loginResponse.account);
                showSearchInterface(loginResponse.account.username);
            } catch (error) {
                console.error("Login failed:", error);
                statusMessage.textContent = "Authentication failed. See console for details.";
            }
        }

        function signOut() {
            const logoutRequest = {
                account: msalInstance.getActiveAccount(),
                postLogoutRedirectUri: window.location.origin
            };
            msalInstance.logoutPopup(logoutRequest);
            authSection.style.display = "flex";
            searchSection.style.display = "none";
            resultsContainer.style.display = "none";
            statusMessage.textContent = "Signed out successfully.";
        }

        function showSearchInterface(username) {
            authSection.style.display = "none";
            searchSection.style.display = "flex";
            statusMessage.textContent = "Connected as: " + username;
        }

        // --- API DATA RETRIEVAL ---
        async function getToken() {
            const account = msalInstance.getActiveAccount();
            if (!account) {
                throw Error("No active account! Verify a user has been signed in.");
            }
            const request = {
                ...loginRequest,
                account: account
            };
            try {
                const response = await msalInstance.acquireTokenSilent(request);
                return response.accessToken;
            } catch (error) {
                if (error instanceof msal.InteractionRequiredAuthError) {
                    const response = await msalInstance.acquireTokenPopup(request);
                    return response.accessToken;
                } else {
                    throw error;
                }
            }
        }

        async function searchAccounts() {
            const searchTerm = searchInput.value.trim();
            if (!searchTerm) {
                statusMessage.textContent = "Please enter a search term.";
                return;
            }

            statusMessage.textContent = "Querying Dataverse...";
            resultsContainer.style.display = "none";
            resultsList.innerHTML = "";

            try {
                const token = await getToken();
                
                // Constructing the OData query 
                // Searching by name or account number (adjust fields based on your schema)
                const queryUrl = `${d365ResourceUrl}/api/data/v9.2/accounts?$filter=contains(name,'${encodeURIComponent(searchTerm)}') or contains(accountnumber,'${encodeURIComponent(searchTerm)}')`;

                const response = await fetch(queryUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'OData-MaxVersion': '4.0',
                        'OData-Version': '4.0',
                        'Accept': 'application/json',
                        'Content-Type': 'application/json; charset=utf-8',
                        'Prefer': 'odata.include-annotations="*"'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                renderResults(data.value);
                statusMessage.textContent = `Search complete. Found ${data.value.length} record(s).`;

            } catch (error) {
                console.error("API Error:", error);
                statusMessage.textContent = "Error fetching data. Ensure CORS is configured in Dynamics 365 and check console.";
            }
        }

        // --- UI RENDERING ---
        function renderResults(records) {
            resultsContainer.style.display = "block";
            
            if (records.length === 0) {
                resultsList.innerHTML = "<p style='color: var(--text-muted);'>No accounts found matching your query.</p>";
                return;
            }

            records.forEach(record => {
                const card = document.createElement('div');
                card.className = 'account-card';

                const name = record.name || 'Unknown Account';
                const accountNum = record.accountnumber || 'N/A';
                const mainPhone = record.telephone1 || 'N/A';
                const accountId = record.accountid;

                let htmlContent = `
                    <div class="account-title">${name}</div>
                    <div class="account-detail"><strong>Account Number:</strong> ${accountNum}</div>
                    <div class="account-detail"><strong>Phone:</strong> ${mainPhone}</div>
                    <div class="account-detail"><strong>GUID:</strong> ${accountId}</div>
                    <button style="margin-top: 10px; font-size: 0.8rem; padding: 6px 12px;" onclick="toggleRawData('${accountId}')">Toggle Raw JSON Payload</button>
                    <div id="raw-${accountId}" style="display: none;">
                        <pre>${JSON.stringify(record, null, 2)}</pre>
                    </div>
                `;
                
                card.innerHTML = htmlContent;
                resultsList.appendChild(card);
            });
        }

        // Helper function to show/hide the full JSON dump for an individual record
        window.toggleRawData = function(id) {
            const rawDiv = document.getElementById(`raw-${id}`);
            if (rawDiv.style.display === "none") {
                rawDiv.style.display = "block";
            } else {
                rawDiv.style.display = "none";
            }
        };

        // Initialize on page load
        checkActiveSession();
    </script>
</body>
</html>
