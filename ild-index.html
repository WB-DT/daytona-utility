<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLeap Account Search</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(0, 255, 255, 0.15);
            --neon-cyan: #0ff;
            --neon-purple: #b026ff;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --danger: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 255, 255, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(176, 38, 255, 0.05), transparent 25%);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 2rem;
            width: 100%;
            max-width: 900px;
            margin-bottom: 2rem;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .auth-section, .search-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .search-section {
            display: none;
            flex-direction: row;
            justify-content: center;
        }

        input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--neon-cyan);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
        }

        button {
            padding: 12px 24px;
            background: transparent;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        button.logout-btn {
            border-color: var(--neon-purple);
        }
        
        button.logout-btn:hover {
            background: rgba(176, 38, 255, 0.1);
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
        }

        #statusMessage {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 1rem;
            min-height: 20px;
            max-width: 600px;
            line-height: 1.5;
        }
        
        .error-text {
            color: var(--danger);
            font-weight: bold;
            background: rgba(255, 51, 102, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 51, 102, 0.3);
        }

        .results-container {
            width: 100%;
            max-width: 900px;
            display: none;
        }

        .account-card {
            background: rgba(10, 10, 15, 0.8);
            border-left: 4px solid var(--neon-cyan);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            transition: transform 0.2s ease;
        }

        .account-card:hover {
            transform: translateX(5px);
            border-left-color: var(--neon-purple);
        }

        .account-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-cyan);
            margin-bottom: 0.5rem;
        }

        .account-detail {
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }

        .account-detail strong {
            color: var(--text-muted);
        }

        pre {
            background: #000;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            color: #a8ff60;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.05);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>Dynamics 365 Account Explorer</h1>
        
        <div class="auth-section" id="authSection">
            <p>Please sign in to access the W.B. Mason CRM data.</p>
            <button id="loginBtn" onclick="signIn()">Sign In with Microsoft</button>
        </div>

        <div class="search-section" id="searchSection">
            <input type="text" id="searchInput" placeholder="Enter Account Name or Number..." onkeydown="if(event.key === 'Enter') searchAccounts()">
            <button onclick="searchAccounts()">Query Data</button>
            <button class="logout-btn" onclick="signOut()">Sign Out</button>
        </div>

        <div id="statusMessage"></div>
    </div>

    <div class="results-container glass-panel" id="resultsContainer">
        <h2 style="margin-bottom: 1rem; color: #fff; font-size: 1.2rem;">Query Results</h2>
        <div id="resultsList"></div>
    </div>

    <script>
        // Exact Redirect URI processing - strips off any # or ? parameters 
        const exactRedirectUri = window.location.href.split('#')[0].split('?')[0];

        const msalConfig = {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: exactRedirectUri, 
            },
            cache: {
                cacheLocation: "sessionStorage",
                storeAuthStateInCookie: false,
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);

        const d365ResourceUrl = "https://wbmasonco.crm.dynamics.com";
        const loginRequest = {
            scopes: [d365ResourceUrl + "/user_impersonation"]
        };

        const authSection = document.getElementById('authSection');
        const searchSection = document.getElementById('searchSection');
        const statusMessage = document.getElementById('statusMessage');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        const searchInput = document.getElementById('searchInput');

        // Environmental Protocol Check
        if (window.location.protocol === "file:") {
            statusMessage.innerHTML = "<div class='error-text'>CRITICAL ERROR: You are running this file directly from your hard drive (file:/// protocol). MSAL Authentication requires a local web server (http://localhost) to function properly. Please open this folder using VS Code and use the 'Live Server' extension.</div>";
            document.getElementById('loginBtn').style.opacity = "0.5";
            document.getElementById('loginBtn').style.pointerEvents = "none";
        }

        function checkActiveSession() {
            const currentAccounts = msalInstance.getAllAccounts();
            if (currentAccounts.length > 0) {
                msalInstance.setActiveAccount(currentAccounts[0]);
                showSearchInterface(currentAccounts[0].username);
            }
        }

        async function signIn() {
            statusMessage.className = "";
            statusMessage.textContent = "Requesting Authentication Window...";
            
            try {
                // The point of failure - wrapped with specific diagnostics
                const loginResponse = await msalInstance.loginPopup(loginRequest);
                msalInstance.setActiveAccount(loginResponse.account);
                showSearchInterface(loginResponse.account.username);
            } catch (error) {
                console.error("MSAL Full Error Object:", error);
                
                let diagnosticMsg = "Authentication Failed: ";
                
                if (error.errorCode === "popup_window_error") {
                    diagnosticMsg += "Your browser blocked the popup window. Please click the popup blocker icon in your address bar and allow popups for this site.";
                } else if (error.errorCode === "redirect_uri_mismatch" || error.message.includes("AADSTS50011")) {
                    diagnosticMsg += `The Reply URL does not match Azure. You must add this exact URL to your Azure App Registration: <br><br><b>${exactRedirectUri}</b>`;
                } else if (error.errorCode === "interaction_in_progress") {
                    diagnosticMsg += "A login window is already open or loading in the background. Please close it and try again.";
                } else if (error.errorCode === "user_cancelled") {
                    diagnosticMsg += "The login window was closed before completing authentication.";
                } else {
                    diagnosticMsg += error.message || "Unknown MSAL Error. Check Developer Console (F12).";
                }

                statusMessage.innerHTML = `<div class='error-text'>${diagnosticMsg}</div>`;
            }
        }

        function signOut() {
            const logoutRequest = {
                account: msalInstance.getActiveAccount(),
                postLogoutRedirectUri: exactRedirectUri
            };
            msalInstance.logoutPopup(logoutRequest);
            authSection.style.display = "flex";
            searchSection.style.display = "none";
            resultsContainer.style.display = "none";
            statusMessage.innerHTML = "Signed out successfully.";
        }

        function showSearchInterface(username) {
            authSection.style.display = "none";
            searchSection.style.display = "flex";
            statusMessage.innerHTML = `Connected as: <span style="color: var(--neon-cyan);">${username}</span>`;
        }

        async function getToken() {
            const account = msalInstance.getActiveAccount();
            if (!account) throw Error("No active account!");
            
            const request = { ...loginRequest, account: account };
            try {
                return (await msalInstance.acquireTokenSilent(request)).accessToken;
            } catch (error) {
                if (error instanceof msal.InteractionRequiredAuthError) {
                    return (await msalInstance.acquireTokenPopup(request)).accessToken;
                } else {
                    throw error;
                }
            }
        }

        async function searchAccounts() {
            const searchTerm = searchInput.value.trim();
            if (!searchTerm) {
                statusMessage.textContent = "Please enter a search term.";
                return;
            }

            statusMessage.textContent = "Querying Dynamics 365...";
            resultsContainer.style.display = "none";
            resultsList.innerHTML = "";

            try {
                const token = await getToken();
                
                const queryUrl = `${d365ResourceUrl}/api/data/v9.2/accounts?$filter=contains(name,'${encodeURIComponent(searchTerm)}') or contains(accountnumber,'${encodeURIComponent(searchTerm)}')`;

                const response = await fetch(queryUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'OData-MaxVersion': '4.0',
                        'OData-Version': '4.0',
                        'Accept': 'application/json',
                        'Content-Type': 'application/json; charset=utf-8',
                        'Prefer': 'odata.include-annotations="*"'
                    }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                renderResults(data.value);
                statusMessage.innerHTML = `Search complete. Found <span style="color: var(--neon-cyan);">${data.value.length}</span> record(s).`;

            } catch (error) {
                console.error("API Error:", error);
                statusMessage.innerHTML = "<div class='error-text'>Error fetching data. Ensure CORS is configured for this URL in Dynamics 365.</div>";
            }
        }

        function renderResults(records) {
            resultsContainer.style.display = "block";
            
            if (records.length === 0) {
                resultsList.innerHTML = "<p style='color: var(--text-muted);'>No accounts found matching your query.</p>";
                return;
            }

            records.forEach(record => {
                const card = document.createElement('div');
                card.className = 'account-card';

                const name = record.name || 'Unknown Account';
                const accountNum = record.accountnumber || 'N/A';
                const mainPhone = record.telephone1 || 'N/A';
                const accountId = record.accountid;

                let htmlContent = `
                    <div class="account-title">${name}</div>
                    <div class="account-detail"><strong>Account Number:</strong> ${accountNum}</div>
                    <div class="account-detail"><strong>Phone:</strong> ${mainPhone}</div>
                    <div class="account-detail"><strong>GUID:</strong> ${accountId}</div>
                    <button style="margin-top: 10px; font-size: 0.8rem; padding: 6px 12px;" onclick="toggleRawData('${accountId}')">Toggle Raw JSON Payload</button>
                    <div id="raw-${accountId}" style="display: none;">
                        <pre>${JSON.stringify(record, null, 2)}</pre>
                    </div>
                `;
                
                card.innerHTML = htmlContent;
                resultsList.appendChild(card);
            });
        }

        window.toggleRawData = function(id) {
            const rawDiv = document.getElementById(`raw-${id}`);
            rawDiv.style.display = rawDiv.style.display === "none" ? "block" : "none";
        };

        checkActiveSession();
    </script>
</body>
</html>
