function filt(rows){var q=norm($('q').value),d=$('dsFilter').value;return rows.filter(function(r){return(!d||r.__datasetKey===d)&&(!q||norm([r['D365 Company Name'],r['Account Number'],r['Assigned Rep'],r.__datasetLabel].join(' ')).indexOf(q)>-1)})}function render(){compute();$('title').textContent={dash:'Dashboard',invalid:'Accounts No Longer Matching Inside Sales',new:'New Accounts Missing From Non-Logistics Datasets',all:'All Loaded Records',employees:'Filtered Employee Information',log:'Audit Log'}[view];if(view==='dash')return dash();if(view==='invalid')return bad();if(view==='new')return newer();if(view==='all')return all();if(view==='employees')return employees();logs()}function dash(){$('view').innerHTML='<div class="cards"><div class="card"><div class="metric">'+S.d365.length+'</div><div class="muted">D365 accounts</div></div><div class="card"><div class="metric">'+S.employees.length+'</div><div class="muted">Employee rows</div></div><div class="card"><div class="metric">'+S.filteredEmployees.length+'</div><div class="muted">Employees after filters</div></div><div class="card"><div class="metric" style="color:#ff6b6b">'+S.invalid.length+'</div><div class="muted">Invalid reps</div></div><div class="card"><div class="metric" style="color:#ffd166">'+S.newRows.length+'</div><div class="muted">New accounts</div></div></div><div class="card" style="margin-top:12px"><b>Mapped datasets</b><p class="muted">Logistics excluded. Session cache pages: '+cacheCount()+'.</p>'+CONFIG.datasets.map(function(d){return'<span class="pill">'+esc(d.label)+(d.excluded?' — omitted':'')+'</span>'}).join(' ')+'</div>'}function acct(r){return'<b>'+esc(r['D365 Company Name']||'--')+'</b><div class="muted">'+esc(r['Account ID']||'')+'</div>'}function tbl(h,rows){return rows.length?'<div class="table"><table><thead><tr>'+h.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+(c==null?'':c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>':'<div class="card">No records to show.</div>'}function bad(){var rows=filt(S.invalid);$('view').innerHTML=tbl(['Dataset','Account','Acct #','Assigned Rep','Reason'],rows.map(function(r){return[r.__datasetLabel,acct(r),esc(r['Account Number']),'<span class="badge">'+esc(r['Assigned Rep'])+'</span>',esc(r.__auditReason)]}))}function newer(){var rows=filt(S.newRows);$('view').innerHTML=tbl(['Account','Acct #','Assigned Rep','Email','Phone'],rows.map(function(r){return[acct(r),esc(r['Account Number']),esc(r['Assigned Rep']),esc(r['Main Email']),esc(r['Main Phone'])]}))}function all(){var rows=filt(S.rows);$('view').innerHTML=tbl(['Dataset','Account','Acct #','Assigned Rep','Email','Phone'],rows.map(function(r){return[r.__datasetLabel,acct(r),esc(r['Account Number']),esc(r['Assigned Rep']),esc(r['Main Email']),esc(r['Main Phone'])]}))}function employees(){var rows=S.filteredEmployees;$('view').innerHTML=tbl(['SR Manager','Manager Assigned','Supervisor','Rep','Department','Status Name','Domain'],rows.map(function(e){return[esc(e.srmanager),esc(e.managerassigned),esc(e.supervisor),esc(e.rep||e.Name),esc(e.department||e.Team),esc(e.statusname||e.Status),esc(e.Domain)]}))}function logs(){$('view').innerHTML=tbl(['Time','Type','Message','Detail'],S.logs.map(function(l){return[l.time,l.type,l.msg,'<pre>'+esc(JSON.stringify(l.obj||'',null,2))+'</pre>']}))}function exportCsv(){var rows=view==='invalid'?S.invalid:view==='new'?S.newRows:view==='employees'?S.filteredEmployees:S.rows;rows=view==='employees'?rows:filt(rows);var cols=view==='employees'?['srmanager','managerassigned','supervisor','rep','department','statusname','Domain']:['__datasetLabel','Account ID','Account Number','D365 Company Name','Assigned Rep','Main Email','Main Phone'];var csv=[cols.join(',')].concat(rows.map(function(r){return cols.map(function(c){return '"'+String(r[c]||'').replace(/"/g,'""')+'"'}).join(',')})).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='act-assignment-audit-'+view+'.csv';a.click()}init();
