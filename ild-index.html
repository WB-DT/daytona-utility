<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.C.T. Manager Console - Concise Rewrite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
  <style>
    :root{--bg:#f1f5f9;--card:#fff;--input:#fff;--text:#0f172a;--muted:#64748b;--line:#cbd5e1;--primary:#0f766e;--primary2:#14b8a6;--danger:#ef4444;--warn:#eab308;--good:#22c55e;--info:#3b82f6;--shadow:0 8px 24px rgba(15,23,42,.08)}
    [data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--input:#0f172a;--text:#f8fafc;--muted:#94a3b8;--line:#334155;--primary:#14b8a6;--primary2:#5eead4;--danger:#f87171;--warn:#facc15;--good:#4ade80;--info:#60a5fa;--shadow:0 12px 32px rgba(0,0,0,.35)}
    *{box-sizing:border-box} body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif} button,input,select,textarea{font:inherit} input,select,textarea{background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;outline:none} input:focus,select:focus,textarea:focus{border-color:var(--primary)}
    .app{height:100vh;display:flex;flex-direction:column} .top{height:58px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:10} .brand{display:flex;align-items:center;gap:10px;font-weight:1000;color:var(--primary);letter-spacing:-.04em} .brand i{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--primary);color:white} .muted{color:var(--muted)}
    .btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:.55rem .8rem;font-weight:850;font-size:12px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap} .btn:hover{border-color:var(--primary);color:var(--primary)} .btn.primary{background:var(--primary);border-color:var(--primary);color:white} .btn.danger{border-color:var(--danger);color:var(--danger)} .btn.good{border-color:var(--good);color:var(--good)} .btn.busy{opacity:.65;pointer-events:none}
    .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);z-index:8} .filter{min-width:160px} .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:.35rem .65rem;font-size:11px;font-weight:900;color:var(--muted);background:var(--input)} .pill.good{color:var(--good);border-color:var(--good)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.danger{color:var(--danger);border-color:var(--danger)}
    .main{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(420px,1fr) 380px;gap:0} .panel{min-height:0;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column} .panel:last-child{border-right:0} .panel-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px} .panel-title{font-size:11px;font-weight:1000;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)} .scroll{overflow:auto;min-height:0;flex:1} .pad{padding:14px}
    .acct{margin:10px 12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 3px 10px rgba(0,0,0,.04);cursor:pointer} .acct:hover,.acct.active{border-color:var(--primary);transform:translateY(-1px)} .acct.help{border-color:var(--danger);box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 15%,transparent)} .acct .name{font-size:13px;font-weight:1000;line-height:1.2} .acct .meta{font-size:10px;font-weight:850;color:var(--muted);display:flex;gap:8px;justify-content:space-between;margin-top:7px} .badge{font-size:9px;font-weight:1000;text-transform:uppercase;border-radius:999px;border:1px solid var(--line);padding:2px 6px;color:var(--muted)}
    .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px;border-bottom:1px solid var(--line)} .hero h2{margin:0;color:var(--primary);font-size:24px;letter-spacing:-.05em;line-height:1} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} .card{border:1px solid var(--line);border-radius:16px;background:var(--input);padding:12px} .label{font-size:9px;font-weight:1000;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:6px} .value{font-size:13px;font-weight:850;overflow-wrap:anywhere} textarea{width:100%;min-height:130px;resize:vertical}
    .history-item{border:1px solid var(--line);border-radius:14px;background:var(--input);padding:10px;margin:10px 12px} .history-item b{font-size:11px;color:var(--primary)} .history-item p{white-space:pre-wrap;font-size:12px;line-height:1.45;margin:.45rem 0 0}
    #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9999} .loader-card{width:min(620px,92vw);padding:30px;border:1px solid color-mix(in srgb,var(--primary) 32%,var(--line));border-radius:28px;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,var(--primary) 8%),var(--card));box-shadow:var(--shadow);text-align:center} .orb{width:84px;height:84px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--info));color:white;font-size:34px;animation:float 1.8s ease-in-out infinite} @keyframes float{50%{transform:translateY(-7px)}} .bar{height:10px;border:1px solid var(--line);background:var(--input);border-radius:999px;overflow:hidden;margin-top:15px} .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--good),var(--info));transition:.25s}
    .modal{position:fixed;inset:0;display:none;z-index:9000;background:var(--bg)} .modal.show{display:flex;flex-direction:column} .modal-frame{flex:1;min-height:0;padding:10px;position:relative} iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:18px;background:var(--card)} .report-loader{position:absolute;inset:10px;display:none;align-items:center;justify-content:center;border-radius:18px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(6px)} .report-loader.show{display:flex}
    .toast-wrap{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99999} .toast{padding:12px 14px;background:var(--card);border-left:4px solid var(--primary);box-shadow:var(--shadow);border-radius:12px;font-size:13px;font-weight:800} .toast.error{border-left-color:var(--danger)} .toast.success{border-left-color:var(--good)} .toast.warn{border-left-color:var(--warn)}
    @media(max-width:1200px){.main{grid-template-columns:320px 1fr} #historyPanel{display:none}} @media(max-width:760px){.main{grid-template-columns:1fr} #detailPanel{display:none} .filters{overflow:auto;flex-wrap:nowrap} .filter{min-width:180px}}
  </style>
</head>

      const helpRaw = clean(r[`${t.help}@OData.Community.Display.V1.FormattedValue`] || r[t.help]);
      const helpUpper = helpRaw.toUpperCase(), msgUpper = msg.toUpperCase();
      return { id, company:clean(r[t.company]||'Unknown Company'), rep, action:clean(r.cr714_action||'Idle'), message:msg, helpStatus:helpRaw, isHelp:msgUpper.includes('[HELP')||helpUpper==='HELP REQUESTED', isClose:msgUpper.includes('[CLOSED')||helpUpper==='CLOSE REQUESTED', intro:!!r.cr714_intro, modifiedon:r.modifiedon, createdon:r.createdon, emailDate:r.cr714_actionemailsent||r.cr714_emailsenttimestamp, contact:r.cr714_namemost||r.cr714_namelatest||'--', phone:r.cr714_primaryphone||r.cr714_phone||'--', email:r.cr714_emailmost||r.cr714_emaillatest||r.cr714_email_latest||'--', address:r.cr714_billingaddress||r.cr714_address||'--', statecode:r.statecode===1?'Inactive':'Active', source:{...t, row:r, recordId:r[t.id]} };
    },
    merge(rows) {
      const map = new Map();
      rows.filter(Boolean).forEach(a => {
        if(!map.has(a.id)) map.set(a.id, {...a, sources:[]});
        const x = map.get(a.id); x.sources.push(a.source);
        if(new Date(a.modifiedon||0) > new Date(x.modifiedon||0)) Object.assign(x, {modifiedon:a.modifiedon, rep:a.rep, action:a.action, message:a.message, helpStatus:a.helpStatus, isHelp:a.isHelp, isClose:a.isClose});
        ['emailDate','contact','phone','email','address'].forEach(k => { if((!x[k]||x[k]==='--') && a[k] && a[k]!=='--') x[k]=a[k]; });
        x.intro = x.intro || a.intro;
      });
      return Array.from(map.values());
    },
    async loadAll() {
      S.loaded=0; load(18,'Loading account datasets...',0);
      const all = await Promise.all(CFG.tables.map(t => Data.fetchPaged(t)));
      S.accounts = Data.merge(all.flat());
      Data.buildFilterOptions(); Filters.apply(); load(100,'Ready',S.loaded); setTimeout(()=>{$('#loader').style.display='none';$('#app').style.display='flex';},350);
    },
    buildFilterOptions() {
      const reps=[...new Set(S.accounts.map(a=>a.rep).filter(Boolean))].sort();
      const actions=[...new Set(S.accounts.map(a=>a.action).filter(a=>a&&a!=='Idle'))].sort();
      $('#filterRep').innerHTML='<option value="">All reps</option>'+reps.map(r=>`<option>${esc(r)}</option>`).join('');
      $('#filterAction').innerHTML='<option value="">All actions</option>'+actions.map(a=>`<option>${esc(a)}</option>`).join('');
    }
  };

  const Filters = {
    apply() {
      const q=clean($('#search').value).toLowerCase(), rep=$('#filterRep').value, act=$('#filterAction').value, st=$('#filterStatus').value;
      S.filtered = S.accounts.filter(a => (!q || [a.id,a.company,a.rep,a.action].some(v=>clean(v).toLowerCase().includes(q))) && (!rep || a.rep===rep) && (!act || a.action===act) && (!st || a.statecode===st));
      if(S.quick==='help') S.filtered = S.filtered.filter(a => (a.isHelp||a.isClose) && !clean(a.helpStatus).toUpperCase().includes('RESOLVED'));
      if(S.quick==='intro') S.filtered = S.filtered.filter(a => a.intro);
      UI.renderList(); $('#countPill').textContent=fmt(S.filtered.length)+' accounts'; $('#shownPill').textContent=fmt(Math.min(CFG.pageSize,S.filtered.length))+' shown';
      Leaderboard.schedulePreload();
    },
    clear() { $('#search').value=''; $('#filterRep').value=''; $('#filterAction').value=''; $('#filterStatus').value=''; S.quick='all'; Filters.apply(); },
    scope() {
      const dates=S.filtered.map(a=>a.modifiedon||a.emailDate).filter(Boolean).map(d=>new Date(d)).filter(d=>!isNaN(d)).sort((a,b)=>a-b);
      const end=iso(dates[dates.length-1]||new Date()), start=iso(new Date(new Date(end).getTime()-60*86400000));
      return {source:'ACT Manager Rewrite', reps:[...new Set(S.filtered.map(a=>a.rep).filter(Boolean))].sort(), actions:[...new Set(S.filtered.map(a=>a.action).filter(a=>a&&a!=='Idle'))].sort(), accountIds:S.filtered.map(a=>a.id), rowCount:S.filtered.length, startDate:start, endDate:end, quickFilter:S.quick};
    }
  };

  const UI = {
    renderList() {
      $('#accountList').innerHTML = S.filtered.slice(0,CFG.pageSize).map(a => `<div class="acct ${(a.isHelp||a.isClose)?'help':''} ${S.selected?.id===a.id?'active':''}" data-account="${esc(a.id)}"><div class="name">${a.isHelp?'<i class="fas fa-exclamation-circle" style="color:var(--danger)"></i> ':''}${a.intro?'<i class="fas fa-star" style="color:var(--good)"></i> ':''}${esc(a.company)}</div><div class="meta"><span>#${esc(a.id)} • ${esc(a.rep)}</span><span class="badge">${esc(a.action)}</span></div></div>`).join('') || '<div class="pad muted">No accounts match your filters.</div>';
    },
    renderDetail(a) {
      S.selected=a; $('#empty').style.display='none'; const d=$('#detail'); d.style.display='flex';
      d.innerHTML = `<div class="hero"><div><h2>${esc(a.company)}</h2><div class="muted" style="font-size:12px;font-weight:900;margin-top:8px">#${esc(a.id)} • ${esc(a.rep)} • ${esc(a.action)}</div></div><button class="btn" data-action="syncAccount"><i class="fas fa-sync-alt"></i></button></div><div class="scroll pad"><div class="grid"><div class="card"><div class="label">Contacts</div><div class="value">${esc(a.contact)}<br>${esc(a.phone)}<br>${esc(a.email)}</div></div><div class="card"><div class="label">Location</div><div class="value">${esc(a.address)}</div></div><div class="card"><div class="label">Status</div><div class="value">${esc(a.helpStatus||'--')}</div></div><div class="card"><div class="label">Last Email</div><div class="value">${a.emailDate?new Date(a.emailDate).toLocaleDateString():'None'}</div></div></div><div class="card" style="margin-top:12px"><div class="label">Manager Override</div><textarea id="managerNote" placeholder="Enter resolution, coaching notes, or action update..."></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn good" data-action="quickResolve"><i class="fas fa-check"></i> Resolve</button><button class="btn primary" data-action="saveNote"><i class="fas fa-paper-plane"></i> Push Note</button></div></div></div>`;
      UI.renderHistory(a);
    },
    renderHistory(a) {
      const rows = a.sources.map(s => `<div class="history-item"><b>${esc(s.label)} • ${esc(a.rep)} • ${esc(a.action)}</b><p>${esc(a.message||'No message loaded.')}</p></div>`).join('');
      $('#history').innerHTML = rows || '<div class="pad muted">No history loaded.</div>';
    }
  };

  const Actions = {
    async saveNote(resolve=false) {
      const a=S.selected; if(!a) return; const note=clean($('#managerNote')?.value); if(!note && !resolve) return toast('Enter a note first.','warn');
      const stamp=new Date().toLocaleString(); const block=`

---
[MANAGER${resolve?' RESOLVED':''}] ${stamp} - ${S.account?.name||'Manager'}
${note||'Resolved'}`;
      const patches = a.sources.map(s => { const body={}; if(s.manager) body[s.manager]=(clean(s.row[s.manager])+block).trim(); if(resolve && s.help) body[s.help]='Resolved'; const url=`${CFG.dataverse}/${s.set}(${s.recordId})`; return Api.patch(url,body); });
      await Promise.allSettled(patches); toast(resolve?'Resolved.':'Note pushed.','success'); $('#managerNote').value=''; await Actions.refresh();
    },
    async refresh() { $('#loader').style.display='flex'; await Data.loadAll(); if(S.selected) { const a=S.accounts.find(x=>x.id===S.selected.id); if(a) UI.renderDetail(a); } },
    copyHistory() { navigator.clipboard?.writeText($('#history').innerText||''); toast('History copied.','success'); }
  };

  const Leaderboard = {
    timer:null,
    src() { const b64=$('#action-checker-b64').textContent.replace(/\s+/g,''); return b64 ? decodeURIComponent(escape(atob(b64))) : '<h1 style="font-family:sans-serif">ActionChecker.html was not available when this file was generated.</h1>'; },
    schedulePreload() { clearTimeout(Leaderboard.timer); Leaderboard.timer=setTimeout(()=>Leaderboard.preload(false),700); },
    async preload(show=true) {
      if(S.reportLoading) return; S.reportLoading=true; const scope=Filters.scope(); $('#reportScope').textContent=`• ${fmt(scope.reps.length)} reps • ${fmt(scope.actions.length)} actions • ${scope.startDate} to ${scope.endDate}`; if(show) Leaderboard.loader(true,'Preparing filtered report...',15);
      const f=$('#reportFrame'); if(!f.srcdoc) f.srcdoc=Leaderboard.src();
      await new Promise(r => setTimeout(r,700));
      try {
        const w=f.contentWindow; w.ACT_MANAGER_SCOPE=scope; localStorage.setItem('act_manager_reporting_bridge_rewrite', JSON.stringify(scope));
        Leaderboard.applyScope(w, scope); S.reportReady=true; Leaderboard.loader(false); S.reportLoading=false;
      } catch(e) { console.warn(e); S.reportLoading=false; Leaderboard.loader(show,'Report preload deferred until opened.',85); }
    },
    applyScope(w,scope) {
      const setOpt=(sel,values)=>{ if(!sel) return; sel.innerHTML=''; values.forEach(v=>{const o=w.document.createElement('option'); o.value=v; o.text=v; o.selected=true; sel.appendChild(o);}); sel.dispatchEvent(new Event('change',{bubbles:true})); };
      setOpt(w.document.getElementById('repFilter'),scope.reps); setOpt(w.document.getElementById('actionFilter'),scope.actions);
      ['actionStartDate','startDate'].forEach(id=>{const el=w.document.getElementById(id); if(el){el.value=scope.startDate; el.dispatchEvent(new Event('change',{bubbles:true}));}});
      ['actionEndDate','endDate'].forEach(id=>{const el=w.document.getElementById(id); if(el){el.disabled=false; el.value=scope.endDate; el.dispatchEvent(new Event('change',{bubbles:true}));}});
      if(typeof w.parallelLoad==='function') w.parallelLoad(false); else w.document.getElementById('loadBtn')?.click();
    },
    open() { $('#reportModal').classList.add('show'); Leaderboard.loader(!S.reportReady,'Opening Action Leaderboard...',25); Leaderboard.preload(true); },
    close() { $('#reportModal').classList.remove('show'); },
    reload() { S.reportReady=false; $('#reportFrame').srcdoc=''; Leaderboard.preload(true); },
    loader(show,text='',pct=0) { $('#reportLoader').classList.toggle('show',!!show); if(text) $('#reportText').textContent=text; $('#reportBar').style.width=pct+'%'; }
  };

  const Router = {
    async run(action, el) {
      setBusy(el,true); try {
        const val=el?.dataset?.value;
        if(action==='theme') document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';
        if(action==='refresh') await Actions.refresh();
        if(action==='clear') Filters.clear();
        if(action==='quick') { S.quick=val||'all'; Filters.apply(); }
        if(action==='leaderboard') Leaderboard.open();
        if(action==='closeReport') Leaderboard.close();
        if(action==='preload') await Leaderboard.preload(true);
        if(action==='reloadReport') Leaderboard.reload();
        if(action==='saveNote') await Actions.saveNote(false);
        if(action==='quickResolve') await Actions.saveNote(true);
        if(action==='copyHistory') Actions.copyHistory();
        if(action==='syncAccount') await Actions.refresh();
      } catch(e) { console.error(e); toast(e.message||'Action failed','error'); } finally { setBusy(el,false); }
    }
  };

  async function init() {
    try { load(3,'Signing in...'); await Api.login(); await Data.fetchEmployees(); await Data.loadAll(); Leaderboard.schedulePreload(); }
    catch(e) { console.error(e); $('#loaderText').textContent='Startup failed: '+(e.message||e); toast('Startup failed. Check console.','error'); }
  }
  document.addEventListener('click', e => { const btn=e.target.closest('[data-action]'); if(btn) Router.run(btn.dataset.action, btn); const card=e.target.closest('[data-account]'); if(card) { const a=S.accounts.find(x=>x.id===card.dataset.account); if(a) { UI.renderDetail(a); UI.renderList(); } } });
  ['search','filterRep','filterAction','filterStatus'].forEach(id => $('#'+id).addEventListener(id==='search'?'input':'change', () => Filters.apply()));
  init();
  window.ACT_REWRITE={CFG,S,Api,Data,Filters,UI,Actions,Leaderboard,Router};
})();
</script>
</body>
</html>
