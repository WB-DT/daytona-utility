<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamics 365 Sales Overview</title>
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(0, 255, 255, 0.15);
            --neon-cyan: #0ff;
            --neon-purple: #b026ff;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --danger: #ff3366;
            --success: #00ff99;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 255, 255, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(176, 38, 255, 0.05), transparent 25%);
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            padding: 2rem;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 2rem;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        h2 {
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.2rem;
            color: var(--neon-purple);
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(176, 38, 255, 0.3);
            padding-bottom: 0.5rem;
        }

        .auth-section, .search-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .search-section {
            display: none;
            flex-direction: row;
            justify-content: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--neon-cyan);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
        }

        button {
            padding: 12px 24px;
            background: transparent;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        button.logout-btn {
            border-color: var(--neon-purple);
        }
        
        button.logout-btn:hover {
            background: rgba(176, 38, 255, 0.1);
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.4);
        }

        #statusMessage {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 1rem;
            min-height: 20px;
            max-width: 600px;
            line-height: 1.5;
        }
        
        .error-text {
            color: var(--danger);
            font-weight: bold;
            background: rgba(255, 51, 102, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 51, 102, 0.3);
        }

        /* Results List View */
        .results-container {
            width: 100%;
            max-width: 1200px;
            display: none;
        }

        .account-card {
            background: rgba(10, 10, 15, 0.8);
            border-left: 4px solid var(--neon-cyan);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .account-card:hover {
            transform: translateX(5px);
            border-left-color: var(--neon-purple);
            background: rgba(20, 20, 30, 0.9);
            box-shadow: 0 0 15px rgba(176, 38, 255, 0.2);
        }

        .account-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-cyan);
            margin-bottom: 0.2rem;
        }

        .account-detail {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Dashboard View */
        .dashboard-container {
            display: none;
            width: 100%;
            max-width: 1200px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .dashboard-title-block h1 {
            margin-bottom: 0;
            text-align: left;
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        .dashboard-subtitle {
            color: var(--text-muted);
            font-family: monospace;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .data-table-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th {
            background: rgba(0, 255, 255, 0.05);
            color: var(--neon-cyan);
            text-align: left;
            padding: 12px 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .currency {
            font-family: monospace;
            color: var(--success);
            font-weight: bold;
        }

        .date-cell {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--neon-cyan);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>Dynamics 365 Core</h1>
        
        <div class="auth-section" id="authSection">
            <p>Please sign in to access the W.B. Mason CRM data.</p>
            <button id="loginBtn" onclick="signIn()">Sign In with Microsoft</button>
        </div>

        <div class="search-section" id="searchSection">
            <input type="text" id="searchInput" placeholder="Search Account Name or Number..." onkeydown="if(event.key === 'Enter') searchAccounts()">
            <button onclick="searchAccounts()">Search Accounts</button>
            <button class="logout-btn" onclick="signOut()">Sign Out</button>
        </div>

        <div id="statusMessage"></div>
    </div>

    <div class="results-container glass-panel" id="resultsContainer">
        <h2 style="color: var(--neon-cyan); border-bottom-color: rgba(0, 255, 255, 0.3);">Matching Accounts</h2>
        <div id="resultsList"></div>
    </div>

    <div class="dashboard-container glass-panel" id="dashboardContainer">
        <div class="dashboard-header">
            <div class="dashboard-title-block">
                <h1 id="dashAccountName">Account Name</h1>
                <div class="dashboard-subtitle" id="dashAccountNum">ACCT: #00000</div>
            </div>
            <button onclick="closeDashboard()">Back to Search</button>
        </div>

        <div class="dashboard-grid">
            <div>
                <h2>Recent Sales Orders</h2>
                <div class="data-table-container">
                    <table id="ordersTable">
                        <thead>
                            <tr>
                                <th>Order #</th>
                                <th>Date</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="ordersBody">
                            <tr><td colspan="3" class="empty-state"><div class="loading-spinner"></div> Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div>
                <h2>Recent Invoices</h2>
                <div class="data-table-container">
                    <table id="invoicesTable">
                        <thead>
                            <tr>
                                <th>Invoice #</th>
                                <th>Date</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesBody">
                            <tr><td colspan="3" class="empty-state"><div class="loading-spinner"></div> Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const exactRedirectUri = window.location.href.split('#')[0].split('?')[0];

        const msalConfig = {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: exactRedirectUri, 
            },
            cache: {
                cacheLocation: "sessionStorage",
                storeAuthStateInCookie: false,
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const d365ResourceUrl = "https://wbmasonco.crm.dynamics.com";
        const d365ApiUrl = `${d365ResourceUrl}/api/data/v9.2`;
        const loginRequest = {
            scopes: [d365ResourceUrl + "/user_impersonation"]
        };

        const authSection = document.getElementById('authSection');
        const searchSection = document.getElementById('searchSection');
        const statusMessage = document.getElementById('statusMessage');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsList = document.getElementById('resultsList');
        const searchInput = document.getElementById('searchInput');
        const dashboardContainer = document.getElementById('dashboardContainer');

        // Formatter for Currency
        const formatter = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
        });

        if (window.location.protocol === "file:") {
            statusMessage.innerHTML = "<div class='error-text'>CRITICAL ERROR: Running from file:/// protocol. Please use a local web server.</div>";
            document.getElementById('loginBtn').style.opacity = "0.5";
            document.getElementById('loginBtn').style.pointerEvents = "none";
        }

        function checkActiveSession() {
            const currentAccounts = msalInstance.getAllAccounts();
            if (currentAccounts.length > 0) {
                msalInstance.setActiveAccount(currentAccounts[0]);
                showSearchInterface(currentAccounts[0].username);
            }
        }

        async function signIn() {
            statusMessage.className = "";
            statusMessage.textContent = "Authenticating...";
            try {
                const loginResponse = await msalInstance.loginPopup(loginRequest);
                msalInstance.setActiveAccount(loginResponse.account);
                showSearchInterface(loginResponse.account.username);
            } catch (error) {
                console.error("Login Failed:", error);
                statusMessage.innerHTML = `<div class='error-text'>Authentication Failed. Check console.</div>`;
            }
        }

        function signOut() {
            msalInstance.logoutPopup({ account: msalInstance.getActiveAccount(), postLogoutRedirectUri: exactRedirectUri });
            authSection.style.display = "flex";
            searchSection.style.display = "none";
            resultsContainer.style.display = "none";
            dashboardContainer.style.display = "none";
            statusMessage.innerHTML = "Signed out successfully.";
        }

        function showSearchInterface(username) {
            authSection.style.display = "none";
            searchSection.style.display = "flex";
            statusMessage.innerHTML = `Connected as: <span style="color: var(--neon-cyan);">${username}</span>`;
        }

        async function getToken() {
            const account = msalInstance.getActiveAccount();
            if (!account) throw Error("No active account!");
            const request = { ...loginRequest, account: account };
            try {
                return (await msalInstance.acquireTokenSilent(request)).accessToken;
            } catch (error) {
                if (error instanceof msal.InteractionRequiredAuthError) {
                    return (await msalInstance.acquireTokenPopup(request)).accessToken;
                } else {
                    throw error;
                }
            }
        }

        // --- PHASE 1: SEARCH ACCOUNTS ---
        async function searchAccounts() {
            const searchTerm = searchInput.value.trim();
            if (!searchTerm) return;

            statusMessage.textContent = "Querying Database...";
            dashboardContainer.style.display = "none";
            resultsContainer.style.display = "none";
            resultsList.innerHTML = "";

            try {
                const token = await getToken();
                const queryUrl = `${d365ApiUrl}/accounts?$filter=contains(name,'${encodeURIComponent(searchTerm)}') or contains(accountnumber,'${encodeURIComponent(searchTerm)}')&$select=name,accountnumber,accountid,telephone1`;

                const response = await fetch(queryUrl, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}`, 'OData-MaxVersion': '4.0', 'OData-Version': '4.0', 'Accept': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                renderResults(data.value);
                statusMessage.innerHTML = `Search complete. Found <span style="color: var(--neon-cyan);">${data.value.length}</span> record(s).`;

            } catch (error) {
                console.error("API Error:", error);
                statusMessage.innerHTML = "<div class='error-text'>Error fetching data. Ensure CORS is configured.</div>";
            }
        }

        function renderResults(records) {
            resultsContainer.style.display = "block";
            
            if (records.length === 0) {
                resultsList.innerHTML = "<p style='color: var(--text-muted); padding: 1rem;'>No accounts found.</p>";
                return;
            }

            records.forEach(record => {
                const card = document.createElement('div');
                card.className = 'account-card';
                card.onclick = () => openDashboard(record.accountid, record.name, record.accountnumber);

                const name = record.name || 'Unknown Account';
                const accountNum = record.accountnumber || 'N/A';
                
                card.innerHTML = `
                    <div>
                        <div class="account-title">${name}</div>
                        <div class="account-detail">ACCT: ${accountNum}</div>
                    </div>
                    <div style="color: var(--neon-cyan); font-size: 1.5rem;">&rarr;</div>
                `;
                resultsList.appendChild(card);
            });
        }

        // --- PHASE 2: ACCOUNT DASHBOARD ---
        function openDashboard(accountId, name, accountNum) {
            resultsContainer.style.display = "none";
            dashboardContainer.style.display = "block";
            
            document.getElementById('dashAccountName').innerText = name;
            document.getElementById('dashAccountNum').innerText = `ACCT: ${accountNum || 'N/A'}`;
            
            // Reset tables to loading state
            document.getElementById('ordersBody').innerHTML = `<tr><td colspan="3" class="empty-state"><div class="loading-spinner"></div> Loading Orders...</td></tr>`;
            document.getElementById('invoicesBody').innerHTML = `<tr><td colspan="3" class="empty-state"><div class="loading-spinner"></div> Loading Invoices...</td></tr>`;

            // Fire async fetches
            fetchSalesData(accountId);
        }

        function closeDashboard() {
            dashboardContainer.style.display = "none";
            resultsContainer.style.display = "block";
        }

        async function fetchSalesData(accountId) {
            try {
                const token = await getToken();
                const headers = { 'Authorization': `Bearer ${token}`, 'OData-MaxVersion': '4.0', 'OData-Version': '4.0', 'Accept': 'application/json' };

                // Fetch Top 5 Recent Orders linked to the Customer (Account)
                const ordersQuery = `${d365ApiUrl}/salesorders?$filter=_customerid_value eq '${accountId}'&$orderby=createdon desc&$top=5&$select=ordernumber,totalamount,createdon`;
                
                // Fetch Top 5 Recent Invoices linked to the Customer (Account)
                const invoicesQuery = `${d365ApiUrl}/invoices?$filter=_customerid_value eq '${accountId}'&$orderby=createdon desc&$top=5&$select=invoicenumber,totalamount,createdon`;

                const [ordersRes, invoicesRes] = await Promise.all([
                    fetch(ordersQuery, { headers }),
                    fetch(invoicesQuery, { headers })
                ]);

                if (ordersRes.ok) {
                    const ordersData = await ordersRes.json();
                    renderTable('ordersBody', ordersData.value, 'ordernumber', 'No recent orders found.');
                }

                if (invoicesRes.ok) {
                    const invoicesData = await invoicesRes.json();
                    renderTable('invoicesBody', invoicesData.value, 'invoicenumber', 'No recent invoices found.');
                }

            } catch (error) {
                console.error("Dashboard Fetch Error:", error);
                document.getElementById('ordersBody').innerHTML = `<tr><td colspan="3" class="error-text">Failed to load data.</td></tr>`;
                document.getElementById('invoicesBody').innerHTML = `<tr><td colspan="3" class="error-text">Failed to load data.</td></tr>`;
            }
        }

        function renderTable(tbodyId, records, numberField, emptyMsg) {
            const tbody = document.getElementById(tbodyId);
            
            if (!records || records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty-state">${emptyMsg}</td></tr>`;
                return;
            }

            tbody.innerHTML = records.map(record => {
                const recordNumber = record[numberField] || 'Unknown';
                const dateObj = new Date(record.createdon);
                const formattedDate = !isNaN(dateObj) ? dateObj.toLocaleDateString() : 'N/A';
                const amount = record.totalamount != null ? formatter.format(record.totalamount) : '$0.00';

                return `
                    <tr>
                        <td style="font-weight: bold; color: var(--text-main);">${recordNumber}</td>
                        <td class="date-cell">${formattedDate}</td>
                        <td class="currency">${amount}</td>
                    </tr>
                `;
            }).join('');
        }

        checkActiveSession();
    </script>
</body>
</html>
