<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v78.3 | Bridge Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fcd34d; --border: #475569; --input-bg: #1e293b;
            --badge-bg: rgba(0,0,0,0.4); --danger: #ef4444;
        }
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; font-size: 14px; }
        header { height: 60px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        .app-container { display: flex; height: calc(100vh - 60px); }
        aside { width: 380px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .record-card { margin: 12px 16px; border-radius: 12px; padding: 18px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s; }
        .record-card.active { border-left-width: 8px; background: #3d4b5f; }
        .status-pill { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; border: 1px solid currentColor; }
        .description-box { background: rgba(0,0,0,0.2); border: 1px dashed var(--border); padding: 20px; border-radius: 12px; border-left: 4px solid var(--text-accent); }
        .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--brand); color: #000; padding: 8px 20px; border-radius: 99px; font-weight: 900; font-size: 12px; z-index: 100; display: none; }
        input, select, textarea { background: var(--input-bg) !important; border: 1px solid var(--border) !important; color: var(--text-main) !important; border-radius: 8px !important; }
        .dup-warning { color: var(--danger) !important; font-weight: 900; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>

    <div id="toast" class="copy-toast uppercase tracking-widest">Copied!</div>

    <header>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-teal-600 rounded-lg flex items-center justify-center"><i class="fa fa-link text-white"></i></div>
                <div class="text-lg font-black tracking-tighter uppercase" style="color:var(--brand)">LOGILINK <span class="text-[9px] opacity-50">v78.3</span></div>
            </div>
            <div class="relative">
                <input type="text" id="global-search" oninput="render()" placeholder="Search Order, CSR, or Account..." class="w-80 p-2 text-xs">
            </div>
            <div class="px-3 py-1 bg-black/30 rounded-full text-[10px] font-black uppercase text-teal-400">
                RECORDS: <span id="record-count">0</span>
            </div>
        </div>
        <div class="flex items-center gap-2 text-[10px] font-black uppercase" style="color:var(--brand)">
            <i id="sync-icon" class="fa fa-circle text-[6px]"></i> <span id="sync-text">Bridge Active</span>
        </div>
    </header>

    <div class="app-container">
        <aside>
            <div id="mode-bar" class="p-4 flex gap-2 border-b border-black/10">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded-md font-black text-[11px] uppercase bg-teal-600">Open</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded-md font-black text-[11px] uppercase bg-slate-700 opacity-50">Resolved</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center opacity-10">
                <i class="fa fa-comments text-9xl mb-4"></i>
                <p class="font-black uppercase tracking-[0.5em]">Select Submission</p>
            </div>

            <div id="detail-content" class="hidden max-w-5xl mx-auto p-12 space-y-8">
                <div class="flex justify-between items-start border-b border-white/5 pb-8">
                    <div>
                        <div class="flex items-center gap-3 mb-2">
                            <span id="d-status" class="status-pill"></span>
                            <span id="d-date" class="font-mono text-[10px] opacity-50"></span>
                        </div>
                        <h2 id="d-company" class="text-4xl font-black uppercase leading-none tracking-tight"></h2>
                        <div class="flex gap-3 mt-4">
                            <span id="d-account" onclick="filterByField(this.innerText)" class="cursor-pointer text-[10px] font-black px-3 py-1 rounded bg-slate-800 border border-slate-700"></span>
                            <span id="d-rep" onclick="filterByField(this.innerText)" class="cursor-pointer text-[10px] font-black px-3 py-1 rounded bg-amber-400/10 text-amber-400 border border-amber-400/30"></span>
                            <span id="d-owner" class="text-[10px] font-black px-3 py-1 rounded bg-slate-800 border border-slate-700 text-teal-400"></span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div id="dup-badge-container" class="mb-2"></div>
                        <div class="flex items-center justify-end gap-3">
                            <p id="d-order" class="text-5xl font-black italic tracking-tighter text-teal-400"></p>
                            <button onclick="copyToClipboard()" class="p-2 text-slate-500 hover:text-white bg-white/5 rounded"><i class="fa fa-copy"></i></button>
                        </div>
                    </div>
                </div>

                <div id="collision-panel" class="hidden bg-red-500/10 border border-red-500/50 p-4 rounded-xl flex items-center gap-4">
                    <i class="fa fa-exclamation-circle text-red-500"></i>
                    <p class="text-red-500 font-black text-xs uppercase text-left">Note: Multiple submissions found for this order.</p>
                </div>

                <div class="description-box">
                    <label class="text-[10px] font-black uppercase tracking-widest text-amber-400 block mb-2">CSR Submission</label>
                    <p id="d-description" class="text-lg leading-relaxed italic font-medium"></p>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-slate-800/50 p-6 rounded-xl border border-white/5">
                        <label class="text-[10px] font-black uppercase opacity-50 block mb-3">Warehouse Update</label>
                        <textarea id="d-warehouse-input" class="w-full h-32 p-3 text-sm"></textarea>
                    </div>
                    <div class="bg-slate-800/50 p-6 rounded-xl border border-white/5">
                        <label class="text-[10px] font-black uppercase opacity-50 block mb-3">Driver Update</label>
                        <textarea id="d-driver-input" class="w-full h-32 p-3 text-sm"></textarea>
                    </div>
                </div>

                <div class="flex gap-4 items-end">
                    <div class="flex-1">
                        <label class="text-[10px] font-black uppercase opacity-50 block mb-2">Disposition</label>
                        <select id="d-dispo-select" class="w-full p-4 font-bold text-sm"></select>
                    </div>
                    <button onclick="saveData()" class="px-10 py-4 bg-teal-600 text-slate-900 rounded-lg font-black uppercase text-sm">Sync Update</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let db = []; let currentMode = 'active'; let currentTicketId = null;

        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        window.onload = () => { fetchData(HISTORY_URL, "FullHistory"); setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000); };

        async function fetchData(url, actionType) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-[8px]";
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType }) });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error(e); }
            setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[6px]"; }, 2000);
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id;
                const item = {
                    id: id, idNum: r.cr714_id || 'N/A', 
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: r.cr714_companyordeliveryname || r['cr714_companyordeliveryname@OData.Community.Display.V1.FormattedValue'] || 'Unknown', 
                    account: r.cr714_accountnumber || 'N/A',
                    rep: r.cr714_rep || 'CSR Submitter',
                    owner: r.cr714_logisticsowner || 'Unassigned',
                    status: (r.cr714_disposition || 'Pending'), 
                    description: r.cr714_description || 'No notes.',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    timestamp: r.createdon ? new Date(r.createdon).getTime() : 0
                };
                const idx = db.findIndex(x => x.id === id);
                if (idx === -1) db.push(item); else db[idx] = {...db[idx], ...item};
            });
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const counter = document.getElementById('record-count');
            const search = document.getElementById('global-search').value.toLowerCase();
            
            const filtered = db.filter(t => {
                const match = (t.order + t.company + t.account + t.owner + t.rep).toLowerCase().includes(search);
                if (search.length > 0) return match;
                const isComplete = t.status.includes('Completed') || t.status === 'Sent Back';
                return currentMode === 'active' ? (match && !isComplete) : (match && isComplete);
            }).sort((a,b) => b.timestamp - a.timestamp);

            if(counter) counter.innerText = filtered.length;
            list.innerHTML = '';
            filtered.forEach(t => {
                const isDup = db.filter(x => x.order === t.order && t.order !== 'N/A').length > 1;
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-black uppercase text-teal-400 ${isDup ? 'dup-warning' : ''}">#${t.idNum} • ${t.order}</span>
                        <span class="status-pill" style="border-color:var(--brand); color:var(--brand)">${t.status}</span>
                    </div>
                    <div class="card-company uppercase truncate font-bold text-xs">${t.company}</div>
                    <div class="flex justify-between mt-3 items-center">
                        <span class="text-[9px] text-amber-400 font-black">${t.rep}</span>
                        <span class="text-[9px] font-mono opacity-40">${t.date}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            const isDup = db.filter(x => x.order === t.order && t.order !== 'N/A').length > 1;

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('collision-panel').classList.toggle('hidden', !isDup);
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-account').innerText = `ACCT: ${t.account}`;
            document.getElementById('d-rep').innerText = `SUBMITTER: ${t.rep}`;
            document.getElementById('d-owner').innerText = `OWNER: ${t.owner}`;
            document.getElementById('d-status').innerText = t.status;
            document.getElementById('d-date').innerText = `LOGGED: ${t.date}`;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
            document.getElementById('d-driver-input').value = t.driverNotes;

            const sel = document.getElementById('d-dispo-select');
            sel.innerHTML = ['Pending','Working on','Follow-up','Escalated','Sent Back','Completed'].map(o => `<option value="${o}" ${t.status === o ? 'selected' : ''}>${o}</option>`).join('');
            render();
        }

        function copyToClipboard() {
            const order = document.getElementById('d-order').innerText;
            navigator.clipboard.writeText(order);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function filterByField(txt) {
            const cleaned = txt.includes(':') ? txt.split(': ')[1] : txt;
            document.getElementById('global-search').value = cleaned;
            render();
        }

        function setMode(m) { 
            currentMode = m; 
            document.getElementById('btn-active').className = `flex-1 py-2 rounded-md font-black text-[11px] uppercase ${m==='active'?'bg-teal-600':'bg-slate-700 opacity-50'}`; 
            document.getElementById('btn-all').className = `flex-1 py-2 rounded-md font-black text-[11px] uppercase ${m==='all'?'bg-teal-600':'bg-slate-700 opacity-50'}`; 
            render(); 
        }
        function saveData() { alert('Syncing Update...'); }
    </script>
</body>
</html>
