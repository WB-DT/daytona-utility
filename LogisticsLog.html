<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v84.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='slate'] { --bg-deep: #020617; --bg-surface: #0f172a; --bg-card: #1e293b; --brand: #38bdf8; --text-accent: #7dd3fc; --border: #334155; --input-bg: #020617; }
        [data-theme='forest'] { --bg-deep: #141711; --bg-surface: #1c2018; --bg-card: #2a3024; --brand: #a3ad7e; --text-accent: #d4a373; --border: #353b2d; --input-bg: #141711; }
        [data-theme='carbon'] { --bg-deep: #0a0a0a; --bg-surface: #121212; --bg-card: #1c1c1c; --brand: #e11d48; --text-accent: #fbbf24; --border: #262626; --input-bg: #0a0a0a; }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; }
        #account-rail { width: 320px; min-width: 320px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px 15px; }

        .record-card { margin: 10px 12px; border-radius: 8px; padding: 16px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 6px; }
        .record-card.active { background: rgba(255,255,255,0.08); border-left-color: #fff; }

        /* GALLERY UPDATES */
        .card-company-name { font-size: 14px; font-weight: 400; color: #fff; } /* Unbolded */
        .card-order-num { font-size: 16px; font-family: 'JetBrains Mono', monospace; font-weight: 800; } /* Bigger */
        .wh-label { font-size: 10px; font-weight: 900; color: #38bdf8; text-transform: uppercase; border: 1px solid rgba(56, 189, 248, 0.4); padding: 1px 5px; border-radius: 3px; }
        .route-pill { background: var(--brand); color: var(--bg-deep); font-weight: 900; padding: 0 8px; border-radius: 4px; font-size: 11px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
        
        .is-duplicate-text { color: var(--danger) !important; animation: textPulse 1s infinite; }
        @keyframes textPulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .status-pill { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; border: 1px solid var(--brand); color: var(--brand); }
        .issue-text { font-weight: 400; color: var(--text-accent); font-size: 11px; } /* Unbolded */

        textarea, select, input { background-color: var(--input-bg) !important; border: 1px solid var(--border) !important; color: var(--text-main) !important; border-radius: 6px; }
    </style>
</head>
<body data-theme="slate">

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-teal-600 rounded-lg flex items-center justify-center"><i class="fa fa-truck-fast text-white text-xs"></i></div>
                <div class="text-lg font-black uppercase tracking-tighter" style="color:var(--brand)">LOGILINK</div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Filter..." class="w-64 p-2 text-xs">
        </div>
        <i id="sync-icon" class="fa fa-circle text-[8px] text-teal-400"></i>
    </header>

    <div class="app-container">
        <aside>
            <div class="p-3 flex gap-2 border-b border-black/10">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[11px] uppercase bg-teal-600 text-slate-900">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[11px] uppercase bg-slate-700/50 text-white opacity-50">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto flex-grow"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10">
                <i class="fa fa-route text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select Record</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto">
                <div class="max-w-4xl mx-auto p-10 space-y-6">
                    <div id="dup-warning" class="hidden bg-red-500/10 border border-red-500/50 p-4 rounded-lg flex items-center gap-4 mb-4">
                        <i class="fa fa-triangle-exclamation text-red-500 text-xl"></i>
                        <span class="text-[10px] font-black uppercase text-red-500 tracking-widest text-center">Duplicate Order Number</span>
                    </div>

                    <div class="flex justify-between items-start border-b border-white/10 pb-6">
                        <div class="flex-grow">
                            <div class="flex items-center gap-3 mb-2">
                                <span id="d-status" class="status-pill"></span>
                                <span id="d-date" class="text-[10px] opacity-40 font-mono italic"></span>
                            </div>
                            <h2 id="d-company" class="text-3xl font-black uppercase tracking-tight text-white leading-tight"></h2>
                            
                            <div class="flex flex-wrap gap-2 mt-4 items-center">
                                <span id="d-account" class="bg-black/30 px-2 py-1 rounded text-[10px] border border-white/5"></span>
                                <span id="d-rep" class="text-[11px] font-bold px-2 py-1 bg-amber-400/10 text-amber-400 rounded"></span>
                                <span id="d-owner" class="text-[11px] font-black px-2 py-1 bg-teal-400 text-slate-900 rounded"></span>
                                <div class="h-4 w-px bg-white/10 mx-1"></div>
                                <span id="d-wh-badge" class="wh-label !text-[11px]"></span>
                                <span id="d-route-badge" class="route-pill"></span>
                            </div>
                        </div>

                        <div class="text-right">
                            <div onclick="copyOrder()" class="cursor-pointer bg-black/20 p-4 rounded-lg border border-white/5 hover:border-brand/30 transition-all min-w-[180px]">
                                <p class="text-[9px] font-black opacity-40 mb-1 uppercase tracking-widest">Order Number</p>
                                <p id="d-order" class="text-2xl font-black italic order-display leading-none"></p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-black/20 border-l-3 border-[var(--text-accent)] p-5 rounded-r-lg">
                        <label id="d-issue-label" class="text-[10px] font-black text-accent uppercase block mb-1"></label>
                        <p id="d-description" class="text-lg leading-relaxed text-slate-100"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="space-y-2"><label class="text-[10px] font-black uppercase opacity-40">Warehouse Notes</label><textarea id="d-warehouse-input" class="w-full h-40 p-4 text-sm"></textarea></div>
                        <div class="space-y-2"><label class="text-[10px] font-black uppercase opacity-40">Driver Feedback</label><textarea id="d-driver-input" class="w-full h-40 p-4 text-sm"></textarea></div>
                    </div>

                    <button onclick="saveData()" class="w-full py-4 bg-teal-600 text-slate-900 rounded font-black uppercase text-sm hover:brightness-110">Update Bridge</button>
                </div>
            </div>
        </main>

        <aside id="account-rail" class="hidden">
            <h3 id="rail-header" class="text-[11px] font-black uppercase tracking-widest text-brand mb-4 border-b border-brand/20 pb-2"></h3>
            <div id="rail-content" class="space-y-3"></div>
        </aside>
    </div>

    <script>
        let db = []; let currentMode = 'active'; let currentTicketId = null;

        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        window.onload = () => { fetchData(HISTORY_URL, "FullHistory"); setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000); };

        async function fetchData(url, actionType) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-teal-400";
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType }) });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error(e); }
            setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[8px] text-teal-400"; }, 2000);
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id;
                const item = {
                    id: id,
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: r.cr714_companyordeliveryname || 'Unknown', 
                    account: r.cr714_accountnumber || 'N/A',
                    rep: r.cr714_rep || 'CSR',
                    owner: r.cr714_logisticsowner || 'Unassigned',
                    status: (r.cr714_disposition || 'Pending'), 
                    issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || r.cr714_issue || 'General Logistics',
                    description: r.cr714_description || '',
                    warehouse: r['cr714_warehouse@OData.Community.Display.V1.FormattedValue'] || r.cr714_warehouse || 'N/A',
                    route: r['cr714_route@OData.Community.Display.V1.FormattedValue'] || r.cr714_route || 'N/A',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    timestamp: r.createdon ? new Date(r.createdon).getTime() : 0
                };
                const idx = db.findIndex(x => x.id === id);
                if (idx === -1) db.push(item); else db[idx] = {...db[idx], ...item};
            });
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const matchSearch = (t.order + t.company + t.account + t.route).toLowerCase().includes(search);
                const isCompleted = t.status.includes('Completed') || t.status === 'Sent Back';
                return currentMode === 'active' ? (matchSearch && !isCompleted) : (matchSearch && isCompleted);
            }).sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            filtered.forEach(t => {
                const isDup = db.filter(x => x.order === t.order && t.order !== 'N/A').length > 1;
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="card-company-name truncate max-w-[200px]">${t.company}</div>
                        <div class="flex items-center gap-1">
                             <span class="wh-label">${t.warehouse}</span>
                             <span class="route-pill">${t.route}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="card-order-num ${isDup ? 'is-duplicate-text' : ''}">${t.order}</span>
                        <span class="status-pill">${t.status}</span>
                    </div>
                    <div class="bg-black/10 border-l-2 border-[var(--text-accent)] p-2">
                        <span class="issue-text uppercase">${t.issue}</span>
                        <p class="text-[11px] text-dim line-clamp-1">${t.description}</p>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');

            const isDup = db.filter(x => x.order === t.order && t.order !== 'N/A').length > 1;
            document.getElementById('dup-warning').classList.toggle('hidden', !isDup);
            document.getElementById('d-order').className = `text-2xl font-black italic order-display leading-none ${isDup ? 'is-duplicate-text' : ''}`;

            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-account').innerText = t.account;
            document.getElementById('d-rep').innerText = t.rep;
            document.getElementById('d-owner').innerText = t.owner;
            document.getElementById('d-status').innerText = t.status;
            document.getElementById('d-date').innerText = t.date;
            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-wh-badge').innerText = t.warehouse;
            document.getElementById('d-route-badge').innerText = t.route;
            
            // SIDEBAR AUTO-HIDE LOGIC
            const related = db.filter(x => x.account === t.account && x.id !== t.id && !x.status.includes('Completed') && x.status !== 'Sent Back');
            const rail = document.getElementById('account-rail');
            
            if (related.length > 0) {
                rail.classList.remove('hidden');
                document.getElementById('rail-header').innerText = `Pending for ${t.account}`;
                document.getElementById('rail-content').innerHTML = related.map(r => `
                    <div onclick="loadTicket('${r.id}')" class="bg-black/20 border border-white/5 p-3 rounded cursor-pointer hover:border-brand/40">
                        <div class="flex justify-between font-mono text-[11px] text-brand font-bold"><span>#${r.order}</span> <span>${r.route}</span></div>
                        <div class="text-[10px] text-accent mt-1">${r.issue}</div>
                    </div>
                `).join('');
            } else {
                rail.classList.add('hidden');
            }
            render();
        }

        function setMode(m) { currentMode = m; render(); }
        function saveData() { alert('Syncing Bridge...'); }
    </script>
</body>
</html>
