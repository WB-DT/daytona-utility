<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Manager v19.0 (Stable)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --bg-app: #f8fafc; --border: #cbd5e1; }
        body { background-color: var(--bg-app); font-family: 'Inter', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: #334155; }
        
        /* LAYOUT */
        .app-container { display: grid; grid-template-columns: 260px 1fr 400px; height: 100%; overflow: hidden; }
        .sidebar { background: #1e293b; color: white; display: flex; flex-direction: column; padding: 1rem; z-index: 20; }
        .main-panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); background: white; position: relative; overflow: hidden; }
        .detail-panel { background: #f8fafc; display: flex; flex-direction: column; overflow-y: auto; border-left: 1px solid var(--border); z-index: 30; }
        
        /* VIEW TABS */
        .view-tab { padding: 8px 16px; font-size: 0.8rem; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
        .view-tab:hover { color: var(--accent); background: #f1f5f9; }
        .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: #eff6ff; }

        /* LIST VIEW CARDS */
        .ticket-card { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: all 0.1s; background: white; border-left: 4px solid transparent; }
        .ticket-card:hover { background: #f8fafc; border-left-color: #94a3b8; }
        .ticket-card.active { background: #eff6ff; border-left-color: var(--accent); }

        /* GRID VIEW */
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .data-table th { text-align: left; padding: 8px; background: #f1f5f9; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); color: #64748b; text-transform: uppercase; font-weight: 700; }
        .data-table td { padding: 8px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; cursor: pointer; }
        .data-table tr:hover { background: #f8fafc; }
        .data-table tr.active { background: #eff6ff; }

        /* KANBAN VIEW */
        .kanban-board { display: flex; gap: 1rem; padding: 1rem; height: 100%; overflow-x: auto; background: #f1f5f9; }
        .kanban-col { min-width: 280px; width: 320px; display: flex; flex-direction: column; background: #e2e8f0; rounded-lg: 8px; height: 100%; }
        .kanban-header { padding: 10px; font-weight: bold; text-transform: uppercase; font-size: 0.75rem; color: #475569; display: flex; justify-content: space-between; background: #cbd5e1; border-radius: 8px 8px 0 0; }
        .kanban-body { padding: 8px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        .kanban-card { background: white; padding: 10px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); cursor: pointer; border-left: 3px solid transparent; font-size: 0.8rem; }
        .kanban-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .k-pending { border-left-color: #f59e0b; }
        .k-working { border-left-color: #3b82f6; }
        .k-completed { border-left-color: #10b981; }
        .k-escalated { border-left-color: #ef4444; }

        .badge { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.98); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="auth-screen" class="loader-overlay">
        <div class="text-center max-w-lg w-full p-8 bg-white border border-slate-200 shadow-xl rounded-2xl">
            <div class="mb-4 inline-flex p-4 rounded-2xl bg-blue-600 text-white text-5xl shadow-lg"><i class="fas fa-check-double"></i></div>
            <h1 class="text-3xl font-black mb-1 text-slate-800">Logistics Manager</h1>
            <p class="text-slate-500 mb-8 font-medium text-sm uppercase tracking-widest">v19.0 Stable Edition</p>
            
            <div id="login-section" class="space-y-4 max-w-xs mx-auto">
                <button onclick="window.login()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl hover:bg-slate-800 transition shadow-lg flex justify-center items-center gap-3">
                    <i class="fab fa-microsoft text-lg"></i> Sign In
                </button>
                <button onclick="window.bypassAuth()" class="text-xs text-slate-400 hover:text-slate-600 font-bold uppercase tracking-widest">
                    Enter Offline Mode
                </button>
            </div>

            <div id="upload-section" class="hidden animate-fade-in text-left">
                <div class="border-2 border-dashed border-blue-200 bg-blue-50 rounded-xl p-8 text-center hover:bg-blue-100 cursor-pointer transition group" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-file-excel text-blue-500 text-4xl mb-3 group-hover:scale-110 transition"></i>
                    <p class="font-bold text-slate-700">Upload Data File</p>
                    <p class="text-xs text-slate-500 mt-1">.xlsx or .csv</p>
                </div>
                <input type="file" id="fileInput" class="hidden" accept=".xlsx, .csv" onchange="window.handleFile(this)">
            </div>
            <p id="error-msg" class="text-red-500 text-xs mt-4 hidden bg-red-50 p-2 rounded break-all"></p>
        </div>
    </div>

    <div id="app-ui" class="app-container hidden">
        
        <div class="sidebar">
            <div class="text-lg font-black mb-8 flex items-center gap-2 text-blue-400 tracking-tight">
                <i class="fas fa-cube"></i> LOGI<span class="text-white">MGR</span>
            </div>
            
            <div class="space-y-4">
                <div class="bg-slate-800 p-1.5 rounded-xl border border-slate-700 flex">
                    <button onclick="window.toggleMyTickets(false)" id="btn-view-all" class="flex-1 text-xs font-bold py-2 rounded-lg bg-blue-600 text-white shadow transition">All</button>
                    <button onclick="window.toggleMyTickets(true)" id="btn-view-mine" class="flex-1 text-xs font-bold py-2 rounded-lg text-slate-400 hover:text-white transition">Mine</button>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Warehouse</label>
                    <select id="whs-filter" onchange="window.resetAndRender()" class="w-full bg-slate-800 text-slate-200 text-xs rounded-lg p-2.5 border border-slate-700 focus:border-blue-500 outline-none">
                        <option value="all">All Locations</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Status</label>
                    <select id="status-filter" onchange="window.resetAndRender()" class="w-full bg-slate-800 text-slate-200 text-xs rounded-lg p-2.5 border border-slate-700 focus:border-blue-500 outline-none">
                        <option value="all">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Working on">Working on</option>
                        <option value="Completed">Completed</option>
                        <option value="Escalated">Escalated</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-auto">
                <button onclick="window.exportData()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 transition shadow-lg mb-4">
                    <i class="fas fa-download"></i> Export Data
                </button>
                <div class="pt-4 border-t border-slate-800 flex items-center gap-3 opacity-70">
                    <div class="w-8 h-8 rounded-full bg-slate-600 flex items-center justify-center text-xs font-bold text-white shadow" id="user-avatar">U</div>
                    <div class="text-xs font-medium truncate w-24" id="user-name">User</div>
                </div>
            </div>
        </div>

        <div class="main-panel">
            <div class="bg-white shadow-sm z-10">
                <div class="flex border-b border-gray-100">
                    <div class="view-tab active" onclick="window.switchView('list', this)"><i class="fas fa-list mr-1"></i> List</div>
                    <div class="view-tab" onclick="window.switchView('kanban', this)"><i class="fas fa-columns mr-1"></i> Board</div>
                    <div class="view-tab" onclick="window.switchView('grid', this)"><i class="fas fa-table mr-1"></i> Grid</div>
                </div>
                <div class="p-3 border-b border-gray-200 flex justify-between items-center gap-4">
                    <div class="relative group flex-grow max-w-md">
                        <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
                        <input type="text" id="search-input" onkeyup="window.resetAndRender()" placeholder="Search..." class="w-full pl-9 pr-4 py-2 bg-slate-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <span class="text-xs font-bold text-slate-400 whitespace-nowrap" id="list-count">0 Tickets</span>
                </div>
            </div>
            
            <div id="view-container" class="flex-grow overflow-y-auto bg-slate-50 relative"></div>
            
            <div id="load-more-container" class="p-3 text-center border-t border-gray-200 bg-white hidden">
                <button onclick="window.loadMore()" class="text-xs font-bold text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-full transition">Load More</button>
            </div>
        </div>

        <div class="detail-panel">
            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-400">
                <div class="bg-white p-6 rounded-3xl shadow-sm mb-4"><i class="fas fa-hand-pointer text-4xl text-blue-100"></i></div>
                <p class="font-medium">Select a ticket</p>
            </div>

            <div id="ticket-detail" class="hidden h-full flex flex-col">
                <div class="bg-white px-6 py-5 border-b border-gray-200 shadow-sm z-10">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-3">
                            <span class="text-xl font-black text-slate-800" id="d-id">--</span>
                            <span id="d-status-badge" class="bg-gray-100 text-gray-600 text-[10px] font-bold px-2 py-1 rounded uppercase">PENDING</span>
                        </div>
                        <button onclick="window.saveLocal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-sm">Save</button>
                    </div>
                    <h1 class="text-md font-bold text-slate-700 leading-tight mb-2" id="d-customer">--</h1>
                    <div class="flex gap-3 text-xs text-slate-500">
                        <span class="bg-slate-100 px-2 py-1 rounded"><i class="fas fa-warehouse text-slate-400"></i> <span id="d-whs">--</span></span>
                        <span class="bg-slate-100 px-2 py-1 rounded"><i class="fas fa-route text-slate-400"></i> <span id="d-route">--</span></span>
                    </div>
                </div>

                <div class="flex-grow overflow-y-auto p-6 space-y-6">
                    <div class="bg-red-50 border border-red-100 rounded-xl p-4">
                        <div class="text-[10px] font-bold text-red-400 uppercase mb-1">Issue</div>
                        <div class="font-bold text-red-900 text-sm leading-snug" id="d-desc">--</div>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                        <div class="text-[10px] font-bold text-slate-400 uppercase mb-1">Driver</div>
                        <div class="font-bold text-slate-700" id="d-driver">--</div>
                        <a id="btn-call" href="#" class="mt-2 inline-flex items-center gap-2 text-green-600 text-xs font-bold hover:underline hidden">
                            <i class="fas fa-phone"></i> Call Driver
                        </a>
                    </div>

                    <div class="flex-grow flex flex-col">
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-2">Resolution Notes</label>
                        <textarea id="d-notes" class="flex-grow w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-yellow-50 h-32" placeholder="Notes..."></textarea>
                    </div>
                    
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase mb-2 block">Update Status</label>
                        <select id="d-status-edit" class="w-full bg-white border border-slate-300 rounded-lg p-2 text-sm font-bold text-slate-700 cursor-pointer">
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                            <option value="Working on">Working on</option>
                            <option value="Escalated">Escalated</option>
                            <option value="Sent Back">Sent Back</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        // CRITICAL FIX 1: Updated Tenant ID
        const msalConfig = { 
            auth: { 
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", 
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: window.location.href 
            },
            cache: { cacheLocation: "localStorage" }
        };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        
        // STATE
        let db = [];
        let filteredDB = [];
        let driverMap = {}; 
        let currentUserEmail = "";
        let currentId = null;
        let renderLimit = 50;
        let currentView = 'list';
        let showMyTickets = false;

        // --- AUTH ---
        async function login() {
            try { 
                const r = await msalInstance.loginPopup({ scopes: ["User.Read"] }); 
                init(r.account.name, r.account.username); 
            } catch (e) { 
                document.getElementById('error-msg').innerText = "Auth Error: " + e.message; 
                document.getElementById('error-msg').classList.remove('hidden'); 
            }
        }
        function bypassAuth() { init("Offline Manager", "manager@wbmason.com"); }
        function init(name, email) {
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-avatar').innerText = name[0];
            currentUserEmail = email;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('upload-section').classList.remove('hidden');
        }

        // --- DATA ---
        function handleFile(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const wb = XLSX.read(e.target.result, {type:'binary'});
                
                // Driver Map
                wb.SheetNames.forEach(n => {
                    const s = XLSX.utils.sheet_to_json(wb.Sheets[n], {defval:""});
                    if(s.length>0 && s[0].Driver && s[0].ID) s.forEach(r => driverMap[r.ID] = r.Driver);
                });

                // CRITICAL FIX 2: Safe Date Parsing
                const safeDate = (v) => {
                    if (!v) return "";
                    // If it's a number (Excel Serial Date)
                    if (typeof v === 'number') {
                        const d = new Date(Math.round((v - 25569)*86400*1000));
                        return d.toISOString().split('T')[0];
                    }
                    return String(v); // Force string
                };

                const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
                db = raw.map(r => ({
                    id: val(r, ['id','ticket']),
                    date: safeDate(val(r, ['starttime','date'])), // Use safe parser
                    cust: val(r, ['company','name']),
                    acct: val(r, ['account','acct']),
                    route: val(r, ['route']),
                    whs: val(r, ['warehouse','wrh']),
                    driverRaw: val(r, ['driver']),
                    issue: val(r, ['issue']),
                    desc: val(r, ['description']),
                    email: val(r, ['email']),
                    notes: val(r, ['receivedtext']),
                    status: val(r, ['dispo','status']) || 'Pending'
                }));
                
                setupUI();
            };
            reader.readAsBinaryString(file);
        }

        function val(obj, keys) {
            const map = Object.keys(obj).reduce((a,k)=>{a[k.toLowerCase().replace(/[^a-z0-9]/g,'')]=k;return a},{});
            for(let k of keys) { let clean = k.toLowerCase().replace(/[^a-z0-9]/g,''); if(map[clean]) return obj[map[clean]]; }
            return "";
        }

        function setupUI() {
            const whsList = [...new Set(db.map(x=>x.whs).filter(x=>x))].sort();
            const sel = document.getElementById('whs-filter');
            whsList.forEach(w => { const o = document.createElement('option'); o.value=w; o.innerText=w; sel.appendChild(o); });

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('hidden');
            document.getElementById('app-ui').classList.add('grid');
            resetAndRender();
        }

        // --- RENDER ---
        function switchView(mode, el) {
            document.querySelectorAll('.view-tab').forEach(e => e.classList.remove('active'));
            el.classList.add('active');
            currentView = mode;
            resetAndRender();
        }

        function toggleMyTickets(enabled) {
            showMyTickets = enabled;
            document.getElementById('btn-view-all').className = enabled ? "flex-1 text-xs font-bold py-2 rounded-lg text-slate-400 hover:text-white transition" : "flex-1 text-xs font-bold py-2 rounded-lg bg-blue-600 text-white shadow transition";
            document.getElementById('btn-view-mine').className = enabled ? "flex-1 text-xs font-bold py-2 rounded-lg bg-blue-600 text-white shadow transition" : "flex-1 text-xs font-bold py-2 rounded-lg text-slate-400 hover:text-white transition";
            resetAndRender();
        }

        function resetAndRender() { renderLimit = 50; applyFilters(); }
        function loadMore() { renderLimit += 50; renderCurrentView(); }

        function applyFilters() {
            const whs = document.getElementById('whs-filter').value;
            const stat = document.getElementById('status-filter').value;
            const search = document.getElementById('search-input').value.toLowerCase();

            filteredDB = db.filter(t => {
                if(showMyTickets && t.email && !t.email.toLowerCase().includes(currentUserEmail.toLowerCase().split('@')[0])) return false;
                if(whs !== 'all' && t.whs !== whs) return false;
                if(stat !== 'all' && !t.status.includes(stat)) return false;
                if(search && !(t.cust+t.id+t.issue).toLowerCase().includes(search)) return false;
                return true;
            });

            document.getElementById('list-count').innerText = `${filteredDB.length} Found`;
            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('view-container');
            const loadBtn = document.getElementById('load-more-container');
            container.innerHTML = "";
            
            if(filteredDB.length > renderLimit && currentView !== 'kanban') loadBtn.classList.remove('hidden'); 
            else loadBtn.classList.add('hidden');

            const subset = currentView === 'kanban' ? filteredDB : filteredDB.slice(0, renderLimit);

            if(currentView === 'list') renderListView(container, subset);
            else if(currentView === 'grid') renderGridView(container, subset);
            else if(currentView === 'kanban') renderKanbanView(container, subset);
        }

        function renderListView(container, data) {
            data.forEach(t => {
                const el = document.createElement('div');
                el.className = `ticket-card ${t.id === currentId ? 'active' : ''}`;
                el.onclick = () => loadTicket(t.id);
                // CRITICAL FIX 3: Safe substring
                const dateDisplay = t.date.length >= 5 ? t.date.substring(5) : t.date;
                
                el.innerHTML = `
                    <div class="flex-shrink-0 w-12 text-center pt-1">
                        <div class="font-bold text-slate-800 text-sm">#${t.id}</div>
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="font-bold text-xs text-slate-700 truncate mb-1">${t.cust}</div>
                        <div class="text-[10px] text-slate-400 truncate">${t.issue}</div>
                    </div>
                    <div class="flex-shrink-0 text-right">
                        <span class="badge ${getStatusColor(t.status)}">${t.status}</span>
                        <div class="text-[9px] text-slate-400 mt-1">${dateDisplay}</div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function renderGridView(container, data) {
            let html = `<table class="data-table"><thead><tr><th>ID</th><th>Status</th><th>Customer</th><th>Issue</th><th>Driver</th></tr></thead><tbody>`;
            data.forEach(t => {
                html += `<tr onclick="window.loadTicket('${t.id}')" class="${t.id === currentId ? 'active' : ''}">
                    <td class="font-bold">#${t.id}</td>
                    <td><span class="badge ${getStatusColor(t.status)}">${t.status}</span></td>
                    <td>${t.cust}</td>
                    <td>${t.issue}</td>
                    <td>${t.driverRaw || '-'}</td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function renderKanbanView(container, data) {
            const cols = { 'Pending': [], 'Working on': [], 'Escalated': [], 'Completed': [] };
            data.forEach(t => {
                let s = t.status;
                if(s.includes('Complet')) s = 'Completed';
                else if(s.includes('Work')) s = 'Working on';
                else if(s.includes('Escal')) s = 'Escalated';
                else s = 'Pending';
                if(cols[s].length < 20) cols[s].push(t);
            });

            const board = document.createElement('div');
            board.className = 'kanban-board';
            
            Object.keys(cols).forEach(key => {
                const col = document.createElement('div');
                col.className = 'kanban-col';
                let cardsHtml = '';
                cols[key].forEach(t => {
                    let kClass = 'k-pending';
                    if(key==='Working on') kClass='k-working';
                    if(key==='Escalated') kClass='k-escalated';
                    if(key==='Completed') kClass='k-completed';
                    const dateDisplay = t.date.length >= 5 ? t.date.substring(5) : t.date;

                    cardsHtml += `<div class="kanban-card ${kClass}" onclick="window.loadTicket('${t.id}')">
                        <div class="font-bold mb-1">#${t.id} <span class="text-[9px] text-gray-400 ml-1">${dateDisplay}</span></div>
                        <div class="truncate text-xs text-slate-600 mb-1" title="${t.cust}">${t.cust}</div>
                        <div class="text-[10px] text-slate-400 truncate">${t.issue}</div>
                    </div>`;
                });
                col.innerHTML = `<div class="kanban-header"><span>${key}</span><span>${cols[key].length}</span></div><div class="kanban-body">${cardsHtml}</div>`;
                board.appendChild(col);
            });
            container.appendChild(board);
        }

        function getStatusColor(s) {
            if(s.includes('Complet')) return 'bg-green-100 text-green-700';
            if(s.includes('Escal')) return 'bg-red-100 text-red-700';
            if(s.includes('Work')) return 'bg-blue-100 text-blue-700';
            return 'bg-yellow-100 text-yellow-700';
        }

        // --- DETAIL ---
        function loadTicket(id) {
            currentId = id;
            if(currentView === 'list' || currentView === 'grid') renderCurrentView();
            
            const t = db.find(x => x.id === id);
            if(!t) return;

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('ticket-detail').classList.remove('hidden');

            const set = (i,v) => document.getElementById(i).innerText = v || '--';
            set('d-id', '#'+t.id);
            set('d-customer', t.cust);
            set('d-whs', t.whs);
            set('d-route', t.route);
            set('d-desc', t.desc || t.issue);
            document.getElementById('d-notes').value = t.notes || "";
            document.getElementById('d-status-edit').value = t.status;
            
            const b = document.getElementById('d-status-badge');
            b.innerText = t.status;
            b.className = `text-[10px] font-bold px-2 py-1 rounded uppercase ${getStatusColor(t.status)}`;

            let dName = t.driverRaw;
            if((!dName || dName.length < 3) && driverMap[t.id]) dName = driverMap[t.id];
            document.getElementById('d-driver').innerText = dName || "Unassigned";
            
            const ph = dName ? dName.match(/[\d\-\.\s]{10,}/) : null;
            if(ph) {
                document.getElementById('btn-call').href = `tel:${ph[0].replace(/[^0-9]/g,'')}`;
                document.getElementById('btn-call').classList.remove('hidden');
            } else {
                document.getElementById('btn-call').classList.add('hidden');
            }
        }

        function saveLocal() {
            const t = db.find(x => x.id === currentId);
            if(t) {
                t.notes = document.getElementById('d-notes').value;
                t.status = document.getElementById('d-status-edit').value;
                alert("Saved locally! Don't forget to export.");
                loadTicket(t.id);
            }
        }

        function exportData() {
            const ws = XLSX.utils.json_to_sheet(db);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Logistics_Updates");
            XLSX.writeFile(wb, "Logistics_Velocity_v19.xlsx");
        }
    </script>
</body>
</html>
