<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Command v62.8</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-body: #f1f5f9; --bg-side: #ffffff; --text-main: #0f172a;
            --border: #e2e8f0; --brand: #2563eb; --accent: #eff6ff;
        }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: sans-serif; height: 100vh; overflow: hidden; font-size: 11px; }
        .app-grid { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 56px); }
        
        .record-card { border-bottom: 1px solid var(--border); cursor: pointer; padding: 14px 18px; transition: all 0.2s; background: white; }
        .record-card:hover { background-color: var(--accent); }
        .record-card.active { background-color: var(--accent); border-left: 4px solid var(--brand); }
        
        .sync-active { color: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        /* Dropdown styling */
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M19 9l-7 7-7-7'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
    </style>
</head>
<body>

    <header class="h-14 border-b flex items-center justify-between px-6 bg-white z-10 shadow-sm">
        <div class="flex items-center gap-6">
            <div class="text-lg font-bold italic tracking-tighter text-blue-600">LOGICOMMAND <span class="text-[9px] opacity-40 not-italic">v62.8</span></div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search records..." class="rounded-full px-4 py-1.5 text-xs w-80 border bg-slate-50 outline-none focus:ring-2 ring-blue-100">
        </div>
        
        <div class="flex items-center gap-2 text-[10px] font-bold text-slate-500">
            <i class="fa fa-satellite-dish sync-active"></i>
            <span id="sync-status">SYSTEM: READY</span>
        </div>
    </header>

    <div class="app-grid">
        <aside class="border-r flex flex-col bg-white overflow-hidden shadow-xl">
            <div class="p-3 border-b flex gap-2 bg-slate-50">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white shadow-md">Active Logs</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400">All History</button>
            </div>
            <div id="ticket-list" class="flex-1 overflow-y-auto"></div>
        </aside>

        <main class="overflow-y-auto p-8">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-400">
                <i class="fa fa-truck-fast text-5xl mb-4 opacity-10"></i>
                <p class="font-bold uppercase tracking-widest text-[10px]">Select a log to view details</p>
            </div>

            <div id="detail-content" class="hidden max-w-5xl mx-auto space-y-6">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 id="d-company" class="text-xl font-bold text-slate-800 tracking-tight uppercase"></h2>
                        <p id="d-date" class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-1"></p>
                    </div>
                    <div class="text-right">
                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest block">Sales Order</span>
                        <p id="d-order" class="text-2xl font-black text-blue-600 italic"></p>
                    </div>
                </div>

                <div class="grid grid-cols-12 gap-6">
                    
                    <div class="col-span-4 space-y-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <label class="text-[9px] text-slate-400 uppercase font-bold mb-2 block tracking-widest">Process Stage (Disposition)</label>
                            <select id="d-dispo-select" onchange="updateDisposition()" class="w-full p-3 rounded-xl border-2 border-blue-100 bg-blue-50 text-blue-700 font-bold text-xs outline-none focus:border-blue-400">
                                <option value="Pending">Pending</option>
                                <option value="Working on">Working on</option>
                                <option value="Follow-up">Follow-up</option>
                                <option value="Escalated">Escalated</option>
                                <option value="Escalated - Working On">Escalated - Working On</option>
                                <option value="Escalation Sent">Escalation Sent</option>
                                <option value="Sent Back">Sent Back</option>
                                <option value="Completed">Completed</option>
                                <option value="Completed Escalated">Completed Escalated</option>
                            </select>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                            <p class="text-[9px] text-slate-400 uppercase font-bold mb-1 tracking-widest">Driver / Contact</p>
                            <p id="d-driver" class="text-sm font-bold text-slate-700"></p>
                        </div>
                    </div>

                    <div class="col-span-8 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <p class="text-[9px] text-slate-400 uppercase font-bold mb-3 tracking-widest border-b pb-2">Original Log Description</p>
                        <p id="d-description" class="text-sm text-slate-600 leading-relaxed whitespace-pre-wrap font-medium h-[200px] overflow-y-auto"></p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-3 block">Internal Session Notes</span>
                    <textarea id="d-notes" oninput="updateNoteInMemory()" class="w-full p-4 rounded-xl border border-slate-200 h-32 text-sm outline-none focus:ring-2 ring-blue-50 transition-all shadow-inner" placeholder="Add updates here..."></textarea>
                </div>

                <div class="pt-4">
                    <button id="res-btn" onclick="toggleComplete()" class="w-full py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl transition-all transform active:scale-[0.98]"></button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        let db = []; 
        let currentMode = 'active';
        let currentTicketId = null;

        window.onload = () => {
            fetchData(HISTORY_URL, "FullHistory");
            setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000);
        };

        async function fetchData(url, actionType) {
            const status = document.getElementById('sync-status');
            status.innerHTML = `<i class="fa fa-spinner fa-spin mr-2"></i>SYNCING...`;
            try {
                const response = await fetch(url, { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionType }) 
                });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
                status.innerHTML = `<i class="fa fa-check-circle mr-2 text-green-500"></i>ONLINE: ${db.length}`;
            } catch (e) { status.innerHTML = `<i class="fa fa-exclamation-circle mr-2 text-red-500"></i>OFFLINE`; }
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id;
                const item = {
                    id: id,
                    order: (r.cr714_salesordernumber || '').replace('SO#', '').replace('#', '').trim(),
                    company: r.cr714_companyordeliveryname || 'Unknown Account',
                    driver: r.cr714_drivernamenumber || 'Not Assigned',
                    status: (r.cr714_disposition || 'Pending'), 
                    description: r.cr714_description || 'No description available',
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || r.createdon || 'N/A',
                    timestamp: new Date(r.createdon).getTime(),
                    notes: "" 
                };
                const existingIdx = db.findIndex(x => x.id === id);
                if (existingIdx === -1) db.push(item);
                else { db[existingIdx].status = item.status; db[existingIdx].description = item.description; }
            });
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const matchesSearch = (t.order + t.company + t.driver).toLowerCase().includes(search);
                const matchesMode = (currentMode === 'all' || !t.status.toLowerCase().includes('completed'));
                return matchesSearch && matchesMode;
            }).sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            filtered.slice(0, 500).forEach(t => {
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-bold text-blue-600 uppercase">${t.order}</span>
                        <span class="text-[8px] px-1.5 py-0.5 bg-slate-100 rounded text-slate-500 font-bold uppercase">${t.status}</span>
                    </div>
                    <div class="font-bold text-slate-900 truncate uppercase text-[10px]">${t.company}</div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order; 
            document.getElementById('d-driver').innerText = t.driver;
            document.getElementById('d-date').innerText = `Created: ${t.date}`;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-notes').value = t.notes;
            document.getElementById('d-dispo-select').value = t.status;
            
            const btn = document.getElementById('res-btn');
            const isComp = t.status.toLowerCase().includes('completed');
            btn.innerText = isComp ? "RE-OPEN RECORD" : "MARK AS COMPLETED";
            btn.className = isComp ? "w-full py-5 bg-slate-200 text-slate-500 rounded-2xl font-black" : "w-full py-5 bg-green-600 text-white rounded-2xl font-black";
            render();
        }

        function updateDisposition() {
            const t = db.find(x => x.id === currentTicketId);
            if(t) {
                t.status = document.getElementById('d-dispo-select').value;
                loadTicket(t.id); // Refresh view/button
            }
        }

        function toggleComplete() {
            const t = db.find(x => x.id === currentTicketId);
            if(t) {
                t.status = t.status.toLowerCase().includes('completed') ? 'Pending' : 'Completed';
                if(currentMode === 'active' && t.status.toLowerCase().includes('completed')) {
                    document.getElementById('detail-content').classList.add('hidden');
                    document.getElementById('empty-state').classList.remove('hidden');
                }
                render();
                if (currentTicketId && t.status !== 'Completed') loadTicket(t.id);
            }
        }

        function updateNoteInMemory() {
            const t = db.find(x => x.id === currentTicketId);
            if(t) t.notes = document.getElementById('d-notes').value;
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white shadow-md' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400';
            document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white shadow-md' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400';
            render();
        }
    </script>
</body>
</html>
