<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Command v58.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-body: #f8fafc; --bg-side: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --border: #e2e8f0; --brand: #2563eb; --accent: #eff6ff;
        }

        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; font-size: 11px; }
        .app-grid { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 56px); }
        
        /* Smooth Entrance for New Records */
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; background: #dbeafe; }
            to { transform: translateX(0); opacity: 1; background: transparent; }
        }
        .new-record { animation: slideIn 0.6s ease-out; border-left: 4px solid #3b82f6 !important; }

        .record-card { border-bottom: 1px solid var(--border); cursor: pointer; padding: 14px 18px; transition: all 0.2s; background: white; }
        .record-card:hover { background-color: var(--accent); }
        .record-card.active { background-color: var(--accent); border-left: 4px solid var(--brand); }

        .label-tiny { font-size: 8px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 2px; }
        
        .sync-active { color: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="theme-default">

    <audio id="ping-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <header class="h-14 border-b flex items-center justify-between px-6 bg-white z-10">
        <div class="flex items-center gap-6">
            <div class="text-lg font-black italic tracking-tighter text-blue-600">LOGICOMMAND <span class="text-[9px] opacity-40 not-italic">v58.0</span></div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search all 8k records..." class="rounded-full px-4 py-1.5 text-xs w-64 border bg-slate-50 outline-none focus:ring-2 ring-blue-100">
        </div>
        
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2 text-[10px] font-bold text-slate-500">
                <i class="fa fa-satellite-dish sync-active"></i>
                <span id="sync-status">SYSTEM: BOOTING...</span>
            </div>
        </div>
    </header>

    <div class="app-grid">
        <aside class="border-r flex flex-col bg-white overflow-hidden">
            <div class="p-3 border-b flex gap-2 bg-slate-50">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white shadow-md">Open Requests</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400 hover:bg-slate-200">History (Full Search)</button>
            </div>
            <div id="ticket-list" class="flex-1 overflow-y-auto"></div>
        </aside>

        <main class="bg-slate-50 overflow-y-auto relative">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-400">
                <i class="fa fa-database text-5xl mb-4 opacity-20"></i>
                <p class="font-black uppercase tracking-widest text-xs opacity-40">Awaiting Data Load</p>
                <p id="debug-info" class="text-[9px] mt-2 font-mono text-blue-500 italic">Connecting to Dataverse...</p>
            </div>

            <div id="detail-content" class="hidden p-10 max-w-5xl mx-auto space-y-8">
                <div class="flex justify-between items-end border-b border-slate-200 pb-8">
                    <div>
                        <h2 id="d-company" class="text-4xl font-black text-slate-900 tracking-tight"></h2>
                        <p id="d-address" class="text-slate-500 mt-2 text-sm">Full Dataset View</p>
                    </div>
                    <div class="text-right">
                        <span class="label-tiny">Sales Order</span>
                        <p id="d-order" class="text-3xl font-black text-blue-600 italic"></p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200">
                            <span class="label-tiny text-blue-500">Logistics Information</span>
                            <div class="flex flex-col gap-4 mt-2">
                                <div>
                                    <p class="text-[10px] text-slate-400 uppercase font-bold">Driver / Unit</p>
                                    <p id="d-driver" class="text-lg font-black text-slate-800"></p>
                                </div>
                                <div>
                                    <p class="text-[10px] text-slate-400 uppercase font-bold">Dataverse Status</p>
                                    <p id="d-status-text" class="text-lg font-black text-blue-600 uppercase"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <span class="label-tiny">Dispatcher Workspace Notes</span>
                        <textarea id="d-notes" oninput="saveLocal()" class="w-full p-6 rounded-2xl border-2 h-64 text-sm outline-none focus:border-blue-500 transition-all shadow-inner" placeholder="Type notes here (saved to your browser)..."></textarea>
                        <button id="res-btn" onclick="toggleComplete()" class="w-full py-5 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg transition-all transform active:scale-95"></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 1. WATCHDOG: Checks for NEW rows only (Every 5 minutes)
        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        
        // 2. INITIAL LOAD: Pulls the 8,000 record history (Once on startup)
        const HISTORY_URL = 'https://49b71dde44f8e78e89bc0440816209.07.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c8534a1735ca463d9386ac5ab1c89fcf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=X3TCIX7rLqKbo5iiDAOozZ-JchO3BuPK5H8DW4aruAA';

        let db = JSON.parse(localStorage.getItem('logistics_db_v58')) || [];
        let currentMode = 'active';
        let currentTicketId = null;

        window.onload = () => {
            render();
            
            // EXECUTE HEAVY LOAD
            fetchData(HISTORY_URL, "FullHistory");

            // SET WATCHDOG POLLING TO 5 MINUTES (300,000ms)
            setInterval(() => {
                fetchData(WATCHDOG_URL, "TodayOnly");
            }, 300000);
        };

        async function fetchData(targetUrl, actionType) {
            const statusLabel = document.getElementById('sync-status');
            const debugLabel = document.getElementById('debug-info');
            
            statusLabel.innerText = actionType === "FullHistory" ? "SYSTEM: LOADING 8K RECORDS..." : "WATCHDOG: SCANNING...";

            try {
                const response = await fetch(targetUrl, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionType }) 
                });

                if (!response.ok) {
                    if(response.status === 504) {
                        debugLabel.innerText = "ERROR: HISTORY LOAD TOO HEAVY (TIMEOUT). Check 'Select Columns' in Flow.";
                    }
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                
                if (data.value) {
                    ingest(data.value);
                    debugLabel.innerText = `DATABASE READY: ${db.length} RECORDS LOADED`;
                }
                statusLabel.innerText = "SYSTEM: ONLINE";
            } catch (e) { 
                console.error(e);
                statusLabel.innerText = "SYSTEM: SYNC ERROR"; 
            }
        }

        function ingest(data) {
            let foundNew = false;
            data.forEach(r => {
                const item = {
                    id: r['cr714_logisticslogid'] || r['iteminternalid'], 
                    order: r['cr714_SalesOrderNumber'] || 'N/A',
                    company: r['cr714_Companyordeliveryname'] || 'Unknown Account',
                    driver: r['cr714_DriverNameNumber'] || 'No Driver Info',
                    status: r['cr714_Disposition'] || 'Pending',
                    timestamp: new Date(r['createdon']).getTime() || Date.now()
                };

                const idx = db.findIndex(x => x.id === item.id);
                if(idx === -1) {
                    db.push({...item, notes: "", isNew: true});
                    foundNew = true;
                } else {
                    db[idx] = {...item, notes: db[idx].notes || ""};
                }
            });

            if(foundNew) {
                document.getElementById('ping-sound').play().catch(e=>{});
                saveLocal(true);
                setTimeout(() => { db.forEach(x => x.isNew = false); saveLocal(true); }, 10000);
            } else {
                render(); 
            }
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            
            // Virtual filter
            const filtered = db.filter(t => (currentMode === 'all' || t.status !== 'Completed'))
                              .filter(t => 
                                 t.order.toLowerCase().includes(search) || 
                                 t.company.toLowerCase().includes(search) || 
                                 t.driver.toLowerCase().includes(search)
                              )
                              .sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            
            // Performance Limit: Only draw first 500 matches to keep browser fast
            const displaySet = filtered.slice(0, 500);

            displaySet.forEach(t => {
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''} ${t.isNew ? 'new-record' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-black text-blue-600 uppercase">SO# ${t.order}</span>
                        ${t.isNew ? '<span class="text-[7px] bg-blue-600 text-white px-1 rounded-sm font-bold">NEW</span>' : ''}
                    </div>
                    <div class="font-black text-xs text-slate-900 truncate">${t.company}</div>
                    <div class="text-[9px] text-slate-400 truncate uppercase font-bold">${t.driver}</div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = `#${t.order}`;
            document.getElementById('d-driver').innerText = t.driver;
            document.getElementById('d-status-text').innerText = t.status;
            document.getElementById('d-notes').value = t.notes || '';
            
            const btn = document.getElementById('res-btn');
            btn.innerText = t.status === 'Completed' ? "RE-OPEN REQUEST" : "MARK AS COMPLETED";
            btn.className = t.status === 'Completed' ? 
                "w-full py-5 bg-slate-200 text-slate-700 rounded-xl font-black text-xs uppercase" : 
                "w-full py-5 bg-green-600 text-white rounded-xl font-black text-xs uppercase";

            render();
        }

        function toggleComplete() {
            const t = db.find(x => x.id === currentTicketId);
            if(t) {
                t.status = (t.status === 'Completed') ? 'Pending' : 'Completed';
                saveLocal(true);
                if(currentMode === 'active' && t.status === 'Completed') {
                    document.getElementById('detail-content').classList.add('hidden');
                    document.getElementById('empty-state').classList.remove('hidden');
                    currentTicketId = null;
                }
                render();
            }
        }

        function saveLocal(reRender = false) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) t.notes = document.getElementById('d-notes').value;
            localStorage.setItem('logistics_db_v58', JSON.stringify(db));
            if (reRender) render();
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white shadow-md' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400 hover:bg-slate-200';
            document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white shadow-md' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400 hover:bg-slate-200';
            render();
        }
    </script>
</body>
</html>
