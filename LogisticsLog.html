<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Command v53.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-body: #f8fafc; --bg-side: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --border: #e2e8f0; --brand: #2563eb; --accent: #eff6ff;
        }

        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; font-size: 11px; }
        .app-grid { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 56px); }
        
        /* New Record Highlight & Animation */
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; background: #dbeafe; }
            to { transform: translateX(0); opacity: 1; background: transparent; }
        }
        .new-record { animation: slideIn 0.6s ease-out; border-left: 4px solid #3b82f6 !important; }

        .record-card { border-bottom: 1px solid var(--border); cursor: pointer; padding: 12px 16px; transition: all 0.2s; background: white; }
        .record-card:hover { background-color: var(--accent); }
        .record-card.active { background-color: var(--accent); border-left: 4px solid var(--brand); }

        .label-tiny { font-size: 8px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 2px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .sync-active { color: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="theme-default">

    <audio id="ping-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <header class="h-14 border-b flex items-center justify-between px-6 bg-white z-10">
        <div class="flex items-center gap-6">
            <div class="text-lg font-black italic tracking-tighter text-blue-600">LOGICOMMAND <span class="text-[9px] opacity-40 not-italic">v53.0</span></div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search active desk..." class="rounded-full px-4 py-1.5 text-xs w-64 border bg-slate-50 outline-none focus:ring-2 ring-blue-100">
        </div>
        
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2 text-[10px] font-bold text-slate-500">
                <i class="fa fa-satellite-dish sync-active"></i>
                <span id="sync-status">SCOUT: STANDING BY</span>
            </div>
        </div>
    </header>

    <div class="app-grid">
        <aside class="border-r flex flex-col bg-white overflow-hidden">
            <div class="p-3 border-b flex gap-2 bg-slate-50">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white shadow-md">Active Desk</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400 hover:bg-slate-200">History</button>
            </div>
            <div id="ticket-list" class="flex-1 overflow-y-auto"></div>
        </aside>

        <main class="bg-slate-50 overflow-y-auto relative">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-400 opacity-60">
                <i class="fa fa-terminal text-5xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xs">Awaiting selection...</p>
            </div>

            <div id="detail-content" class="hidden p-10 max-w-5xl mx-auto space-y-8">
                <div class="flex justify-between items-end border-b border-slate-200 pb-8">
                    <div>
                        <span id="d-id" class="text-[9px] font-mono text-slate-400 block mb-1"></span>
                        <h2 id="d-company" class="text-4xl font-black text-slate-900 tracking-tight"></h2>
                        <p id="d-address" class="text-slate-500 mt-2 text-sm"></p>
                    </div>
                    <div class="text-right">
                        <span class="label-tiny">Sales Order</span>
                        <p id="d-order" class="text-3xl font-black text-blue-600 tracking-tighter italic"></p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <span class="label-tiny text-blue-500">Reported Problem</span>
                            <p id="d-issue" class="text-xl font-black text-slate-800 uppercase mb-2"></p>
                            <p id="d-desc" class="text-sm text-slate-600 leading-relaxed"></p>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white p-4 rounded-xl border border-slate-200">
                                <span class="label-tiny">Driver Name</span>
                                <p id="d-driver" class="font-bold text-slate-700"></p>
                            </div>
                            <a id="btn-call" href="#" class="bg-slate-900 text-white p-4 rounded-xl flex items-center justify-between hover:bg-black transition">
                                <div class="text-left">
                                    <span class="label-tiny text-slate-400">Call Driver</span>
                                    <p id="d-phone" class="font-bold text-[11px]"></p>
                                </div>
                                <i class="fa fa-phone"></i>
                            </a>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <span class="label-tiny">Logistics Disposition & Notes</span>
                        <textarea id="d-notes" oninput="saveLocal()" class="w-full p-6 rounded-2xl border-2 h-72 text-sm outline-none focus:border-blue-500 transition-all shadow-inner" placeholder="Enter resolution steps here..."></textarea>
                        <button id="res-btn" onclick="toggleComplete()" class="w-full py-5 rounded-xl font-black text-xs uppercase tracking-widest shadow-xl transition-all transform active:scale-95"></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1';
        
        let db = JSON.parse(localStorage.getItem('logistics_db_v53')) || [];
        let currentMode = 'active';
        let currentTicketId = null;

        window.onload = () => {
            render();
            // 1. Initial Deep Dive (Load everything)
            fetchData("FullHistory");
            // 2. The Scout (Check today's records every 15 seconds)
            setInterval(() => fetchData("TodayOnly"), 15000);
        };

        async function fetchData(mode) {
            const statusLabel = document.getElementById('sync-status');
            statusLabel.innerText = "SCOUT: SCANNING...";
            
            try {
                const response = await fetch(FLOW_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: mode }) 
                });
                const data = await response.json();
                if (data.value) ingest(data.value);
                statusLabel.innerText = "SCOUT: STANDING BY";
            } catch (e) { 
                statusLabel.innerText = "SCOUT: OFFLINE";
                console.error(e);
            }
        }

        function ingest(data) {
            let foundNew = false;
            data.forEach(r => {
                const item = {
                    id: val(r, ['id', 'cr714']), // Dataverse Logical ID
                    order: val(r, ['salesorder', 'ordernumber']),
                    company: val(r, ['company', 'customer', 'deliverylocation']),
                    address: val(r, ['deliveryaddress', 'address']),
                    driver: val(r, ['drivername', 'driver']).split(/[0-9]/)[0].trim() || 'No Name',
                    phone: (val(r, ['phone', 'drivername'])).match(/\d{3}[-\s]?\d{3}[-\s]?\d{4}/)?.[0] || '---',
                    issue: val(r, ['issue', 'problem', 'problemtype']),
                    desc: val(r, ['description', 'details']),
                    status: val(r, ['status', 'disposition']) || 'Pending',
                    timestamp: new Date(val(r, ['createdon', 'starttime'])).getTime()
                };

                const idx = db.findIndex(x => x.id === item.id);
                if(idx === -1) {
                    db.push({...item, notes: "", isNew: true});
                    foundNew = true;
                } else {
                    db[idx] = {...item, notes: db[idx].notes || ""};
                }
            });

            if(foundNew) {
                document.getElementById('ping-sound').play().catch(e => {});
                saveLocal(true);
                // Clear the "New" animation after 8 seconds
                setTimeout(() => { db.forEach(x => x.isNew = false); saveLocal(true); }, 8000);
            }
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            
            const filtered = db.filter(t => (currentMode === 'all' || t.status !== 'Completed'))
                              .filter(t => JSON.stringify(t).toLowerCase().includes(search))
                              .sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            filtered.forEach(t => {
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''} ${t.isNew ? 'new-record' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-black text-blue-600 uppercase">SO# ${t.order}</span>
                        ${t.isNew ? '<span class="text-[7px] bg-blue-600 text-white px-1 rounded-sm font-bold">NEW</span>' : ''}
                    </div>
                    <div class="font-black text-xs text-slate-900 truncate">${t.company}</div>
                    <div class="text-[9px] text-slate-400 truncate">${t.address}</div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            
            document.getElementById('d-id').innerText = `DATAVERSE_ID: ${t.id}`;
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-address').innerText = t.address;
            document.getElementById('d-order').innerText = `#${t.order}`;
            document.getElementById('d-driver').innerText = t.driver;
            document.getElementById('d-phone').innerText = t.phone;
            document.getElementById('d-issue').innerText = t.issue;
            document.getElementById('d-desc').innerText = t.desc;
            document.getElementById('d-notes').value = t.notes || '';
            
            const btn = document.getElementById('res-btn');
            btn.innerText = t.status === 'Completed' ? "Restore Record" : "Mark as Resolved";
            btn.className = t.status === 'Completed' ? 
                "w-full py-5 bg-slate-200 text-slate-700 rounded-xl font-black text-xs uppercase" : 
                "w-full py-5 bg-green-600 text-white rounded-xl font-black text-xs uppercase";

            document.getElementById('btn-call').href = t.phone !== '---' ? `tel:${t.phone}` : "#";
            render();
        }

        function toggleComplete() {
            const t = db.find(x => x.id === currentTicketId);
            if(t) {
                t.status = (t.status === 'Completed') ? 'Pending' : 'Completed';
                saveLocal(true);
                if(currentMode === 'active') {
                    document.getElementById('detail-content').classList.add('hidden');
                    document.getElementById('empty-state').classList.remove('hidden');
                    currentTicketId = null;
                } else {
                    loadTicket(t.id);
                }
            }
        }

        function val(row, terms) {
            const keys = Object.keys(row);
            for (let t of terms) {
                const nt = t.toLowerCase().replace(/[^a-z0-9]/g, '');
                for (let k of keys) {
                    const ck = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (ck.includes(nt)) return String(row[k] || '').trim();
                }
            }
            return '';
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white shadow-md' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400 hover:bg-slate-200';
            document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white shadow-md' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400 hover:bg-slate-200';
            render();
        }

        function saveLocal(reRender = false) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) t.notes = document.getElementById('d-notes').value;
            localStorage.setItem('logistics_db_v53', JSON.stringify(db));
            if (reRender) render();
        }
    </script>
</body>
</html>
