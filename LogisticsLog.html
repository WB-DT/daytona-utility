<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLog v104.63 | Logistics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root, [data-theme='midnight'] { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='light'] { 
            --bg-deep: #f8fafc; --bg-surface: #ffffff; --bg-card: #f1f5f9;      
            --brand: #0d9488; --text-main: #0f172a; --text-dim: #475569;     
            --text-accent: #b45309; --border: #e2e8f0; --input-bg: #ffffff; --danger: #dc2626;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s ease; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside#main-gallery { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; position: relative; }
        #account-rail { width: 420px; min-width: 420px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 15px 0; display: none; }
        #account-rail.is-visible { display: flex !important; flex-direction: column; }

        .record-card { margin: 6px 12px; border-radius: 8px; padding: 10px 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid var(--border); position: relative; }
        .record-card:hover { transform: translateX(4px); background: rgba(0,0,0,0.03); }
        .record-card.active-card { background: var(--brand) !important; border-left-color: var(--text-main) !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .record-card.active-card * { color: #ffffff !important; border-color: rgba(255, 255, 255, 0.3) !important; opacity: 1 !important; }

        .time-label-gallery { font-size: 11px; font-weight: 400; color: var(--text-main); opacity: 0.7; letter-spacing: 0.02em; }
        .wh-label { font-size: 10px; font-weight: 900; color: var(--brand); text-transform: uppercase; border: 1px solid var(--brand); padding: 1px 5px; border-radius: 3px; }
        .disp-pill { font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; border: 1px solid currentColor; }
        .issue-card-tag { font-size: 10px; font-weight: 700; color: var(--text-accent); text-transform: uppercase; letter-spacing: 0.5px; }

        .theme-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; }
        #email-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 550px; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2); }

        @keyframes duplicate-pulse {
            0% { color: inherit; text-shadow: none; }
            50% { color: var(--danger); text-shadow: 0 0 12px var(--danger); }
            100% { color: inherit; text-shadow: none; }
        }
        .order-duplicate-alert { animation: duplicate-pulse 1s infinite ease-in-out; font-weight: 900 !important; }
        .id-badge-ghost { font-size: 8px; font-weight: 700; opacity: 0.4; text-transform: uppercase; }
        .system-debug-footer { font-family: 'JetBrains Mono', monospace; font-size: 8px; opacity: 0.2; position: absolute; bottom: 10px; right: 20px; text-transform: uppercase; pointer-events: none; letter-spacing: 1px; }
        
        .user-badge { font-size: 10px; font-weight: 900; padding: 4px 12px; border-radius: 20px; background: rgba(0,0,0,0.05); border: 1px solid var(--border); color: var(--text-dim); }
        .god-mode-active { border-color: var(--text-accent); color: var(--text-accent); }
        .admin-view-selector { background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-accent); font-weight: 900; font-size: 9px; outline: none; cursor: pointer; text-transform: uppercase; border-radius: 4px; padding: 2px 4px; margin-left: 5px; }
        .frog-mascot { font-size: 26px; color: var(--brand); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
    </style>
</head>
<body data-theme="midnight">

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-frog frog-mascot"></i>
                <div class="text-xl font-black uppercase tracking-tighter text-[var(--brand)]">LOGILOG <span class="text-[10px] opacity-40 ml-1">v104.63</span></div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search company, order, or account..." class="w-80 bg-black/5 border border-[var(--border)] p-2 text-xs rounded text-[var(--text-main)] outline-none focus:border-[var(--brand)]">
        </div>
        
        <div class="flex items-center gap-4">
            <div id="user-display" class="user-badge flex items-center gap-2">
                <i class="fa fa-user-circle"></i>
                <span id="user-name-label">User</span>
                <select id="admin-view-filter" class="admin-view-selector hidden" onchange="render()">
                    <option value="ALL">ALL RECORDS</option>
                </select>
            </div>
            <div class="flex items-center gap-2 bg-black/5 p-1.5 rounded-full border border-[var(--border)]">
                <div onclick="setTheme('midnight')" class="theme-dot bg-[#0f172a] text-white" title="Midnight"><i class="fa fa-moon"></i></div>
                <div onclick="setTheme('light')" class="theme-dot bg-[#f8fafc] text-[#0f172a]" title="Light Mode"><i class="fa fa-sun"></i></div>
            </div>
            <div id="sync-indicator"><i id="sync-icon" class="fa fa-circle text-[8px] text-[var(--brand)]"></i></div>
        </div>
    </header>

    <div class="app-container">
        <aside id="main-gallery">
            <div class="p-3 flex gap-2 border-b border-[var(--border)]">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto flex-grow"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10 text-[var(--text-dim)]">
                <i class="fa-solid fa-frog text-9xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select a Record</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto">
                <div class="max-w-4xl mx-auto p-8 space-y-8">
                    <div class="flex justify-between items-start border-b border-[var(--border)] pb-8">
                        <div class="flex-grow space-y-4">
                            <div class="flex items-baseline gap-4">
                                <h2 id="d-company" class="text-[var(--text-main)] uppercase tracking-tight text-2xl font-extrabold leading-none"></h2>
                                <span id="d-account" class="text-sm font-bold opacity-40 uppercase tracking-widest"></span>
                            </div>
                            <div class="flex items-start gap-2 text-[11px] text-[var(--text-dim)] uppercase font-bold">
                                <i class="fa fa-location-dot mt-0.5 text-[var(--brand)]"></i>
                                <span id="d-address"></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span id="d-wh-badge" class="wh-label"></span>
                                <span id="d-route-badge" class="route-pill"></span>
                            </div>
                            <div class="flex items-center gap-2 text-[14px] text-[var(--text-dim)]">
                                <i class="fa fa-truck-steering text-[var(--text-accent)] text-xs"></i>
                                <span id="d-driver-info" class="font-normal uppercase tracking-tight text-[var(--text-main)]"></span>
                            </div>
                            <div class="flex flex-col gap-1.5 pt-2 border-t border-[var(--border)] mt-2">
                                <div class="flex items-center gap-2 text-[12px]">
                                    <i class="fa fa-user-pen text-[var(--brand)] w-4 text-center"></i>
                                    <span class="font-black uppercase tracking-widest opacity-40 text-[10px]">Rep:</span>
                                    <span id="d-submit-rep" class="font-bold uppercase text-[var(--text-main)]"></span>
                                </div>
                                <div class="flex items-center gap-2 text-[12px]">
                                    <i class="fa fa-user-shield text-[var(--text-accent)] w-4 text-center"></i>
                                    <span class="font-black uppercase tracking-widest opacity-40 text-[10px]">Logistics:</span>
                                    <span id="d-logistics-owner" class="font-bold uppercase text-[var(--text-main)]"></span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex flex-col items-end w-[300px] gap-3">
                            <div onclick="copyToClipboard()" class="w-fit cursor-pointer group relative text-right">
                                <p id="d-full-time" class="time-label-detail mb-1 text-[var(--text-dim)] text-[11px]"></p>
                                <p id="d-order" class="text-4xl font-black italic text-[var(--text-main)] leading-none hover:text-[var(--brand)] transition-colors"></p>
                                <span id="copy-toast" class="absolute -top-7 right-0 text-[10px] bg-[var(--brand)] text-white px-2 py-1 rounded font-black opacity-0 transition-opacity uppercase">Copied</span>
                            </div>
                            <select id="d-disposition" class="w-48 bg-[var(--bg-surface)] border border-[var(--brand)] text-[10px] font-black uppercase px-3 py-2 rounded text-[var(--brand)] outline-none cursor-pointer hover:bg-[var(--brand)] hover:text-white transition-all">
                                <option value="Pending">Pending</option>
                                <option value="Working">Working</option>
                                <option value="Follow-Up">Follow-Up</option>
                                <option value="Completed">Completed</option>
                                <option value="Sent Back">Sent Back</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-black/5 border-l-4 border-[var(--text-accent)] p-6 rounded-r-lg">
                        <label id="d-issue-label" class="text-[10px] font-black text-[var(--text-accent)] uppercase block mb-2 tracking-wider"></label>
                        <p id="d-description" class="font-medium text-[var(--text-main)] text-lg leading-relaxed"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-8">
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50 tracking-widest">Warehouse Updates</label>
                            <textarea id="d-warehouse-input" class="h-56 bg-black/5 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-[var(--text-main)] leading-relaxed"></textarea>
                        </div>
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50 tracking-widest">Driver Feedback</label>
                            <textarea id="d-driver-input" class="h-56 bg-black/5 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-[var(--text-main)] leading-relaxed"></textarea>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="openDraftModal('warehouse')" class="flex-1 py-5 border-2 border-[var(--text-accent)] text-[var(--text-accent)] rounded font-black uppercase text-sm tracking-[0.2em] hover:bg-[var(--text-accent)] hover:text-white transition-all shadow-lg">Email Warehouse</button>
                        <button id="rep-update-btn" onclick="openDraftModal('rep')" class="flex-1 py-5 border-2 border-[var(--brand)] text-[var(--brand)] rounded font-black uppercase text-sm tracking-[0.2em] hover:bg-[var(--brand)] hover:text-white transition-all shadow-lg">Send Rep Update</button>
                        <button id="save-btn" onclick="saveRecord()" class="flex-[1.5] py-5 bg-[var(--brand)] text-white rounded font-black uppercase text-sm tracking-[0.2em] hover:brightness-110 shadow-xl transition-all">Save Logistics Update</button>
                    </div>
                </div>
                <div id="d-system-guid" class="system-debug-footer"></div>
            </div>
        </main>

        <aside id="account-rail">
           <h3 class="text-[12px] font-black uppercase tracking-widest text-[var(--danger)] mb-4 border-b border-[var(--border)] pb-3 text-center mx-3">Duplicate History</h3>
            <div id="rail-content" class="overflow-y-auto"></div>
        </aside>
    </div>

    <div id="email-modal-overlay">
        <div class="modal-container">
            <div class="bg-black/5 p-5 flex justify-between items-center border-b border-[var(--border)]">
                <span id="m-header-label" class="font-black uppercase text-xs tracking-widest text-[var(--brand)]">Outlook Draft Editor</span>
                <button onclick="closeDraftModal()" class="text-[var(--text-dim)] hover:text-[var(--text-main)] transition-colors"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-[60px_1fr] items-center gap-2">
                    <span class="text-[10px] font-black uppercase opacity-40">To:</span>
                    <span id="m-to-address" class="text-sm font-bold text-[var(--brand)]"></span>
                </div>
                <div class="grid grid-cols-[60px_1fr] items-center gap-2">
                    <span class="text-[10px] font-black uppercase opacity-40">Subj:</span>
                    <input id="m-subject" type="text" class="bg-transparent border-none text-sm font-black italic text-[var(--text-main)] outline-none w-full">
                </div>
                <div class="pt-4 border-t border-[var(--border)]">
                    <textarea id="m-body" class="w-full text-sm leading-relaxed text-[var(--text-dim)] bg-black/5 p-4 rounded-lg min-h-[250px] outline-none focus:ring-1 focus:ring-[var(--brand)] border-none"></textarea>
                </div>
            </div>
            <div class="p-6 flex gap-4 bg-black/5">
                <button onclick="closeDraftModal()" class="flex-1 py-3 text-[10px] font-black uppercase opacity-50 hover:opacity-100 transition-opacity">Discard</button>
                <button id="confirm-send-btn" onclick="sendViaFlow()" class="flex-[2] py-4 bg-[var(--brand)] text-white rounded font-black uppercase text-xs tracking-[0.2em] hover:brightness-110">SEND UPDATE</button>
            </div>
        </div>
    </div>

    <script>
        let db = [];
        let currentMode = 'active'; 
        let currentTicketId = null;
        let currentUser = { name: "Guest", email: "", isGodMode: true };
        const ADMIN_LIST = ["Anslee Erickson", "Matthew Bleakley", "Taylor Whitaker", "Wayne Rendt", "Holly Evans", "Kari Westervelt"];
        const NAME_MAP = {
            "Kari": "Kari Westervelt", "Holly": "Holly Evans", "Courtney": "Courtney Youngblood",
            "Jewel": "Jewel Jenkins", "Noah": "Noah Comans", "Wayne": "Wayne Rendt",
            "Rachel": "Rachel Kaiser", "Tobbitha": "Tobbitha Bishoff", "Paula": "Paula Bowen", "Jessica": "Jessica Pauley"
        };
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';
        const SAVE_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY';
        const SEND_EMAIL_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5473f5a058f344eaaf1d5c2544baf437/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=qgC3_5VOBOQ3U_IfsvdIcOGyhUQC98oU2-wGbvmejvQ';
        
        window.onload = async () => { 
            setMode('active'); 
            identifyUser();
            fetchData(HISTORY_URL); 
        };

        function identifyUser() {
            try {
                if (window.msalInstance) {
                    const accounts = window.msalInstance.getAllAccounts();
                    if (accounts.length > 0) {
                        const acc = accounts[0];
                        currentUser.name = acc.name;
                        currentUser.email = acc.username;
                        currentUser.isGodMode = ADMIN_LIST.some(admin => acc.name.toLowerCase().includes(admin.toLowerCase()));
                    }
                }
            } catch(e) {}
            
            const label = document.getElementById('user-name-label');
            label.innerText = currentUser.name;
            if(currentUser.isGodMode) {
                document.getElementById('user-display').classList.add('god-mode-active');
                setupAdminView();
            }
        }

        function setupAdminView() {
            const selector = document.getElementById('admin-view-filter');
            selector.classList.remove('hidden');
            Object.values(NAME_MAP).sort().forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.innerText = name; selector.appendChild(opt);
            });
        }

        async function fetchData(url) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-[var(--brand)]";
            try {
                const response = await fetch(url, { method: 'POST' });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error("Sync Error:", e); }
            setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[8px] text-[var(--brand)]"; }, 1500);
        }

        function ingest(data) {
            db = data.map(r => {
                const dateObj = r.createdon ? new Date(r.createdon) : null;
                let rawOwner = r.cr714_logisticsowner || 'Unassigned';
                return {
                    id: r.cr714_id || 'N/A',
                    guid: (r.cr714_logisticslog_2id || '').trim().replace(/[{}]/g, ''), 
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: r.cr714_companyordeliveryname || 'Unknown',
                    account: r.cr714_accountnumber || 'N/A',
                    // FIXED: RE-ADDED SHIPPING ADDRESS MAPPING
                    address: r.cr714_shippingaddress || 'No Address Provided',
                    submitRep: r.cr714_rep || 'CSR', 
                    logisticsOwner: NAME_MAP[rawOwner] || rawOwner, 
                    driverInfo: r.cr714_drivernamenumber || 'No Driver Data',
                    status: r['cr714_disposition@OData.Community.Display.V1.FormattedValue'] || r.cr714_disposition || 'Pending',
                    issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || r.cr714_issue || 'General',
                    description: r.cr714_description || '',
                    warehouse: r['cr714_warehouse@OData.Community.Display.V1.FormattedValue'] || r.cr714_warehouse || 'N/A',
                    route: r['cr714_route@OData.Community.Display.V1.FormattedValue'] || r.cr714_route || 'N/A',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                    fullStamp: dateObj ? `${dateObj.toLocaleDateString()} | ${dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : 'N/A',
                    timestamp: dateObj ? dateObj.getTime() : 0
                };
            });
            render();
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-white shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)]';
            document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-white shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)]';
            render();
        }

        function createCardHTML(t) {
            const isOrderDup = db.filter(x => x.order === t.order && x.order !== 'N/A').length > 1;
            return `
                <div class="record-card ${currentTicketId === t.id ? 'active-card' : ''}" onclick="loadTicket('${t.id}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="id-badge-ghost">#${t.id}</span>
                        <div class="flex gap-2 items-center">
                            <span class="time-label-gallery">${t.fullStamp}</span>
                            <span class="wh-label">${t.warehouse}</span>
                        </div>
                    </div>
                    <div class="truncate font-extrabold uppercase text-[13px] mb-0.5">${t.company}</div>
                    <div class="flex justify-between items-center mt-1">
                        <span class="font-mono font-bold ${isOrderDup ? 'order-duplicate-alert' : ''}">#${t.order}</span>
                        <span class="disp-pill" style="color: ${t.status === 'Pending' ? 'var(--text-accent)' : 'var(--brand)'}">${t.status}</span>
                    </div>
                    <div class="mt-2 flex flex-col gap-1 border-t border-[var(--border)] pt-2">
                        <span class="issue-card-tag">${t.issue}</span>
                        <div class="flex justify-between items-center text-[10px] font-normal uppercase opacity-70">
                            <span class="text-[var(--text-dim)] truncate pr-2">Rep: ${t.submitRep}</span>
                            <span class="text-[var(--brand)] whitespace-nowrap font-black">${t.logisticsOwner}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const adminFilterValue = document.getElementById('admin-view-filter').value;
            
            const filtered = db.filter(t => {
                const matchSearch = (t.order + t.company + t.account + t.issue).toLowerCase().includes(search);
                const isFinished = t.status === 'Completed' || t.status === 'Sent Back';
                const modeFilter = currentMode === 'active' ? !isFinished : isFinished;
                let ownershipMatch = currentUser.isGodMode ? (adminFilterValue === "ALL" || t.logisticsOwner.toLowerCase().includes(adminFilterValue.toLowerCase())) : (t.logisticsOwner.toLowerCase() === currentUser.name.toLowerCase());
                return matchSearch && modeFilter && ownershipMatch;
            }).sort((a,b) => b.timestamp - a.timestamp);
            list.innerHTML = filtered.map(t => createCardHTML(t)).join('') || `<div class="p-10 text-center opacity-30 text-[10px] uppercase font-black tracking-widest">No matching records</div>`;
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            render();
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-address').innerText = t.address;
            document.getElementById('d-full-time').innerText = t.fullStamp;
            document.getElementById('d-account').innerText = `#${t.account}`;
            document.getElementById('d-wh-badge').innerText = t.warehouse;
            document.getElementById('d-route-badge').innerText = `RT: ${t.route}`;
            document.getElementById('d-driver-info').innerText = t.driverInfo;
            document.getElementById('d-submit-rep').innerText = t.submitRep;
            document.getElementById('d-logistics-owner').innerText = t.logisticsOwner;
            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
            document.getElementById('d-driver-input').value = t.driverNotes;
            document.getElementById('d-disposition').value = t.status;
            document.getElementById('d-system-guid').innerText = `Record ID: ${t.guid}`;
            updateSidebar(t.order);
        }

        function updateSidebar(orderNumber) {
            const rail = document.getElementById('account-rail');
            const content = document.getElementById('rail-content');
            const matches = db.filter(x => x.order === orderNumber && orderNumber !== 'N/A');
            if (matches.length > 1) {
                rail.classList.add('is-visible');
                content.innerHTML = matches.map(m => createCardHTML(m)).join('');
            } else { rail.classList.remove('is-visible'); }
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('d-order').innerText);
            const toast = document.getElementById('copy-toast');
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        // UPDATED: HANDLES BOTH WAREHOUSE AND REP TEMPLATES
        function openDraftModal(type) {
            const t = db.find(x => x.id === currentTicketId);
            if(!t) return;

            let emailAddr, subject, body;
            if (type === 'warehouse') {
                document.getElementById('m-header-label').innerText = "WAREHOUSE COMM DRAFT";
                emailAddr = `wh${t.warehouse.toLowerCase().replace(/\s+/g, '')}@wbmason.com`;
                subject = `LOGISTICS INQUIRY: Order #${t.order} | RT: ${t.route}`;
                body = `Hello Warehouse ${t.warehouse} Team,\n\nWe have a logistics inquiry regarding the following order:\n\nOrder: #${t.order}\nCustomer: ${t.company}\nIssue: ${t.issue}\n\nCan you please check the status or provide feedback regarding the following driver notes?\n\nDriver Info: ${t.driverInfo}\n\nThank you,\nLogistics Department`;
            } else {
                document.getElementById('m-header-label').innerText = "REP UPDATE DRAFT";
                emailAddr = `${t.submitRep.toLowerCase().replace(/\s+/g, '.')}@wbmason.com`;
                subject = `Logistics Update: Order #${t.order} (${t.company})`;
                body = `Hello,\n\nFollowing up on Order #${t.order} for ${t.company}.\n\nSTATUS: ${document.getElementById('d-disposition').value}\n\nWAREHOUSE NOTES:\n${document.getElementById('d-warehouse-input').value || "No warehouse notes recorded yet."}\n\nPlease let us know if you have any questions.\n\nBest,\nLogistics Department`;
            }

            document.getElementById('m-to-address').innerText = emailAddr;
            document.getElementById('m-subject').value = subject;
            document.getElementById('m-body').value = body;
            document.getElementById('email-modal-overlay').style.display = 'flex';
        }

        function closeDraftModal() { document.getElementById('email-modal-overlay').style.display = 'none'; }

        async function saveRecord() {
            const btn = document.getElementById('save-btn');
            const t = db.find(x => x.id === currentTicketId);
            if(!t || !t.guid) return;
            btn.innerText = "SAVING..."; btn.disabled = true;
            const payload = { recordId: t.guid, disposition: document.getElementById('d-disposition').value, warehouseNotes: document.getElementById('d-warehouse-input').value, driverNotes: document.getElementById('d-driver-input').value };
            try {
                const response = await fetch(SAVE_FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error();
                t.status = payload.disposition; t.warehouseNotes = payload.warehouseNotes; t.driverNotes = payload.driverNotes;
                btn.innerText = "SUCCESS";
                setTimeout(() => { btn.innerText = "Save Logistics Update"; btn.disabled = false; render(); }, 1500);
            } catch (e) { btn.innerText = "RETRY SAVE"; btn.disabled = false; }
        }

        async function sendViaFlow() {
            const btn = document.getElementById('confirm-send-btn');
            btn.innerText = "SENDING..."; btn.disabled = true;
            const t = db.find(x => x.id === currentTicketId);
            const formattedBody = document.getElementById('m-body').value.replace(/\n/g, "<br>");
            const payload = { recordId: t.guid, to: document.getElementById('m-to-address').innerText, subject: document.getElementById('m-subject').value, body: formattedBody };
            try {
                const response = await fetch(SEND_EMAIL_FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error();
                btn.innerText = "SENT SUCCESSFULLY";
                setTimeout(() => { closeDraftModal(); btn.innerText = "SEND UPDATE"; btn.disabled = false; }, 1500);
            } catch (e) { btn.innerText = "RETRY SEND"; btn.disabled = false; }
        }

        function setTheme(t) { document.body.setAttribute('data-theme', t); }
    </script>
</body>
</html>
