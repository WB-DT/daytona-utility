<!DOCTYPE html>
<html>
<head>
    <title>Logistics v35.0 - RESET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
</head>
<body class="p-8 bg-slate-100">
    <h1 class="text-2xl font-black mb-4">Logistics Log v35.0</h1>
    <div id="status" class="mb-4 text-sm font-bold text-blue-600 underline cursor-pointer" onclick="login()">[ Click to Sign In ]</div>
    
    <div id="output" class="space-y-2"></div>

    <script>
        // YOUR NEW WORKING URL
        const FLOW_URL = 'https://49b71dde44f8e78e89bc0440816209.07.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c8534a1735ca463d9386ac5ab1c89fcf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=X3TCIX7rLqKbo5iiDAOozZ-JchO3BuPK5H8DW4aruAA';

        const msalClient = new msal.PublicClientApplication({
            auth: { clientId: 'afe649b6-9c70-4b1a-8592-78588284c8ee', authority: 'https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401' }
        });

        async function login() {
            const res = await msalClient.loginPopup({ scopes: ["User.Read"] });
            msalClient.setActiveAccount(res.account);
            document.getElementById('status').innerText = "Logged in as: " + res.account.name;
            fetchData();
        }

        async function fetchData() {
            const response = await fetch(FLOW_URL, { method: 'POST', body: JSON.stringify({action:"Refresh"}) });
            const data = await response.json();
            const list = data.schema?.data || JSON.parse(data.body).value || data.value;
            
            document.getElementById('output').innerHTML = list.map(item => `
                <div class="p-4 bg-white border rounded shadow-sm">
                    <strong>${item.ID}</strong>: ${item.Company || item["Company Name and/or Delivery Location Name? "] || 'N/A'}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
