<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v105.21 | v104 Restore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root, [data-theme='midnight'] { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='forest'] { 
            --bg-deep: #1a1c1a; --bg-surface: #242924; --bg-card: #2d332d;      
            --brand: #a7c080; --text-main: #d3c6aa; --text-dim: #859289;     
            --text-accent: #dbbc7f; --border: #3a423a; --input-bg: #1a1c1a; --danger: #e67e80;
        }
        [data-theme='nordic'] { 
            --bg-deep: #2e3440; --bg-surface: #3b4252; --bg-card: #434c5e;      
            --brand: #88c0d0; --text-main: #eceff4; --text-dim: #d8dee9;     
            --text-accent: #ebcb8b; --border: #4c566a; --input-bg: #2e3440; --danger: #bf616a;
        }
        [data-theme='dusk'] { 
            --bg-deep: #232136; --bg-surface: #2a273f; --bg-card: #393552;      
            --brand: #ea9a97; --text-main: #e0def4; --text-dim: #908caa;     
            --text-accent: #c4a7e7; --border: #44415a; --input-bg: #232136; --danger: #eb6f92;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s ease; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside#main-gallery { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; }
        #account-rail { width: 380px; min-width: 380px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; display: none; }
        #account-rail.is-visible { display: block !important; }

        .record-card { margin: 6px 12px; border-radius: 8px; padding: 10px 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid var(--border); position: relative; }
        .record-card:hover { transform: translateX(4px); background: rgba(255,255,255,0.05); }
        .record-card.active-card { background: var(--brand) !important; border-left-color: var(--text-main) !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .record-card.active-card * { color: #0f172a !important; border-color: rgba(15, 23, 42, 0.3) !important; opacity: 1 !important; }

        .wh-label { font-size: 10px; font-weight: 900; color: var(--brand); text-transform: uppercase; border: 1px solid var(--brand); padding: 1px 5px; border-radius: 3px; }
        .route-pill { background: var(--brand); color: var(--bg-deep); font-weight: 900; padding: 0 8px; border-radius: 4px; font-size: 11px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
        .time-label-gallery { font-size: 11px; font-weight: 400; color: #ffffff; opacity: 0.95; }

        @keyframes duplicate-pulse {
            0% { color: inherit; text-shadow: none; }
            50% { color: var(--danger); text-shadow: 0 0 12px var(--danger); }
            100% { color: inherit; text-shadow: none; }
        }
        .order-duplicate-alert { animation: duplicate-pulse 1s infinite ease-in-out; font-weight: 900 !important; }

        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 1000; }
        .toast { background: var(--bg-surface); border: 1px solid var(--brand); color: var(--text-main); padding: 16px 24px; border-radius: 8px; border-left: 6px solid var(--brand); box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }

        .theme-dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    </style>
</head>
<body data-theme="midnight">

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-6">
            <div class="text-lg font-black uppercase tracking-tighter text-[var(--brand)]">LOGILINK v105.21</div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search..." class="w-80 bg-black/10 border border-[var(--border)] p-2 text-xs rounded text-white outline-none focus:border-[var(--brand)]">
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3 bg-black/10 p-2 rounded-full border border-[var(--border)]">
                <div onclick="setTheme('midnight')" class="theme-dot bg-[#2dd4bf]"></div>
                <div onclick="setTheme('nordic')" class="theme-dot bg-[#88c0d0]"></div>
                <div onclick="setTheme('forest')" class="theme-dot bg-[#a7c080]"></div>
                <div onclick="setTheme('dusk')" class="theme-dot bg-[#ea9a97]"></div>
            </div>
            <div id="sync-indicator"><i id="sync-icon" class="fa fa-circle text-[8px] text-[var(--brand)]"></i></div>
        </div>
    </header>

    <div class="app-container">
        <aside id="main-gallery">
            <div class="p-3 flex gap-2 border-b border-[var(--border)]">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all bg-[var(--brand)] text-[var(--bg-deep)]">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[11px] uppercase bg-slate-700/20 text-[var(--text-dim)] border border-[var(--border)]">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto flex-grow"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-20">
                <i class="fa fa-bridge text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select a Record</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto">
                <div class="max-w-4xl mx-auto p-8 space-y-8">
                    <div class="flex justify-between items-start border-b border-[var(--border)] pb-8">
                        <div class="flex-grow space-y-4">
                            <div class="flex items-baseline gap-4">
                                <h2 id="d-company" class="text-[var(--text-main)] uppercase tracking-tight text-2xl font-extrabold leading-none"></h2>
                                <span id="d-account" class="text-sm font-bold opacity-40 uppercase tracking-widest"></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span id="d-wh-badge" class="wh-label"></span>
                                <span id="d-route-badge" class="route-pill"></span>
                            </div>
                            <div class="text-[14px] text-[var(--text-dim)]">
                                Rep: <span id="d-rep-info" class="font-bold text-[var(--text-main)] uppercase"></span>
                            </div>
                        </div>
                        
                        <div class="flex flex-col items-end w-[300px] gap-3">
                            <p id="d-full-time" class="time-label-gallery mb-1 opacity-60"></p>
                            <p id="d-order" class="text-5xl font-black italic text-[var(--text-main)] leading-none"></p>
                            <select id="d-disposition" class="w-48 bg-[var(--bg-surface)] border border-[var(--brand)] text-[10px] font-black uppercase px-3 py-2 rounded text-[var(--brand)] outline-none">
                                <option value="Pending">Pending</option>
                                <option value="Working">Working</option>
                                <option value="Completed">Completed</option>
                                <option value="Sent Back">Sent Back</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-black/5 border-l-4 border-[var(--text-accent)] p-6 rounded-r-lg">
                        <label id="d-issue-label" class="text-[10px] font-black text-[var(--text-accent)] uppercase block mb-2 tracking-wider"></label>
                        <p id="d-description" class="font-medium text-[var(--text-main)] text-lg leading-relaxed"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-8">
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50 tracking-widest">Warehouse Notes</label>
                            <textarea id="d-warehouse-input" class="h-64 bg-black/5 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-white"></textarea>
                        </div>
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50 tracking-widest">Driver Notes</label>
                            <textarea id="d-driver-input" class="h-64 bg-black/5 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-white"></textarea>
                        </div>
                    </div>

                    <button id="save-btn" onclick="saveRecord()" class="w-full py-6 bg-[var(--brand)] text-[var(--bg-deep)] rounded font-black uppercase text-sm tracking-[0.2em] hover:brightness-110 shadow-xl transition-all">Save Logistics Update</button>
                </div>
            </div>
        </main>

        <aside id="account-rail">
            <h3 class="text-[12px] font-black uppercase tracking-widest text-[var(--danger)] mb-6 text-center">Duplicate History</h3>
            <div id="rail-content"></div>
        </aside>
    </div>

    <div id="toast-container"></div>

    <script>
        let db = []; let currentMode = 'active'; let currentTicketId = null;
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';
        const SAVE_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY';

        window.onload = () => fetchData();

        async function fetchData() {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-[var(--brand)]";
            try {
                const response = await fetch(HISTORY_URL, { method: 'POST' });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error("Sync Error"); }
            if(icon) icon.className = "fa fa-circle text-[8px] text-[var(--brand)]";
        }

        function ingest(data) {
            const counts = {};
            data.forEach(r => {
                const o = (r.cr714_salesordernumber || '').trim();
                if(o && o !== 'N/A') counts[o] = (counts[o] || 0) + 1;
            });

            db = data.map(r => ({
                id: r.cr714_logisticslog_2id,
                order: (r.cr714_salesordernumber || 'N/A').trim(),
                company: r.cr714_companyordeliveryname || 'Unknown', 
                account: r.cr714_accountnumber || 'N/A',
                rep: r.cr714_rep || 'CSR.Member',
                status: r['cr714_disposition@OData.Community.Display.V1.FormattedValue'] || 'Pending', 
                issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || 'General',
                warehouse: r['cr714_warehouse@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                route: r['cr714_route@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                description: r.cr714_description || '',
                warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                isDup: counts[(r.cr714_salesordernumber || '').trim()] > 1,
                time: r.createdon ? new Date(r.createdon).getTime() : 0,
                displayTime: r.createdon ? new Date(r.createdon).toLocaleDateString() : 'N/A'
            }));
            render();
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-[var(--bg-deep)] shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-slate-700/20 text-[var(--text-dim)] border border-[var(--border)]';
            document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-[var(--bg-deep)] shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-slate-700/20 text-[var(--text-dim)] border border-[var(--border)]';
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const matchSearch = (t.order + t.company + t.account).toLowerCase().includes(search);
                const isFinished = t.status === 'Completed' || t.status === 'Sent Back';
                return currentMode === 'active' ? (matchSearch && !isFinished) : (matchSearch && isFinished);
            }).sort((a,b) => b.time - a.time);
            
            list.innerHTML = filtered.map(t => `
                <div class="record-card ${currentTicketId === t.id ? 'active-card' : ''}" onclick="loadTicket('${t.id}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="time-label-gallery">${t.displayTime}</span>
                        <span class="wh-label">${t.warehouse}</span>
                    </div>
                    <div class="truncate font-extrabold uppercase text-[13px]">${t.company}</div>
                    <div class="flex justify-between items-center mt-2">
                        <span class="${t.isDup ? 'order-duplicate-alert' : ''} font-mono">#${t.order}</span>
                        <span class="text-[9px] uppercase font-bold" style="border: 1px solid currentColor; padding: 1px 4px; border-radius: 3px;">${t.status}</span>
                    </div>
                </div>
            `).join('');
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            render();
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = '#' + t.order;
            document.getElementById('d-account').innerText = '#' + t.account;
            document.getElementById('d-wh-badge').innerText = t.warehouse;
            document.getElementById('d-route-badge').innerText = `RT: ${t.route}`;
            document.getElementById('d-rep-info').innerText = t.rep;
            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
            document.getElementById('d-driver-input').value = t.driverNotes;
            document.getElementById('d-disposition').value = t.status;
            
            const rail = document.getElementById('account-rail');
            const matches = db.filter(x => x.order === t.order && t.order !== 'N/A');
            if (matches.length > 1) {
                rail.classList.add('is-visible');
                document.getElementById('rail-content').innerHTML = matches.map(m => `
                    <div class="bg-black/10 p-4 border-l-4 border-[var(--brand)] mb-3 cursor-pointer ${m.id === id ? 'opacity-30' : ''}" onclick="loadTicket('${m.id}')">
                        <div class="font-bold text-xs">${m.status}</div>
                        <div class="text-[10px] opacity-60">${m.displayTime}</div>
                    </div>
                `).join('');
            } else { rail.classList.remove('is-visible'); }
        }

        async function saveRecord() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "SAVING..."; btn.disabled = true;
            try {
                const response = await fetch(SAVE_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        recordId: currentTicketId,
                        disposition: document.getElementById('d-disposition').value,
                        warehouseNotes: document.getElementById('d-warehouse-input').value,
                        driverNotes: document.getElementById('d-driver-input').value
                    })
                });
                if(response.ok) { 
                    showToast("Record Updated Successfully");
                    fetchData(); 
                }
            } catch (e) { alert("Save Failed."); }
            finally { btn.innerText = "Save Logistics Update"; btn.disabled = false; }
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast show';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 3000);
        }

        function setTheme(t) { document.body.setAttribute('data-theme', t); }
    </script>
</body>
</html>
