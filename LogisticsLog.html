<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v105.03 | Logistics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root, [data-theme='midnight'] { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='forest'] { 
            --bg-deep: #1a1c1a; --bg-surface: #242924; --bg-card: #2d332d;      
            --brand: #a7c080; --text-main: #d3c6aa; --text-dim: #859289;     
            --text-accent: #dbbc7f; --border: #3a423a; --input-bg: #1a1c1a; --danger: #e67e80;
        }
        [data-theme='nordic'] { 
            --bg-deep: #2e3440; --bg-surface: #3b4252; --bg-card: #434c5e;      
            --brand: #88c0d0; --text-main: #eceff4; --text-dim: #d8dee9;     
            --text-accent: #ebcb8b; --border: #4c566a; --input-bg: #2e3440; --danger: #bf616a;
        }
        [data-theme='dusk'] { 
            --bg-deep: #232136; --bg-surface: #2a273f; --bg-card: #393552;      
            --brand: #ea9a97; --text-main: #e0def4; --text-dim: #908caa;     
            --text-accent: #c4a7e7; --border: #44415a; --input-bg: #232136; --danger: #eb6f92;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s ease; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside#main-gallery { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; }
        #account-rail { width: 380px; min-width: 380px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; display: none; }
        #account-rail.is-visible { display: block !important; }

        .record-card { margin: 6px 12px; border-radius: 8px; padding: 10px 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid var(--border); position: relative; }
        .record-card:hover { transform: translateX(4px); background: rgba(255,255,255,0.05); }
        .record-card.active-card { background: var(--brand) !important; border-left-color: var(--text-main) !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .record-card.active-card * { color: #0f172a !important; border-color: rgba(15, 23, 42, 0.3) !important; opacity: 1 !important; }

        /* Modal & UI Elements */
        #email-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 550px; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        .editable-body { width: 100%; background: rgba(0,0,0,0.1); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); padding: 12px; font-size: 13px; min-height: 200px; resize: none; outline: none; }
        .editable-body:focus { border-color: var(--brand); }

        /* Toast Notification */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 1000; pointer-events: none; }
        .toast { background: var(--bg-surface); border: 1px solid var(--brand); color: var(--text-main); padding: 16px 24px; border-radius: 8px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-left: 6px solid var(--brand); }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Utility */
        .wh-label { font-size: 10px; font-weight: 900; color: var(--brand); text-transform: uppercase; border: 1px solid var(--brand); padding: 1px 5px; border-radius: 3px; }
        .route-pill { background: var(--brand); color: var(--bg-deep); font-weight: 900; padding: 0 8px; border-radius: 4px; font-size: 11px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
        .disp-pill { font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; border: 1px solid currentColor; }
    </style>
</head>
<body data-theme="midnight">

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-[var(--brand)] rounded-lg flex items-center justify-center shadow-lg"><i class="fa fa-layer-group text-[var(--bg-deep)] text-xs"></i></div>
                <div class="text-lg font-black uppercase tracking-tighter text-[var(--brand)]">LOGILINK v105.03</div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search company, order, or account..." class="w-80 bg-black/10 border border-[var(--border)] p-2 text-xs rounded text-[var(--text-main)] outline-none focus:border-[var(--brand)]">
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3 bg-black/10 p-2 rounded-full border border-[var(--border)]">
                <div onclick="setTheme('midnight')" class="w-3 h-3 rounded-full bg-[#2dd4bf] cursor-pointer"></div>
                <div onclick="setTheme('nordic')" class="w-3 h-3 rounded-full bg-[#88c0d0] cursor-pointer"></div>
                <div onclick="setTheme('forest')" class="w-3 h-3 rounded-full bg-[#a7c080] cursor-pointer"></div>
                <div onclick="setTheme('dusk')" class="w-3 h-3 rounded-full bg-[#ea9a97] cursor-pointer"></div>
            </div>
            <div id="sync-indicator"><i id="sync-icon" class="fa fa-circle text-[8px] text-[var(--brand)]"></i></div>
        </div>
    </header>

    <div class="app-container">
        <aside id="main-gallery">
            <div class="p-3 flex gap-2 border-b border-[var(--border)]">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto flex-grow"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-20 text-[var(--text-dim)]">
                <i class="fa fa-bridge text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select a Record</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto">
                <div class="max-w-4xl mx-auto p-8 space-y-8">
                    <div class="flex justify-between items-start border-b border-[var(--border)] pb-8">
                        <div class="flex-grow space-y-4">
                            <div class="flex items-baseline gap-4">
                                <h2 id="d-company" class="text-[var(--text-main)] uppercase tracking-tight text-2xl font-extrabold leading-none"></h2>
                                <span id="d-account" class="text-sm font-bold opacity-40 uppercase tracking-widest"></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span id="d-wh-badge" class="wh-label"></span>
                                <span id="d-route-badge" class="route-pill"></span>
                            </div>
                            <p id="d-rep-info" class="text-xs font-bold uppercase tracking-widest text-[var(--brand)]"></p>
                        </div>
                        
                        <div class="flex flex-col items-end gap-3">
                            <p id="d-order" class="text-4xl font-black italic text-[var(--text-main)]"></p>
                            <select id="d-disposition" class="w-48 bg-black/20 border border-[var(--brand)] text-[10px] font-black uppercase px-3 py-2 rounded text-[var(--brand)] outline-none">
                                <option value="Pending">Pending</option>
                                <option value="Working">Working</option>
                                <option value="Completed">Completed</option>
                                <option value="Sent Back">Sent Back</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-8">
                        <div class="space-y-3">
                            <label class="text-[11px] font-black uppercase opacity-50">Warehouse Updates</label>
                            <textarea id="d-warehouse-input" class="w-full h-48 bg-black/5 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-[var(--text-main)]"></textarea>
                        </div>
                        <div class="space-y-3">
                            <label class="text-[11px] font-black uppercase opacity-50">Logistics Detail</label>
                            <div id="d-description" class="p-4 bg-black/10 rounded min-h-[192px] text-sm italic"></div>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="openDraftModal()" class="flex-1 py-5 border-2 border-[var(--brand)] text-[var(--brand)] rounded font-black uppercase text-sm hover:bg-[var(--brand)] hover:text-[var(--bg-deep)] transition-all">Send Email Update</button>
                        <button onclick="alert('Saved')" class="flex-1 py-5 bg-[var(--brand)] text-[var(--bg-deep)] rounded font-black uppercase text-sm shadow-xl">Save Changes</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="email-modal-overlay">
        <div class="modal-container">
            <div class="bg-black/20 p-5 flex justify-between items-center border-b border-[var(--border)]">
                <span class="font-black uppercase text-xs tracking-widest text-[var(--brand)]">Edit Email Update</span>
                <button onclick="closeDraftModal()" class="text-[var(--text-dim)]"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-[60px_1fr] items-center gap-2">
                    <span class="text-[10px] font-black uppercase opacity-40">To:</span>
                    <input id="m-to" class="bg-transparent border-none text-sm font-bold text-[var(--brand)] outline-none w-full">
                </div>
                <div class="grid grid-cols-[60px_1fr] items-center gap-2 border-t border-[var(--border)] pt-2">
                    <span class="text-[10px] font-black uppercase opacity-40">Subject:</span>
                    <input id="m-subject" class="bg-transparent border-none text-sm font-black italic text-[var(--text-main)] outline-none w-full">
                </div>
                <div class="pt-4 border-t border-[var(--border)]">
                    <textarea id="m-body" class="editable-body"></textarea>
                </div>
            </div>
            <div class="p-6 flex gap-4 bg-black/5">
                <button onclick="closeDraftModal()" class="flex-1 py-3 text-[10px] font-black uppercase opacity-50">Discard</button>
                <button id="flow-send-btn" onclick="sendViaFlow()" class="flex-[2] py-4 bg-[var(--brand)] text-[var(--bg-deep)] rounded font-black uppercase text-xs tracking-[0.2em] hover:brightness-110 transition-all">Trigger Flow Send</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        let db = []; let currentMode = 'active'; let currentTicketId = null;
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';
        const SEND_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5473f5a058f344eaaf1d5c2544baf437/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=qgC3_5VOBOQ3U_IfsvdIcOGyhUQC98oU2-wGbvmejvQ';

        window.onload = () => fetchData(HISTORY_URL);

        async function fetchData(url) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-[var(--brand)]";
            try {
                const response = await fetch(url, { method: 'POST' });
                const data = await response.json();
                db = data.value.map(r => ({
                    id: r.cr714_id || 'N/A',
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: r.cr714_companyordeliveryname || 'Unknown', 
                    rep: r.cr714_rep || 'Staff.Member', 
                    status: r['cr714_disposition@OData.Community.Display.V1.FormattedValue'] || 'Pending',
                    description: r.cr714_description || '',
                    warehouse: r['cr714_warehouse@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    route: r['cr714_route@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || ''
                }));
                render();
            } catch (e) { console.error("Sync Error:", e); }
            if(icon) icon.className = "fa fa-circle text-[8px] text-[var(--brand)]";
        }

        function setMode(m) {
            currentMode = m; render();
            document.getElementById('btn-active').classList.toggle('bg-[var(--brand)]', m === 'active');
            document.getElementById('btn-all').classList.toggle('bg-[var(--brand)]', m === 'all');
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => (t.order + t.company).toLowerCase().includes(search));
            
            list.innerHTML = filtered.map(t => `
                <div class="record-card ${currentTicketId === t.id ? 'active-card' : ''}" onclick="loadTicket('${t.id}')">
                    <div class="font-extrabold uppercase text-[12px] mb-1">${t.company}</div>
                    <div class="flex justify-between items-center">
                        <span class="font-mono font-bold text-[10px]">#${t.order}</span>
                        <span class="disp-pill text-[var(--brand)]">${t.status}</span>
                    </div>
                </div>
            `).join('');
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            render();
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-rep-info').innerText = `Rep: ${t.rep}`;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-wh-badge').innerText = t.warehouse;
            document.getElementById('d-route-badge').innerText = `RT: ${t.route}`;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
        }

        function openDraftModal() {
            const t = db.find(x => x.id === currentTicketId);
            const whNotes = document.getElementById('d-warehouse-input').value || "No update provided.";
            
            // Dynamic recipient: first.last@wbmason.com
            let email = t.rep.toLowerCase().replace(/\s+/g, '.');
            if(!email.includes('.')) email += ".user";
            
            document.getElementById('m-to').value = `${email}@wbmason.com`;
            document.getElementById('m-subject').value = `Update: Order #${t.order} | ${t.company}`;
            document.getElementById('m-body').value = `Hello ${t.rep},\n\nRegarding ${t.company} (Order #${t.order}):\n\n${whNotes}\n\nBest Regards,\nLogistics Team`;
            
            document.getElementById('email-modal-overlay').style.display = 'flex';
        }

        function closeDraftModal() { document.getElementById('email-modal-overlay').style.display = 'none'; }

        async function sendViaFlow() {
            const btn = document.getElementById('flow-send-btn');
            const originalText = btn.innerText;
            btn.innerText = "SENDING..."; btn.disabled = true;

            const payload = {
                to: document.getElementById('m-to').value,
                subject: document.getElementById('m-subject').value,
                body: document.getElementById('m-body').value
            };

            try {
                // Now using standard fetch because the Flow has a Response action (No 'no-cors' needed)
                const response = await fetch(SEND_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if(response.ok) {
                    showToast("Email Sent Successfully");
                    closeDraftModal();
                } else {
                    throw new Error("Email Not Sent");
                }
            } catch (e) {
                alert("Email Not Sent");
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa fa-circle-check text-[var(--brand)]"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        function setTheme(t) { document.body.setAttribute('data-theme', t); }
    </script>
</body>
</html>
