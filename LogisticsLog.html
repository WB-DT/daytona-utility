<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLog v105.22 | Logistics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>

    <style>
        :root, [data-theme='midnight'] { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='light'] { 
            --bg-deep: #f8fafc; --bg-surface: #ffffff; --bg-card: #f1f5f9;      
            --brand: #0d9488; --text-main: #0f172a; --text-dim: #475569;     
            --text-accent: #b45309; --border: #e2e8f0; --input-bg: #ffffff; --danger: #dc2626;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s ease; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside#main-gallery { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; position: relative; }
        #account-rail { width: 420px; min-width: 420px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 15px 0; display: none; }
        #account-rail.is-visible { display: flex !important; flex-direction: column; }

        .record-card { margin: 6px 12px; border-radius: 8px; padding: 10px 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid var(--border); position: relative; }
        .record-card:hover { transform: translateX(4px); background: rgba(0,0,0,0.03); }
        .record-card.active-card { background: var(--brand) !important; border-left-color: var(--text-main) !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .record-card.active-card * { color: #000000 !important; border-color: rgba(0, 0, 0, 0.2) !important; opacity: 1 !important; font-weight: 800; }

        .time-label-gallery { font-size: 9px; font-weight: 400; color: var(--text-main); opacity: 0.7; letter-spacing: 0.02em; }
        .wh-label { font-size: 10px; font-weight: 900; color: var(--brand); text-transform: uppercase; border: 1px solid var(--brand); padding: 1px 5px; border-radius: 3px; }
        .route-label { font-size: 10px; font-weight: 900; color: var(--text-accent); text-transform: uppercase; border: 1px solid var(--text-accent); padding: 1px 5px; border-radius: 3px; }
        .disp-pill { font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; border: 1px solid currentColor; }
        .issue-card-tag { font-size: 10px; font-weight: 700; color: var(--text-accent); text-transform: uppercase; letter-spacing: 0.5px; }

        .input-error-highlight { border-color: var(--danger) !important; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2) !important; animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

        .theme-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; }
        #email-modal-overlay, #coaching-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 550px; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2); }

        #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; pointer-events: none; }
        .toast { pointer-events: auto; min-width: 280px; padding: 16px 20px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-main); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); animation: toast-slide 0.3s ease-out; border-left: 4px solid var(--brand); }
        @keyframes toast-slide { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @keyframes duplicate-pulse { 0% { color: inherit; text-shadow: none; } 50% { color: var(--danger); text-shadow: 0 0 12px var(--danger); } 100% { color: inherit; text-shadow: none; } }
        .order-duplicate-alert { animation: duplicate-pulse 1s infinite ease-in-out; font-weight: 900 !important; }
        .id-badge-ghost { font-size: 7px; font-weight: 600; opacity: 0.25; text-transform: uppercase; }
        .system-debug-footer { font-family: 'JetBrains Mono', monospace; font-size: 8px; opacity: 0.2; position: absolute; bottom: 10px; right: 20px; text-transform: uppercase; pointer-events: none; letter-spacing: 1px; }
        
        .user-badge { font-size: 10px; font-weight: 900; padding: 4px 12px; border-radius: 20px; background: rgba(0,0,0,0.05); border: 1px solid var(--border); color: var(--text-dim); }
        .rep-view-selector { background: var(--bg-surface); border: 1px solid var(--border); color: var(--brand); font-weight: 900; font-size: 9px; outline: none; cursor: pointer; text-transform: uppercase; border-radius: 4px; padding: 2px 4px; margin-left: 5px; }
        .frog-mascot { font-size: 26px; color: var(--brand); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }

        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #475569; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--text-accent); }
        input:checked + .slider:before { transform: translateX(14px); }

        #login-container { position: fixed; inset: 0; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; z-index: 99999; }
        .login-card { background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border); text-align: center; max-width: 400px; width: 90%; }

        .outlook-editor { min-height: 250px; background: var(--bg-card); color: var(--text-main); padding: 1rem; border-radius: 0.5rem; outline: none; border: 1px solid var(--border); font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.5; overflow-y: auto; }
        .outlook-editor:focus { border-color: var(--brand); }
        [data-theme='midnight'] .outlook-editor, [data-theme='midnight'] .outlook-editor * { color: var(--text-main) !important; }

        /* Monthly Progress Bar Styling */
        .progress-container { width: 140px; height: 10px; background: rgba(0,0,0,0.1); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; position: relative; }
        .progress-fill { height: 100%; background: var(--brand); width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body data-theme="midnight">

    <div id="login-container" style="display: none;">
        <div class="login-card p-10 space-y-6">
            <i class="fa-solid fa-frog text-6xl text-[var(--brand)]"></i>
            <h1 class="text-2xl font-black uppercase tracking-tighter text-[var(--brand)]">LogiLog Secure Access</h1>
            <button onclick="login()" class="w-full py-4 bg-[var(--brand)] text-white rounded font-black uppercase text-sm tracking-[0.2em] hover:brightness-110 shadow-xl transition-all">Sign in with Microsoft</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-frog frog-mascot"></i>
                <div class="text-xl font-black uppercase tracking-tighter text-[var(--brand)]">LOGILOG <span class="text-[10px] opacity-40 ml-1">v105.22</span></div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search..." class="w-80 bg-black/5 border border-[var(--border)] p-2 text-xs rounded text-[var(--text-main)] outline-none focus:border-[var(--brand)]">
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-black/5 px-3 py-1.5 rounded-full border border-[var(--border)]">
                <span class="text-[8px] font-black uppercase opacity-50 tracking-widest">Admin Bypass</span>
                <label class="switch" style="transform: scale(0.8);">
                    <input type="checkbox" id="admin-bypass-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="flex flex-col items-center gap-1">
                <div class="progress-container"><div id="header-progress-fill" class="progress-fill"></div></div>
                <span id="header-progress-text" class="text-[8px] font-black uppercase tracking-widest text-[var(--brand)] whitespace-nowrap">Month Progress: 0 / 0</span>
            </div>

            <div id="user-display" class="user-badge flex items-center gap-2">
                <i class="fa fa-user-circle"></i>
                <span id="user-name-text" class="mr-1">User</span>
                <select id="rep-view-filter" class="rep-view-selector" onchange="render()">
                    <option value="ALL">ALL LOGISTICS</option>
                </select>
            </div>
            <div class="flex items-center gap-2 bg-black/5 p-1.5 rounded-full border border-[var(--border)]">
                <div onclick="setTheme('midnight')" class="theme-dot bg-[#0f172a] text-white" title="Midnight"><i class="fa fa-moon"></i></div>
                <div onclick="setTheme('light')" class="theme-dot bg-[#f8fafc] text-[#0f172a]" title="Light Mode"><i class="fa fa-sun"></i></div>
            </div>
            <div id="sync-indicator"><i id="sync-icon" class="fa fa-circle text-[8px] text-[var(--brand)]"></i></div>
        </div>
    </header>

    <div class="app-container" id="main-app-content">
        <aside id="main-gallery">
            <div class="p-3 flex gap-2 border-b border-[var(--border)]">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto flex-grow"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10 text-[var(--text-dim)]">
                <i class="fa-solid fa-frog text-9xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select a Record</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto">
                <div class="max-w-4xl mx-auto p-8 space-y-8">
                    <div class="flex justify-between items-start border-b border-[var(--border)] pb-8">
                        <div class="flex-grow space-y-4">
                            <div class="flex items-baseline gap-4">
                                <h2 id="d-company" class="text-[var(--text-main)] uppercase tracking-tight text-2xl font-extrabold leading-none"></h2>
                                <span id="d-account" class="text-sm font-bold opacity-40 uppercase tracking-widest"></span>
                            </div>
                            <div class="flex items-start gap-2 text-[13px] text-[var(--text-dim)] opacity-80">
                                <i class="fa fa-location-dot mt-1 text-[var(--brand)]"></i>
                                <span id="d-shipping-address" class="font-medium"></span>
                            </div>
                            <div class="flex items-center gap-3 pt-2">
                                <span id="d-wh-badge" class="wh-label"></span>
                                <span id="d-route-badge" class="route-label"></span>
                                <div class="flex items-center gap-2 text-[14px] text-[var(--text-dim)] border-l border-[var(--border)] pl-3 ml-1">
                                    <i class="fa fa-truck-steering text-[var(--text-accent)] text-xs"></i>
                                    <span id="d-driver-info" class="font-normal uppercase tracking-tight text-[var(--text-main)]"></span>
                                </div>
                            </div>
                            <div class="flex flex-col gap-1.5 pt-2 mt-2">
                                <div class="flex items-center gap-2 text-[12px]">
                                    <i class="fa fa-user-pen text-[var(--brand)] w-4 text-center"></i>
                                    <span class="font-black uppercase tracking-widest opacity-40 text-[10px]">Rep:</span>
                                    <span id="d-submit-rep" class="font-bold uppercase text-[var(--text-main)]"></span>
                                </div>
                                <div class="flex items-center gap-2 text-[12px]">
                                    <i class="fa fa-user-shield text-[var(--text-accent)] w-4 text-center"></i>
                                    <span class="font-black uppercase tracking-widest opacity-40 text-[10px]">Logistics:</span>
                                    <span id="d-logistics-owner" class="font-bold uppercase text-[var(--text-main)]"></span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex flex-col items-end w-[300px] gap-3">
                            <div onclick="copyToClipboard()" class="w-fit cursor-pointer group relative text-right">
                                <p id="d-full-time" class="time-label-detail mb-1 text-[var(--text-dim)] text-[11px]"></p>
                                <p id="d-order" class="text-4xl font-black italic text-[var(--text-main)] leading-none hover:text-[var(--brand)] transition-colors"></p>
                                <span id="copy-toast" class="absolute -top-7 right-0 text-[10px] bg-[var(--brand)] text-white px-2 py-1 rounded font-black opacity-0 transition-opacity uppercase">Copied</span>
                            </div>

                            <div class="flex items-center gap-3 bg-black/10 px-4 py-2 rounded-lg border border-[var(--border)] mt-1">
                                <span class="text-[10px] font-black uppercase tracking-widest text-[var(--text-accent)]">Coaching Opportunity</span>
                                <label class="switch">

                                <option value="">Select Status...</option>
                                <option value="Completed">Completed</option>
                                <option value="Follow-up">Follow-up</option>

                    </div>

        <aside id="account-rail">

    <script>

        const SAVE_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY';
        const AUTO_SAVE_DISPO_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/1cdc16c265da48648590c7f1b6107d22/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=LrOReLW2EG-VYn88_RgVr5TpTZr2IrU1FkTu-jXg9mE';
        const SAVE_COACHING_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/6afccf18907044be84f3e5e730791862/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PocwedtZlC03FH-FJhfj1_Cj_dVaYUmQMddL4XpvdMI';

        window.onload = () => { 
            setMode('active'); fetchData(HISTORY_URL); setupRepView(); 
            msalInstance.handleRedirectPromise().then(resp => {
                if (resp && resp.account) { applyIdentity(resp.account); } 
                else {
                    const accounts = msalInstance.getAllAccounts();
                    if(accounts.length > 0) { applyIdentity(accounts[0]); } 
                    else { document.getElementById('login-container').style.display = 'flex'; }
                }
            }).catch(e => { document.getElementById('login-container').style.display = 'flex'; });
        };

        function login() { msalInstance.loginPopup({ scopes: ["User.Read", "Mail.Send"] }).then(resp => { if(resp && resp.account) applyIdentity(resp.account); }); }

        async function applyIdentity(account) {
            document.getElementById('login-container').style.display = 'none';
            msalAccount = account; currentUser.name = account.name; currentUser.email = account.username;
            document.getElementById('user-name-text').innerText = account.name;
            try {
                const tokenResponse = await msalInstance.acquireTokenSilent({ scopes: ["User.Read"], account: msalAccount });
                const res = await fetch("https://graph.microsoft.com/v1.0/me", { headers: { "Authorization": `Bearer ${tokenResponse.accessToken}` } });
                currentUserProfileData = await res.json();
            } catch(e) { console.warn("Profile fetch fail", e); }
            const repSelector = document.getElementById('rep-view-filter');
            if (repSelector) {
                const options = Array.from(repSelector.options);
                const matchingOpt = options.find(opt => opt.value === account.name || opt.value.startsWith(account.name.split(' ')[0]));
                if (matchingOpt) { repSelector.value = matchingOpt.value; render(); }
            }
        }

        async function sendViaGraph() {
            const btn = document.getElementById('confirm-send-btn');
            const toField = document.getElementById('m-to-address').value;
            const subjectField = document.getElementById('m-subject').value;
            const bodyContent = document.getElementById('m-body').innerHTML;
            if(!toField) { showToast("Recipient required", "error"); return; }
            btn.innerText = "SENDING..."; btn.disabled = true;
            try {
                const tokenResponse = await msalInstance.acquireTokenSilent({ scopes: ["Mail.Send"], account: msalAccount })
                    .catch(async (error) => { return await msalInstance.acquireTokenPopup({ scopes: ["Mail.Send"] }); });
                const emailPayload = { message: { subject: subjectField, body: { contentType: "HTML", content: bodyContent }, toRecipients: [{ emailAddress: { address: toField } }] }, saveToSentItems: "true" };
                const response = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", { method: "POST", headers: { "Authorization": `Bearer ${tokenResponse.accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(emailPayload) });
                if (response.ok) { showToast("Email Sent Successfully"); setTimeout(() => { closeDraftModal(); btn.innerText = "Send Email"; btn.disabled = false; }, 1500); } else { throw new Error(); }
            } catch (e) { btn.innerText = "RETRY"; btn.disabled = false; showToast("Microsoft Graph error", "error"); }
        }

        function updateProgressBar() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            const repFilter = document.getElementById('rep-view-filter').value;
            
            const monthlyRecords = db.filter(t => {
                const recDate = new Date(t.timestamp);
                const isCurrentMonth = recDate.getMonth() === currentMonth && recDate.getFullYear() === currentYear;
                const matchesRep = (repFilter === "ALL" || t.logisticsOwner === repFilter);
                return isCurrentMonth && matchesRep;
            });

            const total = monthlyRecords.length;
            const handled = monthlyRecords.filter(t => ['Completed', 'Sent Back', 'Completed Escalated'].includes(t.status)).length;
            const percent = total > 0 ? (handled / total) * 100 : 0;
            
            document.getElementById('header-progress-fill').style.width = `${percent}%`;
            document.getElementById('header-progress-text').innerText = `Month Progress: ${handled} / ${total}`;
        }

        function handleRepFilterChange() { render(); }
        function showToast(msg, type = 'success') { const container = document.getElementById('toast-container'); const toast = document.createElement('div'); toast.className = `toast ${type === 'error' ? 'border-l-red-500' : 'border-l-teal-400'}`; toast.innerHTML = `<i class="fa ${type === 'error' ? 'fa-circle-exclamation text-red-500' : 'fa-circle-check text-teal-400'}"></i> <span>${msg}</span>`; container.appendChild(toast); setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 3000); }
        function setupRepView() { const selector = document.getElementById('rep-view-filter'); if(!selector) return; selector.innerHTML = '<option value="ALL">ALL LOGISTICS</option>'; Object.values(NAME_MAP).sort().forEach(name => { const opt = document.createElement('option'); opt.value = name; opt.innerText = name; selector.appendChild(opt); }); }
        async function fetchData(url) { const icon = document.getElementById('sync-icon'); if(icon) icon.className = "fa fa-sync fa-spin text-[var(--brand)]"; try { const response = await fetch(url, { method: 'POST' }); const data = await response.json(); if (data && data.value) ingest(data.value); } catch (e) { console.error("Sync Error:", e); } setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[8px] text-[var(--brand)]"; }, 1500); }

        function ingest(data) {
            db = data.map(r => {
                const dateObj = r.createdon ? new Date(r.createdon) : null;
                let rawOwner = r.cr714_logisticsowner || 'Unassigned';
                return {
                    id: r.cr714_id || 'N/A', guid: (r.cr714_logisticslog_2id || '').trim().replace(/[{}]/g, ''), order: (r.cr714_salesordernumber || 'N/A').trim(), 
                    company: r.cr714_companyordeliveryname || 'Unknown', account: r.cr714_accountnumber || 'N/A', shippingAddress: r.cr714_shippingaddress || 'Address Not Provided', 
                    submitRep: r.cr714_rep || 'CSR', logisticsOwner: NAME_MAP[rawOwner] || rawOwner, driverInfo: r.cr714_drivernamenumber || 'No Driver Data', 
                    status: r['cr714_disposition@OData.Community.Display.V1.FormattedValue'] || r.cr714_disposition || '', issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || r.cr714_issue || 'General', 
                    description: r.cr714_description || '', warehouse: r['cr714_warehouse@OData.Community.Display.V1.FormattedValue'] || r.cr714_warehouse || 'N/A', 
                    route: r['super_route@OData.Community.Display.V1.FormattedValue'] || r.cr714_route || 'N/A', warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '', 
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '', fullStamp: dateObj ? `${dateObj.toLocaleDateString()} | ${dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : 'N/A', 
                    timestamp: dateObj ? dateObj.getTime() : 0, isCoaching: r.cr714_coachingopportunity || false
                };
            });
            orderCounts = db.reduce((acc, t) => { if(t.order !== 'N/A') acc[t.order] = (acc[t.order] || 0) + 1; return acc; }, {});
            render();
        }

        function setMode(m) { currentMode = m; document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-white shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)]'; document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-white shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-black/5 text-[var(--text-dim)] border border-[var(--border)]'; render(); }
        function createCardHTML(t) { const isOrderDup = t.order !== 'N/A' && orderCounts[t.order] > 1; return `<div class="record-card ${currentTicketId === t.id ? 'active-card' : ''}" onclick="loadTicket('${t.id}')"><div class="flex justify-between items-center mb-1"><span class="id-badge-ghost">#${t.id}</span><div class="flex gap-2 items-center"><span class="time-label-gallery">${t.fullStamp}</span><span class="wh-label">${t.warehouse}</span></div></div><div class="truncate font-extrabold uppercase text-[13px] mb-0.5">${t.company}</div><div class="flex justify-between items-center mt-1"><span class="font-mono font-bold ${isOrderDup ? 'order-duplicate-alert' : ''}">#${t.order}</span><span class="disp-pill" style="color: ${t.status === 'Pending' ? 'var(--text-accent)' : 'var(--brand)'}">${t.status || 'Pending'}</span></div><div class="mt-2 flex flex-col gap-1 border-t border-[var(--border)] pt-2"><span class="issue-card-tag truncate pr-2">${t.issue}</span><div class="flex justify-between items-center text-[10px] font-normal uppercase opacity-70"><span>Rep: ${t.submitRep}</span><span class="text-[var(--brand)] font-black whitespace-nowrap">${t.logisticsOwner}</span></div></div></div>`; }
        
        function render() { 
            const list = document.getElementById('ticket-list'); 
            const search = document.getElementById('global-search').value.toLowerCase(); 
            const repFilterValue = document.getElementById('rep-view-filter').value; 
            const filtered = db.filter(t => { 
                const matchSearch = (t.order + t.company + t.account + t.issue).toLowerCase().includes(search); 
                const isFinished = t.status === 'Completed' || t.status === 'Sent Back' || t.status === 'Completed Escalated'; 
                const modeFilter = currentMode === 'active' ? !isFinished : isFinished; 
                const ownershipMatch = (repFilterValue === "ALL" || t.logisticsOwner === repFilterValue); 
                return matchSearch && modeFilter && ownershipMatch; 
            }).sort((a,b) => b.timestamp - a.timestamp); 
            list.innerHTML = filtered.map(t => createCardHTML(t)).join('') || `<div class="p-10 text-center opacity-30 text-[10px] uppercase font-black tracking-widest">No matching records</div>`; 
            updateProgressBar();
        }

        function loadTicket(id) {
            const dispoInput = document.getElementById('d-disposition');
            if (currentTicketId) {
                const currentT = db.find(x => x.id === currentTicketId);
                const isAdmin = document.getElementById('admin-bypass-toggle').checked;
                const isAssigned = currentT && currentT.logisticsOwner !== 'Unassigned';
                if (!isAdmin && isAssigned && !dispoInput.value) { showToast("Disposition required.", "error"); dispoInput.classList.add('input-error-highlight'); return; }
            }
            dispoInput.classList.remove('input-error-highlight'); currentTicketId = id;
            const t = db.find(x => x.id === id); if(!t) return; render();
            document.getElementById('empty-state').classList.add('hidden'); document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company; document.getElementById('d-order').innerText = t.order; document.getElementById('d-full-time').innerText = t.fullStamp; document.getElementById('d-account').innerText = `#${t.account}`; document.getElementById('d-shipping-address').innerText = t.shippingAddress; document.getElementById('d-wh-badge').innerText = t.warehouse; document.getElementById('d-route-badge').innerText = `RT: ${t.route}`; document.getElementById('d-driver-info').innerText = t.driverInfo; document.getElementById('d-submit-rep').innerText = t.submitRep; document.getElementById('d-logistics-owner').innerText = t.logisticsOwner; document.getElementById('d-issue-label').innerText = t.issue; document.getElementById('d-description').innerText = t.description; document.getElementById('d-warehouse-input').value = t.warehouseNotes; document.getElementById('d-driver-input').value = t.driverNotes; dispoInput.value = t.status; document.getElementById('d-coaching-toggle').checked = t.isCoaching; document.getElementById('d-system-guid').innerText = `Record ID: ${t.guid}`; updateSidebar(t.order);
        }

        function handleCoachingToggle() { const toggle = document.getElementById('d-coaching-toggle'); if (toggle.checked) { document.getElementById('coaching-feedback-input').value = ""; document.getElementById('coaching-modal-overlay').style.display = 'flex'; } else { saveCoachingFeedback(false); } }
        function closeCoachingModal() { document.getElementById('coaching-modal-overlay').style.display = 'none'; document.getElementById('d-coaching-toggle').checked = false; }
        async function saveCoachingFeedback(isTrue = true) { const t = db.find(x => x.id === currentTicketId); const notes = document.getElementById('coaching-feedback-input').value; const btn = document.getElementById('save-coaching-btn'); if(isTrue) { btn.innerText = "SAVING..."; btn.disabled = true; } try { const response = await fetch(SAVE_COACHING_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ recordId: t.guid, isCoaching: isTrue, coachingNotes: isTrue ? notes : "" }) }); if (!response.ok) throw new Error(); t.isCoaching = isTrue; showToast(isTrue ? "Coaching status saved" : "Coaching status removed"); document.getElementById('coaching-modal-overlay').style.display = 'none'; if(isTrue) { btn.innerText = "SAVE COACHING"; btn.disabled = false; } render(); } catch (e) { showToast("Save failed", "error"); if(isTrue) { btn.innerText = "SAVE COACHING"; btn.disabled = false; } } }
        async function autoSaveDisposition() { const t = db.find(x => x.id === currentTicketId); const input = document.getElementById('d-disposition'); const newDispo = input.value; if(newDispo) input.classList.remove('input-error-highlight'); t.status = newDispo; try { const response = await fetch(AUTO_SAVE_DISPO_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ recordId: t.guid, disposition: newDispo }) }); if (response.ok) { showToast(`Status updated: ${newDispo}`); render(); } } catch (e) { showToast("Auto-save failed.", "error"); } }

        async function saveRecord() {
            const btn = document.getElementById('save-btn'); const t = db.find(x => x.id === currentTicketId); const dispoVal = document.getElementById('d-disposition').value; const isAdmin = document.getElementById('admin-bypass-toggle').checked;
            if (!isAdmin && t.logisticsOwner !== 'Unassigned' && !dispoVal) { showToast("Select a Disposition.", "error"); document.getElementById('d-disposition').classList.add('input-error-highlight'); return; }
            btn.innerText = "SAVING..."; btn.disabled = true;
            const payload = { recordId: t.guid, disposition: dispoVal, warehouseNotes: document.getElementById('d-warehouse-input').value, driverNotes: document.getElementById('d-driver-input').value, isCoaching: t.isCoaching };
            try { const response = await fetch(SAVE_FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); if (!response.ok) throw new Error(); t.warehouseNotes = payload.warehouseNotes; t.driverNotes = payload.driverNotes; showToast("Saved successfully"); setTimeout(() => { btn.innerText = "Save Logistics Update"; btn.disabled = false; render(); }, 1500); } catch (e) { btn.innerText = "RETRY SAVE"; btn.disabled = false; showToast("Save error", "error"); }
        }

        function updateSidebar(orderNumber) { const rail = document.getElementById('account-rail'); const content = document.getElementById('rail-content'); const matches = db.filter(x => x.order === orderNumber && orderNumber !== 'N/A'); if (matches.length > 1) { rail.classList.add('is-visible'); content.innerHTML = matches.map(m => createCardHTML(m)).join(''); } else { rail.classList.remove('is-visible'); } }
        function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('d-order').innerText); const toast = document.getElementById('copy-toast'); toast.style.opacity = '1'; setTimeout(() => { toast.style.opacity = '0'; }, 2000); }
        
        function openDraftModal() { 
            const t = db.find(x => x.id === currentTicketId); 
            if(!t) return; 
            const repName = currentUser.name || "W.B. Mason Rep";
            const repEmail = currentUser.email || "";
            let repPhone = "(508) 436 - XXXX";
            if(currentUserProfileData?.businessPhones?.length > 0) { repPhone = `(508) 436 - ${currentUserProfileData.businessPhones[0]}`; }
            const signature = `<br><br><div style="font-family: 'Aptos', 'Segoe UI', Arial, sans-serif; font-size: 14px; line-height: 1.35;">Sincerely, <br><strong>${repName}</strong><br>W.B. MASON CO, INC.<br>${repPhone}<br>Fax: 386-217-1090<br>Email: ${repEmail} | Website: <a href="https://www.wbmason.com" target="_blank" style="color:#0b66c3; text-decoration:none;">WWW.WBMASON.COM</a></div>`;
            document.getElementById('m-to-address').value = `${t.submitRep.toLowerCase().replace(/\s+/g, '.')}@wbmason.com`; 
            document.getElementById('m-subject').value = `${t.order} / ${t.company} / ${t.route} / Logistics Update`; 
            document.getElementById('m-body').innerHTML = `Hello,<br><br>Status: ${t.status}<br>Account Name: #${t.order}<br>Company: ${t.company}<br>Route: ${t.route}<br>Issue: ${t.issue}<br><br>[LOGISTICS NOTES HERE]${signature}`; 
            document.getElementById('email-modal-overlay').style.display = 'flex'; 
        }

        function openWarehouseEmail() { 
            const t = db.find(x => x.id === currentTicketId); 
            if(!t) return; 
            const repName = currentUser.name || "W.B. Mason Rep";
            let repPhone = "(508) 436 - XXXX";
            if(currentUserProfileData?.businessPhones?.length > 0) { repPhone = `(508) 436 - ${currentUserProfileData.businessPhones[0]}`; }
            const signature = `<br><br><div style="font-family: 'Aptos', 'Segoe UI', Arial, sans-serif; font-size: 14px; line-height: 1.35;">Thank you,<br><strong>${repName}</strong><br>Logistics Department<br>${repPhone}</div>`;
            document.getElementById('m-to-address').value = ""; 
            document.getElementById('m-subject').value = `${t.company} / ${t.order} / ${t.warehouse} / ${t.issue} / ${t.route}`; 
            document.getElementById('m-body').innerHTML = `
                Hello,<br><br>
                ${t.issue}<br><br>
                ${t.description}<br><br>
                ${t.order}<br>
                ${t.account} - ${t.company}<br>
                ${t.shippingAddress}<br><br>
                ${t.route} - ${t.warehouse}<br><br>
                ${signature}
            `.trim(); 
            document.getElementById('email-modal-overlay').style.display = 'flex'; 
        }

        function closeDraftModal() { document.getElementById('email-modal-overlay').style.display = 'none'; }
        function setTheme(t) { document.body.setAttribute('data-theme', t); }
    </script>
</body>
