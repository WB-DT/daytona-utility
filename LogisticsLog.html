<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v87.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='slate'] { --bg-deep: #020617; --bg-surface: #0f172a; --bg-card: #1e293b; --brand: #38bdf8; --text-accent: #7dd3fc; --border: #334155; --input-bg: #020617; }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside#main-gallery { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; }
        
        #account-rail { width: 360px; min-width: 360px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; display: none; }
        #account-rail.is-visible { display: block !important; }

        .record-card { margin: 10px 12px; border-radius: 8px; padding: 16px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: 0.2s; }
        .record-card.active { background: rgba(255,255,255,0.08); border-left-color: #fff; }

        .wh-label { font-size: 10px; font-weight: 900; color: #38bdf8; text-transform: uppercase; border: 1px solid rgba(56, 189, 248, 0.4); padding: 1px 5px; border-radius: 3px; }
        .route-pill { background: var(--brand); color: var(--bg-deep); font-weight: 900; padding: 0 8px; border-radius: 4px; font-size: 11px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
        
        /* DETAIL REFINEMENTS */
        #d-company { font-size: 20px; font-weight: 800; } /* Reduced from 24px */
        #d-description { font-size: 14px; line-height: 1.5; color: #cbd5e1; } /* Reduced from 16px */
        .driver-box { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; padding: 12px; }

        .sidebar-item { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .active-selection { border-color: white !important; background: rgba(255,255,255,0.1) !important; }
        
        .is-duplicate-text { color: var(--danger) !important; animation: textPulse 1s infinite; }
        @keyframes textPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body data-theme="slate">

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-teal-600 rounded-lg flex items-center justify-center"><i class="fa fa-truck-ramp-box text-white text-xs"></i></div>
                <div class="text-lg font-black uppercase tracking-tighter" style="color:var(--brand)">LOGILINK</div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search active tasks..." class="w-72 bg-black/20 border border-white/10 p-2 text-xs rounded text-white outline-none">
        </div>
        <div id="sync-indicator"><i id="sync-icon" class="fa fa-circle text-[8px] text-teal-400"></i></div>
    </header>

    <div class="app-container">
        <aside id="main-gallery">
            <div class="p-3 flex gap-2 border-b border-black/10">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[11px] uppercase bg-teal-600 text-slate-900">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[11px] uppercase bg-slate-700/50 text-white opacity-50">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto flex-grow"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10">
                <i class="fa fa-layer-group text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select a Record</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto">
                <div class="max-w-4xl mx-auto p-8 space-y-6">
                    <div class="flex justify-between items-start border-b border-white/10 pb-6">
                        <div class="flex-grow">
                            <div class="flex items-center gap-3 mb-2">
                                <span id="d-status" class="status-pill text-[10px] font-black uppercase border border-brand px-2 py-0.5 rounded text-brand"></span>
                                <span id="d-date" class="text-[10px] opacity-40 font-mono italic"></span>
                            </div>
                            <h2 id="d-company" class="text-white uppercase tracking-tight"></h2>
                            
                            <div class="flex flex-wrap gap-3 mt-3 items-center">
                                <span id="d-account" class="bg-black/40 px-3 py-1 rounded text-[11px] border border-white/5 font-bold"></span>
                                <span id="d-rep" class="text-[11px] font-bold px-2 py-1 bg-amber-400/10 text-amber-400 rounded"></span>
                                <div class="h-4 w-px bg-white/10 mx-1"></div>
                                <span id="d-wh-badge" class="wh-label"></span>
                                <span id="d-route-badge" class="route-pill"></span>
                            </div>
                        </div>

                        <div class="text-right">
                            <div onclick="copyToClipboard()" class="cursor-pointer bg-black/20 p-4 rounded-lg border border-white/5 hover:border-brand/30 transition-all min-w-[180px] relative">
                                <p class="text-[9px] font-black opacity-40 mb-1 uppercase tracking-widest">Order Number</p>
                                <p id="d-order" class="text-3xl font-black italic order-display leading-none"></p>
                                <span id="copy-toast" class="absolute -top-8 right-0 text-[10px] bg-brand text-black px-2 py-1 rounded font-black opacity-0 transition-opacity">COPIED</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="driver-box flex items-center gap-4">
                            <i class="fa fa-user-steering text-brand/50"></i>
                            <div>
                                <p class="text-[9px] font-black opacity-40 uppercase">Driver Name</p>
                                <p id="d-driver-name" class="text-sm font-bold text-white uppercase"></p>
                            </div>
                        </div>
                        <div class="driver-box flex items-center gap-4">
                            <i class="fa fa-phone-volume text-brand/50"></i>
                            <div>
                                <p class="text-[9px] font-black opacity-40 uppercase">Driver Phone</p>
                                <p id="d-driver-phone" class="text-sm font-bold text-white"></p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-black/20 border-l-4 border-[var(--text-accent)] p-5 rounded-r-lg">
                        <label id="d-issue-label" class="text-[10px] font-black text-accent uppercase block mb-1 tracking-wider"></label>
                        <p id="d-description" class="font-medium"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="flex flex-col gap-2"><label class="text-[11px] font-black uppercase opacity-40">Warehouse Updates</label><textarea id="d-warehouse-input" class="h-40 bg-black/20 border border-white/10 p-4 rounded text-sm outline-none"></textarea></div>
                        <div class="flex flex-col gap-2"><label class="text-[11px] font-black uppercase opacity-40">Driver Feedback</label><textarea id="d-driver-input" class="h-40 bg-black/20 border border-white/10 p-4 rounded text-sm outline-none"></textarea></div>
                    </div>
                    
                    <button class="w-full py-4 bg-teal-600 text-slate-900 rounded font-black uppercase text-sm tracking-widest hover:brightness-110">Save Logistics Update</button>
                </div>
            </div>
        </main>

        <aside id="account-rail">
            <div id="dup-header" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/40 rounded flex items-center gap-3">
                <i class="fa fa-triangle-exclamation text-red-500"></i>
                <span class="text-[10px] font-black uppercase text-red-500 tracking-tighter">Duplicate Sales Order Detected</span>
            </div>
            <h3 id="rail-title" class="text-[12px] font-black uppercase tracking-widest text-brand mb-4 border-b border-white/10 pb-2">Account Intelligence</h3>
            <div id="rail-content" class="space-y-3"></div>
        </aside>
    </div>

    <script>
        let db = []; let currentMode = 'active'; let currentTicketId = null;

        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        window.onload = () => { fetchData(HISTORY_URL, "FullHistory"); setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000); };

        async function fetchData(url, actionType) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-teal-400";
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType }) });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error(e); }
            setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[8px] text-teal-400"; }, 2000);
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id || 'N/A';
                const item = {
                    id: id,
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: r.cr714_companyordeliveryname || 'Unknown', 
                    account: r.cr714_accountnumber || 'N/A',
                    rep: r.cr714_rep || 'CSR',
                    status: (r.cr714_disposition || 'Pending'), 
                    issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || r.cr714_issue || 'General',
                    description: r.cr714_description || '',
                    warehouse: r['cr714_warehouse@OData.Community.Display.V1.FormattedValue'] || r.cr714_warehouse || 'N/A',
                    route: r['cr714_route@OData.Community.Display.V1.FormattedValue'] || r.cr714_route || 'N/A',
                    driverName: r.cr714_drivername || 'No Name Provided',
                    driverPhone: r.cr714_driverphonenumber || 'No Number',
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    timestamp: r.createdon ? new Date(r.createdon).getTime() : 0
                };
                const idx = db.findIndex(x => x.id === id);
                if (idx === -1) db.push(item); else db[idx] = {...db[idx], ...item};
            });
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const matchSearch = (t.order + t.company + t.account + t.rep).toLowerCase().includes(search);
                const isCompleted = t.status.includes('Completed') || t.status === 'Sent Back';
                return currentMode === 'active' ? (matchSearch && !isCompleted) : (matchSearch && isCompleted);
            }).sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            filtered.forEach(t => {
                const isDup = db.filter(x => x.order === t.order && t.order !== 'N/A').length > 1;
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <div class="card-company-name truncate max-w-[200px] text-slate-300 font-bold">${t.company}</div>
                        <div class="flex items-center gap-1">
                             <span class="wh-label">${t.warehouse}</span>
                             <span class="route-pill">${t.route}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="card-order-num ${isDup ? 'is-duplicate-text' : ''}">${t.order}</span>
                        <span class="text-[9px] px-1 bg-white/5 border border-white/10 rounded uppercase">${t.status}</span>
                    </div>
                    <div class="text-[10px] text-accent font-bold uppercase mt-1 opacity-80">REP: ${t.rep}</div>
                    <span class="text-[9px] font-mono opacity-10 mt-1 block">${t.id}</span>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');

            const salesOrderDups = db.filter(x => x.order === t.order && t.order !== 'N/A');
            const accountRequests = db.filter(x => x.account === t.account && !x.status.includes('Completed'));

            document.getElementById('d-order').className = `text-3xl font-black italic order-display leading-none ${salesOrderDups.length > 1 ? 'is-duplicate-text' : ''}`;
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-account').innerText = `ACCT: ${t.account}`;
            document.getElementById('d-rep').innerText = `REP: ${t.rep}`;
            document.getElementById('d-date').innerText = t.date;
            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-wh-badge').innerText = t.warehouse;
            document.getElementById('d-route-badge').innerText = t.route;
            document.getElementById('d-driver-name').innerText = t.driverName;
            document.getElementById('d-driver-phone').innerText = t.driverPhone;
            document.getElementById('d-status').innerText = t.status;
            
            const rail = document.getElementById('account-rail');
            rail.classList.add('is-visible');
            document.getElementById('dup-header').classList.toggle('hidden', salesOrderDups.length <= 1);
            document.getElementById('rail-title').innerText = `PENDING FOR: ${t.account}`;
            
            document.getElementById('rail-content').innerHTML = accountRequests.map(r => {
                const isCurrent = r.id === t.id;
                const isDuo = r.order === t.order && salesOrderDups.length > 1;
                return `
                    <div onclick="loadTicket('${r.id}')" class="sidebar-item ${isCurrent ? 'active-selection' : ''}">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-mono text-[13px] ${isDuo ? 'text-red-500 font-black' : 'text-brand'}">#${r.order}</span>
                            <span class="text-[10px] bg-white/10 px-2 py-0.5 rounded font-black">${r.route}</span>
                        </div>
                        <div class="text-[10px] text-dim uppercase">Rep: ${r.rep}</div>
                        <div class="text-[11px] text-accent uppercase font-bold mt-1">${r.issue}</div>
                    </div>
                `;
            }).join('');
            
            render();
        }

        function copyToClipboard() {
            const orderNum = document.getElementById('d-order').innerText;
            navigator.clipboard.writeText(orderNum);
            const toast = document.getElementById('copy-toast');
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        function setMode(m) { currentMode = m; render(); }
    </script>
</body>
</html>
