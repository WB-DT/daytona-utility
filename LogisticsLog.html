    <style>
        /* CORE */
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* GRID LAYOUT */
        .app-grid { 
            display: grid; 
            grid-template-columns: 260px 1fr 420px; 
            height: 100%; 
            transition: all 0.3s ease; 
        }
        
        /* SCROLLBARS */
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }

        /* CARDS & ANIMATION */
        .ticket-card { transition: transform 0.1s, background-color 0.1s; border-left: 3px solid transparent; }
        .ticket-card:hover { transform: translateX(2px); }
        .ticket-card.active { border-left-color: #3b82f6; background-color: #eff6ff; }
        .dark .ticket-card.active { background-color: #1e293b; border-left-color: #60a5fa; }
        
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        /* DROP ZONE OVERLAY */
        #drop-zone { pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 9999; backdrop-filter: blur(4px); }
        #drop-zone.active { opacity: 1; pointer-events: all; }

        /* TABS */
        .nav-item { position: relative; overflow: hidden; }
        .nav-item.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: #3b82f6; }
        
        /* LIVE INDICATOR */
        .live-dot { height: 8px; width: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>

    <script>
        // --- CONFIG ---
        const FLOW_URL = "https://49b71dde44f8e78e89bc0440816209.07.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c8534a1735ca463d9386ac5ab1c89fcf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=X3TCIX7rLqKbo5iiDAOozZ-JchO3BuPK5H8DW4BuPK5H8DW4aruAA";
        const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: window.location.href }, cache: { cacheLocation: "localStorage" } };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        
        // STATE
        let db = [];
        let filteredDB = [];
        let ownersList = new Set();
        let currentUserEmail = "";
        let currentTicketId = null;
        let limit = 50;
        let currentMode = 'today'; 
        let currentStatus = 'all';
        let viewType = 'list';
        let dateFilter = null; 

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            // Theme check
            if(window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
            
            // Date Picker Init
            dateFilter = flatpickr("#date-picker", {
                mode: "range",
                dateFormat: "Y-m-d",
                onChange: (dates) => { window.render(); }
            });
        });

        // --- AUTH ---
        async function login() {
            try { const r = await msalInstance.loginPopup({ scopes: ["User.Read"] }); init(r.account.name, r.account.username); } 
            catch (e) { document.getElementById('error-display').innerText = e.message; document.getElementById('error-display').classList.remove('hidden'); }
        }
        function bypassAuth() { init("Offline Manager", "manager@wbmason.com"); }
        function init(name, email) {
            currentUserEmail = email;
            document.getElementById('user-name').innerText = name;
            document.getElementById('user-initial').innerText = name.charAt(0);
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('hidden');
            // Try to load live data automatically on login
            fetchLiveData();
        }

        // --- LIVE DATA FETCH ---
        async function fetchLiveData() {
            try {
                Toastify({ text: "⚡ Fetching Live Data...", duration: 2000, style: { background: "#3b82f6" } }).showToast();
                
                const response = await fetch(FLOW_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: "Refresh", userEmail: currentUserEmail })
                });

                if(response.ok) {
                    const json = await response.json();
                    if(json.data && Array.isArray(json.data)) {
                        ingestData(json.data, 'json');
                        Toastify({ text: "✅ Live Data Synced", duration: 3000, style: { background: "#10b981" } }).showToast();
                        document.getElementById('live-indicator').classList.remove('hidden');
                    }
                } else {
                    throw new Error("Flow Error " + response.status);
                }
            } catch(e) {
                console.error(e);
                Toastify({ text: "⚠️ Live Sync Failed (Using Offline)", duration: 3000, style: { background: "#f59e0b" } }).showToast();
            }
        }

        // --- FILE HANDLING ---
        function handleFile(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const wb = XLSX.read(e.target.result, {type:'binary'});
                
                // 1. Process Owners
                if(wb.SheetNames.length > 1) {
                    const s2 = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]], {defval:""});
                    s2.forEach(r => { if(r['Logistics Owners']) ownersList.add(r['Logistics Owners']); });
                }

                // 2. Process Main Data
                const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
                ingestData(raw, 'excel');
            };
            reader.readAsBinaryString(file);
        }

        // --- CORE DATA INGESTION ---
        function ingestData(rawData, source) {
            // Merge new data
            const newData = rawData.map(r => ({
                id: val(r, ['id','ticket']),
                date: safeDate(val(r, ['starttime','start_time','date'])),
                cust: val(r, ['company','company_name','name']),
                acct: val(r, ['accountnumber','account_number','account','acct']), // Fixed Mapping
                route: val(r, ['route']),
                whs: val(r, ['warehouse']),
                driverRaw: val(r, ['driver','driver_name']),
                issue: val(r, ['issue']),
                desc: val(r, ['description']),
                owner: val(r, ['owner','logistics_owner']),
                notes: val(r, ['receivedtext','driver_notes']),
                lNotes: val(r, ['logisticsnotes','logistics_notes']),
                email: val(r, ['email']),
                status: val(r, ['dispo','disposition','status']) || 'Pending'
            }));

            db = newData; // Replace DB or Merge (Replace for simplicity in V22)
            
            // Populate Filters
            updateFilters();
            
            // Set Time
            document.getElementById('last-sync').innerText = new Date().toLocaleTimeString();
            
            if(source === 'excel') {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
            }
            render();
        }

        // --- UTILS ---
        function val(obj, keys) {
            if(!obj) return "";
            const map = Object.keys(obj).reduce((a,k)=>{ a[k.toLowerCase().replace(/[^a-z0-9]/g,'')]=k; return a; },{});
            for(let k of keys) { 
                let clean = k.toLowerCase().replace(/[^a-z0-9]/g,''); 
                if(map[clean]) return obj[map[clean]]; 
            }
            return "";
        }
        function safeDate(v) {
            if (!v) return "";
            if (typeof v === 'number') { const d = new Date(Math.round((v - 25569)*86400*1000)); return d.toISOString().split('T')[0]; }
            return String(v).substring(0, 10);
        }

        function updateFilters() {
            // Owners
            db.forEach(x => { if(x.owner) ownersList.add(x.owner); });
            const ownerSel = document.getElementById('filter-owner');
            const formOwner = document.getElementById('d-owner');
            const ownerOpts = Array.from(ownersList).sort().map(o => `<option value="${o}">${o}</option>`).join('');
            
            // Append Only New
            if(ownerSel.options.length < 3) {
                ownerSel.innerHTML += ownerOpts;
                formOwner.innerHTML = `<option value="">Unassigned</option>` + ownerOpts;
            }

            // Routes - Smart Sort (Numbers then Text)
            const routes = [...new Set(db.map(x=>x.route).filter(x=>x))];
            routes.sort((a, b) => {
                const aNum = parseInt(a);
                const bNum = parseInt(b);
                if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
                return String(a).localeCompare(String(b));
            });
            
            const routeSel = document.getElementById('filter-route');
            routeSel.innerHTML = '<option value="all">All Routes</option>';
            routes.forEach(r => { routeSel.innerHTML += `<option value="${r}">${r}</option>`; });
        }

        // --- DRAG & DROP ---
        function dragOverHandler(ev) { ev.preventDefault(); document.getElementById('drop-zone').classList.add('active'); }
        function dragLeaveHandler(ev) { ev.preventDefault(); document.getElementById('drop-zone').classList.remove('active'); }
        function dropHandler(ev) {
            ev.preventDefault();
            document.getElementById('drop-zone').classList.remove('active');
            if (ev.dataTransfer.items && ev.dataTransfer.items[0].kind === 'file') {
                const file = ev.dataTransfer.items[0].getAsFile();
                handleFile({files: [file]});
                Toastify({ text: "🔄 File Data Swapped", duration: 3000, style: { background: "#3b82f6" } }).showToast();
            }
        }

        // --- RENDER LOGIC ---
        function setFilterMode(mode) {
            currentMode = mode;
            document.getElementById('nav-today').className = mode === 'today' ? "w-full text-left px-3 py-2 rounded-lg text-xs font-bold text-white bg-blue-600 shadow-lg shadow-blue-900/20 flex items-center justify-between" : "w-full text-left px-3 py-2 rounded-lg text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center justify-between group";
            document.getElementById('nav-all').className = mode === 'all' ? "w-full text-left px-3 py-2 rounded-lg text-xs font-bold text-white bg-blue-600 shadow-lg shadow-blue-900/20 flex items-center justify-between" : "w-full text-left px-3 py-2 rounded-lg text-xs font-bold text-slate-300 hover:bg-slate-800 hover:text-white transition flex items-center justify-between group";
            render();
        }

        function setStatusFilter(status) {
            currentStatus = status;
            document.querySelectorAll('.nav-item').forEach(e => {
                if(e.innerText === (status === 'all' ? 'All' : status)) e.classList.add('active', 'text-blue-600', 'border-b-2', 'border-blue-600');
                else e.classList.remove('active', 'text-blue-600', 'border-b-2', 'border-blue-600');
            });
            render();
        }

        function setView(v) { viewType = v; render(); }
        function loadMore() { limit += 50; renderView(); }

        function render() {
            limit = 50;
            const search = document.getElementById('search-input').value.toLowerCase();
            const route = document.getElementById('filter-route').value;
            const owner = document.getElementById('filter-owner').value;
            const dates = dateFilter.selectedDates;
            
            // Logic for Today
            // Timezone offset correction for "Today"
            const now = new Date();
            const todayStr = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];

            filteredDB = db.filter(t => {
                if(currentMode === 'today' && t.date !== todayStr) return false;
                
                if(currentStatus !== 'all' && t.status !== currentStatus) return false;
                
                if(owner === 'me' && (!t.owner || !t.owner.toLowerCase().includes(currentUserEmail.split('@')[0]))) return false;
                else if(owner !== 'all' && owner !== 'me' && t.owner !== owner) return false;

                if(route !== 'all' && t.route != route) return false; 
                
                if(dates.length > 0) {
                    const d = new Date(t.date);
                    if(d < dates[0] || d > (dates[1] || dates[0])) return false;
                }

                if(search && !(t.cust+t.id+t.issue+t.acct).toLowerCase().includes(search)) return false;
                
                return true;
            });

            // Update Badges
            document.getElementById('badge-today').innerText = db.filter(x => x.date === todayStr).length;
            document.getElementById('badge-all').innerText = db.length;

            renderView();
        }

        function renderView() {
            const container = document.getElementById('list-container');
            container.innerHTML = "";
            const subset = filteredDB.slice(0, limit);

            if(viewType === 'list') {
                subset.forEach(t => {
                    const el = document.createElement('div');
                    el.className = `ticket-card p-4 border-b border-slate-100 dark:border-slate-800 ${t.id === currentTicketId ? 'active' : ''}`;
                    el.onclick = () => loadTicket(t.id);
                    
                    const badgeClass = t.status === 'Completed' ? 'bg-green-100 text-green-700' : (t.status === 'Escalated' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700');

                    el.innerHTML = `
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-bold text-slate-800 dark:text-white text-xs">#${t.id}</span>
                            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${badgeClass}">${t.status}</span>
                        </div>
                        <div class="font-bold text-sm text-slate-700 dark:text-slate-300 truncate mb-1" title="${t.cust}">${t.cust}</div>
                        <div class="flex justify-between items-center text-[10px] text-slate-400">
                            <span class="truncate max-w-[120px]">${t.issue}</span>
                            <span>${t.date ? t.date.substring(5) : ''}</span>
                        </div>
                    `;
                    container.appendChild(el);
                });
            } else {
                // GRID VIEW
                let html = `<table class="w-full text-xs text-left text-slate-500 dark:text-slate-400">
                    <thead class="text-[10px] text-slate-700 uppercase bg-slate-50 dark:bg-slate-800 dark:text-slate-200 sticky top-0">
                        <tr><th class="px-4 py-3">ID</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Customer</th><th class="px-4 py-3">Route</th></tr>
                    </thead><tbody>`;
                subset.forEach(t => {
                    html += `<tr class="bg-white border-b dark:bg-slate-900 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer ${t.id === currentTicketId ? 'bg-blue-50 dark:bg-blue-900/20' : ''}" onclick="window.loadTicket('${t.id}')">
                        <td class="px-4 py-2 font-bold">#${t.id}</td>
                        <td class="px-4 py-2">${t.status}</td>
                        <td class="px-4 py-2 truncate max-w-[150px]">${t.cust}</td>
                        <td class="px-4 py-2">${t.route}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            }

            // Load More Btn
            const btn = document.createElement('div');
            if(filteredDB.length > limit) {
                btn.innerHTML = `<button onclick="window.loadMore()" class="w-full py-2 text-xs font-bold text-blue-500 hover:bg-slate-50 transition">Load More (${filteredDB.length - limit} remaining)</button>`;
                container.appendChild(btn);
            }
        }

        // --- DETAILS ---
        function loadTicket(id) {
            currentTicketId = id;
            renderView(); // Update active state
            
            const t = db.find(x => x.id === id);
            if(!t) return;

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('ticket-detail').classList.remove('hidden');

            const set = (i,v) => document.getElementById(i).innerText = v || '--';
            set('d-id', '#'+t.id);
            set('d-customer', t.cust);
            set('d-acct', t.acct);
            set('d-route', t.route);
            set('d-whs', t.whs);
            set('d-desc', t.issue + (t.desc ? "\n\n" + t.desc : ""));
            set('d-date', t.date);
            set('d-driver', t.driverRaw);
            set('d-log-notes', t.lNotes);
            
            document.getElementById('d-owner').value = t.owner || "";
            document.getElementById('d-notes').value = t.notes || "";
            
            const b = document.getElementById('d-badge');
            b.innerText = t.status;
            b.className = t.status === 'Completed' ? 'px-2 py-1 rounded text-[10px] font-bold uppercase bg-green-100 text-green-700' : 'px-2 py-1 rounded text-[10px] font-bold uppercase bg-yellow-100 text-yellow-700';

            // Call Button
            const ph = t.driverRaw ? t.driverRaw.match(/[\d\-\.\s]{10,}/) : null;
            if(ph) document.getElementById('btn-call').href = `tel:${ph[0].replace(/[^0-9]/g,'')}`;
        }

        function setStatus(s) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) { t.status = s; window.saveLocal(true); }
        }

        function saveLocal(refresh = false) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) {
                t.notes = document.getElementById('d-notes').value;
                t.owner = document.getElementById('d-owner').value;
                Toastify({ text: "Saved", duration: 2000, style: { background: "#10b981" } }).showToast();
                if(refresh) render(); else loadTicket(t.id);
            }
        }

        function exportData() {
            const ws = XLSX.utils.json_to_sheet(db);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Logistics_Export");
            XLSX.writeFile(wb, `Logistics_Ops_${new Date().toISOString().split('T')[0]}.xlsx`);
        }
    </script>
</body>
</html>
