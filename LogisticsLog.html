<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Log v31.0 (Workflow Fix)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        slate: { 850: '#1a202c', 900: '#0f172a', 950: '#020617' },
                        primary: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                } 
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .app-grid { display: grid; grid-template-columns: 280px 1fr 450px; height: 100%; transition: all 0.3s ease; }
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
        .nav-btn.active { background-color: rgba(59, 130, 246, 0.1); color: #3b82f6; border-right: 3px solid #3b82f6; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors">

    <div id="auth-screen" class="fixed inset-0 bg-white dark:bg-slate-950 z-50 flex flex-col items-center justify-center p-4 text-center">
        <div class="max-w-md w-full space-y-8">
            <div class="inline-flex p-6 rounded-3xl bg-primary-600 text-white text-5xl shadow-2xl">
                <i class="fas fa-truck-fast"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-tight">Logistics Log</h1>
                <p class="text-slate-500 font-medium">Internal System v31.0</p>
            </div>
            <div class="space-y-3">
                <button onclick="login()" class="w-full py-4 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold hover:scale-[1.02] transition shadow-xl flex items-center justify-center gap-3">
                    <i class="fab fa-microsoft text-xl"></i> Sign In with Microsoft
                </button>
                <button onclick="bypassAuth()" class="text-xs font-bold text-slate-400 hover:text-slate-600 uppercase tracking-widest transition">
                    Continue Offline
                </button>
            </div>
            <div id="error-display" class="hidden text-red-500 text-xs bg-red-50 p-4 rounded-xl border border-red-100 font-mono text-left max-h-40 overflow-y-auto"></div>
        </div>
    </div>

    <header class="h-16 bg-white dark:bg-slate-900 border-b dark:border-slate-800 flex items-center justify-between px-6 z-10">
        <div class="flex items-center gap-4">
            <div class="text-xl font-black tracking-tighter">
                <span class="text-primary-600">LOGI</span>LOG <span class="text-[10px] bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded ml-1">v31.0</span>
            </div>
            <div id="live-indicator" class="hidden flex items-center gap-2 px-3 py-1 bg-green-50 text-green-600 rounded-full text-[10px] font-bold uppercase border border-green-100">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Connected
            </div>
        </div>
        <div class="flex items-center gap-6">
            <div class="relative group">
                <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="search" oninput="render()" placeholder="Search..." class="pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs w-80 outline-none focus:ring-2 ring-primary-500">
            </div>
            <div class="flex items-center gap-3 border-l pl-6 dark:border-slate-800">
                <div class="text-right">
                    <p id="user-display-name" class="text-xs font-bold">Guest User</p>
                    <p id="user-email" class="text-[10px] text-slate-500">offline@wbmason.com</p>
                </div>
                <div id="user-initial" class="w-8 h-8 bg-slate-200 dark:bg-slate-700 rounded-lg flex items-center justify-center font-bold text-xs uppercase">?</div>
            </div>
        </div>
    </header>

    <div id="app-ui" class="app-grid hidden">
        <aside class="bg-white dark:bg-slate-900 border-r dark:border-slate-800 flex flex-col p-4 space-y-6">
            <nav class="space-y-1">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-2">Views</p>
                <button onclick="setMode('today')" id="btn-today" class="nav-btn active w-full flex items-center justify-between p-3 rounded-xl font-bold text-xs">
                    <div class="flex items-center gap-3"><i class="fa fa-calendar-day"></i> Live Today</div>
                    <span id="count-today" class="text-[10px] opacity-60">0</span>
                </button>
                <button onclick="setMode('pending')" id="btn-pending" class="nav-btn w-full flex items-center justify-between p-3 rounded-xl font-bold text-xs text-slate-500">
                    <div class="flex items-center gap-3"><i class="fa fa-clock"></i> All Pending</div>
                    <span id="count-pending" class="text-[10px] opacity-60">0</span>
                </button>
                <button onclick="setMode('all')" id="btn-all" class="nav-btn w-full flex items-center justify-between p-3 rounded-xl font-bold text-xs text-slate-500">
                    <div class="flex items-center gap-3"><i class="fa fa-database"></i> Full History</div>
                </button>
            </nav>
            <div class="mt-auto space-y-3">
                <button onclick="fetchLiveData()" class="w-full py-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold transition flex items-center justify-center gap-2">
                    <i class="fas fa-sync-alt"></i> Refresh Flow
                </button>
                <label class="block w-full text-center p-4 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl hover:border-primary-500 cursor-pointer transition">
                    <i class="fa fa-upload text-slate-400 mb-1"></i>
                    <p class="text-[10px] font-bold text-slate-500">Import Excel</p>
                    <input type="file" class="hidden" onchange="handleFile(event)" accept=".xlsx, .xls">
                </label>
            </div>
        </aside>

        <main class="flex flex-col bg-white dark:bg-slate-950 overflow-hidden border-r dark:border-slate-800">
            <div class="overflow-y-auto custom-scroll flex-1">
                <table class="w-full text-left">
                    <thead class="sticky top-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur shadow-sm z-10">
                        <tr class="text-[10px] uppercase text-slate-400 font-black">
                            <th class="p-4 w-16">ID</th>
                            <th class="p-4">Customer</th>
                            <th class="p-4">Issue</th>
                            <th class="p-4 text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-list" class="divide-y dark:divide-slate-800"></tbody>
                </table>
            </div>
        </main>

        <aside id="detail-panel" class="bg-slate-50 dark:bg-slate-900 p-0 overflow-y-auto custom-scroll hidden">
            <div class="p-6 space-y-6" id="detail-content">
                <div class="flex justify-between items-start">
                    <span id="d-id-badge" class="font-mono text-[10px] bg-slate-200 dark:bg-slate-800 px-2 py-1 rounded">#---</span>
                    <span id="d-badge" class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter">PENDING</span>
                </div>
                <div>
                    <h2 id="d-company" class="text-2xl font-black text-slate-900 dark:text-white">Customer</h2>
                    <p id="d-meta" class="text-xs text-slate-400 font-bold uppercase mt-1"></p>
                </div>
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border dark:border-slate-700">
                    <label class="block text-[10px] font-black text-slate-400 mb-3 uppercase">Issue Detail</label>
                    <div id="d-desc" class="text-sm font-medium leading-relaxed"></div>
                </div>
                <textarea id="d-notes" class="w-full text-xs p-4 rounded-2xl border dark:bg-slate-800 h-32" placeholder="Internal notes..."></textarea>
                <div class="flex gap-2">
                    <button onclick="saveLocal(true)" class="flex-1 py-3 bg-primary-600 text-white rounded-xl font-bold text-xs uppercase">Save Update</button>
                    <button onclick="setStatus('Completed')" class="px-6 bg-green-600 text-white text-xs font-bold rounded-xl uppercase">Complete</button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // ACTION REQUIRED: Go to Power Automate, open the trigger, and replace this URL if it is different.
        const FLOW_URL = 'https://prod-36.westus.logic.azure.com:443/workflows/4553b342045e43a99e71ec6464016a5d/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=r9VIdV79vB-91t2fO9FvH6w_6H0vX7H9pL7S7J7G7Y0';
        
        const MSAL_CONFIG = {
            auth: { clientId: 'afe649b6-9c70-4b1a-8592-78588284c8ee', authority: 'https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401' },
            cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
        };

        const msalClient = new msal.PublicClientApplication(MSAL_CONFIG);
        let db = JSON.parse(localStorage.getItem('logistics_v31_db')) || [];
        let currentMode = 'today';
        let currentTicketId = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const accounts = msalClient.getAllAccounts();
            if (accounts.length > 0) {
                msalClient.setActiveAccount(accounts[0]);
                handleAuthResponse({ account: accounts[0] });
            }
        });

        async function login() {
            try {
                const response = await msalClient.loginPopup({ scopes: ["User.Read"], prompt: "select_account" });
                msalClient.setActiveAccount(response.account);
                handleAuthResponse(response);
            } catch (e) { showError(e.message); }
        }

        function handleAuthResponse(r) {
            document.getElementById('user-email').innerText = r.account.username;
            document.getElementById('user-display-name').innerText = r.account.name;
            document.getElementById('user-initial').innerText = r.account.name[0];
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('hidden');
            fetchLiveData();
        }

        function bypassAuth() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('hidden');
            render();
        }

        async function fetchLiveData() {
            try {
                const response = await fetch(FLOW_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ action: "Refresh" }) 
                });
                
                const data = await response.json();

                if (response.ok) {
                    let rows = data.schema?.data || (typeof data.body === 'string' ? JSON.parse(data.body).value : data.value);
                    if (Array.isArray(rows)) {
                        ingest(rows);
                        document.getElementById('live-indicator').classList.remove('hidden');
                    }
                } else {
                    // This will show "WorkflowNotFound" if the URL is wrong
                    showError(`Flow Error: ${JSON.stringify(data.error || data)}`);
                }
            } catch (e) { showError(`Network/CORS Error: ${e.message}`); }
        }

        function showError(msg) {
            const ed = document.getElementById('error-display');
            ed.innerText = msg;
            ed.classList.remove('hidden');
        }

        // FUZZY PARSER & RENDER LOGIC
        function val(row, terms) {
            const keys = Object.keys(row);
            for (let t of terms) {
                const nt = t.toLowerCase().replace(/[^a-z0-9]/g, '');
                for (let k of keys) {
                    const ck = k.toLowerCase().replace(/_x[0-9a-f]{4}_/g, '').replace(/[^a-z0-9]/g, '');
                    if (ck.includes(nt)) return String(row[k]).trim();
                }
            }
            return '';
        }

        function ingest(data) {
            data.forEach(r => {
                const t = {
                    id: val(r, ['id', 'iteminternalid']),
                    date: val(r, ['starttime']).split('T')[0],
                    company: val(r, ['company', 'customer']),
                    route: val(r, ['route']),
                    issue: val(r, ['issue']),
                    description: val(r, ['description']),
                    status: val(r, ['disposition', 'status']) || 'Pending'
                };
                const idx = db.findIndex(x => x.id === t.id);
                if(idx > -1) db[idx] = { ...db[idx], ...t }; else db.push(t);
            });
            saveLocal(true);
        }

        function render() {
            const list = document.getElementById('ticket-list');
            list.innerHTML = '';
            db.filter(t => {
                if(currentMode === 'today' && t.date !== new Date().toISOString().split('T')[0]) return false;
                return true;
            }).forEach(t => {
                const tr = document.createElement('tr');
                tr.className = "border-b dark:border-slate-800 hover:bg-slate-50 cursor-pointer";
                tr.onclick = () => loadTicket(t.id);
                tr.innerHTML = `<td class="p-4 text-[10px] font-mono">#${t.id.slice(-4)}</td><td class="p-4 text-xs font-bold">${t.company}</td><td class="p-4 text-xs">${t.issue}</td><td class="p-4 text-right"><span class="text-[9px] font-black uppercase">${t.status}</span></td>`;
                list.appendChild(tr);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            document.getElementById('detail-panel').classList.remove('hidden');
            document.getElementById('d-id-badge').innerText = `#${t.id}`;
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-desc').innerText = t.description;
            render();
        }

        function saveLocal(reRender = false) {
            localStorage.setItem('logistics_v31_db', JSON.stringify(db));
            if(reRender) render();
            Toastify({ text: "Updated", style: { background: "#10b981" } }).showToast();
        }
    </script>
</body>
</html>
