<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Command v37.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .app-grid { display: grid; grid-template-columns: 300px 1fr 450px; height: 100%; }
        .nav-btn.active { background-color: #eff6ff; color: #2563eb; border-right: 4px solid #2563eb; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="auth-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-4">
        <div class="max-w-md w-full text-center space-y-8">
            <div class="inline-flex p-6 rounded-3xl bg-blue-600 text-white text-5xl shadow-2xl"><i class="fas fa-truck-fast"></i></div>
            <h1 class="text-3xl font-black">Logistics Command</h1>
            <button onclick="login()" class="w-full py-4 rounded-xl bg-slate-900 text-white font-bold hover:scale-[1.02] transition shadow-xl flex items-center justify-center gap-3">
                <i class="fab fa-microsoft text-xl"></i> Sign In to Daytona
            </button>
        </div>
    </div>

    <header class="h-16 bg-white border-b flex items-center justify-between px-6 z-10">
        <div class="flex items-center gap-6">
            <div class="text-xl font-black text-blue-600 tracking-tighter">LOGI<span class="text-slate-900">COMMAND</span> <span class="text-slate-400 text-[10px] ml-1">v37.0</span></div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search Company, Route, or ID..." class="bg-slate-100 border-none rounded-lg px-4 py-2 text-xs w-64 focus:ring-2 ring-blue-500 transition outline-none">
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right">
                <p id="user-display-name" class="text-xs font-bold leading-none">Guest User</p>
                <p id="user-email" class="text-[10px] text-slate-400">Logistics Agent</p>
            </div>
            <button onclick="localStorage.clear(); location.reload();" class="p-2 hover:text-red-500 transition"><i class="fa fa-power-off"></i></button>
        </div>
    </header>

    <div id="app-ui" class="app-grid hidden">
        <aside class="bg-white border-r flex flex-col p-4 space-y-6">
            <nav class="space-y-1">
                <button onclick="setMode('today')" id="btn-today" class="nav-btn active w-full flex items-center gap-3 p-3 rounded-xl font-bold text-xs">
                    <i class="fa fa-clock"></i> Today's Live Active
                </button>
                <button onclick="setMode('all')" id="btn-all" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl font-bold text-xs text-slate-500">
                    <i class="fa fa-history"></i> Full Archive
                </button>
            </nav>
            <div class="mt-auto space-y-2">
                <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                    <p class="text-[10px] font-black text-blue-600 uppercase mb-1">Live Sync</p>
                    <p id="sync-status" class="text-[10px] text-blue-400">Last updated: Just now</p>
                </div>
                <button onclick="fetchLiveData()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-lg hover:bg-blue-700 transition">
                    <i class="fas fa-sync-alt mr-2"></i> Fetch New Tickets
                </button>
            </div>
        </aside>

        <main class="bg-white overflow-hidden border-r">
            <div class="overflow-y-auto custom-scroll h-full">
                <table class="w-full text-left">
                    <thead class="sticky top-0 bg-white border-b shadow-sm z-10">
                        <tr class="text-[10px] uppercase text-slate-400 font-black">
                            <th class="p-4">Customer / Route</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Age</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-list" class="divide-y"></tbody>
                </table>
            </div>
        </main>

        <aside id="detail-panel" class="bg-slate-50 overflow-y-auto custom-scroll hidden">
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-3 gap-2">
                    <a id="btn-call" href="#" class="flex flex-col items-center justify-center p-3 bg-white border rounded-xl hover:bg-green-50 hover:text-green-600 transition group">
                        <i class="fa fa-phone mb-1"></i><span class="text-[9px] font-bold uppercase">Call</span>
                    </a>
                    <a id="btn-text" href="#" class="flex flex-col items-center justify-center p-3 bg-white border rounded-xl hover:bg-blue-50 hover:text-blue-600 transition">
                        <i class="fa fa-comment-dots mb-1"></i><span class="text-[9px] font-bold uppercase">Text</span>
                    </a>
                    <a id="btn-email" href="#" class="flex flex-col items-center justify-center p-3 bg-white border rounded-xl hover:bg-purple-50 hover:text-purple-600 transition">
                        <i class="fa fa-envelope mb-1"></i><span class="text-[9px] font-bold uppercase">WHSE</span>
                    </a>
                </div>

                <div>
                    <div class="flex items-center gap-2 mb-2">
                        <span id="d-status-badge" class="px-2 py-0.5 rounded text-[9px] font-black uppercase"></span>
                        <span id="d-id-badge" class="text-[9px] font-mono text-slate-400"></span>
                    </div>
                    <h2 id="d-company" class="text-2xl font-black leading-tight text-slate-900"></h2>
                    <p id="d-route" class="text-xs font-bold text-blue-600 mt-1"></p>
                </div>
                
                <div class="bg-white p-5 rounded-2xl border shadow-sm">
                    <p id="d-issue" class="text-sm font-bold text-red-600 mb-2"></p>
                    <div id="d-desc" class="text-xs text-slate-600 leading-relaxed italic"></div>
                </div>

                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Logistics Agent Notes</label>
                    <textarea id="d-notes" oninput="saveLocal()" class="w-full mt-2 p-4 rounded-xl border h-40 text-xs focus:ring-2 ring-blue-500 outline-none" placeholder="Type driver updates here... (Auto-saves locally)"></textarea>
                </div>

                <div class="flex gap-2">
                    <button onclick="setStatus('Completed')" class="flex-1 py-4 bg-green-600 text-white rounded-xl font-black text-xs uppercase tracking-widest hover:bg-green-700 transition">Mark Completed</button>
                    <button onclick="setStatus('Escalated')" class="px-6 bg-slate-200 text-slate-700 rounded-xl font-black text-xs uppercase hover:bg-red-100 hover:text-red-600 transition">Escalate</button>
                </div>

                <div class="pt-6 border-t">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-3">Local Activity Trail</p>
                    <div id="d-audit" class="space-y-2"></div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const FLOW_URL = 'https://49b71dde44f8e78e89bc0440816209.07.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c8534a1735ca463d9386ac5ab1c89fcf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=X3TCIX7rLqKbo5iiDAOozZ-JchO3BuPK5H8DW4aruAA';
        
        const msalConfig = {
            auth: { clientId: 'afe649b6-9c70-4b1a-8592-78588284c8ee', authority: 'https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401' },
            cache: { cacheLocation: "localStorage" }
        };

        const msalClient = new msal.PublicClientApplication(msalConfig);
        let db = JSON.parse(localStorage.getItem('logistics_db_v37')) || [];
        let currentMode = 'today';
        let currentTicketId = null;

        window.onload = () => {
            const accounts = msalClient.getAllAccounts();
            if (accounts.length > 0) {
                msalClient.setActiveAccount(accounts[0]);
                document.getElementById('user-email').innerText = accounts[0].username;
                document.getElementById('user-display-name').innerText = accounts[0].name;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                fetchLiveData();
            }
        };

        async function login() {
            const res = await msalClient.loginPopup({ scopes: ["User.Read"] });
            msalClient.setActiveAccount(res.account);
            location.reload();
        }

        async function fetchLiveData() {
            try {
                const response = await fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "Refresh" }) });
                const data = await response.json();
                if (response.ok) {
                    let rows = data.schema?.data || (typeof data.body === 'string' ? JSON.parse(data.body).value : data.value);
                    if (rows) ingest(rows);
                }
            } catch (e) { console.error(e); }
        }

        function val(row, terms) {
            const keys = Object.keys(row);
            for (let t of terms) {
                const nt = t.toLowerCase().replace(/[^a-z0-9]/g, '');
                for (let k of keys) {
                    const ck = k.toLowerCase().replace(/_x[0-9a-f]{4}_/g, '').replace(/[^a-z0-9]/g, '');
                    if (ck.includes(nt)) return String(row[k] || '').trim();
                }
            }
            return '';
        }

        function ingest(data) {
            data.forEach(r => {
                const item = {
                    id: val(r, ['id', 'iteminternalid']),
                    company: val(r, ['company', 'deliverylocation']),
                    route: val(r, ['route']),
                    issue: val(r, ['issue']),
                    desc: val(r, ['description']),
                    driverRaw: val(r, ['driver']),
                    whse: val(r, ['warehouse']),
                    date: (val(r, ['starttime']) || "").split('T')[0],
                    timestamp: new Date(val(r, ['starttime'])).getTime(),
                    status: val(r, ['disposition', 'status']) || 'Pending'
                };
                if(item.id && item.company) {
                    const idx = db.findIndex(x => x.id === item.id);
                    if(idx > -1) db[idx] = {...db[idx], ...item};
                    else db.push({...item, notes: "", audit: []});
                }
            });
            document.getElementById('sync-status').innerText = `Updated: ${new Date().toLocaleTimeString()}`;
            saveLocal(true);
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            list.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];
            
            db.filter(t => (currentMode === 'all' || t.date === today))
              .filter(t => t.company.toLowerCase().includes(search) || t.route.toLowerCase().includes(search) || t.id.includes(search))
              .sort((a,b) => b.timestamp - a.timestamp)
              .forEach(t => {
                const tr = document.createElement('tr');
                tr.className = `hover:bg-blue-50 cursor-pointer transition ${currentTicketId === t.id ? 'bg-blue-50' : ''}`;
                tr.onclick = () => loadTicket(t.id);
                tr.innerHTML = `
                    <td class="p-4">
                        <div class="text-xs font-bold text-slate-900">${t.company}</div>
                        <div class="text-[10px] font-bold text-blue-500 uppercase">${t.route || 'No Route'}</div>
                    </td>
                    <td class="p-4"><span class="text-[9px] font-black uppercase px-2 py-1 rounded ${t.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${t.status}</span></td>
                    <td class="p-4 text-right text-[9px] font-bold text-slate-400 font-mono">${t.id.slice(-4)}</td>
                `;
                list.appendChild(tr);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            document.getElementById('detail-panel').classList.remove('hidden');
            document.getElementById('d-id-badge').innerText = `#${t.id}`;
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-route').innerText = `ROUTE: ${t.route} | WHSE: ${t.whse}`;
            document.getElementById('d-issue').innerText = t.issue;
            document.getElementById('d-desc').innerText = t.desc;
            document.getElementById('d-notes').value = t.notes || '';
            
            // Communications
            const phone = t.driverRaw.match(/\d{3}[-\s]?\d{3}[-\s]?\d{4}/);
            if(phone) {
                document.getElementById('btn-call').href = `tel:${phone[0]}`;
                document.getElementById('btn-text').href = `sms:${phone[0]}&body=Hi, this is WB Logistics regarding your delivery to ${t.company}`;
            }
            document.getElementById('btn-email').href = `mailto:logistics@wbmason.com?subject=Inquiry: ${t.company} (R: ${t.route})&body=Hello WHSE, regarding ID ${t.id}...`;

            const badge = document.getElementById('d-status-badge');
            badge.innerText = t.status;
            badge.className = `px-2 py-1 rounded text-[9px] font-black uppercase ${t.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`;
            
            // Audit Trail
            document.getElementById('d-audit').innerHTML = (t.audit || []).reverse().map(a => `
                <div class="text-[10px] bg-white p-2 rounded border border-slate-100 text-slate-500">
                    <span class="font-bold text-slate-900">${a.time}</span>: ${a.msg}
                </div>
            `).join('');
            render();
        }

        function setStatus(s) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) { 
                t.status = s; 
                addAudit(`Status changed to ${s}`);
                saveLocal(true); 
            }
        }

        function addAudit(msg) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) {
                if(!t.audit) t.audit = [];
                t.audit.push({ time: new Date().toLocaleTimeString(), msg: msg });
            }
        }

        function saveLocal(reRender = false) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) t.notes = document.getElementById('d-notes').value;
            localStorage.setItem('logistics_db_v37', JSON.stringify(db));
            if (reRender) render();
        }

        function setMode(m) {
            currentMode = m;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + m).classList.add('active');
            render();
        }
    </script>
</body>
</html>
