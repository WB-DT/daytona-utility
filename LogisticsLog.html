<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink | Dispatch v67.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style id="theme-styles">
        /* Default: Midnight Midnight */
        :root { 
            --bg-deep: #0f172a;      
            --bg-surface: #1e293b;   
            --bg-card: #334155;      
            --brand: #2dd4bf;        
            --text-main: #f1f5f9;    
            --text-dim: #94a3b8;     
            --text-accent: #fcd34d;  /* High contrast gold for the "Issue" text */
            --border: #475569;
        }

        /* Nordic Fog Theme */
        .theme-nordic {
            --bg-deep: #f1f5f9;
            --bg-surface: #e2e8f0;
            --bg-card: #ffffff;
            --brand: #0f766e;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --text-accent: #0d9488;
            --border: #cbd5e1;
        }

        /* Sandstone Theme */
        .theme-sandstone {
            --bg-deep: #f5f2ed;
            --bg-surface: #e8e4db;
            --bg-card: #ffffff;
            --brand: #9a3412;
            --text-main: #431407;
            --text-dim: #7c2d12;
            --text-accent: #c2410c;
            --border: #d6d3d1;
        }

        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            font-size: 13px; /* Bumped up from 11px */
            transition: background 0.3s ease;
        }

        header { 
            height: 60px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .app-grid { display: grid; grid-template-columns: 350px 1fr; height: calc(100vh - 60px); }

        aside { background: var(--bg-surface); border-right: 1px solid var(--border); }
        
        .record-card { 
            margin: 10px 14px;
            border-radius: 12px;
            padding: 18px;
            background: var(--bg-card);
            border: 1px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .record-card:hover { border-color: var(--brand); transform: translateY(-2px); }
        .record-card.active { 
            background: var(--bg-surface);
            border: 2px solid var(--brand);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .card-issue {
            color: var(--text-accent);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select, textarea {
            background: var(--bg-deep) !important;
            border: 1px solid var(--border) !important;
            color: var(--text-main) !important;
            border-radius: 8px !important;
            padding: 10px !important;
        }

        .btn-toggle { padding: 10px; border-radius: 8px; font-weight: 700; text-transform: uppercase; font-size: 11px; }
        .active-tab { background: var(--brand); color: white; }
        .inactive-tab { color: var(--text-dim); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body id="app-body">

    <header>
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-teal-500 rounded-xl flex items-center justify-center">
                    <i class="fa fa-link text-white text-lg"></i>
                </div>
                <div class="text-xl font-black tracking-tighter text-teal-500 uppercase">LOGILINK</div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search Records..." class="w-64">
        </div>

        <div class="flex items-center gap-4">
            <label class="text-[10px] font-bold uppercase opacity-50">Theme:</label>
            <select id="theme-selector" onchange="changeTheme(this.value)" class="text-[10px] !py-1 !px-2">
                <option value="midnight">Midnight (Dark)</option>
                <option value="nordic">Nordic Fog (Light)</option>
                <option value="sandstone">Sandstone (Warm)</option>
            </select>
            <div id="sync-status" class="text-[10px] text-teal-500 font-bold uppercase ml-4">
                <i class="fa fa-bolt"></i> Live
            </div>
        </div>
    </header>

    <div class="app-grid">
        <aside class="flex flex-col">
            <div class="p-4 flex gap-2 border-b border-slate-700/30">
                <button onclick="setMode('active')" id="btn-active" class="btn-toggle active-tab flex-1">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="btn-toggle inactive-tab flex-1">History</button>
            </div>
            <div id="ticket-list" class="flex-1 overflow-y-auto pt-2"></div>
        </aside>

        <main class="overflow-y-auto p-12">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center opacity-20">
                <i class="fa fa-hand-pointer text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest">Select a log</p>
            </div>

            <div id="detail-content" class="hidden max-w-5xl mx-auto space-y-8">
                <div class="flex justify-between items-start border-b border-slate-700/50 pb-8">
                    <div>
                        <h2 id="d-company" class="text-4xl font-black tracking-tight uppercase"></h2>
                        <p id="d-date" class="text-teal-500 font-mono text-xs mt-2 font-bold"></p>
                    </div>
                    <div class="text-right">
                        <span id="d-id-display" class="text-slate-500 font-mono text-xs block mb-1"></span>
                        <p id="d-order" class="text-5xl font-black italic tracking-tighter"></p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase tracking-widest opacity-60">Disposition</label>
                        <select id="d-dispo-select" class="w-full text-md font-bold"></select>
                    </div>
                    <div class="space-y-2 text-center">
                        <label class="text-[10px] font-black uppercase tracking-widest opacity-60">Issue</label>
                        <p id="d-issue" class="text-lg font-bold"></p>
                    </div>
                    <div class="space-y-2 text-right">
                        <label class="text-[10px] font-black uppercase tracking-widest opacity-60">Driver</label>
                        <p id="d-driver" class="text-lg font-bold"></p>
                    </div>
                </div>

                <div class="bg-black/20 p-8 rounded-3xl border border-white/5 shadow-inner">
                    <label class="text-[10px] uppercase font-black opacity-40 mb-4 block">Description</label>
                    <p id="d-description" class="text-lg leading-relaxed italic"></p>
                </div>

                <div class="grid grid-cols-2 gap-10">
                    <div class="space-y-4">
                        <label class="text-xs font-black uppercase flex items-center gap-2">
                            <i class="fa fa-building-circle-check text-teal-500"></i> Warehouse Notes
                        </label>
                        <textarea id="d-warehouse-input" class="w-full h-56" placeholder="Update warehouse info..."></textarea>
                    </div>
                    <div class="space-y-4">
                        <label class="text-xs font-black uppercase flex items-center gap-2">
                            <i class="fa fa-truck-fast text-teal-500"></i> Driver Updates
                        </label>
                        <textarea id="d-driver-input" class="w-full h-56" placeholder="Update driver info..."></textarea>
                    </div>
                </div>

                <button id="save-btn" onclick="saveData()" class="w-full py-6 bg-teal-500 text-white rounded-2xl font-black text-sm uppercase tracking-[0.4em] shadow-2xl hover:bg-teal-400 transition-all">Submit Sync</button>
            </div>
        </main>
    </div>

    <script>
        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        let db = []; 
        let currentMode = 'active';
        let currentTicketId = null;

        window.onload = () => { fetchData(HISTORY_URL, "FullHistory"); setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000); };

        async function fetchData(url, actionType) {
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType }) });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error("Fetch failed", e); }
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id || Math.random().toString();
                const companyName = r.cr714_companyordeliveryname || r.cr714_Companyordeliveryname || r['cr714_companyordeliveryname@OData.Community.Display.V1.FormattedValue'] || 'Unknown';

                const item = {
                    id: id, 
                    idNum: r.cr714_id || 'N/A', 
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: companyName, 
                    driver: r.cr714_drivernamenumber || 'Not Assigned',
                    status: (r.cr714_disposition || 'Pending'), 
                    issue: r.cr714_issue || 'General Inquiry',
                    description: r.cr714_description || 'No description provided.',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    timestamp: r.createdon ? new Date(r.createdon).getTime() : 0
                };
                const idx = db.findIndex(x => x.id === id);
                if (idx === -1) db.push(item); else db[idx] = {...db[idx], ...item};
            });
            render();
        }

        function changeTheme(val) {
            const body = document.getElementById('app-body');
            body.className = '';
            if (val !== 'midnight') body.classList.add('theme-' + val);
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const matchesSearch = (t.order + t.company + t.idNum + t.issue).toLowerCase().includes(search);
                const isComplete = t.status.includes('Completed') || t.status === 'Sent Back';
                return currentMode === 'active' ? (matchesSearch && !isComplete) : (matchesSearch && isComplete);
            }).sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            filtered.forEach(t => {
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs font-black text-teal-500 tracking-tighter">#${t.idNum} | ${t.order}</span>
                        <span class="text-[9px] px-2 py-1 bg-black/30 rounded-md font-bold uppercase border border-white/10">${t.status}</span>
                    </div>
                    <div class="text-sm font-extrabold uppercase truncate">${t.company}</div>
                    <div class="card-issue mt-2 italic">${t.issue}</div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order; 
            document.getElementById('d-id-display').innerText = `ID: ${t.idNum}`;
            document.getElementById('d-driver').innerText = t.driver;
            document.getElementById('d-issue').innerText = t.issue;
            document.getElementById('d-date').innerText = `Sync: ${t.date}`;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
            document.getElementById('d-driver-input').value = t.driverNotes;
            
            const sel = document.getElementById('d-dispo-select');
            sel.innerHTML = ['Pending','Working on','Follow-up','Escalated','Sent Back','Completed'].map(o => `<option value="${o}" ${t.status === o ? 'selected' : ''}>${o}</option>`).join('');
            render();
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = `btn-toggle flex-1 ${m === 'active' ? 'active-tab' : 'inactive-tab'}`;
            document.getElementById('btn-all').className = `btn-toggle flex-1 ${m === 'all' ? 'active-tab' : 'inactive-tab'}`;
            render();
        }

        function saveData() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "SUCCESSFULLY RECORDED";
            setTimeout(() => { btn.innerText = "Submit Sync"; render(); }, 1500);
        }
    </script>
</body>
</html>
