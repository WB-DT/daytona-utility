<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v78.5 | Logistics Bridge</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fcd34d; --border: #475569; --input-bg: #1e293b;
            --danger: #ef4444;
        }
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        
        header { height: 60px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        aside { width: 380px; min-width: 380px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; }
        
        /* List Cards with Rep info */
        .record-card { margin: 8px 16px; border-radius: 8px; padding: 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s; }
        .record-card.active { border-left-width: 6px; background: #3d4b5f; border-left-color: #fff; }
        
        .status-pill { font-size: 9px; padding: 1px 6px; border-radius: 4px; font-weight: 800; text-transform: uppercase; border: 1px solid currentColor; }
        .description-box { background: rgba(0,0,0,0.2); border: 1px dashed var(--border); padding: 20px; border-radius: 12px; border-left: 4px solid var(--text-accent); }
        
        .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--brand); color: #000; padding: 8px 20px; border-radius: 99px; font-weight: 900; font-size: 12px; z-index: 100; display: none; }
        input, select, textarea { background: var(--input-bg) !important; border: 1px solid var(--border) !important; color: var(--text-main) !important; border-radius: 6px !important; }
        
        .dup-warning { color: var(--danger) !important; font-weight: 900; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>

    <div id="toast" class="copy-toast">Copied Order Number</div>

    <header>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-teal-600 rounded-lg flex items-center justify-center"><i class="fa fa-link text-white"></i></div>
                <div class="text-lg font-black uppercase tracking-tighter" style="color:var(--brand)">LOGILINK <span class="text-[9px] opacity-40">v78.5</span></div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search Order, Rep, or Account..." class="w-80 p-2 text-xs rounded-md">
            <div class="px-3 py-1 bg-black/30 rounded-full text-[10px] font-black uppercase text-teal-400">
                ACTIVE: <span id="record-count">0</span>
            </div>
        </div>
        <div class="flex items-center gap-2 text-[10px] font-black opacity-60 uppercase">
            <i id="sync-icon" class="fa fa-circle text-[6px] text-teal-400"></i> Bridge Connected
        </div>
    </header>

    <div class="app-container">
        <aside>
            <div id="mode-bar" class="p-4 flex gap-2 border-b border-black/10">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[10px] uppercase bg-teal-600 text-slate-900">Open Requests</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[10px] uppercase bg-slate-700 opacity-50 text-white">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10">
                <i class="fa fa-inbox text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest">Select a record to review</p>
            </div>

            <div id="detail-content" class="hidden w-full max-w-5xl mx-auto p-10 space-y-6">
                <div class="flex justify-between items-end border-b border-white/10 pb-6">
                    <div>
                        <div class="flex items-center gap-3 mb-1">
                            <span id="d-status" class="status-pill"></span>
                            <span id="d-date" class="text-[10px] opacity-50 font-mono"></span>
                        </div>
                        <h2 id="d-company" class="text-2xl font-black uppercase tracking-tight"></h2>
                        <div class="flex gap-2 mt-3">
                            <span id="d-account" class="text-[10px] font-bold px-2 py-1 bg-slate-800 rounded border border-white/5"></span>
                            <span id="d-rep" class="text-[10px] font-bold px-2 py-1 bg-amber-400/10 text-amber-400 rounded border border-amber-400/20"></span>
                            <span id="d-owner" class="text-[10px] font-bold px-2 py-1 bg-teal-400/10 text-teal-400 rounded border border-teal-400/20"></span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div id="dup-badge-container"></div>
                        <div class="flex items-center justify-end gap-2 group cursor-pointer" onclick="copyToClipboard()">
                            <span class="text-[10px] font-black opacity-40 uppercase block">Order#</span>
                            <p id="d-order" class="text-3xl font-black italic text-teal-400"></p>
                            <i class="fa fa-copy text-xs opacity-20 group-hover:opacity-100 transition-opacity"></i>
                        </div>
                    </div>
                </div>

                <div id="collision-panel" class="hidden bg-red-500/10 border border-red-500/30 p-3 rounded-lg flex items-center gap-3">
                    <i class="fa fa-clone text-red-500 text-xs"></i>
                    <p class="text-red-500 font-bold text-[11px] uppercase">Multiple CSR submissions detected for this Sales Order.</p>
                </div>

                <div class="description-box">
                    <label class="text-[9px] font-black uppercase tracking-widest text-amber-500/60 block mb-2">Rep Submission Detail</label>
                    <p id="d-description" class="text-lg leading-relaxed font-medium text-slate-200"></p>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase opacity-40">Warehouse Notes</label>
                        <textarea id="d-warehouse-input" class="w-full h-32 p-3 text-sm focus:border-teal-400 outline-none transition-colors" placeholder="Internal warehouse coordination..."></textarea>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase opacity-40">Driver Notes</label>
                        <textarea id="d-driver-input" class="w-full h-32 p-3 text-sm focus:border-teal-400 outline-none transition-colors" placeholder="Coordination with carrier or driver..."></textarea>
                    </div>
                </div>

                <div class="flex gap-4 items-end pt-4 border-t border-white/5">
                    <div class="w-64">
                        <label class="text-[10px] font-black uppercase opacity-40 block mb-2">Status Update</label>
                        <select id="d-dispo-select" class="w-full p-3 font-bold text-sm"></select>
                    </div>
                    <button onclick="saveData()" class="px-8 py-3 bg-teal-600 text-slate-900 rounded font-black uppercase text-xs hover:bg-teal-400 transition-all flex-grow">Save Record</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let db = []; let currentMode = 'active'; let currentTicketId = null;

        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        window.onload = () => { fetchData(HISTORY_URL, "FullHistory"); setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000); };

        async function fetchData(url, actionType) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.classList.add('fa-spin');
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType }) });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error(e); }
            setTimeout(() => { if(icon) icon.classList.remove('fa-spin'); }, 2000);
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id;
                const item = {
                    id: id, idNum: r.cr714_id || 'N/A', 
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: r.cr714_companyordeliveryname || r['cr714_companyordeliveryname@OData.Community.Display.V1.FormattedValue'] || 'Unknown', 
                    account: r.cr714_accountnumber || 'N/A',
                    rep: r.cr714_rep || 'Internal CSR',
                    owner: r.cr714_logisticsowner || 'Unassigned',
                    status: (r.cr714_disposition || 'Pending'), 
                    description: r.cr714_description || 'No notes provided.',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    timestamp: r.createdon ? new Date(r.createdon).getTime() : 0
                };
                const idx = db.findIndex(x => x.id === id);
                if (idx === -1) db.push(item); else db[idx] = {...db[idx], ...item};
            });
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            
            const filtered = db.filter(t => {
                const match = (t.order + t.company + t.account + t.owner + t.rep).toLowerCase().includes(search);
                if (search.length > 0) return match;
                const isComplete = t.status.includes('Completed') || t.status === 'Sent Back';
                return currentMode === 'active' ? (match && !isComplete) : (match && isComplete);
            }).sort((a,b) => b.timestamp - a.timestamp);

            document.getElementById('record-count').innerText = filtered.length;
            list.innerHTML = '';
            filtered.forEach(t => {
                const isDup = db.filter(x => x.order === t.order && t.order !== 'N/A').length > 1;
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[9px] font-black uppercase text-teal-400 ${isDup ? 'dup-warning' : ''}">${t.order}</span>
                        <span class="status-pill" style="border-color:var(--brand); color:var(--brand)">${t.status}</span>
                    </div>
                    <div class="text-[11px] font-bold text-white leading-tight mb-2 uppercase truncate">${t.company}</div>
                    <div class="flex justify-between items-center pt-2 border-t border-white/5">
                        <span class="text-[9px] text-amber-400 font-black uppercase"><i class="fa fa-user mr-1 opacity-50"></i>${t.rep}</span>
                        <span class="text-[8px] font-mono opacity-30">${t.date}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('collision-panel').classList.toggle('hidden', db.filter(x => x.order === t.order && t.order !== 'N/A').length <= 1);
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-account').innerText = t.account;
            document.getElementById('d-rep').innerText = t.rep;
            document.getElementById('d-owner').innerText = t.owner;
            document.getElementById('d-status').innerText = t.status;
            document.getElementById('d-date').innerText = `SUBMITTED: ${t.date}`;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
            document.getElementById('d-driver-input').value = t.driverNotes;

            const sel = document.getElementById('d-dispo-select');
            sel.innerHTML = ['Pending','Working on','Follow-up','Escalated','Sent Back','Completed'].map(o => `<option value="${o}" ${t.status === o ? 'selected' : ''}>${o}</option>`).join('');
            render();
            document.getElementById('main-scroller').scrollTop = 0;
        }

        function copyToClipboard() {
            const order = document.getElementById('d-order').innerText;
            navigator.clipboard.writeText(order);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        function setMode(m) { 
            currentMode = m; 
            document.getElementById('btn-active').className = `flex-1 py-2 rounded font-black text-[10px] uppercase ${m==='active'?'bg-teal-600 text-slate-900':'bg-slate-700 opacity-50 text-white'}`; 
            document.getElementById('btn-all').className = `flex-1 py-2 rounded font-black text-[10px] uppercase ${m==='all'?'bg-teal-600 text-slate-900':'bg-slate-700 opacity-50 text-white'}`; 
            render(); 
        }
        function saveData() { alert('Saving Record...'); }
    </script>
</body>
</html>
