<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Command v62.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg-body: #f8fafc; --bg-side: #ffffff; --brand: #2563eb; --accent: #eff6ff; --border: #e2e8f0; }
        body { background-color: var(--bg-body); font-family: sans-serif; height: 100vh; overflow: hidden; font-size: 11px; }
        .app-grid { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 56px); }
        .record-card { border-bottom: 1px solid var(--border); cursor: pointer; padding: 14px 18px; background: white; }
        .record-card:hover { background-color: var(--accent); }
        .record-card.active { background-color: var(--accent); border-left: 4px solid var(--brand); }
        .sync-active { color: #22c55e; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <audio id="ping-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <header class="h-14 border-b flex items-center justify-between px-6 bg-white z-10">
        <div class="flex items-center gap-6">
            <div class="text-lg font-bold italic tracking-tighter text-blue-600">LOGICOMMAND <span class="text-[9px] opacity-40 not-italic">v62.1</span></div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search 8000+ records..." class="rounded-full px-4 py-1.5 text-xs w-64 border bg-slate-50 outline-none focus:ring-2 ring-blue-100">
        </div>
        <div id="sync-status" class="text-[10px] font-bold text-slate-500 uppercase"><i class="fa fa-satellite-dish sync-active mr-2"></i>Initializing...</div>
    </header>

    <div class="app-grid">
        <aside class="border-r flex flex-col bg-white overflow-hidden">
            <div class="p-3 border-b flex gap-2 bg-slate-50">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white">Open</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400">All History</button>
            </div>
            <div id="ticket-list" class="flex-1 overflow-y-auto"></div>
        </aside>

        <main class="bg-slate-50 overflow-y-auto relative p-10">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-400">
                <i class="fa fa-database text-5xl mb-4 opacity-20"></i>
                <p id="debug-info" class="font-bold uppercase tracking-widest text-xs">Syncing Dataverse...</p>
            </div>

            <div id="detail-content" class="hidden max-w-5xl mx-auto space-y-8">
                <div class="flex justify-between items-end border-b pb-8">
                    <div>
                        <h2 id="d-company" class="text-4xl font-bold text-slate-900"></h2>
                        <p id="d-date" class="text-slate-500 mt-2 text-xs font-bold"></p>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Sales Order</span>
                        <p id="d-order" class="text-3xl font-bold text-blue-600 italic"></p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-2xl border shadow-sm h-fit">
                        <p class="text-[9px] text-slate-400 uppercase font-bold mb-2">Driver / Info</p>
                        <p id="d-driver" class="text-lg font-bold text-slate-800"></p>
                    </div>
                    <div class="space-y-4">
                        <textarea id="d-notes" oninput="updateNoteInMemory()" class="w-full p-6 rounded-2xl border-2 h-64 text-sm outline-none focus:border-blue-500" placeholder="Session notes..."></textarea>
                        <button id="res-btn" onclick="toggleComplete()" class="w-full py-5 rounded-xl font-bold text-xs uppercase tracking-widest"></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        // MEMORY STORAGE (Fixes QuotaExceededError)
        let db = []; 
        let currentMode = 'active';
        let currentTicketId = null;

        window.onload = () => {
            fetchData(HISTORY_URL, "FullHistory");
            setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000);
        };

        async function fetchData(url, actionType) {
            const status = document.getElementById('sync-status');
            status.innerHTML = `<i class="fa fa-spinner fa-spin mr-2"></i>FETCHING ${actionType}...`;

            try {
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionType }) 
                });
                const data = await response.json();
                
                // Ingesting data directly into memory array
                if (data && data.value) ingest(data.value);
                
                status.innerHTML = `<i class="fa fa-check-circle mr-2 text-green-500"></i>ONLINE: ${db.length} ROWS`;
            } catch (e) {
                status.innerHTML = `<i class="fa fa-exclamation-triangle mr-2 text-red-500"></i>SYNC ERROR`;
            }
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id;
                // Field Mapping based on ActionOutputs.json schema
                const item = {
                    id: id,
                    order: r.cr714_salesordernumber || 'N/A',
                    company: r.cr714_companyordeliveryname || 'Unknown',
                    driver: r.cr714_drivernamenumber || 'No Info',
                    status: (r.cr714_disposition || '').toLowerCase(),
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || r.createdon || 'N/A',
                    timestamp: new Date(r.createdon).getTime(),
                    notes: "" 
                };

                const existingIdx = db.findIndex(x => x.id === id);
                if (existingIdx === -1) {
                    db.push(item);
                } else {
                    // Update status if it changed in Dataverse
                    db[existingIdx].status = item.status;
                }
            });
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            
            const filtered = db.filter(t => {
                const matchesSearch = (t.order + t.company + t.driver).toLowerCase().includes(search);
                const matchesMode = (currentMode === 'all' || t.status !== 'completed');
                return matchesSearch && matchesMode;
            }).sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            // Rendering first 500 for performance, browser handles 8000+ in memory easily
            filtered.slice(0, 500).forEach(t => {
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="font-bold text-blue-600 text-[10px]">SO# ${t.order}</div>
                    <div class="font-bold text-slate-900 truncate">${t.company}</div>
                    <div class="text-[9px] text-slate-400 truncate uppercase">${t.driver}</div>
                `;
                list.appendChild(div);
            });
            
            document.getElementById('debug-info').innerText = `TOTAL RECORDS: ${db.length}`;
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = `#${t.order}`;
            document.getElementById('d-driver').innerText = t.driver;
            document.getElementById('d-date').innerText = `Logged: ${t.date}`;
            document.getElementById('d-notes').value = t.notes;
            
            const btn = document.getElementById('res-btn');
            const isComp = t.status === 'completed';
            btn.innerText = isComp ? "RE-OPEN REQUEST" : "MARK AS COMPLETED";
            btn.className = isComp ? "w-full py-5 bg-slate-200 text-slate-600 rounded-xl font-bold" : "w-full py-5 bg-green-600 text-white rounded-xl font-bold";
            render();
        }

        function updateNoteInMemory() {
            const t = db.find(x => x.id === currentTicketId);
            if(t) t.notes = document.getElementById('d-notes').value;
        }

        function toggleComplete() {
            const t = db.find(x => x.id === currentTicketId);
            if(t) {
                t.status = (t.status === 'completed') ? 'pending' : 'completed';
                if(currentMode === 'active' && t.status === 'completed') {
                    document.getElementById('detail-content').classList.add('hidden');
                    document.getElementById('empty-state').classList.remove('hidden');
                }
                render();
            }
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400';
            document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-600 text-white' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400';
            render();
        }
    </script>
</body>
</html>
