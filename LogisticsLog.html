<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink | Dispatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #0f172a;      /* Deep Navy (Easiest on eyes) */
            --bg-surface: #1e293b;   /* Slate Sidebar */
            --bg-card: #334155;      /* Lighter Slate for records */
            --brand: #2dd4bf;        /* Soft Teal Accent */
            --text-main: #f1f5f9;    /* Crisp off-white */
            --text-dim: #94a3b8;     /* Muted grey for labels */
            --border: #475569;
        }

        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            font-size: 11px; 
        }

        header { 
            height: 60px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .app-grid { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 60px); }

        aside { background: var(--bg-surface); border-right: 1px solid var(--border); }
        
        .record-card { 
            margin: 8px 12px;
            border-radius: 12px;
            padding: 16px;
            background: var(--bg-card);
            border: 1px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .record-card:hover { border-color: var(--brand); transform: scale(1.02); }
        .record-card.active { 
            background: #1e293b;
            border: 1px solid var(--brand);
            box-shadow: 0 0 20px rgba(45, 212, 191, 0.15);
        }

        input, select, textarea {
            background: #0f172a !important;
            border: 1px solid var(--border) !important;
            color: var(--text-main) !important;
            border-radius: 10px !important;
            padding: 10px !important;
        }
        textarea:focus, input:focus { border-color: var(--brand) !important; outline: none; }

        .btn-toggle { padding: 8px; border-radius: 8px; font-weight: 700; text-transform: uppercase; transition: 0.3s; }
        .active-tab { background: var(--brand); color: var(--bg-deep); }
        .inactive-tab { color: var(--text-dim); }

        #sync-status { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="flex items-center gap-10">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-teal-400 rounded-xl flex items-center justify-center">
                    <i class="fa fa-link text-slate-900 text-lg"></i>
                </div>
                <div class="text-xl font-black tracking-tighter text-teal-400 uppercase">LOGILINK</div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search Company or SO#..." class="w-72 text-xs">
        </div>
        <div id="sync-status" class="text-[10px] text-teal-500/60 font-bold uppercase">
            <i class="fa fa-bolt mr-2"></i>Link Established
        </div>
    </header>

    <div class="app-grid">
        <aside class="flex flex-col">
            <div class="p-4 flex gap-2">
                <button onclick="setMode('active')" id="btn-active" class="btn-toggle active-tab flex-1 text-[10px]">Active Logs</button>
                <button onclick="setMode('all')" id="btn-all" class="btn-toggle inactive-tab flex-1 text-[10px]">History</button>
            </div>
            <div id="ticket-list" class="flex-1 overflow-y-auto"></div>
        </aside>

        <main class="overflow-y-auto p-10 bg-[#0b1120]">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-700">
                <i class="fa fa-layer-group text-7xl mb-4 opacity-20"></i>
                <p class="font-bold uppercase tracking-[0.4em] text-xs">Select Record to View</p>
            </div>

            <div id="detail-content" class="hidden max-w-5xl mx-auto space-y-6">
                <div class="flex justify-between items-start border-b border-slate-800 pb-8">
                    <div>
                        <h2 id="d-company" class="text-4xl font-extrabold text-white tracking-tight uppercase"></h2>
                        <p id="d-date" class="text-teal-500 font-mono text-[10px] mt-2 tracking-widest"></p>
                    </div>
                    <div class="text-right">
                        <span id="d-id-display" class="text-slate-500 font-mono text-[10px] block mb-1"></span>
                        <p id="d-order" class="text-5xl font-black text-white italic tracking-tighter"></p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-6">
                    <div class="space-y-2">
                        <label class="text-[9px] text-teal-500 uppercase font-black tracking-widest">Disposition</label>
                        <select id="d-dispo-select" class="w-full text-sm font-bold">
                            <option value="Pending">Pending</option>
                            <option value="Working on">Working on</option>
                            <option value="Follow-up">Follow-up</option>
                            <option value="Escalated">Escalated</option>
                            <option value="Sent Back">Sent Back</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[9px] text-teal-500 uppercase font-black tracking-widest">Issue Type</label>
                        <p id="d-issue" class="p-2 text-sm font-semibold text-white"></p>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[9px] text-teal-500 uppercase font-black tracking-widest">Resource</label>
                        <p id="d-driver" class="p-2 text-sm font-semibold text-white"></p>
                    </div>
                </div>

                <div class="bg-slate-900/80 p-6 rounded-2xl border border-slate-800">
                    <label class="text-[9px] text-slate-500 uppercase font-black mb-4 block tracking-widest">Original Entry</label>
                    <p id="d-description" class="text-slate-300 text-sm leading-relaxed whitespace-pre-wrap"></p>
                </div>

                <div class="grid grid-cols-2 gap-8">
                    <div class="space-y-3">
                        <label class="text-[10px] font-bold text-white uppercase"><i class="fa fa-envelope-open-text mr-2 text-teal-500"></i>Warehouse Notes</label>
                        <textarea id="d-warehouse-input" class="w-full h-48 text-sm" placeholder="Type here..."></textarea>
                    </div>
                    <div class="space-y-3">
                        <label class="text-[10px] font-bold text-white uppercase"><i class="fa fa-comment-dots mr-2 text-teal-500"></i>Driver Response</label>
                        <textarea id="d-driver-input" class="w-full h-48 text-sm" placeholder="Type here..."></textarea>
                    </div>
                </div>

                <button id="save-btn" onclick="saveData()" class="w-full py-5 bg-teal-500 text-slate-900 rounded-2xl font-black text-xs uppercase tracking-[0.3em] hover:bg-teal-400 transition-all shadow-xl">Synchronize Changes</button>
            </div>
        </main>
    </div>

    <script>
        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        let db = []; 
        let currentMode = 'active';
        let currentTicketId = null;

        window.onload = () => { fetchData(HISTORY_URL, "FullHistory"); setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000); };

        async function fetchData(url, actionType) {
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType }) });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error("Sync failed", e); }
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id || Math.random().toString();
                const companyName = r.cr714_companyordeliveryname || 
                                   r.cr714_Companyordeliveryname || 
                                   r['cr714_companyordeliveryname@OData.Community.Display.V1.FormattedValue'] ||
                                   'Processing...';

                const item = {
                    id: id, 
                    idNum: r.cr714_id || 'N/A', 
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: companyName, 
                    driver: r.cr714_drivernamenumber || 'Not Assigned',
                    status: (r.cr714_disposition || 'Pending'), 
                    issue: r.cr714_issue || 'Inquiry',
                    description: r.cr714_description || 'No description provided.',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    timestamp: r.createdon ? new Date(r.createdon).getTime() : 0
                };
                const idx = db.findIndex(x => x.id === id);
                if (idx === -1) db.push(item); else db[idx] = {...db[idx], ...item};
            });
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const matchesSearch = (t.order + t.company + t.idNum).toLowerCase().includes(search);
                const isComplete = t.status.includes('Completed') || t.status === 'Sent Back';
                return currentMode === 'active' ? (matchesSearch && !isComplete) : (matchesSearch && isComplete);
            }).sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            filtered.forEach(t => {
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-teal-400">#${t.idNum} | ${t.order}</span>
                        <span class="text-[8px] px-2 py-0.5 bg-slate-900 rounded text-slate-400 font-bold uppercase border border-slate-700">${t.status}</span>
                    </div>
                    <div class="font-bold text-white truncate uppercase text-xs">${t.company}</div>
                    <div class="text-[9px] text-slate-500 mt-1 italic">${t.issue}</div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order; 
            document.getElementById('d-id-display').innerText = `ID: ${t.idNum}`;
            document.getElementById('d-driver').innerText = t.driver;
            document.getElementById('d-issue').innerText = t.issue;
            document.getElementById('d-date').innerText = `TS: ${t.date}`;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
            document.getElementById('d-driver-input').value = t.driverNotes;
            document.getElementById('d-dispo-select').value = t.status;
            render();
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = `btn-toggle flex-1 text-[10px] ${m === 'active' ? 'active-tab' : 'inactive-tab'}`;
            document.getElementById('btn-all').className = `btn-toggle flex-1 text-[10px] ${m === 'all' ? 'active-tab' : 'inactive-tab'}`;
            render();
        }

        function saveData() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "LOCAL CACHE UPDATED";
            btn.style.background = "#fff";
            setTimeout(() => { btn.innerText = "Synchronize Changes"; btn.style.background = ""; render(); }, 1200);
        }
    </script>
</body>
</html>
