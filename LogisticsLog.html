<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v79.7 | Bridge Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fcd34d; --border: #475569; --input-bg: #0f172a;
            --danger: #ef4444;
        }
        [data-theme='forest'] {
            --bg-deep: #1a1c15; --bg-surface: #2d3023; --bg-card: #3f4432;
            --brand: #a3ad7e; --text-accent: #d4a373; --border: #4a4f3d; --input-bg: #1a1c15;
        }
        [data-theme='midnight'] {
            --bg-deep: #020617; --bg-surface: #0f172a; --bg-card: #1e293b;
            --brand: #38bdf8; --text-accent: #818cf8; --border: #334155; --input-bg: #020617;
        }
        [data-theme='carbon'] {
            --bg-deep: #111111; --bg-surface: #1a1a1a; --bg-card: #262626;
            --brand: #f43f5e; --text-accent: #fbbf24; --border: #404040; --input-bg: #111111;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        header { height: 60px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside { width: 440px; min-width: 440px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; }
        
        .record-card { 
            margin: 8px 12px; border-radius: 10px; padding: 14px; background: var(--bg-card); 
            border-left: 5px solid var(--brand); cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; gap: 10px;
        }
        .record-card.active { background: rgba(255,255,255,0.1); border-left-color: #fff; }

        .card-top-row { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .card-order-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; color: var(--brand); flex-shrink: 0; }
        .card-owner-label { font-size: 9px; font-weight: 900; background: rgba(0,0,0,0.2); padding: 1px 5px; border-radius: 3px; color: var(--text-main); opacity: 0.8; flex-shrink: 0; }
        .card-company-name { font-size: 11px; font-weight: 800; color: #fff; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; }
        .status-pill { font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; border: 1px solid currentColor; flex-shrink: 0; }

        .card-context-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; border-left: 3px solid var(--text-accent); }
        .card-issue-label { font-size: 10px; font-weight: 900; color: var(--text-accent); text-transform: uppercase; display: block; margin-bottom: 2px; }
        .card-desc-preview { font-size: 11px; color: var(--text-dim); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 9px; font-weight: 700; text-transform: uppercase; opacity: 0.6; }

        /* Click Interactions */
        .clickable-badge { cursor: pointer; transition: opacity 0.2s; }
        .clickable-badge:hover { opacity: 0.7; text-decoration: underline; }
        
        /* Copy Feature Styling */
        .copy-button { cursor: pointer; position: relative; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .copy-button:hover { color: #fff; }
        .copy-button:active { transform: scale(0.98); }
        .copy-confirm { position: absolute; right: 0; bottom: -20px; font-size: 9px; font-weight: 900; color: var(--brand); text-transform: uppercase; opacity: 0; transition: opacity 0.3s; }

        textarea, select, input { 
            background-color: var(--input-bg) !important; 
            border: 1px solid var(--border) !important; 
            color: var(--text-main) !important;
            border-radius: 6px;
        }

        .description-box { background: rgba(0,0,0,0.2); border: 1px dashed var(--border); padding: 20px; border-radius: 12px; border-left: 4px solid var(--text-accent); }
        .theme-select { background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text-main); font-size: 10px; font-weight: 900; padding: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-teal-600 rounded-lg flex items-center justify-center shadow-lg"><i class="fa fa-link text-white text-xs"></i></div>
                <div class="text-lg font-black uppercase tracking-tighter" style="color:var(--brand)">LOGILINK</div>
            </div>
            
            <select onchange="setTheme(this.value)" class="theme-select">
                <option value="ocean">Ocean Blue</option>
                <option value="forest">Forest Camo</option>
                <option value="midnight">Midnight</option>
                <option value="carbon">Carbon</option>
            </select>

            <input type="text" id="global-search" oninput="render()" placeholder="Filter Bridge (Order, Account, Rep...)" class="w-80 p-2 text-xs">
        </div>

        <div class="flex items-center gap-3 px-4 py-2 bg-black/20 rounded-lg border border-white/5">
            <span class="text-[9px] font-black uppercase tracking-widest opacity-40">Sync</span>
            <i id="sync-icon" class="fa fa-circle text-[8px] text-teal-400"></i>
        </div>
    </header>

    <div class="app-container">
        <aside>
            <div id="mode-bar" class="p-3 flex gap-2 border-b border-black/10">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[10px] uppercase bg-teal-600 text-slate-900">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[10px] uppercase bg-slate-700 opacity-50 text-white">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10">
                <i class="fa fa-satellite text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">System Standby</p>
            </div>

            <div id="detail-content" class="hidden w-full max-w-5xl mx-auto p-10 space-y-6">
                <div class="flex justify-between items-end border-b border-white/10 pb-6">
                    <div>
                        <div class="flex items-center gap-3 mb-1">
                            <span id="d-status" class="status-pill"></span>
                            <span id="d-date" class="text-[10px] opacity-40 font-mono italic"></span>
                        </div>
                        <h2 id="d-company" class="text-2xl font-black uppercase tracking-tight text-white"></h2>
                        <div class="flex gap-2 mt-4">
                            <span onclick="filterBy(this.innerText.replace('ACCT: ', ''))" id="d-account" class="clickable-badge text-[10px] font-bold px-2 py-1 rounded border border-white/5 bg-black/20"></span>
                            <span onclick="filterBy(this.innerText)" id="d-rep" class="clickable-badge text-[10px] font-bold px-2 py-1 bg-amber-400/10 text-amber-400 rounded border border-amber-400/20"></span>
                            <span id="d-owner" class="text-[10px] font-black px-2 py-1 bg-teal-400 text-slate-900 rounded"></span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div onclick="copyOrder()" class="copy-button">
                            <p id="d-order" class="text-xl font-black italic text-teal-400 tracking-tight"></p>
                            <i class="fa fa-copy text-xs opacity-30"></i>
                            <span id="copy-toast" class="copy-confirm">Copied</span>
                        </div>
                    </div>
                </div>

                <div class="description-box">
                    <label id="d-issue-label" class="text-[10px] font-black uppercase tracking-widest text-amber-500 block mb-2"></label>
                    <p id="d-description" class="text-lg leading-relaxed font-medium text-slate-100"></p>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase opacity-40">Warehouse Logs</label>
                        <textarea id="d-warehouse-input" class="w-full h-40 p-4 text-sm"></textarea>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black uppercase opacity-40">Driver Logs</label>
                        <textarea id="d-driver-input" class="w-full h-40 p-4 text-sm"></textarea>
                    </div>
                </div>

                <div class="flex gap-4 items-end pt-4">
                    <div class="w-72">
                        <label class="text-[10px] font-black uppercase opacity-40 block mb-2">Disposition</label>
                        <select id="d-dispo-select" class="w-full p-3 font-bold text-sm"></select>
                    </div>
                    <button onclick="saveData()" class="px-8 py-3 bg-teal-600 text-slate-900 rounded font-black uppercase text-xs flex-grow shadow-lg">Save Changes</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let db = []; let currentMode = 'active'; let currentTicketId = null;

        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        window.onload = () => { fetchData(HISTORY_URL, "FullHistory"); setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000); };

        async function fetchData(url, actionType) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-teal-400";
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType }) });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error(e); }
            setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[8px] text-teal-400"; }, 2000);
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id;
                const item = {
                    id: id,
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: r.cr714_companyordeliveryname || 'Unknown', 
                    account: r.cr714_accountnumber || 'N/A',
                    rep: r.cr714_rep || 'CSR',
                    owner: r.cr714_logisticsowner || 'Unassigned',
                    status: (r.cr714_disposition || 'Pending'), 
                    issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || r.cr714_issue || 'General Logistics',
                    description: r.cr714_description || '',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    timestamp: r.createdon ? new Date(r.createdon).getTime() : 0
                };
                const idx = db.findIndex(x => x.id === id);
                if (idx === -1) db.push(item); else db[idx] = {...db[idx], ...item};
            });
            render();
        }

        function filterBy(val) {
            document.getElementById('global-search').value = val;
            render();
        }

        function copyOrder() {
            const orderText = document.getElementById('d-order').innerText.replace('ORDER: ', '');
            navigator.clipboard.writeText(orderText);
            const toast = document.getElementById('copy-toast');
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 1500);
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const matchSearch = (t.order + t.company + t.account + t.issue + t.owner + t.rep).toLowerCase().includes(search);
                const isCompleted = t.status.includes('Completed') || t.status === 'Sent Back';
                return currentMode === 'active' ? (matchSearch && !isCompleted) : (matchSearch && isCompleted);
            }).sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            filtered.forEach(t => {
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="card-top-row">
                        <span class="card-order-num">${t.order}</span>
                        <span class="card-owner-label">${t.owner}</span>
                        <span class="card-company-name">${t.company}</span>
                        <span class="status-pill" style="border-color:var(--brand); color:var(--brand)">${t.status}</span>
                    </div>
                    <div class="card-context-box">
                        <span class="card-issue-label">${t.issue}</span>
                        <p class="card-desc-preview">${t.description}</p>
                    </div>
                    <div class="card-footer">
                        <span>${t.rep}</span>
                        <span>${t.date}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = `ORDER: ${t.order}`;
            document.getElementById('d-account').innerText = `ACCT: ${t.account}`;
            document.getElementById('d-rep').innerText = t.rep;
            document.getElementById('d-owner').innerText = t.owner;
            document.getElementById('d-status').innerText = t.status;
            document.getElementById('d-date').innerText = t.date;
            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
            document.getElementById('d-driver-input').value = t.driverNotes;
            const sel = document.getElementById('d-dispo-select');
            sel.innerHTML = ['Pending','Working on','Follow-up','Escalated','Sent Back','Completed'].map(o => `<option value="${o}" ${t.status === o ? 'selected' : ''}>${o}</option>`).join('');
            render();
        }

        function setTheme(t) { document.documentElement.setAttribute('data-theme', t); }
        function setMode(m) { 
            currentMode = m; 
            document.getElementById('btn-active').className = `flex-1 py-2 rounded font-black text-[10px] uppercase ${m==='active'?'bg-teal-600 text-slate-900':'bg-slate-700 opacity-50 text-white'}`; 
            document.getElementById('btn-all').className = `flex-1 py-2 rounded font-black text-[10px] uppercase ${m==='all'?'bg-teal-600 text-slate-900':'bg-slate-700 opacity-50 text-white'}`; 
            render(); 
        }
        function saveData() { alert('Syncing Bridge...'); }
    </script>
</body>
</html>
