<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Command v50.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-body: #f8fafc; --bg-side: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --border: #e2e8f0; --brand: #2563eb; --accent: #eff6ff;
        }

        .theme-dark {
            --bg-body: #020617; --bg-side: #0f172a; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border: #1e293b; --brand: #38bdf8; --accent: #1e293b;
        }

        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; font-size: 11px; }
        
        /* Permanent Split Layout */
        .app-grid { 
            display: grid; 
            grid-template-columns: 380px 1fr; 
            height: calc(100vh - 56px); 
        }
        
        header, aside, main { background-color: var(--bg-side); border-color: var(--border); }
        
        /* List Item Styling */
        .record-card { 
            border-bottom: 1px solid var(--border); 
            transition: all 0.2s; 
            cursor: pointer; 
            padding: 12px 16px;
        }
        .record-card:hover { background-color: var(--accent); }
        .record-card.active { 
            background-color: var(--accent); 
            border-left: 4px solid var(--brand); 
        }

        .sync-pulse {
            width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
            display: inline-block; margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .label-tiny { font-size: 8px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 2px; }
        .detail-card { background: var(--bg-body); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="theme-default" id="app-body">

    <header class="h-14 border-b flex items-center justify-between px-6 z-10">
        <div class="flex items-center gap-6">
            <div class="text-lg font-black italic tracking-tighter" style="color: var(--brand)">LOGICOMMAND <span class="text-[9px] opacity-40 not-italic">v50.0</span></div>
            <div class="relative">
                <i class="fa fa-search absolute left-3 top-2.5 text-slate-400 text-[10px]"></i>
                <input type="text" id="global-search" oninput="render()" placeholder="Search records..." class="rounded-full pl-8 pr-4 py-1.5 text-xs w-64 border bg-slate-50 focus:bg-white transition-all outline-none">
            </div>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="flex items-center text-[10px] font-bold text-slate-500">
                <span id="sync-indicator" class="sync-pulse"></span>
                AUTO-SYNCING: <span id="last-sync-time" class="ml-1 text-slate-400">Never</span>
            </div>
            <select id="filter-rep" onchange="render()" class="rounded px-2 py-1 text-[9px] font-bold border bg-white uppercase outline-none"></select>
            <button onclick="setTheme()" class="p-2 opacity-40 hover:opacity-100 transition-all"><i class="fa fa-adjust"></i></button>
        </div>
    </header>

    <div class="app-grid">
        <aside class="border-r flex flex-col bg-white overflow-hidden">
            <div class="p-3 border-b flex gap-2">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase tracking-wider bg-blue-50 text-blue-600 border border-blue-100">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded-lg font-bold text-[10px] uppercase tracking-wider text-slate-400 hover:bg-slate-50">Archive</button>
            </div>
            <div id="ticket-list" class="flex-1 overflow-y-auto">
                </div>
            <div class="p-3 bg-slate-50 border-t text-center">
                <p class="text-[9px] font-black uppercase text-slate-400">Live Traffic: <span id="stat-count" class="text-blue-600">0</span> Records Found</p>
            </div>
        </aside>

        <main id="detail-workspace" class="bg-slate-50 overflow-y-auto">
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-400 opacity-60">
                <i class="fa fa-inbox text-5xl mb-4"></i>
                <p class="font-bold uppercase tracking-widest text-xs">Select a record to view details</p>
            </div>

            <div id="detail-content" class="hidden p-8 max-w-5xl mx-auto space-y-6">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="flex items-center gap-3 mb-2">
                            <span id="d-status-badge" class="px-2 py-0.5 rounded text-[9px] font-black uppercase"></span>
                            <span id="d-id-badge" class="text-[10px] font-mono opacity-40"></span>
                        </div>
                        <h2 id="d-company" class="text-3xl font-black text-slate-900 leading-tight"></h2>
                        <p id="d-address" class="text-sm text-slate-500 mt-1"></p>
                    </div>
                    <div class="text-right">
                        <span class="label-tiny">Sales Order</span>
                        <p id="d-order" class="text-xl font-black text-blue-600"></p>
                        <span class="label-tiny mt-2">Account Number</span>
                        <p id="d-account" class="font-bold text-slate-700"></p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-xl border shadow-sm">
                        <span class="label-tiny">Driver Name</span>
                        <p id="d-driver" class="text-sm font-bold"></p>
                    </div>
                    <a id="btn-call" href="#" class="bg-blue-600 text-white p-4 rounded-xl flex items-center justify-center gap-3 hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                        <i class="fa fa-phone"></i>
                        <div class="text-left">
                            <span class="text-[8px] font-bold uppercase opacity-70 block">Click to Call</span>
                            <span id="d-phone" class="text-sm font-black"></span>
                        </div>
                    </a>
                    <a id="btn-text" href="#" class="bg-slate-900 text-white p-4 rounded-xl flex items-center justify-center gap-3 hover:bg-black transition shadow-lg">
                        <i class="fa fa-comment"></i>
                        <div class="text-left">
                            <span class="text-[8px] font-bold uppercase opacity-70 block">Click to Text</span>
                            <span class="text-sm font-black">Driver SMS</span>
                        </div>
                    </a>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-6">
                        <div class="detail-card bg-red-50 border-red-100">
                            <span class="label-tiny text-red-400">Reported Issue</span>
                            <p id="d-issue" class="text-lg font-black text-red-700 uppercase"></p>
                            <div class="h-px bg-red-200 my-3"></div>
                            <span class="label-tiny text-red-400">Full Description</span>
                            <p id="d-desc" class="text-sm text-red-900 leading-relaxed italic"></p>
                        </div>
                        
                        <div class="detail-card bg-white">
                            <span class="label-tiny">Request Details</span>
                            <div class="grid grid-cols-2 gap-4 mt-2">
                                <div>
                                    <span class="text-[9px] uppercase font-bold text-slate-400">Submitted By</span>
                                    <p id="d-submitter" class="font-bold"></p>
                                </div>
                                <div>
                                    <span class="text-[9px] uppercase font-bold text-slate-400">Timestamp</span>
                                    <p id="d-time" class="font-bold"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="flex items-center justify-between px-1">
                            <span class="label-tiny">Internal Logistics Notes</span>
                            <span class="text-[9px] text-green-600 font-bold"><i class="fa fa-check-circle"></i> Auto-saving...</span>
                        </div>
                        <textarea id="d-notes" oninput="saveLocal()" class="w-full p-6 rounded-2xl border-2 border-slate-200 h-64 text-sm focus:border-blue-500 focus:ring-4 ring-blue-50/50 outline-none transition-all shadow-inner" placeholder="Enter status updates, warehouse communication, or resolution notes here..."></textarea>
                        
                        <button id="res-btn" onclick="toggleComplete()" class="w-full py-5 rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl transform active:scale-95 transition-all"></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const FLOW_URL = 'https://49b71dde44f8e78e89bc0440816209.07.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c8534a1735ca463d9386ac5ab1c89fcf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=X3TCIX7rLqKbo5iiDAOozZ-JchO3BuPK5H8DW4aruAA';
        
        let db = JSON.parse(localStorage.getItem('logistics_db_v50')) || [];
        let currentMode = 'active'; 
        let currentTicketId = null;

        // AUTOMATIC HEARTBEAT: Runs every 60 seconds
        window.onload = () => { 
            updateRepList(); 
            render(); 
            fetchLiveData(); 
            setInterval(fetchLiveData, 60000); 
        };

        async function fetchLiveData() {
            const indicator = document.getElementById('sync-indicator');
            indicator.style.background = '#3b82f6'; // Blue while syncing
            try {
                const response = await fetch(FLOW_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "Refresh" }) 
                });
                const data = await response.json();
                if (data.value) ingest(data.value);
                
                document.getElementById('last-sync-time').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                indicator.style.background = '#22c55e'; // Green when done
            } catch (e) { 
                console.error(e);
                indicator.style.background = '#ef4444'; // Red if failed
            }
        }

        function ingest(data) {
            data.forEach(r => {
                const driverRaw = val(r, ['drivername', 'driver']);
                const phoneMatch = (val(r, ['phone', 'drivername', 'driver'])).match(/\d{3}[-\s]?\d{3}[-\s]?\d{4}/);
                
                const item = {
                    id: val(r, ['id', 'iteminternalid']),
                    account: val(r, ['accountnumber', 'account']),
                    company: val(r, ['company', 'deliverylocation']),
                    address: val(r, ['deliveryaddress', 'address']),
                    order: val(r, ['salesorder', 'ordernumber']),
                    submitter: val(r, ['name', 'submittedby', 'logisticsrep']), 
                    driver: driverRaw.split(/[0-9]/)[0].trim() || 'No Name',
                    phone: phoneMatch ? phoneMatch[0] : 'No Phone',
                    issue: val(r, ['issue', 'problem']),
                    desc: val(r, ['description', 'details']),
                    status: val(r, ['status', 'disposition']) || 'Pending',
                    timeStr: new Date(val(r, ['starttime'])).toLocaleString(),
                    timestamp: new Date(val(r, ['starttime'])).getTime()
                };

                if(item.id) {
                    const idx = db.findIndex(x => x.id === item.id);
                    if(idx > -1) db[idx] = {...item, notes: db[idx].notes || ""};
                    else db.push({...item, notes: ""});
                }
            });
            updateRepList();
            saveLocal(true);
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const repF = document.getElementById('filter-rep').value;

            const filtered = db.filter(t => (currentMode === 'all' || t.status !== 'Completed'))
                              .filter(t => repF === 'ALL' || t.submitter === repF)
                              .filter(t => JSON.stringify(t).toLowerCase().includes(search))
                              .sort((a,b) => b.timestamp - a.timestamp);

            document.getElementById('stat-count').innerText = filtered.length;
            list.innerHTML = '';

            filtered.forEach(t => {
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-[10px] font-black text-blue-600 uppercase">SO# ${t.order}</span>
                        <span class="text-[8px] font-bold opacity-40">${t.timeStr.split(',')[0]}</span>
                    </div>
                    <div class="font-black text-xs text-slate-900 truncate">${t.company}</div>
                    <div class="text-[9px] text-slate-500 truncate">${t.address}</div>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="px-1.5 py-0.5 rounded-[3px] bg-red-100 text-red-600 text-[8px] font-black uppercase">${t.issue || 'Standard'}</span>
                        <span class="text-[9px] font-bold text-slate-400">Driver: ${t.driver}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            
            document.getElementById('d-id-badge').innerText = `SYSTEM_ID: ${t.id}`;
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-address').innerText = t.address || 'Address Not Provided';
            document.getElementById('d-order').innerText = `#${t.order}`;
            document.getElementById('d-account').innerText = t.account || '---';
            document.getElementById('d-driver').innerText = t.driver;
            document.getElementById('d-phone').innerText = t.phone;
            document.getElementById('d-issue').innerText = t.issue;
            document.getElementById('d-desc').innerText = t.desc;
            document.getElementById('d-submitter').innerText = t.submitter;
            document.getElementById('d-time').innerText = t.timeStr;
            document.getElementById('d-notes').value = t.notes || '';
            
            const badge = document.getElementById('d-status-badge');
            badge.innerText = t.status;
            badge.className = `px-2 py-0.5 rounded text-[9px] font-black uppercase ${t.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`;

            const resBtn = document.getElementById('res-btn');
            if (t.status === 'Completed') {
                resBtn.innerText = "Re-open Ticket";
                resBtn.className = "w-full py-5 bg-slate-200 text-slate-700 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg";
            } else {
                resBtn.innerText = "Resolve & Close Ticket";
                resBtn.className = "w-full py-5 bg-green-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl";
            }

            if(t.phone !== 'No Phone') {
                document.getElementById('btn-call').href = `tel:${t.phone}`;
                document.getElementById('btn-text').href = `sms:${t.phone}`;
            }
            render();
        }

        function toggleComplete() {
            const t = db.find(x => x.id === currentTicketId);
            if(t) {
                t.status = (t.status === 'Completed') ? 'Pending' : 'Completed';
                saveLocal(true);
                loadTicket(t.id);
            }
        }

        function val(row, terms) {
            const keys = Object.keys(row);
            for (let t of terms) {
                const nt = t.toLowerCase().replace(/[^a-z0-9]/g, '');
                for (let k of keys) {
                    const ck = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (ck.includes(nt)) return String(row[k] || '').trim();
                }
            }
            return '';
        }

        function updateRepList() {
            const sel = document.getElementById('filter-rep');
            const reps = ["ALL", ...new Set(db.map(t => t.submitter))].filter(Boolean).sort();
            sel.innerHTML = reps.map(r => `<option value="${r}">${r.toUpperCase()}</option>`).join('');
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-50 text-blue-600 border border-blue-100' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400 hover:bg-slate-50';
            document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase bg-blue-50 text-blue-600 border border-blue-100' : 'flex-1 py-2 rounded-lg font-bold text-[10px] uppercase text-slate-400 hover:bg-slate-50';
            render();
        }

        function setTheme() { document.getElementById('app-body').classList.toggle('theme-dark'); }

        function saveLocal(reRender = false) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) t.notes = document.getElementById('d-notes').value;
            localStorage.setItem('logistics_db_v50', JSON.stringify(db));
            if (reRender) render();
        }
    </script>
</body>
</html>
