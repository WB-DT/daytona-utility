<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v104.47 | Logistics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root, [data-theme='midnight'] { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='forest'] { 
            --bg-deep: #1a1c1a; --bg-surface: #242924; --bg-card: #2d332d;      
            --brand: #a7c080; --text-main: #d3c6aa; --text-dim: #859289;     
            --text-accent: #dbbc7f; --border: #3a423a; --input-bg: #1a1c1a; --danger: #e67e80;
        }
        [data-theme='nordic'] { 
            --bg-deep: #2e3440; --bg-surface: #3b4252; --bg-card: #434c5e;      
            --brand: #88c0d0; --text-main: #eceff4; --text-dim: #d8dee9;     
            --text-accent: #ebcb8b; --border: #4c566a; --input-bg: #2e3440; --danger: #bf616a;
        }
        [data-theme='dusk'] { 
            --bg-deep: #232136; --bg-surface: #2a273f; --bg-card: #393552;      
            --brand: #ea9a97; --text-main: #e0def4; --text-dim: #908caa;     
            --text-accent: #c4a7e7; --border: #44415a; --input-bg: #232136; --danger: #eb6f92;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s ease; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside#main-gallery { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; position: relative; }
        #account-rail { width: 380px; min-width: 380px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px; display: none; }
        #account-rail.is-visible { display: block !important; }

        .record-card { margin: 6px 12px; border-radius: 8px; padding: 10px 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid var(--border); position: relative; }
        .record-card:hover { transform: translateX(4px); background: rgba(255,255,255,0.05); }
        .record-card.active-card { background: var(--brand) !important; border-left-color: var(--text-main) !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .record-card.active-card * { color: #0f172a !important; border-color: rgba(15, 23, 42, 0.3) !important; opacity: 1 !important; }

        .time-label-gallery { font-size: 11px; font-weight: 400; color: #ffffff; opacity: 0.95; letter-spacing: 0.02em; }
        .time-label-detail { font-size: 13px; font-weight: 400; color: #ffffff; opacity: 0.95; }
        .issue-card-tag { font-size: 10px; font-weight: 400; color: var(--text-accent); text-transform: uppercase; letter-spacing: 0.5px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wh-label { font-size: 10px; font-weight: 900; color: var(--brand); text-transform: uppercase; border: 1px solid var(--brand); padding: 1px 5px; border-radius: 3px; }
        .route-pill { background: var(--brand); color: var(--bg-deep); font-weight: 900; padding: 0 8px; border-radius: 4px; font-size: 11px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
        .disp-pill { font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; border: 1px solid currentColor; }

        .sidebar-item { background: rgba(0,0,0,0.1); border: 1px solid var(--border); padding: 14px; border-radius: 10px; cursor: pointer; transition: 0.2s; border-left: 4px solid var(--brand); margin-bottom: 12px; }
        .sidebar-item:hover { transform: translateX(-4px); background: var(--bg-card); }
        .sidebar-item.current-view { border-left-color: var(--text-accent); background: rgba(251, 191, 36, 0.05); outline: 1px solid var(--text-accent); }
        
        .theme-dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        #email-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 550px; border-radius: 12px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }

        @keyframes duplicate-pulse {
            0% { color: inherit; text-shadow: none; }
            50% { color: var(--danger); text-shadow: 0 0 12px var(--danger); }
            100% { color: inherit; text-shadow: none; }
        }
        .order-duplicate-alert { animation: duplicate-pulse 1s infinite ease-in-out; font-weight: 900 !important; }
        .id-badge-ghost { font-size: 8px; font-weight: 700; opacity: 0.3; text-transform: uppercase; }
        .system-debug-footer { font-family: 'JetBrains Mono', monospace; font-size: 8px; opacity: 0.2; position: absolute; bottom: 10px; right: 20px; text-transform: uppercase; pointer-events: none; letter-spacing: 1px; }
    </style>
</head>
<body data-theme="midnight">

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-[var(--brand)] rounded-lg flex items-center justify-center shadow-lg"><i class="fa fa-layer-group text-[var(--bg-deep)] text-xs"></i></div>
                <div class="text-lg font-black uppercase tracking-tighter text-[var(--brand)]">LOGILINK <span class="text-[10px] opacity-40 ml-1">v104.47</span></div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search company, order, or account..." class="w-80 bg-black/10 border border-[var(--border)] p-2 text-xs rounded text-[var(--text-main)] outline-none focus:border-[var(--brand)]">
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3 bg-black/10 p-2 rounded-full border border-[var(--border)]">
                <div onclick="setTheme('midnight')" class="theme-dot bg-[#2dd4bf]"></div>
                <div onclick="setTheme('nordic')" class="theme-dot bg-[#88c0d0]"></div>
                <div onclick="setTheme('forest')" class="theme-dot bg-[#a7c080]"></div>
                <div onclick="setTheme('dusk')" class="theme-dot bg-[#ea9a97]"></div>
            </div>
            <div id="sync-indicator"><i id="sync-icon" class="fa fa-circle text-[8px] text-[var(--brand)]"></i></div>
        </div>
    </header>

    <div class="app-container">
        <aside id="main-gallery">
            <div class="p-3 flex gap-2 border-b border-[var(--border)]">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto flex-grow"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-20 text-[var(--text-dim)]">
                <i class="fa fa-bridge text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select a Record</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto">
                <div class="max-w-4xl mx-auto p-8 space-y-8">
                    <div class="flex justify-between items-start border-b border-[var(--border)] pb-8">
                        <div class="flex-grow space-y-4">
                            <div class="flex items-baseline gap-4">
                                <h2 id="d-company" class="text-[var(--text-main)] uppercase tracking-tight text-2xl font-extrabold leading-none"></h2>
                                <span id="d-account" class="text-sm font-bold opacity-40 uppercase tracking-widest"></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span id="d-wh-badge" class="wh-label"></span>
                                <span id="d-route-badge" class="route-pill"></span>
                            </div>
                            <div class="flex items-center gap-2 text-[14px] text-[var(--text-dim)]">
                                <i class="fa fa-truck-steering text-[var(--text-accent)] text-xs"></i>
                                <span id="d-driver-info" class="font-normal uppercase tracking-tight text-[var(--text-main)]"></span>
                            </div>
                            <div class="flex flex-col gap-1.5 pt-2 border-t border-white/5 mt-2">
                                <div class="flex items-center gap-2 text-[12px]">
                                    <i class="fa fa-user-pen text-[var(--brand)] w-4 text-center"></i>
                                    <span class="font-black uppercase tracking-widest opacity-40 text-[10px]">Rep:</span>
                                    <span id="d-submit-rep" class="font-bold uppercase text-[var(--text-main)]"></span>
                                </div>
                                <div class="flex items-center gap-2 text-[12px]">
                                    <i class="fa fa-user-shield text-[var(--text-accent)] w-4 text-center"></i>
                                    <span class="font-black uppercase tracking-widest opacity-40 text-[10px]">Logistics:</span>
                                    <span id="d-logistics-owner" class="font-bold uppercase text-[var(--text-main)]"></span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex flex-col items-end w-[300px] gap-3">
                            <div onclick="copyToClipboard()" class="w-fit cursor-pointer group relative text-right">
                                <p id="d-full-time" class="time-label-detail mb-1"></p>
                                <p id="d-order" class="text-4xl font-black italic text-[var(--text-main)] leading-none hover:text-[var(--brand)] transition-colors"></p>
                                <span id="copy-toast" class="absolute -top-7 right-0 text-[10px] bg-[var(--brand)] text-[var(--bg-deep)] px-2 py-1 rounded font-black opacity-0 transition-opacity uppercase">Copied</span>
                            </div>
                            <select id="d-disposition" class="w-48 bg-[var(--bg-surface)] border border-[var(--brand)] text-[10px] font-black uppercase px-3 py-2 rounded text-[var(--brand)] outline-none cursor-pointer hover:bg-[var(--brand)] hover:text-[var(--bg-deep)] transition-all">
                                <option value="Pending">Pending</option>
                                <option value="Working">Working</option>
                                <option value="Follow-Up">Follow-Up</option>
                                <option value="Completed">Completed</option>
                                <option value="Sent Back">Sent Back</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-black/5 border-l-4 border-[var(--text-accent)] p-6 rounded-r-lg">
                        <label id="d-issue-label" class="text-[10px] font-black text-[var(--text-accent)] uppercase block mb-2 tracking-wider"></label>
                        <p id="d-description" class="font-medium text-[var(--text-main)] text-lg leading-relaxed"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-8">
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50 tracking-widest">Warehouse Updates</label>
                            <textarea id="d-warehouse-input" class="h-56 bg-black/5 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-[var(--text-main)] leading-relaxed"></textarea>
                        </div>
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50 tracking-widest">Driver Feedback</label>
                            <textarea id="d-driver-input" class="h-56 bg-black/5 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-[var(--text-main)] leading-relaxed"></textarea>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button id="rep-update-btn" onclick="openDraftModal()" class="flex-1 py-5 border-2 border-[var(--brand)] text-[var(--brand)] rounded font-black uppercase text-sm tracking-[0.2em] hover:bg-[var(--brand)] hover:text-[var(--bg-deep)] transition-all shadow-lg">Send Rep Update</button>
                        <button id="save-btn" onclick="saveRecord()" class="flex-[1.5] py-5 bg-[var(--brand)] text-[var(--bg-deep)] rounded font-black uppercase text-sm tracking-[0.2em] hover:brightness-110 shadow-xl transition-all">Save Logistics Update</button>
                    </div>
                </div>
                <div id="d-system-guid" class="system-debug-footer"></div>
            </div>
        </main>

        <aside id="account-rail">
           <h3 class="text-[12px] font-black uppercase tracking-widest text-[var(--danger)] mb-6 border-b border-[var(--border)] pb-3 text-center">Duplicate History</h3>
            <div id="rail-content"></div>
        </aside>
    </div>

    <div id="email-modal-overlay">
        <div class="modal-container">
            <div class="bg-black/20 p-5 flex justify-between items-center border-b border-[var(--border)]">
                <span class="font-black uppercase text-xs tracking-widest text-[var(--brand)]">Outlook Draft Editor</span>
                <button onclick="closeDraftModal()" class="text-[var(--text-dim)] hover:text-white transition-colors"><i class="fa fa-times"></i></button>
            </div>
            <div class="p-6 space-y-6">
                <div class="grid grid-cols-[60px_1fr] items-center gap-2">
                    <span class="text-[10px] font-black uppercase opacity-40">To:</span>
                    <span id="m-to-address" class="text-sm font-bold text-[var(--brand)]"></span>
                </div>
                <div class="grid grid-cols-[60px_1fr] items-center gap-2">
                    <span class="text-[10px] font-black uppercase opacity-40">Subj:</span>
                    <input id="m-subject" type="text" class="bg-transparent border-none text-sm font-black italic text-[var(--text-main)] outline-none w-full">
                </div>
                <div class="pt-4 border-t border-[var(--border)]">
                    <textarea id="m-body" class="w-full text-sm leading-relaxed text-[var(--text-dim)] bg-black/10 p-4 rounded-lg min-h-[250px] outline-none focus:ring-1 focus:ring-[var(--brand)] border-none"></textarea>
                </div>
            </div>
            <div class="p-6 flex gap-4 bg-black/5">
                <button onclick="closeDraftModal()" class="flex-1 py-3 text-[10px] font-black uppercase opacity-50 hover:opacity-100 transition-opacity">Discard</button>
                <button id="confirm-send-btn" onclick="sendViaFlow()" class="flex-[2] py-4 bg-[var(--brand)] text-[var(--bg-deep)] rounded font-black uppercase text-xs tracking-[0.2em] hover:brightness-110">SEND UPDATE</button>
            </div>
        </div>
    </div>

    <script>
        let db = [];
        let currentMode = 'active'; let currentTicketId = null;
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';
        const SAVE_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY';
        const SEND_EMAIL_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5473f5a058f344eaaf1d5c2544baf437/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=qgC3_5VOBOQ3U_IfsvdIcOGyhUQC98oU2-wGbvmejvQ';
        
        window.onload = () => { setMode('active'); fetchData(HISTORY_URL); };

        async function fetchData(url) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-[var(--brand)]";
            try {
                const response = await fetch(url, { method: 'POST' });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error("Sync Error:", e); }
            setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[8px] text-[var(--brand)]"; }, 2000);
        }

        function ingest(data) {
            db = data.map(r => {
                const dateObj = r.createdon ? new Date(r.createdon) : null;
                return {
                    id: r.cr714_id || 'N/A',
                    guid: (r.cr714_logisticslog_2id || r.cr714_id || '').trim().replace(/[{}]/g, ''),
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: r.cr714_companyordeliveryname || 'Unknown',
                    account: r.cr714_accountnumber || 'N/A',
                    submitRep: r.cr714_rep || 'CSR', 
                    logisticsOwner: r.cr714_logisticsowner || 'Unassigned', 
                    driverInfo: r.cr714_drivernamenumber || 'No Driver Data',
                    status: r['cr714_disposition@OData.Community.Display.V1.FormattedValue'] || r.cr714_disposition || 'Pending',
                    issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || r.cr714_issue || 'General',
                    description: r.cr714_description || '',
                    warehouse: r['cr714_warehouse@OData.Community.Display.V1.FormattedValue'] || r.cr714_warehouse || 'N/A',
                    route: r['cr714_route@OData.Community.Display.V1.FormattedValue'] || r.cr714_route || 'N/A',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                    fullStamp: dateObj ? `${dateObj.toLocaleDateString()} | ${dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : 'N/A',
                    timestamp: dateObj ? dateObj.getTime() : 0
                };
            });
            render();
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-[var(--bg-deep)] shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-slate-700/20 text-[var(--text-dim)] border border-[var(--border)]';
            document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-[var(--bg-deep)] shadow-lg' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-slate-700/20 text-[var(--text-dim)] border border-[var(--border)]';
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const match = (t.order + t.company + t.account + t.issue).toLowerCase().includes(search);
                const isFinished = t.status === 'Completed' || t.status === 'Sent Back';
                return currentMode === 'active' ? (match && !isFinished) : (match && isFinished);
            }).sort((a,b) => b.timestamp - a.timestamp);
            
            list.innerHTML = filtered.map(t => {
                const isOrderDup = db.filter(x => x.order === t.order && x.order !== 'N/A').length > 1;
                const dupClass = isOrderDup ? 'order-duplicate-alert' : '';
                return `
                <div class="record-card ${currentTicketId === t.id ? 'active-card' : ''}" onclick="loadTicket('${t.id}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="id-badge-ghost">${t.id}</span>
                        <div class="flex gap-2 items-center">
                            <span class="time-label-gallery">${t.fullStamp}</span>
                            <span class="wh-label">${t.warehouse}</span>
                        </div>
                    </div>
                    <div class="truncate font-extrabold uppercase text-[13px] mb-0.5">${t.company}</div>
                    <div class="flex justify-between items-center mt-1">
                        <span class="font-mono font-bold ${dupClass}">#${t.order}</span>
                        <span class="disp-pill" style="color: ${t.status === 'Pending' ? 'var(--text-accent)' : 'var(--brand)'}">${t.status}</span>
                    </div>
                    <div class="mt-2 flex justify-between items-end gap-2 border-t border-white/5 pt-2">
                        <span class="issue-card-tag flex-grow">${t.issue}</span>
                        <div class="flex flex-col text-[11px] font-normal uppercase text-right leading-[1.2] opacity-70">
                            <span class="text-[var(--text-dim)]">Rep: ${t.submitRep}</span>
                            <span class="text-[var(--brand)]">${t.logisticsOwner}</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            render();
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-full-time').innerText = t.fullStamp;
            document.getElementById('d-account').innerText = `#${t.account}`;
            document.getElementById('d-wh-badge').innerText = t.warehouse;
            document.getElementById('d-route-badge').innerText = `RT: ${t.route}`;
            document.getElementById('d-driver-info').innerText = t.driverInfo;
            document.getElementById('d-submit-rep').innerText = t.submitRep;
            document.getElementById('d-logistics-owner').innerText = t.logisticsOwner;
            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
            document.getElementById('d-driver-input').value = t.driverNotes;
            document.getElementById('d-disposition').value = t.status;
            document.getElementById('d-system-guid').innerText = `Record ID: ${t.guid}`;
            updateSidebar(t.order);
        }

        function updateSidebar(orderNumber) {
            const rail = document.getElementById('account-rail');
            const content = document.getElementById('rail-content');
            const matches = db.filter(x => x.order === orderNumber && orderNumber !== 'N/A');
            if (matches.length > 1) {
                rail.classList.add('is-visible');
                content.innerHTML = matches.map(m => `
                    <div class="sidebar-item ${m.id === currentTicketId ? 'current-view' : ''}" onclick="loadTicket('${m.id}')">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-black opacity-50 uppercase">${m.fullStamp}</span>
                            <span class="text-[9px] border border-current px-1.5 py-0.5 rounded font-bold uppercase" style="color: ${m.status === 'Pending' ? 'var(--text-accent)' : 'var(--brand)'}">${m.status}</span>
                        </div>
                        <div class="font-mono font-black text-[var(--brand)] text-sm mb-1">#${m.order}</div>
                        <div class="text-[11px] font-normal uppercase mb-1 flex flex-col gap-0.5 opacity-60">
                            <span>Rep: ${m.submitRep}</span>
                            <span class="text-[var(--text-accent)]">${m.logisticsOwner}</span>
                        </div>
                        <div class="issue-card-tag text-[9px] mt-2 border-t border-white/5 pt-1">${m.issue}</div>
                    </div>
                `).join('');
            } else { rail.classList.remove('is-visible'); }
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(document.getElementById('d-order').innerText);
            const toast = document.getElementById('copy-toast');
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        function openDraftModal() {
            const t = db.find(x => x.id === currentTicketId);
            if(!t) return;
            const emailAddr = `${t.submitRep.toLowerCase().replace(/\s+/g, '.')}@wbmason.com`;
            document.getElementById('m-to-address').innerText = emailAddr;
            document.getElementById('m-subject').value = `Logistics Update: Order #${t.order} (${t.company})`;
            document.getElementById('m-body').value = `Hello,\n\nFollowing up on Order #${t.order} for ${t.company}.\n\nSTATUS: ${document.getElementById('d-disposition').value}\n\nWAREHOUSE NOTES:\n${document.getElementById('d-warehouse-input').value || "No warehouse notes recorded yet."}\n\nPlease let us know if you have any questions.\n\nBest,\nLogistics Department`;
            document.getElementById('email-modal-overlay').style.display = 'flex';
        }

        function closeDraftModal() { document.getElementById('email-modal-overlay').style.display = 'none'; }

        async function saveRecord() {
            const btn = document.getElementById('save-btn');
            // LAG FIX: Pull direct from the active ticket object already in memory
            const t = db.find(x => x.id === currentTicketId);
            if(!t || !t.guid) {
                alert("Critical Error: GUID not found for this record.");
                return;
            }
            
            btn.innerText = "SAVING...";
            btn.disabled = true;

            const payload = {
                recordId: t.guid,
                disposition: document.getElementById('d-disposition').value,
                warehouseNotes: document.getElementById('d-warehouse-input').value,
                driverNotes: document.getElementById('d-driver-input').value
            };

            try {
                const response = await fetch(SAVE_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error();

                // Update local memory so UI stays in sync without a full refresh
                t.status = payload.disposition;
                t.warehouseNotes = payload.warehouseNotes;
                t.driverNotes = payload.driverNotes;
                
                btn.innerText = "SUCCESS";
                setTimeout(() => { 
                    btn.innerText = "Save Logistics Update"; 
                    btn.disabled = false;
                    render();
                }, 1500);
            } catch (e) {
                console.error("Save Error:", e);
                alert("Save Failed: Check Connection or Power Automate Status.");
                btn.innerText = "RETRY SAVE";
                btn.disabled = false;
            }
        }

        async function sendViaFlow() {
            const btn = document.getElementById('confirm-send-btn');
            btn.innerText = "SENDING..."; btn.disabled = true;
            
            const formattedBody = document.getElementById('m-body').value.replace(/\n/g, "<br>");
            
            const payload = { 
                to: document.getElementById('m-to-address').innerText, 
                subject: document.getElementById('m-subject').value, 
                body: formattedBody 
            };
            
            try {
                const response = await fetch(SEND_EMAIL_FLOW_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
                if (!response.ok) throw new Error();
                btn.innerText = "SENT SUCCESSFULLY";
                setTimeout(() => { closeDraftModal(); btn.innerText = "SEND UPDATE"; btn.disabled = false; }, 1500);
            } catch (e) { 
                alert("Flow Error: Could not send email."); 
                btn.innerText = "RETRY SEND"; 
                btn.disabled = false; 
            }
        }

        function setTheme(t) { document.body.setAttribute('data-theme', t); }
    </script>
</body>
</html>
