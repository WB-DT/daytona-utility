<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v101 | Bridge Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fcd34d; --border: #475569; --input-bg: #0f172a;
            --danger: #ef4444;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        header { height: 60px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside { width: 400px; min-width: 400px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; }
        
        #history-rail { width: 300px; min-width: 300px; background: var(--bg-surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px 15px; }

        .record-card { 
            margin: 8px 12px; border-radius: 10px; padding: 14px; background: var(--bg-card); 
            border-left: 5px solid var(--brand); cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; gap: 6px; position: relative;
        }
        .record-card.active { background: rgba(255,255,255,0.15); border-left-color: #fff; }

        .card-company-name { font-size: 13px; font-weight: 800; color: #fff; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub-row { display: flex; align-items: center; gap: 10px; font-size: 10px; font-weight: 700; color: var(--text-dim); }
        .card-order-num { font-family: 'JetBrains Mono', monospace; color: var(--brand); font-weight: 800; }
        .card-owner-label { background: rgba(0,0,0,0.2); padding: 1px 5px; border-radius: 3px; font-size: 9px; text-transform: uppercase; color: var(--text-main); }
        .status-pill { font-size: 8px; padding: 1px 6px; border-radius: 4px; font-weight: 900; text-transform: uppercase; border: 1px solid currentColor; }

        .dup-alert { background: var(--danger); color: white; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 4px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .card-context-box { background: rgba(0,0,0,0.2); padding: 8px 10px; border-radius: 6px; border-left: 3px solid var(--text-accent); margin-top: 4px; }
        .card-issue-label { font-size: 9px; font-weight: 900; color: var(--text-accent); text-transform: uppercase; }
        .card-desc-preview { font-size: 11px; color: var(--text-dim); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .hist-mini-card { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 10px; font-size: 11px; }
        textarea, select, input { background-color: var(--input-bg) !important; border: 1px solid var(--border) !important; color: var(--text-main) !important; border-radius: 6px; }

        .modal-overlay { background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <div id="email-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
        <div class="bg-[var(--bg-surface)] w-full max-w-2xl rounded-2xl border border-[var(--border)] shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-[var(--border)] flex justify-between items-center bg-black/20">
                <h3 class="text-lg font-black uppercase tracking-tight text-[var(--brand)]">Draft Update for Rep</h3>
                <button onclick="closeEmailModal()" class="text-[var(--text-dim)] hover:text-white"><i class="fa fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="text-[10px] font-black uppercase opacity-50 block mb-1">To (Testing Mode)</label>
                    <input type="text" value="anslee.erickson@wbmason.com" disabled class="w-full bg-black/20 border border-[var(--border)] p-2 rounded text-xs opacity-60">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase opacity-50 block mb-1">Subject</label>
                    <input type="text" id="m-email-subject" class="w-full bg-black/20 border border-[var(--border)] p-2 rounded text-xs font-bold">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase opacity-50 block mb-1">Message Body</label>
                    <textarea id="m-email-body" class="w-full h-64 bg-black/20 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)]"></textarea>
                </div>
            </div>
            <div class="p-6 bg-black/10 border-t border-[var(--border)] flex gap-3">
                <button onclick="closeEmailModal()" class="flex-1 py-3 border border-[var(--border)] rounded font-black uppercase text-xs hover:bg-white/5">Cancel</button>
                <button onclick="triggerEmailFlow()" class="flex-1 py-3 bg-[var(--brand)] text-[var(--bg-deep)] rounded font-black uppercase text-xs hover:brightness-110">Send to Rep</button>
            </div>
        </div>
    </div>

    <header>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-teal-600 rounded-lg flex items-center justify-center shadow-lg"><i class="fa fa-link text-white text-xs"></i></div>
                <div class="text-lg font-black uppercase tracking-tighter" style="color:var(--brand)">LOGILINK</div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Filter records..." class="w-80 p-2 text-xs">
        </div>
        <div class="px-4 py-2 bg-black/20 rounded-lg border border-white/5 flex items-center gap-2">
            <span id="sync-icon" class="fa fa-circle text-[8px] text-teal-400"></span>
            <span class="text-[9px] font-black uppercase tracking-widest opacity-40">Live Bridge</span>
        </div>
    </header>

    <div class="app-container">
        <aside>
            <div class="p-3 flex gap-2 border-b border-black/10">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[10px] uppercase bg-teal-600 text-slate-900">Active Issues</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[10px] uppercase bg-slate-700 opacity-50 text-white">Closed Bridge</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-10">
                <i class="fa fa-satellite text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Standby</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto">
                <div class="max-w-4xl mx-auto p-10 space-y-6">
                    <div id="dup-warning" class="hidden bg-red-500/20 border border-red-500 p-3 rounded-lg flex items-center gap-3">
                        <i class="fa fa-triangle-exclamation text-red-500"></i>
                        <span class="text-xs font-black uppercase text-red-500 tracking-widest">Duplicate Detected</span>
                    </div>

                    <div class="flex justify-between items-end border-b border-white/10 pb-6">
                        <div>
                            <div class="flex items-center gap-3 mb-1">
                                <span id="d-status" class="status-pill"></span>
                                <span id="d-date" class="text-[10px] opacity-40 font-mono italic"></span>
                            </div>
                            <h2 id="d-company" class="text-2xl font-black uppercase tracking-tight text-white"></h2>
                            <div class="flex gap-2 mt-4">
                                <span id="d-account" class="text-[10px] font-bold px-2 py-1 rounded border border-white/5 bg-black/20"></span>
                                <span id="d-rep" class="text-[10px] font-bold px-2 py-1 bg-amber-400/10 text-amber-400 rounded"></span>
                                <span id="d-owner" class="text-[10px] font-black px-2 py-1 bg-teal-400 text-slate-900 rounded"></span>
                            </div>
                        </div>
                        <div class="text-right">
                            <p id="d-order" class="text-xl font-black italic text-teal-400 tracking-tight"></p>
                        </div>
                    </div>

                    <div class="p-6 bg-black/20 border-l-4 border-amber-500 rounded-r-lg">
                        <label id="d-issue-label" class="text-[10px] font-black uppercase tracking-widest text-amber-500 block mb-2"></label>
                        <p id="d-description" class="text-lg leading-relaxed font-medium text-slate-100"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase opacity-40">Warehouse Logs</label>
                            <textarea id="d-warehouse-input" class="w-full h-40 p-4 text-sm"></textarea>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black uppercase opacity-40">Driver Logs</label>
                            <textarea id="d-driver-input" class="w-full h-40 p-4 text-sm"></textarea>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 pt-4 max-w-xs">
                        <div class="w-full">
                            <label class="text-[10px] font-black uppercase opacity-40 block mb-1">Disposition</label>
                            <select id="d-dispo-select" class="w-full p-2 font-bold text-xs uppercase tracking-widest"></select>
                        </div>
                        <button id="save-btn" onclick="saveRecord()" class="w-full py-3 bg-[var(--brand)] text-[var(--bg-deep)] rounded-lg font-black uppercase text-xs tracking-widest hover:brightness-110 shadow-md">
                            Save
                        </button>
                        <button id="email-btn" onclick="openEmailModal()" class="w-full py-3 border-2 border-[var(--brand)] text-[var(--brand)] rounded-lg font-black uppercase text-xs tracking-widest hover:bg-[var(--brand)]/10 flex items-center justify-center gap-2">
                            <i class="fa fa-envelope-open-text"></i> Email Rep Update
                        </button>
                    </div>
                </div>
            </div>

            <div id="history-rail" class="hidden">
                <h3 class="text-[10px] font-black uppercase tracking-widest opacity-40 mb-4">Account Tasks</h3>
                <div id="history-rail-content"></div>
            </div>
        </main>
    </div>

    <script>
        let db = []; let currentMode = 'active'; let currentTicketId = null;

        const WATCHDOG_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fe5736e80bde4c4e8510a916858d9259/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=YU0Gvel3_-TquXHvdmU6GZ9Nli1R6ElS2TZMHxubJi8';
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';

        window.onload = () => { fetchData(HISTORY_URL, "FullHistory"); setInterval(() => fetchData(WATCHDOG_URL, "TodayOnly"), 300000); };

        async function fetchData(url, actionType) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-teal-400";
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: actionType }) });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error(e); }
            setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[8px] text-teal-400"; }, 2000);
        }

        function ingest(data) {
            data.forEach(r => {
                const id = r.cr714_logisticslog_2id || r.cr714_id;
                const item = {
                    id: id,
                    order: (r.cr714_salesordernumber || 'N/A').trim(),
                    company: r.cr714_companyordeliveryname || 'Unknown', 
                    account: r.cr714_accountnumber || 'N/A',
                    rep: r.cr714_rep || 'CSR',
                    owner: r.cr714_logisticsowner || 'Unassigned',
                    status: (r.cr714_disposition || 'Pending'), 
                    issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || r.cr714_issue || 'General Logistics',
                    description: r.cr714_description || '',
                    warehouseNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    driverNotes: r.cr714_receivedtextfromdrivernotes || '',
                    date: r['createdon@OData.Community.Display.V1.FormattedValue'] || 'N/A',
                    timestamp: r.createdon ? new Date(r.createdon).getTime() : 0
                };
                const idx = db.findIndex(x => x.id === id);
                if (idx === -1) db.push(item); else db[idx] = {...db[idx], ...item};
            });
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const matchSearch = (t.order + t.company + t.account + t.issue + t.owner + t.rep).toLowerCase().includes(search);
                const isCompleted = t.status.includes('Completed') || t.status === 'Sent Back';
                return currentMode === 'active' ? (matchSearch && !isCompleted) : (matchSearch && isCompleted);
            }).sort((a,b) => b.timestamp - a.timestamp);

            list.innerHTML = '';
            filtered.forEach(t => {
                const isDup = db.filter(x => x.order === t.order && t.order !== 'N/A').length > 1;
                const div = document.createElement('div');
                div.className = `record-card ${currentTicketId === t.id ? 'active' : ''}`;
                div.onclick = () => loadTicket(t.id);
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="card-company-name">${t.company}</div>
                        ${isDup ? '<span class="dup-alert">DUP</span>' : ''}
                    </div>
                    <div class="card-sub-row">
                        <span class="card-order-num">${t.order}</span>
                        <span class="card-owner-label">${t.owner}</span>
                        <span class="status-pill" style="border-color:var(--brand); color:var(--brand)">${t.status}</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('history-rail').classList.remove('hidden');

            const isDup = db.filter(x => x.order === t.order && t.order !== 'N/A').length > 1;
            document.getElementById('dup-warning').className = isDup ? "bg-red-500/20 border border-red-500 p-3 rounded-lg flex items-center gap-3 mb-6" : "hidden";

            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-account').innerText = `ACCT: ${t.account}`;
            document.getElementById('d-rep').innerText = `REP: ${t.rep}`;
            document.getElementById('d-owner').innerText = t.owner;
            document.getElementById('d-status').innerText = t.status;
            document.getElementById('d-date').innerText = t.date;
            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.warehouseNotes;
            document.getElementById('d-driver-input').value = t.driverNotes;
            
            const sel = document.getElementById('d-dispo-select');
            sel.innerHTML = ['Pending','Working on','Follow-up','Escalated','Sent Back','Completed'].map(o => `<option value="${o}" ${t.status === o ? 'selected' : ''}>${o}</option>`).join('');
            
            const openHistory = db.filter(x => x.account === t.account && x.id !== t.id && !x.status.includes('Completed')).sort((a,b) => b.timestamp - a.timestamp);
            document.getElementById('history-rail-content').innerHTML = openHistory.map(h => `
                <div class="hist-mini-card" onclick="loadTicket('${h.id}')" style="cursor:pointer">
                    <span class="font-bold text-teal-400 text-[10px]">${h.order}</span>
                    <div class="text-[9px] opacity-40">${h.status}</div>
                </div>
            `).join('');

            render();
        }

        function openEmailModal() {
            const t = db.find(x => x.id === currentTicketId);
            if(!t) return;
            const wh = document.getElementById('d-warehouse-input').value;
            const dr = document.getElementById('d-driver-input').value;

            document.getElementById('m-email-subject').value = `Logistics Update: Order #${t.order} | ${t.company}`;
            document.getElementById('m-email-body').value = `Hi,\n\nUpdate regarding Order #${t.order} for ${t.company}.\n\nWarehouse:\n${wh || 'N/A'}\n\nDriver:\n${dr || 'N/A'}\n\nBest,\nLogistics Team`;
            document.getElementById('email-modal').classList.remove('hidden');
        }

        function closeEmailModal() { document.getElementById('email-modal').classList.add('hidden'); }

        function triggerEmailFlow() {
            alert('Email logic not yet connected to flow.');
            closeEmailModal();
        }

        function saveRecord() { alert('Dataverse logic not yet connected to flow.'); }

        function setMode(m) { 
            currentMode = m; 
            document.getElementById('btn-active').className = `flex-1 py-2 rounded font-black text-[10px] uppercase ${m==='active'?'bg-teal-600 text-slate-900':'bg-slate-700 opacity-50 text-white'}`; 
            document.getElementById('btn-all').className = `flex-1 py-2 rounded font-black text-[10px] uppercase ${m==='all'?'bg-teal-600 text-slate-900':'bg-slate-700 opacity-50 text-white'}`; 
            render(); 
        }
    </script>
</body>
</html>
