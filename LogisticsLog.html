<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Log v27.0 (Full Integration)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: { 
                    colors: { 
                        slate: { 850: '#1a202c', 900: '#0f172a', 950: '#020617' },
                        primary: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                } 
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .app-grid { display: grid; grid-template-columns: 280px 1fr 450px; height: 100%; transition: all 0.3s ease; }
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
        .ticket-card:hover { transform: translateX(2px); }
        .ticket-card.active { border-left: 4px solid #3b82f6; background-color: #eff6ff; }
        .dark .ticket-card.active { background-color: #1e293b; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">

    <header class="h-14 bg-white dark:bg-slate-900 border-b dark:border-slate-800 flex items-center justify-between px-4 z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center text-white font-bold">L</div>
            <h1 class="font-bold text-lg hidden md:block">Logistics Manager</h1>
            <div id="live-indicator" class="hidden flex items-center gap-2 ml-4 px-2 py-0.5 bg-green-50 text-green-700 rounded-full text-[10px] font-bold uppercase border border-green-200">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Live
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="relative">
                <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="search" oninput="render()" placeholder="Search company, ID, or route..." 
                    class="pl-9 pr-4 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-full text-xs w-64 focus:ring-2 ring-primary-500 outline-none">
            </div>
            <button onclick="fetchLiveData()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors" title="Refresh Data">
                <i class="fa fa-sync-alt text-gray-500"></i>
            </button>
            <div class="h-8 w-[1px] bg-gray-200 dark:bg-gray-700"></div>
            <div class="text-right">
                <p id="user-email" class="text-[10px] font-medium text-gray-500">Not Logged In</p>
            </div>
        </div>
    </header>

    <div class="app-grid">
        <aside class="bg-white dark:bg-slate-900 border-r dark:border-slate-800 flex flex-col">
            <div class="p-4 space-y-1">
                <button onclick="setMode('today')" id="btn-today" class="nav-btn w-full flex items-center justify-between p-2.5 rounded-lg bg-primary-50 text-primary-600 dark:bg-primary-900/20 font-medium text-sm">
                    <div class="flex items-center gap-3"><i class="fa fa-calendar-day"></i> Live Today</div>
                    <span id="count-today" class="text-[10px] bg-white px-1.5 rounded border">0</span>
                </button>
                <button onclick="setMode('pending')" id="btn-pending" class="nav-btn w-full flex items-center justify-between p-2.5 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-800 text-gray-600 dark:text-gray-400 font-medium text-sm">
                    <div class="flex items-center gap-3"><i class="fa fa-clock"></i> Live Pending</div>
                    <span id="count-pending" class="text-[10px] bg-gray-100 px-1.5 rounded border">0</span>
                </button>
                <button onclick="setMode('all')" id="btn-all" class="nav-btn w-full flex items-center justify-between p-2.5 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-800 text-gray-600 dark:text-gray-400 font-medium text-sm">
                    <div class="flex items-center gap-3"><i class="fa fa-list"></i> All Records</div>
                </button>
            </div>
            
            <div class="mt-auto p-4 border-t dark:border-slate-800">
                <label class="block w-full text-center p-3 border-2 border-dashed border-gray-300 dark:border-slate-700 rounded-xl hover:border-primary-500 transition-colors cursor-pointer">
                    <i class="fa fa-file-excel text-green-600 mb-1"></i>
                    <p class="text-[10px] text-gray-500">Upload Excel</p>
                    <input type="file" class="hidden" onchange="handleFile(event)" accept=".xlsx, .xls">
                </label>
            </div>
        </aside>

        <main class="flex flex-col bg-white dark:bg-slate-950 overflow-hidden">
            <div class="overflow-y-auto custom-scroll flex-1">
                <table class="w-full text-left border-collapse">
                    <thead class="sticky top-0 bg-white dark:bg-slate-900 shadow-sm z-10">
                        <tr class="text-[10px] uppercase text-gray-400 font-bold">
                            <th class="p-3 w-16">ID</th>
                            <th class="p-3">Customer & Route</th>
                            <th class="p-3">Issue</th>
                            <th class="p-3">Logistics Owner</th>
                            <th class="p-3 text-right">Status</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-list" class="divide-y dark:divide-gray-800">
                        </tbody>
                </table>
                <div id="empty-state" class="hidden flex flex-col items-center justify-center p-20 text-center">
                    <i class="fa fa-inbox text-4xl text-gray-200 mb-4"></i>
                    <p class="text-gray-500 font-medium">No records found for this view</p>
                    <p class="text-xs text-gray-400 mt-1">Try switching to "All Records"</p>
                </div>
            </div>
        </main>

        <aside id="detail-panel" class="bg-slate-50 dark:bg-slate-900 border-l dark:border-slate-800 p-6 overflow-y-auto custom-scroll hidden">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="d-company" class="text-xl font-bold leading-tight">Customer Name</h2>
                    <p id="d-meta" class="text-xs text-gray-500 mt-1 uppercase tracking-wider font-semibold"></p>
                </div>
                <span id="d-badge" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase">PENDING</span>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm border dark:border-slate-700">
                    <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Rep Name</p>
                    <p id="d-rep" class="text-sm font-medium">-</p>
                </div>
                <div class="bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm border dark:border-slate-700">
                    <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Account #</p>
                    <p id="d-account" class="text-sm font-medium">-</p>
                </div>
            </div>

            <div class="space-y-4">
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700">
                    <label class="block text-[10px] text-gray-400 uppercase font-bold mb-2">Driver Contact</label>
                    <div class="flex items-center justify-between">
                        <p id="d-driver" class="text-sm font-medium">-</p>
                        <a id="btn-call" href="#" class="p-2 bg-blue-50 text-blue-600 rounded-full hover:bg-blue-100">
                            <i class="fa fa-phone"></i>
                        </a>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700">
                    <label class="block text-[10px] text-gray-400 uppercase font-bold mb-2">Issue Description</label>
                    <p id="d-issue" class="text-sm font-bold text-red-600 mb-2"></p>
                    <p id="d-desc" class="text-xs text-gray-600 leading-relaxed"></p>
                </div>

                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border dark:border-slate-700">
                    <label class="block text-[10px] text-gray-400 uppercase font-bold mb-2">Internal Logistics Notes</label>
                    <textarea id="d-notes" class="w-full text-xs p-3 rounded-lg border dark:bg-slate-900 dark:border-slate-700 outline-none focus:ring-2 ring-primary-500" rows="4" placeholder="Enter updates..."></textarea>
                    
                    <div class="flex gap-2 mt-4">
                        <select id="d-owner" class="flex-1 text-xs p-2 rounded border dark:bg-slate-900 dark:border-slate-700">
                            <option value="">Unassigned</option>
                            <option value="Kari">Kari</option>
                            <option value="Wayne">Wayne</option>
                            <option value="Holly">Holly</option>
                        </select>
                        <button onclick="setStatus('Completed')" class="px-4 py-2 bg-green-600 text-white text-xs font-bold rounded-lg hover:bg-green-700 uppercase">Complete</button>
                        <button onclick="saveLocal()" class="px-4 py-2 bg-primary-600 text-white text-xs font-bold rounded-lg hover:bg-primary-700 uppercase">Save</button>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const FLOW_URL = 'https://prod-36.westus.logic.azure.com:443/workflows/4553b342045e43a99e71ec6464016a5d/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=r9VIdV79vB-91t2fO9FvH6w_6H0vX7H9pL7S7J7G7Y0';
        
        const msalConfig = {
            auth: {
                clientId: 'eb58b5a1-9430-4e3e-9036-7494f6f43702',
                authority: 'https://login.microsoftonline.com/a4260f89-8d6b-4395-926b-1667d4f40d75'
            }
        };

        const loginRequest = { scopes: ["User.Read"] };
        const msalClient = new msal.PublicClientApplication(msalConfig);
        
        let db = JSON.parse(localStorage.getItem('logistics_db')) || [];
        let currentMode = 'today';
        let currentTicketId = null;
        let currentUserEmail = "";

        // Today's Date String for filtering
        const todayStr = new Date(new Date().getTime() - (new Date().getTimezoneOffset() * 60000)).toISOString().split('T')[0];

        async function checkUser() {
            try {
                const resp = await msalClient.handleRedirectPromise();
                const accounts = msalClient.getAllAccounts();
                if (accounts.length > 0) {
                    currentUserEmail = accounts[0].username;
                    document.getElementById('user-email').innerText = currentUserEmail;
                    fetchLiveData();
                } else {
                    await msalClient.loginPopup(loginRequest);
                    checkUser();
                }
            } catch (e) {
                console.error("Login Error", e);
            }
        }

        async function fetchLiveData() {
            try {
                const response = await fetch(FLOW_URL, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ action: "Refresh", userEmail: currentUserEmail }) 
                });
                
                if(response.ok) {
                    const json = await response.json();
                    let flowData = [];
                    
                    // Robust parser for the stringified body in your JSON 
                    if (json.body && typeof json.body === 'string') {
                        try {
                            const parsed = JSON.parse(json.body);
                            flowData = parsed.value || parsed;
                        } catch(e) { console.error("Parse Error", e); }
                    } else if (json.data) {
                        flowData = json.data;
                    } else if (json.schema && json.schema.data) {
                        flowData = json.schema.data;
                    }

                    if (Array.isArray(flowData) && flowData.length > 0) {
                        ingestData(flowData);
                        document.getElementById('live-indicator').classList.remove('hidden');
                    }
                }
            } catch (err) {
                console.error("Fetch Error", err);
            }
        }

        function val(r, keys) {
            const normalizedRow = {};
            // Clean up all JSON keys: lowercase and alphanumeric only 
            Object.keys(r).forEach(k => { 
                normalizedRow[k.toLowerCase().replace(/[^a-z0-9]/g,'')] = r[k]; 
            });
            for(let k of keys) {
                const searchKey = k.toLowerCase().replace(/[^a-z0-9]/g,'');
                if(normalizedRow[searchKey] !== undefined && normalizedRow[searchKey] !== null) {
                    return String(normalizedRow[searchKey]).trim();
                }
            }
            return '';
        }

        function ingestData(data) {
            data.forEach(r => {
                const rawDate = val(r, ['starttime', 'start_time', 'date']);
                const t = {
                    id: val(r, ['id']),
                    date: rawDate.includes('T') ? rawDate.split('T')[0] : rawDate,
                    email: val(r, ['email']),
                    rep: val(r, ['name', 'rep', 'repname']),
                    company: val(r, ['companynameandordeliverylocationname', 'company', 'name']),
                    account: val(r, ['accountnumber', 'account', 'account_number']),
                    route: val(r, ['route']),
                    warehouse: val(r, ['warehousexxxxxxinthisformatplease_x002e_', 'warehouse', 'wh']),
                    driverRaw: val(r, ['drivernamenumber', 'driver', 'driver_name']),
                    issue: val(r, ['issue', 'issue_type']),
                    description: val(r, ['description_x003a_', 'description']),
                    owner: val(r, ['logisticsowner', 'owner']),
                    notes: val(r, ['logisticsnotes_x003a_', 'logistics_notes', 'notes']),
                    status: val(r, ['disposition', 'status']) || 'Pending'
                };
                
                if(!t.id) return;
                const idx = db.findIndex(x => x.id === t.id);
                if(idx > -1) db[idx] = { ...db[idx], ...t };
                else db.push(t);
            });
            
            // AUTO-ADJUST: If today is empty, switch to 'all' so the user sees data
            const hasToday = db.some(x => x.date === todayStr);
            if(!hasToday && currentMode === 'today') currentMode = 'all';

            saveLocal(true);
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('search').value.toLowerCase();
            list.innerHTML = '';
            
            let filtered = db.filter(t => {
                const searchStr = (t.company + t.id + t.rep + t.route + t.issue).toLowerCase();
                if(search && !searchStr.includes(search)) return false;
                
                if(currentMode === 'today' && t.date !== todayStr) return false;
                if(currentMode === 'pending' && t.status.toLowerCase().includes('complete')) return false;
                
                return true;
            });

            document.getElementById('count-today').innerText = db.filter(x => x.date === todayStr).length;
            document.getElementById('count-pending').innerText = db.filter(x => !x.status.toLowerCase().includes('complete')).length;
            document.getElementById('empty-state').classList.toggle('hidden', filtered.length > 0);

            filtered.sort((a,b) => b.id - a.id).forEach(t => {
                const tr = document.createElement('tr');
                tr.className = `border-b dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition-colors ${currentTicketId === t.id ? 'bg-blue-50/50 dark:bg-blue-900/10' : ''}`;
                tr.onclick = () => loadTicket(t.id);
                
                tr.innerHTML = `
                    <td class="p-3 text-xs font-mono font-bold text-gray-400">${t.id}</td>
                    <td class="p-3">
                        <div class="text-sm font-bold">${t.company || 'Unknown Customer'}</div>
                        <div class="text-[10px] text-gray-500 uppercase">${t.route || 'No Route'} | ${t.warehouse || 'N/A'}</div>
                    </td>
                    <td class="p-3 text-xs">${t.issue}</td>
                    <td class="p-3 text-xs text-gray-500">${t.owner || '---'}</td>
                    <td class="p-3 text-right">
                        <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${t.status.toLowerCase().includes('complete') ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                            ${t.status}
                        </span>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;

            document.getElementById('detail-panel').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-meta').innerText = `${t.route} • ${t.warehouse} • ID #${t.id}`;
            document.getElementById('d-rep').innerText = t.rep;
            document.getElementById('d-account').innerText = t.account;
            document.getElementById('d-driver').innerText = t.driverRaw;
            document.getElementById('d-issue').innerText = t.issue;
            document.getElementById('d-desc').innerText = t.description;
            document.getElementById('d-notes').value = t.notes;
            document.getElementById('d-owner').value = t.owner;
            
            const b = document.getElementById('d-badge');
            b.innerText = t.status;
            b.className = t.status.toLowerCase().includes('complete') ? 'px-2.5 py-1 rounded text-[10px] font-bold uppercase bg-green-100 text-green-700' : 'px-2.5 py-1 rounded text-[10px] font-bold uppercase bg-yellow-100 text-yellow-700';

            const ph = t.driverRaw ? t.driverRaw.match(/[\d\-\.\s]{10,}/) : null;
            document.getElementById('btn-call').href = ph ? `tel:${ph[0].replace(/[^0-9]/g,'')}` : '#';
            render();
        }

        function setMode(m) {
            currentMode = m;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('bg-primary-50', 'text-primary-600', 'dark:bg-primary-900/20'));
            document.getElementById('btn-' + m).classList.add('bg-primary-50', 'text-primary-600', 'dark:bg-primary-900/20');
            render();
        }

        function setStatus(s) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) { t.status = s; saveLocal(true); }
        }

        function saveLocal(refresh = false) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) {
                t.notes = document.getElementById('d-notes').value;
                t.owner = document.getElementById('d-owner').value;
            }
            localStorage.setItem('logistics_db', JSON.stringify(db));
            if(refresh) render();
            Toastify({ text: "💾 Data Synced", duration: 2000, style: { background: "#10b981" } }).showToast();
        }

        function handleFile(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (evt) => {
                const data = evt.target.result;
                const workbook = XLSX.read(data, { type: 'binary' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                ingestData(rows);
            };
            reader.readAsBinaryString(file);
        }

        window.onload = checkUser;
    </script>
</body>
</html>
