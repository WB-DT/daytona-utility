<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Command v48.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>

    <style>
        :root {
            --bg-body: #f1f5f9; --bg-side: #ffffff; --text-main: #0f172a;
            --text-muted: #64748b; --border: #e2e8f0; --brand: #2563eb; --accent: #eff6ff;
        }

        .theme-dark {
            --bg-body: #020617; --bg-side: #0f172a; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border: #1e293b; --brand: #38bdf8; --accent: #1e293b;
        }

        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; font-size: 12px; }
        .app-grid { display: grid; grid-template-columns: 200px 1fr 0px; height: calc(100vh - 64px); transition: all 0.3s ease; }
        .app-grid.show-detail { grid-template-columns: 200px 1fr 450px; }
        
        header, aside, main { background-color: var(--bg-side); border-color: var(--border); }
        .nav-btn.active { background-color: var(--accent); color: var(--brand); border-right: 4px solid var(--brand); }
        
        /* Multi-line Table Styling */
        tr { border-bottom: 1px solid var(--border); transition: all 0.2s; cursor: pointer; background: var(--bg-side); }
        tr:hover { background-color: var(--accent); transform: scale(1.002); z-index: 10; position: relative; }
        tr.active-row { background-color: var(--accent) !important; border-left: 4px solid var(--brand); }
        td { padding: 12px 16px; vertical-align: top; }
        
        .label-tiny { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 2px; }
        .data-main { font-weight: 700; color: var(--text-main); }
        .data-sub { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
        .issue-chip { font-size: 10px; font-weight: 700; color: #ef4444; background: #fee2e2; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body class="theme-default" id="app-body">

    <header class="h-16 border-b flex items-center justify-between px-6 z-10 shadow-sm">
        <div class="flex items-center gap-6">
            <div class="text-xl font-black italic tracking-tighter" style="color: var(--brand)">LOGICOMMAND <span class="text-[10px] opacity-40 not-italic">v48.0</span></div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search anything (Order, Driver, Account...)" class="rounded-lg px-4 py-2 text-xs w-80 border focus:ring-2 ring-blue-500 transition-all">
        </div>
        <div class="flex items-center gap-4">
            <select id="filter-rep" onchange="render()" class="rounded px-2 py-1 text-[10px] font-bold border uppercase"></select>
            <button onclick="setTheme()" class="p-2 opacity-40 hover:opacity-100"><i class="fa fa-circle-half-stroke"></i></button>
        </div>
    </header>

    <div class="app-grid" id="app-ui">
        <aside class="border-r flex flex-col p-4 space-y-4">
            <nav class="space-y-1">
                <button onclick="setMode('all')" id="btn-all" class="nav-btn active w-full flex items-center gap-3 p-3 rounded-xl font-bold text-xs">
                    <i class="fa fa-list-ul"></i> ALL RECORDS
                </button>
                <button onclick="setMode('today')" id="btn-today" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl font-bold text-xs opacity-60">
                    <i class="fa fa-bolt"></i> TODAY ONLY
                </button>
            </nav>
            
            <div class="mt-auto space-y-3">
                <div class="p-4 rounded-xl bg-slate-900 text-white shadow-lg">
                    <p id="stat-total" class="text-2xl font-black">0</p>
                    <p class="text-[9px] font-bold opacity-50 uppercase tracking-widest">Database Rows</p>
                </div>
                <button onclick="fetchLiveData()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black text-[10px] uppercase tracking-widest hover:brightness-110 transition-all">
                    <i class="fas fa-sync-alt mr-2"></i> Refresh Data
                </button>
            </div>
        </aside>

        <main class="overflow-hidden bg-slate-50">
            <div class="overflow-auto h-full p-4">
                <table class="w-full border-separate border-spacing-y-2">
                    <tbody id="ticket-list"></tbody>
                </table>
            </div>
        </main>

        <aside id="detail-panel" class="hidden border-l bg-white overflow-y-auto">
            <div class="p-6 space-y-6">
                <div class="flex justify-between items-start">
                    <div>
                        <span id="d-id-badge" class="text-[10px] font-mono opacity-50 block mb-1"></span>
                        <h2 id="d-company" class="text-xl font-black leading-tight"></h2>
                    </div>
                    <button onclick="closeDetail()" class="p-2 hover:bg-slate-100 rounded-full transition"><i class="fa fa-times"></i></button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <a id="btn-call" href="#" class="flex items-center justify-center gap-2 py-3 bg-blue-600 text-white rounded-xl font-bold uppercase text-[10px] hover:scale-105 transition"><i class="fa fa-phone"></i> Call Driver</a>
                    <a id="btn-text" href="#" class="flex items-center justify-center gap-2 py-3 bg-slate-900 text-white rounded-xl font-bold uppercase text-[10px] hover:scale-105 transition"><i class="fa fa-comment"></i> Text Driver</a>
                </div>

                <div class="space-y-4">
                    <div class="p-4 rounded-xl border bg-slate-50">
                        <span class="label-tiny">Issue & Description</span>
                        <p id="d-issue" class="font-bold text-red-600 mb-1"></p>
                        <p id="d-desc" class="italic text-slate-600"></p>
                    </div>
                    <div>
                        <span class="label-tiny">Internal Follow-up Notes</span>
                        <textarea id="d-notes" oninput="saveLocal()" class="w-full mt-2 p-4 rounded-xl border h-40 text-sm" placeholder="Type internal updates here..."></textarea>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const FLOW_URL = 'YOUR_POWER_AUTOMATE_URL_HERE';
        let db = JSON.parse(localStorage.getItem('logistics_db_v48')) || [];
        let currentMode = 'all'; // Defaulted to ALL to show records upon opening
        let currentTicketId = null;

        window.onload = () => { render(); fetchLiveData(); };

        async function fetchLiveData() {
            try {
                const response = await fetch(FLOW_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "Refresh" }) 
                });
                const data = await response.json();
                if (data.value) ingest(data.value);
            } catch (e) { console.error("Sync Failed", e); }
        }

        function ingest(data) {
            data.forEach(r => {
                const driverRaw = val(r, ['drivername', 'driver']);
                const phoneMatch = driverRaw.match(/\d{3}[-\s]?\d{3}[-\s]?\d{4}/);
                
                const item = {
                    id: val(r, ['id', 'iteminternalid']),
                    account: val(r, ['accountnumber', 'account']),
                    company: val(r, ['company', 'deliverylocation']),
                    address: val(r, ['deliveryaddress', 'address']),
                    order: val(r, ['salesorder', 'ordernumber']),
                    submitter: val(r, ['name', 'submittedby']), // Mapped to the "Name" column
                    driver: driverRaw.split(/[0-9]/)[0].trim(),
                    phone: phoneMatch ? phoneMatch[0] : '---',
                    issue: val(r, ['issue', 'problem']),
                    desc: val(r, ['description', 'details']),
                    date: (val(r, ['starttime']) || "").split('T')[0],
                    timestamp: new Date(val(r, ['starttime'])).getTime()
                };

                if(item.id) {
                    const idx = db.findIndex(x => x.id === item.id);
                    if(idx > -1) db[idx] = {...db[idx], ...item};
                    else db.push({...item, notes: ""});
                }
            });
            updateRepList();
            saveLocal(true);
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const repF = document.getElementById('filter-rep').value;
            const today = new Date().toISOString().split('T')[0];

            document.getElementById('stat-total').innerText = db.length;
            list.innerHTML = '';

            db.filter(t => (currentMode === 'all' || t.date === today))
              .filter(t => repF === 'ALL' || t.submitter === repF)
              .filter(t => JSON.stringify(t).toLowerCase().includes(search))
              .sort((a,b) => b.timestamp - a.timestamp)
              .forEach(t => {
                const tr = document.createElement('tr');
                tr.className = `rounded-xl shadow-sm border ${currentTicketId === t.id ? 'active-row ring-2 ring-blue-500' : ''}`;
                tr.onclick = () => loadTicket(t.id);
                
                tr.innerHTML = `
                    <td class="w-1/4">
                        <span class="label-tiny">Account / Order</span>
                        <div class="data-main">SO# ${t.order}</div>
                        <div class="data-sub">${t.account || 'No Account #'}</div>
                    </td>
                    <td class="w-1/4">
                        <span class="label-tiny">Delivery Details</span>
                        <div class="data-main">${t.company}</div>
                        <div class="data-sub truncate w-48">${t.address}</div>
                    </td>
                    <td class="w-1/4">
                        <span class="label-tiny">Driver & Phone</span>
                        <div class="data-main">${t.driver}</div>
                        <div class="text-blue-600 font-mono text-[10px] font-bold">${t.phone}</div>
                    </td>
                    <td>
                        <span class="label-tiny">Status & Submitter</span>
                        <div class="issue-chip mb-1">${t.issue || 'No Issue Logged'}</div>
                        <div class="data-sub font-bold italic">By: ${t.submitter}</div>
                    </td>
                `;
                list.appendChild(tr);
              });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            const panel = document.getElementById('detail-panel');
            panel.classList.remove('hidden');
            document.getElementById('app-ui').classList.add('show-detail');
            
            document.getElementById('d-id-badge').innerText = `SYSTEM_ID: ${t.id}`;
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-issue').innerText = t.issue;
            document.getElementById('d-desc').innerText = t.desc;
            document.getElementById('d-notes').value = t.notes || '';
            
            if(t.phone !== '---') {
                document.getElementById('btn-call').href = `tel:${t.phone}`;
                document.getElementById('btn-text').href = `sms:${t.phone}&body=Logistics update regarding order ${t.order}: `;
            }
            render();
        }

        function val(row, terms) {
            const keys = Object.keys(row);
            for (let t of terms) {
                const nt = t.toLowerCase().replace(/[^a-z0-9]/g, '');
                for (let k of keys) {
                    const ck = k.toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (ck.includes(nt)) return String(row[k] || '').trim();
                }
            }
            return '';
        }

        function updateRepList() {
            const sel = document.getElementById('filter-rep');
            const reps = ["ALL", ...new Set(db.map(t => t.submitter))].filter(Boolean).sort();
            sel.innerHTML = reps.map(r => `<option value="${r}">${r.toUpperCase()}</option>`).join('');
        }

        function closeDetail() { 
            currentTicketId = null; 
            document.getElementById('detail-panel').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('show-detail');
            render(); 
        }

        function setTheme() {
            const body = document.getElementById('app-body');
            body.className = body.className === 'theme-default' ? 'theme-dark' : 'theme-default';
        }

        function setMode(m) {
            currentMode = m;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + m).classList.add('active');
            render();
        }

        function saveLocal(reRender = false) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) t.notes = document.getElementById('d-notes').value;
            localStorage.setItem('logistics_db_v48', JSON.stringify(db));
            if (reRender) render();
        }
    </script>
</body>
</html>
