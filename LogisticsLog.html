<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLink v104.30 | Optimized Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root, [data-theme='midnight'] { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;     
            --text-accent: #fbbf24; --border: #334155; --input-bg: #0f172a; --danger: #ef4444;
        }
        [data-theme='forest'] { 
            --bg-deep: #1a1c1a; --bg-surface: #242924; --bg-card: #2d332d;      
            --brand: #a7c080; --text-main: #d3c6aa; --text-dim: #859289;     
            --text-accent: #dbbc7f; --border: #3a423a; --input-bg: #1a1c1a; --danger: #e67e80;
        }
        [data-theme='nordic'] { 
            --bg-deep: #2e3440; --bg-surface: #3b4252; --bg-card: #434c5e;      
            --brand: #88c0d0; --text-main: #eceff4; --text-dim: #d8dee9;     
            --text-accent: #ebcb8b; --border: #4c566a; --input-bg: #2e3440; --danger: #bf616a;
        }
        [data-theme='dusk'] { 
            --bg-deep: #232136; --bg-surface: #2a273f; --bg-card: #393552;      
            --brand: #ea9a97; --text-main: #e0def4; --text-dim: #908caa;     
            --text-accent: #c4a7e7; --border: #44415a; --input-bg: #232136; --danger: #eb6f92;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; transition: background 0.3s ease; }
        .app-container { display: flex; height: calc(100vh - 60px); width: 100%; overflow: hidden; }
        
        aside#main-gallery { width: 420px; min-width: 420px; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        main { flex-grow: 1; overflow-y: auto; background-color: var(--bg-deep); display: flex; flex-direction: column; position: relative; }
        
        .record-card { margin: 6px 12px; border-radius: 8px; padding: 10px 14px; background: var(--bg-card); border-left: 4px solid var(--brand); cursor: pointer; transition: all 0.2s ease; border-bottom: 1px solid var(--border); }
        .record-card:hover { transform: translateX(4px); background: rgba(255,255,255,0.05); }
        .record-card.active-card { background: var(--brand) !important; border-left-color: var(--text-main) !important; }
        .record-card.active-card * { color: #0f172a !important; opacity: 1 !important; }

        .wh-label { font-size: 10px; font-weight: 900; color: var(--brand); text-transform: uppercase; border: 1px solid var(--brand); padding: 1px 5px; border-radius: 3px; }
        .route-pill { background: var(--brand); color: var(--bg-deep); font-weight: 900; padding: 0 8px; border-radius: 4px; font-size: 11px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
        
        #email-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; }
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 550px; border-radius: 12px; overflow: hidden; }

        .system-debug-footer { font-family: 'JetBrains Mono', monospace; font-size: 8px; opacity: 0.15; position: absolute; bottom: 15px; right: 25px; text-transform: uppercase; pointer-events: none; letter-spacing: 1px; }
        
        @keyframes duplicate-pulse {
            0% { color: inherit; }
            50% { color: var(--danger); text-shadow: 0 0 8px var(--danger); }
            100% { color: inherit; }
        }
        .order-duplicate-alert { animation: duplicate-pulse 1.5s infinite ease-in-out; font-weight: 900 !important; }
    </style>
</head>
<body data-theme="midnight">

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-[var(--brand)] rounded-lg flex items-center justify-center shadow-lg"><i class="fa fa-layer-group text-[var(--bg-deep)] text-xs"></i></div>
                <div class="text-lg font-black uppercase tracking-tighter text-[var(--brand)]">LOGILINK <span class="text-[10px] opacity-40 ml-1">v104.30</span></div>
            </div>
            <input type="text" id="global-search" oninput="render()" placeholder="Search company, order, or account..." class="w-80 bg-black/10 border border-[var(--border)] p-2 text-xs rounded text-[var(--text-main)] outline-none focus:border-[var(--brand)]">
        </div>
        
        <div class="flex items-center gap-4">
            <div id="sync-indicator" class="mr-2"><i id="sync-icon" class="fa fa-circle text-[8px] text-[var(--brand)]"></i></div>
            <div class="flex items-center gap-3 bg-black/10 p-2 rounded-full border border-[var(--border)]">
                <div onclick="setTheme('midnight')" class="w-3 h-3 rounded-full cursor-pointer bg-[#2dd4bf]"></div>
                <div onclick="setTheme('nordic')" class="w-3 h-3 rounded-full cursor-pointer bg-[#88c0d0]"></div>
                <div onclick="setTheme('forest')" class="w-3 h-3 rounded-full cursor-pointer bg-[#a7c080]"></div>
                <div onclick="setTheme('dusk')" class="w-3 h-3 rounded-full cursor-pointer bg-[#ea9a97]"></div>
            </div>
        </div>
    </header>

    <div class="app-container">
        <aside id="main-gallery">
            <div class="p-3 flex gap-2 border-b border-[var(--border)]">
                <button onclick="setMode('active')" id="btn-active" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">Active</button>
                <button onclick="setMode('all')" id="btn-all" class="flex-1 py-2 rounded font-black text-[11px] uppercase transition-all">History</button>
            </div>
            <div id="ticket-list" class="overflow-y-auto flex-grow"></div>
        </aside>

        <main id="main-scroller">
            <div id="empty-state" class="flex-grow flex flex-col items-center justify-center opacity-20">
                <i class="fa fa-bridge text-8xl mb-4"></i>
                <p class="font-black uppercase tracking-widest text-xl">Select a Record</p>
            </div>

            <div id="detail-content" class="hidden flex-grow overflow-y-auto relative pb-20">
                <div class="max-w-4xl mx-auto p-8 space-y-8">
                    <div class="flex justify-between items-start border-b border-[var(--border)] pb-8">
                        <div class="flex-grow space-y-4">
                            <div class="flex items-baseline gap-4">
                                <h2 id="d-company" class="text-[var(--text-main)] uppercase tracking-tight text-2xl font-extrabold"></h2>
                                <span id="d-account" class="text-sm font-bold opacity-40 uppercase"></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span id="d-wh-badge" class="wh-label"></span>
                                <span id="d-route-badge" class="route-pill"></span>
                            </div>
                            <div class="text-[14px] text-[var(--text-dim)] uppercase">
                                <i class="fa fa-truck-steering text-[var(--text-accent)] mr-2"></i>
                                <span id="d-driver-info"></span>
                            </div>
                        </div>
                        
                        <div class="flex flex-col items-end w-[300px] gap-3">
                            <div class="text-right">
                                <p id="d-full-time" class="text-xs opacity-60 mb-1"></p>
                                <p id="d-order" class="text-4xl font-black italic text-[var(--text-main)]"></p>
                            </div>
                            <select id="d-disposition" class="w-48 bg-[var(--bg-surface)] border border-[var(--brand)] text-[10px] font-black uppercase px-3 py-2 rounded text-[var(--brand)] outline-none">
                                <option value="Pending">Pending</option>
                                <option value="Working">Working</option>
                                <option value="Follow-Up">Follow-Up</option>
                                <option value="Completed">Completed</option>
                                <option value="Sent Back">Sent Back</option>
                            </select>
                        </div>
                    </div>

                    <div class="bg-black/5 border-l-4 border-[var(--text-accent)] p-6 rounded-r-lg">
                        <label id="d-issue-label" class="text-[10px] font-black text-[var(--text-accent)] uppercase block mb-2"></label>
                        <p id="d-description" class="font-medium text-[var(--text-main)] text-lg"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-8">
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50">Warehouse Updates</label>
                            <textarea id="d-warehouse-input" class="h-48 bg-black/10 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-[var(--text-main)]"></textarea>
                        </div>
                        <div class="flex flex-col gap-3">
                            <label class="text-[11px] font-black uppercase opacity-50">Driver Feedback</label>
                            <textarea id="d-driver-input" class="h-48 bg-black/10 border border-[var(--border)] p-4 rounded text-sm outline-none focus:border-[var(--brand)] text-[var(--text-main)]"></textarea>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="openDraftModal()" class="flex-1 py-5 border-2 border-[var(--brand)] text-[var(--brand)] rounded font-black uppercase text-sm hover:bg-[var(--brand)] hover:text-[var(--bg-deep)] transition-all">Send Rep Update</button>
                        <button id="save-btn" onclick="saveRecord()" class="flex-[1.5] py-5 bg-[var(--brand)] text-[var(--bg-deep)] rounded font-black uppercase text-sm hover:brightness-110 shadow-xl transition-all">Save Logistics Update</button>
                    </div>
                </div>
                <div id="d-system-guid" class="system-debug-footer"></div>
            </div>
        </main>
    </div>

    <script>
        let db = []; let currentMode = 'active'; let currentTicketId = null;
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';
        const SAVE_FLOW_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY';
        
        window.onload = () => { setMode('active'); fetchData(HISTORY_URL); };

        async function fetchData(url) {
            const icon = document.getElementById('sync-icon');
            if(icon) icon.className = "fa fa-sync fa-spin text-[var(--brand)]";
            try {
                const response = await fetch(url, { method: 'POST' });
                const data = await response.json();
                if (data && data.value) ingest(data.value);
            } catch (e) { console.error("Sync Error:", e); }
            setTimeout(() => { if(icon) icon.className = "fa fa-circle text-[8px] text-[var(--brand)]"; }, 2000);
        }

        function ingest(data) {
            db = data.map(r => ({
                id: r.cr714_id || 'N/A',
                guid: (r.cr714_logisticslogid || r.cr714_id || '').trim().replace(/[{}]/g, ''),
                order: (r.cr714_salesordernumber || 'N/A').trim(),
                company: r.cr714_companyordeliveryname || 'Unknown',
                account: r.cr714_accountnumber || 'N/A',
                rep: r.cr714_rep || 'CSR',
                driverInfo: r.cr714_drivernamenumber || 'No Driver Data',
                status: r['cr714_disposition@OData.Community.Display.V1.FormattedValue'] || r.cr714_disposition || 'Pending',
                issue: r['cr714_issue@OData.Community.Display.V1.FormattedValue'] || r.cr714_issue || 'General',
                description: r.cr714_description || '',
                warehouse: r['cr714_warehouse@OData.Community.Display.V1.FormattedValue'] || r.cr714_warehouse || 'N/A',
                route: r['cr714_route@OData.Community.Display.V1.FormattedValue'] || r.cr714_route || 'N/A',
                whNotes: r.cr714_receivedemailfromwarehousenotes || '',
                drNotes: r.cr714_receivedtextfromdrivernotes || '',
                rawDate: r.createdon ? new Date(r.createdon) : new Date()
            }));
            render();
        }

        function setMode(m) {
            currentMode = m;
            document.getElementById('btn-active').className = m === 'active' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-[var(--bg-deep)]' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-slate-700/20 text-[var(--text-dim)]';
            document.getElementById('btn-all').className = m === 'all' ? 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-[var(--brand)] text-[var(--bg-deep)]' : 'flex-1 py-2 rounded font-black text-[11px] uppercase bg-slate-700/20 text-[var(--text-dim)]';
            render();
        }

        function render() {
            const list = document.getElementById('ticket-list');
            const search = document.getElementById('global-search').value.toLowerCase();
            const filtered = db.filter(t => {
                const match = (t.order + t.company + t.id).toLowerCase().includes(search);
                const isDone = t.status === 'Completed' || t.status === 'Sent Back';
                return currentMode === 'active' ? (match && !isDone) : (match && isDone);
            }).sort((a,b) => b.rawDate - a.rawDate);
            
            list.innerHTML = filtered.map(t => `
                <div class="record-card ${currentTicketId === t.id ? 'active-card' : ''}" onclick="loadTicket('${t.id}')">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-bold opacity-50 uppercase">${t.id}</span>
                        <span class="wh-label">${t.warehouse}</span>
                    </div>
                    <div class="truncate font-extrabold uppercase text-[13px] mb-1">${t.company}</div>
                    <div class="flex justify-between items-center">
                        <span class="font-mono font-bold">#${t.order}</span>
                        <span class="disp-pill text-[9px] font-black border border-current px-1.5 rounded uppercase">${t.status}</span>
                    </div>
                </div>
            `).join('');
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            if(!t) return;
            render();
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('detail-content').classList.remove('hidden');
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-order').innerText = t.order;
            document.getElementById('d-account').innerText = `#${t.account}`;
            document.getElementById('d-wh-badge').innerText = t.warehouse;
            document.getElementById('d-route-badge').innerText = `RT: ${t.route}`;
            document.getElementById('d-driver-info').innerText = t.driverInfo;
            document.getElementById('d-issue-label').innerText = t.issue;
            document.getElementById('d-description').innerText = t.description;
            document.getElementById('d-warehouse-input').value = t.whNotes;
            document.getElementById('d-driver-input').value = t.drNotes;
            document.getElementById('d-disposition').value = t.status;
            document.getElementById('d-full-time').innerText = t.rawDate.toLocaleString();
            
            // Lazy Load GUID to the hidden system footer
            document.getElementById('d-system-guid').innerText = `Dataverse Link: ${t.guid}`;
        }

        async function saveRecord() {
            const btn = document.getElementById('save-btn');
            const t = db.find(x => x.id === currentTicketId);
            if(!t) return;

            btn.innerText = "SAVING..."; btn.disabled = true;

            const payload = {
                recordId: t.guid,
                disposition: document.getElementById('d-disposition').value,
                warehouseNotes: document.getElementById('d-warehouse-input').value,
                driverNotes: document.getElementById('d-driver-input').value
            };

            try {
                const response = await fetch(SAVE_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error();
                
                // Update local cache so it doesn't revert on re-render
                t.status = payload.disposition;
                t.whNotes = payload.warehouseNotes;
                t.drNotes = payload.driverNotes;
                
                btn.innerText = "SUCCESS";
                setTimeout(() => { btn.innerText = "Save Logistics Update"; btn.disabled = false; render(); }, 1500);
            } catch (e) {
                alert("Syntax Error: Power Automate rejected the Row ID. Ensure 'recordId' is used as the Row ID in the 'Update a row' step.");
                btn.innerText = "RETRY"; btn.disabled = false;
            }
        }

        function setTheme(t) { document.body.setAttribute('data-theme', t); }
    </script>
</body>
</html>
