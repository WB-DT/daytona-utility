<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Log v36.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .app-grid { display: grid; grid-template-columns: 280px 1fr 450px; height: 100%; }
        .nav-btn.active { background-color: rgba(59, 130, 246, 0.1); color: #3b82f6; border-right: 3px solid #3b82f6; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="auth-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-4">
        <div class="max-w-md w-full text-center space-y-8">
            <div class="inline-flex p-6 rounded-3xl bg-blue-600 text-white text-5xl shadow-2xl">
                <i class="fas fa-truck-fast"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black">Logistics Log</h1>
                <p class="text-slate-500 font-medium tracking-tight">System v36.0</p>
            </div>
            <button onclick="login()" class="w-full py-4 rounded-xl bg-slate-900 text-white font-bold hover:scale-[1.02] transition shadow-xl flex items-center justify-center gap-3">
                <i class="fab fa-microsoft text-xl"></i> Sign In to Daytona
            </button>
            <div id="error-display" class="hidden text-red-600 text-[10px] bg-red-50 p-4 rounded-xl border border-red-100 text-left font-mono break-all"></div>
        </div>
    </div>

    <header class="h-16 bg-white border-b flex items-center justify-between px-6 z-10">
        <div class="flex items-center gap-4">
            <div class="text-xl font-black text-blue-600">LOGILOG <span class="text-slate-400 text-xs font-normal ml-1">v36.0</span></div>
            <div id="live-indicator" class="hidden flex items-center gap-2 px-3 py-1 bg-green-50 text-green-600 rounded-full text-[10px] font-bold uppercase">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> Connected
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right">
                <p id="user-display-name" class="text-xs font-bold">Guest User</p>
                <p id="user-email" class="text-[10px] text-slate-400 font-medium">WB Mason Logistics</p>
            </div>
            <button onclick="localStorage.clear(); location.reload();" class="text-[10px] bg-slate-100 px-2 py-1 rounded hover:bg-red-50 hover:text-red-500 transition font-bold uppercase">Reset</button>
        </div>
    </header>

    <div id="app-ui" class="app-grid hidden">
        <aside class="bg-white border-r flex flex-col p-4 space-y-6">
            <nav class="space-y-1">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-2">Filters</p>
                <button onclick="setMode('today')" id="btn-today" class="nav-btn active w-full flex items-center gap-3 p-3 rounded-xl font-bold text-xs">
                    <i class="fa fa-calendar-day"></i> Today's Live Logs
                </button>
                <button onclick="setMode('all')" id="btn-all" class="nav-btn w-full flex items-center gap-3 p-3 rounded-xl font-bold text-xs text-slate-500">
                    <i class="fa fa-database"></i> All History
                </button>
            </nav>
            <div class="mt-auto">
                <button onclick="fetchLiveData()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold text-xs shadow-lg hover:bg-blue-700 transition">
                    <i class="fas fa-sync-alt mr-2"></i> Sync with Flow
                </button>
            </div>
        </aside>

        <main class="bg-white overflow-hidden border-r">
            <div class="overflow-y-auto custom-scroll h-full">
                <table class="w-full text-left">
                    <thead class="sticky top-0 bg-white/90 backdrop-blur z-10 border-b">
                        <tr class="text-[10px] uppercase text-slate-400 font-black">
                            <th class="p-4">ID</th>
                            <th class="p-4">Customer</th>
                            <th class="p-4">Route</th>
                            <th class="p-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="ticket-list" class="divide-y"></tbody>
                </table>
            </div>
        </main>

        <aside id="detail-panel" class="bg-slate-50 p-0 overflow-y-auto hidden">
            <div class="p-8 space-y-6">
                <div class="flex justify-between items-start">
                    <div id="d-id-badge" class="text-[10px] font-mono bg-slate-200 px-2 py-1 rounded"></div>
                    <span id="d-status-badge" class="px-2 py-1 rounded text-[10px] font-bold uppercase"></span>
                </div>
                <h2 id="d-company" class="text-2xl font-black leading-tight text-slate-900"></h2>
                
                <div class="bg-white p-5 rounded-2xl border shadow-sm">
                    <label class="text-[10px] font-black text-blue-600 uppercase block mb-1">Issue Reported</label>
                    <p id="d-issue" class="text-sm font-bold text-slate-800 mb-3"></p>
                    <label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Description</label>
                    <div id="d-desc" class="text-sm text-slate-600 leading-relaxed italic"></div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase">Internal Logistics Notes</label>
                        <textarea id="d-notes" class="w-full mt-2 p-4 rounded-xl border h-32 text-xs focus:ring-2 ring-blue-500 outline-none" placeholder="Add warehouse or driver updates..."></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="saveLocal(true)" class="flex-1 py-4 bg-slate-900 text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-lg">Save Update</button>
                        <button onclick="setStatus('Completed')" class="px-6 bg-green-600 text-white rounded-xl font-black text-xs uppercase">Complete</button>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const FLOW_URL = 'https://49b71dde44f8e78e89bc0440816209.07.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c8534a1735ca463d9386ac5ab1c89fcf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=X3TCIX7rLqKbo5iiDAOozZ-JchO3BuPK5H8DW4aruAA';
        
        const msalConfig = {
            auth: { clientId: 'afe649b6-9c70-4b1a-8592-78588284c8ee', authority: 'https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401' },
            cache: { cacheLocation: "localStorage" }
        };

        const msalClient = new msal.PublicClientApplication(msalConfig);
        let db = JSON.parse(localStorage.getItem('logistics_db_v36')) || [];
        let currentMode = 'today';
        let currentTicketId = null;

        window.onload = () => {
            const accounts = msalClient.getAllAccounts();
            if (accounts.length > 0) {
                msalClient.setActiveAccount(accounts[0]);
                document.getElementById('user-email').innerText = accounts[0].username;
                document.getElementById('user-display-name').innerText = accounts[0].name;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                fetchLiveData();
            }
        };

        async function login() {
            try {
                const res = await msalClient.loginPopup({ scopes: ["User.Read"] });
                msalClient.setActiveAccount(res.account);
                location.reload();
            } catch (e) { showError(e.message); }
        }

        async function fetchLiveData() {
            try {
                const response = await fetch(FLOW_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "Refresh" })
                });

                const data = await response.json();
                if (response.ok) {
                    let rows = data.schema?.data || (typeof data.body === 'string' ? JSON.parse(data.body).value : data.value);
                    if (rows) {
                        ingest(rows);
                        document.getElementById('live-indicator').classList.remove('hidden');
                        Toastify({ text: "✓ Connected to Live Flow", style: { background: "#10b981" } }).showToast();
                    }
                } else { showError(`Flow Error: ${JSON.stringify(data.error || data)}`); }
            } catch (e) { showError(`Network Error: Ensure Flow is active.`); }
        }

        function showError(msg) {
            const ed = document.getElementById('error-display');
            ed.innerText = msg;
            ed.classList.remove('hidden');
        }

        function val(row, terms) {
            const keys = Object.keys(row);
            for (let t of terms) {
                const nt = t.toLowerCase().replace(/[^a-z0-9]/g, '');
                for (let k of keys) {
                    const ck = k.toLowerCase().replace(/_x[0-9a-f]{4}_/g, '').replace(/[^a-z0-9]/g, '');
                    if (ck.includes(nt)) return String(row[k] || '').trim();
                }
            }
            return '';
        }

        function ingest(data) {
            data.forEach(r => {
                const item = {
                    id: val(r, ['id', 'iteminternalid']),
                    company: val(r, ['company', 'deliverylocation']),
                    route: val(r, ['route']),
                    issue: val(r, ['issue']),
                    desc: val(r, ['description']),
                    date: (val(r, ['starttime']) || "").split('T')[0],
                    status: val(r, ['disposition', 'status']) || 'Pending'
                };
                if(item.id && item.company) {
                    const idx = db.findIndex(x => x.id === item.id);
                    if(idx > -1) db[idx] = {...db[idx], ...item};
                    else db.push({...item, notes: ""});
                }
            });
            saveLocal(true);
        }

        function render() {
            const list = document.getElementById('ticket-list');
            list.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];
            
            db.filter(t => currentMode === 'all' || t.date === today).forEach(t => {
                const tr = document.createElement('tr');
                tr.className = `hover:bg-blue-50 cursor-pointer transition ${currentTicketId === t.id ? 'bg-blue-50' : ''}`;
                tr.onclick = () => loadTicket(t.id);
                tr.innerHTML = `
                    <td class="p-4 text-[10px] font-mono font-bold text-slate-400">#${t.id.slice(-5)}</td>
                    <td class="p-4 text-xs font-bold text-slate-900">${t.company}</td>
                    <td class="p-4 text-xs text-slate-500 font-medium">${t.route || 'N/A'}</td>
                    <td class="p-4 text-right"><span class="text-[9px] font-black uppercase px-2 py-1 rounded ${t.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${t.status}</span></td>
                `;
                list.appendChild(tr);
            });
        }

        function loadTicket(id) {
            currentTicketId = id;
            const t = db.find(x => x.id === id);
            document.getElementById('detail-panel').classList.remove('hidden');
            document.getElementById('d-id-badge').innerText = `#${t.id}`;
            document.getElementById('d-company').innerText = t.company;
            document.getElementById('d-issue').innerText = t.issue;
            document.getElementById('d-desc').innerText = t.desc || "No further details.";
            document.getElementById('d-notes').value = t.notes || '';
            
            const badge = document.getElementById('d-status-badge');
            badge.innerText = t.status;
            badge.className = `px-2 py-1 rounded text-[10px] font-bold uppercase ${t.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`;
            render();
        }

        function setStatus(s) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) { t.status = s; saveLocal(true); }
        }

        function saveLocal(reRender = false) {
            const t = db.find(x => x.id === currentTicketId);
            if(t) t.notes = document.getElementById('d-notes').value;
            localStorage.setItem('logistics_db_v36', JSON.stringify(db));
            if(reRender) render();
            if(!reRender) Toastify({ text: "Changes Saved Locally", style: { background: "#1e293b" } }).showToast();
        }

        function setMode(m) {
            currentMode = m;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + m).classList.add('active');
            render();
        }
    </script>
</body>
</html>
