<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLog CS Portal | Order Lookup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>

    <style>
        :root { 
            --bg-deep: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #334155;      
            --brand: #2dd4bf;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;      
            --text-accent: #fbbf24;
            --border: #334155;
            --danger: #ef4444;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            width: 100%;
            overflow-y: auto;
            align-items: center;
            padding-top: 2rem;
            box-sizing: border-box;
            transition: width 0.34s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        header {
            transition: width 0.34s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body.sales-panel-open:not(.sales-panel-fullscreen) header,
        body.sales-panel-open:not(.sales-panel-fullscreen) .app-container {
            width: 50%;
        }
        
        #login-container {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .login-card {
            background: var(--bg-surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .frog-mascot {
            font-size: 26px;
            color: var(--brand);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        
        .search-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            margin-bottom: 2rem;
            padding: 0 1rem;
            box-sizing: border-box;
        }

        .search-input {
            width: 100%;
            border: 2px solid var(--border);
            padding: 1.5rem 1.5rem 1.5rem 4rem;
            font-size: 1.25rem;
            font-weight: 800;
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s;
            background-color: var(--bg-surface);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 20px rgba(45,212,191,0.2);
        }

        .search-icon {
            position: absolute;
            left: 2.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            color: var(--text-dim);
        }

        .results-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 0 1rem 4rem 1rem;
            box-sizing: border-box;
        }

        .result-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            border-top: 4px solid var(--brand);
            animation: slideUp 0.3s ease-out;
        }

        .card-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-footer {
            padding: 1rem 1.5rem;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .disp-pill {
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            border: 1px solid currentColor;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .notes-box {
            background: rgba(0,0,0,0.15);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-main);
            white-space: pre-wrap;
            min-height: 72px;
        }

        /* Right-side Sales Order Drawer */
        .sales-order-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 50vw;
            max-width: 50vw;
            background: var(--bg-surface);
            border-left: 1px solid var(--border);
            box-shadow: -22px 0 60px rgba(0,0,0,0.48);
            z-index: 99990;
            display: flex;
            flex-direction: column;
            transform: translateX(102%);
            transition: transform 0.34s cubic-bezier(0.25, 0.8, 0.25, 1), width 0.34s cubic-bezier(0.25, 0.8, 0.25, 1), max-width 0.34s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .sales-order-drawer.active {
            transform: translateX(0);
        }

        .sales-order-drawer.fullscreen {
            width: 100vw;
            max-width: 100vw;
            border-left: none;
        }

        .drawer-resize-hint {
            position: absolute;
            left: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 88px;
            border-radius: 10px 0 0 10px;
            background: rgba(45, 212, 191, 0.18);
            border: 1px solid rgba(45, 212, 191, 0.32);
            border-right: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--brand);
            font-size: 9px;
        }

        .order-drawer-header {
            min-height: 64px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 1rem 0.75rem 1.25rem;
            background: rgba(0,0,0,0.22);
            border-bottom: 1px solid var(--border);
            box-sizing: border-box;
        }

        .order-drawer-title-wrap {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .order-drawer-title {
            color: var(--brand);
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        .order-drawer-subtitle {
            color: var(--text-dim);
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .order-drawer-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .order-drawer-btn {
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 0.8rem;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .order-drawer-btn:hover {
            color: var(--brand);
            border-color: var(--brand);
            transform: translateY(-1px);
        }

        .order-drawer-btn.danger:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        .order-drawer-body {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #ffffff;
        }

        .order-drawer-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
            display: block;
        }

        .iframe-loader {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: linear-gradient(135deg, rgba(15,23,42,0.96), rgba(30,41,59,0.96));
            color: var(--text-main);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }

        .iframe-loader .spinner {
            width: 48px;
            height: 48px;
            border-radius: 999px;
            border: 4px solid rgba(148,163,184,0.25);
            border-top-color: var(--brand);
            animation: spin 0.8s linear infinite;
        }

        .iframe-loader-text {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.16em;
        }

        .order-items-toggle {
            background: rgba(45, 212, 191, 0.12);
            border: 1px solid rgba(45, 212, 191, 0.35);
            color: var(--brand);
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            width: fit-content;
        }

        .order-items-toggle:hover {
            background: rgba(45, 212, 191, 0.22);
            transform: translateY(-1px);
        }

        .order-items-empty {
            color: var(--text-dim);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 0.25rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; } 
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        @media (max-width: 980px) {
            body.sales-panel-open:not(.sales-panel-fullscreen) header,
            body.sales-panel-open:not(.sales-panel-fullscreen) .app-container {
                width: 100%;
            }

            .sales-order-drawer {
                width: 92vw;
                max-width: 92vw;
            }
        }

        @media (max-width: 760px) {
            .card-header { flex-direction: column; align-items: flex-start; }
            .card-footer { flex-direction: column; }
            .grid.grid-cols-2 { grid-template-columns: 1fr; }
            .order-drawer-header { align-items: flex-start; flex-direction: column; padding: 1rem; }
            .order-drawer-actions { width: 100%; justify-content: stretch; }
            .order-drawer-btn { flex: 1; padding: 0 0.55rem; }
        }
    </style>
</head>

<body>
    <div id="login-container">
        <div class="login-card p-10 space-y-6">
            <i class="fa-solid fa-frog text-6xl text-[var(--brand)]"></i>
            <h1 class="text-2xl font-black uppercase tracking-tighter text-[var(--brand)]">CS Order Lookup</h1>
            <p class="text-xs text-[var(--text-dim)]">Secure access to Logistics updates.</p>
            <button onclick="login()" class="w-full py-4 bg-[var(--brand)] text-[#0f172a] rounded font-black uppercase text-sm tracking-[0.2em] hover:brightness-110 shadow-xl transition-all">Sign in with Microsoft</button>
        </div>
    </div>

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6 shadow-sm z-20 relative">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-frog frog-mascot"></i>
            <div class="text-xl font-black uppercase tracking-tighter text-[var(--brand)]">
                LOGILOG <span class="text-[12px] opacity-70 ml-1 text-white">CS PORTAL</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-[10px] font-black uppercase tracking-widest text-[var(--text-dim)] bg-black/20 px-4 py-2 rounded-full border border-[var(--border)]">
                <i class="fa-solid fa-user text-[var(--brand)] mr-2"></i><span id="user-name-text">Loading...</span>
            </div>
        </div>
    </header>

    <div class="app-container">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="cs-search-input" onkeypress="handleEnter(event)" placeholder="Search Order # or Account #..." class="search-input" autocomplete="off">
            <div class="text-center mt-3 text-xs text-[var(--text-dim)] uppercase tracking-widest font-bold">
                Press Enter to search Logistics Database
            </div>
        </div>

        <div id="loading-indicator" class="hidden flex-col items-center justify-center my-10">
            <i class="fa-solid fa-satellite-dish fa-spin text-4xl text-[var(--brand)] mb-4"></i>
            <span class="font-black uppercase tracking-widest text-xs text-[var(--text-dim)] animate-pulse">Querying Database...</span>
        </div>

        <div id="results-container" class="results-container"></div>
    </div>

    <aside id="sales-order-side-panel" class="sales-order-drawer" aria-hidden="true">
        <div class="drawer-resize-hint"><i class="fa-solid fa-grip-lines-vertical"></i></div>
        <div class="order-drawer-header">
            <div class="order-drawer-title-wrap">
                <div class="order-drawer-title">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    Sales Order Items / Details
                </div>
                <div id="sales-order-panel-subtitle" class="order-drawer-subtitle">Order -- • Account --</div>
            </div>

            <div class="order-drawer-actions">
                <button class="order-drawer-btn" onclick="refreshSalesOrderPanel()" title="Refresh the embedded MVGO sales order page">
                    <i class="fa-solid fa-rotate-right"></i>
                    Refresh
                </button>
                <button id="sales-order-fullscreen-btn" class="order-drawer-btn" onclick="toggleSalesOrderPanelFullscreen()" title="Expand or restore side panel">
                    <i class="fa-solid fa-expand"></i>
                    Full Screen
                </button>
                <button class="order-drawer-btn" onclick="openSalesOrderExternal()" title="Open this sales order in a new tab">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    Pop Out
                </button>
                <button class="order-drawer-btn danger" onclick="closeSalesOrderPanel()" title="Close panel">
                    <i class="fa-solid fa-xmark"></i>
                    Close
                </button>
            </div>
        </div>

        <div class="order-drawer-body">
            <div id="sales-order-iframe-loader" class="iframe-loader">
                <div class="spinner"></div>
                <div class="iframe-loader-text">Loading Sales Order Details...</div>
            </div>
            <iframe id="sales-order-panel-iframe" class="order-drawer-iframe" src="about:blank" onload="hideSalesOrderIframeLoader()" title="Sales Order Items"></iframe>
        </div>
    </aside>

    <script>
        const msalConfig = { 
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: window.location.href
            }, 
            cache: {
                cacheLocation: "localStorage",
                storeAuthStateInCookie: true
            } 
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        let msalAccount = null;

        const ENV_DATA = "https://org23279050.crm.dynamics.com";
        const DATA_API = `${ENV_DATA}/api/data/v9.2`;
        const ENTITY_SET = "cr714_logisticslog_2s";

        const MVGO_BASE = "https://go.masonville.com/#";
        let currentSalesOrderPanelUrl = "";
        let currentSalesOrderPanelAccount = "";
        let currentSalesOrderPanelOrder = "";

        window.onload = () => { 
            msalInstance.handleRedirectPromise().then(resp => {
                if (resp && resp.account) {
                    applyIdentity(resp.account);
                } else {
                    const accounts = msalInstance.getAllAccounts();
                    if (accounts.length > 0) applyIdentity(accounts[0]);
                }
            }).catch(e => console.error(e));
        };

        function escapeHTML(str) {
            if (str === null || str === undefined) return "";
            return String(str).replace(/[&<>"']/g, m => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[m]));
        }

        function escapeJS(str) {
            return String(str ?? "")
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'")
                .replace(/"/g, "&quot;")
                .replace(/\n/g, "\\n")
                .replace(/\r/g, "");
        }

        function buildMvgoSalesOrderUrl(accountNum, salesOrderNum, forceRefresh = false) {
            const acct = encodeURIComponent(String(accountNum || "").trim());
            const order = encodeURIComponent(String(salesOrderNum || "").trim());
            let url = `${MVGO_BASE}/orderhistory?customerId=${acct}&oo=${order}&oc=${acct}`;
            if (forceRefresh) url += `&refreshTs=${Date.now()}`;
            return url;
        }

        function showSalesOrderIframeLoader() {
            const loader = document.getElementById("sales-order-iframe-loader");
            if (loader) loader.style.display = "flex";
        }

        function hideSalesOrderIframeLoader() {
            const loader = document.getElementById("sales-order-iframe-loader");
            if (loader) loader.style.display = "none";
        }

        function openSalesOrderPanel(accountNum, salesOrderNum) {
            currentSalesOrderPanelAccount = String(accountNum || "").trim();
            currentSalesOrderPanelOrder = String(salesOrderNum || "").trim();
            currentSalesOrderPanelUrl = buildMvgoSalesOrderUrl(currentSalesOrderPanelAccount, currentSalesOrderPanelOrder, true);

            const panel = document.getElementById("sales-order-side-panel");
            const iframe = document.getElementById("sales-order-panel-iframe");
            const subtitle = document.getElementById("sales-order-panel-subtitle");

            if (subtitle) subtitle.textContent = `Order #${currentSalesOrderPanelOrder} • Account #${currentSalesOrderPanelAccount}`;
            if (panel) {
                panel.classList.add("active");
                panel.setAttribute("aria-hidden", "false");
            }
            document.body.classList.add("sales-panel-open");

            showSalesOrderIframeLoader();
            if (iframe) iframe.src = currentSalesOrderPanelUrl;
        }

        function refreshSalesOrderPanel() {
            if (!currentSalesOrderPanelAccount || !currentSalesOrderPanelOrder) return;
            currentSalesOrderPanelUrl = buildMvgoSalesOrderUrl(currentSalesOrderPanelAccount, currentSalesOrderPanelOrder, true);
            const iframe = document.getElementById("sales-order-panel-iframe");
            showSalesOrderIframeLoader();
            if (iframe) iframe.src = currentSalesOrderPanelUrl;
        }

        function toggleSalesOrderPanelFullscreen() {
            const panel = document.getElementById("sales-order-side-panel");
            const btn = document.getElementById("sales-order-fullscreen-btn");
            if (!panel) return;

            panel.classList.toggle("fullscreen");
            const isFull = panel.classList.contains("fullscreen");
            document.body.classList.toggle("sales-panel-fullscreen", isFull);

            if (btn) {
                btn.innerHTML = isFull
                    ? '<i class="fa-solid fa-compress"></i> Restore'
                    : '<i class="fa-solid fa-expand"></i> Full Screen';
            }
        }

        function openSalesOrderExternal() {
            if (!currentSalesOrderPanelUrl && currentSalesOrderPanelAccount && currentSalesOrderPanelOrder) {
                currentSalesOrderPanelUrl = buildMvgoSalesOrderUrl(currentSalesOrderPanelAccount, currentSalesOrderPanelOrder, false);
            }
            if (currentSalesOrderPanelUrl) window.open(currentSalesOrderPanelUrl, "_blank");
        }

        function closeSalesOrderPanel() {
            const panel = document.getElementById("sales-order-side-panel");
            const iframe = document.getElementById("sales-order-panel-iframe");
            const btn = document.getElementById("sales-order-fullscreen-btn");

            if (panel) {
                panel.classList.remove("active", "fullscreen");
                panel.setAttribute("aria-hidden", "true");
            }
            document.body.classList.remove("sales-panel-open", "sales-panel-fullscreen");
            if (btn) btn.innerHTML = '<i class="fa-solid fa-expand"></i> Full Screen';
            if (iframe) iframe.src = "about:blank";
            hideSalesOrderIframeLoader();

            currentSalesOrderPanelUrl = "";
            currentSalesOrderPanelAccount = "";
            currentSalesOrderPanelOrder = "";
        }

        /* Backward-compatible aliases if any old button/event still calls modal names. */
        function openSalesOrderModal(accountNum, salesOrderNum) { openSalesOrderPanel(accountNum, salesOrderNum); }
        function refreshSalesOrderModal() { refreshSalesOrderPanel(); }
        function closeSalesOrderModal() { closeSalesOrderPanel(); }

        async function getToken() {
            const request = { scopes: [`${ENV_DATA}/user_impersonation`], account: msalAccount };
            try { 
                return (await msalInstance.acquireTokenSilent(request)).accessToken; 
            } catch (e) { 
                document.getElementById('login-container').style.display = 'flex';
                document.getElementById('loading-indicator').style.display = 'none';
                throw new Error("Session expired. Please sign in again.");
            }
        }

        function login() { 
            msalInstance.loginPopup({ scopes: ["User.Read"] }).then(resp => { 
                if (resp && resp.account) applyIdentity(resp.account); 
            }).catch(e => console.error(e));
        }

        function applyIdentity(account) {
            document.getElementById('login-container').style.display = 'none';
            msalAccount = account; 
            document.getElementById('user-name-text').innerText = account.name || account.username || 'Signed In';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') performSearch();
        }

        async function performSearch() {
            const query = document.getElementById('cs-search-input').value.trim();
            const resultsContainer = document.getElementById('results-container');
            const loader = document.getElementById('loading-indicator');
            
            if (query.length < 3) {
                resultsContainer.innerHTML = `<div class="text-center text-[var(--text-accent)] font-bold text-sm uppercase tracking-widest mt-10"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Please enter at least 3 characters to search.</div>`;
                return;
            }

            resultsContainer.innerHTML = "";
            loader.style.display = "flex";

            try {
                const token = await getToken();
                const cleanQuery = query.replace(/'/g, "''");
                const headers = { 
                    'Authorization': `Bearer ${token}`, 
                    'Accept': 'application/json', 
                    'OData-MaxVersion': '4.0', 
                    'OData-Version': '4.0',
                    'Prefer': 'odata.include-annotations="OData.Community.Display.V1.FormattedValue"'
                };

                let res = await fetch(`${DATA_API}/${ENTITY_SET}?$filter=contains(cr714_salesordernumber, '${cleanQuery}') or contains(cr714_accountnum, '${cleanQuery}')&$orderby=createdon desc&$top=50`, { headers });
                if (!res.ok) res = await fetch(`${DATA_API}/${ENTITY_SET}?$filter=contains(cr714_salesordernumber, '${cleanQuery}') or contains(cr714_accountnumber, '${cleanQuery}')&$orderby=createdon desc&$top=50`, { headers });
                if (!res.ok) res = await fetch(`${DATA_API}/${ENTITY_SET}?$filter=contains(cr714_salesordernumber, '${cleanQuery}') or contains(cr714_companyordeliveryname, '${cleanQuery}')&$orderby=createdon desc&$top=50`, { headers });
                if (!res.ok) throw new Error("Dataverse API rejected request after all fallback attempts.");

                const data = await res.json();
                loader.style.display = "none";
                renderResults(data.value, query);
            } catch (error) {
                loader.style.display = "none";
                resultsContainer.innerHTML = `<div class="text-center text-[var(--danger)] font-bold text-sm uppercase tracking-widest mt-10"><i class="fa-solid fa-circle-xmark mr-2"></i>Error querying database. Please try again.</div>`;
                console.error(error);
            }
        }

        function renderResults(records, query) {
            const container = document.getElementById('results-container');
            if (!records || records.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center opacity-30 mt-20"><i class="fa-solid fa-box-open text-6xl mb-4"></i><p class="font-black uppercase tracking-widest text-lg">No Logistics Records Found</p><p class="text-xs font-bold mt-2">For search: "${escapeHTML(query)}"</p></div>`;
                return;
            }

            const html = records.map((r) => {
                const fv = (field) => r[`${field}@OData.Community.Display.V1.FormattedValue`] || r[`_${field}_value@OData.Community.Display.V1.FormattedValue`];
                const orderRaw = String(r.cr714_salesordernumber || 'N/A').trim();
                const accountRaw = String(r.cr714_accountnum || r.cr714_accountnumber || 'N/A').trim();
                const companyRaw = String(r.cr714_companyordeliveryname || 'Unknown Company');
                const issueRaw = String(fv('cr714_issue') || r.cr714_issue || 'General');
                const descriptionRaw = String(r.cr714_description || r.cr714_issue_description || 'No detailed description provided.');
                const statusRaw = String(fv('cr714_disposition') || r.cr714_disposition || 'Pending');

                let statusColor = 'var(--brand)';
                if (statusRaw === 'Pending') statusColor = 'var(--text-accent)';
                else if (statusRaw === 'Completed' || statusRaw === 'Sent Back') statusColor = 'var(--text-dim)';
                else if (statusRaw.includes('Escalated')) statusColor = 'var(--danger)';

                const submitterRaw = String(fv('cr714_rep') || r.cr714_rep || fv('cr714_submitrep') || r.cr714_submitrep || 'Unknown Rep');
                const rawOwner = String(fv('cr714_logisticsowner') || r.cr714_logisticsowner || 'Unassigned');
                const ownerRaw = rawOwner === 'Unassigned' ? 'Unassigned' : rawOwner.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                const rawDate = r.cr714_starttime || r.createdon;
                const formattedDateRaw = rawDate ? new Date(rawDate).toLocaleString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Unknown Date';
                const warehouseNotesRaw = String(r.cr714_receivedemailfromwarehousenotes || 'No updates yet.');
                const driverNotesRaw = String(r.cr714_receivedtextfromdrivernotes || 'No updates yet.');
                const canShowOrderItems = orderRaw && accountRaw && orderRaw !== 'N/A' && accountRaw !== 'N/A';

                return `
                    <div class="result-card">
                        <div class="card-header">
                            <div class="flex flex-col min-w-0">
                                <span class="font-black text-xl text-[var(--text-main)] uppercase tracking-tight truncate">${escapeHTML(companyRaw)}</span>
                                <span class="text-xs font-mono text-[var(--text-dim)] uppercase tracking-widest mt-1">Order #${escapeHTML(orderRaw)} <span class="mx-2 opacity-30">|</span> Acct #${escapeHTML(accountRaw)}</span>
                            </div>
                            <span class="disp-pill" style="color: ${statusColor}">${escapeHTML(statusRaw)}</span>
                        </div>
                        <div class="card-body">
                            <div class="flex flex-col gap-1 border-l-2 border-[var(--text-accent)] pl-3">
                                <span class="text-[10px] font-black uppercase tracking-widest text-[var(--text-accent)]">Submission Details: ${escapeHTML(issueRaw)}</span>
                                <span class="text-sm font-medium text-[var(--text-main)]">${escapeHTML(descriptionRaw)}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mt-2">
                                <div class="flex flex-col gap-1.5"><span class="text-[10px] font-black uppercase tracking-widest text-[var(--text-dim)]">Warehouse Updates</span><div class="notes-box">${escapeHTML(warehouseNotesRaw)}</div></div>
                                <div class="flex flex-col gap-1.5"><span class="text-[10px] font-black uppercase tracking-widest text-[var(--text-dim)]">Driver Feedback</span><div class="notes-box">${escapeHTML(driverNotesRaw)}</div></div>
                            </div>
                            ${canShowOrderItems ? `<button class="order-items-toggle" onclick="openSalesOrderPanel('${escapeJS(accountRaw)}', '${escapeJS(orderRaw)}')"><i class="fa-solid fa-box-open"></i>View Items / Sales Order Details</button>` : `<div class="order-items-empty"><i class="fa-solid fa-circle-info mr-1"></i>Sales order or account number missing, item drilldown unavailable.</div>`}
                        </div>
                        <div class="card-footer">
                            <div class="flex items-center gap-2"><i class="fa-solid fa-user-pen text-[var(--brand)]"></i><span>Submitted by <strong class="text-[var(--text-main)]">${escapeHTML(submitterRaw)}</strong></span></div>
                            <div class="flex items-center gap-2 font-bold"><i class="fa-regular fa-clock"></i> ${escapeHTML(formattedDateRaw)}</div>
                            <div class="flex items-center gap-2"><i class="fa-solid fa-user-shield text-[var(--text-accent)]"></i><span>Logistics Rep: <strong class="text-[var(--text-main)]">${escapeHTML(ownerRaw)}</strong></span></div>
                        </div>
                    </div>`;
            }).join('');
            container.innerHTML = html;
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeSalesOrderPanel();
        });
    </script>
</body>
</html>
