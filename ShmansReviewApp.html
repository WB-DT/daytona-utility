<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Widget | Order Lookup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>

    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155;      
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8;      
            --text-accent: #fbbf24; --border: #334155; --danger: #ef4444;
        }

        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        .app-container { display: flex; flex-direction: column; height: calc(100vh - 60px); width: 100%; overflow-y: auto; align-items: center; padding-top: 2rem; }
        
        /* MSAL Login Screen */
        #login-container { position: fixed; inset: 0; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; z-index: 99999; }
        .login-card { background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border); text-align: center; max-width: 400px; width: 90%; }
        
        .frog-mascot { font-size: 26px; color: var(--brand); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        
        /* Search UI */
        .search-container { width: 100%; max-width: 800px; position: relative; margin-bottom: 2rem; }
        .search-input { width: 100%; bg-black/20; border: 2px solid var(--border); padding: 1.5rem 1.5rem 1.5rem 4rem; font-size: 1.25rem; font-weight: 800; border-radius: 12px; color: var(--text-main); outline: none; transition: all 0.3s; background-color: var(--bg-surface); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .search-input:focus { border-color: var(--brand); box-shadow: 0 0 20px rgba(45,212,191,0.2); }
        .search-icon { position: absolute; left: 1.5rem; top: 50%; transform: translateY(-50%); font-size: 1.5rem; color: var(--text-dim); }

        /* Results Cards */
        .results-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 4rem; }
        .result-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); border-top: 4px solid var(--brand); animation: slideUp 0.3s ease-out; }
        .card-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .card-footer { padding: 1rem 1.5rem; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); display: flex; justify-content: space-between; }
        
        .disp-pill { font-size: 11px; font-weight: 900; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; border: 1px solid currentColor; letter-spacing: 0.05em; }
        .notes-box { background: rgba(0,0,0,0.15); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; font-size: 13px; line-height: 1.5; color: var(--text-main); white-space: pre-wrap; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; } 
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
    </style>
</head>
<body>

    <div id="login-container">
        <div class="login-card p-10 space-y-6">
            <i class="fa-solid fa-frog text-6xl text-[var(--brand)]"></i>
            <h1 class="text-2xl font-black uppercase tracking-tighter text-[var(--brand)]">CS Order Lookup</h1>
            <p class="text-xs text-[var(--text-dim)]">Secure access to Logistics updates.</p>
            <button onclick="login()" class="w-full py-4 bg-[var(--brand)] text-[#0f172a] rounded font-black uppercase text-sm tracking-[0.2em] hover:brightness-110 shadow-xl transition-all">Sign in with Microsoft</button>
        </div>
    </div>

    <header class="h-[60px] bg-[var(--bg-surface)] border-b border-[var(--border)] flex items-center justify-between px-6 shadow-sm z-20 relative">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-frog frog-mascot"></i>
            <div class="text-xl font-black uppercase tracking-tighter text-[var(--brand)]">LOGILOG <span class="text-[12px] opacity-70 ml-1 text-white">CS PORTAL</span></div>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-[10px] font-black uppercase tracking-widest text-[var(--text-dim)] bg-black/20 px-4 py-2 rounded-full border border-[var(--border)]">
                <i class="fa-solid fa-user text-[var(--brand)] mr-2"></i><span id="user-name-text">Loading...</span>
            </div>
        </div>
    </header>

    <div class="app-container">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="cs-search-input" onkeypress="handleEnter(event)" placeholder="Search Order #..." class="search-input" autocomplete="off">
            <div class="text-center mt-3 text-xs text-[var(--text-dim)] uppercase tracking-widest font-bold">Press Enter to search Logistics Database</div>
        </div>

        <div id="loading-indicator" class="hidden flex-col items-center justify-center my-10">
            <i class="fa-solid fa-satellite-dish fa-spin text-4xl text-[var(--brand)] mb-4"></i>
            <span class="font-black uppercase tracking-widest text-xs text-[var(--text-dim)] animate-pulse">Querying Database...</span>
        </div>

        <div id="results-container" class="results-container">
            </div>
    </div>

    <script>
        // MSAL Authentication config
        const msalConfig = { 
            auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: window.location.href }, 
            cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true } 
        };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        let msalAccount = null;

        // Environment Variables
        const ENV_DATA = "https://org23279050.crm.dynamics.com";
        const DATA_API = `${ENV_DATA}/api/data/v9.2`;
        const ENTITY_SET = "cr714_logisticslog_2s"; 

        window.onload = () => { 
            msalInstance.handleRedirectPromise().then(resp => {
                if (resp && resp.account) { applyIdentity(resp.account); } 
                else {
                    const accounts = msalInstance.getAllAccounts();
                    if(accounts.length > 0) { applyIdentity(accounts[0]); } 
                }
            }).catch(e => console.error(e));
        };

        async function getToken() {
            const request = { scopes: [`${ENV_DATA}/user_impersonation`], account: msalAccount };
            try { 
                return (await msalInstance.acquireTokenSilent(request)).accessToken; 
            } catch (e) { 
                document.getElementById('login-container').style.display = 'flex';
                document.getElementById('loading-indicator').style.display = 'none';
                throw new Error("Session expired. Please sign in again.");
            }
        }

        function login() { 
            msalInstance.loginPopup({ scopes: ["User.Read"] }).then(resp => { 
                if(resp && resp.account) applyIdentity(resp.account); 
            });
        }

        function applyIdentity(account) {
            document.getElementById('login-container').style.display = 'none';
            msalAccount = account; 
            document.getElementById('user-name-text').innerText = account.name;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }

        async function performSearch() {
            const query = document.getElementById('cs-search-input').value.trim();
            const resultsContainer = document.getElementById('results-container');
            const loader = document.getElementById('loading-indicator');
            
            if (query.length < 3) {
                resultsContainer.innerHTML = `<div class="text-center text-[var(--text-accent)] font-bold text-sm uppercase tracking-widest mt-10"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Please enter at least 3 characters to search.</div>`;
                return;
            }

            resultsContainer.innerHTML = "";
            loader.style.display = "flex";

            try {
                const token = await getToken();
                const cleanQuery = query.replace(/'/g, "''"); // prevent SQL injection breaks
                
                const headers = { 
                    'Authorization': `Bearer ${token}`, 
                    'Accept': 'application/json', 
                    'OData-MaxVersion': '4.0', 
                    'OData-Version': '4.0',
                    'Prefer': 'odata.include-annotations="OData.Community.Display.V1.FormattedValue"'
                };

                // Strictly fetch checking only the Order Number field
                const res = await fetch(`${DATA_API}/${ENTITY_SET}?$filter=contains(cr714_salesordernumber, '${cleanQuery}')&$orderby=createdon desc&$top=50`, { headers });

                if (!res.ok) throw new Error("Dataverse API rejected the query request.");
                const data = await res.json();
                
                loader.style.display = "none";
                renderResults(data.value, query);

            } catch (error) {
                loader.style.display = "none";
                resultsContainer.innerHTML = `<div class="text-center text-[var(--danger)] font-bold text-sm uppercase tracking-widest mt-10"><i class="fa-solid fa-circle-xmark mr-2"></i>Error querying database. Please try again.</div>`;
                console.error(error);
            }
        }

        function renderResults(records, query) {
            const container = document.getElementById('results-container');
            
            if (!records || records.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center opacity-30 mt-20">
                        <i class="fa-solid fa-box-open text-6xl mb-4"></i>
                        <p class="font-black uppercase tracking-widest text-lg">No Logistics Records Found</p>
                        <p class="text-xs font-bold mt-2">For search: "${query}"</p>
                    </div>`;
                return;
            }

            const html = records.map(r => {
                const fv = (field) => r[`${field}@OData.Community.Display.V1.FormattedValue`] || r[`_${field}_value@OData.Community.Display.V1.FormattedValue`];
                
                const order = String(r.cr714_salesordernumber || 'N/A').trim();
                const account = String(r.cr714_accountnum || r.cr714_accountnumber || 'N/A').trim();
                const company = String(r.cr714_companyordeliveryname || 'Unknown Company');
                const issue = String(fv('cr714_issue') || r.cr714_issue || 'General');
                const description = String(r.cr714_description || r.cr714_issue_description || 'No detailed description provided.');
                
                const status = String(fv('cr714_disposition') || r.cr714_disposition || 'Pending');
                let statusColor = 'var(--brand)';
                if (status === 'Pending') statusColor = 'var(--text-accent)';
                else if (status === 'Completed' || status === 'Sent Back') statusColor = 'var(--text-dim)';
                else if (status.includes('Escalated')) statusColor = 'var(--danger)';

                const submitter = String(fv('cr714_rep') || r.cr714_rep || fv('cr714_submitrep') || r.cr714_submitrep || 'Unknown Rep');
                const rawOwner = String(fv('cr714_logisticsowner') || r.cr714_logisticsowner || 'Unassigned');
                const owner = rawOwner === 'Unassigned' ? 'Unassigned' : rawOwner.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                
                const rawDate = r.cr714_starttime || r.createdon;
                const formattedDate = rawDate ? new Date(rawDate).toLocaleString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Unknown Date';

                const warehouseNotes = String(r.cr714_receivedemailfromwarehousenotes || 'No updates yet.');
                const driverNotes = String(r.cr714_receivedtextfromdrivernotes || 'No updates yet.');

                return `
                    <div class="result-card">
                        <div class="card-header">
                            <div class="flex flex-col">
                                <span class="font-black text-xl text-[var(--text-main)] uppercase tracking-tight">${company}</span>
                                <span class="text-xs font-mono text-[var(--text-dim)] uppercase tracking-widest mt-1">Order #${order} <span class="mx-2 opacity-30">|</span> Acct #${account}</span>
                            </div>
                            <span class="disp-pill" style="color: ${statusColor}">${status}</span>
                        </div>
                        
                        <div class="card-body">
                            <div class="flex flex-col gap-1 border-l-2 border-[var(--text-accent)] pl-3">
                                <span class="text-[10px] font-black uppercase tracking-widest text-[var(--text-accent)]">Submission Details: ${issue}</span>
                                <span class="text-sm font-medium text-[var(--text-main)]">${description}</span>
                            </div>

                            <div class="grid grid-cols-2 gap-4 mt-2">
                                <div class="flex flex-col gap-1.5">
                                    <span class="text-[10px] font-black uppercase tracking-widest text-[var(--text-dim)]">Warehouse Updates</span>
                                    <div class="notes-box">${warehouseNotes}</div>
                                </div>
                                <div class="flex flex-col gap-1.5">
                                    <span class="text-[10px] font-black uppercase tracking-widest text-[var(--text-dim)]">Driver Feedback</span>
                                    <div class="notes-box">${driverNotes}</div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-user-pen text-[var(--brand)]"></i>
                                <span>Submitted by <strong class="text-[var(--text-main)]">${submitter}</strong></span>
                            </div>
                            <div class="flex items-center gap-2 font-bold">
                                <i class="fa-regular fa-clock"></i> ${formattedDate}
                            </div>
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-user-shield text-[var(--text-accent)]"></i>
                                <span>Logistics Rep: <strong class="text-[var(--text-main)]">${owner}</strong></span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }
    </script>
</body>
</html>
