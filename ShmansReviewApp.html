<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1a2333; --muted:#64748b; --line:#e2e8f0;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --orange:#ea580c;
  --blue:#2563eb; --indigo:#4f46e5; --teal:#0d9488; --rose:#e11d48; --purple:#7c3aed;
  --brand:#0066c0; --brand-ink:#ffffff; --soft:#eef2f7;
  --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --line:#334155; --soft:#1e2a4a;
         --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650}
a{color:var(--brand)}

header{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.hd h1{font-size:18px;letter-spacing:-.01em}
.hd .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.hd .spacer{flex:1}
.sync-dot{font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;border-bottom:2.5px solid transparent;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:550;white-space:nowrap;border-radius:6px 6px 0 0}
nav button:hover{color:var(--ink);background:var(--soft)}
nav button.on{color:var(--brand);border-bottom-color:var(--brand)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13.5px;max-width:170px}
.filters label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:2px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.fgroup{min-width:0}
.chip-clear{border:none;background:var(--soft);color:var(--brand);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:600}

main{max-width:1240px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.kpi.accent{border-left:4px solid var(--accent,var(--brand))}
.two{grid-template-columns:1fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.card h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}

.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--soft);cursor:pointer}
tbody tr.norow:hover{background:none;cursor:default}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:#fff}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--brand)}
.badge.warn{background:#fef3c7;color:#92400e}.badge.bad{background:#fee2e2;color:#991b1b}.badge.ok{background:#dcfce7;color:#166534}
@media (prefers-color-scheme: dark){.badge.warn{background:#453a12;color:#fcd34d}.badge.bad{background:#4a1d1d;color:#fca5a5}.badge.ok{background:#14351f;color:#86efac}}

.btn{border:none;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:4px 0}
.cal-cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:86px;padding:6px;cursor:pointer;transition:border-color .1s}
.cal-cell:hover{border-color:var(--brand)}
.cal-cell.dim{opacity:.42}
.cal-cell.today{border-color:var(--brand);border-width:2px}
.cal-cell .d{font-size:12.5px;font-weight:700}
.cal-mini{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.dot{width:auto;min-width:17px;height:17px;border-radius:6px;font-size:10.5px;font-weight:700;color:#fff;display:inline-grid;place-items:center;padding:0 4px}
@media(max-width:640px){.cal-cell{min-height:56px;padding:4px}.cal-mini .dot{min-width:14px;height:14px;font-size:9px}}
.cal-list .day-block{margin-bottom:14px}

.mu-chip{display:block;background:var(--purple);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-chip.Pending{background:#d97706}
.mu-chip.Approved{background:var(--purple)}
.mu-chip.Completed{background:var(--green)}
.mu-chip.Missed{background:var(--red)}

/* Modal sizing update */
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.65);z-index:90;display:grid;place-items:center;padding:24px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal h2{font-size:20px;font-weight:700;margin-bottom:18px}
.mrow{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.mrow>div{flex:1;min-width:180px}
.modal label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px}
.modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px}
.modal textarea{resize:vertical;min-height:160px;line-height:1.5}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}

.muted{color:var(--muted)} .small{font-size:12.5px} .mt{margin-top:12px} .mb{margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
canvas{max-height:280px}
.section-title{display:flex;align-items:center;gap:12px;margin:18px 0 10px;flex-wrap:wrap}
.section-title h2{font-size:16px}
.section-title select{max-width:180px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13.5px}

.cal-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 10px;
  transition: border-color .1s;
}
.cal-row:hover { border-color: var(--brand); }

.modal .cal-row {
  background: var(--bg);
}
.cal-row .row-top {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  width: 100%;
}
.cancelled {
  text-decoration: line-through;
  opacity: 0.6;
}
  

/* Attendance merge loading screen */
#loadScreen{position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:24px;background:rgba(15,23,42,.84);backdrop-filter:blur(8px)}
#loadScreen.on{display:grid}.load-card{width:min(520px,92vw);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.38);text-align:center}
.load-ring{width:56px;height:56px;margin:0 auto 16px;border:6px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.load-card h2{font-size:20px;margin-bottom:8px}.load-card p{color:var(--muted);margin:6px 0}.load-track{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:18px 0 10px}.load-bar{height:100%;width:8%;background:linear-gradient(90deg,var(--brand),var(--purple));transition:width .25s;border-radius:inherit}
#loadError{display:none;color:var(--red);font-weight:650}.source-badge{font-size:11px;color:var(--muted);margin-left:8px}
</style>

<body>
<div id="loadScreen" role="status" aria-live="polite" aria-busy="true">
  <div class="load-card">
    <div class="load-ring" aria-hidden="true"></div>
    <h2>Loading Workforce attendance</h2>
    <p id="loadMessage">Connecting to Dataverse and downloading Attendance Tracker...</p>

<header>

  <nav id="nav"></nav>
</header>

<main id="view"></main>
<div id="modalHost"></div>

<script>
"use strict";

const DATAVERSE_URL = "https://org23279050.crm.dynamics.com";
const TABLE_TIMEOFF = "cr714_timeoff_2s";
const TABLE_EMPLOYEES = "cr714_employeeinformation1s";
const ATTENDANCE_FLOW_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/09/workflows/9db264926dec4064bf632dfb9bdab17c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=j31kwwv4MjwKGCUkiLXGg5ez9082UjmeYcq48UbExI8";
let attendanceLoadPromise = null;
let attendanceLookup = new Map();
let attendanceLoadStats = { rows:0, keys:0, loaded:false };

const msalConfig = { 
  auth: { 
    clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", 
    authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", 
    redirectUri: window.location.origin + window.location.pathname 
  },
  cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true } 
};
const msalInstance = new msal.PublicClientApplication(msalConfig);

window.onload = async () => {
  try {
    await msalInstance.handleRedirectPromise();
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) {
      if (!S.employees || S.employees.length === 0) {
        pullFromDataverse(false);
      } else {
        pullFromDataverse(true);
      }
    }
  } catch (err) {
    console.error("MSAL init error:", err);
  }
};

async function getDataverseToken() {
  const scope = `${DATAVERSE_URL}/.default`;
  let account = msalInstance.getAllAccounts()[0];

  if (!account) {
    const loginResp = await msalInstance.loginPopup({ scopes: ["User.Read", scope] });
    account = loginResp.account;
  }

  const tokenRequest = { scopes: [scope], account };

  try {
    const resp = await msalInstance.acquireTokenSilent(tokenRequest);
    return resp.accessToken;
  } catch (silentErr) {
    const popupResp = await msalInstance.acquireTokenPopup(tokenRequest);
    return popupResp.accessToken;
  }
}

function to12Hour(timeStr) {
  if (!timeStr) return "";
  let s = String(timeStr).trim();
  if (/AM|PM/i.test(s)) {
    return s.replace(/\s*(AM|PM)/i, " $1").toUpperCase();
  }
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (!match) return s;
  let h = parseInt(match[1], 10), m = match[2];
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

function formatDuration(hStr) {
  if (!hStr) return "";
  let s = String(hStr).trim();
  let totalMinutes = 0;
  const match = s.match(/^(\d{1,2}):(\d{2})$/);
  if (match) {
    totalMinutes = parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
  } else if (!isNaN(parseFloat(s))) {
    totalMinutes = Math.round(parseFloat(s) * 60);
  } else {
    return s;
  }
  const hrs = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;
  if (hrs > 0 && mins > 0) return `${hrs}h ${mins}m`;
  if (hrs > 0) return `${hrs} hr${hrs > 1 ? 's' : ''}`;
  return `${mins} mins`;
}

function cleanMakeUpString(str) {
  if (!str) return "";
  return String(str).split(',').map(entry => {
    const parts = entry.split(' - ').map(p => p.trim());
    if (parts.length >= 3) {
      const datePart = parts[0];
      const timeRange = parts[1].split('-').map(t => to12Hour(t.trim())).join(' - ');
      const dur = formatDuration(parts[2]);
      return `${datePart} - ${timeRange} - ${dur}`;
    }
    return entry;
  }).join(', ');
}

function formatReadableNotes(notes) {
  if (!notes) return "";
  let s = String(notes);
  s = s.replace(/(Schedule:|Rep Notes:|Lunch Selection:|Total Hours:|Total Make-up Hours:|Extended Lunch Duration:|Worked)/gi, '\n$1');
  s = s.replace(/\n\s*\n/g, '\n').trim();
  return s;
}

function getRelevantMakeUpNotes(notes, currentDate) {
  if (!notes || !currentDate) return notes;
  const lines = notes.split('\n');
  const [cY, cM, cD] = currentDate.split('-');
  const targetUS = `${cM}/${cD}/${cY}`;

  const filteredLines = lines.filter(line => {
    const dateMatch = line.match(/(\d{2}\/\d{2}\/\d{4})/);
    if (dateMatch) {
      return line.includes(targetUS);
    }
    return true;
  });

  return filteredLines.join('\n');
}

function normalizeTimeRange(str) {
  if (!str) return "";
  return String(str).replace(/(\d{1,2}:\d{2}(?::\d{2})?)/g, match => format12Hour(match));
}

function hoursToHHMM(val) {
  if (val == null || isNaN(val)) return "00:00";
  const totalMinutes = Math.round(parseFloat(val) * 60);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function formatChipTime(notes) {
  if (!notes) return "";
  const matches = [...notes.matchAll(/(\d{1,2}:\d{2}\s*(?:AM|PM))/gi)];
  if (matches.length >= 2) {
    return `${matches[0][1].toUpperCase()} - ${matches[1][1].toUpperCase()}`;
  }
  return "";
}

function extractShiftHours(r) {
  if (r.partialShift) {
    let s = String(r.partialShift).trim();
    const milMatch = s.match(/^(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})$/);
    if (milMatch) {
      const formatMil = (h, m) => {
        let hr = parseInt(h, 10);
        const min = m;
        const ampm = hr >= 12 ? "PM" : "AM";
        hr = hr % 12 || 12;
        return `${hr}:${min} ${ampm}`;
      };
      return `${formatMil(milMatch[1], milMatch[2])} - ${formatMil(milMatch[3], milMatch[4])}`;
    }
    return s;
  }

  if (r.type && (r.type.includes("PTO") || r.type === "Absent" || r.type === "LOA") && r.hours) {
    return `${parseFloat(r.hours)} h`;
  }

  const notes = r.notes || "";
  const timeMatch = notes.match(/(\d{1,2}:\d{2}\s*(?:AM|PM))\s*[–-]\s*(\d{1,2}:\d{2}\s*(?:AM|PM))/i);
  if (timeMatch) {
    return `${timeMatch[1].toUpperCase()} - ${timeMatch[2].toUpperCase()}`;
  }

  if (r.hours) {
    return `${parseFloat(r.hours)} h`;
  }

  return "—";
}

function parseDatesToIso(dateStr, createdOn) {
  if (!dateStr && createdOn) return [isoDate(new Date(createdOn))];
  if (!dateStr) return [today()];
  const parts = String(dateStr).split(' - ').map(s => s.trim());
  const parsePart = (p) => {
    const m = p.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
    const iso = p.match(/^\d{4}-\d{2}-\d{2}/);
    return iso ? iso[0] : null;
  };
  const d1 = parsePart(parts[0]);
  const d2 = parts[1] ? parsePart(parts[1]) : d1;
  if (!d1) return [createdOn ? isoDate(new Date(createdOn)) : today()];
  if (d1 === d2 || !d2) return [d1];
  const list = [];
  let cur = parseISO(d1), target = parseISO(d2);
  while (cur <= target) {
    list.push(isoDate(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return list.length ? list : [d1];
}

function mapLeaveType(val) {
  if (!val) return "Present";
  const s = String(val).toLowerCase();
  if (s.includes("pto")) return "PTO";
  if (s.includes("shift trade")) return "Shift Trade";
  if (s.includes("make up")) return "Make up Time";
  if (s.includes("schedule adjustment")) return "Schedule Adjustment";
  if (s.includes("jury") || s.includes("bereavement")) return "Jury Duty / Bereavement";
  if (s.includes("call out") || s.includes("absent")) return "Call Out";
  if (s.includes("cancellation")) return "Cancellation";
  if (s.includes("short shift")) return "Short Shift";
  if (s.includes("ncns")) return "NCNS";
  if (s.includes("tardy")) return "Tardy";
  if (s.includes("loa")) return "LOA";
  return "Call Out";
}

function parseHours(r) {
  if (r.cr714_ptohoursrequested != null && !isNaN(parseFloat(r.cr714_ptohoursrequested))) {
    return parseFloat(r.cr714_ptohoursrequested);
  }
  if (r.cr714_hoursofpartialshift) {
    const matches = String(r.cr714_hoursofpartialshift).match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/gi);
    if (matches && matches.length >= 2) {
      const pTime = (t) => {
        const parts = t.trim().split(/[:\s]/);
        let h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
        const ampm = parts[2] ? parts[2].toUpperCase() : null;
        if (ampm === "PM" && h < 12) h += 12;
        if (ampm === "AM" && h === 12) h = 0;
        return h + (m / 60);
      };
      let diff = pTime(matches[1]) - pTime(matches[0]);
      if (diff < 0) diff += 24;
      return Math.round(diff * 100) / 100;
    }
  }
  return 8;
}

function parseMakeUpHours(r) {
  const raw = String(r.cr714_makeuptime || r.notes || "");
  const totalMatch = raw.match(/Total Hours:\s*([\d:]+)/i);
  if (totalMatch) {
    const tStr = totalMatch[1];
    if (tStr.includes(':')) {
      const [hh, mm] = tStr.split(':').map(Number);
      return (hh || 0) + ((mm || 0) / 60);
    } else if (!isNaN(parseFloat(tStr))) {
      return parseFloat(tStr);
    }
  }

  if (r.cr714_makeuptime) {
    let total = 0;
    const parts = String(r.cr714_makeuptime).split(',');
    for (const part of parts) {
      const segments = part.split('-');
      if (segments.length >= 3) {
        const hStr = segments[segments.length - 1].trim();
        if (hStr.includes(':')) {
          const [hh, mm] = hStr.split(':').map(Number);
          total += (hh || 0) + ((mm || 0) / 60);
        } else if (!isNaN(parseFloat(hStr))) {
          total += parseFloat(hStr);
        }
      }
    }
    if (total > 0) return Math.round(total * 100) / 100;
  }
  return 0.5;
}


function showLoadScreen(message, progress=8, detail=""){
  const screen=document.getElementById("loadScreen");

    startDate:r.startDate??r["Start Date"]??null,
    endDate:r.endDate??r["End Date"]??null,

async function downloadAttendanceTracker(force=false){
  if(attendanceLoadPromise&&!force)return attendanceLoadPromise;
  attendanceLoadPromise=(async()=>{
    updateLoad("Downloading normalized Attendance rows...",24,"Requesting LeaveTracker JSON from Power Automate.");
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),180000);
    try{
      const res=await fetch(ATTENDANCE_FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({action:"getAttendanceRows",responseVersion:2,requestedAtUtc:new Date().toISOString()}),signal:ctl.signal});
      if(!res.ok)throw new Error(`Attendance flow HTTP ${res.status}: ${(await res.text()).slice(0,500)}`);
      const responseText=await res.text();
      const payload=unwrapAttendanceFlowPayload(parseFirstJsonValue(responseText));
      if(payload&&typeof payload.rows==="string"){
        try{payload.rows=parseFirstJsonValue(payload.rows);}
        catch(err){throw new Error(`Attendance flow rows was returned as a string but could not be parsed: ${err.message}`);}
      }
      if(!payload||!Array.isArray(payload.rows)){
        const fields=payload&&typeof payload==="object"?Object.keys(payload).join(", "):typeof payload;
        throw new Error(`Attendance flow must return rows as a JSON array (responseVersion 2). Returned fields: ${fields||"none"}.`);
      }
      const cutoff=new Date();cutoff.setHours(0,0,0,0);cutoff.setMonth(cutoff.getMonth()-24);
      const cutoffKey=mergeDateKey(cutoff);
      const filteredRows=payload.rows.filter(raw=>{
        const r=normalizeFlowRow(raw),end=dateOnly(r.endDate)||dateOnly(r.startDate);
        return end&&mergeDateKey(end)>=cutoffKey;
      });
      updateLoad("Indexing Attendance rows...",44,`Received ${payload.rows.length.toLocaleString()} rows; retained ${filteredRows.length.toLocaleString()} from the last 24 months.`);
      const built=buildAttendanceLookupFromRows(filteredRows);
      attendanceLookup=built.lookup;
      attendanceLoadStats={rows:filteredRows.length,receivedRows:payload.rows.length,filteredOut:payload.rows.length-filteredRows.length,cutoffDate:isoDate(cutoff),keys:attendanceLookup.size,validRows:built.validRows,loaded:true,source:payload.source||"LeaveTracker",responseVersion:payload.responseVersion||2,sampleAttendanceKeys:[...attendanceLookup.keys()].slice(0,5)};
      window.attendanceFlowDiagnostics={success:payload.success,rowCount:payload.rowCount,returnedRows:payload.rows.length,...attendanceLoadStats};

      fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_EMPLOYEES}`, { headers }),
      fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}?$orderby=createdon desc`, { headers }),
      downloadAttendanceTracker(false)

    if (!empRes.ok) throw new Error(`Employees Table HTTP ${empRes.status}: ${empRes.statusText}`);
    if (!toRes.ok) throw new Error(`Time Off Table HTTP ${toRes.status}: ${toRes.statusText}`);

    const empData = await empRes.json();
    const toData = await toRes.json();
    updateLoad("Merging Attendance Tracker...",64,`Using ${attendanceLoadStats.source}, JSON rows; matching employee name, start date, and end date.`);

      if (e.statecode === 1) return false;
      const status = String(
        e["cr714_statusname@OData.Community.Display.V1.FormattedValue"] ||
        e.cr714_statusname ||
        e["cr714_status@OData.Community.Display.V1.FormattedValue"] ||
        e.cr714_status ||

        return false;
      }

    });

      const loc = String(
        e["cr714_locationname@OData.Community.Display.V1.FormattedValue"] ||

        e["cr714_location@OData.Community.Display.V1.FormattedValue"] ||

  async function cancelRecordRequest(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  if (!confirm("Are you sure you want to cancel this request? It will remain visible but crossed out.")) return;

  target.cancelled = true;
  const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;
  S.records.filter(r => r.rid.startsWith(basePrefix)).forEach(r => r.cancelled = true);
  S.makeups.filter(m => m.mid === basePrefix || m.rid.startsWith(basePrefix) || m.dvId === target.dvId).forEach(m => m.status = "Cancelled");

  save();
  closeModal();
  render();
  toast("Request cancelled");
}

  async function toggleCancelRecord(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  const newCancelledState = !target.cancelled;
  target.cancelled = newCancelledState;

  if (target.dvId) {
    S.records.filter(r => r.dvId === target.dvId).forEach(r => r.cancelled = newCancelledState);
    S.makeups.filter(m => m.dvId === target.dvId).forEach(m => m.status = newCancelledState ? "Cancelled" : "Pending");
    
    // Sync change back to Dataverse
    await patchDataverseRecord(target.dvId, { cr714_cancelledrequest: newCancelledState });
  } else {
    const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;
    S.records.filter(r => r.rid === rid || r.rid.startsWith(basePrefix + '-')).forEach(r => r.cancelled = newCancelledState);
    S.makeups.filter(m => m.mid === basePrefix || m.rid.startsWith(basePrefix)).forEach(m => m.status = newCancelledState ? "Cancelled" : "Pending");
  }

  save();
  closeModal();
  render();
  toast(newCancelledState ? "Request cancelled" : "Request restored");
}

  
async function deleteRecordFromDataverse(rid) {
  const target = S.records.find(r => r.rid === rid);
  if (!target) return;

  if (!confirm("Are you sure you want to permanently delete this record from Dataverse?")) return;

  if (target.dvId) {
    setSync("Deleting from Dataverse...");
    try {
      const token = await getDataverseToken();
      if (!token) throw new Error("Authentication missing");

      const res = await fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}(${target.dvId})`, {
        method: "DELETE",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/json",
          "OData-MaxVersion": "4.0",
          "OData-Version": "4.0"
        }
      });

      if (!res.ok && res.status !== 204 && res.status !== 404) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
    } catch (err) {
      console.error("Delete failed:", err);
      toast("Failed to delete from Dataverse: " + err.message);
      setSync("");
      return;
    }
  }

  const basePrefix = rid.includes('-') ? rid.split('-')[0] : rid;
  S.records = S.records.filter(r => !r.rid.startsWith(basePrefix));
  S.makeups = S.makeups.filter(m => m.mid !== basePrefix && m.dvId !== target.dvId);

  save();
  closeModal();
  render();
  setSync("");
  toast("Record deleted from Dataverse permanently");
}

async function patchDataverseRecord(dvId, fields) {
  try {
    const token = await getDataverseToken();
    if (!token) return;
    
    const payload = {};
    if (fields.cr714_fmla !== undefined) {
      payload.cr714_fmla = fields.cr714_fmla ? "true" : "false";
    }
    if (fields.cr714_voicemail !== undefined) {
      payload.cr714_voicemail = fields.cr714_voicemail ? "true" : "false";
    }
    if (fields.cr714_occurrence !== undefined) {
      payload.cr714_occurrence = String(parseInt(fields.cr714_occurrence, 10) || 0);
    }
    if (fields.cr714_cancelledrequest !== undefined) {
      payload.cr714_cancelledrequest = fields.cr714_cancelledrequest ? "true" : "false";
    }
    if (fields.cr714_wfnotes !== undefined) {
      payload.cr714_wfnotes = fields.cr714_wfnotes;
    }

    const res = await fetch(`${DATAVERSE_URL}/api/data/v9.2/${TABLE_TIMEOFF}(${dvId})`, {
      method: "PATCH",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json",
        "Accept": "application/json",
        "OData-MaxVersion": "4.0",
        "OData-Version": "4.0"
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok && res.status !== 204) {
      const errText = await res.text();
      console.error("Dataverse patch error:", errText);
      toast("Failed to save changes to Dataverse");
    } else {
      toast("Changes saved to Dataverse");
    }
  } catch(err) {
    console.error("Dataverse patch failed:", err);
  }
}

function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoDate(d); }
function fmt(s){ if(!s) return "—"; return parseISO(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }

function range(){
  const a = UI.anchor||today(), d = parseISO(a);
  switch(UI.preset){
    case "day":     return [a,a];
    case "week": {  const dow=d.getDay(); const s=addDays(a,-dow); return [s, addDays(s,6)]; }
    case "month": { const s=new Date(d.getFullYear(),d.getMonth(),1), e=new Date(d.getFullYear(),d.getMonth()+1,0); return [isoDate(s),isoDate(e)]; }
    case "quarter":{const q=Math.floor(d.getMonth()/3); const s=new Date(d.getFullYear(),q*3,1), e=new Date(d.getFullYear(),q*3+3,0); return [isoDate(s),isoDate(e)]; }
    case "annual":{ return [d.getFullYear()+"-01-01", d.getFullYear()+"-12-31"]; }
    case "adjusted": return [UI.from||a, UI.to||a];
  }
  return [a,a];
}

function filteredEmployees(){
  if (!S.employees) return [];
  const q = UI.q.trim().toLowerCase();
  return S.employees.filter(e =>
    (!UI.dept||e.dept===UI.dept) && 
    (!UI.repName||e.name===UI.repName) && 
    (!UI.title||e.title===UI.title) &&
    (!UI.supervisor||e.supervisor===UI.supervisor) && 
    (!UI.manager||e.manager===UI.manager) &&
    (!q || e.name.toLowerCase().includes(q) || e.id.toLowerCase().includes(q))
  );
}

function filteredRecords(from,to){
  if (!S.records) return [];
  const ids = new Set(filteredEmployees().map(e=>e.id));
  const [f,t] = from?[from,to]:range();
  return S.records.filter(r => ids.has(r.empId) && r.date>=f && r.date<=t && (!UI.type || r.type === UI.type));
}

function emp(id){ return S.employees?.find(e=>e.id===id); }
function occurrenceValue(r){
  if (!r || r.waived || r.cancelled) return 0;
  const mergedValue = Number(r.occurrence);
  if (Number.isFinite(mergedValue) && mergedValue > 0) return mergedValue;
  return Number(TYPES[r.type]?.occ) || 0;
}
function isOcc(r){ return occurrenceValue(r) > 0; }

function occCount(empId, asOf){
  if (!S.records) return 0;
  const from = addDays(asOf, -OCC_WINDOW_DAYS);
  return S.records.filter(r=>r.empId===empId && r.date>from && r.date<=asOf).reduce((n,r)=>n+occurrenceValue(r),0);
}

function level(n){ for(const [k,name,cls] of LADDER) if(n>=k) return {name,cls}; return null; }

function ossUsed(empId, asOf){
  if (!S.makeups) return 0;
  const from = addDays(asOf||today(), -365);
  return S.makeups.filter(m=>m.empId===empId && m.oss && m.status!=="Missed" && m.dateMissed>=from).length;
}

function metrics(){
  const [f,t]=range(), emps=filteredEmployees(), recs=filteredRecords();
  const c = {}; TYPE_NAMES.forEach(n=>c[n]=0);
  let occ=0; 
  
  recs.forEach(r=>{ 
    c[r.type]=(c[r.type]||0)+1; 
    occ += occurrenceValue(r); 
  });

  // Calculate default Present count for days without explicit records
  let days=[]; for(let d=f; d<=t && days.length<370; d=addDays(d,1)) days.push(d);
  let totalPossibleWorkDays = days.length * emps.length;
  let loggedNonPresent = recs.filter(r => r.type !== "Present").length;
  let explicitPresent = recs.filter(r => r.type === "Present").length;
  
  // Default remaining unlogged days/reps as Present
  c["Present"] = explicitPresent + Math.max(0, totalPossibleWorkDays - (explicitPresent + loggedNonPresent));

  const withRec = new Set(recs.map(r=>r.empId));
  const offenders = new Set(recs.filter(isOcc).map(r=>r.empId));
  const perfect = emps.filter(e=>!offenders.has(e.id));
  const empIds = new Set(emps.map(e=>e.id));
  const mus = (S.makeups||[]).filter(m=>empIds.has(m.empId) && m.dateMissed>=f && m.dateMissed<=t);
  const muDone = mus.filter(m=>m.status==="Completed").length;
  
  const denom = c["Present"] + Object.keys(c).filter(k => k !== "Present" && k !== "Make up Time").reduce((acc, k) => acc + c[k], 0);
  const rate = denom ? Math.round(100 * c["Present"] / denom) : null;
  
  return {c, occ, perfect, rate, mus, muDone, muPending:mus.filter(m=>m.status==="Pending").length, emps, recs, from:f, to:t};
}

  if (cat === "Perfect") {
    if(m.perfect.length === 0) {
      rows = `<tr class="norow"><td colspan="3" class="empty">No perfect attendance in this period.</td></tr>`;
    } else {
      rows = m.perfect.map(e => `<tr data-emp="${esc(e.id)}" style="cursor:pointer"><td><b>${esc(e.name)}</b></td><td>${esc(e.dept)}</td><td>${esc(e.supervisor)}</td></tr>`).join("");
    }
    html += `<div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Supervisor</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    const status = cat === "Make-Ups Pending" ? "Pending" : "Completed";
    let mus = m.mus.filter(x => x.status === status);
    
    const seenDvIds = new Set();
    mus = mus.filter(mu => {
      const key = mu.dvId || mu.mid;
      if (seenDvIds.has(key)) return false;
      seenDvIds.add(key);
      return true;
    });

    if(mus.length === 0) {
      html += `<div class="empty">No ${status.toLowerCase()} make-ups in this period.</div>`;
    } else {
      html += `<div style="display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding-right: 4px;">${mus.map(mu => muRow(mu)).join("")}</div>`;
    }
  } else {
    let recs = cat === "Occurrences" ? m.recs.filter(isOcc) : m.recs.filter(r => r.type === cat);
    recs.sort((a,b) => b.date.localeCompare(a.date));
    if(recs.length === 0) {
      html += `<div class="empty">No records in this period.</div>`;
    } else {
      html += `<div style="display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; padding-right: 4px;">${recs.map(r => rowRecord(r, true)).join("")}</div>`;
    }
  }

  html += `<div class="mfoot mt"><button class="btn ghost" onclick="closeModal()">Close</button></div>`;
  openModal(html);
  
  const mh = $("#modalHost");
  if (cat === "Perfect") {
    mh.querySelectorAll("tr[data-emp]").forEach(tr=>tr.onclick=()=>{closeModal(); empModal(tr.dataset.emp);});
  } else if (cat === "Make-Ups Pending" || cat === "Make-Up Completion") {
    mh.querySelectorAll("[data-mu-act]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const act=b.dataset.muAct, id=b.dataset.id;
      if(act==="edit") { closeModal(); makeupModal(id); }
      else { setMuStatus(id, act==="approve"?"Approved":act==="complete"?"Completed":"Missed"); closeModal(); }
    });
  } else {
    bindRecordButtons(mh);
  }
}

function drawCharts(){
  charts.forEach(c => c.destroy()); 
  charts = [];
  if (typeof Chart === "undefined") return;
  const m = metrics(), days = []; 
  for (let d = m.from; d <= m.to && days.length < 31; d = addDays(d, 1)) days.push(d);

  const trendLabels = [];
  const absenceData = [];
  const leaveData = [];

  days.forEach(d => {
    trendLabels.push(parseISO(d).toLocaleDateString(undefined, {month:"short", day:"numeric"}));
    
    const dayCallOuts = m.recs.filter(r => r.date === d && (r.type === "Call Out" || r.type === "NCNS" || r.type === "Tardy")).length;
    const dayOtherLeave = m.recs.filter(r => r.date === d && r.type !== "Call Out" && r.type !== "NCNS" && r.type !== "Tardy" && r.type !== "Present" && r.type !== "Make up Time").length;

    absenceData.push(dayCallOuts);
    leaveData.push(dayOtherLeave);
  });

  const tr = $("#chTrend"); 
  if (tr) {
    charts.push(new Chart(tr, {
      type: "bar",
      data: {
        labels: trendLabels,
        datasets: [
          {
            label: "Call Outs / Exceptions",
            data: absenceData,
            backgroundColor: "#dc2626",
            borderRadius: 4
          },
          {
            label: "PTO / Other Leave",
            data: leaveData,
            backgroundColor: "#0d9488",
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: "bottom" } },
        scales: { 
          x: { stacked: true, grid: { display: false } },
          y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } 
        },
        onClick: (event, elements) => {
          if (elements.length > 0) {
            const index = elements[0].index;
            const clickedDate = days[index];
            const datasetIndex = elements[0].datasetIndex;
            
            const dayRecs = m.recs.filter(r => {
              if (r.date !== clickedDate) return false;
              const isCallOut = (r.type === "Call Out" || r.type === "NCNS" || r.type === "Tardy");
              return datasetIndex === 0 ? isCallOut : !isCallOut && r.type !== "Present" && r.type !== "Make up Time";
            });

            let rows = dayRecs.length ? dayRecs.map(r => rowRecord(r)).join("") : `<tr class="norow"><td colspan="6" class="empty">No records for this category on ${fmt(clickedDate)}.</td></tr>`;

            openModal(`<h2>Records — ${fmt(clickedDate)}</h2>
              <div class="tbl-wrap"><table><thead><tr><th style="text-align:left">Date</th><th style="text-align:left">Employee</th><th style="text-align:left">Type</th><th style="text-align:left">Hours</th><th style="text-align:left">Notes</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
              <div class="mfoot mt"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
            bindRecordButtons($("#modalHost"));
          }
        }
      }
    }));
  }

  const mx = $("#chMix"); 
  if (mx) { 
    const names = TYPE_NAMES.filter(n => n !== "Present" && m.c[n] > 0);
    const colors = {
      "PTO": "#0d9488",
      "Shift Trade": "#2563eb",
      "Make up Time": "#7c3aed",
      "Schedule Adjustment": "#4f46e5",
      "Jury Duty / Bereavement": "#6366f1",
      "Call Out": "#dc2626",
      "Cancellation": "#22c55e",
      "Short Shift": "#ea580c",
      "NCNS": "#1d4ed8",
      "Tardy": "#d97706",
      "LOA": "#4338ca"
    };
    
    charts.push(new Chart(mx, {
      type: "doughnut",
      data: {
        labels: names,
        datasets: [{
          data: names.map(n => m.c[n]),
          backgroundColor: names.map(n => colors[n] || "var(--muted)")
        }]
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false, 
        plugins: { legend: { position: "bottom" } },
        onClick: (event, elements) => {
          if (elements.length > 0) {
            const index = elements[0].index;
            const clickedType = names[index];
            kpiModal(clickedType, `Records: ${clickedType}`);
          }
        }
      }
    })); 
  }
}

  
function calShift(dir){
  const d=parseISO(UI.anchor);
  if(UI.preset==="day") UI.anchor=addDays(UI.anchor,dir);
  else if(UI.preset==="week") UI.anchor=addDays(UI.anchor,7*dir);
  else if(UI.preset==="month"){ d.setMonth(d.getMonth()+dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="quarter"){ d.setMonth(d.getMonth()+3*dir); UI.anchor=isoDate(d); }
  else if(UI.preset==="annual"){ d.setFullYear(d.getFullYear()+dir); UI.anchor=isoDate(d); }
  else { const [f,t]=range(); const n=Math.max(1,Math.round((parseISO(t)-parseISO(f))/864e5)+1); UI.from=addDays(f,n*dir); UI.to=addDays(t,n*dir); }
  render();
}

function renderTeam(){
  const m=metrics();
  const teamRows=m.emps.map(e=>{
    const rs=m.recs.filter(r=>r.empId===e.id);
    const occ=rs.reduce((n,r)=>n+occurrenceValue(r),0), n90=occCount(e.id,m.to), lv=level(n90);
    const perfect=rs.length&&!occ;
    return {
      e, 
      rs, 
      name: e.name, 
      dept: e.dept, 
      supervisor: e.supervisor, 
      manager: e.manager, 
      recordsCount: rs.length, 
      occurrences: occ, 
      oss: ossUsed(e.id,m.to),

    <th data-team-sort="occurrences">Occurrences ${arrow("occurrences")}</th>
    <th data-team-sort="oss">OSS used ${arrow("oss")}</th>
  </tr></thead><tbody>
  ${teamRows.map(({e,recordsCount,occurrences,oss})=>`<tr data-emp="${esc(e.id)}">
    <td><b>${esc(e.name)}</b><div class="small muted">${esc(e.id)}</div></td>
    <td>${esc(e.dept)}</td><td>${esc(e.supervisor)}</td><td>${esc(e.manager)}</td>
    <td>${recordsCount}</td><td>${occurrences}</td>

  </tr>`).join("")||`<tr class="norow"><td colspan="7" class="empty">No employees match the filters.</td></tr>`}
  </tbody></table></div>`;

  const recs=filteredRecords().sort((a,b)=>UI.sortDir*(a[UI.sortKey]<b[UI.sortKey]?-1:a[UI.sortKey]>b[UI.sortKey]?1:0));
  const recordsHtml = `<div class="section-title mt" style="margin-top:32px;"><h2>Records (${recs.length})</h2>
    <button class="btn sm" id="recNew">+ Add record</button></div>

    <th data-sort="date">Date ${UI.sortKey==="date"?(UI.sortDir<0?"↓":"↑"):""}</th><th data-sort="empId">Employee</th>
    <th data-sort="type">Type</th><th>Hours</th><th>Notes</th><th></th>
  </tr></thead><tbody>${recs.map(r=>rowRecord(r)).join("")||`<tr class="norow"><td colspan="6" class="empty">No records in this period.</td></tr>`}</tbody></table></div>`;

  return teamHtml + recordsHtml;

function renderMakeup(){
  const [f,t] = range();
  const ids = new Set(filteredEmployees().map(e=>e.id));
  const mus = (S.makeups||[]).filter(m => ids.has(m.empId) && (!UI.muFilter || m.status === UI.muFilter));
  
  const byDate = {};
  mus.forEach(m => {
    const d = m.dateMissed;
    if (d) (byDate[d] = byDate[d] || []).push(m);
  });

  const counts = MU_STATUS.map(s => (S.makeups||[]).filter(m => ids.has(m.empId) && m.status === s).length);

  const head = `<div class="section-title">
    <h2>Make-Up Time Calendar</h2>
    <select id="muFilter">${["",...MU_STATUS].map(s=>`<option ${UI.muFilter===s?"selected":""} value="${esc(s)}">${esc(s||"All statuses")}</option>`).join("")}</select>
    <button class="btn sm" id="muNew">+ New agreement</button>
    <span class="small muted right">Pending ${counts[0]} · Approved ${counts[1]} · Completed ${counts[2]} · Missed ${counts[3]}</span>
  </div>
  <div class="card small mb" style="border-left:4px solid var(--purple)">
    An <b>OSS</b> (Out / Short-Shift) lets an agent make up missed time instead of taking an occurrence or losing pay —
    up to <b>${OSS_LIMIT} per rolling 12 months</b>. Completing the agreed make-up time <b>waives the linked occurrence</b>;
    missing it means the occurrence stands.
  </div>
  <div class="cal-head">
    <button class="btn ghost sm" id="calPrev">&#8249;</button>
    <button class="btn ghost sm" id="calToday">Today</button>
    <button class="btn ghost sm" id="calNext">&#8250;</button>
    <h2>${fmt(f)}${f!==t?" – "+fmt(t):""}</h2>
  </div>`;

  if(UI.preset==="week" || (UI.preset==="adjusted" && addDays(f,10)>t && addDays(f,1)<=t)){
    let days=[]; 
    for(let i=0; i<7; i++) days.push(addDays(f, i));

    if (!UI.selectedMuWeekDay || !days.includes(UI.selectedMuWeekDay)) {
      UI.selectedMuWeekDay = days.includes(today()) ? today() : days[0];
    }

    const dows=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const selDay = UI.selectedMuWeekDay;
    const dayMus = byDate[selDay] || [];

    const weekGridHtml = `<div class="cal-grid mt" style="margin-bottom: 20px;">
      ${days.map(ds => {
        const dObj = parseISO(ds);
        const dowName = dows[dObj.getDay()];
        const dMus = byDate[ds]||[];
        const isSelected = ds === selDay;

        return `<div class="cal-cell ${isSelected ? "today" : ""}" data-select-mu-day="${ds}" style="min-height: 80px; cursor: pointer; ${isSelected ? 'border-width: 2px; border-color: var(--brand); background: var(--soft);' : ''}">
          <div class="row"><div class="small muted" style="text-transform: uppercase;">${dowName}</div><div class="d">${dObj.getDate()}</div></div>
          <div class="cal-mini" style="flex-direction:column; gap:2px;">
            ${dMus.slice(0,2).map(m=>{
              const e = emp(m.empId) || {name: m.empId};
              const firstName = esc(e.name.span ? e.name : e.name.split(' ')[0]);
              const timeStr = formatChipTime(m.notes) || hoursToHHMM(m.hoursOwed);
              return `<div class="mu-chip ${esc(m.status)}" title="${esc(e.name)}: ${timeStr}" style="font-size:9px; padding:1px 4px;">${firstName}</div>`;
            }).join("")}
            ${dMus.length > 2 ? `<div class="small muted" style="font-size:9px;">+${dMus.length - 2} more</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`;

    const selectedDateObj = parseISO(selDay);
    const formattedSelectedTitle = selectedDateObj.toLocaleDateString(undefined, {weekday:"long", month:"short", day:"numeric", year:"numeric"});

    const daySectionHtml = `<div class="day-block card">
      <div class="row">
        <b>${formattedSelectedTitle}</b>
        <span class="small muted">${dayMus.length} make-up shift${dayMus.length===1?"":"s"}</span>
        <button class="btn ghost sm right" data-mu-add-day="${selDay}">+ Add</button>
      </div>
      ${dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:10px;">${dayMus.map(muRow).join("")}</div>` : `<div class="small muted mt">No make-up shifts scheduled for this day.</div>`}

    return head + weekGridHtml + daySectionHtml;

  let days=[]; for(let d=f; d<=t; d=addDays(d,1)) days.push(d);

    const dayMus = byDate[d] || [];
    return `<div class="day-block card">
      <div class="row">

        <button class="btn ghost sm right" data-mu-add-day="${esc(d)}">+ Add</button>
      </div>
      ${dayMus.length ? `<div class="mt" style="display:flex; flex-direction:column; gap:10px;">${dayMus.map(muRow).join("")}</div>` : `<div class="small muted mt">No make-up shifts scheduled.</div>`}
    </div>`;
  }).join("")}</div>`;
}
  
function setMuStatus(mid,status){
  const m=S.makeups.find(x=>x.mid===mid); if(!m) return;
  m.status=status;
  if(status==="Completed"){ m.completedDate=today();
    const r=S.records.find(r=>r.rid===m.rid)||S.records.find(r=>r.empId===m.empId&&r.date===m.dateMissed&&TYPES[r.type].occ);
    if(r){ r.waived=true; m.rid=r.rid; }
    toast("Make-up completed — occurrence waived");
  } else if(status==="Missed"){
    const r=S.records.find(r=>r.rid===m.rid); if(r) r.waived=false;
    toast("Marked missed — occurrence stands");
  } else toast("Agreement "+status.toLowerCase());
  save(); render();
}

  if (slim) {

        <div style="font-weight: 600; font-size: 13.5px; color: var(--muted);">${extractShiftHours(r)}</div>
        <div class="row right" style="gap: 6px; margin-left: auto;">
          <button class="btn ghost sm" data-rec-edit="${esc(r.rid)}">Edit</button>
        </div>
      </div>
      ${rawNotes ? `<div class="small muted" style="word-break: break-word; overflow-wrap: break-word; width: 100%; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--line); line-height: 1.5; white-space: pre-line;">${esc(formatReadableNotes(rawNotes))}</div>` : ""}
      ${r.wfNotes ? `<div class="small" style="word-break: break-word; overflow-wrap: break-word; width: 100%; margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--line); line-height: 1.4; color: var(--brand); font-weight: 500;"><b>Workforce Notes:</b> ${esc(r.wfNotes)}</div>` : ""}
    </div>`;
  }

  return `<tr data-rec="${esc(r.rid)}" class="${r.cancelled ? 'cancelled' : ''}" style="cursor:pointer" title="Click to edit record">
    <td>${fmt(r.date)}</td>
    <td><b>${esc(e.name)}</b></td>
    <td>
      ${pill(r.type)}
      ${badges}
    </td>
    <td>${r.hours||""}${r.hours?"h":""}</td>
    <td class="small">
      ${r.notes ? `<div>${esc(r.notes)}</div>` : ""}
      ${r.wfNotes ? `<div style="color: var(--brand); margin-top: 2px;"><b>WF Notes:</b> ${esc(r.wfNotes)}</div>` : ""}
    </td>
    <td class="row" style="gap:4px"><button class="btn ghost sm" data-rec-edit="${esc(r.rid)}">Edit</button></td></tr>`;
}

function renderRecords(){
  const recs=filteredRecords().sort((a,b)=>UI.sortDir*(a[UI.sortKey]<b[UI.sortKey]?-1:a[UI.sortKey]>b[UI.sortKey]?1:0));
  return `<div class="section-title"><h2>Records (${recs.length})</h2>
    <button class="btn sm" id="recNew">+ Add record</button></div>
  <div class="card tbl-wrap"><table><thead><tr>
    <th data-sort="date">Date ${UI.sortKey==="date"?(UI.sortDir<0?"↓":"↑"):""}</th><th data-sort="empId">Employee</th>
    <th data-sort="type">Type</th><th>Hours</th><th>Notes</th><th></th>
  </tr></thead><tbody>${recs.map(r=>rowRecord(r)).join("")||`<tr class="norow"><td colspan="6" class="empty">No records in this period.</td></tr>`}</tbody></table></div>`;
}

function openModal(html){ $("#modalHost").innerHTML=`<div class="overlay" id="ovl"><div class="modal">${html}</div></div>`;
  $("#ovl").addEventListener("click",e=>{ if(e.target.id==="ovl") closeModal(); }); }
function closeModal(){ $("#modalHost").innerHTML=""; }
function empSelect(id,cur){ return `<select id="${id}">${filteredEmployees().length?filteredEmployees().map(e=>`<option ${e.id===cur?"selected":""} value="${esc(e.id)}">${esc(e.name)} (${esc(e.id)})</option>`).join(""):S.employees.map(e=>`<option ${e.id===cur?"selected":""} value="${esc(e.id)}">${esc(e.name)}</option>`).join("")}</select>`; }

function recordModal(rid,presetDate){
  const r=rid? S.records.find(x=>x.rid===rid) : {date:presetDate||today(),empId:S.employees[0]?.id,type:"Present",hours:8,notes:"",wfNotes:"",fmla:false,voicemail:false,partialShift:""};
  const currentOcc = r.occurrence !== undefined ? r.occurrence : occCount(r.empId, today());

  openModal(`<h2>${rid?"Edit":"Add"} record</h2>
    <div class="mrow">
      <div><label>Employee</label>${empSelect("mEmp",r.empId)}</div>
      <div><label>${rid ? "Date" : "From"}</label><input type="date" id="mDate" value="${esc(r.date)}"></div>
      ${rid ? "" : `<div><label>To</label><input type="date" id="mDateTo" value="${esc(r.date)}"></div>`}
    </div>
    
    <div class="mrow">
      <div><label>Type / Leave Type</label><select id="mType">${TYPE_NAMES.map(t=>`<option ${t===r.type?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
      <div><label>Hours</label><input type="number" id="mHours" step="0.25" min="0" value="${r.hours}"></div>
      <div><label>Time Frame / Schedule Adjustment</label><input type="text" id="mPartial" placeholder="e.g. 12:30 PM - 5:00 PM" value="${esc(r.partialShift||"")}"></div>
    </div>

    <div class="mrow">
      <div><label>Occurrences</label>
        <div class="row" style="gap:4px">
          <button class="btn ghost sm" id="occMinus" style="padding:4px 10px; font-size:16px;">-</button>
          <input type="number" id="mOcc" value="${currentOcc}" style="width:60px; text-align:center" step="1">
          <button class="btn ghost sm" id="occPlus" style="padding:4px 10px; font-size:16px;">+</button>
        </div>
      </div>
      <div style="display:flex; align-items:flex-end; gap:16px;">
        <label class="row" style="font-size:13.5px;font-weight:600;cursor:pointer;padding-bottom:10px;">
          <input type="checkbox" id="mFmla" ${r.fmla?"checked":""} style="width:auto;cursor:pointer;"> FMLA
        </label>
        <label class="row" style="font-size:13.5px;font-weight:600;cursor:pointer;padding-bottom:10px;">
          <input type="checkbox" id="mVoicemail" ${r.voicemail?"checked":""} style="width:auto;cursor:pointer;"> Voicemail
        </label>
      </div>
    </div>
    
    <div><label>Notes</label><textarea id="mNotes" rows="2">${esc(r.notes)}</textarea></div>
    <div class="mt"><label>Workforce Notes</label><textarea id="mWfNotes" rows="2" placeholder="Enter workforce notes here...">${esc(r.wfNotes || "")}</textarea></div>

    <div class="mfoot">
      ${rid?`<button class="btn ghost" id="mDel" style="margin-right:auto">Cancel request</button>`:`<span class="small muted right" style="margin-right:auto">Tip: for an occurrence type you can create a make-up agreement after saving.</span>`}
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="mSave">Save</button></div>`);

  if (rid) {
    const targetRec = S.records.find(x => x.rid === rid);
    const isCancelled = targetRec?.cancelled;
    $("#mDel").textContent = isCancelled ? "Restore request" : "Cancel request";
    $("#mDel").className = "btn ghost";
    $("#mDel").onclick = () => toggleCancelRecord(rid);
  }

  $("#occMinus").onclick = (e) => { e.preventDefault(); const inp = $("#mOcc"); inp.value = Math.max(0, parseInt(inp.value||0) - 1); };
  $("#occPlus").onclick = (e) => { e.preventDefault(); const inp = $("#mOcc"); inp.value = parseInt(inp.value||0) + 1; };

  if (!rid) {
    $("#mEmp").onchange = (e) => {
      $("#mOcc").value = occCount(e.target.value, today());
    };
  }
      
  $("#mSave").onclick=()=>{
    const dFrom = $("#mDate").value;
    const elTo = $("#mDateTo");
    const dTo = elTo ? elTo.value : dFrom; 
    
    if(!dFrom||!$("#mEmp").value) return toast("Date and employee are required");
    if(dFrom > dTo) return toast("From date must be before To date");
    
    const empId = $("#mEmp").value;
    const type = $("#mType").value;
    const hours = parseFloat($("#mHours").value)||0;
    const notes = $("#mNotes").value.trim();
    const wfNotes = $("#mWfNotes").value.trim();
    const partialShift = $("#mPartial").value.trim();
    const fmla = $("#mFmla").checked;
    const voicemail = $("#mVoicemail").checked;
    const occurrence = parseInt($("#mOcc").value, 10) || 0;

    if (rid) {
      const targetRec = S.records.find(x => x.rid === rid);
      if (targetRec) {
        Object.assign(targetRec, { date: dFrom, empId, type, hours, notes, wfNotes, partialShift, fmla, voicemail, occurrence });
        if (targetRec.dvId) {
          patchDataverseRecord(targetRec.dvId, {
            cr714_fmla: fmla,
            cr714_voicemail: voicemail,
            cr714_occurrence: occurrence,
            cr714_wfnotes: wfNotes
          });
        }
      }
    } else {
      let current = parseISO(dFrom);
      const end = parseISO(dTo);
      while(current <= end) {
        S.records.push({ 
          rid: uid("r"), 
          dvId: "",
          date: isoDate(current), 
          empId, 
          type, 
          hours, 
          notes, 
          wfNotes,
          partialShift,
          source: "local", 
          waived: false, 
          fmla,
          voicemail,
          occurrence
        });
        current.setDate(current.getDate() + 1);
      }
    }
      
    save(); closeModal(); render(); 
    toast(dFrom === dTo ? "Record saved" : "Records saved");
  };
}
  
function makeupModal(mid,fromRec){
  const m=mid? S.makeups.find(x=>x.mid===mid)
    : {empId:fromRec?.empId||S.employees[0]?.id, rid:fromRec?.rid||"", dateMissed:fromRec?.date||today(),
       hoursOwed:fromRec?(8-(fromRec.hours||0)||fromRec.hours||4):4, dueDate:addDays(today(),14), status:"Pending", oss:true, notes:""};
  const used=ossUsed(m.empId);
  openModal(`<h2>${mid?"Edit":"New"} make-up agreement</h2>
    <div class="mrow">
      <div><label>Employee</label>${empSelect("uEmp",m.empId)}</div>
      <div><label>Date missed</label><input type="date" id="uMissed" value="${esc(m.dateMissed)}"></div>
    </div>
    <div class="mrow">
      <div><label>Hours owed (HH:mm)</label><input type="text" id="uHours" value="${hoursToHHMM(m.hoursOwed)}"></div>
      <div><label>Due by</label><input type="date" id="uDue" value="${esc(m.dueDate)}"></div>
    </div>
    <div class="mrow">
      <div><label>Status</label><select id="uStatus">${MU_STATUS.map(s=>`<option ${s===m.status?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
      <div><label>Counts as OSS</label><select id="uOss"><option value="1" ${m.oss?"selected":""}>Yes — use an OSS</option><option value="0" ${m.oss?"":"selected"}>No</option></select>
      <div class="small muted" id="uOssNote">This employee has used ${used}/${OSS_LIMIT} OSS in the last 12 months.</div></div>
    </div>
    <div><label>Notes</label><textarea id="uNotes" rows="6">${esc(m.notes)}</textarea></div>
    <div class="mfoot">
      ${mid?`<button class="btn danger" id="uDel" style="margin-right:auto">Delete from Dataverse</button>`:""}
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" id="uSave">Save</button>
    </div>`);

  if(mid) {
    const isCancelled = m.status === "Cancelled";
    $("#uDel").textContent = isCancelled ? "Restore request" : "Cancel request";
    $("#uDel").className = "btn ghost";
    $("#uDel").onclick = () => {
      const parentRecord = S.records.find(r => r.rid === m.rid || r.dvId === m.dvId);
      if (parentRecord) {
        toggleCancelRecord(parentRecord.rid);
      } else {
        m.status = isCancelled ? "Pending" : "Cancelled";
        save();
        closeModal();
        render();
        toast(isCancelled ? "Agreement restored" : "Agreement cancelled");
      }
    };
  }

  $("#uSave").onclick=()=>{
    const oss=$("#uOss").value==="1", empId=$("#uEmp").value;
    if(oss && !mid && ossUsed(empId)>=OSS_LIMIT) return toast(`OSS limit reached (${OSS_LIMIT}/12 mo) for this employee`);
    
    let hoursInput = $("#uHours").value.trim();
    let hoursVal = 0;
    if (hoursInput.includes(':')) {
      const [h, mPart] = hoursInput.split(':').map(Number);
      hoursVal = (h || 0) + ((mPart || 0) / 60);
    } else {
      hoursVal = parseFloat(hoursInput) || 0;
    }

    const v={
      mid: mid || uid("m"),
      empId,
      rid: m.rid || "",
      dateMissed: $("#uMissed").value,
      hoursOwed: hoursVal,
      dueDate: $("#uDue").value,
      status: $("#uStatus").value,
      oss,
      completedDate: m.completedDate || "",
      notes: $("#uNotes").value.trim()
    };
    if(mid) Object.assign(S.makeups.find(x=>x.mid===mid),v); else S.makeups.push(v);
    if(v.status==="Completed") setMuStatus(v.mid,"Completed"); else { save(); render(); }
    closeModal(); 
    toast("Agreement saved");
  };
}
  
function dayModal(ds){
  const rs = filteredRecords(ds, ds)
    .filter(r => r.type !== "Present")
    .sort((a,b)=>a.type.localeCompare(b.type));
  
  openModal(`<h2>${fmtShort(ds)}</h2>
    ${rs.length?`<div class="tbl-wrap"><table><tbody>${rs.map(r=>rowRecord(r,true)).join("")}</tbody></table></div>`:`<div class="empty">No occurrence records match the current filters for this day.</div>`}
    <div class="mfoot"><button class="btn" id="dAdd">+ Add record</button><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
    
  $("#dAdd").onclick=()=>recordModal(null,ds);
  bindRecordButtons($("#modalHost"));
}

function muDayModal(ds){
  const ids = new Set(filteredEmployees().map(e=>e.id));
  const dayMus = (S.makeups||[]).filter(m => ids.has(m.empId) && m.dateMissed === ds && (!UI.muFilter || m.status === UI.muFilter));
  
  openModal(`<h2>Make-Up Shifts: ${fmtShort(ds)}</h2>
    ${dayMus.length ? `<div class="tbl-wrap"><table><tbody>${dayMus.map(muRow).join("")}</tbody></table></div>` : `<div class="empty">No make-up shifts scheduled for this day.</div>`}
    <div class="mfoot">
      <button class="btn" id="muDayAdd">+ New agreement</button>
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div>`);
    
  $("#muDayAdd").onclick = () => makeupModal(null, { date: ds });
  
  const mh = $("#modalHost");
  mh.querySelectorAll("[data-mu-act]").forEach(b=>{
    b.onclick = e => {
      e.stopPropagation();
      const act = b.dataset.muAct, id = b.dataset.id;
      if(act === "edit") { closeModal(); makeupModal(id); }
      else { setMuStatus(id, act === "approve" ? "Approved" : act === "complete" ? "Completed" : "Missed"); closeModal(); }
    };
  });
}
  
function empModal(id){
  const e=emp(id); if(!e) return;
  const [f,t]=range();
  const rs=(S.records||[]).filter(r=>r.empId===id&&r.date>=f&&r.date<=t).sort((a,b)=>b.date.localeCompare(a.date));
  const mus=(S.makeups||[]).filter(m=>m.empId===id).sort((a,b)=>b.dateMissed.localeCompare(a.dateMissed));
  const n90=occCount(id,t), lv=level(n90);
  openModal(`<h2>${esc(e.name)} <span class="small muted">${esc(e.id)}</span></h2>
    <p class="small">${esc(e.title)} · ${esc(e.dept)} · ${esc(e.location)}<br>
    Supervisor: <b>${esc(e.supervisor)}</b> · Manager: <b>${esc(e.manager)}</b></p>
    <p class="row small">
      <span class="badge ${lv?lv.cls:"ok"}">${lv?lv.name:"Clear"} — ${n90} occ. / 90d</span>
      <span class="badge">OSS ${ossUsed(id,t)}/${OSS_LIMIT}</span>
    </p>
    <h3 style="font-size:13px" class="mt">Records ${fmt(f)} → ${fmt(t)} (${rs.length})</h3>
    ${rs.length?`<div class="tbl-wrap"><table><tbody>${rs.map(r=>`<tr><td>${fmt(r.date)}</td><td>${pill(r.type)}${r.waived?` <span class="badge ok">waived</span>`:""}</td><td>${r.hours||""}h</td><td class="small">${esc(r.notes)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="small muted">None in period.</div>`}
    <h3 style="font-size:13px" class="mt">Make-up agreements (${mus.length})</h3>
    ${mus.length?`<div class="tbl-wrap"><table><tbody>${mus.map(m=>`<tr><td>${fmt(m.dateMissed)}</td><td>${m.hoursOwed}h</td><td><span class="badge ${{Pending:"warn",Approved:"",Completed:"ok",Missed:"bad"}[m.status]}">${esc(m.status)}</span></td><td>${m.oss?"OSS":""}</td></tr>`).join("")}</tbody></table></div>`:`<div class="small muted">None.</div>`}
    <div class="mfoot"><button class="btn ghost" id="eMu">+ Make-up agreement</button><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
  $("#eMu").onclick=()=>makeupModal(null,{empId:id,date:today(),hours:0});
}

function render(){
  renderNav(); renderFilters(); setSync("");
  const v=$("#view");
  switch(UI.tab){
    case "dashboard": v.innerHTML=renderDashboard(); drawCharts(); break;
    case "calendar":  v.innerHTML=renderCalendar(); break;
    case "team":      v.innerHTML=renderTeam(); break;
    case "makeup":    v.innerHTML=renderMakeup(); break;
  }
  bindView();
}
  
function bindRecordButtons(root){
  root.querySelectorAll("[data-rec-edit]").forEach(b=>b.onclick=e=>{e.stopPropagation();recordModal(b.dataset.recEdit);});
}

function bindView(){
  const v=$("#view");
  v.querySelectorAll("tr[data-emp]").forEach(tr=>tr.onclick=()=>empModal(tr.dataset.emp));
  v.querySelectorAll(".cal-cell[data-day]").forEach(c=>c.onclick=()=>dayModal(c.dataset.day));
  
  // Weekly calendar day selection handlers
  v.querySelectorAll(".cal-cell[data-select-day]").forEach(c=>{
    c.onclick = () => {
      UI.selectedWeekDay = c.dataset.selectDay;
      render();
    };
  });

  v.querySelectorAll(".cal-cell[data-select-mu-day]").forEach(c=>{
    c.onclick = () => {
      UI.selectedMuWeekDay = c.dataset.selectMuDay;
      render();
    };
  });

  v.querySelectorAll("[data-add-day]").forEach(b=>b.onclick=e=>{e.stopPropagation();recordModal(null,b.dataset.addDay);});
  
  v.querySelectorAll(".cal-cell[data-mu-day]").forEach(c=>{
    c.onclick = (e) => {
      if(!e.target.closest(".mu-chip")) muDayModal(c.dataset.muDay);
    };
  });
  v.querySelectorAll(".mu-chip[data-mu-id]").forEach(chip=>{
    chip.onclick = (e) => {
      e.stopPropagation();
      makeupModal(chip.dataset.muId);
    };
  });
  v.querySelectorAll("[data-mu-add-day]").forEach(b=>b.onclick=e=>{e.stopPropagation();makeupModal(null,{date:b.dataset.muAddDay});});

  v.querySelectorAll("th[data-team-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.teamSort; 
    UI.teamSortDir = UI.teamSortKey === k ? -UI.teamSortDir : 1; 
    UI.teamSortKey = k; 
    render();
  });

  bindRecordButtons(v);
  v.querySelectorAll("[data-mu-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();
    const act=b.dataset.muAct, id=b.dataset.id;
    if(act==="edit") makeupModal(id);
    else setMuStatus(id, act==="approve" ? "Approved" : act==="complete" ? "Completed" : "Missed");});
  v.querySelectorAll("tr[data-mu]").forEach(tr=>tr.onclick=()=>{ makeupModal(tr.dataset.mu); });
  v.querySelectorAll("th[data-sort]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort; UI.sortDir=UI.sortKey===k?-UI.sortDir:-1; UI.sortKey=k; render();});
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el[ev]=fn; };
  on("#calPrev","onclick",()=>calShift(-1)); on("#calNext","onclick",()=>calShift(1));
  on("#calToday","onclick",()=>{UI.anchor=today(); UI.selectedWeekDay=today(); UI.selectedMuWeekDay=today(); render();});
  on("#calAdd","onclick",()=>recordModal(null, UI.selectedWeekDay || UI.anchor));
  on("#recNew","onclick",()=>recordModal());
  on("#muNew","onclick",()=>makeupModal());
  on("#muFilter","onchange",()=>{UI.muFilter=$("#muFilter").value;render();});
}

$("#nav").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b){ UI.tab=b.dataset.tab; render(); }});
$("#filterBar").addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fPreset"){ UI.preset=t.value; if(UI.preset==="adjusted"){const [f,x]=range(); UI.from=UI.from||f; UI.to=UI.to||x;} }
  else if(t.id==="fAnchor") UI.anchor=t.value||today();
  else if(t.id==="fFrom") UI.from=t.value;
  else if(t.id==="fTo") UI.to=t.value;
  else if(t.classList.contains("ffield")) UI[t.dataset.f]=t.value;
  render();
});
$("#filterBar").addEventListener("input",e=>{ if(e.target.id==="fQ"){ UI.q=e.target.value;
  clearTimeout(window._qh); window._qh=setTimeout(render,250); }});
$("#filterBar").addEventListener("click",e=>{ if(e.target.id==="fClear"){
  Object.assign(UI,{preset:"month",anchor:today(),from:null,to:null,dept:"",repName:"",title:"",supervisor:"",manager:"",q:"",type:""}); render(); }});

$("#syncBtn").onclick=()=>pullFromDataverse(false);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
document.getElementById("loadRetry").onclick=()=>{
  attendanceLoadPromise=null;
  pullFromDataverse(false);
};

render();
</script>
</body>
</html>
