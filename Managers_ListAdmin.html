<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daytona Manager v16.0.1</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.tailwind.config = {
            theme: { 
                extend: {
                    colors: {
                        gray: { 50: '#f9fafb', 100: '#f3f4f6', 200: '#e5e7eb', 300: '#d1d5db', 800: '#1f2937', 900: '#111827' }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>

    <style>
        :root {
            --bg-app: #f1f5f9; --bg-card: #ffffff; --bg-input: #f8fafc; --bg-header: #f8fafc;
            --text-main: #0f172a; --text-muted: #64748b;
            --primary: #2563eb; --primary-fg: #ffffff;
            --border-color: #cbd5e1; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --radius: 0.5rem; --z-menu: 9100; --z-modal: 9500; --z-toast: 9999;
            --base-font: 14px;
        }

        html { font-size: var(--base-font); }

        [data-theme="midnight"] { --bg-app: #020617; --bg-card: #1e293b; --bg-input: #0f172a; --bg-header: #0f172a; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155; --primary: #38bdf8; --primary-fg: #0f172a; }
        [data-theme="oled"] { --bg-app: #000000; --bg-card: #171717; --bg-input: #000000; --bg-header: #000000; --text-main: #ffffff; --text-muted: #737373; --border-color: #262626; --primary: #facc15; --primary-fg: #000000; }
        [data-theme="matt"] { --bg-app: #262626; --bg-card: #404040; --bg-input: #262626; --bg-header: #262626; --text-main: #ffffff; --text-muted: #a3a3a3; --border-color: #525252; --primary: #fb923c; --primary-fg: #000000; }
        [data-theme="gatsby"] { --bg-app: #000000; --bg-card: #121212; --bg-input: #1a1a1a; --bg-header: #1a1a1a; --text-main: #e5e7eb; --text-muted: #78716c; --border-color: #292524; --primary: #d4af37; --primary-fg: #000000; }
        [data-theme="highland-cow"] { --bg-app: #fff7ed; --bg-card: #ffffff; --bg-input: #fff7ed; --bg-header: #ffedd5; --text-main: #431407; --text-muted: #9a3412; --border-color: #fed7aa; --primary: #c2410c; --primary-fg: #ffffff; }
        [data-theme="forest"] { --bg-app: #f0fdf4; --bg-card: #ffffff; --bg-input: #f0fdf4; --bg-header: #dcfce7; --text-main: #14532d; --text-muted: #166534; --border-color: #bbf7d0; --primary: #16a34a; --primary-fg: #ffffff; }
        [data-theme="ocean"] { --bg-app: #f0f9ff; --bg-card: #ffffff; --bg-input: #f0f9ff; --bg-header: #e0f2fe; --text-main: #0c4a6e; --text-muted: #0369a1; --border-color: #bae6fd; --primary: #0ea5e9; --primary-fg: #ffffff; }
        [data-theme="sunset"] { --bg-app: #fff7ed; --bg-card: #ffffff; --bg-input: #fff7ed; --bg-header: #ffedd5; --text-main: #7c2d12; --text-muted: #9a3412; --border-color: #fdba74; --primary: #ea580c; --primary-fg: #ffffff; }
        [data-theme="holiday-cheer"] { --bg-app: #fef2f2; --bg-card: #ffffff; --bg-input: #fef2f2; --bg-header: #fee2e2; --text-main: #7f1d1d; --text-muted: #b91c1c; --border-color: #fecaca; --primary: #dc2626; --primary-fg: #ffffff; }
        [data-theme="winter"] { --bg-app: #eff6ff; --bg-card: #ffffff; --bg-input: #f8fafc; --bg-header: #dbeafe; --text-main: #1e3a8a; --text-muted: #1d4ed8; --border-color: #bfdbfe; --primary: #3b82f6; --primary-fg: #ffffff; }
        [data-theme="harvest"] { --bg-app: #fffbeb; --bg-card: #ffffff; --bg-input: #fffbeb; --bg-header: #fef3c7; --text-main: #78350f; --text-muted: #92400e; --border-color: #fde68a; --primary: #d97706; --primary-fg: #ffffff; }

        body { font-family: 'Inter', sans-serif; background: var(--bg-app); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; margin: 0; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); box-shadow: var(--shadow); }
        
        #main-app-container { width: 100%; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .app-grid { display: grid; grid-template-columns: 350px 1fr; gap: 1rem; flex-grow: 1; overflow: hidden; padding: 1rem; }
        
        .col-left { display: flex; flex-direction: column; gap: 0.5rem; height: 100%; overflow: hidden; }
        .col-right { display: flex; flex-direction: column; gap: 0.75rem; height: 100%; overflow-y: auto; padding-right: 4px; }

        .drawer-side-trigger { position: fixed; top: 0; left: 0; width: 12px; height: 100vh; background: transparent; z-index: 9050; cursor: pointer; }
        .drawer-side-trigger:hover + .drawer-menu, .drawer-menu:hover { left: 0; }

        .drawer-menu { position: fixed; top: 0; left: -300px; width: 280px; height: 100vh; background-color: #111; z-index: var(--z-menu); transition: left 0.3s ease; padding: 80px 1.5rem; color: white; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .drawer-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 6px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 10px; }
        .drawer-btn:hover { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .note-card { margin-bottom: 0.75rem; border-radius: 0.375rem; border: 1px solid var(--border-color); background-color: var(--bg-card); }
        .note-card-header { padding: 0.5rem; background-color: var(--bg-header); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted); font-weight: 700; }
        .note-card-body { padding: 0.75rem; font-size: 0.85rem; white-space: pre-wrap; color: var(--text-main); overflow: hidden; }

        textarea { resize: vertical; min-height: 120px; width: 100%; }
        
        .outlook-modal { background-color: white; color: black; border-radius: 0.5rem; border: 1px solid #999; display: flex; flex-direction: column; width: 100%; max-width: 1100px; height: 85vh; overflow: hidden; }
        .outlook-header { background-color: #0078d4; color: white; padding: 14px; display: flex; justify-content: space-between; font-weight: bold; }
        .outlook-editor { padding: 25px; outline: none; overflow-y: auto; flex-grow: 1; font-family: 'Segoe UI', sans-serif; background: white; line-height: 1.6; }

        .theme-menu-content { display: none; position: fixed; top: 65px; right: 20px; width: 220px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.5rem; z-index: var(--z-menu); padding: 0.5rem; }
        .theme-menu-content.show { display: block; }
        .theme-option { display: flex; align-items: center; gap: 10px; padding: 10px; cursor: pointer; border-radius: 4px; font-size: 0.85rem; color: var(--text-main); }

        .delivery-notification { position: fixed; bottom: 20px; right: -600px; width: 500px; background-color: #1f2937; color: white; border-radius: 12px; z-index: var(--z-toast); transition: right 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; overflow: hidden; border: 2px solid #3b82f6; }
        .delivery-notification.show { right: 20px; }

        .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; z-index: var(--z-toast); }
        .toast { background: white; padding: 1rem; border-radius: 0.5rem; transform: translateX(120%); transition: transform 0.3s ease; border-left: 5px solid #3b82f6; font-size: 0.85rem; min-width: 250px; color: black; }
        .toast.show { transform: translateX(0); }
    </style>
</head>
<body>

    <div class="drawer-side-trigger"></div>

    <div id="global-loader" class="fixed inset-0 bg-slate-900 z-[9999] flex flex-col items-center justify-center text-white">
        <p class="font-bold tracking-widest animate-pulse text-2xl">DAYTONA UPLINK ACTIVE</p>
    </div>

    <div id="delivery-notification" class="delivery-notification">
        <div class="bg-blue-600 px-4 py-2 text-xs font-bold uppercase tracking-widest flex justify-between">
            <span>Critical Telemetry Update</span>
            <button onclick="this.parentElement.parentElement.classList.remove('show')">&times;</button>
        </div>
        <div class="p-6 flex items-center gap-6">
            <i class="fas fa-satellite-dish text-3xl text-blue-400"></i>
            <p id="notif-message" class="text-sm font-medium">New account records synchronized to portfolio.</p>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <div id="main-app-container" class="hidden">
        <div class="card m-4 p-4 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <div class="drawer-trigger-area">
                    <button class="bg-blue-600 text-white font-bold py-2 px-6 rounded shadow-lg flex items-center gap-2">
                        <i class="fas fa-bars"></i> MENU
                    </button>
                </div>
                <div class="drawer-menu">
                    <button onclick="window.loadRecords()" class="drawer-btn"><i class="fas fa-sync"></i> Refresh Records</button>
                    <button onclick="window.setLayout('standard')" class="drawer-btn"><i class="fas fa-th-large"></i> Standard View</button>
                    <button onclick="window.setLayout('form')" class="drawer-btn"><i class="fas fa-address-card"></i> Profile View</button>
                    <button id="gear-icon-btn" onclick="window.toggleSettings()" class="drawer-btn"><i class="fas fa-cog"></i> System Config</button>
                    <hr class="border-gray-800 my-4">
                    <button onclick="window.logout()" class="drawer-btn text-red-400"><i class="fas fa-power-off"></i> Sign Out</button>
                </div>
                <div id="clock-display" class="text-xs font-mono text-gray-500 ml-4">--:--:--</div>
            </div>

            <div id="header-status-panel" class="flex items-center gap-6 ml-auto mr-10">
                <div class="text-right">
                    <label class="block text-[9px] font-bold text-gray-400 uppercase">Action State</label>
                    <span id="header-action-val" class="font-black text-blue-600 uppercase tracking-tighter">None</span>
                </div>
                <div class="text-right border-l pl-6 border-gray-200">
                    <label class="block text-[9px] font-bold text-gray-400 uppercase">Message Code</label>
                    <span id="header-message-val" class="font-black text-slate-800 uppercase">N/A</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="window.cycleFontSize()" class="bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded text-xs">FONTS</button>
                <button onclick="window.setLayoutMenu()" class="bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded text-xs">LAYOUT</button>
                <button onclick="window.toggleThemeMenu()" class="bg-blue-600 text-white font-bold py-2 px-4 rounded text-xs shadow-md">THEME</button>
                <div id="theme-menu" class="theme-menu-content"></div>
            </div>
        </div>

        <div class="app-grid">
            <div class="col-left">
                <div class="card flex flex-col h-full overflow-hidden">
                    <div class="p-4 border-b bg-gray-50">
                        <input type="text" id="search-bar" onkeyup="window.filterAndSortGallery()" placeholder="Filter Portfolio..." class="w-full text-xs p-3">
                    </div>
                    <div id="record-gallery-list" class="p-3 overflow-y-auto h-full"></div>
                </div>
            </div>

            <div class="col-right" id="profile-column">
                <div class="card p-5" id="contact-sticky-header">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-2xl font-black flex items-center gap-3 text-blue-600">
                                <i class="fas fa-database"></i> <span id="acct-number-header">--</span>
                            </h2>
                            <p id="acct-company" class="text-xs font-bold text-gray-500 uppercase tracking-widest mt-1">Standby</p>
                        </div>
                        <div class="flex gap-2">
                            <button id="editModeButton" onclick="window.toggleEditMode()" class="bg-gray-200 text-gray-700 text-[10px] font-bold py-1.5 px-4 rounded" disabled>READ ONLY</button>
                            <div id="save-controls" class="hidden gap-2">
                                <button onclick="window.handleCustomSave()" class="bg-blue-600 text-white text-[10px] font-bold py-1.5 px-6 rounded shadow-lg">SAVE CHANGES</button>
                                <button onclick="window.handleCustomReset()" class="bg-red-500 text-white text-[10px] font-bold py-1.5 px-4 rounded">CANCEL</button>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-400 uppercase mb-1">Point of Contact</label><input type="text" id="contact-name-most" class="editable-field" disabled oninput="window.checkChanges()"></div>
                        <div class="flex flex-col"><label class="text-[10px] font-bold text-gray-400 uppercase mb-1">Direct Phone</label><input type="text" id="contact-phone-primary" class="editable-field" disabled oninput="window.checkChanges()"></div>
                        <div class="flex flex-col col-span-2"><label class="text-[10px] font-bold text-blue-500 uppercase mb-1">Email (Primary)</label><input type="email" id="contact-email-most" class="editable-field font-bold" disabled oninput="window.checkChanges()"></div>
                    </div>
                </div>

                <div class="card flex-grow flex flex-col overflow-hidden workspace-main">
                    <div class="card-header bg-white p-4" id="standard-workspace-header">
                        <div class="flex gap-4 w-full items-center">
                            <div class="flex items-center gap-2">
                                <label class="text-[10px] font-bold text-gray-400 uppercase">F/U Date</label>
                                <input type="date" id="follow-up-date" class="editable-field text-[11px] w-36" disabled oninput="window.checkChanges()">
                            </div>
                            <div class="flex-grow flex gap-2">
                                <select id="email-template-dropdown" class="text-[11px] flex-grow" disabled></select>
                                <button onclick="window.launchEmailLogic()" class="bg-blue-600 text-white font-bold text-[11px] px-8 rounded shadow-md" disabled>OPEN EMAIL</button>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="window.handleActionButtonClick('No Opp')" id="noopp-button" class="bg-amber-500 text-white text-[10px] font-bold py-1.5 px-4 rounded" disabled>NO OPP</button>
                                <button onclick="window.handleContextButton('update')" id="update-button" class="bg-indigo-600 text-white text-[10px] font-bold py-1.5 px-4 rounded" disabled>REFRESH</button>
                            </div>
                        </div>
                    </div>

                    <div class="flex-grow grid grid-cols-2 gap-6 p-5 overflow-y-auto" id="workspace-grid">
                        <div class="flex flex-col h-full">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] font-bold uppercase text-gray-400">Input Note</span>
                                <button onclick="window.insertTemplate()" class="text-[10px] text-blue-600 font-bold hover:underline">+ TEMPLATE</button>
                            </div>
                            <textarea id="qb-notes-input" class="flex-grow font-mono text-sm p-4 border rounded bg-gray-50" disabled oninput="window.checkChanges()"></textarea>
                        </div>
                        <div class="flex flex-col h-full overflow-hidden">
                            <span class="text-[10px] font-bold uppercase text-gray-400 mb-2">Activity Stream</span>
                            <div id="qb-notes-preview" class="flex-grow overflow-y-auto space-y-4"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="email-modal" class="fixed inset-0 z-[9998] hidden flex items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="outlook-modal">
            <div class="outlook-header">
                <span>OUTLOOK ENVOY</span>
                <button onclick="document.getElementById('email-modal').classList.add('hidden')" class="text-2xl font-light">&times;</button>
            </div>
            <div class="p-6 space-y-3 bg-white border-b">
                <div class="flex items-center border-b pb-2"><span class="w-12 text-xs font-bold text-gray-400 uppercase">To</span><input type="text" id="email-modal-to" class="flex-grow border-none outline-none text-sm"></div>
                <div class="flex items-center border-b pb-2"><span class="w-12 text-xs font-bold text-gray-400 uppercase">Subject</span><input type="text" id="email-modal-subject" class="flex-grow border-none outline-none text-sm font-bold"></div>
            </div>
            <div id="email-modal-body" contenteditable="true" class="outlook-editor"></div>
            <div class="p-6 bg-slate-50 flex justify-end gap-3 border-t">
                <button onclick="document.getElementById('email-modal').classList.add('hidden')" class="bg-gray-200 text-gray-700 font-bold text-xs px-8 py-3 rounded">DISCARD</button>
                <button onclick="window.handleModalSend()" class="bg-blue-600 text-white font-bold text-xs px-12 py-3 rounded shadow-lg">SEND VIA GRAPH</button>
            </div>
        </div>
    </div>

    <script>
        const msalConfig = {
            auth: {
                clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee",
                authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401",
                redirectUri: window.location.origin + window.location.pathname
            },
            cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false }
        };
        const msalInstance = new msal.PublicClientApplication(msalConfig);
        let msalAccount = null, allRecords = [], currentSelectedRecord = null, currentRecordId = null, isEditMode = false;
        let originalRecordState = null, fontIndex = 0;

        const GET_RECORDS_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2d5cc7c0ffa34dcb87e6416df29b9acf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=8qFD-lNiuxDgafyu31UYZ8zzePJMRJ4wpUzLzbb9bMs";
        const PATCH_URL = "https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/774bb53ee87542e5825b46958f5bd55d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=EbaJTl1gKlG8rjTn3ZmoLwUiQ430Sju1kWZYZ6hr0zE";

        window.showToast = (msg, type='info') => {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast show ${type === 'success' ? 'success' : type === 'error' ? 'error' : ''}`;
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
        };

        window.cycleFontSize = () => {
            const sizes = ['14px', '16px', '18px'];
            fontIndex = (fontIndex + 1) % sizes.length;
            document.documentElement.style.setProperty('--base-font', sizes[fontIndex]);
            window.showToast(`System font scaled to ${sizes[fontIndex]}`, "info");
        };

        window.loadRecords = async (isPolling = false) => {
            if(!isPolling) document.getElementById('global-loader').style.display = 'flex';
            try {
                const res = await fetch(GET_RECORDS_URL, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ repName: msalAccount?.name || "User" }) 
                });
                const data = await res.json();
                const newList = data.accountList || data;

                if(isPolling && newList.length > allRecords.length) {
                    document.getElementById('notif-message').innerText = `Sync Detected: ${newList.length - allRecords.length} new records added to portfolio.`;
                    document.getElementById('delivery-notification').classList.add('show');
                }

                allRecords = newList;
                window.filterAndSortGallery();
                if(!isPolling) window.showToast("Cloud synchronization complete", "success");
            } catch (e) { if(!isPolling) window.showToast("Cloud sync failure", "error"); }
            finally { if(!isPolling) { document.getElementById('global-loader').style.display = 'none'; document.getElementById('main-app-container').classList.remove('hidden'); } }
        };

        window.filterAndSortGallery = () => {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const list = document.getElementById('record-gallery-list');
            list.innerHTML = '';
            allRecords.filter(r => (r.cr714_company || '').toLowerCase().includes(query) || (r.cr714_id || '').includes(query))
                      .forEach(r => {
                const div = document.createElement('div');
                div.className = `gallery-item text-xs p-3 border rounded cursor-pointer ${currentRecordId === String(r.cr714_id) ? 'is-selected' : 'bg-white'}`;
                div.onclick = () => window.selectRecord(r.cr714_id);
                div.innerHTML = `<div class="font-bold mb-1">${r.cr714_id}</div><div class="truncate opacity-80">${r.cr714_company}</div>`;
                list.appendChild(div);
            });
        };

        window.selectRecord = (id) => {
            currentRecordId = String(id);
            currentSelectedRecord = allRecords.find(r => String(r.cr714_id) === currentRecordId);
            originalRecordState = JSON.parse(JSON.stringify(currentSelectedRecord));
            window.populateForm();
            window.filterAndSortGallery();
        };

        window.populateForm = () => {
            const r = currentSelectedRecord;
            document.getElementById('acct-number-header').innerText = r.cr714_id;
            document.getElementById('acct-company').innerText = r.cr714_company;
            document.getElementById('header-action-val').innerText = r.cr714_action || 'None';
            document.getElementById('header-message-val').innerText = r.cr714_message || 'N/A';
            
            document.getElementById('contact-name-most').value = r.cr714_namemost || '';
            document.getElementById('contact-phone-primary').value = r.cr714_primaryphone || '';
            document.getElementById('contact-email-most').value = r.cr714_emailmost || '';
            document.getElementById('qb-notes-input').value = "";
            document.getElementById('follow-up-date').value = r.cr714_followup ? r.cr714_followup.split('T')[0] : '';
            
            const dd = document.getElementById('email-template-dropdown');
            dd.innerHTML = '<option value="No Jan">No January Outreach</option><option value="NONBUY">Non-Buyer Proposal</option><option value="Winback">Winback Strategy</option>';
            
            ['editModeButton', 'noopp-button', 'update-button', 'email-template-dropdown', 'qb-notes-input'].forEach(id => document.getElementById(id).disabled = false);
            document.querySelector('#standard-workspace-header button').disabled = false;
            window.updateHistory();
            window.checkChanges();
        };

        window.updateHistory = () => {
            const preview = document.getElementById('qb-notes-preview');
            preview.innerHTML = '';
            const raw = currentSelectedRecord.cr714_qbnotes || '';
            const entries = raw.split('------------------------------').filter(e => e.trim());
            entries.forEach(entry => {
                const lines = entry.trim().split('\n');
                let meta = { author: 'System', date: '--' }, body = [];
                lines.forEach(l => {
                    const am = l.match(/^(?:Modified By:|By:)\s*(.+)/i);
                    const dm = l.match(/Modified On:\s*(.+)/i);
                    if(am) meta.author = am[1].trim(); else if(dm) meta.date = dm[1].trim(); else body.push(l);
                });
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `<div class="note-card-header"><span>${meta.date}</span><span>${meta.author}</span></div><div class="note-card-body">${body.join('\n').trim()}</div>`;
                preview.appendChild(card);
            });
        };

        window.checkChanges = () => {
            if(!isEditMode) { document.getElementById('save-controls').classList.add('hidden'); return; }
            const curNote = document.getElementById('qb-notes-input').value.trim();
            const curDate = document.getElementById('follow-up-date').value;
            const curEmail = document.getElementById('contact-email-most').value;
            
            const hasChanged = curNote !== "" || curDate !== (originalRecordState.cr714_followup ? originalRecordState.cr714_followup.split('T')[0] : '') || curEmail !== originalRecordState.cr714_emailmost;
            document.getElementById('save-controls').classList.toggle('hidden', !hasChanged);
        };

        window.toggleEditMode = () => {
            isEditMode = !isEditMode;
            document.querySelectorAll('.editable-field, #qb-notes-input').forEach(f => f.disabled = !isEditMode);
            document.getElementById('editModeButton').innerText = isEditMode ? 'EDITING...' : 'READ ONLY';
            window.checkChanges();
        };

        window.handleCustomSave = async () => {
            const note = document.getElementById('qb-notes-input').value.trim();
            const rep = msalAccount?.name || "System User";
            const stamp = note ? `By: ${rep}\nModified On: ${new Date().toLocaleString()}\n\n${note}\n\n------------------------------\n` : "";
            const finalNote = stamp + (currentSelectedRecord.cr714_qbnotes || "");
            
            const payload = { recordId: currentRecordId, qbNotes: finalNote, followUp: document.getElementById('follow-up-date').value ? `${document.getElementById('follow-up-date').value}T00:00:00Z` : null, emailMost: document.getElementById('contact-email-most').value };
            
            try {
                await fetch(PATCH_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const idx = allRecords.findIndex(r => String(r.cr714_id) === currentRecordId);
                allRecords[idx].cr714_qbnotes = finalNote;
                allRecords[idx].cr714_followup = payload.followUp;
                window.showToast("Data commitment successful", "success");
                window.toggleEditMode();
                window.updateHistory();
            } catch (e) { window.showToast("Save failure", "error"); }
        };

        window.handleActionButtonClick = async (actionType) => {
            const rep = msalAccount?.name || "System User";
            const note = `[Button Trigger: ${actionType}] initiated. Rep: ${rep}\nModified On: ${new Date().toLocaleString()}\n\n------------------------------\n`;
            const finalNote = note + (currentSelectedRecord.cr714_qbnotes || "");
            
            try {
                await fetch(PATCH_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ recordId: currentRecordId, qbNotes: finalNote }) });
                window.showToast(`${actionType} Recorded`, "success");
                const idx = allRecords.findIndex(r => String(r.cr714_id) === currentRecordId);
                allRecords[idx].cr714_qbnotes = finalNote;
                window.updateHistory();
            } catch (e) { window.showToast("Action log failure", "error"); }
        };

        window.launchEmailLogic = async () => {
            const r = currentSelectedRecord;
            const template = document.getElementById('email-template-dropdown').value;
            const rep = msalAccount?.name || "Your Account Representative";
            
            const signature = `
                <br><br>
                <div style="font-family: Arial; font-size: 12px; color: #333;">
                    <strong>${rep}</strong><br>
                    Account Representative | W.B. Mason Co., Inc.<br>
                    <img src="https://www.wbmason.com/images/WBMasonLogo.png" width="120" style="margin-top:10px;"><br>
                    <span style="color:#0078d4;">Who But WB!</span>
                </div>
            `;

            let body = `<p>Hi <strong>${r.cr714_namemost || 'Customer'}</strong>,</p><p>I am reaching out regarding your account with W.B. Mason...</p>` + signature;
            
            if(template === "No Jan") {
                body = `<p>Hi <strong>${r.cr714_namemost}</strong>,</p><p>I noticed your account at <strong>${r.cr714_company}</strong> hasn't placed an order in January. Are there any supplies or equipment I can help you secure before month-end?</p>` + signature;
            }

            document.getElementById('email-modal-to').value = r.cr714_emailmost || '';
            document.getElementById('email-modal-subject').value = `W.B. Mason Account Review: ${r.cr714_company}`;
            document.getElementById('email-modal-body').innerHTML = body;
            document.getElementById('email-modal').classList.remove('hidden');
        };

        window.handleModalSend = async () => {
            window.showToast("Broadcasting to Microsoft Graph...", "info");
            try {
                const tokenResp = await msalInstance.acquireTokenSilent({ scopes: ["Mail.Send"], account: msalAccount });
                const mail = { message: { subject: document.getElementById('email-modal-subject').value, body: { contentType: "HTML", content: document.getElementById('email-modal-body').innerHTML }, toRecipients: [{ emailAddress: { address: document.getElementById('email-modal-to').value } }] } };
                const res = await fetch("https://graph.microsoft.com/v1.0/me/sendMail", { method: "POST", headers: { "Authorization": `Bearer ${tokenResp.accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(mail) });
                if(res.ok) { 
                    window.showToast("Envoy Successful", "success"); 
                    document.getElementById('email-modal').classList.add('hidden');
                    const stamp = `[Email Sent] Template used. Initiated by: ${msalAccount.name}\nModified On: ${new Date().toLocaleString()}\n\n------------------------------\n`;
                    currentSelectedRecord.cr714_qbnotes = stamp + (currentSelectedRecord.cr714_qbnotes || "");
                    window.updateHistory();
                } else { throw new Error(); }
            } catch (e) { window.showToast("Graph Relay Failed", "error"); }
        };

        window.toggleThemeMenu = () => {
            const m = document.getElementById('theme-menu'); m.classList.toggle('show');
            if(m.innerHTML === '') {
                const THEMES = [
                    {n:'Modern',id:'modern',c:'#2563eb'},{n:'Midnight',id:'midnight',c:'#0f172a'},{n:'OLED',id:'oled',c:'#000'},
                    {n:'Matt',id:'matt',c:'#fb923c'},{n:'Forest',id:'forest',c:'#16a34a'},{n:'Ocean',id:'ocean',c:'#0ea5e9'}
                ];
                THEMES.forEach(t => {
                    const d = document.createElement('div'); d.className = 'theme-option';
                    d.innerHTML = `<div style="width:16px;height:16px;border-radius:50%;background:${t.c};border:1px solid #ccc"></div><span>${t.n}</span>`;
                    d.onclick = () => { document.body.setAttribute('data-theme', t.id); m.classList.remove('show'); };
                    m.appendChild(d);
                });
            }
        };

        window.toggleSettings = () => window.showToast("System configurations verified. Permissions: Full.", "success");
        window.insertTemplate = () => document.getElementById('qb-notes-input').value = `Discussion: \nNext Steps: \nOpp Details: \n` + document.getElementById('qb-notes-input').value;
        window.initializeApp = () => { document.getElementById('global-loader').style.display='none'; document.getElementById('main-app-container').classList.remove('hidden'); window.loadRecords(); setInterval(() => { document.getElementById('clock-display').innerText = new Date().toLocaleTimeString(); }, 1000); setInterval(() => window.loadRecords(true), 3600000); };
        
        document.addEventListener('DOMContentLoaded', () => { 
            msalInstance.handleRedirectPromise().then(r => { 
                if(r) { msalAccount = r.account; window.initializeApp(); } 
                else { const a = msalInstance.getAllAccounts(); if(a.length > 0) { msalAccount = a[0]; window.initializeApp(); } else { msalInstance.loginPopup({ scopes: ["User.Read", "Mail.Send"] }).then(res => { msalAccount = res.account; window.initializeApp(); }); } } 
            }); 
        });
    </script>
</body>
</html>
