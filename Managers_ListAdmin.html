<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daytona Manager v104.29</title>
    
    <script>
        window.tailwind = {
            config: {
                theme: { 
                    extend: {
                        colors: {
                            gray: { 50: '#f9fafb', 100: '#f3f4f6', 200: '#e5e7eb', 300: '#d1d5db', 800: '#1f2937', 900: '#111827' }
                        }
                    }
                },
                corePlugins: { preflight: true }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --bg-app: #f1f5f9;
            --bg-card: #ffffff; --bg-input: #f8fafc; --bg-header: #f8fafc;
            --text-main: #0f172a; --text-muted: #64748b;
            --primary: #2563eb; --primary-fg: #ffffff;
            --accent-danger: #ef4444; --accent-success: #22c55e; --accent-warning: #eab308;
            --border-color: #cbd5e1; 
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 0.5rem; 
            --modal-bg: #ffffff;
            --z-base: 1;
            --z-walker: 50; 
            --z-sidebar: 100; 
            --z-overlay: 4000;
            --z-modal: 5000;
            --z-dropdown: 6000;
            --z-toast: 9999; 
            --z-loader: 8000;
            --z-delivery: 8500;
            --outlook-bg: #ffffff;
            --tab-bg: #e2e8f0;
            --tab-active-bg: #ffffff;
        }

        /* --- THEME OVERRIDES --- */
        [data-theme="midnight"], [data-theme="oled"], [data-theme="matt"], [data-theme="gatsby"], [data-theme="ocean"], [data-theme="forest"], [data-theme="sunset"], [data-theme="holiday-cheer"], [data-theme="harvest"], [data-theme="lavender"], [data-theme="sage"] {
            --bg-app: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --bg-header: #1e293b; 
            --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155; 
            --primary: #38bdf8; --primary-fg: #ffffff; --modal-bg: #1e293b;
        }

        [data-theme="oled"] { --bg-app: #000000; --bg-card: #121212; --bg-input: #1a1a1a; --primary: #facc15; --modal-bg: #171717; }
        [data-theme="gatsby"] { --bg-app: #000000; --bg-card: #1a1a1a; --primary: #d4af37; --border-color: #333; --modal-bg: #121212; }
        [data-theme="winter"] { --bg-app: #f0f9ff; --bg-card: #ffffff; --bg-input: #f8fafc; --text-main: #0c4a6e; --primary: #0284c7; --border-color: #e0f2fe; }
        [data-theme="rose"] { --bg-app: #fff1f2; --bg-card: #ffffff; --bg-input: #fff1f2; --text-main: #881337; --primary: #e11d48; --border-color: #ffe4e6; }
        [data-theme="sage"] { --bg-app: #f0fdf4; --bg-card: #ffffff; --bg-input: #f0fdf4; --text-main: #14532d; --primary: #16a34a; --border-color: #dcfce7; }
        [data-theme="lavender"] { --bg-app: #faf5ff; --bg-card: #ffffff; --bg-input: #faf5ff; --text-main: #581c87; --primary: #9333ea; --border-color: #f3e8ff; }
        [data-theme="matt"] { --bg-app: #262626; --bg-card: #404040; --bg-input: #525252; --bg-header: #404040; --text-main: #ffffff; --primary: #fb923c; }
        [data-theme="highland-cow"] { --bg-app: #fff7ed; --bg-card: #ffffff; --bg-input: #fdf2f8; --bg-header: #ffedd5; --text-main: #431407; --text-muted: #78350f; --border-color: #fdba74; --primary: #c2410c; }
        [data-theme="forest"] { --bg-app: #022c22; --bg-card: #064e3b; --primary: #34d399; }
        [data-theme="ocean"] { --bg-app: #082f49; --bg-card: #0c4a6e; --primary: #38bdf8; }

        /* BASE STYLES */
        body { font-family: 'Inter', sans-serif; background: var(--bg-app); color: var(--text-main); padding: 0.5rem 1rem; height: 100vh; overflow: hidden; display: flex; flex-direction: column; transition: background 0.2s ease; }
        
        /* LOCKED 3-COLUMN LAYOUT */
        #main-app-container { width: 100%; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; z-index: var(--z-base); }
        .app-grid { display: grid; grid-template-columns: 350px 1fr 400px; gap: 1rem; flex-grow: 1; overflow: hidden; width: 100%; }
        
        .col-left { display: flex; flex-direction: column; gap: 0.5rem; height: 100%; overflow: hidden; }
        .col-middle { display: flex; flex-direction: column; gap: 0.75rem; height: 100%; overflow: hidden; }
        .col-right { display: flex; flex-direction: column; gap: 0.75rem; height: 100%; overflow: hidden; }

        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 0.75rem; transition: all 0.3s ease; }
        .card-header { font-weight: 600; border-bottom: 1px solid var(--border-color); padding: 0.5rem 0.75rem; display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-header); border-radius: var(--radius) var(--radius) 0 0; }
        
        /* Controls */
        input, select, textarea { background-color: var(--bg-input) !important; border: 1px solid var(--border-color) !important; color: var(--text-main) !important; border-radius: 0.375rem; padding: 0.5rem; width: 100%; font-size: 0.875rem; box-sizing: border-box; }
        .btn-primary { background: var(--primary); color: var(--primary-fg); font-weight: 600; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; border: none; }
        .btn-secondary { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); font-weight: 600; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; }

        /* Gallery/List Styles */
        .gallery-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding: 2px; }
        .gallery-item { padding: 0.5rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.5rem; cursor: pointer; transition: border-color 0.1s; position: relative; }
        .gallery-item.is-selected { border-color: var(--primary); background: var(--primary); color: var(--primary-fg); }
        .gallery-item.is-selected * { color: var(--primary-fg) !important; }

        /* Truck Loader */
        .truckWrapper { width: 200px; height: 100px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; zoom: 0.5; }
        @keyframes motion { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .truckBody { animation: motion 1s linear infinite; }
        .tiresvg { animation: spin 0.8s linear infinite; }
        
        /* Sidebar/Modal */
        .sidebar-modal { position: fixed; top: 0; right: 0; bottom: 0; width: 50%; background: var(--bg-app); transform: translateX(100%); transition: transform 0.4s; z-index: var(--z-sidebar); }
        .sidebar-modal.active { transform: translateX(0); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: var(--z-overlay); display: none; }
    </style>
</head>
<body class="bg-slate-100">

        <div class="bg-white p-8 rounded-xl shadow-2xl text-center max-w-md w-full border border-slate-200">
            <h2 class="text-3xl font-black text-slate-900 mb-2">DAYTONA</h2>

    <header class="flex justify-between items-center mb-4 px-2">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-black tracking-tight text-slate-800">DAYTONA <span class="text-blue-600">v104.29</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <div id="user-display" class="hidden md:block text-sm font-bold text-slate-500 bg-white px-3 py-1.5 rounded-full border border-slate-200">Not Signed In</div>
            <div class="flex gap-2">
                <button onclick="window.toggleThemeMenu()" class="w-10 h-10 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors shadow-sm" title="Change Theme">
                    <i class="fas fa-palette"></i>

    <main id="main-app-container" class="flex-grow overflow-hidden">
        <div class="app-grid h-full">
            
            <section class="col-left flex flex-col h-full">
                <div class="card flex flex-col flex-grow overflow-hidden border-none shadow-md">
                    <div class="card-header bg-white border-b border-slate-100 px-4 py-3 flex justify-between items-center">
                        <span class="text-sm font-black uppercase tracking-wider text-slate-500">Accounts</span>
                        <div class="flex items-center gap-2">

                <div class="card p-4 mt-2 bg-white border-none shadow-md">

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="window.openAnalytics()" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 transition-all shadow-sm">

                        <button onclick="window.openSettings()" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 transition-all shadow-sm">

                                </div>

                                class="w-full h-48 p-4 bg-slate-50 border-2 border-slate-100 rounded-xl text-sm font-medium focus:border-blue-500 focus:ring-0 transition-all placeholder:text-slate-300" 
                                placeholder="Capture details, next steps, and insights here..."></textarea>
                        </div>

                        <div id="note-history" class="space-y-4 pt-4 border-t border-slate-50">
                            </div>

            </section>

            <section class="col-right flex flex-col h-full">
                <div class="card flex flex-col h-full overflow-hidden border-none shadow-lg bg-white">
                    <div class="card-header border-b border-slate-100 px-5 py-4 bg-slate-50/50">
                        <span class="text-sm font-black uppercase tracking-wider text-slate-500">Actions & Follow-up</span>
                    </div>
                    <div class="p-5 flex flex-col gap-6 overflow-y-auto h-full">
                        <button onclick="window.saveAll()" class="group relative w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl transition-all shadow-lg hover:shadow-blue-200 overflow-hidden">

                                <div class="flex flex-col items-center justify-center h-full gap-3 py-10">
                                    <i class="fas fa-envelope-open-text text-3xl text-slate-200"></i>

    </main>

    <div id="modal-overlay" class="modal-overlay" onclick="window.closeAllModals()"></div>
    <div id="generic-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-2xl bg-white rounded-2xl shadow-2xl z-[5000] hidden border border-slate-200 overflow-hidden">
        <div id="modal-content-container"></div>
    </div>
    
    <div id="toast-container" class="toast-container"></div>
    <script>
    // --- APP CONFIGURATION & STATE ---
    const msalConfig = {
        auth: {
            clientId: "YOUR_CLIENT_ID_HERE", // Replace with your actual Client ID
            authority: "https://login.microsoftonline.com/common",
            redirectUri: window.location.origin
        },
        cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);
    let msalAccount = null;
    let currentUserRepName = "User";

    // Application State
    const state = {
        accounts: [],
        filteredAccounts: [],
        selectedAccountId: null,
        searchQuery: '',
        sortBy: 'name', // Default sort
        activeFilters: { sentToday: false, hasNotes: false }
    };

    // --- AUTHENTICATION LOGIC ---
    window.login = async () => {
        try {
            const loginResponse = await msalInstance.loginPopup({
                scopes: ["user.read", "mail.send", "mail.readwrite"]
            });
            msalAccount = loginResponse.account;
            currentUserRepName = msalAccount.name;
            window.initializeApp();
        } catch (err) {
            console.error("Login failed:", err);
            window.showToast("Login failed. Please try again.", "error");
        }
    };

    window.logout = () => {
        msalInstance.logoutPopup().then(() => {
            location.reload();
        });
    };

    window.handleMsalResponse = (response) => {
        if (response !== null) {
            msalAccount = response.account;
            currentUserRepName = msalAccount.name;
            window.initializeApp();
        }
    };

    // --- INITIALIZATION ---
    window.initializeApp = async () => {
        document.getElementById('login-container').classList.add('hidden');
        document.getElementById('global-loader').style.display = 'flex';
        
        try {
            // Simulate data fetch - Replace with your actual data source (e.g., SharePoint/API)
            await window.fetchAppData();
            
            document.getElementById('user-display').innerText = currentUserRepName;
            document.getElementById('user-display').classList.remove('hidden');
            
            window.renderAccountList();
            window.showToast(`Welcome back, ${currentUserRepName}!`, "success");
        } catch (error) {
            console.error("Initialization error:", error);
            window.showToast("Error loading application data.", "error");
        } finally {
            document.getElementById('global-loader').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('global-loader').style.display = 'none';
            }, 300);
        }
    };

    // --- THEME ENGINE ---
    window.toggleThemeMenu = () => {
        const menu = document.getElementById('theme-menu');
        menu.classList.toggle('show');
    };

    window.setTheme = (themeName) => {
        document.documentElement.setAttribute('data-theme', themeName);
        localStorage.setItem('daytona-theme', themeName);
        window.toggleThemeMenu();
    };

    window.loadSavedTheme = () => {
        const saved = localStorage.getItem('daytona-theme') || 'default';
        document.documentElement.setAttribute('data-theme', saved);
    };

    // --- TOAST NOTIFICATIONS ---
    window.showToast = (msg, type = 'info') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `
            <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i>
            <span>${msg}</span>
        `;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 100);
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    };
</script>
<script>
    // --- DATA FETCHING ---
    window.fetchAppData = async () => {
        // Replace with actual API call. Using mock data for demonstration.
        state.accounts = [
            { id: '101', name: 'Acme Corp', detail: 'Tier 1 Partner', lastUpdated: new Date().toISOString(), notes: '' },
            { id: '102', name: 'Global Industries', detail: 'Strategic Account', lastUpdated: new Date().toISOString(), notes: '' },
            { id: '103', name: 'Tech Solutions', detail: 'Standard Support', lastUpdated: new Date().toISOString(), notes: '' }
        ];
        state.filteredAccounts = [...state.accounts];
        window.handleSort(); // Apply default sort
    };

    // --- RENDERING ACCOUNT LIST ---
    window.renderAccountList = () => {
        const listContainer = document.getElementById('account-list');
        listContainer.innerHTML = '';

        state.filteredAccounts.forEach(acc => {
            const isSelected = state.selectedAccountId === acc.id;
            const item = document.createElement('div');
            item.className = `gallery-item ${isSelected ? 'is-selected' : ''}`;
            item.onclick = () => window.selectAccount(acc.id);
            
            item.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="gallery-item-id">#${acc.id}</span>
                </div>
                <div class="gallery-item-company">${acc.name}</div>
                <div class="text-[10px] opacity-70 mt-1 font-bold uppercase">${acc.detail}</div>
            `;
            listContainer.appendChild(item);
        });
    };

    // --- ACCOUNT SELECTION ---
    window.selectAccount = (id) => {
        state.selectedAccountId = id;
        const account = state.accounts.find(a => a.id === id);
        
        // Update UI
        document.getElementById('active-account-name').innerText = account.name;
        document.getElementById('active-account-detail').innerText = account.detail;
        document.getElementById('main-notes').value = account.notes || '';
        
        // Update selection in list
        window.renderAccountList();
        
        // Auto-generate email preview
        window.generateEmailPreview(account);
    };

    // --- SORTING LOGIC ---
    window.handleSort = () => {
        const val = document.getElementById('sort-dropdown').value;
        state.sortBy = val;

        state.filteredAccounts.sort((a, b) => {
            if (val === 'name') {
                return a.name.localeCompare(b.name);
            } else if (val === 'recent') {
                return new Date(b.lastUpdated) - new Date(a.lastUpdated);
            }
            return 0;
        });

        window.renderAccountList();
    };

    // --- EMAIL PREVIEW GENERATION ---
    window.generateEmailPreview = (account) => {
        const preview = document.getElementById('email-preview-area');
        preview.innerHTML = `
            <div class="space-y-4 text-slate-700">
                <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
                    <span class="font-black text-[10px] uppercase text-slate-400">Subject:</span>
                    <span class="text-xs font-bold">Follow-up: ${account.name} - Daytona Update</span>
                </div>
                <div class="text-sm leading-relaxed font-medium space-y-2">
                    <p>Hi team,</p>
                    <p>I am reaching out regarding the current status of <strong>${account.name}</strong> (${account.detail}).</p>
                    <p>Based on our latest review, we need to finalize the next steps for the upcoming quarter.</p>
                    <p>Best regards,<br>${currentUserRepName}</p>
                </div>
            </div>
        `;
    };

    // --- SAVE LOGIC ---
    window.saveAll = async () => {
        if (!state.selectedAccountId) {
            window.showToast("Please select an account first.", "error");
            return;
        }

        const account = state.accounts.find(a => a.id === state.selectedAccountId);
        const newNotes = document.getElementById('main-notes').value;
        
        // Update State
        account.notes = newNotes;
        account.lastUpdated = new Date().toISOString();

        window.showToast(`Data saved for ${account.name}`, "success");
        window.handleSort(); // Refresh list order if sorting by recent
    };

    // --- MODAL & SIDEBAR HELPERS ---
    window.closeAllModals = () => {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('generic-modal').classList.add('hidden');
    };

    window.openSettings = () => {
        const modal = document.getElementById('generic-modal');
        const container = document.getElementById('modal-content-container');
        document.getElementById('modal-overlay').style.display = 'flex';
        modal.classList.remove('hidden');

        container.innerHTML = `
            <div class="p-6">
                <h2 class="text-xl font-black mb-4">Settings</h2>
                <div class="space-y-4">
                    <p class="text-sm text-slate-500">Daytona Version: 104.29</p>
                    <p class="text-sm text-slate-500">Layout: 3-Column (Locked)</p>
                </div>
                <button onclick="window.closeAllModals()" class="mt-6 btn-primary w-full">Close</button>
            </div>
        `;
    };

    // Additional event listeners and closing scripts
    document.addEventListener('DOMContentLoaded', () => {
        window.loadSavedTheme();
        msalInstance.handleRedirectPromise().then(resp => {
            if (resp && resp.account) { 
                window.handleMsalResponse(resp); 
            } else {
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) {
                    msalAccount = accounts[0];
                    currentUserRepName = msalAccount.name;
                    window.initializeApp();
                } else {
                    document.getElementById('global-loader').style.display = 'none';
                    document.getElementById('login-container').classList.remove('hidden');
                    document.getElementById('login-container').style.display = 'flex';
                }
            }
        }).catch(e => {
            console.error(e);
            document.getElementById('global-loader').style.display = 'none';
            document.getElementById('login-container').style.display = 'flex';
        });
    });
</script>
</body>
</html>
