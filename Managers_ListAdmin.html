    window.fetchWithPolling = async function(url, options) {
        let res = await fetch(url, options);
        if (res.status === 202) {
            const loc = res.headers.get('location'); let retries=0;
            while(retries < 40) { await new Promise(r => setTimeout(r, 3000)); let poll = await fetch(loc); if(poll.status === 200) return poll; retries++; }
            throw new Error("Polling timed out.");
        }
        return res;
    }

    window.parseNotes = function(rawNotes) {
        if (!rawNotes) return []; let cleanRaw = rawNotes.replace(/\r\n/g, '\n'); const rawEntries = cleanRaw.split(/-{20,}/).filter(e => e.trim().length > 0); const parsed = [];
        rawEntries.forEach(entry => {
            const lines = entry.trim().split('\n'); let date = "Unknown Date"; let author = "Unknown User"; let textLines = [];
            let metaLoc='', metaDm='', metaComp='', metaOpp='', metaIntro='';
            
            const metaMatch = entry.match(/{{METADATA:(.*?)}}/);
            if (metaMatch && metaMatch[1]) {
                metaMatch[1].split('|').forEach(p => {
                    const kv = p.split('=');
                    if (kv[0]==='Loc') metaLoc = kv[1]||'';
                    if (kv[0]==='DM') metaDm = kv[1]||'';
                    if (kv[0]==='Comp') metaComp = kv[1]||'';
                    if (kv[0]==='Opp') metaOpp = kv[1]||'';
                    if (kv[0]==='Intro') metaIntro = kv[1]||'';
                });
            }

            for(let i=0; i<lines.length; i++) {
                const line = lines[i].trim();
                if (line.toLowerCase().includes('modified on:')) { date = line.split(/modified on:/i)[1]?.trim() || "Unknown Date"; continue; }
                if (line.toLowerCase().includes('modified by:') || line.toLowerCase().startsWith('by:')) { author = line.split(/(?:modified by:|by:)/i)[1]?.trim() || "Unknown User"; continue; }
                if (line !== "") { textLines.push(lines[i]); }
            }
            textLines = textLines.filter(l => !l.startsWith("{{METADATA:") && !l.startsWith("[List:"));
            if (author !== "Unknown User" && author !== "Unknown" && (textLines.length > 0)) { 
                parsed.push({ date: date, author: author, text: textLines.join('\n').trim(), metaLoc, metaDm, metaComp, metaOpp, metaIntro }); 
            }
        });
        return parsed;
    }

    window.handleAttachmentSelection = async function(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;

        // Store the raw File object instead of immediately reading to Base64 to save memory
        for (let file of files) {
            pendingAttachments.push(file); 
        }
        event.target.value = ''; // Reset input so same file can be selected again if removed
        window.renderAttachmentUI();
    };

    window.renderAttachmentUI = function() {
        let container = document.getElementById('email-attachments-container');
        if (!container) return;
        container.innerHTML = pendingAttachments.map((file, idx) => `
            <div class="flex items-center gap-2 px-2 py-1 rounded text-xs border shadow-sm ${file.size > 3 * 1024 * 1024 ? 'border-red-400 bg-red-50' : ''}" style="border-color: var(--border-color); background-color: var(--bg-input);">
                <i class="fas fa-file ${file.size > 3 * 1024 * 1024 ? 'text-red-500' : 'text-blue-500'}"></i> <span class="truncate max-w-[150px]" style="color: var(--text-main);">${file.name}</span>
                <span class="text-muted">(${(file.size/1024/1024).toFixed(2)}MB)</span>
                <button onclick="window.removeAttachment(${idx})" class="text-red-500 hover:text-red-700 ml-1" title="Remove attachment"><i class="fas fa-times"></i></button>
            </div>
        `).join('');
    };

    window.removeAttachment = function(idx) {
        pendingAttachments.splice(idx, 1);
        window.renderAttachmentUI();
    };
    
    window.fileToBase64 = function(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    };

    // Graceful getToken function: Handles silent failovers and explicit interaction requests cleanly.
    window.getToken = async function(scopeStr, silentFallback = false) {
        const account = msalInstance.getAllAccounts()[0]; 
        const request = { scopes: scopeStr.split(" "), account: account };
        try { 
            return (await msalInstance.acquireTokenSilent(request)).accessToken; 
        } catch (e) { 
            if(silentFallback) {
                console.warn(`Silent token fetch failed for ${scopeStr}. Ignoring to prevent popup loop.`);
                throw e; 
            }
            console.log(`Interactive token request needed for ${scopeStr}`);
            return (await msalInstance.acquireTokenPopup(request)).accessToken; 
        }
    }

    window.fetchD365Account = async function(accountId) {
        try {
            let token;
            try {
                token = await window.getToken("https://wbmasonco.crm.dynamics.com//user_impersonation", true);
            } catch(tokenErr) {
                console.warn("D365 wbmasonco token blocked by admin consent, skipping D365 overlay.", tokenErr);
                return null;
            }
            if(!token) return null;
            const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'odata.include-annotations="OData.Community.Display.V1.FormattedValue"' };
            const cleanId = String(accountId).trim();
            const res = await fetch(`${PRIMARY_CRM_URL}/accounts?$filter=accountnumber eq '${cleanId}'&$expand=primarycontactid($select=fullname,firstname,lastname,telephone1,telephone2,telephone3,mobilephone,emailaddress1)`, { headers });
            if(res.ok) {
                const data = await res.json();
                if(data.value && data.value.length > 0) {
                    const acct = data.value[0];
                    
                    // Robust Phone Extraction from D365
                    let phoneOptions = [];
                    const pc = acct.primarycontactid || {};
                    if(pc.telephone1) phoneOptions.push(pc.telephone1);
                    if(pc.telephone2) phoneOptions.push(pc.telephone2);
                    if(pc.telephone3) phoneOptions.push(pc.telephone3);
                    if(pc.mobilephone) phoneOptions.push(pc.mobilephone);
                    if(acct.telephone1) phoneOptions.push(acct.telephone1);
                    if(acct.telephone2) phoneOptions.push(acct.telephone2);
                    if(acct.telephone3) phoneOptions.push(acct.telephone3);
                    
                    // Deduplicate and format phones
                    phoneOptions = [...new Set(phoneOptions.filter(Boolean))].map(p => window.formatPhone(p));
                    acct._extractedPhones = phoneOptions;
                    
                    // Robust Address Extraction
                    let addrParts = [
                        acct.address1_line1,
                        acct.address1_line2,
                        acct.address1_city,
                        acct.address1_stateorprovince,
                        acct.address1_postalcode
                    ].filter(Boolean);
                    acct._extractedAddress = addrParts.join(', ');
                    
                    // Robust Name Extraction
                    acct._extractedContactName = pc.fullname || (pc.firstname ? (pc.firstname + ' ' + (pc.lastname || '')) : acct.name);
                    
                    return acct;
                }
            }
        } catch(e) { console.warn("D365 lookup error", e); }
        return null;
    }

    window.loadRecords = async function() {
        const list = document.getElementById('record-gallery-list');
        list.innerHTML = '<div class="text-center p-4">Loading Data from Dataverse...</div>';
        document.getElementById('global-loader').style.display = 'flex'; document.getElementById('global-loader').style.opacity = '1';
        allRecords = []; duplicateRecordIds = new Set();
        try {
            const token = await window.getToken("https://org23279050.crm.dynamics.com//user_impersonation");
            const reqOptions = { method: 'GET', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Prefer': 'odata.include-annotations="*"' }, cache: 'no-store' };
            let targetRep = currentUserRepName;

            const requests = await Promise.all([
                fetch(`${DATAVERSE_URL}/cr714_accountmanagementdatasets?$filter=cr714_rep eq '${targetRep}' and cr714_action ne null and cr714_accountnum ne null and statecode eq 0`, reqOptions).catch(() => ({ ok: false })),
                fetch(`${DATAVERSE_URL}/cr714_cadencedatasets?$filter=cr714_retentionrep eq '${targetRep}' and cr714_accountnum ne null and statecode eq 0`, reqOptions).catch(() => ({ ok: false })),
                fetch(`${DATAVERSE_URL}/cr714_prospectingdatasets?$filter=cr714_repassigned eq '${targetRep}' and statecode eq 0`, reqOptions).catch(() => ({ ok: false })),
                fetch(`${DATAVERSE_URL}/cr714_employeeinformation1s?$filter=cr714_employeename eq '${targetRep}'`, reqOptions).catch(() => ({ ok: false }))
            ]);

            const amData = requests[0].ok ? await requests[0].json() : { value: [] };
            const cadenceData = requests[1].ok ? await requests[1].json() : { value: [] };
            const prosData = requests[2].ok ? await requests[2].json() : { value: [] };
            
            const profileData = requests[3].ok ? await requests[3].json() : { value: [] };
            if (profileData.value && profileData.value.length > 0) currentUserProfile = profileData.value[0];

            let allRaw = [];
            if(amData.value) amData.value.forEach(r => allRaw.push({ ...r, _dsType: 'AM', _priority: 1 }));
            if(cadenceData.value) cadenceData.value.forEach(r => allRaw.push({ ...r, _dsType: 'Cadence', _priority: 2 }));
            if(prosData.value) prosData.value.forEach(r => allRaw.push({ ...r, _dsType: 'Prospecting', _priority: 3 }));

            // Sort so we build recordsMap prioritizing AM -> Cadence -> Prospecting 
            allRaw.sort((a,b) => a._priority - b._priority);

            let recordsMap = new Map();
            allRaw.forEach(r => {
                let type = r._dsType;
                let id = r.cr714_accountnum;
                if(!id) return;

                let qbNotes = type === 'AM' ? r.cr714_accountmanagementnotes : (type === 'Cadence' ? r.cr714_qbnotes : r.cr714_prospectingnotes);
                let sTable = type === 'AM' ? 'cr714_accountmanagementdatasets' : (type === 'Cadence' ? 'cr714_cadencedatasets' : 'cr714_prospectingdatasets');
                let sId = r.cr714_accountmanagementdatasetid || r.cr714_cadencedatasetid || r.cr714_prospectingdatasetid;

                let sourceObj = { type: type, table: sTable, id: sId, action: r.cr714_action, rawNotes: qbNotes, message: r.cr714_actionmessage, modifiedon: r.modifiedon };

                if(recordsMap.has(id)) {
                    let existing = recordsMap.get(id);
                    existing.sources.push(sourceObj);
                    duplicateRecordIds.add(String(id)); // track duplicates intentionally for visual flagging
                } else {
                    let mapped = {
                        cr714_id: id,
                        cr714_company: r.cr714_accountname || r.cr714_company || r.cr714_acctname,
                        cr714_rep: r.cr714_rep || r.cr714_retentionrep || r.cr714_repassigned,
                        cr714_action: r.cr714_action,
                        cr714_actionmessage: r.cr714_actionmessage,
                        cr714_namemost: r.cr714_namemost || r.cr714_namelatest,
                        cr714_primaryphone: window.formatPhone(r.cr714_phone || r.cr714_primaryphone),
                        cr714_emailmost: r.cr714_emailmost || r.cr714_emaillatest || r.cr714_email_latest,
                        cr714_lastorderdate: r.cr714_lastorderdate || '--',
                        cr714_qbnotes: sourceObj.rawNotes, // Main raw block maintained for compatibility
                        cr714_managernotes: r.cr714_managernotes,
                        cr714_importantaccountinformation: r.cr714_importantaccountinformation || r.cr714_importantaccountinfo,
                        cr714_billingaddress: r.cr714_address || r.cr714_billingaddress,
                        cr714_followup: r.cr714_followup || r.cr714_followupdate,
                        cr714_actionemailsent: r.cr714_actionemailsent || r.cr714_emailsenttimestamp || null,
                        cr714_intro: r.cr714_intro || '',
                        modifiedon: r.modifiedon,
                        sources: [sourceObj],
                        primaryType: type,
                        source_dataset_type: type
                    };
                    recordsMap.set(id, mapped);
                }
            });

            allRecords = Array.from(recordsMap.values());
            
            if(document.getElementById('stat-total')) document.getElementById('stat-total').textContent = allRecords.length; 
            if (currentUserRepName && document.getElementById('welcome-message')) { document.getElementById('welcome-message').innerHTML = `<i class="fas fa-user-circle text-xl"></i> <span class="hidden md:inline">${currentUserRepName}</span>`; }
            
            window.updateStats(); window.populateActionFilter(); if(typeof window.loadGalleryPrefs === 'function') window.loadGalleryPrefs(); 
            
            await window.checkAndNotifyNewIntros();
            window.filterAndSortGallery(); 
            
            document.getElementById('global-loader').style.opacity = '0'; setTimeout(()=>document.getElementById('global-loader').style.display='none', 300);
            
        } catch (e) { 
            list.innerHTML = `<div class="p-4 text-red-600 text-center">Error: ${e.message}<br><button onclick="window.loadRecords()" class="mt-2 underline font-bold">Retry</button></div>`; document.getElementById('global-loader').style.display='none';
        }
    }
    
    // --- INTRO NOTIFICATION LOGIC ---
    window.checkAndNotifyNewIntros = async function() {
        let notifiedIntros = [];
        try {
            notifiedIntros = JSON.parse(localStorage.getItem('daytona_notified_intros') || '[]');
        } catch(e) { console.error("Error parsing notified intros", e); }
        
        let newIntrosFound = [];
        const localTodayStr = new Date().toLocaleDateString('en-CA');
        newIntroIds = new Set(); // Reset the global visual tracker

        allRecords.forEach(r => {
            let isIntro = false;
            
            // Check direct dataset intro column
            if (r.cr714_intro && String(r.cr714_intro).trim() !== '') {
                let ci = String(r.cr714_intro).trim().toLowerCase();
                if(ci === 'yes' || ci === 'y' || ci.includes('intro')) isIntro = true;
            }
            
            // Fallback to check if it was marked as an Intro in the action column
            if(!isIntro && r.cr714_action && String(r.cr714_action).toLowerCase().includes('intro')) {
                 isIntro = true;
            }

            // Fallback to checking parsed metadata from notes in all sources

                        if(ci === 'yes' || ci === 'y' || ci.includes('intro')) { isIntro = true; break; }
                    }
                }
            }

            // Only proceed if it is flagged as an Intro
            if(isIntro) {
                let wasModifiedToday = false;
                // Check if any underlying source dataset was updated today
                for(let src of r.sources) {
                    if(src.modifiedon && src.modifiedon.startsWith(localTodayStr)) { wasModifiedToday = true; break; }
                }
                
                // If modified today and we haven't already notified them, queue it up
                if(wasModifiedToday && !notifiedIntros.includes(String(r.cr714_id))) {
                    newIntrosFound.push(r);
                    newIntroIds.add(String(r.cr714_id)); // Add to global set to style gallery items
                }
            }
        });

            console.log(`Found ${newIntrosFound.length} new intro assignments. Firing silent email.`);

            let liElements = newIntrosFound.map(r => `<li><b>${r.cr714_id}</b> - ${window.escapeHTML(r.cr714_company)}</li>`).join('');

                    <br>
                    <p style="font-size: 11px; color: #666;">This is an automated notification from the A.C.T. System.</p>
                </div>
            `;

                // Silently request Mail.Send token. (Fails gracefully if they didn't grant it yet).
                const token = await window.getToken("Mail.Send", true); 
                const mailBody = { 
                    message: { 
                        subject: `New Intro Assignments (${newIntrosFound.length}) - A.C.T.`, 
                        body: { contentType: "HTML", content: emailContent }, 
                        toRecipients: [{ emailAddress: { address: msalAccount.username } }] 
                    }, 
                    saveToSentItems: "false" 
                };
                
                await fetch(`${GRAPH_URL}/me/sendMail`, { 
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(mailBody) 
                });
                
                // Update LocalStorage so it doesn't fire again
                newIntrosFound.forEach(r => notifiedIntros.push(String(r.cr714_id)));
                localStorage.setItem('daytona_notified_intros', JSON.stringify(notifiedIntros));

                document.getElementById('intro-alert-modal').classList.remove('hidden');
                document.getElementById('intro-alert-modal').style.display = 'flex';
                
            } catch(err) {

    window.handleCustomSave = async function(autoNote = null, quiet = false) {
        const get = (id) => document.getElementById(id).value || '';
        const loc = get('input-location'), dm = get('input-dm'), comp = get('input-competitor'), oppType = get('opp-type-select');
        const intro = document.getElementById('display-intro').innerText === '--' ? '' : document.getElementById('display-intro').innerText;
        
        if(!quiet) { if(!oppType) { window.showToast("Opp Type is Required", "error"); document.getElementById('opp-type-select').classList.add('empty-field-warning'); return; } }
        if(!quiet) window.showToast("Saving...", "processing");
        
        const metaString = `{{METADATA: Loc=${loc}|DM=${dm}|Comp=${comp}|Opp=${oppType}|Intro=${intro}}}`;
        let note = autoNote ? autoNote : (document.getElementById('qb-notes-input').value || "").replace(QB_NOTES_TEMPLATE, '').trim();
        const timeStamp = new Date().toLocaleString(); const userStamp = currentUserRepName || "Unknown User";
        
        let headerLabel = currentSelectedRecord ? currentSelectedRecord.primaryType : 'Unknown';
        const newNoteEntry = note ? `Modified By: ${userStamp}\nModified On: ${timeStamp}\n\n[List: ${headerLabel} | Account: ${currentRecordId}]\n${metaString}\n${note}\n\n------------------------------\n` : `Modified By: ${userStamp}\nModified On: ${timeStamp}\n\n[List: ${headerLabel} | Account: ${currentRecordId}]\n${metaString}\n(Metadata Update)\n\n------------------------------\n`;
        
        let d = document.getElementById('follow-up-date').value;
        let t = document.getElementById('follow-up-time').value;
        let iso = null;
        if (d) {
            try {
                let dt = new Date(`${d}T${t || '00:00'}:00`);
                if(!isNaN(dt.getTime())) {
                    iso = dt.toISOString();
                }
            } catch(e) {
                iso = t ? `${d}T${t}:00Z` : `${d}T00:00:00Z`; // Fallback
            }
        }

        try {
            const token = await window.getToken("https://org23279050.crm.dynamics.com//user_impersonation");
            const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
            
            // Loop and save to all linked sources to ensure sync
            for (let i = 0; i < currentSelectedRecord.sources.length; i++) {
                let src = currentSelectedRecord.sources[i];
                let payload = {};
                if (iso !== null) payload.cr714_followup = iso;
                else payload.cr714_followup = null;

                if (i === 0) {
                    // Only append note strictly to the primary source to prevent duplication in merged history
                    let rawEntries = (src.rawNotes || "").split(/-{20,}/);
                    let validEntries = rawEntries.filter(e => {
                        if (!e.trim()) return false;
                        let match = e.match(/(?:Modified By:|by:)\s*(.*)/i);
                        let author = match ? match[1].trim() : "";
                        if (author === "Unknown User" || author === "Unknown") return false;
                        let textOnly = e.replace(/Modified By:.*\n/i, '').replace(/Modified On:.*\n/i, '').replace(/{{METADATA:.*?}}/i, '').replace(/\[List:.*?\]/i, '').trim();
                        if(!textOnly) return false;
                        return true;
                    });
                    
                    let rebuiltNotes = validEntries.map(e => e.trim()).join('\n\n------------------------------\n');
                    if (rebuiltNotes) rebuiltNotes = '\n\n' + rebuiltNotes + '\n\n------------------------------\n';
                    
                    const fullNote = newNoteEntry + rebuiltNotes;

                    if (src.table === 'cr714_accountmanagementdatasets') {
                        payload.cr714_namemost = get('contact-name-most'); payload.cr714_phone = get('contact-phone-primary'); payload.cr714_emailmost = get('contact-email-most'); payload.cr714_accountmanagementnotes = fullNote;
                    } else if (src.table === 'cr714_cadencedatasets') {
                        payload.cr714_namemost = get('contact-name-most'); payload.cr714_primaryphone = get('contact-phone-primary'); payload.cr714_emailmost = get('contact-email-most'); payload.cr714_qbnotes = fullNote;
                    } else if (src.table === 'cr714_prospectingdatasets') {
                        payload.cr714_namelatest = get('contact-name-most'); payload.cr714_phone = get('contact-phone-primary'); payload.cr714_email_latest = get('contact-email-most'); payload.cr714_prospectingnotes = fullNote;
                    }
                    src.rawNotes = fullNote;
                    currentSelectedRecord.cr714_qbnotes = fullNote; // Update runtime cache mapping
                } else {
                    // Just update core contact info to keep it synced
                    if (src.table === 'cr714_accountmanagementdatasets') {
                        payload.cr714_namemost = get('contact-name-most'); payload.cr714_phone = get('contact-phone-primary'); payload.cr714_emailmost = get('contact-email-most');
                    } else if (src.table === 'cr714_cadencedatasets') {
                        payload.cr714_namemost = get('contact-name-most'); payload.cr714_primaryphone = get('contact-phone-primary'); payload.cr714_emailmost = get('contact-email-most');
                    } else if (src.table === 'cr714_prospectingdatasets') {
                        payload.cr714_namelatest = get('contact-name-most'); payload.cr714_phone = get('contact-phone-primary'); payload.cr714_email_latest = get('contact-email-most');
                    }
                }

                await fetch(`${DATAVERSE_URL}/${src.table}(${src.id})`, { method: 'PATCH', headers: headers, body: JSON.stringify(payload) });
            }

            if(!quiet) window.showToast("Saved!", "success");
            
            window.saveToAuditLog('Save', `Note: ${note}`); 
            currentSelectedRecord.cr714_followup = iso; 
            document.querySelectorAll('.empty-field-warning').forEach(el => el.classList.remove('empty-field-warning')); 
            window.updateNotesPreview(); 
            window.filterAndSortGallery(); 
            window.updateMiniCounter(); 
            
            // Cleanly reset prompt flags to stop bleeding
            document.getElementById('qb-notes-input').value = '';
            document.getElementById('opp-type-select').value = '';
            window.hasUnsavedChanges = false; 
            window.takeSnapshot(currentSelectedRecord);
            
        } catch(e) { window.addToFailedQueue("Save Record", () => window.handleCustomSave(autoNote, quiet)); }
    }

    window.handleModalSend = async function() {
        if(!window.checkEmailRateLimit()) return;

        // Verify if any files exceed 3MB limit
        const hasLargeAttachments = pendingAttachments.some(f => f.size > 3 * 1024 * 1024);
        if (hasLargeAttachments) {
            document.getElementById('large-attachment-modal').classList.remove('hidden');
            document.getElementById('large-attachment-modal').style.display = 'flex';
            return; // Pause execution and await user decision
        }

        window.showToast("Sending...", "processing");

        try {
            const ccValue = document.getElementById('email-modal-cc').value.trim();
            const ccRecipients = ccValue ? [{ emailAddress: { address: ccValue } }] : [];
            const subject = document.getElementById('email-modal-subject').value;
            const content = document.getElementById('email-modal-body').innerHTML;
            const toRecipients = [{ emailAddress: { address: document.getElementById('email-modal-to').value } }];

            const token = await window.getToken("Mail.Send");
            
            let base64Attachments = [];
            for (let f of pendingAttachments) {
                base64Attachments.push({
                    "@odata.type": "#microsoft.graph.fileAttachment",
                    "name": f.name,
                    "contentType": f.type,
                    "contentBytes": await window.fileToBase64(f)
                });
            }

            const mailBody = { 
                message: { subject, body: { contentType: "HTML", content }, toRecipients, ccRecipients }, 
                saveToSentItems: "true" 
            };
            if (base64Attachments.length > 0) mailBody.message.attachments = base64Attachments;

            const res = await fetch(`${GRAPH_URL}/me/sendMail`, { 
                method: 'POST', 
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, 
                body: JSON.stringify(mailBody) 
            });
            
            if(!res.ok) throw new Error("Graph API Error on sendMail");

            // Cleanup & Tracking
            await window.handleCustomSave(`[Email Sent]: ${subject}`, true);
            let timestamps = []; try { timestamps = JSON.parse(localStorage.getItem('daytona_email_timestamps') || '[]'); } catch(e) {}
            timestamps.push(Date.now()); try { localStorage.setItem('daytona_email_timestamps', JSON.stringify(timestamps)); } catch(e) {} window.checkEmailRateLimit();
            let sentRecs = []; try { sentRecs = JSON.parse(localStorage.getItem('daytona_sent_records') || '[]'); } catch(e) {}
            if(!sentRecs.includes(currentRecordId)) { sentRecs.push(currentRecordId); try { localStorage.setItem('daytona_sent_records', JSON.stringify(sentRecs)); } catch(e) {} }
            
            pendingAttachments = [];
            window.renderAttachmentUI();

            const sentBadge = document.getElementById('profile-sent-badge');
            if (sentBadge) sentBadge.classList.remove('hidden'); 

            document.getElementById('email-modal').classList.add('hidden'); 
            document.getElementById('email-modal').style.display = 'none'; 
            window.showToast("Email Sent!", "success");

        } catch(e) { 
            console.error("Mail Send Error:", e);
            window.showToast(`Mail send failed: ${e.message}`, "error");
        }
    }

         const now = Date.now(); let timestamps = []; try { timestamps = JSON.parse(localStorage.getItem('daytona_email_timestamps') || '[]'); } catch(e) {}

    window.isDirty = function() {
        if(!window.currentRecordSnapshot || window.isPopulating) return false;
        if(window.hasUnsavedChanges) return true; // manual dirty flag
        
        const snap = window.currentRecordSnapshot; 
        const getCurrent = (id) => (document.getElementById(id)?.value || '').trim(); 
        const getSnap = (val) => (val || '').trim();
        
        if(getCurrent('input-location') !== getSnap(snap.loc)) return true; 
        if(getCurrent('input-dm') !== getSnap(snap.dm)) return true; 
        if(getCurrent('input-competitor') !== getSnap(snap.comp)) return true; 
        if(getCurrent('opp-type-select') !== getSnap(snap.oppType)) return true;
        
        let currentNote = getCurrent('qb-notes-input'); 
        let templateTrimmed = QB_NOTES_TEMPLATE.trim();
        if(currentNote !== '' && currentNote !== templateTrimmed) return true;
        
        if(getCurrent('follow-up-date') !== getSnap(snap.fuDate)) return true; 
        if(getCurrent('follow-up-time') !== getSnap(snap.fuTime)) return true; 
        
        return false;
    }

    window.updateNotesPreview = async function() { 
        const p = document.getElementById('qb-notes-preview');
        const showPrev = document.getElementById('show-prev-note')?.checked;
        if(!currentSelectedRecord) { p.innerHTML = '<div class="text-center italic mt-10 text-muted">Select an account</div>'; return; }
        
        if(showPrev) {
            p.innerHTML = '<div class="text-center italic mt-10 text-muted">Loading history...</div>';
            let history = [];
            
            // Deduplicate notes by their pure text content
            let uniqueNotes = new Map();
            
            // Loop through all sources to aggregate note history uniformly
            currentSelectedRecord.sources.forEach(src => {
                let parsed = window.parseNotes(src.rawNotes || '');
                parsed.forEach(n => {
                    let key = n.text.trim();
                    if (!uniqueNotes.has(key)) {
                        n.sourceType = src.type;
                        uniqueNotes.set(key, n);
                    }
                });
            });
            
            history = Array.from(uniqueNotes.values());
            
            if (!currentSelectedRecord.logisticsFetched) {
                currentSelectedRecord.logisticsData = await window.fetchLogisticsForAccount(currentSelectedRecord.cr714_id);
                currentSelectedRecord.logisticsFetched = true;
            }
            if (currentSelectedRecord.logisticsData && currentSelectedRecord.logisticsData.length > 0) {
                currentSelectedRecord.logisticsData.forEach(log => {
                    history.push({ date: log.createdon ? new Date(log.createdon).toLocaleString() : 'Unknown Date', author: log.cr714_logisticsowner || log.createdbyname || 'Logistics Team', text: `[LOGISTICS REQUEST]\nIssue: ${log.cr714_issue || '--'}\nSummary: ${log.cr714_briefsummaryissue || '--'}\nNotes: ${log.cr714_logisticsnotes || '--'}\nStatus: ${log.cr714_disposition || log.statuscodename || '--'}`, isLogistics: true, rawDate: log.createdon ? new Date(log.createdon).getTime() : 0 });
                });
            }
            history.sort((a,b) => { const da = a.rawDate || new Date(a.date).getTime() || 0; const db = b.rawDate || new Date(b.date).getTime() || 0; return db - da; });

            if(history.length > 0) {
                p.innerHTML = history.map(h => {
                    const border = h.isLogistics ? 'border-left-color: #f59e0b; background-color: rgba(245, 158, 11, 0.05);' : '';
                    const headerColor = h.isLogistics ? 'background-color: rgba(245, 158, 11, 0.1);' : '';
                    
                    let srcColor = h.sourceType === 'AM' ? 'bg-green-500/10 text-green-600 border-green-500/30' :
                                   h.sourceType === 'Cadence' ? 'bg-blue-500/10 text-blue-600 border-blue-500/30' :
                                   h.sourceType === 'Prospecting' ? 'bg-orange-500/10 text-orange-600 border-orange-500/30' : '';
                    let srcAbbr = h.sourceType === 'AM' ? 'AM' : (h.sourceType === 'Cadence' ? 'CAD' : (h.sourceType === 'Prospecting' ? 'PSP' : ''));
                    let srcBadge = srcAbbr ? `<span class="px-1.5 py-0.5 rounded text-[8px] border font-bold ${srcColor} mr-2">${srcAbbr}</span>` : '';

                    let metaHtml = '';
                    if (h.metaLoc || h.metaDm || h.metaComp || h.metaOpp || h.metaIntro) {
                        let formattedIntro = h.metaIntro;
                        if (formattedIntro && String(formattedIntro).trim() !== '') {
                            let fi = String(formattedIntro).trim();
                            formattedIntro = (fi.toLowerCase() === 'yes' || fi.toLowerCase() === 'y') ? 'Intro' : fi;
                        }
                        metaHtml = `<div class="flex flex-wrap gap-3 mb-2 text-[10px] text-muted p-1.5 rounded border bg-black/5" style="border-color: var(--border-color);">
                            ${h.metaLoc ? `<span title="Location"><i class="fas fa-map-marker-alt text-blue-500 mr-1"></i><b>Loc:</b> ${window.escapeHTML(h.metaLoc)}</span>` : ''}
                            ${h.metaDm ? `<span title="Decision Maker"><i class="fas fa-user-tie text-green-500 mr-1"></i><b>DM:</b> ${window.escapeHTML(h.metaDm)}</span>` : ''}
                            ${h.metaComp ? `<span title="Competitor"><i class="fas fa-store-slash text-red-500 mr-1"></i><b>Comp:</b> ${window.escapeHTML(h.metaComp)}</span>` : ''}
                            ${h.metaOpp ? `<span title="Opportunity Type"><i class="fas fa-bullseye text-purple-500 mr-1"></i><b>Opp:</b> ${window.escapeHTML(h.metaOpp)}</span>` : ''}
                            ${h.metaIntro ? `<span title="Intro"><i class="fas fa-handshake text-orange-500 mr-1"></i><b>Intro:</b> ${window.escapeHTML(formattedIntro)}</span>` : ''}
                        </div>`;
                    }
                    return `<div class="note-card" style="${border}"><div class="note-card-header" style="${headerColor}"><span>${srcBadge}${h.date}</span><span>${h.author}</span></div><div class="note-card-body">${metaHtml}${window.renderSafeHTML(h.text)}</div></div>`;
                }).join('');
            } else { p.innerHTML = '<div class="text-center italic mt-10 text-muted">No history found</div>'; }
        } else { p.innerHTML = '<div class="text-center italic mt-10 text-muted">History hidden</div>'; }
    }

    window.generateMVGOUrl = async function() {
        const check = (id, text) => document.getElementById(id).checked ? (text + ", ") : "";
        let reqAction = check('mvgo-check-save', "Save/Trouble") + check('mvgo-check-loss', "Loss/Winback") + check('mvgo-check-new', "New Buyer") + check('mvgo-check-buying', "Buying");
        let catOpp = check('mvgo-cat-water', "Water") + check('mvgo-cat-jan', "Janitorial") + check('mvgo-cat-hosp', "Hospitality") + check('mvgo-cat-food', "Food") + check('mvgo-cat-break', "Breakroom") + check('mvgo-cat-ship', "Shipping") + check('mvgo-cat-furn', "Furniture") + check('mvgo-cat-office', "Office") + check('mvgo-cat-auto', "Auto") + check('mvgo-cat-print', "Print");
        let concern = check('mvgo-con-pricing', "Pricing") + check('mvgo-con-service', "Service") + check('mvgo-con-dm', "DM");
        
        const userNotes = document.getElementById('mvgo-notes').value || '';
        const today = new Date().toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
        const contactName = document.getElementById('mvgo-contact')?.value || '';
        const phoneStr = document.getElementById('mvgo-phone')?.value || '';
        const addrStr = document.getElementById('mvgo-address')?.value || '';

        // Clean trailing commas
        reqAction = reqAction.replace(/, $/, '');
        catOpp = catOpp.replace(/, $/, '');
        concern = concern.replace(/, $/, '');

        // Build the multiline string and correctly encode the entire thing to ensure it passes into MVGO
        const details = `Action Plan --- Created On: ${today}\n\nRequested Action(s):\n${reqAction}\n\nCategory Opportunities:\n${catOpp}\n\nConcern(s):\n${concern}\nOther: \n\nContact Info:\nName: ${contactName}\nPhone Number: ${phoneStr}\nAddress:\n${addrStr}\n\nInside Sales Note: \n${userNotes}`;
        const encodedDetails = encodeURIComponent(details);
        
        const url = `https://go.masonville.com/#/activityleadcall?repCreditCode=&emptyOwner=TRUE&accountNumber=${encodeURIComponent(currentRecordId)}&salesCallTriggerID=&schedFutureDays=1&salesCallTrigger=ISReq&salesCallTriggerDetails=${encodedDetails}`;
        
        // Launch in new tab
        window.open(url, '_blank');
        
        // Compact note for history
        const historyStamp = `[MVGO LINK SENT] Action: ${reqAction || 'None'} | Opps: ${catOpp || 'None'} | Concern: ${concern || 'None'}`;
        const qbInput = document.getElementById('qb-notes-input');
        
        // Push the MVGO note back into the main note box along with the MVGO tag and await save
        qbInput.value = historyStamp + (userNotes ? ` | Note: ${userNotes}` : '') + (qbInput.value ? '\n\n' + qbInput.value : '');
        
        // AWAIT the save so it fully processes the note before wiping it
        await window.handleCustomSave(null, true); 
        
        // Clear immediately after saving to reset UI correctly
        qbInput.value = "";
        window.markDirty();
        
        document.getElementById('mvgo-modal').style.display = 'none'; 
        window.showToast("MVGO Opened & Note Saved", "success");

    window.executeSalesParse = function() {
        const raw = document.getElementById('sales-raw-input').value;
        let resultEl = document.getElementById('sales-parsed-result');
        
        // Smart fallback logic trying to extract rows dynamically from SSRS HTML
        if (raw.includes('<table') || raw.includes('A3b4f51787061468db28910383f295b61149xB')) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(raw, 'text/html');
            const cells = Array.from(doc.querySelectorAll('div')).map(d => d.innerText.trim()).filter(t => t.length > 0);
            
            let htmlTable = '<table class="w-full text-sm text-left border-collapse"><thead class="bg-black/5"><tr class="border-b" style="border-color: var(--border-color);"><th class="pb-1 text-primary">Category / Item</th><th class="pb-1 text-primary">Current</th><th class="pb-1 text-primary">Prior</th><th class="pb-1 text-primary">YOY</th></tr></thead><tbody>';
            
            let index = 0;
            let foundAny = false;
            while(index < cells.length) {
                let val = cells[index];
                if (val.match(/^[A-Za-z\s\/&]+$/) && val !== 'Current Year' && val !== 'Prior Year' && val !== 'Month' && val !== '4 Month Sales' && !val.includes('Daily Average') && val !== 'CY Daily Avg' && val !== 'PY Daily Avg' && !val.includes('Totals') && !val.includes('Category') && !val.includes('YOY')) {
                    // Check if following elements are money/percentages
                    if (index + 3 < cells.length && (cells[index+1].includes('$') || cells[index+2].includes('$') || cells[index+3].includes('%'))) {
                        foundAny = true;
                        let cy = cells[index+1];
                        let py = cells[index+2];
                        let yoy = cells[index+3];
                        let yoyColor = yoy.includes('▼') || yoy.includes('-') ? 'text-red-500' : 'text-green-500';
                        htmlTable += `<tr class="border-b border-dashed hover:bg-black/5 transition-colors" style="border-color: var(--border-color);"><td class="py-2 font-semibold text-main">${val}</td><td class="text-main">${cy}</td><td class="text-main">${py}</td><td class="font-bold ${yoyColor}">${yoy}</td></tr>`;
                        index += 3;
                    }
                }
                index++;
            }
            htmlTable += '</tbody></table>';
            
            if (foundAny) {
                resultEl.innerHTML = htmlTable;
                return;
            }
        }
        
        // RegEx fallback for pasted text blocks
        const rowRegex = /^([A-Za-z\s\/&]+)\s+\$([\d,]+\.\d{2})\s+\$([\d,]+\.\d{2})\s+([▲▼\-\+]*[\d\.]+%)/gm;
        let htmlTable = '<table class="w-full text-sm text-left border-collapse"><thead class="bg-black/5"><tr class="border-b" style="border-color: var(--border-color);"><th class="pb-1 text-primary">Item</th><th class="pb-1 text-primary">Current</th><th class="pb-1 text-primary">Prior</th><th class="pb-1 text-primary">YOY</th></tr></thead><tbody>';
        let match;
        let found = false;
        while ((match = rowRegex.exec(raw)) !== null) {
            found = true;
            let yoyColor = match[4].includes('▼') || match[4].includes('-') ? 'text-red-500' : 'text-green-500';
            htmlTable += `<tr class="border-b border-dashed hover:bg-black/5 transition-colors" style="border-color: var(--border-color);"><td class="py-2 font-semibold text-main">${match[1].trim()}</td><td class="text-main">$${match[2]}</td><td class="text-main">$${match[3]}</td><td class="font-bold ${yoyColor}">${match[4]}</td></tr>`;
        }
        htmlTable += '</tbody></table>';
        
        if (found) {
            resultEl.innerHTML = htmlTable;
        } else {
            resultEl.innerHTML = '<div class="text-red-500 text-sm font-semibold p-4 text-center border border-red-500 bg-red-50 rounded"><i class="fas fa-exclamation-triangle mr-2"></i>Could not automatically parse the data. Please ensure you copied the exact text or HTML structure from the SSRS report page.</div>';
        }
    }

    window.updateAndOpenScript = function(field, value, isInputClick = false) { 
        // If clicking directly into the input to copy, don't pop the script up
        if(isInputClick) return;
        
        const rep = currentUserRepName || "your rep"; const val = value || "(Unknown)"; let scriptText = ""; 
        if (field === 'Contact') { scriptText = `Hi ${val}, my name is ${rep} with W.B. Mason. I am your dedicated account representative. I'm calling today to quickly introduce myself and see if there are any immediate needs I can assist you with?`; } 
        else if (field === 'Last Order') { scriptText = `Hi, I noticed your last order was on ${val}. I wanted to check in and see if you were ready to restock on any essentials?`; } 
        else if (field === 'Phone') { scriptText = `(Verifying Phone Number: ${val}) \n\nHi, is this the best number to reach the person in charge of office supplies?`; } 
        else if (field === 'Email') { scriptText = `(Verifying Email: ${val}) \n\nHi, I wanted to confirm I have the correct email address on file to send you some updated pricing sheets. Is ${val} still correct?`; } 
        else { scriptText = `Generic Script for ${field}: ${val}`; }

        if (scriptContent) scriptContent.innerText = scriptText; 
        
        const modal = document.getElementById('script-modal'); 
        if (modal) { modal.classList.remove('hidden'); modal.style.display = 'flex'; }

    window.sendHelpNote = async function() { 
        const v = document.getElementById('internal-note-input').value; 
        if(!v) return; 
        window.handleCustomSave(`[Help Request]: ${v}`, true); 
        
        const mgrName = currentUserProfile?.cr714_managerassigned;
        if (mgrName && msalAccount) {
            const mgrEmail = mgrName.trim().replace(/\s+/g, '.').toLowerCase() + '@wbmason.com';
            try {
                // Ensure Mail.Send token is acquired ONLY when this specific action is triggered
                const token = await window.getToken("Mail.Send");
                const mailBody = { 
                    message: { 
                        subject: `Help Request from ${currentUserRepName} for Account ${currentRecordId}`, 
                        body: { contentType: "Text", content: `Account: ${currentRecordId}\nCompany: ${currentSelectedRecord.cr714_company}\n\nMessage:\n${v}` }, 
                        toRecipients: [{ emailAddress: { address: mgrEmail } }] 
                    }, 
                    saveToSentItems: "false" 
                };
                fetch(`${GRAPH_URL}/me/sendMail`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(mailBody) });
            } catch(e) { console.warn("Failed to send manager email", e); }
        }
        
        try {
            const token = await window.getToken("https://org23279050.crm.dynamics.com//user_impersonation");
            const headers = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
            // Loop through all data sources connected to this account to push the help status correctly so the manager dashboard picks it up
            for (let src of currentSelectedRecord.sources) {
                await fetch(`${DATAVERSE_URL}/${src.table}(${src.id})`, {
                    method: 'PATCH', headers: headers, body: JSON.stringify({ cr714_actionmessage: `[HELP REQUEST]: ${v}` })
                });
                src.message = `[HELP REQUEST]: ${v}`;
            }
            currentSelectedRecord.cr714_actionmessage = `[HELP REQUEST]: ${v}`;
            document.getElementById('form-msg-value').innerText = `[HELP REQUEST]: ${v}`;
        } catch(e) { console.error("Dataverse help update failed", e); }
        
        document.getElementById('internal-note-input').value=''; 
        window.toggleInternalNote(); 
        window.showToast("Help Request Sent"); 
    }

    window.downloadAuditLog = function() { const log = localStorage.getItem('daytona_audit_log') || '[]'; const blob = new Blob([log], {type: 'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `daytona_audit_log_${new Date().toLocaleDateString('en-CA')}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); window.showToast("Log downloaded", "success"); }
    
    window.showActivityLog = function(type) { 
        const list = document.getElementById('activity-log-list'); list.innerHTML = ""; 
        let log = []; try { log = JSON.parse(localStorage.getItem('daytona_audit_log') || '[]'); } catch(e) {} 
        const today = new Date().toLocaleDateString('en-CA'); 
        const filtered = log.filter(entry => { if(!entry.timestamp) return false; return entry.timestamp.startsWith(today); }); 
        
        if(filtered.length === 0) { 
            list.innerHTML = "<div class='text-muted italic text-center p-4'>No activity recorded today.</div>"; 
        } else { 
            filtered.reverse().forEach(item => { 
                const time = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); 
                const d = document.createElement('div'); 
                d.className = `p-3 border-b flex items-start gap-3 cursor-pointer hover:bg-black/5 transition-colors`; 
                d.style.borderColor = "var(--border-color)";
                d.onclick = () => { 
                    if(item.recordId && item.recordId !== 'N/A') {
                        document.getElementById('activity-modal').style.display='none';
                        window.selectRecord(item.recordId);
                    }
                };
                
                let recDisplay = '';
                if(item.recordId && item.recordId !== 'N/A') {
                    let compName = item.companyName;
                    if(!compName) {
                        const rec = allRecords.find(r => String(r.cr714_id) === String(item.recordId));
                        if(rec) compName = rec.cr714_company;
                    }
                    recDisplay = `<div class="text-xs font-bold mb-0.5 truncate" style="color: var(--primary);"><i class="fas fa-building mr-1"></i>${item.recordId} ${compName ? '- ' + compName : ''}</div>`;
                }

                d.innerHTML = `<div class="flex-grow min-w-0"><div class="flex justify-between items-center mb-1"><span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded border text-blue-600" style="background-color: var(--bg-input); border-color: var(--border-color);">${item.type}</span><span class="text-[10px] text-muted">${time}</span></div>${recDisplay}<div class="text-xs text-main truncate">${item.details}</div></div>`; 
                list.appendChild(d); 
            }); 
        } 
        document.getElementById('activity-modal').classList.remove('hidden'); document.getElementById('activity-modal').style.display = 'flex'; 
    }
    
    window.exportActivityLog = function() { let log = []; try { log = JSON.parse(localStorage.getItem('daytona_audit_log') || '[]'); } catch(e) {} const today = new Date().toLocaleDateString('en-CA'); const filtered = log.filter(entry => entry.timestamp && entry.timestamp.startsWith(today)); if(filtered.length === 0) { window.showToast("No activity to export", "info"); return; } let csv = "Timestamp,Type,Details\n"; filtered.forEach(item => { csv += `${item.timestamp},${item.type},"${(item.details||'').replace(/"/g, '""')}"\n`; }); const blob = new Blob([csv], {type: 'text/csv'}); const url = window.URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `Activity_${today}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a); }

                const mailToken = await window.getToken("Mail.Send");

                const payload = {
                    cr714_topic: `ACT Bug: ${issue.substring(0, 30)}`,
                    cr714_description: `User: ${currentUserRepName}\nIssue: ${issue}\nTime: ${new Date().toISOString()}\nBrowser: ${navigator.userAgent}`,
                    cr714_requesteremail: msalAccount ? msalAccount.username : currentUserRepName,
                    cr714_bucket: "App Bug",

                                { emailAddress: { address: "matt.bleakley@wbmason.com" } },
                                { emailAddress: { address: "taylor.whitaker@wbmason.com" } },
                                { emailAddress: { address: "vanessa.mclellan@wbmason.com" } }

    document.addEventListener('DOMContentLoaded', () => {
        window.loadSavedTheme();
        document.addEventListener('click', function(event) { if (!event.target.matches('#theme-toggle-btn') && !event.target.closest('#theme-toggle-btn')) { const menu = document.getElementById('theme-menu'); if (menu && menu.classList.contains('show')) { menu.classList.remove('show'); } } if (!event.target.closest('.theme-dropdown')) { const settings = document.getElementById('gallery-settings-menu'); if(settings && settings.style.display === 'block') settings.style.display = 'none'; } });
        msalInstance.handleRedirectPromise().then(resp => { if (resp && resp.account) { msalAccount = resp.account; currentUserRepName = msalAccount.name; window.initializeApp(); } else { const accounts = msalInstance.getAllAccounts(); if(accounts.length > 0) { msalAccount = accounts[0]; currentUserRepName = msalAccount.name; window.initializeApp(); } else { document.getElementById('global-loader').style.display='none'; document.getElementById('login-container').classList.remove('hidden'); document.getElementById('login-container').style.display='flex'; } } }).catch(e => { console.error(e); document.getElementById('global-loader').style.display='none'; document.getElementById('login-container').style.display='flex'; });
        const resizer = document.getElementById('history-resizer'); const grid = document.querySelector('.app-grid'); const historyCol = document.getElementById('history-column');
        if (resizer && grid && historyCol) {
            let isResizing = false; let startX, startWidth; const savedWidth = localStorage.getItem('daytona_history_width'); if (savedWidth) grid.style.setProperty('--history-width', savedWidth);
            const onDown = (clientX) => { isResizing = true; startX = clientX; startWidth = historyCol.offsetWidth; document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; resizer.classList.add('bg-blue-500/20'); };
            const onMove = (clientX) => { if (!isResizing) return; const deltaX = startX - clientX; let newWidth = startWidth + deltaX; if (newWidth < 200) newWidth = 200; if (newWidth > 600) newWidth = 600; grid.style.setProperty('--history-width', `${newWidth}px`); };
            const onUp = () => { if (isResizing) { isResizing = false; document.body.style.cursor = ''; document.body.style.userSelect = ''; resizer.classList.remove('bg-blue-500/20'); localStorage.setItem('daytona_history_width', getComputedStyle(grid).getPropertyValue('--history-width')); } };
            resizer.addEventListener('mousedown', (e) => onDown(e.clientX)); document.addEventListener('mousemove', (e) => onMove(e.clientX)); document.addEventListener('mouseup', onUp);
        }
    });
