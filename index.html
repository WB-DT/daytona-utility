<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Reassignment - Dark Mode Elite</title>
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <style>
        /* DARK MODE THEME */
        :root {
            --bg-color: #0f111a;
            --container-bg: #1a1d2b;
            --text-color: #e0e0e0;
            --border-color: #2d324a;
            --accent-blue: #0078d4;
            --accent-green: #107c10;
            --accent-red: #a80000;
            --row-hover: #252a3d;
            --capacity-warning: #4b4215; /* Subtle gold for capacity check */
        }

        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: var(--bg-color); color: var(--text-color); }
        .container { max-width: 1500px; margin: 0 auto; background: var(--container-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .reassign-bar { background: #252a3d; padding: 20px; border-radius: 8px; display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .table-container { height: 550px; overflow-y: auto; border: 1px solid var(--border-color); background: #141724; border-radius: 4px; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { position: sticky; top: 0; background: var(--accent-blue); color: white; padding: 12px; text-align: left; font-size: 11px; z-index: 10; cursor: pointer; user-select: none; }
        th:hover { background: #005a9e; }
        
        td { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 13px; }
        tr:hover { background-color: var(--row-hover); }

        /* SELECTION STYLES */
        tr.selected-source { background-color: #1a3a5a !important; border-left: 4px solid var(--accent-blue); }
        tr.selected-target { background-color: #1a4a1a !important; border-left: 4px solid var(--accent-green); }

        /* CAPACITY HIGHLIGHT (Within 10 digits) */
        tr.near-capacity { background-color: var(--capacity-warning); border-left: 4px solid #ffd700; color: #fff; }

        .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; }
        .form-group { flex: 1; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #9da5b4; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: #0f111a; color: white; box-sizing: border-box; }
        
        #submitBtn { background: var(--accent-blue); color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #submitBtn:hover { background: #0086f0; }
        #submitBtn:disabled { background: #333; color: #666; cursor: not-allowed; }

        .stats-label { font-size: 11px; color: #666; }
    </style>
</head>
<body>

<div id="login-container" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div style="background:var(--container-bg); padding:40px; border-radius:8px; text-align:center; border: 1px solid var(--border-color);">
        <h2 style="color:var(--accent-blue);">Account Reassignment Elite</h2>
        <button onclick="login()" id="submitBtn">Sign in with Microsoft</button>
    </div>
</div>

<div class="container" id="main-app" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h2 style="margin:0; color:var(--accent-blue);">Dark Mode Dashboard</h2>
        <div style="color:#aaa; font-size:12px;">Rows: <span id="feed-count">0</span></div>
    </div>

    <div class="reassign-bar">
        <div class="form-group">
            <label>Action Filter</label>
            <select id="actionFilter" onchange="applyListFilter()"></select>
        </div>
        <div class="form-group">
            <label>Source Rep</label>
            <input type="text" id="sourceRepDisplay" readonly placeholder="Pick Source">
            <input type="hidden" id="sourceRep">
        </div>
        <div class="form-group">
            <label>Target Rep</label>
            <input type="text" id="targetRepDisplay" readonly placeholder="Pick Target">
            <input type="hidden" id="targetRep">
        </div>
        <div class="form-group" style="max-width:80px;">
            <label>Qty</label>
            <input type="number" id="count" min="1" value="1">
        </div>
        <button id="submitBtn" onclick="triggerFlow()" disabled>Execute Transfer</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
        <div>
            <h3>From: Work Left</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th id="sort-left-name" onclick="setSort('left', 'name')">Rep Name</th>
                            <th id="sort-left-rem" onclick="setSort('left', 'rem')">Left</th>
                        </tr>
                    </thead>
                    <tbody id="sourceBody"></tbody>
                </table>
            </div>
        </div>
        <div>
            <h3>To: Target Capacity</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th id="sort-right-name" onclick="setSort('right', 'name')">Rep Name</th>
                            <th id="sort-right-total" onclick="setSort('right', 'total')">Total</th>
                            <th id="sort-right-sent" onclick="setSort('right', 'sent')">Done</th>
                        </tr>
                    </thead>
                    <tbody id="targetBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    let allData = [];
    let reps = [];
    let currentMetrics = {};
    let sortConfig = { left: { col: 'rem', dir: 'desc' }, right: { col: 'total', dir: 'desc' } };

    async function login() {
        const res = await msalInstance.loginPopup({ scopes: ["User.Read"] });
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        fetchData();
    }

    async function fetchData() {
        const response = await fetch("https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/952746524c354ee8a4d335d24ce01d6d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wOEIjRMghIgIGX4GU85rwL1hLdIeFT8O0I44C9C0vSo", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ repName: "User" })
        });
        const d = await response.json();
        allData = d.accountList || d.body.accountList;
        reps = d.repList || d.body.repList;
        document.getElementById('feed-count').innerText = allData.length;
        
        const filter = document.getElementById('actionFilter');
        const actions = [...new Set(allData.map(r => r.cr714_action).filter(Boolean))].sort();
        filter.innerHTML = '<option value="">-- Action Filter --</option>';
        actions.forEach(a => filter.add(new Option(a, a)));
    }

    function applyListFilter() {
        const sel = document.getElementById('actionFilter').value;
        if(!sel) return;
        currentMetrics = {};
        allData.forEach(r => {
            if (r.cr714_action === sel) {
                const rep = (r.cr714_rep || "Unassigned").trim();
                const done = (r.cr714_actionemailsent && String(r.cr714_actionemailsent).trim() !== "") ? 1 : 0;
                if (!currentMetrics[rep]) currentMetrics[rep] = { total: 0, sent: 0, rem: 0 };
                currentMetrics[rep].total++;
                currentMetrics[rep].sent += done;
            }
        });
        Object.keys(currentMetrics).forEach(k => currentMetrics[k].rem = currentMetrics[k].total - currentMetrics[k].sent);
        render();
    }

    function setSort(side, col) {
        if (sortConfig[side].col === col) sortConfig[side].dir = sortConfig[side].dir === 'desc' ? 'asc' : 'desc';
        else { sortConfig[side].col = col; sortConfig[side].dir = 'desc'; }
        render();
    }

    function render() {
        const sBody = document.getElementById('sourceBody');
        const tBody = document.getElementById('targetBody');
        sBody.innerHTML = ''; tBody.innerHTML = '';

        const sorter = (side) => (a, b) => {
            const config = sortConfig[side];
            const valA = config.col === 'name' ? a : (currentMetrics[a] ? currentMetrics[a][config.col] : 0);
            const valB = config.col === 'name' ? b : (currentMetrics[b] ? currentMetrics[b][config.col] : 0);
            return config.dir === 'asc' ? (isNaN(valA) ? valA.localeCompare(valB) : valA - valB) : (isNaN(valA) ? valB.localeCompare(valA) : valB - valA);
        };

        // Render Left
        Object.keys(currentMetrics).filter(k => currentMetrics[k].rem > 0).sort(sorter('left')).forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${r}</td><td><span class="badge" style="background:var(--accent-red)">${currentMetrics[r].rem}</span></td>`;
            tr.onclick = () => { document.querySelectorAll('#sourceBody tr').forEach(row => row.className = ''); tr.className = 'selected-source'; document.getElementById('sourceRep').value = r; document.getElementById('sourceRepDisplay').value = r; validate(); };
            sBody.appendChild(tr);
        });

        // Render Right
        reps.map(r => r.cr714_name).sort(sorter('right')).forEach(n => {
            const met = currentMetrics[n] || { total: 0, sent: 0 };
            const tr = document.createElement('tr');
            
            // HIGHLIGHT LOGIC: Within 10 digits of completion
            const diff = met.total - met.sent;
            if (met.total > 0 && diff <= 10) { tr.className = 'near-capacity'; }

            tr.innerHTML = `<td>${n}</td><td><span class="badge" style="background:var(--accent-blue)">${met.total}</span></td><td><span class="badge" style="background:var(--accent-green)">${met.sent}</span></td>`;
            tr.onclick = () => { document.querySelectorAll('#targetBody tr').forEach(row => row.className = ''); tr.className += ' selected-target'; document.getElementById('targetRep').value = n; document.getElementById('targetRepDisplay').value = n; validate(); };
            tBody.appendChild(tr);
        });
    }

    function validate() { 
        const s = document.getElementById('sourceRep').value; 
        const t = document.getElementById('targetRep').value; 
        document.getElementById('submitBtn').disabled = !(s && t && s !== t); 
    }

    async function triggerFlow() { 
        alert("Flow triggered!"); 
    }

    document.addEventListener('DOMContentLoaded', () => { if(msalInstance.getAllAccounts().length > 0) login(); });
</script>
</body>
</html>
