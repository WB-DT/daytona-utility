<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Reassignment - Elite Dark Mode</title>
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --container-bg: #1a1d2b;
            --text-color: #e0e0e0;
            --border-color: #2d324a;
            --accent-blue: #0078d4;
            --accent-green: #107c10;
            --accent-red: #a80000;
            --row-hover: #252a3d;
            --capacity-warning: #4b4215; 
        }

        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: var(--bg-color); color: var(--text-color); margin: 0; }
        .container { max-width: 1600px; margin: 20px auto; background: var(--container-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Header & Bar */
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .reassign-bar { background: #252a3d; padding: 20px; border-radius: 8px; display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px; border: 1px solid var(--border-color); }
        
        /* Inputs */
        .form-group { flex: 1; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #9da5b4; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: #0f111a; color: white; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: var(--accent-blue); }

        /* Tables */
        .search-wrapper { margin-bottom: 10px; }
        .table-container { height: 500px; overflow-y: auto; border: 1px solid var(--border-color); background: #141724; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { position: sticky; top: 0; background: var(--accent-blue); color: white; padding: 12px; text-align: left; font-size: 11px; z-index: 10; cursor: pointer; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        tr:hover { background-color: var(--row-hover); }

        /* Row States */
        tr.near-capacity { background-color: var(--capacity-warning) !important; }
        tr.near-capacity td { border-left: 4px solid #ffd700; }
        
        tr.selected-source { background-color: #1a3a5a !important; font-weight: bold; }
        tr.selected-source td { border-left: 4px solid var(--accent-blue); }
        
        tr.selected-target { background-color: #1a4a1a !important; font-weight: bold; outline: 1px solid #4ade80; }
        tr.selected-target td { border-left: 4px solid #4ade80; }

        .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; }
        
        #submitBtn { background: var(--accent-blue); color: white; border: none; padding: 12px 30px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #submitBtn:hover:not(:disabled) { background: #0086f0; transform: translateY(-1px); }
        #submitBtn:disabled { background: #333; color: #666; cursor: not-allowed; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f111a; }
        ::-webkit-scrollbar-thumb { background: #2d324a; border-radius: 4px; }
    </style>
</head>
<body>

<div id="login-container" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); display:flex; align-items:center; justify-content:center; z-index:9999;">
    <div style="background:var(--container-bg); padding:50px; border-radius:12px; text-align:center; border: 1px solid var(--border-color);">
        <h1 style="color:var(--accent-blue); margin-top:0;">Daytona Utility</h1>
        <p style="color:#888; margin-bottom:30px;">Account Reassignment & Inventory Management</p>
        <button onclick="login()" id="submitBtn" style="width:100%;">Sign in with Microsoft</button>
    </div>
</div>

<div class="container" id="main-app" style="display:none;">
    <div class="header-flex">
        <h2 style="margin:0; color:var(--accent-blue);">Management Console</h2>
        <div style="color:#666; font-size:12px; background:#141724; padding:5px 15px; border-radius:20px; border:1px solid var(--border-color);">
            Rows Loaded: <span id="feed-count" style="color:#aaa;">0</span>
        </div>
    </div>

    <div class="reassign-bar">
        <div class="form-group">
            <label>Current Action</label>
            <select id="actionFilter" onchange="applyListFilter()"></select>
        </div>
        <div class="form-group">
            <label>Source (Moving From)</label>
            <input type="text" id="sourceRepDisplay" readonly placeholder="Select a rep from Left">
            <input type="hidden" id="sourceRep">
        </div>
        <div class="form-group">
            <label>Target (Moving To)</label>
            <input type="text" id="targetRepDisplay" readonly placeholder="Select a rep from Right">
            <input type="hidden" id="targetRep">
        </div>
        <div class="form-group" style="max-width:100px;">
            <label>Quantity</label>
            <input type="number" id="count" min="1" value="1">
        </div>
        <button id="submitBtn" onclick="triggerFlow()" disabled>Transfer Accounts</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
        <div>
            <div class="search-wrapper">
                <input type="text" id="searchLeft" placeholder="Search Source Reps..." onkeyup="render()">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th onclick="setSort('left', 'name')">Rep Name</th>
                            <th onclick="setSort('left', 'rem')">Work Remaining</th>
                        </tr>
                    </thead>
                    <tbody id="sourceBody"></tbody>
                </table>
            </div>
        </div>

        <div>
            <div class="search-wrapper">
                <input type="text" id="searchRight" placeholder="Search Target Reps..." onkeyup="render()">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th onclick="setSort('right', 'name')">Rep Name</th>
                            <th onclick="setSort('right', 'total')">Total</th>
                            <th onclick="setSort('right', 'sent')">Done</th>
                        </tr>
                    </thead>
                    <tbody id="targetBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    let allData = []; let reps = []; let currentMetrics = {};
    let sortConfig = { left: { col: 'rem', dir: 'desc' }, right: { col: 'total', dir: 'desc' } };

    async function login() {
        const res = await msalInstance.loginPopup({ scopes: ["User.Read"] });
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        fetchData();
    }

    async function fetchData() {
        const response = await fetch("https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/952746524c354ee8a4d335d24ce01d6d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wOEIjRMghIgIGX4GU85rwL1hLdIeFT8O0I44C9C0vSo", {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repName: "User" })
        });
        const d = await response.json();
        allData = d.accountList || d.body.accountList;
        reps = d.repList || d.body.repList;
        document.getElementById('feed-count').innerText = allData.length.toLocaleString();
        
        const filter = document.getElementById('actionFilter');
        const actions = [...new Set(allData.map(r => r.cr714_action).filter(Boolean))].sort();
        filter.innerHTML = '<option value="">-- Select Action --</option>';
        actions.forEach(a => filter.add(new Option(a, a)));
    }

    function applyListFilter() {
        const sel = document.getElementById('actionFilter').value;
        if(!sel) return;
        currentMetrics = {};
        allData.forEach(r => {
            if (r.cr714_action === sel) {
                const rep = (r.cr714_rep || "Unassigned").trim();
                const done = (r.cr714_actionemailsent && String(r.cr714_actionemailsent).trim() !== "") ? 1 : 0;
                if (!currentMetrics[rep]) currentMetrics[rep] = { total: 0, sent: 0, rem: 0 };
                currentMetrics[rep].total++;
                currentMetrics[rep].sent += done;
            }
        });
        Object.keys(currentMetrics).forEach(k => currentMetrics[k].rem = currentMetrics[k].total - currentMetrics[k].sent);
        render();
    }

    function setSort(side, col) {
        if (sortConfig[side].col === col) sortConfig[side].dir = sortConfig[side].dir === 'desc' ? 'asc' : 'desc';
        else { sortConfig[side].col = col; sortConfig[side].dir = 'desc'; }
        render();
    }

    function render() {
        const sBody = document.getElementById('sourceBody'); const tBody = document.getElementById('targetBody');
        const sSearch = document.getElementById('searchLeft').value.toLowerCase();
        const tSearch = document.getElementById('searchRight').value.toLowerCase();
        sBody.innerHTML = ''; tBody.innerHTML = '';

        const sorter = (side) => (a, b) => {
            const config = sortConfig[side];
            const valA = config.col === 'name' ? a : (currentMetrics[a] ? currentMetrics[a][config.col] : 0);
            const valB = config.col === 'name' ? b : (currentMetrics[b] ? currentMetrics[b][config.col] : 0);
            return config.dir === 'asc' ? (isNaN(valA) ? valA.localeCompare(valB) : valA - valB) : (isNaN(valA) ? valB.localeCompare(valA) : valB - valA);
        };

        // Render Source
        Object.keys(currentMetrics).filter(k => k.toLowerCase().includes(sSearch) && currentMetrics[k].rem > 0).sort(sorter('left')).forEach(r => {
            const tr = document.createElement('tr');
            if (document.getElementById('sourceRep').value === r) tr.classList.add('selected-source');
            tr.innerHTML = `<td>${r}</td><td><span class="badge" style="background:var(--accent-red)">${currentMetrics[r].rem}</span></td>`;
            tr.onclick = () => { document.getElementById('sourceRep').value = r; document.getElementById('sourceRepDisplay').value = r; render(); validate(); };
            sBody.appendChild(tr);
        });

        // Render Target
        reps.map(r => r.cr714_name).filter(n => n.toLowerCase().includes(tSearch)).sort(sorter('right')).forEach(n => {
            const met = currentMetrics[n] || { total: 0, sent: 0 };
            const tr = document.createElement('tr');
            const diff = met.total - met.sent;
            
            if (met.total > 0 && diff <= 10) tr.classList.add('near-capacity');
            if (document.getElementById('targetRep').value === n) tr.classList.add('selected-target');

            tr.innerHTML = `<td>${n}</td><td><span class="badge" style="background:var(--accent-blue)">${met.total}</span></td><td><span class="badge" style="background:var(--accent-green)">${met.sent}</span></td>`;
            tr.onclick = () => { document.getElementById('targetRep').value = n; document.getElementById('targetRepDisplay').value = n; render(); validate(); };
            tBody.appendChild(tr);
        });
    }

    function validate() { 
        const s = document.getElementById('sourceRep').value; 
        const t = document.getElementById('targetRep').value; 
        document.getElementById('submitBtn').disabled = !(s && t && s !== t); 
    }

    async function triggerFlow() { 
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = "Processing...";
        
        await fetch("https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/ccd1e78456a4470c9bef267fc8b6ba77/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=delp7lT79GXjEHWIj9AHaxSmAyUrojFqAhNx0nsv0pM", {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                sourceRep: document.getElementById('sourceRep').value,
                targetRep: document.getElementById('targetRep').value,
                reassignCount: parseInt(document.getElementById('count').value),
                actionFilter: document.getElementById('actionFilter').value,
                requestingUser: "User"
            })
        });
        alert("Transfer Complete!"); location.reload();
    }

    document.addEventListener('DOMContentLoaded', () => { if(msalInstance.getAllAccounts().length > 0) login(); });
</script>
</body>
</html>
