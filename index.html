      const results=await Promise.allSettled(names.map(name=>loadSection(name,account.accountid,accountNumber,tokens)));
      results.forEach((result,i)=>{ if(result.status==='fulfilled') state.data[names[i]]=result.value; else state.errors.push(`${names[i]}: ${result.reason?.message || result.reason}`); });
      if (state.errors.length) console.warn('A.C.T. nonblocking section warnings',state.errors);
      step('sections','Dynamics sections','done'); progress(82,'Applying live values to the interface...');
      step('render','Interface hydration','working'); applyLiveData(); await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      step('render','Interface hydration','done'); progress(100,'Workspace ready'); unlock();
    } catch(error) { fail(error); }
  }
  signIn.addEventListener('click',()=>run(true)); retry.addEventListener('click',()=>run(false));
  run(false);
})();
</script></body></html>
