 {type:'AM',set:'cr714_accountmanagementdatasets',filter:r=>`cr714_rep eq '${q(r)}' and cr714_accountnum ne null and statecode eq 0`,id:'cr714_accountnum'},

M,p,S.tokens.CRM)).value||[]]));const d={account:a};pairs.forEach(x=>{if(x.status==='fulfilled')d[x.value[0]]=x.value[1];else S.errors.push(x.reason.message)});try{d.logistics=(await get(C.ACT,`cr714_logisticslog_2s?$select=cr714_accountnumber,cr714_callnotes,cr714_createdby,cr714_logtype,createdon,modifiedon&$filter=${encodeURIComponent(`cr714_accountnumber eq '${acct}'`)}&$orderby=createdon desc&$top=5000`,S.tokens.ACT)).value||[]}catch(e){S.errors.push('Logistics: '+e.message)}return d}
function renderList(){const box=$('#accounts');$('#count').textContent=S.records.length;box.innerHTML=S.records.length?S.records.map((r,i)=>`<button class="acct ${i===0?'active':''}" data-id="${esc(r.id)}"><span class="avatar">${esc((r.company||r.id).split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())}</span><span><strong>${esc(r.company)}</strong><small>${esc(r.id)} · ${esc(r.type)}${r.action?' · '+esc(r.action):''}</small></span></button>`).join(''):`<div class="empty">No assigned ACT records were returned for ${esc(S.profile.displayName)}.</div>`;box.querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.id))}
