<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Reassignment Tool - v104.84</title>
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script>
    // 1. GLOBAL CONSTANTS - MUST BE AT THE TOP
    const DATAVERSE_URL = "https://org23279050.crm.dynamics.com/api/data/v9.2";
    const DATAVERSE_SCOPE = "https://org23279050.crm.dynamics.com/.default";
    
    const msalConfig = { 
        auth: { 
            clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", 
            authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", 
            redirectUri: "https://WB-DT.github.io/daytona-utility/" 
        }, 
        cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true } 
    };

    // Initialize MSAL immediately
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    
    const configs = {
        'AM': { table: 'cr714_accountmanagementdatasets', repCol: 'cr714_rep', noteCol: 'cr714_accountmanagementnotes', idCol: 'cr714_accountmanagementdatasetid' },
        'Cadence': { table: 'cr714_cadencedatasets', repCol: 'cr714_retentionrep', noteCol: 'cr714_qbnotes', idCol: 'cr714_cadencedatasetid' },
        'Prospecting': { table: 'cr714_prospectingdatasets', repCol: 'cr714_repassigned', noteCol: 'cr714_prospectingnotes', idCol: 'cr714_prospectingdatasetid' },
        'Louise Brown': { table: 'cr714_louisebrowndatasets', repCol: 'cr714_assignedrep', noteCol: 'cr714_notesfr', idCol: 'cr714_louisebrowndatasetid' }
    };

    let allData = []; 
    let currentMetrics = {}; 
    let currentScope = 'unsent';
    let sortConfig = { left: { col: 'rem', dir: 'desc' }, right: { col: 'name', dir: 'asc' } };

    // 2. AUTHENTICATION FUNCTIONS
    async function initAuth() {
        const loginContainer = document.getElementById('login-container');
        loginContainer.style.display = 'flex';
        try {
            await msalInstance.handleRedirectPromise();
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) {
                completeLogin();
            } else {
                try { 
                    await msalInstance.ssoSilent({ scopes: [DATAVERSE_SCOPE] }); 
                    completeLogin(); 
                } catch (e) {
                    document.getElementById('auth-status').style.display = 'none';
                    document.getElementById('auth-text').innerText = "Authentication Required";
                    document.getElementById('manual-login-btn').style.display = 'block';
                }
            }
        } catch (e) { console.error("Auth Error:", e); }
    }

    async function manualLogin() { 
        try {
            await msalInstance.loginPopup({ scopes: [DATAVERSE_SCOPE] }); 
            completeLogin(); 
        } catch (e) { console.error("Manual Login Error:", e); }
    }

    function completeLogin() { 
        document.getElementById('login-container').style.display = 'none'; 
        document.getElementById('main-app').style.display = 'block'; 
        
        // Populate Dataset dropdown if empty
        const dsFilter = document.getElementById('datasetFilter');
        if (dsFilter.options.length === 0) {
            Object.keys(configs).forEach(k => dsFilter.add(new Option(k, k)));
        }
        
        fetchData(); 
    }

    async function getToken() {
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length === 0) throw new Error("No active account! Please sign in.");
        const request = { scopes: [DATAVERSE_SCOPE], account: accounts[0] };
        return (await msalInstance.acquireTokenSilent(request)).accessToken;
    }

    // 3. DATA FETCHING & PROCESSING
    async function fetchData() {
        const dsKey = document.getElementById('datasetFilter').value;
        const config = configs[dsKey];
        const feedDisplay = document.getElementById('feed-count');
        feedDisplay.innerText = "Syncing Dataverse...";
        
        try {
            const token = await getToken();
            const select = `cr714_accountnum,${config.repCol},cr714_action,${config.noteCol},${config.idCol}`;
            // Use config.table for the endpoint
            const url = `${DATAVERSE_URL}/${config.table}?$select=${select}&$filter=statecode eq 0`;
            
            const response = await fetch(url, { 
                headers: { 
                    'Authorization': `Bearer ${token}`, 
                    'Prefer': 'odata.maxpagesize=5000' 
                }
            });
            
            if (!response.ok) throw new Error("Fetch failed with status " + response.status);
            
            const d = await response.json();
            allData = d.value;
            
            // Populate Action Filter
            const filter = document.getElementById('actionFilter');
            const actions = [...new Set(allData.map(r => r.cr714_action).filter(Boolean))].sort();
            filter.innerHTML = '<option value="ALL">-- ALL ACTIONS --</option>';
            actions.forEach(a => filter.add(new Option(a, a)));
            
            processLocalMetrics();
        } catch (e) {
            feedDisplay.innerText = "Error"; 
            console.error("Fetch Data Error:", e);
            alert("Error syncing data: " + e.message);
        }
    }

    // [Mining logic, render, and executeNativeTransfer functions remain as provided in v104.84]
    // ... (rest of the processing logic)
</script>
</head>
<body onload="initAuth()">

<div id="login-container">
    <div style="text-align:center;">
        <div id="auth-status" class="loader" style="margin: 0 auto 20px;"></div>
        <h2 id="auth-text">Checking Credentials...</h2>
        <button id="manual-login-btn" onclick="manualLogin()" style="display:none;" class="btn-main">Sign In Manually</button>
    </div>
</div>

<div class="container" id="main-app" style="display:none;">
    <div class="header-flex">
        <div>
            <h2 style="margin:0;">AM Reassignment Tool <span style="font-size: 12px; color: #666;">v104.84 (Native Patch)</span></h2>
            <div style="font-size: 11px; color: var(--accent-green);">Direct Dataverse API Connection Active</div>
        </div>
        <div style="text-align: right;">
            <button onclick="fetchData()" class="btn-secondary">↻ Refresh All Datasets</button>
            <div style="color: #9da5b4; font-size: 13px; margin-top:5px;">Records in View: <span id="feed-count" style="color:white; font-weight:bold;">0</span></div>
        </div>
    </div>

    <div class="reassign-bar">
        <div class="form-group">
            <label>Dataset</label>
            <select id="datasetFilter" onchange="fetchData()"></select>
        </div>
        <div class="form-group">
            <label>Action Filter</label>
            <select id="actionFilter" onchange="processLocalMetrics()"></select>
        </div>
        <div class="form-group" style="max-width:200px;">
            <label>Reassignment Scope</label>
            <div class="toggle-group">
                <button class="toggle-btn active" id="scopeUnsent" onclick="setScope('unsent')">UNSENT ONLY</button>
                <button class="toggle-btn" id="scopeAll" onclick="setScope('all')">TOTAL POOL</button>
            </div>
        </div>
        <div class="form-group">
            <label>From (Source Rep)</label>
            <input type="text" id="sourceRepDisplay" readonly placeholder="Pick Left Table">
            <input type="hidden" id="sourceRep">
        </div>
        <div class="form-group">
            <label>To (Target Rep)</label>
            <input type="text" id="targetRepDisplay" readonly placeholder="Pick Right Table">
            <input type="hidden" id="targetRep">
        </div>
        <div class="form-group" style="max-width:80px;">
            <label>Qty</label>
            <input type="number" id="count" min="1" value="1">
        </div>
        <button id="submitBtn" class="btn-main" onclick="executeNativeTransfer()" disabled>Transfer Records</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
        <div>
            <label id="sourceLabel" style="margin-bottom: 10px; display:block;">Source: Reps with Unsent Work</label>
            <input type="text" id="searchLeft" placeholder="Search Source Reps..." onkeyup="render()" style="margin-bottom:10px;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-name" onclick="setSort('left', 'name')">Rep Name ↕</th>
                            <th class="col-num" onclick="setSort('left', 'total')">Total ↕</th>
                            <th class="col-num" onclick="setSort('left', 'rem')">Targetable ↕</th>
                        </tr>
                    </thead>
                    <tbody id="sourceBody"></tbody>
                </table>
            </div>
        </div>

        <div>
            <label style="margin-bottom: 10px; display:block;">Target: Potential Recipients</label>
            <input type="text" id="searchRight" placeholder="Search Target Reps..." onkeyup="render()" style="margin-bottom:10px;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-name" onclick="setSort('right', 'name')">Rep Name ↕</th>
                            <th class="col-num" onclick="setSort('right', 'total')">Total ↕</th>
                            <th class="col-num" onclick="setSort('right', 'rem')">Targetable ↕</th>
                        </tr>
                    </thead>
                    <tbody id="targetBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- API & CONFIG ---
// Keep the API URL for FETCHING data
const DATAVERSE_URL = "https://org23279050.crm.dynamics.com/api/data/v9.2";
// Create a NEW constant for the AUTH scope (just the base URL)
const DATAVERSE_SCOPE = "https://org23279050.crm.dynamics.com/.default";

async function initAuth() {
    document.getElementById('login-container').style.display = 'flex';
    try {
        await msalInstance.handleRedirectPromise();
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) completeLogin();
        else {
            try { 
                // Fix: Use DATAVERSE_SCOPE instead of URL
                await msalInstance.ssoSilent({ scopes: [DATAVERSE_SCOPE] }); 
                completeLogin(); 
            }
            catch (e) {
                document.getElementById('auth-status').style.display = 'none';
                document.getElementById('auth-text').innerText = "Authentication Required";
                document.getElementById('manual-login-btn').style.display = 'block';
            }
        }
    } catch (e) { console.error(e); }
}

async function manualLogin() { 
    // Fix: Use DATAVERSE_SCOPE here too
    await msalInstance.loginPopup({ scopes: [DATAVERSE_SCOPE] }); 
    completeLogin(); 
}

async function getToken() {
    // Fix: Use DATAVERSE_SCOPE here too
    const request = { 
        scopes: [DATAVERSE_SCOPE], 
        account: msalInstance.getAllAccounts()[0] 
    };
    return (await msalInstance.acquireTokenSilent(request)).accessToken;
}

    async function fetchData() {
        const dsKey = document.getElementById('datasetFilter').value;
        const config = configs[dsKey];
        const feedDisplay = document.getElementById('feed-count');
        feedDisplay.innerText = "Syncing Dataverse...";
        
        try {
            const token = await getToken();
            const select = `cr714_accountnum,${config.repCol},cr714_action,${config.noteCol},${config.idCol}`;
            const url = `${DATAVERSE_URL}/${config.table}?$select=${select}&$filter=statecode eq 0`;
            
            const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}`, 'Prefer': 'odata.maxpagesize=5000' }});
            const d = await response.json();
            allData = d.value;
            
            // Populate Action Filter
            const filter = document.getElementById('actionFilter');
            const actions = [...new Set(allData.map(r => r.cr714_action).filter(Boolean))].sort();
            filter.innerHTML = '<option value="ALL">-- ALL ACTIONS --</option>';
            actions.forEach(a => filter.add(new Option(a, a)));
            
            processLocalMetrics();
        } catch (e) {
            feedDisplay.innerText = "Error"; console.error(e);
        }
    }

    // --- NOTE MINING LOGIC ---
    function isUnsent(record, targetAction) {
        const dsKey = document.getElementById('datasetFilter').value;
        const noteText = record[configs[dsKey].noteCol] || "";
        if (!noteText) return true;

        // Logic borrowed from ACT Manager: 
        // We look for [Email Sent] specifically tied to this action
        const searchPattern = `[Email Sent] [Action: ${targetAction}`;
        return !noteText.includes(searchPattern);
    }

    function processLocalMetrics() {
        const selAction = document.getElementById('actionFilter').value;
        currentMetrics = {};

        allData.forEach(r => {
            const dsKey = document.getElementById('datasetFilter').value;
            const rep = (r[configs[dsKey].repCol] || "Unassigned").trim();
            const action = r.cr714_action || "None";
            
            // Filter set by Action
            if (selAction === "ALL" || action === selAction) {
                if (!currentMetrics[rep]) currentMetrics[rep] = { total: 0, unsentCount: 0, records: [] };
                
                const unsent = isUnsent(r, action);
                currentMetrics[rep].total++;
                if (unsent) currentMetrics[rep].unsentCount++;
                currentMetrics[rep].records.push({ ...r, _isUnsent: unsent });
            }
        });

        // Set the "rem" (targetable) metric based on Scope Toggle
        Object.keys(currentMetrics).forEach(k => {
            currentMetrics[k].rem = (currentScope === 'unsent') ? currentMetrics[k].unsentCount : currentMetrics[k].total;
        });

        document.getElementById('feed-count').innerText = allData.length.toLocaleString();
        render();
    }

    function setScope(scope) {
        currentScope = scope;
        document.getElementById('scopeUnsent').classList.toggle('active', scope === 'unsent');
        document.getElementById('scopeAll').classList.toggle('active', scope === 'all');
        document.getElementById('sourceLabel').innerText = (scope === 'unsent') ? "Source: Reps with Unsent Work" : "Source: Reps with Any Work";
        processLocalMetrics();
    }

    function setSort(side, col) {
        if (sortConfig[side].col === col) sortConfig[side].dir = sortConfig[side].dir === 'asc' ? 'desc' : 'asc';
        else { sortConfig[side].col = col; sortConfig[side].dir = 'desc'; }
        render();
    }

    function render() {
        const sBody = document.getElementById('sourceBody'); const tBody = document.getElementById('targetBody');
        const sSearch = document.getElementById('searchLeft').value.toLowerCase();
        const tSearch = document.getElementById('searchRight').value.toLowerCase();
        sBody.innerHTML = ''; tBody.innerHTML = '';

        const sorter = (side) => (a, b) => {
            const config = sortConfig[side];
            let valA = (config.col === 'name') ? a : (currentMetrics[a] ? currentMetrics[a][config.col] : 0);
            let valB = (config.col === 'name') ? b : (currentMetrics[b] ? currentMetrics[b][config.col] : 0);
            if (config.dir === 'asc') return isNaN(valA) ? (valA || "").localeCompare(valB || "") : (valA - valB);
            return isNaN(valA) ? (valB || "").localeCompare(valA || "") : (valB - valA);
        };

        const sortedReps = Object.keys(currentMetrics).filter(k => k !== "Unassigned");

        // Source List
        sortedReps.filter(k => k.toLowerCase().includes(sSearch) && currentMetrics[k].rem > 0)
            .sort(sorter('left')).forEach(r => {
                const tr = document.createElement('tr');
                if (document.getElementById('sourceRep').value === r) tr.classList.add('selected-source');
                const m = currentMetrics[r];
                tr.innerHTML = `<td class="td-name">${r}</td><td class="td-num">${m.total}</td><td class="td-num"><span class="badge" style="background:var(--accent-red)">${m.rem}</span></td>`;
                tr.onclick = () => { document.getElementById('sourceRep').value = r; document.getElementById('sourceRepDisplay').value = r; render(); };
                sBody.appendChild(tr);
            });

        // Target List
        sortedReps.filter(n => n.toLowerCase().includes(tSearch))
            .sort(sorter('right')).forEach(n => {
                const m = currentMetrics[n] || { total: 0, rem: 0 };
                const tr = document.createElement('tr');
                if (document.getElementById('targetRep').value === n) tr.classList.add('selected-target');
                tr.innerHTML = `<td class="td-name">${n}</td><td class="td-num">${m.total}</td><td class="td-num"><span class="badge" style="background:var(--accent-green)">${m.rem}</span></td>`;
                tr.onclick = () => { document.getElementById('targetRep').value = n; document.getElementById('targetRepDisplay').value = n; render(); };
                tBody.appendChild(tr);
            });
        validate();
    }

    function validate() { 
        const s = document.getElementById('sourceRep').value, t = document.getElementById('targetRep').value, action = document.getElementById('actionFilter').value;
        document.getElementById('submitBtn').disabled = !(s && t && s !== t && action !== "ALL"); 
    }

    // --- NATIVE PATCH EXECUTION ---
    async function executeNativeTransfer() {
        const btn = document.getElementById('submitBtn');
        const source = document.getElementById('sourceRep').value;
        const target = document.getElementById('targetRep').value;
        const qty = parseInt(document.getElementById('count').value);
        const dsKey = document.getElementById('datasetFilter').value;
        const config = configs[dsKey];

        // 1. Get the list of accounts belonging to source
        let candidates = currentMetrics[source].records;
        if (currentScope === 'unsent') {
            candidates = candidates.filter(r => r._isUnsent);
        }

        const toMove = candidates.slice(0, qty);
        if (toMove.length === 0) return;

        if (!confirm(`Confirm reassignment of ${toMove.length} records to ${target}?`)) return;

        btn.disabled = true;
        btn.innerText = `Processing 0/${toMove.length}...`;

        try {
            const token = await getToken();
            let successCount = 0;

            for (let i = 0; i < toMove.length; i++) {
                const rec = toMove[i];
                const patchUrl = `${DATAVERSE_URL}/${config.table}(${rec[config.idCol]})`;
                const payload = { [config.repCol]: target };

                const res = await fetch(patchUrl, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) successCount++;
                btn.innerText = `Processing ${i+1}/${toMove.length}...`;
            }

            alert(`Transfer Complete. Successfully moved ${successCount} records.`);
            document.getElementById('sourceRep').value = "";
            document.getElementById('sourceRepDisplay').value = "";
            fetchData(); // Refresh everything
        } catch (e) {
            alert("Critical Error during transfer.");
            console.error(e);
        } finally {
            btn.innerText = "Transfer Records";
            validate();
        }
    }
</script>
</body>
</html>
