<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Reassignment Tool - v104.86</title>
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --container-bg: #1a1d2b;
            --text-color: #e0e0e0;
            --border-color: #2d324a;
            --accent-blue: #0078d4;
            --accent-green: #107c10;
            --accent-red: #a80000;
            --row-hover: #252a3d;
        }

        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: var(--bg-color); color: var(--text-color); margin: 0; }
        .container { max-width: 1600px; margin: 20px auto; background: var(--container-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        #login-container { position:fixed; inset:0; background:var(--bg-color); display:none; align-items:center; justify-content:center; z-index:9999; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .reassign-bar { background: #252a3d; padding: 20px; border-radius: 8px; display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px; border: 1px solid var(--border-color); flex-wrap: wrap; }
        
        .form-group { flex: 1; min-width: 150px; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #9da5b4; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: #0f111a; color: white; box-sizing: border-box; outline: none; }
        
        .table-container { height: 550px; overflow-y: auto; border: 1px solid var(--border-color); background: #141724; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        th { position: sticky; top: 0; background: var(--accent-blue); color: white; padding: 12px 10px; font-size: 11px; z-index: 10; cursor: pointer; text-transform: uppercase; }
        .col-name { width: 50%; }
        .col-num { width: 25%; text-align: center; }

        td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 13px; }
        .td-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .td-num { text-align: center; }

        tr:hover { background-color: var(--row-hover); }
        tr.selected-source { background-color: #1a3a5a !important; border-left: 4px solid var(--accent-blue); }
        tr.selected-target { background-color: #1a4a1a !important; border-left: 4px solid var(--accent-green); }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; display: inline-block; }
        .btn-main { background: var(--accent-blue); color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-main:disabled { background: #333 !important; color: #666 !important; cursor: not-allowed; }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: #9da5b4; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        .toggle-group { display: flex; background: #0f111a; border: 1px solid var(--border-color); border-radius: 4px; padding: 2px; }
        .toggle-btn { flex: 1; border: none; background: none; color: #9da5b4; padding: 8px; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 3px; }
        .toggle-btn.active { background: var(--accent-blue); color: white; }
    </style>
</head>
<body onload="initAuth()">

<div id="login-container">
    <div style="text-align:center;">
        <div id="auth-status" class="loader" style="margin: 0 auto 20px;"></div>
        <h2 id="auth-text">Initializing Large Dataset Stream...</h2>
        <button id="manual-login-btn" onclick="manualLogin()" style="display:none;" class="btn-main">Sign In Manually</button>
    </div>
</div>

<div class="container" id="main-app" style="display:none;">
    <div class="header-flex">
        <div>
            <h2 style="margin:0;">AM Reassignment Tool <span style="font-size: 12px; color: #666;">v104.86</span></h2>
            <div id="sync-status" style="font-size: 11px; color: var(--accent-green);">Ready</div>
        </div>
        <div style="text-align: right;">
            <button onclick="fetchData()" class="btn-secondary">↻ Full Re-Sync</button>
            <div style="color: #9da5b4; font-size: 13px; margin-top:5px;">Total Records: <span id="feed-count" style="color:white; font-weight:bold;">0</span></div>
        </div>
    </div>

    <div class="reassign-bar">
        <div class="form-group">
            <label>Dataset</label>
            <select id="datasetFilter" onchange="fetchData()"></select>
        </div>
        <div class="form-group">
            <label>Action Filter</label>
            <select id="actionFilter" onchange="processLocalMetrics()"></select>
        </div>
        <div class="form-group" style="max-width:200px;">
            <label>Filter Scope</label>
            <div class="toggle-group">
                <button class="toggle-btn active" id="scopeUnsent" onclick="setScope('unsent')">UNSENT</button>
                <button class="toggle-btn" id="scopeAll" onclick="setScope('all')">TOTAL</button>
            </div>
        </div>
        <div class="form-group">
            <label>Source (Move From)</label>
            <input type="text" id="sourceRepDisplay" readonly placeholder="Select Rep Below">
            <input type="hidden" id="sourceRep">
        </div>
        <div class="form-group">
            <label>Target (Move To)</label>
            <input type="text" id="targetRepDisplay" readonly placeholder="Select Rep Below">
            <input type="hidden" id="targetRep">
        </div>
        <div class="form-group" style="max-width:80px;">
            <label>Qty</label>
            <input type="number" id="count" min="1" value="1">
        </div>
        <button id="submitBtn" class="btn-main" onclick="executeNativeTransfer()" disabled>Transfer Accounts</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
        <div>
            <label id="sourceLabel" style="margin-bottom: 10px; display:block; font-weight: bold;">Reps with targetable work</label>
            <input type="text" id="searchLeft" placeholder="Search Source..." onkeyup="render()" style="margin-bottom:10px;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-name" onclick="setSort('left', 'name')">Rep Name</th>
                            <th class="col-num" onclick="setSort('left', 'total')">Total</th>
                            <th class="col-num" onclick="setSort('left', 'rem')">Mined Unsent</th>
                        </tr>
                    </thead>
                    <tbody id="sourceBody"></tbody>
                </table>
            </div>
        </div>

        <div>
            <label style="margin-bottom: 10px; display:block; font-weight: bold;">Potential Recipients</label>
            <input type="text" id="searchRight" placeholder="Search Target..." onkeyup="render()" style="margin-bottom:10px;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th class="col-name" onclick="setSort('right', 'name')">Rep Name</th>
                            <th class="col-num" onclick="setSort('right', 'total')">Total</th>
                            <th class="col-num" onclick="setSort('right', 'rem')">Mined Unsent</th>
                        </tr>
                    </thead>
                    <tbody id="targetBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const DATAVERSE_URL = "https://org23279050.crm.dynamics.com/api/data/v9.2";
    const DATAVERSE_SCOPE = "https://org23279050.crm.dynamics.com/.default";
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" }, cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    
    const configs = {
        'AM': { table: 'cr714_accountmanagementdatasets', repCol: 'cr714_rep', noteCol: 'cr714_accountmanagementnotes', idCol: 'cr714_accountmanagementdatasetid' },
        'Cadence': { table: 'cr714_cadencedatasets', repCol: 'cr714_retentionrep', noteCol: 'cr714_qbnotes', idCol: 'cr714_cadencedatasetid' },
        'Prospecting': { table: 'cr714_prospectingdatasets', repCol: 'cr714_repassigned', noteCol: 'cr714_prospectingnotes', idCol: 'cr714_prospectingdatasetid' },
        'Louise Brown': { table: 'cr714_louisebrowndatasets', repCol: 'cr714_assignedrep', noteCol: 'cr714_notesfr', idCol: 'cr714_louisebrowndatasetid' }
    };

    let allData = []; 
    let currentMetrics = {}; 
    let currentScope = 'unsent';
    let sortConfig = { left: { col: 'rem', dir: 'desc' }, right: { col: 'name', dir: 'asc' } };

    async function initAuth() {
        document.getElementById('login-container').style.display = 'flex';
        try {
            await msalInstance.handleRedirectPromise();
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) completeLogin();
            else {
                try { await msalInstance.ssoSilent({ scopes: [DATAVERSE_SCOPE] }); completeLogin(); }
                catch (e) {
                    document.getElementById('auth-status').style.display = 'none';
                    document.getElementById('auth-text').innerText = "Sign In Required";
                    document.getElementById('manual-login-btn').style.display = 'block';
                }
            }
        } catch (e) { console.error(e); }
    }

    async function manualLogin() { await msalInstance.loginPopup({ scopes: [DATAVERSE_SCOPE] }); completeLogin(); }
    
    function completeLogin() { 
        document.getElementById('login-container').style.display = 'none'; 
        document.getElementById('main-app').style.display = 'block'; 
        const dsFilter = document.getElementById('datasetFilter');
        if (dsFilter.options.length === 0) {
            Object.keys(configs).forEach(k => dsFilter.add(new Option(k, k)));
        }
        fetchData(); 
    }

    async function getToken() {
        const accounts = msalInstance.getAllAccounts();
        const request = { scopes: [DATAVERSE_SCOPE], account: accounts[0] };
        return (await msalInstance.acquireTokenSilent(request)).accessToken;
    }

    // --- PAGINATED FETCH ---
    async function fetchData() {
        const dsKey = document.getElementById('datasetFilter').value;
        const config = configs[dsKey];
        const statusDisplay = document.getElementById('sync-status');
        const feedDisplay = document.getElementById('feed-count');
        
        allData = []; 
        statusDisplay.innerText = "Initializing Stream...";
        statusDisplay.style.color = "var(--accent-blue)";
        
        try {
            const token = await getToken();
            const select = `cr714_accountnum,${config.repCol},cr714_action,${config.noteCol},${config.idCol}`;
            let url = `${DATAVERSE_URL}/${config.table}?$select=${select}&$filter=statecode eq 0`;
            
            while (url) {
                const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}`, 'Prefer': 'odata.maxpagesize=5000' }});
                const d = await response.json();
                allData = allData.concat(d.value);
                
                feedDisplay.innerText = allData.length.toLocaleString();
                statusDisplay.innerText = `Fetching... (${allData.length.toLocaleString()})`;
                
                url = d['@odata.nextLink'] || null; // Follow the pagination link if it exists
            }
            
            statusDisplay.innerText = "Sync Complete";
            statusDisplay.style.color = "var(--accent-green)";
            
            // Populate Action Filter
            const filter = document.getElementById('actionFilter');
            const actions = [...new Set(allData.map(r => r.cr714_action).filter(Boolean))].sort();
            filter.innerHTML = '<option value="ALL">-- ALL ACTIONS --</option>';
            actions.forEach(a => filter.add(new Option(a, a)));
            
            processLocalMetrics();
        } catch (e) {
            statusDisplay.innerText = "Sync Failed";
            statusDisplay.style.color = "var(--accent-red)";
            console.error(e);
        }
    }

    function isUnsent(record, targetAction) {
        const dsKey = document.getElementById('datasetFilter').value;
        const noteText = record[configs[dsKey].noteCol] || "";
        if (!noteText) return true;
        // Looking for the Manager App note standard
        const searchPattern = `[Email Sent] [Action: ${targetAction}`;
        return !noteText.includes(searchPattern);
    }

    function processLocalMetrics() {
        const selAction = document.getElementById('actionFilter').value;
        currentMetrics = {};

        allData.forEach(r => {
            const dsKey = document.getElementById('datasetFilter').value;
            const rep = (r[configs[dsKey].repCol] || "Unassigned").trim();
            const action = r.cr714_action || "None";
            
            if (selAction === "ALL" || action === selAction) {
                if (!currentMetrics[rep]) currentMetrics[rep] = { total: 0, unsentCount: 0, records: [] };
                const unsent = isUnsent(r, action);
                currentMetrics[rep].total++;
                if (unsent) currentMetrics[rep].unsentCount++;
                currentMetrics[rep].records.push({ ...r, _isUnsent: unsent });
            }
        });

        Object.keys(currentMetrics).forEach(k => {
            currentMetrics[k].rem = (currentScope === 'unsent') ? currentMetrics[k].unsentCount : currentMetrics[k].total;
        });

        render();
    }

    function setScope(scope) {
        currentScope = scope;
        document.getElementById('scopeUnsent').classList.toggle('active', scope === 'unsent');
        document.getElementById('scopeAll').classList.toggle('active', scope === 'all');
        processLocalMetrics();
    }

    function setSort(side, col) {
        if (sortConfig[side].col === col) sortConfig[side].dir = sortConfig[side].dir === 'asc' ? 'desc' : 'asc';
        else { sortConfig[side].col = col; sortConfig[side].dir = 'desc'; }
        render();
    }

    function render() {
        const sBody = document.getElementById('sourceBody'); const tBody = document.getElementById('targetBody');
        const sSearch = document.getElementById('searchLeft').value.toLowerCase();
        const tSearch = document.getElementById('searchRight').value.toLowerCase();
        sBody.innerHTML = ''; tBody.innerHTML = '';

        const sorter = (side) => (a, b) => {
            const config = sortConfig[side];
            let valA = (config.col === 'name') ? a : (currentMetrics[a] ? currentMetrics[a][config.col] : 0);
            let valB = (config.col === 'name') ? b : (currentMetrics[b] ? currentMetrics[b][config.col] : 0);
            if (config.dir === 'asc') return isNaN(valA) ? (valA || "").localeCompare(valB || "") : (valA - valB);
            return isNaN(valA) ? (valB || "").localeCompare(valA || "") : (valB - valA);
        };

        const reps = Object.keys(currentMetrics);
        reps.filter(k => k.toLowerCase().includes(sSearch) && currentMetrics[k].rem > 0)
            .sort(sorter('left')).forEach(r => {
                const tr = document.createElement('tr');
                if (document.getElementById('sourceRep').value === r) tr.classList.add('selected-source');
                const m = currentMetrics[r];
                tr.innerHTML = `<td class="td-name">${r}</td><td class="td-num">${m.total}</td><td class="td-num"><span class="badge" style="background:var(--accent-red)">${m.rem}</span></td>`;
                tr.onclick = () => { document.getElementById('sourceRep').value = r; document.getElementById('sourceRepDisplay').value = r; render(); };
                sBody.appendChild(tr);
            });

        reps.filter(n => n.toLowerCase().includes(tSearch))
            .sort(sorter('right')).forEach(n => {
                const tr = document.createElement('tr');
                if (document.getElementById('targetRep').value === n) tr.classList.add('selected-target');
                const m = currentMetrics[n];
                tr.innerHTML = `<td class="td-name">${n}</td><td class="td-num">${m.total}</td><td class="td-num"><span class="badge" style="background:var(--accent-green)">${m.unsentCount}</span></td>`;
                tr.onclick = () => { document.getElementById('targetRep').value = n; document.getElementById('targetRepDisplay').value = n; render(); };
                tBody.appendChild(tr);
            });
        validate();
    }

    function validate() { 
        const s = document.getElementById('sourceRep').value, t = document.getElementById('targetRep').value, action = document.getElementById('actionFilter').value;
        document.getElementById('submitBtn').disabled = !(s && t && s !== t && action !== "ALL"); 
    }

    async function executeNativeTransfer() {
        const btn = document.getElementById('submitBtn');
        const source = document.getElementById('sourceRep').value;
        const target = document.getElementById('targetRep').value;
        const qty = parseInt(document.getElementById('count').value);
        const dsKey = document.getElementById('datasetFilter').value;
        const config = configs[dsKey];

        let candidates = currentMetrics[source].records;
        if (currentScope === 'unsent') candidates = candidates.filter(r => r._isUnsent);
        const toMove = candidates.slice(0, qty);

        if (!toMove.length || !confirm(`Confirm direct reassignment of ${toMove.length} records to ${target}?`)) return;

        btn.disabled = true;
        try {
            const token = await getToken();
            for (let i = 0; i < toMove.length; i++) {
                btn.innerText = `Updating ${i+1}/${toMove.length}...`;
                await fetch(`${DATAVERSE_URL}/${config.table}(${toMove[i][config.idCol]})`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [config.repCol]: target })
                });
            }
            alert("Transfer Complete!");
            document.getElementById('sourceRep').value = "";
            document.getElementById('sourceRepDisplay').value = "";
            fetchData();
        } catch (e) { alert("Patch Error: " + e.message); }
        finally { btn.innerText = "Transfer Accounts"; validate(); }
    }
</script>
</body>
</html>
