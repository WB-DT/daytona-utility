<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Reassignment Tool - v104.93</title>
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script>
    const DATAVERSE_URL = "https://org23279050.crm.dynamics.com/api/data/v9.2";
    const DATAVERSE_SCOPE = "https://org23279050.crm.dynamics.com/.default";
    const msalConfig = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401", redirectUri: "https://WB-DT.github.io/daytona-utility/" }, cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true } };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    
    const configs = {
        'AM': { table: 'cr714_accountmanagementdatasets', repCol: 'cr714_rep', noteCol: 'cr714_accountmanagementnotes', idCol: 'cr714_accountmanagementdatasetid' },
        'Cadence': { table: 'cr714_cadencedatasets', repCol: 'cr714_retentionrep', noteCol: 'cr714_qbnotes', idCol: 'cr714_cadencedatasetid' },
        'Prospecting': { table: 'cr714_prospectingdatasets', repCol: 'cr714_repassigned', noteCol: 'cr714_prospectingnotes', idCol: 'cr714_prospectingdatasetid' },
        'Louise Brown': { table: 'cr714_louisebrowndatasets', repCol: 'cr714_assignedrep', noteCol: 'cr714_notesfr', idCol: 'cr714_louisebrowndatasetid' }
    };

    let allData = []; 
    let hrData = {}; 
    let currentMetrics = {}; 
    let currentScope = 'unsent';
    let sortConfig = { left: { col: 'name', dir: 'asc' }, right: { col: 'name', dir: 'asc' } };
    let lastRefreshTime = new Date();

    async function initAuth() {
        document.getElementById('login-container').style.display = 'flex';
        try {
            await msalInstance.handleRedirectPromise();
            const accounts = msalInstance.getAllAccounts();
            if (accounts.length > 0) completeLogin();
            else {
                try { await msalInstance.ssoSilent({ scopes: [DATAVERSE_SCOPE] }); completeLogin(); }
                catch (e) {
                    document.querySelector('.loader').style.display = 'none';
                    document.getElementById('auth-text').innerText = "Session Error";
                    document.getElementById('manual-login-btn').style.display = 'block';
                }
            }
        } catch (e) { console.error(e); }
    }

    function completeLogin() { 
        document.getElementById('login-container').style.display = 'none'; 
        document.getElementById('main-app').style.display = 'block'; 
        const dsFilter = document.getElementById('datasetFilter');
        if (dsFilter.options.length === 0) Object.keys(configs).forEach(k => dsFilter.add(new Option(k, k)));
        fetchData(); 
        setInterval(() => fetchData(true), 300000); 
        setInterval(() => {
            const diff = Math.floor((new Date() - lastRefreshTime) / 60000);
            document.getElementById('last-refresh').innerText = `Updated: ${diff}m ago`;
        }, 30000);
    }

    async function getToken() {
        const accounts = msalInstance.getAllAccounts();
        const request = { scopes: [DATAVERSE_SCOPE], account: accounts[0] };
        return (await msalInstance.acquireTokenSilent(request)).accessToken;
    }

    async function fetchData(silent = false) {
        if (silent && (document.activeElement.id === 'sourceRepDisplay' || document.activeElement.id === 'targetRepDisplay')) return;
        const dsKey = document.getElementById('datasetFilter').value;
        const config = configs[dsKey];
        if (!silent) document.getElementById('sync-status').innerText = "Streaming Data...";
        
        try {
            const token = await getToken();
            const hrUrl = `${DATAVERSE_URL}/cr714_employeeinformation1s?$select=cr714_employeename,cr714_managerassigned,cr714_department,cr714_supervisors`;
            const hrResponse = await fetch(hrUrl, { headers: { 'Authorization': `Bearer ${token}`, 'Prefer': 'odata.include-annotations="OData.Community.Display.V1.FormattedValue"' }});
            const hrJson = await hrResponse.json();
            
            hrData = {}; 
            hrJson.value.forEach(e => {
                const deptLabel = e['cr714_department@OData.Community.Display.V1.FormattedValue'] || e.cr714_department || 'Unassigned';
                hrData[e.cr714_employeename] = { 
                    cr714_managerassigned: e.cr714_managerassigned || 'Unknown', 
                    cr714_department: deptLabel,
                    cr714_supervisors: e.cr714_supervisors || 'None'
                };
            });

            populateFilterValues();

            const select = `cr714_accountnum,${config.repCol},cr714_action,${config.noteCol},${config.idCol}`;
            let url = `${DATAVERSE_URL}/${config.table}?$select=${select}&$filter=statecode eq 0`;
            let fresh = [];
            while (url) {
                const response = await fetch(url, { headers: { 'Authorization': `Bearer ${token}`, 'Prefer': 'odata.maxpagesize=5000' }});
                const d = await response.json();
                fresh = fresh.concat(d.value);
                url = d['@odata.nextLink'] || null;
            }
            allData = fresh;
            lastRefreshTime = new Date();
            document.getElementById('feed-count').innerText = allData.length.toLocaleString();
            document.getElementById('sync-status').innerText = "Direct Stream Active";
            
            const filter = document.getElementById('actionFilter');
            const prevAction = filter.value;
            const actions = [...new Set(allData.map(r => r.cr714_action).filter(Boolean))].sort();
            filter.innerHTML = '<option value="ALL">-- ALL ACTIONS --</option>';
            actions.forEach(a => filter.add(new Option(a, a)));
            if (prevAction) filter.value = prevAction;

            processLocalMetrics();
        } catch (e) { console.error(e); }
    }

    function populateFilterValues() {
        const level = document.getElementById('filterLevel').value;
        const valueDropdown = document.getElementById('filterValue');
        const currentSelection = valueDropdown.value;
        const uniqueValues = new Set();
        Object.values(hrData).forEach(emp => {
            if (emp[level] && emp[level] !== 'Unknown' && emp[level] !== 'None') uniqueValues.add(emp[level]);
        });
        valueDropdown.innerHTML = '<option value="ALL">-- SHOW ALL --</option>';
        Array.from(uniqueValues).sort().forEach(val => valueDropdown.add(new Option(val, val)));
        valueDropdown.value = currentSelection || "ALL";
        if (valueDropdown.selectedIndex === -1) valueDropdown.value = "ALL";
    }

    function isUnsent(record, targetAction) {
        const dsKey = document.getElementById('datasetFilter').value;
        const noteText = record[configs[dsKey].noteCol] || "";
        return !noteText.includes(`[Email Sent] [Action: ${targetAction}`);
    }

    function processLocalMetrics() {
        const selAction = document.getElementById('actionFilter').value;
        const filterLevel = document.getElementById('filterLevel').value;
        const filterVal = document.getElementById('filterValue').value;
        const dsKey = document.getElementById('datasetFilter').value;
        const repCol = configs[dsKey].repCol;
        
        currentMetrics = {};

        // Seed list (Support 0 records)
        Object.keys(hrData).forEach(repName => {
            const repHR = hrData[repName];
            if (filterVal === "ALL" || repHR[filterLevel] === filterVal) {
                currentMetrics[repName] = { total: 0, unsentCount: 0, records: [], manager: repHR.cr714_managerassigned };
            }
        });

        // Fill with actual data
        allData.forEach(r => {
            const rep = (r[repCol] || "Unassigned").trim();
            const action = r.cr714_action || "None";
            if ((selAction === "ALL" || action === selAction) && currentMetrics[rep]) {
                const unsent = isUnsent(r, action);
                currentMetrics[rep].total++;
                if (unsent) currentMetrics[rep].unsentCount++;
                currentMetrics[rep].records.push({ ...r, _isUnsent: unsent });
            }
        });

        Object.keys(currentMetrics).forEach(k => currentMetrics[k].rem = (currentScope === 'unsent') ? currentMetrics[k].unsentCount : currentMetrics[k].total);
        render(); 
        updateDashboard();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
        document.getElementById('view-' + tab).classList.add('active');
        const isInsights = tab === 'insights';
        document.getElementById('action-inputs').style.display = isInsights ? 'none' : 'flex';
        document.getElementById('scopeContainer').style.visibility = isInsights ? 'hidden' : 'visible';
    }

    function updateDashboard() {
        const body = document.getElementById('dashBody'); body.innerHTML = '';
        let gT = 0, gU = 0;
        Object.keys(currentMetrics).sort().forEach(rep => {
            const m = currentMetrics[rep]; const sent = m.total - m.unsentCount;
            const pct = m.total > 0 ? Math.round((sent / m.total) * 100) : 0;
            gT += m.total; gU += m.unsentCount;
            body.innerHTML += `<tr><td style="font-weight:bold;">${rep}</td><td style="color:#8b949e;">${m.manager}</td><td class="td-num">${m.total}</td><td class="td-num text-green-500">${sent}</td><td class="td-num text-red-500">${m.unsentCount}</td><td><div style="font-size:10px; display:flex; justify-content:space-between;"><span>${pct}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div></td></tr>`;
        });
        const gSent = gT - gU; const gPct = gT > 0 ? Math.round((gSent / gT) * 100) : 0;
        document.getElementById('dashTotal').innerText = gT.toLocaleString();
        document.getElementById('dashSent').innerText = gSent.toLocaleString();
        document.getElementById('dashRem').innerText = gU.toLocaleString();
        document.getElementById('dashPct').innerText = gPct + "%";
        document.getElementById('dashBar').style.width = gPct + "%";
    }

    function setScope(scope) { currentScope = scope; document.getElementById('scopeUnsent').classList.toggle('active', scope === 'unsent'); document.getElementById('scopeAll').classList.toggle('active', scope === 'all'); processLocalMetrics(); }
    
    function setSort(side, col) { 
        sortConfig[side].dir = (sortConfig[side].col === col && sortConfig[side].dir === 'asc') ? 'desc' : 'asc'; 
        sortConfig[side].col = col; 
        render(); 
    }

    function render() {
        const sBody = document.getElementById('sourceBody'); const tBody = document.getElementById('targetBody');
        const sSearch = document.getElementById('sourceRepDisplay').value.toLowerCase();
        const tSearch = document.getElementById('targetRepDisplay').value.toLowerCase();
        sBody.innerHTML = ''; tBody.innerHTML = '';
        const sorter = (side) => (a, b) => {
            const config = sortConfig[side];
            let valA = (config.col === 'name') ? a : (currentMetrics[a] ? currentMetrics[a][config.col] : 0);
            let valB = (config.col === 'name') ? b : (currentMetrics[b] ? currentMetrics[b][config.col] : 0);
            return config.dir === 'asc' ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
        };
        const reps = Object.keys(currentMetrics);
        reps.filter(k => k.toLowerCase().includes(sSearch)).sort(sorter('left')).forEach(r => {
            const tr = document.createElement('tr'); 
            if (document.getElementById('sourceRepDisplay').value === r) tr.classList.add('selected-source');
            const badgeColor = currentMetrics[r].rem > 0 ? 'var(--accent-red)' : '#484f58';
            tr.innerHTML = `<td>${r}</td><td class="td-num">${currentMetrics[r].total}</td><td class="td-num"><span class="badge" style="background:${badgeColor}">${currentMetrics[r].rem}</span></td>`;
            tr.onclick = () => { document.getElementById('sourceRepDisplay').value = r; validate(); render(); };
            sBody.appendChild(tr);
        });
        reps.filter(n => n.toLowerCase().includes(tSearch)).sort(sorter('right')).forEach(n => {
            const tr = document.createElement('tr'); 
            if (document.getElementById('targetRepDisplay').value === n) tr.classList.add('selected-target');
            const badgeColor = currentMetrics[n].rem > 0 ? 'var(--accent-green)' : '#484f58';
            tr.innerHTML = `<td>${n}</td><td class="td-num">${currentMetrics[n].total}</td><td class="td-num"><span class="badge" style="background:${badgeColor}">${currentMetrics[n].rem}</span></td>`;
            tr.onclick = () => { document.getElementById('targetRepDisplay').value = n; validate(); render(); };
            tBody.appendChild(tr);
        });
        validate();
    }

    function validate() { 
        const s = document.getElementById('sourceRepDisplay').value.trim();
        const t = document.getElementById('targetRepDisplay').value.trim();
        document.getElementById('submitBtn').disabled = !(s && t && s !== t && document.getElementById('actionFilter').value !== "ALL"); 
    }

    async function executeNativeTransfer() {
        const btn = document.getElementById('submitBtn');
        const sourceName = document.getElementById('sourceRepDisplay').value.trim();
        const targetName = document.getElementById('targetRepDisplay').value.trim();
        const qty = parseInt(document.getElementById('count').value);
        const dsKey = document.getElementById('datasetFilter').value;
        const config = configs[dsKey];
        let candidates = (currentMetrics[sourceName] && currentMetrics[sourceName].records) ? currentMetrics[sourceName].records : [];
        if (currentScope === 'unsent') candidates = candidates.filter(r => r._isUnsent);
        const toMove = candidates.slice(0, qty);
        if (!toMove.length || !confirm(`Move ${toMove.length} accounts to ${targetName}?`)) return;
        btn.disabled = true;
        try {
            const token = await getToken();
            for (let i = 0; i < toMove.length; i++) {
                btn.innerText = `PATCHING ${i+1}/${toMove.length}...`;
                const res = await fetch(`${DATAVERSE_URL}/${config.table}(${toMove[i][config.idCol]})`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ [config.repCol]: targetName })});
                if (res.ok) { const idx = allData.findIndex(item => item[config.idCol] === toMove[i][config.idCol]); if (idx !== -1) allData[idx][config.repCol] = targetName; }
            }
            processLocalMetrics();
        } catch (e) { alert(e.message); }
        finally { btn.innerText = "EXECUTE TRANSFER"; validate(); }
    }
</script>
</body>
</html>
