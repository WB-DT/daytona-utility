<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiLeap v39.0 | Bulletproof Command</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://alcdn.msauth.net/browser/2.14.2/js/msal-browser.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --bg-deep: #0f172a; --bg-surface: #1e293b; --bg-card: #334155; 
            --brand: #2dd4bf; --text-main: #f1f5f9; --text-dim: #94a3b8; 
            --text-accent: #fbbf24; --border: #334155; --danger: #ef4444; 
            --success: #10b981; --base-font: 13px;
        }
        [data-theme='light'] { 
            --bg-deep: #f8fafc; --bg-surface: #ffffff; --bg-card: #f1f5f9; 
            --brand: #0d9488; --text-main: #0f172a; --text-dim: #475569; 
            --text-accent: #b45309; --border: #e2e8f0; --danger: #dc2626; --success: #059669; 
        }
        
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; font-size: var(--base-font); height: 100vh; overflow: hidden; margin: 0; transition: all 0.2s; }
        
        /* --- LOADING ANIMATION --- */
        #loading-screen { position: fixed; inset: 0; background: var(--bg-deep); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .anim-stage { width: 320px; height: 140px; border-bottom: 4px solid var(--border); position: relative; overflow: hidden; background: linear-gradient(to top, rgba(255,255,255,0.02), transparent); }
        .truck-group { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 20; animation: bounce 0.3s infinite alternate; }
        .frog-icon { font-size: 36px; color: var(--brand); position: absolute; top: -30px; left: 25px; animation: leap 1.8s infinite ease-in-out; filter: drop-shadow(0 4px 0 rgba(0,0,0,0.3)); }
        .truck-icon { font-size: 72px; color: var(--text-main); filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
        .traffic { position: absolute; bottom: 15px; font-size: 24px; opacity: 0.4; animation: drive 2.5s linear infinite; }
        .t1 { right: -60px; color: var(--danger); animation-delay: 0s; }
        .t2 { right: -60px; color: var(--text-accent); animation-delay: 1.2s; }
        @keyframes bounce { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-2px); } }
        @keyframes leap { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(-10deg); } }
        @keyframes drive { from { transform: translateX(400px); } to { transform: translateX(-400px); } }

        /* --- THEME: RACING BORDERS --- */
        .racing-border { position: relative; padding: 2px; border-radius: 8px; overflow: hidden; background: var(--bg-card); display: flex; }
        .racing-border::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent, var(--brand), transparent 30%); animation: rotate 4s linear infinite; z-index: 0; }
        .racing-inner { position: relative; z-index: 1; background: var(--bg-deep); width: 100%; border-radius: 6px; }
        .racing-inner select, .racing-inner textarea, .racing-inner input { border: none !important; background: transparent !important; width: 100%; outline: none; box-shadow: none; }
        @keyframes rotate { 100% { transform: rotate(1turn); } }

        /* --- LAYOUT --- */
        #main-layout { display: flex; height: calc(100vh - 110px); width: 100%; overflow: hidden; }
        aside#gallery-pane { width: 340px; min-width: 340px; border-right: 1px solid var(--border); background: var(--bg-surface); display: flex; flex-direction: column; z-index: 20; }
        main#workspace { flex: 1; background: var(--bg-deep); position: relative; display: flex; flex-direction: column; overflow: hidden; }

        /* --- COMPONENTS --- */
        .filter-ribbon { display: flex; align-items: center; gap: 10px; padding: 10px 24px; background: var(--bg-deep); border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; }
        .search-wrap { position: relative; width: 260px; }
        .search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; z-index: 10; }
        .search-wrap input { padding-left: 34px !important; }

        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85em; }
        .data-table th { background: var(--bg-surface); position: sticky; top: 0; z-index: 20; padding: 12px; text-align: left; border-bottom: 2px solid var(--border); cursor: pointer; text-transform: uppercase; font-size: 10px; font-weight: 800; color: var(--text-dim); }
        .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .data-table tr:hover td { background: var(--bg-card); cursor: pointer; }

        .rep-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: transform 0.2s; cursor: pointer; }
        .rep-card:hover { border-color: var(--brand); transform: translateY(-3px); box-shadow: 0 10px 20px -10px rgba(0,0,0,0.5); }
        .prog-bg { height: 6px; background: var(--bg-deep); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .prog-fill { height: 100%; transition: width 1s ease; }

        .input-dark { background: var(--bg-deep); border: 1px solid var(--border); color: var(--text-main); padding: 0.5rem; border-radius: 6px; outline: none; font-size: 11px; width: 100%; transition: border-color 0.2s; }
        .input-dark:focus { border-color: var(--brand); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; padding: 8px 12px; border-radius: 8px; font-size: 9px; font-weight: 900; color: var(--text-dim); transition: 0.2s; border: 1px solid transparent; }
        .nav-btn.active { color: var(--brand); background: rgba(45, 212, 191, 0.1); border-color: var(--brand); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; }
        .modal-container { background: var(--bg-surface); border: 1px solid var(--border); width: 100%; max-width: 650px; border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .outlook-editor { min-height: 250px; background: var(--bg-card); padding: 1rem; border-radius: 8px; outline: none; border: 1px solid var(--border); color: var(--text-main); font-family: 'Segoe UI', sans-serif; line-height: 1.5; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .dup-alert { animation: pulse-red 1.5s infinite; font-weight: 900; color: var(--danger); }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .form-compact { font-size: 11px; gap: 1rem !important; }
        .form-compact input, .form-compact select { height: 30px !important; }
    </style>
</head>
<body data-theme="midnight">

    <div id="loading-screen">
        <div class="anim-stage">
            <i class="fa-solid fa-car traffic t1"></i>
            <i class="fa-solid fa-truck-pickup traffic t2"></i>

    </div>

            </div>

    </div>

        <div class="flex items-center gap-4">
            <i class="fa-solid fa-frog text-2xl text-[var(--brand)]"></i>
            <h1 class="font-black uppercase tracking-tighter text-xl text-[var(--brand)]">LOGILEAP <span class="text-[10px] opacity-40">v39</span></h1>
        </div>
        <nav class="flex gap-1">
            <button onclick="switchView('assign')" id="nav-assign" class="nav-btn active"><i class="fas fa-tasks mb-1"></i>ASSIGN</button>
            <button onclick="switchView('list')" id="nav-list" class="nav-btn"><i class="fas fa-table mb-1"></i>LIST</button>
            <button onclick="switchView('kanban')" id="nav-kanban" class="nav-btn"><i class="fas fa-columns mb-1"></i>BOARD</button>
            <button onclick="switchView('scorecard')" id="nav-scorecard" class="nav-btn"><i class="fas fa-chart-line mb-1"></i>STATS</button>
            <button onclick="switchView('map')" id="nav-map" class="nav-btn"><i class="fas fa-map-marked-alt mb-1"></i>MAP</button>

        <div class="flex items-center gap-4">

            <div id="user-display" class="text-right border-l border-[var(--border)] pl-4">

                <div class="text-[8px] text-[var(--brand)] font-bold tracking-widest uppercase">Connected</div>
            </div>

    <div class="filter-ribbon">
        <div class="search-wrap">
            <i class="fas fa-search"></i>

        </div>
        <select id="f-wh" onchange="applyFilters()" class="input-dark w-32 font-bold uppercase"><option value="">Hubs</option></select>
        <select id="f-status" onchange="applyFilters()" class="input-dark w-32 font-bold uppercase"><option value="">Status</option></select>
        <input type="text" id="f-date" class="input-dark w-40 text-center cursor-pointer" placeholder="Date Range">
        <button onclick="clearFilters()" class="h-9 px-4 border border-[var(--danger)] text-[var(--danger)] rounded text-[9px] font-black uppercase hover:bg-[var(--danger)] hover:text-white transition">Clear</button>
        <button onclick="exportExcel()" class="h-9 px-4 bg-[var(--success)] text-white rounded text-[9px] font-black uppercase shadow-sm ml-auto"><i class="fas fa-file-excel mr-1"></i>Export</button>

    <div id="main-layout">
        <aside id="gallery-pane">
            <div class="p-3 border-b border-[var(--border)] bg-black/10 flex justify-between items-center">
                <span class="text-[9px] font-black uppercase text-[var(--text-dim)]">Results</span>
                <span id="active-count" class="text-xs font-black text-[var(--brand)]">0</span>
            </div>
            <div id="ticket-list" class="flex-grow overflow-y-auto p-2 space-y-2"></div>
        </aside>

        <main id="workspace">
            <div id="view-list" class="hidden h-full"></div>
            <div id="view-assign" class="hidden h-full"></div>
            <div id="view-kanban" class="hidden h-full"></div>
            <div id="view-map" class="hidden h-full bg-slate-900"><div id="map-container" class="h-full w-full"></div></div>
            
            <div id="view-scorecard" class="hidden h-full p-8 overflow-y-auto">
                <div class="grid grid-cols-4 gap-4 mb-8">
                    <div onclick="drillDown('all')" class="p-6 bg-[var(--bg-surface)] rounded-xl border border-[var(--border)] cursor-pointer hover:border-[var(--brand)]"><div class="text-[10px] font-black uppercase opacity-40">Volume</div><div id="sc-total" class="text-4xl font-black mt-1">0</div></div>
                    <div onclick="drillDown('urgent')" class="p-6 bg-[var(--bg-surface)] rounded-xl border border-[var(--border)] cursor-pointer hover:border-[var(--danger)]"><div class="text-[10px] font-black uppercase opacity-40 text-[var(--danger)]">Urgent</div><div id="sc-urgent" class="text-4xl font-black mt-1 text-[var(--danger)]">0</div></div>
                    <div onclick="drillDown('pending')" class="p-6 bg-[var(--bg-surface)] rounded-xl border border-[var(--border)] cursor-pointer hover:border-[var(--text-accent)]"><div class="text-[10px] font-black uppercase opacity-40 text-[var(--text-accent)]">Open</div><div id="sc-active" class="text-4xl font-black mt-1 text-[var(--text-accent)]">0</div></div>
                    <div class="p-6 bg-[var(--bg-surface)] rounded-xl border border-[var(--border)]"><div class="text-[10px] font-black uppercase opacity-40 text-[var(--success)]">Rate</div><div id="sc-rate" class="text-4xl font-black mt-1 text-[var(--success)]">0%</div></div>
                </div>
                <h3 class="text-xs font-black uppercase text-[var(--text-dim)] mb-4 tracking-widest">Representative Scorecards (Click to Filter)</h3>
                <div id="rep-stats-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 pb-20"></div>
            </div>

            <div id="detail-overlay" class="absolute inset-0 bg-[var(--bg-surface)] z-40 hidden flex flex-col">
                <div class="p-4 border-b border-[var(--border)] flex justify-between items-center bg-[var(--bg-surface)] sticky top-0 shadow-lg">
                    <div class="flex gap-4 items-center">
                        <button onclick="closeDetail()" class="text-[var(--text-dim)] hover:text-white font-black text-[10px] uppercase flex items-center gap-2"><i class="fas fa-times mr-2"></i>Close</button>
                        <div class="flex bg-black/20 rounded p-1 border border-[var(--border)]">
                            <button onclick="setFormLayout('default')" id="lay-default" class="px-3 py-1 text-[8px] font-black uppercase rounded bg-[var(--brand)] text-black">Standard</button>
                            <button onclick="setFormLayout('grid')" id="lay-grid" class="px-3 py-1 text-[8px] font-black uppercase rounded hover:text-[var(--brand)]">Grid</button>
                            <button onclick="setFormLayout('compact')" id="lay-compact" class="px-3 py-1 text-[8px] font-black uppercase rounded hover:text-[var(--brand)]">Compact</button>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openEmailModal()" class="px-4 py-2 border border-[var(--brand)] text-[var(--brand)] rounded font-black text-[10px] uppercase hover:bg-[var(--brand)] hover:text-black">Email</button>
                        <button onclick="saveRecord(false)" class="px-4 py-2 bg-[var(--bg-card)] border border-[var(--border)] rounded font-black text-[10px] uppercase">Save</button>
                        <button onclick="saveRecord(true)" class="px-6 py-2 bg-[var(--brand)] text-black rounded font-black text-[10px] uppercase shadow-lg hover:scale-105 transition">Sync & Next</button>
                    </div>
                </div>

                <div id="form-container" class="flex-grow overflow-y-auto p-12 max-w-5xl mx-auto w-full space-y-12">
                    <div class="flex justify-between items-start">
                        <div class="space-y-1">
                            <h2 id="d-company" class="text-4xl font-black uppercase tracking-tighter leading-none select-all text-white"></h2>
                            <div class="flex gap-4 font-mono items-center"><span id="d-so" class="text-[var(--brand)] font-bold text-lg select-all"></span><span id="d-id" class="opacity-30 uppercase font-black tracking-widest text-[10px]"></span></div>
                        </div>
                        <div id="d-status-pill" class="px-6 py-2 rounded-full border-2 text-[10px] font-black uppercase tracking-widest bg-black/10"></div>
                    </div>

                    <div id="form-fields" class="space-y-10">
                        <div class="grid grid-cols-2 gap-10">
                            <div class="space-y-3">
                                <label class="text-[10px] font-black text-[var(--brand)] uppercase tracking-widest block">Assignment</label>
                                <div class="racing-border"><div class="racing-inner"><select id="m-owner" class="input-dark h-12 font-bold text-sm"></select></div></div>
                            </div>
                            <div class="space-y-3">
                                <label class="text-[10px] font-black text-[var(--brand)] uppercase tracking-widest block">Disposition</label>
                                <div class="racing-border"><div class="racing-inner"><select id="m-status" class="input-dark h-12 font-black text-sm text-[var(--brand)]">

                                    <option value="Escalated">Escalated</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Sent Back">Sent Back</option>
                                </select></div></div>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <label class="text-[10px] font-black text-[var(--text-dim)] uppercase tracking-widest block">Audit Trail</label>

                        </div>

                        <div class="grid grid-cols-2 gap-8">
                            <div class="p-6 bg-black/10 border border-[var(--border)] rounded-2xl shadow-inner">
                                <span class="text-[9px] font-black uppercase opacity-40 block mb-4 text-[var(--brand)]">Warehouse Feed</span>
                                <div id="d-whs-logs" class="text-xs opacity-70 italic leading-relaxed"></div>
                            </div>

                                <span class="text-[9px] font-black uppercase opacity-40 block mb-4 text-[var(--text-accent)]">Driver Feed</span>
                                <div id="d-driver-logs" class="text-xs opacity-70 leading-relaxed"></div>
                            </div>
                        </div>

                        <div id="dup-section" class="hidden pt-10 border-t border-[var(--border)]">

                            <div class="bg-black/10 rounded-xl overflow-hidden border border-[var(--border)]">
                                <table class="w-full text-left text-[10px] font-bold">
                                    <thead class="bg-black/20 opacity-50 uppercase"><tr><th class="p-4">Date</th><th>Status</th><th>Owner</th><th class="w-1/2">Snippet</th></tr></thead>
                                    <tbody id="dup-body" class="divide-y divide-[var(--border)]"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script id="worker-script" type="javascript/worker">
        const ZIP_MAP = {'010':[42.2,-72.6],'020':[42.1,-71.2],'070':[40.8,-74.2],'100':[40.7,-74.0],'190':[40.0,-75.3],'300':[33.9,-84.4],'330':[25.8,-80.2],'600':[42.1,-87.9],'900':[34.0,-118.2]};

        self.onmessage = function(e) {
            const { type, payload } = e.data;
            if(type === 'PROCESS') {
                const raw = payload.data.slice(0, 5000) || [];
                const soIndex = {};
                raw.forEach(r => { const so = r.cr714_salesordernumber; if(so) soIndex[so] = (soIndex[so]||0)+1; });

                const db = raw.map(r => ({
                    id: r.cr714_id || Math.random().toString(36).substr(2,6).toUpperCase(),
                    guid: (r.cr714_logisticslog_2id || '').replace(/[{}]/g,''),
                    so: r.cr714_salesordernumber || 'N/A',
                    customer: r.cr714_companyordeliveryname || 'Unk Entity',
                    whs: r.cr714_warehouse || 'N/A',
                    status: r.cr714_disposition || 'Pending',
                    owner: r.cr714_logisticsowner || 'Unassigned',
                    issue: r.cr714_issue || 'Standard',
                    notes: r.cr714_logisticsnotes || '',
                    driver: r.cr714_drivernamenumber || '',
                    whsNotes: r.cr714_receivedemailfromwarehousenotes || '',
                    date: r.createdon ? r.createdon.split('T')[0] : new Date().toISOString().split('T')[0],
                    zip3: (r.cr714_shippingaddress?.match(/\b\d{3}/)||['000'])[0],
                    isDup: r.cr714_salesordernumber && soIndex[r.cr714_salesordernumber] > 1
                }));

                const filters = {
                    whs: [...new Set(db.map(x => x.whs))].sort(),
                    owners: [...new Set(db.map(x => x.owner))].sort(),
                    statuses: [...new Set(db.map(x => x.status))].sort()
                };
                self.postMessage({ type: 'READY', db, filters });
            }

            if(type === 'FILTER') {
                const { db, criteria } = payload;
                const filtered = db.filter(item => {
                    const searchStr = [item.so, item.customer, item.owner, item.whs].join(' ').toLowerCase();
                    const matchesSearch = !criteria.search || searchStr.includes(criteria.search.toLowerCase());
                    const matchesWhs = !criteria.whs || item.whs === criteria.whs;
                    const matchesStatus = !criteria.status || item.status === criteria.status;
                    const matchesUrgent = !criteria.urgent || item.issue.match(/Crit|Urg/i);
                    return matchesSearch && matchesWhs && matchesStatus && matchesUrgent;
                });

                const whStats = {};
                filtered.forEach(item => { whStats[item.whs] = (whStats[item.whs] || 0) + 1; });
                const mapPoints = Object.keys(whStats).map(wh => {
                    const sample = filtered.find(x => x.whs === wh);
                    const coords = ZIP_MAP[sample?.zip3] || [39.8, -98.6];
                    return { wh, count: whStats[wh], lat: coords[0], lng: coords[1] };
                });
                self.postMessage({ type: 'FILTER_RESULT', filtered, whStats, mapPoints });
            }
        };
    </script>

    <script>
        const MSAL_CONFIG = { auth: { clientId: "afe649b6-9c70-4b1a-8592-78588284c8ee", authority: "https://login.microsoftonline.com/9a7c474b-f702-4ae4-a2f9-b72a1e117401" } };
        const HISTORY_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/43ca56b97e134123aceca13f64dc0572/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DBzX1YaJjcrqEu6xxZfh72eF9B7qtsAU1kDOdCzWTG4';
        const SAVE_URL = 'https://e25b831597b0e29e9b9b7f764adfe8.0f.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/23ece406df284beea868b1f389dc6c5f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q9LLMsjYRdrSbw6SGTmVkmXlfMiCWyscnTchK1sFtZY';

        let fullDb = [], filteredDb = [], currentView = 'assign', selectedId = null, filterUrgent = false;
        let mapInstance = null, markerGroup = null, latestMapPoints = [];
        const msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
        const worker = new Worker(URL.createObjectURL(new Blob([document.getElementById('worker-script').textContent], { type: "text/javascript" })));

        document.addEventListener('DOMContentLoaded', () => { initApp(); });

        async function initApp() {
            try {
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) document.getElementById('user-name').innerText = accounts[0].name;
                const res = await fetch(HISTORY_URL, { method: 'POST' });
                const data = await res.json();
                worker.postMessage({ type: 'PROCESS', payload: { data: data.value || [] } });
            } catch(e) { console.error(e); }
        }

        worker.onmessage = (e) => {
            const { type, db, filters, filtered, mapPoints, whStats } = e.data;
            if (type === 'READY') {
                fullDb = db;
                const wh = document.getElementById('f-wh'), st = document.getElementById('f-status'), own = document.getElementById('m-owner');
                filters.whs.forEach(w => wh.add(new Option(w, w)));
                filters.statuses.forEach(s => st.add(new Option(s, s)));
                filters.owners.forEach(o => own.add(new Option(o, o)));
                document.getElementById('loading-screen').style.display = 'none';
                applyFilters();
            }
            if (type === 'FILTER_RESULT') {
                filteredDb = filtered;
                latestMapPoints = mapPoints;
                document.getElementById('active-count').innerText = filtered.length;
                renderGallery();
                renderView();
                updateStats(filtered, whStats);
                if (currentView === 'map' && mapInstance) updateMapMarkers(mapPoints);
            }
        };

        function switchView(v) {
            currentView = v;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-${v}`).classList.add('active');
            document.querySelectorAll('[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${v}`).classList.remove('hidden');
            if (v === 'map') {
                document.getElementById('map-container').style.display = 'block';
                setTimeout(() => { if (!mapInstance) initMap(); mapInstance.invalidateSize(); updateMapMarkers(latestMapPoints); }, 200);
            }
            renderView();
        }

        function renderGallery() {
            document.getElementById('ticket-list').innerHTML = filteredDb.map(item => `
                <div class="p-4 bg-[var(--bg-card)] rounded-xl border border-transparent hover:border-[var(--brand)] cursor-pointer transition ${selectedId === item.id ? 'bg-[var(--brand)] text-black shadow-lg' : ''}" onclick="openDetail('${item.id}')">
                    <div class="flex justify-between text-[8px] font-black opacity-40 uppercase mb-1"><span>#${item.id}</span><span>${item.whs}</span></div>
                    <div class="text-[11px] font-black uppercase truncate ${selectedId === item.id ? 'text-black' : 'text-white'}">${item.customer}</div>
                    <div class="flex justify-between mt-2"><span class="text-[10px] font-mono font-bold ${item.isDup ? 'dup-alert' : (selectedId === item.id ? 'text-black/70' : 'text-[var(--brand)]')}">#${item.so}</span><span class="text-[8px] font-black px-1.5 rounded bg-black/20">${item.status}</span></div>
                </div>
            `).join('');
        }

        function renderView() {
            const container = document.getElementById(`view-${currentView}`);
            if (currentView === 'list' || currentView === 'assign') {
                container.innerHTML = `<div class="table-container"><table class="data-table"><thead><tr><th style="width: 40px"><input type="checkbox"></th><th>Sales Order</th><th>Customer</th><th>Warehouse</th><th>Owner</th><th>Status</th></tr></thead><tbody>${filteredDb.map(item => `<tr onclick="openDetail('${item.id}')"><td><input type="checkbox" onclick="event.stopPropagation()"></td><td class="font-mono text-[var(--brand)] font-bold">#${item.so}</td><td class="font-black uppercase text-[10px]">${item.customer}</td><td>${item.whs}</td><td class="text-xs opacity-60">${item.owner}</td><td class="font-black uppercase text-[9px]">${item.status}</td></tr>`).join('')}</tbody></table></div>`;
            } else if (currentView === 'kanban') {
                const stages = ['Pending', 'Working on', 'Escalated', 'Completed'];
                container.innerHTML = `<div class="kanban-board">${stages.map(stage => `<div class="kanban-col"><div class="p-4 border-b border-[var(--border)] bg-black/10 flex justify-between font-black text-[10px] uppercase"><span>${stage}</span><span class="opacity-40">${filteredDb.filter(x => x.status === stage).length}</span></div><div class="kanban-body">${filteredDb.filter(x => x.status === stage).map(item => `<div class="p-4 bg-[var(--bg-card)] rounded-xl border border-transparent hover:border-[var(--brand)] cursor-pointer" onclick="openDetail('${item.id}')"><div class="text-[9px] font-mono text-[var(--brand)] mb-1">#${item.so}</div><div class="text-[11px] font-black uppercase truncate text-white">${item.customer}</div></div>`).join('')}</div></div>`).join('')}</div>`;
            } else if (currentView === 'scorecard') {
                const reps = [...new Set(filteredDb.map(x => x.owner))];
                document.getElementById('rep-stats-grid').innerHTML = reps.map(rep => {
                    const t = filteredDb.filter(x => x.owner === rep).length;
                    const d = filteredDb.filter(x => x.owner === rep && x.status === 'Completed').length;
                    const p = t > 0 ? Math.round((d / t) * 100) : 0;
                    return `<div class="rep-card hover:border-[var(--brand)] transition cursor-pointer" onclick="drillDownRep('${rep}')"><div class="flex justify-between items-center mb-5"><span class="font-black text-sm uppercase text-white">${rep}</span><span class="text-[10px] font-bold opacity-30">${t} units</span></div><div class="prog-bg"><div class="prog-fill bg-[var(--brand)]" style="width: ${p}%"></div></div></div>`;
                }).join('');
            }
        }

        function openDetail(id) {
            selectedId = id;
            const item = fullDb.find(x => x.id === id);
            document.getElementById('detail-overlay').classList.remove('hidden');
            document.getElementById('d-company').innerText = item.customer;
            document.getElementById('d-so').innerText = `#${item.so}`;
            document.getElementById('d-id').innerText = `ID: ${item.id}`;
            document.getElementById('d-status-pill').innerText = item.status;
            document.getElementById('m-owner').value = item.owner;
            document.getElementById('m-status').value = item.status;
            document.getElementById('m-notes').value = item.notes;
            
            // Fix Null Error: Ensure IDs match container names
            document.getElementById('d-whs-logs').innerText = item.whsNotes || "No internal hub telemetry.";
            document.getElementById('d-driver-logs').innerText = item.driver || "No field logs available.";

            const dups = fullDb.filter(x => x.so === item.so && x.id !== item.id);
            const dupSect = document.getElementById('dup-section');
            if(dups.length > 0) {
                dupSect.classList.remove('hidden');
                document.getElementById('dup-body').innerHTML = dups.map(d => `<tr><td class="p-4 opacity-50">${d.date}</td><td class="uppercase">${d.status}</td><td>${d.owner}</td><td class="opacity-50 italic">${(d.notes || '').substring(0, 50)}...</td></tr>`).join('');
            } else { dupSect.classList.add('hidden'); }
            renderGallery();
        }

        function closeDetail() { selectedId = null; document.getElementById('detail-overlay').classList.add('hidden'); renderGallery(); }

        async function saveRecord(autoNext = false) {
            const item = fullDb.find(x => x.id === selectedId);
            const payload = { guid: item.guid, status: document.getElementById('m-status').value, owner: document.getElementById('m-owner').value, notes: document.getElementById('m-notes').value };
            Toastify({ text: "Pushing to Dataverse..." }).showToast();
            try {
                await fetch(SAVE_URL, { method: 'POST', body: JSON.stringify(payload) });
                item.status = payload.status; item.owner = payload.owner; item.notes = payload.notes;
                if (payload.status === 'Completed') confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                Toastify({ text: "Sync Successful", style: { background: "#10b981" } }).showToast();
                if (autoNext) {
                    const idx = filteredDb.findIndex(x => x.id === selectedId);
                    if (filteredDb[idx+1]) openDetail(filteredDb[idx+1].id);
                    else closeDetail();
                } else { renderView(); renderGallery(); }
            } catch(e) { Toastify({ text: "Reject Error", style: { background: "#ef4444" } }).showToast(); }
        }

        // --- EMAIL & DRILL DOWN LOGIC ---
        function openEmailModal() { 
            const item = fullDb.find(x => x.id === selectedId);
            document.getElementById('m-to').value = `${item.owner.toLowerCase().replace(' ', '.')}@wbmason.com`;
            document.getElementById('m-subject').value = `Logistics Alert: #${item.so}`;
            document.getElementById('m-body').innerHTML = `Hi,<br><br>Order <b>${item.so}</b>:<br><br>[Status: ${item.status}]<br><br>Thanks,<br>Logistics Engine`;
            document.getElementById('email-modal').style.display = 'flex'; 
        }
        function closeEmailModal() { document.getElementById('email-modal').style.display = 'none'; }
        
        async function sendGraphEmail() {
            const item = fullDb.find(x => x.id === selectedId);
            const btn = document.getElementById('send-btn');
            btn.innerText = "TRACKING..."; btn.disabled = true;
            try {
                const accounts = msalInstance.getAllAccounts();
                const token = await msalInstance.acquireTokenSilent({ scopes: ["Mail.Send", "https://wbmasonco.crm.dynamics.com/user_impersonation"], account: accounts[0] });
                const emailJson = { message: { subject: document.getElementById('m-subject').value, body: { contentType: "HTML", content: document.getElementById('m-body').innerHTML }, toRecipients: [{ emailAddress: { address: document.getElementById('m-to').value } }] } };
                await fetch("https://graph.microsoft.com/v1.0/me/sendMail", { method: 'POST', headers: { Authorization: `Bearer ${token.accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(emailJson) });
                
                // CORRECTED ODATA BINDING
                const dynActivity = { "subject": document.getElementById('m-subject').value, "description": document.getElementById('m-body').innerHTML, "regardingobjectid@odata.bind": `/cr714_logisticslog_2s(${item.guid})` };
                
                await fetch("https://wbmasonco.crm.dynamics.com/api/data/v9.0/emails", { method: 'POST', headers: { Authorization: `Bearer ${token.accessToken}`, "Content-Type": "application/json" }, body: JSON.stringify(dynActivity) });
                Toastify({ text: "Email Sent & Dynamics Tracked", style: { background: "#10b981" } }).showToast();
                closeEmailModal();
            } catch(e) { Toastify({ text: "Error", style: { background: "#ef4444" } }).showToast(); }
            finally { btn.innerText = "Send & Track"; btn.disabled = false; }
        }

        // --- STATS DRILL DOWN ---
        function drillDown(type) {
            if(type === 'urgent') filterUrgent = true;
            else if(type === 'all') { filterUrgent = false; document.getElementById('f-status').value = ''; }
            else if(type === 'pending') document.getElementById('f-status').value = 'Pending';
            applyFilters();
            switchView('list');
        }
        function drillDownRep(rep) {
            document.getElementById('global-search').value = rep;
            applyFilters();
            switchView('list');
        }

        // --- UTILS ---
        function applyFilters() { 
            const criteria = { search: document.getElementById('global-search').value, wh: document.getElementById('f-wh').value, status: document.getElementById('f-status').value, urgent: filterUrgent };
            worker.postMessage({ type: 'FILTER', payload: { db: fullDb, criteria } }); 
        }
        function clearFilters() { document.getElementById('global-search').value = ''; document.getElementById('f-wh').value = ''; document.getElementById('f-status').value = ''; filterUrgent = false; applyFilters(); }
        function debouncedFilter() { clearTimeout(window.fTimer); window.fTimer = setTimeout(applyFilters, 300); }
        function adjustFont(d) { const root = document.documentElement; let curr = parseInt(getComputedStyle(root).getPropertyValue('--base-font')); root.style.setProperty('--base-font', (curr + d) + 'px'); }
        function toggleTheme() { const t = document.body.getAttribute('data-theme') === 'light' ? 'midnight' : 'light'; document.body.setAttribute('data-theme', t); }
        function setFormLayout(l) { const f = document.getElementById('form-fields'); if (l === 'grid') f.className = 'form-grid space-y-10'; else if (l === 'compact') f.className = 'form-compact space-y-4'; else f.className = 'space-y-10'; }
        function exportExcel() { const ws = XLSX.utils.json_to_sheet(filteredDb); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Logistics"); XLSX.writeFile(wb, `LogiLeap_Export.xlsx`); }

        // --- MAP ---
        function initMap() { if (mapInstance) return; mapInstance = L.map('map-container').setView([39.8, -98.6], 4); L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mapInstance); markerGroup = L.layerGroup().addTo(mapInstance); }
        function updateMapMarkers(points) { if (!markerGroup) return; markerGroup.clearLayers(); points.forEach(p => { L.circleMarker([p.lat, p.lng], { radius: 10 + (p.count * 1.5), color: '#2dd4bf', fillOpacity: 0.6 }).bindPopup(`<b>${p.wh} Hub</b><br>${p.count} Active Units`).addTo(markerGroup); }); }
        function updateStats(data, whs) {
            document.getElementById('sc-total').innerText = data.length;
            document.getElementById('sc-urgent').innerText = data.filter(x => x.issue.match(/Crit|Urg/i)).length;
            document.getElementById('sc-active').innerText = data.filter(x => x.status !== 'Completed').length;
            const rate = data.length ? Math.round((data.filter(x => x.status === 'Completed').length / data.length) * 100) : 0;
            document.getElementById('sc-rate').innerText = rate + '%';
        }
    </script>
</body>
</html>
