async function loadChoiceMetadata(){
  if(state.choiceMetaLoaded)return;
  try{
    const base=`EntityDefinitions(LogicalName='cr714_employeeinformation1')/Attributes`;
    const [singleData,multiData]=await Promise.all([
      api(`${base}/Microsoft.Dynamics.CRM.PicklistAttributeMetadata?$select=LogicalName&$expand=OptionSet($select=Options)`),
      api(`${base}/Microsoft.Dynamics.CRM.MultiSelectPicklistAttributeMetadata?$select=LogicalName&$expand=OptionSet($select=Options)`)
    ]);
    const readOptions=attribute=>(attribute.OptionSet?.Options||[]).map(option=>({
      value:String(option.Value),
      label:option.Label?.UserLocalizedLabel?.Label||option.Label?.LocalizedLabels?.[0]?.Label||String(option.Value)
    }));
    (singleData.value||[]).forEach(attribute=>{
      const options=readOptions(attribute);
      if(attribute.LogicalName&&options.length)state.choiceMeta.set(attribute.LogicalName,options);
    });
    (multiData.value||[]).forEach(attribute=>{
      const options=readOptions(attribute);
      if(attribute.LogicalName&&options.length)state.multiChoiceMeta.set(attribute.LogicalName,options);
    });
    state.choiceMetaLoaded=true;
  }catch(e){
    console.warn('Choice metadata unavailable',e);
    state.choiceMetaLoaded=true;
    toast('Some Choice dropdown metadata could not be loaded.','error');
  }
}
function choiceOptions(key,required=false){

  return blank+options.map(option=>`<option value="${esc(option.value)}" ${String(current)===option.value?'selected':''}>${esc(option.label)}</option>`).join('');
}
function multiChoiceValues(key){
  const raw=state.selected?.[key];
  if(Array.isArray(raw))return new Set(raw.map(String));
  return new Set(String(raw??'').split(',').map(v=>v.trim()).filter(Boolean));

function multiChoiceOptions(key){

}

function wireRecord(){const content=document.querySelector('.content'),buttons=[...document.querySelectorAll('.tab')];buttons.forEach(b=>b.onclick=()=>{if(b.dataset.tab==='top')content.scrollTo({top:0,behavior:'smooth'});else document.querySelector(`#tab-${b.dataset.tab}`)?.scrollIntoView({behavior:'smooth',block:'start'})});if($('#edit-record'))$('#edit-record').onclick=()=>{state.mode='edit';renderRecord()};if($('#cancel-edit'))$('#cancel-edit').onclick=()=>{if(state.mode==='new'){state.selected=null;state.mode='view';renderRecord();renderList()}else{state.mode='view';renderRecord()}};if($('#save-record'))$('#save-record').onclick=saveRecord;if($('#term-record'))$('#term-record').onclick=termEmployee;if($('#delete-record'))$('#delete-record').onclick=deleteEmployee}
function collect(){const p={};document.querySelectorAll('[data-field]').forEach(el=>{let v=el.value.trim();const k=el.dataset.field;if(k===F.status)return;if(el.type==='date')p[k]=v?new Date(v+'T12:00:00').toISOString():null;else if(el.dataset.multiChoice==='true')p[k]=[...el.selectedOptions].map(o=>o.value).join(',')||null;else if(el.dataset.choice==='true')p[k]=v===''?null:Number(v);else p[k]=v||null});return p}
async function statusValue(label){const cached=state.choiceMeta.get(F.status)||[];const cachedHit=cached.find(o=>o.label===label);if(cachedHit)return Number(cachedHit.value);try{const data=await api(`EntityDefinitions(LogicalName='cr714_employeeinformation1')/Attributes(LogicalName='${F.status}')/Microsoft.Dynamics.CRM.PicklistAttributeMetadata?$select=LogicalName&$expand=OptionSet($select=Options)`);const opts=data.OptionSet?.Options||[];const hit=opts.find(o=>o.Label?.UserLocalizedLabel?.Label===label);return hit?.Value}catch(e){console.warn('Status metadata unavailable',e)}return label==='Active'?1:0}
async function saveRecord(){const p=collect();const name=p[F.name];if(!name){toast('Employee Name is required.','error');document.querySelector(`[data-field="${F.name}"]`)?.focus();return}p[F.status]=await statusValue(document.querySelector(`[data-field="${F.status}"]`).value);showLoader(state.mode==='new'?'Creating employee...':'Saving employee changes...');try{let id=state.selected?.[F.id];if(state.mode==='new'){const t=await token();const res=await fetch(`${CONFIG.dataverseUrl}/${CONFIG.entitySet}`,{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json',Accept:'application/json',Prefer:'return=representation'},body:JSON.stringify(p)});if(!res.ok){const j=await res.json();throw new Error(j.error?.message||res.statusText)}const created=await res.json();id=created[F.id]}else await api(`${CONFIG.entitySet}(${id})`,{method:'PATCH',body:JSON.stringify(p)});state.mode='view';toast('Employee record saved.','success');await loadEmployees(id)}catch(e){console.error(e);toast(`Save failed: ${e.message}`,'error')}finally{hideLoader()}}
function confirmAction(title,copy,okLabel){return new Promise(resolve=>{const m=$('#confirm-modal');$('#confirm-title').textContent=title;$('#confirm-copy').textContent=copy;$('#confirm-ok').textContent=okLabel;const close=v=>{m.classList.remove('open');$('#confirm-ok').onclick=null;$('#confirm-cancel').onclick=null;resolve(v)};$('#confirm-ok').onclick=()=>close(true);$('#confirm-cancel').onclick=()=>close(false);m.classList.add('open')})}
async function termEmployee(){if(!state.selected)return;const yes=await confirmAction('Terminate employee',`Mark ${formatted(state.selected,F.name)} inactive? You will enter and confirm the last day of employment before saving.`,'Continue');if(!yes)return;state.mode='edit';renderRecord();document.querySelector(`[data-field="${F.status}"]`).value='Inactive';const el=document.querySelector(`[data-field="${F.lastDay}"]`);if(!el.value)el.value=new Date().toISOString().slice(0,10);document.querySelector('[data-tab="reviews"]').click();el.focus();toast('Review the last day and click Save.','')}
async function deleteEmployee(){if(!state.selected)return;const id=state.selected[F.id],name=formatted(state.selected,F.name);const yes=await confirmAction('Permanently delete employee',`Delete ${name}? This cannot be undone. Termination is recommended instead of deletion for historical records.`,'Delete permanently');if(!yes)return;showLoader('Deleting employee record...');try{await api(`${CONFIG.entitySet}(${id})`,{method:'DELETE'});state.selected=null;state.mode='view';toast('Employee record deleted.','success');await loadEmployees()}catch(e){toast(`Delete failed: ${e.message}`,'error')}finally{hideLoader()}}
function newEmployee(){if(state.mode!=='view')return;state.mode='new';state.selected={[F.id]:null,[F.status]:1,[`${F.status}@OData.Community.Display.V1.FormattedValue`]:'Active',[F.start]:new Date().toISOString()};renderRecord();renderList()}
function populateManagers(){const vals=[...new Set(state.employees.flatMap(r=>[formatted(r,F.managerAssigned),formatted(r,F.manager),formatted(r,F.srManager)]).filter(Boolean))].sort();const cur=$('#manager-filter').value;$('#manager-filter').innerHTML='<option value="">All managers</option>'+vals.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('')}
function updateStats(){const active=state.employees.filter(r=>statusText(r)==='Active').length,inactive=state.employees.length-active;const due=state.employees.filter(r=>statusText(r)==='Active'&&(!r[F.review30]||!r[F.review90]||!r[F.annual])).length;$('#stat-total').textContent=state.employees.length;$('#stat-active').textContent=active;$('#stat-inactive').textContent=inactive;$('#stat-reviews').textContent=due}
async function init(){try{await msalInstance.handleRedirectPromise();state.account=msalInstance.getActiveAccount()||msalInstance.getAllAccounts()[0]||null;if(state.account){setUser();await loadEmployees()}else{$('#loader-copy').textContent='Sign in with your W.B. Mason Microsoft account';setTimeout(hideLoader,350)}}catch(e){console.error(e);toast(`Startup error: ${e.message}`,'error');hideLoader()}}
$('#login-btn').onclick=async()=>{if(state.account){await msalInstance.logoutPopup({account:state.account});location.reload()}else{try{showLoader('Opening Microsoft sign-in...');await signIn();await loadEmployees()}catch(e){toast(`Sign-in failed: ${e.message}`,'error');hideLoader()}}};$('#refresh-btn').onclick=()=>loadEmployees(state.selected?.[F.id]);$('#new-btn').onclick=newEmployee;$('#search').oninput=renderList;$('#status-filter').onchange=renderList;$('#manager-filter').onchange=renderList;$('#theme-btn').onclick=()=>{const dark=document.documentElement.dataset.theme==='midnight';document.documentElement.dataset.theme=dark?'light':'midnight';localStorage.setItem('employee-theme',document.documentElement.dataset.theme)};document.documentElement.dataset.theme=localStorage.getItem('employee-theme')||'midnight';initFilterBuilder();renderFilterPills();init();
</script>
