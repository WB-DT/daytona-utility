    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 80% 0,rgba(56,189,248,.08),transparent 28%),var(--bg);color:var(--text);overflow:hidden}

    .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 11px;border-radius:9px;font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:7px;justify-content:center}.btn:hover{border-color:var(--primary);transform:translateY(-1px)}.btn.primary{background:var(--primary);color:#03111d;border-color:var(--primary)}.btn.success{background:var(--success);color:#05230d;border-color:var(--success)}.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 60%,var(--line))}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:8px;min-height:0;flex:1}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-height:0;overflow:hidden}.sidebar{display:flex;flex-direction:column}.side-head{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px;background:var(--panel2)}
    .search{position:relative}.search i{position:absolute;left:11px;top:11px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:9px;padding:9px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}.search input{padding-left:33px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px}.filters select{font-size:11px;font-weight:750;padding:8px}
    .employee-list{padding:7px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:6px}.employee-card{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:11px;padding:10px;background:var(--panel);cursor:pointer;transition:.15s}.employee-card:hover{border-color:var(--primary);transform:translateX(2px)}.employee-card.selected{background:color-mix(in srgb,var(--primary) 13%,var(--panel));border-color:var(--primary)}.employee-card.role-sr-manager{border-left-color:#38bdf8}.employee-card.role-manager{border-left-color:#4ade80}.employee-card.role-supervisor{border-left-color:#facc15}.employee-card.role-gold-star{border-left-color:#d4a017}.card-top{display:flex;align-items:flex-start;gap:9px}.avatar{width:48px;height:48px;border-radius:10px;object-fit:cover;border:2px solid var(--line);background:var(--panel2)}.emp-main{min-width:0;flex:1}.emp-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.emp-role{font-size:10px;color:var(--cyan);font-weight:850;margin-top:2px}.emp-meta{font-size:10px;color:var(--muted);margin-top:5px;display:grid;gap:2px}.badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:900;border:1px solid currentColor}.active{color:var(--success)}.inactive{color:var(--danger)}
    .workspace{display:flex;flex-direction:column}.hero{padding:13px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 12%,var(--panel2)),var(--panel2));display:flex;align-items:center;gap:14px;min-height:92px}.hero-avatar{width:66px;height:66px;border-radius:15px;object-fit:cover;border:3px solid var(--primary);background:var(--panel)}.hero-info{min-width:0;flex:1}.hero-info h2{margin:0;font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero-sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.hero-actions{display:flex;gap:7px;align-self:flex-start}.mode-banner{padding:7px 14px;background:color-mix(in srgb,var(--warn) 13%,var(--panel));border-bottom:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));font-size:11px;font-weight:800;color:var(--warn)}
    .tabs{display:flex;padding:0 14px;background:var(--panel2);border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;color:var(--muted);padding:11px 13px;font-weight:850;font-size:11px;border-bottom:3px solid transparent}.tab.active-tab{color:var(--primary);border-bottom-color:var(--primary)}.content{overflow:auto;padding:14px;min-height:0}.tab-page{display:none}.tab-page.active-page{display:block}.section{border:1px solid var(--line);border-radius:12px;margin-bottom:11px;overflow:hidden}.section-title{padding:9px 12px;background:var(--panel2);font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);display:flex;align-items:center;gap:7px}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(135px,1fr));gap:10px;padding:12px}.field{min-width:0}.field.span2{grid-column:span 2}.field.span4{grid-column:1/-1}.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:900;margin-bottom:4px}.field input,.field select,.field textarea{font-size:12px;min-height:36px}.field textarea{min-height:90px;resize:vertical}.field input:disabled,.field select:disabled,.field textarea:disabled{border-color:transparent;background:transparent;padding-left:0;opacity:1;color:var(--text);font-weight:700}.required label:after{content:" *";color:var(--danger)}.review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}.review-card{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.review-card.overdue{border-color:var(--danger)}.review-card.pending{border-color:var(--warn)}.review-card.done{border-color:var(--success)}.review-card h4{margin:0 0 8px;font-size:12px}.empty-state{height:100%;min-height:400px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty-state i{font-size:50px;color:var(--primary);opacity:.65}.empty-state h2{color:var(--text);margin:10px 0 4px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9000;padding:20px}.modal.open{display:flex}.modal-box{width:min(520px,95vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 25px 60px rgba(0,0,0,.5);padding:20px}.modal-box h3{margin:0 0 8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:10000;display:grid;gap:8px}.toast{width:min(380px,90vw);padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--primary);box-shadow:var(--shadow);font-size:12px}.toast.error{border-left-color:var(--danger)}.toast.success{border-left-color:var(--success)}
    @media(max-width:980px){body{overflow:auto}.shell{height:auto;min-height:100%}.grid{grid-template-columns:1fr}.sidebar{height:430px}.workspace{min-height:700px}.topbar{flex-wrap:wrap}.top-stats{order:3;width:100%}.form-grid{grid-template-columns:repeat(2,1fr)}.review-grid{grid-template-columns:1fr}}
    @media(max-width:560px){.form-grid{grid-template-columns:1fr}.field.span2,.field.span4{grid-column:auto}.hero{align-items:flex-start}.hero-actions{flex-direction:column}.top-stats{overflow:auto}.top-actions{flex-wrap:wrap}.brand{min-width:0}}
  </style>
</head>
<body>
<div id="loader"><div class="loader-card"><div class="loader-icon"><i class="fa-solid fa-people-roof"></i></div><div class="loader-title">Employee Data Hub</div><div id="loader-copy" class="loader-copy">Connecting securely to Microsoft 365...</div></div></div>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="brand-icon"><i class="fa-solid fa-id-card-clip"></i></div><div><h1>Employee Data Hub</h1><small>Inside Sales Employee Information</small></div></div>
    <div class="top-stats"><div class="stat"><b id="stat-total">0</b><span>Total</span></div><div class="stat"><b id="stat-active" class="active">0</b><span>Active</span></div><div class="stat"><b id="stat-inactive" class="inactive">0</b><span>Inactive</span></div><div class="stat"><b id="stat-reviews">0</b><span>Reviews Due</span></div></div>
    <div class="top-actions"><div class="user-chip"><span class="status-dot"></span><b id="user-name">Not signed in</b><span id="user-email" class="muted">Microsoft 365</span></div><button class="btn" id="theme-btn" title="Toggle theme"><i class="fa-solid fa-moon"></i></button><button class="btn" id="refresh-btn"><i class="fa-solid fa-rotate"></i> Refresh</button><button class="btn" id="login-btn"><i class="fa-brands fa-microsoft"></i> Sign in</button></div>
  </header>
  <main class="grid">
    <aside class="panel sidebar">
      <div class="side-head"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Name, manager, phone, department..." /></div><div class="filters"><select id="status-filter"><option value="Active">Active employees</option><option value="Inactive">Inactive employees</option><option value="All">All statuses</option></select><select id="manager-filter"><option value="">All managers</option></select></div><button class="btn primary" id="new-btn"><i class="fa-solid fa-user-plus"></i> New Employee</button></div>
      <div id="employee-list" class="employee-list"></div>
    </aside>
    <section class="panel workspace" id="workspace"><div id="empty" class="empty-state"><div><i class="fa-solid fa-address-card"></i><h2>Select an employee</h2><p>Choose a record from the employee list to view details.</p></div></div><div id="record" class="hidden"></div></section>
  </main>
</div>
<div id="confirm-modal" class="modal"><div class="modal-box"><h3 id="confirm-title">Confirm action</h3><p id="confirm-copy" class="muted"></p><div class="modal-actions"><button class="btn" id="confirm-cancel">Cancel</button><button class="btn danger" id="confirm-ok">Confirm</button></div></div></div>
<div id="toast-wrap" class="toast-wrap"></div>
<script>
const CONFIG=Object.freeze({
  dataverseUrl:"https://org23279050.crm.dynamics.com/api/data/v9.2",
  graphUrl:"https://graph.microsoft.com/v1.0",
  entitySet:"cr714_employeeinformation1s",
  primaryKey:"cr714_employeeinformation1id",
  tenantId:"9a7c474b-f702-4ae4-a2f9-b72a1e117401",
  clientId:"afe649b6-9c70-4b1a-8592-78588284c8ee",
  redirectUri:"https://WB-DT.github.io/daytona-utility/",
  photoBase:"https://wbmasonco.sharepoint.com/sites/InsideSales/Shared%20Documents/Employee%20photos/"
});
const F={id:"cr714_employeeinformation1id",name:"cr714_employeename",title:"cr714_title",status:"cr714_status",department:"cr714_department",location:"cr714_location",start:"cr714_startdate",lastDay:"cr714_lastdayofemployment",manager:"cr714_managers",managerAssigned:"cr714_managerassigned",srManager:"cr714_srmanager",supervisors:"cr714_supervisors",goldStars:"cr714_goldstars",shift:"cr714_shiftselection",breakSel:"cr714_breakselection",specialNotes:"cr714_specialnotes",backupCsr:"cr714_backupcsr",city:"cr714_cityofresidence",personalPhone:"cr714_personalphonenumber",group:"cr714_group",jobTitle:"cr714_jobtitle",parent:"cr714_parent",shirtSize:"cr714_shirtsize",specialty:"cr714_specialty",csr:"cr714_csr",email:"cr714_emailaddress",employee:"cr714_employee",repName:"cr714_repname",empower:"cr714_empowerlogin",salesNumber:"cr714_salesnumber",phoneExt:"cr714_phoneextension",loop:"cr714_loopnumber",birthday:"cr714_upcomingbirthday",review30:"cr714__30dayreview",review90:"cr714__90dayreview",annual:"cr714_annualreview",delivery30:"cr714_thirtydeliverydate",delivery90:"cr714_ninetydeliverydate",annualDelivery:"cr714_annualreviewdeliverydate",promotion:"cr714_promotiondate",afterPromotion30:"cr714__30afterpromotion",afterPromotion90:"cr714__90afterpromotion",probationEnd:"cr714_probationaryperiodenddate",lastAnnual:"cr714_lastannualreview",roleSr:"cr714_srmanagerflag",roleMgr:"cr714_managerflag",roleGold:"cr714_goldstarflag"};
const SELECT=[...new Set(Object.values(F))].join(',');
const msalConfig={auth:{clientId:CONFIG.clientId,authority:`https://login.microsoftonline.com/${CONFIG.tenantId}`,redirectUri:CONFIG.redirectUri},cache:{cacheLocation:"localStorage",storeAuthStateInCookie:false}};
const msalInstance=new msal.PublicClientApplication(msalConfig);
let state={account:null,employees:[],selected:null,mode:'view',busy:false,metadata:null};
const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const formatted=(r,k)=>r?.[`${k}@OData.Community.Display.V1.FormattedValue`] ?? r?.[k] ?? '';
const statusText=r=>String(formatted(r,F.status)||'').toLowerCase().includes('inactive')||String(r?.[F.status])==='0'?'Inactive':'Active';
const photo=r=>CONFIG.photoBase+encodeURIComponent(r?.[F.name]||'')+'.jpg';
function toast(msg,type=''){const e=document.createElement('div');e.className=`toast ${type}`;e.textContent=msg;$('#toast-wrap').append(e);setTimeout(()=>e.remove(),4500)}
function showLoader(copy='Working...'){state.busy=true;$('#loader-copy').textContent=copy;$('#loader').style.display='flex'} function hideLoader(){state.busy=false;$('#loader').style.display='none'}
async function signIn(){const req={scopes:[`${CONFIG.dataverseUrl.split('/api/')[0]}/user_impersonation`,'User.Read'],prompt:'select_account'};const res=await msalInstance.loginPopup(req);state.account=res.account;msalInstance.setActiveAccount(state.account);setUser();return state.account}
async function token(){let a=state.account||msalInstance.getActiveAccount()||msalInstance.getAllAccounts()[0];if(!a)a=await signIn();state.account=a;try{return(await msalInstance.acquireTokenSilent({account:a,scopes:[`${CONFIG.dataverseUrl.split('/api/')[0]}/user_impersonation`]})).accessToken}catch(e){return(await msalInstance.acquireTokenPopup({account:a,scopes:[`${CONFIG.dataverseUrl.split('/api/')[0]}/user_impersonation`]})).accessToken}}
async function api(path,options={}){const t=await token();const res=await fetch(`${CONFIG.dataverseUrl}/${path}`,{...options,headers:{Authorization:`Bearer ${t}`,Accept:'application/json','Content-Type':'application/json','OData-MaxVersion':'4.0','OData-Version':'4.0',Prefer:'odata.include-annotations="OData.Community.Display.V1.FormattedValue"',...(options.headers||{})}});if(!res.ok){let m=`${res.status} ${res.statusText}`;try{const x=await res.json();m=x.error?.message||m}catch{}throw new Error(m)}if(res.status===204)return null;return res.json()}
function setUser(){const a=state.account||msalInstance.getAllAccounts()[0];if(!a)return;state.account=a;msalInstance.setActiveAccount(a);$('#user-name').textContent=a.name||'Microsoft 365 User';$('#user-email').textContent=a.username||'';$('#login-btn').innerHTML='<i class="fa-solid fa-right-from-bracket"></i> Sign out'}
async function loadEmployees(keepId){showLoader('Loading employee records...');try{const q=`${CONFIG.entitySet}?$select=${SELECT}&$orderby=${F.name} asc`;const data=await api(q);state.employees=data.value||[];populateManagers();renderList();updateStats();if(keepId){state.selected=state.employees.find(x=>x[F.id]===keepId)||null;if(state.selected)renderRecord()}else if(state.selected){state.selected=state.employees.find(x=>x[F.id]===state.selected[F.id])||null;if(state.selected)renderRecord()}toast(`Loaded ${state.employees.length} employees`,'success')}catch(e){console.error(e);toast(`Could not load employees: ${e.message}`,'error')}finally{hideLoader()}}
function filtered(){const q=$('#search').value.trim().toLowerCase(),s=$('#status-filter').value,m=$('#manager-filter').value;return state.employees.filter(r=>{const hay=[F.name,F.managerAssigned,F.manager,F.srManager,F.supervisors,F.department,F.personalPhone,F.phoneExt,F.loop].map(k=>formatted(r,k)).join(' ').toLowerCase();return(!q||hay.includes(q))&&(s==='All'||statusText(r)===s)&&(!m||[formatted(r,F.managerAssigned),formatted(r,F.manager),formatted(r,F.srManager)].join(' | ').includes(m))})}
function roleClass(r){const t=String(formatted(r,F.title)).toLowerCase();if(t.includes('sr manager'))return'role-sr-manager';if(t==='manager'||t.includes('manager'))return'role-manager';if(t.includes('supervisor'))return'role-supervisor';if(t.includes('gold star'))return'role-gold-star';return''}
function renderList(){const rows=filtered();$('#employee-list').innerHTML=rows.length?rows.map(r=>`<article class="employee-card ${roleClass(r)} ${state.selected?.[F.id]===r[F.id]?'selected':''}" data-id="${r[F.id]}"><div class="card-top"><img class="avatar" src="${photo(r)}" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2296%22 height=%2296%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23334155%22/%3E%3Ctext x=%2250%25%22 y=%2257%25%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22%23cbd5e1%22%3E%3F%3C/text%3E%3C/svg%3E'"/><div class="emp-main"><div class="emp-name">${esc(formatted(r,F.name)||'Unnamed employee')}</div><div class="emp-role">${esc(formatted(r,F.title)||formatted(r,F.jobTitle)||'Employee')}</div><div class="emp-meta"><span><i class="fa-solid fa-user-tie"></i> ${esc(formatted(r,F.managerAssigned)||formatted(r,F.manager)||'No manager')}</span><span><i class="fa-solid fa-building"></i> ${esc(formatted(r,F.department)||'No department')}</span></div></div><span class="badge ${statusText(r).toLowerCase()}">${statusText(r)}</span></div></article>`).join(''):`<div class="empty-state"><div><i class="fa-solid fa-filter-circle-xmark"></i><h2>No matches</h2><p>Try changing your search or filters.</p></div></div>`;document.querySelectorAll('.employee-card').forEach(e=>e.onclick=()=>selectEmployee(e.dataset.id))}
function selectEmployee(id){if(state.mode!=='view'&&!confirm('Discard unsaved changes?'))return;state.mode='view';state.selected=state.employees.find(x=>x[F.id]===id);renderList();renderRecord()}
function d(v){if(!v)return'';const x=new Date(v);return isNaN(x)?'':x.toISOString().slice(0,10)}
function yearsSince(v){if(!v)return'Not available';const a=new Date(v),b=new Date();let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),day=b.getDate()-a.getDate();if(day<0){m--;day+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}return`${y} Years, ${m} Months, ${day} Days`}
const field=(label,key,type='text',span='',required=false,opts='')=>`<div class="field ${span} ${required?'required':''}"><label>${label}</label>${type==='textarea'?`<textarea data-field="${key}" ${state.mode==='view'?'disabled':''}>${esc(formatted(state.selected,key))}</textarea>`:type==='select'?`<select data-field="${key}" ${state.mode==='view'?'disabled':''}>${opts}</select>`:`<input type="${type}" data-field="${key}" value="${esc(type==='date'?d(state.selected?.[key]):formatted(state.selected,key))}" ${state.mode==='view'?'disabled':''}/>`}</div>`;
function reviewCard(label,key){const val=state.selected?.[key],start=state.selected?.[F.start];let cls=val?'done':'pending';if(!val&&start){const due=new Date(start);due.setDate(due.getDate()+(key===F.review30?30:key===F.review90?90:365));if(due<new Date())cls='overdue'}return`<div class="review-card ${cls}"><h4>${label}</h4><input type="date" data-field="${key}" value="${d(val)}" ${state.mode==='view'?'disabled':''}/><small class="muted">${val?'Completed / scheduled':'Missing review date'}</small></div>`}
function renderRecord(){const r=state.selected;if(!r){$('#empty').classList.remove('hidden');$('#record').classList.add('hidden');return}$('#empty').classList.add('hidden');$('#record').classList.remove('hidden');const editing=state.mode!=='view';$('#record').innerHTML=`<div class="hero"><img class="hero-avatar" src="${photo(r)}" onerror="this.style.display='none'"/><div class="hero-info"><h2>${esc(formatted(r,F.name)||'New Employee')}</h2><div class="hero-sub"><span class="badge ${statusText(r).toLowerCase()}">${statusText(r)}</span><span class="badge" style="color:var(--cyan)">${esc(formatted(r,F.title)||'No title')}</span><span class="badge" style="color:var(--muted)">${esc(formatted(r,F.location)||'No location')}</span><span class="badge" style="color:var(--muted)">${esc(yearsSince(r[F.start]))}</span></div></div><div class="hero-actions">${editing?`<button class="btn" id="cancel-edit"><i class="fa-solid fa-xmark"></i> Cancel</button><button class="btn success" id="save-record"><i class="fa-solid fa-floppy-disk"></i> Save</button>`:`<button class="btn" id="edit-record"><i class="fa-solid fa-pen"></i> Edit</button><button class="btn danger" id="term-record"><i class="fa-solid fa-user-slash"></i> Term</button><button class="btn danger" id="delete-record" title="Delete record"><i class="fa-solid fa-trash"></i></button>`}</div></div>${editing?`<div class="mode-banner"><i class="fa-solid fa-triangle-exclamation"></i> ${state.mode==='new'?'Creating a new employee':'Editing employee data'}. Required fields must be completed before saving.</div>`:''}<nav class="tabs"><button class="tab active-tab" data-tab="profile">Profile</button><button class="tab" data-tab="organization">Organization</button><button class="tab" data-tab="reviews">Reviews & Dates</button><button class="tab" data-tab="notes">Notes & Other</button></nav><div class="content">
<div class="tab-page active-page" id="tab-profile"><div class="section"><div class="section-title"><i class="fa-solid fa-user"></i> Identity & Contact</div><div class="form-grid">${field('Employee Name',F.name,'text','span2',true)}${field('Status',F.status,'select','',true,`<option value="Active" ${statusText(r)==='Active'?'selected':''}>Active</option><option value="Inactive" ${statusText(r)==='Inactive'?'selected':''}>Inactive</option>`)}${field('Title',F.title)}${field('Job Title',F.jobTitle)}${field('Department',F.department)}${field('Location',F.location)}${field('Email Address',F.email,'email','span2')}${field('Personal Phone',F.personalPhone,'tel')}${field('Phone Extension',F.phoneExt)}${field('Loop Number',F.loop)}${field('City of Residence',F.city)}${field('Sales Number',F.salesNumber)}${field('Empower Login',F.empower)}</div></div><div class="section"><div class="section-title"><i class="fa-solid fa-clock"></i> Schedule</div><div class="form-grid">${field('Shift Selection',F.shift,'text','span2')}${field('Break Selection',F.breakSel,'text','span2')}${field('Start Date',F.start,'date','',true)}${field('Upcoming Birthday',F.birthday,'date')}</div></div></div>
<div class="tab-page" id="tab-organization"><div class="section"><div class="section-title"><i class="fa-solid fa-sitemap"></i> Reporting Structure</div><div class="form-grid">${field('SR Manager',F.srManager,'text','span2')}${field('Manager Assigned',F.managerAssigned,'text','span2')}${field('Supervisors',F.supervisors,'text','span2')}${field('Gold Star',F.goldStars,'text','span2')}${field('Backup CSR',F.backupCsr)}${field('CSR',F.csr)}${field('Group',F.group)}${field('Parent',F.parent)}</div></div><div class="section"><div class="section-title"><i class="fa-solid fa-award"></i> Classification</div><div class="form-grid">${field('Specialty',F.specialty,'text','span2')}${field('Shirt Size',F.shirtSize)}${field('Employee',F.employee)}${field('Rep Name',F.repName,'text','span2')}</div></div></div>
<div class="tab-page" id="tab-reviews"><div class="section"><div class="section-title"><i class="fa-solid fa-clipboard-check"></i> Review Tracking</div><div class="review-grid">${reviewCard('30 Day Review',F.review30)}${reviewCard('90 Day Review',F.review90)}${reviewCard('Annual Review',F.annual)}${reviewCard('30 Day Delivery',F.delivery30)}${reviewCard('90 Day Delivery',F.delivery90)}${reviewCard('Annual Review Delivery',F.annualDelivery)}</div></div><div class="section"><div class="section-title"><i class="fa-solid fa-arrow-trend-up"></i> Position & Promotion</div><div class="form-grid">${field('Promotion / Position Change Date',F.promotion,'date')}${field('30 Days After Promotion',F.afterPromotion30,'date')}${field('90 Days After Promotion',F.afterPromotion90,'date')}${field('Probationary Period End',F.probationEnd,'date')}${field('Last Annual Review',F.lastAnnual,'date')}${field('Last Day of Employment',F.lastDay,'date')}</div></div></div>
<div class="tab-page" id="tab-notes"><div class="section"><div class="section-title"><i class="fa-solid fa-note-sticky"></i> Special Notes</div><div class="form-grid">${field('Special Notes',F.specialNotes,'textarea','span4')}</div></div><div class="section"><div class="section-title"><i class="fa-solid fa-circle-info"></i> Record Data</div><div class="form-grid"><div class="field span2"><label>Record ID</label><input value="${esc(r[F.id]||'New record')}" disabled></div><div class="field span2"><label>Years in Service</label><input value="${esc(yearsSince(r[F.start]))}" disabled></div></div></div></div></div>`;
wireRecord();}
function wireRecord(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active-tab'));document.querySelectorAll('.tab-page').forEach(x=>x.classList.remove('active-page'));b.classList.add('active-tab');$(`#tab-${b.dataset.tab}`).classList.add('active-page')});if($('#edit-record'))$('#edit-record').onclick=()=>{state.mode='edit';renderRecord()};if($('#cancel-edit'))$('#cancel-edit').onclick=()=>{if(state.mode==='new'){state.selected=null;state.mode='view';renderRecord();renderList()}else{state.mode='view';renderRecord()}};if($('#save-record'))$('#save-record').onclick=saveRecord;if($('#term-record'))$('#term-record').onclick=termEmployee;if($('#delete-record'))$('#delete-record').onclick=deleteEmployee}
function collect(){const p={};document.querySelectorAll('[data-field]').forEach(el=>{let v=el.value.trim();const k=el.dataset.field;if(k===F.status)return; if(el.type==='date')p[k]=v?new Date(v+'T12:00:00').toISOString():null;else p[k]=v||null});return p}
async function statusValue(label){try{const data=await api(`EntityDefinitions(LogicalName='cr714_employeeinformation1')/Attributes(LogicalName='${F.status}')/Microsoft.Dynamics.CRM.PicklistAttributeMetadata?$select=LogicalName&$expand=OptionSet($select=Options)`);const opts=data.OptionSet?.Options||[];const hit=opts.find(o=>o.Label?.UserLocalizedLabel?.Label===label);return hit?.Value}catch(e){console.warn('Status metadata unavailable',e)}return label==='Active'?1:0}
async function saveRecord(){const p=collect();const name=p[F.name];if(!name){toast('Employee Name is required.','error');document.querySelector(`[data-field="${F.name}"]`)?.focus();return}p[F.status]=await statusValue(document.querySelector(`[data-field="${F.status}"]`).value);showLoader(state.mode==='new'?'Creating employee...':'Saving employee changes...');try{let id=state.selected?.[F.id];if(state.mode==='new'){const t=await token();const res=await fetch(`${CONFIG.dataverseUrl}/${CONFIG.entitySet}`,{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json',Accept:'application/json',Prefer:'return=representation'},body:JSON.stringify(p)});if(!res.ok){const j=await res.json();throw new Error(j.error?.message||res.statusText)}const created=await res.json();id=created[F.id]}else await api(`${CONFIG.entitySet}(${id})`,{method:'PATCH',body:JSON.stringify(p)});state.mode='view';toast('Employee record saved.','success');await loadEmployees(id)}catch(e){console.error(e);toast(`Save failed: ${e.message}`,'error')}finally{hideLoader()}}
function confirmAction(title,copy,okLabel){return new Promise(resolve=>{const m=$('#confirm-modal');$('#confirm-title').textContent=title;$('#confirm-copy').textContent=copy;$('#confirm-ok').textContent=okLabel;const close=v=>{m.classList.remove('open');$('#confirm-ok').onclick=null;$('#confirm-cancel').onclick=null;resolve(v)};$('#confirm-ok').onclick=()=>close(true);$('#confirm-cancel').onclick=()=>close(false);m.classList.add('open')})}
async function termEmployee(){if(!state.selected)return;const yes=await confirmAction('Terminate employee',`Mark ${formatted(state.selected,F.name)} inactive? You will enter and confirm the last day of employment before saving.`,'Continue');if(!yes)return;state.mode='edit';renderRecord();document.querySelector(`[data-field="${F.status}"]`).value='Inactive';const el=document.querySelector(`[data-field="${F.lastDay}"]`);if(!el.value)el.value=new Date().toISOString().slice(0,10);document.querySelector('[data-tab="reviews"]').click();el.focus();toast('Review the last day and click Save.','')}
async function deleteEmployee(){if(!state.selected)return;const id=state.selected[F.id],name=formatted(state.selected,F.name);const yes=await confirmAction('Permanently delete employee',`Delete ${name}? This cannot be undone. Termination is recommended instead of deletion for historical records.`,'Delete permanently');if(!yes)return;showLoader('Deleting employee record...');try{await api(`${CONFIG.entitySet}(${id})`,{method:'DELETE'});state.selected=null;state.mode='view';toast('Employee record deleted.','success');await loadEmployees()}catch(e){toast(`Delete failed: ${e.message}`,'error')}finally{hideLoader()}}
function newEmployee(){if(state.mode!=='view')return;state.mode='new';state.selected={[F.id]:null,[F.status]:1,[`${F.status}@OData.Community.Display.V1.FormattedValue`]:'Active',[F.start]:new Date().toISOString()};renderRecord();renderList()}
function populateManagers(){const vals=[...new Set(state.employees.flatMap(r=>[formatted(r,F.managerAssigned),formatted(r,F.manager),formatted(r,F.srManager)]).filter(Boolean))].sort();const cur=$('#manager-filter').value;$('#manager-filter').innerHTML='<option value="">All managers</option>'+vals.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('')}
function updateStats(){const active=state.employees.filter(r=>statusText(r)==='Active').length,inactive=state.employees.length-active;const due=state.employees.filter(r=>statusText(r)==='Active'&&(!r[F.review30]||!r[F.review90]||!r[F.annual])).length;$('#stat-total').textContent=state.employees.length;$('#stat-active').textContent=active;$('#stat-inactive').textContent=inactive;$('#stat-reviews').textContent=due}
async function init(){try{await msalInstance.handleRedirectPromise();state.account=msalInstance.getActiveAccount()||msalInstance.getAllAccounts()[0]||null;if(state.account){setUser();await loadEmployees()}else{$('#loader-copy').textContent='Sign in with your W.B. Mason Microsoft account';setTimeout(hideLoader,350)}}catch(e){console.error(e);toast(`Startup error: ${e.message}`,'error');hideLoader()}}
$('#login-btn').onclick=async()=>{if(state.account){await msalInstance.logoutPopup({account:state.account});location.reload()}else{try{showLoader('Opening Microsoft sign-in...');await signIn();await loadEmployees()}catch(e){toast(`Sign-in failed: ${e.message}`,'error');hideLoader()}}};$('#refresh-btn').onclick=()=>loadEmployees(state.selected?.[F.id]);$('#new-btn').onclick=newEmployee;$('#search').oninput=renderList;$('#status-filter').onchange=renderList;$('#manager-filter').onchange=renderList;$('#theme-btn').onclick=()=>{const dark=document.documentElement.dataset.theme==='midnight';document.documentElement.dataset.theme=dark?'light':'midnight';localStorage.setItem('employee-theme',document.documentElement.dataset.theme)};document.documentElement.dataset.theme=localStorage.getItem('employee-theme')||'midnight';init();
</script>
</body>
</html>
